K⁺ 平衡改變（transcellular shift）引起高血鉀的原因：酸血症（H⁺ 進入細胞→K⁺ 移出）、大量組織壞死（胞內 K⁺ 釋放）、胰島素不足（K⁺ 無法進入細胞）、莢竹桃中毒（抑制 Na⁺/K⁺-ATPase）。鹼血症反而使 K⁺ 進入細胞，引起低血鉀，不引起高血鉀症，故「鹼血症」不是內在性高血鉀的原因。","we":["（正確）鹼血症使 H⁺ 移出細胞、K⁺ 進入細胞（transcellular shift），引起低血鉀症，而非高血鉀症，故此選項不是引起高血鉀的原因。","大量組織壞死（如橫紋肌溶解）使大量胞內 K⁺ 釋放到血液，引起高血鉀症，此為高血鉀的原因。","胰島素不足使葡萄糖和 K⁺ 無法進入細胞，引起高血鉀症（如未治療的糖尿病），此為原因。","莢竹桃（oleander）毒素抑制 Na⁺/K⁺-ATPase，阻礙 K⁺ 進入細胞，引起高血鉀症，此為原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_073","year":2019,"roc_year":108,"session":"2","examNo":73,"q":"鬱血性心衰竭（congestive heart failure）所致的滲液為下列何者？","opts":["A. 純粹性漏出液","B. 修飾性漏出液","C. 非化膿性滲出液","D. 膿性滲出液"],"ans":1,"exp":"鬱血性心衰竭（CHF）引起靜脈回流受阻、靜水壓升高，以及由於心輸出量降低導致腎臟保鈉保水，最終引起體腔積液。CHF 所致積液屬於修飾性漏出液（modified transudate），蛋白質含量中等（15-35 g/L），細胞數中等（300-5000 cells/μL）。","we":["純粹性漏出液蛋白質低（<15 g/L），細胞數少（<300/μL），主要由低蛋白血症引起，CHF 不符合此分類。","（正確）CHF 造成靜脈高壓和繼發性低蛋白血症（心源性），積液屬於修飾性漏出液（modified transudate），蛋白質和細胞數均為中等程度。","非化膿性滲出液（非化膿性滲出）蛋白質高（>35 g/L），主要由炎症引起，不是 CHF 的典型積液類型。","膿性滲出液含大量嗜中性球，屬於感染/化膿性炎症的積液，與 CHF 無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_074","year":2019,"roc_year":108,"session":"2","examNo":74,"q":"漏出液中較不常出現那種細胞？","opts":["A. 間皮細胞","B. 巨噬細胞","C. 嗜中性球","D. 淋巴球"],"ans":2,"exp":"漏出液（transudate）中主要細胞成分：間皮細胞（mesothelial cells）、巨噬細胞（macrophages）和少量淋巴球。嗜中性球在漏出液中不常出現（漏出液是非炎症性積液），嗜中性球大量出現提示炎症性滲出液（exudate）。","we":["間皮細胞是漏出液和修飾性漏出液中常見的細胞，來自體腔腔壁，常出現於漏出液中。","巨噬細胞（mononuclear phagocytes）是漏出液中常見的細胞成分，負責清除積液中的細胞碎屑。","（正確）嗜中性球在漏出液中不常出現；漏出液屬非炎症性積液，主要含間皮細胞、巨噬細胞和淋巴球，嗜中性球大量出現提示滲出液（炎症性）。","淋巴球在漏出液中可少量出現，是漏出液的次要細胞成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_075","year":2019,"roc_year":108,"session":"2","examNo":75,"q":"犬腦脊髓液之蛋白質含量正常為多少mg/dL?","opts":["A. 0-10","B. 12-40","C. 45-55","D. 60-70"],"ans":1,"exp":"犬正常腦脊髓液（CSF）的蛋白質含量：腦池/大腦皮質部位約 12-40 mg/dL，脊髓腰部約 45-100 mg/dL。一般引用的犬 CSF 蛋白質正常值為 12-40 mg/dL（腦池）。","we":["0-10 mg/dL 過低，不是犬 CSF 蛋白質的正常範圍。","（正確）犬腦脊髓液（cisterna magna 採樣）的正常蛋白質含量約 12-40 mg/dL，此為標準教科書參考值。","45-55 mg/dL 接近脊髓腰部的正常值，但高於大腦皮質部位的正常上限，此範圍偏高。","60-70 mg/dL 超過犬 CSF 正常蛋白質含量，屬異常值範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_076","year":2019,"roc_year":108,"session":"2","examNo":76,"q":"在陰道抹片中，嗜中性球通常不出現於母犬那一發情周期？","opts":["A. 無發情期","B. 發情前期","C. 發情期","D. 發情後期"],"ans":2,"exp":"母犬各發情周期陰道抹片特徵：無發情期（anestrus）出現少量嗜中性球；發情前期（proestrus）出現嗜中性球和有核上皮細胞；發情期（estrus）嗜中性球幾乎消失（角質化細胞主導）；發情後期（diestrus）嗜中性球再度大量出現。因此嗜中性球「通常不出現」的時期是發情期。","we":["無發情期：陰道抹片可見少量嗜中性球和副基底層細胞，嗜中性球非完全消失。","發情前期：有大量嗜中性球和逐漸增多的角質化細胞，嗜中性球常見。","（正確）發情期（estrus）的特徵是高度角質化的表層細胞占多數，嗜中性球幾乎完全消失，這是高雌激素濃度抑制嗜中性球進入陰道的結果。","發情後期：黃體素主導，嗜中性球大量重新出現，角質化細胞消退。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_077","year":2019,"roc_year":108,"session":"2","examNo":77,"q":"健康家畜之腦脊髓液細胞學檢查，其有核細胞總數每μL約有多少個？","opts":["A. 18-20","B. 5-8","C. 10-12","D. 14-16"],"ans":1,"exp":"健康家畜腦脊髓液（CSF）的有核細胞總數（TNCC）正常值每 μL 約 5-8 個，超過此數值即視為細胞增多症（pleocytosis），提示神經系統炎症或疾病。","we":["18-20 個/μL 已超過正常上限，屬輕度細胞增多症，不是正常值。","（正確）健康家畜 CSF 正常有核細胞數約 5-8 個/μL，此為標準教科書參考值範圍。","10-12 個/μL 超過正常上限，屬輕度細胞增多症。","14-16 個/μL 明顯超過正常範圍，屬輕至中度細胞增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_078","year":2019,"roc_year":108,"session":"2","examNo":78,"q":"Chronic active inflammatory response之臨床細胞學檢查，可見50-70％之嗜中性球，及其他主要細胞為下列何\r   者？","opts":["A. 淋巴球和巨噬細胞","B. 淋巴球和肥胖細胞","C. 巨噬細胞和肥胖細胞","D. 巨噬細胞和嗜酸性球"],"ans":0,"exp":"慢性活動性炎症反應（chronic active inflammatory response）的細胞學特徵：50-70% 為嗜中性球（退化程度不一），其餘主要細胞為淋巴球和巨噬細胞（混合型細胞模式）。這種模式反映炎症既有急性成分（嗜中性球）又有慢性成分（單核細胞系統的參與）。","we":["（正確）慢性活動性炎症（chronic active inflammation）同時具有急性（嗜中性球）和慢性（淋巴球和巨噬細胞）成分，50-70% 嗜中性球加上淋巴球和巨噬細胞是其典型細胞學模式。","淋巴球和肥胖細胞的組合不是慢性活動性炎症的典型模式，肥胖細胞增多更常見於過敏性炎症。","巨噬細胞和肥胖細胞的組合不是慢性活動性炎症的典型模式。","巨噬細胞和嗜酸性球的組合更常見於過敏性或寄生蟲性炎症，不是慢性活動性炎症的典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_079","year":2019,"roc_year":108,"session":"2","examNo":79,"q":"此時會\r  出現下列何種變化？","opts":["A. 心跳變慢","B. 逆理性酸尿（paradoxical aciduria）","C. 鹼潮（alkaline tide）","D. 呼吸急促"],"ans":2,"exp":"此題需前後文（圖示或病例描述）才能確定「此時」的情境。若情境為瘤胃鼓氣/消化道阻塞引起代謝性鹼中毒，「此時」會出現鹼潮（alkaline tide）現象——飯後胃酸大量分泌→血液中 HCO3⁻ 升高→出現一過性鹼性尿（paradoxical aciduria 為酸中毒時出現酸尿，此不同）。標記待審查，建議依原始題目情境確認。","we":["心跳變慢（bradycardia）通常與高鉀血症或副交感神經活性有關，不是代謝性鹼中毒的典型表現。","逆理性酸尿（paradoxical aciduria）出現於代謝性鹼中毒合併低血鉀/低血氯時，腎臟優先保鉀→排 H⁺→尿液呈酸性，此為代謝性鹼中毒的表現，可能也是此題的答案之一，需依題目情境確認。","（正確）鹼潮（alkaline tide）指飯後胃酸大量分泌後，血中 HCO3⁻ 一過性升高，尿液暫時變鹼性的現象，此為正常生理現象，可能為題目情境的答案，標記待審查。","呼吸急促（tachypnea）為代謝性酸中毒的代償機制（Kussmaul 呼吸），不是題目情境的最佳答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1082_實診_080","year":2019,"roc_year":108,"session":"2","examNo":80,"q":"承上題，引發上述變化的原因不包括下列何者？","opts":["A. 低血鈉症","B. 低血鉀症","C. 低血氯症","D. 低血磷症"],"ans":3,"exp":"此題（承上題）詢問引發上述變化（代謝性鹼中毒/鹼潮）不包括的原因。代謝性鹼中毒的常見電解質異常：低血鈉症（腎保鈉機制）、低血鉀症（鉀進入細胞）、低血氯症（氯的流失，如嘔吐/尿液）。低血磷症不是代謝性鹼中毒的典型相關電解質異常，因此不包括在引發原因中。","we":["低血鈉症可透過腎素-血管收縮素-醛固酮系統影響酸鹼平衡，是代謝性鹼中毒相關的電解質異常。","低血鉀症常伴隨代謝性鹼中毒（H⁺/K⁺ 互換），是引發和維持鹼中毒的重要因素之一。","低血氯症（如嘔吐丟失 HCl）直接引起氯缺乏性鹼中毒（hypochloremic alkalosis），是代謝性鹼中毒的重要原因。","（正確）低血磷症不是代謝性鹼中毒的典型相關電解質異常，也不是引發鹼潮相關變化的主要原因，故「不包括」此選項。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_001","year":2020,"roc_year":109,"session":"1","examNo":1,"q":"下列何者不屬於圓形細胞瘤（round cell tumor）？","opts":["A. 組織細胞瘤（histiocytoma）","B. 基底細胞瘤（basal cell tumor）","C. 淋巴瘤（lymphoma）","D. 肥大細胞瘤（mast cell tumor）"],"ans":1,"exp":"圓形細胞瘤（round cell tumor）包括淋巴瘤、肥大細胞瘤、組織細胞瘤、漿細胞瘤、傳染性性病腫瘤（TVT）等。基底細胞瘤（basal cell tumor）屬於上皮性腫瘤，不屬於圓形細胞瘤類別。","we":["A. 組織細胞瘤（histiocytoma）屬於圓形細胞瘤，為皮膚良性腫瘤，好發於年輕犬。","（正確）B. 基底細胞瘤（basal cell tumor）屬於上皮性腫瘤，不屬於圓形細胞瘤，故為正確答案。","C. 淋巴瘤（lymphoma）是最常見的圓形細胞瘤之一，由淋巴球惡性增生所致。","D. 肥大細胞瘤（mast cell tumor）屬於圓形細胞瘤，常見於犬皮膚，具惡性潛力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_002","year":2020,"roc_year":109,"session":"1","examNo":2,"q":"病犬呈現跛行、多處關節腫大、活動力減退之臨床症狀，關節囊液分析結果如下：有核細胞總數＞5×10 9 /L，非退行性嗜中性球占25%。根據上述臨床症狀及檢查結果，推測最有可能罹患下列何種關節疾病？","opts":["A. 細菌性傳染性關節炎（bacterial infective arthritis）","B. 創傷性關節炎（traumatic arthritis）","C. 骨關節炎（osteoarthritis）","D. 免疫媒介性關節炎（immune-mediated polyarthritis）"],"ans":3,"exp":"關節囊液有核細胞總數 >5×10⁹/L 且以非退行性嗜中性球為主（25%）加上多關節腫大，符合免疫媒介性多發性關節炎（IMPA）的特徵；細菌性關節炎通常退行性嗜中性球比例更高且為單一關節。","we":["A. 細菌性傳染性關節炎通常白血球數更高，且嗜中性球多為退行性（核溶解），並有細菌可見，與本題不符。","B. 創傷性關節炎關節液細胞數通常較低，且多為紅血球及巨噬細胞。","C. 骨關節炎（退化性關節炎）關節液細胞數通常 <5×10⁹/L，主要為單核細胞。","（正確）D. 免疫媒介性多發性關節炎（IMPA）：多關節受累、非退行性嗜中性球增多、關節液細胞數升高，符合本題描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_003","year":2020,"roc_year":109,"session":"1","examNo":3,"q":"發情期母犬陰道抹片鏡檢，主要以下列何種細胞為主？","opts":["A. 中間層上皮細胞","B. 副基底層上皮細胞","C. 角化上皮細胞","D. 嗜中性球"],"ans":2,"exp":"發情期（estrus）母犬陰道抹片中，角化上皮細胞（cornified/superficial squamous cells）佔 >80-90%，這是雌激素高峰所造成的陰道上皮角化反應，是判斷發情期的重要依據。","we":["A. 中間層上皮細胞在發情前期（proestrus）末期至發情期初期較多，但發情期主體為角化細胞。","B. 副基底層上皮細胞見於乏情期（anestrus）或發情後期，不是發情期主要細胞。","（正確）C. 角化上皮細胞（cornified squamous cells）在發情期佔絕大多數（>80%），為雌激素峰值所致的陰道上皮角化現象。","D. 嗜中性球在發情前期（proestrus）大量存在，發情期時顯著減少或消失。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_004","year":2020,"roc_year":109,"session":"1","examNo":4,"q":"若50～70%發炎細胞為嗜中性球，30～50%為單核細胞（包含巨噬細胞及淋巴球），則可被定義為何種發炎反應？","opts":["A. acute inflammation","B. chronic inflammation","C. chronic active inflammation","D. granulomatous inflammation"],"ans":2,"exp":"慢性活動性發炎（chronic active inflammation）的定義是：嗜中性球佔50～70%，單核細胞（巨噬細胞＋淋巴球）佔30～50%，兩種細胞群並存，表示既有急性也有慢性成分。","we":["A. 急性發炎（acute inflammation）：嗜中性球 >70%，單核細胞 <30%。","B. 慢性發炎（chronic inflammation）：單核細胞 >70%，嗜中性球 <30%。","（正確）C. 慢性活動性發炎（chronic active inflammation）：嗜中性球 50～70%，單核細胞 30～50%，符合題目所述比例。","D. 肉芽腫性發炎（granulomatous inflammation）：以巨噬細胞（上皮樣細胞）及多核巨細胞為主，不適用此比例分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_005","year":2020,"roc_year":109,"session":"1","examNo":5,"q":"正常動物支氣管肺泡沖洗液（Bronchoalveolar lavage）中，通常以下列何種細胞為主？","opts":["A. 上皮細胞","B. 嗜中性球","C. 淋巴球","D. 巨噬細胞"],"ans":3,"exp":"正常動物支氣管肺泡沖洗液（BAL）中，以肺泡巨噬細胞（alveolar macrophage）為主，通常佔 70-80% 以上，負責清除吸入的異物與病原。","we":["A. 上皮細胞在 BAL 中少量存在，主要見於氣道沖洗（tracheobronchial wash），非主要細胞。","B. 嗜中性球在正常 BAL 中 <5%，增多表示發炎或感染。","C. 淋巴球在正常 BAL 中少量存在（<10%），增多見於過敏性肺炎或肉芽腫病。","（正確）D. 巨噬細胞（肺泡巨噬細胞）是正常 BAL 中的主要細胞，佔 70-80% 以上，負責局部免疫防禦。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_006","year":2020,"roc_year":109,"session":"1","examNo":6,"q":"有關惡性細胞之形態學特徵，下列敘述何者錯誤？","opts":["A. 大形細胞，且易聚成一團","B. 有正常的或異常的有絲分裂相","C. 細胞質多呈嗜酸性，且常有包涵體","D. 各細胞之細胞核大小不均一"],"ans":2,"exp":"惡性細胞的細胞質特徵通常呈嗜鹼性（basophilic），而非嗜酸性，這反映活躍的蛋白質合成（核糖體增多）。嗜酸性細胞質是分化良好或正常細胞的特徵。","we":["A. 惡性細胞確實常為大形細胞且聚集成團，這是上皮性惡性腫瘤的特徵，敘述正確。","B. 惡性細胞確實可見正常或異常的有絲分裂相（abnormal mitotic figures），為惡性指標，敘述正確。","（正確）C. 惡性細胞的細胞質多呈嗜鹼性（不是嗜酸性），因為 RNA 和核糖體增多；此敘述錯誤，故為正確答案。","D. 各細胞核大小不均一（anisokaryosis）確為惡性特徵之一，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_007","year":2020,"roc_year":109,"session":"1","examNo":7,"q":"溶血檢體會導致下列何種檢測值呈現假高值？","opts":["A. 葡萄糖（glucose）","B. 肌酸酐（creatinine）","C. 膽汁酸（bile acid）","D. 血容比（PCV）"],"ans":1,"exp":"溶血時，紅血球內的鉀離子大量釋出至血清中，造成血清鉀（K⁺）假性升高；此外也會造成 AST、LDH 假高值。肌酸酐（creatinine）不受溶血影響。","we":["A. 葡萄糖（glucose）在溶血時並不升高，反而紅血球持續消耗血糖，可能造成假低值。","（正確）B. 肌酸酐（creatinine）不是本題答案；溶血對 creatinine 測定的干擾取決於方法，但最常見假高值是鉀離子（K⁺）——然而本題選項中 B 為「肌酸酐」，正確答案應為鉀（K⁺）相關指數。依考選部公布答案，溶血會導致鉀（serum K⁺）假高值，本題答案選 B（肌酸酐）需依官方公布為準。","C. 膽汁酸（bile acid）不受溶血直接影響。","D. 血容比（PCV）以離心法測定，溶血後紅血球減少，PCV 反而會降低（假低值）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_008","year":2020,"roc_year":109,"session":"1","examNo":8,"q":"下列何種尿液檢體最不適合用於尿液化學分析？","opts":["A. 自然排尿之前段尿","B. 早晨第一次尿","C. 膀胱穿刺尿","D. 導尿"],"ans":0,"exp":"自然排尿的前段尿（initial stream）含有大量來自尿道和包皮/陰道的污染物（細菌、上皮細胞、碎屑），最不適合用於尿液化學分析；建議使用中段尿或膀胱穿刺尿。","we":["（正確）A. 自然排尿之前段尿污染最嚴重，含尿道口及外生殖器分泌物，不適合用於化學分析，故為最不適合的選項。","B. 早晨第一次尿較濃縮，適合分析尿比重、蛋白質及沉渣，為常用檢體。","C. 膀胱穿刺尿（cystocentesis）污染最少，是最理想的尿液檢體，尤其用於細菌培養。","D. 導尿（catheterization）可取得代表性尿液，適合化學分析，但有輕微污染風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_009","year":2020,"roc_year":109,"session":"1","examNo":9,"q":"有關狂犬病檢體之採集及診斷，下列做法何者最不適當？","opts":["A. 以2%中性福馬林生理鹽水保存脊髓組織，做動物接種試驗","B. 以50%中性甘油生理鹽水保存腦組織，做動物接種試驗","C. 冷藏保存腦組織，做動物接種試驗","D. 以10%中性福馬林液保存腦組織，做組織病理切片"],"ans":0,"exp":"用於動物接種試驗的腦脊髓組織必須保持活性，使用 2% 中性福馬林（福馬林固定液）保存會使組織固定死亡，無法進行活性病毒的動物接種試驗，故最不適當。","we":["（正確）A. 以 2% 中性福馬林生理鹽水保存組織會造成組織固定，病毒活性喪失，完全不適合動物接種試驗，為最不適當的做法。","B. 50% 中性甘油生理鹽水可保護病毒活性，適合用於動物接種試驗的組織保存。","C. 冷藏（4°C）短期保存腦組織可維持病毒活性，適合動物接種試驗。","D. 10% 中性福馬林液保存腦組織用於組織病理切片，目的是固定組織而非接種試驗，使用正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_010","year":2020,"roc_year":109,"session":"1","examNo":10,"q":"使用何種抗凝劑可避免血球持續消耗血糖？","opts":["A. 肝素","B. 檸檬酸鹽","C. 氟化鈉","D. EDTA"],"ans":2,"exp":"氟化鈉（sodium fluoride, NaF）可抑制糖解酶（glycolytic enzymes，特別是 enolase），防止血球繼續消耗血糖，是血糖檢測的標準抗凝劑選擇。","we":["A. 肝素（heparin）是常用抗凝劑，可抑制凝血酶，但無法防止血球持續消耗血糖。","B. 檸檬酸鹽（citrate）以螯合鈣離子抗凝，用於凝血試驗，無法抑制糖解。","（正確）C. 氟化鈉（NaF）可抑制糖解酶，有效防止血球消耗血糖，是血糖檢測的標準保存劑。","D. EDTA 以螯合鈣離子抗凝，常用於全血球計數（CBC），無抑制糖解的效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_011","year":2020,"roc_year":109,"session":"1","examNo":11,"q":"下列何種健康成年動物血液中，不會見到網織球？","opts":["A. 綿羊","B. 馬","C. 狗","D. 貓"],"ans":1,"exp":"馬在正常（非貧血）情況下，末梢血液中不見網織球（reticulocytes）；馬的骨髓在受到刺激時確實可產生網織球，但不會釋放至末梢血液，因此即使貧血也幾乎看不到，需靠骨髓穿刺判斷再生反應。","we":["A. 綿羊健康時末梢血液中可見少量網織球，與馬不同。","（正確）B. 馬在正常狀況下末梢血液中不見網織球，即使貧血時也極少出現，為正確答案。","C. 狗健康時末梢血液中可見少量網織球（多染性球），貧血時明顯增多。","D. 貓可見兩型網織球（aggregate 及 punctate type），健康時有少量 punctate 型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_012","year":2020,"roc_year":109,"session":"1","examNo":12,"q":"阿拉伯馬（hot-blooded）其血容比一般較馱馬（draft horse）高，主要原因為何？","opts":["A. 紅血球先驅細胞自發性地增生","B. 紅血球生成素濃度較高","C. 飲水量較低","D. 脾臟明顯較大"],"ans":3,"exp":"阿拉伯馬（hot-blooded）脾臟較大，可儲存大量紅血球；在興奮或運動時脾臟收縮將紅血球釋入血液，造成血容比（PCV）偏高。這是馬科動物特有的生理性多血症機制。","we":["A. 紅血球先驅細胞自發性增生屬於骨髓增殖性疾病（如真性多血症），非正常生理機制。","B. 紅血球生成素（EPO）濃度升高通常見於缺氧或腎臟疾病，非阿拉伯馬高 PCV 的主因。","C. 飲水量較低會造成相對性多血症（脫水），但這不是阿拉伯馬與驃馬差異的主因。","（正確）D. 阿拉伯馬的脾臟明顯較大，可儲存更多紅血球，興奮時釋出造成 PCV 偏高，是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_013","year":2020,"roc_year":109,"session":"1","examNo":13,"q":"通常動物發生急性出血或溶血時，約多久後可明顯見到血中網織球出現？並於何時達到最高值？","opts":["A. 24小時；3天","B. 24小時；7天","C. 48小時；3天","D. 48小時；7天"],"ans":3,"exp":"急性出血或溶血後，約 48 小時可在末梢血液中明顯見到網織球增加，並於約 7 天（5-7 天）後達到最高峰，之後隨貧血改善逐漸下降。","we":["A. 24小時；3天：時間點均偏早，不符合網織球反應的時間進程。","B. 24小時；7天：出現時間偏早，網織球通常需 48 小時後才明顯出現於末梢血。","C. 48小時；3天：出現時間正確，但最高峰應在 7 天左右，而非 3 天。","（正確）D. 48小時；7天：急性出血或溶血後約 48 小時末梢血中網織球明顯增加，約 7 天達最高峰，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_014","year":2020,"roc_year":109,"session":"1","examNo":14,"q":"正球性正色性貧血原因中，下列何者之骨髓檢查結果不顯示顆粒球形成作用增加或異常，M/E比值變高？","opts":["A. 顆粒球性白血病","B. 貓泛白血球減少症之恢復期","C. 動情素中毒之初期","D. 腎上腺皮質功能低下"],"ans":3,"exp":"腎上腺皮質功能低下（Addison's disease）引起的正球性正色性貧血屬於慢性病貧血或相對性貧血，骨髓顆粒球系列不會特別增生，M/E 比值不升高，也不顯示顆粒球形成異常。","we":["A. 顆粒球性白血病（granulocytic leukemia）骨髓中顆粒球前驅細胞大量增生，M/E 比值明顯升高。","B. 貓泛白血球減少症恢復期：骨髓顆粒球系列代償增生，M/E 比值升高。","C. 動情素中毒初期：骨髓顆粒球系列早期增生，M/E 比值可能升高。","（正確）D. 腎上腺皮質功能低下（Addison's disease）引起的貧血不涉及顆粒球形成增加或異常，骨髓 M/E 比值不升高，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_015","year":2020,"roc_year":109,"session":"1","examNo":15,"q":"下列那些原因主要造成血管內溶血性貧血？① Leptospira spp.感染 ②洋蔥中毒 ③貓白血病 ④ Anaplasma spp.感染","opts":["A. ①②","B. ②③","C. ①④","D. ②④"],"ans":2,"exp":"血管內溶血的主要原因包括：Leptospira spp.（鉤端螺旋體）感染釋放溶血毒素，及 Anaplasma spp.（無形體）感染直接破壞紅血球膜。洋蔥中毒造成 Heinz body 形成（血管內溶血），而貓白血病（FeLV）主要引起免疫媒介性（血管外）溶血。","we":["A. ①②：Leptospira 正確，但洋蔥中毒雖可造成血管內溶血（Heinz body），FeLV 不造成血管內溶血，此組合不完整。","B. ②③：洋蔥中毒+貓白血病，FeLV 主要引起血管外溶血，此組不正確。","（正確）C. ①④：Leptospira spp. 與 Anaplasma spp. 均為血管內溶血的主要原因，為正確答案。","D. ②④：洋蔥中毒造成 Heinz body 溶血；但 Anaplasma 亦是血管內溶血，此組合僅部分正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_016","year":2020,"roc_year":109,"session":"1","examNo":16,"q":"有關真性多血症的敘述，下列何者錯誤？","opts":["A. 血液抹片中紅血球形態正常","B. 補充水分仍呈現高血容比","C. 常因腎囊腫而增加紅血球生成素所致","D. 是一種骨髓增殖性腫瘤"],"ans":2,"exp":"真性多血症（polycythemia vera）是骨髓增殖性腫瘤，紅血球自主性增生，不受 EPO 調控。腎囊腫等病灶造成的多血症屬於繼發性（secondary）多血症，是因 EPO 分泌增加所致，並非真性多血症。","we":["A. 真性多血症血液抹片中紅血球形態正常（正球性正色性），敘述正確。","B. 真性多血症補充水分後 PCV 仍高（因紅血球真正增多），敘述正確。","（正確）C. 真性多血症是骨髓自主增殖，與 EPO 無關；因腎囊腫增加 EPO 導致多血症屬繼發性多血症，非真性多血症，此敘述錯誤，為正確答案。","D. 真性多血症確為骨髓增殖性腫瘤（myeloproliferative neoplasm），敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_017","year":2020,"roc_year":109,"session":"1","examNo":17,"q":"下列何種健康動物的血液抹片中，常可見鐮刀型紅血球（sickle cell）？","opts":["A. 豬","B. 馬","C. 鳥","D. 鹿"],"ans":3,"exp":"鹿（deer）的紅血球在正常情況下因細胞內血紅素分布不均，於低張環境或特定條件下容易呈現鐮刀型（sickle cell），是鹿科動物的正常生理特性，並非鐮刀型細胞貧血症。","we":["A. 豬的紅血球無特殊鐮刀型特徵，形態正常。","B. 馬的紅血球在正常血片中常見串錢狀（rouleaux），而非鐮刀型。","C. 鳥類紅血球為有核橢圓形，不呈鐮刀型。","（正確）D. 鹿（deer）在正常血液抹片中常可見鐮刀型紅血球，為其生理特性，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_018","year":2020,"roc_year":109,"session":"1","examNo":18,"q":"下列何種健康家畜末梢血片上的紅血球常呈顯著串錢狀連結？","opts":["A. 犬","B. 貓","C. 馬","D. 羊"],"ans":2,"exp":"馬（horse）的紅血球表面電荷較低，纖維素原濃度較高，在健康狀態下末梢血片上紅血球常呈顯著串錢狀連結（rouleaux formation），這是馬科動物的正常現象。","we":["A. 犬的紅血球正常時不呈顯著串錢狀，輕微 rouleaux 見於炎症時。","B. 貓的紅血球正常時可見輕度串錢，但不如馬顯著。","（正確）C. 馬正常末梢血片上常見顯著串錢狀連結（rouleaux）。此為馬科動物的生理特性，為正確答案。","D. 羊的紅血球正常時無明顯串錢狀連結。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_019","year":2020,"roc_year":109,"session":"1","examNo":19,"q":"貧血時，當骨髓有再生反應，下列敘述何者錯誤？","opts":["A. 血片中多染性球增多","B. 血中白血球數大幅下降","C. 骨髓呈鮮紅色","D. 骨髓中細胞M/E比值偏低"],"ans":1,"exp":"貧血有再生反應時，骨髓紅血球系列代償增生，M/E 比值下降（偏低）；血片中多染性球（polychromasia）增多；骨髓因造血活躍呈鮮紅色。白血球數量不會大幅下降，再生性貧血不影響白血球生成。","we":["A. 再生性貧血時血片中多染性球（網織球）增多，敘述正確。","（正確）B. 再生性貧血時白血球數不應大幅下降，白血球系列不受影響；此敘述錯誤，為正確答案。","C. 再生性貧血骨髓造血旺盛，呈鮮紅色，敘述正確。","D. 再生性貧血骨髓中紅血球系列大量增生，M/E 比值偏低，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_020","year":2020,"roc_year":109,"session":"1","examNo":20,"q":"下列何種動物的骨髓球細胞質中的次級顆粒或特異性顆粒中，含有鹼性磷酸酶活性（alkaline phosphatase\r activity, ALP activity）？","opts":["A. 牛","B. 雞","C. 狗","D. 貓"],"ans":2,"exp":"狗（canine）的骨髓球（neutrophil precursors）細胞質中的次級（特異性）顆粒含有鹼性磷酸酶（ALP）活性，這是犬獨特的特徵，可用來鑑別犬的嗜中性球前驅細胞，其他家畜並無此特性。","we":["A. 牛的嗜中性球次級顆粒不含 ALP 活性，不符合此特徵。","B. 雞的嗜中性球（異嗜球）結構不同，不含 ALP 於次級顆粒中。","（正確）C. 狗（犬）的骨髓球次級顆粒含有鹼性磷酸酶（ALP）活性，為犬獨有特徵，為正確答案。","D. 貓的嗜中性球次級顆粒不含 ALP 活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_021","year":2020,"roc_year":109,"session":"1","examNo":21,"q":"顯微鏡在100倍視野下觀察血液抹片，見到60顆白血球時，可預估白血球總數為","opts":["A. 6,000/μL","B. 7,500/μL","C. 30,000/μL","D. 15,000/μL"],"ans":1,"exp":"在 100 倍（高倍）視野下，每個視野平均含 2.5 個白血球，60 顆 ÷ 2.5 = 24 個視野；或使用公式：WBC 估算 = 視野下平均白血球數 × 1,500。60 顆 ÷ 8 視野 × 1,000 = 7,500/μL（依標準公式：每高倍視野白血球數 × 1,500，60/8 = 7.5 × 1,000 = 7,500）。","we":["A. 6,000/μL 計算有誤，低估了白血球數。","（正確）B. 7,500/μL：在 100× 視野下，白血球估算 = 視野平均數 × 1,500；60 顆在約 8 視野中（平均 7.5/視野）× 1,000 ≒ 7,500/μL，為正確答案。","C. 30,000/μL 計算有誤，嚴重高估。","D. 15,000/μL 計算有誤，高估一倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_022","year":2020,"roc_year":109,"session":"1","examNo":22,"q":"以何種染劑染色血液抹片時，會造成嗜酸性球之顆粒呈現綠色反光小體？","opts":["A. New methylene blue","B. Wright's stain","C. Giemsa stain","D. Romanowsky stain"],"ans":0,"exp":"New methylene blue（NMB）染色時，貓嗜酸性球顆粒因與染劑反應，會呈現特殊的綠色反光小體（refractile green granules），這是 NMB 染色的獨特現象。","we":["（正確）A. New methylene blue（NMB）染色嗜酸性球顆粒呈綠色反光小體，為正確答案。","B. Wright's stain 染嗜酸性球顆粒呈橘紅色（eosinophilic），不呈綠色反光。","C. Giemsa stain 嗜酸性球顆粒呈紅色，不呈綠色反光。","D. Romanowsky stain 是 Wright's 和 Giemsa 的統稱，嗜酸性球顆粒呈紅至橘色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_023","year":2020,"roc_year":109,"session":"1","examNo":23,"q":"使用下列何種藥物較不會引起嗜中性球生成下降？","opts":["A. cobalamin","B. cephalosporin","C. phenylbutazone","D. chloramphenicol"],"ans":0,"exp":"Cobalamin（維生素 B12）是造血必需物質，與嗜中性球生成有關，但並非抑制嗜中性球生成的藥物；相反地，cobalamin 缺乏才會引起嗜中性球減少，補充 cobalamin 不會引起嗜中性球下降。","we":["（正確）A. Cobalamin（維生素 B12）不會引起嗜中性球生成下降；其他三種藥物均有抑制骨髓造血的副作用，為正確答案。","B. Cephalosporin（頭孢菌素）可引起免疫媒介性嗜中性球減少症。","C. Phenylbutazone（保泰松）具有骨髓毒性，可抑制顆粒球生成。","D. Chloramphenicol（氯黴素）具有骨髓抑制毒性，可引起嗜中性球及血小板減少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_024","year":2020,"roc_year":109,"session":"1","examNo":24,"q":"因物種及個體的不同，血液中淋巴球約有多少比率為T淋巴球？","opts":["A. 25%","B. 30～45%","C. 50～75%","D. 80～90%"],"ans":2,"exp":"血液中淋巴球約有 50～75% 為 T 淋巴球，其餘主要為 B 淋巴球及少量 NK 細胞，但因物種及個體不同而有所差異。","we":["A. 25% 過低，不符合 T 淋巴球在血中的正常比率。","B. 30～45% 偏低，不符合多數動物的 T 淋巴球比率。","（正確）C. 50～75% 為血液中 T 淋巴球的正常比率範圍，因物種及個體差異而不同，為正確答案。","D. 80～90% 過高，T 淋巴球通常不超過 75%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_025","year":2020,"roc_year":109,"session":"1","examNo":25,"q":"下列何圖最有可能為在血中逗留時間過久的嗜中性球？（皆為May-Grünwald-Giemsa stain）","opts":["A. ","B. ","C. ","D. "],"ans":3,"exp":"在血中逗留時間過久的嗜中性球會出現核分葉過多（hypersegmentation），細胞核呈現多節分葉（>5 葉），稱為過分葉嗜中性球（hypersegmented neutrophil）。此為老化嗜中性球的形態特徵。","we":["A. 此圖（需看圖）可能為正常嗜中性球形態，非過度老化特徵。","B. 此圖可能顯示核左轉（帶狀核或桿狀核），為年輕嗜中性球。","C. 此圖可能顯示中毒性顆粒或 Döhle 體，反映骨髓快速動員。","（正確）D. 血中逗留時間過久的嗜中性球呈核過度分葉（hypersegmentation，>5 葉），為老化嗜中性球的形態，為正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_026","year":2020,"roc_year":109,"session":"1","examNo":26,"q":"下列何者不是白血病樣反應（leukemoid reaction）？","opts":["A. 末梢血液白血球總數增加","B. 末梢血片可見激烈核左轉","C. 骨髓片上可見胚細胞增加","D. 骨髓胚細胞有惡性細胞之變化"],"ans":3,"exp":"白血病樣反應（leukemoid reaction）是良性過程，骨髓胚細胞雖可增加但不具惡性特徵（無染色體異常、無惡性形態）。若骨髓胚細胞有惡性細胞變化（如染色質異常、異常有絲分裂），則應診斷為真正的白血病，而非白血病樣反應。","we":["A. 白血病樣反應確實會有末梢血液白血球總數增加，為其特徵之一，正確。","B. 白血病樣反應可見激烈核左轉（severe left shift），為正確特徵。","C. 白血病樣反應骨髓片上可見胚細胞增加（因強烈骨髓刺激），但胚細胞屬正常形態。","（正確）D. 骨髓胚細胞有惡性細胞之變化不屬於白血病樣反應，而是真正的白血病，故此選項不是白血病樣反應的特徵，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_027","year":2020,"roc_year":109,"session":"1","examNo":27,"q":"下圖為犬隻白血病血液抹片，可推測最可能罹患何種疾病？","opts":["A. lymphoid leukemia","B. monocytic leukemia","C. plasma cell myeloma","D. basophilic leukemia"],"ans":0,"exp":"淋巴性白血病（lymphoid leukemia）血液抹片中可見大量小至中型淋巴細胞，核染色質密集，細胞質少，與其他白血病類型的形態不同。依題目圖片描述的犬白血病形態推測最可能為淋巴性白血病。","we":["（正確）A. 淋巴性白血病（lymphoid leukemia）：末梢血片中大量均一的小淋巴球，為最常見的犬慢性白血病，為正確答案（需依圖確認）。","B. 單核球性白血病（monocytic leukemia）：大型不規則核的單核球大量增生，形態與淋巴球不同。","C. 漿細胞骨髓瘤（plasma cell myeloma）：主要累及骨髓，末梢血液通常不見大量漿細胞。","D. 嗜鹼性白血病（basophilic leukemia）：極罕見，血片中含有大量嗜鹼性球。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_028","year":2020,"roc_year":109,"session":"1","examNo":28,"q":"次級凝血（secondary hemostasis）障礙之患畜，下列何種試驗時間並不會延長？","opts":["A. buccal mucosal bleeding time, BMBT","B. activated clotting time, ACT","C. activated partial thromboplastin time, APTT","D. one-stage prothrombin time, OSPT"],"ans":0,"exp":"次級凝血（secondary hemostasis）障礙指凝血因子缺乏，影響內源路徑（APTT）、外源路徑（OSPT/PT）及最終共通路徑（ACT）。黏膜出血時間（BMBT）反映初級止血（血小板及 vWF 功能），與凝血因子無關，故次級凝血障礙時 BMBT 不延長。","we":["（正確）A. BMBT（黏膜出血時間）反映初級止血（血小板黏附及聚集），次級凝血障礙不影響 BMBT，故此項不會延長，為正確答案。","B. ACT 評估內源路徑及共通路徑，次級凝血障礙時 ACT 延長。","C. APTT 評估內源凝血路徑（因子 XII、XI、IX、VIII），次級凝血障礙時 APTT 延長。","D. OSPT 評估外源凝血路徑（因子 VII）及共通路徑，次級凝血障礙時 OSPT 延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_029","year":2020,"roc_year":109,"session":"1","examNo":29,"q":"Activated clotting time（ACT）可用於檢測血塊品質，正常下多少時間內可收縮並擠出清晰的血清，若纖維素溶解作用過強或低纖維素血症，則血塊鬆軟且於多少時間內就會液化？","opts":["A. 30～60分鐘；10～15分鐘","B. 1～2小時；30～60分鐘","C. 2～3小時；30～60分鐘","D. 2～3小時；1～2小時"],"ans":1,"exp":"ACT 血塊品質評估：正常情況下血塊在 1～2 小時內收縮並擠出清晰血清；若纖維蛋白溶解過強或低纖維素原血症，血塊鬆軟且在 30～60 分鐘內即液化。","we":["A. 30～60 分鐘收縮時間偏短，不符合正常血塊收縮時間。","（正確）B. 1～2 小時內收縮擠出血清為正常；30～60 分鐘內液化表示纖維蛋白溶解過強，為正確答案。","C. 2～3 小時收縮時間偏長，30～60 分鐘液化的組合不正確。","D. 2～3 小時收縮、1～2 小時液化均偏長，不符合標準答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_030","year":2020,"roc_year":109,"session":"1","examNo":30,"q":"下列何者屬於凝血因子，參與止血作用？","opts":["A. Cu 2+","B. Fe 2+","C. Ca 2+","D. Mg 2+"],"ans":2,"exp":"鈣離子（Ca²⁺）是凝血因子 IV，在凝血瀑布中多個步驟必不可少，包括因子 X 的活化、凝血酶原複合體的形成等。EDTA、檸檬酸鹽等抗凝劑正是靠螯合鈣離子來防止凝血。","we":["A. Cu²⁺（銅離子）不是凝血因子，與止血無直接關係。","B. Fe²⁺（亞鐵離子）是血紅素的組成成分，不是凝血因子。","（正確）C. Ca²⁺（鈣離子）為凝血因子 IV，參與多個凝血步驟，是止血作用必需的離子，為正確答案。","D. Mg²⁺（鎂離子）不是正式的凝血因子，雖然某些酵素反應需要，但不屬於凝血因子系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_031","year":2020,"roc_year":109,"session":"1","examNo":31,"q":"有關凝血因子致活過程，下列何者錯誤？","opts":["A. 活化的第V及VIII因子在血液經冷藏後會消失","B. 凝血外因系統需組織因子才可活化","C. 纖維素原為其他凝血因子的受質，參與凝血最終階段","D. 拮抗維生素K的物質，會影響接觸類因子如第XII因子的合成"],"ans":3,"exp":"拮抗維生素 K 的物質（如殺鼠靈/warfarin）會影響維生素 K 依賴性凝血因子（II、VII、IX、X）的合成，這些均屬於絲胺酸蛋白酶類因子，而非接觸類因子（XII、XI、prekallikrein、HMWK）。接觸類因子不依賴維生素 K 合成。","we":["A. 活化的第 V 及 VIII 因子在低溫（冷藏）後會喪失活性，為正確敘述。","B. 凝血外因系統（extrinsic pathway）需要組織因子（tissue factor/factor III）才可活化因子 VII，為正確敘述。","C. 纖維素原（fibrinogen/factor I）是其他凝血因子的最終受質，被凝血酶轉化為纖維素，參與凝血最終階段，敘述正確。","（正確）D. 拮抗維生素 K 的物質影響維生素 K 依賴性因子（II、VII、IX、X），不影響接觸類因子（如第 XII 因子），此敘述錯誤，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_032","year":2020,"roc_year":109,"session":"1","examNo":32,"q":"有關止血障礙之敘述，下列何者正確？","opts":["A. 第VIII凝血因子缺乏是止血障礙最常見原因","B. 犬投與EPO會增強血小板功能","C. 犬指甲剪太深導致出血時間延長，主因凝血因子缺乏","D. mean platelet volume增加且有血小板減少症時，表示血小板生成作用低下"],"ans":1,"exp":"von Willebrand 病（vWD）是犬最常見的止血障礙，因 vWF 缺乏影響血小板黏附，導致初級止血缺陷，而非凝血因子缺乏。EPO（紅血球生成素）投予可改善尿毒症性血小板功能障礙，故 EPO 確可增強犬血小板功能。","we":["A. 第 VIII 凝血因子缺乏（血友病 A）雖重要，但犬最常見的止血障礙是 von Willebrand 病，此敘述有誤。","（正確）B. 犬投與 EPO 可改善因尿毒症引起的血小板功能障礙（尿毒症性血小板病），確實會增強血小板功能，此敘述正確，為正確答案。","C. 犬指甲剪太深（quick 出血）是物理性傷害，出血時間延長主因是血管損傷，並非凝血因子缺乏。","D. Mean platelet volume（MPV）增加合併血小板減少症，表示血小板被大量消耗（骨髓代償增生，釋出大型血小板），而非生成低下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_033","year":2020,"roc_year":109,"session":"1","examNo":33,"q":"止血過程中von Willebrand's factor（vWF）主要與第幾凝血因子形成複合體？","opts":["A. V","B. VII","C. VIII","D. IX"],"ans":2,"exp":"von Willebrand factor（vWF）在初級止血中的角色是協助血小板黏附於受損血管內皮，同時在循環中與第 VIII 凝血因子形成複合體，保護 VIII 因子不被降解，並將其攜帶至損傷部位。","we":["A. 第 V 因子是凝血酶原酶複合體的輔因子，不與 vWF 形成複合體。","B. 第 VII 因子是外源凝血路徑的啟動因子，與 vWF 無複合體關係。","（正確）C. vWF 主要與第 VIII 凝血因子形成複合體，保護 VIII 因子活性，為正確答案。","D. 第 IX 因子是內源路徑成分，不與 vWF 直接形成複合體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_034","year":2020,"roc_year":109,"session":"1","examNo":34,"q":"血小板減少症引起之止血障礙，常見下列何種異常？","opts":["A. buccal mucosal bleeding time延長","B. activated partial thromboplastin time延長","C. one-stage prothrombin time延長","D. thrombin time延長"],"ans":0,"exp":"血小板減少症引起的是初級止血缺陷，表現為黏膜出血時間延長（BMBT 延長），因為血小板血栓形成受阻。凝血因子試驗（APTT、OSPT、thrombin time）在單純血小板減少時通常正常。","we":["（正確）A. BMBT（buccal mucosal bleeding time）延長是血小板減少症（初級止血缺陷）的典型表現，為正確答案。","B. APTT 延長見於內源凝血路徑因子缺乏（如血友病 A/B），血小板減少症不影響 APTT。","C. OSPT 延長見於外源凝血路徑缺陷（因子 VII 缺乏或維生素 K 拮抗），血小板減少不影響 OSPT。","D. Thrombin time 延長見於纖維素原缺乏或 DIC，血小板減少不影響 thrombin time。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_035","year":2020,"roc_year":109,"session":"1","examNo":35,"q":"某一動物血中之血漿總蛋白濃度為8.4 g/dL，纖維素原濃度為1.2 g/dL，則該動物為脫水還是纖維素原濃度異常？","opts":["A. 脫水","B. 低纖維素原血症","C. 高纖維素原血症","D. 脫水及低纖維素原血症"],"ans":2,"exp":"血漿總蛋白（TP）正常值約 6-8 g/dL，8.4 g/dL 稍高提示脫水。纖維素原正常值約 0.2-0.4 g/dL（馬可高至 0.4-0.6），1.2 g/dL 明顯高於正常，為高纖維素原血症。因此此動物同時有脫水（TP 偏高）和高纖維素原血症。","we":["A. 單純脫水：TP 升高符合，但纖維素原 1.2 g/dL 遠超正常，不能僅以脫水解釋。","B. 低纖維素原血症：纖維素原 1.2 g/dL 明顯高於正常，此選項完全相反。","（正確）C. 高纖維素原血症：TP 8.4 g/dL 提示脫水，纖維素原 1.2 g/dL 顯著升高（正常 <0.4 g/dL），但本題若只考慮纖維素原異常則選 C；若考慮兩者則選 D；依考選部公布答案為 C（高纖維素原血症為主要異常）。","D. 脫水及低纖維素原血症：低纖維素原血症說法錯誤，應為高纖維素原血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_036","year":2020,"roc_year":109,"session":"1","examNo":36,"q":"C-反應蛋白（C-Reactive protein）在下列何種動物並不是一個顯著的急性期蛋白？","opts":["A. 犬","B. 貓","C. 馬","D. 豬"],"ans":2,"exp":"C-反應蛋白（CRP）在犬是重要的急性期蛋白，在馬則不是顯著的急性期蛋白（馬的主要急性期蛋白為 SAA、fibrinogen）。貓和豬也有 CRP 的急性期反應，但馬的 CRP 升高幅度有限。","we":["A. 犬的 CRP 是最重要的急性期蛋白之一，可在 24 小時內快速升高 10-100 倍。","B. 貓也有 CRP 急性期反應，但不如犬明顯；貓主要急性期蛋白為 SAA 和 AGP。","（正確）C. 馬的 CRP 不是顯著的急性期蛋白，馬主要依賴 SAA 和 fibrinogen 作為急性期指標，為正確答案。","D. 豬的 CRP 是急性期蛋白，可顯著升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_037","year":2020,"roc_year":109,"session":"1","examNo":37,"q":"下列何種方法常用於明瞭駒及犢由初乳獲得免疫球蛋白之程度？","opts":["A. 雙脲法（biuret method）","B. 硫酸鋅混濁試驗","C. 屈折計法","D. 三氯醋酸沉澱法"],"ans":1,"exp":"硫酸鋅混濁試驗（zinc sulfate turbidity test，ZST）是評估新生馬駒及犢牛是否由初乳獲得足夠免疫球蛋白（IgG）的標準方法；血清中免疫球蛋白與硫酸鋅結合形成混濁沉澱，混濁程度反映 IgG 濃度。","we":["A. 雙脲法（biuret method）用於測定總蛋白濃度，不特異性評估免疫球蛋白。","（正確）B. 硫酸鋅混濁試驗（ZST）專門用於評估新生駒及犢由初乳獲得的免疫球蛋白程度，為正確答案。","C. 屈折計法（refractometry）測定總蛋白或尿比重，無法特異性評估免疫球蛋白。","D. 三氯醋酸（TCA）沉澱法是蛋白質定量技術，不用於臨床評估初乳免疫球蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_038","year":2020,"roc_year":109,"session":"1","examNo":38,"q":"下列何種犬種易發生原發性高脂血症？","opts":["A. 瑪爾濟斯犬","B. 黃金獵犬","C. 迷你雪納瑞","D. 德國狼犬"],"ans":2,"exp":"迷你雪納瑞（Miniature Schnauzer）是原發性高脂血症最常見的犬種，具有遺傳性脂蛋白脂肪酶缺陷或脂質代謝異常，容易出現高三酸甘油酯血症和高膽固醇血症，即使空腹也持續出現。","we":["A. 瑪爾濟斯犬（Maltese）無特別的原發性高脂血症傾向。","B. 黃金獵犬（Golden Retriever）好發甲狀腺功能低下引起的繼發性高脂血症，非原發性。","（正確）C. 迷你雪納瑞（Miniature Schnauzer）是犬中最常見的原發性高脂血症犬種，具遺傳性脂質代謝異常，為正確答案。","D. 德國狼犬（German Shepherd）無特別的原發性高脂血症傾向。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_039","year":2020,"roc_year":109,"session":"1","examNo":39,"q":"下列何種疾病通常不會引起病理性高脂血症？","opts":["A. 腎病症候群","B. 甲狀腺功能亢進","C. 糖尿病","D. 伴有膽汁阻塞之肝病"],"ans":1,"exp":"甲狀腺功能亢進（hyperthyroidism）通常會加速脂質代謝，增加膽固醇的分解代謝（LDL 受體上調），反而造成低膽固醇血症，不引起病理性高脂血症。其餘三項均為繼發性高脂血症的常見原因。","we":["A. 腎病症候群：大量蛋白質從尿液流失，肝臟代償性增加脂蛋白合成，造成高脂血症。","（正確）B. 甲狀腺功能亢進：加速脂質代謝，通常不引起高脂血症，反而可能降低膽固醇，為正確答案。","C. 糖尿病：胰島素缺乏造成脂肪分解增加、VLDL 分泌增加，引起高三酸甘油酯血症。","D. 伴有膽汁阻塞之肝病：膽汁無法排出，導致膽固醇積聚，引起高膽固醇血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_040","year":2020,"roc_year":109,"session":"1","examNo":40,"q":"下列何者會使動物產生過量的外源性乳酸鹽，而導致高乳酸鹽血症？","opts":["A. 馬之胃破裂","B. 休克","C. 過度勞動後之疲勞","D. 忽然攝入過多穀物"],"ans":3,"exp":"突然攝入過多穀物（grain overload）可導致瘤胃中大量微生物發酵產生乳酸，並由腸道吸收至血液，造成外源性乳酸鹽過量，引發高乳酸鹽血症（D-乳酸酸中毒）。此為牛的穀物過食症的典型機制。","we":["A. 馬之胃破裂（gastric rupture）屬於外科急症，可能引起休克性乳酸升高，但為內源性，非外源性乳酸。","B. 休克引起組織缺氧，造成無氧糖解增加，產生內源性乳酸（L-乳酸）。","C. 過度勞動後疲勞：肌肉無氧代謝產生內源性乳酸，非外源性。","（正確）D. 突然攝入過多穀物：瘤胃微生物大量發酵產生外源性乳酸（D-乳酸），由腸道吸收造成高乳酸鹽血症，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_041","year":2020,"roc_year":109,"session":"1","examNo":41,"q":"下列何者不是低血糖症的原因？","opts":["A. 馬黃麴毒素中毒","B. 腦垂體功能低下","C. 牛之酮病","D. 腎上腺皮質功能亢進"],"ans":3,"exp":"腎上腺皮質功能亢進（Cushing's disease）會促進糖質新生，增加血糖，是造成高血糖的原因，而非低血糖的原因。其他三項均可直接或間接造成低血糖。","we":["A. 馬黃麴毒素中毒（aflatoxicosis）可引起嚴重肝損傷，肝臟糖質新生功能下降，造成低血糖。","B. 腦垂體功能低下（hypopituitarism）導致 GH、ACTH 分泌不足，減少糖質新生，可引起低血糖。","C. 牛之酮病（bovine ketosis）：雖以低血糖、酮體增加為主要特徵，是低血糖的常見原因。","（正確）D. 腎上腺皮質功能亢進（hyperadrenocorticism）促進糖質新生，升高血糖而非降低，為非低血糖症原因，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_042","year":2020,"roc_year":109,"session":"1","examNo":42,"q":"肝臟中主要負責清除外來病原的是下列何種細胞？","opts":["A. 膽管上皮細胞","B. 星狀（Ito）細胞","C. 網狀內皮細胞","D. 庫弗氏細胞"],"ans":3,"exp":"庫弗氏細胞（Kupffer cells）是肝臟的駐留巨噬細胞（resident macrophages），位於肝血竇內，主要功能是吞噬並清除血液中的細菌、異物、老化紅血球及其他病原，是肝臟免疫防禦的第一線。","we":["A. 膽管上皮細胞（cholangiocytes）負責膽汁的修飾和運輸，不負責免疫清除病原。","B. 星狀（Ito）細胞（hepatic stellate cells）主要貯存維生素 A，活化後參與纖維化，不負責清除病原。","C. 網狀內皮細胞是廣義概念，在肝臟中庫弗氏細胞屬於其一，但此選項較不精確。","（正確）D. 庫弗氏細胞（Kupffer cells）是肝竇巨噬細胞，負責清除外來病原及異物，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_043","year":2020,"roc_year":109,"session":"1","examNo":43,"q":"急性肝病時，下列何種凝血因子因其半衰期短而最早出現缺乏？","opts":["A. II","B. VII","C. IX","D. XI"],"ans":1,"exp":"第 VII 凝血因子在維生素 K 依賴性因子中半衰期最短（犬約 4-6 小時），急性肝病時肝臟合成功能下降，第 VII 因子最先耗竭，引起 OSPT（外源路徑）最先延長。","we":["A. 第 II 因子（凝血酶原）半衰期約 2-5 天，不是最早出現缺乏的因子。","（正確）B. 第 VII 因子半衰期最短（4-6 小時），急性肝病時最早出現缺乏，OSPT 最先延長，為正確答案。","C. 第 IX 因子半衰期約 24 小時，不是最先缺乏的因子。","D. 第 XI 因子不依賴維生素 K 合成，半衰期不是最短，亦非最早缺乏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_044","year":2020,"roc_year":109,"session":"1","examNo":44,"q":"複選題 44.下列何種動物之膽管疾病，須以加瑪麩胺醯轉移酶（GGT）作為診斷首選指摽？","opts":["A. 豬","B. 狗","C. 馬","D. 鸚鵡"],"ans":2,"exp":"馬的膽道疾病診斷首選 GGT（gamma-glutamyltransferase），因為馬的 ALP 在正常骨骼生長時也會升高（骨骼 ALP 同工酶），而 GGT 更具肝膽特異性；馬的 GGT 對肝膽病變敏感度高且特異。","we":["A. 豬的肝膽疾病診斷可用 ALT 或 GGT，但 GGT 並非最首選。","B. 狗的膽管疾病首選 ALP（肝誘導型 ALP 同工酶），GGT 為次選。","（正確）C. 馬的膽管疾病應以 GGT 作為診斷首選，因馬 ALP 受骨骼影響，GGT 更具肝膽特異性，為正確答案。","D. 鸚鵡的肝膽疾病評估常用 AST 和膽汁酸，GGT 敏感度有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_045","year":2020,"roc_year":109,"session":"1","examNo":45,"q":"下列何種動物較少使用山梨醇脫氫酶（SDH）來診斷肝臟損傷？","opts":["A. 馬","B. 犬","C. 山羊","D. 綿羊"],"ans":1,"exp":"山梨醇脫氫酶（SDH）是肝臟特異性酵素，主要用於馬、牛、羊等大型動物的肝損傷診斷，因為這些動物的 ALT 對肝臟損傷敏感度低。犬（狗）通常使用 ALT 作為肝損傷首選指標，較少需要 SDH。","we":["A. 馬常使用 SDH 診斷肝臟損傷，因馬 ALT 活性低且非肝臟特異，SDH 較適用。","（正確）B. 犬（狗）較少使用 SDH，主要使用 ALT（犬 ALT 是肝細胞損傷的靈敏且特異性指標），為正確答案。","C. 山羊常使用 SDH 評估肝損傷，ALT 在反芻動物特異性低。","D. 綿羊同樣常使用 SDH 評估肝損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_046","year":2020,"roc_year":109,"session":"1","examNo":46,"q":"有關發生先天性門脈分流（congenital portosystemic shunt）的動物，下列敘述何者正確？","opts":["A. AST與ALT活性值顯著上升","B. ALP活性值顯著上升","C. 膽汁酸濃度上升","D. 白蛋白濃度上升"],"ans":2,"exp":"先天性門脈分流（portosystemic shunt）時，腸道吸收的物質（包括腸道來源的膽汁酸）不經過肝臟代謝直接進入體循環，造成血清膽汁酸（bile acids）濃度顯著升高，是診斷門脈分流的重要指標。","we":["A. 先天性門脈分流時，肝臟實質受損不明顯，AST 與 ALT 通常不顯著上升（無肝細胞壞死）。","B. ALP 可能輕度升高，但不是先天性門脈分流的特異性或顯著異常。","（正確）C. 膽汁酸濃度上升：門脈分流使腸道吸收的膽汁酸繞過肝臟直接進入體循環，膽汁酸顯著升高，為正確答案。","D. 白蛋白濃度應下降（肝臟合成功能減退），不會升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_047","year":2020,"roc_year":109,"session":"1","examNo":47,"q":"丙氨酸轉胺酶（ALT）的活性變化可用來評估下列何組動物肝細胞損傷？","opts":["A. 鸚鵡、豬","B. 鴿子、兔子","C. 馬、犬","D. 兔子、貓"],"ans":3,"exp":"ALT（丙氨酸轉胺酶）主要分布於犬、貓、兔子及靈長類的肝細胞細胞質中，是這些動物肝細胞損傷的高度特異性指標。馬、牛、羊的 ALT 活性在肝臟中相對較低，診斷意義有限。","we":["A. 鸚鵡：ALT 在鳥類肝損傷的診斷意義有限，主要用 AST；豬：ALT 在豬的特異性亦有限。","B. 鴿子：鳥類同上，ALT 特異性低；兔子的 ALT 有一定意義但不如犬貓典型。","C. 馬：ALT 在馬的診斷意義低，馬用 SDH/GGT；犬：犬的 ALT 有意義，但馬不適用。","（正確）D. 兔子（rabbit）和貓（cat）的肝臟中 ALT 活性高且具特異性，兩者均適合用 ALT 評估肝細胞損傷，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_048","year":2020,"roc_year":109,"session":"1","examNo":48,"q":"下圖為透過Wright's stain所製備的肝臟細胞學檢查抹片，黑色箭頭所指位於細胞質中的色素最有可能為何？","opts":["A. lipofuscin","B. amyloid plaques","C. copper","D. glycogen"],"ans":0,"exp":"脂褐素（lipofuscin）是細胞老化過程中不可降解的脂質過氧化物積累，Wright's stain 下呈棕黃至綠色顆粒，位於肝細胞細胞質中，為最常見的肝細胞內色素之一，在老年動物尤其常見。","we":["（正確）A. Lipofuscin（脂褐素）：老化色素，Wright's stain 下呈棕黃色顆粒，位於細胞質，最常見的肝細胞內色素，需看圖確認，為正確答案。","B. Amyloid plaques（澱粉樣蛋白）：細胞外沉積，不在細胞質內以顆粒形式出現。","C. 銅（copper）：銅在肝細胞中呈藍綠色顆粒（Rhodanine/Rubeanic acid 染色陽性），Wright's stain 下不易辨識。","D. Glycogen（肝醣）：在 Wright's stain 下通常不顯色，需 PAS 染色。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_049","year":2020,"roc_year":109,"session":"1","examNo":49,"q":"有關明膠消化試驗之敘述，下列何者正確？","opts":["A. 有膠片試驗法及試管法兩種測試方式，後者敏感度較高","B. 膠片法所使用的Ｘ光膠片，目的是要測試胰澱粉酶對於溴化銀的消化效果","C. 膠片法試驗時，若膠片感光變黑，結果判定為陽性","D. 糞便中若有大量細菌存在時，可能會出現偽陰性結果"],"ans":0,"exp":"明膠消化試驗（gelatin digestion test）有膠片法和試管法，試管法的敏感度較高（可偵測更低濃度的胰蛋白酶）。膠片法使用 X 光膠片，測試胰蛋白酶（而非澱粉酶）對明膠（gelatin，非溴化銀）的消化效果；消化後膠片變透明為陽性。","we":["（正確）A. 有膠片法及試管法兩種，試管法敏感度較高，此敘述正確，為正確答案。","B. 膠片法測試的是胰蛋白酶對明膠（gelatin）的消化，而非澱粉酶對溴化銀的消化，此敘述錯誤。","C. 膠片法陽性結果是膠片的乳劑層（明膠）被消化後變透明，而非感光變黑，此敘述錯誤。","D. 大量細菌存在時，細菌本身的蛋白酶可消化明膠，造成偽陽性（而非偽陰性），此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_050","year":2020,"roc_year":109,"session":"1","examNo":50,"q":"犬之lipase活性值正常範圍在某台機器為小於200 U/L。現今某犬之血中lipase值為1020 U/L，在其他指數尚未獲得前，最可能的疾病推測方向為","opts":["A. 腎臟疾病","B. 胰臟炎","C. 腸道阻塞","D. 胃炎"],"ans":1,"exp":"血中 lipase 值為正常上限的 5 倍（1020 vs 200 U/L），在缺乏其他診斷資訊的情況下，最可能的臨床推測為胰臟炎（pancreatitis）。雖然腎臟疾病也可能造成 lipase 升高，但胰臟炎仍是最優先考量。","we":["A. 腎臟疾病可造成 lipase 輕度升高（腎清除率下降），但通常不高達正常值的 5 倍以上，且非最優先推測。","（正確）B. 胰臟炎（pancreatitis）：lipase 顯著升高（>3-5 倍正常上限）是胰臟炎的主要指標，為最可能的診斷方向，為正確答案。","C. 腸道阻塞可能造成腹痛，但不是 lipase 顯著升高的主要原因。","D. 胃炎與 lipase 升高無直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_051","year":2020,"roc_year":109,"session":"1","examNo":51,"q":"下列家畜中何者之唾液澱粉酶（amylase）含量較充分？","opts":["A. 犬","B. 貓","C. 牛","D. 豬"],"ans":3,"exp":"豬的唾液中含有充分的唾液澱粉酶（salivary amylase），可以在口腔中開始澱粉的消化，這與其雜食性飲食習慣有關。犬貓等肉食性動物唾液中澱粉酶含量極少。","we":["A. 犬的唾液澱粉酶含量極少，幾乎沒有口腔澱粉消化功能。","B. 貓是嚴格肉食性動物，唾液中不含澱粉酶。","C. 牛為反芻動物，主要靠瘤胃微生物消化纖維，唾液澱粉酶含量低。","（正確）D. 豬的唾液含充分的唾液澱粉酶，可在口腔中開始澱粉消化，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_052","year":2020,"roc_year":109,"session":"1","examNo":52,"q":"犬隻嚴重持續下痢最有可能導致下列何種後果？","opts":["A. 代謝性酸中毒","B. 代謝性鹼中毒","C. 膽汁鬱積","D. 外分泌胰腺功能不全（EPI）"],"ans":0,"exp":"嚴重持續性下痢會造成大量碳酸氫根（HCO₃⁻）從腸道流失，導致代謝性酸中毒（metabolic acidosis），尤其是正常陰離子差型（hyperchloremic metabolic acidosis）。","we":["（正確）A. 代謝性酸中毒：嚴重下痢導致腸道 HCO₃⁻ 大量流失，是最常見的後果，為正確答案。","B. 代謝性鹼中毒通常見於嚴重嘔吐（HCl 流失），不是下痢的主要後果。","C. 膽汁鬱積（cholestasis）為肝膽疾病，與下痢無直接因果關係。","D. 外分泌胰腺功能不全（EPI）是胰酶分泌不足引起的慢性消化障礙，是下痢的可能原因而非後果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_053","year":2020,"roc_year":109,"session":"1","examNo":53,"q":"當懷疑動物有營養缺乏性肌病時，最需要補充下列那兩種物質？","opts":["A. 鈣、維生素D","B. 硒、維生素E","C. 鈣、硒","D. 硒、維生素D"],"ans":1,"exp":"營養缺乏性肌病（nutritional myopathy，白肌病）的主要原因是硒（selenium）和維生素 E（vitamin E）缺乏，兩者共同維護細胞膜免受氧化損傷；缺乏時肌肉纖維發生氧化性壞死。","we":["A. 鈣和維生素 D 缺乏主要引起骨骼疾病（佝僂病/骨軟化症），不是肌病的主因。","（正確）B. 硒和維生素 E 缺乏：兩者均為抗氧化劑，缺乏導致肌肉氧化性壞死（白肌病），補充此二者為治療首選，為正確答案。","C. 鈣和硒：硒的部分正確，但鈣缺乏主要影響骨骼和神經肌肉傳導（低鈣抽搐），並非白肌病的主因。","D. 硒和維生素 D：硒正確，但維生素 D 主要調節鈣磷代謝，與白肌病無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_054","year":2020,"roc_year":109,"session":"1","examNo":54,"q":"肌肉有退行性變化或壞死時，下列何種酵素活性值上升最不具診斷意義？","opts":["A. creatine kinase","B. lactate dehydrogenase","C. aspartate aminotransferase","D. alanine aminotransferase"],"ans":3,"exp":"丙氨酸轉胺酶（ALT/GPT）主要分布於肝臟，在肌肉中含量極低；肌肉損傷時 ALT 升高程度最不具肌肉損傷診斷意義。CK 最具肌肉特異性，LDH 和 AST 雖非肌肉特異，但升高仍有參考價值。","we":["A. Creatine kinase（CK）是肌肉損傷最特異的酵素，最具診斷意義。","B. Lactate dehydrogenase（LDH）廣泛存在於肌肉，肌肉壞死時顯著升高，具診斷意義。","C. Aspartate aminotransferase（AST）在肌肉中含量豐富，肌肉損傷時明顯升高，具診斷意義。","（正確）D. Alanine aminotransferase（ALT）主要在肝臟，肌肉含量極低，肌肉損傷時 ALT 升高最不具診斷意義，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_055","year":2020,"roc_year":109,"session":"1","examNo":55,"q":"犬之嗜酸性球性肌炎可由血液檢出抗第幾型肌纖維之抗體？","opts":["A. Ⅰ","B. Ⅱ","C. Ⅲ","D. Ⅳ"],"ans":1,"exp":"犬嗜酸性球性肌炎（eosinophilic myositis）是免疫媒介性疾病，血液中可檢出抗第 II 型肌纖維（type II muscle fiber）的抗體，這是該病的特徵性免疫學指標。","we":["A. 第 I 型肌纖維（慢縮型，富含粒線體）的抗體不是嗜酸性球性肌炎的特徵。","（正確）B. 第 II 型肌纖維（快縮型）的抗體：犬嗜酸性球性肌炎可由血液檢出抗 type II 肌纖維抗體，為正確答案。","C. 第 III 型肌纖維：肌纖維通常分為 I 型和 II 型，無第 III 型的傳統分類，此選項不適用。","D. 第 IV 型肌纖維：同上，傳統分類無第 IV 型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_056","year":2020,"roc_year":109,"session":"1","examNo":56,"q":"有關尿比重之敘述，下列何者正確？","opts":["A. 尿比重反應的是尿液中的滲透壓之變化","B. 等比重尿（isosthenuria）顯示該動物之腎功能正常運作","C. 腎臟的amyloidosis會引發高比重尿","D. 尿比重高於1.008時表示溶質之重吸收大於水"],"ans":0,"exp":"尿比重反映尿液中溶質（主要是各類離子和有機分子）的總濃度，與尿液滲透壓密切相關（雖非完全等同）。尿比重高於 1.008 表示腎小管對水分的重吸收超過溶質，即尿液濃縮。","we":["（正確）A. 尿比重反映尿液中溶質濃度的變化，與尿液滲透壓密切相關，此敘述基本正確，為正確答案。","B. 等比重尿（isosthenuria，USG 1.008-1.012）表示腎臟無法濃縮或稀釋尿液，是腎功能障礙的表現，並非正常。","C. 腎臟 amyloidosis（澱粉樣蛋白沉積）破壞腎小管濃縮功能，引發低比重尿（等比重尿或低滲透壓尿），而非高比重尿。","D. 尿比重高於 1.008 表示溶質重吸收大於水（即水相對流失），解釋方向錯誤；應為「溶質排泄/保留相對多於水」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_057","year":2020,"roc_year":109,"session":"1","examNo":57,"q":"下圖所示最有可能為下列何種結晶？","opts":["A. 三重磷酸鹽","B. 草酸鹽","C. 馬尿酸結晶","D. 酥氨酸結晶\r ."],"ans":0,"exp":"三重磷酸鹽結晶（triple phosphate / struvite crystals）在顯微鏡下呈典型的「棺材蓋形」（coffin-lid shaped），即三稜柱形結晶，是最常見的尿液結晶之一，常見於鹼性尿。","we":["（正確）A. 三重磷酸鹽（struvite）結晶：呈棺材蓋形三稜柱，最常見於犬貓，常與泌尿道感染相關，需看圖確認，為正確答案。","B. 草酸鹽結晶（calcium oxalate）：常呈信封形（dihydrate）或啞鈴形（monohydrate）。","C. 馬尿酸結晶（hippuric acid）：呈黃褐色稜柱形，主要見於草食動物尿液。","D. 酥氨酸結晶（threonine）：罕見，形態特殊，臨床上少見。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_058","year":2020,"roc_year":109,"session":"1","examNo":58,"q":"【已刪除】58.犬呈現多尿且尿比重為1.020～1.035，可能的診斷為何？①糖尿病 ②腎性尿崩症 ③腎上腺皮質功能低下 ④子宮蓄膿","opts":["A. ①②④","B. ①②③","C. ①③④","D. ②③④ (E)一律給分"],"ans":0,"exp":"此題為已刪除題目（官方一律給分），腳本中保留原始答案設定即可。糖尿病（尿比重高）、腎上腺皮質功能低下（低比重尿）和子宮蓄膿（多尿）可能造成多尿，腎性尿崩症尿比重極低，不符合 1.020-1.035 的範圍，故此題有爭議，官方刪題。","we":["（正確）A. ①②④：此為官方刪題，一律給分，設 A 為參考答案。","B. ①②③：腎性尿崩症（NDI）尿比重通常 <1.010，不符合 1.020-1.035。","C. ①③④：此組合亦有討論空間，但官方已刪題。","D. ②③④：包含腎性尿崩症，尿比重不符，此組不合理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_059","year":2020,"roc_year":109,"session":"1","examNo":59,"q":"下列何者尿中出現重尿酸銨（ammonium biurates）是正常的？","opts":["A. 古代牧羊犬","B. 大麥町犬","C. 德國狼犬","D. 雪納瑞犬"],"ans":0,"exp":"大麥町犬（Dalmatian）因缺乏尿酸酶（uricase）或其活性不足，無法將尿酸轉化為尿囊素，血尿酸濃度偏高，尿中出現重尿酸銨（ammonium biurate）結晶是其正常生理特性，不代表疾病。","we":["A. 古代牧羊犬（Old English Sheepdog）無此代謝特殊性，出現重尿酸銨通常提示門脈分流。","（正確）B. 大麥町犬（Dalmatian）：因尿酸代謝特殊性，尿中出現重尿酸銨結晶為正常生理現象，為正確答案。","C. 德國狼犬（German Shepherd）無此代謝特性，重尿酸銨結晶屬異常。","D. 雪納瑞犬（Schnauzer）無此代謝特性，重尿酸銨結晶屬異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_060","year":2020,"roc_year":109,"session":"1","examNo":60,"q":"有關尿濃縮試驗之原理，下列敘述何者正確？","opts":["A. 適用於未能診斷出病因之乏尿動物","B. 脫水達3%以上的動物無需再進行本試驗","C. 如動物同時有氮血症及低比重尿出現時，使用此法可進一步確認病因","D. 此法的原理乃是透過ADH會刺激腎小管上皮細胞對鈉離子進行重吸收，進而造成尿液之濃縮"],"ans":1,"exp":"尿濃縮試驗（water deprivation test）的適應症是評估多尿多渴（PU/PD）動物，若動物已有脫水（>3-5%）或已知有氮血症合併低比重尿，則不需再進行（風險高，診斷已明確）。","we":["A. 尿濃縮試驗適用於多尿多渴的動物（PU/PD），不是乏尿（oliguria）動物，此敘述錯誤。","（正確）B. 脫水達 3-5% 以上的動物已不需進行尿濃縮試驗，因腎臟應已受到最大 ADH 刺激；此敘述正確，為正確答案。","C. 若已有氮血症合併低比重尿，診斷方向已明確（腎功能不全），此時進行尿濃縮試驗可能加重腎損傷，不適當。","D. ADH 的機制是刺激腎小管對水分的重吸收（不是鈉離子），此敘述機制描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_061","year":2020,"roc_year":109,"session":"1","examNo":61,"q":"有關尿素（urea）代謝之敘述，下列何者正確？","opts":["A. 血清中的尿素濃度會低於組織內之尿素濃度","B. 腎臟對於血中尿素的移除採取主動運輸","C. 糞便中同樣有尿素之分布","D. 尿素可在腎組織間自由擴散，被動地進入腎間質，然後回到血中"],"ans":2,"exp":"尿素可在腎臟組織間自由擴散（passive diffusion），不需主動運輸；腎臟通過被動擴散從血液中移除尿素，尿素也可在腎髓質間質中積累（尿素循環），參與腎臟濃縮機制，之後又回到血液。","we":["A. 血清中尿素濃度通常與組織相近（自由擴散），不會顯著低於組織內，此敘述不正確。","B. 腎臟對血中尿素的移除是被動擴散（passive diffusion），不是主動運輸（active transport），此敘述錯誤。","（正確）C. 糞便中確有尿素分布（腸道細菌分解尿素），此敘述正確，為正確答案。","D. 尿素在腎組織間自由擴散被動進入腎間質再回到血中，這個描述基本正確，但選項 C 更直接準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_062","year":2020,"roc_year":109,"session":"1","examNo":62,"q":"牛絲球體濾過率（GFR）降低時亦不易出現高血磷，其最主要原因為何？","opts":["A. 牛日常攝取的食物中不含磷","B. 腎不是磷主要的排泄途徑","C. 牛正常時即易出現假性副甲狀腺功能亢進引發磷流失","D. 牛正常時即易出現代謝性酸血症引發磷流失"],"ans":1,"exp":"牛的磷排泄主要透過唾液和糞便（腸道途徑），而不是腎臟排泄；因此即使 GFR 降低，腎臟排磷減少，也不會明顯造成血磷升高，因為磷的主要排泄途徑不受腎臟功能影響。","we":["A. 牛日常食物（牧草）含有磷，此說法錯誤。","（正確）B. 牛磷的主要排泄途徑是消化道（唾液分泌大量磷進入糞便），而非腎臟，因此 GFR 降低不影響磷排泄，不易出現高血磷，為正確答案。","C. 假性副甲狀腺功能亢進引發磷流失並非牛的正常生理，此說法錯誤。","D. 牛正常時並不是因代謝性酸血症引發磷流失，此說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_063","year":2020,"roc_year":109,"session":"1","examNo":63,"q":"犬血清鎂濃度約為0.59～0.86 mmol/L，其中多少比率為離子型鎂（ionized magnesium）？","opts":["A. 25%","B. 35%","C. 45%","D. 55%"],"ans":3,"exp":"犬血清鎂中，約 55% 為離子型鎂（ionized Mg²⁺），約 30-35% 與蛋白質結合，其餘與陰離子形成複合物。離子型鎂為具生理活性的形式。","we":["A. 25% 偏低，不符合犬離子型鎂的實際比率。","B. 35% 偏低，接近蛋白結合型鎂的比率。","C. 45% 偏低，仍不符合正確數值。","（正確）D. 55% 為犬血清中離子型鎂（ionized magnesium）的正確比率，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_064","year":2020,"roc_year":109,"session":"1","examNo":64,"q":"下列何者不是造成高磷血症之原因？","opts":["A. 腎性氮血症","B. 維生素D中毒","C. 原發性副甲狀腺功能亢進","D. 大量橫紋肌溶解"],"ans":2,"exp":"原發性副甲狀腺功能亢進（primary hyperparathyroidism）會增加 PTH 分泌，PTH 促進腎臟排磷（尿磷增加），同時促進骨骼釋鈣，造成高血鈣合併低血磷，不會引起高磷血症。","we":["A. 腎性氮血症（腎衰竭）：GFR 降低，磷排泄減少，是高磷血症的常見原因。","B. 維生素 D 中毒：促進腸道磷吸收，造成高血磷及高血鈣。","（正確）C. 原發性副甲狀腺功能亢進：PTH 促進腎臟排磷，造成低血磷而非高血磷，不是高磷血症的原因，為正確答案。","D. 大量橫紋肌溶解：肌肉細胞內磷大量釋放，造成高磷血症及高鉀血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_065","year":2020,"roc_year":109,"session":"1","examNo":65,"q":"下列那一種犬腫瘤最常造成高鈣血症？","opts":["A. ovarian stromal tumor","B. anal sac adenocarcinoma","C. thymoma","D. squamous cell carcinoma"],"ans":1,"exp":"犬肛門囊腺癌（anal sac adenocarcinoma）是最常造成惡性高鈣血症（humoral hypercalcemia of malignancy, HHM）的腫瘤，因其分泌類副甲狀腺激素相關蛋白（PTHrP），刺激骨骼釋鈣，引起顯著高鈣血症。","we":["A. 卵巢間質瘤（ovarian stromal tumor）罕見引起高鈣血症。","（正確）B. 肛門囊腺癌（anal sac adenocarcinoma）是犬中最常造成惡性高鈣血症的腫瘤，透過分泌 PTHrP 引起，為正確答案。","C. 胸腺瘤（thymoma）偶可引起高鈣血症，但不如肛門囊腺癌常見。","D. 鱗狀細胞癌（squamous cell carcinoma）可引起高鈣血症，但頻率不及肛門囊腺癌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_066","year":2020,"roc_year":109,"session":"1","examNo":66,"q":"下列何者不是甲狀腺功能低下（hypothyroidism）常見之臨床症狀？","opts":["A. 脫毛","B. 多渴／多尿","C. 精神遲鈍","D. 體重增加"],"ans":1,"exp":"甲狀腺功能低下（hypothyroidism）的典型症狀包括脫毛、精神遲鈍（嗜睡）、體重增加（代謝率下降）等。多渴/多尿（PU/PD）不是甲狀腺功能低下的常見症狀，而是糖尿病、庫興氏症、腎上腺皮質功能低下等疾病的特徵。","we":["A. 脫毛（alopecia）：甲狀腺功能低下常見對稱性脫毛，為典型症狀。","（正確）B. 多渴／多尿（PU/PD）不是甲狀腺功能低下的常見症狀，此為正確答案（不屬於甲狀腺功能低下的症狀）。","C. 精神遲鈍（mental dullness/lethargy）：代謝率下降引起，為典型症狀。","D. 體重增加：基礎代謝率下降，脂肪積累，為典型症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_067","year":2020,"roc_year":109,"session":"1","examNo":67,"q":"罹患肢端肥大症之犬貓，其血清胰島素樣生長因子基礎值（basal serum insulin-like growth factor 1, IGF 1）通常不低於多少ng/mL？","opts":["A. 50","B. 200","C. 500","D. 1,000"],"ans":3,"exp":"罹患肢端肥大症（acromegaly）的犬貓因 GH 過量分泌，促進 IGF-1 合成，血清 IGF-1 基礎值通常不低於 1,000 ng/mL，是診斷肢端肥大症的重要指標（正常犬貓 IGF-1 約 200-600 ng/mL）。","we":["A. 50 ng/mL 極低，低於正常值，不符合肢端肥大症的 IGF-1 水準。","B. 200 ng/mL 為正常值下限，不符合肢端肥大症顯著升高的特徵。","C. 500 ng/mL 可能在正常高限附近，不足以診斷肢端肥大症。","（正確）D. 1,000 ng/mL：肢端肥大症患犬貓血清 IGF-1 通常 ≥1,000 ng/mL，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_068","year":2020,"roc_year":109,"session":"1","examNo":68,"q":"下列何者不是胰島素之主要目標組織器官？","opts":["A. 肝","B. 神經元","C. 骨骼肌","D. 脂肪組織"],"ans":1,"exp":"胰島素的主要目標器官是肝臟、骨骼肌和脂肪組織，這些器官有大量胰島素受體，負責葡萄糖的攝取和代謝。神經元（腦）攝取葡萄糖不依賴胰島素（GLUT1/3 為非胰島素依賴型），因此腦不是胰島素的主要目標器官。","we":["A. 肝臟是胰島素最重要的目標器官之一，促進糖原合成和抑制糖質新生。","（正確）B. 神經元（腦）攝取葡萄糖不依賴胰島素，腦為非胰島素依賴性組織，為正確答案。","C. 骨骼肌是胰島素促進葡萄糖攝取的主要靶器官（GLUT4）。","D. 脂肪組織（adipose tissue）受胰島素調控的葡萄糖攝取和脂肪合成，是重要目標器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_069","year":2020,"roc_year":109,"session":"1","examNo":69,"q":"Conn's syndrome是指下列何種病症？","opts":["A. hypoadrenocorticism","B. hyperaldosteronism","C. hyperadrenocorticism","D. hyperthyroidism"],"ans":1,"exp":"Conn's syndrome（康恩症候群）是指原發性醛固酮增多症（primary hyperaldosteronism），由腎上腺皮質球狀帶腺瘤或增生過度分泌醛固酮所致，引起高鈉血症、低鉀血症和高血壓。","we":["A. Hypoadrenocorticism（腎上腺皮質功能低下）= Addison's disease，與 Conn's syndrome 相反。","（正確）B. Hyperaldosteronism（醛固酮增多症）= Conn's syndrome，為腎上腺皮質球狀帶過度分泌醛固酮，為正確答案。","C. Hyperadrenocorticism（腎上腺皮質功能亢進）= Cushing's syndrome，為糖皮質激素過多，非 Conn's syndrome。","D. Hyperthyroidism（甲狀腺功能亢進）為甲狀腺疾病，與腎上腺無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_070","year":2020,"roc_year":109,"session":"1","examNo":70,"q":"健康動物細胞外液滲透壓約維持在多少mOsm/kg H 2 O？","opts":["A. 200","B. 250","C. 300","D. 350"],"ans":2,"exp":"健康動物的細胞外液（ECF）滲透壓正常維持在約 280-310 mOsm/kg H₂O，通常以 300 mOsm/kg 作為代表值，由鈉離子及其伴隨陰離子（主要為 Cl⁻ 和 HCO₃⁻）所主導。","we":["A. 200 mOsm/kg 偏低，為低滲透壓狀態（低滲血症），不是正常值。","B. 250 mOsm/kg 偏低，低於正常範圍。","（正確）C. 300 mOsm/kg H₂O 是健康動物細胞外液的正常滲透壓代表值，為正確答案。","D. 350 mOsm/kg 偏高，為高滲透壓狀態，不是正常值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_071","year":2020,"roc_year":109,"session":"1","examNo":71,"q":"下列何者不是由血液氣體直接分析，而是經由Henderson-Hasselbach公式換算而來？","opts":["A. pH","B. HCO 3 -","C. PO 2","D. PCO 2"],"ans":1,"exp":"血液氣體分析儀直接測量的是 pH、PCO₂ 和 PO₂；HCO₃⁻ 不是直接測量值，而是由 Henderson-Hasselbalch 公式（pH = pKa + log[HCO₃⁻/0.03×PCO₂]）利用 pH 和 PCO₂ 計算換算而來。","we":["A. pH 是由血液氣體分析儀直接測量（電極法），非換算值。","（正確）B. HCO₃⁻ 不能直接測量，是由 pH 和 PCO₂ 利用 Henderson-Hasselbalch 公式換算得出，為正確答案。","C. PO₂ 是直接測量（Clark 電極），非換算值。","D. PCO₂ 是直接測量（Severinghaus 電極），非換算值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_072","year":2020,"roc_year":109,"session":"1","examNo":72,"q":"下列何者最不可能是造成呼吸性酸中毒之原因？","opts":["A. 全身性麻醉","B. 重症肌無力症","C. 嚴重肺栓塞","D. 疼痛"],"ans":3,"exp":"呼吸性酸中毒由肺泡通氣不足（CO₂ 瀦留）所致。疼痛通常引起過度換氣（呼吸加速、CO₂ 降低），可能造成呼吸性鹼中毒，而非呼吸性酸中毒；故疼痛最不可能造成呼吸性酸中毒。","we":["A. 全身性麻醉（general anesthesia）抑制呼吸中樞，造成通氣不足，CO₂ 瀦留，引起呼吸性酸中毒。","B. 重症肌無力症（myasthenia gravis）影響呼吸肌，造成呼吸肌無力和通氣不足，引起呼吸性酸中毒。","C. 嚴重肺栓塞阻塞肺循環，造成死腔增加和換氣功能障礙，可引起呼吸性酸中毒。","（正確）D. 疼痛通常引起呼吸急促和過度換氣，造成 CO₂ 下降（呼吸性鹼中毒），最不可能引起呼吸性酸中毒，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_073","year":2020,"roc_year":109,"session":"1","examNo":73,"q":"下列何者不是造成小動物高鈉血症（hypernatremia）之主要原因？","opts":["A. central diabetes insipidus","B. hyperaldosteronism","C. heatstroke","D. diabetes mellitus"],"ans":3,"exp":"高鈉血症（hypernatremia）通常由水分不足（脫水）或鈉過多引起。糖尿病（diabetes mellitus）雖造成滲透性利尿（水分流失），但同時鈉也會流失，通常不是高鈉血症的主要原因；且糖尿病更常引起正常或低鈉血症。","we":["A. Central diabetes insipidus（中樞性尿崩症）：ADH 缺乏，大量排水（低張尿），造成高鈉血症。","B. Hyperaldosteronism（醛固酮增多症）：鈉瀦留、鉀排出，可引起高鈉血症。","C. Heatstroke（熱中暑）：大量出汗失水，若補充不足可造成高鈉血症（高張性脫水）。","（正確）D. Diabetes mellitus（糖尿病）：滲透性利尿失水，但通常引起正常或低鈉血症（稀釋效應），不是高鈉血症的主要原因，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_074","year":2020,"roc_year":109,"session":"1","examNo":74,"q":"下列何者較少見於犬分泌性代謝性酸中毒（secretory metabolic acidosis）血液氣體分析之結果？","opts":["A. pH下降","B. 低血氯","C. HCO 3 - 下降","D. 陰離子差正常"],"ans":1,"exp":"分泌性代謝性酸中毒（secretory metabolic acidosis）是由於 HCO₃⁻ 直接從腸道或腎臟流失，為了電中性，Cl⁻ 相應升高（高氯血症），陰離子差（anion gap）正常。血鈣偏低而非低血氯，故低血氯不是本型酸中毒的特徵。","we":["A. pH 下降：代謝性酸中毒的基本特徵，必然存在。","（正確）B. 低血氯（hypochloremia）不見於分泌性代謝性酸中毒；相反地，此型酸中毒表現為高血氯（hyperchloremia），低血氯較少見，為正確答案。","C. HCO₃⁻ 下降：代謝性酸中毒的直接表現，必然存在。","D. 陰離子差正常：分泌性代謝性酸中毒（即高氯性酸中毒）anion gap 正常，是其特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_075","year":2020,"roc_year":109,"session":"1","examNo":75,"q":"病犬疑似酸鹼不平衡，進行血液氣體分析結果如下：pH下降、P a CO 2 正常、HCO 3 - 下降、Cl - 正常、anion gap上升，據此判斷其為下列何種酸鹼不平衡？","opts":["A. 分泌性代謝性酸中毒（secretory metabolic acidosis）","B. 中和性代謝性酸中毒（titrational metabolic acidosis）","C. 呼吸性酸中毒","D. 混合性酸中毒"],"ans":1,"exp":"pH 下降、PCO₂ 正常（無呼吸代償問題）、HCO₃⁻ 下降（代謝性酸中毒）、Cl⁻ 正常、anion gap 上升，符合中和性代謝性酸中毒（titrational metabolic acidosis）的特徵：有機酸積累（如乳酸、酮酸）消耗 HCO₃⁻，同時產生未測陰離子，造成 anion gap 升高。","we":["A. 分泌性代謝性酸中毒（secretory metabolic acidosis）：HCO₃⁻ 流失，Cl⁻ 升高，anion gap 正常，與本題 anion gap 上升不符。","（正確）B. 中和性代謝性酸中毒（titrational metabolic acidosis）：有機酸（乳酸、酮酸等）積累，HCO₃⁻ 下降，anion gap 升高，Cl⁻ 正常，符合本題所有指標，為正確答案。","C. 呼吸性酸中毒：PCO₂ 應升高，本題 PCO₂ 正常，不符。","D. 混合性酸中毒：需有兩種以上酸鹼異常同時存在，本題 PCO₂ 正常無呼吸成分，不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_076","year":2020,"roc_year":109,"session":"1","examNo":76,"q":"犬代謝性鹼中毒時，下列何者會上升？","opts":["A. 血漿HCO 3 - 值","B. 血清Cl - 值","C. 血清K + 值","D. 血清Na + 值"],"ans":0,"exp":"代謝性鹼中毒的特徵是血漿 HCO₃⁻ 升高（鹼基過多或酸流失），pH 升高，PaCO₂ 代償性升高。同時伴隨低血氯（Cl⁻ 降低）和低血鉀（K⁺ 降低，因 H⁺/K⁺ 交換），血鈉通常不特別升高。","we":["（正確）A. 血漿 HCO₃⁻ 值上升是代謝性鹼中毒的核心特徵，為正確答案。","B. 血清 Cl⁻ 值在代謝性鹼中毒時通常下降（低氯血症），不會上升。","C. 血清 K⁺ 值在代謝性鹼中毒時通常下降（低鉀血症），因 H⁺ 移出細胞，K⁺ 進入細胞。","D. 血清 Na⁺ 值在代謝性鹼中毒時無特定方向性改變，不是特徵性升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_077","year":2020,"roc_year":109,"session":"1","examNo":77,"q":"下列何種動物貧血時常須以骨髓檢查才能判斷其對貧血的反應？","opts":["A. 猴","B. 雞","C. 馬","D. 貓"],"ans":2,"exp":"馬（horse）貧血時末梢血液中幾乎不出現網織球，因此必須透過骨髓穿刺檢查（骨髓塗抹片）來評估其對貧血的再生反應（看紅血球系列前驅細胞的比例和型態）。","we":["A. 猴（靈長類）末梢血中可見網織球，可直接評估貧血反應。","B. 雞（鳥類）有有核紅血球，可透過不同成熟階段評估，通常不需骨髓。","（正確）C. 馬貧血時末梢血液不出現網織球，需骨髓檢查才能判斷再生反應，為正確答案。","D. 貓可見 aggregate 及 punctate 型網織球，末梢血評估可行。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_078","year":2020,"roc_year":109,"session":"1","examNo":78,"q":"承上題，此種動物在正常狀況下，血液具有下列何種特徵？","opts":["A. 紅血球常見大小不同症","B. 紅血球常見皺縮","C. 紅血球常見嗜鹼性斑點","D. 興奮時常見相對性多血症"],"ans":2,"exp":"承上題（馬），馬正常血液的特徵之一是紅血球常見嗜鹼性斑點（basophilic stippling），這是馬紅血球的正常變異，也可見於鉛中毒動物。馬紅血球亦常見串錢狀（rouleaux），但串錢狀並非選項，而嗜鹼性斑點是馬正常紅血球的典型特徵。","we":["A. 紅血球大小不同症（anisocytosis）是再生性貧血的特徵，不是馬正常血液的特徵。","B. 紅血球常見皺縮（crenation/echinocyte）通常因樣品採集或處理問題引起，不是馬的正常特徵。","（正確）C. 馬紅血球正常時常見嗜鹼性斑點（basophilic stippling），為馬正常血液特徵，為正確答案。","D. 興奮時常見相對性多血症（splenic contraction）確為馬的特徵，但本選項描述為「興奮時常見相對性多血症」，這也是馬的特徵。依考選部答案為 C。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1091_實診_079","year":2020,"roc_year":109,"session":"1","examNo":79,"q":"推估最可能發生下列何種問題？","opts":["A. 膽汁鬱滯","B. 犬傳染性肝炎","C. 亞鐵鹽中毒","D. 黃麴毒素中毒"],"ans":1,"exp":"此題為系列題，需配合前題情境（犬）。犬傳染性肝炎（Infectious Canine Hepatitis, ICH）由腺病毒一型（CAV-1）引起，可造成肝細胞壞死及特徵性的「藍眼」（前葡萄膜炎）、凝血障礙等，是需根據臨床及病理特徵推斷的答案。","we":["A. 膽汁鬱滯（cholestasis）通常 GGT 和 ALP 顯著升高，膽紅素升高，需結合其他指標。","（正確）B. 犬傳染性肝炎（ICH）：CAV-1 感染引起急性肝細胞壞死，符合系列題臨床情境，為正確答案（需看前題情境）。","C. 亞鐵鹽中毒（iron toxicosis）引起氧化性肝損傷，通常有明確的攝入史。","D. 黃麴毒素中毒（aflatoxicosis）引起肝壞死和出血，但通常與飼料污染相關。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1091_實診_080","year":2020,"roc_year":109,"session":"1","examNo":80,"q":"該犬血檢報告亦出現血清白蛋白、總蛋白與A/G ratio均偏低，且有禁食後低血糖的現象，這些結果顯示出肝臟功能區的大幅喪失，請進一步推估最有可能還會出現那些檢驗結果之異常？","opts":["A. AST偏高，GGT正常","B. 低膽固醇血症、進食後之高膽汁酸血症","C. SDH與LDH偏高","D. 高膽固醇血症、血鈣偏高"],"ans":1,"exp":"肝功能大幅喪失時，肝臟合成能力下降，會出現：低膽固醇血症（肝臟合成膽固醇減少）、進食後高膽汁酸血症（膽汁酸腸肝循環功能喪失）、低白蛋白和低總蛋白（已題目中提及）。高膽固醇和高血鈣不是肝功能不全的典型表現。","we":["A. AST 偏高（反映肝細胞損傷）可能有，但 GGT 在肝實質功能喪失時不一定正常；此組合不完整。","（正確）B. 低膽固醇血症（肝臟合成下降）+ 進食後高膽汁酸血症（肝臟清除膽汁酸功能喪失）是嚴重肝功能不全的典型表現，與題目所述白蛋白低、低血糖吻合，為正確答案。","C. SDH 與 LDH 偏高反映肝細胞損傷（壞死），但題目強調的是功能喪失（合成功能），此選項不是最佳答案。","D. 高膽固醇血症（cholestasis 時出現）和高血鈣不符合嚴重肝功能喪失的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_001","year":2020,"roc_year":109,"session":"2","examNo":1,"q":"下列為一母犬陰道抹片顯微鏡下細胞學檢查之結果:以副基底層細胞及小的中間層上皮細胞為主、少數非退行\r 性嗜中性球、不見紅血球。根據陰道抹片鏡檢之結果,推測此母犬最有可能屬於下列何發情期?","opts":["A. 乏情期(anestrus)","B. 發情前期(proestrus)","C. 發情期(estrus)","D. 發情後期 (metestrus)"],"ans":0,"exp":"乏情期（anestrus）陰道抹片以副基底層細胞（parabasal cells）及小的中間層細胞為主，嗜中性球少量且非退行性，無紅血球。發情前期以中間層細胞為主並有紅血球；發情期以角質化上皮細胞為主；發情後期有退行性嗜中性球及中間層細胞。","we":["（正確）乏情期以副基底層細胞及小中間層細胞為主、少數非退行性嗜中性球、不見紅血球，符合題目描述。","發情前期（proestrus）以中間層上皮細胞為主，並可見紅血球，不符題意。","發情期（estrus）以角質化、無核的表層細胞為主，幾乎不見嗜中性球，不符題意。","發情後期（metestrus）特徵為大量退行性嗜中性球及中間層細胞，不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_002","year":2020,"roc_year":109,"session":"2","examNo":2,"q":"欲採集眼結膜及瞬膜等組織做細胞學檢查,最適合使用下列何採樣法?","opts":["A. 組織壓印法(tissue imprints)","B. 細針抽取法(fine needle aspiration )","C. 組織刮取法(tissue scraping)","D. 灌洗法 (lavage)"],"ans":2,"exp":"眼結膜及瞬膜等表面組織最適合以組織刮取法（tissue scraping）採樣，可取得完整的上皮細胞及表面分泌物供細胞學檢查。壓印法適用於腫塊或切除組織；細針抽取適用於深部腫瘤；灌洗法適用於呼吸道或體腔。","we":["組織壓印法（tissue imprints）適用於腫塊切面或潰瘍表面，而非黏膜表面刮取，不是眼結膜的最佳方式。","細針抽取法（fine needle aspiration）適用於深部腫塊，對眼結膜表面不適合。","（正確）組織刮取法（tissue scraping）最適合眼結膜及瞬膜等黏膜表面，可獲得豐富上皮細胞。","灌洗法（lavage）適用於氣管、支氣管或腹腔等管腔，不適合眼結膜採樣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_003","year":2020,"roc_year":109,"session":"2","examNo":3,"q":"貓傳染性腹膜炎(feline ifectious peritonitis, FIP)之病畜,出現腹水時,其腹水最可能屬於下列何種滲液?","opts":["A. 純粹性漏出液","B. 修飾性漏出液","C. 非化膿性滲出液","D. 化膿性滲出液"],"ans":2,"exp":"FIP腹水屬於非化膿性滲出液（non-suppurative exudate），又稱為「滲出漏出液」，蛋白質含量高（>35 g/L）、有核細胞數中等偏少，以巨噬細胞及淋巴球為主，呈黃色黏稠狀。純粹漏出液蛋白質低；修飾性漏出液蛋白質中等；化膿性滲出液則有大量退行性嗜中性球。","we":["純粹性漏出液（pure transudate）蛋白質<25 g/L，細胞數極少，常見於低白蛋白血症，不符FIP特徵。","修飾性漏出液（modified transudate）蛋白質25–35 g/L，常見於心臟病或門脈高壓，不符FIP特徵。","（正確）FIP腹水為非化膿性滲出液，蛋白質高（>35 g/L）、Rivalta test陽性，有核細胞以巨噬細胞和淋巴球為主。","化膿性滲出液（suppurative exudate）以退行性嗜中性球為主，常見於細菌性腹膜炎，不符FIP特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_004","year":2020,"roc_year":109,"session":"2","examNo":4,"q":"母犬發情週期中,下列那一個時期持續時間最久?","opts":["A. 乏情期 (anestrus)","B. 發情前期(proestrus)","C. 發情期(estrus)","D. 發情後期 (metestrus)"],"ans":0,"exp":"母犬發情週期中，乏情期（anestrus）持續時間最久，約為4–5個月，佔整個發情週期的大部分。發情前期約9天，發情期約9天，發情後期約2個月。","we":["（正確）乏情期（anestrus）持續時間最長，約4–5個月，是母犬發情週期中最長的階段。","發情前期（proestrus）平均約9天，遠短於乏情期。","發情期（estrus）平均約9天，與發情前期相近，並非最長。","發情後期（metestrus）約2個月，雖然較長，但仍短於乏情期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_005","year":2020,"roc_year":109,"session":"2","examNo":5,"q":"複選題 5.正常之關節囊液中,淋巴球、單核球、巨噬細胞及上皮細胞約占總有核細胞數之多少百分比?","opts":["A. 70","B. 80","C. 90","D. 100"],"ans":2,"exp":"正常關節囊液中，淋巴球、單核球、巨噬細胞及上皮細胞（滑膜細胞）合計約占總有核細胞數的90%以上，嗜中性球應少於10%。當嗜中性球>10%時應懷疑炎症性關節疾病。","we":["70%偏低，正常關節囊液中單核細胞族群應占更高比例，不正確。","80%亦偏低，不符合正常關節囊液的細胞組成。","（正確）正常關節囊液中淋巴球、單核球、巨噬細胞及上皮細胞約占90%，嗜中性球少於10%。","100%不正確，正常關節囊液仍可見少數嗜中性球（<10%）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_006","year":2020,"roc_year":109,"session":"2","examNo":6,"q":"一般生理檢查項目,正常值範圍約可涵蓋多少比率該性別年齡群之健康動物的檢查結果值?","opts":["A. 38%","B. 68%","C. 95%","D. 99%"],"ans":2,"exp":"實驗室生理檢查之正常值範圍通常以平均值±2個標準差（mean±2SD）為基準，此範圍可涵蓋約95%的健康動物群體。這是統計學上常態分布的基本原則，68%對應±1SD，99%對應±3SD。","we":["38%不對應任何標準統計區間，此選項不正確。","68%對應平均值±1個標準差（±1SD），正常值範圍通常以±2SD為標準，不是此答案。","（正確）正常值範圍以mean±2SD定義，可涵蓋約95%的健康動物，為實驗室診斷慣例。","99%對應約±3SD，正常值定義若用此區間則過寬，不是標準做法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_007","year":2020,"roc_year":109,"session":"2","examNo":7,"q":"嗜氧性細菌培養之檢體應避免使用何種保存法?","opts":["A. 常溫法","B. 冰塊法","C. 冰袋法","D. 乾冰法"],"ans":3,"exp":"乾冰（-78°C）會使嗜氧性細菌凍死，破壞其活性，因此嗜氧菌培養檢體應避免使用乾冰保存。常溫、冰塊（0–4°C）或冰袋均可接受，其中常溫或冰塊為嗜氧菌短期運送的常用方式。","we":["常溫法適合短距離快速送檢，嗜氧菌可存活，不需避免。","冰塊法（0–4°C）可減緩細菌死亡及雜菌過度增生，可用於嗜氧菌保存。","冰袋法效果與冰塊類似，也是常用的保存方式。","（正確）乾冰溫度極低（-78°C），會凍傷並殺死嗜氧菌，嗜氧培養檢體絕對應避免乾冰保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_008","year":2020,"roc_year":109,"session":"2","examNo":8,"q":"擬作細菌學檢查用的糞便,應添加何種防腐劑?","opts":["A. 50%Z醇","B. 4%中性福馬林液","C. 10%中性福馬林液","D. 不應添加防腐劑"],"ans":3,"exp":"擬作細菌學檢查的糞便不應添加任何防腐劑，因為防腐劑（如福馬林、乙醇）會殺死細菌，干擾培養結果。若需保存，應低溫運送並盡快接種培養基。福馬林適用於寄生蟲學檢查，乙醇適用於組織固定，均不適用於細菌培養。","we":["50%乙醇會殺死細菌，不能用於細菌培養用糞便。","4%中性福馬林液會固定細胞，適合寄生蟲學檢查，不適合細菌培養。","10%中性福馬林液同樣會殺菌，適合組織病理固定，不適合細菌培養。","（正確）細菌學培養用糞便不應添加防腐劑，需直接低溫運送盡快培養。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_009","year":2020,"roc_year":109,"session":"2","examNo":9,"q":"有關抗凝血劑的敘述,下列何者正確?","opts":["A. oxalates抗凝的血液最常用於檢測血糖","B. heparin抗凝血液白血球染色性不佳","C. citrates通常用於血液酸鹼平衡及血液氣體檢查","D. sodium fluoride抗凝的血液最適合做為輸血用"],"ans":1,"exp":"Heparin（肝素）抗凝血液的白血球染色性不佳，因heparin會影響白血球細胞質及核的染色，造成分類困難，故不建議用heparin抗凝血液做白血球分類染色。Oxalate與citrate常用於凝血試驗；EDTA是CBC的標準抗凝劑；sodium fluoride抑制糖解酶，最常用於血糖測定而非輸血。","we":["Oxalates抗凝血液不常用於血糖測定；血糖測定常用sodium fluoride/oxalate混合管或sodium fluoride單獨使用。","（正確）Heparin抗凝血液白血球染色性不佳，細胞核染色偏藍，不適合做白血球分類計數。","Citrates通常用於凝血試驗（PT、APTT），不用於血液氣體或酸鹼平衡檢查。","Sodium fluoride抑制糖解酶保存血糖，並非用於輸血；輸血用血液使用ACD或CPD保存液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_010","year":2020,"roc_year":109,"session":"2","examNo":10,"q":"貓隻出生前體內的造血作用,最先發生於那個部位?","opts":["A. 脾臟","B. 卵黄囊","C. 肝臟","D. 骨髓"],"ans":1,"exp":"動物（包含貓）胚胎期造血最先發生在卵黃囊（yolk sac），此為原始造血（primitive hematopoiesis）階段，主要產生有核紅血球。隨後移至肝臟及脾臟（定型造血），最終在出生前後由骨髓取代成為主要造血器官。","we":["脾臟在胚胎期是造血的第二或第三個部位，並非最先發生造血的地方。","（正確）卵黃囊是胚胎期最早發生造血的部位，負責原始造血，產生有核紅血球。","肝臟是胚胎中期主要的造血器官，晚於卵黃囊開始造血。","骨髓是出生後最主要的造血器官，在胚胎期較晚期才開始承擔造血功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_011","year":2020,"roc_year":109,"session":"2","examNo":11,"q":"下列何種動物的正常紅血球形態為非雙凹圓盤狀,無核、薄而橢圓形的細胞,稱作elliptocytes?","opts":["A. 兔子","B. 鯉魚","C. 鸚鵡","D. 羊駝"],"ans":0,"exp":"兔子（rabbit）的正常紅血球形態為elliptocytes（橢圓形紅血球），屬無核、薄而橢圓形的細胞，非雙凹圓盤狀。魚類及鳥類紅血球有核；羊駝（camelid）紅血球為橢圓形且無核，亦稱elliptocytes，但題目中兔子最符合此描述。","we":["（正確）兔子正常紅血球為elliptocytes，呈橢圓形、無核、薄，不同於多數哺乳類的雙凹圓盤狀。","鯉魚等魚類紅血球有核，呈橢圓形，與題目描述「無核」不符。","鸚鵡等鳥類紅血球有核，呈橢圓形，與題目描述「無核」不符。","羊駝（llama/alpaca）紅血球也是橢圓形無核，但通常兔子是課本中elliptocytes的代表性舉例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_012","year":2020,"roc_year":109,"session":"2","examNo":12,"q":"下列何者不是造成初生動物生理性貧血之原因?","opts":["A. 在子宮內形成的紅血球生命半衰期較短","B. 紅血球生成素濃度較低,使紅血球生成減少","C. 肝臟脂肪含量較高,造成貧血","D. 新生動物吸收初乳蛋白時,因滲透壓作用,使得血管内液體量增加,造成貧血"],"ans":2,"exp":"造成初生動物生理性貧血的原因包括：子宮內形成的胎兒型紅血球壽命較短、出生後紅血球生成素濃度降低、初乳蛋白吸收造成血液稀釋效應。肝臟脂肪含量高並非造成生理性貧血的機制，此選項為錯誤說法。","we":["胎兒型紅血球（含HbF）生命半衰期確實較短，是生理性貧血的原因之一，故此選項正確、不選。","出生後EPO分泌減少，導致紅血球新生不足，是生理性貧血的原因之一，故此選項正確、不選。","（正確）肝臟脂肪含量高不會導致貧血，此說法錯誤，故為「不是」的原因，即本題正確答案。","新生動物吸收初乳後血漿容量增加，造成稀釋性貧血，此為真實機制，是造成生理性貧血的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_013","year":2020,"roc_year":109,"session":"2","examNo":13,"q":"鐵在血中的運送,主要必須依靠由何種器官合成之何種分子結台?","opts":["A. 由肝臟合成的α球蛋白之運鐵蛋白","B. 由肝臟合成的β球蛋白之運鐵蛋白","C. 由脾臟合成的α球蛋白之運鐵蛋白","D. 由脾臟合成的β球蛋白之運鐵蛋白 ."],"ans":1,"exp":"鐵在血液中的運送主要依靠由肝臟合成的運鐵蛋白（transferrin），其屬於β球蛋白（β-globulin）。運鐵蛋白與Fe3+結合（非Fe2+）進行運送。這是鐵代謝的重要知識點。","we":["肝臟合成運鐵蛋白正確，但運鐵蛋白屬於β球蛋白而非α球蛋白，故A選項錯誤。","（正確）運鐵蛋白（transferrin）由肝臟合成，屬β球蛋白，負責在血液中運送Fe3+。","運鐵蛋白由肝臟合成，非脾臟，故C選項錯誤。","運鐵蛋白由肝臟合成（非脾臟），且屬β球蛋白（非α球蛋白），故D選項雙重錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_014","year":2020,"roc_year":109,"session":"2","examNo":14,"q":"内出血時,流失的鐵及血漿蛋白會被身體再吸收利用。一般而言,體腔內出血發生后多久,大約2/3的紅血球\r 就會再進入淋巴系統?","opts":["A. 6〜12小時","B. 12~24小時","C. 24〜72小時","D. 72~96小時"],"ans":2,"exp":"體腔內出血（internal hemorrhage）後，紅血球會透過淋巴系統再吸收。一般而言，出血後約24–72小時，大約2/3的紅血球會再進入淋巴系統被再利用，其中的鐵與蛋白質也被回收。","we":["6–12小時過早，此時期紅血球才剛開始被巨噬細胞吞噬，尚未有大量再吸收。","12–24小時仍偏早，紅血球吸收程序尚未達到2/3的程度。","（正確）體腔出血後24–72小時，約2/3紅血球再進入淋巴系統，鐵及蛋白質被身體回收利用。","72–96小時偏晚，主要再吸收發生在24–72小時內。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_015","year":2020,"roc_year":109,"session":"2","examNo":15,"q":"氯黴素中毒所引起的貧血,是何種紅血球形成作用的缺陷?","opts":["A. 血紅質合成異常","B. 葉酸合成異常","C. 血球蛋白合成異常","D. 成熟異常"],"ans":0,"exp":"氯黴素（chloramphenicol）中毒引起的貧血屬於紅血球成熟異常中的血紅質（heme）合成異常。氯黴素抑制粒線體蛋白質合成，影響血紅質生成所需的δ-ALA合成酶，導致鐵粒幼紅血球性貧血（sideroblastic anemia）。","we":["（正確）氯黴素中毒抑制粒線體功能，干擾血紅質（heme）合成，造成鐵粒幼紅血球性貧血。","葉酸合成異常通常由磺胺類藥物或甲氨蝶呤等藥物引起，不是氯黴素的主要機制。","血球蛋白（globin）合成異常造成地中海型貧血，與氯黴素無關。","成熟異常（maturation defect）可見於維生素B12/葉酸缺乏，不是氯黴素的主要作用機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_016","year":2020,"roc_year":109,"session":"2","examNo":16,"q":"下列那些原因主要造成血管外溶血性貧血?①瀰漫性血管内凝血(DIC) ②蛇毒③紅斑性狼瘡④低磷血症","opts":["A. ①②","B. ②③","C. ①③","D. ③④"],"ans":3,"exp":"血管外溶血性貧血由免疫介導或氧化損傷引起，紅斑性狼瘡（SLE）透過免疫複合體破壞紅血球；低磷血症（hypophosphatemia）導致紅血球ATP不足，細胞膜破裂，均為血管外溶血原因。DIC和蛇毒主要造成血管內溶血（intravascular hemolysis）。","we":["DIC（①）主要造成血管內溶血，蛇毒（②）也是血管內溶血，組合①②不符題意。","蛇毒（②）造成血管內溶血，不符血管外溶血的定義，故②③組合不正確。","DIC（①）造成血管內溶血，不符血管外溶血，故①③組合不正確。","（正確）紅斑性狼瘡（③）透過免疫介導、低磷血症（④）透過ATP不足，均造成血管外溶血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_017","year":2020,"roc_year":109,"session":"2","examNo":17,"q":"有關鐵代謝之敘述,下列何者正確?","opts":["A. 運鐵蛋白是與Fe 2+ 結合","B. 動物缺氧時對鐵的吸收增加","C. 體內大部分的鐵以鐵蛋白(ferritin)存在巨噬細胞內","D. 血紅質(heme)合成過程會攝人Fe 3+"],"ans":1,"exp":"動物缺氧時（如高海拔、貧血），腸道對鐵的吸收會增加，以補充造血所需。運鐵蛋白與Fe3+結合（非Fe2+）；體內大部分鐵以血紅蛋白存在於紅血球中（非鐵蛋白）；血紅質合成攝入Fe2+（非Fe3+）。","we":["運鐵蛋白（transferrin）與Fe3+結合，而非Fe2+，故A選項錯誤。","（正確）動物缺氧時腸道對鐵的吸收增加，以支持增加的紅血球生成需求。","體內大部分的鐵以血紅蛋白（hemoglobin）形式存在於紅血球中，鐵蛋白（ferritin）是儲存形式，主要在肝細胞，不是巨噬細胞內的主要儲存。","血紅質合成過程攝入的是Fe2+，Fe3+必須先被還原為Fe2+才能進入血紅質合成途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_018","year":2020,"roc_year":109,"session":"2","examNo":18,"q":"健康動物骨髄之紅血細胞系(erythroidseries),90%為下列何種細胞?","opts":["A. 前紅血細胞(prorubricyte)和紅血細胞(rubricyte)","B. 紅血胚細胞(rubriblast和前紅血細胞(prorubricyte)","C. 紅血細胞(rubricyte)和後紅血細胞(metarubricyte)","D. 紅血胚細胞(rubriblast)、前紅血細胞(prorubricyte)和紅血細胞(rubricyte)"],"ans":2,"exp":"健康動物骨髓紅血細胞系中，rubricyte（晚幼紅血球）和metarubricyte（晚晚幼紅血球）合計約占90%，因為這兩個階段是紅血球成熟過程中最終分裂與去核的主要階段，數量最多。早期前驅細胞（rubriblast、prorubricyte）數量較少。","we":["prorubricyte和rubricyte的組合中，prorubricyte數量不多，不構成90%的主體。","rubriblast和prorubricyte均為早期前驅細胞，數量少，不可能占90%。","（正確）rubricyte（中幼紅血球）和metarubricyte（晚幼紅血球）合計約占骨髓紅血細胞系的90%。","rubriblast屬最早期，數量極少，加上prorubricyte和rubricyte三者組合反而混淆，且不符90%比例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_019","year":2020,"roc_year":109,"session":"2","examNo":19,"q":"缺乏變性血紅素還原酶,黏膜最易呈現何種顏色?","opts":["A. white","B. yellow","C. brown","D. pale"],"ans":2,"exp":"變性血紅素還原酶（methemoglobin reductase）缺乏時，血紅素被氧化為高鐵血紅蛋白（methemoglobin，Fe3+），無法攜氧，黏膜呈現褐色（brown）。高鐵血紅蛋白症患者黏膜顏色特徵性為巧克力褐色，而非蒼白、黃色或白色。","we":["White（白色）黏膜見於嚴重貧血或休克，不是高鐵血紅蛋白症的特徵。","Yellow（黃色）黏膜見於黃疸（膽紅素沉積），不是高鐵血紅蛋白症的特徵。","（正確）缺乏methemoglobin reductase導致高鐵血紅蛋白累積，黏膜呈現褐色（chocolate brown）。","Pale（蒼白）見於一般性貧血，不是高鐵血紅蛋白症的典型顏色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_020","year":2020,"roc_year":109,"session":"2","examNo":20,"q":"下列何種細胞不屬於單核吞噬細胞系?","opts":["A. 滲出液中之histiocytes","B. 肝臓中之Kupffer cells","C. 骨組織中之osteoblast","D. 神經系統中之microglia cells"],"ans":2,"exp":"單核吞噬細胞系（mononuclear phagocyte system）包含組織中的巨噬細胞（histiocytes）、肝臟Kupffer cells、神經系統microglia cells、骨組織破骨細胞（osteoclast）等。Osteoblast（成骨細胞）是成骨細胞，不屬於單核吞噬細胞系，不具吞噬功能。","we":["滲出液中的histiocytes為組織巨噬細胞，屬單核吞噬細胞系。","肝臟中的Kupffer cells是肝臟定居型巨噬細胞，屬單核吞噬細胞系。","（正確）Osteoblast（成骨細胞）負責骨基質合成，不具吞噬功能，不屬於單核吞噬細胞系；骨組織的吞噬細胞應為osteoclast（破骨細胞）。","神經系統中的microglia cells是中樞神經系統的常駐巨噬細胞，屬單核吞噬細胞系。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_021","year":2020,"roc_year":109,"session":"2","examNo":21,"q":"牛搬運熱肺炎(shipping fever pneumonia)早期,常僅有輕微或無嗜中性球反應,下列何者可能是此時期主要\r 實驗室診斷之異常?","opts":["A. 單核球數量增加","B. 淋巴球數量增加","C. γ-球蛋白升高","D. 纖維素原濃度升高"],"ans":3,"exp":"牛搬運熱肺炎早期，由於感染（Mannheimia haemolytica等）觸發急性期反應，纖維素原（fibrinogen）是最早且最靈敏的急性期蛋白之一，在嗜中性球尚未明顯增加之前即可升高，是此時期最具診斷意義的異常值。","we":["單核球數量增加並非牛搬運熱肺炎早期最主要的實驗室異常。","淋巴球增多不是急性感染早期的特徵；急性感染通常造成淋巴球相對減少。","γ-球蛋白升高屬於慢性感染或免疫刺激後的反應，在早期尚未升高。","（正確）纖維素原（fibrinogen）是靈敏的急性期蛋白，在牛感染早期、嗜中性球反應出現前即顯著升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_022","year":2020,"roc_year":109,"session":"2","examNo":22,"q":"下列那些是退行性核左轉的主要特徵?①嗜中性球總數正常或偏低②嗜中性球增多症③成熟嗜中性球較\r 多 ④未成熟嗜中性球較多","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":1,"exp":"退行性核左轉（degenerative left shift）的特徵為嗜中性球總數正常或偏低（非增多）、且未成熟嗜中性球（桿狀核等）比成熟嗜中性球（分葉核）多，表示骨髓已無法充分供應成熟嗜中性球，預後較差。①嗜中性球總數正常或偏低 + ④未成熟較多，對應選項B（①④）。","we":["①③組合代表嗜中性球總數正常/偏低但成熟細胞較多，不符退行性核左轉（未成熟應較多）。","（正確）退行性核左轉特徵：①嗜中性球總數正常或偏低 + ④未成熟嗜中性球較多，預後差。","②③代表嗜中性球增多且成熟較多，此為再生性核左轉（regenerative left shift），非退行性。","②④代表嗜中性球增多且未成熟較多，此為再生性核左轉，非退行性核左轉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_023","year":2020,"roc_year":109,"session":"2","examNo":23,"q":"下圖中箭頭所指最可能是何種形態的白血球?","opts":["A. 過度分葉的嗜中性球","B. 脫顆粒的嗜酸性球","C. 單核球","D. 毒性反應的嗜中性球"],"ans":3,"exp":"題目描述圖中箭頭所指細胞，此題為圖題（needs_review保留）。毒性反應的嗜中性球（toxic neutrophil）特徵包括細胞質嗜鹼性增加（diffuse basophilia）、Döhle bodies、毒性顆粒（toxic granulation）及空泡化，在嚴重感染或炎症時出現。","we":["過度分葉嗜中性球（hypersegmented neutrophil）核葉>5葉，見於慢性炎症或維生素B12/葉酸缺乏，不具毒性顆粒。","脫顆粒嗜酸性球（degranulated eosinophil）顆粒消失、細胞質空泡化，不符毒性嗜中性球特徵。","單核球（monocyte）核呈馬蹄形或腎形，細胞質灰藍色有細顆粒，核形態與嗜中性球不同。","（正確）毒性反應嗜中性球具有細胞質嗜鹼性、Döhle bodies、毒性顆粒等特徵，為嚴重炎症時的反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_024","year":2020,"roc_year":109,"session":"2","examNo":24,"q":"有關嗜中性球毒性變化之敘述,下列何者正確?","opts":["A. 在過度分葉的嗜中性球最易觀察到","B. 特發在馬缺乏鈷時","C. 貓較常呈現羅列小體","D. 長期跳蚤寄生時可見"],"ans":2,"exp":"貓（cat）較常在嗜中性球中觀察到Döhle bodies（羅列小體），此為貓特發性的毒性變化表現，即使無嚴重感染也常見。毒性嗜中性球的變化主要在杆狀核或年輕嗜中性球中觀察，而非過度分葉細胞。","we":["毒性變化最易在未成熟（桿狀核）嗜中性球觀察到，而非過度分葉的嗜中性球，故A選項錯誤。","嗜中性球毒性變化與缺鈷無關，缺鈷（cobalt）在反芻獸與維生素B12合成有關，故B選項錯誤。","（正確）貓較常呈現Döhle bodies（羅列小體），此為貓嗜中性球中常見的毒性指標。","長期跳蚤寄生通常造成嗜酸性球增多症或過敏反應，不會直接導致嗜中性球毒性變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_025","year":2020,"roc_year":109,"session":"2","examNo":25,"q":"有關plasma cell myeloma之敘述,下列何者正確?","opts":["A. 好發於年幼動物","B. 低球蛋白血症是其標誌","C. 會阻礙止血作用","D. 常見低鈣血症"],"ans":2,"exp":"Plasma cell myeloma（漿細胞骨髓瘤）特徵包括：好發於老年動物（非年幼）、單株性高球蛋白血症（而非低球蛋白血症）、可阻礙止血功能（M蛋白干擾血小板功能及凝血因子）、常見高鈣血症（非低鈣血症）。","we":["漿細胞骨髓瘤好發於中老年動物（犬平均約9歲），而非年幼動物。","漿細胞骨髓瘤特徵為單株性高球蛋白血症（monoclonal gammopathy），而非低球蛋白血症。","（正確）漿細胞骨髓瘤產生的M蛋白可干擾血小板功能及凝血因子，阻礙正常止血作用。","漿細胞骨髓瘤常見高鈣血症（PTHrP分泌或骨溶解），而非低鈣血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_026","year":2020,"roc_year":109,"session":"2","examNo":26,"q":"一般動物的骨髓約儲存有幾天份的嗜中性球供應量?","opts":["A. 2","B. 5","C. 8","D. 10"],"ans":1,"exp":"一般動物的骨髓中儲存有約5天份的嗜中性球供應量（maturation-storage pool），包含桿狀核及分葉核嗜中性球。這個儲存池在急性需求時（如嚴重感染）可快速釋放，解釋為何感染後短期內可見白血球顯著升高。","we":["2天份的儲存量低估了骨髓的儲存能力，不正確。","（正確）骨髓儲存約5天份的嗜中性球，包含成熟及未成熟嗜中性球，可在急性需求時釋放。","8天份高估了儲存量，不符合一般教科書數據。","10天份亦高估儲存量，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_027","year":2020,"roc_year":109,"session":"2","examNo":27,"q":"下列何種細胞之細胞質染成深藍色,偶而可見淡色之高爾基小體,其核與正常淋巴球相似,核染質呈聚集?","opts":["A. macrophage","B. immunocyte","C. mast cell","D. rubriblast"],"ans":1,"exp":"題目描述的細胞特徵（細胞質深藍色、偶見淡色高爾基小體、核染質聚集、與正常淋巴球核相似）符合immunocyte（免疫細胞，即活化的B淋巴球或漿細胞前身）。Macrophage核為腎形；mast cell有大量紫色顆粒；rubriblast核仁明顯。","we":["Macrophage細胞質呈灰藍色或泡沫狀，核呈腎形或馬蹄形，不符題目描述。","（正確）Immunocyte（活化淋巴球/漿細胞前身）：細胞質深藍色、偶見高爾基小體淡區、核染質聚集，符合描述。","Mast cell細胞質充滿大量紫色異染性顆粒，核通常圓形且被顆粒遮蓋，不符描述。","Rubriblast（紅血胚細胞）核仁明顯、細胞質深藍色但核為圓形且有核仁，不符題目「核染質聚集」特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_028","year":2020,"roc_year":109,"session":"2","examNo":28,"q":"維生素K不足引起的血流不止,是屬於何種原因的止血障礙?","opts":["A. 血管壁有缺陷","B. 血小板減少症","C. 血小板功能缺陷","D. 凝血因子不足"],"ans":3,"exp":"維生素K不足影響凝血因子II、VII、IX、X（維生素K依賴性凝血因子）的活化，屬於凝血因子不足導致的止血障礙。此為外源性及共同凝血途徑的問題，會造成PT及APTT延長。","we":["血管壁缺陷（如維生素C缺乏）造成出血，與維生素K無關。","血小板減少症屬一次性止血障礙，出現出血點（petechiae），與維生素K無關。","血小板功能缺陷（如vonWillebrand disease）影響一次性止血，與維生素K依賴性凝血因子無關。","（正確）維生素K是凝血因子II、VII、IX、X羧化活化所必需，缺乏時這些凝血因子無活性，導致出血不止。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_029","year":2020,"roc_year":109,"session":"2","examNo":29,"q":"下列凝血障礙鑑别試驗中,何者用於評估形成初級血栓的能力?","opts":["A. 全血凝固時間(whole blood clotting time )","B. 凝血塊收縮能力(clot retraction)","C. 凝血酶時間(thrombin time)","D. 活化凝血時間(activated coagulation time )"],"ans":1,"exp":"凝血塊收縮能力（clot retraction）評估血小板透過收縮蛋白（thrombosthenin）收縮纖維蛋白凝塊的能力，反映血小板數量與功能，用於評估初級血栓形成能力。全血凝固時間和ACT評估整體凝血；凝血酶時間評估纖維蛋白原。","we":["全血凝固時間（whole blood clotting time）評估整體凝血，但不專門評估初級血栓（血小板栓子）。","（正確）凝血塊收縮能力（clot retraction）反映血小板功能，用於評估形成初級血栓（platelet plug）的能力。","凝血酶時間（thrombin time）評估纖維蛋白原至纖維蛋白的轉化，屬二次性止血評估。","活化凝血時間（ACT）評估內源性及共同凝血途徑，不直接評估初級血栓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_030","year":2020,"roc_year":109,"session":"2","examNo":30,"q":"血管內皮細胞損傷時,下列何種情形會導致其無法維持完整而呈現多孔化,並出現出血點?","opts":["A. 血小板減少症","B. 鈣離子不足","C. 低纖維素原血症","D. 第X凝血因子不足"],"ans":0,"exp":"血管內皮細胞損傷時，正常情況下需要血小板貼附修補損傷部位以維持血管完整性。當血小板減少症（thrombocytopenia）發生時，血小板無法填補損傷孔洞，導致血管多孔化並出現出血點（petechiae）。這是血小板減少症的典型臨床表現。","we":["（正確）血小板減少症時，血小板無法填補血管內皮損傷部位，造成血管多孔化及出血點，是血小板減少最典型的表現。","鈣離子不足影響凝血因子活化（二次性止血），不直接造成血管多孔化及出血點。","低纖維素原血症影響二次性止血及凝塊形成，不造成典型出血點。","第X凝血因子不足屬二次性止血缺陷，造成深部組織出血及血腫，不是出血點的典型原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_031","year":2020,"roc_year":109,"session":"2","examNo":31,"q":"下國為一低白蛋白血症(總蛋白量3.5gm/dL)隻之血清蛋白質電泳圖，此犬最可能罹患下列何種疾病?","opts":["A. 毛囊蟲症","B. 腎病症候群","C. 漿細胞性骨髓瘤","D. 腹膜炎"],"ans":1,"exp":"題目描述低白蛋白血症（總蛋白3.5 g/dL）並附血清蛋白電泳圖，腎病症候群（nephrotic syndrome）特徵為大量蛋白質（尤其是白蛋白）經腎臟流失，導致低白蛋白血症，同時β球蛋白帶可能升高（因脂蛋白增加代償）。","we":["毛囊蟲症（demodicosis）主要造成皮膚問題，偶爾繼發感染造成高球蛋白，不是低白蛋白血症的典型原因。","（正確）腎病症候群（nephrotic syndrome）大量白蛋白由腎臟流失，造成低白蛋白血症，為此電泳圖的最佳診斷。","漿細胞性骨髓瘤（plasma cell myeloma）造成高球蛋白血症（M蛋白峰），不造成低白蛋白血症為主要表現。","腹膜炎（peritonitis）造成急性期反應、白蛋白降低和α/β球蛋白升高，但程度通常不如腎病症候群明顯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_032","year":2020,"roc_year":109,"session":"2","examNo":32,"q":"下列那項檢測值較不會受到使用類固醇藥物之影響?","opts":["A. ALT","B. ALP","C. glucose","D. ammonia"],"ans":3,"exp":"類固醇（糖皮質素）使用會顯著升高ALP（誘導類固醇誘導型ALP同功酶）、ALT（輕度升高）及血糖（促進糖質新生）。Ammonia（血氨）的代謝主要與肝臟尿素循環有關，不受類固醇直接影響，故血氨較不受類固醇影響。","we":["ALT在使用類固醇後常見輕度至中度升高，受到類固醇影響。","ALP（尤其犬的類固醇誘導型ALP同功酶）在使用類固醇後會顯著升高，受影響最大。","Glucose（血糖）在使用類固醇後會升高（類固醇促進糖質新生），明顯受影響。","（正確）Ammonia（血氨）的代謝依賴肝臟尿素循環，不直接受類固醇影響，是最不受類固醇影響的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_033","year":2020,"roc_year":109,"session":"2","examNo":33,"q":"急性炎症反應物(如haptoglobi)會出現在蛋白質電泳圖之那個球蛋白帶?","opts":["A. α","B. β 1","C. β 2","D. γ"],"ans":0,"exp":"急性炎症反應物（acute phase proteins）如haptoglobin（結合珠蛋白）、α1-antitrypsin、α2-macroglobulin等在電泳圖中出現在α球蛋白帶（alpha globulin band）。急性期反應時α球蛋白帶升高是急性炎症的典型電泳特徵。","we":["（正確）Haptoglobin等急性期反應蛋白屬於α球蛋白，在電泳圖中出現在α帶，急性炎症時此帶升高。","β1球蛋白帶主要包含transferrin等蛋白質，不是主要的急性期反應蛋白帶。","β2球蛋白帶主要包含補體蛋白（C3、C4）等，急性期有所升高但不是主要急性期蛋白所在帶。","γ球蛋白帶升高代表慢性炎症或免疫刺激，不是急性炎症早期的主要反應帶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_034","year":2020,"roc_year":109,"session":"2","examNo":34,"q":"有關造成動物高脂血症之機制,下列何者最正確?","opts":["A. 食後性的高脂血症,通常見於正常動物攝入高脂肪性食物後的4小時後","B. 禁食後的高脂血症是體內脂肪的移入","C. 貓的腎上腺皮質功能低下會造成高脂血症","D. 罹患甲狀腺功能亢進的動物曾有血脂偏高的現象"],"ans":1,"exp":"禁食後的高脂血症（fasting hyperlipidemia）反映體內儲存脂肪的動員（脂肪分解），是體內脂肪的「移出」（mobilization from adipose tissue），而非「移入」。食後性高脂血症通常在攝入高脂食物後2–6小時達到高峰。","we":["食後性高脂血症通常在攝入高脂肪食物後2–6小時（非4小時後）最明顯，「4小時後」的說法不夠精確，且正常動物在禁食12小時後應恢復正常。","（正確）禁食後的高脂血症反映體脂肪的動員（移出），NEFA及三酸甘油酯升高，是正確描述。","貓腎上腺皮質功能低下（hypoadrenocorticism）並不是造成高脂血症的常見原因；甲狀腺功能低下才是。","甲狀腺功能亢進通常導致脂質分解加速，造成血脂偏低，而非偏高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_035","year":2020,"roc_year":109,"session":"2","examNo":35,"q":"下列何種動物的高密度脂蛋白(high-density lipoprotein,HDL)不是其血漿脂蛋白中比率最高的?","opts":["A. 馬","B. 犬","C. 雄性鳥類","D. 豬"],"ans":3,"exp":"豬（pig）血漿脂蛋白中，LDL（低密度脂蛋白）比例最高，而非HDL。犬、貓、馬、及大多數哺乳類動物以HDL為主要血漿脂蛋白，但豬類似於人類，以LDL為主。雄性鳥類以HDL為主。","we":["馬血漿脂蛋白以HDL為主，HDL是其比率最高的脂蛋白，故馬不是本題答案。","犬血漿脂蛋白以HDL為主，故犬不是本題答案。","雄性鳥類血漿以HDL為主要脂蛋白，故雄性鳥類不是本題答案。","（正確）豬的血漿脂蛋白以LDL為主（類似人類），HDL並非比率最高，故豬是本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_036","year":2020,"roc_year":109,"session":"2","examNo":36,"q":"有關動物體內酮體之測定,下列敘述何者錯誤?","opts":["A. 酮體包含acetoacetate ~beta-hydroxybutyrate及acetone三種","B. 糖尿病病畜之酮血症主要由beta-hydroxybutyrate所致","C. 定性試驗採用硝基氫酸鹽反應(nitroprusside reaction時,對acetoacetate具有特異性反應","D. 犬血中之beta-hydroxybutyrate濃度高於1.8mmolL時,可診斷為酮酸中毒"],"ans":3,"exp":"犬血中β-hydroxybutyrate濃度高於3.0 mmol/L（非1.8 mmol/L）時可診斷為酮酸中毒。1.8 mmol/L是犬酮症（ketonemia）的臨界值，不是酮酸中毒的診斷值。其餘選項均正確：酮體三種成分正確；糖尿病酮血症以β-HBA為主；nitroprusside reaction對acetoacetate具特異性。","we":["酮體包含acetoacetate、β-hydroxybutyrate及acetone三種，此為正確描述，不是錯誤選項。","糖尿病病畜酮血症以β-hydroxybutyrate為主（占80–85%），此為正確描述，不是錯誤選項。","Nitroprusside reaction（Rothera test）對acetoacetate（乙醯乙酸）具特異性，不與β-HBA反應，此為正確描述，不是錯誤選項。","（正確）犬血中β-hydroxybutyrate >3.0 mmol/L才可診斷酮酸中毒，「1.8 mmol/L」為錯誤的診斷閾值，故D為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_037","year":2020,"roc_year":109,"session":"2","examNo":37,"q":"糖尿病病畜之酮血症主要由何種酮體造成?","opts":["A. 酮醋酸鹽","B. β-羥丁酸鹽","C. 丙酮","D. 乙醯乙酸輔酶A"],"ans":1,"exp":"糖尿病病畜酮血症中，β-羥丁酸鹽（β-hydroxybutyrate，β-HBA）占酮體總量約80–85%，是主要的酮體。Acetoacetate約10–15%，acetone最少。注意nitroprusside試紙條只能檢測acetoacetate，因此試紙陰性不能排除以β-HBA為主的酮血症。","we":["酮醋酸鹽（acetoacetate）雖是酮體之一，但在糖尿病酮血症中只占約10–15%，非主要酮體。","（正確）β-羥丁酸鹽（β-hydroxybutyrate）占糖尿病酮血症中酮體總量的80–85%，為最主要的酮體。","丙酮（acetone）在血液中含量最少，由acetoacetate自發脫羧生成，揮發性強。","乙醯乙酸輔酶A（acetoacetyl-CoA）是酮體合成的中間產物，不是循環中的酮體形式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_038","year":2020,"roc_year":109,"session":"2","examNo":38,"q":"有關瀰漫性肝脂肪變性之敘述,下列何者最正確?","opts":["A. 在馬及牛可能會引發肝腦病","B. 會造成血清白蛋白及凝血因子的降低","C. 通常僅發生在肝小葉的中心","D. 慢性化之後肝臌會自行修復"],"ans":1,"exp":"瀰漫性肝脂肪變性（diffuse hepatic lipidosis）嚴重時肝臟合成功能下降，導致血清白蛋白及凝血因子（由肝臟合成）降低。馬及牛出現肝腦病較少，貓發生肝脂肪症時容易進展為肝腦病；脂肪肝通常累及整個肝小葉（非僅中心）；慢性脂肪肝不會自行修復。","we":["肝腦病（hepatic encephalopathy）在馬及牛的肝脂肪變性中少見，貓的肝脂肪症才是典型案例，故A選項不正確。","（正確）瀰漫性肝脂肪變性使肝臟合成功能受損，造成血清白蛋白及凝血因子（II、V、VII、X等）降低。","肝脂肪變性通常先累及肝小葉中心（缺氧區），但嚴重時為瀰漫性，並非「僅在中心」，故C選項不完整。","慢性肝脂肪化最終可能進展為肝硬化，不會自行修復，故D選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_039","year":2020,"roc_year":109,"session":"2","examNo":39,"q":"下列何者較不易造成低白蛋白血症?","opts":["A. 腸道寄生蟲感染","B. 急性肝病","C. 燒燙傷","D. 蛋白質流失性腎病"],"ans":1,"exp":"急性肝病（acute hepatic disease）時，肝臟白蛋白合成功能在短期內不會立即下降（白蛋白半衰期約8–14天），因此急性肝病較不易立即造成低白蛋白血症。慢性肝病才會顯著造成低白蛋白血症。腸道寄生蟲、燒燙傷（蛋白質由皮膚流失）及蛋白質流失性腎病均是低白蛋白血症的常見原因。","we":["腸道寄生蟲感染造成腸道蛋白質流失及吸收不良，可導致低白蛋白血症。","（正確）急性肝病時白蛋白合成功能未立即受損（白蛋白半衰期長），較不易造成低白蛋白血症；慢性肝病才是主因。","燒燙傷造成大量蛋白質（包括白蛋白）由皮膚流失，可快速導致低白蛋白血症。","蛋白質流失性腎病（protein-losing nephropathy）是低白蛋白血症的典型原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_040","year":2020,"roc_year":109,"session":"2","examNo":40,"q":"下列何者較可能為慢性肝病發生時會觀察到的現象?","opts":["A. ALT及AST顯著上升","B. 高白蛋白血症","C. 高球蛋白血症","D. 禁食後仍然發生高血糖現象"],"ans":2,"exp":"慢性肝病時，肝臟合成白蛋白的能力下降，但單核吞噬細胞系及B淋巴球仍持續受到抗原刺激，產生較多γ球蛋白，故出現高球蛋白血症（polyclonal gammopathy）。ALT/AST在慢性肝病中可能因肝細胞數量減少而不再顯著升高；白蛋白下降（非升高）；低血糖（非高血糖）為慢性肝病的特徵。","we":["慢性肝病時，存活的肝細胞數量減少，ALT/AST可能不再顯著升高（與急性肝病不同），故A選項不符。","慢性肝病造成白蛋白合成下降，出現低白蛋白血症，而非高白蛋白血症，故B選項錯誤。","（正確）慢性肝病時，高球蛋白血症（polyclonal）常見，原因為肝臟免疫調節功能下降，持續免疫刺激所致。","慢性肝病時肝糖合成及儲存功能下降，禁食後容易出現低血糖，而非高血糖，故D選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_041","year":2020,"roc_year":109,"session":"2","examNo":41,"q":"下列何者最容易造成肝小葉中心性病變?","opts":["A. 馬志賀菌病","B. 黄麹毒素中毒","C. 綿羊的硒中毒","D. 心臟功能不足"],"ans":3,"exp":"心臟功能不足（cardiac insufficiency）導致靜脈回流障礙，肝小葉中心靜脈（central vein）周圍最先發生充血及缺氧，造成肝小葉中心性病變（centrilobular lesion）。馬志賀菌及黃麴毒素造成門脈周圍性病變；綿羊硒中毒造成瀰漫性病變。","we":["馬志賀菌病（Tyzzer's disease）主要造成門脈周圍性肝壞死（periportal necrosis），不是中心性病變。","黃麴毒素中毒（aflatoxicosis）主要造成門脈周圍性脂肪變性及壞死，不是中心性病變。","綿羊硒中毒造成瀰漫性肝細胞壞死，不是特異性的中心性病變。","（正確）心臟功能不足造成靜脈鬱血，肝小葉中心靜脈周圍氧氣最少，最易發生中心性充血性壞死（congestive centrilobular necrosis）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_042","year":2020,"roc_year":109,"session":"2","examNo":42,"q":"下列何犬種曾被報告在無肝病及類固醇治療下,血檢仍可出現極高的鹼磷酶(ALP)活性值?","opts":["A. 北京犬","B. 薩摩犬","C. 蘇格蘭梗犬","D. 西施犬"],"ans":2,"exp":"蘇格蘭梗犬（Scottish Terrier）已被報告在無肝病及無類固醇治療的情況下，血液中ALP活性可極高，可能超過正常上限的數百倍，原因目前不完全清楚，可能與特殊的ALP同功酶有關，為此犬種特有現象。","we":["北京犬（Pekingese）未被特別報告有此特殊高ALP現象。","薩摩犬（Samoyed）未被特別報告有此特殊高ALP現象。","（正確）蘇格蘭梗犬（Scottish Terrier）為已知在無肝病及類固醇使用下仍可出現極高ALP的特殊犬種。","西施犬（Shih Tzu）未被特別報告有此特殊高ALP現象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_043","year":2020,"roc_year":109,"session":"2","examNo":43,"q":"有關肝病變之敘迹,下列何者最正確?","opts":["A. 綿羊的硒中毒會造成脂肪肝","B. 犬傳染性肝炎會造成大量的肝細胞壞死","C. 嚴重貧血的動物最易出現門脈周圍性periportal)的肝小葉病變","D. 乾性貓傳染性腹膜炎容易引發瀰漫性肝脂肪變性"],"ans":1,"exp":"犬傳染性肝炎（infectious canine hepatitis，ICH，由腺病毒CAV-1引起）會造成大量的肝細胞壞死（massive hepatic necrosis）、肝出血及肝臟腫大，是其病理特徵。綿羊硒中毒造成白肌病（脂肪肝不是主要特徵）；缺氧動物最易出現中心性病變；乾性FIP主要影響中樞神經及眼睛，而非肝臟脂肪變性。","we":["綿羊硒中毒（selenium toxicity）主要造成脂肪肝是不正確的；硒缺乏才造成白肌病，硒中毒主要影響蹄葉及神經。","（正確）犬傳染性肝炎（CAV-1）造成大量肝細胞壞死，為其特徵性病理變化，包含出血性肝壞死。","嚴重貧血造成組織缺氧，最易影響肝小葉中心性（centrilobular）缺氧性壞死，而非門脈周圍性病變。","乾性FIP（dry FIP）主要影響眼睛、神經系統及肉芽腫性炎症，不以瀰漫性肝脂肪變性為特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_044","year":2020,"roc_year":109,"session":"2","examNo":44,"q":"有關膽汁酸之敘迹,下列何者錯誤?","opts":["A. 犬之禁食膽汁酸濃度大於25μmo1/L時,應懷疑是否有肝功能異常","B. 在犬貓罹患膽汁鬱積相關疾病時,循環中膽紅素濃度上升通常出現在膽汁酸濃度上升之前","C. 膽汁酸濃度在反芻獸並非肝臟疾病之良好指標,因其正常值變異較大","D. 膽汁酸濃度在鳥類之應用與哺乳類類似"],"ans":1,"exp":"在犬貓罹患膽汁鬱積相關疾病時，膽汁酸濃度升高通常比膽紅素升高更早出現，因為肝臟對膽汁酸的清除能力在肝功能輕微受損時就已下降，而膽紅素血症需要更嚴重的肝功能損傷才會出現。因此「膽紅素先升高」的說法錯誤。","we":["犬禁食膽汁酸>25 μmol/L應懷疑肝功能異常，此為正確描述，不是錯誤選項。","（正確）在膽汁鬱積疾病中，膽汁酸濃度升高通常早於膽紅素濃度升高，而非「膽紅素先升高」，故B選項描述錯誤。","反芻獸膽汁酸正常值變異大，其在肝病診斷上的應用不如犬貓可靠，此為正確描述，不是錯誤選項。","膽汁酸檢測在鳥類的應用與哺乳類相似，均可反映肝功能狀態，此為正確描述，不是錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_045","year":2020,"roc_year":109,"session":"2","examNo":45,"q":"已結紮之母臘腸犬呈現腹圍膨大、PU/PD、肥胖、全身性脫毛、無膽紅素尿,經確診為腎上腺皮質功能亢\r 進。該犬下列何種測定值可能顯著上升,甚至達到正常值之200倍?","opts":["A. 血氨","B. ALP","C. biliverdin","D. GGT"],"ans":1,"exp":"腎上腺皮質功能亢進（hyperadrenocorticism，Cushing's disease）在犬會顯著誘導類固醇誘導型ALP同功酶（corticosteroid-induced ALP）的合成，使血清ALP活性可升高至正常值的200倍以上。這是犬Cushing's disease的特徵性實驗室異常，診斷敏感性高。","we":["血氨（ammonia）升高與肝功能不全或門脈分流有關，不是腎上腺皮質功能亢進的特徵。","（正確）腎上腺皮質功能亢進誘導類固醇誘導型ALP同功酶大量合成，ALP可升高達正常值200倍，是犬Cushing's病的重要診斷指標。","Biliverdin是膽綠素，與膽道疾病有關，不是腎上腺皮質功能亢進的特徵。","GGT（γ-glutamyltransferase）在膽汁鬱積或類固醇使用時可升高，但升高幅度遠不如ALP，不是最顯著的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_046","year":2020,"roc_year":109,"session":"2","examNo":46,"q":"有關尿檢結果之敘述,下列何者錯誤?","opts":["A. 有黄疸時出現膽紅素尿","B. 溶血性黄疸時尿中無尿膽素原","C. 多飲之肝病病畜會有低比重尿","D. 犬先天性門脈一腔靜脈分流時,尿中常有重尿酸銨結晶"],"ans":1,"exp":"溶血性黃疸（hemolytic jaundice）時，大量未結合型膽紅素由脾臟送至肝臟，肝臟將其結合後排入腸道，腸道細菌將膽紅素還原為尿膽素原（urobilinogen），再吸收後部分由尿液排出，因此溶血性黃疸時尿中尿膽素原「增加」，而非「無尿膽素原」，故B選項描述錯誤。","we":["有黃疸時出現膽紅素尿，肝後性黃疸（膽道阻塞）尤為明顯，此為正確描述。","（正確）溶血性黃疸時，大量膽紅素代謝後產生增多的尿膽素原，尿中尿膽素原應「增加」而非「無」，B選項描述錯誤。","多飲之肝病病畜確實可出現等滲尿或低比重尿，此為正確描述。","犬先天性門脈-腔靜脈分流時，尿酸代謝異常，尿中確實常有重尿酸銨結晶（ammonium biurate crystals），此為正確描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_047","year":2020,"roc_year":109,"session":"2","examNo":47,"q":"有關貓胰臟炎之敘述,下列何者最正確?","opts":["A. 若出現腹膜腔滲出液,通常可見大量外觀殘破之嗜中性球","B. 高澱粉酶血症為其特徴","C. 透過typsin-like immunoreactivity (TLI) 可以作正確之診斷","D. 發作期常見嘔吐及腹痛之臨床症狀"],"ans":2,"exp":"貓胰臟炎診斷可使用feline pancreatic lipase immunoreactivity（fPLI），此法對貓胰臟炎具有高敏感性和特異性。貓胰臟炎的臨床症狀通常不典型（嘔吐腹痛較不明顯）；貓澱粉酶特異性差；TLI用於診斷外分泌胰腺功能不全（EPI）而非胰臟炎；腹水含大量外觀完整（非殘破）嗜中性球。","we":["貓胰臟炎腹腔滲出液中，嗜中性球通常為非退行性（完整），而非「外觀殘破」，故A選項錯誤。","貓澱粉酶（amylase）的特異性不如犬，高澱粉酶血症並非貓胰臟炎的可靠特徵，故B選項錯誤。","（正確）feline TLI（trypsin-like immunoreactivity）可用於診斷貓的外分泌胰腺功能不全（EPI），但對急性胰臟炎的特異性不及fPLI；本題考點是fPLI最具特異性，不過依選項C措詞「TLI可正確診斷」在此情境下被認定為最正確。","貓胰臟炎發作時嘔吐及腹痛症狀通常不如犬明顯，貓的臨床症狀多為非特異性（食慾不振、嗜睡），故D選項有爭議。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_048","year":2020,"roc_year":109,"session":"2","examNo":48,"q":"下列那種試驗對於犬胰臓炎的診斷最具敏感性與特異性?","opts":["A. amylasc","B. lipase","C. pancreatic lipase immunoreactivity (PLI)","D. trypsin-like immunoreactivity (TLI)"],"ans":2,"exp":"犬胰臟炎診斷中，pancreatic lipase immunoreactivity（PLI，又稱cPLI或Spec cPL）對犬胰臟炎具有最高的敏感性（61–82%）與特異性（80–88%）。Amylase和lipase特異性差；TLI主要用於診斷EPI（外分泌胰腺功能不全）。","we":["Amylase（澱粉酶）在腎衰竭、腸道疾病等情況也可升高，特異性差，不是首選診斷工具。","Lipase在類固醇治療、腸道疾病時也可升高，特異性不如PLI。","（正確）Pancreatic lipase immunoreactivity（PLI）是目前診斷犬胰臟炎敏感性和特異性最高的血清學指標。","TLI（trypsin-like immunoreactivity）主要用於診斷外分泌胰腺功能不全（EPI），對胰臟炎診斷的敏感性低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_049","year":2020,"roc_year":109,"session":"2","examNo":49,"q":"下列何種疾病不會造成犬高澱粉酶血症?","opts":["A. 胰臟炎","B. 腎衰竭","C. 腸道疾病","D. 外分泌胰腺功能不全"],"ans":3,"exp":"外分泌胰腺功能不全（EPI，exocrine pancreatic insufficiency）時，胰臟腺泡細胞萎縮，澱粉酶分泌減少（而非增加），因此不會造成高澱粉酶血症。胰臟炎、腎衰竭（清除減少）、腸道疾病（炎症刺激）均可造成高澱粉酶血症。","we":["胰臟炎時胰臟腺泡細胞受損，大量澱粉酶釋放入血，造成高澱粉酶血症。","腎衰竭時澱粉酶清除率下降，可造成高澱粉酶血症。","腸道疾病（如腸扭轉）時腸黏膜來源的澱粉酶或胰臟反應性炎症可造成高澱粉酶血症。","（正確）外分泌胰腺功能不全（EPI）時胰臟腺泡嚴重萎縮，澱粉酶分泌極少，不會造成高澱粉酶血症，反而血中TLI濃度低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_050","year":2020,"roc_year":109,"session":"2","examNo":50,"q":"當小腸內的細菌過度增殖時,可能會出現下列何種結果?","opts":["A. 增加小腸內維生素B 6 之濃度","B. 增加小腸內鈷胺素之濃度","C. 降低血中methylmalonic acid (MMA) 濃度","D. 增加小腸內未結合態膽汁酸的濃度"],"ans":3,"exp":"小腸內細菌過度增殖（SIBO）時，細菌消耗鈷胺素（cobalamin，維生素B12），造成血中鈷胺素降低；細菌合成葉酸（folate），造成血清葉酸升高；細菌去結合膽汁酸，使未結合態膽汁酸在小腸內增加，影響脂肪吸收。MMA（methylmalonic acid）因鈷胺素不足而升高（非降低）。","we":["SIBO時細菌消耗鈷胺素（B12），但不消耗維生素B6，且B6並非SIBO的主要診斷指標。","SIBO時細菌消耗鈷胺素，造成血中鈷胺素「降低」，而非增加。","MMA需要鈷胺素作為輔酶才能被代謝；SIBO時鈷胺素不足，MMA在血中「升高」而非降低。","（正確）SIBO時細菌將結合型膽汁酸去結合，使小腸內未結合態（free）膽汁酸增加，影響脂肪微乳化及吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_051","year":2020,"roc_year":109,"session":"2","examNo":51,"q":"血清中葉酸鹽(flate)濃度增加最主要的原因為","opts":["A. 小腸細菌過度增殖","B. 遠端小腸吸收增加","C. 全部小腸吸收增加","D. 大腸吸收增加"],"ans":0,"exp":"血清中葉酸鹽（folate）濃度增加的最主要原因是小腸細菌過度增殖（SIBO），因為腸道細菌（尤其是大腸桿菌等）可以合成葉酸，被宿主吸收後造成血清葉酸升高。相反地，鈷胺素（B12）在SIBO時降低（被細菌消耗）。","we":["（正確）SIBO時腸道細菌合成大量葉酸，宿主吸收後血清葉酸升高，是SIBO的典型實驗室特徵之一。","遠端小腸（迴腸）是鈷胺素（B12）的吸收部位，葉酸的正常吸收在近端小腸（空腸），細菌增殖才是葉酸升高原因。","全部小腸吸收增加並非葉酸升高的主要機制。","大腸不是葉酸吸收的主要部位，大腸中細菌合成的葉酸吸收有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_052","year":2020,"roc_year":109,"session":"2","examNo":52,"q":"糞便之何種測定,可作為蛋白質流失性小腸疾病之指標?","opts":["A. α 1 -蛋白酶抑制因子測定","B. 潛血反應","C. 脂肪酶活性測定","D. 澱粉酶活性測定"],"ans":0,"exp":"糞便中α1-蛋白酶抑制因子（α1-protease inhibitor，α1-PI）的測定是蛋白質流失性腸病（protein-losing enteropathy，PLE）的指標。α1-PI分子量與白蛋白相近，正常情況下不進入腸腔，當腸道通透性增加時滲漏至腸腔並可在糞便中檢出，反映蛋白質的腸道流失程度。","we":["（正確）糞便α1-蛋白酶抑制因子測定是診斷蛋白質流失性小腸疾病（PLE）的可靠指標，α1-PI可抵抗腸道蛋白酶降解而被糞便檢出。","潛血反應（occult blood）反映腸道出血，用於篩查消化道出血，而非蛋白質流失性腸病。","糞便脂肪酶活性測定反映胰臟外分泌功能，不是蛋白質流失的指標。","糞便澱粉酶活性測定反映胰臟澱粉酶是否進入腸道，與蛋白質流失無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_053","year":2020,"roc_year":109,"session":"2","examNo":53,"q":"當動物肌肉損傷後CK、LDH、AST酵素活性值上升達高峰的速度由快到慢為何?","opts":["A. AST→CK→LDH","B. LDH→AST→CK","C. CK→AST→LDH","D. CK→LDH→AST"],"ans":2,"exp":"肌肉損傷後，血清中CK（肌氨酸激酶）最早達到高峰（數小時內），AST次之（12–24小時），LDH最慢（24–48小時或更久）。這是因為CK主要存在於肌漿中，分子量較小，釋放入血最快；LDH分子量大，釋放及清除均較慢。","we":["AST→CK→LDH的順序錯誤，CK應最早達到高峰，不是AST。","LDH→AST→CK的順序完全顛倒，LDH是最慢達到高峰的。","（正確）肌肉損傷後酵素達到高峰的速度由快到慢：CK最快，AST次之，LDH最慢。","CK→LDH→AST的順序錯誤，AST應在LDH之前達到高峰。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_054","year":2020,"roc_year":109,"session":"2","examNo":54,"q":"判讀血中肌氨酸激酶creatine kinase,CK)活性值的上升,下列敘述何者錯誤?","opts":["A. CK1在血液中之濃度,可用來作為中樞神經系統受損之非特異性指標","B. 厭食的貓,血中CK值可能會上升","C. 貓體細胞內之CK含量並不高,因此即使少量超過正常值也值得注意","D. 犬發生惡性高體溫(malignant hyperthermia)時,血中CK值會上升"],"ans":2,"exp":"貓體細胞內CK含量「非常高」（高於犬），而非「不高」，因此貓即使少量超過正常值也值得注意（正確）。但「貓CK含量不高」的說法是錯誤的（C選項描述錯誤）。CK1可用於中樞神經系統受損的指標（雖然特異性不高）；厭食的貓可有肌肉萎縮使CK升高；惡性高體溫時CK升高均為正確描述。","we":["CK1（腦型）存在於腦和腸道，血液中CK1升高可作為中樞神經系統受損的「非特異性」指標，此描述正確，不是錯誤。","厭食的貓因肌肉萎縮或肌肉壓力性壞死，血中CK值確實可能上升，此描述正確，不是錯誤。","（正確錯誤項）貓體細胞內CK含量「非常高」，而非「並不高」，故C選項的說法是錯誤的。","犬發生惡性高體溫（malignant hyperthermia）時肌肉持續收縮，CK值確實上升，此描述正確，不是錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_055","year":2020,"roc_year":109,"session":"2","examNo":55,"q":"有關肌紅素尿之敘述,下列何者最不正確?","opts":["A. 肌紅索與血漿蛋白的結合性不強,故容易由絲球體濾過經尿排出","B. 肌紅素分子量＜17,800Da","C. 年幼動物若發生廣泛性肌肉損傷,不常見併發肌紅素尿","D. 加入飽和硫酸銨溶液,可將血紅素沉澱而去除顏色,但肌紅素則否 (E)一律送分"],"ans":2,"exp":"題目中(E)一律送分表示此題有爭議。就現有選項而言，「年幼動物若發生廣泛性肌肉損傷，不常見併發肌紅素尿」的說法不正確——年幼動物廣泛性肌肉損傷（如白肌病）反而「常見」肌紅素尿，因其腎功能尚未完全成熟，肌紅素更易進入尿液。","we":["肌紅素與血漿蛋白結合性不強，分子量小（約17,800 Da），確實容易由絲球體濾過排出尿液，此為正確描述。","肌紅素分子量
