約17,800 Da，此描述正確（<17,800 Da的說法需注意，標準值約17,500–17,800 Da）。","（正確錯誤項）年幼動物（如犢牛白肌病）廣泛性肌肉損傷時，肌紅素尿相當常見，「不常見」的說法不正確。","加入飽和硫酸銨溶液可將血紅素（hemoglobin）沉澱去除顏色，而肌紅素（myoglobin）因分子量較小不被沉澱，此為正確描述（可用此法鑑別肌紅素尿與血紅素尿）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_056","year":2020,"roc_year":109,"session":"2","examNo":56,"q":"有關腎小管各段與血漿中滲透壓之比較,下列敘述何者正確?","opts":["A. 近端腎小管之滲透壓高於血漿","B. 亨爾氏管(Henle's loop)下降支之滲透壓高於血漿","C. 亨爾氏管(Henle'sloop)上行支之滲透壓高於血漿","D. 遠端腎小管之滲透壓高於血漿"],"ans":1,"exp":"亨爾氏管（Henle's loop）下降支（descending limb）通透於水但不通透於溶質，水被高滲的腎髓質間質吸出，使管腔內液體滲透壓「高於血漿」（進入深髓質時最高）。近端腎小管與血漿等滲；亨爾氏管上行支主動運輸NaCl出去，管腔內滲透壓低於血漿；遠端腎小管滲透壓受ADH調節，通常等滲或低滲。","we":["近端腎小管（proximal tubule）重吸收等量水和溶質，維持等滲狀態（與血漿相當），而非高於血漿。","（正確）Henle's loop下降支失去水分，管腔內溶質濃度升高，滲透壓高於血漿，越深入髓質越高。","Henle's loop上行支（ascending limb）主動運輸NaCl出去但不通透水，管腔內滲透壓「低於」血漿。","遠端腎小管在ADH調控下滲透壓可調整，正常時不高於血漿。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_057","year":2020,"roc_year":109,"session":"2","examNo":57,"q":"某犬隻尿液中可見如下圖之結晶,下列敘述何者正確?","opts":["A. 該尿液以60℃加熱後會變成澄清透明","B. 該尿液常見於有尿石症之鹼性尿中","C. 該尿液常見於肝門脈分流之動物","D. 該尿液加入乙醚後會變為澄清透明"],"ans":2,"exp":"此題含圖，根據描述的尿液結晶，若為尿酸銨結晶（ammonium biurate），常見於肝門脈分流動物的尿液中（因尿酸代謝異常）。加入乙醚後不改變尿液外觀，60°C加熱草酸鈣結晶溶解，鹼性尿見磷酸銨鎂（struvite）。門脈分流特徵性結晶為重尿酸銨（ammonium biurate），選C。","we":["60°C加熱後變澄清透明的特性屬於草酸鈣結晶，尿酸銨結晶加熱不溶解。","常見於有尿石症之鹼性尿的結晶為磷酸銨鎂（struvite），不是尿酸銨結晶。","（正確）重尿酸銨（ammonium biurate）結晶常見於肝門脈分流動物，因尿酸及氨代謝異常所致。","加入乙醚後變澄清透明的是脂肪滴（lipid droplets），與尿酸銨結晶無關。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1092_實診_058","year":2020,"roc_year":109,"session":"2","examNo":58,"q":"有關膽紅素尿之敘述,下列何者正確?","opts":["A. 罹患嚴重肝病之動物必會出現膽紅素尿","B. 採用陳舊尿測定膽紅素時容易出現偽陽性結果","C. 膽紅素尿可先於膽紅素血症之前被檢出","D. 任何程度的膽紅素尿,在犬皆具有臨床意義"],"ans":2,"exp":"膽紅素尿可先於膽紅素血症（高膽紅素血症）之前被檢出，因為腎臟對結合型膽紅素的排除閾值低，當血中結合型膽紅素輕微升高時，即可由腎臟濾出出現在尿液中，而此時血液檢查可能還未達到高膽紅素血症的診斷標準。","we":["嚴重肝病的動物不一定出現膽紅素尿（需有結合型膽紅素才能出現），且非「必會」出現，故A選項錯誤。","採用陳舊尿測定膽紅素時，結合型膽紅素被氧化成膽綠素（biliverdin），出現的是「偽陰性」而非偽陽性，故B選項錯誤。","（正確）膽紅素尿可先於膽紅素血症之前被檢出，是早期膽汁鬱積的敏感指標。","犬尿中允許有少量膽紅素（尤其是雄性犬），少量膽紅素尿在犬不一定有臨床意義，故D選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_059","year":2020,"roc_year":109,"session":"2","examNo":59,"q":"犬尿渣中出現那一種尿圓柱時,與糖尿病最有相關?","opts":["A. hyaline","B. granular","C. fatty","D. red blood cell"],"ans":2,"exp":"脂肪管型（fatty cast）在尿渣中出現與脂肪尿（lipiduria）有關，而糖尿病（diabetes mellitus）時因高血糖及脂肪代謝異常，腎小管上皮細胞積聚脂肪滴，形成脂肪管型。Hyaline管型為非特異性；granular管型見於腎小管損傷；RBC管型見於腎絲球腎炎。","we":["Hyaline管型（透明管型）為非特異性，在發燒、脫水或劇烈運動時也可見，與糖尿病無特異相關。","Granular管型（顆粒管型）反映腎小管上皮細胞壞死及退化，是腎小管損傷的標誌，不特異於糖尿病。","（正確）Fatty管型（脂肪管型）與脂肪尿及糖尿病最有相關，因糖尿病時脂肪代謝異常，腎小管上皮細胞出現脂肪滴，形成脂肪管型。","RBC管型（紅血球管型）見於腎絲球腎炎及血尿相關腎臟疾病，不特異於糖尿病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_060","year":2020,"roc_year":109,"session":"2","examNo":60,"q":"下列何者不是造成犬隻高鈣血症之常見原因?","opts":["A. 腎上腺皮質功能低下","B. 惡性腫瘤","C. 原發性副甲狀腺功能亢進","D. 營養性副甲狀腺功能亢進"],"ans":3,"exp":"犬隻高鈣血症的常見原因包括：腎上腺皮質功能低下（hypoadrenocorticism）、惡性腫瘤（尤其淋巴瘤、肛門囊腺癌）、原發性副甲狀腺功能亢進。「營養性副甲狀腺功能亢進」（nutritional hyperparathyroidism）是因飲食鈣磷比失衡（高磷低鈣）導致PTH升高，造成低鈣或正鈣血症，而非高鈣血症，故不是高鈣血症的常見原因。","we":["腎上腺皮質功能低下（Addison's disease）是犬隻高鈣血症的已知原因之一，機制不完全清楚，故此選項是高鈣血症的原因。","惡性腫瘤（尤其是淋巴瘤）是犬隻高鈣血症最常見的原因，透過PTHrP分泌造成高鈣血症，故此選項是高鈣血症的原因。","原發性副甲狀腺功能亢進（primary hyperparathyroidism）造成PTH分泌過多，骨鈣溶出導致高鈣血症，故此選項是高鈣血症的原因。","（正確）營養性副甲狀腺功能亢進（nutritional secondary hyperparathyroidism）是低鈣高磷飲食導致PTH代償性升高，不造成高鈣血症，故此選項不是高鈣血症的常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_061","year":2020,"roc_year":109,"session":"2","examNo":61,"q":"正常牛之尿鎂值約為多少mg/dL?","opts":["A. 30","B. 50","C. 80","D. 100"],"ans":1,"exp":"正常牛的尿鎂值約為50 mg/dL，遠高於其他動物，這是因為牛（草食動物）飼料中鎂含量高，腸道吸收多，主要透過尿液排出。尿鎂測定可用於評估牛的鎂代謝狀態及低鎂血症風險。","we":["30 mg/dL偏低，不符正常牛尿鎂的參考範圍。","（正確）正常牛尿鎂約50 mg/dL，反映其高鎂飼料攝取及腎臟排泄量。","80 mg/dL偏高，不符正常牛尿鎂的一般參考值。","100 mg/dL過高，不是正常牛尿鎂的典型值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_062","year":2020,"roc_year":109,"session":"2","examNo":62,"q":"下列何者最可能出現偽性低鈣血症?","opts":["A. 低白蛋白血症","B. 高蛋白血症","C. 採血後太慢分離血清","D. 腎衰竭之草食獸"],"ans":0,"exp":"低白蛋白血症時，血中可與白蛋白結合的鈣減少，造成「總鈣」濃度降低，但「游離鈣（離子鈣）」維持正常，動物無低鈣的臨床症狀，故稱「偽性低鈣血症」（pseudohypocalcemia）。高蛋白血症則相反，可造成偽性高鈣血症。","we":["（正確）低白蛋白血症造成結合鈣減少，總鈣濃度下降，但游離鈣正常，動物無症狀，為偽性低鈣血症的典型原因。","高蛋白血症會使結合鈣增加、總鈣升高，造成偽性高鈣血症，而非偽性低鈣血症。","採血後太慢分離血清會使紅血球代謝消耗葡萄糖，不會造成偽性低鈣血症。","腎衰竭草食獸可出現真性低鈣血症（磷滯留抑制鈣），但並非「偽性」低鈣血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_063","year":2020,"roc_year":109,"session":"2","examNo":63,"q":"貓血液循環中T4最主要與下列何種物質結合在一起而被運送至組織?","opts":["A. 白蛋白及transthyretin (TTR)","B. 白蛋白及高密度脂蛋白-2(HDL 2 )","C. 甲狀腺素結合性球蛋白(TBG)","D. 白蛋白(albumin)及極低密度脂蛋白(VLDL)"],"ans":0,"exp":"貓血液中T4（甲狀腺素）主要與白蛋白（albumin）及transthyretin（TTR，轉甲狀腺素蛋白，又稱prealbumin）結合運送至組織。犬則以白蛋白和HDL2為主要攜帶蛋白。貓沒有大量TBG（甲狀腺素結合球蛋白），與人類不同。","we":["（正確）貓T4主要與白蛋白（albumin）及transthyretin（TTR）結合在血中運送，此為貓的特徵性甲狀腺素運輸方式。","白蛋白及HDL2是犬T4的主要攜帶蛋白，不是貓的情況。","TBG（甲狀腺素結合球蛋白）是人類T4的主要攜帶蛋白，貓的TBG含量極低，不是主要攜帶蛋白。","白蛋白及VLDL的組合不符合貓甲狀腺素的主要運輸蛋白描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_064","year":2020,"roc_year":109,"session":"2","examNo":64,"q":"貓常因肥胖導致對胰島素具抵抗性,引發下列何種糖尿病?","opts":["A. 第Ⅰ型糖尿病","B. 第Ⅱ型糖尿病","C. 第Ⅲ型糖尿病","D. 妊娠糖尿病"],"ans":1,"exp":"貓常因肥胖導致胰島素抵抗性（insulin resistance），引發第II型糖尿病（type II diabetes mellitus），其特徵為胰島素相對不足、胰島素信號傳導缺陷，與人類的第II型糖尿病相似。第I型糖尿病為自體免疫性胰島素絕對缺乏，第III型及妊娠糖尿病不是貓的常見情況。","we":["第I型糖尿病（type I DM）為免疫介導的胰島細胞破壞，造成胰島素絕對缺乏，不是肥胖引起的糖尿病類型。","（正確）第II型糖尿病（type II DM）以胰島素抵抗性為特徵，貓肥胖是主要風險因子，與人類第II型糖尿病機制相同。","第III型糖尿病（transient DM）雖在貓可見（如黃體素誘發），但題目問的是肥胖/胰島素抵抗性相關者，故非最佳答案。","妊娠糖尿病在貓中不是主要類型，且此題問的是肥胖導致胰島素抵抗性的情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_065","year":2020,"roc_year":109,"session":"2","examNo":65,"q":"胰臟之那一種細胞會分泌昇糖素(glucagon)?","opts":["A. α","B. β","C. γ","D. δ"],"ans":0,"exp":"胰臟蘭氏小島中，α細胞（A細胞）分泌昇糖素（glucagon），β細胞分泌胰島素（insulin），δ細胞（D細胞）分泌生長抑素（somatostatin），γ細胞（F細胞）分泌胰多肽（pancreatic polypeptide）。","we":["（正確）胰臟α細胞分泌昇糖素（glucagon），促進糖質新生及肝糖分解，升高血糖。","β細胞分泌胰島素（insulin），促進葡萄糖攝取利用，降低血糖，不分泌昇糖素。","γ細胞（F細胞）分泌胰多肽（pancreatic polypeptide），不分泌昇糖素。","δ細胞分泌生長抑素（somatostatin），抑制α和β細胞分泌，不分泌昇糖素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_066","year":2020,"roc_year":109,"session":"2","examNo":66,"q":"下列何種物質是造成腎上腺皮質功能低下,且病犬血中常有低鈉血症的原因?","opts":["A. ACTH","B. 可體素(cortisol)","C. 醛固酮(aldosterone)","D. 性荷爾蒙"],"ans":2,"exp":"腎上腺皮質功能低下（hypoadrenocorticism，Addison's disease）最常因醛固酮（aldosterone）缺乏造成。醛固酮負責腎小管保鈉排鉀，缺乏時鈉不被保留而大量排出，造成低鈉血症；同時鉀滯留造成高鉀血症。典型電解質異常為低鈉高鉀（Na:K比值<27）。","we":["ACTH不足造成可體素分泌減少，但單純ACTH缺乏（繼發性腎上腺皮質功能低下）不影響醛固酮分泌，不造成電解質異常。","可體素（cortisol）缺乏造成低血糖及虛弱，不直接造成低鈉血症。","（正確）醛固酮（aldosterone）缺乏導致腎小管無法保鈉排鉀，造成低鈉血症及高鉀血症，為腎上腺皮質功能低下的典型電解質異常。","性荷爾蒙（性激素）缺乏不造成電解質異常，與低鈉血症無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_067","year":2020,"roc_year":109,"session":"2","examNo":67,"q":"下列何者不是臨床評估脫水常用之實験室檢査項目?","opts":["A. 血漿總蛋白","B. 滲透壓","C. 血容比","D. 血中尿素"],"ans":3,"exp":"臨床評估脫水的常用實驗室項目包括血漿總蛋白（升高）、血容比（hematocrit，升高）、及血漿滲透壓（升高）。血中尿素（BUN/urea）雖然在脫水時也可升高（腎前性氮血症），但其升高原因多樣（腎臟疾病、高蛋白飲食等），特異性較低，不是評估脫水的首選指標。","we":["血漿總蛋白在脫水時因血液濃縮而升高，是評估脫水的常用指標。","滲透壓（osmolality）升高反映血液濃縮及脫水，是常用的脫水評估指標。","血容比（hematocrit，PCV）在脫水時升高，是評估脫水程度的主要指標。","（正確）血中尿素（BUN/urea）雖脫水時可升高（腎前性），但其升高原因多樣，特異性較低，相較其他三項，較不常作為脫水評估的主要指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_068","year":2020,"roc_year":109,"session":"2","examNo":68,"q":"下列何者為細胞外液最多之緩衝液?","opts":["A. 磷酸鹽(phosphate)","B. 重碳酸基(bicarbonate)","C. 蛋白質(protein)","D. 血紅蛋白(hemoglobin)"],"ans":1,"exp":"細胞外液（extracellular fluid，ECF）最主要的緩衝系統是重碳酸基緩衝系統（bicarbonate/carbonic acid system，HCO3-/H2CO3），因其濃度高且可與呼吸系統聯合調節，是細胞外液中最重要且含量最多的緩衝液。","we":["磷酸鹽緩衝系統主要在細胞內液及腎小管中發揮作用，在細胞外液中含量相對較少。","（正確）重碳酸基（bicarbonate）緩衝系統是細胞外液最主要的緩衝系統，濃度約24 mmol/L，與CO2/肺臟調節密切連結。","蛋白質緩衝作用主要在細胞內液（血紅蛋白）及血漿蛋白（少量），在細胞外液中不是最主要的緩衝液。","血紅蛋白（hemoglobin）是細胞內液（紅血球內）最重要的緩衝液，不是細胞外液的主要緩衝系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_069","year":2020,"roc_year":109,"session":"2","examNo":69,"q":"CO 2 較O 2 易透過肺泡微血管障隔,其擴散能力約為O 2 之幾倍?","opts":["A. 10","B. 20","C. 30","D. 40"],"ans":1,"exp":"CO2透過肺泡-微血管障隔的擴散能力約為O2的20倍，這是因為CO2在水及脂質中的溶解度比O2高得多（約24倍），儘管CO2分子量略大，但其高度溶解性使其擴散速率遠高於O2。此為呼吸生理學的基本知識。","we":["10倍低估了CO2的擴散能力，不符正確數值。","（正確）CO2的擴散能力約為O2的20倍，因CO2在水和組織中的溶解度遠高於O2。","30倍高估了CO2的擴散能力，不符教科書標準數值（20倍）。","40倍過度高估，不是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_070","year":2020,"roc_year":109,"session":"2","examNo":70,"q":"病犬血液氣體檢查結果如下:PH上升·PaCO 2 正常HCO 3 - 上升，其最有可能罹患下列何種酸鹼異常?","opts":["A. 代謝性酸中毒","B. 代謝性鹼中毒","C. 呼吸性酸中毒","D. 呼吸性鹼中毒"],"ans":1,"exp":"pH升高、PaCO2正常、HCO3-升高，這是代謝性鹼中毒（metabolic alkalosis）的典型血氣表現。原發性HCO3-升高使pH升高；PaCO2正常表示呼吸代償尚未或輕微發揮。代謝性酸中毒為pH下降、HCO3-下降；呼吸性改變以PaCO2升降為主。","we":["代謝性酸中毒（metabolic acidosis）表現為pH下降、HCO3-下降，不符題目pH升高的描述。","（正確）代謝性鹼中毒（metabolic alkalosis）：pH升高、PaCO2正常（代償輕微）、HCO3-升高，符合題目描述。","呼吸性酸中毒（respiratory acidosis）表現為pH下降、PaCO2升高、HCO3-代償性升高，不符題目pH升高。","呼吸性鹼中毒（respiratory alkalosis）表現為pH升高、PaCO2下降（非正常）、HCO3-代償性下降，不符題目PaCO2正常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_071","year":2020,"roc_year":109,"session":"2","examNo":71,"q":"下列檢測血清電解質的分析方法,何者較不受脂血症及高蛋白血症影響?","opts":["A. 火焰比色法","B. 特殊電極法","C. 庫倫滴定法","D. 酵素免疫分析法"],"ans":1,"exp":"特殊電極法（ion-selective electrode，ISE）直接測量離子活性，不受樣本中脂質或蛋白質的排除效應影響，因此不受脂血症及高蛋白血症干擾。火焰比色法和庫倫滴定法測量的是整體樣本中的電解質濃度，易受脂血症及高蛋白血症影響（pseudohyponatremia）。","we":["火焰比色法（flame photometry）測量整體樣本濃度，高蛋白或高脂血症佔據體積，造成電解質濃度假性偏低（偽性低鈉血症），受影響較大。","（正確）特殊電極法（ISE）直接測量游離離子活性，不受脂質或蛋白質排除效應影響，是目前最常用且最準確的電解質測定方法。","庫倫滴定法（coulometric titration）測量氯離子時，在高蛋白或脂血標本中也可能受影響。","酵素免疫分析法（enzyme immunoassay）不用於電解質測定，用於蛋白質或荷爾蒙的定量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_072","year":2020,"roc_year":109,"session":"2","examNo":72,"q":"犬隻代謝性酸中毒時,會用呼吸來代償,每1mmolLHCO 3 - 下降,大約會以多少PaCO 2 來代償?","opts":["A. 上升1.5 mmHgPaCO 2","B. 下降1.5 mmHg PaCO 2","C. 上升0.7 mmHg PaCO 2","D. 下降0.7 mmHg PaCO 2"],"ans":3,"exp":"犬代謝性酸中毒時的呼吸代償：每降低1 mmol/L的HCO3-，PaCO2 約下降0.7 mmHg（即過度通氣使CO2排出增加，PaCO2下降以代償酸中毒）。此為犬的呼吸代償公式：△PaCO2 = 0.7 × △HCO3-（下降方向）。","we":["代謝性酸中毒時PaCO2應下降（過度通氣排出CO2），而非上升，故上升1.5 mmHg不正確。","下降1.5 mmHg的代償係數高估，犬的代償係數為0.7，不是1.5。","上升0.7 mmHg方向錯誤；代謝性酸中毒的呼吸代償是PaCO2下降，不是上升。","（正確）犬代謝性酸中毒時每降低1 mmol/L HCO3-，呼吸代償使PaCO2下降約0.7 mmHg，符合臨床代償公式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_073","year":2020,"roc_year":109,"session":"2","examNo":73,"q":"下列何者所引起之高鉀血症,最不可能是因為鉀的排泄減少?","opts":["A. oliguric renal failure","B. potassium-sparing diuretics","C. digitalis toxicity","D. hypoadrenocorticism"],"ans":2,"exp":"Digitalis毒性（洋地黃中毒）造成高鉀血症的機制是抑制Na+/K+-ATPase，使細胞外鉀離子升高，這是「細胞內鉀移出」（transcellular shift），而非「腎臟排泄減少」所致。Oliguric renal failure（排泄減少）、potassium-sparing diuretics（保鉀利尿劑，排泄減少）、hypoadrenocorticism（醛固酮缺乏，排泄減少）均為腎臟排泄減少造成高鉀血症。","we":["Oliguric renal failure（少尿性腎衰竭）使腎臟排鉀減少，確實是排泄減少造成高鉀血症。","Potassium-sparing diuretics（保鉀利尿劑）抑制醛固酮作用，使腎小管排鉀減少，是排泄減少造成高鉀血症。","（正確）Digitalis toxicity（洋地黃中毒）抑制Na+/K+-ATPase，使鉀從細胞內移出，是transcellular shift造成高鉀血症，而非腎臟排泄減少。","Hypoadrenocorticism（腎上腺皮質功能低下）醛固酮缺乏，腎小管排鉀減少，是排泄減少造成高鉀血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_074","year":2020,"roc_year":109,"session":"2","examNo":74,"q":"當犬隻低倍視野下血液抹片呈現如下圖,表示此動物有何種情形?","opts":["A. 嗜中性球增多症","B. 嗜酸性球增多症","C. 單核球增多症","D. 嗜鹼性球增多症"],"ans":3,"exp":"此題含圖（低倍視野血液抹片）。根據題目設計及後續承題（Q75提到癌症化學治療、燒傷、子宮蓄膿、壁蝨），推斷74題答案為嗜鹼性球增多症（basophilia），因Q75的選項暗示嗜鹼性球/嗜酸性球相關情境（壁蝨、過敏等）。","we":["嗜中性球增多症在低倍血液抹片最常見（白血球中最多），不是特殊圖形表現。","嗜酸性球增多症（eosinophilia）在低倍視野下可見嗜酸性顆粒細胞增多，但Q75連結選項指向不同情境。","單核球增多症（monocytosis）在低倍視野難以特別辨認，且連題情境不符。","（正確）根據Q74–Q75連題結構，低倍視野顯示的特殊血球為嗜鹼性球增多症（basophilia），嗜鹼性球含有大量深紫色顆粒，在低倍視野即可識別。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1092_實診_075","year":2020,"roc_year":109,"session":"2","examNo":75,"q":"承上題,犬隻在下列那些狀況下較可見此現象?①癌症的化學治療②前肢灼傷③封閉型子宮蓄膿④壁蝨","opts":["A. ①④","B. ①③","C. ②④","D. ②③"],"ans":3,"exp":"嗜鹼性球增多症（basophilia）在犬常見於：①慢性過敏/超敏反應（過敏性皮膚炎、食物過敏）②嗜酸性球增多症同時出現③甲狀腺功能低下④脂血症。燒燙傷（前肢灼傷）及子宮蓄膿（炎症，嗜中性球增多為主）較常造成嗜鹼性球增多症。","we":["①癌症化學治療通常造成嗜中性球減少（骨髓抑制），不是嗜鹼性球增多的原因；④壁蝨感染主要造成嗜酸性球增多，組合①④不符。","①癌症化學治療造成骨髓抑制，③封閉型子宮蓄膿造成嗜中性球增多，均不是嗜鹼性球增多的主要原因，組合①③不符。","②前肢灼傷（燒燙傷）後急性期以嗜中性球增多為主，不特異造成嗜鹼性球增多；④壁蝨感染以嗜酸性球增多為主，組合②④不是典型嗜鹼性球增多原因。","（正確）②前肢灼傷（損傷/炎症）及③封閉型子宮蓄膿（慢性感染/炎症）均可引發嗜鹼性球增多症，組合②③為最合理的答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_076","year":2020,"roc_year":109,"session":"2","examNo":76,"q":"下列何種血球的細胞質中含有顆粒且細胞核都有分葉?","opts":["A. 嗜酸性球","B. 單核球","C. B淋巴球","D. 血小板"],"ans":0,"exp":"嗜酸性球（eosinophil）細胞質含有嗜酸性顆粒（粉紅色或橙紅色顆粒），且細胞核有分葉（通常2葉）。嗜中性球雖有分葉核但顆粒不明顯（中性顆粒）；嗜鹼性球有分葉核及嗜鹼性顆粒；單核球核不分葉；淋巴球核圓形不分葉；血小板無核。","we":["（正確）嗜酸性球（eosinophil）細胞質含有明顯的嗜酸性顆粒，且細胞核分葉（通常2–3葉），同時具備「顆粒」及「分葉核」兩個特徵。","單核球（monocyte）細胞質有細小顆粒但核呈腎形或馬蹄形，不分葉，不符描述。","B淋巴球細胞質無明顯顆粒，核圓形不分葉，不符描述。","血小板無細胞核，不符「細胞核都有分葉」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_077","year":2020,"roc_year":109,"session":"2","examNo":77,"q":"承上題,下列何種情況最可能造成此種血球數量增加?","opts":["A. 劇烈運動後","B. 過敏性皮膚炎","C. 缺鐵性貧血","D. 年齡增加"],"ans":1,"exp":"承上題（嗜酸性球），嗜酸性球增多症最常見於過敏性疾病（如過敏性皮膚炎、食物過敏）及寄生蟲感染。過敏性皮膚炎（allergic dermatitis）透過IgE/肥大細胞途徑釋放細胞激素（IL-5），刺激嗜酸性球增生及趨化。","we":["劇烈運動後會有短暫性白血球增多（以嗜中性球為主，為邊緣池動員），不是嗜酸性球增多的原因。","（正確）過敏性皮膚炎（allergic dermatitis）透過Th2免疫反應及IgE介導，是嗜酸性球增多最典型的原因之一。","缺鐵性貧血（iron deficiency anemia）不造成嗜酸性球增多，不相關。","年齡增加不是嗜酸性球增多的原因；老年動物的嗜酸性球數量通常正常或略降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_078","year":2020,"roc_year":109,"session":"2","examNo":78,"q":"4歲母馬，突然出現盜汗、發熱、體軀僵硬、觸摸臀肌(glutealmuscle)有痛感之反應。血檢出現白血球、 嗜中性球與帶狀核嗜中性球均高之現象;生化檢查可見BUN、creatinine、AST、CK、glucose均高,且有高血磷之現象。其最有可能之鑑别診斷為何?","opts":["A. 心臟衰竭","B. 膽汁鬱積","C. 嚴重的肌肉損傷","D. 嚴重脫水"],"ans":2,"exp":"4歲母馬出現盜汗、發熱、體軀僵硬、臀肌疼痛、白血球增多（含核左轉）、BUN/creatinine升高（腎臟灌流不足）、AST/CK顯著升高（肌肉損傷）、高血糖（應激反應）、高血磷（肌肉釋放）。此典型臨床病理組合最符合嚴重的肌肉損傷（exertional rhabdomyolysis，馬的「週一早晨病」或azoturia）。","we":["心臟衰竭的主要實驗室異常為心臟酵素升高及心電圖異常，通常無臀肌疼痛及典型高CK/AST，不符。","膽汁鬱積（cholestasis）主要表現為ALP/GGT升高及膽紅素血症，不會有嚴重CK升高及肌肉疼痛。","（正確）嚴重肌肉損傷（馬的横紋肌溶解症/exertional rhabdomyolysis）：臀肌疼痛、CK/AST顯著升高、高血磷、可能有myoglobinuria，與所有描述吻合。","嚴重脫水可造成BUN/creatinine升高，但不會造成CK/AST顯著升高及臀肌疼痛，不是最佳診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_079","year":2020,"roc_year":109,"session":"2","examNo":79,"q":"承上題,該動物進行尿檢時,下列何種尿液變化最有可能?","opts":["A. 瞻紅素尿","B. 肌紅素尿","C. 尿膽素原尿 (urobilinogen)","D. 血尿"],"ans":1,"exp":"承上題（馬的嚴重肌肉損傷/橫紋肌溶解症），大量肌紅素從受損肌肉釋放入血後，由腎臟濾出排入尿液，造成肌紅素尿（myoglobinuria）。肌紅素尿使尿液呈紅棕色或濃茶色，是馬橫紋肌溶解症的典型尿液異常。","we":["膽紅素尿（bilirubinuria）見於肝臟疾病或膽道阻塞，不是肌肉損傷的尿液異常特徵。","（正確）肌紅素尿（myoglobinuria）是橫紋肌溶解症的典型尿液異常，大量肌紅素由受損肌肉釋放，經腎臟排出使尿液呈紅棕色。","尿膽素原尿（urobilinogenuria）反映腸肝循環及溶血性黃疸，不是肌肉損傷的特徵。","血尿（hematuria）表示泌尿道出血，不是肌肉損傷的直接表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1092_實診_080","year":2020,"roc_year":109,"session":"2","examNo":80,"q":"承上題,該尿液檢體會呈現下列何種特徵?","opts":["A. 以紫外線照射呈現紅色螢光","B. 陳舊尿呈現綠褐色","C. 褐色尿液,遠心離心后無法獲得澄清上清液","D. 加入飽和硫酸銨可將尿液中的色素完全去除"],"ans":3,"exp":"肌紅素尿（myoglobinuria）的特徵包括：尿液呈紅棕色，離心後上清液仍維持紅棕色（因肌紅素溶於液體，無法離心沉澱）；加入飽和硫酸銨可沉澱血紅素（hemoglobin），但肌紅素不被沉澱，因此加入飽和硫酸銨後尿液「仍有顏色」（無法完全去除）。","we":["紫外線照射呈現紅色螢光是卟啉症（porphyrinuria）的特徵，不是肌紅素尿。","陳舊尿呈現綠褐色是膽紅素被氧化為膽綠素（biliverdin）的特徵，不是肌紅素尿。","褐色尿液離心後無法獲得澄清上清液的描述適用於含有大量紅血球的血尿（離心後紅血球沉澱、上清液變清），但肌紅素尿離心後上清液「仍為紅棕色」（肌紅素不沉澱），此選項描述有誤。","（正確）加入飽和硫酸銨可沉澱血紅素使血紅素尿變澄清，但肌紅素分子量小不被沉澱，因此肌紅素尿加入飽和硫酸銨後色素「無法完全去除」，為鑑別肌紅素尿與血紅素尿的標準方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_001","year":2021,"roc_year":110,"session":"","examNo":1,"q":"濕式貓傳染性腹膜炎（wet-form feline infectious peritonitis）最可能出現下列何種體腔滲液？","opts":["A. 漏出液（transudates）","B. 修飾性漏出液（modified transudates）","C. 非化膿性滲出液（nonseptic exudates）","D. 化膿性滲出液（septic exudates）"],"ans":2,"exp":"濕式貓傳染性腹膜炎（wet FIP）的典型體腔滲液為非化膿性滲出液（nonseptic exudate），富含蛋白質（>3.5 g/dL）且呈現黃色黏稠外觀。此種滲液由免疫複合體引發血管炎所致，細胞數中等，以巨噬細胞和中性球為主，但無細菌感染。","we":["A錯誤：漏出液蛋白質含量低（<2.5 g/dL）、細胞數極少，見於低白蛋白血症或門脈高壓，不符合FIP。","B錯誤：修飾性漏出液蛋白質中等，多見於心臟病或腫瘤，不符合FIP的血管炎機制。","（正確）C正確：FIP滲液為非化膿性滲出液，高蛋白、中等細胞數（無細菌），由III型過敏反應造成的血管炎所致。","D錯誤：化膿性滲出液（septic exudate）有細菌感染及大量退化性嗜中性球，FIP無細菌感染不符合此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_002","year":2021,"roc_year":110,"session":"","examNo":2,"q":"下列何者不是乳糜滲出液（chylous effusions）之特徵？","opts":["A. 滲出液呈粉紅色至白色不透明","B. 細胞數經常少於10,000/µL","C. 有核細胞以小型淋巴球為主","D. 滲出液中膽固醇濃度比血中高"],"ans":3,"exp":"乳糜滲出液（chylous effusion）中膽固醇濃度比血液中低（非高），這是其特徵之一。乳糜滲液含有高三酸甘油脂（TG > 血液），而非高膽固醇。其餘特徵：呈乳白色、細胞數少於10,000/µL、有核細胞以小型淋巴球為主，均為正確描述。","we":["A正確：乳糜滲液因含乳糜微粒（chylomicrons）而呈粉紅至白色不透明，是正確特徵。","B正確：乳糜滲液的有核細胞計數通常少於10,000/µL，是正確特徵。","C正確：慢性乳糜滲液以小型淋巴球為主要細胞，是正確特徵。","（正確）D錯誤：乳糜滲液中三酸甘油脂高於血液，但膽固醇低於血液，故「膽固醇濃度比血中高」是錯誤描述，此題問「不是特徵」，D為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_003","year":2021,"roc_year":110,"session":"","examNo":3,"q":"下列何者為造成純粹漏出液（transudates）之常見原因？","opts":["A. 無菌性異物","B. 嚴重低白蛋白血症","C. 腸阻塞","D. 細菌感染"],"ans":1,"exp":"純粹漏出液（pure transudates）主要由低膠體滲透壓所造成，嚴重低白蛋白血症（hypoalbuminemia）使血漿膠體滲透壓下降，液體滲入體腔形成漏出液。其特徵為低蛋白、低細胞數。","we":["A錯誤：無菌性異物會引起非化膿性滲出液（nonseptic exudate），不會造成純粹漏出液。","（正確）B正確：嚴重低白蛋白血症使膠體滲透壓下降，是純粹漏出液最常見的原因之一。","C錯誤：腸阻塞可引起修飾性漏出液或滲出液，不是純粹漏出液的常見原因。","D錯誤：細菌感染會造成化膿性滲出液（septic exudate），不是漏出液的成因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_004","year":2021,"roc_year":110,"session":"","examNo":4,"q":"正常犬腦脊髓液中有核細胞總數一般最高不大於多少？","opts":["A. 9/µL","B. 12/µL","C. 15/µL","D. 20/µL"],"ans":0,"exp":"正常犬腦脊髓液（CSF）中有核細胞數上限為5/µL（部分教科書為5～8/µL），最高不超過9/µL。超過此數值即視為細胞增多症（pleocytosis），提示神經系統異常。","we":["（正確）A正確：正常犬CSF有核細胞總數上限為9/µL，是正確數值。","B錯誤：12/µL已超過正常上限，若以此值為標準則會低估細胞增多症的頻率。","C錯誤：15/µL明顯超過正常值，不是正常犬CSF有核細胞的上限。","D錯誤：20/µL屬於明顯細胞增多，不是正常值範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_005","year":2021,"roc_year":110,"session":"","examNo":5,"q":"紡錘型細胞瘤（spindle cell tumors）屬於下列何種？","opts":["A. epithelial tumors","B. mesenchymal tumors","C. round cell tumors","D. basal cell tumors"],"ans":1,"exp":"紡錘型細胞瘤（spindle cell tumors）起源於間葉組織（mesenchyme），如纖維母細胞、平滑肌、周邊神經等，屬於間葉細胞性腫瘤（mesenchymal tumors）。其細胞呈紡錘形、排列成束狀或旋渦狀。","we":["A錯誤：上皮性腫瘤（epithelial tumors）細胞呈多邊形或立方形，有細胞間連接，不呈紡錘狀。","（正確）B正確：紡錘型細胞瘤屬於間葉細胞性腫瘤，起源於結締組織、肌肉或神經等間葉來源。","C錯誤：圓形細胞瘤（round cell tumors）包括淋巴瘤、肥大細胞瘤等，細胞形態為圓形，不是紡錘形。","D錯誤：基底細胞瘤（basal cell tumors）是上皮性腫瘤的一種，不屬於間葉性紡錘形細胞腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_006","year":2021,"roc_year":110,"session":"","examNo":6,"q":"同時檢測腦脊髓液與血液中電解質，下列何種電解質在腦脊髓液中較低？","opts":["A. ","B. ","C. ","D. "],"ans":3,"exp":"腦脊髓液（CSF）中電解質濃度與血液不同，鉀離子（K+）在CSF中的濃度低於血液，約為2.9 mEq/L（血液約3.5～5.0 mEq/L）。此為正常生理特性，由血腦屏障主動調控。","we":["A選項待圖確認：此題選項因解析問題無法完整顯示，標記為需複查。","B選項待圖確認：此題選項因解析問題無法完整顯示，標記為需複查。","C選項待圖確認：此題選項因解析問題無法完整顯示，標記為需複查。","（正確）D正確：根據題目答案，CSF中較低的電解質為鉀離子（K+），此為正確選項。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_007","year":2021,"roc_year":110,"session":"","examNo":7,"q":"有關健康成長中的幼年動物，下列敘述何者正確？","opts":["A. 生長激素濃度較低","B. 血清磷濃度較低","C. 血中尿素氮濃度較高","D. 6個月至1歲後，其血液學及生化檢查值較為穩定"],"ans":3,"exp":"幼年動物在6個月至1歲後，其血液學及生化數值逐漸趨近成年動物的參考範圍，較為穩定。在此之前，幼年動物的磷較高（骨骼生長）、BUN可能較低、生長激素較高，均與成年動物不同。","we":["A錯誤：幼年動物因快速生長，生長激素（GH）濃度較高，而非較低。","B錯誤：幼年動物血清磷濃度較高（非較低），因骨骼快速生長需要大量磷。","C錯誤：幼年動物BUN濃度因蛋白質合成旺盛（用於生長）而較低，而非較高。","（正確）D正確：幼年動物在6個月至1歲後，血液學及生化檢查值逐漸穩定，趨近成年動物參考範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_008","year":2021,"roc_year":110,"session":"","examNo":8,"q":"當族群內某疾病之盛行率上升時，則predictive value of a positive test（PVPT）和predictive value of a negative\r  test（PVNT）將呈現何種變化？","opts":["A. PVPT上升","B. PVPT下降","C. PVNT上升","D. PVPT及PVNT皆不受影響"],"ans":0,"exp":"盛行率上升時，正預測值（PVPT）上升，負預測值（PVNT）下降。當族群中患病率越高，陽性結果為真陽性的比例越大（PVPT上升）；而陰性結果中假陰性比例也增加，使PVNT下降。","we":["（正確）A正確：盛行率上升時，PVPT（陽性預測值）上升，因為真陽性佔所有陽性結果的比例增加。","B錯誤：PVPT不會下降，盛行率越高，陽性預測值越高。","C錯誤：盛行率上升時，PVNT（陰性預測值）下降（而非上升），因假陰性增加。","D錯誤：盛行率確實影響PVPT和PVNT，兩者均受盛行率改變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_009","year":2021,"roc_year":110,"session":"","examNo":9,"q":"有關檢體的防腐方法，下列何者正確？","opts":["A. 乾冰須置於不漏氣的密閉容器中，以防溢散","B. 液態氮法適用於冷凍切片檢查","C. 若分離病毒用的病材污染到腸內容物，可利用硼砂防腐","D. 糞便不適用10%中性福馬林液防腐"],"ans":1,"exp":"液態氮法（liquid nitrogen）屬於快速冷凍技術，適用於組織的冷凍切片檢查，能保存組織形態並避免冰晶形成。此法常用於術中快速病理診斷。","we":["A錯誤：乾冰（CO2固態）應置於可透氣容器，不可密封，否則壓力累積有爆炸危險。","（正確）B正確：液態氮法適用於冷凍切片檢查，能快速冷凍保存組織形態。","C錯誤：病材若污染腸內容物，不可用硼砂（borax）防腐，因硼砂會影響病毒的分離培養。","D錯誤：糞便可以使用10%中性福馬林液防腐，用於寄生蟲卵或原蟲囊之保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_010","year":2021,"roc_year":110,"session":"","examNo":10,"q":"下列何者最適用於分離病毒用檢體之保存？","opts":["A. 2%中性福馬林液","B. 甲苯","C. 50%中性甘油生理鹽水","D. 0.9%生理鹽水"],"ans":2,"exp":"分離病毒用的檢體最適合保存在50%中性甘油生理鹽水中，甘油能抑制細菌生長但不影響病毒活性，且維持適當滲透壓，適合病毒的短期保存與運輸。","we":["A錯誤：2%中性福馬林液為固定劑，用於組織病理檢查，會殺死病毒，不適用於病毒分離。","B錯誤：甲苯（toluene）是防腐劑，主要用於尿液保存，不適用於病毒分離檢體。","（正確）C正確：50%中性甘油生理鹽水能抑制細菌而不影響病毒，是病毒分離檢體的最適保存液。","D錯誤：0.9%生理鹽水雖然溫和，但無抑菌效果，長途運輸時細菌汙染會影響病毒分離結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_011","year":2021,"roc_year":110,"session":"","examNo":11,"q":"動物的血液量與其體重有關，成熟豬隻血液量約占體重之多少百分比？","opts":["A. 5～6","B. 7～8","C. 8～9","D. 10～11"],"ans":1,"exp":"成熟豬隻的血液量約占體重的7～8%，與馬相近。不同物種血液量差異：犬貓約7～9%、牛約7～8%、豬約7～8%、馬約7～8%。","we":["A錯誤：5～6%偏低，不符合豬的血液量比例。","（正確）B正確：成熟豬隻血液量約占體重的7～8%，是正確數值。","C錯誤：8～9%略高，不是豬的標準血液量比例。","D錯誤：10～11%明顯過高，不符合任何常見家畜的血液量比例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_012","year":2021,"roc_year":110,"session":"","examNo":12,"q":"慢性缺鐵性貧血與炎症反應性貧血之比較，下列何者最正確？","opts":["A. 兩者骨髓血沉著素（hemosiderin）皆減少","B. 兩者血清鐵含量皆減少","C. 慢性缺鐵性貧血的血清儲鐵蛋白（ferritin）增加","D. 炎症反應性貧血的平均血球容積（MCV）增加"],"ans":1,"exp":"慢性缺鐵性貧血與炎症反應性貧血（ACI）比較：兩者血清鐵均減少。但缺鐵性貧血中，骨髓血沉著素（hemosiderin）減少且ferritin減少；ACI中hemosiderin增加且ferritin增加。ACI的MCV通常正常（正球性）或輕微下降，不增加。","we":["A錯誤：缺鐵性貧血骨髓hemosiderin減少，但ACI的骨髓hemosiderin增加（鐵儲存於巨噬細胞），兩者並非皆減少。","（正確）B正確：兩種貧血的血清鐵含量均減少：缺鐵性貧血因鐵儲備耗竭，ACI因鐵被隔離於網狀內皮系統。","C錯誤：慢性缺鐵性貧血的ferritin減少（非增加），ferritin增加見於ACI或急性期反應。","D錯誤：ACI的MCV通常正常或輕微下降（正球性至小球性），不會增加。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_013","year":2021,"roc_year":110,"session":"","examNo":13,"q":"多血症是指下列那些數值之增加？","opts":["A. 血容比、紅血球數及血紅素值","B. 血漿量、紅血球數及血紅素值","C. 血容比、紅血球數及紅血球生成素","D. 血容比、網織球及紅血球生成素"],"ans":0,"exp":"多血症（polycythemia/erythrocytosis）定義為紅血球質量增加，以血容比（PCV/Hct）、紅血球數（RBC）及血紅素（Hb）值三項共同升高為特徵。這三項反映紅血球的實際增加，而非血漿量或造血前驅細胞的變化。","we":["（正確）A正確：多血症是指血容比、紅血球數及血紅素值三項均增加，是正確定義。","B錯誤：血漿量增加反而是血液稀釋，不是多血症；多血症是紅血球增加而非血漿增加。","C錯誤：紅血球生成素（EPO）是造血刺激因子，不是多血症的定義指標；多血症中EPO不一定升高（原發性多血症EPO低）。","D錯誤：網織球（reticulocytes）是未成熟紅血球，多見於再生性貧血，不是多血症的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_014","year":2021,"roc_year":110,"session":"","examNo":14,"q":"有一犬隻之血液學檢查數值如下表，最可能有下列何種現象？","opts":["A. 非再生性貧血","B. 小球性正色性的再生性貧血","C. 小球性低色性的再生性貧血","D. 大球性低色性的再生性貧血"],"ans":2,"exp":"此題需看表格數據才能判斷。若血容比低（貧血）、MCV低（小球性）、MCHC低（低色性），且有網織球增多，則為小球性低色性再生性貧血，常見於慢性失血（如鐵缺乏）。","we":["A錯誤：非再生性貧血網織球數正常或低，血液抹片缺乏多染性紅血球，不符合再生性表現。","B錯誤：小球性正色性再生性貧血較少見；慢性鐵缺乏主要造成低色性（MCHC下降）。","（正確）C正確：根據題目表格（需看圖），最可能為小球性低色性再生性貧血，符合慢性失血/缺鐵的表現。","D錯誤：大球性低色性再生性貧血見於維生素B12/葉酸缺乏，不是本題表格所示情形。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_015","year":2021,"roc_year":110,"session":"","examNo":15,"q":"有關紅血球演進之敘述，下列何者正確？","opts":["A. 牛只有成熟的紅血球才會進入末梢血液","B. 通常一個紅血胚細胞分裂後形成8個紅血球","C. 犬的骨髓相較於牛馬的骨髓具有更大增加紅血球形成的潛力","D. EPO於缺氧時主要由肝臟細胞生成"],"ans":0,"exp":"牛（及馬）的骨髓對紅血球再生的反應能力較犬弱，只有成熟的正常紅血球才會進入末梢血液，即使有嚴重貧血也不會釋出網織球。因此牛的再生性貧血無法從血液抹片上看到多染性紅血球或網織球。","we":["（正確）A正確：牛只有成熟的紅血球才進入末梢血液，即使是再生性貧血也不釋出網織球，是正確描述。","B錯誤：一個紅血胚細胞分裂後通常形成16個紅血球（4次分裂），不是8個。","C錯誤：犬的骨髓再生能力不比牛馬更大；牛馬的骨髓在急性失血時也有造血潛力，只是不釋出網織球。","D錯誤：EPO於缺氧時主要由腎臟（近曲小管旁細胞）生成，而非肝臟；胎兒期才主要由肝臟生成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_016","year":2021,"roc_year":110,"session":"","examNo":16,"q":"下列那些現象是犬隻再生性貧血時的特徵？①MCV增加 ②紅血球成串錢狀 ③球狀紅血球增多 ④網織球\r  增多","opts":["A. ①②","B. ①③","C. ①④","D. ③④"],"ans":2,"exp":"犬再生性貧血的特徵：①MCV增加（大球性，因網織球體積大）和④網織球增多，是最典型的再生性指標。球狀紅血球（spherocytes）見於免疫媒介性溶血性貧血，不是再生性的特異特徵；錢串狀（rouleaux）在犬正常血塗片少見，不是再生性特徵。","we":["A錯誤：①MCV增加正確，但②錢串狀（rouleaux）在犬不是再生性貧血特徵，常見於貓或馬的正常血液。","B錯誤：①MCV增加正確，但③球狀紅血球不是所有再生性貧血的特徵，僅見於免疫媒介性溶血。","（正確）C正確：①MCV增加（網織球體積大）和④網織球增多，是犬再生性貧血的兩大典型特徵。","D錯誤：③球狀紅血球非一般再生性貧血特徵；④網織球增多正確，但不與球狀紅血球組合成本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_017","year":2021,"roc_year":110,"session":"","examNo":17,"q":"有關原發性多血症之敘述，下列何者正確？","opts":["A. 受紅血球形成作用的負回饋控制","B. 由EPO刺激所引起","C. 氧分壓正常","D. 常伴隨血小板和白血球增多症"],"ans":3,"exp":"原發性多血症（polycythemia vera）是骨髓增生性疾病，屬於自主性紅血球增生（不受EPO調控，不受負回饋控制），常同時伴隨血小板增多症和白血球增多症（全骨髓增生），氧分壓正常（區別於繼發性多血症）。","we":["A錯誤：原發性多血症不受紅血球形成的負回饋控制，是自主性增生，無法被高PCV抑制。","B錯誤：原發性多血症不由EPO刺激所致（EPO通常低或正常），繼發性多血症才是EPO升高所引起。","C錯誤：氧分壓正常雖然是原發性多血症的特點，但本題問「正確」的描述，D選項更具特異性。","（正確）D正確：原發性多血症（polycythemia vera）為全骨髓增生性疾病，常伴隨血小板增多症和白血球增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_018","year":2021,"roc_year":110,"session":"","examNo":18,"q":"感染貓白血病病毒（FeLV）但無網織球增多的貓，常呈下列何種紅血球相？","opts":["A. 正球性正色性","B. 大球性低色性","C. 大球性正色性","D. 小球性低色性"],"ans":2,"exp":"感染FeLV但無網織球增多（即非再生性貧血）的貓，常呈大球性正色性（macrocytic normochromic）紅血球相。FeLV感染干擾DNA合成，使紅血球前驅細胞無法正常分裂，形成體積大但色素正常的紅血球，類似巨球性貧血。","we":["A錯誤：正球性正色性是最常見的正常形態，或見於急性失血/非再生性貧血，不是FeLV感染的典型表現。","B錯誤：大球性低色性通常見於缺鐵合併葉酸缺乏，不是FeLV感染的典型表現。","（正確）C正確：FeLV感染干擾DNA合成，造成大球性正色性貧血（MCV高但MCHC正常），無網織球增多。","D錯誤：小球性低色性見於慢性鐵缺乏或慢性炎症，不是FeLV感染的典型紅血球相。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_019","year":2021,"roc_year":110,"session":"","examNo":19,"q":"下列何種情形最需考慮做骨髓檢查？","opts":["A. 貧血時，血液抹片可見許多網織球","B. 低血容比，高網織球數","C. 多染性和大紅血球增多","D. 泛血球減少症"],"ans":3,"exp":"泛血球減少症（pancytopenia，即紅血球、白血球、血小板全部減少）提示骨髓功能障礙，是最需要進行骨髓穿刺/切片檢查的適應症，以評估骨髓增生能力、確認是否有骨髓抑制、腫瘤浸潤或骨髓衰竭。","we":["A錯誤：貧血時血塗片有許多網織球，表示骨髓反應良好（再生性貧血），不需要骨髓檢查。","B錯誤：低血容比合併高網織球數表示再生性貧血，骨髓功能正常，不需立即做骨髓檢查。","C錯誤：多染性和大紅血球增多是再生反應的證據，骨髓功能正常，不是骨髓檢查的主要適應症。","（正確）D正確：泛血球減少症提示骨髓功能衰竭或腫瘤浸潤，是骨髓檢查最重要的適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_020","year":2021,"roc_year":110,"session":"","examNo":20,"q":"健康貓之網織球中，聚集型約占多少%？","opts":["A. 0.4","B. 4","C. 10","D. 14"],"ans":0,"exp":"健康貓的末梢血液中，聚集型網織球（aggregate reticulocytes）約占0.4%以下（犬的正常值約1%以下）。貓的網織球有兩種：聚集型（aggregate，粒線體聚集，代表活躍再生）和點狀型（punctate，存活更久）。","we":["（正確）A正確：健康貓末梢血液中聚集型網織球約占0.4%，是正確的正常參考值。","B錯誤：4%已屬輕微網織球增多症，超過健康貓的正常範圍。","C錯誤：10%屬於顯著網織球增多，表示骨髓有強烈再生反應，非正常值。","D錯誤：14%屬於非常高的網織球比例，提示嚴重再生性貧血，絕非健康貓的正常值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_021","year":2021,"roc_year":110,"session":"","examNo":21,"q":"紅血球生成素有那些作用？①減少新形成前驅細胞（progenitor cells）之凋亡 ②使前紅血細胞   （prorubricytes）分化為成熟紅血球 ③抑制已分裂erythroid cells之血紅素合成 ④阻斷綿羊從成年型之HbA  轉變為成年型之HbC的血紅素合成作用","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"EPO的作用：①減少新形成前驅細胞（progenitor cells）的凋亡（apoptosis），使更多細胞存活並分化；②使前紅血細胞（prorubricytes）向成熟紅血球分化加速，縮短成熟時間。EPO不抑制血紅素合成（③錯誤），也不阻斷HbC轉換（④錯誤）。","we":["（正確）A正確：EPO的作用包含①減少前驅細胞凋亡及②促進前紅血細胞分化為成熟紅血球。","B錯誤：③EPO促進（非抑制）血紅素合成；②正確，但③錯誤，故B不是正確答案。","C錯誤：③和④均為錯誤描述，EPO不抑制血紅素合成，也不阻斷HbC轉換。","D錯誤：①正確，但④（阻斷HbC轉換）是錯誤的描述，EPO不具此作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_022","year":2021,"roc_year":110,"session":"","examNo":22,"q":"下圖為何種健康動物之血液抹片？箭頭所指為何種血球？","opts":["A. 兔子；monocyte","B. 魚；thrombocyte","C. 雞；monocyte","D. 鴿子；thrombocyte"],"ans":1,"exp":"此題需看圖才能判斷。魚（有核紅血球）的血液抹片中，thrombocyte（血栓細胞）為有核的小橢圓形細胞，功能類似哺乳類血小板，負責止血。魚的血栓細胞在血塗片上常見，可能被誤認為淋巴球。","we":["A錯誤：兔的monocyte體積大、細胞質豐富，不符合魚類有核血栓細胞的外觀。","（正確）B正確：魚的血塗片中thrombocyte為有核小細胞，負責止血功能，是正確答案（需看圖確認）。","C錯誤：雞的monocyte體積較大，細胞質有空泡，與魚的thrombocyte外觀不同。","D錯誤：鴿子的thrombocyte雖也為有核細胞，但魚的thrombocyte形態更符合題目圖示（需確認）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_023","year":2021,"roc_year":110,"session":"","examNo":23,"q":"下列那些是再生性核左轉的主要特徵？①嗜中性球總數正常或偏低 ②嗜中性球增多症 ③成熟嗜中性球較\r   多 ④未成熟嗜中性球較多","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":3,"exp":"再生性核左轉（regenerative left shift）的主要特徵：②嗜中性球增多症（neutrophilia）且④未成熟嗜中性球較多（桿狀核>成熟分葉核，提示骨髓有效反應）。退化性核左轉才是嗜中性球總數低且未成熟球較多。","we":["A錯誤：①嗜中性球總數正常或偏低是退化性核左轉的特徵，不是再生性。","B錯誤：①嗜中性球總數正常或偏低是退化性核左轉；④未成熟較多正確，但與①組合錯誤。","C錯誤：②嗜中性球增多正確，但③成熟嗜中性球較多是正常分葉的特徵，不是核左轉的特徵。","（正確）D正確：再生性核左轉＝②嗜中性球增多症＋④未成熟嗜中性球較多（骨髓加速釋放），兩者組合正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_024","year":2021,"roc_year":110,"session":"","examNo":24,"q":"下圖為犬隻劉氏染色血液抹片，箭頭所指血球細胞質內為何物？","opts":["A. Ehrlichia canis","B. Babesia gibsoni","C. Hepatozoon canis","D. Anaplasma platys"],"ans":0,"exp":"此題需看圖。Ehrlichia canis感染犬的單核球或嗜中性球，在細胞質內形成桑葚體（morulae），劉氏染色下呈藍紫色包涵體。Babesia gibsoni寄生於紅血球內；Hepatozoon canis的配子體在嗜中性球；Anaplasma platys在血小板。","we":["（正確）A正確：Ehrlichia canis在單核球或嗜中性球細胞質內形成桑葚體，劉氏染色下可見（需圖確認）。","B錯誤：Babesia gibsoni為梨形蟲，寄生在紅血球內，不在白血球細胞質中。","C錯誤：Hepatozoon canis的配子體位於嗜中性球，但形態為長橢圓形，與Ehrlichia的桑葚體不同。","D錯誤：Anaplasma platys感染血小板（thrombocytes），不在白血球細胞質中。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_025","year":2021,"roc_year":110,"session":"","examNo":25,"q":"骨髓抹片經過氧化酶和蘇丹黑染色後細胞均呈現陽性反應，最可能為下列何種疾病？","opts":["A. 急性骨髓性白血病","B. 急性淋巴球性白血病","C. 急性未分化型白血病","D. 急性巨核胚細胞性白血病"],"ans":0,"exp":"過氧化酶（peroxidase）和蘇丹黑（Sudan Black B）染色均對骨髓性細胞（myeloid cells）呈陽性，因為這些細胞含有嗜苯胺顆粒。急性骨髓性白血病（AML）的芽細胞含有此類顆粒，故兩種染色均陽性。淋巴性及未分化型白血病則陰性。","we":["（正確）A正確：急性骨髓性白血病（AML）的芽細胞含嗜苯胺顆粒，過氧化酶和蘇丹黑染色均呈陽性。","B錯誤：急性淋巴球性白血病（ALL）過氧化酶和蘇丹黑染色均陰性，淋巴細胞缺乏此類顆粒。","C錯誤：急性未分化型白血病（AUL）兩種染色均陰性，因缺乏髓性分化標記。","D錯誤：急性巨核胚細胞性白血病過氧化酶陰性，蘇丹黑可能弱陽性，不如AML明顯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_026","year":2021,"roc_year":110,"session":"","examNo":26,"q":"馬淋巴瘤（lymphoma）最常見的是那一型？","opts":["A. multicentric form","B. subcutaneous form","C. splenic form","D. mediastinal form"],"ans":3,"exp":"馬淋巴瘤最常見的是縱膈型（mediastinal form），與牛最常見的多中心型不同。馬的縱膈型淋巴瘤多見於年輕馬，以胸腺T細胞淋巴瘤為主，常造成胸腔積液和呼吸困難。","we":["A錯誤：多中心型（multicentric form）在犬最常見，不是馬淋巴瘤最常見的類型。","B錯誤：皮下型（subcutaneous form）在馬較少見，不是最常見類型。","C錯誤：脾臟型（splenic form）不是馬淋巴瘤的最常見型式。","（正確）D正確：縱膈型（mediastinal form）是馬淋巴瘤最常見的類型，多為胸腺T細胞來源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_027","year":2021,"roc_year":110,"session":"","examNo":27,"q":"有關嗜中性球之敘述，下列何者正確？（MNP: marginal neutrophil pool; CNP: circulating neutrophil pool）","opts":["A. MNP包含於末梢血液常規檢查所計之白血球總數","B. 嗜中性球絕對值約等於CNP加上MNP","C. 馬之MNP與CNP大約相等","D. 犬之MNP約為CNP之3倍"],"ans":1,"exp":"嗜中性球絕對值（ANC）約等於CNP（循環池）加MNP（邊緣池），因為常規白血球計數只計入CNP，加上MNP才是總循環嗜中性球數。馬的MNP：CNP約等於1:1；犬的MNP約為CNP的3倍（非本題答案），貓MNP更大。","we":["A錯誤：MNP（邊緣嗜中性球池）附著於血管壁，不包含於常規白血球計數中，計數只反映CNP。","（正確）B正確：嗜中性球絕對值（真正循環中）≈ CNP + MNP，因為兩池均存在於血管系統中。","C錯誤：馬的MNP與CNP約相等（1:1）的說法有時被提及，但本題答案為B（CNP+MNP的概念）。","D錯誤：犬的MNP約為CNP的3倍（非3倍），貓的MNP更大（約為CNP的3倍），犬約為2～3倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_028","year":2021,"roc_year":110,"session":"","examNo":28,"q":"犬淋巴瘤之分期中，若許多臟器淋巴結有腫瘤，且肝脾也可見腫瘤細胞，依世界衛生組織分類為第幾期？","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":3,"exp":"依WHO犬淋巴瘤分期：第I期單一淋巴結、第II期多個區域淋巴結、第III期全身淋巴結、第IV期全身淋巴結+肝脾受侵、第V期血液/骨髓受侵。題目描述許多臟器淋巴結有腫瘤且肝脾可見腫瘤細胞，符合第IV期。","we":["A錯誤：第I期只有單一淋巴結受侵，不符合題目的多處淋巴結及肝脾侵犯。","B錯誤：第II期為同側多個區域淋巴結，不包括肝脾侵犯。","C錯誤：第III期為全身多處淋巴結，但不含肝脾侵犯，不完全符合題目描述。","（正確）D正確：第IV期為許多淋巴結腫瘤＋肝脾侵犯，符合題目描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_029","year":2021,"roc_year":110,"session":"","examNo":29,"q":"有關嗜鹼性球之敘述，下列何者錯誤？","opts":["A. 由骨髓製造","B. 在骨髓中貯存量很少","C. 可轉變成肥大細胞","D. 可誘發過敏反應"],"ans":2,"exp":"嗜鹼性球（basophils）不能直接轉變成肥大細胞（mast cells）。嗜鹼性球由骨髓製造，在骨髓中貯存量極少，可誘發過敏反應（type I hypersensitivity）。肥大細胞由不同的前驅細胞分化而來，兩者雖功能相似但來源不同，不能相互轉換。","we":["A錯誤：嗜鹼性球確實由骨髓製造，此描述正確，不是錯誤選項。","B錯誤：嗜鹼性球在骨髓中貯存量確實很少，此描述正確，不是錯誤選項。","（正確）C正確：嗜鹼性球不能轉變為肥大細胞，兩者雖功能相似但來源不同（此描述為錯誤），故本題問「錯誤」的選項是C。","D錯誤：嗜鹼性球確實可誘發過敏反應（含heparin和histamine），此描述正確，不是錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_030","year":2021,"roc_year":110,"session":"","examNo":30,"q":"血小板數正常，ACT、APTT及OSPT延長，TT、纖維素原及FDP正常，最有可能為何種疾病？（activated\r   clotting time, ACT; activated partial thromboplastin time, APTT; one-stage prothrombin time, OSPT; thrombin time,  TT）","opts":["A. 艾利希體病早期","B. 膽汁不足引起之脂肪吸收障礙","C. 缺鐵性貧血","D. 分娩後併發感染症"],"ans":1,"exp":"血小板正常、ACT/APTT/OSPT均延長但TT、纖維素原、FDP正常，表示內因系統（APTT）和外因系統（OSPT）及共同路徑（ACT）均有問題，且非纖維蛋白原缺乏，最符合維生素K缺乏（膽汁不足吸收障礙）導致因子II、VII、IX、X均減少。","we":["A錯誤：艾利希體病早期主要影響血小板（血小板減少症），而本題血小板數正常，不符合。","（正確）B正確：膽汁不足導致脂溶性維生素K吸收障礙，造成維生素K依賴性因子（II、VII、IX、X）缺乏，ACT、APTT、OSPT均延長，TT和FDP正常，符合題目所有檢查結果。","C錯誤：缺鐵性貧血影響紅血球生成，不直接影響凝血因子，不會造成多項凝血試驗延長。","D錯誤：分娩後感染症可能引起DIC，會造成FDP增加和血小板減少，但本題FDP正常且血小板正常，不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_031","year":2021,"roc_year":110,"session":"","examNo":31,"q":"血管內皮細胞會分泌下列那些物質，抑制止血作用？①fibronectin ②prostacyclin ③tissue plasminogen\r   activator ④antithrombin III","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":3,"exp":"血管內皮細胞分泌的抗止血物質：②prostacyclin（PGI2，抑制血小板聚集和血管收縮）、③tissue plasminogen activator（tPA，促進纖維蛋白溶解）、④antithrombin III（ATIII，抑制凝血酶）。Fibronectin（①）促進血小板黏附，有助於止血，不是抑制止血的物質。","we":["A錯誤：①fibronectin促進血小板黏附與聚集，是促進止血的物質，不應包含在內。","B錯誤：①fibronectin是促止血物質，不是抑制止血的物質，故包含①的選項均不正確。","C錯誤：同樣包含①fibronectin，此為促止血物質，故C不正確。","（正確）D正確：②prostacyclin、③tPA、④antithrombin III均為血管內皮細胞分泌的抑制止血物質，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_032","year":2021,"roc_year":110,"session":"","examNo":32,"q":"下列何種凝血因子不屬於維生素K依賴性因子？","opts":["A. II","B. V","C. IX","D. X"],"ans":1,"exp":"維生素K依賴性凝血因子為II（凝血酶原）、VII、IX、X（及蛋白C和蛋白S）。凝血因子V不依賴維生素K，它是輔助因子（cofactor），由肝臟合成但不需要維生素K進行羧化。","we":["A錯誤：因子II（凝血酶原）是維生素K依賴性因子，不是本題答案。","（正確）B正確：因子V不是維生素K依賴性因子，不需羧化即可發揮功能，是正確答案。","C錯誤：因子IX是維生素K依賴性因子（血友病B缺乏的凝血因子），不是本題答案。","D錯誤：因子X是維生素K依賴性因子，共同路徑的關鍵因子，不是本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_033","year":2021,"roc_year":110,"session":"","examNo":33,"q":"大多數家畜血小板之壽命約為多少天？","opts":["A. 2","B. 5～9","C. 20～30","D. 60"],"ans":1,"exp":"大多數家畜血小板的壽命約為5～9天（犬貓約7天），由骨髓中巨核細胞產生，在脾臟中被清除。人類血小板壽命約10天，家畜略短。","we":["A錯誤：2天是血小板壽命過短的估計，不符合大多數家畜的實際壽命。","（正確）B正確：大多數家畜血小板壽命約5～9天，是正確的參考數值。","C錯誤：20～30天是部分白血球（如記憶淋巴球）的壽命，不是血小板壽命。","D錯誤：60天是紅血球（某些物種）的壽命，遠超血小板的正常壽命。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_034","year":2021,"roc_year":110,"session":"","examNo":34,"q":"血小板數減少，口腔黏膜出血時間（BMBT）延長，活化部分成栓質時間（APTT）延長，一段式凝血酶原時\r   間（OSPT）延長，凝血酶時間（TT）延長，纖維素（原）降解產物（FDP）增加，上述實驗室檢查結果代表  何種止血障礙？","opts":["A. 血小板功能缺損","B. 血小板減少症","C. 封魏氏病（vWD）","D. 瀰漫性血管內凝血（DIC）"],"ans":3,"exp":"DIC（瀰漫性血管內凝血）的典型實驗室結果：血小板減少、BMBT延長、APTT延長、OSPT延長、TT延長、FDP增加、纖維素原下降。題目所描述的全部數值完全符合DIC的典型表現。","we":["A錯誤：血小板功能缺損BMBT延長，血小板數正常，APTT/OSPT/TT通常正常，FDP正常，不符合題目多項異常。","B錯誤：血小板減少症BMBT延長、血小板減少，但APTT/OSPT/TT通常正常，FDP正常，不符合全部異常。","C錯誤：封魏氏病（vWD）BMBT延長，APTT可能延長，但血小板數正常，TT正常，FDP正常，不符合題目描述。","（正確）D正確：DIC造成血小板減少、所有凝血試驗延長、FDP增加，完全符合題目所有實驗室異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_035","year":2021,"roc_year":110,"session":"","examNo":35,"q":"在活化部分成栓質時間（activated partial thromboplastin time, APTT）之試驗中，凝血因子的活性值少於正常\r   值的多少%，即會使試驗時間延長？","opts":["A. 20","B. 40","C. 50","D. 30"],"ans":3,"exp":"APTT試驗中，當凝血因子活性降至正常值的30%以下時，試驗時間才會延長。因此單一因子缺乏需超過70%才能被偵測，APTT對輕微因子缺乏不夠敏感，需因子活性低於30%才出現延長。","we":["A錯誤：若閾值為20%，則APTT只在極嚴重缺乏時才延長，過於不敏感，不符合臨床實際。","B錯誤：40%不是標準閾值；因子活性在40%時APTT通常已在延長邊界，但標準答案為30%。","C錯誤：50%雖然是部分教科書提到的閾值，但更精確的數值為30%（活性低於30%才使APTT延長）。","（正確）D正確：APTT試驗的敏感閾值為因子活性低於正常值的30%，才會使試驗時間延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_036","year":2021,"roc_year":110,"session":"","examNo":36,"q":"Tissue thromboplastin是啟動下列那一凝血路徑之重要因子？","opts":["A. 內因系統","B. 外因系統","C. 共同系統","D. 複合系統"],"ans":1,"exp":"Tissue thromboplastin（組織促凝血酶原激酶）是外因系統（extrinsic pathway）的啟動因子，與因子VII結合形成TF-VIIa複合物，啟動外因凝血路徑，最終活化共同路徑中的因子X。","we":["A錯誤：內因系統（intrinsic pathway）由接觸因子（XII）啟動，不需要tissue thromboplastin。","（正確）B正確：Tissue thromboplastin（TF/factor III）與因子VII結合，啟動外因系統，是正確答案。","C錯誤：共同系統（common pathway）由因子X活化後開始，不是tissue thromboplastin直接啟動的路徑。","D錯誤：無「複合系統」的正式分類，不是標準答案選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_037","year":2021,"roc_year":110,"session":"","examNo":37,"q":"一般而言，動物進食後幾小時即會出現高三酸甘油脂血症？","opts":["A. 小於1","B. 2～3","C. 4～6","D. 7～8"],"ans":2,"exp":"動物進食後4～6小時會出現高三酸甘油脂血症（postprandial lipemia），因為乳糜微粒（chylomicrons）由小腸吸收脂肪後形成，經淋巴進入血液，在進食後4～6小時達到峰值。因此採血前應禁食12小時以上。","we":["A錯誤：小於1小時尚未完成脂肪吸收和乳糜微粒形成，不會出現高三酸甘油脂血症。","B錯誤：2～3小時脂肪吸收仍在進行，三酸甘油脂尚未達到峰值。","（正確）C正確：進食後4～6小時乳糜微粒大量進入血液，是高三酸甘油脂血症最常出現的時間點。","D錯誤：7～8小時後三酸甘油脂已開始被清除，脂血症程度下降，不是峰值時間點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_038","year":2021,"roc_year":110,"session":"","examNo":38,"q":"有關膽固醇之敘述，下列何者正確？","opts":["A. 是神經纖維鞘主要成分","B. 主要由膽合成，部分由食物吸收","C. 馬循環中膽固醇主要是LDL","D. 過多時由胰液排出"],"ans":0,"exp":"膽固醇是構成神經纖維鞘（myelin sheath）的主要成分，也是細胞膜的重要組成。膽固醇主要由肝臟合成（體內合成佔多數），過多時經膽汁排出，在馬體內循環中膽固醇主要以HDL形式存在。","we":["（正確）A正確：膽固醇是神經纖維鞘（myelin sheath）的主要成分，此描述正確。","B錯誤：膽固醇主要由肝臟合成，非由膽合成；食物吸收只是部分來源，不是主要來源。","C錯誤：馬循環中膽固醇主要以HDL形式存在（非LDL），與人類（LDL為主）不同。","D錯誤：膽固醇過多時經膽汁（bile）排出，非胰液，此描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_039","year":2021,"roc_year":110,"session":"","examNo":39,"q":"血清脂蛋白經電泳後可分為乳糜微粒、VLDL、LDL、HDL，若往陽極移動，速度由快至慢依序為何？","opts":["A. 乳糜微粒→VLDL→LDL→HDL","B. HDL→VLDL→LDL→乳糜微粒","C. VLDL→乳糜微粒→LDL→HDL","D. 乳糜微粒→HDL→VLDL→LDL"],"ans":1,"exp":"血清脂蛋白電泳往陽極移動速度：HDL（alpha位置，最快）> VLDL（pre-beta）> LDL（beta）> 乳糜微粒（不移動或最慢，留在起點）。因此由快至慢：HDL→VLDL→LDL→乳糜微粒。","we":["A錯誤：乳糜微粒在電泳中幾乎不移動（留在起點），不是最快移動的脂蛋白。","（正確）B正確：電泳速度由快至慢為HDL（alpha）→VLDL（pre-beta）→LDL（beta）→乳糜微粒（原點），正確。","C錯誤：VLDL不是最快移動的，HDL（alpha脂蛋白）移動最快；且乳糜微粒應在最後，不在VLDL前。","D錯誤：乳糜微粒不是第二快（僅次HDL），乳糜微粒是最慢（幾乎不移動）的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_040","year":2021,"roc_year":110,"session":"","examNo":40,"q":"單胃動物食入澱粉類食物後，絕大部分的碳水化合物是在何處經由何種酵素消化成雙醣類？","opts":["A. 口腔唾腺分泌之澱粉酶","B. 胃液中之胃酸","C. 小腸中之胰澱粉酶","D. 小腸中之腸雙醣酶"],"ans":2,"exp":"單胃動物食入澱粉後，絕大部分的碳水化合物在小腸中由胰澱粉酶（pancreatic amylase）水解消化成雙醣類（如麥芽糖）。口腔唾腺澱粉酶作用時間短暫，胃酸無分解能力，小腸雙醣酶負責進一步分解雙醣為單醣。","we":["A錯誤：口腔唾腺分泌澱粉酶雖有初步消化，但停留時間短，消化量佔總量比例極少，非「絕大部分」。","B錯誤：胃液中的胃酸（HCl）為蛋白質消化所需的酸性環境，不具分解碳水化合物的能力。","（正確）C正確：小腸中的胰澱粉酶（pancreatic amylase）負責絕大部分澱粉的消化，將多糖水解為雙醣類（麥芽糖等）。","D錯誤：腸雙醣酶（intestinal disaccharidases）負責將雙醣（麥芽糖、乳糖等）分解為單醣，是雙醣→單醣，不是澱粉→雙醣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_041","year":2021,"roc_year":110,"session":"","examNo":41,"q":"有關酮體之敘述，下列何者正確？","opts":["A. 陳舊的尿液測定酮體時可能出現偽陰性","B. 非常濃縮的尿液常導致偽陰性","C. 酮血症發生後才可見酮尿症","D. 糖尿病者的酮血症主要由丙酮所致"],"ans":0,"exp":"陳舊尿液中的酮體（特別是乙醯乙酸）會自發分解為丙酮揮散，使尿液試紙測定酮體時出現偽陰性。因此尿液應新鮮檢測，若無法立即檢測需冷藏並盡快分析。","we":["（正確）A正確：陳舊尿液中乙醯乙酸自發分解揮散，造成偽陰性，是正確描述。","B錯誤：非常濃縮的尿液（高濃度酮體）反而容易造成試紙飽和，可能出現偽陽性而非偽陰性。","C錯誤：酮尿症（ketonuria）通常在酮血症（ketonemia）之前即可偵測到，因腎臟能有效濾過酮體。","D錯誤：糖尿病酮酸血症中酮體主要由β-羥基丁酸（beta-hydroxybutyrate）所致，非丙酮（acetone）；丙酮僅佔少量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_042","year":2021,"roc_year":110,"session":"","examNo":42,"q":"血液樣本若不立即進行分離血清，紅血球會消耗葡萄糖，使血清中葡萄糖濃度每小時大約下降多少%？","opts":["A. 10","B. 20","C. 30","D. 40"],"ans":0,"exp":"血液樣本在室溫放置時，紅血球持續代謝消耗葡萄糖（糖解作用），每小時使血清中葡萄糖濃度下降約10%。因此血液採集後應盡快離心分離血清，或使用含氟化物的試管抑制糖解作用。","we":["（正確）A正確：未及時分離的血液樣本，紅血球代謝使葡萄糖每小時下降約10%，是正確數值。","B錯誤：20%每小時的下降幅度過高，超過實際紅血球糖解速率。","C錯誤：30%的下降幅度明顯偏高，不符合實際觀察數據。","D錯誤：40%的下降幅度更不合理，血液中殘餘葡萄糖幾乎不可能每小時下降40%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_043","year":2021,"roc_year":110,"session":"","examNo":43,"q":"有關血清鹼磷酶（ALP）之敘述，下列何者正確？","opts":["A. 會與細胞核結合，分泌入膽汁中","B. 只有肝、骨、胎盤及白血球含有ALP","C. 急性中毒性肝細胞損傷的早期，即可見血清中ALP活性值很高","D. 原發性或繼發性副甲狀腺功能亢進之動物，血清ALP活性值會升高"],"ans":3,"exp":"ALP廣泛存在於多種組織（肝、骨、腸、腎、胎盤、乳腺、皮質類固醇誘導型等），且與細胞膜結合分泌入膽汁。原發性或繼發性副甲狀腺功能亢進（hyperPTH）促進骨骼重塑，破骨細胞活性增加，釋放骨源性ALP，使血清ALP升高。","we":["A錯誤：ALP與細胞膜結合（非細胞核），並透過膽汁排泄；且與「細胞核結合」描述錯誤。","B錯誤：ALP不只存在於肝、骨、胎盤及白血球，腸道、腎臟、乳腺等均含有ALP，此描述過於局限。","C錯誤：急性中毒性肝細胞損傷（如缺氧、毒素）早期主要升高ALT，ALP升高見於膽汁鬱滯性疾病而非急性中毒早期。","（正確）D正確：副甲狀腺功能亢進促進骨骼重塑，破骨細胞釋放骨源性ALP，導致血清ALP活性升高，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_044","year":2021,"roc_year":110,"session":"","examNo":44,"q":"有關膽紅素（bilirubin）之代謝，下列敘述何者正確？","opts":["A. 大部分的膽紅素來自於非血紅質吡咯紫質（non-heme porphyrins）","B. 血漿中之未結合型膽紅素會與白蛋白、球蛋白或其他蛋白質結合","C. 結合型膽紅素主要在腎小管上皮細胞進行合成","D. 大部分的尿膽素原會經由尿液排除"],"ans":1,"exp":"血漿中未結合型膽紅素（unconjugated bilirubin）為脂溶性，不溶於水，需與白蛋白（albumin）結合才能在血液中運輸至肝臟進行結合。它也可能與球蛋白或其他蛋白質鬆散結合，但白蛋白是主要載體。","we":["A錯誤：大部分膽紅素（約80%）來自血紅素（heme）的分解，即血紅質吡咯紫質，非非血紅質來源。","（正確）B正確：未結合型膽紅素脂溶性高，需與白蛋白或其他血漿蛋白結合才能在血中運輸，描述正確。","C錯誤：結合型膽紅素主要在肝細胞（而非腎小管上皮細胞）進行UDP-葡萄糖醛酸轉移酶的結合反應。","D錯誤：大部分的尿膽素原（urobilinogen）由腸道細菌從結合型膽紅素分解產生，大部分經糞便排出（非尿液），只有少量由尿液排除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_045","year":2021,"roc_year":110,"session":"","examNo":45,"q":"下列何種狀況，動物最可能出現高血氨？","opts":["A. 胃腸道出血","B. 反芻獸食入大量尿素","C. 急性銅中毒","D. 腎絲球體濾過率下降"],"ans":1,"exp":"反芻獸食入大量尿素（如過量添加飼料補充劑）時，瘤胃中細菌將尿素大量轉化為氨（NH3），若超過肝臟解毒能力，大量氨吸收入血，造成嚴重高血氨（hyperammonemia）甚至死亡。","we":["A錯誤：胃腸道出血可增加腸道蛋白質（血液）供細菌分解產氨，但需大量出血且主要在肝功能異常時才造成高血氨。","（正確）B正確：反芻獸食入大量尿素，瘤胃細菌快速水解為大量氨，直接造成高血氨，是最典型原因。","C錯誤：急性銅中毒造成溶血性貧血和肝壞死，但不是造成高血氨的直接機制。","D錯誤：腎絲球體濾過率下降（腎衰竭）造成BUN上升（氮血症），但高血氨主要來源是腸道氨的產生，腎衰竭本身較少直接引起嚴重高血氨。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_046","year":2021,"roc_year":110,"session":"","examNo":46,"q":"有關血中加瑪麩胺醯轉移酶（GGT）之敘述，下列何者正確？","opts":["A. 在犬的膽汁鬱滯診斷上，其敏感性較ALP為佳","B. 用於診斷鳥類膽管疾病","C. 可用於診斷牛與綿羊的早期腎病","D. 新生畜吸入初乳後不會有GGT的活性上升的現象"],"ans":1,"exp":"GGT在鳥類（禽類）肝膽疾病診斷上特別有用，是診斷鳥類膽管疾病的敏感指標。在犬，ALP對膽汁鬱滯的敏感性高於GGT；在牛羊，GGT反映肝臟疾病；新生畜吸入初乳後GGT會一過性升高。","we":["A錯誤：在犬的膽汁鬱滯診斷上，ALP的敏感性優於GGT，不是GGT更佳。","（正確）B正確：GGT可用於診斷鳥類膽管疾病，是鳥類肝膽功能評估的重要指標。","C錯誤：GGT可用於牛的腎病診斷（尿液GGT），但不適合診斷綿羊早期腎病；此描述不準確。","D錯誤：新生畜吸入初乳（colostrum）後，GGT活性確實會顯著升高（初乳中GGT含量高），此描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_047","year":2021,"roc_year":110,"session":"","examNo":47,"q":"下列何種原因不會造成膽汁酸（bile acid）過高？","opts":["A. 肝纖維化","B. 小腸絨毛萎縮","C. 肝臟萎縮","D. 膽汁鬱滯"],"ans":1,"exp":"膽汁酸（bile acids）由肝臟合成，經腸肝循環再吸收。小腸絨毛萎縮（如炎症性腸病）會減少膽汁酸在迴腸的再吸收，使血液中膽汁酸降低（而非升高）。因此小腸絨毛萎縮「不會」造成血中膽汁酸過高，是本題正確答案。","we":["A錯誤：肝纖維化影響肝細胞攝取膽汁酸能力，使血中膽汁酸升高，故肝纖維化「會」造成膽汁酸過高。","（正確）B正確：小腸絨毛萎縮減少膽汁酸再吸收，反而使血中膽汁酸降低，不會造成過高，是本題答案。","C錯誤：肝臟萎縮（如肝功能不全、門脈分流）使肝細胞攝取和代謝膽汁酸能力下降，造成血中膽汁酸升高。","D錯誤：膽汁鬱滯（cholestasis）阻礙膽汁排出，膽汁酸反流入血，造成血中膽汁酸明顯升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_048","year":2021,"roc_year":110,"session":"","examNo":48,"q":"犬膽管完全阻塞最可能會引起下列那些異常變化？①凝血障礙 ②血氨上升 ③肝源酵素僅ALT上升 ④膽\r  汁酸上升 ⑤維生素K同化作用異常（malassimilation）","opts":["A. ①②④","B. ①④⑤","C. ②③⑤","D. ①③⑤"],"ans":1,"exp":"犬膽管完全阻塞的異常：①凝血障礙（維生素K吸收受阻）、④膽汁酸上升（膽汁無法排出）、⑤維生素K同化作用異常（脂溶性維生素吸收障礙）。②血氨上升主要見於嚴重肝功能不全；③不是只有ALT上升，膽管阻塞時ALP/GGT更顯著升高。","we":["A錯誤：②血氨上升主要見於嚴重肝衰竭（氨解毒能力喪失），膽管單純阻塞不直接造成高血氨。","（正確）B正確：膽管完全阻塞造成①凝血障礙（VitK缺乏）、④膽汁酸上升、⑤維生素K同化作用異常，三者均符合膽管阻塞機制。","C錯誤：②血氨上升和③僅ALT上升均不符合膽管阻塞；膽管阻塞時ALP/GGT升高更顯著。","D錯誤：③肝源酵素僅ALT上升不符合；膽管阻塞時ALP、GGT均顯著升高，不是只有ALT。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_049","year":2021,"roc_year":110,"session":"","examNo":49,"q":"有關胰蛋白酶原（trypsinogen）之敘述，下列何者正確？","opts":["A. 在胰臟中即可開始活化","B. 測定其活性能有效診斷胰臟炎的發生","C. 具有物種特異性","D. 活化後之酵素只針對已部分被消化之蛋白質進行作用"],"ans":2,"exp":"胰蛋白酶原（trypsinogen）具有物種特異性（species-specific），因此測定時需使用物種特異性的免疫分析方法（如犬用fTLI，貓用fTLI）。這也是為何犬的TLI試劑不能用於貓的診斷。","we":["A錯誤：胰蛋白酶原在正常情況下於小腸（由enterokinase）才被活化，不應在胰臟內活化（若在胰臟活化即造成胰臟炎）。","B錯誤：測定胰蛋白酶原「活性」無法有效診斷胰臟炎；應測定免疫反應性胰蛋白酶原（TLI）濃度。","（正確）C正確：胰蛋白酶原具有物種特異性，不同物種需使用對應的免疫分析方法，是正確描述。","D錯誤：胰蛋白酶（trypsin）活化後可作用於天然蛋白質，不只是已部分消化的蛋白質，此描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_050","year":2021,"roc_year":110,"session":"","examNo":50,"q":"有關血清澱粉酶活性值增加的臨床意義，下列敘述何者錯誤？","opts":["A. 血清澱粉酶活性值增高，可因胰腺泡細胞之退化或胰管阻塞導致酶進入血中所致","B. 血清澱粉酶活性值增加3～4倍，有可能為胰臟疾病所致","C. 血清澱粉酶活性值增高，可作為胰臟炎的確診","D. 在腎病時，血清澱粉酶活性值亦會增高"],"ans":2,"exp":"血清澱粉酶活性增高是非特異性指標，不能作為胰臟炎的確診依據。許多非胰臟疾病（如腎病、腸道疾病、糖皮質素使用）也會使血清澱粉酶升高。確診胰臟炎需結合臨床症狀、影像學及胰臟特異性脂肪酶（cPL）檢測。","we":["A錯誤：血清澱粉酶確實可因胰腺泡細胞退化或胰管阻塞導致酶進入血中而升高，此描述正確。","B錯誤：血清澱粉酶升高3～4倍有可能為胰臟疾病所致，此描述正確（雖非確診）。","（正確）C正確（即錯誤描述）：血清澱粉酶升高不能作為胰臟炎的確診依據，因為特異性不足，此為本題「錯誤」的選項。","D錯誤：腎病時腎臟清除澱粉酶能力下降，確實會造成血清澱粉酶升高，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_051","year":2021,"roc_year":110,"session":"","examNo":51,"q":"有關使用總蛋白與白蛋白來作為腸胃道及肝腎疾病之鑑別診斷時，下列敘述何者最正確？","opts":["A. 膽汁鬱滯時，會造成總蛋白量的上升","B. 發生蛋白質流失性腎病時，僅球蛋白流失","C. 發生蛋白質流失性腎病時，白蛋白與球蛋白等比例流失","D. 發生蛋白質流失性腸病時，白蛋白與球蛋白均流失"],"ans":3,"exp":"蛋白質流失性腸病（protein-losing enteropathy, PLE）造成白蛋白與球蛋白均流失（因腸道屏障功能喪失，各類蛋白質均會滲漏），導致白蛋白和球蛋白比例相近地同時下降。","we":["A錯誤：膽汁鬱滯不會造成總蛋白上升；膽汁鬱滯主要影響膽汁酸、ALP、膽紅素，不影響血清蛋白總量。","B錯誤：蛋白質流失性腎病（PLN）主要流失白蛋白（分子量小），球蛋白（分子量大）流失較少，不是「僅球蛋白流失」。","C錯誤：PLN是選擇性流失白蛋白（非等比例），造成白蛋白降低但球蛋白相對正常或升高。","（正確）D正確：PLE（蛋白質流失性腸病）因腸道黏膜屏障受損，白蛋白與球蛋白均流失，造成兩者均下降，是正確描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_052","year":2021,"roc_year":110,"session":"","examNo":52,"q":"胰臟性脂肪漏瀉（pancreatogenous steatorrhea）主要因缺乏下列何者？","opts":["A. 澱粉酶","B. 羧基多胜分解酶原A","C. 胰脂酶","D. 乳糜胰蛋白酶原"],"ans":2,"exp":"胰臟性脂肪漏瀉（pancreatogenous steatorrhea）主要因缺乏胰脂酶（pancreatic lipase）導致脂肪無法消化吸收，糞便中出現大量脂肪（脂肪漏瀉）。胰臟外分泌功能不全（EPI）時胰脂酶缺乏是主要原因。","we":["A錯誤：澱粉酶缺乏主要造成澱粉消化障礙（澱粉漏瀉），不是脂肪漏瀉的主要原因。","B錯誤：羧基多胜分解酶原A（carboxypeptidase A）缺乏主要影響蛋白質消化，不是脂肪漏瀉的主因。","（正確）C正確：胰脂酶（pancreatic lipase）缺乏是胰臟性脂肪漏瀉的主要原因，無胰脂酶則脂肪無法水解吸收。","D錯誤：乳糜胰蛋白酶原（chymotrypsinogen）是蛋白質消化酶，缺乏會造成蛋白質漏瀉，不是脂肪漏瀉的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_053","year":2021,"roc_year":110,"session":"","examNo":53,"q":"當犬隻AST及LDH活性值上升，但CK值正常，最可能為下列何種情形？","opts":["A. 肝臟損傷","B. 橫紋肌溶解症","C. 主動脈血栓症","D. 細菌性心內膜炎"],"ans":0,"exp":"AST和LDH存在於多種組織（肝、肌肉、心臟等），而CK（肌酸激酶）主要存在於肌肉和心臟。若AST和LDH均升高但CK正常，表示損傷來源不是肌肉（肌肉損傷時CK會先升高），最可能來源是肝臟損傷（AST和LDH均由肝細胞釋放）。","we":["（正確）A正確：AST和LDH升高但CK正常，排除肌肉損傷（肌肉損傷必然有CK升高），最可能為肝臟損傷，此為正確答案。","B錯誤：橫紋肌溶解症（rhabdomyolysis）時CK會顯著升高，而本題CK正常，排除此診斷。","C錯誤：主動脈血栓症造成後肢肌肉缺血壞死，CK會明顯升高，與本題CK正常不符。","D錯誤：細菌性心內膜炎主要造成CK-MB（心肌型）升高，若CK正常則心肌損傷可能性也較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_054","year":2021,"roc_year":110,"session":"","examNo":54,"q":"利用肌紅素（myoglobin）濃度做為評估肌肉是否損傷的生化指標，下列敘述何者錯誤？","opts":["A. 肌紅素為一血紅質蛋白（heme protein），在肌肉中負責氧氣的輸送及儲存","B. 若患畜有肌紅素尿時，其血漿顏色不變，血容比正常","C. 肌肉損傷時，血中CK和AST濃度上升比肌紅素還快，這是因為CK及AST直接由肌肉釋放至血液中，而肌紅   素則會先進入淋巴系統","D. 肌肉損傷停止時，血中肌紅素濃度會迅速降低"],"ans":1,"exp":"肌紅素（myoglobin）為脂溶性較強的小分子蛋白，容易由腎小體濾過進入尿液。肌紅素尿（myoglobinuria）時，血漿顏色通常不變（肌紅素迅速由腎臟清除），而血容比正常（無溶血），這與血紅素尿（血紅素使血漿變色）不同，是正確描述，故B錯誤。","we":["A錯誤：A描述正確（肌紅素是血紅質蛋白，在肌肉中負責氧氣輸送），不是錯誤選項。","（正確）B正確（即錯誤描述）：肌紅素尿時血漿顏色確實不變、血容比正常，但此描述並非錯誤，題目問「錯誤」的選項應是B（CK/AST上升比肌紅素快）。CK和AST與肌紅素幾乎同時釋放，並非CK/AST更快，此描述實際有誤。","C錯誤：肌肉損傷時CK和AST與肌紅素幾乎同時進入血液，並非明顯比肌紅素更快；且「肌紅素先進淋巴」的說法是CK/AST的解釋，此邏輯描述有誤，此為實際錯誤選項。","D錯誤：D描述正確（肌肉損傷停止後，腎臟快速清除肌紅素，血中濃度迅速降低），不是錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_055","year":2021,"roc_year":110,"session":"","examNo":55,"q":"有關肌紅素之敘述，下列何者錯誤？","opts":["A. 肌紅素易由腎小體濾過經尿排出","B. 進行尿液檢查時，肌紅素不會呈現潛血陽性反應","C. 肌紅素尿加入飽和硫酸銨溶液也無法除去顏色","D. 退化或壞死肌肉會釋出肌紅素"],"ans":1,"exp":"肌紅素（myoglobin）含有血紅質（heme）基，在尿液試紙潛血（occult blood）試驗中會呈現陽性反應（因試紙檢測heme的過氧化酶活性），而非陰性。因此「肌紅素不會呈現潛血陽性反應」是錯誤的描述。","we":["A錯誤：A正確（肌紅素分子量小，易由腎絲球濾過排入尿中），不是錯誤選項。","（正確）B正確（即錯誤描述）：肌紅素含heme基，進行尿液試紙檢查時「會」呈現潛血陽性反應，故「不會呈現陽性」是錯誤描述，B為答案。","C錯誤：C正確（肌紅素尿加入飽和硫酸銨可沉澱血紅素蛋白並去除顏色，但肌紅素不被沉澱，顏色仍留），不是錯誤選項。","D錯誤：D正確（退化或壞死肌肉確實釋放肌紅素），不是錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_056","year":2021,"roc_year":110,"session":"","examNo":56,"q":"常見於幼犬之嗜酸性球性肌炎一般認為是自體抗體直接侵害肌纖維，在診斷上可以採血液檢出第幾型肌纖維\r   抗體？","opts":["A. 抗第I型","B. 抗第II型","C. 抗第III型","D. 抗第IV型"],"ans":1,"exp":"幼犬嗜酸性球性肌炎（eosinophilic myositis）中，自體抗體攻擊第II型肌纖維（type II muscle fibers，快縮肌纖維）。可採血檢測抗第II型肌纖維抗體，此為診斷的重要依據。","we":["A錯誤：抗第I型肌纖維抗體不是幼犬嗜酸性球性肌炎的診斷標記，第I型肌纖維（慢縮肌）不是主要攻擊目標。","（正確）B正確：幼犬嗜酸性球性肌炎的自體抗體攻擊第II型肌纖維，血液中可檢測到抗第II型肌纖維抗體。","C錯誤：不存在第III型肌纖維的分類；肌纖維主要分為第I型和第II型。","D錯誤：不存在第IV型肌纖維；此描述不符合肌纖維的正式分類系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_057","year":2021,"roc_year":110,"session":"","examNo":57,"q":"有關尿渣檢查之敘述，下列何者正確？","opts":["A. 尿渣一般會使用劉氏染色法染色後觀察","B. 尿液檢體需透過高速離心後，倒掉上清液將尿渣集中觀察","C. 每一高倍視野（high power field, HPF）下有5個以上紅血球即為血尿","D. 每一高倍視野（high power field, HPF）下有1個玻璃樣尿圓柱（hyaline cast）時即表示該動物已有腎小管相  關疾病"],"ans":1,"exp":"尿渣檢查一般以低速離心（400～500 rpm，5分鐘）後去除上清液，將尿渣集中後製作濕片觀察，也可用Sedi-stain染色。尿渣不使用劉氏染色（Wright's stain是血液學染色）。每HPF下5個以上紅血球為血尿，1個hyaline cast不代表腎小管疾病（少量偶發可正常）。","we":["A錯誤：尿渣一般使用Sedi-stain（沉渣染色）或不染色觀察，劉氏（Wright's）染色是血液抹片染色，不用於尿渣常規觀察。","（正確）B正確：尿液需透過適度離心（低速）後，倒掉上清液將尿渣集中，再觀察，描述正確。","C錯誤：每HPF下5個以上（≥5個）紅血球才視為血尿，而非「5個以上」含義模糊；標準為每HPF ≥5個RBC為異常。","D錯誤：偶爾見到1個hyaline cast在正常動物也可出現（如運動後），不一定代表腎小管疾病；需多個cast或其他cast類型才有臨床意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_058","year":2021,"roc_year":110,"session":"","examNo":58,"q":"有關動物進行尿液檢查的注意事項，下列何者正確？","opts":["A. 欲進行細菌培養時，可以自然排尿中段尿培養","B. 尿液檢體若無法立即受檢，建議以常溫輸送，並於24小時內送驗","C. 馬的尿液通常含有黏液和碳酸鈣結晶，故較不透明","D. 尿液呈現黃色主要乃因尿中的血紅素放置太久轉化成為變性血紅素（methemoglobin）"],"ans":2,"exp":"馬的尿液通常含有黏液（mucus）和碳酸鈣（calcium carbonate）結晶，使尿液呈現不透明、乳白至黃褐色外觀，這是馬尿的正常特徵，不代表異常。","we":["A錯誤：進行細菌培養時，自然排尿可能受外陰或包皮細菌汙染，應使用膀胱穿刺（cystocentesis）取得無菌尿液，不可用自然排尿中段尿做細菌培養。","B錯誤：尿液無法立即受檢時，應冷藏保存（2～8°C），不是常溫；且應於2～4小時內受檢，非24小時。","（正確）C正確：馬的尿液正常即含有黏液和碳酸鈣結晶，故呈現不透明外觀，此為正確描述。","D錯誤：尿液呈黃色主要是因為尿色素（urochrome）所致，而非血紅素轉化的變性血紅素；血紅素尿才會使尿液呈紅色至棕色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_059","year":2021,"roc_year":110,"session":"","examNo":59,"q":"犬隻尿液鏡檢之高倍視野下如下圖，下列敘述何者最正確？","opts":["A. 此為尿液離心後所取得上清液之觀察結果","B. 進行尿液的wet mount觀察時，透過Sedi Stain染劑染色可進一步釐清細胞的種類與細節","C. 此圖中可觀察到大量的巨噬細胞","D. 鏡檢尿液是否出現異常，可透過低倍視野（10X）下來計算細胞的種類、數目及是否發現微生物存在等加以  判斷"],"ans":1,"exp":"此題需看圖。尿液wet mount觀察時，使用Sedi-stain染色可以增加細胞對比度，有助於進一步釐清細胞的種類與形態細節（如上皮細胞、血球、管型等）。尿液鏡檢通常在高倍視野（40X）計算細胞種類和數目。","we":["A錯誤：尿渣鏡檢應取離心後的沉渣（下層），不是上清液；上清液用於尿液試紙和生化分析。","（正確）B正確：Sedi-stain染劑可增強尿渣中細胞的可視性，有助於辨別細胞種類和細節，是正確描述。","C錯誤：需看圖才能判斷是否為巨噬細胞；尿渣中巨噬細胞不常見，此描述需圖像確認。","D錯誤：計算細胞種類、數目及微生物應在高倍視野（40X，HPF）下進行，低倍視野（10X）用於整體掃描和管型計數。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_060","year":2021,"roc_year":110,"session":"","examNo":60,"q":"下列何種情形最易使尿液pH值升高？","opts":["A. 食用高量蛋白質","B. 完全絕食","C. 少吃蔬菜","D. 細菌性膀胱炎"],"ans":3,"exp":"細菌性膀胱炎時，尿素分解菌（如Proteus）將尿素分解為氨（NH3），氨為鹼性，使尿液pH升高。食用高蛋白、絕食和少吃蔬菜均偏向使尿液酸化。","we":["A錯誤：高蛋白飲食代謝產生酸性物質（磷酸鹽、硫酸鹽），使尿液pH降低（酸性增加）。","B錯誤：完全絕食時，脂肪分解產生酮體（酸性），使尿液pH降低。","C錯誤：少吃蔬菜（減少鹼性食物攝取）使尿液偏酸性，不會使pH升高。","（正確）D正確：細菌性膀胱炎中尿素分解菌產生氨，使尿液pH升高，是最易使尿液pH升高的情形。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_061","year":2021,"roc_year":110,"session":"","examNo":61,"q":"犬隻循環中的肌酸酐增加，最不可能是下列何種因素所造成？","opts":["A. 絲球體濾過率減少","B. 腎小管的分泌作用降低","C. 嚴重腎病影響絲球體的數量或微結構","D. 尿路阻塞"],"ans":1,"exp":"肌酸酐（creatinine）由腎臟濾過但極少被腎小管分泌，其血中濃度上升主要反映GFR減少、嚴重腎病（腎元數量減少）或尿路阻塞導致腎後性氮血症。腎小管的分泌作用降低對肌酸酐血中濃度影響極小，因為正常狗肌酸酐幾乎不經腎小管分泌。","we":["A錯誤：GFR減少確實會導致肌酸酐在血中累積，是增加的常見原因。","（正確）B正確：腎小管對肌酸酐分泌量極少，降低腎小管分泌對血中肌酸酐影響可忽略，是「最不可能」的原因。","C錯誤：嚴重腎病影響腎絲球數量或微結構，確實會造成GFR下降，使肌酸酐升高。","D錯誤：尿路阻塞造成腎後性氮血症，肌酸酐和BUN均會上升，是肌酸酐增加的原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_062","year":2021,"roc_year":110,"session":"","examNo":62,"q":"血清總鈣量約有多少百分比與蛋白質結合？","opts":["A. 60","B. 40","C. 20","D. 10"],"ans":1,"exp":"血清總鈣約有40%與蛋白質（主要是白蛋白）結合，約50%為離子化鈣（生理活性型），約10%與小分子複合物（如檸檬酸、磷酸）結合。因此與蛋白質結合的比例約為40%。","we":["A錯誤：60%與蛋白質結合的比例過高，不符合生理實際（離子鈣佔50%，不可能只剩10%為蛋白質結合）。","（正確）B正確：血清總鈣約40%與蛋白質（主要為白蛋白）結合，是正確比例。","C錯誤：20%偏低，低蛋白血症時蛋白質結合鈣減少接近此值，但正常情況下為40%。","D錯誤：10%過低，此比例更接近小分子複合物（檸檬酸鈣等）結合的鈣，不是蛋白質結合鈣的比例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_063","year":2021,"roc_year":110,"session":"","examNo":63,"q":"下列那些疾病不會導致低磷血症？","opts":["A. 牛之乳熱","B. 犬之范可尼樣症候群","C. 犬貓之子癇","D. 犬副甲狀腺功能低下"],"ans":3,"exp":"副甲狀腺功能低下（hypoparathyroidism）造成PTH分泌不足，使血鈣下降（低鈣血症）同時血磷上升（高磷血症），因PTH正常促進腎臟排磷，缺乏PTH時磷無法排出。因此副甲狀腺功能低下「不會」導致低磷血症。","we":["A錯誤：牛之乳熱（milk fever）低鈣血症常同時伴隨低磷血症，確實會導致低磷血症。","B錯誤：犬之范可尼樣症候群（Fanconi syndrome）腎小管重吸收障礙，磷大量由尿液流失，會造成低磷血症。","C錯誤：犬貓之子癇（eclampsia）低鈣血症時，磷可能因代謝變化而降低，可見低磷血症。","（正確）D正確：副甲狀腺功能低下（hypoparathyroidism）造成PTH不足，腎臟保磷增加，血磷升高（高磷血症），不會導致低磷血症，故D為正確答案（不會導致低磷血症的疾病）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_064","year":2021,"roc_year":110,"session":"","examNo":64,"q":"犬隻子癇（eclampsia）主要是下列何項因素所造成？","opts":["A. 低血鈣","B. 高血鈣","C. 高血鉀","D. 低血鉀"],"ans":0,"exp":"犬隻子癇（eclampsia）又稱產後低鈣血症（puerperal tetany），主要因泌乳期大量鈣質由乳汁流失，加上採食鈣不足，造成低血鈣（hypocalcemia），引起神經肌肉過度興奮、抽搐等症狀。","we":["（正確）A正確：子癇的主要原因是低血鈣，泌乳使鈣大量流失，造成神經肌肉過度興奮和抽搐，是正確答案。","B錯誤：高血鈣（hypercalcemia）會抑制神經肌肉興奮性，不會造成抽搐；且子癇是低鈣而非高鈣。","C錯誤：高血鉀（hyperkalemia）主要影響心臟功能（心律不整），不是子癇的主因。","D錯誤：低血鉀（hypokalemia）造成肌肉無力（非過度興奮），不是子癇的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_065","year":2021,"roc_year":110,"session":"","examNo":65,"q":"血清甲狀腺功能檢測結果如下：Total T4低、free T4正常、TSH正常、甲狀腺球蛋白（TgAA）陰性，根據上\r   述檢驗推測動物最有可能罹患下列何種甲狀腺疾病？","opts":["A. euthyroid sick syndrome","B. hypothyroidism associated with lymphocytic thyroiditis","C. hyperthyroidism","D. idiopathic hypothyroidism"],"ans":0,"exp":"Total T4低但free T4正常、TSH正常、TgAA陰性，此模式符合euthyroid sick syndrome（非甲狀腺疾病的低T4血症），即因其他疾病（如發燒、糖尿病、慢性炎症等）導致Total T4下降，但甲狀腺本身功能正常（free T4正常）。","we":["（正確）A正確：Total T4低但free T4正常、TSH正常、TgAA陰性，符合euthyroid sick syndrome（非甲狀腺病因性低T4症）的診斷模式。","B錯誤：淋巴球性甲狀腺炎（lymphocytic thyroiditis）TgAA通常陽性，且會造成free T4下降和TSH升高，不符合此題結果。","C錯誤：甲狀腺功能亢進（hyperthyroidism）Total T4和free T4均升高，TSH下降，與題目相反。","D錯誤：特發性甲狀腺功能低下（idiopathic hypothyroidism）free T4會下降、TSH升高，TgAA陰性，與本題free T4正常、TSH正常不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_066","year":2021,"roc_year":110,"session":"","examNo":66,"q":"理論上犬血中醣化血色素（HbA1c）值可反應過去多久時間之平均血糖濃度上升？","opts":["A. 14天","B. 21天","C. 45天","D. 60天"],"ans":2,"exp":"犬的紅血球壽命約110天（較人類短），而醣化血色素（HbA1c）的形成速率與紅血球壽命有關。在犬，HbA1c反映過去約45天的平均血糖濃度，不同於人類（約2～3個月），因犬紅血球壽命較短。","we":["A錯誤：14天過短，不能反映長期血糖控制狀況，此時間範圍對應的是血清果糖胺（fructosamine）的部分範圍。","B錯誤：21天也偏短，不符合犬HbA1c反映約45天的時間範圍。","（正確）C正確：犬HbA1c反映過去約45天的平均血糖濃度，是正確的時間範圍。","D錯誤：60天適用於人類（人類紅血球壽命120天，HbA1c反映約3個月），犬的紅血球壽命較短，故時間應較短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_067","year":2021,"roc_year":110,"session":"","examNo":67,"q":"正常胰島素／葡萄糖校正比（amended insulin glucose ratio, AIGR）為多少？","opts":["A. 5","B. 10","C. 30","D. 40"],"ans":2,"exp":"正常胰島素/葡萄糖校正比（AIGR）正常值小於30（<30）。若AIGR ≥30，提示胰島素相對於血糖濃度不適當地高，懷疑胰島素瘤（insulinoma）。AIGR的公式考量了在低血糖時仍有不適當高的胰島素分泌。","we":["A錯誤：5是過低的數值，正常上限為30，不是5。","B錯誤：10也低於正常上限，不是正確的AIGR正常值。","（正確）C正確：AIGR正常值為小於30，臨床上以30為截斷值診斷胰島素過高，是正確答案。","D錯誤：40已超過正常上限（30），達到此值提示胰島素瘤的可能，不是正常值範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_068","year":2021,"roc_year":110,"session":"","examNo":68,"q":"下列何種腎上腺功能性試驗主要用於區別腦垂體依賴性或腎上腺依賴性腎上腺皮質功能亢進？","opts":["A. ACTH刺激試驗","B. 低劑量dexamethasone抑制試驗（LDDST）","C. 高劑量dexamethasone抑制試驗（HDDST）","D. 尿中可體素／肌酸酐比（UCCR）"],"ans":2,"exp":"高劑量dexamethasone抑制試驗（HDDST）主要用於區別腦垂體依賴性（PDH）與腎上腺依賴性（ADH）的腎上腺皮質功能亢進：PDH在HDDST通常受到抑制（>50%），而ADH不受抑制。LDDST和UCCR主要用於診斷是否有亢進，但無法區分來源。","we":["A錯誤：ACTH刺激試驗用於評估腎上腺皮質儲備功能，可診斷亢進或低下，但不能區分PDH與ADH。","B錯誤：低劑量dexamethasone抑制試驗（LDDST）是篩查腎上腺皮質功能亢進的試驗，敏感性高，但不能可靠地區分PDH與ADH。","（正確）C正確：高劑量dexamethasone抑制試驗（HDDST）專門用於區別PDH（受抑制）與ADH（不受抑制），是正確答案。","D錯誤：UCCR（尿中可體素/肌酸酐比）是腎上腺功能亢進的篩查工具，敏感但特異性低，不用於區分PDH與ADH。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_069","year":2021,"roc_year":110,"session":"","examNo":69,"q":"下列何者不是導致脫水最常見之原因？","opts":["A. 發燒","B. 嘔吐","C. 下痢","D. 多尿"],"ans":0,"exp":"嘔吐、下痢、多尿是導致脫水最常見的原因，因為直接造成體液流失。發燒（fever）雖然會使不感蒸發（insensible water loss）增加，但程度有限，通常不是「最常見」的脫水原因，遠不如嘔吐下痢和多尿造成的直接液體流失。","we":["（正確）A正確：發燒雖增加水分散失，但程度有限，不是導致脫水「最常見」的原因，故A為本題答案。","B錯誤：嘔吐是造成脫水最常見的原因之一，直接流失大量消化液，不是本題答案。","C錯誤：下痢（腹瀉）造成大量水分和電解質由腸道流失，是最常見的脫水原因之一。","D錯誤：多尿（如腎衰竭、糖尿病）造成腎臟無法保留水分，是常見的脫水原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_070","year":2021,"roc_year":110,"session":"","examNo":70,"q":"進行血液氣體分析時，血液檢體收集通常使用下列何種抗凝劑？","opts":["A. EDTA","B. heparin","C. sodium citrate","D. sodium oxalate"],"ans":1,"exp":"血液氣體分析（blood gas analysis）需使用heparin（肝素）抗凝劑，因為heparin不影響血液pH、pCO2、pO2、HCO3等氣體分析參數。其他抗凝劑（EDTA、citrate、oxalate）會影響離子濃度或pH，不適用於血氣分析。","we":["A錯誤：EDTA螯合鈣離子，會嚴重影響血中鈣離子濃度的測定，不適用於血氣分析。","（正確）B正確：Heparin是血氣分析的標準抗凝劑，不影響pH和電解質測定，是正確答案。","C錯誤：Sodium citrate螯合鈣離子，改變血中陰離子濃度，不適用於血氣分析。","D錯誤：Sodium oxalate也螯合鈣離子，不適用於血氣分析；主要用於血糖檢測（加fluoride/oxalate管）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_071","year":2021,"roc_year":110,"session":"","examNo":71,"q":"呼吸性鹼中毒未代償時，理論上下列何者正常？","opts":["A. 血液pH值","B. ","C. ","D. "],"ans":3,"exp":"呼吸性鹼中毒（respiratory alkalosis）未代償時，過度換氣使CO2下降，血液pH升高，HCO3在急性期正常（代謝代償尚未啟動）。因此未代償的呼吸性鹼中毒：pH升高、pCO2下降、HCO3正常。選項D（HCO3）為正常。","we":["A錯誤：未代償呼吸性鹼中毒時，血液pH值會升高（非正常），因為CO2下降使pH上升。","B選項待圖確認：題目選項部分缺失，標記為需複查。","C選項待圖確認：題目選項部分缺失，標記為需複查。","（正確）D正確：未代償的呼吸性鹼中毒中，HCO3在急性期尚未發生代謝代償，保持正常，是正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_072","year":2021,"roc_year":110,"session":"","examNo":72,"q":"一患病犬血液氣體檢查結果：pH下降、 上升、 下降、陰離子差正常。根據上述血液氣體檢查結果，研判病犬最有可能為下列何種酸鹼異常？","opts":["A. 單獨呼吸性酸中毒","B. 混合型呼吸性酸中毒與代謝性鹼中毒","C. 混合型代謝性酸中毒與呼吸性鹼中毒","D. 混合型代謝性酸中毒與呼吸性酸中毒"],"ans":0,"exp":"pH下降（酸中毒）、pCO2上升（呼吸性因素，CO2積聚）、HCO3下降（代謝性因素，碳酸氫鹽消耗）、陰離子差（anion gap）正常。此模式符合混合型代謝性酸中毒（HCO3下降）合併呼吸性酸中毒（pCO2上升）。但陰離子差正常提示正常陰離子差型代謝性酸中毒。","we":["（正確）A正確：單獨呼吸性酸中毒時pCO2升高，HCO3應代償性升高（非下降），本題HCO3下降不符合單純呼吸性酸中毒，但依題目所示答案為A，需圖確認完整數值。","B錯誤：呼吸性酸中毒合併代謝性鹼中毒時HCO3應升高（非下降），不符合本題HCO3下降。","C錯誤：代謝性酸中毒合併呼吸性鹼中毒時，pCO2應下降（非升高），不符合本題pCO2上升。","D錯誤：若為混合型代謝性酸中毒合併呼吸性酸中毒，pH會極度下降，但本題描述陰離子差正常，需進一步確認選項。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_073","year":2021,"roc_year":110,"session":"","examNo":73,"q":"下列何者為代謝性鹼中毒之常見原因？","opts":["A. 嘔吐","B. 肝衰竭","C. 下痢","D. 腎衰竭"],"ans":0,"exp":"嘔吐（vomiting）是代謝性鹼中毒最常見的原因，因為大量胃酸（HCl）流失，使血液中HCO3相對升高，pH上升。下痢流失鹼性腸液造成代謝性酸中毒；肝衰竭和腎衰竭也傾向造成代謝性酸中毒（乳酸或尿毒症酸）。","we":["（正確）A正確：嘔吐流失大量胃酸（HCl），是代謝性鹼中毒最常見的原因，是正確答案。","B錯誤：肝衰竭造成乳酸蓄積和氨解毒障礙，傾向造成代謝性酸中毒（低白蛋白也使陰離子差改變），不是鹼中毒的常見原因。","C錯誤：下痢（腹瀉）流失含HCO3的腸液，造成代謝性酸中毒，不是鹼中毒。","D錯誤：腎衰竭造成酸性代謝產物蓄積（磷酸、硫酸），是代謝性酸中毒的原因，不是鹼中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_074","year":2021,"roc_year":110,"session":"","examNo":74,"q":"橫紋肌溶解症時最可能引發之電解質變化為下列何者？","opts":["A. 低鉀血症","B. 高鉀血症","C. 低鈣血症","D. 高鈣血症"],"ans":1,"exp":"橫紋肌溶解症（rhabdomyolysis）時，肌肉細胞大量破裂，細胞內大量鉀離子（K+）釋放入血，造成高鉀血症（hyperkalemia）。同時也可見肌紅素血症、CK極度升高，並可能因腎臟鉀排泄不足（急性腎傷害）而加重高鉀。","we":["A錯誤：低鉀血症（hypokalemia）通常見於嘔吐、下痢或利尿劑使用，不是橫紋肌溶解症的典型電解質變化。","（正確）B正確：橫紋肌溶解症時，肌肉細胞釋放大量胞內鉀離子，造成高鉀血症，是最典型的電解質異常。","C錯誤：低鈣血症雖然可見於橫紋肌溶解症早期（磷酸鈣沉積使血鈣下降），但不是「最可能引發」的主要電解質變化。","D錯誤：高鈣血症不是橫紋肌溶解症的特徵；反而可能出現低鈣（早期）或高鈣（恢復期，鈣從沉積部位釋放）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_075","year":2021,"roc_year":110,"session":"","examNo":75,"q":"當犬隻發生組織損傷或炎症期間，最可能見到下列何種蛋白質異常？","opts":["A. 高白蛋白血症","B. 高球蛋白血症","C. 低白蛋白血症","D. 低球蛋白血症"],"ans":1,"exp":"組織損傷或炎症時，肝臟合成大量急性期蛋白（acute phase proteins），包括fibrinogen、CRP、haptoglobin等，其中大多數為球蛋白（globulins）。同時白蛋白（albumin）可能因肝臟優先合成急性期蛋白而略微下降。但整體表現為高球蛋白血症。","we":["A錯誤：高白蛋白血症僅見於脫水（相對性升高），炎症期間白蛋白通常正常或略降（作為負急性期蛋白）。","（正確）B正確：炎症期間肝臟大量合成急性期蛋白（球蛋白），造成高球蛋白血症，是正確答案。","C錯誤：低白蛋白血症見於慢性炎症、蛋白質流失或肝功能衰竭，急性炎症早期白蛋白不會顯著下降。","D錯誤：低球蛋白血症見於免疫缺乏或蛋白質流失性腎/腸病，與炎症反應的急性期蛋白升高相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_076","year":2021,"roc_year":110,"session":"","examNo":76,"q":"承上題，若此犬隻有慢性化膿性皮炎，下列何者最可能為其血清蛋白質電泳圖？","opts":["A. ","B. ","C. ","D. "],"ans":1,"exp":"慢性化膿性皮炎（chronic suppurative dermatitis）會引起持續的炎症反應，造成球蛋白（特別是gamma球蛋白）持續升高，同時白蛋白因慢性炎症和蛋白質消耗而降低，蛋白質電泳圖呈現白蛋白下降、gamma球蛋白升高的多克隆性高球蛋白血症（polyclonal hypergammaglobulinemia）。此題需看圖選擇正確的電泳圖形。","we":["A需看圖確認：若為白蛋白升高的電泳圖，不符合慢性化膿性皮炎。","（正確）B正確（需看圖確認）：慢性化膿性皮炎造成多克隆性高gamma球蛋白血症，白蛋白/球蛋白比下降，是最可能的電泳圖形。","C需看圖確認：若為正常電泳圖或單克隆峰，不符合慢性炎症的多克隆性增加。","D需看圖確認：若為白蛋白和球蛋白均下降，可能符合蛋白質流失，但不是慢性皮炎的典型表現。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_實診_077","year":2021,"roc_year":110,"session":"","examNo":77,"q":"10歲雄性Bedlington terrier梗犬，主人發現其有2～3個月的黃疸及腹水症狀，因而前來就診。 血檢符合臨床症\r   狀最可能會出現下列何種異常？","opts":["A. 高球蛋白血症、總蛋白濃度上升","B. 高白蛋白血症、總蛋白濃度上升","C. 低白蛋白血症、膽紅素上升","D. 膽紅素上升、高血糖"],"ans":2,"exp":"10歲Bedlington terrier有黃疸及腹水，此品種有銅蓄積性肝病（copper storage hepatopathy）的遺傳傾向。肝功能不全（肝硬化/纖維化）造成低白蛋白血症（肝臟合成減少）和膽紅素升高（黃疸），腹水則由低白蛋白引起的低膠體滲透壓所致。","we":["A錯誤：肝病時球蛋白可能升高，但若肝臟本身功能嚴重受損，肝臟合成的蛋白質（包括白蛋白和部分球蛋白）均減少；總蛋白上升不是主要表現，且有腹水提示低蛋白。","B錯誤：高白蛋白血症見於脫水，而有腹水的動物更傾向低白蛋白血症，與本案例相反。","（正確）C正確：Bedlington terrier肝病造成肝功能不全，白蛋白合成減少（低白蛋白血症）、膽紅素升高（黃疸），是最符合臨床症狀的血液學異常。","D錯誤：膽紅素升高正確，但高血糖不是肝病的主要表現（肝病反而常造成低血糖，因糖原異生和糖原儲備減少）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_078","year":2021,"roc_year":110,"session":"","examNo":78,"q":"承上題，若此犬有基因缺陷，最可能為何種物質蓄積於肝細胞？","opts":["A. 銅","B. 鉛","C. 脂肪","D. 硒"],"ans":0,"exp":"Bedlington terrier是著名的銅蓄積性肝病品種，因缺乏COMMD1（ATP7B基因相關）蛋白，無法正常將銅排入膽汁，導致銅在肝細胞中進行性蓄積，引起肝細胞損傷、纖維化、最終肝硬化和肝衰竭。","we":["（正確）A正確：Bedlington terrier有銅蓄積性肝病的遺傳缺陷，銅在肝細胞中蓄積是正確答案。","B錯誤：鉛中毒主要由環境暴露引起，不是Bedlington terrier的遺傳性肝病機制。","C錯誤：脂肪蓄積（脂肪肝）見於肥胖、糖尿病或貓的肝脂肪變性，不是Bedlington terrier的遺傳性問題。","D錯誤：硒蓄積主要見於攝入過多含硒植物或飼料的動物（如馬、牛），不是Bedlington terrier遺傳病的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_079","year":2021,"roc_year":110,"session":"","examNo":79,"q":"下列那兩種酵素為腎小管中高活性之酵素，可用來早期偵測腎小管之損傷？","opts":["A. ?-glutamyltransferase（GGT）& alanine aminotransferase（ALT）","B. alanine aminotransferase（ALT）& α-fetoprotein（AFP）","C. N-acetylglucosamidase（NAG）& alanine aminotransferase（ALT）","D. ?-glutamyltransferase（GGT）& N-acetylglucosamidase（NAG）"],"ans":3,"exp":"腎小管中高活性的兩種酵素為γ-glutamyltransferase（GGT）和N-acetylglucosamidase（NAG），可由尿液中測定，用來早期偵測腎小管損傷。ALT和AFP均非腎小管特異性酵素，不適用於此用途。","we":["A錯誤：ALT主要存在於肝細胞，不是腎小管的高活性酵素，不能用來偵測腎小管損傷。","B錯誤：AFP（alpha-fetoprotein）是肝臟腫瘤標記，非腎小管酵素；ALT也不是腎小管特異性酵素。","C錯誤：NAG正確，但ALT不是腎小管高活性酵素，此組合不正確。","（正確）D正確：GGT（γ-glutamyltransferase）和NAG（N-acetylglucosamidase）均在腎小管中活性高，是早期腎小管損傷的尿液生化標記，組合正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_實診_080","year":2021,"roc_year":110,"session":"","examNo":80,"q":"承上題，此2種尿液酵素在下列那些物種，可用來做為診斷腎小管早期損傷的敏感指標？","opts":["A. 牛、山羊","B. 狗、馬","C. 牛、馬","D. 貓、豬"],"ans":2,"exp":"尿液中GGT和NAG作為腎小管損傷敏感指標，在牛和馬中已有充分的臨床研究支持，可用於早期偵測腎小管損傷。這兩種動物由於暴露於腎毒性物質（如抗生素、重金屬、黴菌毒素）的機會較多，因此這些指標在大動物臨床上特別有價值。","we":["A錯誤：山羊的相關研究較少，且牛＋山羊不是最常被引用的組合；牛是正確的但山羊不是最佳搭配。","B錯誤：狗的GGT/NAG尿液指標研究相對較少，且貓腎小管損傷標記研究也不如牛馬充分。","（正確）C正確：牛和馬是GGT及NAG作為尿液腎小管損傷早期敏感指標研究最充分的物種，是正確答案。","D錯誤：貓和豬的相關研究基礎較薄弱，不是這兩種尿液酵素最常應用的物種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_001","year":2022,"roc_year":111,"session":"","examNo":1,"q":"下列何者屬於紡錘型細胞腫瘤（spindle cell tumor）？","opts":["A. hemangiosarcoma","B. lymphoma","C. histiocytoma","D. perianal adenoma"],"ans":0,"exp":"紡錘型細胞腫瘤（spindle cell tumor）是間葉組織來源腫瘤，細胞呈紡錘形，hemangiosarcoma（血管肉瘤）即屬此類。lymphoma 為圓形細胞腫瘤，histiocytoma 亦為圓形細胞，perianal adenoma 為上皮腺瘤。","we":["（正確）hemangiosarcoma 為血管內皮來源，屬間葉/紡錘型細胞腫瘤，形態呈梭形。","lymphoma 屬圓形細胞腫瘤（round cell tumor），細胞核大且圓，不屬於紡錘型。","histiocytoma 同屬圓形細胞腫瘤，常見於年輕犬皮膚，細胞呈圓形。","perianal adenoma 為肛周腺上皮腫瘤，屬上皮性腫瘤，非紡錘型細胞腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_002","year":2022,"roc_year":111,"session":"","examNo":2,"q":"臨床常用之 Diff-Quik 染色，屬於下列何種染色法？","opts":["A. trichrome stains","B. Romanowsky stains","C. Papanicolaou stains","D. supravital stains"],"ans":1,"exp":"Diff-Quik 是一種快速 Romanowsky 染色法，以 methylene blue 與 eosin 為主要染料，可清楚染出細胞核（藍紫）與細胞質顆粒，廣泛用於血液抹片與細胞學。","we":["trichrome stains（三色染色）用於組織切片顯示膠原，非 Diff-Quik 所屬類別。","（正確）Diff-Quik 屬 Romanowsky 染色，為 Wright-Giemsa 系列的快速版本，廣泛應用於細胞學染色。","Papanicolaou stains（巴氏染色）主要用於婦科細胞學及痰液檢查，非 Diff-Quik 類別。","supravital stains（活體染色）如 new methylene blue，用於染網狀紅血球，非 Diff-Quik 類別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_003","year":2022,"roc_year":111,"session":"","examNo":3,"q":"Pandy test 常用於何種檢體之蛋白質檢測？","opts":["A. 關節囊液","B. 腦脊髓液","C. 胸水","D. 陰道分泌液"],"ans":1,"exp":"Pandy test 以石炭酸飽和液偵測腦脊髓液（CSF）中的球蛋白，若出現白色混濁即為陽性，反映腦脊髓液蛋白質升高，常見於腦膜炎等神經疾病。","we":["關節囊液蛋白質檢測通常以折射儀或化學法測定，不使用 Pandy test。","（正確）Pandy test 專門用於腦脊髓液（CSF）球蛋白偵測，是神經學診斷的重要輔助工具。","胸水蛋白質以折射儀或化學分析儀測定，Pandy test 非常規胸水檢查。","陰道分泌液不使用 Pandy test 進行蛋白質檢測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_004","year":2022,"roc_year":111,"session":"","examNo":4,"q":"下列何者指細胞核大小不一？","opts":["A. anisocytosis","B. anisokaryosis","C. karyorrhexis","D. pyknosis"],"ans":1,"exp":"anisokaryosis 字根 aniso（不等）+ karyo（核）+ osis（狀態），指細胞核大小不一，是惡性腫瘤細胞學判讀的重要指標之一。","we":["anisocytosis 指紅血球大小不一（aniso + cyto = 細胞），非細胞核大小。","（正確）anisokaryosis 指細胞核大小不一，為腫瘤惡性判斷標準之一。","karyorrhexis 指細胞核破裂碎散，是細胞死亡的徵象，非核大小不一。","pyknosis 指細胞核濃縮（固縮），為細胞凋亡或壞死的早期核變化，非大小不一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_005","year":2022,"roc_year":111,"session":"","examNo":5,"q":"下列何者為區別純粹性漏出液與修飾性漏出液最主要參數？","opts":["A. 總蛋白質濃度","B. 有核細胞數","C. 細胞分類","D. 三酸甘油脂"],"ans":0,"exp":"區別純粹性漏出液（pure transudate，TP＜2.5 g/dL）與修飾性漏出液（modified transudate，TP 2.5–5.0 g/dL）最主要依據是總蛋白質濃度；有核細胞數次之。細胞分類與三酸甘油脂則用於其他鑑別。","we":["（正確）總蛋白質濃度是區別純粹性漏出液（＜2.5 g/dL）與修飾性漏出液（2.5–5.0 g/dL）最主要參數。","有核細胞數是輔助參考，但總蛋白質濃度仍是首要鑑別指標。","細胞分類用於鑑別滲出液的原因（細菌性、腫瘤性等），非漏出液分類的首要指標。","三酸甘油脂用於診斷乳糜胸水，非漏出液分類的主要依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_006","year":2022,"roc_year":111,"session":"","examNo":6,"q":"下列何種檢驗結果符合獸醫實驗診斷學所定義的偽陽性？","opts":["A. 從罹患懷疑疾病的動物身上，檢驗出陰性的結果","B. 從未罹患懷疑疾病的動物身上，檢驗出陰性的結果","C. 從未罹患懷疑疾病的動物身上，檢驗出陽性的結果","D. 從罹患懷疑疾病的動物身上，檢驗出陽性的結果"],"ans":2,"exp":"偽陽性（false positive）定義：檢驗結果為陽性，但動物實際上未罹患該疾病。即「從未罹患懷疑疾病的動物身上，檢驗出陽性的結果」。","we":["從罹患疾病動物身上得到陰性結果，稱為偽陰性（false negative），非偽陽性。","從未罹患疾病動物身上得到陰性結果，稱為真陰性（true negative），非偽陽性。","（正確）偽陽性定義：未罹患疾病卻檢驗出陽性，降低了檢驗的特異性（specificity）。","從罹患疾病動物身上得到陽性結果，稱為真陽性（true positive），非偽陽性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_007","year":2022,"roc_year":111,"session":"","examNo":7,"q":"有關高膽紅素血症的血液檢體檢測，下列敘述何者正確？","opts":["A. 以 HABA（2-p-hydroxy-phenylazobenzoic acid）法測定血清蛋白質時，呈現偽低值","B. 以氯化鐵試劑測定膽固醇，呈現偽高值","C. 以 o-toluidine 法測定血糖，呈現偽低值","D. 血中膽紅素嚴重高值時，以岳飛（Jaffe）反應測定血清肌酸酐（creatinine），會呈現偽高值"],"ans":0,"exp":"高膽紅素血症時，膽紅素會與 HABA 競爭白蛋白結合位，導致以 HABA 法測定的血清白蛋白值偏低（偽低值）。膽紅素對 Jaffe 法測定 creatinine 的影響是偽低值（非偽高值），對葡萄糖測定影響依方法而異。","we":["（正確）膽紅素與白蛋白競爭 HABA 結合位，使 HABA 法測得白蛋白偏低，此為偽低值。","以氯化鐵試劑測膽固醇時，膽紅素干擾造成偽低值，非偽高值。","以 o-toluidine 法測血糖，膽紅素的干擾偏向偽高值而非偽低值，此選項敘述有誤。","高膽紅素以 Jaffe 反應測 creatinine 時，膽紅素會競爭吸光度，造成偽低值，非偽高值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_008","year":2022,"roc_year":111,"session":"","examNo":8,"q":"檢體以乾冰低溫保存時，其溫度約維持在幾度？","opts":["A. 4～10 oC","B. -20～-30 oC","C. -70～-80oC","D. -180～-190 oC"],"ans":2,"exp":"乾冰（固態 CO₂）在常壓下昇華溫度約為 -78.5°C，因此以乾冰低溫保存時，溫度約維持在 -70～-80°C，適合保存需超低溫的病毒學或分子生物學檢體。","we":["4～10°C 為一般冷藏溫度，使用冰箱或冰袋保存，非乾冰保存範圍。","-20～-30°C 為一般冷凍溫度，使用家用冷凍庫，非乾冰保存溫度。","（正確）乾冰昇華點約 -78.5°C，保存溫度約 -70～-80°C，適用超低溫檢體保存。","-180～-190°C 為液態氮保存溫度（液氮沸點 -196°C），非乾冰溫度範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_009","year":2022,"roc_year":111,"session":"","examNo":9,"q":"有關檢體採集和保存運送的方式，下列何者錯誤？","opts":["A. 送檢皮膚刮取物以檢查外寄生蟲時，刮取深度須達真皮層","B. 欲診斷口蹄疫，可採取喉頭液置於滅菌且含抗生素的培養液內送檢","C. 擬做微生物檢查之乳汁，以冷藏法防腐即可","D. 送糞便檢查蟲卵，遠距運送耗時恐蟲卵變仔蟲不易檢查，應用乾冰法保存"],"ans":3,"exp":"送糞便檢查蟲卵時，若遠距運送應加入福馬林（formalin）或 PVA 固定液保存，而非用乾冰（-78°C）保存——乾冰可能破壞蟲卵形態且無法防止孵化，正確方法是 10% 福馬林固定或冷藏（4°C）。故 D 選項錯誤。","we":["送檢皮膚刮取物檢查外寄生蟲（疥癬蟲等），需深刮至真皮層（出現微血滲出），此敘述正確。","口蹄疫診斷採取喉頭液置於含抗生素的滅菌培養液中送檢，此為正確操作。","擬做微生物檢查的乳汁以冷藏（4°C）防腐即可，短期保存可接受，此敘述正確。","（正確）糞便送蟲卵檢查應以 10% 福馬林或 PVA 固定，使用乾冰保存不適當，此為錯誤敘述，故本題答案選 D。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_010","year":2022,"roc_year":111,"session":"","examNo":10,"q":"哺乳動物於出生後，其血球形成主要由存在於何處的原始造血幹細胞（primitive hematopoietic stem cells）增殖\r  及分化而成？","opts":["A. 肝臟","B. 脾臟","C. 骨髓的微血管網外隙","D. 骨髓的微血管腔內"],"ans":2,"exp":"出生後的哺乳動物，原始造血幹細胞主要位於骨髓的微血管網外隙（extravascular sinusoidal space），在此增殖分化後，成熟血球才穿越竇壁進入血液循環。","we":["肝臟是胚胎期（胎兒期）的造血場所，出生後此功能已移轉至骨髓。","脾臟在某些疾病時可發生髓外造血，但正常出生後哺乳動物的主要造血場所是骨髓。","（正確）出生後造血主要在骨髓微血管網外隙（竇外空間），造血幹細胞在此增殖分化成各系血球。","骨髓微血管腔內是已成熟血球釋放入循環的通道，非原始幹細胞的主要增殖場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_011","year":2022,"roc_year":111,"session":"","examNo":11,"q":"下列何者最不可能造成動物平均紅血球容積（MCV）增加？","opts":["A. 門脈－腔靜脈分流","B. 再生性貧血","C. 維生素 B12 及葉酸缺乏","D. Miniature poodles 之家族性遺傳"],"ans":1,"exp":"脂血症（lipemia）會使 PCV 假性偏低，進而造成計算出的 MCHC 偏高（偽高值），而非偏低。其他三項（門脈分流、再生性貧血出現大型網狀紅血球、B12/葉酸缺乏、Miniature poodle 家族性）均可真實造成 MCV 升高（大紅血球症）。題目問「最不可能造成 MCV 增加」，答案應為與 MCV 無直接關聯者，但依台灣國考官方答案，此題答案為 B（再生性貧血 MCV 升高是真實現象，且最確定），需比對其餘選項—門脈分流、B12缺乏、Poodle遺傳均確實造成 MCV 增加；再生性貧血亦確實造成 MCV 增加。依考選部公告答案為 B。","we":["門脈-腔靜脈分流（PSS）確實可造成大紅血球症（MCV 上升），屬已知關聯。","（正確）再生性貧血雖常見大型網狀紅血球（MCV 升高），但依官方公布答案，本題選 B 作為「最不可能」選項。","維生素 B12 及葉酸缺乏會阻礙 DNA 合成，造成大紅血球性貧血（MCV 升高）。","Miniature poodle 有家族性大紅血球症（MCV 升高）的遺傳特性，屬已確認現象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_012","year":2022,"roc_year":111,"session":"","examNo":12,"q":"動物血液抹片中紅血球呈現 rouleaux formation，下列敘述何者錯誤？","opts":["A. 此現象與紅血球沉降速率成正相關","B. 當纖維素原含量增加時，常見此現象","C. 若於犬見到此現象，通常庫姆氏（Coombs'）試驗也呈陽性","D. 此現象在反芻獸中較罕見"],"ans":2,"exp":"rouleaux formation（錢串狀紅血球）是由於血漿蛋白（尤其纖維蛋白原、球蛋白）升高引起，常見於馬；在犬，rouleaux 不一定代表自體免疫溶血性貧血，Coombs' 試驗陽性與否是獨立現象，此敘述錯誤。","we":["rouleaux 使紅血球聚集下沉加速，與紅血球沉降速率（ESR）正相關，此敘述正確。","纖維蛋白原（fibrinogen）升高確實促進 rouleaux formation，此敘述正確。","（正確）在犬，rouleaux formation 不一定伴隨 Coombs' 試驗陽性，此敘述錯誤，為本題答案。","反芻獸（牛、羊）的紅血球較小且不易形成 rouleaux，在反芻獸中此現象確實較罕見，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_013","year":2022,"roc_year":111,"session":"","examNo":13,"q":"下列何項不會造成動物平均紅血球血紅素濃度（MCHC）減少？","opts":["A. 再生性貧血","B. 脂血症","C. 缺鐵性貧血","D. 血液樣本置放太久（超過 24 小時）"],"ans":1,"exp":"脂血症（lipemia）會使血漿渾濁，干擾折射儀或比色法，造成 Hgb 測定值偏高，進而使計算出的 MCHC 偏高（偽高值），而非 MCHC 減少。其他選項（再生性貧血、缺鐵性貧血、血樣放置過久）均可使 MCHC 真實降低。","we":["再生性貧血釋放大型未成熟紅血球（含血紅素量相對不足），可真實造成 MCHC 下降。","（正確）脂血症使 Hgb 吸光值偏高（偽高），計算 MCHC 反而偏高，不會造成 MCHC 減少，為本題答案。","缺鐵性貧血血紅素合成不足，紅血球色素不足（低色素性），MCHC 真實下降。","血液樣本放置超過 24 小時，紅血球溶脹（MCV 升高），稀釋效果使 MCHC 計算值下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_014","year":2022,"roc_year":111,"session":"","examNo":14,"q":"下列何者最不可能是血管內及血管外溶血性貧血的共同特徵？","opts":["A. 再生性反應","B. 單核球減少","C. 血漿蛋白質濃度正常或上升","D. 不出現出血症狀"],"ans":1,"exp":"血管內溶血時，釋放的血紅素結合 haptoglobin 後由單核球/巨噬細胞清除，單核球數量反而可能增加（以清除血紅素-haptoglobin 複合物）；血管外溶血亦刺激單核-巨噬系統。因此「單核球減少」最不可能是兩者共同特徵。","we":["再生性反應（多染性紅血球、網狀紅血球增多）是溶血性貧血的典型反應，兩者共同特徵，正確。","（正確）單核球減少不是溶血性貧血的特徵；溶血反而可能刺激單核-巨噬系統，單核球增加或正常。","溶血性貧血時蛋白質隨血球破壞釋出，血漿蛋白正常或上升，此為共同特徵，正確。","溶血性貧血（無論血管內外）均不以出血為主要機制，故不出現出血症狀，此為共同特徵，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_015","year":2022,"roc_year":111,"session":"","examNo":15,"q":"輸血前的血液配合試驗，牛及馬以何種反應判定較佳？","opts":["A. 魯米諾（Luminol）反應","B. 凝集反應","C. 溶血反應","D. 潛血反應"],"ans":2,"exp":"牛和馬的血液中天然抗體（alloantibody）多為 IgM，能啟動補體而引起溶血；因此輸血配合試驗以溶血反應（hemolysis）判定較凝集反應更敏感且具臨床意義。","we":["Luminol 反應是化學發光法，用於法醫血跡偵測，與輸血配合試驗無關。","凝集反應在犬貓輸血配合試驗中常用，但牛馬的天然抗體以 IgM 為主，溶血反應更具代表性。","（正確）牛與馬的輸血配合試驗以溶血反應判定為佳，因其天然抗體易引起補體介導的溶血。","潛血反應（occult blood test）用於偵測糞便或尿液微量出血，非輸血配合試驗方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_016","year":2022,"roc_year":111,"session":"","examNo":16,"q":"血液抹片中，箭頭所指及其形成原因為何？","opts":["A. Heinz body，氧化性物質引起的變性血紅素","B. Heinz body，紅血球中細胞核的殘留物","C. Howell-Jolly body，氧化性物質引起的變性血紅素","D. Howell-Jolly body，紅血球中細胞核的殘留物"],"ans":3,"exp":"Howell-Jolly body 是紅血球中細胞核的殘留物（核染色質碎片），在 Wright-Giemsa 染色下呈深藍紫色小圓點，常見於再生性貧血或脾臟功能不全。Heinz body 則是氧化性物質引起的變性血紅素聚集，形態不同。","we":["Heinz body 確為氧化性物質引起的變性血紅素，但需配合圖片；本題若箭頭所指為小圓深藍點，則為 Howell-Jolly body。","Heinz body 為變性血紅素，非核的殘留物，此描述混淆了兩種包含體。","Howell-Jolly body 定義為核殘留物，但若圖中結構靠近細胞邊緣且折光，應為 Heinz body；需圖片確認。","（正確）Howell-Jolly body 是紅血球中細胞核染色質的殘留物，此為本題最符合的描述。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_017","year":2022,"roc_year":111,"session":"","examNo":17,"q":"巨噬細胞可將何種物質轉運給紅血胚細胞及紅血細胞，合成血紅素？","opts":["A. 鐵","B. 氧氣","C. 血紅質（heme）","D. 血球蛋白（globin）"],"ans":0,"exp":"在骨髓的造血島（erythroblastic island）中，巨噬細胞（中央巨噬細胞）將儲存的鐵（以鐵蛋白形式）轉運給周圍的紅血胚細胞（erythroblast）及紅血細胞，供其合成血紅素中的血紅質（heme）。","we":["（正確）巨噬細胞將鐵轉運給紅血胚細胞，鐵是合成血紅質（heme）的必要元素，血紅質再與球蛋白結合形成血紅素。","氧氣由已合成的血紅素攜帶，不是巨噬細胞轉運給紅血胚細胞的物質。","血紅質（heme）在紅血胚細胞自身的線粒體中合成，不由巨噬細胞直接轉運。","球蛋白（globin）由紅血胚細胞核糖體自行合成，不由巨噬細胞轉運。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_018","year":2022,"roc_year":111,"session":"","examNo":18,"q":"有關血紅質的合成，下列何者錯誤？","opts":["A. 合成過程為一雙向可逆的反應","B. 受紅血球中血紅素濃度負回饋控制","C. 銅和鈷均參與其合成過程","D. 氯黴素會抑制鐵螯合酶的作用，阻礙合成"],"ans":0,"exp":"血紅質（heme）合成是單向不可逆過程，從 δ-氨基乙醯丙酸（ALA）開始，經多步驟最終形成 heme，並非雙向可逆反應。其他敘述（負回饋、銅/鈷參與、氯黴素抑制鐵螯合酶）均正確。","we":["（正確）血紅質合成是單向不可逆反應，並非雙向可逆，此敘述錯誤，為本題答案。","血紅素濃度升高時，負回饋抑制 ALA 合成酶，調控合成速率，此敘述正確。","銅參與 heme 合成（作為鐵螯合酶的輔因子），鈷可競爭性影響鐵代謝，此敘述大致正確。","氯黴素（chloramphenicol）可抑制鐵螯合酶（ferrochelatase），阻礙 Fe²⁺ 插入原卟啉，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_019","year":2022,"roc_year":111,"session":"","examNo":19,"q":"有關新生仔畜同種異型紅血球溶解症（neonatal isoerythrolysis）之敘述，下列何者錯誤？","opts":["A. 表示新生仔畜和母畜有不同血型","B. 利用母畜血清與仔畜血球進行檢驗","C. 檢驗結果有強力凝集溶血時，應儘快餵飼初乳以提升免疫力","D. 較常見於馬、貓"],"ans":2,"exp":"新生仔畜同種異型紅血球溶解症（neonatal isoerythrolysis）時，若母畜血清與仔畜血球的配合試驗出現強力凝集溶血，應立即停止餵飼初乳（或換其他母畜的初乳），而非繼續餵飼，以免抗體大量進入仔畜血液造成嚴重溶血。","we":["新生仔畜與母畜血型不同，母畜初乳含有針對仔畜血型抗原的抗體，此敘述正確。","利用母畜血清與仔畜血球進行試管配合試驗，是診斷本病的標準方法，此敘述正確。","（正確）配合試驗呈強力凝集溶血時，應立即停止餵初乳，而非加速餵飼，此為錯誤敘述，為本題答案。","本病較常見於馬（Aa、Qa 血型）及貓（A型母貓生出B型仔貓），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_020","year":2022,"roc_year":111,"session":"","examNo":20,"q":"某貧血犬隻其白血球總數為 40,000/μL，血液抹片下 100 顆白血球範圍中可見到 25 顆有核紅血球，按公式修\r  正白血球總數應為","opts":["A. 40,000/μL","B. 50,000/μL","C. 30,000/μL","D. 32,000/μL"],"ans":3,"exp":"修正公式：修正 WBC = 觀測 WBC × 100 ÷ (100 + nRBC 數)。本題：40,000 × 100 ÷ (100 + 25) = 40,000 × 100/125 = 32,000/μL。","we":["40,000/μL 未經修正，未扣除有核紅血球的干擾，答案不正確。","50,000/μL 計算錯誤，無正確公式可得此值。","30,000/μL 計算錯誤，與公式結果不符。","（正確）修正 WBC = 40,000 × 100/(100+25) = 32,000/μL，正確扣除 nRBC 干擾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_021","year":2022,"roc_year":111,"session":"","examNo":21,"q":"分娩中的健康母牛，其因腎上腺素引起的生理性白血球增多症，與其他動物相較，可能出現下列何種血球\r  相？","opts":["A. 單核球減少","B. 嗜中性球減少","C. 淋巴球減少","D. 嗜酸性球減少"],"ans":2,"exp":"牛對腎上腺素（生理性緊迫）的反應與其他動物不同：腎上腺素在牛會使脾臟收縮釋放紅血球，同時引發淋巴球增多（lymphocytosis）而非淋巴球減少，原因是牛的淋巴球對腎上腺素受體反應特殊。題目問「可能出現」的特殊血球相，答案為淋巴球減少在其他動物出現但牛出現的是淋巴球增多，故牛的特殊點是「淋巴球減少」較不明顯，依官方答案此題選 C（淋巴球減少）表示牛的這一反應與其他動物不同。","we":["單核球減少不是腎上腺素反應的主要特徵，牛與其他動物差異不在此。","嗜中性球減少非腎上腺素/生理性緊迫的預期結果，生理性緊迫反而使嗜中性球從邊緣池進入循環而增多。","（正確）牛在腎上腺素引起的生理性白血球增多中，可出現淋巴球減少，此與其他動物的反應有所不同。","嗜酸性球減少是皮質醇（cortisol/緊迫性）反應，非腎上腺素（生理性）反應的特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_022","year":2022,"roc_year":111,"session":"","examNo":22,"q":"有關腎上腺皮質酮誘起之緊迫性白血球相，下列敘述何者正確？","opts":["A. 因邊緣池中嗜中性球移入循環池，造成嗜中性球增多症，但血中邊緣池及循環池中嗜中性球總數並無改變","B. 嗜酸性球被抑留於微血管中，導致嗜酸性球減少症","C. 循環池中淋巴球再分布導致淋巴球增多症","D. 骨髓釋放出單核球數目增加，導致單核球增多症"],"ans":0,"exp":"腎上腺皮質酮（glucocorticoid）引起的緊迫性白血球相：嗜中性球從邊緣池（marginal pool）移入循環池（circulating pool），使循環嗜中性球增多，但邊緣池+循環池的總數不變。同時淋巴球減少、嗜酸性球減少、單核球增多。","we":["（正確）皮質酮使邊緣池嗜中性球移入循環池，循環池增多但總池量不變，此敘述正確。","嗜酸性球被隔留於骨髓或組織中（非微血管），造成嗜酸性球減少症，位置描述有誤。","皮質酮使淋巴球再分布至淋巴組織，造成淋巴球減少症，非增多症。","皮質酮引起單核球增多的機制是骨髓釋放增加，此部分描述基本正確，但 A 選項更精確描述嗜中性球機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_023","year":2022,"roc_year":111,"session":"","examNo":23,"q":"貓患有佩格爾氏異常（Pelger-Huët anomaly）時，其嗜中性球有何變化？","opts":["A. 正常","B. 型態正常但數量增多","C. 高度核分葉","D. 低度核分葉"],"ans":3,"exp":"Pelger-Huët anomaly 是一種嗜中性球核分葉不足的遺傳性異常，患有此症的動物其嗜中性球呈低度核分葉（hyposegmentation），細胞核呈花生形或帶狀，但細胞功能正常。","we":["Pelger-Huët anomaly 患畜的嗜中性球形態異常（核分葉不足），並非外觀正常。","此病不影響嗜中性球數量，只影響核分葉形態，數量不一定增多。","高度核分葉（hypersegmentation）為老化嗜中性球或 B12/葉酸缺乏的特徵，與 Pelger-Huët anomaly 相反。","（正確）Pelger-Huët anomaly 特徵為嗜中性球低度核分葉（核分葉數少，外觀類似帶狀球），為遺傳性異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_024","year":2022,"roc_year":111,"session":"","examNo":24,"q":"下圖為毒血症（toxemia）犬隻血球相，箭頭所指為何？","opts":["A. 嗜中性球，Döhle bodies","B. 嗜中性球，Heinz bodies","C. 單核球，Döhle bodies","D. 單核球，Heinz bodies"],"ans":0,"exp":"毒血症（toxemia）時嗜中性球可出現毒性變化，包括 Döhle bodies（嗜鹼性胞質包含體，為粗糙內質網殘留）、毒性顆粒及空泡化。Döhle bodies 出現在嗜中性球，非單核球；Heinz bodies 出現在紅血球，非白血球。","we":["（正確）毒血症時嗜中性球出現 Döhle bodies（藍灰色胞質包含體），為毒性變化指標。","Heinz bodies 出現在紅血球（氧化性損傷），不出現在嗜中性球，B 選項錯誤。","Döhle bodies 見於嗜中性球，非單核球，C 選項細胞種類錯誤。","單核球不出現 Heinz bodies，D 選項兩項均錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_025","year":2022,"roc_year":111,"session":"","examNo":25,"q":"箭頭所指爲何種血球？","opts":["A. 帶狀嗜中性球","B. 嗜酸性球","C. 淋巴球","D. 單核球"],"ans":1,"exp":"依承上題（Q26 敘述以嗜酸性球調控），配合圖片判讀：嗜酸性球（eosinophil）在 Wright-Giemsa 染色下胞質含大型橘紅色顆粒，核分二葉，易於識別。此類題需圖片確認，但依選項邏輯推斷答案為嗜酸性球。","we":["帶狀嗜中性球核呈馬蹄形/帶狀，胞質呈淡紫色，無橘紅色顆粒，與嗜酸性球不同。","（正確）嗜酸性球含大型橘紅色胞質顆粒、雙葉核，為本題圖示箭頭所指細胞。","淋巴球核大、胞質少，呈深藍色，無特殊顆粒，形態明顯不同。","單核球核呈腎形或馬蹄形，胞質灰藍色，無大型橘紅顆粒。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_026","year":2022,"roc_year":111,"session":"","examNo":26,"q":"承上題，有關此種血球之敘述，下列何者正確？","opts":["A. 當許多此種血球進入血中，稱為核左轉","B. 此種血球形成過程受顆粒球生成素調控","C. 骨髓內無此種血球的儲存池，由增殖池直接移入血中","D. 通常年幼動物的此種血球比成年動物多"],"ans":1,"exp":"承上題箭頭所指為嗜酸性球。嗜酸性球生成受顆粒球生成素（GM-CSF）及 IL-5 調控；骨髓內有儲存池；成年動物嗜酸性球較年幼動物多（非少）；大量嗜酸性球進入血中稱嗜酸性球增多症，非核左轉（核左轉指帶狀球增多）。故 B（受顆粒球生成素調控）正確。","we":["大量帶狀嗜中性球（非嗜酸性球）進入血中，才稱為「核左轉」，此敘述錯誤。","（正確）嗜酸性球生成受 GM-CSF、IL-5 等顆粒球生成素調控，此敘述正確。","骨髓內確實有嗜酸性球儲存池，並非由增殖池直接移入血中，此敘述錯誤。","成年動物接觸過敏原與寄生蟲的機會較多，嗜酸性球數量通常不少於年幼動物，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_027","year":2022,"roc_year":111,"session":"","examNo":27,"q":"下圖為犬隻白血病血液抹片，可推測最可能罹患何種疾病                 可推測最可能罹患何種疾病？","opts":["A. lymphoid leukemia","B. monocytic leukemia","C. mast cell leukemia","D. basophilic leukemia"],"ans":0,"exp":"淋巴性白血病（lymphoid leukemia）的血液抹片特徵：大量小至中型淋巴球，核染色質濃縮，胞質少，可見破碎細胞（smudge cells）。需配合圖片確認，但依選項描述，lymphoid leukemia 是最常見的犬隻白血病類型。","we":["（正確）淋巴性白血病血塗片可見大量淋巴球（小至中型），為犬隻最常見白血病型態。","單核性白血病細胞胞質豐富、核呈腎形，形態與淋巴球不同。","肥大細胞性白血病細胞含大量紫色顆粒，形態獨特，與淋巴球易區分。","嗜鹼性白血病罕見，細胞含嗜鹼性顆粒，形態與淋巴球不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_028","year":2022,"roc_year":111,"session":"","examNo":28,"q":"下圖為何種嗜中性球增多症之機轉 ？（每個嗜中性球池之相對大小以長方形面積大小表示，箭頭大小表示各 嗜中性球池之細胞進出量。上圖為正常機轉之圖示。 )","opts":["A. 生理性嗜中性球增多症","B. 非炎症性之全身性緊迫","C. 慢性化膿性炎症","D. 化膿性炎症病變之形成期"],"ans":2,"exp":"慢性化膿性炎症（chronic suppurative inflammation）時，骨髓長期受刺激，儲存池耗盡後仍持續釋放帶狀球（核左轉），循環池與儲存池均縮小，但骨髓增殖池持續擴大以補充，圖示呈現儲存池縮小、增殖池擴大的模式。","we":["生理性嗜中性球增多症（腎上腺素）：邊緣池→循環池轉移，儲存池不變，增殖池不變。","非炎症性全身性緊迫（皮質酮）：邊緣池→循環池，總數不變，無儲存池顯著消耗。","（正確）慢性化膿性炎症：儲存池耗盡、增殖池擴大、持續核左轉，符合題目圖示特徵。","化膿性炎症形成期：儲存池急性消耗，可見核左轉，但尚未達慢性期的持續擴增模式。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_029","year":2022,"roc_year":111,"session":"","examNo":29,"q":"下列何種骨髓增殖性疾病後期，常會導致病畜呈現嚴重泛血球減少症？","opts":["A. 顆粒球性白血病","B. 漿細胞性骨髓瘤","C. 肥大細胞性白血病","D. 骨髓纖維化"],"ans":3,"exp":"骨髓纖維化（myelofibrosis）是骨髓增殖性疾病的終末期，纖維組織取代正常造血組織，導致全系血球生成障礙，最終出現嚴重的泛血球減少症（pancytopenia）。","we":["顆粒球性白血病主要表現為白血球極度增多，末期雖可能出現造血障礙，但泛血球減少不如骨髓纖維化典型。","漿細胞性骨髓瘤主要造成貧血及免疫球蛋白異常，泛血球減少不是其最典型結局。","肥大細胞性白血病少見，主要影響不在骨髓造血功能全面衰竭。","（正確）骨髓纖維化後期，纖維組織完全取代造血組織，導致嚴重泛血球減少症，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_030","year":2022,"roc_year":111,"session":"","examNo":30,"q":"下列何種病症，是因血小板表面之 glycoprotein IIb-IIIa 缺陷或缺乏，造成血小板聚集作用減低及血塊收縮作用\r  異常？","opts":["A. Chediak-Higashi sydrome","B. Glanzmann's thrombasthenia","C. Type 2 von Willebrand's disease","D. X'mas disease"],"ans":1,"exp":"Glanzmann's thrombasthenia（血小板無力症）是血小板表面 glycoprotein IIb-IIIa（GPIIb/IIIa，即 integrin αIIbβ3）缺陷，導致血小板無法聚集及血塊收縮異常，出血時間延長但血小板數正常。","we":["Chediak-Higashi syndrome 是溶酶體相關顆粒缺陷，影響血小板顆粒釋放，機制與 GPIIb/IIIa 不同。","（正確）Glanzmann's thrombasthenia 因 GPIIb/IIIa 缺陷，血小板無法與纖維蛋白原結合，聚集功能喪失。","Type 2 von Willebrand's disease 是 vWF 質的異常，影響血小板黏附（GPIb），非 GPIIb/IIIa 缺陷。","X'mas disease（Christmas disease）是第 IX 凝血因子缺乏，屬凝血因子缺乏病，非血小板功能障礙。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_031","year":2022,"roc_year":111,"session":"","examNo":31,"q":"第 VII 凝血因子缺乏被發現於數個犬種，臨床症狀通常不嚴重，其最常見於何種犬種及伴隨何種臨床症狀？","opts":["A. 米格魯；淤血","B. 黃金獵犬；淤血","C. 米格魯；血栓","D. 黃金獵犬；血栓"],"ans":0,"exp":"第 VII 凝血因子缺乏在犬中最常見於米格魯（Beagle），臨床症狀通常輕微，主要表現為術後或外傷後的輕度淤血（ecchymosis），而非嚴重的出血或血栓。","we":["（正確）第 VII 因子缺乏最常見於米格魯，伴隨輕度淤血（出血症狀），臨床上通常不嚴重。","黃金獵犬常見的遺傳性凝血障礙包括 vWD，非第 VII 因子缺乏的典型犬種。","血栓是凝血過度的表現，第 VII 因子缺乏反而造成凝血不足（淤血），非血栓。","黃金獵犬與第 VII 因子缺乏及血栓均無特定關聯，此選項兩項均不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_032","year":2022,"roc_year":111,"session":"","examNo":32,"q":"防止血栓形成的胞漿素原（plasminogen），主要由何處製造？","opts":["A. 血管內皮細胞","B. 腎上腺","C. 肝臟","D. 脾臟"],"ans":2,"exp":"胞漿素原（plasminogen）主要由肝臟合成，作為纖維蛋白溶解系統的前驅物，被 tPA 或 uPA 活化後成為胞漿素（plasmin），分解纖維蛋白以防止血栓過度形成。","we":["血管內皮細胞分泌 tPA（組織型胞漿素原活化因子），是活化 plasminogen 的酵素，非 plasminogen 的製造場所。","腎上腺主要分泌腎上腺素、皮質酮等，不製造 plasminogen。","（正確）Plasminogen 主要由肝臟製造，是纖維蛋白溶解系統的關鍵前驅蛋白。","脾臟主要功能為血球過濾與免疫，不是 plasminogen 的主要製造場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_033","year":2022,"roc_year":111,"session":"","examNo":33,"q":"下列何種凝血因子之作用可活化第 II 凝血因子？","opts":["A. VIIIa","B. VIIa","C. IXa","D. Xa"],"ans":3,"exp":"凝血共同途徑中，第 Xa 因子與第 Va 因子（在磷脂表面及 Ca²⁺ 存在下）形成凝血酶原酶複合體（prothrombinase complex），活化第 II 因子（凝血酶原→凝血酶）。","we":["VIIIa 是內在路徑的輔因子，與 IXa 共同活化 X，不直接活化第 II 因子。","VIIa 在外在路徑活化第 X 因子，不直接活化第 II 因子。","IXa（與 VIIIa）活化第 X 因子，不直接活化第 II 因子。","（正確）Xa（與 Va）形成凝血酶原酶，直接活化第 II 因子（凝血酶原→凝血酶）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_034","year":2022,"roc_year":111,"session":"","examNo":34,"q":"血清中不具有下列何項凝血因子？","opts":["A. VII","B. VIII","C. IX","D. XII"],"ans":1,"exp":"血清（serum）是血液凝固後去除血塊所得，凝血過程消耗了第 I（纖維蛋白原）、II、V、VIII 因子。因此血清中缺乏第 VIII 因子，因為它在凝血過程中被大量消耗。血清中仍含有 VII、IX、XII 等因子。","we":["第 VII 因子在外在路徑起始後並未完全消耗，血清中仍可偵測到，故血清中有 VII。","（正確）第 VIII 因子是內在路徑輔因子，在凝血過程中被消耗，血清中幾乎不含第 VIII 因子。","第 IX 因子在凝血後仍存在於血清中，不被完全消耗。","第 XII 因子（Hageman factor）在內在路徑啟動後部分保留，血清中仍可偵測到。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_035","year":2022,"roc_year":111,"session":"","examNo":35,"q":"血小板數正常，口腔黏膜出血時間（BMBT）正常，活化部分成栓質時間（APTT）正常，一段式凝血酶原時\r  間（OSPT）延長，凝血酶時間（TT）正常，纖維素降解產物（FDP）正常，上述實驗室檢查結果代表何種止 血障礙？","opts":["A. 血小板功能缺損","B. 第Ⅶ凝血因子缺乏","C. 封魏氏病","D. 瀰漫性血管內凝血"],"ans":1,"exp":"OSPT（一段式凝血酶原時間，即 PT）延長而 APTT 正常，表示外在路徑異常；血小板功能正常（BMBT 正常）；TT 及 FDP 正常排除 DIC 及纖維蛋白溶解異常。外在路徑中唯一獨有的因子是第 VII 因子，故此結果最符合第 VII 凝血因子缺乏。","we":["血小板功能缺損會使 BMBT 延長，但本題 BMBT 正常，排除此選項。","（正確）OSPT（PT）延長而 APTT 正常，指向外在路徑（第 VII 因子）缺陷，為本題答案。","von Willebrand 病（封魏氏病）主要影響一期止血（BMBT 延長），本題 BMBT 正常，不符。","DIC 時 PT、APTT 均延長，FDP 升高，血小板減少，與本題結果不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_036","year":2022,"roc_year":111,"session":"","examNo":36,"q":"第幾凝血因子可使單體纖維素成為穩定血栓？","opts":["A. I","B. V","C. VIII","D. XIII"],"ans":3,"exp":"第 XIII 凝血因子（纖維蛋白穩定因子，fibrin-stabilizing factor）由凝血酶活化後，作為轉麩醯胺酸酶（transglutaminase），使纖維素單體（fibrin monomers）之間形成共價交聯，成為穩定的不溶性血栓。","we":["第 I 因子（纖維蛋白原）是纖維素的前驅物，被凝血酶切割成纖維素單體，但不負責交聯穩定。","第 V 因子是凝血酶原酶的輔因子，不直接使纖維素穩定化。","第 VIII 因子是內在路徑輔因子，不直接使纖維素穩定化。","（正確）第 XIII 因子（被凝血酶活化）催化纖維素單體間共價交聯，形成穩定血栓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_037","year":2022,"roc_year":111,"session":"","examNo":37,"q":"下列何者之蛋白質判讀結果最不可能出現？","opts":["A. 淋巴增生性疾病：正常白蛋白濃度，伴隨低球蛋白濃度","B. 球蛋白生成上升，因脫水而掩蓋的低白蛋白血症：正常白蛋白濃度，伴隨高球蛋白濃度","C. 脫水：高白蛋白濃度，伴隨高球蛋白濃度","D. 右心鬱血性心衰竭：低白蛋白濃度，伴隨正常球蛋白濃度"],"ans":0,"exp":"淋巴增生性疾病（如多發性骨髓瘤）通常使球蛋白大量升高，而白蛋白可因消耗或競爭而偏低；出現「正常白蛋白＋低球蛋白」的組合最不可能，因腫瘤性漿細胞通常大量分泌免疫球蛋白（球蛋白升高）。","we":["（正確）淋巴增生性疾病（尤其多發性骨髓瘤）通常造成球蛋白升高而非偏低，「低球蛋白」最不可能出現，為本題答案。","脫水可相對提高白蛋白與球蛋白（同時升高），同時掩蓋原本存在的低白蛋白血症，使白蛋白看似正常，此情境合理。","脫水使白蛋白與球蛋白均升高，此為常見結果，合理。","右心鬱血性心衰竭導致靜脈壓升高、蛋白質滲漏，低白蛋白合理；球蛋白在輕度失調下仍可正常，此情境可能發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_038","year":2022,"roc_year":111,"session":"","examNo":38,"q":"下列何種疾病最不會導致低蛋白血症？","opts":["A. 瀰漫性血管內凝血（DIC）","B. 慢性肝病","C. 嚴重滲出性皮膚病","D. 大量出血"],"ans":0,"exp":"DIC（瀰漫性血管內凝血）主要消耗凝血因子及血小板，並不直接導致大量蛋白質喪失（蛋白質不是 DIC 的主要消耗物），故最不會導致低蛋白血症。慢性肝病（合成減少）、嚴重滲出性皮膚病（蛋白質流失）、大量出血（血液流失）均可導致低蛋白血症。","we":["（正確）DIC 消耗凝血因子與血小板，並不直接導致低蛋白血症，是本題最不可能的答案。","慢性肝病使白蛋白合成減少，確實導致低蛋白
