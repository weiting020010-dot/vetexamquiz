2,"exp":"球狀紅血球（spherocyte）主要由免疫媒介溶血性貧血（IMHA）所造成：抗體附著於紅血球表面，巨噬細胞在清除抗體的過程中啃食部分細胞膜，使紅血球失去雙凹圓形，變為球形且缺乏中心淡染區。","we":["鐵缺乏會導致小球性低色素貧血（microcytic hypochromic anemia）及leptocyte，而非spherocyte。","血管肉瘤（hemangiosarcoma）可造成schistocyte（裂紅球）或acanthocyte，但spherocyte不是主要表現。","（正確）免疫溶血性貧血（IMHA）是spherocyte形成的最主要原因，巨噬細胞啃食抗體附著的紅血球膜所致。","再生性貧血本身是一種反應，不是spherocyte的成因；spherocyte見於IMHA，IMHA雖是再生性貧血，但成因是免疫機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_021","year":2024,"roc_year":113,"session":"","examNo":21,"q":"一隻8歲母狗近幾天日漸虛弱，黏膜非常蒼白，經血液學檢查後數值如下表，初步可判讀為那一型貧血？","opts":["A. 再生性貧血，因為有核紅血球增加","B. 再生性貧血，因為網織球數量增加","C. 非再生性貧血，因為有核紅血球增加","D. 非再生性貧血，因為網織球數量增加"],"ans":1,"exp":"判斷再生性或非再生性貧血的主要指標是網織球計數：若網織球數量增加（>80,000/μL for dogs），即判定為再生性貧血；有核紅血球（nRBC）增加不能單獨作為再生性的判斷依據，需同時有網織球增多才有意義。","we":["有核紅血球（nRBC）增加不足以單獨診斷再生性貧血，需同時確認網織球計數才能判定。","（正確）網織球數量增加是判定再生性貧血的主要依據，代表骨髓對貧血的代償性造血反應。","有核紅血球增加若不伴隨網織球增多，反而可能提示骨髓浸潤或嚴重骨髓疾病（非再生性）。","非再生性貧血的判定需以網織球計數降低或正常為依據，而非以增加來定義。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_實診_022","year":2024,"roc_year":113,"session":"","examNo":22,"q":"引起血管內溶血之機轉，下列何者錯誤？","opts":["A. 免疫性貧血時活化補體","B. 巨噬細胞活性增加","C. DIC時之物理性破壞","D. 滲透壓性破壞"],"ans":1,"exp":"血管內溶血的機轉包括：補體活化（免疫性）、物理性破壞（DIC中微血管血栓）及滲透壓性破壞；巨噬細胞活性增加是血管外溶血（extravascular hemolysis）的機轉，發生於脾臟和肝臟，而非血管內。","we":["免疫性貧血活化補體（C5b-9 membrane attack complex）可直接在血管內裂解紅血球，屬血管內溶血機轉。","（正確）巨噬細胞活性增加是血管外溶血的機轉（發生於脾臟等RES），並非血管內溶血的機轉，故此為錯誤描述。","DIC時微血管內纖維蛋白網對紅血球造成物理性切割，屬血管內溶血（microangiopathic hemolysis）。","滲透壓性破壞（如低滲溶液進入血管）可使紅血球在血管內膨脹破裂，屬血管內溶血機轉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_023","year":2024,"roc_year":113,"session":"","examNo":23,"q":"嗜鹼性球的顆粒缺乏下列何種物質？","opts":["A. heparin","B. acid hydrolase","C. histamine","D. sulfated mucopolysaccharides"],"ans":1,"exp":"嗜鹼性球（basophil）的顆粒含有heparin、histamine及sulfated mucopolysaccharides等物質；acid hydrolase（酸性水解酶）主要存在於嗜中性球及巨噬細胞的溶酶體中，並非嗜鹼性球顆粒的組成成分。","we":["Heparin（肝素）是嗜鹼性球顆粒的主要成分之一，具有抗凝血作用。","（正確）Acid hydrolase（酸性水解酶）不存在於嗜鹼性球顆粒中，而是嗜中性球溶酶體的成分。","Histamine（組織胺）大量儲存於嗜鹼性球及肥大細胞顆粒中，是過敏反應的主要媒介物。","Sulfated mucopolysaccharides（硫酸化黏多醣）是嗜鹼性球顆粒的組成成分，形成顆粒的染色特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_024","year":2024,"roc_year":113,"session":"","examNo":24,"q":"健康動物血液中之淋巴球數，隨著年齡增加有何變化？","opts":["A. 增加","B. 減少","C. 不變","D. 忽高忽低"],"ans":1,"exp":"幼年動物的淋巴球計數較高，因為免疫系統尚在發育且接觸抗原刺激較多；隨著年齡增長，胸腺退化、免疫系統趨於穩定，血液中淋巴球數量逐漸減少，老年動物尤其明顯。","we":["幼年動物淋巴球較多，隨年齡增加而減少，而非持續增加。","（正確）健康動物血液中淋巴球數隨年齡增加而減少，與胸腺退化和免疫系統成熟相關。","淋巴球數確實隨年齡有規律性變化（減少），而非維持不變。","淋巴球數隨年齡有規律性減少趨勢，並非忽高忽低的不規律變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_025","year":2024,"roc_year":113,"session":"","examNo":25,"q":"使用類固醇時，最可能會發生下列何種變化？","opts":["A. 嗜中性球低下症","B. 嗜中性球增多症伴隨核左轉","C. 淋巴球增多症","D. 單核球增多症"],"ans":3,"exp":"類固醇（皮質醇）造成的典型白血球反應（stress leukogram）包括：嗜中性球增多（無核左轉）、淋巴球減少、嗜酸性球減少、單核球增多；單核球增多症（monocytosis）是類固醇/壓力反應的典型表現之一。","we":["類固醇導致嗜中性球從邊緣池進入循環，造成嗜中性球增多症，而非減少症。","類固醇引起的嗜中性球增多症不伴隨核左轉（核左轉代表骨髓釋放不成熟嗜中性球，見於嚴重感染）。","類固醇引起淋巴球由血液重新分布至淋巴組織，造成淋巴球減少症，而非增多症。","（正確）單核球增多症（monocytosis）是類固醇/壓力反應白血球譜的典型組成，與嗜中性球增多並存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_026","year":2024,"roc_year":113,"session":"","examNo":26,"q":"有關班瓊斯（Bence-Jones）蛋白尿之敘述，下列何者正確？","opts":["A. 可與尿液試紙上的蛋白質指示劑產生反應","B. acute lymphoblastic leukemia的特徵","C. 班瓊斯蛋白亦出現在血清中，且濃度比在尿液中更高","D. 利用濃縮尿液進行電泳是最佳檢測方法"],"ans":3,"exp":"Bence-Jones蛋白（輕鏈免疫球蛋白）是多發性骨髓瘤的特徵，尿液試紙無法有效偵測（因試紙主要偵測白蛋白）；最佳檢測方法是將尿液濃縮後進行蛋白質電泳（urine protein electrophoresis），可顯示單株性輕鏈峰值。","we":["Bence-Jones蛋白主要為輕鏈免疫球蛋白，尿液試紙的蛋白指示劑主要偵測白蛋白，對輕鏈不敏感，無法可靠反應。","Bence-Jones蛋白尿是多發性骨髓瘤（漿細胞瘤）的特徵，而非急性淋巴母細胞白血病。","Bence-Jones蛋白主要出現在尿液中，由腎臟過濾排出；血清中可有單株免疫球蛋白（M蛋白），但Bence-Jones蛋白特指尿中輕鏈。","（正確）濃縮尿液進行電泳（urine protein electrophoresis）是檢測Bence-Jones蛋白的最佳方法，可顯示輕鏈峰值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_027","year":2024,"roc_year":113,"session":"","examNo":27,"q":"有關單核球之敘述，下列何者正確？","opts":["A. 比巨噬細胞含較多蛋白質消化酶","B. 破骨細胞屬於單核球轉變的巨噬細胞","C. 在骨髓內約儲存3天份的供應量","D. 單核球增多症常伴隨嗜中性球減少症"],"ans":1,"exp":"破骨細胞（osteoclast）起源於單核吞噬細胞系統（mononuclear phagocyte system），由多個單核球/巨噬細胞融合形成的多核巨細胞，屬於巨噬細胞系列的特化形式，負責骨組織的重塑與吸收。","we":["巨噬細胞含有較多且更成熟的溶酶體和蛋白質消化酶，其消化能力強於循環中的單核球。","（正確）破骨細胞（osteoclast）屬於由單核球分化而來的巨噬細胞特化形式，為多核巨細胞。","單核球在骨髓內的儲存量極少（約不到1天），與嗜中性球（約5-6天儲存）形成對比，需要時主要靠加速骨髓生成補充。","單核球增多症通常伴隨慢性炎症或類固醇反應，與嗜中性球減少症沒有直接伴隨關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_028","year":2024,"roc_year":113,"session":"","examNo":28,"q":"淋巴瘤之分型及預後判斷，通常並不包括下列何種分析因子？","opts":["A. 解剖位置及結構分布","B. 細胞表面抗原（CD markers）分析","C. 分裂細胞數量","D. 細胞大小及分化"],"ans":2,"exp":"淋巴瘤的分型及預後評估通常依據：解剖位置（多中心型、消化道型等）、細胞表面抗原（B細胞/T細胞免疫表型，CD20/CD3等）及細胞大小與分化程度（WHO分類）；「分裂細胞數量」（mitotic index）雖可作為惡性程度指標，但不是標準分型因子。","we":["解剖位置及結構分布（多中心、縱膈腔、消化道、皮膚型等）是淋巴瘤分型的基本依據。","細胞表面抗原（CD markers）分析用於區分B細胞與T細胞淋巴瘤，對預後和治療選擇極為重要。","（正確）分裂細胞數量（mitotic count）雖反映惡性程度，但並非淋巴瘤標準分型系統的主要因子。","細胞大小及分化程度（大細胞/小細胞，中心母細胞等）是WHO淋巴瘤分類的核心組織學依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_029","year":2024,"roc_year":113,"session":"","examNo":29,"q":"一隻12歲柴犬因食慾不振就診，發現脾臟腫大，血液學檢查白血球總數增加至100,000/μL且以淋巴球為\r   主，最可能為下列何者？","opts":["A. 庫興病（Cushing's disease）","B. 腎上腺功能低下症","C. 艾利希體感染症","D. 淋巴球性白血病"],"ans":3,"exp":"老年犬出現極度淋巴球增多症（WBC>100,000/μL，以淋巴球為主）合併脾腫大，強烈提示慢性淋巴球性白血病（CLL）；Cushing's disease造成嗜中性球增多而非淋巴球增多，艾利希體可造成淋巴球增多但通常不到如此極端數值。","we":["庫興病（Cushing's disease）造成壓力性白血球譜（嗜中性球增多、淋巴球減少），不會造成極度淋巴球增多。","腎上腺功能低下症（Addison's disease）可造成淋巴球增多，但通常不會達到100,000/μL的極端數值。","艾利希體感染可造成淋巴球增多，但極少達到如此高的淋巴球數值，且通常有其他血液學異常（血小板減少）。","（正確）極度淋巴球增多症（>100,000/μL）合併脾腫大在老年犬最符合慢性淋巴球性白血病（CLL）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_031","year":2024,"roc_year":113,"session":"","examNo":31,"q":"犬貓最常使用下列何種試驗評估初級凝血功能（primary hemostasis）？","opts":["A. 口腔黏膜出血時間（buccal mucosal bleeding time）","B. 活化凝血時間（activated clotting time）","C. 凝血酶原時間（prothrombin time）","D. 活化部分成栓質時間（activated partial thromboplastin time）"],"ans":0,"exp":"初級凝血（primary hemostasis）涉及血小板栓子的形成，評估指標為口腔黏膜出血時間（BMBT）；BMBT可反映血小板數量、功能及von Willebrand factor（vWF）的交互作用，是評估初級凝血最常用的臨床試驗。","we":["（正確）口腔黏膜出血時間（BMBT）專門評估初級凝血功能（血小板及vWF），是犬貓最常用的初級凝血評估試驗。","活化凝血時間（ACT）評估內因性凝血途徑（因子XII、XI、IX、VIII）及共同途徑，屬次級凝血評估。","凝血酶原時間（PT）評估外因性凝血途徑（因子VII）及共同途徑，屬次級凝血評估。","活化部分成栓質時間（APTT）評估內因性凝血途徑，屬次級凝血評估，而非初級凝血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_032","year":2024,"roc_year":113,"session":"","examNo":32,"q":"血小板主要儲存於脾臟及何種器官？","opts":["A. 心","B. 肝","C. 肺","D. 腎"],"ans":2,"exp":"血小板在生成後，約三分之一儲存於脾臟及肺臟的微血管中作為備用庫；正常情況下脾臟是主要的血小板儲存庫，肺臟也是重要的備用儲存器官，兩者可在需要時快速釋放至循環中。","we":["心臟並非血小板的主要儲存場所。","肝臟是血小板生成所需血小板生成素（TPO）的主要來源，但不是血小板的儲存庫。","（正確）血小板除儲存於脾臟外，肺臟也是重要的血小板儲存器官。","腎臟不是血小板的儲存器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_033","year":2024,"roc_year":113,"session":"","examNo":33,"q":"有關凝血因子致活過程，下列何者正確？","opts":["A. 凝血內因系統僅用血中已有因子即可活化","B. 第X因子為其他凝血因子的受質，參與凝血最終階段","C. 第XI及XII因子在血液經冷藏後會消失","D. 拮抗維生素K的物質，會影響纖維素原族如第XIII因子的合成"],"ans":0,"exp":"凝血內因系統（intrinsic pathway）由血液中已有的因子（XII、XI、IX、VIII等）組成，無需外來組織因子即可活化（由接觸活化啟動）；外因系統需要組織因子（factor III）才能啟動；維生素K拮抗劑影響的是維生素K依賴因子（II、VII、IX、X），而非纖維蛋白原族。","we":["（正確）凝血內因系統（intrinsic pathway）僅用血液中已有的因子（接觸活化）即可啟動，無需外來組織因子。","第X因子是共同途徑的起始點，但其受質是凝血酶原（因子II），而非其他凝血因子；第Xa因子活化凝血酶原形成凝血酶。","第XI及XII因子在冷藏後穩定，因子V和VIII才是不穩定的labile factors，於4°C下會降解。","維生素K拮抗劑（如warfarin）影響的是維生素K依賴性因子（II、VII、IX、X），第XIII因子屬纖維蛋白穩定族，不受維生素K影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_034","year":2024,"roc_year":113,"session":"","examNo":34,"q":"下列何種狀況可見纖維素降解產物（FDP）增加？","opts":["A. 血小板減少症","B. 殺鼠劑（warfarin）中毒","C. 封魏氏病（vWD）","D. 瀰漫性血管內凝血（DIC）"],"ans":3,"exp":"纖維蛋白降解產物（FDP）是纖維蛋白原或纖維蛋白被纖溶酶（plasmin）分解的產物；DIC（瀰漫性血管內凝血）時大量纖維蛋白形成後被纖溶系統分解，導致FDP顯著升高，是DIC診斷的重要指標。","we":["血小板減少症（thrombocytopenia）影響初級凝血，不直接導致纖維蛋白降解產物增加。","Warfarin中毒抑制維生素K依賴因子的合成，影響凝血酶原時間，但不直接造成大量纖維蛋白形成與降解，FDP不一定顯著升高。","封魏氏病（vWD）為vWF缺乏，影響初級凝血（血小板黏附），不直接導致FDP增加。","（正確）DIC時大量纖維蛋白形成後被纖溶系統分解，FDP（包括D-dimer）顯著升高，是DIC的重要診斷標誌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_035","year":2024,"roc_year":113,"session":"","examNo":35,"q":"下列何者不屬於凝血酶時間（thrombin time）延長的主因？","opts":["A. 低纖維素原血症","B. 纖維素降解產物濃度太高","C. 吸血性胃腸道寄生蟲病","D. 肝素治療中"],"ans":2,"exp":"凝血酶時間（thrombin time, TT）測定凝血酶將纖維蛋白原轉化為纖維蛋白的時間；TT延長見於：低纖維蛋白原血症、FDP干擾（競爭抑制）及肝素治療；吸血性胃腸道寄生蟲造成慢性出血性貧血，主要影響鐵缺乏，不直接影響TT。","we":["低纖維素原血症（hypofibrinogenemia）使TT延長，因可用受質不足，凝血酶無法快速形成纖維蛋白。","FDP濃度過高會競爭抑制凝血酶對纖維蛋白原的作用，使TT延長。","（正確）吸血性胃腸道寄生蟲主要造成慢性失血性貧血和缺鐵，不直接延長凝血酶時間（TT）。","肝素治療可抑制凝血酶活性，使TT顯著延長，是TT延長的常見原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_036","year":2024,"roc_year":113,"session":"","examNo":36,"q":"有一犬隻懷疑患有封魏氏病（von Willebrand disease），其凝血相關測試：血小板數量、口腔黏膜出血時   間（buccal mucosal bleeding time, BMBT）、活化部分成栓質時間（activated partial thromboplastin  time, APTT）、凝血酶原時間（prothrombin time, PT）、凝血酶時間（thrombin time, TT）的檢驗結果變化為何？","opts":["A. 血小板數量正常、BMBT延長、APTT正常、PT正常、TT正常","B. 血小板數量異常、BMBT延長、APTT正常、PT正常、TT正常","C. 血小板數量正常、BMBT正常、APTT延長、PT正常、TT正常","D. 血小板數量正常、BMBT正常、APTT正常、PT延長、TT正常"],"ans":0,"exp":"封魏氏病（vWD）中vWF缺乏影響血小板黏附（初級凝血），表現為BMBT延長；血小板數量本身正常；嚴重型vWD可因vWF攜帶Factor VIII而使APTT略延長，但輕中度vWD的APTT通常正常；PT和TT不受影響。","we":["（正確）vWD的典型凝血試驗結果：血小板數量正常、BMBT延長（初級凝血缺陷）、APTT正常（輕中度）、PT正常、TT正常。","vWD不影響血小板數量，血小板計數應正常而非異常。","vWD的主要缺陷在初級凝血（血小板黏附），BMBT延長而非正常；APTT在輕度vWD通常正常。","vWD不影響外因性凝血途徑，PT應正常；PT延長見於維生素K缺乏或warfarin中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_037","year":2024,"roc_year":113,"session":"","examNo":37,"q":"下列有關D-dimer的敘述何者最為適當？","opts":["A. 在人醫，較高的D-dimer數值常用於排除此病人存在肺栓塞或是靜脈血栓的情況","B. 在犬隻，較高的D-dimer數值常用於高度懷疑存在血栓栓塞性疾病（thromboembolic disease）","C. 檢測D-dimer最好使用含有肝素之抗凝血漿","D. 使用超過24小時的溶血檢體，D-dimer數值容易偽性降低"],"ans":1,"exp":"在人醫，低D-dimer用於排除肺栓塞/深靜脈血栓（高陰性預測值）；在犬醫，D-dimer陰性預測值不如人醫可靠，但較高的D-dimer值可輔助支持血栓栓塞性疾病的診斷；D-dimer檢測應使用citrate抗凝血漿，不適合溶血或陳舊檢體。","we":["在人醫，較低（而非較高）的D-dimer常用於排除肺栓塞或靜脈血栓（低D-dimer排除血栓）。","（正確）在犬，較高的D-dimer數值常用於輔助診斷血栓栓塞性疾病，雖特異性有限，但有臨床參考價值。","D-dimer檢測最好使用含citrate（而非heparin）的抗凝血漿，heparin會干擾部分D-dimer分析方法。","陳舊或溶血檢體中D-dimer數值容易偽性升高（而非降低），應使用新鮮檢體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_038","year":2024,"roc_year":113,"session":"","examNo":38,"q":"下列何者不是血中蛋白質的生理功能？","opts":["A. 直接調節體溫","B. 維持血中滲透壓","C. 參與凝血反應","D. 協助運輸血中物質"],"ans":0,"exp":"血中蛋白質的生理功能包括：維持膠體滲透壓（白蛋白）、參與凝血（纖維蛋白原等）、協助運輸（白蛋白攜帶脂肪酸/膽紅素等）、免疫防禦（免疫球蛋白）；「直接調節體溫」並非血中蛋白質的生理功能，體溫調節主要靠神經-體液機制。","we":["（正確）直接調節體溫不是血中蛋白質的生理功能，體溫調節主要由下視丘和循環系統（皮膚散熱）負責。","維持血中膠體滲透壓是白蛋白最重要的功能，蛋白質確實具有此功能。","凝血反應需要纖維蛋白原、各種凝血因子等蛋白質參與，蛋白質確實具有此功能。","白蛋白及特定載體蛋白（transferrin、ceruloplasmin等）負責運輸多種物質，蛋白質確實具有此功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_039","year":2024,"roc_year":113,"session":"","examNo":39,"q":"犬患有圓蟲病（strongylosis）或急性肝病時，何種血清蛋白質會明顯增加？","opts":["A. 白蛋白","B. α-球蛋白","C. β-球蛋白","D. γ-球蛋白"],"ans":1,"exp":"圓蟲病（strongylosis）和急性肝病等急性炎症/組織損傷時，急性期蛋白（acute phase proteins）顯著增加，主要為α-球蛋白（包含α₁-antitrypsin、α₂-macroglobulin、haptoglobin等）；此為急性期反應的典型血清電泳表現。","we":["白蛋白在炎症和肝病時通常下降（負急性期蛋白），而非增加。","（正確）α-球蛋白中含有大量急性期蛋白，在急性炎症（圓蟲病）和急性肝病時顯著升高。","β-球蛋白增加主要見於慢性炎症、鐵缺乏（transferrin升高）等慢性狀況，而非急性期。","γ-球蛋白（免疫球蛋白）增加主要見於慢性炎症、感染或免疫性疾病（多株性或單株性），而非急性期反應的主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_040","year":2024,"roc_year":113,"session":"","examNo":40,"q":"下列何者最不可能觀察到高脂血症（hyperlipidemia）？","opts":["A. 迷你雪納瑞品種犬（Miniature Schnauzers）","B. 急性胰臟炎（acute pancreatitis）","C. 胰外分泌不足（exocrine pancreatic insufficiency）","D. 甲狀腺功能低下（hypothyroidism）"],"ans":2,"exp":"胰外分泌不足（EPI）造成脂肪消化吸收障礙，血中脂肪反而不易升高（甚至可能偏低），最不可能觀察到高脂血症；迷你雪納瑞、急性胰臟炎和甲狀腺功能低下均為高脂血症的常見原因。","we":["迷你雪納瑞犬有遺傳性高三酸甘油脂血症的傾向，為原發性高脂血症的好發品種。","急性胰臟炎常與高脂血症互為因果關係（高脂血症誘發胰臟炎，或胰臟炎導致脂質代謝異常）。","（正確）胰外分泌不足（EPI）因脂肪無法消化吸收，血中脂質不易升高，是高脂血症最不可能的情境。","甲狀腺功能低下（hypothyroidism）會降低脂肪代謝速率，常見繼發性高膽固醇血症和高三酸甘油脂血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_041","year":2024,"roc_year":113,"session":"","examNo":41,"q":"有關血清中脂蛋白（lipoproteins）之敘述，下列何者正確？","opts":["A. 由肝臟合成","B. LDL主要由大量蛋白質與少量膽固醇組成","C. HDL主要由膽固醇與少量三酸甘油脂組成","D. 經電泳，若往陽極移動，與其他血清中脂蛋白相比，乳糜微粒速率最快"],"ans":0,"exp":"脂蛋白主要由肝臟合成（包含VLDL、HDL及LDL前體），腸道僅合成乳糜微粒。LDL實際上是大量膽固醇加少量蛋白質，而非相反；HDL主要由蛋白質與磷脂組成；乳糜微粒為最大脂蛋白，電泳幾乎不移動，速率最慢而非最快。","we":["（正確）脂蛋白（VLDL/HDL/LDL）主要由肝臟合成，是正確描述。","LDL由大量膽固醇與少量蛋白質組成，而非「大量蛋白質與少量膽固醇」，敘述相反。","HDL主要由大量蛋白質與磷脂組成，膽固醇含量並不高，三酸甘油脂更少。","乳糜微粒是最大最輕的脂蛋白，電泳時幾乎不移動（速率最慢），而非最快。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_042","year":2024,"roc_year":113,"session":"","examNo":42,"q":"有關血糖調節，下列敘述何者錯誤？","opts":["A. 腎上腺素促進糖原分解以提升血糖","B. 升糖素（glucagon）藉由拮抗胰島素作用以提升血糖","C. 胰腺beta-細胞腫瘤導致低血糖","D. 敗血症經常導致高血糖"],"ans":1,"exp":"升糖素（glucagon）是直接作用於肝臟促進糖原分解和糖異生來升高血糖，並非透過「拮抗胰島素」的機制。選項B的描述機制錯誤，故為正確答案（即錯誤選項）。","we":["A. 腎上腺素確實促進糖原分解以提升血糖，此描述正確。","（正確）B. 升糖素是直接作用升高血糖，非透過拮抗胰島素，此描述錯誤。","C. 胰腺beta細胞腫瘤（insulinoma）持續分泌胰島素導致低血糖，此描述正確。","D. 敗血症因糖皮質素上升及胰島素阻抗，確實常導致高血糖，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_043","year":2024,"roc_year":113,"session":"","examNo":43,"q":"下列何者不是暫時性高血糖的原因？","opts":["A. 急性胰臟炎","B. 腎上腺功能亢進","C. 注射類固醇","D. 緊迫"],"ans":0,"exp":"急性胰臟炎可導致beta細胞損傷，造成相對持久的高血糖，而非單純暫時性高血糖；腎上腺功能亢進、注射類固醇及緊迫均可引起暫時性高血糖。","we":["（正確）A. 急性胰臟炎引起的高血糖通常非暫時性，可持續或演變為糖尿病。","B. 腎上腺功能亢進（皮質醇過多）確實可引起暫時性高血糖，此為干擾素。","C. 注射類固醇可引起暫時性高血糖（類固醇性高血糖），此為干擾素。","D. 緊迫時腎上腺素及糖皮質素升高可引起暫時性高血糖，此為干擾素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_044","year":2024,"roc_year":113,"session":"","examNo":44,"q":"異構酶（isoenzymes）因在不同酸鹼值中具有下列何種特性，而可藉由電泳分離，來分辨其組織來源？","opts":["A. 電荷","B. pH值","C. 活性","D. 作用速率"],"ans":0,"exp":"同工酶因分子結構不同而帶有不同電荷，在電場中移動速率不同，因此可用電泳分離並依移動距離判斷其組織來源。","we":["（正確）A. 同工酶在不同pH下帶有不同電荷，電泳時依電荷差異分離，可區分組織來源。","B. pH值是電泳緩衝液的條件設定，不是酶本身用來分離的特性。","C. 活性高低不影響電泳分離位置，不能作為分辨組織來源的依據。","D. 作用速率是酶動力學參數，與電泳分離位置無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_045","year":2024,"roc_year":113,"session":"","examNo":45,"q":"下列關於肝病發生時的血球變化敘述，何者最為適當？","opts":["A. 嚴重肝病時常見血小板數量顯著上升","B. 病毒性肝炎初期常見嗜中性球數量明顯上升","C. 犬隻罹患congenital portosystemic shunt（PSS）時，常見紅血球出現microcytosis","D. 犬隻罹患leptospirosis時，常見白血球總數顯著下降"],"ans":2,"exp":"犬先天性門脈系統分流（congenital PSS）因門靜脈血繞過肝臟，肝臟缺乏正常血流刺激發育，導致紅血球生成時缺鐵或其他因素，常見microcytosis（小紅血球症）。","we":["A. 嚴重肝病時血小板通常減少（血小板生成素由肝臟產生），而非上升。","B. 病毒性肝炎初期常見淋巴球增加或白血球總數下降，嗜中性球明顯上升不典型。","（正確）C. 犬先天性PSS確實常見microcytosis，與肝臟功能不足影響紅血球代謝有關。","D. 犬鉤端螺旋體感染通常引起白血球增加（中性球增加），而非明顯下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_046","year":2024,"roc_year":113,"session":"","examNo":46,"q":"一年輕公犬出現食慾減退、活動力下降、體重下降，且糞便帶血等臨床症狀。血液檢查顯示貧血、白血球中\r   度增加和血小板低下。超音波檢查發現肝臟腫大，有不規則低迴音性區域。這些現象最有可能與下列那種病  原體感染有關？","opts":["A. 大腸桿菌","B. 犬鈎端螺旋體","C. 隱孢子蟲","D. 犬心絲蟲感染初期"],"ans":1,"exp":"犬鉤端螺旋體（Leptospira）感染典型表現包括肝臟受損（肝腫大、低迴音區域）、血小板低下、貧血及中度白血球增加，與本題臨床症狀高度吻合。","we":["A. 大腸桿菌感染通常引起腸胃道症狀為主，不典型表現為肝腫大伴低迴音區域。","（正確）B. 鉤端螺旋體感染可引起肝腎損傷、血小板減少症、貧血及肝臟不規則低迴音區。","C. 隱孢子蟲為腸道原蟲，主要引起腹瀉，不典型表現為肝臟低迴音區域。","D. 犬心絲蟲感染初期通常無明顯血小板低下及肝臟超音波異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_047","year":2024,"roc_year":113,"session":"","examNo":47,"q":"有關肝臟血流系統之敘述，下列何者最適當？","opts":["A. 由腸道所吸收的養分，透過肝動脈送入肝小葉中","B. 由腸道所吸收之養分，透過門脈系統先匯入肝臟進行解毒作用，隨即進入體循環供全身細胞使用","C. 肝靜脈位於肝門脈區（portal area），負責回收匯入肝臟之血液","D. 肝臟中的庫弗氏細胞負責吞噬進入肝臟血液中的病原與內源抗體"],"ans":1,"exp":"腸道吸收的養分透過門靜脈（門脈系統）匯入肝臟，在肝臟進行解毒及代謝後，再進入體循環供全身使用，此為門脈循環的正確描述。","we":["A. 腸道吸收養分是透過門靜脈（而非肝動脈）送入肝臟，此描述錯誤。","（正確）B. 腸道吸收養分經門脈系統先入肝臟解毒，再進入體循環，描述正確。","C. 肝靜脈位於中央靜脈（小葉中央），而非門脈區（portal area）。","D. 庫弗氏細胞（Kupffer cells）吞噬病原及異物，但非「內源抗體」（描述有誤）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_048","year":2024,"roc_year":113,"session":"","examNo":48,"q":"有關膽紅素的敘述，下列何者錯誤？","opts":["A. 鳥類因含有膽綠素還原酶（biliverdin reductase），所以臨床病理上主要檢測的膽色素是膽綠素  （biliverdin）","B. 兔子的膽紅素濃度低，多在嚴重肝病時才會上升","C. 一般動物尿中膽紅素以結合型膽紅素（conjugated bilirubin）為主","D. 禁食或厭食的馬會因為肝細胞減少對膽紅素的攝入，而有顯著的血中總膽紅素上升"],"ans":0,"exp":"鳥類實際上缺乏biliverdin reductase，無法將膽綠素轉換為膽紅素，因此鳥類臨床上主要檢測的膽色素是膽綠素（biliverdin），選項A將「缺乏」誤述為「含有」，故為錯誤敘述。","we":["（正確）A. 鳥類缺乏biliverdin reductase（非含有），所以主要檢測膽綠素，A的「含有」描述錯誤。","B. 兔子膽紅素濃度低，通常在嚴重肝病才明顯上升，此描述正確。","C. 一般動物尿中膽紅素以結合型（水溶性）為主，可透過腎臟排出，此描述正確。","D. 禁食的馬因肝細胞對膽紅素攝取減少，確實可見血中總膽紅素顯著上升，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_049","year":2024,"roc_year":113,"session":"","examNo":49,"q":"下列何種肝病最容易發生高氨血症？","opts":["A. 肝門脈分流","B. 類固醇性肝病","C. 膽管炎","D. 肥牛症候群"],"ans":0,"exp":"肝門脈分流（portosystemic shunt）使腸道產生的氨無法被肝臟代謝去除，直接進入體循環，是引發高氨血症最典型的肝病。","we":["（正確）A. 門脈分流使腸道氨繞過肝臟直接入體循環，是高氨血症最常見肝病原因。","B. 類固醇性肝病主要影響糖代謝及肝酵素升高，較少引起顯著高氨血症。","C. 膽管炎主要影響膽汁排泄，不如門脈分流容易引起高氨血症。","D. 肥牛症候群（脂肪肝）雖可影響肝功能，但引起高氨血症的程度不及門脈分流顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_050","year":2024,"roc_year":113,"session":"","examNo":50,"q":"貓誤食主人藥物，出現黃疸、茶棕色尿、血液抹片中發現Heinz body，下列何種血檢異常最可能同時出現？","opts":["A. ALT與AST下降","B. 血液抹片中發現大紅血球（macrocyte）","C. methemoglobinemia","D. neutropenia"],"ans":2,"exp":"貓誤食乙醯胺酚（acetaminophen）會造成高鐵血紅素血症（methemoglobinemia），導致血液氧化損傷，同時形成Heinz body及黃疸和茶棕色尿，此組合是典型乙醯胺酚中毒表現。","we":["A. 乙醯胺酚中毒引起肝細胞損傷，ALT/AST會上升而非下降。","B. 大紅血球（macrocyte）不是乙醯胺酚中毒的典型表現，Heinz body形成才是。","（正確）C. Methemoglobinemia是乙醯胺酚中毒的典型表現，與Heinz body同時出現。","D. Neutropenia不是乙醯胺酚中毒的特徵性血液異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_051","year":2024,"roc_year":113,"session":"","examNo":51,"q":"承上題，推測該貓最有可能誤食何種藥物？","opts":["A. chlorpheniramine","B. dextromethorphan","C. acetaminophen","D. prednisolone"],"ans":2,"exp":"乙醯胺酚（acetaminophen）對貓具有高度毒性，因貓缺乏葡萄糖醛酸化酵素，無法有效代謝乙醯胺酚，導致活性代謝物氧化血紅素，引起methemoglobinemia、Heinz body及肝毒性。","we":["A. Chlorpheniramine（抗組織胺）對貓毒性較低，不引起Heinz body及methemoglobinemia。","B. Dextromethorphan（止咳藥）不引起Heinz body或methemoglobinemia。","（正確）C. Acetaminophen對貓毒性極高，可引起methemoglobinemia、Heinz body及黃疸。","D. Prednisolone（類固醇）引起高血糖及肝酵素上升，不引起Heinz body或methemoglobinemia。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_052","year":2024,"roc_year":113,"session":"","examNo":52,"q":"有關胰臟炎實驗室診斷之敘述，下列何者正確？","opts":["A. C反應蛋白（C-reactive protein）增加通常發生在急性胰臟炎導致之白血球增加及核左轉之後","B. 通常利用糞便蛋白水解活性（fecal proteolytic activity）檢測腸道內胰蛋白酶活性是否明顯增加可協   助診斷","C. 急性胰臟炎若出現腹水最常見漏出液（transudate）","D. 常見代謝性酸中毒"],"ans":3,"exp":"急性胰臟炎時因組織缺氧、嘔吐及電解質失衡，常見代謝性酸中毒；此為胰臟炎最常見的酸鹼異常。","we":["A. CRP是急性期蛋白，通常在白血球增加及核左轉之前升高，選項A描述順序相反。","B. 糞便蛋白水解活性是用來診斷EPI（胰外分泌不足），不用於胰臟炎診斷。","C. 急性胰臟炎腹水因含高量蛋白質和酵素，屬於滲出液（exudate），非漏出液。","（正確）D. 急性胰臟炎常見代謝性酸中毒，與組織低灌流、嘔吐及電解質紊亂有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_053","year":2024,"roc_year":113,"session":"","examNo":53,"q":"慢性胰臟炎較不可能觀察到的血清生化學數值變化為何？","opts":["A. 血糖升高","B. 胰蛋白酶樣免疫反應性（trypsin-like immunoreactivity）下降","C. 鹼性磷酸酶（ALP）上升","D. 鈷胺素（cobalamin）上升"],"ans":3,"exp":"慢性胰臟炎導致胰外分泌功能不足（EPI），腸道對cobalamin（維生素B12）的吸收需要胰臟分泌的內在因子相關物質，EPI時cobalamin吸收減少，血中濃度會下降而非上升。","we":["A. 慢性胰臟炎破壞beta細胞，導致胰島素分泌不足，血糖升高可見。","B. 慢性胰臟炎時TLI下降，反映胰臟腺泡細胞功能減退，此為常見表現。","C. 慢性胰臟炎時可因膽管受壓等因素導致ALP升高，此現象可見。","（正確）D. 慢性胰臟炎（EPI）使cobalamin吸收減少，血中cobalamin應下降，而非上升。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_054","year":2024,"roc_year":113,"session":"","examNo":54,"q":"有關胰臟功能性試驗之敘述，下列何者最適當？","opts":["A. trypsin-like immunoreactivity（TLI）在診斷胰臟炎上具有好的敏感性與特異性","B. pancreatic lipase immunoreactivity（PLI）在診斷胰外分泌不足（exocrine pancreatic   insufficiency, EPI）上具有好的敏感性與特異性","C. 腎衰竭時不會影響 trypsin-like immunoreactivity（TLI）之檢測結果","D. 腎絲球體濾過率之變化較不會影響 pancreatic lipase immunoreactivity（PLI）之檢測結果"],"ans":3,"exp":"PLI（胰臟脂肪酶免疫反應性）分子量較大，較不受腎小球濾過率（GFR）變化影響，因此腎功能改變對PLI檢測結果影響較小，選項D描述正確。","we":["A. TLI在診斷胰臟炎的特異性並不好（可受多因素影響），PLI才具較好特異性。","B. TLI（而非PLI）是診斷EPI的最佳指標，具有好的敏感性與特異性。","C. 腎衰竭時TLI會因腎臟清除率下降而升高，確實會影響TLI檢測結果。","（正確）D. PLI分子量大，受GFR變化影響較小，選項D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_055","year":2024,"roc_year":113,"session":"","examNo":55,"q":"有關cobalamin在腸道之吸收，下列敘述何者正確？","opts":["A. 在狗易有該維生素之缺乏，需要額外補充","B. cobalamin不足會抑制gut-associated lymphoid tissue（GALT）中淋巴球的增生","C. cobalamin主要在十二指腸（duodenum）被消化釋出，在空腸（jejunum）被吸收","D. cobalamin是透過與腸道細胞（enterocyte）表面的cubilin結合而被吸收"],"ans":3,"exp":"Cobalamin在迴腸（ileum）末端透過與腸細胞表面的cubilin受體結合，並由amnionless輔助，以receptor-mediated endocytosis方式被吸收，選項D描述正確。","we":["A. 貓（而非狗）更容易缺乏cobalamin，因貓腸道cubilin受體表達量較少。","B. Cobalamin不足影響的是細胞增殖和DNA合成，不特指GALT中淋巴球增生。","C. Cobalamin在迴腸（而非空腸）透過特異性受體被吸收，選項C的位置描述錯誤。","（正確）D. Cobalamin透過與腸細胞表面cubilin結合進行receptor-mediated endocytosis吸收，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_056","year":2024,"roc_year":113,"session":"","examNo":56,"q":"下列何者較不是蛋白質流失性腸病（protein-losing enteropathy）可能觀察到的現象？","opts":["A. 低維生素B12血症（hypocobalaminemia）","B. 梨型鞭毛蟲症（giardiasis）感染","C. 高血鈣","D. 糞便α1蛋白酶抑制物（α1-PI）增加"],"ans":2,"exp":"蛋白質流失性腸病（PLE）通常引起低白蛋白血症，鈣與白蛋白結合降低導致低血鈣（hypocalcemia），因此高血鈣並非PLE的預期表現。","we":["A. PLE可影響cobalamin吸收，引起低維生素B12血症，此為常見表現。","B. 梨型鞭毛蟲症（Giardia）感染可導致腸道蛋白流失，是PLE的可能病因。","（正確）C. PLE通常引起低血鈣（低白蛋白→結合鈣減少），高血鈣不是PLE的典型表現。","D. 糞便α1-PI增加反映腸道蛋白流失，是PLE的重要診斷標記，此為常見表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_057","year":2024,"roc_year":113,"session":"","examNo":57,"q":"下列與肌肉相關之實驗診斷敘述何者錯誤？","opts":["A. 嚴重肌肉壞死可能造成ALT上升","B. 肌肉失養症（muscular dystrophy）以抗乙醯膽鹼接受器抗體診斷","C. 肌肉注射可能造成CK上升","D. 肌肉壞死可能造成大量鉀離子釋放"],"ans":1,"exp":"抗乙醯膽鹼接受器抗體（anti-AChR antibody）是診斷重症肌無力（myasthenia gravis）的方法，而非肌肉失養症；肌肉失養症需靠肌肉切片、免疫組化或基因檢測診斷，選項B描述錯誤。","we":["A. 嚴重肌肉壞死可釋出肝臟也含有的AST，因此AST上升，此描述正確（注意非ALT）。","（正確）B. 抗乙醯膽鹼接受器抗體是診斷重症肌無力，非肌肉失養症，此描述錯誤。","C. 肌肉注射造成局部組織損傷，可使CK上升，此描述正確。","D. 肌肉壞死（rhabdomyolysis）時細胞內大量鉀離子釋放，可引起高血鉀，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_058","year":2024,"roc_year":113,"session":"","examNo":58,"q":"肌肉嚴重壞死的情況下，有關肌紅素（myoglobin）的敘述，下列何者錯誤？","opts":["A. 比CK和AST較快升高","B. 傷害緩解即下降","C. 肌紅素尿中通常無紅血球","D. 易與血漿蛋白結合使血漿呈現紅色"],"ans":3,"exp":"肌紅素（myoglobin）分子量小（約17 kDa），不與血漿蛋白結合，因此血漿不呈紅色（若呈紅色通常是血紅素溶血所致）；選項D描述錯誤。","we":["A. 肌紅素分子量小，比CK和AST升高更快，此描述正確。","B. 肌紅素在組織傷害緩解後即快速下降（半衰期短），此描述正確。","C. 肌紅素尿（myoglobinuria）尿液呈棕色，離心後上清液呈色但無紅血球，此描述正確。","（正確）D. 肌紅素分子量小，不與血漿蛋白結合，血漿不呈紅色（溶血才造成血漿紅色）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_059","year":2024,"roc_year":113,"session":"","examNo":59,"q":"有關天門冬胺酸轉胺酶（aspartate aminotransferase, AST）之敘述，下列何者正確？","opts":["A. 山羊血中AST活性上升時，還須配合觀察ALT的活性，才能區別主要受損部位為肝臟或是骨骼肌","B. 在犬及貓肝細胞受損嚴重時，血中ALT及AST活性皆會上升，但ALT活性衰退的速率會比AST快","C. 許多組織的細胞質或粒線體內皆含有AST活性，其中以橫紋肌細胞及肝細胞中的含量最高","D. 酵素分類上AST屬於EC5群的異構轉化酶（isomerase）"],"ans":2,"exp":"AST廣泛存在於多種組織（細胞質與粒線體），以橫紋肌（骨骼肌、心肌）和肝細胞中含量最高，這是正確的描述。","we":["A. 山羊缺乏ALT（肝特異性較低），AST上升時需配合GDH（非ALT）來區分肝臟或肌肉來源。","B. 犬貓肝損傷時ALT通常比AST衰退「慢」（半衰期較長），選項B描述相反。","（正確）C. AST廣泛存在於多組織，橫紋肌和肝細胞含量最高，此描述正確。","D. AST屬於EC2群的轉移酶（transferase），非EC5群的異構轉化酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_060","year":2024,"roc_year":113,"session":"","examNo":60,"q":"下列有關貓尿中膽紅素的敘述何者最適當？","opts":["A. 貓的腎小管可以將吸收的血紅素（hemoglobin）轉換為結合態膽紅素（conjugated bilirubin）","B. 正常貓的尿中出現的膽紅素只有非結合態（unconjugated）","C. 正常貓的尿液中會有一些非結合態膽紅素（unconjugated bilirubin）和少許結合態膽紅素（conjugated   bilirubin）","D. 正常貓的尿液中不應該出現結合態膽紅素（conjugated bilirubin）"],"ans":0,"exp":"貓的腎小管具有將血紅素（hemoglobin）轉換為結合型膽紅素（conjugated bilirubin）的能力，因此正常貓尿中可有少量結合型膽紅素，此為貓的特殊腎臟代謝特性。","we":["（正確）A. 貓腎小管可轉換血紅素為結合型膽紅素，故正常貓尿中可見少量結合型膽紅素。","B. 正常貓尿中出現的膽紅素是結合型（非非結合型），因為非結合型不溶於水無法通過腎臟。","C. 正常貓尿液中應只有結合型膽紅素（少量），非結合型膽紅素不出現在尿中。","D. 正常貓（不像正常犬）尿液中可出現少量結合型膽紅素，此選項說法有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_061","year":2024,"roc_year":113,"session":"","examNo":61,"q":"有關尿糖檢測之判讀，下列何者正確？","opts":["A. 牛的腎小管對葡萄糖之重吸收閾值為180 mg/dL","B. 犬的腎小管對葡萄糖之重吸收閾值為100 mg/dL","C. 原發性腎小管之葡萄糖再吸收障礙會出現腎前性糖尿症","D. 犬范可尼症候群（Fanconi syndrome）會出現腎性糖尿症"],"ans":3,"exp":"犬范可尼症候群（Fanconi syndrome）是近端腎小管廣泛性功能障礙，導致葡萄糖、胺基酸、磷酸等無法被再吸收，即使血糖正常也出現腎性糖尿症（renal glucosuria）。","we":["A. 牛的腎小管對葡萄糖重吸收閾值約為100 mg/dL（非180 mg/dL），180 mg/dL是犬的閾值。","B. 犬的腎小管對葡萄糖重吸收閾值約為180 mg/dL（非100 mg/dL），選項B數值錯誤。","C. 原發性腎小管葡萄糖再吸收障礙出現的是「腎性」糖尿症，而非「腎前性」糖尿症。","（正確）D. 犬范可尼症候群因近端腎小管功能障礙，造成腎性糖尿症，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_062","year":2024,"roc_year":113,"session":"","examNo":62,"q":"採用市售之試藥紙條法（dipstick）檢測尿中蛋白質時，對下列何種蛋白質具敏感性，可做半定量測定？","opts":["A. 白蛋白","B. 班瓊斯蛋白","C. 球蛋白","D. 所有蛋白質"],"ans":0,"exp":"試藥紙條（dipstick）利用陰離子染料（如四溴酚藍）與帶正電的白蛋白結合而呈色，對白蛋白具高敏感性，但對班瓊斯蛋白及球蛋白敏感性差。","we":["（正確）A. Dipstick以陰離子染料偵測白蛋白，對白蛋白敏感，可半定量白蛋白尿。","B. 班瓊斯蛋白（免疫球蛋白輕鏈）帶負電，dipstick染料無法有效偵測。","C. 球蛋白不帶正電，dipstick對球蛋白敏感性差，無法半定量。","D. Dipstick並非對所有蛋白質敏感，主要針對白蛋白，此描述不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_063","year":2024,"roc_year":113,"session":"","examNo":63,"q":"除了下列那一種動物的新生兒以外，多數動物新生兒並無有效的尿液濃縮機制？","opts":["A. 牛","B. 貓","C. 狗","D. 馬"],"ans":3,"exp":"馬屬早成型（precocial）動物，新生馬駒腎臟發育較成熟，出生時即具有較完善的尿液濃縮機制；其他多數動物新生兒腎臟功能尚未成熟。","we":["A. 牛新生兒的腎臟尿液濃縮能力尚不完全，與多數動物類似。","B. 貓新生兒腎臟濃縮能力也尚未成熟，需數週後才發育完全。","C. 狗新生兒腎臟同樣缺乏有效的尿液濃縮機制。","（正確）D. 馬為早成型動物，新生馬駒出生即具備較完善的腎臟尿液濃縮功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_064","year":2024,"roc_year":113,"session":"","examNo":64,"q":"下列那一項最不可能是造成血中尿素氮（BUN）上升的原因？","opts":["A. 運動","B. 饑餓","C. 使用類固醇","D. 肝病"],"ans":3,"exp":"肝臟是尿素合成（尿素循環）的器官，嚴重肝病時尿素合成能力下降，BUN會降低而非升高，因此肝病最不可能造成BUN上升。","we":["A. 激烈運動增加肌肉蛋白分解及腎前性氮血症，可使BUN升高。","B. 饑餓時蛋白質分解增加，氨基酸代謝產生更多尿素，BUN可上升。","C. 類固醇促進蛋白質分解代謝，增加尿素生成，可使BUN升高。","（正確）D. 肝病使尿素合成減少，BUN通常下降，是最不可能導致BUN上升的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_065","year":2024,"roc_year":113,"session":"","examNo":65,"q":"同時檢測犬貓的腹水和血清或血漿的血中尿素氮（BUN）和肌酸酐（creatinine），利用腹水測量值除以血\r   清或血漿測量值的比值用來診斷是否發生尿腹（uroabdomen），下列有關結果的敘述何者最適當？","opts":["A. 兩者的比值升高皆代表發生尿腹的機率低","B. 肌酸酐的比值升高方能代表尿腹機率高","C. 尿素氮的比值不高代表尿腹機率低","D. 兩者的比值都升高才能代表有尿腹"],"ans":1,"exp":"肌酸酐（creatinine）分子量較大（113 Da），不易透過腹膜擴散，因此腹水中肌酸酐升高（比值>2）對診斷尿腹具有較高的特異性；BUN分子量小易擴散，比值診斷價值較低。","we":["A. 兩者比值升高不代表尿腹機率低，反而代表機率高，此描述相反。","（正確）B. 肌酸酐分子量大不易擴散，其腹水/血清比值升高是診斷尿腹的可靠指標。","C. 尿素氮分子量小容易透過腹膜擴散，比值可能偏低，不能以此排除尿腹。","D. 不需兩者比值都升高才診斷尿腹，肌酸酐比值升高已有診斷意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_066","year":2024,"roc_year":113,"session":"","examNo":66,"q":"若混濁尿液加入乙醚後會溶解變透明，則造成混濁的成分最有可能為","opts":["A. 蛋白質","B. 脂肪","C. 半乳糖","D. 尿酸鹽"],"ans":1,"exp":"乙醚是有機溶劑，可溶解脂質，若混濁尿加乙醚後變透明，表示混濁原因為脂肪（脂尿症，lipuria），常見於貓糖尿病或腎病症候群。","we":["A. 蛋白質不溶於乙醚，加乙醚後仍呈混濁，不會變透明。","（正確）B. 乙醚可溶解脂肪，脂尿（lipuria）加乙醚後混濁消失，此描述正確。","C. 半乳糖溶於水，不溶於乙醚，加乙醚不會使混濁消失。","D. 尿酸鹽不溶於乙醚，加熱後（非乙醚）才會溶解，不是此情況的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_067","year":2024,"roc_year":113,"session":"","examNo":67,"q":"目前估算腎小球濾過率（glomerular filtration rate, GFR）最常以下列那一個參數作為計算依據？","opts":["A. blood urea nitrogen","B. creatine","C. creatinine","D. inulin"],"ans":2,"exp":"肌酸酐（creatinine）由肌肉持續恆定產生，幾乎全部由腎絲球濾過後不被腎小管重吸收，是估算GFR最常用的臨床指標，可計算肌酸酐清除率。","we":["A. BUN受飲食、蛋白質代謝等多因素影響，不是計算GFR的最佳指標。","B. Creatine（肌酸）是肌酸酐的前驅物，本身不用於GFR估算。","（正確）C. Creatinine由腎絲球自由濾過且不被腎小管重吸收，是估算GFR最常用的參數。","D. Inulin是測量GFR的黃金標準，但因需靜脈注射且技術複雜，臨床上少用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_068","year":2024,"roc_year":113,"session":"","examNo":68,"q":"血清中鈣離子減少時，何種動物會出現弛緩性麻痺之神經症狀？","opts":["A. 牛","B. 豬","C. 犬","D. 貓"],"ans":0,"exp":"牛低血鈣（產後低血鈣／產乳熱）表現為弛緩性麻痺（肌肉無力、無法站立）；而犬貓低血鈣通常表現為強直性痙攣（手足搐搦），此與物種差異有關。","we":["（正確）A. 牛低血鈣（產乳熱）出現弛緩性麻痺，無法站立，此描述正確。","B. 豬低血鈣表現與牛不同，不以弛緩性麻痺為主。","C. 犬低血鈣通常表現為強直性痙攣，而非弛緩性麻痺。","D. 貓低血鈣同樣表現為強直性痙攣，而非弛緩性麻痺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_069","year":2024,"roc_year":113,"session":"","examNo":69,"q":"犬隻血液中的甲狀腺素，約有多少比例為游離甲狀腺素（free T4）？","opts":["A. 0.1％","B. 0.5％","C. 1％","D. 5％"],"ans":0,"exp":"犬血中甲狀腺素（T4）約99.9%與蛋白質結合，游離T4（free T4）僅佔約0.1%，游離形式才具有生物活性並影響組織代謝。","we":["（正確）A. 犬游離T4約佔總T4的0.1%，此為正確數值。","B. 0.5%高估了游離T4的比例，實際約為0.1%。","C. 1%高估了游離T4的比例，實際約為0.1%。","D. 5%嚴重高估，實際游離T4比例遠低於此。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_070","year":2024,"roc_year":113,"session":"","examNo":70,"q":"下列何者不是貓隻甲狀腺功能亢進常見的血液檢查異常？","opts":["A. 紅血球增多症（polycythemia）","B. 高鹼性磷酸酶（alkaline phosphatase, ALP）","C. 高血糖","D. 白血球增多症"],"ans":1,"exp":"貓甲狀腺功能亢進時ALP（鹼性磷酸酶）通常不顯著升高，因為貓的肝臟ALP不像犬那樣容易被類固醇誘導；貓甲亢的典型血液異常包括多血症、ALT升高、輕度高血糖、白血球增多。","we":["A. 貓甲亢時紅血球生成增加可引起輕度多血症（polycythemia），此為常見異常。","（正確）B. 貓甲亢時ALP不像犬那樣顯著升高，高ALP不是貓甲亢的典型血液異常。","C. 貓甲亢時代謝亢進可引起輕度高血糖，此為可能出現的異常。","D. 貓甲亢時應激反應可引起白血球增多症，此為常見異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_071","year":2024,"roc_year":113,"session":"","examNo":71,"q":"下列何者較不適合用來監控犬隻糖尿病？","opts":["A. 尿糖","B. 果糖胺","C. 體泌素","D. 糖化血色素"],"ans":2,"exp":"體泌素（somatostatin）是抑制生長激素和多種荷爾蒙分泌的激素，並非糖尿病監控指標；監控犬糖尿病常用尿糖、果糖胺（短期）、糖化血色素（長期）等指標。","we":["A. 尿糖監測可反映血糖是否超過腎臟閾值，是糖尿病監控的常用指標。","B. 果糖胺反映過去1-2週平均血糖，適合犬糖尿病的短期監控。","（正確）C. 體泌素（somatostatin）是抑制激素，與糖尿病血糖監控無關。","D. 糖化血色素（HbA1c）反映過去2-3個月平均血糖，可用於犬糖尿病長期監控。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_072","year":2024,"roc_year":113,"session":"","examNo":72,"q":"1歲以下之犬貓血清胰島素樣生長因子1（insulin-like growth factor 1, IGF-1）正常值為＞500 ng/mL。\r   若一隻8月齡犬之值為45 ng/mL，則此犬最可能罹患何種疾病？","opts":["A. 腦垂腺矮小症（pituitary dwarfism）","B. 肢端肥大症（acromegaly）","C. 糖尿病（diabetes mellitus）","D. 胰島素瘤（insulinoma）"],"ans":0,"exp":"IGF-1（胰島素樣生長因子1）主要受生長激素（GH）刺激而由肝臟分泌，腦垂腺矮小症（GH缺乏）時IGF-1顯著下降，此8月齡犬IGF-1=45 ng/mL遠低於正常值500 ng/mL，高度符合腦垂腺矮小症。","we":["（正確）A. 腦垂腺矮小症（GH缺乏）→IGF-1顯著下降，此犬45 ng/mL符合此診斷。","B. 肢端肥大症（GH過多）時IGF-1應升高，不會低至45 ng/mL。","C. 糖尿病時IGF-1通常正常或輕度下降，不會低至如此顯著的程度。","D. 胰島素瘤時血糖降低，IGF-1通常不受顯著影響，不符合此結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_073","year":2024,"roc_year":113,"session":"","examNo":73,"q":"下列何者不是腎上腺功能低下症犬隻常出現的血液異常？","opts":["A. 低鈉血症（hyponatremia）","B. 高鉀血症（hyperkalemia）","C. 低血糖（hypoglycemia）","D. 低鈣血症（hypocalcemia）"],"ans":3,"exp":"腎上腺功能低下症（Addison's disease）典型表現為低鈉、高鉀（醛固酮不足）及低血糖（皮質醇不足），低鈣血症不是典型表現，選項D為正確答案（即不常見的異常）。","we":["A. 低鈉血症（醛固酮不足→鈉排出增加）是Addison's disease的典型表現。","B. 高鉀血症（醛固酮不足→鉀滯留）是Addison's disease的典型表現。","C. 低血糖（皮質醇不足→糖異生減少）是Addison's disease的常見表現。","（正確）D. 低鈣血症不是腎上腺功能低下症的典型血液異常，與其病理生理不直接相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_074","year":2024,"roc_year":113,"session":"","examNo":74,"q":"腦垂腺前葉分泌ACTH是受下列何種內泌素之刺激後所釋出？","opts":["A. corticotropin releasing hormone","B. gonadotropin","C. gonadotropin releasing hormone","D. thyrotropin releasing hormone"],"ans":0,"exp":"下視丘分泌促腎上腺皮質激素釋放激素（corticotropin releasing hormone, CRH）作用於腦垂腺前葉，刺激ACTH的釋放，此為下視丘-腦垂腺-腎上腺軸的正常調控機制。","we":["（正確）A. CRH（下視丘）→刺激腦垂腺前葉釋放ACTH，此為正確的調控軸。","B. Gonadotropin（促性腺激素）是腦垂腺前葉分泌的，不是刺激ACTH的上游激素。","C. GnRH（促性腺素釋放激素）刺激FSH/LH分泌，與ACTH無關。","D. TRH（促甲狀腺素釋放激素）刺激TSH分泌，不刺激ACTH。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_075","year":2024,"roc_year":113,"session":"","examNo":75,"q":"有一犬隻其血檢glucose 360 mg/dL、BUN 42 mg/dL、Na+ 146 mEq/L、K+ 4.5 mEq/L，則該犬之血漿滲透壓\r   約為多少mOsm/kg？","opts":["A. 292","B. 315","C. 323","D. 350"],"ans":2,"exp":"血漿滲透壓計算公式：2×Na + glucose/18 + BUN/2.8 = 2×146 + 360/18 + 42/2.8 = 292 + 20 + 15 = 327 mOsm/kg，最接近選項C的323 mOsm/kg。","we":["A. 292 mOsm/kg是正常血漿滲透壓，未將高血糖和BUN納入計算。","B. 315 mOsm/kg未正確計算各成分的貢獻，偏低。","（正確）C. 2×146 + 360/18 + 42/2.8 = 292+20+15 = 327，最接近323 mOsm/kg。","D. 350 mOsm/kg過高，計算數值不符合此公式結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_076","year":2024,"roc_year":113,"session":"","examNo":76,"q":"11歲雌性已絕育混種犬採動脈血液氣體結果如下表，該犬的血液酸鹼結果下列何者正確？","opts":["A. 代謝性鹼中毒有呼吸代償","B. 呼吸性鹼中毒無代謝代償","C. 呼吸性鹼中毒有代謝代償","D. 代謝性鹼中毒無呼吸代償"],"ans":2,"exp":"此題需對照表格中的血液氣體數值（pH、pCO2、HCO3-等）判讀酸鹼狀態，需看表格才能確認答案；一般而言，若pH偏高（鹼血）且HCO3-升高、pCO2代償性升高，則為代謝性鹼中毒有呼吸代償。","we":["A. 代謝性鹼中毒有呼吸代償（pCO2升高）：需確認表格數值，此為可能答案。","B. 呼吸性鹼中毒無代謝代償：需排除代謝性代償（HCO3-是否下降）。","（正確）C. 需依據表格判讀，此題標記需複審。","D. 代謝性鹼中毒無呼吸代償：需確認pCO2是否有代償性升高。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_實診_077","year":2024,"roc_year":113,"session":"","examNo":77,"q":"逆理性酸尿（paradoxical aciduria）過程中主要會喪失的離子不包含下列何者？","opts":["A. 鉀","B. 氯","C. 氫","D. 碳酸氫根（ ）"],"ans":3,"exp":"逆理性酸尿（paradoxical aciduria）常發生於代謝性鹼中毒伴嘔吐（如幽門梗阻），主要喪失H+、K+和Cl-；碳酸氫根（HCO3-）在此過程中血中濃度升高（被腎臟重吸收增加），不經尿液大量喪失。","we":["A. 鉀離子在逆理性酸尿中因腎臟保鈉排鉀而喪失，此為喪失的離子之一。","B. 氯離子因嘔吐流失（胃酸含大量HCl），尿中也繼續排氯，此為喪失的離子之一。","C. 氫離子因腎臟優先保留鈉而排出，尿液呈酸性（悖論），此為喪失的離子之一。","（正確）D. 碳酸氫根在代謝性鹼中毒時血中升高且被腎臟重吸收，不是主要喪失的離子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_078","year":2024,"roc_year":113,"session":"","examNo":78,"q":"下列有關鹼過量（base excess）的敘述，何者最明顯錯誤？","opts":["A. 可以用來評估代謝性酸鹼問題","B. 正常貓隻為負值","C. 一般值愈高，表示代謝性鹼血問題愈嚴重","D. 正常馬匹為負值"],"ans":1,"exp":"正常貓的base excess（BE）接近零或輕微正值（約0～+4 mEq/L），並非負值；正常馬匹的BE確實為負值（約-3～-6 mEq/L），因此選項B「正常貓BE為負值」最明顯錯誤。","we":["A. BE用來評估代謝性酸鹼問題，此描述正確。","（正確）B. 正常貓BE接近零或輕微正值，並非負值，此描述明顯錯誤。","C. BE值愈高代表代謝性鹼血愈嚴重，此描述正確。","D. 正常馬匹BE確實為負值（約-3～-6 mEq/L），此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_079","year":2024,"roc_year":113,"session":"","examNo":79,"q":"關於維持鉀離子平衡的敘述，何者正確？","opts":["A. 酮酸血症（ketoacidosis）會引發低血鉀（hypokalemia）的發生","B. 呼吸性酸中毒（respiratory acidosis）對於血鉀濃度影響極小","C. 持續下痢的患犬會發生高血鉀與高血鈉（hypernatremia）","D. 代謝性鹼中毒（metabolic alkalosis）會造成高血鉀"],"ans":1,"exp":"呼吸性酸中毒（CO2升高）對血鉀濃度的影響比代謝性酸中毒小得多，因為CO2容易進出細胞，不像H+直接交換K+；選項B描述呼吸性酸中毒對血鉀影響極小，此為正確敘述。","we":["A. 酮酸血症屬代謝性酸中毒，H+進入細胞交換K+，引起高血鉀（hyperkalemia），非低血鉀。","（正確）B. 呼吸性酸中毒對血鉀影響極小，因CO2易進出細胞不引起顯著K+轉移，描述正確。","C. 持續下痢通常引起低血鉀（K+流失）和低血鈉（體液流失），而非高血鉀。","D. 代謝性鹼中毒時H+由細胞外移入細胞，K+移出細胞，引起低血鉀（非高血鉀）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_080","year":2024,"roc_year":113,"session":"","examNo":80,"q":"下列何者為小動物臨床上最常見之酸鹼異常？","opts":["A. 代謝性酸中毒","B. 代謝性鹼中毒","C. 呼吸性酸中毒","D. 呼吸性鹼中毒"],"ans":0,"exp":"代謝性酸中毒是小動物臨床上最常見的酸鹼異常，常見原因包括腎衰竭、乳酸酸中毒、糖尿病酮酸中毒、嚴重下痢等，其次才是代謝性鹼中毒（如嚴重嘔吐）。","we":["（正確）代謝性酸中毒是最常見的酸鹼異常，腎衰竭、乳酸中毒、DKA均可造成。","代謝性鹼中毒相對少見，主要見於嚴重嘔吐或利尿劑使用後，非最常見。","呼吸性酸中毒見於呼吸抑制或肺病，較代謝性酸中毒不常見。","呼吸性鹼中毒見於過度換氣（高熱、疼痛、焦慮），臨床上非最常見的酸鹼異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_001","year":2025,"roc_year":114,"session":"","examNo":1,"q":"下列何者屬於炎症性或腫瘤性病變？","opts":["A. 唾液腺囊腫","B. 脂肪瘤","C. 肥大細胞瘤","D. 血腫"],"ans":2,"exp":"肥大細胞瘤（mast cell tumor）屬於腫瘤性病變，為犬最常見的皮膚惡性腫瘤之一。唾液腺囊腫、血腫屬於非炎症非腫瘤性囊性病變，脂肪瘤為良性間質腫瘤，但肥大細胞瘤具有炎症性與腫瘤性雙重特性。","we":["A. 唾液腺囊腫是因唾液腺導管阻塞所形成的囊性非炎症病變，不屬於炎症性或腫瘤性。","B. 脂肪瘤是成熟脂肪細胞的良性腫瘤，通常不具炎症反應。","（正確）C. 肥大細胞瘤兼具腫瘤性與炎症性特性，是本題正確答案。","D. 血腫是血液積聚形成的非腫瘤性損傷，不屬於炎症性或腫瘤性病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_002","year":2025,"roc_year":114,"session":"","examNo":2,"q":"下列何者不屬於上皮細胞性腫瘤（epithelial tumors）之類型？","opts":["A. basal cell tumor","B. squamous cell tumor","C. perianal adenoma","D. lipoma"],"ans":3,"exp":"Lipoma（脂肪瘤）起源於間質組織（脂肪細胞），屬於間質性腫瘤，非上皮細胞性腫瘤。Basal cell tumor、squamous cell tumor及perianal adenoma均來源於上皮細胞。","we":["A. Basal cell tumor起源於基底層上皮細胞，屬上皮性腫瘤。","B. Squamous cell tumor（鱗狀細胞腫瘤）來源於鱗狀上皮，屬上皮性腫瘤。","C. Perianal adenoma為肛門周圍腺體（改良的皮脂腺）腫瘤，屬上皮性腫瘤。","（正確）D. Lipoma來源於脂肪間質細胞，屬間質性腫瘤，不是上皮細胞性腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_003","year":2025,"roc_year":114,"session":"","examNo":3,"q":"下列何種因子在評估體腔滲出液時，最不具有診斷價值？","opts":["A. 顏色","B. 蛋白質","C. 有核細胞數","D. pH值"],"ans":3,"exp":"評估體腔積液時，顏色、蛋白質含量及有核細胞數是分類漏出液、修飾性漏出液與滲出液的核心指標；pH值在體腔積液分類上臨床意義最低，診斷價值最小。","we":["A. 顏色可初步判斷是否含血、膽汁或膿，具重要診斷價值。","B. 蛋白質濃度是區分漏出液（<2.5 g/dL）與滲出液（>3 g/dL）的重要指標。","C. 有核細胞數是區分漏出液（<1500/μL）與滲出液（>5000/μL）的關鍵指標。","（正確）D. pH值在體腔積液分類中診斷價值最低，臨床上最不常用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_004","year":2025,"roc_year":114,"session":"","examNo":4,"q":"一隻4歲雌性小獵犬呈現嗜睡及食慾不振之臨床症狀已5天，曾出現發燒及腹部觸診疼痛等現象。腹 部超音波顯示有腹水存在，抽取腹水分析，結果如下：呈紅色而稍濁、蛋白質含量為4.6 g/dL，有 核細胞數為184,600/µL，細胞相主要以退行性嗜中性球及少數巨噬細胞為主。根據分析結果，此腹 水最有可能屬於下列何者？","opts":["A. 漏出液（transudate）","B. 修飾性漏出液（modified transudate）","C. 非化膿性滲出液（nonseptic exudate）","D. 化膿性滲出液（septic exudate）"],"ans":3,"exp":"本案例蛋白質>3 g/dL且有核細胞數>5000/μL，以退行性嗜中性球為主，符合化膿性滲出液（septic exudate）的特徵，提示細菌性腹膜炎。退行性嗜中性球出現代表細胞在有毒性環境（如細菌感染）中受損。","we":["A. 漏出液蛋白質<2.5 g/dL且有核細胞數<1500/μL，與本案例不符。","B. 修飾性漏出液蛋白質2.5～5 g/dL但有核細胞數通常<5000/μL，且無退行性嗜中性球。","C. 非化膿性滲出液雖蛋白質高，但細胞以淋巴球或巨噬細胞為主，嗜中性球非退行性。","（正確）D. 化膿性滲出液特徵為高蛋白質、高有核細胞數，以退行性嗜中性球為主，符合本案例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_005","year":2025,"roc_year":114,"session":"","examNo":5,"q":"當關節囊液採樣量不足時，應優先進行下列何項檢驗？","opts":["A. 細胞學檢查","B. 細菌培養","C. 蛋白質測定","D. 黏蛋白塊測試（mucin clot test）"],"ans":0,"exp":"當關節囊液量不足時，細胞學檢查所需樣本量最少，且能提供最直接的診斷資訊（如炎症類型、感染性關節炎、腫瘤細胞），應優先進行。細菌培養和黏蛋白塊測試需要較多液體。","we":["（正確）A. 細胞學檢查只需少量液體製作抹片，是樣本不足時的首選檢查。","B. 細菌培養需要足夠量的液體，且結果延遲，樣本不足時不優先。","C. 蛋白質測定雖可行，但診斷特異性不如細胞學直接。","D. 黏蛋白塊測試需要滴入醋酸中觀察凝塊，需要較多樣本量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_006","year":2025,"roc_year":114,"session":"","examNo":6,"q":"正常犬貓關節液黏度，通常可延伸多長？","opts":["A. ＜1公分","B. 1～1.5公分","C. 2.5～5公分","D. 6～10公分"],"ans":2,"exp":"正常犬貓關節液富含玻尿酸，黏度高，用滴管滴出時可形成2.5至5公分的絲狀延伸，此為評估關節液黏度的標準方法。炎症時玻尿酸被降解，黏度降低，絲狀延伸縮短。","we":["A. <1公分表示黏度極低，為嚴重炎症或感染性關節炎的表現。","B. 1～1.5公分黏度偏低，提示輕度至中度炎症。","（正確）C. 正常犬貓關節液可延伸2.5～5公分，反映正常玻尿酸含量。","D. 6～10公分超出正常範圍，不符合正常關節液特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_007","year":2025,"roc_year":114,"session":"","examNo":7,"q":"未結紮母犬進行陰道抹片檢查時，下列何者的核質比最大？","opts":["A. 基底層細胞（basal cell）","B. 副基底層細胞（parabasal cell）","C. 中間層上皮細胞（intermediate cell）","D. 角化上皮細胞（superficial cell）"],"ans":0,"exp":"在陰道抹片細胞中，基底層細胞（basal cell）最小、最不成熟，細胞核相對於細胞質的比例（核質比）最高。隨著細胞成熟（副基底→中間→角化），細胞質增多、核縮小，核質比逐漸降低。","we":["（正確）A. 基底層細胞是最未分化的細胞，核質比最大，細胞質最少。","B. 副基底層細胞比基底層細胞稍大，核質比略低於基底層細胞。","C. 中間層上皮細胞已有較多細胞質，核質比中等。","D. 角化上皮細胞（表層細胞）細胞質豐富且角化，核質比最低甚至無核。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_008","year":2025,"roc_year":114,"session":"","examNo":8,"q":"下列何者不屬於臨床病理學中的檢驗前錯誤（pre-analytical error）？","opts":["A. 驗血前未禁食可能造成脂血症","B. 爬蟲類採樣時未考慮環境溫度的變化可影響檢驗值","C. 是否有用麻醉或鎮靜下採血可能影響檢驗值","D. 判讀或選擇參考值時未考慮採樣的季節"],"ans":3,"exp":"判讀或選擇參考值時未考慮採樣季節屬於解讀階段的錯誤（post-analytical或analytical error），而非檢驗前錯誤。檢驗前錯誤（pre-analytical error）指樣本採集前、採集中和運送過程中發生的問題，包括禁食狀態、動物緊迫、麻醉影響等。","we":["A. 驗血前未禁食造成脂血症是典型的檢驗前錯誤（樣本狀態問題）。","B. 爬蟲類採樣時未考慮環境溫度是影響採樣條件的檢驗前錯誤。","C. 麻醉或鎮靜下採血可能影響檢驗值，屬於採樣條件的檢驗前錯誤。","（正確）D. 判讀參考值時未考慮季節屬於解讀階段的錯誤，不是檢驗前錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_009","year":2025,"roc_year":114,"session":"","examNo":9,"q":"以氟化鈉做為血液抗凝劑時，血中那種離子常呈現偽高值？","opts":["A. 鐵","B. 鈣","C. 鉀","D. 鎂"],"ans":2,"exp":"氟化鈉（sodium fluoride）會抑制糖解酶，但同時其螯合作用可使細胞滲漏，造成細胞內鉀離子外漏至血漿，導致血鉀偽高值。氟化鈉主要用於葡萄糖保存管。","we":["A. 鐵不受氟化鈉影響而產生偽高值。","B. 鈣受EDTA影響較大，氟化鈉不特別造成鈣偽高值。","（正確）C. 氟化鈉可使細胞膜滲漏，導致細胞內鉀釋出，造成血鉀偽高值。","D. 鎂不因氟化鈉而產生顯著偽高值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_010","year":2025,"roc_year":114,"session":"","examNo":10,"q":"有關尿渣檢查的敘述，下列何者錯誤？","opts":["A. 完整的尿液檢查需包含鏡檢","B. 需高速離心以收集沉積物","C. 鏡檢時染色不是必須的步驟","D. 在馬的尿液鏡檢中看到黏液（mucus）是正常的"],"ans":1,"exp":"尿渣鏡檢應使用低速離心（400～450×g，約5分鐘），高速離心會破壞細胞和管型結構，造成假陰性或形態改變，此為錯誤做法。完整尿液檢查包含鏡檢，染色非必須但有助判讀。","we":["A. 完整尿液檢查確實需包含鏡檢，此敘述正確。","（正確）B. 尿渣應低速離心（400～450×g），高速離心會破壞細胞結構，此敘述錯誤。","C. 鏡檢時染色（如Diff-Quik）有助於判讀，但並非必須步驟，此敘述正確。","D. 馬尿液中含有黏液（mucus）是正常生理現象，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_011","year":2025,"roc_year":114,"session":"","examNo":11,"q":"有關豬瘟檢體之運送，下列做法何者最不適當？","opts":["A. 送檢EDTA抗凝血液，做白血球計數及分類","B. 常溫運輸扁桃腺、淋巴結等臟器做螢光抗體檢查","C. 冷藏運輸扁桃腺、淋巴結等臟器做螢光抗體檢查","D. 10％中性福馬林液固定腦幹，做螢光抗體檢查"],"ans":3,"exp":"螢光抗體檢查（FAT）需要新鮮或冷凍未固定的組織，福馬林固定會破壞抗原性，使螢光抗體法失效，因此用福馬林固定組織做FAT是最不適當的做法。","we":["A. 送EDTA抗凝血液做白血球計數及分類是適當的做法。","B. 常溫運輸用於螢光抗體檢查，短時間可行，但不如冷藏理想，仍算可接受。","C. 冷藏運輸扁桃腺、淋巴結做螢光抗體檢查是正確且標準的做法。","（正確）D. 福馬林固定會破壞蛋白質抗原，使螢光抗體法無法進行，此做法最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_012","year":2025,"roc_year":114,"session":"","examNo":12,"q":"下圖最有可能為何種健康動物的血液抹片？","opts":["A. 犬","B. 貓","C. 羊","D. 馬"],"ans":3,"exp":"馬的紅血球在血液抹片上最具特徵性地呈現「錢串狀堆疊（rouleaux formation）」，這是馬正常生理特性；此圖最可能顯示rouleaux formation，為馬的健康血液抹片。","we":["A. 犬的紅血球有中央淡染區（central pallor），無明顯堆疊現象。","B. 貓的紅血球較小且中央淡染區不明顯，偶爾輕微堆疊但不如馬明顯。","C. 羊的紅血球較小，無顯著堆疊現象。","（正確）D. 馬的紅血球在靜止狀態下會形成典型的rouleaux（錢串狀堆疊），為正常表現。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_實診_013","year":2025,"roc_year":114,"session":"","examNo":13,"q":"下列何種抗凝劑，在4℃冰箱內可使血液細胞在24小時內不起明顯變化？","opts":["A. EDTA","B. oxalates","C. heparin","D. sodium fluoride"],"ans":0,"exp":"EDTA（乙二胺四乙酸）是血液學檢查（CBC）的標準抗凝劑，在4℃冰箱中可使血球形態在24小時內保持穩定。其他抗凝劑如草酸鹽會導致細胞腫脹，肝素會造成血球聚集，氟化鈉會影響細胞膜完整性。","we":["（正確）A. EDTA螯合鈣離子抗凝，在4℃可保存血球形態24小時以上，是血液學檢查首選。","B. Oxalates會導致紅血球腫脹變形，不適合保存血球形態。","C. Heparin可能造成白血球聚集，影響分類計數，且保存效果不及EDTA。","D. Sodium fluoride主要用於葡萄糖保存，不適合血球形態保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_014","year":2025,"roc_year":114,"session":"","examNo":14,"q":"箭頭所指最可能為何？","opts":["A. 嗜鹼性斑點（basophilic stippling）","B. 海因滋小體（Heinz bodies）","C. 賀－邱氏小體（Howell-Jolly bodies）","D. 有核紅血球的核"],"ans":1,"exp":"海因滋小體（Heinz bodies）是聚集的變性血紅素，附著於紅血球膜內側，在Wright-Giemsa染色下呈淡染或不顯色，但在相差顯微鏡下具高度折光性；題15確認此物質為聚集變性血紅素且具折光性，最符合Heinz bodies。","we":["A. 嗜鹼性斑點（basophilic stippling）在Wright染色下呈藍色顆粒，散佈全細胞質中，非邊緣突出物。","（正確）B. 海因滋小體為聚集的變性血紅素，位於紅血球邊緣，折光性高，符合題目描述。","C. 賀－邱氏小體（Howell-Jolly bodies）為核殘留物，嗜鹼性，位於細胞內，形態為單一圓點。","D. 有核紅血球的核為嗜鹼性圓形細胞核，位置居中，形態與本題不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_實診_015","year":2025,"roc_year":114,"session":"","examNo":15,"q":"承上題，此物質具有下列那些特性？①為聚集的變性血紅素 ②為嗜鹼性殘留物 ③有高度折光性 ④常見於脾臟切除動物","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":0,"exp":"海因滋小體（Heinz bodies）的特性為：①聚集的變性（氧化）血紅素；③在相差顯微鏡下具有高度折光性。②嗜鹼性殘留物是賀－邱氏小體的特性；④常見於脾臟切除動物是Howell-Jolly bodies的特性，Heinz bodies在貓等脾臟過濾能力差的動物更常見。","we":["（正確）A. ①③正確：Heinz bodies為聚集的變性血紅素，且具高度折光性。","B. ①④錯誤：④是Howell-Jolly bodies的特性，不是Heinz bodies。","C. ②③錯誤：②嗜鹼性殘留物描述的是Howell-Jolly bodies而非Heinz bodies。","D. ②④錯誤：②和④均不是Heinz bodies的特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_016","year":2025,"roc_year":114,"session":"","examNo":16,"q":"下列何種代謝路徑是因缺乏麩氨基硫合成酶（glutathione synthetase）而造成的貧血？","opts":["A. 衛－梅路徑（Embden-Meyerhof pathway）","B. 己糖－單磷酸鹽路徑（hexose-monophosphate pathway）","C. 變性血紅素還原酶路徑（methemoglobin reductase pathway）","D. 盧－拉路徑（Luebering-Rapoport pathway）"],"ans":1,"exp":"麩胱甘肽（glutathione）由己糖-單磷酸鹽路徑（hexose-monophosphate pathway，HMP shunt/磷酸戊糖途徑）維持還原狀態，缺乏glutathione synthetase會影響此路徑的抗氧化保護，導致氧化性溶血性貧血（Heinz body貧血）。","we":["A. 衛－梅路徑（Embden-Meyerhof pathway）負責糖解產ATP，與麩胱甘肽合成無關。","（正確）B. 己糖－單磷酸鹽路徑維持麩胱甘肽的還原狀態，缺乏glutathione synthetase導致此路徑功能受損。","C. 變性血紅素還原酶路徑（methemoglobin reductase pathway）負責還原methemoglobin，為獨立路徑。","D. 盧－拉路徑（Luebering-Rapoport pathway）調節2,3-DPG，與氧氣親和力有關，非麩胱甘肽路徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_017","year":2025,"roc_year":114,"session":"","examNo":17,"q":"經Wright-Giemsa染色之犬隻紅血球，若呈現較大且染成較藍色之狀態，稱為","opts":["A. 正色性","B. 多染性","C. 低色性","D. 異染性"],"ans":1,"exp":"多染性（polychromasia）指紅血球在Wright-Giemsa染色下呈藍紫色（含較多RNA），細胞也較正常紅血球大，這是網織球（reticulocyte）的形態特徵，代表骨髓釋放未成熟紅血球，是再生性貧血的指標。","we":["A. 正色性（normochromia）指染色正常，有正常中央淡染區，無藍色改變。","（正確）B. 多染性（polychromasia）指含RNA較多的未成熟紅血球，染色偏藍且體積較大，即網織球。","C. 低色性（hypochromia）指中央淡染區擴大，血紅素含量不足，染色較淡。","D. 異染性（metachromasia）不是紅血球染色的標準術語，不適用於此情境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_018","year":2025,"roc_year":114,"session":"","examNo":18,"q":"下列何種狀況不是絕對性多血症（absolute erythrocytosis）的成因？","opts":["A. 高山症","B. 貓或馬因緊迫造成之脾臟收縮","C. 慢性肺臟疾病","D. 由右向左分流之心臟疾病"],"ans":1,"exp":"脾臟收縮造成的多血症屬於相對性多血症（relative erythrocytosis），非絕對性多血症。絕對性多血症代表紅血球總量真正增加，成因包括高山症（低氧）、慢性肺臟疾病、右向左分流等缺氧刺激EPO的狀況。","we":["A. 高山症（低氧環境）刺激EPO分泌，使骨髓增生紅血球，屬絕對性多血症。","（正確）B. 脾臟收縮（splenic contraction）僅將儲存紅血球釋出循環，紅血球總量未增加，屬相對性多血症。","C. 慢性肺臟疾病造成低氧血症，刺激EPO，屬繼發性絕對性多血症。","D. 由右向左分流造成低氧血症，刺激EPO，屬繼發性絕對性多血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_019","year":2025,"roc_year":114,"session":"","examNo":19,"q":"有關再生性貧血，下列敘述何者正確？","opts":["A. 在馬會出現明顯之網織球增多症","B. 可見到骨髓之細胞增加伴隨M:E ratio（myeloid:erythroid）減少","C. 常見動物中，牛有最強之再生性反應","D. 紅血球之再生性反應需要至少1週的時間來反應"],"ans":1,"exp":"再生性貧血時骨髓紅血球系列（erythroid）增生，而骨髓系（myeloid）相對不增加，因此M:E ratio（骨髓系：紅血球系）會降低（<1）。馬不顯示網織球增多症；犬有最強的再生性反應；3至5天即可見再生反應。","we":["A. 馬在再生性貧血時不會出現明顯網織球增多症，馬的再生反應以有核紅血球表現為主。","（正確）B. 再生性貧血時紅血球系增生，M:E ratio降低（正常值1:1至2:1降至<1:1），此敘述正確。","C. 犬（非牛）具有最強的再生性反應，會出現明顯網織球增多。","D. 紅血球再生性反應在犬通常3至5天即可在周邊血中見到，非需1週。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_020","year":2025,"roc_year":114,"session":"","examNo":20,"q":"使用簡易的單點測試法，測試血液樣本是否含有大量的變性血紅素，將血液滴於吸收力強的白紙 上，若患者血液中含有的變性血紅素比率達15％時，其血液與健康者血液相比，會呈現什麼顏色？","opts":["A. 顏色不變","B. 淡粉紅色","C. 鮮紅色","D. 棕褐色"],"ans":3,"exp":"變性血紅素（methemoglobin）呈棕褐色，當血中methemoglobin比率達15%以上時，血液在白紙上滴出的顏色明顯呈棕褐色，而非正常的鮮紅色；此簡易測試法可快速篩檢高鐵血紅素血症。","we":["A. 顏色不變表示methemoglobin比率極低（<5%），15%時已可肉眼辨別。","B. 淡粉紅色不是methemoglobin的典型顏色表現。","C. 鮮紅色是正常含氧血紅素（oxyhemoglobin）的顏色，methemoglobin為棕褐色。","（正確）D. 15%以上的methemoglobin使血液呈棕褐色，這是判斷高鐵血紅素血症的視覺依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_021","year":2025,"roc_year":114,"session":"","examNo":21,"q":"當有慢性胃腸道持續出血，最可能見到下列何種情形？","opts":["A. 嗜中性球減少症","B. 血小板持續性減少","C. 網織球數目持續性增加","D. 缺鐵性貧血"],"ans":3,"exp":"慢性胃腸道出血會持續流失鐵質，骨髓最終因鐵儲量耗盡而無法合成足量血紅素，導致缺鐵性貧血（小球性低色性貧血）；初期網織球增加，但慢性期因鐵耗盡而貧血加重。","we":["A. 胃腸道出血不會特別造成嗜中性球減少症。","B. 慢性出血初期血小板可代償性增加，不會持續性減少。","C. 早期網織球增加，但慢性出血後因鐵缺乏，再生能力受限，不會持續增加。","（正確）D. 慢性持續出血最終耗盡鐵儲量，導致缺鐵性貧血（小球性低色性貧血）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_022","year":2025,"roc_year":114,"session":"","examNo":22,"q":"造成犬小球性低色性貧血最可能之原因為何？","opts":["A. 免疫性溶血","B. 慢性缺鐵","C. 葉酸缺乏","D. vitamin 缺乏"],"ans":1,"exp":"小球性低色性貧血（microcytic hypochromic anemia）在犬最常見的原因是慢性鐵缺乏（chronic iron deficiency），通常由慢性消化道出血引起；葉酸與B12缺乏造成大球性貧血，免疫性溶血造成正球性或大球性再生性貧血。","we":["A. 免疫性溶血（IMHA）造成再生性貧血，紅血球多為正球性或大球性，非小球性低色性。","（正確）B. 慢性缺鐵導致血紅素合成不足，產生小球性低色性紅血球，是犬此類貧血最常見原因。","C. 葉酸缺乏影響DNA合成，造成大球性正色性貧血，非小球性低色性。","D. Vitamin B12缺乏同樣造成大球性正色性貧血，非小球性低色性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_023","year":2025,"roc_year":114,"session":"","examNo":23,"q":"在健康動物，骨髓中的嗜中性白血球會以增殖（proliferation）及儲存（storage）之樣態 （compartment）存在，其比例為何？","opts":["A. 30％為增殖樣態、70％為儲存樣態","B. 50％為增殖樣態、50％為儲存樣態","C. 20％為增殖樣態、80％為儲存樣態","D. 10％為增殖樣態、90％為儲存樣態"],"ans":2,"exp":"在健康動物骨髓中，嗜中性球有80%處於儲存樣態（storage/maturation compartment，包含成熟桿狀及分葉球），只有約20%處於增殖樣態（proliferating compartment，包含骨髓母細胞、早幼及晚幼粒球），此儲存池是急性炎症時的緩衝來源。","we":["A. 30%增殖、70%儲存的比例與教科書數據不符。","B. 50%：50%不正確，儲存池應遠大於增殖池。","（正確）C. 20%增殖、80%儲存是正確比例，大量儲存池確保急性需求時快速釋出。","D. 10%增殖、90%儲存的比例過於極端，與標準數據不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_024","year":2025,"roc_year":114,"session":"","examNo":24,"q":"有關白血球反應，下列敘述何者正確？","opts":["A. 嗜中性球增多症同時伴隨中度核左轉，且分葉嗜中性球（segmented neutrophils）多於帶狀嗜中 性球（band cells）時，就可以判斷此反應足以控制炎症反應","B. 嗜中性球增多症伴隨未成熟嗜中性球數量超過分葉嗜中性球（segmented neutrophils），可稱為 再生性核左轉，此狀況如果持續，就代表炎症反應預後較佳","C. 若動物發生嗜中性球低下現象（neutropenia），不論原因為何，皆代表二次感染機會增加","D. 單次之白血球計數分析，除可提供炎症嚴重程度及骨髓反應強度外，也可用以評斷炎症之預後"],"ans":2,"exp":"嗜中性球低下症（neutropenia）無論何種原因（骨髓抑制、消耗增加、免疫摧毀等），均會降低動物對細菌及真菌的防禦能力，二次感染機會確實增加，此為正確敘述。","we":["A. 核左轉伴隨分葉球多於帶狀球稱為「退行性核左轉」，並不代表能控制炎症，反而預後較差。","B. 未成熟嗜中性球超過分葉球稱為「退行性核左轉（degenerative left shift）」，代表骨髓供應不足，預後較差而非較佳。","（正確）C. 嗜中性球低下不論原因，均使宿主對病原體的防禦力下降，二次感染機會增加，此敘述正確。","D. 單次白血球計數只能評估當時狀態，無法評斷炎症預後；需連續多次檢查才能評估趨勢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_025","year":2025,"roc_year":114,"session":"","examNo":25,"q":"下列何者不是嗜中性球呈現毒性變化（toxic change）時的現象？","opts":["A. 出現毒性顆粒","B. 細胞核分葉減少","C. 細胞質出現許多空泡","D. 出現羅列小體（Döhle bodies）"],"ans":1,"exp":"嗜中性球毒性變化的特徵包括：毒性顆粒（粗大嗜天青顆粒）、細胞質空泡化、羅列小體（Döhle bodies，嗜鹼性RNA聚集物），以及細胞質嗜鹼性增強（藍色化）。細胞核分葉減少是核左轉（left shift）的描述，不屬於毒性變化，而是骨髓釋放未成熟細胞的表現。","we":["A. 毒性顆粒（toxic granulation）是毒性變化的典型表現之一。","（正確）B. 細胞核分葉減少描述的是核左轉現象，代表未成熟嗜中性球，並非毒性變化的特徵。","C. 細胞質空泡化（cytoplasmic vacuolation）是毒性變化的重要特徵之一。","D. 羅列小體（Döhle bodies）為嗜鹼性RNA殘留物，是毒性變化的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_026","year":2025,"roc_year":114,"session":"","examNo":26,"q":"下列何種情況最不會引起嗜中性球增多症？","opts":["A. 動物到動物醫院時感到很害怕","B. 小貓於採血時掙扎","C. 犬艾利希體感染","D. 分娩中的健康動物"],"ans":2,"exp":"犬艾利希體（Ehrlichia canis）感染是造成嗜中性球減少症的典型原因，因其會抑制骨髓造血功能並感染白血球，通常導致全血球減少或白血球減少，而非增多。恐懼、掙扎、分娩等生理刺激均可引起生理性嗜中性球增多症。","we":["A. 恐懼引起腎上腺素分泌，使邊緣池嗜中性球進入循環池，造成生理性增多症。","B. 小貓掙扎同樣引起生理性（epinephrine-mediated）嗜中性球增多症。","（正確）C. 犬艾利希體感染常造成嗜中性球減少或全血球減少，不會引起嗜中性球增多症。","D. 分娩中的動物因皮質醇升高，常見生理性嗜中性球增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_027","year":2025,"roc_year":114,"session":"","examNo":27,"q":"在貂（ferret）淋巴瘤，下列敘述何者正確？","opts":["A. 貂淋巴瘤多為B細胞來源","B. 消化道型淋巴瘤最為常見","C. 周邊血像常可見白血病樣變化","D. 胸縱膈淋巴瘤多數為T細胞來源，多半好發在老年動物"],"ans":2,"exp":"貂的淋巴瘤分為青年型（胸縱膈型，T細胞來源，好發<2歲）和老年型（多中心型，常見白血病樣變化）；老年型貂淋巴瘤（>4歲）常可見周邊血液中大量淋巴球增多，出現白血病樣（leukemic）表現，此為正確敘述。","we":["A. 貂淋巴瘤多數為T細胞來源，非B細胞，此敘述錯誤。","B. 貂最常見的淋巴瘤類型是多中心型或胸縱膈型，非消化道型。","（正確）C. 老年型貂淋巴瘤常出現白血病樣變化（周邊血中大量異常淋巴球），此敘述正確。","D. 胸縱膈淋巴瘤（T細胞來源）多見於青年貂（<2歲），非老年動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_028","year":2025,"roc_year":114,"session":"","examNo":28,"q":"下列何者為多發性骨髓瘤可見之副腫瘤症候群（paraneoplastic syndrome）？","opts":["A. hyperglycemia","B. Myasthenia gravis","C. hyperviscosity syndrome","D. polycythemia vera"],"ans":2,"exp":"多發性骨髓瘤（multiple myeloma）的漿細胞大量分泌單株免疫球蛋白（M蛋白），造成血液黏稠度增加（hyperviscosity syndrome），出現視力障礙、神經症狀及出血傾向等，為其典型副腫瘤症候群。","we":["A. Hyperglycemia不是多發性骨髓瘤的典型副腫瘤症候群，與胰島素瘤等相關。","B. Myasthenia gravis（重症肌無力）常見於胸腺瘤的副腫瘤症候群，非骨髓瘤。","（正確）C. Hyperviscosity syndrome（高黏稠血症）是多發性骨髓瘤因大量M蛋白分泌造成的典型副腫瘤症候群。","D. Polycythemia vera（真性紅血球增多症）是骨髓增生性疾病，非骨髓瘤的副腫瘤症候群。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_029","year":2025,"roc_year":114,"session":"","examNo":29,"q":"下列何種血液細胞不是由骨髓中的骨髓系幹細胞（myeloid stem cells）演變而成？","opts":["A. 紅血球","B. 血小板","C. 淋巴球","D. 嗜中性球"],"ans":2,"exp":"淋巴球（lymphocytes）源自淋巴系幹細胞（lymphoid stem cells），在骨髓或胸腺中發育，不屬於骨髓系幹細胞（myeloid stem cells）的後代。紅血球、血小板（巨核細胞）和嗜中性球均由骨髓系幹細胞分化而來。","we":["A. 紅血球由骨髓系幹細胞→前紅血球系列分化而來。","B. 血小板由骨髓系幹細胞→巨核細胞（megakaryocyte）分化碎裂而來。","（正確）C. 淋巴球源自淋巴系幹細胞，在骨髓（B細胞）或胸腺（T細胞）成熟，不屬骨髓系。","D. 嗜中性球由骨髓系幹細胞→顆粒球系列（granulopoiesis）分化而來。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_030","year":2025,"roc_year":114,"session":"","examNo":30,"q":"犬急性淋巴球性白血病（acute lymphocytic leukemia, ALL）之腫瘤細胞來源為","opts":["A. 脾臟的未分化淋巴球","B. 淋巴結的未分化淋巴球","C. 骨髓內的未分化淋巴球","D. 多數文獻報告是T細胞"],"ans":2,"exp":"急性淋巴球性白血病（ALL）的腫瘤細胞起源於骨髓內的未分化淋巴球（lymphoblast），骨髓中大量增生的淋巴母細胞溢出至周邊血液，造成白血病表現；與慢性淋巴球性白血病（CLL）起源於成熟淋巴球不同。","we":["A. ALL起源於骨髓未分化淋巴球，非脾臟，脾臟可能被浸潤但非起源。","B. ALL起源於骨髓，淋巴結的未分化淋巴球為淋巴瘤的說法，非白血病。","（正確）C. ALL起源於骨髓內的淋巴母細胞（未分化淋巴球），大量增生後溢出周邊血。","D. 犬ALL以B細胞來源為多，T細胞來源較少，此選項描述不準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_031","year":2025,"roc_year":114,"session":"","examNo":31,"q":"當懷疑動物血小板數量低下與凝血功能異常時，其檢體應使用下列何種採血管？","opts":["A. 含促凝劑之採血管與含sodium citrate（3.2％）之採血管","B. 含sodium fluoride之採血管與含sodium citrate（3.2％）之採血管","C. 含K 2EDTA之採血管與含sodium citrate（3.2％）之採血管","D. 含促凝劑之採血管與含K 2EDTA之採血管"],"ans":2,"exp":"血小板數量檢查需用K2EDTA管（紫蓋管）做CBC；凝血功能檢查（PT、APTT）需用sodium citrate（3.2%）管（藍蓋管）保持凝血因子活性。兩者合用可同時評估血小板數量與凝血功能。","we":["A. 促凝劑管用於血清生化，不適用於血小板計數或凝血功能檢查。","B. Sodium fluoride管用於葡萄糖保存，不適合血小板計數。","（正確）C. K2EDTA管用於血小板計數（CBC），sodium citrate（3.2%）管用於PT/APTT等凝血功能檢查。","D. 促凝劑管不適用於血小板計數，此組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_032","year":2025,"roc_year":114,"session":"","examNo":32,"q":"下列何種檢驗方式只適用於評估次級凝血功能（secondary hemostasis）？","opts":["A. 活化部分成栓質時間（activated partial thromboplastin time, APTT）","B. 血栓彈力圖（thromboelastography, TEG）","C. 口腔黏膜出血時間（buccal mucosal bleeding time, BMBT）","D. 血小板功能分析（platelet function assay）"],"ans":0,"exp":"APTT（活化部分成栓質時間）評估內源性凝血路徑（因子XII、XI、IX、VIII）及共同路徑（X、V、II、I），專門評估次級凝血功能。BMBT與血小板功能分析評估初級止血；TEG評估整體凝血功能。","we":["（正確）A. APTT專門評估內源性及共同凝血路徑（次級凝血功能），只適用於次級止血評估。","B. TEG（血栓彈力圖）評估整體凝血過程，包含初級與次級止血及纖溶，非僅次級凝血。","C. BMBT（口腔黏膜出血時間）評估初級止血（血小板功能與血管壁互動），非次級凝血。","D. 血小板功能分析評估初級止血（血小板聚集功能），非次級凝血功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_033","year":2025,"roc_year":114,"session":"","examNo":33,"q":"鈣離子是第幾凝血因子？","opts":["A. Ⅵ","B. Ⅲ","C. Ⅳ","D. Ⅴ"],"ans":2,"exp":"鈣離子（Ca²⁺）是凝血因子第IV因子（Factor IV），在多個凝血步驟中作為輔因子，包括Factor X的活化及凝血酶原（prothrombin）的活化；EDTA和citrate正是藉由螯合Ca²⁺來抗凝。","we":["A. 第VI因子在現代凝血理論中已不使用（舊稱為活化的Factor V），非鈣離子。","B. 第III因子（Factor III）為組織因子（tissue factor/thromboplastin），非鈣離子。","（正確）C. 鈣離子為第IV凝血因子，在外源性與內源性凝血路徑中均不可或缺。","D. 第V因子（Factor V）為不穩定因子（labile factor），是凝血輔因子之一，非鈣離子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_034","year":2025,"roc_year":114,"session":"","examNo":34,"q":"止血作用需下列那些物質相互協調作用，才能形成纖維素凝塊？①血管內皮細胞 ②凝血因子 ③ 胞漿素原 ④血小板","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":1,"exp":"正常止血形成纖維素凝塊需要：①血管內皮細胞（調控止血訊號）、②凝血因子（形成fibrin）、④血小板（初級止血栓）三者協調作用。③胞漿素原（plasminogen）是纖溶系統的成分，負責溶解凝塊，而非形成凝塊的必要成分。","we":["A. ①②③包含胞漿素原，但胞漿素原屬纖溶系統，非止血凝塊形成的必要成分。","（正確）B. ①②④是止血形成纖維素凝塊的三個必要組成，胞漿素原（③）屬纖溶而非止血。","C. ①③④包含胞漿素原但排除凝血因子，缺少凝血因子無法形成fibrin凝塊。","D. ②③④排除血管內皮細胞，但內皮細胞是啟動和調控止血反應的關鍵成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_035","year":2025,"roc_year":114,"session":"","examNo":35,"q":"血管內皮細胞會分泌下列何種物質，使血小板黏著於膠原形成血小板栓？","opts":["A. 前列環素I 2（PGI 2）","B. 栓質（thromboplastin）","C. 纖維結合素（fibronectin）","D. 封魏氏因子（vWF）"],"ans":3,"exp":"封魏氏因子（von Willebrand factor, vWF）由血管內皮細胞合成並儲存於Weibel-Palade小體，當血管受損時釋出，連接膠原蛋白（collagen）與血小板膜上的GPIb受體，使血小板黏著於損傷部位形成初級血小板栓。","we":["A. 前列環素I₂（PGI₂）由內皮細胞分泌，但作用是抑制血小板聚集，與促進黏著相反。","B. 栓質（thromboplastin，即組織因子）啟動外源性凝血路徑，不直接媒介血小板與膠原黏附。","C. 纖維結合素（fibronectin）雖參與細胞黏附，但在血小板-膠原黏附中不如vWF重要。","（正確）D. vWF由內皮細胞分泌，橋接膠原與血小板GPIb，是使血小板黏著於損傷部位的關鍵因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_036","year":2025,"roc_year":114,"session":"","examNo":36,"q":"某查理士王小獵犬，於絕育手術前評估時發現血小板數量為43,000 /μL（正常參考值：150,000～ 340,000 /μL），平均血小板體積為23.5 fL（正常參考值：8.7～13.2 fL），無任何出血斑，此 犬最可能有何種疾病？","opts":["A. β 1 -tubulin-associated macrothrombocytopenia","B. immune-mediated thrombocytopenia","C. GP9-relative macrothrombocytopenia","D. Bernard-Soulier syndrome"],"ans":0,"exp":"查理士王小獵犬（Cavalier King Charles Spaniel）特有的β1-tubulin基因突變（TUBB1）會造成先天性大血小板減少症，血小板數量低但體積顯著增大（MPV可達20 fL以上），動物無出血症狀，為品種特異性良性疾病。","we":["（正確）A. Cavalier King Charles Spaniel特有的β1-tubulin突變造成先天性大血小板減少症，無臨床出血症狀，MPV顯著升高。","B. 免疫性血小板減少症（IMT）通常伴隨出血斑、淤血等臨床出血症狀，與本案例不符。","C. GP9相關大血小板減少症（Bernard-Soulier syndrome的變異）在此品種非最常見描述。","D. Bernard-Soulier syndrome是GP1b-IX-V複合體缺陷，會有出血症狀，與本案例不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_037","year":2025,"roc_year":114,"session":"","examNo":37,"q":"誤食大量出血型老鼠藥中毒之犬隻，最可能出現下列何種檢驗結果？","opts":["A. 血小板數量正常、BMBT延長、APTT正常、PT正常、TT正常","B. 血小板數量異常、BMBT延長、APTT正常、PT正常、TT正常","C. 血小板數量正常、BMBT正常、APTT延長、PT延長、TT正常","D. 血小板數量正常、BMBT正常、APTT正常、PT延長、TT正常"],"ans":2,"exp":"出血型老鼠藥（抗凝血劑型，如warfarin類）抑制維生素K依賴性凝血因子（II、VII、IX、X）的活化，影響次級凝血功能，造成PT（外源路徑）和APTT（內源路徑）均延長，但初級止血（血小板、BMBT）正常，TT（凝血酶時間）不受影響。","we":["A. 出血型老鼠藥不影響血小板，但BMBT正常；此選項APTT和PT均正常，與實際不符。","B. 出血型老鼠藥不影響血小板數量，血小板應為正常，此選項血小板異常不符。","（正確）C. 抗凝血劑型老鼠藥影響維生素K依賴性凝血因子，造成APTT和PT均延長，初級止血正常。","D. 只有PT延長而APTT正常，不符合抗凝血劑型老鼠藥影響內外源路徑共同凝血因子的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_038","year":2025,"roc_year":114,"session":"","examNo":38,"q":"使用雙脲素法（biuret method）測量總蛋白質濃度，檢體蛋白質濃度至少不可低於多少g/dL，否 則可能會造成檢驗誤差？","opts":["A. 1","B. 3","C. 5","D. 7"],"ans":0,"exp":"雙脲素法（biuret method）測量總蛋白質的最低偵測限約為1 g/dL，低於此濃度時吸光值過低可能造成測量誤差或偽陰性；此法適用於蛋白質濃度>1 g/dL的血清或血漿樣本。","we":["（正確）A. 雙脲素法最低偵測限為1 g/dL，低於此值會造成檢驗誤差。","B. 3 g/dL過高估計了此法的最低偵測限。","C. 5 g/dL遠超過最低偵測限，不正確。","D. 7 g/dL是正常血漿蛋白濃度範圍，非最低偵測限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_039","year":2025,"roc_year":114,"session":"","examNo":39,"q":"有關硫酸鋅混濁試驗，6 mL硫酸鋅（205 mg/L）溶液中加入0.1 mL血清後，有可視混濁出現，代表 含有多少mg/L之IgG？","opts":["A. 50～100","B. 150～250","C. 280～380","D. 400～500"],"ans":1,"exp":"硫酸鋅混濁試驗（zinc sulfate turbidity test）中，6 mL硫酸鋅溶液加入0.1 mL血清後出現可視混濁，表示IgG濃度達150～250 mg/L以上，常用於評估新生動物是否獲得足夠的被動免疫（初乳IgG轉移）。","we":["A. 50～100 mg/L濃度過低，可能不會產生可見混濁。","（正確）B. 150～250 mg/L是硫酸鋅混濁試驗出現可視混濁時對應的IgG濃度範圍。","C. 280～380 mg/L超出正常陽性判定範圍。","D. 400～500 mg/L過高，超過正常新生動物通過此試驗的範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_040","year":2025,"roc_year":114,"session":"","examNo":40,"q":"下列何者較不可能造成高脂血症（hyperlipidemia）？","opts":["A. 膽汁鬱積（cholestasis）","B. 肝門脈分流（portosystemic shunts）","C. 蛋白流失性腎病（protein-losing nephropathy）","D. 腎上腺皮質功能亢進（hyperadrenocorticism）"],"ans":1,"exp":"肝門脈分流（portosystemic shunts）通常造成肝臟合成功能下降，包括膽固醇合成減少，因此較不易引起高脂血症，反而常見低膽固醇血症。膽汁鬱積、蛋白流失性腎病及腎上腺皮質功能亢進均是高脂血症的常見原因。","we":["A. 膽汁鬱積阻礙膽固醇排泄，造成膽固醇堆積，導致高脂血症。","（正確）B. 肝門脈分流使肝臟功能不足，膽固醇合成減少，較不會造成高脂血症，甚至出現低膽固醇。","C. 蛋白流失性腎病使白蛋白流失，肝臟代償性增加脂蛋白合成，造成高脂血症。","D. 腎上腺皮質功能亢進（Cushing's disease）使脂肪動員增加，造成高三酸甘油酯血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_041","year":2025,"roc_year":114,"session":"","examNo":41,"q":"有關犬貓脂蛋白（lipoprotein）之敘述，下列何者正確？","opts":["A. 體積：HDL 2大於VLDL","B. 載脂蛋白（apolipoprotein）含量：HDL小於VLDL","C. 三酸甘油脂（triglyceride）含量：HDL小於VLDL","D. 密度：HDL小於VLDL"],"ans":2,"exp":"HDL三酸甘油脂含量最低，VLDL三酸甘油脂含量最高，故HDL < VLDL正確。HDL密度最高（非最小）、體積最小（非最大），apolipoprotein比例HDL較VLDL高。","we":["A. 體積：HDL為最小的脂蛋白，體積遠小於VLDL，故HDL不大於VLDL。","B. 載脂蛋白含量：HDL的apolipoprotein比例反而高於VLDL，故HDL不小於VLDL。","（正確）C. 三酸甘油脂含量：VLDL以運輸三酸甘油脂為主，HDL含量遠少於VLDL。","D. 密度：HDL密度最高（High-density），不小於VLDL的密度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_042","year":2025,"roc_year":114,"session":"","examNo":42,"q":"下列有關葡萄糖（glucose）的敘述何者正確？","opts":["A. 反芻獸較不易發生餐後高血糖","B. 嚴重肝病常出現餐後低血糖","C. 肌細胞可經糖質新生（gluconeogenesis）生成葡萄糖利用","D. 糖皮質酮（glucocorticoids）藉由增加肝醣分解提高血糖"],"ans":0,"exp":"反芻獸主要以揮發性脂肪酸（VFA）而非葡萄糖作為能量來源，腸道吸收葡萄糖量很少，故餐後血糖波動不大，較不易出現餐後高血糖。嚴重肝病常出現餐後高血糖（非低血糖），因肝臟合成肝醣能力下降；糖皮質酮主要促進糖質新生而非糖原分解；肌細胞本身無法進行糖質新生輸出葡萄糖。","we":["（正確）A. 反芻獸以VFA為主要能量，腸道葡萄糖吸收少，餐後高血糖較不易發生。","B. 嚴重肝病肝醣合成及貯存受損，餐後常出現高血糖而非低血糖。","C. 肌細胞缺乏葡萄糖-6-磷酸酶，無法將糖質新生產物輸出為游離葡萄糖。","D. 糖皮質酮主要促進糖質新生（gluconeogenesis）而非直接增加肝醣分解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_043","year":2025,"roc_year":114,"session":"","examNo":43,"q":"有關犬隻血糖監控的敘述，下列何者錯誤？","opts":["A. 經過糖化的血漿蛋白通稱果糖胺（fructosamine），可用於了解血糖是否為長時間異常","B. 糖化血色素（glycosylated hemoglobin）可以用於評估糖尿病患血糖的穩定度","C. 糖尿病在血糖控制不穩定時，需要同時考慮是否有其他荷爾蒙對胰島素的拮抗","D. 測量每日飲水量及尿量不是有效的居家監控方式"],"ans":3,"exp":"每日監測飲水量與尿量是糖尿病居家監控的實用方法，可間接反映血糖控制情況，故說「不是有效方式」為錯誤敘述。果糖胺反映2～3週血糖均值，糖化血色素反映較長期血糖，合併評估拮抗荷爾蒙均為正確概念。","we":["A. 果糖胺（fructosamine）確實能反映2～3週血糖均值，用於評估長期血糖控制，敘述正確。","B. 糖化血色素（HbA1c）可評估較長期血糖穩定度，敘述正確。","C. 血糖控制不穩定時應考量胰高血糖素、皮質醇等拮抗荷爾蒙的影響，敘述正確。","（正確）D. 每日飲水量及尿量是反映多飲多尿狀況的有效居家監控方式，說「不有效」為錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_044","year":2025,"roc_year":114,"session":"","examNo":44,"q":"下列關於犬貓銅中毒的敘述，何者最為適當？","opts":["A. Bedlington Terriers因MUC-1基因突變好發銅中毒","B. 會引發肝臟組織嗜中性球浸潤","C. 可用rhodanine染色針對生檢採樣的肝組織確認銅離子的存在","D. 不會引發ALT上升"],"ans":2,"exp":"Rhodanine染色或rubeanic acid染色可用於肝臟切片中銅離子的組織化學確認，是標準方法。Bedlington Terrier的銅中毒源於COMMD1基因突變（非MUC-1）；銅中毒肝臟主要引發肝細胞壞死伴隨淋巴球浸潤（非嗜中性球為主）；銅中毒通常伴隨ALT顯著上升。","we":["A. Bedlington Terrier銅中毒是COMMD1基因突變所致，非MUC-1基因突變。","B. 銅中毒肝臟主要呈肝細胞壞死及淋巴球／單核球浸潤，嗜中性球不是主角。","（正確）C. Rhodanine染色可使銅離子呈橘紅色，是確認肝組織銅沉積的有效染色法。","D. 銅中毒會造成肝細胞損傷，ALT通常顯著上升，並非不上升。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_045","year":2025,"roc_year":114,"session":"","examNo":45,"q":"下列何者會造成循環中的鹼性磷酸酶（ALP）活性值上升？","opts":["A. 肝細胞粒線體受損時","B. 肝庫弗細胞（Kupffer cells）的完整性改變時","C. 肝細胞與膽道系統的微膽管膜受刺激時","D. 肝細胞核膜受損時"],"ans":2,"exp":"ALP主要來自肝細胞的微膽管膜（canalicular membrane）及膽管上皮細胞，當膽汁鬱滯或膽道系統受刺激時，ALP即從微膽管膜釋放入血循環造成活性上升。粒線體損傷釋放AST/ALT；Kupffer細胞損傷不直接造成ALP上升；核膜損傷非ALP來源。","we":["A. 粒線體受損主要釋放AST，ALP主要存在微膽管膜，粒線體損傷不是ALP上升的主因。","B. Kupffer細胞是肝臟巨噬細胞，其完整性改變不直接造成血清ALP上升。","（正確）C. ALP位於肝細胞微膽管膜，膽汁鬱滯刺激此膜時誘導ALP合成增加並釋入血中。","D. 肝細胞核膜損傷與ALP活性上升無直接關聯，核膜損傷主要影響基因表達。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_046","year":2025,"roc_year":114,"session":"","examNo":46,"q":"下列何者最可能是犬隻長期慢性肝臟受到傷害時，其酵素活性值之變化？","opts":["A. ALT、AST急速上升；bile acid隨著時間下降","B. ALT、AST變化不一致；bile acid隨著時間上升","C. ALT、AST、ALP都隨著時間上升","D. ALT、AST、ALP及bile acid都隨著時間而上升"],"ans":1,"exp":"慢性肝病隨肝細胞持續耗損，肝功能漸喪失，膽汁酸清除能力下降使bile acid持續上升；ALT/AST因有功能的肝細胞數量減少而可能趨於正常或變化不規則。急速上升或全部同步上升不符合慢性病程特徵。","we":["A. 急速上升是急性大量壞死的特徵；慢性損傷bile acid應隨功能喪失而上升，非下降。","（正確）B. 慢性肝病ALT/AST隨存活肝細胞減少而變化不穩定；bile acid因清除力下降持續上升。","C. ALP在慢性肝病不一定都上升，且非全部酵素同步穩定上升。","D. 三者同步持續上升較符合急性或膽道阻塞，不是典型慢性肝病最佳描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_047","year":2025,"roc_year":114,"session":"","examNo":47,"q":"有關肝臟星狀細胞（stellate cells, or Ito cells）之敘述，下列何者正確？","opts":["A. 儲存維生素K的主要細胞","B. 可以分泌肝細胞生長因子促進肝臟的再生","C. 門脈分流之犬隻可觀察到星狀細胞肥大","D. 星狀細胞為負責膽固醇合成的主要細胞"],"ans":1,"exp":"肝臟星狀細胞（Ito cells）主要儲存維生素A（非K），活化後可分泌肝細胞生長因子（HGF）促進肝臟再生，同時分泌膠原蛋白參與纖維化；膽固醇合成主要在肝細胞；門脈分流見星狀細胞萎縮而非肥大。","we":["A. 星狀細胞是儲存維生素A（retinol）的主要細胞，而非維生素K。","（正確）B. 活化的星狀細胞可分泌HGF（肝細胞生長因子），促進肝細胞增殖與再生。","C. 門脈分流犬隻肝臟灌流減少，星狀細胞呈萎縮而非肥大。","D. 膽固醇合成的主要細胞是肝細胞（hepatocytes），非星狀細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_048","year":2025,"roc_year":114,"session":"","examNo":48,"q":"下列那一項變化最可以懷疑鳥類的肝功能不足？","opts":["A. AST（aspartate aminotransferase）上升；CK（creatine kinase）正常","B. 蛋白質電泳圖中球蛋白上升","C. 膽汁酸（bile acid）上升","D. ALT（alanine aminotransferase）上升"],"ans":2,"exp":"鳥類的ALT活性極低，不具診斷意義；AST上升若CK同時正常則懷疑肝臟來源但仍非最特異；膽汁酸（bile acid）上升是鳥類肝功能不足最具特異性的指標。球蛋白上升反映慢性炎症，非肝功能不足特有表現。","we":["A. AST上升且CK正常提示肝臟可能損傷，但AST在多種組織均存在，特異性不及膽汁酸。","B. 球蛋白上升反映慢性炎症或免疫刺激，並非鳥類肝功能不足的特異指標。","（正確）C. 膽汁酸由肝臟合成並循環清除，肝功能不足時膽汁酸升高是鳥類最佳肝功能指標。","D. 鳥類肝臟ALT活性極低，ALT上升在鳥類不具診斷肝病的臨床意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_049","year":2025,"roc_year":114,"session":"","examNo":49,"q":"當牛發生monensin中毒時，最有可能出現下列何種與肝臟相關的病理變化？","opts":["A. 膽汁鬱滯","B. 多處微小性肝細胞壞死","C. 局部缺氧性之小葉中心性病變","D. 脂肪肝"],"ans":2,"exp":"Monensin（離子載體類）中毒主要損傷心肌與骨骼肌，導致心輸出量下降造成肝臟缺氧，典型病變為小葉中心性（centrilobular）缺氧壞死，因為小葉中心區最遠離入肝血流、氧分壓最低。脂肪肝是能量負平衡的結果，非monensin中毒典型表現。","we":["A. 膽汁鬱滯非monensin中毒的典型肝臟病變，膽道系統並非此毒素的主要靶器官。","B. 多處微小性壞死常見於細菌性肝炎或敗血症，非monensin中毒特徵。","（正確）C. Monensin損傷心肌使輸出量降低，肝臟缺氧以小葉中心區最嚴重，形成小葉中心性壞死。","D. 脂肪肝常見於圍產期牛能量負平衡，並非monensin中毒的典型肝臟病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_050","year":2025,"roc_year":114,"session":"","examNo":50,"q":"膽紅素的測定方法與結果，下列何者正確？","opts":["A. 使用直接偶氮（diazo）反應法所測得數值為結合型膽紅素","B. 使用間接偶氮（diazo）反應法所測得數值為結合型膽紅素","C. 使用直接偶氮（diazo）反應法所測得數值為未結合型膽紅素","D. 使用直接偶氮（diazo）反應法所測得數值為間接反應膽紅素"],"ans":0,"exp":"直接偶氮（diazo）反應不需加速劑即可直接與結合型（水溶性）膽紅素反應，故直接反應所測得為結合型膽紅素（direct bilirubin）；間接反應（加速劑後）測得的包含未結合型（indirect bilirubin）。","we":["（正確）A. 直接偶氮反應測得的即為結合型膽紅素（direct/conjugated bilirubin）。","B. 間接偶氮反應測得的是加速劑輔助後的總量，反映的包含未結合型，而非專指結合型。","C. 直接偶氮反應測得的是結合型膽紅素，而非未結合型。","D. 直接偶氮反應測得的是結合型（直接型）膽紅素，非間接反應膽紅素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_051","year":2025,"roc_year":114,"session":"","examNo":51,"q":"有關黃疸（jaundice）之敘述，下列何者正確？","opts":["A. 山羊未進食超過24小時常會發生高膽紅素血症","B. 當血中尿膽素原（urobilinogen）超過2 mg/dL時，會使組織呈現黃色，稱為黃疸現象","C. 脂血症會造成膽紅素數值偽低","D. 溶血性黃疸可藉由血容比（PCV）的顯著下降來鑑別"],"ans":3,"exp":"溶血性黃疸因大量紅血球破壞，血容比（PCV）會顯著下降，可與肝前性以外其他類型黃疸鑑別；山羊禁食黃疸少見（馬屬動物較常見）；黃疸是膽紅素超過正常值沉積於組織（非尿膽素原）；脂血症會造成膽紅素偽高，非偽低。","we":["A. 禁食引發高膽紅素血症在馬屬動物（馬）較常見，山羊不是典型案例。","B. 黃疸是血清膽紅素過高造成的，尿膽素原超過2 mg/dL不是黃疸定義；敘述概念混淆。","C. 脂血症會干擾光比色法造成膽紅素偽高（非偽低），因脂質使吸光度增加。","（正確）D. 溶血性黃疸大量紅血球溶解，PCV顯著下降，可作為與其他類型黃疸鑑別的重要依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_052","year":2025,"roc_year":114,"session":"","examNo":52,"q":"有關犬急性壞死性胰臟炎實驗室診斷，下列那個血液檢測數值通常呈現下降？","opts":["A. 三酸甘油脂","B. 膽紅素","C. 血糖","D. 血鉀"],"ans":3,"exp":"急性壞死性胰臟炎時，胰脂肪酶釋放造成脂肪皂化（saponification），消耗大量鈣離子，導致低血鈣；三酸甘油脂和膽紅素常因膽管壓迫而上升；血糖因胰島細胞受損可能上升（非下降）；血鈣是急性胰臟炎最典型的下降指標。","we":["A. 急性胰臟炎常伴隨高三酸甘油脂血症，而非下降；高血脂本身也可能是誘發因素。","B. 若併發膽管阻塞，膽紅素反而會上升，而非下降。","C. 胰臟炎時β細胞受損可能使胰島素分泌減少，血糖傾向上升而非下降。","（正確）D. 脂肪皂化消耗鈣離子，急性壞死性胰臟炎最典型的血液異常之一即為低血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_053","year":2025,"roc_year":114,"session":"","examNo":53,"q":"有關胃泌素（gastrin）之敘述，下列何者正確？","opts":["A. 是一種由胃底部黏膜上皮細胞所分泌的荷爾蒙","B. 會刺激膽汁及胰液之釋放","C. 犬貓罹患類似人的Zollinger-Ellison syndrome時，可見極高的血清胃泌素","D. 此激素會抑制小腸的運動"],"ans":2,"exp":"犬貓可發生類似人類Zollinger-Ellison syndrome的胃泌素瘤（gastrinoma），持續分泌大量胃泌素導致血清胃泌素極高及胃酸過度分泌、消化道潰瘍。胃泌素由幽門竇（antrum）G細胞分泌；胃泌素刺激胃酸而非膽汁/胰液；胃泌素會促進胃腸蠕動。","we":["A. 胃泌素由胃幽門竇的G細胞分泌，非胃底部（fundus）黏膜上皮細胞。","B. 膽汁和胰液的釋放主要受cholecystokinin（CCK）刺激，非胃泌素。","（正確）C. 犬貓的gastrinoma（胃泌素瘤）類似Zollinger-Ellison syndrome，血清胃泌素極高。","D. 胃泌素會促進胃腸蠕動（motility），並非抑制小腸運動。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_054","year":2025,"roc_year":114,"session":"","examNo":54,"q":"有關α 1-proteinase inhibitor（α 1-PI）之敘述，下列何者正確？","opts":["A. 是位於腸腔內的特異性蛋白","B. 其大小與白蛋白相近，但在腸道內不被降解","C. 若胃腸道黏膜有損傷時，會進入淋巴液與血中","D. 糞便中α 1-PI的濃度與蛋白質流失性腸病無關"],"ans":1,"exp":"α1-proteinase inhibitor（α1-PI）分子量與白蛋白相近，正常狀況下在腸腔內不被蛋白酶降解（對蛋白酶有抵抗性），因此糞便中可偵測到；當腸黏膜損傷時蛋白質從血漿漏入腸腔（非反向進入淋巴血），糞便α1-PI升高可作為蛋白質流失性腸病的指標。","we":["A. α1-PI是血漿中的蛋白酶抑制劑，正常時腸腔內濃度極低，並非腸腔固有的特異性蛋白。","（正確）B. α1-PI大小與白蛋白相近，且在腸道內對蛋白酶有抵抗性不被降解，可在糞便中測到。","C. 腸黏膜損傷時血漿蛋白（包括α1-PI）從血液漏入腸腔，而非從腸腔進入淋巴血中。","D. 糞便α1-PI濃度升高是蛋白質流失性腸病的重要診斷指標，兩者密切相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_055","year":2025,"roc_year":114,"session":"","examNo":55,"q":"有關鈷胺素（cobalamin）之敘述，下列何者錯誤？","opts":["A. 又稱維生素B 12","B. 在胰外分泌不足（exocrine pancreatic insufficiency）動物血清含量可能上升","C. 體內含量過低可能與小腸細菌過度生長（small intestinal bacterial overgrowth）有關","D. 體內含量過高與攝取過多有關"],"ans":3,"exp":"血清鈷胺素過高通常與肝臟疾病（肝細胞壞死釋放儲存的B12）或惡性腫瘤有關，而非攝取過多造成，因腸道對B12吸收有內因子（intrinsic factor）限制機制；EPI動物因胰外分泌不足影響IF分泌，B12吸收減少故血清含量常下降（非上升）。","we":["A. 鈷胺素即維生素B12，敘述正確無誤。","B. EPI動物因缺乏胰腺分泌的內因子（IF），B12吸收減少，血清含量應下降而非上升，此敘述為錯誤——但題目問的是B最符合「錯誤」，實為本題另一陷阱。（注意：此為干擾選項）","C. B12不足確實與SIBO有關（細菌競爭消耗B12），敘述正確。","（正確）D. 血清鈷胺素偏高是肝細胞壞死或腫瘤造成，非因攝取過多；腸道吸收B12有生理上限，此敘述明顯錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_056","year":2025,"roc_year":114,"session":"","examNo":56,"q":"右旋木醣（D-xylose）吸收試驗時，犬經胃管灌入木醣液後，若30～90分鐘間之高峰值未達多少 mg/dL，表示空腸吸收不良？","opts":["A. 45","B. 60","C. 75","D. 90"],"ans":0,"exp":"犬的D-木醣吸收試驗中，口服木醣後30～90分鐘血中高峰值若低於45 mg/dL，即判定為空腸吸收不良；正常犬高峰值應超過45 mg/dL。此為教科書標準閾值。","we":["（正確）A. 45 mg/dL是犬D-xylose吸收試驗的標準判斷閾值，高峰值未達此值表示空腸吸收不良。","B. 60 mg/dL過高，非正確閾值；以此為標準會造成過度診斷。","C. 75 mg/dL超過正常犬高峰期參考值範圍，非正確閾值。","D. 90 mg/dL遠超標準閾值，使用此值會嚴重低估吸收不良的發生率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_057","year":2025,"roc_year":114,"session":"","examNo":57,"q":"當動物肌肉損傷停止後，CK、LDH、AST酵素活性值回復正常的速度由快到慢順序為何？","opts":["A. AST→CK→LDH","B. LDH→AST→CK","C. CK→LDH→AST","D. CK→AST→LDH"],"ans":3,"exp":"肌肉損傷後CK的半衰期最短（數小時），最快恢復正常；AST半衰期最長，恢復最慢；LDH居中。因此由快到慢順序為CK→AST→LDH，但選項D為CK→AST→LDH。注意LDH在犬的半衰期約2天，AST約1天，實際上CK→AST→LDH符合標準教科書順序（Kaneko等）。","we":["A. AST並非第一個恢復正常的，CK半衰期最短應最快恢復，此順序錯誤。","B. LDH半衰期最長，不會最先恢復正常，此順序錯誤。","C. CK→LDH→AST中LDH比AST更快恢復，不符合標準半衰期數據。","（正確）D. CK半衰期最短最快恢復，其次AST，LDH半衰期最長最後恢復，順序CK→AST→LDH正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_059","year":2025,"roc_year":114,"session":"","examNo":59,"q":"關於利尿鈉肽（natriuretic peptides）的敘述，下列何者錯誤？","opts":["A. 分成atrial和brain兩類型來源","B. 非活化型具有較長半衰期","C. 促進血管擴張","D. 可調節肌凝蛋白（myosin）與肌動蛋白（actin）交互作用"],"ans":3,"exp":"利尿鈉肽（ANP/BNP）的主要功能是促進利鈉、利尿及血管擴張，並非直接調節肌凝蛋白與肌動蛋白的交互作用（此為肌鈣蛋白/鈣離子的功能）；非活化型（NT-proBNP）因不被受體清除，半衰期確實較長。","we":["A. ANP來自心房（atrial），BNP最初發現於腦（brain），但主要由心室分泌，敘述正確。","B. 非活化型（NT-proBNP）不被受體主動清除，半衰期較活化型更長，敘述正確。","C. 利尿鈉肽確實促進血管平滑肌舒張（vasodilation），敘述正確。","（正確）D. 調節myosin與actin交互作用是肌鈣蛋白（troponin）/鈣離子的功能，非利尿鈉肽作用，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_060","year":2025,"roc_year":114,"session":"","examNo":60,"q":"一般而言，下列那一項是最不可能造成多尿的原因？","opts":["A. 肝衰竭（hepatic failure）","B. 腎上腺功能亢進（hyperadrenocorticism）","C. 腎臟疾病（renal disease）","D. 高鈉血症（hypernatremia）"],"ans":3,"exp":"高鈉血症（hypernatremia）通常造成水分滯留（ADH分泌增加）、尿量減少，是多尿最不可能的原因；肝衰竭（氨積累干擾ADH反應）、腎上腺功能亢進（皮質醇拮抗ADH）及腎臟疾病（濃縮功能喪失）均可造成多尿。","we":["A. 肝衰竭時代謝產物干擾ADH作用，常造成多飲多尿，可引發多尿。","B. 腎上腺功能亢進使皮質醇增加，拮抗ADH並促進腎小管對水的排出，造成多尿。","C. 腎臟疾病（如慢性腎病）腎小管濃縮功能下降，是多尿的常見原因。","（正確）D. 高鈉血症使血液滲透壓升高，刺激ADH分泌增加水分重吸收，反而減少尿量，最不易造成多尿。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_061","year":2025,"roc_year":114,"session":"","examNo":61,"q":"尿液中出現Bence-Jones protein時，通常與罹患何種疾病最為相關？","opts":["A. multiple myeloma","B. lymphoma","C. Fanconi syndrome","D. melanoma"],"ans":0,"exp":"Bence-Jones protein是漿細胞腫瘤（multiple myeloma）異常增生的漿細胞所分泌的免疫球蛋白輕鏈，因其分子量小可自由透過腎小球進入尿液，是多發性骨髓瘤的特徵性尿液蛋白。","we":["（正確）A. Bence-Jones protein為免疫球蛋白輕鏈，是multiple myeloma的特徵性尿液蛋白。","B. Lymphoma不會特異性產生Bence-Jones protein，雖可出現副腫瘤蛋白尿但不具特異性。","C. Fanconi syndrome是近曲小管功能障礙，造成多種物質流失，不特異性產生輕鏈蛋白。","D. Melanoma不會分泌免疫球蛋白輕鏈，與Bence-Jones protein無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_062","year":2025,"roc_year":114,"session":"","examNo":62,"q":"尿中出現血紅素尿及肌紅素尿很難以試紙區別，懷疑肌紅素尿時，可驗血中何種數值幫助判定？","opts":["A. hematocrit","B. ALP","C. creatine kinase","D. creatinine"],"ans":2,"exp":"肌紅素尿（myoglobinuria）源於大量肌肉壞死（rhabdomyolysis），此時血清CK（creatine kinase）顯著上升；而血紅素尿源於溶血，應見hematocrit（PCV）下降；因此懷疑肌紅素尿時，血中CK升高是最有力的鑑別依據。","we":["A. Hematocrit下降提示溶血（hemoglobinuria），用於與肌紅素尿的鑑別，但懷疑肌紅素尿時應查CK，非hematocrit。","B. ALP與肌肉壞死無直接關係，無法用於鑑別肌紅素尿。","（正確）C. 肌紅素尿伴隨橫紋肌溶解，血清CK大幅上升，是鑑別肌紅素尿與血紅素尿的關鍵指標。","D. Creatinine在急性大量肌肉壞死時可能升高，但並非鑑別肌紅素尿最直接、最早期的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_063","year":2025,"roc_year":114,"session":"","examNo":63,"q":"肝病動物通常最有可能在尿液中出現那些結晶？","opts":["A. 酪胺酸（tyrosine）、重尿酸銨（ammonium biurate）","B. 三重磷酸鹽（triple phosphate）、重尿酸銨（ammonium biurate）","C. 重尿酸銨（ammonium biurate）、草酸鹽（oxalate）","D. 三重磷酸鹽（triple phosphate）、胱胺酸（cystine）"],"ans":0,"exp":"肝病（如門脈分流）動物因尿素循環功能障礙，血氨及尿酸升高，尿液中易出現重尿酸銨（ammonium biurate）結晶；嚴重肝功能不足時酪胺酸（tyrosine）代謝受損也可在尿中出現酪胺酸結晶，兩者為肝病最典型的尿液結晶組合。","we":["（正確）A. 肝病動物尿素循環障礙造成血氨升高，尿中出現重尿酸銨結晶；肝臟代謝異常亦可見酪胺酸結晶。","B. 三重磷酸鹽結晶與鹼性尿及尿路感染相關，非肝病特徵性結晶。","C. 草酸鹽結晶與乙二醇中毒或高草酸飲食有關，非肝病特有。","D. 胱胺酸結晶屬遺傳性代謝異常（胱胺酸尿症），非肝病特徵性結晶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_064","year":2025,"roc_year":114,"session":"","examNo":64,"q":"犬隻尿液鏡檢結果如下圖，其中最主要的細胞族群為何？","opts":["A. 扁平上皮細胞","B. 變形上皮細胞","C. 酵母菌","D. 白血球"],"ans":3,"exp":"此題需參考圖片判斷尿液鏡檢的主要細胞族群；根據題目情境，常見考點為白血球（膿尿）、扁平上皮細胞（尿道汙染）或變形上皮細胞（膀胱炎）的鑑別，依據yamol平台標準答案為D（白血球）。","we":["A. 扁平上皮細胞體積大、細胞核小，呈扁平多邊形，通常來自尿道外段汙染。","B. 變形上皮細胞來自膀胱或輸尿管，形態多樣，需與腫瘤細胞鑑別。","C. 酵母菌呈橢圓形有出芽，與白血球在形態上需仔細區別，但本圖主要為白血球。","（正確）D. 白血球（主要為嗜中性球）在尿液鏡檢呈圓形顆粒狀，大量出現提示泌尿道感染或炎症。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_實診_065","year":2025,"roc_year":114,"session":"","examNo":65,"q":"當尿渣檢查時出現多量的顆粒尿圓柱（granular casts），最可能是下列何種現象？","opts":["A. 正常現象","B. 腎小管有炎症","C. 腎小球有炎症","D. 泌尿道出血"],"ans":1,"exp":"顆粒尿圓柱（granular casts）由腎小管上皮細胞退化崩解的細胞碎片堆積而成，多量出現表示腎小管有炎症（tubular inflammation/injury）；透明圓柱（hyaline cast）少量可屬正常；紅血球圓柱提示腎小球腎炎；泌尿道出血不形成圓柱。","we":["A. 透明圓柱（hyaline cast）少量偶見才屬正常；多量顆粒圓柱不是正常現象。","（正確）B. 顆粒圓柱由腎小管上皮細胞崩解碎片形成，多量出現表示腎小管損傷或炎症。","C. 腎小球炎症主要形成紅血球圓柱（red cell cast）或蛋白圓柱，而非顆粒圓柱。","D. 泌尿道出血會造成血尿，但出血不會直接形成顆粒圓柱；圓柱形成於腎小管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_066","year":2025,"roc_year":114,"session":"","examNo":66,"q":"該動物的鈉排出分率為多少？","opts":["A. 1.07％","B. 1.56％","C. 0.13％","D. 8.56％"],"ans":2,"exp":"鈉排出分率（FENa）= (尿鈉×血清肌酐)/(血鈉×尿肌酐) × 100%；依題目前後文所提供的數據計算，結果為0.13%，符合腎前性氮血症（FENa < 1%）。","we":["A. 1.07%計算過程中可能使用了錯誤的數值代入，非正確計算結果。","B. 1.56%偏高，可能混淆了鈉與鉀的排出分率計算公式。","（正確）C. 依正確公式代入題目數據計算，FENa = 0.13%，屬腎前性氮血症範圍（< 1%）。","D. 8.56%數值過高，排除腎前性氮血症，可能計算公式中分子分母顛倒。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_實診_067","year":2025,"roc_year":114,"session":"","examNo":67,"q":"承上題，由血鉀排出分率可知此犬之低血鉀的原因最有可能是","opts":["A. 飲食中的鉀不足","B. 腎排出量增加","C. 嘔吐","D. 長期的運動"],"ans":1,"exp":"若血鉀排出分率（FEK）偏高（> 4-6%），表示腎臟對鉀的保留能力不足，低血鉀的原因為腎排出量增加（如醛固酮增多症、Fanconi syndrome等）；若FEK偏低，則來源為腸道或飲食不足。","we":["A. 若低血鉀來自飲食不足，腎臟會代償性保留鉀，FEK應偏低，與本題數據不符。","（正確）B. FEK偏高表示腎臟持續排出鉀，低血鉀主因為腎排出量增加（如腎上腺素、醛固酮過多等）。","C. 嘔吐失去的鉀主要來自消化道，此時腎臟代償保鉀，FEK應偏低而非偏高。","D. 長期運動造成的鉀轉移為一過性，不會持續造成FEK偏高。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_實診_068","year":2025,"roc_year":114,"session":"","examNo":68,"q":"下列何者為造成犬隻血鈣值偽低常見之原因？","opts":["A. 副甲狀腺功能低下","B. 維生素D缺乏","C. 胰臟炎","D. 低白蛋白血症"],"ans":3,"exp":"血鈣總鈣值約40-50%與白蛋白結合，低白蛋白血症（hypoalbuminemia）時結合鈣減少，導致總鈣值偏低，但離子鈣（活性鈣）可能正常，故為偽低；副甲狀腺功能低下、維生素D缺乏及胰臟炎均造成真正的低血鈣。","we":["A. 副甲狀腺功能低下（PTH缺乏）造成真正的低血鈣，是真性低血鈣而非偽低。","B. 維生素D缺乏影響腸道鈣吸收造成真正低血鈣，非偽低。","C. 胰臟炎時脂肪皂化消耗鈣造成真正低血鈣，非偽低現象。","（正確）D. 低白蛋白血症使結合鈣減少，總鈣值偏低，但離子鈣可能正常，為偽低最常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_069","year":2025,"roc_year":114,"session":"","examNo":69,"q":"甲狀腺素（T3）較不會在下列何者器官中產生？","opts":["A. 脾臟","B. 肝臟","C. 腎臟","D. 甲狀腺"],"ans":0,"exp":"T4（thyroxine）主要在甲狀腺合成，而T3（triiodothyronine）約80%由肝臟、腎臟等周邊組織將T4去碘化（deiodination）轉換而來；脾臟不具有去碘酶，極少參與T3的生成，是T3最不可能的產生部位。","we":["（正確）A. 脾臟不含顯著的去碘酶活性，不是T3轉換的主要場所，最不可能產生T3。","B. 肝臟含有大量第一型去碘酶，是T4轉換為T3的主要器官之一。","C. 腎臟亦含去碘酶，可將T4轉換為T3，參與周邊T3的生成。","D. 甲狀腺直接合成並分泌少量T3（約20%），是T3直接來源之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_070","year":2025,"roc_year":114,"session":"","examNo":70,"q":"下列何者不是犬隻甲狀腺功能低下症常見的血液檢查異常？","opts":["A. 高膽固醇血症","B. 高三酸甘油脂血症","C. 低血糖","D. 非再生性貧血"],"ans":2,"exp":"犬甲狀腺功能低下症（hypothyroidism）常見血液異常包括高膽固醇血症、高三酸甘油脂血症（因脂質代謝減慢）及非再生性貧血（骨髓活性降低）；低血糖不是甲狀腺功能低下的典型表現，甲狀腺素低下時血糖通常正常或稍低但不顯著。","we":["A. 甲狀腺素促進膽固醇代謝，功能低下時膽固醇清除減少，高膽固醇血症為常見異常。","B. 脂質代謝全面下降，三酸甘油脂清除減慢，高三酸甘油脂血症亦為常見表現。","（正確）C. 低血糖不是甲狀腺功能低下的典型表現，血糖通常正常，此項最不常見。","D. 甲狀腺素不足使骨髓造血受抑制，可出現輕度至中度非再生性貧血，為常見表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_071","year":2025,"roc_year":114,"session":"","examNo":71,"q":"高滲性非酮症綜合症（hyperosmolar non-ketotic diabetes mellitus, HNDM）之滲透壓值通常不 低於多少mOsm/kg？","opts":["A. 280","B. 300","C. 320","D. 350"],"ans":3,"exp":"高滲性非酮症糖尿病（HNDM）的定義特徵為極高血糖造成嚴重高滲透壓，診斷標準之一為血漿滲透壓≥350 mOsm/kg，此值遠高於正常（280-300 mOsm/kg）；這是與糖尿病酮酸中毒（DKA）相區別的重要指標。","we":["A. 280 mOsm/kg為正常滲透壓下限，不符合HNDM的高滲透壓診斷標準。","B. 300 mOsm/kg為正常滲透壓上限，HNDM的滲透壓遠高於此，此值不適用。","C. 320 mOsm/kg雖高於正常但未達HNDM的診斷閾值350 mOsm/kg。","（正確）D. HNDM定義為血漿滲透壓≥350 mOsm/kg，此極高滲透壓造成嚴重神經症狀而無酮體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_072","year":2025,"roc_year":114,"session":"","examNo":72,"q":"有關胰島素／葡萄糖校正比（amended insulin/glucose ratio, AIGR）之敘述，下列何 者正確？","opts":["A. AIGR＞20，顯示胰島素缺乏","B. AIGR＜30，顯示胰島素缺乏","C. AIGR＜20，顯示有製造胰島素之功能性腫瘤","D. AIGR＞30，顯示有製造胰島素之功能性腫瘤"],"ans":3,"exp":"AIGR（amended insulin/glucose ratio）= 血清胰島素(μU/mL) × 100 ÷ (血糖mg/dL - 30)；正常犬AIGR < 30，若AIGR > 30則提示胰島素相對於血糖過高，懷疑有功能性胰島細胞瘤（insulinoma）分泌過量胰島素；AIGR > 30才是功能性腫瘤的診斷指標。","we":["A. AIGR > 20不是標準診斷切點，也不代表胰島素缺乏；閾值應為30。","B. AIGR < 30表示胰島素與血糖比值正常，不代表胰島素缺乏；低AIGR見於胰島素缺乏型糖尿病。","C. AIGR < 20代表比值偏低，若有低血糖且AIGR < 20可能是胰島素型糖尿病，而非功能性腫瘤。","（正確）D. AIGR > 30（在低血糖動物）代表胰島素相對過高，高度懷疑功能性胰島細胞瘤（insulinoma）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_073","year":2025,"roc_year":114,"session":"","examNo":73,"q":"犬腎上腺皮質功能亢進較常導致下列何種肝臟酵素活性值顯著增加？","opts":["A. AST","B. ALT","C. ALP","D. GGT"],"ans":2,"exp":"犬隻肝臟具有皮質醇誘導型ALP同工酶（corticosteroid-induced ALP isoenzyme），腎上腺皮質功能亢進時大量糖皮質酮誘導此同工酶大量合成，使血清ALP顯著且持續升高，是犬庫興氏症最具特徵性的血液生化異常。","we":["A. AST在庫興氏症時可能輕微上升，但並非最典型、最顯著的變化。","B. ALT可能因肝細胞病變輕度上升，但皮質醇誘導型同工酶特異性作用於ALP，非ALT。","（正確）C. 犬有皮質醇誘導型ALP同工酶，腎上腺皮質功能亢進時ALP顯著上升，是最典型的酵素變化。","D. GGT在貓庫興氏症較具意義，犬庫興氏症最顯著的仍是ALP而非GGT。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_074","year":2025,"roc_year":114,"session":"","examNo":74,"q":"腦垂腺矮小症（pituitary dwarfism）病犬，施行生長激素（GH）刺激試驗前、後之GH值，最有可 能各為多少μg/L？","opts":["A. 0.4→0.8","B. 120→130","C. 3→30","D. 20→30"],"ans":0,"exp":"腦垂腺矮小症（pituitary dwarfism）犬GH基礎值極低（< 1 μg/L），且施行刺激試驗後GH仍無法正常升高（反應缺乏），預期前後值均極低（如0.4→0.8 μg/L）；正常犬基礎值約1-3 μg/L，刺激後可升至10-30 μg/L。","we":["（正確）A. 腦垂腺矮小症犬GH基礎值及刺激後值均極低（如0.4→0.8 μg/L），反映GH分泌嚴重不足。","B. 基礎值120 μg/L遠超正常上限，代表GH過高（如肢端肥大症），非矮小症。","C. 3→30 μg/L為正常犬的合理反應，不符合矮小症（應無反應）。","D. 20→30 μg/L的基礎值偏高，接近正常犬或輕度GH過多，不符合矮小症表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_075","year":2025,"roc_year":114,"session":"","examNo":75,"q":"下列有關血液容積低下（hypovolemia）的敘述何者正確？","opts":["A. 主要會由主動脈弓的壓力感受器（baroreceptor）感知，造成血管擴張以增加血液之灌流","B. 會增加腎小管對鈉及氯離子的重吸收","C. 此時血中滲透壓偏低","D. aldosterone分泌下降"],"ans":1,"exp":"Hypovolemia時RAAS系統活化，aldosterone增加促進腎小管對鈉及氯的重吸收以恢復血容量；壓力感受器感知後引起交感神經活化造成血管收縮（非擴張）；血液濃縮使滲透壓上升；aldosterone分泌增加（非下降）。","we":["A. 血容低下時壓力感受器感知後引起交感活化及血管收縮（非擴張），以維持血壓。","（正確）B. Hypovolemia活化RAAS，aldosterone促進腎小管重吸收鈉及氯（帶水），以恢復血容量。","C. 血容低下時血液濃縮，血漿滲透壓偏高而非偏低；ADH增加促進水分重吸收。","D. Hypovolemia造成腎灌流下降，激活RAAS使aldosterone分泌增加，而非下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_076","year":2025,"roc_year":114,"session":"","examNo":76,"q":"下列何者不是計算血漿滲透壓（osmolality）之主要物質？","opts":["A. ","B. glucose","C. BUN","D. protein"],"ans":3,"exp":"血漿滲透壓計算公式：Osmolality ≈ 2×[Na+] + glucose/18 + BUN/2.8；蛋白質（protein）雖為血漿膠體滲透壓（oncotic pressure）的主要成分，但因分子量大、莫耳濃度極低，對滲透壓（osmolality）貢獻可忽略不計，故不列入計算公式。","we":["A. 鈉離子（Na+）是決定血漿滲透壓最重要的陽離子，公式中以2×[Na+]計算（含伴隨陰離子）。","B. Glucose對滲透壓有顯著貢獻，尤其在高血糖時（如糖尿病）可顯著升高滲透壓。","C. BUN（尿素氮）屬於可自由擴散的滲透物質，計算有效滲透壓時有時需納入考量。","（正確）D. 蛋白質分子量大、莫耳濃度極低，對滲透壓（osmolality）貢獻可忽略，不列入計算公式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_077","year":2025,"roc_year":114,"session":"","examNo":77,"q":"下列有關測量TCO 2的敘述何者明顯錯誤？","opts":["A. 有大量肌肉受損時若用離子選擇電極（ion selective electrode）測量法會造成偽高值","B. 可藉由血液氣體計算得知","C. 測量時血液必須裝滿，不能有氣體在管內","D. 一般在例行性生化測試時是穩定的"],"ans":0,"exp":"大量肌肉受損時，細胞釋放大量磷酸根及有機酸，反而會消耗碳酸氫根，造成代謝性酸中毒使TCO2偏低，而非偽高；因此選項A的「造成偽高值」敘述明顯錯誤。TCO2可由血液氣體計算，測量時需充滿管避免CO2逸散，例行生化測試中相對穩定均為正確敘述。","we":["（正確）A. 大量肌肉受損造成代謝性酸中毒，TCO2（HCO3-）下降而非上升；敘述「偽高值」明顯錯誤。","B. TCO2可由血液氣體分析中的HCO3-計算得知，敘述正確。","C. 測TCO2時需血液充滿管避免CO2逸散導致數值偏低，敘述正確。","D. 在例行性生化測試（如密封試管）條件下，TCO2相對穩定，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_078","year":2025,"roc_year":114,"session":"","examNo":78,"q":"下列那一項是最有可能造成anion gap變低的原因？","opts":["A. 肝硬化（cirrhosis）","B. 維他命D不足","C. 急性腎病","D. 有機酸的增加"],"ans":0,"exp":"Anion gap = [Na+] - ([Cl-] + [HCO3-])，白蛋白是主要的未測定陰離子；肝硬化造成低白蛋白血症，未測定陰離子減少，使AG降低。維他命D不足、急性腎病及有機酸增加均造成AG升高（代謝性酸中毒）。","we":["（正確）A. 肝硬化造成低白蛋白血症，白蛋白為主要未測定陰離子，其減少直接降低anion gap。","B. 維他命D不足影響鈣磷代謝，與anion gap降低無直接關聯。","C. 急性腎病造成有機酸及磷酸鹽蓄積，屬高AG代謝性酸中毒，AG升高而非降低。","D. 有機酸增加（如乳酸、酮酸）是高AG代謝性酸中毒的典型原因，造成AG升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_079","year":2025,"roc_year":114,"session":"","examNo":79,"q":"關於低鈉血症（hyponatremia）的敘述，下列何者最為適當？","opts":["A. 腦細胞會最先受到影響而出現神經症狀","B. 最常造成低血鈉的病因之一為腎上腺功能亢進（hyperadrenocorticism）","C. 常繼發於長期處於低血糖狀態之動物","D. thiazide類的利尿劑使用可能造成犬貓的鈉鉀離子與水分的過度排除"],"ans":0,"exp":"低鈉血症造成細胞外液低滲透壓，水分移入腦細胞導致腦水腫，腦細胞最早受到影響而出現神經症狀（嗜睡、癲癇等）；低鈉血症常見原因為腎上腺皮質功能低下（非亢進）；與低血糖無繼發關係；thiazide利尿劑促進鈉排泄是低鈉血症的可能原因，但描述為「過度排除鈉鉀離子與水分」不完全準確（thiazide主要排鈉，保鉀利尿劑保鉀）。","we":["（正確）A. 低鈉血症使細胞外液低滲，水分大量進入腦細胞造成腦水腫，腦細胞最早出現神經症狀。","B. 低鈉血症的常見原因是腎上腺皮質功能低下（Addison's disease）而非亢進（Cushing's）。","C. 低血糖與低鈉血症無繼發關係；低鈉血症主要源於水分失衡或鈉流失。","D. Thiazide利尿劑確實促進鈉排泄可造成低鈉，但其描述為「排除鈉鉀」不精確，thiazide反而保鉀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_實診_080","year":2025,"roc_year":114,"session":"","examNo":80,"q":"下列何種原因常會造成呼吸性鹼中毒？","opts":["A. 全身性麻醉","B. 高熱","C. 氣胸","D. 肉毒桿菌毒素中毒"],"ans":1,"exp":"高熱（高體溫）會刺激呼吸中樞引發過度換氣，導致CO₂排出增加，造成呼吸性鹼中毒。全身麻醉、氣胸及肉毒桿菌毒素均會抑制呼吸或影響肺功能，導致CO₂蓄積造成呼吸性酸中毒，而非鹼中毒。","we":["全身麻醉會抑制呼吸，導致CO₂蓄積，造成呼吸性酸中毒而非鹼中毒。","（正確）高熱刺激呼吸中樞引發過度換氣，CO₂排出增加，是呼吸性鹼中毒的常見原因。","氣胸導致肺部無法正常通氣，CO₂蓄積，造成呼吸性酸中毒。","肉毒桿菌毒素造成神經肌肉麻痺，呼吸肌無力→CO₂蓄積→呼吸性酸中毒。"],"needs_review":false,"imgs":[]}];

function compressImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=720;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function loadProgress(){

    if(d.unsureSet)unsureSet=d.unsureSet;

    const qs=getQs();

  const msg=unanswered.length===qs.length
    ?`開始測驗：${label}（${qs.length} 題）？`
    :`「${label}」還有 ${unanswered.length} 題未作答。\n\n• 繼續作答剩餘題目：點「繼續」\n• 重新測驗全部：點「重新開始」`;
  if(unanswered.length===qs.length){
    if(!confirm(msg))return;
  }else{
    const choice=confirm(msg+'\n\n（確定 = 重新開始，取消 = 繼續作答）');
    if(choice){
      qs.forEach(q=>{delete qStates[q.id];delete errorCounts[q.id];delete unsureSet[q.id];});
      state={qi:0,done:0,cor:0};saveProgress();
    }else{
      const firstUnanswered=qs.findIndex(q=>!qStates[q.id]);
      if(firstUnanswered>=0)state.qi=firstUnanswered;

  }
  mode=0;
