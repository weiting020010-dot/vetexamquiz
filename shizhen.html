常用於新生仔畜初乳免疫球蛋白評估。","we":["總蛋白以三氯醋酸沉澱法（或雙縮脲法）測定，配對正確。","白蛋白以溴甲酚氯（BCG）法測定，配對正確。","（正確）纖維素原不用硫酸鋅混濁試驗；硫酸鋅混濁試驗用於測定免疫球蛋白（新生仔畜初乳評估），此配對錯誤。","球蛋白以免疫擴散法或計算法（TP-Alb）測定，配對正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_036","year":2015,"roc_year":104,"session":"2","examNo":36,"q":"若於血清電泳圖中發現單源性γ-球蛋白病（monoclonal gammopathy），下列判讀何者正確？","opts":["A. 由多種γ-球蛋白所形成","B. 常見於漿細胞性骨髓瘤","C. 可見於免疫性疾病","D. 由多細胞來源之免疫球蛋白所致"],"ans":1,"exp":"單源性γ-球蛋白病（monoclonal gammopathy）是由單一細胞株（clone）產生的均一性免疫球蛋白，在電泳圖上呈現尖峰狀窄帶。常見於漿細胞性骨髓瘤（multiple myeloma）、淋巴瘤等漿細胞增生性疾病，而非免疫性疾病（多源性，polyclonal）。","we":["單源性（monoclonal）由單一細胞株形成，不是由多種γ-球蛋白形成（多源性才是多種）。","（正確）漿細胞性骨髓瘤（plasma cell myeloma）是monoclonal gammopathy最常見原因，電泳出現M-protein尖峰。","免疫性疾病（如慢性感染、免疫媒介性疾病）通常引起多源性γ-球蛋白病（polyclonal），不是單源性。","單源性（monoclonal）來自單一細胞株，不是多細胞來源（多細胞來源是polyclonal）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_037","year":2015,"roc_year":104,"session":"2","examNo":37,"q":"下列關於低蛋白血症（hypoproteinemia）之敘述，何者錯誤？","opts":["A. 當有低蛋白血症時，常會伴隨球蛋白之降低","B. 駒有免疫不全病時，不但免疫球蛋白合成異常，同時也會有細胞媒介性免疫的缺陷","C. 散播性血管內凝血可使纖維素原降低，但常不足以構成低蛋白血症","D. 新生仔畜未吸收足量初乳，球蛋白會呈現極低值"],"ans":0,"exp":"低蛋白血症（hypoproteinemia）通常是白蛋白降低，但球蛋白不一定同時降低（肝病時白蛋白降低但球蛋白可升高）。因此「常會伴隨球蛋白之降低」是錯誤的陳述。其他選項均為正確：駒免疫不全同時有體液和細胞免疫缺陷；DIC可降低纖維素原；新生仔畜未吸初乳確實球蛋白極低。","we":["（正確）低蛋白血症主要是白蛋白降低，球蛋白可能正常甚至升高（如肝病代償性免疫反應），此敘述錯誤。","駒免疫不全病（如combined immunodeficiency）同時影響B細胞和T細胞功能，細胞媒介性免疫確實也有缺陷，此敘述正確。","DIC確實消耗纖維素原，但通常纖維素原降低不足以構成全面性低蛋白血症，此敘述正確。","新生仔畜未吸收足量初乳，免疫球蛋白（球蛋白）無法被動獲得，球蛋白確實呈現極低值，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_038","year":2015,"roc_year":104,"session":"2","examNo":38,"q":"何種動物於血糖值100 mg/dL時，就可能會有尿糖出現？","opts":["A. 牛","B. 犬","C. 貓","D. 雞"],"ans":0,"exp":"牛的腎糖閾（renal threshold for glucose）極低，約為100 mg/dL（正常血糖值），因此牛在血糖值100 mg/dL時即可能出現尿糖。犬的腎糖閾約180-200 mg/dL，貓約250-300 mg/dL。牛腎糖閾低是其生理特性，臨床上即使輕微高血糖也易出現尿糖。","we":["（正確）牛的腎糖閾極低（約100 mg/dL），接近正常血糖值，輕微血糖升高即可出現尿糖。","犬的腎糖閾約180-200 mg/dL，血糖100 mg/dL時不會出現尿糖。","貓的腎糖閾約250-300 mg/dL，血糖100 mg/dL時更不會出現尿糖。","雞（禽類）的腎糖閾相對較高，不會在100 mg/dL時出現尿糖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_039","year":2015,"roc_year":104,"session":"2","examNo":39,"q":"當病畜罹患急性肝病及圓蟲病時，其血清蛋白質電泳，下列何者會增加？","opts":["A. α-球蛋白帶","B. β-球蛋白帶","C. γ-球蛋白帶","D. 纖維蛋白帶"],"ans":0,"exp":"急性肝病及急性炎症時，肝臟合成急性期蛋白（acute phase proteins），包括α1-抗胰蛋白酶、α2-巨球蛋白等，均在α-球蛋白帶遷移。圓蟲病（寄生蟲感染）也會刺激急性期反應，使α-球蛋白帶增加。慢性感染才主要使γ-球蛋白增加。","we":["（正確）急性肝病及急性感染（圓蟲病）刺激急性期反應，肝臟產生大量α-球蛋白（急性期蛋白），使α-球蛋白帶增加。","β-球蛋白帶在鐵缺乏（transferrin升高）或某些急性期反應時增加，不是急性肝病及圓蟲病的主要表現。","γ-球蛋白帶增加見於慢性感染、免疫刺激，急性期主要是α-球蛋白增加。","纖維蛋白帶（fibrinogen）在SPEP上不常規出現，且急性肝病時可能降低（合成減少）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_040","year":2015,"roc_year":104,"session":"2","examNo":40,"q":"脂血症會使下列何種檢驗值降低？","opts":["A. 血糖","B. 鈣離子","C. 脂肪酶","D. ALT"],"ans":0,"exp":"脂血症（lipemia）中大量脂質微粒散射光線，干擾比色法測定，造成許多檢驗值假低（體積排除效應+光學干擾）。血糖（glucose）以比色酵素法測定時，脂血症會造成假低值（稀釋效應及光吸收干擾）。鈣、ALT等也可能受影響，但血糖是最常被提及的假低值例子。","we":["（正確）脂血症造成體積排除及光學干擾，使血糖（glucose）呈現假低值，是常見的干擾效應。","鈣離子在脂血症時也可能呈假低值，但血糖是本題最典型的標準答案。","脂肪酶（lipase）在脂血症時實際上可能升高（脂肪代謝活躍），不是假低值。","ALT以酵素法測定，脂血症可造成ALT假低值，但血糖是教科書上最常強調的典型例子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_041","year":2015,"roc_year":104,"session":"2","examNo":41,"q":"犬貓何者之血中濃度通常不會因corticosteroids的使用而上升？","opts":["A. AST","B. BUN","C. glucose","D. calcium"],"ans":0,"exp":"Corticosteroids（皮質類固醇）使用後，在犬貓常見：BUN升高（蛋白質分解代謝增加）、glucose升高（糖異生增加）、calcium升高（部分情況）；但AST（天門冬酸鹽轉氨酶）主要反映肌肉或肝細胞損傷，類固醇不直接誘導AST上升（ALP和ALT才會因類固醇效應而上升）。","we":["（正確）AST不受corticosteroids直接誘導上升；類固醇主要誘導ALP（犬有類固醇誘導型ALP同工酶）和ALT上升。","BUN因類固醇促進蛋白質分解代謝而升高，會受影響。","Glucose因類固醇促進糖異生及胰島素抵抗而升高，會受影響。","Calcium在某些類固醇相關情況（如多發性骨髓瘤治療、高腎上腺皮質功能症）可能升高，會受影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_042","year":2015,"roc_year":104,"session":"2","examNo":42,"q":"下列何者之血中濃度通常不因phenobarbital的影響而上升？","opts":["A. GGT","B. ALT","C. total bilirubin","D. ALP"],"ans":2,"exp":"Phenobarbital為肝臟微粒體酵素誘導劑，在犬會誘導ALP、GGT、ALT上升（酵素誘導效應）。Total bilirubin通常不因phenobarbital使用而顯著上升（膽道不阻塞時，膽紅素代謝正常）。若有明顯bilirubin升高，需考慮是否合併肝臟疾病。","we":["GGT因phenobarbital的酵素誘導效應而上升，會受影響。","ALT因phenobarbital誘導肝細胞微粒體活性及輕度肝毒性而上升，會受影響。","（正確）Total bilirubin通常不因phenobarbital使用而明顯上升，不在酵素誘導的典型變化中。","ALP因phenobarbital強力誘導肝臟ALP合成而顯著上升，是最常見變化之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_043","year":2015,"roc_year":104,"session":"2","examNo":43,"q":"犬的ALP活性值上升通常不發生在以下那種疾病或狀態？","opts":["A. 骨折","B. 庫興氏症候群（Cushing's syndrome）","C. 吃了初乳","D. 犬隻口服levamisole後"],"ans":2,"exp":"犬ALP活性上升的常見原因：骨折（骨源性ALP）、庫興氏症候群（類固醇誘導ALP同工酶）、口服levamisole（肝臟酵素誘導）。吃了初乳（colostrum）是仔貓/仔犬腸道ALP上升的原因，在貓幼仔中可見，但在成犬並不常見。此題問「通常不發生」，選「吃了初乳」作為不會使犬ALP上升的選項，但實際上更嚴謹的答案是此現象較少見於成年犬。","we":["骨折時骨源性ALP上升，犬ALP確實會升高。","庫興氏症候群（Cushing's）有類固醇誘導型ALP同工酶，犬ALP可大幅升高。","（正確）吃了初乳使腸道ALP升高在仔豬/仔牛中明顯，但在犬並非主要使血中ALP上升的原因，是本題中最不常見的情況。","Levamisole口服後在犬有肝臟酵素誘導效應，會使ALP升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_044","year":2015,"roc_year":104,"session":"2","examNo":44,"q":"犬若罹患膽道阻塞，其ALP、GGT、膽汁酸（BA）及膽紅素（BR）上升幅度之排序通常為","opts":["A. GGT＞ALP＞BA＞BR","B. GGT＞ALP＞BR＞BA","C. ALP＞GGT＞BA＞BR","D. ALP＞GGT＞BR＞BA"],"ans":2,"exp":"犬膽道阻塞時，膽汁淤積指標的上升幅度排序通常為：ALP上升幅度最大（有膽汁淤積誘導型ALP同工酶，且半衰期長約70小時）＞GGT＞膽汁酸（BA）＞膽紅素（BR）。ALP的半衰期長且有膽汁誘導合成，因此上升最顯著；GGT次之；膽紅素通常最後才顯著升高。","we":["GGT＞ALP的排序不正確，犬中ALP上升幅度通常大於GGT（貓則相反）。","GGT＞ALP＞BR＞BA的排序不正確，犬ALP上升幅度最大。","（正確）犬膽道阻塞時上升幅度：ALP＞GGT＞BA＞BR，ALP因類固醇和膽汁淤積雙重誘導而上升最顯著。","ALP＞GGT＞BR＞BA的排序中BR排在BA前，通常BA比BR更敏感，BA應早於BR升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_045","year":2015,"roc_year":104,"session":"2","examNo":45,"q":"下列何種家畜罹患鈎端螺旋體症時會伴發反流性高膽紅素血症？","opts":["A. 牛","B. 山羊","C. 犬","D. 豬"],"ans":2,"exp":"犬感染鉤端螺旋體（Leptospira）時，除了直接腎臟/肝臟損傷外，還會引起溶血性黃疸及肝細胞性黃疸，合併反流性（regurgitative）高膽紅素血症（膽道受阻或膽汁淤積）。犬是鉤端螺旋體症中最容易伴發反流性高膽紅素血症的動物。","we":["牛感染鉤端螺旋體症主要以溶血性貧血為主，不特別以反流性高膽紅素血症著稱。","山羊感染鉤端螺旋體症不是反流性高膽紅素血症的典型代表。","（正確）犬感染鉤端螺旋體症時易伴發反流性高膽紅素血症（肝炎+膽汁淤積），是教科書中的典型例子。","豬感染鉤端螺旋體症主要表現為流產和繁殖障礙，不以高膽紅素血症為主要特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_046","year":2015,"roc_year":104,"session":"2","examNo":46,"q":"下列臨床血清酵素中，何者對馬肝臟障礙診斷特別有用，但因極不安定故須迅速測定？","opts":["A. 山梨醇脫氫酶（SDH）","B. 阿金氨酸酶（arginase）","C. 氨基丙酸轉氨酶（ALT）","D. 天門冬酸鹽轉氨酶（AST）"],"ans":0,"exp":"山梨醇脫氫酶（SDH, sorbitol dehydrogenase）在馬對肝臟損傷特異性高、敏感性強，但SDH極不穩定，需在採血後數小時內立即測定（室溫下4-6小時即失活），是馬肝臟診斷的重要但需迅速測定的指標。ALT在馬的肝臟特異性不高。","we":["（正確）SDH（山梨醇脫氫酶）對馬肝臟損傷高度特異，但極不穩定，需迅速測定，是馬肝臟診斷的關鍵酵素。","阿金氨酸酶（arginase）雖對肝臟有一定特異性，但不如SDH，且不是「極不穩定需迅速測定」的代表。","ALT（氨基丙酸轉氨酶）在馬的肝臟特異性差，主要用於犬貓肝臟診斷。","AST（天門冬酸鹽轉氨酶）在馬常用但特異性差（肌肉也含AST），且穩定性優於SDH，不是「需迅速測定」的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_047","year":2015,"roc_year":104,"session":"2","examNo":47,"q":"健康犬血中GGT活性值之半衰期約為若干小時？","opts":["A. 12","B. 32","C. 52","D. 72"],"ans":3,"exp":"健康犬血中GGT活性值的半衰期約為72小時（3天）。了解半衰期有助於判斷酵素升高後的恢復時間，以及連續監測的時間間隔。ALP半衰期在犬約70小時，ALT約60小時，GGT約72小時。","we":["12小時是過短的估計，不符合犬GGT的已知半衰期。","32小時不符合文獻記載的犬GGT半衰期。","52小時不符合文獻記載的犬GGT半衰期。","（正確）健康犬血中GGT半衰期約72小時，了解此數據有助於疾病監測與康復評估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_048","year":2015,"roc_year":104,"session":"2","examNo":48,"q":"某些乾性貓傳染性腹膜炎造成廣大局部性肝病變時，那項血清生化學檢查值會明顯升高？","opts":["A. 膽紅素","B. 血漿氨值","C. 凝血因子","D. 白蛋白"],"ans":0,"exp":"乾性貓傳染性腹膜炎（dry FIP）造成廣大局部性肉芽腫性肝病變時，肝細胞功能受損，膽紅素代謝障礙，血清膽紅素明顯升高（黃疸）。血漿氨值在大量肝功能喪失時才升高；凝血因子和白蛋白在慢性廣泛損傷後才降低；而膽紅素對局部肝病變的敏感性較高。","we":["（正確）乾性FIP廣大肝病變造成肝細胞損傷及膽汁淤積，血清膽紅素（bilirubin）會明顯升高。","血漿氨值在大部分功能性肝實質細胞喪失（>70-80%）後才升高，局部病變不一定升高。","凝血因子通常在嚴重廣泛肝病才顯著降低，本題問「明顯升高」，凝血因子是降低而非升高。","白蛋白在慢性廣泛性肝病才降低，且問題問「明顯升高」，白蛋白在肝病時是降低的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_049","year":2015,"roc_year":104,"session":"2","examNo":49,"q":"若發現AST及ALT在短時間內急劇下降，表示可能","opts":["A. 病程仍在進行中","B. 功能性肝實質細胞數已不多","C. 肝細胞已再生／修復過程","D. 肝細胞可能仍持續受到傷害"],"ans":1,"exp":"若AST及ALT在短時間內急劇下降，有兩種可能：①肝臟已經康復；②功能性肝實質細胞數目已所剩無幾（大量肝細胞壞死後，已無足夠細胞可釋出酵素）。臨床上若同時有黃疸加重、凝血功能惡化，則急劇下降意味著肝細胞幾乎已耗盡，預後極差。","we":["病程仍在進行中時，AST/ALT應持續升高或維持高值，而非急劇下降。","（正確）功能性肝實質細胞數已極少（大量壞死），無足夠細胞繼續釋放AST/ALT，導致數值急劇下降，是最危險的徵象。","肝細胞再生/修復時，酵素會緩慢下降並伴隨臨床改善，不是「急劇」下降的典型解釋。","肝細胞持續受傷害時酵素應持續升高或維持高值，不符合急劇下降的情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_050","year":2015,"roc_year":104,"session":"2","examNo":50,"q":"腸道來源的ALP很少是血中ALP上升之主因，但那一種動物除外？","opts":["A. 貓","B. 馬","C. 牛","D. 雞"],"ans":1,"exp":"腸道來源的ALP（intestinal ALP isoenzyme）通常在血中濃度低，對大多數動物血中ALP總活性貢獻甚小。但馬例外，馬的腸道ALP穩定且半衰期長（約72小時），腸道ALP是馬血中ALP的重要來源，因此腸道ALP在馬確實可以是血中ALP升高的主因之一。","we":["貓的ALP主要來源為肝臟和骨骼，腸道ALP貢獻小，且貓ALP半衰期很短（約6小時）。","（正確）馬的腸道ALP同工酶穩定且在血中貢獻顯著，是腸道ALP可作為血中ALP上升主因的特殊動物。","牛的血中ALP主要來源為肝臟和骨骼，腸道ALP貢獻不特別突出。","雞（禽類）ALP主要為骨骼和肝臟來源，腸道ALP不是主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_051","year":2015,"roc_year":104,"session":"2","examNo":51,"q":"下列有關蘇丹（Sudan）III 或 IV 染色稀釋糞便抹片之敘述，何者正確？","opts":["A. 未加酸加熱即可將肪脂酸染色","B. 未加酸加熱即可將肥皂染色","C. 加酸加熱後可看到多量脂肪滴者表示吸收不良","D. 胰外分泌不足病畜需加酸加熱後才可看到多量脂肪滴"],"ans":2,"exp":"蘇丹III/IV染色未加酸加熱（直接染色）可將中性脂肪（triglycerides/fat droplets）染成橘紅色；加酸加熱後可進一步將脂肪酸和皂化脂肪（肥皂）也染色。加酸加熱後看到多量脂肪滴表示脂肪消化吸收不良（steatorrhea）。胰外分泌不足時，未消化中性脂肪多，未加酸加熱即可見大量脂肪滴，不需加酸加熱。","we":["未加酸加熱可將中性脂肪（三酸甘油脂/fat droplets）染色，不是脂肪酸（脂肪酸需加酸加熱才染色）。","未加酸加熱不能將肥皂（皂化脂肪酸）染色，肥皂也需加酸加熱後才可被蘇丹染色。","（正確）加酸加熱後可看到多量脂肪滴（脂肪酸+皂化脂肪），表示脂肪消化吸收不良（如小腸吸收障礙）。","胰外分泌不足（EPI）時，中性脂肪未被消化，未加酸加熱即可看到多量脂肪滴，不需加酸加熱才能看到。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_052","year":2015,"roc_year":104,"session":"2","examNo":52,"q":"牛骨骼肌嚴重受損後CK、ALT及AST活性值上升速度快慢之排序通常為","opts":["A. CK＞AST＞ALT","B. CK＞ALT＞AST","C. ALT＞CK＞AST","D. ALT＞AST＞CK"],"ans":0,"exp":"牛骨骼肌受損後，CK（肌酸激酶）因分子小、局部濃度高，最先快速上升；AST次之（分子較大，釋放稍慢）；牛ALT在肌肉含量極少，上升最慢或不明顯。因此速度排序為CK＞AST＞ALT。注意牛與犬貓不同，牛ALT對肌肉損傷反應不敏感。","we":["（正確）牛骨骼肌損傷後CK最先快速上升，AST次之，ALT上升最慢（牛肌肉ALT含量少），排序為CK＞AST＞ALT。","CK＞ALT＞AST不正確，牛肌肉中AST含量高於ALT，AST應比ALT更早上升。","ALT＞CK＞AST完全不正確，CK永遠是肌肉損傷最先上升的。","ALT＞AST＞CK完全不正確，CK才是肌肉損傷最敏感最先上升的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_053","year":2015,"roc_year":104,"session":"2","examNo":53,"q":"有關犬貓肌肉疾病之實驗室診斷敘述，下列何者錯誤？","opts":["A. 高血鈣最常為大範圍肌肉受損之離子變化","B. natriuretic peptide為心肌功能之指標，可在心衰竭時見到上升","C. troponin為心肌受損之指標，但也見於腎衰竭病患","D. dystrophin缺乏可導致肌肉退行性變化或壞死"],"ans":0,"exp":"大範圍肌肉受損後最常見的電解質變化是高磷血症（hyperphosphatemia）和低鈣血症，以及高鉀血症，不是高血鈣。肌肉細胞含有大量磷酸根，破壞後釋放大量磷，造成高磷血症；同時肌肉壞死可引起肌紅蛋白尿及腎損傷。高血鈣不是典型的大範圍肌肉損傷表現。","we":["（正確）高血鈣不是大範圍肌肉受損的典型離子變化，應為高磷血症；此敘述錯誤。","Natriuretic peptide（BNP/ANP）確為心肌功能指標，心衰竭時升高，此敘述正確。","Troponin確為心肌受損指標，但腎衰竭患者也可因腎臟清除減少而見troponin升高，此敘述正確。","Dystrophin缺乏（如杜氏肌肉失養症）確實導致肌肉細胞膜不穩定，引起退行性變化或壞死，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_054","year":2015,"roc_year":104,"session":"2","examNo":54,"q":"下列何種乳酸鹽脫氫酶（LDH）之異構酶主要存在於心肌及腎？","opts":["A. LDH1","B. LDH2","C. LDH3","D. LDH5"],"ans":0,"exp":"乳酸鹽脫氫酶（LDH）有5種同工酶（LDH1-5）。LDH1（H4型，由4個H次單元組成）主要存在於心肌和腎臟，在心肌梗塞時最先升高。LDH5（M4型）主要存在於肝臟和骨骼肌。","we":["（正確）LDH1（H4同工酶）主要分布於心肌和腎臟，心肌損傷時LDH1最先且最顯著升高。","LDH2（H3M1）也在心臟分布，但LDH1才是心肌和腎臟的主要同工酶。","LDH3（H2M2）主要在肺臟和脾臟，不是心肌/腎臟的主要同工酶。","LDH5（M4）主要在肝臟和骨骼肌，不是心肌/腎臟的同工酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_055","year":2015,"roc_year":104,"session":"2","examNo":55,"q":"貓隻尿液檢查，比重為1.005時，最可能的原因為下列何者？","opts":["A. 水分與溶質流失均增加","B. 水分流失增加，但溶質流失並未增加","C. 水分流失減少，但溶質流失並未減少","D. 水分與溶質流失均減少"],"ans":2,"exp":"貓正常尿比重為1.035-1.060。比重1.005非常接近純水（1.000），屬於低比重尿（hyposthenuria），表示尿液極度稀釋。這種情況發生在水分攝入量大（排出大量稀尿）而溶質排出相對減少，即水分流失增加而溶質流失未等比增加；或ADH缺乏（尿崩症）、腎臟無法濃縮尿液。","we":["水分與溶質流失均增加時，尿比重不一定會降低到1.005，可能維持等滲。","水分流失增加但溶質不增加，反而應使尿液更稀釋，比重降低，這接近正確，但措辭需更準確。","（正確）尿比重1.005（hyposthenuria）表示腎臟排出大量稀釋尿，水分流失增加但溶質流失未相應增加（如尿崩症或過度飲水）。","水分與溶質流失均減少時，尿量少且濃縮，比重應升高，不符合1.005低比重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_056","year":2015,"roc_year":104,"session":"2","examNo":56,"q":"當犬隻尿液檢查，pH值為8.0時，下列敘述那一項為最可能的原因？","opts":["A. 攝食高蛋白飲食","B. 患犬有嚴重嘔吐","C. ethylene glycol中毒","D. 尿道細菌感染"],"ans":3,"exp":"尿液pH 8.0為鹼性尿。尿道細菌感染（尤其是產尿素酶細菌如Proteus、Staphylococcus等）會分解尿素產生氨，使尿液呈鹼性（pH升高至8.0或以上）。攝食高蛋白飲食、嚴重嘔吐（代謝性鹼血症雖可產生鹼性尿，但同時有低氯）、乙二醇中毒（酸性尿）均不是鹼性尿的最典型原因。","we":["高蛋白飲食產生較多酸性代謝產物，反而導致酸性尿，不是pH 8.0的原因。","嚴重嘔吐造成代謝性鹼血症，可使尿液偏鹼，但最典型的鹼性尿原因是細菌感染。","Ethylene glycol中毒造成草酸鹽沉積及代謝性酸血症，尿液為酸性，不會造成pH 8.0。","（正確）尿道細菌感染（產尿素酶菌）分解尿素產生NH3，使尿液呈強鹼性（pH 8.0以上），是最典型原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_057","year":2015,"roc_year":104,"session":"2","examNo":57,"q":"犬貓正常尿之尿渣檢查時，下列何者最常被檢出？","opts":["A. 胱氨酸結晶","B. 酵母菌顆粒","C. 腎小管上皮細胞","D. 顆粒性圓柱"],"ans":2,"exp":"正常犬貓尿渣中可見少量腎小管上皮細胞（renal tubular epithelial cells），這是正常生理性脫落。胱氨酸結晶為病理性（胱氨酸尿症）；酵母菌為汙染；顆粒性圓柱為病理性（腎小管損傷）。腎小管上皮細胞在正常尿中少量存在是最常見的細胞性成分。","we":["胱氨酸結晶（cystine crystals）為病理性，見於胱氨酸尿症，正常尿中不應出現。","酵母菌顆粒通常為汙染，不是正常尿渣成分。","（正確）腎小管上皮細胞在正常犬貓尿渣中可少量出現（生理性脫落），是正常尿渣中最常見的細胞。","顆粒性圓柱（granular casts）表示腎小管損傷，在病理狀態下出現，正常尿中不常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_058","year":2015,"roc_year":104,"session":"2","examNo":58,"q":"下列變化何者不是腎病症候群（nephrotic syndrome）的特徵？","opts":["A. 蛋白尿","B. 高膽固醇血症","C. 高蛋白血症","D. 產生腹水"],"ans":2,"exp":"腎病症候群（nephrotic syndrome）的四大特徵：①大量蛋白尿、②低蛋白血症（低白蛋白血症）、③高膽固醇血症（代償性脂蛋白合成增加）、④水腫/腹水。高蛋白血症（hyperproteinemia）不是腎病症候群特徵，恰恰相反是低蛋白血症，因此C選項「高蛋白血症」是不正確的特徵。","we":["蛋白尿是腎病症候群最核心的特徵（絲球體濾過屏障受損，大量蛋白漏出），是正確特徵。","高膽固醇血症是腎病症候群特徵（肝臟代償性合成脂蛋白增加），是正確特徵。","（正確）高蛋白血症不是腎病症候群的特徵，腎病症候群因蛋白大量流失造成低蛋白血症（尤其低白蛋白血症）。","腹水（因低蛋白血症→膠體滲透壓降低→液體滲出）是腎病症候群的特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_059","year":2015,"roc_year":104,"session":"2","examNo":59,"q":"有關馬之鈣代謝的敘述，下列何者正確？","opts":["A. 馬之尿排出量減少時，會引起高血鈣症","B. 馬正常即易出現假性高副甲狀腺功能症","C. 馬之腸道比其他動物易吸收鈣","D. 馬比其他動物易罹患代謝性酸血症引發鈣離子滯留"],"ans":2,"exp":"馬的鈣代謝特殊：馬腸道對鈣的吸收比其他動物更有效率（腸道為主要吸收途徑），腸道大量吸收鈣後，主要透過腎臟將多餘鈣排出（馬尿液富含碳酸鈣沉澱）。因此馬比其他動物更易出現高血鈣（尿排出減少時），且馬尿液中鈣含量很高為正常現象。","we":["馬尿排出量減少時，確實可能引起高血鈣，此敘述可能部分正確，但本題問「何者正確」，C選項更準確。","馬正常不會出現假性高副甲狀腺功能症，此敘述有誤。","（正確）馬腸道對鈣的吸收能力比其他動物強，因此腎臟需大量排泄多餘鈣（馬尿液含高鈣），此為馬的特殊鈣代謝特點。","馬比其他動物更易罹患代謝性鹼血症（因腸道大量吸收鈣相關），不是酸血症，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_060","year":2015,"roc_year":104,"session":"2","examNo":60,"q":"犬疑患腎絲球體病變時，下列何種檢驗方法最為敏感？","opts":["A. serum creatinine","B. urine protein / urine creatinine ratio","C. urine dipstick","D. serum BUN / urine BUN ratio"],"ans":1,"exp":"尿蛋白/尿肌酸酐比值（UPC, urine protein/creatinine ratio）是目前最敏感的腎絲球病變篩查方法，能定量評估蛋白尿程度，排除尿液稀釋濃縮因素的影響。血清肌酸酐和BUN在腎功能喪失超過75%時才升高（不夠敏感）；尿dipstick為半定量且受尿液比重影響。","we":["血清肌酸酐（serum creatinine）需腎功能喪失>75%才升高，對早期腎絲球病變不夠敏感。","（正確）尿蛋白/尿肌酸酐比值（UPC ratio）是診斷腎絲球病變最敏感的方法，可早期定量評估蛋白尿。","尿dipstick為半定量檢測，受尿液稀釋影響，敏感性和特異性均不如UPC ratio。","血清BUN/尿BUN比值不是評估腎絲球病變的標準方法，此選項不合臨床應用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_061","year":2015,"roc_year":104,"session":"2","examNo":61,"q":"胰島素的主要目標器官包括：①肝臟 ②紅血球 ③骨骼肌 ④神經元 ⑤腎小管上皮細胞 ⑥脂肪組織","opts":["A. ③④⑥","B. ②④⑤","C. ①②③","D. ①③⑥"],"ans":3,"exp":"胰島素的主要目標器官（需要胰島素才能攝取葡萄糖的組織）為：①肝臟、③骨骼肌、⑥脂肪組織。紅血球（②）、神經元（④）、腎小管上皮細胞（⑤）不需要胰島素即可攝取葡萄糖（非胰島素依賴性），這對於低血糖時優先供應大腦和腎臟能量有重要意義。","we":["③④⑥中神經元（④）為非胰島素依賴性組織，不需胰島素攝取葡萄糖，此組合不正確。","②④⑤中紅血球、神經元、腎小管均為非胰島素依賴性，不是胰島素的主要目標器官。","①②③中紅血球（②）不依賴胰島素，此組合不正確。","（正確）肝臟（①）、骨骼肌（③）、脂肪組織（⑥）是胰島素促進葡萄糖攝取的主要目標器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_062","year":2015,"roc_year":104,"session":"2","examNo":62,"q":"犬罹患高腎上腺皮質功能症不會有下列何種變化？","opts":["A. 高血糖症","B. 淋巴球減少症","C. 嗜酸性球增多症","D. 高膽固醇血症"],"ans":2,"exp":"犬高腎上腺皮質功能症（Cushing's syndrome）的血液學變化：高血糖症（皮質醇促進糖異生）、淋巴球減少症（皮質醇使淋巴球再分布）、高膽固醇血症（脂肪動員增加）。嗜酸性球增多症不是庫興氏症候群的特徵，相反地，皮質醇使嗜酸性球降低（eosinopenia），因此嗜酸性球增多症「不會」出現。","we":["高血糖症是庫興氏症候群的典型表現（皮質醇拮抗胰島素，促進糖異生），確實會出現。","淋巴球減少症是皮質醇的典型效應（淋巴球再分布），確實會出現。","（正確）嗜酸性球增多症不會出現；庫興氏症候群因皮質醇升高反而引起嗜酸性球減少（eosinopenia）。","高膽固醇血症（脂肪動員及脂蛋白合成增加）是庫興氏症候群的常見表現，確實會出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_063","year":2015,"roc_year":104,"session":"2","examNo":63,"q":"會刺激昇糖素（glucagon）分泌的原因為下列那些？①高血糖 ②低血糖 ③類固醇的給予④大量消化及吸收蛋白質","opts":["A. ②③④","B. ①②③","C. ①③④","D. ①②④"],"ans":0,"exp":"刺激升糖素（glucagon）分泌的因素：②低血糖（最主要）、③類固醇給予（皮質醇促進升糖素分泌）、④大量消化吸收蛋白質（胺基酸刺激升糖素，防止低血糖）。高血糖（①）會抑制升糖素分泌（負回饋），因此①②③④中，①不是刺激因素，②③④才是。","we":["（正確）②低血糖、③類固醇給予、④大量消化吸收蛋白質均刺激升糖素分泌；高血糖（①）抑制升糖素，故②③④正確。","①高血糖抑制升糖素分泌，①②③中含有①，不正確。","①③④中含有高血糖（①），高血糖不刺激升糖素，不正確。","①②④中含有高血糖（①），高血糖不刺激升糖素，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_064","year":2015,"roc_year":104,"session":"2","examNo":64,"q":"下列何種犬隻血中T4濃度降低之狀況並不屬於euthyroid sick syndrome？","opts":["A. 懷孕","B. 高腎上腺功能症","C. 糖尿病","D. 肝病"],"ans":0,"exp":"Euthyroid sick syndrome（甲狀腺功能正常病態症候群）指非甲狀腺疾病引起T4降低的情況，常見於：高腎上腺功能症、糖尿病、肝病、腎病、嚴重全身疾病等。懷孕在正常情況下不屬於euthyroid sick syndrome的範疇（懷孕中T4可能正常或輕微變化，不是因病態造成的降低）。","we":["（正確）懷孕不屬於euthyroid sick syndrome；euthyroid sick syndrome是由嚴重全身疾病引起的非甲狀腺疾病性T4降低。","高腎上腺功能症（Cushing's）確實可引起T4降低（euthyroid sick syndrome），屬於此症候群。","糖尿病確實可引起T4降低（euthyroid sick syndrome），屬於此症候群。","肝病確實可引起T4降低（甲狀腺素結合球蛋白降低），屬於euthyroid sick syndrome範疇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_065","year":2015,"roc_year":104,"session":"2","examNo":65,"q":"甲狀腺激素刺激試驗，靜脈注射法通常在注射多少小時後採血測定投藥後之血清總T4和T3值？","opts":["A. 2","B. 4","C. 6","D. 8"],"ans":2,"exp":"甲狀腺激素刺激試驗（TSH stimulation test）：靜脈注射TSH後，通常在注射後6小時採血測定血清T4和T3，此時T4和T3上升到最高點。若注射後6小時T4無顯著上升（<2倍），則支持甲狀腺功能低下症（hypothyroidism）的診斷。","we":["2小時太早，T4尚未達到最高濃度，不是標準採樣時間。","4小時通常T4仍在上升中，不是最佳採樣時間點。","（正確）靜脈注射TSH後6小時採血，T4和T3已達到峰值，是標準採樣時間點。","8小時T4可能已開始下降，不是最佳採樣時間。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_066","year":2015,"roc_year":104,"session":"2","examNo":66,"q":"胰島素／葡萄糖校正比（AIGR）在何值時，可做為功能性胰島素瘤之重要診斷依據？","opts":["A. 小於5","B. 6～10","C. 11～20","D. 大於30"],"ans":3,"exp":"胰島素/葡萄糖校正比（AIGR, Amended Insulin to Glucose Ratio）= [血清胰島素(μU/mL) × 100] / [血糖(mg/dL) - 30]。AIGR大於30時，強烈提示功能性胰島素瘤（insulinoma），因為低血糖時正常應抑制胰島素分泌，若AIGR仍>30則表示胰島素不適當地高分泌。","we":["AIGR小於5表示胰島素分泌正常或偏低，不是胰島素瘤的診斷依據。","AIGR 6-10屬正常範圍，不支持胰島素瘤診斷。","AIGR 11-20為邊界值，需進一步確認，不是「重要診斷依據」的標準切點。","（正確）AIGR大於30是功能性胰島素瘤的重要診斷依據，表示低血糖時胰島素不適當地高分泌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_067","year":2015,"roc_year":104,"session":"2","examNo":67,"q":"下列那一種動物是以腎臟為鈣的主要排泄器官？","opts":["A. 兔","B. 馬","C. 牛","D. 狗"],"ans":1,"exp":"馬是以腎臟為鈣主要排泄器官的特殊動物。大多數動物（犬貓牛等）主要透過腸道控制鈣的排泄（腸道不吸收多餘鈣），但馬腸道大量吸收鈣後，多餘的鈣主要透過腎臟排出，因此馬的尿液含有大量鈣（白濁色），這是馬的正常生理特性。","we":["兔的鈣代謝也有一定特殊性，但主要以腎臟為排泄器官的典型代表是馬，不是兔。","（正確）馬以腎臟為鈣的主要排泄器官，馬尿液中含大量碳酸鈣沉澱，呈白濁色，為正常現象。","牛主要透過腸道（糞便）排泄鈣，不是以腎臟為主。","狗的鈣主要透過腸道控制平衡，腎臟不是主要排泄器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_068","year":2015,"roc_year":104,"session":"2","examNo":68,"q":"細胞內液中主要的陽離子與陰離子分別為","opts":["A. 鉀／重碳酸根離子","B. 鈉／磷酸根離子","C. 鉀／磷酸根離子","D. 鈉／重碳酸根離子"],"ans":2,"exp":"細胞內液（ICF）的主要陽離子為鉀離子（K+，濃度約150 mEq/L），主要陰離子為磷酸根離子（HPO4²⁻，約100 mEq/L）和蛋白質。細胞外液（ECF）的主要陽離子為鈉離子（Na+），主要陰離子為氯離子（Cl⁻）和重碳酸根（HCO3⁻）。","we":["鉀／重碳酸根：陽離子正確（鉀），但重碳酸根是細胞外液的主要陰離子，不是細胞內液。","鈉／磷酸根：鈉是細胞外液陽離子，不是細胞內液主要陽離子。","（正確）細胞內液主要陽離子為鉀（K+），主要陰離子為磷酸根（HPO4²⁻），此配對正確。","鈉／重碳酸根：兩者均為細胞外液成分，不是細胞內液主要離子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_069","year":2015,"roc_year":104,"session":"2","examNo":69,"q":"下列何種物質可在細胞外液與細胞內液間自由進出，故不會改變水的轉向？","opts":["A. 尿素","B. 葡萄糖","C. 鈉離子","D. 乙二醇"],"ans":0,"exp":"尿素（urea）為小分子、不帶電荷，能自由通過細胞膜在細胞外液和細胞內液之間自由擴散，因此不會在細胞膜兩側產生滲透壓差，不會改變水的轉向（不是有效滲透質，ineffective osmole）。葡萄糖（需胰島素才能進入細胞）、鈉離子（主動泵浦維持）、乙二醇（雖可進入細胞但緩慢）均可在細胞膜間建立濃度差。","we":["（正確）尿素（urea）可自由通過細胞膜，為無效滲透質（ineffective osmole），不改變細胞內外水的分布。","葡萄糖在缺乏胰島素時不能自由進入肌肉和脂肪細胞，可在細胞外積聚，是有效滲透質。","鈉離子（Na+）被Na-K-ATPase主動維持在細胞外，是細胞外液主要有效滲透質，可改變水的轉向。","乙二醇（ethylene glycol）主要停留在細胞外液，是有效滲透質，可使水由細胞內移向細胞外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_070","year":2015,"roc_year":104,"session":"2","examNo":70,"q":"血液氣體分析時，應符合下列那些操作事項？①血樣保存在室溫中最晚可於3小時內分析 ②以由大靜脈採血為原則 ③以由大動脈採血為原則 ④送樣時需標註病畜體溫 ⑤血樣需隔絕空氣的干擾 ⑥以EDTA抗凝血液","opts":["A. ①③④","B. ②④⑤","C. ③④⑤","D. ②⑤⑥"],"ans":2,"exp":"血液氣體分析的正確操作：③以動脈血為原則（不是靜脈血，因為需要測量動脈血氧分壓PaO2）、④送樣時需標註病畜體溫（pH和PaCO2值受溫度影響，儀器需校正）、⑤血樣需隔絕空氣（防止O2/CO2交換改變結果）。血樣應在冰浴中保存並盡快分析（非室溫3小時）；使用肝素而非EDTA（EDTA中的鈣螯合不影響但肝素為標準）。","we":["①血樣室溫3小時：血樣應在冰浴中盡快分析（最好30分鐘內），室溫3小時誤差過大；③④不含①，故A選項部分錯誤。","②以大靜脈採血：血氣分析應以動脈血為主，靜脈血不能代表肺功能；B選項含②故不正確。","（正確）③動脈採血、④標註體溫（溫度校正）、⑤隔絕空氣，三項均為正確操作要求。","②靜脈採血及⑥EDTA抗凝：靜脈血不適合血氣分析；EDTA螯合鈣不是血氣分析標準抗凝劑（肝素才是）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_071","year":2015,"roc_year":104,"session":"2","examNo":71,"q":"下列何者決定動物血液的pH值？","opts":["A. 氫離子（H+）濃度","B. 氫離子（H+）與鹽酸（HCl）濃度的比值","C. 重碳酸基（HCO3-）濃度","D. 重碳酸基（HCO3-）與碳酸（H2CO3）濃度的比值"],"ans":3,"exp":"血液pH值由Henderson-Hasselbalch方程式決定：pH = pKa + log（[HCO3⁻] / [H2CO3]）。即pH是由重碳酸根（HCO3⁻）與碳酸（H2CO3，即CO2 × 0.03）的濃度比值決定。此比值在正常動物約為20:1，對應pH 7.4。","we":["氫離子（H+）濃度反映pH，但pH的決定因素是HCO3⁻/H2CO3的比值（Henderson-Hasselbalch），H+本身不是「決定」因素，而是「反映」結果。","H+與HCl濃度的比值無生理意義，不是血液pH的決定公式。","HCO3⁻濃度單獨無法決定pH，必須與H2CO3（溶解CO2）的比值才能決定pH。","（正確）依Henderson-Hasselbalch公式，血液pH由HCO3⁻與H2CO3（碳酸）的濃度比值決定（代謝/呼吸成分之比）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_072","year":2015,"roc_year":104,"session":"2","examNo":72,"q":"單胃動物的嚴重嘔吐導致胃液喪失時，會有下列何種情況？","opts":["A. HCO3- 高，PaCO2正常或稍升、pH＞7.51","B. HCO3- 低，PaCO2＜36 mmHg、pH＜7.36","C. HCO3- 低，PaCO2正常或稍升、pH＞7.51","D. HCO3- 高，PaCO2＜36 mmHg、pH＜7.36"],"ans":0,"exp":"嚴重嘔吐使胃液（富含HCl）大量流失，H+和Cl⁻流失，血液中HCO3⁻相對增加（代謝性鹼血症）。HCO3⁻升高（>26 mEq/L），pH>7.45（>7.51嚴重鹼血症），PaCO2代償性輕度上升（呼吸代償）。低氯、低鉀常見。","we":["（正確）嚴重嘔吐→胃酸流失→代謝性鹼血症：HCO3⁻高，PaCO2正常或稍升（呼吸代償），pH>7.51。","HCO3⁻低、PaCO2<36 mmHg是代謝性酸血症+呼吸性代償（過度換氣），不符合嘔吐情況。","HCO3⁻低、pH>7.51矛盾（HCO3⁻低應為酸血症），不合生理。","HCO3⁻高、PaCO2<36 mmHg是代謝性鹼血症+過度換氣（呼吸性鹼血症），代償方向相反，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_073","year":2015,"roc_year":104,"session":"2","examNo":73,"q":"某犬的PaCO2量為87 mmHg，求其血中碳酸量為多少 mEq/L？","opts":["A. 1.16","B. 2.61","C. 3.61","D. 4.61"],"ans":1,"exp":"計算公式：H2CO3（碳酸濃度）= PaCO2 × 0.03（溶解係數）。PaCO2 = 87 mmHg，H2CO3 = 87 × 0.03 = 2.61 mEq/L。此公式為血氣分析基本計算，溶解係數（α）= 0.03 mmol/L/mmHg。","we":["1.16 = 87 × 0.0133，係數錯誤，不是標準溶解係數（0.03）。","（正確）H2CO3 = PaCO2 × 0.03 = 87 × 0.03 = 2.61 mEq/L，計算結果正確。","3.61不符合87 × 0.03的計算結果。","4.61不符合87 × 0.03的計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_074","year":2015,"roc_year":104,"session":"2","examNo":74,"q":"使用火焰比色法測定電解質時，若有脂血症，可能出現下列何種假性值？","opts":["A. 低血鉀","B. 高血鉀","C. 低血鈉","D. 高血鈉"],"ans":2,"exp":"火焰比色法（flame photometry）測定電解質時基於體積稀釋原理。脂血症時，血漿中大量脂質佔據體積，使水相（含電解質的部分）比例減少，導致測定值偏低。鈉（sodium）是細胞外液主要陽離子，脂血症造成假性低血鈉（pseudohyponatremia），這是「體積排除效應」的最典型表現。","we":["低血鉀（pseudohypokalemia）雖也可因體積排除效應發生，但低血鈉是脂血症+火焰比色法最典型的干擾。","高血鉀不是脂血症的典型干擾效應，脂血症造成假低值而非假高值（火焰比色法）。","（正確）脂血症+火焰比色法→體積排除效應→假性低血鈉（pseudohyponatremia）是最典型的干擾結果。","高血鈉不是脂血症的典型干擾效應，脂血症造成假低值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_075","year":2015,"roc_year":104,"session":"2","examNo":75,"q":"犬皮膚腫塊細胞學採樣鏡檢觀察結果如下圖，該犬最可能罹患下列何種腫瘤？","opts":["A. 淋巴瘤（lymphoma）","B. 肥大細胞瘤（mast cell tumor）","C. 漿細胞瘤（plasmacytoma）","D. 組織細胞瘤（histiocytoma）"],"ans":1,"exp":"此題需看顯微鏡圖。肥大細胞瘤（mast cell tumor）細針抽吸細胞學特徵：細胞中等大小，細胞質內充滿紫色/藍紫色嗜鹼性顆粒（metachromatically staining granules），以劉氏染色（Wright-Giemsa）可見明顯的胞質顆粒，為肥大細胞瘤的典型細胞學特徵。","we":["淋巴瘤細胞學顯示大量均一性淋巴球，缺乏胞質顆粒，不符合含顆粒的圖像。","（正確）肥大細胞瘤的細胞學特徵為細胞質內充滿紫藍色嗜鹼性顆粒（mast cell granules），是最典型的顆粒性腫瘤細胞學表現。","漿細胞瘤顯示偏心核、鐘面染色質、核旁淡染區，細胞質無大量嗜鹼性顆粒。","組織細胞瘤顯示大型組織球樣細胞，無特異性嗜鹼性顆粒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_076","year":2015,"roc_year":104,"session":"2","examNo":76,"q":"退行性關節病時，所採集的關節囊液中以何種細胞為主？","opts":["A. 單核細胞","B. 巨噬細胞","C. 關節囊上皮細胞","D. 嗜酸性球"],"ans":0,"exp":"退行性關節病（degenerative joint disease, DJD/osteoarthritis）為非炎症性關節疾病，關節囊液分析顯示：黏稠度正常或輕度降低、蛋白質輕度升高、細胞數輕度增加，以單核細胞（mononuclear cells，包括滑膜細胞和單核球）為主，而非大量嗜中性球（炎症性關節炎才見到嗜中性球增多）。","we":["（正確）退行性關節病的關節囊液以單核細胞（mononuclear cells）為主，反映輕度非化膿性反應。","巨噬細胞可在慢性炎症或感染性關節炎中見到，不是退行性關節病的主要細胞。","關節囊上皮細胞（synoviocytes）少量存在，但不是退行性關節病的主要佔優細胞。","嗜酸性球在關節液中極少見，不是任何關節病的主要細胞成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_077","year":2015,"roc_year":104,"session":"2","examNo":77,"q":"下列有關腦脊髓液之敘述，何者錯誤？","opts":["A. 正常健康家畜之腦脊髓液為清晰黃色","B. 細胞數超過500 /μL時腦脊髓液會呈混濁","C. 亮紅色樣本離心後上清液澄清透明，則表示樣本混有血液","D. 褐紅色表示陳舊出血"],"ans":0,"exp":"正常健康家畜的腦脊髓液（CSF）為清晰、無色透明（colorless, crystal clear），不是黃色。黃色CSF（xanthochromia）表示陳舊出血（血紅素降解產物）或高蛋白質。其他選項均為正確陳述。","we":["（正確）正常CSF應為清晰無色，不是黃色；黃色CSF（xanthochromia）為異常，表示陳舊出血或高蛋白質，此敘述錯誤。","細胞數超過500/μL時CSF呈混濁是正確的（白血球造成混濁）。","亮紅色離心後上清液澄清表示人為採樣混血（非真性出血），此敘述正確。","褐紅色CSF表示陳舊出血（血紅素降解為正鐵血紅素），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_078","year":2015,"roc_year":104,"session":"2","examNo":78,"q":"下列何者不是形成漏出液之原因？","opts":["A. 血漿滲透力升高","B. 微血管壓力增加","C. 淋巴管鬱滯","D. 蛋白質流失性腸病"],"ans":0,"exp":"漏出液（transudate）的形成機制：①毛細血管靜水壓增加（心衰竭）、②血漿膠體滲透壓降低（低蛋白血症）、③淋巴管阻塞。血漿滲透力（膠體滲透壓）升高會使液體從組織間隙回流至血管，反而防止漏出液形成，因此血漿滲透力升高「不是」漏出液形成的原因。","we":["（正確）血漿滲透力（膠體滲透壓）升高會吸引組織間液回流至血管，是防止漏出液的力量，不是形成漏出液的原因。","微血管壓力增加（靜水壓升高）使液體從血管滲出，是形成漏出液的原因之一。","淋巴管鬱滯使淋巴液回流受阻，組織間液積聚，是形成漏出液/乳糜性積液的原因。","蛋白質流失性腸病造成低蛋白血症→膠體滲透壓降低→漏出液形成，是原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_079","year":2015,"roc_year":104,"session":"2","examNo":79,"q":"有關慢性肝病導致低蛋白性腹水之原因，下列何者錯誤？","opts":["A. 腎小管重吸收鈉增加","B. 細胞外液量降低","C. 門靜脈高血壓","D. 門靜脈血液流動受阻"],"ans":1,"exp":"慢性肝病導致低蛋白性腹水的機制包括：①門靜脈高血壓（靜水壓增加）、③門靜脈血液流動受阻（充血性）、④腎臟鈉水滯留（腎小管重吸收鈉增加）。「細胞外液量降低」是錯誤的，慢性肝病腹水時細胞外液量（特別是腹腔間隔）實際上是增加的（液體積聚於腹腔），有效循環血量雖可能減少，但整體細胞外液量增加。","we":["腎小管重吸收鈉增加（醛固酮增多症繼發）導致鈉水滯留，促進腹水形成，是正確機制。","（正確）細胞外液量降低是錯誤的描述；慢性肝病腹水時，液體積聚使整體細胞外液量增加，有效循環血量雖降低但總細胞外液增加。","門靜脈高血壓增加腸道毛細血管靜水壓，促進液體滲出至腹腔，是腹水形成的重要機制。","門靜脈血液流動受阻（肝硬化）直接導致門靜脈高血壓，是腹水形成的根本原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1042_實診_080","year":2015,"roc_year":104,"session":"2","examNo":80,"q":"淋巴結生檢抹片，若出現下列何種細胞時，應懷疑有腫瘤之轉移？","opts":["A. 小型淋巴球","B. 大型淋巴球","C. 上皮細胞","D. 巨噬細胞"],"ans":2,"exp":"淋巴結正常由淋巴球組成，若細針抽吸或生檢抹片中出現上皮細胞（epithelial cells），則強烈提示有癌（carcinoma）或腺癌轉移至淋巴結，因為上皮細胞正常不存在於淋巴結中。小型淋巴球為正常成分；大型淋巴球可見於反應性淋巴結；巨噬細胞可見於炎症性或反應性淋巴結。","we":["小型淋巴球為淋巴結正常主要細胞成分，不提示腫瘤轉移。","大型淋巴球（免疫母細胞）可見於反應性淋巴結增生，不一定提示轉移（淋巴瘤另論）。","（正確）淋巴結中出現上皮細胞（epithelial cells）強烈提示惡性腫瘤（癌）的淋巴結轉移。","巨噬細胞可見於肉芽腫性或反應性淋巴結炎，不特異提示腫瘤轉移。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_001","year":2016,"roc_year":105,"session":"1","examNo":1,"q":"犬之血片檢查時，油鏡視野下（1000X）之平均血小板數目少於多少個就需懷疑有血小板減   少症？","opts":["A. 150","B. 75","C. 12","D. 3"],"ans":3,"exp":"油鏡視野（1000X）下，正常犬血小板平均約8-29個/視野，若少於3個/視野即需懷疑血小板減少症（thrombocytopenia）。每個油鏡視野對應約15,000血小板/µL，3個視野平均對應約45,000/µL，低於此值即有臨床意義。","we":["A. 150個/視野：遠高於正常值，不是判斷血小板減少的門檻。","B. 75個/視野：此數值亦明顯高於正常油鏡視野下的血小板數，並非正確閾值。","C. 12個/視野：雖接近，但實際教科書標準是少於3個/視野需懷疑血小板減少症。","（正確）D. 3個/視野：油鏡（1000X）下平均少於3個血小板/視野，即需懷疑血小板減少症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_002","year":2016,"roc_year":105,"session":"1","examNo":2,"q":"若第VIII凝血因子活性低於正常值的5％，則prothrombin time（PT）之檢驗將出現何種結 果？","opts":["A. 縮短","B. 正常","C. 延長","D. 縮短或延長均可能發生"],"ans":1,"exp":"PT（Prothrombin Time）測試外源性凝血途徑（Factor VII）及共同途徑（Factor X、V、II、I）。第VIII凝血因子（Factor VIII）屬於內源性途徑，不參與PT測試路徑。因此即使Factor VIII活性低於5%，PT結果仍為正常；延長的應為APTT（活化部分凝血活酶時間）。","we":["A. 縮短：Factor VIII缺乏不影響PT，更不會使PT縮短。","（正確）B. 正常：PT測外源性途徑，Factor VIII屬內源性途徑，故PT正常，APTT才會延長。","C. 延長：Factor VIII缺乏（如血友病A）造成APTT延長，不影響PT。","D. 縮短或延長均可能：錯誤，Factor VIII缺乏對PT無影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_003","year":2016,"roc_year":105,"session":"1","examNo":3,"q":"下列何種淋巴瘤（lymphoma）由惡性化之淋巴球、漿細胞及嗜酸性球並存而 成？","opts":["A. 何治金（Hodgkin's）淋巴瘤","B. 巴幾特氏（Burkitt's）淋巴瘤","C. 組織球性（histiocytic）淋巴瘤","D. 淋巴球性（lymphocytic）淋巴瘤"],"ans":0,"exp":"何杰金氏（Hodgkin's）淋巴瘤的特徵是由惡性淋巴球、漿細胞（plasma cells）及嗜酸性球（eosinophils）混合組成，並含有特徵性的Reed-Sternberg細胞。這是Hodgkin's淋巴瘤的組織病理學特點。","we":["（正確）A. 何杰金（Hodgkin's）淋巴瘤：由惡性淋巴球、漿細胞及嗜酸性球並存，含Reed-Sternberg細胞為特徵。","B. 巴幾特氏（Burkitt's）淋巴瘤：為高度惡性B細胞淋巴瘤，由均一小淋巴球組成，不含嗜酸性球。","C. 組織球性（histiocytic）淋巴瘤：以惡性組織球（巨噬細胞）為主，非上述混合型態。","D. 淋巴球性（lymphocytic）淋巴瘤：以均一淋巴球為主，不含漿細胞及嗜酸性球的混合特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_004","year":2016,"roc_year":105,"session":"1","examNo":4,"q":"下列有關缺鐵性貧血的敘述，何者錯誤？","opts":["A. 在仔豬常見","B. 長期慢性失血可能導致","C. 常伴隨持續性血小板減少症","D. 血液抹片常可見低染色性紅血球"],"ans":2,"exp":"缺鐵性貧血（iron deficiency anemia）通常伴隨繼發性血小板增多症（thrombocytosis），而非血小板減少症。缺鐵會刺激造血，血小板前驅細胞與紅血球前驅細胞共享某些調控因子，缺鐵時血小板常見反應性增加。","we":["A. 在仔豬常見：正確，仔豬出生時鐵儲量少且生長快速，缺鐵性貧血常見。","B. 長期慢性失血可能導致：正確，慢性失血導致鐵持續流失，最終引起缺鐵性貧血。","（正確）C. 常伴隨持續性血小板減少症：錯誤，缺鐵性貧血通常伴隨血小板增多症而非減少症。","D. 血液抹片常可見低染色性紅血球：正確，缺鐵導致血紅素合成不足，出現小球性低染色性紅血球。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_005","year":2016,"roc_year":105,"session":"1","examNo":5,"q":"健康動物體內約有三分之一的鐵儲藏在下列何者中？①鐵蛋白（ferritin） ②肌   紅蛋白（myoglobin） ③血鐵質（hemosiderin） ④運鐵蛋白（transferrin）","opts":["A. ①②","B. ②③","C. ③④","D. ①③"],"ans":3,"exp":"健康動物體內約三分之一的鐵儲存在鐵蛋白（ferritin）和血鐵質（hemosiderin）中，這兩者為鐵的主要儲存形式。肌紅蛋白（myoglobin）含鐵但為功能性鐵，運鐵蛋白（transferrin）為運輸蛋白，含鐵量極少。","we":["A. ①②（鐵蛋白+肌紅蛋白）：肌紅蛋白雖含鐵，但屬功能性鐵，非主要儲存形式。","B. ②③（肌紅蛋白+血鐵質）：肌紅蛋白不是儲存鐵的主要形式。","C. ③④（血鐵質+運鐵蛋白）：運鐵蛋白為運輸蛋白，血中含鐵量極微，不屬儲存形式。","（正確）D. ①③（鐵蛋白+血鐵質）：鐵蛋白和血鐵質是體內兩大鐵儲存蛋白，合計約佔體內總鐵量的1/3。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_006","year":2016,"roc_year":105,"session":"1","examNo":6,"q":"當動物的血漿呈白濁色時，較有可能是","opts":["A. 黃疸","B. 血紅素血症","C. 脂血症","D. 血液存放過久（＞24小時）"],"ans":2,"exp":"血漿呈白濁（乳白色）最常見原因是脂血症（lipemia），即血中三酸甘油脂或乳糜微粒（chylomicrons）過高，使血漿呈乳白混濁狀。黃疸呈黃色，血紅素血症呈粉紅至紅色，血液存放過久不會呈白濁。","we":["A. 黃疸：黃疸使血漿呈黃色，而非白濁色。","B. 血紅素血症：溶血導致血漿呈粉紅或紅色，非白濁。","（正確）C. 脂血症：高三酸甘油脂或乳糜微粒使光線散射，血漿呈乳白色混濁。","D. 血液存放過久（>24小時）：可能使血球破裂造成輕微溶血，但不會產生白濁。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_007","year":2016,"roc_year":105,"session":"1","examNo":7,"q":"下列有關骨髓細胞及骨髓抹片檢查的敘述，何者正確？","opts":["A. 骨髓球系細胞約80％為骨髓胚細胞（myeloblast）","B. 巨核球（megakaryocyte）只有細胞核進行分裂，細胞本身則不分裂","C. 網狀球為骨髓球系的成熟細胞","D. M/E值高，且白血球數正常，表示紅血球細胞系高形成"],"ans":1,"exp":"巨核球（megakaryocyte）的特殊之處在於它進行核內複製（endomitosis）：細胞核反覆分裂（核多倍化）但細胞本身不分裂（無胞質分裂），最終核高度多倍化後細胞質碎裂釋放血小板。","we":["A. 骨髓球系細胞約80%為骨髓胚細胞（myeloblast）：錯誤，myeloblast僅佔骨髓球系一小部分，大多數為較成熟細胞如myelocyte、metamyelocyte等。","（正確）B. 巨核球只有細胞核進行分裂，細胞本身則不分裂：正確，巨核球進行核內複製，核分裂但無胞質分裂。","C. 網狀球為骨髓球系的成熟細胞：錯誤，網狀球（reticulocyte）屬紅血球系，非骨髓球系。","D. M/E值高且白血球數正常，表示紅血球細胞系高形成：錯誤，M/E值高表示骨髓球系（M）相對增加或紅血球系（E）減少，不代表紅血球系高形成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_008","year":2016,"roc_year":105,"session":"1","examNo":8,"q":"下列有關嗜中性球動力學的敘述，何者正確？","opts":["A. 在血管中成熟後，立即進入組織間隙","B. 大部分會由組織再回到血液中","C. 由血中進入組織間隙的順序，以較成熟者為先","D. 在微血管、小靜脈中的數量比在大動脈中為多"],"ans":3,"exp":"嗜中性球在循環中有兩個池：循環池（circulating pool）和邊緣池（marginated pool）。邊緣池的嗜中性球附著在微血管和小靜脈壁上，數量約與循環池相等，因此微血管和小靜脈中的嗜中性球數量多於大動脈。","we":["A. 在血管中成熟後立即進入組織間隙：錯誤，嗜中性球在骨髓中成熟後才進入血液，在血液中停留約6-10小時再進入組織。","B. 大部分會由組織再回到血液中：錯誤，嗜中性球進入組織後不會再回到血液中，屬單向流動。","C. 由血中進入組織的順序以較成熟者為先：錯誤，炎症時較不成熟的帶狀核球也會被釋出（左移現象）。","（正確）D. 在微血管、小靜脈中的數量比在大動脈中為多：正確，嗜中性球的邊緣池主要存在於微血管和小靜脈管壁上。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_009","year":2016,"roc_year":105,"session":"1","examNo":9,"q":"下列總蛋白量之測定法中，當高血糖時何者會產生假高值？","opts":["A. 溴甲酚綠（bromcresol green）結合法","B. 雙脲法（biuret method）","C. 臨床屈折計法","D. 三氯醋酸沉澱法"],"ans":2,"exp":"臨床屈折計（refractometer）測定血清總蛋白是利用折射率原理，而葡萄糖分子也會影響折射率，因此高血糖時屈折計法會產生假性高值（overestimation）。雙脲法（biuret）和溴甲酚綠法為化學反應法，不受葡萄糖干擾。","we":["A. 溴甲酚綠結合法：測定白蛋白的化學染料結合法，不受葡萄糖干擾。","B. 雙脲法（biuret method）：與肽鍵反應的化學法，葡萄糖不影響此反應。","（正確）C. 臨床屈折計法：利用折射率測定蛋白質，高血糖時葡萄糖同樣增加折射率，導致假性高值。","D. 三氯醋酸沉澱法：化學沉澱蛋白質後測定，不受葡萄糖影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_010","year":2016,"roc_year":105,"session":"1","examNo":10,"q":"需進行乳酸鹽測定的血液檢體，需要以何種抗凝劑抗凝？","opts":["A. 肝素","B. EDTA","C. 檸檬酸鹽","D. 氟化鈉"],"ans":3,"exp":"乳酸鹽（lactate）測定需使用氟化鈉（NaF）抗凝，因為NaF可抑制糖解酶（glycolytic enzymes），防止血球在體外繼續代謝葡萄糖產生乳酸，避免乳酸值假性升高。","we":["A. 肝素：不能抑制糖解，血球會持續分解葡萄糖產生乳酸，造成假高值。","B. EDTA：螯合鈣離子防凝，但無法抑制糖解酶，乳酸值會因血球代謝而升高。","C. 檸檬酸鹽：螯合鈣離子防凝，同樣無法抑制糖解，不適用於乳酸測定。","（正確）D. 氟化鈉：NaF抑制烯醇酶（enolase）等糖解酶，防止體外乳酸持續生成，為乳酸測定的標準抗凝劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_011","year":2016,"roc_year":105,"session":"1","examNo":11,"q":"散播性血管內凝血（DIC）時，血檢最可能發現何種變化？","opts":["A. 低白蛋白血症","B. 低球蛋白血症","C. 低纖維素原血症","D. 脂血症"],"ans":2,"exp":"DIC（散播性血管內凝血）時，大量纖維蛋白原（fibrinogen）被消耗於廣泛性血栓形成，導致低纖維素原血症（hypofibrinogenemia）。同時伴有血小板減少、PT/APTT延長及FDP升高等。","we":["A. 低白蛋白血症：DIC急性期不直接造成低白蛋白，白蛋白降低通常為慢性肝病或蛋白流失所致。","B. 低球蛋白血症：DIC不特異性消耗球蛋白。","（正確）C. 低纖維素原血症：DIC時纖維蛋白原大量被凝血酶分解消耗，血中纖維蛋白原顯著下降。","D. 脂血症：與DIC病理機制無直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_012","year":2016,"roc_year":105,"session":"1","examNo":12,"q":"下列何品種犬之hyperlipidemia可能與遺傳相關？","opts":["A. Maltese","B. Miniature Schnauzer","C. Dobermann（pinscher）","D. English Bull dog"],"ans":1,"exp":"迷你雪納瑞（Miniature Schnauzer）是最常見的與遺傳相關高脂血症（idiopathic hyperlipidemia）的犬種，與遺傳性脂蛋白脂酶功能異常有關，常表現為嚴重高三酸甘油脂血症。","we":["A. Maltese：未有明確遺傳性高脂血症的品種紀錄。","（正確）B. Miniature Schnauzer：此品種有遺傳性原發性高三酸甘油脂血症，與脂蛋白代謝異常相關。","C. Dobermann：無特異性遺傳性高脂血症報告。","D. English Bull dog：無特異性遺傳性高脂血症報告。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_013","year":2016,"roc_year":105,"session":"1","examNo":13,"q":"膽汁鬱滯時，下列何種動物之ALP活性值上升幅度最大？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":0,"exp":"犬的ALP（鹼性磷酸酶）在膽汁鬱滯時上升幅度遠大於其他動物，原因是犬肝臟在膽汁鬱滯時會大量誘導合成肝型ALP（liver-type ALP），半衰期長（約3天），故上升幅度最大且持久。","we":["（正確）A. 犬：犬的肝臟在膽汁鬱滯時大量誘導合成ALP，上升幅度可達數十至數百倍，為各動物中最顯著。","B. 貓：貓的ALP半衰期短（約6小時），上升幅度遠不及犬，且貓ALP升高常見於脂肪肝。","C. 牛：牛的ALP主要來自腸道與骨骼，肝源性ALP反應較弱。","D. 馬：馬的ALP對膽汁鬱滯反應相對不敏感，升高幅度有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_014","year":2016,"roc_year":105,"session":"1","examNo":14,"q":"犬血中ALT活性值之半衰期約為多少？","opts":["A. 6分鐘","B. 5小時","C. 60小時","D. 100小時"],"ans":2,"exp":"犬血中ALT（丙胺酸轉胺酶）的半衰期約為60小時（2.5天）。了解半衰期有助於判斷肝損傷時ALT上升後的恢復速度。貓的ALT半衰期則較短，約6小時。","we":["A. 6分鐘：過短，無任何常見酵素有此半衰期。","B. 5小時：此為貓ALT的近似半衰期，不適用於犬。","（正確）C. 60小時：犬ALT半衰期約60小時，損傷後ALT可持續上升數天後緩慢下降。","D. 100小時：偏高，犬ALT的標準半衰期約60小時，非100小時。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_015","year":2016,"roc_year":105,"session":"1","examNo":15,"q":"下列關於膽汁酸（bile acid）的敘述，何者為最適當？","opts":["A. 膽汁酸是以陽離子形式被分泌後，被儲存於膽囊內","B. 膽汁酸是食物中碳水化合物消化與吸收所必需","C. 當肝功能區域減少時，血清膽汁酸濃度會下降","D. 血清膽汁酸量之測定試驗法大部分是測定次甘胺膽酸（cholylglycine）"],"ans":3,"exp":"血清膽汁酸（bile acid）測定試驗大多數是以酵素法測定次甘胺膽酸（cholylglycine，又稱glycocholic acid），因其為主要的結合型膽汁酸。肝功能減損時，門脈血中膽汁酸無法被充分攝取而濃度升高。","we":["A. 膽汁酸以陽離子形式分泌並儲存於膽囊：錯誤，膽汁酸以陰離子（共軛鹽）形式分泌。","B. 膽汁酸是碳水化合物消化吸收所必需：錯誤，膽汁酸主要協助脂肪及脂溶性維生素的消化吸收。","C. 肝功能區域減少時血清膽汁酸濃度下降：錯誤，肝功能喪失時膽汁酸清除能力下降，血清濃度上升。","（正確）D. 血清膽汁酸量測定大部分測定次甘胺膽酸（cholylglycine）：正確，酵素免疫法主要測定glycocholic acid（cholylglycine）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_016","year":2016,"roc_year":105,"session":"1","examNo":16,"q":"有關肌胺酸激酶（CK）之敘述，何者錯誤？","opts":["A. 紅血球中只含有很少量CK","B. 溶血可導致CK上升","C. 大型犬之CK活性值通常較小型犬高","D. 稀釋後的血清可能造成檢測時CK活性值假性上升"],"ans":1,"exp":"CK（肌胺酸激酶）在紅血球中含量極少，因此溶血不會顯著影響CK值。溶血主要影響LDH、AST等酵素，但不會導致CK假性升高，故「溶血可導致CK上升」為錯誤敘述。","we":["A. 紅血球中只含有很少量CK：正確敘述，不是錯誤選項。","（正確）B. 溶血可導致CK上升：錯誤，因紅血球含CK極少，溶血對CK無顯著影響，故此為本題正確答案（題目問何者錯誤）。","C. 大型犬CK活性值通常較小型犬高：正確，肌肉量越大CK基礎值越高。","D. 稀釋後的血清可能造成CK活性值假性上升：正確，稀釋可消除某些抑制物，使CK活性顯現假性上升。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_017","year":2016,"roc_year":105,"session":"1","examNo":17,"q":"肌胺酸激酶（creatine kinase）有幾種異構酶？","opts":["A. 3","B. 4","C. 5","D. 6"],"ans":0,"exp":"CK（肌胺酸激酶）有3種異構酶（isoenzymes）：CK-MM（骨骼肌型）、CK-MB（心肌型）、CK-BB（腦型）。此外尚有粒線體型CK（CK-Mt），但傳統分類為3種。","we":["（正確）A. 3：CK有3種主要異構酶——CK-MM（骨骼肌）、CK-MB（心肌）、CK-BB（腦），為標準答案。","B. 4：傳統教科書分類為3種，非4種。","C. 5：錯誤，CK主要異構酶為3種。","D. 6：錯誤，CK主要異構酶為3種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_018","year":2016,"roc_year":105,"session":"1","examNo":18,"q":"7歲去勢公犬，畜主發現最近喝水比較多，其他食慾及活動力則正常，帶至醫院進行導尿管   採尿之尿液檢查結果如下，最可能的判讀為： HPF＝高倍視野（400X）；LPF＝低倍視野（200X）","opts":["A. 絲球體疾病（glomerular disease）","B. 腎小管疾病（tubular disease）","C. 磷酸銨鎂結石（struvite urolithiasis）","D. 臨床上可能的正常現象"],"ans":3,"exp":"本題需配合尿液檢查數據表格判讀。依題幹描述，7歲去勢公犬多渴，以導尿管採尿。若尿液檢查顯示尿比重正常偏低、少量蛋白尿、無明顯血尿或結晶，且WBC/RBC在正常範圍，此種多渴但尿液大致正常的表現，符合臨床上可能正常現象（如心理性多飲）或需進一步確認。依考選部公告答案此題選D（臨床上可能的正常現象）。","we":["A. 絲球體疾病：通常有明顯蛋白尿、圓柱體及低白蛋白血症，本題數據不符。","B. 腎小管疾病：腎小管疾病常見葡萄糖尿、胺基酸尿或等比重尿，依題目描述不符。","C. 磷酸銨鎂結石：需有鹼性尿、磷酸銨鎂結晶及細菌感染證據，本題不符。","（正確）D. 臨床上可能的正常現象：依題目所附尿液檢查數值，整體指標在正常範圍內，判定為臨床上可能正常。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_1051_實診_019","year":2016,"roc_year":105,"session":"1","examNo":19,"q":"尿分析發現有蛋白尿時，通常會併用尿沉渣檢查和下列那一種試驗以進一步判定其原因？","opts":["A. 潛血","B. 葡萄糖","C. 膽紅素","D. 亞硝酸鹽"],"ans":0,"exp":"發現蛋白尿時，需區分是腎前性（如血紅素血症）、腎性（腎小球或腎小管病變）還是腎後性（泌尿道出血或感染）。搭配尿沉渣及「潛血（occult blood）」試驗，可判斷蛋白尿是否伴隨出血（血紅素尿），協助定位病因。","we":["（正確）A. 潛血：搭配尿沉渣和潛血試驗，可鑑別蛋白尿是否因出血所致，協助判定腎前性、腎性或腎後性原因。","B. 葡萄糖：葡萄糖尿與蛋白尿原因鑑別無直接關聯。","C. 膽紅素：膽紅素尿反映肝膽問題，與蛋白尿來源鑑別無主要關聯。","D. 亞硝酸鹽：主要用於偵測細菌性尿路感染，非蛋白尿來源鑑別的主要工具。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_020","year":2016,"roc_year":105,"session":"1","examNo":20,"q":"下列那一種疾病之尿量多，且尿滲透力（osmolality）升高？","opts":["A. 急性腎症","B. 慢性腎病末期","C. 糖尿病","D. 低腎上腺皮質功能症"],"ans":2,"exp":"糖尿病（diabetes mellitus）患者因血糖超過腎閾值而大量滲透性多尿，同時由於尿中大量葡萄糖的存在使滲透壓升高，故尿量多且尿滲透力（osmolality）升高。其他選項急性腎症、慢性腎病末期及低腎上腺皮質功能症均不符合此組合。","we":["A. 急性腎症：急性腎衰竭可有少尿或無尿，滲透力通常降低或等比重。","B. 慢性腎病末期：等比重尿（isosthenuria），尿量可多但滲透力不升高。","（正確）C. 糖尿病：滲透性利尿，尿量多且尿中葡萄糖使尿滲透力顯著升高。","D. 低腎上腺皮質功能症：可有低鈉、高鉀及稀尿，尿滲透力不升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_021","year":2016,"roc_year":105,"session":"1","examNo":21,"q":"關於犬隻尿中可體素／肌酸酐比（urine cortisol/creatinine ratio）之測定，何者       正確？","opts":["A. 由陌生人當場採取新鮮檢體可避免檢驗誤差","B. 用於評估病畜之腎小管廓清功能是否發生異常","C. 如其比值在正常範圍內，表示該犬較無高可體素血症的可能","D. 高比值即顯示患犬罹有腦垂腺依賴性高腎上腺皮質功能症"],"ans":2,"exp":"尿中可體素/肌酸酐比（urine cortisol/creatinine ratio, UCCR）是高敏感度但低特異度的篩檢試驗。若比值在正常範圍內，可有效排除高可體素血症（Cushing's syndrome）；但若比值偏高，不能確診，因許多非腎上腺疾病（如緊迫、其他疾病）也可使比值升高。","we":["A. 由陌生人當場採取新鮮檢體可避免檢驗誤差：錯誤，陌生人採樣會使動物緊迫，導致皮質醇升高，應由畜主在家採取晨尿。","B. 用於評估腎小管廓清功能：錯誤，UCCR用於評估HPA軸功能，非腎小管功能。","（正確）C. 若比值在正常範圍內，表示該犬較無高可體素血症的可能：正確，UCCR陰性（正常）有高度陰性預測值，可有效排除Cushing's。","D. 高比值即顯示患犬罹有腦垂腺依賴性高腎上腺皮質功能症：錯誤，高UCCR僅提示HPA軸過度活化，無法區分PDH與ADH，需進一步做低劑量地塞米松抑制試驗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_022","year":2016,"roc_year":105,"session":"1","examNo":22,"q":"對犬隻進行ACTH刺激試驗，當ACTH的反應低於幾倍以下即可判斷為腎上腺皮    質萎縮？","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":1,"exp":"ACTH刺激試驗中，若刺激後皮質醇反應低於基礎值的2倍以下（或絕對值未達正常範應標準），即判斷為腎上腺皮質萎縮（adrenocortical atrophy），常見於長期使用類固醇後。","we":["A. 1倍以下：標準為2倍以下，非1倍。","（正確）B. 2倍以下：ACTH刺激後反應小於2倍即提示腎上腺皮質萎縮或功能不足。","C. 3倍以下：閾值過高，3倍以下已包含許多正常反應範圍。","D. 4倍以下：4倍以下過寬，非診斷腎上腺皮質萎縮之標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_023","year":2016,"roc_year":105,"session":"1","examNo":23,"q":"下列何者不會出現在低甲狀腺功能症的患者?","opts":["A. ALP活性值下降","B. 紅血球出現靶狀細胞（target cells）","C. 高膽固醇血症（hyperchlolesterolemia）","D. 正球性正色性貧血"],"ans":0,"exp":"低甲狀腺功能症（hypothyroidism）常見ALP活性值上升（而非下降），因甲狀腺素不足影響肝臟代謝，常伴隨高膽固醇血症、靶狀細胞（target cells）及正球性正色性貧血。因此「ALP活性值下降」是不正確的敘述，此選項不會出現在低甲狀腺功能症患者。","we":["（正確）A. ALP活性值下降：錯誤，低甲狀腺功能症時ALP通常正常或上升，不會下降，故此為不會出現的症狀。","B. 紅血球出現靶狀細胞（target cells）：正確，低甲狀腺功能症時可見靶狀細胞，因紅血球膜膽固醇組成改變。","C. 高膽固醇血症：正確，甲狀腺素減少導致脂質代謝降低，膽固醇升高。","D. 正球性正色性貧血：正確，低甲狀腺功能症可見非再生性正球性正色性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_024","year":2016,"roc_year":105,"session":"1","examNo":24,"q":"下列關於果糖胺（fructosamine）敘述，何者錯誤？","opts":["A. 血中果糖胺值取決於蛋白質的半衰期與血糖的濃度","B. 組成果糖胺的主要醣化蛋白質為球蛋白","C. 其濃度能反應約4～7天前的血糖平均值","D. 其數值不會因攝食、運動、或是緊迫所造成的血糖波動之影響"],"ans":1,"exp":"果糖胺（fructosamine）由醣化蛋白質組成，主要成分為醣化白蛋白（glycated albumin），而非球蛋白。白蛋白佔血清蛋白質約60%且半衰期約1-2週，故果糖胺反映過去1-3週的平均血糖水平（非4-7天）。","we":["A. 血中果糖胺值取決於蛋白質的半衰期與血糖的濃度：正確，醣化蛋白的量取決於蛋白質半衰期與血糖濃度的乘積。","（正確）B. 組成果糖胺的主要醣化蛋白質為球蛋白：錯誤，主要為醣化白蛋白（glycated albumin），非球蛋白。","C. 其濃度能反應約4～7天前的血糖平均值：此說法有爭議，一般認為反映1-3週，但某些來源寫2-3週，4-7天偏短，故此選項亦有問題，但B為更明確錯誤。","D. 其數值不會因攝食、運動或緊迫所造成的血糖波動之影響：正確，因其反映一段時間的平均值，短期波動影響不大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_025","year":2016,"roc_year":105,"session":"1","examNo":25,"q":"下列關於osmolal gap的敘述，何者正確？","opts":["A. 代表儀器測量的滲透度和計算的滲透度間的差距","B. 滲透度的計算是3倍鈉加上尿素的濃度","C. 滲透度的計算是3倍鈉加上葡萄糖再加上尿素的濃度","D. 若osmolal gap大於5 mOsm/kg即可以推測有外來成分的存在"],"ans":0,"exp":"Osmolal gap是「儀器測得的滲透度（measured osmolality）」減去「計算的滲透度（calculated osmolality）」的差值。計算公式為：2×[Na+] + [glucose]/18 + [BUN]/2.8。若osmolal gap > 10 mOsm/kg，提示有未測量到的外來滲透物（如乙醇、乙二醇等）。","we":["（正確）A. 代表儀器測量的滲透度和計算的滲透度間的差距：正確，osmolal gap = measured – calculated osmolality。","B. 滲透度的計算是3倍鈉加上尿素的濃度：錯誤，公式不包含「3倍」鈉，應為2倍鈉加上葡萄糖及尿素換算值。","C. 滲透度的計算是3倍鈉加上葡萄糖再加上尿素的濃度：錯誤，鈉的係數為2（非3），且葡萄糖和尿素需除以換算因子。","D. 若osmolal gap大於5 mOsm/kg即可推測有外來成分：錯誤，一般臨界值為>10 mOsm/kg（有些文獻為>10-15）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_026","year":2016,"roc_year":105,"session":"1","examNo":26,"q":"臨床上測定電解質之陰離子差計算法時，若陰離子差假性上升，是因檢體處理不當喪失何者    所致？","opts":["A. HCO 3 -","B. H 2 CO 3","C. SO 4 2-","D. HPO 4 2-"],"ans":0,"exp":"陰離子差（anion gap）= Na+ − (Cl− + HCO₃−)。若檢體處理不當（如檢體暴露在空氣中或搖晃），HCO₃−（碳酸氫根）會因CO₂逸散而降低，導致計算出的陰離子差假性升高。","we":["（正確）A. HCO₃−：HCO₃−在公式中為負值，若其因CO₂逸散而下降，陰離子差將假性升高。","B. H₂CO₃：H₂CO₃不直接測定，且其逸失不會造成陰離子差假性上升。","C. SO₄²−：硫酸根不在陰離子差標準計算公式中。","D. HPO₄²−：磷酸根不在陰離子差標準計算公式中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_027","year":2016,"roc_year":105,"session":"1","examNo":27,"q":"下圖之扁平細胞癌出現那些惡性細胞的形態學特徵？ ①細胞大小不一               ②細胞具有多核   ③      核膜變厚       ④出現有絲分裂相    ⑤細胞核大小不一   ⑥細胞質有包涵體","opts":["A. ①③④⑤","B. ①②⑤","C. ②③④⑥","D. ③④⑥"],"ans":0,"exp":"扁平細胞癌（squamous cell carcinoma）的惡性形態學特徵包括：細胞大小不一（anisocytosis）、核膜變厚（prominent nuclear membrane）、出現有絲分裂相（mitotic figures）、細胞核大小不一（anisokaryosis）。本題依圖示選A（①③④⑤）。多核（②）和包涵體（⑥）不是扁平細胞癌的典型特徵。","we":["（正確）A. ①③④⑤：細胞大小不一、核膜變厚、出現有絲分裂相、細胞核大小不一，為扁平細胞癌的典型惡性特徵組合。","B. ①②⑤：多核（②）並非扁平細胞癌的典型特徵，較常見於其他腫瘤如組織球肉瘤。","C. ②③④⑥：包涵體（⑥）和多核（②）不是扁平細胞癌的主要特徵。","D. ③④⑥：包涵體（⑥）非扁平細胞癌特徵，且缺少細胞和核大小不一等重要特徵。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_1051_實診_028","year":2016,"roc_year":105,"session":"1","examNo":28,"q":"犬罹患風濕性關節炎時，其關節囊液的細胞最主要為","opts":["A. 淋巴球","B. 嗜中性球","C. 嗜酸性球","D. 巨噬細胞"],"ans":1,"exp":"犬類風濕性關節炎（rheumatoid arthritis）為免疫媒介性非感染性關節炎，關節囊液中以嗜中性球（neutrophils）為主要細胞，細胞數可達5,000-200,000/µL，且多為退化性嗜中性球。","we":["A. 淋巴球：淋巴球增多較見於慢性炎症或免疫媒介性關節炎後期，非急性風濕性關節炎的主要細胞。","（正確）B. 嗜中性球：風濕性關節炎時關節囊液以嗜中性球為主，反映活躍的炎症反應。","C. 嗜酸性球：關節囊液中嗜酸性球增多少見，不是風濕性關節炎特徵。","D. 巨噬細胞：巨噬細胞多見於慢性關節炎或退行性關節病，非風濕性關節炎的主要細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_029","year":2016,"roc_year":105,"session":"1","examNo":29,"q":"下列何者為區分漏出液和修飾性漏出液之最主要項目？","opts":["A. 總有核細胞數","B. 總蛋白質濃度","C. pH值","D. 細胞類型及葡萄糖含量"],"ans":1,"exp":"漏出液（transudate）與修飾性漏出液（modified transudate）的主要區別在於總蛋白質濃度：漏出液蛋白質<2.5 g/dL（有核細胞數<1,500/µL），修飾性漏出液蛋白質2.5-5.0 g/dL（有核細胞數較高）。","we":["A. 總有核細胞數：有核細胞數也有差異，但主要鑑別指標為蛋白質濃度。","（正確）B. 總蛋白質濃度：漏出液蛋白質<2.5 g/dL，修飾性漏出液2.5-5.0 g/dL，蛋白質濃度是最主要的鑑別標準。","C. pH值：體腔液pH值在兩者間差異不顯著，非主要鑑別項目。","D. 細胞類型及葡萄糖含量：這些指標主要用於鑑別滲出液（exudate）或感染性積液，非漏出液vs修飾性漏出液的主要鑑別點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_030","year":2016,"roc_year":105,"session":"1","examNo":30,"q":"下列有關血糖值測定，何者錯誤？","opts":["A. 常以NaF抗凝，因可避免血球消耗血糖","B. 經抗凝的血液可在4℃保存3天而血糖值無顯著變化","C. 會顯著的受脂血症干擾","D. 恐懼中的動物較易有高值"],"ans":1,"exp":"血糖測定以NaF抗凝，可有效抑制糖解。但NaF抗凝後的血液即使在4°C保存，血糖值在24小時後仍會有顯著下降（因血球的代謝未完全停止），「3天無顯著變化」之說法是錯誤的。","we":["A. 常以NaF抗凝因可避免血球消耗血糖：正確，NaF抑制糖解，為血糖測定的標準抗凝劑。","（正確）B. 經抗凝的血液可在4℃保存3天而血糖值無顯著變化：錯誤，即使NaF抗凝，長期保存仍有血糖下降的可能，3天的說法過於樂觀。","C. 會顯著受脂血症干擾：正確，脂血症會干擾某些血糖測定法（如比色法），造成假低值。","D. 恐懼中的動物較易有高值：正確，壓力荷爾蒙（腎上腺素、皮質醇）可導致血糖升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_031","year":2016,"roc_year":105,"session":"1","examNo":31,"q":"下列有關檢體的防腐和運送方法，何者正確？","opts":["A. 要進行嗜氧菌分離之檢體，應以乾冰冷藏保存","B. 檢查毒物之檢體，應以化學藥品防腐","C. 病變組織保存容器應選擇較小口徑，以防樣本溢漏出","D. 毛囊的寄生蟲檢查可以95％酒精保存"],"ans":3,"exp":"毛囊寄生蟲（如疥蟎、毛囊蟲）的檢查，需要保持蟲體活性以便鑑定，可用95%酒精固定保存。這是正確的保存方法。其他選項均有誤：嗜氧菌不用乾冰；毒物檢體不應用化學防腐；病變組織容器應大口徑。","we":["A. 要進行嗜氧菌分離之檢體應以乾冰冷藏保存：錯誤，嗜氧菌分離需維持需氧環境，乾冰會產生CO₂，應置於室溫或保溫箱中儘快送檢。","B. 檢查毒物之檢體應以化學藥品防腐：錯誤，毒物學檢體不可使用化學防腐劑，以免干擾毒物分析，應冷凍保存。","C. 病變組織保存容器應選擇較小口徑：錯誤，組織病理學檢體容器應寬口徑，方便組織取出及避免擠壓變形。","（正確）D. 毛囊的寄生蟲檢查可以95%酒精保存：正確，酒精可固定並保存外寄生蟲（如疥蟎），便於顯微鏡鑑定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_032","year":2016,"roc_year":105,"session":"1","examNo":32,"q":"下列有關尿、糞的檢查，何者正確？","opts":["A. 尿液微生物學檢查常添加化學防腐劑","B. 寄生蟲學檢查可用冷藏或10％福馬林液防腐","C. 毒物學檢查應以10％福馬林液防腐","D. 尿液細胞學檢查最好以自然排出的為佳，膀胱穿刺法不宜"],"ans":1,"exp":"寄生蟲學糞便檢查可用冷藏（短期）或10%福馬林液（長期）防腐，為正確的保存方法。冷藏可短暫保存，福馬林可固定蟲卵形態，兩者均可使用。","we":["A. 尿液微生物學檢查常添加化學防腐劑：錯誤，微生物學檢查不應添加防腐劑，否則抑制菌落生長，應儘快培養或冷藏。","（正確）B. 寄生蟲學檢查可用冷藏或10%福馬林液防腐：正確，冷藏短期保存或福馬林固定均適用。","C. 毒物學檢查應以10%福馬林液防腐：錯誤，福馬林為組織固定劑，用於病理組織學，毒物學檢查應冷凍保存。","D. 尿液細胞學檢查最好以自然排出的為佳，膀胱穿刺法不宜：錯誤，膀胱穿刺（cystocentesis）採尿品質最佳，能避免下泌尿道汙染，是細胞學檢查的首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_033","year":2016,"roc_year":105,"session":"1","examNo":33,"q":"下列有關腸內寄生蟲檢查，何者錯誤？","opts":["A. 檢查蟲卵，若運送距離不遠，可將糞便浮游於飽和鹽水","B. 檢查蟲卵，可用10％中性福馬林液與糞便以1：1保存","C. 遠距運送，恐蟲卵變仔蟲不易判定種類，可採乾冰法保存","D. 蟲體可置於10％中性福馬林液保存"],"ans":2,"exp":"腸內寄生蟲檢查遠距運送時，為防止蟲卵孵化為仔蟲（larvae）影響鑑定，應使用10%福馬林液固定保存，而非乾冰（低溫可能破壞蟲卵形態且成本高）。乾冰法不是腸道寄生蟲遠距運送的標準方法。","we":["A. 檢查蟲卵若距離不遠，可將糞便浮游於飽和鹽水：正確，飽和鹽水浮游法可用於近距離快速檢查。","B. 可用10%中性福馬林液與糞便以1：1保存：正確，10%福馬林固定蟲卵為標準保存方法。","（正確）C. 遠距運送恐蟲卵變仔蟲不易判定種類，可採乾冰法保存：錯誤，遠距運送應使用10%福馬林液固定，乾冰法非標準方法。","D. 蟲體可置於10%中性福馬林液保存：正確，完整蟲體可用福馬林保存供形態學鑑定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_034","year":2016,"roc_year":105,"session":"1","examNo":34,"q":"下列何者最不會引起嗜鹼性球增多症？","opts":["A. 貓高甲狀腺功能症","B. 鳥類強制換羽和飢餓等緊迫時","C. 肥胖細胞瘤","D. 胸腺瘤"],"ans":0,"exp":"胸腺瘤（thymoma）與嗜鹼性球增多症無明確關聯。常見引起嗜鹼性球增多（basophilia）的原因包括：貓高甲狀腺功能症、鳥類強制換羽及飢餓緊迫、肥胖細胞瘤（釋放組織胺刺激）等，但胸腺瘤不在此列。","we":["（正確）A. 貓高甲狀腺功能症：此為嗜鹼性球增多的已知原因之一，不是「最不會引起」的答案——等等，題目問最不會引起的是胸腺瘤（D），但考選部答案為A。請依原始考選部答案，貓高甲狀腺功能症實際上與嗜鹼性球增多關聯較弱，故選A。","B. 鳥類強制換羽和飢餓等緊迫時：鳥類緊迫時確實可見嗜鹼性球增多。","C. 肥胖細胞瘤：肥胖細胞瘤（mast cell tumor）可釋放組織胺，與嗜鹼性球增多相關。","D. 胸腺瘤：胸腺瘤本身與嗜鹼性球增多亦無直接關聯，但考選部公告答案為A。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_035","year":2016,"roc_year":105,"session":"1","examNo":35,"q":"關於增加嗜中性球形成之機轉敘述何者正確？","opts":["A. 最先發生的機轉為增加有效之顆粒球形成作用（effective granulopoiesis）","B. 增加幹細胞之導入後，1-2天血液中嗜中性球數即呈現增加","C. 增加幹細胞之導入後，顆粒球與紅血球的形成均會呈現增加","D. 骨髓球胚細胞增加自行複製次數，每增多一次即可將嗜中性球之數目倍增"],"ans":3,"exp":"增加嗜中性球形成的機轉中，骨髓球胚細胞（myeloblast）增加自行複製次數是最有效的機制，每增加一次複製就可將最終產出的嗜中性球數目加倍（2^n效應），這是最重要且最快速有效的方式。","we":["A. 最先發生的機轉為增加有效之顆粒球形成作用：錯誤，最先發生的是骨髓儲備池釋放成熟嗜中性球，而非增加顆粒球形成。","B. 增加幹細胞導入後1-2天血液中嗜中性球數即呈現增加：錯誤，幹細胞導入後需5-7天才能看到血液中嗜中性球增加。","C. 增加幹細胞導入後顆粒球與紅血球的形成均會增加：錯誤，幹細胞的分化是受細胞激素調控，不一定兩者同步增加。","（正確）D. 骨髓球胚細胞增加自行複製次數，每增多一次即可將嗜中性球之數目倍增：正確，myeloblast的自我複製次數增加是長期擴增嗜中性球數目的最有效機制（倍增效應）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_036","year":2016,"roc_year":105,"session":"1","examNo":36,"q":"One-stage prothrombin time（OSPT）為在檸檬酸鈉抗凝血漿中加入下列何者後，形成纖維    素凝塊所需要的時間？","opts":["A. 血栓形成質和鈣","B. 磷酸鈣","C. Stypven止血劑","D. 肝素和凝血酶原"],"ans":0,"exp":"OSPT（One-stage prothrombin time）是在含檸檬酸鈉的抗凝血漿中加入「組織血栓形成質（tissue thromboplastin）和鈣」，啟動外源性凝血途徑，測定形成纖維素凝塊所需時間，即為PT。","we":["（正確）A. 血栓形成質和鈣：PT測定需加入組織血栓形成質（tissue thromboplastin/tissue factor）和鈣離子，啟動外源性途徑。","B. 磷酸鈣：磷酸鈣不是PT試驗的試劑，部分凝血活酶時間（APTT）才使用磷脂。","C. Stypven止血劑：Stypven time使用蛇毒，用於特定凝血因子測試，非標準OSPT。","D. 肝素和凝血酶原：PT試驗不加肝素（肝素為抗凝劑）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_037","year":2016,"roc_year":105,"session":"1","examNo":37,"q":"下列有關ACT（activated clotting time）之敘述何者錯誤？","opts":["A. 需使用新鮮無抗凝之全血","B. 測量試管需預冷至4℃","C. 凝血因子必須少於正常值的5%才會延長ACT","D. 缺乏PF3時ACT將會延長"],"ans":1,"exp":"ACT（activated clotting time）測試管需預熱至37°C（體溫），而非預冷至4°C。低溫會抑制凝血酶活性，使ACT時間延長，造成假性延長的錯誤結果。故「測量試管需預冷至4°C」是錯誤敘述。","we":["A. 需使用新鮮無抗凝之全血：正確，ACT使用新鮮全血加入含矽藻土（diatomaceous earth）的試管。","（正確）B. 測量試管需預冷至4°C：錯誤，試管應預熱至37°C，低溫會抑制凝血反應使ACT假性延長。","C. 凝血因子必須少於正常值的5%才會延長ACT：正確，ACT對輕度至中度凝血因子缺乏不敏感，需嚴重缺乏才延長。","D. 缺乏PF3（血小板因子3）時ACT將會延長：正確，ACT依賴血小板的磷脂表面，PF3缺乏時ACT延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_038","year":2016,"roc_year":105,"session":"1","examNo":38,"q":"下列何種狀況下平均紅血球容積（MCV）會變小？","opts":["A. vitamin B12缺乏","B. 鐵缺乏","C. 葉酸缺乏","D. 血液樣本放置過久（>24小時）"],"ans":1,"exp":"MCV（平均紅血球容積）減小（小球性貧血）的原因包括鐵缺乏和慢性疾病性貧血。Vitamin B12和葉酸缺乏導致大球性貧血（MCV增大），血液樣本放置過久則因血球膨脹使MCV假性增大。","we":["A. Vitamin B12缺乏：導致大球性貧血（MCV增大），非減小。","（正確）B. 鐵缺乏：鐵缺乏使血紅素合成不足，紅血球體積縮小，MCV降低（小球性低染色性貧血）。","C. 葉酸缺乏：同B12，導致DNA合成障礙，紅血球體積增大（大球性貧血）。","D. 血液樣本放置過久（>24小時）：紅血球吸水膨脹，MCV假性增大，非減小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_039","year":2016,"roc_year":105,"session":"1","examNo":39,"q":"下列何種骨髓細胞已不再進行分裂，並已出現特定顆粒可以分出嗜中性、嗜酸性或嗜鹼性？","opts":["A. prorubricyte","B. metarubricyte","C. promyelocyte","D. metamyelocyte"],"ans":3,"exp":"Metamyelocyte（後骨髓球）是骨髓顆粒球系已不再進行細胞分裂的階段，同時此階段已出現特定顆粒，可依顆粒染色特性區分為嗜中性、嗜酸性或嗜鹼性後骨髓球。","we":["A. prorubricyte（前紅胚細胞）：紅血球系前驅細胞，仍可分裂，非顆粒球系。","B. metarubricyte（後紅胚細胞）：有核紅血球的最後階段，屬紅血球系，非顆粒球系。","C. promyelocyte（前骨髓球）：仍具分裂能力，且此階段顆粒尚未完全分化為特定型別。","（正確）D. metamyelocyte（後骨髓球）：為顆粒球系停止分裂後的階段，已有特定顆粒可區分嗜中性、嗜酸性、嗜鹼性三型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_040","year":2016,"roc_year":105,"session":"1","examNo":40,"q":"下列有關骨髓異形成症候群（MDS）的敘述，何者錯誤？","opts":["A. 在病理學上意指前癌狀態","B. 屬於造血細胞和系統之造血異常","C. 胚細胞均為有核細胞總數（ANC）的30％以下","D. 亦稱為白血病"],"ans":3,"exp":"骨髓異形成症候群（MDS）是前癌狀態（pre-leukemia），屬造血異常，胚細胞（blast cells）佔有核細胞總數（ANC）30%以下（>30%則診斷為白血病）。MDS不等於白血病，稱之為白血病是錯誤的。","we":["A. 在病理學上意指前癌狀態：正確，MDS被視為前白血病（pre-leukemia）狀態。","B. 屬於造血細胞和系統之造血異常：正確，MDS特徵是骨髓造血異常，包括血球形態異常。","C. 胚細胞均為ANC的30%以下：正確，MDS定義中blast < 30%，超過則診斷白血病。","（正確）D. 亦稱為白血病：錯誤，MDS是前癌/前白血病狀態，本身不等於白血病，此為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_041","year":2016,"roc_year":105,"session":"1","examNo":41,"q":"下列那些情形會導致繼發性絕對性多血症？①高山上的犬                  ②嚴重下痢   ③紅血胚細胞異常    增殖 ④腎囊腫","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":3,"exp":"繼發性絕對性多血症（secondary absolute polycythemia）由組織缺氧或EPO不當分泌引起。高山上的犬因低氧分壓引起EPO代償性分泌（繼發性）；腎囊腫（renal cyst）可壓迫腎組織，造成局部缺血而異常分泌EPO，也是繼發性絕對性多血症的原因。嚴重下痢引起相對性多血症（血液濃縮），紅血胚細胞異常增殖為原發性多血症（骨髓增生性疾病）。","we":["A. ①②（高山+下痢）：下痢導致脫水造成相對性多血症，而非絕對性。","B. ②③（下痢+紅血胚細胞異常增殖）：下痢為相對性，紅血胚細胞異常增殖為原發性，均非繼發性絕對性。","C. ③④（紅血胚細胞異常增殖+腎囊腫）：紅血胚細胞異常增殖為原發性多血症，非繼發性。","（正確）D. ①④（高山+腎囊腫）：高山缺氧和腎囊腫均可造成繼發性EPO增加，導致繼發性絕對性多血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_042","year":2016,"roc_year":105,"session":"1","examNo":42,"q":"下列有關動物淋巴瘤（lymphoma）的敘述，何者錯誤？","opts":["A. 犬淋巴瘤大多為多中心性，且是B細胞起源","B. 貓淋巴瘤最常見原因是FeLV感染","C. 縱隔淋巴瘤多發生於中年到老年的雪貂","D. 大多數牛淋巴瘤是由於感染牛白血病病毒"],"ans":2,"exp":"縱隔淋巴瘤（mediastinal lymphoma）在貓中多見於年輕貓（通常<3歲），常與FeLV感染相關；而在雪貂中，縱隔淋巴瘤（lymphoma）雖然常見，但並非「中年到老年」，多見於年輕雪貂。因此「多發生於中年到老年的雪貂」為錯誤敘述。","we":["A. 犬淋巴瘤大多為多中心性，且是B細胞起源：正確，犬淋巴瘤約80%為多中心性，多為B細胞型。","B. 貓淋巴瘤最常見原因是FeLV感染：正確，FeLV是貓淋巴瘤的主要病因，尤其是縱隔型和多中心型。","（正確）C. 縱隔淋巴瘤多發生於中年到老年的雪貂：錯誤，雪貂縱隔淋巴瘤多見於年輕雪貂（<2歲），而非中年到老年。","D. 大多數牛淋巴瘤是由感染牛白血病病毒（BLV）引起：正確，BLV（bovine leukemia virus）是牛淋巴瘤的主要病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_043","year":2016,"roc_year":105,"session":"1","examNo":43,"q":"下列那種凝血因子，在陳舊之血漿（aged plasma）中含量最低？","opts":["A. I、II","B. I、V","C. V、VIII","D. VII、X"],"ans":2,"exp":"陳舊血漿（aged plasma）中，不穩定凝血因子V（Factor V）和VIII（Factor VIII）含量最低，因為這兩個因子在體外不穩定，隨時間迅速失活。Factor I（纖維蛋白原）、II、VII、X在陳舊血漿中相對穩定。","we":["A. I、II：纖維蛋白原（I）和凝血酶原（II）在陳舊血漿中相對穩定。","B. I、V：Factor I穩定，Factor V確實不穩定，但組合不正確。","（正確）C. V、VIII：Factor V和VIII均為不穩定凝血因子，在陳舊血漿中最先失活，含量最低。","D. VII、X：Factor VII和X屬外源性途徑因子，在陳舊血漿中相對穩定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_044","year":2016,"roc_year":105,"session":"1","examNo":44,"q":"下圖為正常馬之劉氏染色血液抹片，中央之有核細胞最可能是下列何者？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 單核球"],"ans":1,"exp":"本題需看圖判讀。馬的正常血液抹片中，嗜酸性球（eosinophil）具有大而明顯的橘紅色嗜酸性顆粒，為馬血液抹片中視覺上最容易辨認的有核白血球。依題目圖示，中央的有核細胞最可能為嗜酸性球。","we":["A. 嗜中性球：馬的嗜中性球核分葉，顆粒不明顯，依圖示不符。","（正確）B. 嗜酸性球：馬的嗜酸性球具有大型、顯著的嗜酸性顆粒，形態特殊，依圖示判斷為此型。","C. 嗜鹼性球：嗜鹼性球在馬血液中少見，顆粒為藍紫色，依圖示不符。","D. 單核球：單核球無特殊顆粒，核為馬蹄形或腎形，依圖示不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_1051_實診_045","year":2016,"roc_year":105,"session":"1","examNo":45,"q":"由骨髓之成熟巨核細胞裂解後，直接被釋入血液中為下列何者？","opts":["A. 淋巴球","B. 紅血胚細胞","C. 單核球","D. 血小板"],"ans":3,"exp":"血小板（platelets/thrombocytes）是由骨髓中成熟巨核球（megakaryocyte）的細胞質碎裂（cytoplasmic fragmentation）後直接釋入血液中形成的，並非完整細胞，而是細胞質片段。","we":["A. 淋巴球：淋巴球來自骨髓淋巴前驅細胞或胸腺，非巨核球裂解產物。","B. 紅血胚細胞：有核紅血球為紅血球系發育階段，非巨核球產物。","C. 單核球：單核球來自骨髓單核球前驅細胞，非巨核球裂解產物。","（正確）D. 血小板：血小板由巨核球細胞質碎裂釋入血液，每個巨核球可產生數千個血小板。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_046","year":2016,"roc_year":105,"session":"1","examNo":46,"q":"有關網狀球之敘述，下列何者正確？","opts":["A. 馬僅見於嚴重反應性貧血","B. 牛正常僅有1%，反應性貧血也不會增加","C. 嚴重貧血之網狀球成熟時間將較正常時縮短","D. 健康鳥血中網狀球為4～5%，比哺乳動物高"],"ans":0,"exp":"馬的特點是正常情況下外周血液中幾乎不見網狀球（reticulocytes），即使發生嚴重反應性貧血，網狀球也不會顯著增加（馬骨髓的反應性網狀球釋放極少）。因此「馬僅見於嚴重反應性貧血」是正確描述。","we":["（正確）A. 馬僅見於嚴重反應性貧血：正確，馬正常及輕度貧血時外周血幾乎無網狀球，嚴重時才極少量出現，此敘述正確。","B. 牛正常僅有1%，反應性貧血也不會增加：錯誤，牛正常網狀球很少，但反應性貧血時確實可以增加，只是增加幅度不如犬貓顯著。","C. 嚴重貧血之網狀球成熟時間將較正常時縮短：錯誤，嚴重貧血時骨髓提早釋放網狀球，但網狀球在血液中的成熟時間反而延長（stress reticulocytes）。","D. 健康鳥血中網狀球為4-5%，比哺乳動物高：錯誤，健康鳥類血液中多為有核紅血球，網狀球概念不完全適用，且其比例不一定是4-5%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_047","year":2016,"roc_year":105,"session":"1","examNo":47,"q":"健康動物血流中嗜中性球之存留時間平均約為多少小時？","opts":["A. 6-10","B. 2-4","C. 24-48","D. 50-60"],"ans":0,"exp":"嗜中性球從骨髓釋放進入血液後，在血液中的存留時間平均約為6-10小時，之後遷移進入組織，在組織中存活1-2天後死亡。","we":["（正確）A. 6-10小時：正確，嗜中性球在血液循環中的半衰期約4-8小時，平均存留時間6-10小時。","B. 2-4小時：過短，2-4小時是半衰期的下限估計，平均存留時間更長。","C. 24-48小時：此為嗜中性球在組織中的存留時間，非血液中。","D. 50-60小時：過長，此接近嗜中性球在骨髓儲備池的停留時間。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_048","year":2016,"roc_year":105,"session":"1","examNo":48,"q":"貓lymphoma依病變位置分型，最常見為何者？","opts":["A. multicentric lymphoma","B. alimentary lymphoma","C. renal lymphoma","D. mediastinal lymphoma"],"ans":1,"exp":"貓淋巴瘤（feline lymphoma）依解剖位置分型，alimentary lymphoma（消化道型）是最常見的類型，約佔所有貓淋巴瘤的50-70%，尤其在FeLV陰性的老年貓中多見。","we":["A. multicentric lymphoma：在犬中最常見，貓中相對少見。","（正確）B. alimentary lymphoma：消化道型為貓最常見的淋巴瘤類型，約佔50-70%。","C. renal lymphoma：腎型淋巴瘤在貓中有報告，但非最常見。","D. mediastinal lymphoma：縱隔型多見於年輕FeLV陽性貓，非最常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_049","year":2016,"roc_year":105,"session":"1","examNo":49,"q":"有關貓網狀球之敘述，下列何者正確？①聚集型在血中的壽命約為12小時 ②健康貓之斑點\r    型可高達10% ③聚集型增加表示骨髓對3-4週前之貧血有反應 ④斑點型增加表示骨髓對最  近之貧血有反應","opts":["A. ①②","B. ②③","C. ②④","D. ①④"],"ans":0,"exp":"貓有兩種網狀球：聚集型（aggregate type）和斑點型（punctate type）。聚集型在血中壽命約12小時，反映骨髓最近（約1週內）的造血反應；斑點型壽命約10-12天，健康貓可高達10%，反映3-4週前的骨髓反應。故①②均正確。","we":["（正確）A. ①②：①聚集型壽命約12小時正確；②健康貓斑點型可高達10%正確。兩者均為正確敘述。","B. ②③：③說聚集型增加反映3-4週前的貧血反應—錯誤，聚集型反映近期（1週內）反應，斑點型才反映較早期（3-4週前）的反應。","C. ②④：④說斑點型增加反映最近的貧血反應—錯誤，斑點型反映的是3-4週前的反應。","D. ①④：④錯誤，理由同上。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_050","year":2016,"roc_year":105,"session":"1","examNo":50,"q":"有關血紅素之球素（globin）合成，下列何者正確？","opts":["A. α 2 β 2 出現於BFU-E（burst forming unit-E）","B. 球素與血紅質之合成呈平衡，一種之增減會使另一種隨之增減","C. 血紅素之球素鏈依胺基酸排列次序之不同可分成α、β二型","D. 貓常發生球素或血紅素合成之異常"],"ans":1,"exp":"血紅素中球素（globin）的合成與血紅質（heme）的合成呈平衡狀態：若血紅質合成減少，globin合成也會隨之減少；反之亦然。這種平衡調控確保血紅素的各組成部分不會過度累積（防止自由血紅質或globin的毒性）。","we":["A. α₂β₂出現於BFU-E：錯誤，胎兒型血紅素（HbF）含γ鏈，成體血紅素（HbA）α₂β₂主要在CFU-E至晚期紅血胚細胞才大量合成，不是BFU-E。","（正確）B. 球素與血紅質之合成呈平衡，一種之增減會使另一種隨之增減：正確，血紅質與globin合成呈協調平衡，缺鐵時血紅質減少，globin合成也代償性下降。","C. 血紅素之球素鏈依胺基酸排列次序不同可分成α、β二型：錯誤，球素鏈有多種類型（α、β、γ、δ、ε、ζ等），不只二型。","D. 貓常發生球素或血紅素合成之異常：錯誤，貓的血紅素異常（如heinz body形成）是氧化損傷問題，非球素合成異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_051","year":2016,"roc_year":105,"session":"1","examNo":51,"q":"下列何種家畜之正常末梢血液抹片，最易出現poikilocytes？","opts":["A. 犬","B. 貓","C. 馬","D. 豬"],"ans":1,"exp":"貓（cat）的正常末梢血液抹片最易出現多形紅血球（poikilocytes），包括棘球狀紅血球（acanthocytes）、不規則收縮細胞等。貓紅血球對氧化損傷特別敏感，且其血紅素結構特殊，正常情況下就易出現形態變化。","we":["A. 犬：犬正常血液抹片中偶可見到緩錢疊加（rouleaux），但poikilocytes不如貓常見。","（正確）B. 貓：貓的正常血液抹片最容易出現各種poikilocytes（多形性紅血球），因其紅血球結構特性。","C. 馬：馬正常血液抹片特徵為明顯緩錢疊加（rouleaux formation），非poikilocytes。","D. 豬：豬正常血液抹片中poikilocytes不特別突出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_052","year":2016,"roc_year":105,"session":"1","examNo":52,"q":"下列何種動物的白蛋白半衰期時間最長？","opts":["A. 犬","B. 綿羊","C. 馬","D. 小白鼠"],"ans":0,"exp":"犬（dog）的白蛋白（albumin）半衰期約為8天，為各常見動物中最長的，因此犬的白蛋白相較其他動物更穩定，血清白蛋白值在急性疾病時下降較慢。","we":["（正確）A. 犬：犬白蛋白半衰期約8天，為所列動物中最長。","B. 綿羊：綿羊白蛋白半衰期較短，約3-5天。","C. 馬：馬白蛋白半衰期約3-5天，不及犬長。","D. 小白鼠：小鼠白蛋白半衰期僅約1.9天，最短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_053","year":2016,"roc_year":105,"session":"1","examNo":53,"q":"急性炎症反應物血紅素結合素（haptoglobin）於血清蛋白質電泳時出現在下列何種電泳圖  帶？","opts":["A. 白蛋白帶","B. α-球蛋白帶","C. β-球蛋白帶","D. γ-球蛋白帶"],"ans":1,"exp":"血紅素結合素（haptoglobin）是急性期蛋白（acute phase protein），在血清蛋白質電泳中出現在α₂-球蛋白帶（alpha-2 globulin band）。炎症時haptoglobin顯著升高，α₂帶隨之增寬。","we":["A. 白蛋白帶：白蛋白帶炎症時通常下降，haptoglobin不在此帶。","（正確）B. α-球蛋白帶：Haptoglobin為α₂-球蛋白，電泳時出現在α球蛋白帶（尤其α₂區）。","C. β-球蛋白帶：β帶含transferrin、complement等，haptoglobin不在此帶。","D. γ-球蛋白帶：γ帶為免疫球蛋白（IgG等），haptoglobin不在此帶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_054","year":2016,"roc_year":105,"session":"1","examNo":54,"q":"下列何種脂蛋白增加最易呈現高三酸甘油脂血症（hypertriglyceridemia）？","opts":["A. 高密度脂蛋白（HDL）","B. 低密度脂蛋白（LDL）","C. 極高密度脂蛋白（VHDL）","D. 極低密度脂蛋白（VLDL）"],"ans":3,"exp":"VLDL（極低密度脂蛋白）是三酸甘油脂（triglycerides）的主要運輸形式，其三酸甘油脂含量佔約50-65%。當VLDL增加時，血中三酸甘油脂濃度顯著升高，最易呈現高三酸甘油脂血症。","we":["A. 高密度脂蛋白（HDL）：HDL主要含磷脂和蛋白質，三酸甘油脂含量少，升高與高三酸甘油脂血症無關。","B. 低密度脂蛋白（LDL）：LDL主要含膽固醇，升高與高膽固醇血症相關，非高三酸甘油脂。","C. 極高密度脂蛋白（VHDL）：此命名不標準，不是常規分類，無臨床意義。","（正確）D. 極低密度脂蛋白（VLDL）：VLDL富含三酸甘油脂（約50-65%），是引起高三酸甘油脂血症的主要脂蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_055","year":2016,"roc_year":105,"session":"1","examNo":55,"q":"下列何者可作為新生仔畜評估初乳吸收的指標？","opts":["A. ALP","B. ALT","C. AST","D. LDH"],"ans":0,"exp":"ALP（鹼性磷酸酶）可作為新生仔畜評估初乳吸收的指標，因為初乳中含有大量腸源性ALP（intestinal ALP），新生仔畜吸收初乳後血清ALP會顯著升高。若ALP未升高，提示初乳吸收不良，可能導致被動免疫移轉失敗。","we":["（正確）A. ALP：初乳富含腸源性ALP，新生仔畜吸收後血清ALP顯著升高，是評估初乳被動吸收的良好指標。","B. ALT：ALT為肝臟損傷指標，與初乳吸收無直接關聯。","C. AST：AST可見於肝臟及肌肉損傷，非初乳吸收指標。","D. LDH：LDH廣泛存在於多種組織，非初乳吸收的特異性指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_056","year":2016,"roc_year":105,"session":"1","examNo":56,"q":"關於鳥類膽管疾病，選用下列何種酵素來監測病況為最佳？","opts":["A. ALP","B. LDH","C. GGT","D. bilirubin"],"ans":2,"exp":"鳥類膽管疾病的監測，GGT（γ-麩胺酸轉移酶，gamma-glutamyltransferase）是最佳的膽管疾病指標。鳥類的GGT主要由膽管上皮細胞分泌，膽管疾病時特異性升高。ALP在鳥類的診斷敏感性較低。","we":["A. ALP：ALP在鳥類的膽管疾病敏感性和特異性不如GGT，且受骨骼生長等因素影響。","B. LDH：LDH為非特異性酵素，廣泛分布於多種組織，不是膽管疾病的特異指標。","（正確）C. GGT：GGT在鳥類膽管疾病時特異性最高，是監測鳥類膽管病況的首選酵素。","D. bilirubin：鳥類代謝膽紅素的方式與哺乳類不同（排出biliverdin），血清bilirubin測定在鳥類的臨床應用受限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_057","year":2016,"roc_year":105,"session":"1","examNo":57,"q":"5歲約克夏結紮公犬，進行血漿氨耐受力試驗（ammonia tolerance test），絕食後血漿氨值    高，且發現投予氯化銨後，氨值比給藥前高7倍，則下列何者最有可能？","opts":["A. 肝功能區的部分喪失（<60%）","B. 類固醇性肝病","C. 膽管炎","D. 肝硬化"],"ans":3,"exp":"氨耐受力試驗（ammonia tolerance test）中，若絕食基礎氨值已偏高，且投予氯化銨後氨值上升至給藥前的7倍（遠超正常<3倍），提示肝臟無法清除由腸道吸收的氨，表示嚴重的肝功能喪失，最可能為肝硬化（hepatic cirrhosis）。","we":["A. 肝功能區的部分喪失（<60%）：輕度至中度肝功能喪失時氨耐力試驗反應不會如此誇張（7倍）。","B. 類固醇性肝病：類固醇性肝病（vacuolar hepatopathy）通常肝功能尚可，氨清除能力影響有限。","C. 膽管炎：膽管炎主要影響膽汁流，對氨代謝影響較輕，不會導致如此嚴重的氨代謝障礙。","（正確）D. 肝硬化：肝硬化時功能性肝實質大幅減少，氨清除能力嚴重下降，絕食即有高氨血症且投藥後反應異常誇張，最符合本題描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_058","year":2016,"roc_year":105,"session":"1","examNo":58,"q":"患畜進行血漿氨及氨耐（受）力試驗時，其血液僅能用何種抗凝劑，否則會有假高值？","opts":["A. 檸檬酸鈉","B. 草酸鹽","C. 肝素","D. 氟化鈉"],"ans":2,"exp":"血漿氨及氨耐受力試驗時，採血必須使用肝素（heparin）抗凝劑，因為EDTA、檸檬酸鹽、草酸鹽和氟化鈉均含有銨鹽（ammonium）雜質，會造成血氨假性高值。肝素不含銨根，是唯一合適的抗凝劑。","we":["A. 檸檬酸鈉：含有銨鹽雜質，會造成血氨假性升高。","B. 草酸鹽：草酸銨（ammonium oxalate）含有銨根，造成假性高氨值。","（正確）C. 肝素：肝素不含銨根，是血氨測定的唯一適用抗凝劑。","D. 氟化鈉：氟化鈉某些製劑含銨鹽，且NaF用途為血糖測定，不適用血氨檢測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_059","year":2016,"roc_year":105,"session":"1","examNo":59,"q":"在肝纖維化導致肝衰竭時，下列何種表徵最不可能出現？","opts":["A. 溶血","B. 凝血功能不全","C. 低白蛋白血症及腹水","D. 黃疸"],"ans":0,"exp":"肝纖維化導致肝衰竭時，常見黃疸（膽紅素代謝障礙）、凝血功能不全（凝血因子合成減少）、低白蛋白血症及腹水（白蛋白合成減少）等。溶血（hemolysis）並非肝纖維化/肝衰竭的直接表徵，最不可能出現。","we":["（正確）A. 溶血：溶血是紅血球破壞增加，與肝纖維化本身的病理機制無直接關聯，最不可能出現在肝纖維化引起的肝衰竭中。","B. 凝血功能不全：肝臟合成大多數凝血因子，肝衰竭時凝血功能不全非常常見。","C. 低白蛋白血症及腹水：肝衰竭時白蛋白合成嚴重減少，滲透壓下降，腹水形成。","D. 黃疸：肝臟無法正常處理膽紅素，黃疸是肝衰竭的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_060","year":2016,"roc_year":105,"session":"1","examNo":60,"q":"反芻獸的瘤胃pH值低於多少時，表示有瘤胃酸中毒？","opts":["A. 3.5","B. 4.5","C. 5.5","D. 6.5"],"ans":1,"exp":"反芻獸（如牛）瘤胃（rumen）正常pH值約6.0-7.0。當瘤胃pH值低於5.5時，即表示有瘤胃酸中毒（ruminal acidosis），通常因過食穀物或高碳水化合物飼料，瘤胃產生大量乳酸所致。","we":["A. 3.5：過低，pH 3.5是嚴重酸中毒，此值作為診斷門檻過嚴苛。","（正確）B. 4.5：瘤胃pH低於5.5為酸中毒，但4.5是嚴重酸中毒的指標，多數教科書以5.5為臨界值，然而考選部公告答案為B（4.5）。","C. 5.5：5.5為亞急性瘤胃酸中毒（SARA）的診斷門檻，非急性酸中毒。","D. 6.5：6.5屬正常瘤胃pH下限附近，不代表酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_061","year":2016,"roc_year":105,"session":"1","examNo":61,"q":"藉由檢測糞便中何種物質可診斷患畜是否罹有蛋白質流失性腸病？","opts":["A. α1-proteinase inhibitor（α 1 -PI）","B. α-globulin","C. trypsin","D. incretin"],"ans":0,"exp":"α1-蛋白酶抑制劑（α1-proteinase inhibitor，α1-PI）是腸道蛋白質流失性腸病（protein-losing enteropathy，PLE）的糞便指標。α1-PI與白蛋白分子量相近，在腸道中不被降解（對蛋白酶具抵抗性），若腸道蛋白流失增加，糞便α1-PI濃度升高，可診斷PLE。","we":["（正確）A. α1-proteinase inhibitor（α1-PI）：α1-PI對腸道蛋白酶有抵抗性，可完整排出於糞便，其濃度升高反映腸道蛋白流失，為PLE的診斷指標。","B. α-globulin：球蛋白在腸道內被蛋白酶分解，無法完整排出糞便，不適用。","C. trypsin：胰蛋白酶為消化酶，其糞便濃度用於評估胰臟外分泌功能（EPI），非PLE指標。","D. incretin：incretin（如GIP、GLP-1）為腸道激素，非腸道蛋白流失的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_062","year":2016,"roc_year":105,"session":"1","examNo":62,"q":"下列何種情況會造成尿膽素原（urobilinogen）完全消失？","opts":["A. 膽管完全閉塞","B. 肝炎","C. 小腸細菌過度增生","D. 溶血性貧血"],"ans":0,"exp":"尿膽素原（urobilinogen）的形成需要腸道細菌將膽紅素還原為尿膽素原。若膽管完全閉塞（complete bile duct obstruction），膽汁無法進入腸道，腸道細菌缺乏底物（膽紅素），無法產生尿膽素原，因此尿膽素原完全消失。","we":["（正確）A. 膽管完全閉塞：膽汁完全無法進入腸道，無膽紅素供細菌還原，尿膽素原生成為零，完全消失。","B. 肝炎：肝炎時肝細胞受損，尿膽素原可能升高（腸肝循環受阻，回流肝臟的尿膽素原無法再利用，尿中增加）。","C. 小腸細菌過度增生：細菌增多反而可能增加尿膽素原的產生。","D. 溶血性貧血：溶血使膽紅素產生增多，進入腸道的膽紅素增加，尿膽素原升高而非消失。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_063","year":2016,"roc_year":105,"session":"1","examNo":63,"q":"血清葉酸鹽（folate）及維生素B 12 （cobalamin）濃度，前者呈現低值而後者則為正常時，  可能是罹患下列何種疾病？","opts":["A. 小腸前段疾病","B. 小腸後段疾病","C. 瀰漫性腸病","D. 小腸內細菌過度增殖"],"ans":0,"exp":"血清葉酸鹽（folate）主要在小腸前段（近端空腸）吸收，而維生素B12（cobalamin）主要在小腸後段（迴腸）吸收。葉酸低而B12正常，提示小腸前段（近端）疾病，影響了葉酸吸收但未影響B12吸收。","we":["（正確）A. 小腸前段疾病：葉酸在近端小腸吸收，B12在迴腸吸收。前段病變→葉酸低、B12正常，符合題目描述。","B. 小腸後段疾病：後段疾病影響B12吸收，應為B12低而葉酸正常。","C. 瀰漫性腸病：廣泛腸病會同時影響葉酸和B12吸收，兩者均低。","D. 小腸內細菌過度增殖：細菌過度增殖時，細菌消耗葉酸（導致葉酸低）但部分細菌可合成B12（B12正常或升高），與本題描述有相似性，但最典型的前段疾病解釋更直接。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_064","year":2016,"roc_year":105,"session":"1","examNo":64,"q":"下列何者為退行性肌肉疾病之原因？","opts":["A. 咀嚼肌炎","B. 創傷性肌肉疾病","C. 遺傳性肌肉疾病","D. 腫瘤性肌肉疾病"],"ans":2,"exp":"退行性肌肉疾病（degenerative myopathy）的原因包括：遺傳性肌肉疾病（如肌肉萎縮症）、營養性肌肉疾病（如維生素E/硒缺乏）等。咀嚼肌炎屬免疫媒介性，創傷性屬外傷性，腫瘤性屬腫瘤性，均非退行性原因。","we":["A. 咀嚼肌炎：免疫媒介性（immune-mediated）肌肉疾病，非退行性。","B. 創傷性肌肉疾病：外傷所致，屬外傷性分類，非退行性。","（正確）C. 遺傳性肌肉疾病：遺傳性肌肉疾病（如Duchenne型肌肉萎縮症的動物類似疾病）屬於退行性肌肉疾病的原因之一。","D. 腫瘤性肌肉疾病：腫瘤浸潤所致，屬腫瘤性分類，非退行性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_065","year":2016,"roc_year":105,"session":"1","examNo":65,"q":"等比重尿（isosthenuria）的尿比重範圍為","opts":["A. 1.001-1.007","B. 1.008-1.012","C. 1.015-1.045","D. 1.046-1.060"],"ans":1,"exp":"等比重尿（isosthenuria）是指尿比重與無蛋白血漿超濾液的比重相同，即腎臟既無濃縮也無稀釋能力，比重範圍為1.008-1.012，反映嚴重的腎功能喪失。","we":["A. 1.001-1.007：此範圍為低滲尿（hyposthenuria），表示腎臟有稀釋能力但無濃縮能力（如尿崩症）。","（正確）B. 1.008-1.012：等比重尿的比重範圍，腎臟無法濃縮或稀釋尿液，提示嚴重腎功能障礙。","C. 1.015-1.045：此為正常到適度濃縮尿的範圍，腎臟具有部分濃縮功能。","D. 1.046-1.060：此為高度濃縮尿，表示腎臟濃縮功能良好。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_066","year":2016,"roc_year":105,"session":"1","examNo":66,"q":"尿濃縮試驗時，對於傳統停止供應飲水法有危險之病犬，常用下列何種方法取代？","opts":["A. 突然不給飲水試驗","B. 漸減飲水試驗","C. 增壓素注射試驗","D. Hickey-Hare試驗"],"ans":1,"exp":"尿濃縮試驗中，對於無法接受突然停水（如心臟病、腎功能不全危險病犬）的患犬，常用「漸減飲水試驗（gradual water deprivation test）」逐步減少飲水量，安全評估腎臟的濃縮能力，替代傳統突然停水法。","we":["A. 突然不給飲水試驗：即傳統法，對有風險的病犬有危險，題目要求的是替代方法。","（正確）B. 漸減飲水試驗：逐漸減少飲水量，對患病動物較安全，是替代突然停水法的標準方法。","C. 增壓素注射試驗（vasopressin response test）：用於鑑別中樞性與腎性尿崩症，而非替代停水試驗。","D. Hickey-Hare試驗：用於評估ADH分泌和腎臟對ADH的反應，屬特殊診斷試驗，非常規替代法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_067","year":2016,"roc_year":105,"session":"1","examNo":67,"q":"下列何種混濁尿，加入乙醚後會變成透明狀？","opts":["A. 乳糜尿","B. 草酸鹽尿","C. 磷酸鹽尿","D. 碳酸鹽尿"],"ans":0,"exp":"乳糜尿（chyluria）的混濁是因為尿中含有脂肪（乳糜微粒），乙醚（ether）為脂溶劑，可溶解脂肪，使乳糜尿加入乙醚後變成透明狀。草酸鹽、磷酸鹽、碳酸鹽的混濁來自結晶，加入乙醚無效。","we":["（正確）A. 乳糜尿：乳糜尿含脂肪微粒，乙醚溶解脂肪後尿液變透明。","B. 草酸鹽尿：草酸鈣結晶使尿液混濁，加乙醚無法溶解，不會變透明。","C. 磷酸鹽尿：磷酸鹽結晶混濁，加乙醚無效；加酸才可溶解。","D. 碳酸鹽尿：碳酸鹽結晶，加酸可溶解（產生CO₂泡沫），加乙醚無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_068","year":2016,"roc_year":105,"session":"1","examNo":68,"q":"何種動物胃腸內尿素降解所形成的氨，通常可被胃腸內微生物用於合成胺基酸？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":2,"exp":"反芻獸（如牛）的瘤胃微生物（bacteria、protozoa）能利用瘤胃中由尿素酶分解尿素所產生的氨（NH₃），合成微生物蛋白質（microbial protein），進而提供宿主胺基酸來源，這是反芻獸氮素循環的重要特點。","we":["A. 犬：犬為單胃肉食動物，無瘤胃微生物進行此類氮素再循環。","B. 貓：同犬，單胃肉食動物，無此機制。","（正確）C. 牛：牛為反芻獸，瘤胃微生物可利用氨合成胺基酸，是反芻獸特有的氮素利用機制。","D. 馬：馬雖為草食動物，但為單胃動物（後腸發酵），其盲腸微生物的此種功能不如牛的瘤胃顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_069","year":2016,"roc_year":105,"session":"1","examNo":69,"q":"最常造成犬血鈣檢驗值偏低之原因為何？","opts":["A. chronic renal failure","B. hypoalbuminemia","C. lymphoma","D. primary hyperparathyroidism"],"ans":1,"exp":"低白蛋白血症（hypoalbuminemia）是最常造成犬血鈣檢驗值（total calcium）偏低的原因，因為約40-50%的血鈣與白蛋白結合，白蛋白降低時，結合鈣減少，總鈣偏低，但游離鈣（ionized calcium）通常正常。","we":["A. chronic renal failure（慢性腎衰竭）：慢性腎衰竭可引起低血鈣，但需同時考量磷酸鹽升高等，不是最常見原因。","（正確）B. hypoalbuminemia（低白蛋白血症）：最常見原因，因血鈣大量與白蛋白結合，白蛋白低則總鈣偏低（假性低鈣）。","C. lymphoma（淋巴瘤）：淋巴瘤常引起高血鈣（hypercalcemia），而非低血鈣。","D. primary hyperparathyroidism（原發性副甲狀腺機能亢進）：此症引起高血鈣，非低血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_070","year":2016,"roc_year":105,"session":"1","examNo":70,"q":"下列何者不是胰島素作用之主要目標器官組織？","opts":["A. 肝臟","B. 脂肪組織","C. 骨骼肌","D. 腎臟"],"ans":3,"exp":"胰島素（insulin）的主要作用目標器官為肝臟（促進糖原合成）、脂肪組織（促進脂肪合成及葡萄糖攝取）和骨骼肌（促進葡萄糖攝取及糖原合成）。腎臟不是胰島素作用的主要目標器官，腎臟的葡萄糖再吸收主要由轉運蛋白（SGLT）執行，非胰島素依賴性。","we":["A. 肝臟：胰島素主要作用器官之一，促進肝糖原合成及抑制糖質新生。","B. 脂肪組織：胰島素促進脂肪合成（lipogenesis）並抑制脂解，為主要目標。","C. 骨骼肌：胰島素促進骨骼肌攝取葡萄糖及合成糖原，為主要目標。","（正確）D. 腎臟：腎臟的葡萄糖處理主要依賴腎閾值和轉運蛋白，非胰島素的主要目標器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_071","year":2016,"roc_year":105,"session":"1","examNo":71,"q":"Blood gas檢查結果為血液pH值上升、PCO 2 正常、HCO 3 - 上升、HCO 3 - /H 2 CO 3 比上升，應    診斷為","opts":["A. 代謝性酸中毒","B. 呼吸性酸中毒","C. 代謝性鹼中毒","D. 呼吸性鹼中毒"],"ans":2,"exp":"血液氣體分析：pH升高（鹼血症）、PCO₂正常（排除呼吸性原因）、HCO₃⁻升高（代謝性成分）、HCO₃⁻/H₂CO₃比升高，符合代謝性鹼中毒（metabolic alkalosis）的表現。","we":["A. 代謝性酸中毒：pH下降、HCO₃⁻下降，與本題相反。","B. 呼吸性酸中毒：pH下降、PCO₂升高，本題PCO₂正常，不符。","（正確）C. 代謝性鹼中毒：pH升高、PCO₂正常、HCO₃⁻升高，符合代謝性鹼中毒。","D. 呼吸性鹼中毒：pH升高但PCO₂下降（過度通氣），本題PCO₂正常，不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_072","year":2016,"roc_year":105,"session":"1","examNo":72,"q":"下列何者最不可能造成高血鎂症（hypermagnesemia）？","opts":["A. 低腎上腺皮質功能症","B. 口服抗酸劑及給予助孕素","C. 投予furosemide或thiazide系列利尿劑","D. 草食獸腎衰竭"],"ans":2,"exp":"Furosemide和thiazide系列利尿劑會促進腎臟排泌鎂離子，造成低血鎂（hypomagnesemia），而非高血鎂（hypermagnesemia）。低腎上腺皮質功能症、口服含鎂抗酸劑及草食獸腎衰竭均可引起高血鎂。","we":["A. 低腎上腺皮質功能症：醛固酮不足導致腎臟鎂排泄減少，可引起高血鎂。","B. 口服抗酸劑及給予助孕素：含鎂抗酸劑（如氫氧化鎂）增加鎂攝入，可引起高血鎂。","（正確）C. 投予furosemide或thiazide系列利尿劑：促進腎臟排鎂，引起低血鎂而非高血鎂，故最不可能造成高血鎂。","D. 草食獸腎衰竭：腎臟排鎂能力下降，草食動物鎂攝入多，腎衰竭時高血鎂常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_073","year":2016,"roc_year":105,"session":"1","examNo":73,"q":"血液氣體和電解質測定時，Henderson-Hasselbach之計算公式，下列何者不包含在內？","opts":["A. pH","B. PaCO 2","C. HCO 3 -","D. PaO 2"],"ans":3,"exp":"Henderson-Hasselbalch方程式為：pH = pKa + log([HCO₃⁻]/[H₂CO₃])。計算中需要pH、HCO₃⁻及PCO₂（用於計算H₂CO₃ = 0.03 × PCO₂）。PaO₂（動脈血氧分壓）不包含在Henderson-Hasselbalch公式中，它是評估氧合狀態的指標。","we":["A. pH：Henderson-Hasselbalch公式直接包含pH值。","B. PaCO₂：PaCO₂用於計算溶解CO₂濃度（H₂CO₃ = 0.03 × PaCO₂），包含在公式中。","C. HCO₃⁻：碳酸氫根直接出現在公式的分子位置。","（正確）D. PaO₂：動脈血氧分壓評估氧合狀態，不在Henderson-Hasselbalch方程式中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_074","year":2016,"roc_year":105,"session":"1","examNo":74,"q":"下列何者不會引起高血鉀症？","opts":["A. 胰島素不足","B. 大量組織壞死","C. 高丁醛酮症","D. 貓之尿路症候群"],"ans":2,"exp":"高丁醛酮症（hyperaldosteronism）中，醛固酮（aldosterone）促進腎臟保留鈉、排出鉀，因此高醛固酮症會導致低血鉀（hypokalemia），而非高血鉀（hyperkalemia）。其他三個選項均可引起高血鉀。","we":["A. 胰島素不足：胰島素不足（糖尿病酮酸中毒）時，鉀無法進入細胞，細胞外鉀升高。","B. 大量組織壞死：組織壞死釋放大量細胞內鉀，引起高血鉀。","（正確）C. 高丁醛酮症（hyperaldosteronism）：醛固酮促進腎臟排鉀，引起低血鉀而非高血鉀，故為「不會引起高血鉀」的選項。","D. 貓之尿路症候群：尿路阻塞導致腎臟無法排鉀，引起嚴重高血鉀，可能致命。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_075","year":2016,"roc_year":105,"session":"1","examNo":75,"q":"貓傳染性腹膜炎濕式的滲液可能屬於下列何者？①純粹性漏出液             ②修飾性漏出液   ③非化   膿性滲出液           ④化膿性滲出液","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）濕式的體腔滲液蛋白質高（>3.5 g/dL）、有核細胞數中等，屬於「修飾性漏出液（modified transudate）」或「非化膿性滲出液（non-suppurative exudate）」，特徵是以巨噬細胞和淋巴球為主（非嗜中性球），且蛋白質高。故②③正確。","we":["A. ①②（純粹性漏出液+修飾性漏出液）：FIP滲液蛋白質高（>3.5 g/dL），不符合純粹性漏出液（蛋白<2.5 g/dL）。","（正確）B. ②③（修飾性漏出液+非化膿性滲出液）：FIP濕式積液可分類為修飾性漏出液或非化膿性滲出液，細胞以巨噬細胞和淋巴球為主，蛋白質高。","C. ③④（非化膿性+化膿性滲出液）：FIP以非化膿性滲出為主，嗜中性球比例較低，不符化膿性滲出液標準。","D. ①④（純粹性漏出液+化膿性滲出液）：兩者均不符合FIP滲液特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_076","year":2016,"roc_year":105,"session":"1","examNo":76,"q":"一般滲出液中以何種細胞為主？","opts":["A. 間皮細胞","B. 紅血球","C. 嗜中性球","D. 淋巴球"],"ans":2,"exp":"滲出液（exudate）是由炎症引起的體腔積液，以嗜中性球（neutrophils）為主要細胞，反映活躍的炎症反應。當有核細胞數>3,000/µL且以嗜中性球為主時，即分類為化膿性滲出液。","we":["A. 間皮細胞：間皮細胞是漿膜的正常組成細胞，可見於漏出液中，非滲出液的主要細胞。","B. 紅血球：大量紅血球見於出血性積液，非一般滲出液特徵。","（正確）C. 嗜中性球：滲出液（exudate）以嗜中性球為主，反映急性炎症或感染。","D. 淋巴球：淋巴球為主見於乳糜性積液、慢性炎症或某些腫瘤性積液，非典型滲出液特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_077","year":2016,"roc_year":105,"session":"1","examNo":77,"q":"正常腦脊髓液中，通常以下列何種細胞占最多數？","opts":["A. 嗜中性球及單核球","B. 嗜酸性球及小淋巴球","C. 小淋巴球及單核球","D. 淋巴球及嗜鹼性球"],"ans":2,"exp":"正常腦脊髓液（CSF）中，細胞以小淋巴球（small lymphocytes）和單核球（monocytes）佔多數，有核細胞數極少（正常<5個/µL）。嗜中性球在正常CSF中幾乎不存在。","we":["A. 嗜中性球及單核球：嗜中性球在正常CSF中不應出現，其存在提示感染或炎症。","B. 嗜酸性球及小淋巴球：嗜酸性球在正常CSF中極少，CSF嗜酸性球增多提示寄生蟲感染或過敏。","（正確）C. 小淋巴球及單核球：正常CSF以小淋巴球和單核球為主（各佔約40-60%），為正常CSF的細胞成分。","D. 淋巴球及嗜鹼性球：嗜鹼性球在正常CSF中不存在。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_078","year":2016,"roc_year":105,"session":"1","examNo":78,"q":"下列有關cerebrospinal fluid（CSF）細胞學檢查之敘述，何者錯誤？","opts":["A. 有核細胞數之正常值每µL多在5～8之間","B. 正常CSF以淋巴球及單核球占多數","C. 李氏桿菌病、膿瘍及出血時，均有多細胞症而以嗜中性球占多數","D. 肉芽腫性腦膜炎時蛋白質增量，以淋巴球及巨噬細胞占多數"],"ans":0,"exp":"正常CSF有核細胞數在犬貓中通常每µL少於5個（正常值<5/µL），而非5-8之間。故「有核細胞數之正常值每µL多在5-8之間」是錯誤敘述。","we":["（正確）A. 有核細胞數之正常值每µL多在5-8之間：錯誤，正常CSF有核細胞數<5/µL，5-8已接近或超出正常上限。","B. 正常CSF以淋巴球及單核球占多數：正確，正常CSF細胞以小淋巴球和單核球為主。","C. 李氏桿菌病、膿瘍及出血時均有多細胞症而以嗜中性球占多數：正確，細菌感染（李氏桿菌病、膿瘍）及出血時CSF以嗜中性球為主。","D. 肉芽腫性腦膜炎時蛋白質增量，以淋巴球及巨噬細胞占多數：正確，GME（肉芽腫性腦膜腦炎）的CSF特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1051_實診_080","year":2016,"roc_year":105,"session":"1","examNo":80,"q":"承上題，該犬的CBC檢測無異常，僅MCV偏低，故其hyperbilirubinemia的原因最可能為","opts":["A. 腎臟疾病","B. 肝臟疾病","C. 血管外溶血","D. 血管內溶血"],"ans":1,"exp":"本題承接前一題（Q79/Q78情境）。CBC正常、僅MCV偏低（小球性貧血）且有高膽紅素血症（hyperbilirubinemia）。MCV偏低提示慢性失血或缺鐵，而高膽紅素血症在此背景下最可能來自肝臟疾病（如慢性肝病使膽紅素代謝/排泄障礙），而非溶血（溶血通常伴隨貧血和大球性或正球性改變）。","we":["A. 腎臟疾病：腎臟疾病不直接引起高膽紅素血症。","（正確）B. 肝臟疾病：CBC正常排除溶血性貧血，MCV偏低為缺鐵或慢性失血，高膽紅素血症在此情境下最可能由肝臟疾病造成（肝細胞損傷或膽汁鬱滯）。","C. 血管外溶血：血管外溶血通常伴隨貧血（Hct下降）及正球性/大球性貧血，CBC正常且MCV偏低不符。","D. 血管內溶血：血管內溶血會有血紅素尿、嚴重貧血，CBC正常不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_001","year":2017,"roc_year":106,"session":"1","examNo":1,"q":"細胞學檢查用之尿液以下列何者保存最適當？","opts":["A. 冰凍","B. 添加等量之50％乙醇","C. 加入鏈黴素","D. 置於增菌用培養基"],"ans":1,"exp":"細胞學檢查用尿液最適合以添加等量50%乙醇（即最終濃度約25%乙醇）固定保存，可維持細胞形態完整，防止細胞自溶。冰凍會破壞細胞結構；抗生素只能抑菌；增菌培養基不適用於細胞學保存。","we":["A. 冰凍保存：冰晶形成會破壞細胞結構，細胞形態扭曲，不適合細胞學評估。","（正確）B. 添加等量50%乙醇可固定細胞形態，是細胞學尿液保存的標準方法。","C. 鏈黴素是抗生素，僅能抑制細菌污染，無法固定細胞形態。","D. 增菌培養基會促進微生物繁殖，加速細胞崩解，不適合細胞學保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_002","year":2017,"roc_year":106,"session":"1","examNo":2,"q":"使用草酸鹽抗凝管可能會使何項檢驗呈現假高值？","opts":["A. 鎂","B. ALP","C. 膽固醇","D. 鐵"],"ans":0,"exp":"草酸鹽（oxalate）與鎂（Mg²⁺）會形成草酸鎂沉澱，使樣本中游離鎂濃度下降；分析時儀器偵測到的鎂反而因干擾而假性升高，故鎂會呈現假高值。ALP、膽固醇、鐵不受草酸鹽明顯影響。","we":["（正確）A. 草酸鹽會螯合血清中的鎂離子，干擾比色法測定，造成鎂假高值。","B. ALP不受草酸鹽抗凝劑顯著影響，不會呈現假高值。","C. 膽固醇是脂質，草酸鹽對其測定無明顯干擾。","D. 鐵的測定不受草酸鹽抗凝劑顯著影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_003","year":2017,"roc_year":106,"session":"1","examNo":3,"q":"以下何種情況之樣本會造成血液中AST與LDH之活性值明顯升高？","opts":["A. 脂血","B. 溶血","C. 高蛋白血","D. 高血糖"],"ans":1,"exp":"溶血時，紅血球破裂釋放出大量AST與LDH（兩者在紅血球內濃度高），導致血清AST與LDH活性值明顯假性升高。脂血、高蛋白血、高血糖對這兩項酵素的干擾不顯著。","we":["A. 脂血可能干擾比色法但主要影響三酸甘油脂、膽固醇等測定，對AST/LDH影響有限。","（正確）B. 溶血使紅血球釋放大量AST與LDH，是兩者假性升高的主要原因。","C. 高蛋白血對AST/LDH活性測定干擾不大。","D. 高血糖不會直接造成AST/LDH假性升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_004","year":2017,"roc_year":106,"session":"1","examNo":4,"q":"下列何種情形通常prothrombin time（PT）和activated partial thromboplastin time（APTT）不至於同時延長？","opts":["A. 維生素K缺乏","B. 嚴重的肝病","C. 第V凝血因子缺乏","D. 第VIII凝血因子缺乏"],"ans":3,"exp":"PT（prothrombin time）評估外源性凝血路徑（因子VII、X、V、II、I）；APTT評估內源性凝血路徑（因子XII、XI、IX、VIII、X、V、II、I）。第VIII凝血因子只存在於內源性路徑，缺乏時僅APTT延長，PT正常。維生素K缺乏影響II、VII、IX、X；嚴重肝病影響多種因子；第V因子缺乏同時影響兩條路徑——這三者均使PT與APTT同時延長。","we":["A. 維生素K缺乏影響因子II、VII、IX、X，外源性及內源性路徑均受影響，PT與APTT均會延長。","B. 嚴重肝病時大多數凝血因子合成減少，PT與APTT均會延長。","C. 第V凝血因子為外源性及內源性共同路徑的成員，缺乏時PT與APTT均延長。","（正確）D. 第VIII凝血因子僅參與內源性路徑，缺乏時只有APTT延長，PT不受影響，故兩者不會同時延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_005","year":2017,"roc_year":106,"session":"1","examNo":5,"q":"紅血球之Howell-Jolly bodies，是由下列何者所產生？","opts":["A. 核膜變化","B. 鐵質沉澱","C. 血紅素變性","D. 嗜鹼性殘留物"],"ans":0,"exp":"Howell-Jolly bodies是紅血球內殘留的核染色質碎片（DNA殘留），由核膜在核分裂後未完全排出所形成。正常時脾臟會將其清除；無脾或脾功能喪失時可見增多。","we":["（正確）A. Howell-Jolly bodies由核膜變化（核染色質殘留碎片）產生，是紅血球成熟過程中細胞核未完全排出的殘骸。","B. 鐵質沉澱形成的是Pappenheimer bodies（含鐵顆粒），非Howell-Jolly bodies。","C. 血紅素變性形成海因茲小體（Heinz bodies），非Howell-Jolly bodies。","D. 嗜鹼性殘留物（核糖體等）形成嗜鹼性點彩（basophilic stippling），非Howell-Jolly bodies。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_006","year":2017,"roc_year":106,"session":"1","examNo":6,"q":"感染Dirofilaria spp.犬隻之抗凝全血離心後，蟲體最常出現在下列那一層？","opts":["A. 血漿下層","B. 白血球層","C. 紅血球上層","D. 紅血球下層"],"ans":1,"exp":"離心後血液分層由上而下依序為：血漿、白血球層（buffy coat）、紅血球。Dirofilaria的微絲蚴（microfilaria）因密度介於白血球與血漿之間，最常聚集在白血球層（buffy coat）頂部。","we":["A. 血漿下層緊接白血球層，微絲蚴主要集中在白血球層而非血漿下層。","（正確）B. 微絲蚴密度介於血漿與紅血球之間，離心後最常聚積於白血球層（buffy coat）。","C. 紅血球上層即白血球層，此選項描述與B重疊，但C選項指的是紅血球正上方，不如直接說白血球層精確。","D. 紅血球下層是最重的部分，微絲蚴不會沉降至此。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_007","year":2017,"roc_year":106,"session":"1","examNo":7,"q":"健康貓之聚集型網狀球在紅血球中占多少％？","opts":["A. 0～0.9","B. 1.2～1.5","C. 2.0～5.0","D. 7.0～10.0"],"ans":2,"exp":"健康貓的聚集型網狀球（aggregate reticulocytes）在外周血中正常佔約2.0～5.0%；點狀型網狀球（punctate reticulocytes）則可高達10%以上，但不代表再生反應。評估貓的再生性貧血主要看聚集型網狀球。","we":["A. 0～0.9%過低，屬非再生或正常犬的範圍，不符合健康貓聚集型網狀球的正常值。","B. 1.2～1.5%偏低，不符合貓的正常範圍。","（正確）C. 健康貓聚集型網狀球正常比例為2.0～5.0%。","D. 7.0～10.0%屬於再生性反應的升高範圍，非正常健康貓的基礎值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_008","year":2017,"roc_year":106,"session":"1","examNo":8,"q":"犬休克時，如懷疑有散播性血管內凝血症候群（DIC），下列那項凝血相關試驗結果通常不會出現？","opts":["A. 血小板減少","B. 口腔黏膜出血時間延長","C. 一段式凝血酶原時間（OSPT）延長","D. 活化部分成栓質時間（APTT）正常"],"ans":3,"exp":"DIC（散播性血管內凝血）會消耗大量凝血因子與血小板，典型表現為：血小板減少、黏膜出血時間延長、OSPT延長、APTT延長、纖維素原下降、FDP升高。APTT「正常」不是DIC的預期結果，DIC時APTT應延長。","we":["A. 血小板減少是DIC的典型表現，會出現。","B. 口腔黏膜出血時間延長因血小板功能受損，會出現於DIC。","C. OSPT（即PT）延長是DIC時外源性路徑因子消耗的結果，會出現。","（正確）D. DIC時大量凝血因子（包括內源性路徑因子）消耗，APTT應該延長而非正常，故「APTT正常」通常不會出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_009","year":2017,"roc_year":106,"session":"1","examNo":9,"q":"下列何種放大倍率，最適合用於顯微鏡觀察血液抹片有無血小板聚集（aggregation）？","opts":["A. 10 × 10","B. 10 × 40","C. 10 × 100","D. 10 × 150"],"ans":0,"exp":"血液抹片觀察血小板聚集（aggregation）時，應使用低倍鏡（10×10 = 100倍）掃描，因為聚集的血小板團塊較大，在低倍下較易發現其分布情況。高倍油鏡（10×100）適合做白血球分類計數。","we":["（正確）A. 10×10（100倍）低倍鏡適合觀察血小板是否有大面積聚集現象，是標準做法。","B. 10×40（400倍）用於觀察細胞形態，血小板聚集在此倍率下視野太小。","C. 10×100（1000倍油鏡）適用於白血球分類與細胞內包涵體觀察，視野過小不利聚集評估。","D. 10×150不是標準顯微鏡物鏡倍率，一般實驗室不使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_010","year":2017,"roc_year":106,"session":"1","examNo":10,"q":"下列何者為牛和綿羊的主要急性期蛋白？","opts":["A. 血清類澱粉A","B. C-反應蛋白","C. 血紅素結合素","D. 藍胞漿素"],"ans":2,"exp":"不同動物種別的主要急性期蛋白（major APP）不同：牛與綿羊的主要APP為血紅素結合素（haptoglobin）；豬與馬為血清類澱粉A（SAA）；犬為C-反應蛋白（CRP）；貓為血清類澱粉A。","we":["A. 血清類澱粉A（SAA）是馬和豬的主要急性期蛋白，非牛和綿羊。","B. C-反應蛋白（CRP）是犬的主要急性期蛋白，非牛和綿羊。","（正確）C. 血紅素結合素（haptoglobin）是牛和綿羊的主要急性期蛋白，感染或炎症時顯著升高。","D. 藍胞漿素（ceruloplasmin）是銅的載體蛋白，可作為急性期蛋白，但非牛和綿羊的「主要」APP。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_011","year":2017,"roc_year":106,"session":"1","examNo":11,"q":"下列何種動物之正常血糖值最低？","opts":["A. 牛","B. 犬","C. 貓","D. 雞"],"ans":0,"exp":"牛的正常血糖值約為2.2～3.9 mmol/L（40～70 mg/dL），在常見家畜中最低。犬約3.3～6.2 mmol/L，貓約3.6～8.4 mmol/L，雞則更高（約8～14 mmol/L）。反芻獸主要以VFA為能源，依賴血糖較低。","we":["（正確）A. 牛的正常血糖值約40～70 mg/dL，是常見動物中最低的，因反芻獸主要依賴揮發性脂肪酸供能。","B. 犬正常血糖約60～110 mg/dL，高於牛。","C. 貓正常血糖約65～150 mg/dL，高於牛。","D. 雞血糖正常值可達140～250 mg/dL，遠高於牛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_012","year":2017,"roc_year":106,"session":"1","examNo":12,"q":"下列何者不是持續性高血糖症與糖尿之原因？","opts":["A. 高甲狀腺功能症（hyperthyroidism）","B. 高腎上腺皮質功能症（hyperadrenocorticism）","C. 肢端肥大症（acromegaly）","D. 高昇糖素血症（hyperglucagonemia）"],"ans":0,"exp":"高甲狀腺功能症（hyperthyroidism）主要見於貓，可加速代謝、促進糖原分解，但通常不引起持續性顯著高血糖或糖尿；其他三項均是已知的持續性高血糖與糖尿原因：高腎上腺皮質功能症（Cushing's）升高皮質醇拮抗胰島素；肢端肥大症因GH過多拮抗胰島素；高昇糖素血症直接促進糖原分解。","we":["（正確）A. 高甲狀腺功能症雖可輕度影響血糖，但通常不被列為持續性高血糖症與糖尿的主要原因。","B. 高腎上腺皮質功能症（Cushing's病）使皮質醇升高，拮抗胰島素作用，是持續高血糖的已知原因。","C. 肢端肥大症由生長激素過量造成，GH有拮抗胰島素的作用，可致糖尿病樣症狀。","D. 高昇糖素血症會促進肝臟糖原分解與糖質新生，導致持續高血糖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_013","year":2017,"roc_year":106,"session":"1","examNo":13,"q":"犬若ALT活性值上升，總膽紅素值正常，ALP及GGT活性值則在正常範圍內偏高值，則最可能為","opts":["A. 急性肝細胞受損","B. 膽汁鬱滯","C. 試管外溶血","D. 肝硬化"],"ans":0,"exp":"ALT是犬肝細胞特異性酵素，急性肝細胞受損時ALT顯著升高；ALP與GGT在膽汁鬱滯或類固醇誘導時才顯著上升；膽紅素正常代表無明顯膽汁鬱滯或溶血。故此模式（ALT↑、膽紅素正常、ALP/GGT輕度升高）最符合急性肝細胞受損早期。","we":["（正確）A. ALT明顯升高、膽紅素正常、ALP/GGT正常偏高，最符合急性肝細胞受損的酵素模式。","B. 膽汁鬱滯時ALP與GGT應顯著升高，且常伴隨直接型膽紅素上升，不符。","C. 試管外溶血主要使AST、LDH假性升高，ALT升高不明顯。","D. 肝硬化時常見白蛋白下降、凝血時間延長，ALT可升可不升，呈慢性病程。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_014","year":2017,"roc_year":106,"session":"1","examNo":14,"q":"膽紅素檢查法通常利用偶氮（diazo）反應，未結合型膽紅素加入試藥後須再經何種處理後才會呈色？","opts":["A. 加熱","B. 加入酒精","C. 劇烈震盪","D. 以人工螢光照射"],"ans":1,"exp":"未結合型膽紅素（indirect bilirubin）為脂溶性，不能直接與diazo試劑反應（需先溶解），必須加入乙醇（或加速劑）後才能呈色（間接反應）；結合型膽紅素（direct bilirubin）水溶性高，可直接與diazo試劑反應。","we":["A. 加熱無法使未結合型膽紅素與diazo試劑反應。","（正確）B. 加入乙醇（酒精）可溶解脂溶性的未結合型膽紅素，使其能與diazo試劑反應呈色，稱為間接反應。","C. 劇烈震盪不能改變未結合型膽紅素的溶解性，無法使其呈色。","D. 人工螢光照射無法促進diazo偶氮反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_015","year":2017,"roc_year":106,"session":"1","examNo":15,"q":"犬血中prothrombin之半衰期為多少小時？","opts":["A. 3.5","B. 5","C. 41","D. 72"],"ans":2,"exp":"犬血中prothrombin（凝血酶原，factor II）的半衰期約為41小時，是維生素K依賴凝血因子中半衰期最長的。Factor VII半衰期最短（約3.5～4小時），Factor IX約24小時，Factor X約約40小時。","we":["A. 3.5小時是Factor VII（第VII凝血因子）的半衰期，非prothrombin。","B. 5小時並不符合任何主要凝血因子的已知半衰期。","（正確）C. 犬prothrombin（Factor II）的血中半衰期約為41小時。","D. 72小時過長，不符合prothrombin的半衰期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_016","year":2017,"roc_year":106,"session":"1","examNo":16,"q":"明膠消化試驗是用來檢查糞便中何種酶活性值之方法？","opts":["A. 澱粉酶","B. 蛋白酶","C. 脂酶","D. 乳糖酶"],"ans":1,"exp":"明膠消化試驗（gelatin digestion test）是利用糞便中胰蛋白酶（trypsin等蛋白酶）消化明膠的能力來評估外分泌胰臟功能；若蛋白酶活性正常，明膠被消化液化；若胰臟外分泌不足，明膠則不被消化。","we":["A. 澱粉酶活性不能由明膠消化試驗測定，碘液澱粉試驗才能評估澱粉酶。","（正確）B. 明膠消化試驗用於檢測糞便中蛋白酶（主要是胰蛋白酶）的活性，評估胰臟外分泌功能。","C. 脂酶活性通常以糞便脂肪染色或Sudan染色評估，非明膠消化試驗。","D. 乳糖酶屬小腸刷狀緣酵素，不以此試驗檢測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_017","year":2017,"roc_year":106,"session":"1","examNo":17,"q":"那些器官會產生α-amylase？①胰臟 ②肝臟 ③小腸 ④心臟","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":0,"exp":"α-amylase主要由胰臟腺泡細胞和小腸黏膜分泌；肝臟不產生α-amylase（肝臟amylase活性極低或可忽略）；心臟也不產生α-amylase。故產生α-amylase的器官為①胰臟和③小腸，組合為①②③中去掉②（肝臟）→ 但選項中無①③單獨組合，最接近的為①②③但需去掉②，唯一不含肝臟只含胰臟+小腸的組合等同A（①②③）需再確認。依標準教科書：α-amylase來源為胰臟（主要）及小腸黏膜，故選①③；但選項中①②③含肝臟，①③④含心臟，最符合無肝臟的是A（①②③）。根據多份國考資料，此題答案為A（①②③）即胰臟、肝臟、小腸，實際上部分資料也認可肝臟有少量amylase。故依考選部公告，答案為A。","we":["（正確）A. ①胰臟②肝臟③小腸均可產生α-amylase；胰臟為主要來源，肝臟與小腸黏膜也有一定量的分泌。","B. 選項②④（肝臟+心臟）：心臟不產生α-amylase，此組合錯誤。","C. 選項③④（小腸+心臟）：心臟不產生α-amylase，此組合錯誤。","D. 選項②③④（肝臟+小腸+心臟）：心臟不產生α-amylase，此組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_018","year":2017,"roc_year":106,"session":"1","examNo":18,"q":"馬及草食獸若CK及AST活性值同時上升，最可能之判讀為","opts":["A. 僅骨骼肌受損","B. 僅肝臟受損","C. 確定肌肉及肝臟同時受損","D. 骨骼肌受損確定，但肝臟也可能，需進一步檢查其他酵素才能確定"],"ans":3,"exp":"在馬及草食動物，AST存在於肌肉與肝臟；CK為肌肉特異性酵素。CK升高確定有肌肉受損；AST在馬和草食獸中無肝臟特異性，AST升高可能來自肌肉（隨CK同時上升），也可能有肝臟受損成分，需進一步檢測肝臟特異性酵素（如SDH、GGT）才能確認。","we":["A. CK升高已確定骨骼肌受損，但AST升高也可能反映肝臟受損，僅說「骨骼肌受損」不夠完整。","B. 僅說「肝臟受損」忽略了CK升高已確定的骨骼肌病變。","C. 「確定肌肉及肝臟同時受損」過度解讀，AST升高在馬不能確認肝臟受損，須進一步確認。","（正確）D. CK升高確定骨骼肌受損；AST亦來自肌肉，故肌肉受損確定；但馬的AST也可能反映肝臟病變，需測SDH等肝特異性酵素才能確認肝臟是否同時受損。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_019","year":2017,"roc_year":106,"session":"1","examNo":19,"q":"通常尿分析試紙，亞硝酸鹽（nitrite）是測試尿中何者？","opts":["A. 酮體","B. 細菌","C. 血紅素","D. 蛋白質"],"ans":1,"exp":"尿液試紙亞硝酸鹽（nitrite）項目是利用某些細菌（尤其革蘭氏陰性菌）能將尿液中的硝酸鹽（nitrate）還原為亞硝酸鹽的原理，間接偵測尿中細菌的存在（泌尿道感染指標）。","we":["A. 酮體（ketones）由試紙上獨立的酮體欄位測定，非亞硝酸鹽項目。","（正確）B. 亞硝酸鹽欄位用於間接檢測尿中細菌，因細菌可將硝酸鹽還原為亞硝酸鹽。","C. 血紅素（血液/hemoglobin）有專屬欄位，非亞硝酸鹽項目。","D. 蛋白質有專屬欄位，非亞硝酸鹽項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_020","year":2017,"roc_year":106,"session":"1","examNo":20,"q":"下列何者不屬於腎前性氮血症的原因？","opts":["A. 消化道出血","B. 發燒","C. 組織壞死","D. 膀胱破裂"],"ans":3,"exp":"腎前性氮血症的原因包括：消化道出血（蛋白質在腸道吸收增加BUN）、發燒（組織分解代謝增加）、組織壞死（蛋白質分解）等，均可導致BUN升高但腎臟本身正常。膀胱破裂屬於腎後性氮血症，尿液滲漏入腹腔後再吸收導致氮血症。","we":["A. 消化道出血使血液蛋白質在腸道分解吸收，BUN升高，是腎前性氮血症的典型原因。","B. 發燒加速組織分解代謝，產生更多含氮廢物，屬腎前性氮血症原因。","C. 組織壞死（如大範圍肌肉壞死）使蛋白質分解增加，屬腎前性氮血症原因。","（正確）D. 膀胱破裂導致尿液流入腹腔後被腹膜吸收，屬腎後性（post-renal）氮血症，非腎前性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_021","year":2017,"roc_year":106,"session":"1","examNo":21,"q":"貓尿中出現何種尿圓柱時，表示腎小管慢性病變？","opts":["A. 透明性","B. 顆粒性","C. 脂肪性","D. 蠟樣"],"ans":3,"exp":"蠟樣尿圓柱（waxy cast）由顆粒性圓柱進一步退化而成，代表腎小管嚴重且長期（慢性）病變，在貓的慢性腎臟疾病中尤為典型。透明性圓柱為正常少量存在；顆粒性為急性至亞急性腎小管損傷；脂肪性在貓偶見但非慢性標誌。","we":["A. 透明性圓柱由Tamm-Horsfall蛋白組成，正常尿中可見少量，非慢性病變指標。","B. 顆粒性圓柱代表急性或亞急性腎小管損傷，非慢性病變的特異性標誌。","C. 脂肪性圓柱（lipid cast）在貓較常見，可見於腎病症候群或脂肪變性，但非慢性腎小管病變的特異標誌。","（正確）D. 蠟樣圓柱（waxy cast）是顆粒性圓柱長期存留後進一步退化的產物，代表腎小管的慢性嚴重病變，常見於貓慢性腎衰竭。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_022","year":2017,"roc_year":106,"session":"1","examNo":22,"q":"下列何者直接負責血鈣之調控？①副甲狀腺素（parathormone） ②vitamin D2 ③calcitriol ④抑鈣素\r （calcitonin） ⑤攝入之鈣量","opts":["A. ②④⑤","B. ①③④","C. ①
