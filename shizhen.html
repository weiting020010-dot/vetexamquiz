. 巨核細胞系"],"ans":0,"exp":"骨髓增殖性疾病（MPD）是指骨髓中非淋巴系細胞的惡性增生，包括紅血球系（真性紅血球增多症）、顆粒球系/單核球系、巨核細胞系等。淋巴球系增生屬於淋巴增殖性疾病（lymphoproliferative disorder），不歸類於MPD。","we":["（正確）A. 淋巴球系增生屬淋巴增殖性疾病（LPD），不屬MPD，故為正確答案。","B. 單核球系增生（如急性單核球性白血病）屬MPD範疇。","C. 紅血球系增生（如真性紅血球增多症）屬MPD範疇。","D. 巨核細胞系增生（如原發性血小板增多症）屬MPD範疇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_010","year":2018,"roc_year":107,"session":"1","examNo":10,"q":"血片白血球分類時發現單核球數減少，臨床上代表之意義為何？","opts":["A. 不具有很大的意義","B. 有免疫性疾病","C. 可能正在用類固醇治療","D. 有重度緊迫"],"ans":0,"exp":"血片中單核球數量減少在臨床上不具有太大的診斷意義，因為正常血液中單核球本來數量就少，且計數誤差較大；相較之下，單核球增多（monocytosis）才具有診斷價值（如慢性炎症）。","we":["（正確）A. 單核球數減少臨床意義不大，此為正確答案。","B. 免疫性疾病主要影響淋巴球而非導致單核球減少。","C. 類固醇治療通常引起單核球增多（monocytosis）而非減少。","D. 重度緊迫（stress）導致的白血球型式是嗜中性球增多、淋巴球減少，不以單核球減少為主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_011","year":2018,"roc_year":107,"session":"1","examNo":11,"q":"封魏氏病（von Willebrand's disease）引起之止血障礙病畜，常見下列何種異常？","opts":["A. 血小板數減少","B. 口腔黏膜出血時間（buccal mucosal bleeding time）延長","C. 一段式凝血酶原時間（one-stage prothrombin time）延長","D. 活化部分成栓質時間（activated partial thromboplastin time）嚴重延長"],"ans":1,"exp":"von Willebrand病（vWD）是由vWF缺乏引起的初期止血障礙，影響血小板附著於受損血管壁，因此口腔黏膜出血時間（BMBT）延長是最常見的異常。血小板數目通常正常，OSPT也正常，APTT可能輕度延長但不嚴重。","we":["A. vWD中血小板數目通常正常，只是功能異常（附著障礙），不會出現血小板數減少。","（正確）B. BMBT延長是vWD最典型的異常，反映初期止血（血小板栓形成）缺陷，為正確答案。","C. OSPT檢測外源性凝血路徑，vWD不影響此路徑，OSPT通常正常。","D. APTT在嚴重vWD時可能輕度延長（因vWF攜帶Factor VIII），但不會嚴重延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_012","year":2018,"roc_year":107,"session":"1","examNo":12,"q":"犬呈現中度貧血，MCV輕度下降，血清鐵量輕度降低，血清總鐵結合能力降低，血清ferritin增加。下列何者\r 為最可能的貧血原因？","opts":["A. 缺鐵性貧血末期","B. 失血性貧血之早期","C. 骨髓纖維化","D. 慢性炎症性疾病"],"ans":3,"exp":"慢性炎症性疾病（anemia of chronic disease）的鐵代謝特徵：血清鐵↓、TIBC↓（與缺鐵性貧血TIBC升高不同）、ferritin↑（鐵儲存增加但無法利用）。這是因為發炎時hepcidin增加，阻止鐵從儲存場所釋放，導致功能性缺鐵。","we":["A. 缺鐵性貧血末期：血清鐵↓、TIBC↑、ferritin↓，與題目TIBC降低、ferritin增加不符。","B. 失血性貧血早期：血清鐵正常或輕降，TIBC正常，ferritin正常，不符合。","C. 骨髓纖維化：主要表現為pancytopenia，鐵代謝特徵與題目描述不符。","（正確）D. 慢性炎症性疾病：血清鐵↓、TIBC↓、ferritin↑，完全符合題目描述，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_013","year":2018,"roc_year":107,"session":"1","examNo":13,"q":"下列何者於臨床上，用於指出紅血球大小分布時最為有用？","opts":["A. MCV","B. MCH","C. MCHC","D. RDW"],"ans":3,"exp":"RDW（Red Cell Distribution Width，紅血球分佈寬度）直接反映紅血球大小的變異程度（anisocytosis），數值越高代表大小差異越大，臨床上最常用於評估紅血球大小分布。MCV僅代表平均值，無法反映分布寬度。","we":["A. MCV（平均紅血球容積）代表紅血球的平均大小，無法反映大小分布的離散程度。","B. MCH（平均血紅素量）反映紅血球平均含血紅素量，與大小分布無直接關係。","C. MCHC（平均血紅素濃度）反映血紅素濃度，與大小分布無直接關係。","（正確）D. RDW直接量化紅血球大小的變異係數，最適合用於指出紅血球大小分布，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_014","year":2018,"roc_year":107,"session":"1","examNo":14,"q":"下圖劉氏（Liu's）染色骨髓抹片中，箭頭所指者最可能是","opts":["A. 紅血球系之細胞","B. 骨髓球系之細胞","C. 血小板系之細胞","D. 造骨胚細胞"],"ans":2,"exp":"劉氏染色骨髓抹片中，巨核細胞（megakaryocyte）是骨髓中體積最大的細胞，胞質寬廣呈淡紫色顆粒狀，為血小板系之前驅細胞。此題需參照圖示判斷，標準答案為血小板系（巨核細胞系）之細胞。","we":["A. 紅血球系細胞（從原紅血球到網狀球）體積較小，胞核圓而染色質緻密，不符合巨核細胞特徵。","B. 骨髓球系細胞（嗜中性球前驅）胞質含特異性顆粒，體積中等，特徵不同於巨核細胞。","（正確）C. 血小板系（巨核細胞）體積最大，胞質豐富含顆粒，為骨髓抹片最易辨識的細胞之一。","D. 造骨胚細胞（osteoblast）偶見於骨髓塗片邊緣，與造血細胞形態不同，不符合常規骨髓特徵。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1071_實診_015","year":2018,"roc_year":107,"session":"1","examNo":15,"q":"下列正常家畜中，何者之血液抹片，紅血球最常呈現明顯之中央淡染？","opts":["A. 犬","B. 牛","C. 豬","D. 雞"],"ans":0,"exp":"正常犬的紅血球為雙凹圓盤形（biconcave disc），中央淡染區（central pallor）非常明顯，約佔細胞直徑的1/3～1/2。相較之下，貓紅血球中央淡染不明顯；牛紅血球小且淡染不著；雞為有核紅血球，不具中央淡染特徵。","we":["（正確）A. 犬的紅血球中央淡染最為明顯，是正常犬血片的典型特徵，為正確答案。","B. 牛的紅血球體積小（小紅血球性），中央淡染不明顯。","C. 豬的紅血球中央淡染不如犬明顯。","D. 雞的紅血球為有核紅血球（橢圓形），無中央淡染概念。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_016","year":2018,"roc_year":107,"session":"1","examNo":16,"q":"形成穩定血栓時，參與之鈣離子為第幾凝血因子？","opts":["A. II","B. IV","C. VIII","D. XI"],"ans":1,"exp":"在凝血因子的命名中，Factor IV即鈣離子（Ca²⁺），參與多個凝血步驟，包括穩定血栓形成時的凝血酶原複合體活化及纖維素交聯（Factor XIII活化需Ca²⁺）。","we":["A. Factor II為凝血酶原（prothrombin），非鈣離子。","（正確）B. Factor IV即鈣離子（Ca²⁺），為正確答案。","C. Factor VIII為抗血友病因子A（anti-hemophilic factor A），非鈣離子。","D. Factor XI為血漿成栓激活素前驅物（plasma thromboplastin antecedent），非鈣離子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_017","year":2018,"roc_year":107,"session":"1","examNo":17,"q":"下列那種疾病或症狀與低白蛋白血症無關？","opts":["A. 慢性肝病","B. 散播性血管內凝血","C. 嚴重滲出性皮膚病","D. 腹水"],"ans":1,"exp":"低白蛋白血症的原因包括：白蛋白生合成減少（慢性肝病）、白蛋白流失增加（蛋白流失性腸病、嚴重滲出性皮膚病、腎病症候群）、分布改變（腹水）。散播性血管內凝血（DIC）主要影響凝血因子與血小板消耗，不直接造成白蛋白流失，與低白蛋白血症關係不直接。","we":["A. 慢性肝病時白蛋白合成減少，確實與低白蛋白血症有關。","（正確）B. DIC主要造成凝血因子消耗性出血，不直接導致低白蛋白血症，與低白蛋白血症無關，為正確答案。","C. 嚴重滲出性皮膚病（如燒傷、廣泛性皮膚炎）白蛋白從皮膚大量流失，確實與低白蛋白血症有關。","D. 腹水時白蛋白積存於腹腔，導致血清白蛋白下降，確實與低白蛋白血症有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_018","year":2018,"roc_year":107,"session":"1","examNo":18,"q":"何種藥物不會造成高血脂症？","opts":["A. prednisolone","B. aminoglycoside","C. phenytoin","D. thiazide"],"ans":1,"exp":"可引起高血脂症的藥物包括：皮質類固醇（prednisolone）、phenytoin（抗癲癇）、thiazide利尿劑等。Aminoglycoside（氨基糖苷類抗生素）主要毒性為腎毒性與耳毒性，不會造成高血脂症。","we":["A. Prednisolone（皮質類固醇）會促進脂肪分解及肝臟脂蛋白合成，造成高血脂症。","（正確）B. Aminoglycoside不影響脂質代謝，不造成高血脂症，為正確答案。","C. Phenytoin（苯妥英）可影響脂質代謝，部分文獻報告可引起高血脂症。","D. Thiazide利尿劑可升高LDL與三酸甘油酯，造成高血脂症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_019","year":2018,"roc_year":107,"session":"1","examNo":19,"q":"犬血清GGT之主要來源為","opts":["A. 腎","B. 胰","C. 肝","D. 骨"],"ans":2,"exp":"犬血清中GGT（γ-glutamyltransferase，γ-麩氨醯轉移酶）的主要來源為肝臟（膽管上皮細胞），主要用於評估膽汁鬱滯性肝病。注意：貓的GGT主要來源也是肝，但牛的血清GGT可反映肝及腎兩者。","we":["A. 腎臟含有大量GGT，但犬尿液中GGT升高才反映腎小管損傷；血清GGT主要來自肝臟。","B. 胰臟組織含GGT，但對血清GGT貢獻不如肝臟顯著。","（正確）C. 犬血清GGT主要來源為肝臟（膽管上皮），是評估膽汁鬱滯的重要指標，為正確答案。","D. 骨骼來源的酵素主要是ALP（骨型），不包含GGT。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_020","year":2018,"roc_year":107,"session":"1","examNo":20,"q":"下列何者會造成creatine kinase活性值的假性升高？","opts":["A. 犬之低甲狀腺功能症","B. 高膽紅素血症","C. 黃麴毒素中毒","D. 靜脈注射刺激藥物之意外漏出"],"ans":1,"exp":"高膽紅素血症（hyperbilirubinemia）時，膽紅素為黃橙色色素，在分光光度法測定CK時造成光學干擾，使CK活性測定值假性升高。低甲狀腺功能症是CK真性升高的原因。","we":["A. 犬低甲狀腺功能症（hypothyroidism）會真性升高CK（因肌肉代謝異常），不是假性升高。","（正確）B. 高膽紅素血症中膽紅素色素干擾比色法測定，造成CK假性升高，為正確答案。","C. 黃麴毒素中毒主要引起肝毒性，不直接造成CK假性升高。","D. 靜脈注射刺激藥物意外漏出（extravasation）會損傷局部肌肉，造成CK真性升高，非假性升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_021","year":2018,"roc_year":107,"session":"1","examNo":21,"q":"一般而言當動物的腎元損壞多少％時，即易出現氮血症？","opts":["A. 25","B. 50","C. 66","D. 75"],"ans":3,"exp":"腎臟有強大的代償能力，必須有約75%以上的腎元（nephron）喪失功能後，剩餘腎元不足以維持正常代謝廢物排除，才易出現氮血症（azotemia）。此為經典的「腎臟儲備力」概念。","we":["A. 損壞25%腎元時，剩餘75%仍可充分代償，不會出現氮血症。","B. 損壞50%腎元，剩餘腎元仍可代償，通常不出現氮血症。","C. 損壞66%（2/3）腎元，雖接近臨界，通常仍可維持，一般以75%為臨界值。","（正確）D. 損壞75%以上腎元時，剩餘腎元不足代償，才易出現氮血症，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_022","year":2018,"roc_year":107,"session":"1","examNo":22,"q":"尿中出現血紅素尿及肌紅素尿很難以試紙驗出，懷疑血紅素尿時，可由血中何種數值幫助判定？","opts":["A. hematocrit","B. creatinine","C. creatine kinase","D. BUN"],"ans":0,"exp":"懷疑血紅素尿（hemoglobinuria）時，可觀察血漿顏色（血漿呈粉紅色至紅色）並測定hematocrit：若Hct降低且血漿呈紅色，表示有血管內溶血釋出游離血紅素；若血漿清澈，則不支持血紅素尿診斷。","we":["（正確）A. Hematocrit降低並伴隨血漿呈紅色，可幫助確認血管內溶血造成的血紅素尿，為正確答案。","B. Creatinine反映腎臟排泄功能，無法區別血紅素尿與肌紅素尿。","C. CK（creatine kinase）升高有助於判斷肌紅素尿（來自肌肉損傷），而非血紅素尿。","D. BUN反映腎臟功能與蛋白代謝，無法幫助區別血紅素尿。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_023","year":2018,"roc_year":107,"session":"1","examNo":23,"q":"下列關於血鈣的敘述，何者錯誤？","opts":["A. 鹼血症嚴重時，鈣離子濃度降低，且血清總鈣量也會下降","B. 酸血症時，鈣離子濃度增加","C. 高血鈣時，其鈣離子濃度大多也會示高值","D. 低血鈣症時，其鈣離子濃度仍可在正常範圍內"],"ans":0,"exp":"鹼血症（alkalosis）時，pH升高使白蛋白帶更多負電荷，與鈣離子結合增加，因此游離鈣離子（ionized Ca²⁺）降低；但血清總鈣量（包含結合型）並不一定下降，整體蛋白結合鈣增加而游離鈣下降。故「血清總鈣量也會下降」的敘述錯誤。","we":["（正確）A. 嚴重鹼血症時鈣離子（游離型）確實降低，但血清總鈣量不一定下降，此敘述錯誤，為答案。","B. 酸血症時pH降低，白蛋白與鈣結合減少，游離鈣離子濃度增加，敘述正確。","C. 高血鈣症時總鈣量升高，游離鈣離子濃度大多也偏高，敘述正確。","D. 低血鈣症如低白蛋白血症時，總鈣下降但游離鈣可能正常（白蛋白結合型減少），敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_024","year":2018,"roc_year":107,"session":"1","examNo":24,"q":"下列關於腦垂腺前葉的功能測試之敘述，何者正確？","opts":["A. 可以直接測定血中抗利尿激素（antidiuretic hormone，ADH）濃度來評估","B. 德國狼犬（German Shepherd）易有腦垂腺矮小症（pituitary dwarfism）之發生","C. 進行生長激素（growth hormone，GH）刺激試驗時，其血液樣本經heparin抗凝遠心分離後即不\r 必冷凍保存","D. 犬GH濃度無日間波動現象，故其測定值可信度高"],"ans":1,"exp":"德國狼犬（German Shepherd Dog）是腦垂腺矮小症（pituitary dwarfism）的好發品種，因囊性Rathke's cleft殘留造成腦垂腺前葉發育不全，導致GH等激素分泌不足，引起生長遲緩。","we":["A. ADH可以直接測定，但臨床上評估腦垂腺後葉功能，不是前葉功能測試的指標。","（正確）B. 德國狼犬確實為腦垂腺矮小症的好發品種，敘述正確，為答案。","C. GH刺激試驗血液樣本需立即離心分離後冷凍保存（-20°C），不能僅以heparin抗凝後常溫保存。","D. 犬GH有日間波動（pulsatile secretion），單次測定可信度低，需刺激試驗輔助評估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_025","year":2018,"roc_year":107,"session":"1","examNo":25,"q":"體液與體液滲透壓的調節由那些荷爾蒙調控？①cortisol ②ADH ③somatotropin\r ④aldosterone","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":3,"exp":"體液量與滲透壓的調節主要由ADH（抗利尿激素，控制水分重吸收）及aldosterone（醛固酮，控制Na⁺/K⁺平衡影響水分）共同調控。Cortisol在高濃度時有弱mineralocorticoid作用，但不是主要調節者；somatotropin（生長激素）主要促進生長代謝，不是體液滲透壓的主要調節者。","we":["A. ①③：cortisol有弱鈉滯留作用，但不是主要調節者；somatotropin不調節體液滲透壓。","B. ①④：cortisol非主要調節荷爾蒙，組合不完整。","C. ②③：somatotropin不調節體液與滲透壓，組合錯誤。","（正確）D. ②④：ADH調節水分重吸收、aldosterone調節Na⁺平衡，兩者共同調控體液量與滲透壓，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_026","year":2018,"roc_year":107,"session":"1","examNo":26,"q":"下列關於動脈血氧分壓（PaO 2 ）的敘述，何者正確？","opts":["A. 可計算血漿中的O 2 溶量","B. 能反應血中的總帶氧量","C. 高PaO 2 可見於法洛氏四畸型患者（Fallot's tetrad）","D. 高PaO 2 可見於肺有血栓的患者"],"ans":0,"exp":"動脈血氧分壓（PaO₂）代表血漿中物理溶解的O₂張力，依Henry定律可計算血漿中溶解O₂量（溶解量 = PaO₂ × 0.003 mL/dL/mmHg）。PaO₂無法直接反映總帶氧量（需包含Hb結合氧）；法洛氏四畸型及肺血栓均導致低PaO₂而非高PaO₂。","we":["（正確）A. PaO₂可依Henry定律計算血漿中物理溶解的O₂量，敘述正確，為答案。","B. 總帶氧量需依賴Hb濃度與SaO₂計算，PaO₂只反映溶解氧，不能代表總帶氧量。","C. 法洛氏四畸型（right-to-left shunt）導致靜脈血混入動脈，造成低PaO₂，而非高PaO₂。","D. 肺血栓造成通氣-灌流不匹配，導致低PaO₂，而非高PaO₂。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_027","year":2018,"roc_year":107,"session":"1","examNo":27,"q":"造成酸鹼／電解質不平衡最常見的原因為","opts":["A. 心臟疾病","B. 胃腸道疾病","C. 肝臟疾病","D. 腎臟疾病"],"ans":1,"exp":"胃腸道疾病（如嘔吐、腹瀉）是臨床上最常見造成酸鹼與電解質不平衡的原因，因為大量流失含有HCl（嘔吐→鹼中毒）或碳酸氫根（腹瀉→酸中毒）及電解質（Na⁺、K⁺、Cl⁻）的消化液。","we":["A. 心臟疾病主要影響循環，不直接是酸鹼/電解質不平衡最常見的原因。","（正確）B. 胃腸道疾病（嘔吐/腹瀉）最常見造成酸鹼與電解質失衡，為正確答案。","C. 肝臟疾病可造成低蛋白血症、低鈉等，但不是最常見原因。","D. 腎臟疾病也是重要原因，但臨床上胃腸道疾病更為常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_028","year":2018,"roc_year":107,"session":"1","examNo":28,"q":"犬之皮膚腫塊，細胞學採樣鏡檢觀察結果如下圖，該犬最可能罹患下列何種腫瘤？","opts":["A. 黑色素瘤（melanoma）","B. 肥胖細胞瘤（mast cell tumor）","C. 漿細胞瘤（plasmacytoma）","D. 組織細胞瘤（histiocytoma）"],"ans":1,"exp":"肥胖細胞瘤（mast cell tumor）細胞學特徵：圓形細胞，胞質含大量紫色（異染性）顆粒，背景可見嗜酸性球。此為犬最常見的皮膚腫瘤之一，細胞學可診斷。此題需參照圖示確認。","we":["A. 黑色素瘤細胞學：含黑色/褐色黑色素顆粒，細胞形態多變（圓形至梭形），顆粒特徵不同。","（正確）B. 肥胖細胞瘤含大量異染性（metachromatic）紫色胞質顆粒，為典型細胞學特徵，為正確答案。","C. 漿細胞瘤：細胞圓形，有鐘面狀染色質與偏心核，無顆粒特徵。","D. 組織細胞瘤：小圓形細胞，胞核腎形或不規則，無明顯顆粒。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1071_實診_029","year":2018,"roc_year":107,"session":"1","examNo":29,"q":"嚴重低蛋白血症所引發之腹水常屬於下列何者？","opts":["A. 純粹性漏出液","B. 修飾性漏出液","C. 化膿性滲出液","D. 修飾性滲出液"],"ans":0,"exp":"嚴重低蛋白血症（hypoalbuminemia）導致膠體滲透壓下降，水分從血管滲入體腔，形成純粹性漏出液（pure transudate），特徵為蛋白質含量極低（<2.5 g/dL）、細胞數極少、比重低。","we":["（正確）A. 低蛋白血症引起膠體滲透壓降低，形成純粹性漏出液，為正確答案。","B. 修飾性漏出液通常由靜水壓升高（如右心衰竭）或淋巴阻塞引起，蛋白含量稍高。","C. 化膿性滲出液（suppurative exudate）見於細菌性腹膜炎，與低蛋白血症無關。","D. 修飾性滲出液非標準分類術語，低蛋白血症產生的是純粹性漏出液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_030","year":2018,"roc_year":107,"session":"1","examNo":30,"q":"貓傳染性腹膜炎時，其腦脊髓液常見多細胞症，但通常不包含那種細胞？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 單核球","D. 淋巴球"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）侵犯中樞神經系統時，腦脊髓液（CSF）出現多細胞症（pleocytosis），主要為嗜中性球、單核球及淋巴球的混合型增加。嗜酸性球（eosinophil）通常不出現在FIP的CSF中，嗜酸性球性腦膜腦炎有其他特定原因。","we":["A. 嗜中性球在FIP的CSF中常見，屬於混合型多細胞症的一部分。","（正確）B. 嗜酸性球通常不出現在FIP的CSF中，為正確答案。","C. 單核球在FIP的CSF中常見。","D. 淋巴球在FIP的CSF中常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_031","year":2018,"roc_year":107,"session":"1","examNo":31,"q":"下列何種血清中化學物質，當密封於瓶中並保存於負20℃冰箱時，可保存長達6個月之久？","opts":["A. aldolase","B. cholinesterase","C. ALT","D. cholesterol"],"ans":3,"exp":"膽固醇（cholesterol）為脂質，化學性質穩定，在密封瓶中-20°C條件下可保存長達6個月，是血清化學物質中保存期限最長者之一。相較之下，酵素類（aldolase、cholinesterase、ALT）穩定性較差，保存期限較短。","we":["A. Aldolase為酵素，不穩定，-20°C保存期限遠不及6個月。","B. Cholinesterase為酵素，-20°C保存雖較好，但不及脂質穩定。","C. ALT為酵素，保存穩定性不如脂質，-20°C約可保存數週至數月。","（正確）D. Cholesterol（膽固醇）化學穩定，-20°C密封可保存達6個月，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_032","year":2018,"roc_year":107,"session":"1","examNo":32,"q":"下列有關尿液樣本之採集何者錯誤？","opts":["A. 若無法取得早晨尿，則可以食後3小時之尿液作為檢查材料","B. 導尿或自然排出之尿液均可施行細胞學檢查","C. 甲苯會妨礙尿化學檢查，所以不常被廣泛應用","D. 自然排尿之尿液應採中段或末段之排出尿液為宜"],"ans":2,"exp":"甲苯（toluene）是常用的尿液防腐劑之一，能在尿液表面形成薄膜抑制細菌生長，且對多數尿化學試驗干擾較少，因此確實被廣泛應用。選項C稱「甲苯妨礙尿化學檢查，所以不常被廣泛應用」是錯誤的。","we":["A. 若無法取得早晨尿，一般建議食後4小時（而非3小時）採集，但此選項的臨床實務中也可接受，不是最明顯的錯誤。","B. 導尿或自然排出的尿液均可施行細胞學檢查，敘述正確。","（正確）C. 甲苯是常用防腐劑且廣泛應用，「不常被廣泛應用」的說法錯誤，為答案。","D. 自然排尿採中段或末段較乾淨，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_033","year":2018,"roc_year":107,"session":"1","examNo":33,"q":"下列何種組織檢體之保存方法最適合使用於冷凍切片檢查？","opts":["A. 冰塊法","B. 液態氮法","C. 乾冰法","D. 冷藏法"],"ans":1,"exp":"冷凍切片（frozen section）需要快速冷凍組織以保持細胞形態，液態氮（-196°C）能瞬間冷凍組織，避免冰晶形成，是最適合用於冷凍切片的組織保存方法。乾冰（-78°C）也可用，但不如液態氮快速；冰塊和冷藏（4°C）溫度不夠，會產生大冰晶破壞組織。","we":["A. 冰塊法（0°C）溫度不夠低，形成大冰晶會破壞組織細胞結構，不適合冷凍切片。","（正確）B. 液態氮法（-196°C）瞬間冷凍，最能保護組織形態，最適合冷凍切片，為正確答案。","C. 乾冰法（-78°C）可用，但速度不如液態氮，仍可能產生冰晶影響切片品質。","D. 冷藏法（4°C）溫度太高，只能暫時保存，無法用於冷凍切片。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_034","year":2018,"roc_year":107,"session":"1","examNo":34,"q":"下列何者最適於免疫檢查用血清之防腐？","opts":["A. 0.5%石炭酸","B. 10%中性福馬林液","C. 甲苯","D. Zenker氏液"],"ans":0,"exp":"用於免疫檢查的血清防腐最適合使用0.5%石炭酸（phenol，苯酚），能抑制細菌生長又不影響血清蛋白的免疫活性。福馬林及Zenker液用於組織固定；甲苯用於尿液防腐，不適合血清免疫檢查。","we":["（正確）A. 0.5%石炭酸（苯酚）是血清免疫檢查用防腐劑的標準選擇，為正確答案。","B. 10%中性福馬林液用於組織病理固定，會使蛋白質變性，不適合免疫檢查。","C. 甲苯用於尿液防腐，不適合血清。","D. Zenker氏液（含重鉻酸鉀及昇汞）為組織固定液，不適合血清防腐。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_035","year":2018,"roc_year":107,"session":"1","examNo":35,"q":"下列何者不是嗜酸性球增多症之原因？","opts":["A. 服用四環素反應","B. 纖維肉瘤","C. 貓之高甲狀腺功能症","D. 庫興症候群"],"ans":3,"exp":"庫興症候群（Cushing's syndrome，高腎上腺皮質功能症）時皮質類固醇過多，導致嗜酸性球從循環中消失（eosinopenia），是嗜酸性球減少症（eosinopenia）的原因，而非增多症的原因。其他選項（四環素反應、纖維肉瘤的副腫瘤效應、貓高甲狀腺功能症）可造成嗜酸性球增多。","we":["A. 服用四環素的過敏/藥物反應可引起嗜酸性球增多症，非此題答案。","B. 纖維肉瘤等腫瘤的副腫瘤效應可刺激嗜酸性球增多，非此題答案。","C. 貓高甲狀腺功能症（hyperthyroidism）部分病例可見嗜酸性球增多，非此題答案。","（正確）D. 庫興症候群（皮質類固醇過多）造成嗜酸性球減少症，不是增多症的原因，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_036","year":2018,"roc_year":107,"session":"1","examNo":36,"q":"Russell's viper venom time（RVVT）正常，但one-stage prothrombin time（OSPT）延長為第幾凝血因子\r 缺乏造成？","opts":["A. Ⅶ","B. Ⅹ","C. Ⅷ","D. Ⅸ"],"ans":0,"exp":"RVVT（Russell's viper venom time）可繞過Factor VII、VIII、IX、XI，直接活化Factor X，檢測共同路徑（Factor X、V、II、I）。OSPT（one-stage prothrombin time）檢測外源性路徑（Factor VII）及共同路徑。RVVT正常表示共同路徑正常，OSPT延長表示外源性路徑有問題，唯一可能為Factor VII缺乏。","we":["（正確）A. Factor VII僅參與外源性路徑，RVVT正常（共同路徑OK）但OSPT延長，指向Factor VII缺乏，為正確答案。","B. Factor X缺乏會使RVVT和OSPT均延長（共同路徑），不符合RVVT正常的條件。","C. Factor VIII缺乏（血友病A）使APTT延長，不影響OSPT，也不符合。","D. Factor IX缺乏（血友病B）使APTT延長，不影響OSPT，也不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_037","year":2018,"roc_year":107,"session":"1","examNo":37,"q":"下列關於von Willebrand's disease（vWD）的敘述，何者正確？","opts":["A. 犬vWD病例90%以上為Type 2","B. Type 1 vWD為正染色體隱性遺傳型","C. Type 3 vWD為正染色體顯性遺傳型","D. 喜樂蒂牧羊犬曾有Type 3 vWD之病例報告"],"ans":3,"exp":"喜樂蒂牧羊犬（Shetland Sheepdog）確有Type 3 vWD（最嚴重型，vWF幾乎完全缺乏）的病例報告。Type 1 vWD為常染色體顯性遺傳（不完全顯性）；Type 3為常染色體隱性遺傳；犬vWD 90%以上為Type 1（不是Type 2）。","we":["A. 犬vWD 90%以上為Type 1（輕度，vWF量減少），不是Type 2。","B. Type 1 vWD為常染色體顯性（不完全顯性）遺傳，不是隱性遺傳。","C. Type 3 vWD為常染色體隱性遺傳，不是顯性遺傳。","（正確）D. 喜樂蒂牧羊犬確有Type 3 vWD病例報告，敘述正確，為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_038","year":2018,"roc_year":107,"session":"1","examNo":38,"q":"以EDTA採血管用於血小板計數時，何種動物之血小板最易產生聚集（clumping）？","opts":["A. 馬","B. 犬","C. 牛","D. 豬"],"ans":0,"exp":"貓的血小板在EDTA採血管中非常容易發生聚集（platelet clumping），導致自動計數儀計數假性偏低。這是貓血液學的重要特性，臨床上常需另以血片估計血小板數量來輔助診斷。","we":["（正確）A. 貓的血小板在EDTA中最易聚集，是血液學的重要注意事項，為正確答案。","B. 犬的血小板在EDTA中聚集問題不如貓嚴重。","C. 牛的血小板採樣相關問題不以EDTA聚集為主要特徵。","D. 豬的血小板EDTA聚集問題不如貓顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_039","year":2018,"roc_year":107,"session":"1","examNo":39,"q":"下列有關鐵的代謝，何者正確？","opts":["A. 血漿中鐵為Fe2+，由運鐵蛋白（transferrin）輸送","B. 肝殺菌素（hepcidin）可提高小腸對鐵的吸收","C. 膜鐵轉運輔助蛋白（hephaestin）是將鐵移入腸細胞的開關","D. 運鐵蛋白（transferrin）和藍胞漿素兩者均由肝臟合成"],"ans":3,"exp":"Transferrin（運鐵蛋白）與ceruloplasmin（藍胞漿素/銅藍蛋白）均由肝臟合成，是肝臟合成蛋白的代表。血漿中鐵為Fe³⁺（而非Fe²⁺）由transferrin輸送；hepcidin抑制而非提高小腸鐵吸收；hephaestin負責將鐵從腸細胞移出（而非移入）。","we":["A. 血漿中鐵以Fe³⁺（三價鐵）形式由transferrin輸送，不是Fe²⁺（二價鐵）。","B. Hepcidin（肝殺菌素）抑制ferroportin，減少小腸鐵吸收及巨噬細胞鐵釋放，不是提高吸收。","C. Hephaestin協助腸細胞將Fe²⁺氧化後移出細胞（basolateral端），不是「移入」腸細胞。","（正確）D. Transferrin和ceruloplasmin均由肝臟合成，敘述正確，為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_040","year":2018,"roc_year":107,"session":"1","examNo":40,"q":"下列何者會加強紅血球的形成作用？","opts":["A. estrogens","B. interleukin-1","C. tumor necrosis factor","D. androgens"],"ans":3,"exp":"雄性素（androgens）可刺激腎臟產生EPO（促紅血球生成素）並直接促進骨髓紅血球生成，因此可加強紅血球的形成（erythropoiesis）。Estrogens抑制紅血球生成；IL-1及TNF在慢性炎症中抑制紅血球生成。","we":["A. Estrogens（雌性素）抑制骨髓紅血球生成，不加強。","B. Interleukin-1（IL-1）在慢性發炎中抑制紅血球生成（anemia of chronic disease機制之一）。","C. Tumor necrosis factor（TNF）抑制EPO的作用及紅血球前驅細胞增殖，不加強紅血球形成。","（正確）D. Androgens刺激EPO分泌並直接促進骨髓紅血球生成，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_041","year":2018,"roc_year":107,"session":"1","examNo":41,"q":"下列何種pathway可造成氧對血紅素之親和性降低？","opts":["A. Embden-Meyerhof pathway","B. hexose-monophosphate pathway","C. methemoglobin reductase pathway","D. Luebering-Rapoport pathway"],"ans":3,"exp":"Luebering-Rapoport pathway（L-R旁路）是糖解路徑的支路，產生2,3-二磷酸甘油酸（2,3-DPG），與血紅素β鏈結合，穩定去氧血紅素型態，使氧解離曲線右移，降低血紅素對氧的親和性（有利組織供氧）。","we":["A. Embden-Meyerhof pathway（EMP，糖解路徑）產生ATP與NADH，維持紅血球能量，不直接產生2,3-DPG。","B. Hexose-monophosphate pathway（HMP，磷酸戊糖路徑）產生NADPH，保護血紅素不被氧化，不調節O2親和性。","C. Methemoglobin reductase pathway（Met-Hb還原路徑）將Fe³⁺還原回Fe²⁺，不調節O2親和性。","（正確）D. Luebering-Rapoport pathway產生2,3-DPG，降低血紅素對O2的親和性，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_042","year":2018,"roc_year":107,"session":"1","examNo":42,"q":"在鐵的代謝過程中，hepcidin在血中藉由下列何者運輸？","opts":["A. α-2-巨球蛋白","B. β-球蛋白","C. γ-球蛋白","D. 白蛋白"],"ans":3,"exp":"Hepcidin（肝殺菌素）是小分子胜肽激素（25個胺基酸），在血液循環中主要與白蛋白（albumin）結合輸送，白蛋白是多種小分子物質的重要載體蛋白。","we":["A. α-2-巨球蛋白主要攜帶蛋白酶，不是hepcidin的主要輸送蛋白。","B. β-球蛋白（如transferrin、LDL）主要輸送鐵、脂蛋白等，不是hepcidin的主要輸送蛋白。","C. γ-球蛋白主要為免疫球蛋白，不輸送hepcidin。","（正確）D. 白蛋白是hepcidin在血液中的主要輸送蛋白，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_043","year":2018,"roc_year":107,"session":"1","examNo":43,"q":"下列何種動物之MNP（marginal neutrophil pool）明顯大於CNP（circulating neutrophil pool）？","opts":["A. 犬","B. 貓","C. 犢牛","D. 馬"],"ans":1,"exp":"貓的嗜中性球MNP（邊緣嗜中性球池）明顯大於CNP（循環嗜中性球池），比例約為3:1，因此貓受到刺激（如腎上腺素）時，邊緣池嗜中性球大量進入循環，可見明顯的生理性白血球增多症。犬的MNP:CNP約為1:1。","we":["A. 犬的MNP:CNP約為1:1，兩者相近，不是MNP明顯大於CNP。","（正確）B. 貓的MNP明顯大於CNP（約3:1），為正確答案。","C. 犢牛的MNP:CNP比例不如貓懸殊。","D. 馬的MNP:CNP不如貓懸殊。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_044","year":2018,"roc_year":107,"session":"1","examNo":44,"q":"下列何者缺乏常使mean corpuscular volume變小？","opts":["A. 維生素B12","B. 葉酸","C. 鈷","D. 鐵"],"ans":3,"exp":"鐵（iron）缺乏時，血紅素合成不足，紅血球體積縮小，MCV降低，形成典型的小球性低色素性貧血（microcytic hypochromic anemia）。維生素B12和葉酸缺乏引起大球性貧血（MCV升高）；鈷缺乏（反芻動物）影響維生素B12合成，也導致大球性貧血。","we":["A. 維生素B12缺乏造成巨球性貧血（MCV升高），不是MCV變小。","B. 葉酸缺乏造成巨球性貧血（MCV升高），不是MCV變小。","C. 鈷缺乏影響維生素B12合成（反芻動物），導致大球性貧血，MCV升高，不是變小。","（正確）D. 鐵缺乏導致小球性低色素性貧血（MCV降低），為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_045","year":2018,"roc_year":107,"session":"1","examNo":45,"q":"下列何種情形會導致高蛋白血症？①脫水 ②急性發炎 ③慢性消化不良 ④大出血","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"高蛋白血症的原因：①脫水（hemoconcentration，相對性蛋白升高）、②急性發炎（急性期蛋白如fibrinogen、globulins升高）。慢性消化不良（蛋白質吸收不良）及大出血（蛋白流失）均導致低蛋白血症，不會造成高蛋白血症。","we":["（正確）A. ①脫水造成血液濃縮相對性高蛋白血症；②急性發炎使急性期蛋白升高，組合正確，為答案。","B. ②急性發炎可，但③慢性消化不良導致蛋白質吸收不足，造成低蛋白血症，組合錯誤。","C. ③慢性消化不良及④大出血均造成低蛋白血症，不正確。","D. ①脫水可，但④大出血流失蛋白及血液，造成低蛋白血症，組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_046","year":2018,"roc_year":107,"session":"1","examNo":46,"q":"正常血糖值由高至低排列，何者正確？","opts":["A. 雞 ＞ 犬 ＞ 牛","B. 犬 ＞ 牛 ＞ 雞","C. 犬 ＞ 雞 ＞ 牛","D. 雞 ＞ 牛 ＞ 犬"],"ans":0,"exp":"各動物正常空腹血糖參考值（mg/dL）：雞約200-350（禽類最高，因葡萄糖代謝特性）、犬約70-120、牛約45-75。因此由高至低排列為：雞 > 犬 > 牛。","we":["（正確）A. 雞 > 犬 > 牛，此為正確的血糖由高至低排列順序，為答案。","B. 犬 > 牛 > 雞，雞的血糖最高，此排列錯誤。","C. 犬 > 雞 > 牛，雞的血糖高於犬，此排列錯誤。","D. 雞 > 牛 > 犬，牛的血糖低於犬，此排列錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_047","year":2018,"roc_year":107,"session":"1","examNo":47,"q":"血清蛋白質電泳時，下列何種蛋白質會移動至靠近陰極處？","opts":["A. γ-球蛋白","B. β-球蛋白","C. α-球蛋白","D. 白蛋白"],"ans":0,"exp":"血清蛋白質電泳（serum protein electrophoresis）在鹼性緩衝液中進行，蛋白質帶負電向陽極移動。移動速度依序（由陽極至陰極）：白蛋白 > α-球蛋白 > β-球蛋白 > γ-球蛋白。γ-球蛋白（免疫球蛋白）電荷最少（接近等電點），移動距離最短，停留在最靠近陰極的位置。","we":["（正確）A. γ-球蛋白移動速度最慢，最靠近陰極，為正確答案。","B. β-球蛋白比γ-球蛋白移動更靠近陽極，不是最靠近陰極者。","C. α-球蛋白移動至靠近陽極的位置，不是靠近陰極。","D. 白蛋白移動速度最快，位於最靠近陽極的位置，不是靠近陰極。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_048","year":2018,"roc_year":107,"session":"1","examNo":48,"q":"下列那一項並不是造成血糖檢驗值會偏低的原因？","opts":["A. 抽血後血漿與血球沒有立刻分離","B. 用草酸鉀為抗凝劑","C. 動物有脂血症","D. 抽血後，置放於室溫"],"ans":2,"exp":"脂血症（lipemia）中的乳糜微粒使樣本渾濁，干擾比色法測定，通常造成血糖測定值假性偏高而非偏低。其他選項均可造成血糖偏低：抽血後未立即分離→血球持續消耗葡萄糖；草酸鉀不含NaF（無法抑制糖解）→血糖持續下降；室溫置放→同理加速糖解。","we":["A. 抽血後血漿與血球沒有立刻分離，血球持續消耗葡萄糖（糖解），造成血糖偏低，是造成偏低的原因。","B. 草酸鉀只是抗凝劑，不含NaF，無法抑制紅血球糖解，血糖仍會緩慢下降，是造成偏低的潛在因素。","（正確）C. 脂血症通常干擾比色法使結果假性偏高，不是造成血糖偏低的原因，為正確答案。","D. 室溫置放加速血球糖解，使血糖值下降偏低，是造成偏低的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_049","year":2018,"roc_year":107,"session":"1","examNo":49,"q":"犬之血糖值超過多少mg/dL時，即可驗到尿糖？","opts":["A. 60","B. 100","C. 180","D. 240"],"ans":2,"exp":"犬的腎臟腎小管對葡萄糖的最大再吸收能力（腎閾值）約為180 mg/dL，當血糖超過此值時，腎小管無法完全再吸收葡萄糖，尿液中即出現葡萄糖（尿糖，glucosuria）。","we":["A. 60 mg/dL遠低於犬的正常血糖，此時腎小管可完全再吸收，不會出現尿糖。","B. 100 mg/dL為正常血糖範圍，腎小管仍可完全再吸收，不出現尿糖。","（正確）C. 180 mg/dL為犬的腎閾值，超過此值才會出現尿糖，為正確答案。","D. 240 mg/dL雖也會出現尿糖，但腎閾值為180 mg/dL，不是240。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_050","year":2018,"roc_year":107,"session":"1","examNo":50,"q":"選出臨床上具有診斷意義的動物別：臟器：酵素之配對：①犬：肝：LDH1 ②牛：肝：ALT ③貓：肝：\r AST ④馬：骨骼肌：CK-BB ⑤牛：骨骼肌：CK-MB ⑥牛：肝：SDH","opts":["A. ②③","B. ④⑤","C. ③⑥","D. ①⑥"],"ans":2,"exp":"③貓：肝：AST——貓AST雖非肝特異，但ALT半衰期短，AST仍有輔助診斷意義；⑥牛：肝：SDH（山梨醇脫氫酶）是牛、馬、羊等大動物肝特異性指標，SDH為正確配對。①犬LDH1非肝特異；②牛ALT活性低，意義不大；④⑤馬/牛骨骼肌應用CK-MM而非CK-BB或CK-MB。","we":["A. ②牛：肝：ALT——牛的ALT活性極低，對肝病診斷意義不大；③貓：肝：AST有一定意義，但②錯誤。","B. ④馬：骨骼肌：CK-BB——骨骼肌CK應為CK-MM，CK-BB為腦部來源，配對錯誤。","（正確）C. ③貓：肝：AST及⑥牛：肝：SDH均為有效診斷配對，為正確答案。","D. ①犬：肝：LDH1——LDH1主要存在於心肌及紅血球，非犬肝病的特異指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_051","year":2018,"roc_year":107,"session":"1","examNo":51,"q":"下列有關酵素異構酶之敘述，何者正確？","opts":["A. AST有ASTs、ASTm異構酶","B. CK有CK-AA、CK-BB、CK-AB異構酶","C. Aldolase有Ⅰ-Ⅳ型異構酶","D. ALT有肝臟及肌肉來源之異構酶"],"ans":0,"exp":"AST（天門冬酸鹽轉氨酶）有兩種異構酶：ASTs（cytoplasmic isoform，細胞質型）和ASTm（mitochondrial isoform，粒線體型）。嚴重細胞損傷時ASTm也釋出，造成AST明顯升高。CK有CK-MM、CK-MB、CK-BB三種（無CK-AA）；Aldolase有I-III型（無IV型）。","we":["（正確）A. AST確有ASTs（細胞質型）及ASTm（粒線體型）兩種異構酶，敘述正確，為答案。","B. CK的異構酶為CK-MM（骨骼肌）、CK-MB（心肌）、CK-BB（腦），無CK-AA。","C. Aldolase異構酶為I、II、III型（三種），無IV型。","D. ALT（丙氨酸轉氨酶）也有細胞質型和粒線體型，但其異構酶在臨床上意義有限，且敘述方式不夠精確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_052","year":2018,"roc_year":107,"session":"1","examNo":52,"q":"關於血清中酵素活性的變動機轉何者正確？","opts":["A. 心肌梗塞時，細胞會製造大量AST作為急性期蛋白（acute phase proteins，APPs）","B. 肝細胞壞死時，會釋出大量的ALP","C. 佝僂症時，血中的ALP活性值上升導因於骨髓胚細胞的製造量增加","D. 膽汁滯留時，LDH活性值上升乃因酵素排除不良所造成"],"ans":2,"exp":"佝僂症（rickets）時骨骼礦化異常，造骨胚細胞（osteoblast）活性增加，分泌大量ALP用於礦化過程，導致血中ALP活性上升。這是造骨胚細胞製造量增加，而非骨髓胚細胞（myeloblast）製造——題目中說「骨髓胚細胞」實為印刷誤植，正確概念是造骨胚細胞。","we":["A. 心肌梗塞時AST升高是因細胞壞死釋出已存在的AST，不是製造急性期蛋白，敘述錯誤。","B. 肝細胞壞死時釋出的主要是ALT及AST，ALP主要在膽汁鬱滯或骨病時升高，不是肝細胞壞死的主要釋出酵素。","（正確）C. 佝僂症時造骨胚細胞活動增加，製造並釋放大量ALP，使血中ALP活性上升，敘述正確，為答案。","D. 膽汁滯留時LDH無法排除的說法不準確；ALP（而非LDH）才是膽汁鬱滯的主要上升指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_053","year":2018,"roc_year":107,"session":"1","examNo":53,"q":"BSP與ICG廓清試驗，目前已被下列何種測試方法取代？","opts":["A. 膽汁酸（bile acids）","B. 膽紅素（bilirubin）","C. 血氨（ammonia）","D. Phylloerythin"],"ans":0,"exp":"BSP（bromsulphthalein）及ICG（indocyanine green）廓清試驗曾用於評估肝臟排泄功能，但因操作繁瑣、副作用及動物福利考量，現已被膽汁酸（bile acids）測定取代。餐前餐後膽汁酸測定安全簡便，是目前評估肝臟功能的首選方法。","we":["（正確）A. 膽汁酸測定已取代BSP/ICG廓清試驗，成為臨床評估肝臟排泄功能的主要方法，為正確答案。","B. 膽紅素測定評估高膽紅素血症，不能完全取代廓清試驗功能。","C. 血氨（ammonia）評估肝性腦病，不是取代廓清試驗的方法。","D. Phylloerythrin（葉紅素）用於反芻動物肝病評估，不是廣泛取代廓清試驗的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_054","year":2018,"roc_year":107,"session":"1","examNo":54,"q":"Biliverdin之測定可用於診斷下列何種動物之肝臟病變？","opts":["A. 馬","B. 牛","C. 鳥","D. 犬"],"ans":2,"exp":"鳥類（禽類）缺乏膽綠素還原酶（biliverdin reductase），無法將biliverdin（膽綠素）轉化為bilirubin（膽紅素），因此鳥類的膽色素以biliverdin為主。測定biliverdin可用於診斷鳥類的肝臟病變，而非哺乳動物。","we":["A. 馬以膽紅素（bilirubin）為主要膽色素，biliverdin測定不用於馬。","B. 牛以膽紅素為主，biliverdin測定不適用。","（正確）C. 鳥類缺乏biliverdin reductase，以biliverdin為主要膽色素，測定biliverdin可診斷鳥類肝病，為正確答案。","D. 犬以膽紅素為主，biliverdin測定不適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_055","year":2018,"roc_year":107,"session":"1","examNo":55,"q":"在馬、牛、羊中測定肝細胞傷害的最佳指標為","opts":["A. glutamate dehydrogenase（GLDH）","B. sorbitol dehydrogenase（SDH）","C. alkaline phosphatase（ALP）","D. lactate dehydrogenase（LDH）"],"ans":1,"exp":"在馬、牛、羊等大動物中，SDH（sorbitol dehydrogenase，山梨醇脫氫酶）為肝細胞損傷的最佳特異性指標，因為SDH主要存在於肝細胞中，半衰期短（約12小時），對肝細胞傷害反應迅速且特異。GLDH也有肝特異性，但SDH更常被引用為大動物首選指標。","we":["A. GLDH（glutamate dehydrogenase）也是肝細胞特異性酵素，但在大動物中SDH被認為是最佳指標。","（正確）B. SDH為馬、牛、羊肝細胞傷害的最佳特異性指標，半衰期短、肝特異性高，為正確答案。","C. ALP在大動物中受骨骼、膽管等多種來源影響，肝特異性不如SDH。","D. LDH分布廣泛（肝、肌肉、紅血球等），肝特異性差，不是最佳指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_056","year":2018,"roc_year":107,"session":"1","examNo":56,"q":"下列有關血清鹼磷酶（ALP）相關之敘述，何者錯誤？","opts":["A. 膽汁鬱滯會誘起此酶活性值上升","B. 動物有造骨胚細胞活動增加時，此酶活性值上升","C. 內因性腎上腺皮質酮會抑制其血清中活性值","D. 有些老犬於乳腺癌時，此酶活性值會高度上升"],"ans":2,"exp":"犬的ALP有類固醇誘導型（steroid-induced ALP，SALP），內因性或外源性腎上腺皮質酮（glucocorticoids）會誘導犬肝臟產生此特殊型ALP，使血清ALP活性值顯著升高，而非抑制。貓則沒有此類固醇誘導型ALP，這是犬特有的特性。","we":["A. 膽汁鬱滯誘導ALP活性值上升，敘述正確（膽管上皮細胞釋出ALP）。","B. 造骨胚細胞活動增加（如骨骼生長、骨折修復）使ALP上升，敘述正確。","（正確）C. 內因性腎上腺皮質酮會誘導（而非抑制）犬血清ALP活性值上升，此敘述錯誤，為答案。","D. 老犬乳腺癌確有報告可使特定ALP型上升，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_057","year":2018,"roc_year":107,"session":"1","examNo":57,"q":"臨床診斷上把體液中酵素分為分泌酵素和細胞內酵素，下列何者是由肝臟生產釋入血中之分泌酵素？","opts":["A. 胞漿素原（plasminogen）","B. 山梨醇脫氫酶（SDH）","C. 阿金氨酸酶（arginase）","D. 膽鹼酯酶（cholinesterase）"],"ans":3,"exp":"膽鹼酯酶（pseudocholinesterase/cholinesterase，血清膽鹼酯酶）是由肝臟合成並分泌入血液循環中的分泌酵素（secretory enzyme），血清中的cholinesterase可反映肝臟合成功能。肝病嚴重時cholinesterase下降。","we":["A. 胞漿素原（plasminogen）雖由肝臟合成，但屬於凝血/纖維蛋白溶解系統的前驅物，不是典型的肝臟分泌酵素。","B. SDH（山梨醇脫氫酶）是細胞內酵素，細胞損傷時釋出，不是分泌酵素。","C. Arginase（阿金氨酸酶）是細胞內酵素，肝細胞損傷時釋出，不是分泌酵素。","（正確）D. Cholinesterase（膽鹼酯酶）由肝臟生產並主動分泌入血，是典型的肝臟分泌酵素，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_058","year":2018,"roc_year":107,"session":"1","examNo":58,"q":"下列何者為犬貓肝病診斷上最常用之肝特異性酵素？","opts":["A. 天門冬酸鹽轉氨酶（AST）","B. 氨基丙酸轉氨酶（ALT）","C. 阿金氨酸酶（arginase）","D. 麩氨酸鹽脫氫酶（GLDH）"],"ans":1,"exp":"ALT（alanine aminotransferase，氨基丙酸轉氨酶）是犬貓肝病診斷最常用的肝特異性酵素，肝細胞損傷時大量釋出，半衰期較長（犬約60小時），靈敏度和特異性均優於其他指標。AST則來源廣泛（肝、肌肉），肝特異性較低。","we":["A. AST（天門冬酸鹽轉氨酶）分布廣泛（肝、肌肉、心臟），肝特異性不如ALT，不是首選。","（正確）B. ALT在犬貓中主要存在於肝細胞，是肝病診斷最常用的肝特異性酵素，為正確答案。","C. Arginase（阿金氨酸酶）雖為肝特異性，但臨床上不如ALT常用。","D. GLDH（麩氨酸鹽脫氫酶）是大動物較常用的肝特異性指標，在犬貓中不如ALT常用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_059","year":2018,"roc_year":107,"session":"1","examNo":59,"q":"正常犬血清澱粉酶（amylase）活性值比人高幾倍？","opts":["A. 1-4","B. 5-10","C. 11-15","D. 16-20"],"ans":1,"exp":"正常犬的血清澱粉酶（amylase）活性值約為人類的5-10倍，因此在評估犬胰臟炎時，澱粉酶必須超過正常值3倍以上才具診斷意義。了解此差異可避免誤判。","we":["A. 1-4倍低估了差異，犬血清澱粉酶實際比人高5-10倍。","（正確）B. 犬正常血清澱粉酶約為人的5-10倍，為正確答案。","C. 11-15倍高估了差異。","D. 16-20倍過度高估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_060","year":2018,"roc_year":107,"session":"1","examNo":60,"q":"明膠消化試驗的檢體是下列何者？","opts":["A. 血液","B. 尿液","C. 糞便","D. 唾液"],"ans":2,"exp":"明膠消化試驗（gelatin digestion test）是一種簡易檢測胰臟蛋白酶（chymotrypsin）活性的方法，使用糞便作為樣本，將糞便與明膠混合，若能消化明膠（明膠液化）表示蛋白酶活性正常，常用於評估胰臟外分泌不足（EPI）。","we":["A. 血液不是明膠消化試驗的檢體，血液用於血清酵素測定。","B. 尿液不是明膠消化試驗的檢體，尿液用於尿液分析。","（正確）C. 糞便是明膠消化試驗的標準檢體，用於評估胰臟蛋白酶（chymotrypsin）活性，為正確答案。","D. 唾液不是明膠消化試驗的檢體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_061","year":2018,"roc_year":107,"session":"1","examNo":61,"q":"豬緊迫症候群（porcine stress syndrome）是屬於那種肌病？","opts":["A. 發炎性","B. 創傷性","C. 代謝性","D. 缺血性"],"ans":2,"exp":"豬緊迫症候群（Porcine Stress Syndrome, PSS）又稱惡性高熱（malignant hyperthermia），是由ryanodine receptor（RYR1）基因突變引起的遺傳性代謝性肌病（metabolic myopathy）。應激時鈣離子失控釋放，導致持續肌肉收縮、高熱、代謝性酸中毒。","we":["A. 發炎性肌病（inflammatory myopathy）是免疫或感染性病因，PSS不屬此類。","B. 創傷性肌病（traumatic myopathy）是外傷所致，PSS不屬此類。","（正確）C. PSS為遺傳性代謝性肌病，RYR1突變導致鈣代謝失控，為正確答案。","D. 缺血性肌病（ischemic myopathy）因血液供應不足所致，PSS不屬此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_062","year":2018,"roc_year":107,"session":"1","examNo":62,"q":"乳酸鹽脫氫酶（lactate dehydrogenase）的異構酶中，存在於骨骼肌及紅血球的是下列何者？","opts":["A. LDH2","B. LDH3","C. LDH4","D. LDH5"],"ans":3,"exp":"LDH（乳酸鹽脫氫酶）有5種異構酶（LDH1-5），由H（heart）和M（muscle）亞基組成四聚體。LDH5（M₄型）含4個M亞基，主要存在於骨骼肌及肝臟（部分文獻也提紅血球），在低氧組織中催化丙酮酸→乳酸反應。LDH1（H₄型）存在於心肌及紅血球。","we":["A. LDH2（H₃M₁）主要存在於心肌及紅血球，不是骨骼肌的主要型式。","B. LDH3（H₂M₂）分布廣泛（肺、腦等），不是骨骼肌特有。","C. LDH4（HM₃）也含較多M亞基，但主要的骨骼肌型為LDH5。","（正確）D. LDH5（M₄型）是骨骼肌及肝臟的主要LDH型式，也存在於紅血球中，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_063","year":2018,"roc_year":107,"session":"1","examNo":63,"q":"腎臟有調節循環體液量與血壓的功能，下列何者為緻密斑（macula densa）所分泌？","opts":["A. angiotensin I","B. angiotensin II","C. antidiuretic hormone","D. renin"],"ans":3,"exp":"腎臟腎絲球旁器（JGA）中，緻密斑（macula densa）感測管腔液Na⁺濃度，當Na⁺濃度降低時，刺激鄰近的顆粒細胞分泌renin（腎素）。Renin啟動腎素-血管張力素-醛固酮系統（RAAS），調節血壓及體液量。此題考點為腎臟調節血壓的機制，標準答案為renin。","we":["A. Angiotensin I由renin作用於angiotensinogen後產生，在血漿中轉化，不由緻密斑直接分泌。","B. Angiotensin II由ACE將angiotensin I轉化而成（主要在肺部），不由緻密斑分泌。","C. ADH（抗利尿激素）由腦垂腺後葉分泌，不由腎臟緻密斑分泌。","（正確）D. 緻密斑感應管腔Na⁺並促進renin釋放，啟動RAAS調節血壓，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_064","year":2018,"roc_year":107,"session":"1","examNo":64,"q":"尿濃縮試驗的原理，主要是刺激何處？釋放何種荷爾蒙來促進水分重吸收？","opts":["A. 腦垂腺前葉、抗利尿荷爾蒙","B. 腦垂腺後葉、抗利尿荷爾蒙","C. 腦垂腺前葉、醛固酮","D. 腦垂腺後葉、醛固酮"],"ans":1,"exp":"尿濃縮試驗（water deprivation test）原理：禁水後血漿滲透壓升高，刺激下視丘滲透壓感受器，促進腦垂腺後葉（neurohypophysis）釋放ADH（抗利尿激素），ADH作用於腎臟集尿管增加水分重吸收，使尿液濃縮。","we":["A. 腦垂腺前葉分泌GH、TSH、ACTH等，不分泌ADH，ADH由後葉分泌。","（正確）B. 腦垂腺後葉釋放ADH，ADH促進集尿管水分重吸收使尿液濃縮，為正確答案。","C. 醛固酮由腎上腺皮質分泌，調節Na⁺/K⁺而非直接水分重吸收；且腦垂腺前葉不分泌醛固酮。","D. 腦垂腺後葉不分泌醛固酮；醛固酮由腎上腺分泌，尿濃縮試驗主要依賴ADH機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_065","year":2018,"roc_year":107,"session":"1","examNo":65,"q":"犬混濁尿經60℃加熱後呈透明者，可能為下列何種結晶 ?","opts":["A. 胱氨酸","B. 草酸鹽","C. 磷酸鹽","D. 尿酸鹽"],"ans":2,"exp":"尿液中磷酸鹽結晶（phosphate crystals）在寒冷或溫度低時沉澱造成混濁，加熱至60°C後溶解使尿液變透明，此為鑑別磷酸鹽結晶的簡易方法。尿酸鹽加熱也可溶解，但磷酸鹽加熱溶解是更典型的教科書描述。","we":["A. 胱氨酸（cystine）結晶不因60°C加熱而溶解（需在強鹼性或氨水中溶解）。","B. 草酸鹽（oxalate）結晶加熱不溶解（需酸溶解）。","（正確）C. 磷酸鹽結晶加熱至60°C後溶解，使混濁尿變透明，為正確答案。","D. 尿酸鹽加熱也可溶解，但磷酸鹽60°C加熱溶解是更標準的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_066","year":2018,"roc_year":107,"session":"1","examNo":66,"q":"關於犬隻尿分析的敘述何者正確？①放太久會導致pH值下降 ②放太久會導致膽紅素下降 ③正常時可能有\r 微量（trace）的蛋白質 ④正常時可能有少量的葡萄糖","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"正確陳述：②尿液放置後膽紅素因光照與氧化而降解（下降）；③正常犬尿中可有微量（trace）蛋白質，屬生理性。錯誤陳述：①放太久pH值通常上升（細菌分解尿素產NH₃使pH升高，不是下降）；④正常犬尿液不含葡萄糖。","we":["A. ①②：①錯誤（pH應上升不是下降）；②正確（膽紅素光照降解）。","（正確）B. ②③：②膽紅素放置後下降正確；③正常可有微量蛋白正確，為正確答案。","C. ③④：③正確，但④正常時不應有葡萄糖，④敘述錯誤。","D. ①④：①pH應上升非下降，④正常無葡萄糖，兩者均錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_067","year":2018,"roc_year":107,"session":"1","examNo":67,"q":"下列那一項檢測可用來評估犬的尿濃縮能力？","opts":["A. urine protein/creatinine ratio","B. urine specific gravity","C. serum BUN","D. urine sediment analysis"],"ans":1,"exp":"尿比重（urine specific gravity, USG）直接反映腎臟濃縮尿液的能力，是評估尿濃縮能力最簡便直接的方法。USG>1.030（犬）表示濃縮功能正常；USG持續在1.007-1.015之間（等滲尿）表示濃縮能力喪失。","we":["A. Urine protein/creatinine ratio（UPC）用於評估蛋白尿的程度，不直接評估濃縮能力。","（正確）B. Urine specific gravity直接反映腎臟濃縮能力，是最常用的評估方法，為正確答案。","C. Serum BUN反映腎臟排泄功能，受多種因素影響，不直接評估濃縮能力。","D. Urine sediment analysis（尿沉渣分析）評估尿中細胞、管型等有形成分，不直接評估濃縮能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_068","year":2018,"roc_year":107,"session":"1","examNo":68,"q":"有一犬隻疑似患有內分泌相關疾病，故進行相關檢查，結果如下：Total T4下降、cTSH（canine thyroid\r stimulating hormone）上升、free T4下降、thyroglobulin autoantibody陽性，此犬最可能罹患","opts":["A. hypothyroidism","B. euthyroid sick syndrome","C. hyperthyroidism","D. steroid induced hypothyroidism"],"ans":0,"exp":"此犬的甲狀腺功能指標：Total T4↓、free T4↓表示甲狀腺激素不足；cTSH↑表示垂體代償性增加TSH分泌（原發性甲狀腺功能低下）；thyroglobulin autoantibody陽性提示自體免疫性甲狀腺炎，最可能的診斷為原發性hypothyroidism（低甲狀腺功能症）。","we":["（正確）A. Total T4↓、free T4↓、cTSH↑、autoantibody(+)符合原發性自體免疫性hypothyroidism，為正確答案。","B. Euthyroid sick syndrome（正常甲狀腺病態症候群）：T4↓但cTSH正常，autoantibody(-)，與此病例不符。","C. Hyperthyroidism（高甲狀腺功能症）：T4↑、cTSH↓，與此病例完全相反。","D. Steroid-induced hypothyroidism：T4↓、free T4正常或輕降、cTSH正常，autoantibody(-)，不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_069","year":2018,"roc_year":107,"session":"1","examNo":69,"q":"下列何者為貓最常見之內分泌疾病？","opts":["A. 高腎上腺皮質功能症","B. 低腎上腺皮質功能症","C. 低甲狀腺功能症","D. 高甲狀腺功能症"],"ans":3,"exp":"高甲狀腺功能症（hyperthyroidism）是貓最常見的內分泌疾病，尤其好發於中老年貓（>10歲），主要原因為甲狀腺功能性腺瘤（functional adenoma）或腺瘤樣增生，臨床表現為多食、消瘦、多飲多尿、心跳加快等。","we":["A. 高腎上腺皮質功能症（Cushing）在貓中少見，犬更常見。","B. 低腎上腺皮質功能症（Addison）在貓中罕見。","C. 低甲狀腺功能症（hypothyroidism）在貓中罕見（自然發生），通常為醫源性（甲狀腺切除後）。","（正確）D. 高甲狀腺功能症是貓最常見的內分泌疾病，好發於中老年貓，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_070","year":2018,"roc_year":107,"session":"1","examNo":70,"q":"下列那種動物最不常見由淋巴肉瘤所引起的偽高副甲狀腺功能症？","opts":["A. 馬","B. 貓","C. 犬","D. 牛"],"ans":3,"exp":"淋巴肉瘤（lymphosarcoma）的副腫瘤效應可引起偽高副甲狀腺功能症（pseudohyperparathyroidism），主要藉由PTHrP（副甲狀腺素相關蛋白）造成高血鈣。此現象在犬、貓、馬中均有報告，但在牛中極為少見（牛淋巴肉瘤通常不引起此副腫瘤效應）。","we":["A. 馬有淋巴肉瘤造成偽副甲狀腺功能亢進症的病例報告，不是最不常見者。","B. 貓有淋巴肉瘤造成此症的病例報告，不是最不常見者。","C. 犬是最常見發生此副腫瘤效應高血鈣的動物，不是最不常見者。","（正確）D. 牛淋巴肉瘤最不常見引起偽副甲狀腺功能亢進症，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_071","year":2018,"roc_year":107,"session":"1","examNo":71,"q":"親甲狀腺釋放激素刺激試驗之判讀，如果後T4值比前值上升多少％即判定為高甲狀腺功能症？","opts":["A. 20","B. 30","C. 40","D. 50"],"ans":3,"exp":"親甲狀腺釋放激素（TRH）刺激試驗中，正常貓給予TRH後T4上升；若後T4值（注射後4小時）比注射前上升50%以上，可判定為高甲狀腺功能症（hyperthyroidism）。高甲狀腺功能症的甲狀腺已過度活躍，對TRH的反應更為強烈。","we":["A. 20%上升不足以判定高甲狀腺功能症，正常甲狀腺也可能有此程度的反應。","B. 30%的標準過低。","C. 40%接近但不是教科書標準值。","（正確）D. 後T4值比前值上升50%以上，可判定為高甲狀腺功能症，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_072","year":2018,"roc_year":107,"session":"1","examNo":72,"q":"下列何種內源性物質對細胞外液之滲透力影響最小？","opts":["A. glucose","B. protein","C. urea","D. Cl-"],"ans":1,"exp":"滲透壓由溶質的莫耳濃度決定。蛋白質（protein）分子量大，單位質量的莫耳數極少，對滲透壓（osmolality）的貢獻微乎其微（正常值約0.5-1.5 mOsm/kg），遠小於glucose（~5 mOsm/kg）、urea（~5 mOsm/kg）、Cl⁻（~104 mOsm/kg）等小分子。","we":["A. Glucose雖非電解質，但分子量180，濃度約5 mM，貢獻約5 mOsm/kg，影響不可忽略。","（正確）B. Protein分子量極大（白蛋白~66,000 Da），正常濃度下莫耳數極少，對滲透壓貢獻最小，為正確答案。","C. Urea為小分子（60 Da），血液中濃度約5 mM，對滲透壓有明顯貢獻。","D. Cl⁻（氯離子）為主要細胞外陰離子，濃度約104 mEq/L，對滲透壓貢獻最大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_073","year":2018,"roc_year":107,"session":"1","examNo":73,"q":"下列何者不是分泌性酸中毒之電解質型式？","opts":["A. 血清HCO3\r -減少","B. 陰離子差增加","C. 血清Cl-偏高","D. 血清TCO2減少"],"ans":1,"exp":"分泌性酸中毒（secretory acidosis，即高氯性代謝性酸中毒）的電解質特徵：血清HCO₃⁻減少、血清Cl⁻偏高（高氯血症代償）、TCO₂減少、陰離子差（AG）正常（不增加）。AG增加見於滴定性酸中毒（titrational acidosis，如乳酸酸中毒、尿毒症），不屬於分泌性酸中毒。","we":["A. 血清HCO₃⁻減少是分泌性酸中毒的特徵（碳酸氫根流失）。","（正確）B. 陰離子差增加不是分泌性酸中毒的特徵（分泌性酸中毒AG正常），為正確答案。","C. 血清Cl⁻偏高是分泌性（高氯性）酸中毒的典型特徵。","D. 血清TCO₂（總CO₂）減少是代謝性酸中毒的表現，包含分泌性酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_074","year":2018,"roc_year":107,"session":"1","examNo":74,"q":"健康犬陰離子差值為多少mEq / L？","opts":["A. 5-10","B. 15-25","C. 26-35","D. 36-45"],"ans":1,"exp":"陰離子差（Anion Gap, AG）= Na⁺ - (Cl⁻ + HCO₃⁻)。健康犬的正常AG約為15-25 mEq/L（各教科書略有差異，但15-25為最常引用的範圍）。AG反映血液中未測量陰離子（如albumin、phosphate、organic acids）的總量。","we":["A. 5-10 mEq/L偏低，不是犬的正常AG範圍（此為人的參考值）。","（正確）B. 15-25 mEq/L為健康犬正常AG參考範圍，為正確答案。","C. 26-35 mEq/L偏高，超出正常範圍。","D. 36-45 mEq/L過高，表示有明顯AG型代謝性酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_075","year":2018,"roc_year":107,"session":"1","examNo":75,"q":"犬肝硬化（cirrhosis）所產生的滲液屬於","opts":["A. 純粹性漏出液","B. 修飾性漏出液","C. 非化膿性滲出液","D. 膿性滲出液"],"ans":1,"exp":"肝硬化（cirrhosis）造成門脈高壓（portal hypertension），靜水壓升高使液體從肝竇滲漏入腹腔，形成修飾性漏出液（modified transudate），蛋白質含量（2.5-5 g/dL）及細胞數稍高於純粹性漏出液，但低於滲出液。","we":["A. 純粹性漏出液由低白蛋白血症（膠體滲透壓降低）造成，蛋白極低；肝硬化主要機制是門脈高壓，不是純粹漏出液。","（正確）B. 修飾性漏出液由門脈高壓（靜水壓升高）引起，是肝硬化腹水的典型類型，為正確答案。","C. 非化膿性滲出液見於FIP、腫瘤浸潤等，不是肝硬化的典型腹水。","D. 膿性滲出液見於細菌性腹膜炎，肝硬化不引起此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_076","year":2018,"roc_year":107,"session":"1","examNo":76,"q":"下列何者最不可能引起非化膿性滲出液？","opts":["A. 尿液","B. 膽汁","C. 胰臟酵素","D. 血液"],"ans":3,"exp":"尿液、膽汁、胰臟酵素漏入腹腔均會引起化學性腹膜炎，產生非化膿性滲出液（non-suppurative exudate）。血液（hemorrhage）進入腹腔本身為出血性積液（hemoabdomen），不是典型的非化膿性滲出液，因此血液最不可能引起非化膿性滲出液。","we":["A. 尿液漏入腹腔（尿腹症）引起化學性腹膜炎，造成非化膿性滲出液。","B. 膽汁漏入腹腔（膽汁腹症）引起化學性腹膜炎，造成非化膿性滲出液。","C. 胰臟酵素（胰臟炎）漏入腹腔引起化學性腹膜炎，造成非化膿性滲出液。","（正確）D. 血液進入腹腔為出血性積液，不是非化膿性滲出液，最不可能引起此類，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_077","year":2018,"roc_year":107,"session":"1","examNo":77,"q":"犬陰道抹片鏡檢可見parabasal and intermediate為主之上皮細胞，並見少數neutrophils，不見紅血球，此犬\r 最可能處於發情周期之那一期？","opts":["A. anestrus","B. estrus","C. diestrus","D. proestrus"],"ans":0,"exp":"犬陰道抹片各期特徵：乏情期（anestrus）以parabasal及intermediate細胞為主，可見少數嗜中性球，無紅血球；前情期（proestrus）有紅血球；情期（estrus）以大角化細胞為主，無嗜中性球；後情期（diestrus）以parabasal細胞為主但嗜中性球大量增加。題目描述符合anestrus。","we":["（正確）A. Anestrus期以parabasal/intermediate細胞為主、少數嗜中性球、無紅血球，符合題目描述，為正確答案。","B. Estrus期以大角化（fully cornified）上皮細胞為主，嗜中性球消失，不符合題目。","C. Diestrus期以parabasal/intermediate為主，但嗜中性球大量出現（不是少數），不符合。","D. Proestrus期有紅血球（陰道出血），題目無紅血球，不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_078","year":2018,"roc_year":107,"session":"1","examNo":78,"q":"下列何者不屬於圓形細胞瘤之類型？","opts":["A. basal cell tumor","B. mast cell tumor","C. histiocytoma","D. transmissible venereal tumor"],"ans":0,"exp":"圓形細胞瘤（round cell tumors）包括：肥胖細胞瘤（mast cell tumor）、組織細胞瘤（histiocytoma）、傳染性性病腫瘤（TVT）、淋巴瘤、漿細胞瘤等。基底細胞瘤（basal cell tumor）屬上皮性腫瘤，不屬於圓形細胞瘤的範疇。","we":["（正確）A. Basal cell tumor屬上皮性腫瘤，不屬圓形細胞瘤，為正確答案。","B. Mast cell tumor是圓形細胞瘤的重要成員，屬此類。","C. Histiocytoma是圓形細胞瘤之一，屬此類。","D. Transmissible venereal tumor（TVT）是圓形細胞瘤之一，屬此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_079","year":2018,"roc_year":107,"session":"1","examNo":79,"q":"其目的\r 在檢查糞便中是否有下列何物質的存在？","opts":["A. 澱粉","B. 肌肉纖維","C. 脂肪","D. 鐵質"],"ans":2,"exp":"本題前文不完整，根據承上題（Q80）的線索，Q79考查的是某種糞便染色試驗目的在於檢查脂肪的存在。Sudan III染色（或Oil Red O）是糞便脂肪試驗的標準方法，可偵測中性脂肪顆粒。此題需參照原始試題確認前文。","we":["A. 澱粉的糞便試驗使用碘液（Lugol's iodine），不是本題描述的方法。","B. 肌肉纖維（muscle fibers）用亞甲基藍或直接鏡檢觀察未消化肌肉纖維。","（正確）C. 脂肪的糞便試驗使用Sudan III染色（或Oil Red O），根據Q80的解題脈絡此為正確答案。","D. 鐵質不是糞便脂肪試驗的目標物質。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1071_實診_080","year":2018,"roc_year":107,"session":"1","examNo":80,"q":"承上題，若在上述檢驗法中，需進一步經過加酸加熱處理後，方能於糞便中發現欲檢測之物質，則該犬最有\r 可能是下列何種疾病？","opts":["A. 肉質漏瀉","B. 胰臟性脂肪漏瀉","C. 腸管性脂肪漏瀉","D. 澱粉漏瀉"],"ans":1,"exp":"Sudan III糞便試驗中，直接染色可見游離脂肪酸；若需加酸（乙酸）加熱處理後才能顯示脂肪，表示脂肪以中性脂肪（三酸甘油酯）形式存在，未被胰脂酶分解，代表胰臟外分泌功能不足（EPI），即胰臟性脂肪漏瀉（pancreatic steatorrhea）。","we":["A. 肉質漏瀉（creatorrhea）顯示未消化肌肉纖維，與脂肪試驗無關。","（正確）B. 胰臟性脂肪漏瀉：胰脂酶不足，中性脂肪無法分解，需加酸加熱才能顯示，為正確答案。","C. 腸管性脂肪漏瀉：胰脂酶正常，脂肪已被分解為游離脂肪酸，直接Sudan III即可染色，不需加酸加熱。","D. 澱粉漏瀉（amylorrhea）用碘液試驗，與脂肪試驗無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_001","year":2018,"roc_year":107,"session":"2","examNo":1,"q":"使用氟化鈉抗凝管可能會使下列何項檢驗呈現假低值？","opts":["A. 鉀","B. 鈉","C. 膽固醇","D. 鐵"],"ans":0,"exp":"氟化鈉（NaF）抗凝管中的氟離子會干擾離子選擇電極，使鉀（K⁺）的測定值偏低，呈現假低值。","we":["（正確）A. 氟離子干擾電極法測鉀，造成鉀假低值。","B. 鈉不受氟化鈉抗凝管影響，測定值正常。","C. 膽固醇為酶法測定，不受氟化鈉影響。","D. 鐵的測定不受氟化鈉抗凝管干擾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_002","year":2018,"roc_year":107,"session":"2","examNo":2,"q":"乳牛乳汁檢體送檢做微生物檢查時，通常最好用下列何者來保存及運送？","opts":["A. 冷藏","B. 10％福馬林液","C. 50％甘油生理鹽水","D. 50％甲苯液"],"ans":0,"exp":"乳汁微生物檢查檢體應以冷藏（2–8°C）保存並儘速送檢，以維持細菌活性且不過度增殖。","we":["（正確）A. 冷藏可保持細菌存活並防止非目標菌過度生長，是正確保存方式。","B. 10%福馬林液會殺死細菌，不適用於微生物培養用途。","C. 50%甘油生理鹽水用於病毒或組織保存，非一般乳汁細菌培養。","D. 50%甲苯液為防腐劑，會殺滅細菌，不適合微生物活菌送檢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_003","year":2018,"roc_year":107,"session":"2","examNo":3,"q":"診斷equine infectious anemia時，所採集之樣品通常不包括下列何者？","opts":["A. 取腦及腦幹作切片檢查","B. 採血液作動物接種試驗","C. 採血清作免疫擴散試驗","D. 採取肝、脾、骨髓作切片檢查"],"ans":0,"exp":"馬傳染性貧血（EIA）的診斷主要依賴血清學（Coggins免疫擴散試驗）、血液接種及肝脾骨髓切片，腦及腦幹切片並非標準採樣項目。","we":["（正確）A. 腦及腦幹切片非EIA的常規診斷樣品，此選項不包含在內是正確的。","B. 採血液作動物接種試驗是EIA標準診斷方法之一。","C. 血清免疫擴散試驗（Coggins test）是EIA法定診斷方法。","D. 肝、脾、骨髓切片可見含鐵血黃素沉積，屬EIA病理診斷樣品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_004","year":2018,"roc_year":107,"session":"2","examNo":4,"q":"von Willebrand's factor（vWF）主要是由下列何種細胞製造？","opts":["A. 肝細胞與腎細胞","B. 腎細胞與megakaryocyte","C. megakaryocyte與內皮細胞","D. 血管細胞與肝細胞"],"ans":2,"exp":"von Willebrand因子（vWF）主要由血管內皮細胞及巨核細胞（megakaryocyte）合成，儲存於血小板α顆粒及Weibel-Palade小體中。","we":["A. 肝細胞與腎細胞不是vWF的主要製造來源。","B. 腎細胞不製造vWF，megakaryocyte正確但腎細胞錯誤。","（正確）C. vWF由megakaryocyte（巨核細胞）與內皮細胞共同製造，為正確答案。","D. 血管細胞（內皮細胞部分正確）但肝細胞不製造vWF。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_005","year":2018,"roc_year":107,"session":"2","examNo":5,"q":"下列那一個凝血因子最不易受到維生素K缺乏之影響？","opts":["A. 第II因子","B. 第VII因子","C. 第VIII因子","D. 第X因子"],"ans":2,"exp":"維生素K依賴凝血因子包括II、VII、IX、X及蛋白C/S，第VIII因子不屬於維生素K依賴因子，因此最不受其缺乏影響。","we":["A. 第II因子（凝血酶原）為維生素K依賴因子，缺乏時活性顯著下降。","B. 第VII因子半衰期最短，是維生素K缺乏最早出現異常的因子。","（正確）C. 第VIII因子不依賴維生素K合成，缺乏維生素K時此因子不受影響。","D. 第X因子為維生素K依賴因子，缺乏時活性下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_006","year":2018,"roc_year":107,"session":"2","examNo":6,"q":"Activated partial thromboplastin time（APTT）延長、prothrombin time（PT）正常，最可能是缺乏下列那些\r 凝血因子？","opts":["A. VIII、XI、XII","B. II、V、X","C. V、X、XIII","D. I、V、VII"],"ans":0,"exp":"APTT測試內源性凝血路徑（VIII、IX、XI、XII），PT測試外源性路徑（VII）及共同路徑（I、II、V、X）；APTT延長而PT正常代表內源性路徑因子缺乏。","we":["（正確）A. VIII、XI、XII均屬內源性路徑，缺乏時APTT延長但PT正常。","B. II、V、X屬共同路徑，缺乏時APTT與PT均延長。","C. V、X屬共同路徑，XIII影響纖維蛋白交聯，缺乏時APTT與PT均異常。","D. I（纖維蛋白原）、V屬共同路徑，VII屬外源性路徑，此組合缺乏會使PT延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_007","year":2018,"roc_year":107,"session":"2","examNo":7,"q":"下列有關犬隻淋巴瘤之敘述，何者最正確？","opts":["A. 多中心型最常見於犬，源自B cell","B. 消化道型可發生於腸繫膜淋巴結，主要源自B cell","C. 多中心型於多處淋巴結通常會發生腫痛","D. 白血病型病變部位之出現率，淋巴結多於骨髓及脾臟"],"ans":0,"exp":"犬多中心型淋巴瘤是最常見的類型，約60–80%源自B細胞，典型表現為多處淋巴結無痛性腫大（non-painful）。","we":["（正確）A. 多中心型最常見且多源自B cell，是正確描述。","B. 消化道型主要源自T cell而非B cell，此敘述錯誤。","C. 多中心型淋巴結腫大通常無痛，而非「腫痛」，此敘述錯誤。","D. 白血病型病變部位骨髓和脾臟比率較高，而非淋巴結，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_008","year":2018,"roc_year":107,"session":"2","examNo":8,"q":"正常動物的紅血球在氧氣充足狀態下，1分子的血紅素可結合幾分子的氧氣？","opts":["A. 1","B. 2","C. 4","D. 8"],"ans":2,"exp":"一個血紅素分子含4條多肽鏈，每條鏈各有一個血基質（heme），每個血基質可結合1分子O₂，因此共可結合4分子O₂。","we":["A. 1分子O₂只對應1個血基質，血紅素有4個血基質，答案偏少。","B. 2分子O₂不足，血紅素共有4個攜氧位點。","（正確）C. 1分子血紅素有4個血基質，可結合4分子O₂，為正確答案。","D. 8分子O₂超過血紅素結構所能攜帶的上限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_009","year":2018,"roc_year":107,"session":"2","examNo":9,"q":"下列關於健康馬紅血球的敘述，何者正確？","opts":["A. 血球具粒線體","B. 常可見大小不同症","C. 嚴重貧血時，血片中也不會有網狀球出現","D. 串錢狀連結經生理鹽水稀釋血液後依舊存在，可與凝集反應鑑別"],"ans":2,"exp":"馬紅血球對貧血的再生反應極弱，即使嚴重貧血，血片中也幾乎看不到網狀球（reticulocyte），這是馬的生理特性。","we":["A. 成熟紅血球不含粒線體，馬的紅血球亦然，此敘述錯誤。","B. 健康馬紅血球大小均一，不常見大小不一症，此敘述錯誤。","（正確）C. 馬即使嚴重貧血血片中也不會出現網狀球，是馬紅血球的特性，敘述正確。","D. 串錢狀連結（rouleaux）在加入生理鹽水稀釋後會消散，真正凝集反應稀釋後仍存在，兩者可鑑別，敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_010","year":2018,"roc_year":107,"session":"2","examNo":10,"q":"在罹患溶血性貧血的狀態下，下列動物紅血球生成的能力依序為","opts":["A. 貓＞牛＞馬","B. 貓＞馬＞牛","C. 牛＞馬＞貓","D. 馬＞貓＞牛"],"ans":1,"exp":"在溶血性貧血時，貓的紅血球再生能力最強，馬次之，牛最弱（牛骨髓對貧血反應遲緩，幾乎不出現網狀球）。","we":["A. 貓>牛>馬的排序錯誤，牛的再生能力弱於馬。","（正確）B. 貓>馬>牛的排序正確，反映各物種骨髓對溶血的再生反應強弱。","C. 牛>馬>貓的排序錯誤，牛的再生能力最差。","D. 馬>貓>牛的排序錯誤，貓的再生能力強於馬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_011","year":2018,"roc_year":107,"session":"2","examNo":11,"q":"下列何者是造成家畜溶血性貧血的原因？","opts":["A. 殺鼠劑（warfarin）中毒","B. 外傷","C. 胃潰瘍","D. 輸血不當"],"ans":3,"exp":"輸血不當（血型不合）可引發免疫介導性溶血反應，導致溶血性貧血；warfarin中毒、外傷及胃潰瘍造成失血性貧血而非溶血性貧血。","we":["A. Warfarin中毒影響凝血因子合成，造成出血性/失血性貧血，而非溶血性。","B. 外傷造成急性失血性貧血，非溶血性貧血。","C. 胃潰瘍出血造成失血性貧血，非溶血性貧血。","（正確）D. 輸血血型不合引發抗原抗體反應，導致紅血球溶解，為溶血性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_012","year":2018,"roc_year":107,"session":"2","examNo":12,"q":"下列有關巨噬細胞的敘述，何者錯誤？","opts":["A. 移動速率比嗜中性球快","B. 對抗黴菌和病毒的反應較嗜中性球活躍","C. 可分泌刺激因子調控造血作用","D. 可誘導細胞免疫反應"],"ans":0,"exp":"巨噬細胞的移動速率實際上比嗜中性球慢，嗜中性球是最先到達感染部位的免疫細胞；其餘敘述均正確。","we":["（正確）A. 巨噬細胞移動速率比嗜中性球慢，此敘述錯誤，為本題答案。","B. 巨噬細胞對抗黴菌和病毒的能力確實較嗜中性球強，敘述正確。","C. 巨噬細胞可分泌CSF等造血刺激因子，敘述正確。","D. 巨噬細胞可將抗原呈現給T細胞，誘導細胞免疫反應，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_013","year":2018,"roc_year":107,"session":"2","examNo":13,"q":"下列有關嗜中性球的敘述，何者正確？","opts":["A. 由骨髓球胚細胞至後骨髓球，均在骨髓中發育","B. 後骨髓球之顆粒球會再經3次分裂","C. 由骨髓進入血中的順序，與細胞年齡無關","D. 健康動物僅儲存約2天份的嗜中性球供應量"],"ans":0,"exp":"嗜中性球從骨髓球（myelocyte）到後骨髓球（metamyelocyte）的發育過程均在骨髓中進行，之後成熟的分葉核球才進入血液。","we":["（正確）A. 骨髓球至後骨髓球的發育均在骨髓中完成，敘述正確。","B. 後骨髓球是末端分化階段，不再進行細胞分裂，敘述錯誤。","C. 骨髓釋放細胞遵循細胞年齡順序，較成熟的細胞優先釋出，敘述錯誤。","D. 健康動物骨髓中儲存約5–7天份的嗜中性球，並非2天，敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_014","year":2018,"roc_year":107,"session":"2","examNo":14,"q":"班瓊斯蛋白尿（Bence Jones proteinuria）可用下列何種方法證明？","opts":["A. 加酸加熱法","B. 羅拔氏試驗法（Robert's test）","C. 電泳法","D. 試藥紙條法"],"ans":2,"exp":"Bence Jones蛋白為免疫球蛋白輕鏈，標準檢測方法為蛋白電泳法（protein electrophoresis），可在β或γ區顯示單克隆峰；加熱沉澱法也可輔助，但電泳法最常用且最可靠。","we":["A. 加酸加熱法為舊式方法，專一性低，現已少用。","B. Robert's test為一般蛋白尿測試，不能區分Bence Jones蛋白。","（正確）C. 電泳法可確認單克隆輕鏈蛋白，是診斷Bence Jones蛋白尿的標準方法。","D. 試藥紙條法檢測白蛋白，對Bence Jones蛋白（輕鏈）敏感度很低，不可靠。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_015","year":2018,"roc_year":107,"session":"2","examNo":15,"q":"下列那個凝血因子不屬於纖維素原族類？","opts":["A. II","B. V","C. VIII","D. XIII"],"ans":0,"exp":"纖維素原族（fibrinogen group）包括凝血因子I、V、VIII、XIII；第II因子（凝血酶原）屬於凝血酶原族，不屬纖維素原族。","we":["（正確）A. 第II因子屬凝血酶原族，不屬纖維素原族，為本題答案。","B. 第V因子屬纖維素原族，不符合「不屬於」的條件。","C. 第VIII因子屬纖維素原族，不符合「不屬於」的條件。","D. 第XIII因子屬纖維素原族，不符合「不屬於」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_016","year":2018,"roc_year":107,"session":"2","examNo":16,"q":"當白血球總數正常或減少，且血片上僅有很少惡性細胞出現時，稱為","opts":["A. leukemic leukemia","B. leukemoid leukocytosis","C. subleukemic leukemia","D. aleukemic leukemia"],"ans":2,"exp":"Subleukemic leukemia（次白血病型）是指白血球總數正常或輕微下降，血片上僅偶見少數惡性細胞的白血病類型。","we":["A. Leukemic leukemia指白血球總數顯著增加且血片可見大量惡性細胞。","B. Leukemoid leukocytosis指反應性白血球增多症，非惡性，且白血球數量增加。","（正確）C. Subleukemic leukemia定義為白血球總數正常或減少、血片僅有少數惡性細胞，符合題意。","D. Aleukemic leukemia指血片上完全看不到惡性細胞的白血病型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_017","year":2018,"roc_year":107,"session":"2","examNo":17,"q":"一患犬之血漿總蛋白為8.4 g/dL，纖維素原為1.2 g/dL，試問此犬應判定為","opts":["A. 脫水或纖維素原值在正常範圍","B. 高纖維素原血症","C. 高白蛋白血症","D. 缺乏血中白蛋白濃度資料，無法判定"],"ans":0,"exp":"犬正常纖維素原約0.2–0.4 g/dL，1.2 g/dL屬高纖維素原血症；總蛋白8.4 g/dL偏高，可能合併脫水；但判定高纖維素原血症須先排除脫水，因此應判定為「脫水或纖維素原值在正常範圍」需進一步確認。","we":["（正確）A. 總蛋白偏高可能源於脫水，此時纖維素原相對值也偏高，應先排除脫水再判定，故此選項正確。","B. 直接判定高纖維素原血症需先排除脫水影響，不能直接下此結論。","C. 本題資料為總蛋白與纖維素原，無法直接推斷高白蛋白血症。","D. 本題已知總蛋白與纖維素原數值，資料已足以初步判斷，無需白蛋白才能評估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_018","year":2018,"roc_year":107,"session":"2","examNo":18,"q":"下列關於血糖的敘述何者錯誤？","opts":["A. 單胃動物於食後2至4小時會有短暫高血糖症","B. 反芻動物的血糖主要來源為肝之糖質新生作用","C. 肝臟之肝醣分解作用由胰臟β細胞所促進","D. 血糖值大於90 mg/dL時，會刺激insulin釋放"],"ans":2,"exp":"肝醣分解（glycogenolysis）是由升糖素（glucagon，胰臟α細胞分泌）促進，胰島素（β細胞）的作用是促進肝醣合成而非分解，故C敘述錯誤。","we":["A. 單胃動物食後2–4小時有短暫生理性高血糖，敘述正確。","B. 反芻動物主要由肝臟糖質新生作用（gluconeogenesis）提供血糖，敘述正確。","（正確）C. 肝醣分解由升糖素（α細胞）促進，非β細胞分泌的胰島素，此敘述錯誤，為本題答案。","D. 血糖值大於90 mg/dL可刺激胰島素釋放，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_019","year":2018,"roc_year":107,"session":"2","examNo":19,"q":"血清中那種脂蛋白主要是由腸道吸收的脂質運送而來？","opts":["A. chylomicrons","B. very-low-density lipoproteins","C. low-density lipoproteins","D. high-density lipoproteins"],"ans":0,"exp":"腸道吸收的外源性脂質（三酸甘油酯、膽固醇）在腸上皮細胞組裝成乳糜微粒（chylomicrons），經淋巴系統進入血液循環。","we":["（正確）A. Chylomicrons是腸道吸收脂質後的主要運送形式，為正確答案。","B. VLDL主要由肝臟合成，運送內源性三酸甘油酯，非來自腸道吸收。","C. LDL是VLDL代謝後的產物，主要運送膽固醇至周邊組織，非源自腸道吸收。","D. HDL主要負責反向膽固醇運輸（將膽固醇從周邊運回肝臟），非腸道吸收脂質的主要載體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_020","year":2018,"roc_year":107,"session":"2","examNo":20,"q":"以下有關犬膽紅素之敘述，何者錯誤？","opts":["A. 血中膽紅素值超過1.0 mg/dL時通常即可見到膽紅素尿","B. 血中膽紅素值超過2.0 mg/dL時即可能見到黃疸","C. 只有未結合態膽紅素上升才具臨床意義","D. 腎臟功能正常時尿中測得的膽紅素應以結合態為主"],"ans":2,"exp":"結合態（直接）膽紅素與未結合態（間接）膽紅素上升均具臨床意義；結合態上升提示肝後性或肝內阻塞性黃疸，未結合態上升提示溶血或肝前性黃疸，不能只看未結合態。","we":["A. 犬血中膽紅素超過1.0 mg/dL時腎閾值較低，可見膽紅素尿，敘述正確。","B. 膽紅素值超過2.0 mg/dL時即可能見到臨床黃疸，敘述正確。","（正確）C. 結合態與未結合態膽紅素上升均有臨床意義，此敘述錯誤，為本題答案。","D. 腎功能正常時，只有結合態（水溶性）膽紅素可經腎小球濾過出現於尿中，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_021","year":2018,"roc_year":107,"session":"2","examNo":21,"q":"下列有關血清gamma glutamyl transferase（GGT）之敘述，何者錯誤？","opts":["A. 血清GGT之主要來源為肝","B. 存於多種細胞，但以腎小管細胞、肝細胞之微管表層及膽管上皮之含量較多","C. 腎性GGT於腎病時由尿排出","D. 常用之GGT試藥可用來檢查尿中GGT活性值"],"ans":3,"exp":"常用GGT試藥係針對血清/血漿基質設計，其基質組成與尿液不同，直接用於尿液GGT活性檢測需使用尿液專用試藥或進行修正，一般血清試藥不直接適用，故D敘述錯誤。","we":["A. 血清GGT主要來源確為肝（膽管上皮），敘述正確。","B. GGT廣泛分佈，腎小管細胞、肝細胞微管及膽管上皮含量最多，敘述正確。","C. 腎性GGT分子量大，不被腎小球濾過，腎病時可由尿排出，敘述正確。","（正確）D. 一般血清GGT試藥不適合直接用來測定尿中GGT活性，此敘述錯誤，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_022","year":2018,"roc_year":107,"session":"2","examNo":22,"q":"下列何者會造成循環中gamma glutamyl transferase (GGT）的活性值上升？","opts":["A. 肝細胞粒線體受損時","B. 迪氏隙（space of Disse）星狀細胞的完整性改變時","C. 肝細胞與微膽管膜受刺激時","D. 肝細胞核膜受損時"],"ans":2,"exp":"GGT位於肝細胞微管（毛細膽管）膜上，當膽汁鬱滯或微膽管膜受刺激（如類固醇誘導）時，GGT合成增加並釋放入血，導致血清GGT活性升高。","we":["A. 粒線體受損時上升的酶主要為AST（GOT），不是GGT。","B. 迪氏隙星狀細胞（Ito cells）與GGT釋放無直接關係。","（正確）C. 肝細胞與微膽管膜受刺激時，GGT從膜上釋放入血，活性值上升，為正確答案。","D. 細胞核膜受損時釋放的主要是核內酶，與GGT無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_023","year":2018,"roc_year":107,"session":"2","examNo":23,"q":"下列何種動物GGT活性值正常範圍較為狹窄，因此在膽汁鬱滯之診斷比ALP活性值為更有用之指標？","opts":["A. 犬","B. 貓","C. 鼠","D. 馬"],"ans":1,"exp":"在貓中，ALP的正常參考範圍較寬，且貓缺乏類固醇誘導型ALP同功酶，而GGT正常值範圍較窄，因此GGT在貓的膽汁鬱滯診斷上比ALP更具特異性。","we":["A. 犬的ALP有多種同功酶（包括類固醇誘導型），GGT在犬的特異性不如貓突出。","（正確）B. 貓的GGT正常範圍狹窄，是診斷膽汁鬱滯比ALP更有用的指標，為正確答案。","C. 鼠並非本題比較對象，且相關文獻不特別強調此特性。","D. 馬的ALP也有特定應用，但脂酶/GGT的種間比較中，貓的GGT特異性最被強調。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_024","year":2018,"roc_year":107,"session":"2","examNo":24,"q":"下列何者為脂酶的來源？","opts":["A. 唾液腺和肝臟","B. 胃黏膜和胰臟","C. 胃黏膜和肝臟","D. 胰臟和肝臟"],"ans":1,"exp":"脂酶（lipase）主要由胰臟腺泡細胞分泌，胃黏膜主細胞也可分泌胃脂酶，因此主要來源為胃黏膜和胰臟。","we":["A. 唾液腺分泌澱粉酶（amylase），肝臟不是脂酶的主要來源。","（正確）B. 脂酶主要由胰臟和胃黏膜分泌，為正確答案。","C. 胃黏膜正確，但肝臟不是脂酶的來源。","D. 胰臟正確，但肝臟不是脂酶的主要來源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_025","year":2018,"roc_year":107,"session":"2","examNo":25,"q":"下列何種動物，其唾液中含有較多量的澱粉酶？","opts":["A. 牛","B. 馬","C. 豬","D. 犬"],"ans":2,"exp":"豬（雜食性動物）的唾液中含有較高量的澱粉酶（salivary amylase），有助於口腔內澱粉的初步消化；牛、馬、犬的唾液澱粉酶含量相對較低。","we":["A. 牛（反芻動物）唾液主要含碳酸氫鹽做緩衝，澱粉酶含量極低。","B. 馬的唾液澱粉酶活性相對低，消化澱粉主要靠小腸。","（正確）C. 豬的唾液含較高量澱粉酶，雜食性動物口腔消化澱粉能力較強，為正確答案。","D. 犬為肉食性傾向，唾液澱粉酶含量較豬少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_026","year":2018,"roc_year":107,"session":"2","examNo":26,"q":"鳥類骨骼肌損傷時，特異性最高之診斷指標為","opts":["A. CK","B. AST","C. troponin","D. LDH"],"ans":0,"exp":"CK（creatine kinase）對骨骼肌損傷的特異性最高，且在鳥類中半衰期短，CK-MM同功酶可準確反映骨骼肌損傷情況。","we":["（正確）A. CK對鳥類骨骼肌損傷特異性最高，是最佳診斷指標。","B. AST廣泛分佈於多種組織（肝、心、肌肉），特異性低於CK。","C. Troponin主要用於心肌損傷的診斷，對骨骼肌的特異性較低。","D. LDH分佈廣泛（肝、腎、肌肉、RBC），特異性低於CK。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_027","year":2018,"roc_year":107,"session":"2","examNo":27,"q":"血中CK活性值顯著上升，但非持續高值，若具有臨床意義，此顯著上升之活性值應大於多少IU/L？","opts":["A. 500","B. 1000","C. 2000","D. 5000"],"ans":1,"exp":"臨床上CK活性值顯著上升但非持續高值，若要判定具有臨床意義，通常要求其值大於1000 IU/L，低於此值可能為採血應激等非病理因素所致。","we":["A. 500 IU/L門檻過低，輕微應激或肌肉注射即可達到，特異性不足。","（正確）B. 超過1000 IU/L的CK上升通常被認為具臨床意義，為正確答案。","C. 2000 IU/L門檻過高，會漏掉部分有意義的肌肉損傷病例。","D. 5000 IU/L僅代表嚴重肌肉損傷（如捻轉症），標準過嚴。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_028","year":2018,"roc_year":107,"session":"2","examNo":28,"q":"以下有關LDH活性值之敘述，何者錯誤？","opts":["A. 肝臟大多含有較高之LDH4及LDH5","B. 骨骼肌受損以LDH5上升為主","C. 心肌受損以LDH1上升為主","D. 溶血以LDH3上升為主"],"ans":3,"exp":"溶血時紅血球（富含LDH1和LDH2）破壞，釋出LDH1（H₄型）為主，而非LDH3；LDH3（H₂M₂型）主要見於淋巴細胞及脾臟，故D敘述錯誤。","we":["A. 肝臟大多含LDH4和LDH5（M型為主），敘述正確。","B. 骨骼肌受損以LDH5（M₄型）上升為主，敘述正確。","C. 心肌受損以LDH1（H₄型）上升為主，敘述正確。","（正確）D. 溶血時以LDH1（非LDH3）上升為主，此敘述錯誤，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_029","year":2018,"roc_year":107,"session":"2","examNo":29,"q":"罹患運動傷害性肌病的馬隻，最不易見到下列何種病症？","opts":["A. 氮尿症（azoturia）","B. 星期一早晨病（MMD）","C. 白肌病（WMD）","D. 緊束症（tying up）"],"ans":2,"exp":"白肌病（WMD）是硒或維生素E缺乏引起的營養性肌病，不屬於運動傷害性肌病；氮尿症、MMD（星期一早晨病）及緊束症（tying up）均屬馬的運動相關性肌病。","we":["A. 氮尿症（azoturia）是馬的典型運動傷害性肌病，常見。","B. 星期一早晨病（Monday Morning Disease）是馬在休息後劇烈運動引發的肌病。","（正確）C. 白肌病（WMD）屬於硒/維生素E缺乏的營養性肌病，非運動傷害性肌病，最不易見到。","D. 緊束症（tying up，exertional rhabdomyolysis）屬運動傷害性肌病，常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_030","year":2018,"roc_year":107,"session":"2","examNo":30,"q":"當犬貓排出的新鮮尿液呈現暗黃至暗褐色時，一般常表示何種問題？","opts":["A. 血尿","B. 血紅素尿","C. 膽紅素尿","D. 正常，沒有問題"],"ans":2,"exp":"新鮮尿液呈暗黃至暗褐色通常表示膽紅素尿（bilirubinuria）；血尿（hematuria）呈紅色至棕紅色；血紅素尿（hemoglobinuria）呈紅至深紅褐色（可澄清）。","we":["A. 血尿因含紅血球，尿液呈紅色或茶紅色，離心後沉渣見RBC。","B. 血紅素尿因含游離血紅素，呈紅至深紅色（澄清），非暗黃褐色。","（正確）C. 暗黃至暗褐色新鮮尿液典型代表膽紅素尿，尿中膽紅素氧化後可呈現黃褐至綠色。","D. 正常尿液呈淡黃至金黃色，不會呈現暗黃至暗褐色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_031","year":2018,"roc_year":107,"session":"2","examNo":31,"q":"下列何種狀況，在動物尿液檢查通常不會呈現酮體陽性反應？","opts":["A. 長期餵予高脂肪飼料","B. 綿羊的妊娠毒血症","C. 長期飢餓","D. 腎小管腎病"],"ans":3,"exp":"酮體尿出現於脂肪酸氧化增加的代謝狀態（飢餓、高脂飲食、妊娠毒血症、糖尿病等）；腎小管腎病影響重吸收功能，本身不導致酮體生成增加，故通常不呈現酮體陽性。","we":["A. 長期高脂肪飼料使脂肪酸氧化增加，產生酮體，尿中可見酮體陽性。","B. 綿羊妊娠毒血症因能量負平衡導致大量酮體產生，酮體尿陽性。","C. 長期飢餓時脂肪動員增加，酮體生成增多，尿中酮體陽性。","（正確）D. 腎小管腎病本身不影響酮體代謝，通常不會呈現酮體陽性，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_032","year":2018,"roc_year":107,"session":"2","examNo":32,"q":"參與血糖調控的激素為何？①生長素（growth hormone，GH） ②胰島素（insulin） ③昇糖素\r （glucagon） ④丁醛酮（aldosterone） ⑤可體素（cortisol） ⑥副甲狀腺素\r （parathormone）","opts":["A. ①②③⑤","B. ②③④⑥","C. ②③④⑤","D. ①②③⑥"],"ans":0,"exp":"參與血糖調控的激素包括：GH（升血糖）、insulin（降血糖）、glucagon（升血糖）、cortisol（升血糖）；aldosterone主要調控鈉鉀平衡，PTH調控鈣磷，均不直接調控血糖。","we":["（正確）A. ①GH②insulin③glucagon⑤cortisol均參與血糖調控，為正確答案。","B. ④aldosterone調控鈉鉀，⑥PTH調控鈣磷，均不直接調控血糖，此組合錯誤。","C. ④aldosterone不調控血糖，此組合錯誤。","D. ⑥PTH不調控血糖，此組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_033","year":2018,"roc_year":107,"session":"2","examNo":33,"q":"惡性腫瘤所引發的體液性高血鈣症導因於","opts":["A. 腫瘤細胞產生過量的PTH","B. 腫瘤細胞產生過量的PTH-related protein","C. PTH的半衰期延長","D. 目標器官的PTH受器對於PTH的親和性顯著提升"],"ans":1,"exp":"惡性腫瘤引起的體液性高血鈣症（humoral hypercalcemia of malignancy，HHM）主要是因為腫瘤細胞產生過量的PTH相關蛋白（PTH-related protein，PTHrP），其作用類似PTH使血鈣升高。","we":["A. 腫瘤細胞產生的是PTHrP而非PTH本身，且PTH由副甲狀腺分泌。","（正確）B. 腫瘤產生過量PTHrP與PTH受器結合，引發高血鈣，為正確答案。","C. PTH半衰期延長不是HHM的機制，且腫瘤本身不直接延長PTH半衰期。","D. 受器親和性提升不是HHM的主要機制，PTHrP的量增加才是根本原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_034","year":2018,"roc_year":107,"session":"2","examNo":34,"q":"下列關於鉀離子（K + ）的生理敘述何者正確？①是ECF中主要的陽離子 ②會在遠端彎曲腎小管及亨利氏管 被重吸收 ③與H + 在近端彎曲腎小管中與Na + 交換 ④胃液中含高量鉀離子 ⑤血清鉀離子的濃度維持在狹 窄的範圍中 ⑥受aldosterone的調控","opts":["A. ①②③⑤","B. ②③④","C. ①②③⑥","D. ④⑤⑥"],"ans":3,"exp":"①K⁺是ICF（細胞內液）主要陽離子，非ECF；②K⁺在亨利氏管被重吸收但分泌於集尿管；③H⁺/K⁺與Na⁺交換在集尿管；④胃液含高量K⁺；⑤血清K⁺維持在窄範圍；⑥受aldosterone調控集尿管K⁺分泌。","we":["A. ①錯誤（K⁺是ICF而非ECF主要陽離子），②和③敘述部位有誤，組合不正確。","B. ②③敘述部位有誤，此組合不完整。","C. ①錯誤（K⁺非ECF主要陽離子），組合不正確。","（正確）D. ④胃液高量K⁺、⑤血清K⁺窄範圍、⑥aldosterone調控均正確，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_035","year":2018,"roc_year":107,"session":"2","examNo":35,"q":"犬感染Nocardia屬病原體之滲出液的特性：①為非化膿性滲出液 ②為化膿性滲出液 ③菌團附近可見巨噬 細胞包圍 ④可見分枝或短桿狀的微小菌團 ⑤蛋白質含量在1.5～2.0 g/dL之間 ⑥有大量的嗜酸性球存在","opts":["A. ①③④","B. ①③⑤","C. ②④","D. ②⑥"],"ans":2,"exp":"Nocardia感染產生的滲出液為化膿性（②），可見分枝或短桿狀的微小菌團（④）；巨噬細胞包圍菌團也常見，但本題選項組合以②④最符合教科書描述。","we":["A. ①非化膿性敘述錯誤，Nocardia感染產生化膿性滲出液。","B. ①非化膿性敘述錯誤，且⑤蛋白質1.5–2.0 g/dL偏低（實際更高）。","（正確）C. ②化膿性滲出液正確，④可見分枝菌團正確，為本題最佳答案。","D. ⑥大量嗜酸性球不是Nocardia感染的典型特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_036","year":2018,"roc_year":107,"session":"2","examNo":36,"q":"下列何種健康動物之腹腔穿刺液之細胞數可達9,000 /µL，且主要為非退行性嗜中性球及一些巨噬細胞？","opts":["A. 馬","B. 牛","C. 羊","D. 貓"],"ans":1,"exp":"牛正常腹腔穿刺液的白血球數可達9,000/µL（參考上限），以非退行性嗜中性球及巨噬細胞為主，此為牛的正常生理特性，其他動物的正常值通常遠低於此。","we":["A. 馬正常腹腔液細胞數上限約5,000/µL，低於9,000/µL。","（正確）B. 牛正常腹腔液細胞數上限可達9,000/µL，以非退行性嗜中性球和巨噬細胞為主，為正確答案。","C. 羊的正常腹腔液細胞數較牛低，不達9,000/µL。","D. 貓正常腹腔液細胞數通常小於1,500/µL。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_037","year":2018,"roc_year":107,"session":"2","examNo":37,"q":"適用於血液酸鹼平衡及血液氣體分析，但不適用於血液塗抹片染色檢查之抗凝劑為","opts":["A. EDTA","B. oxalates","C. heparin","D. NaF"],"ans":2,"exp":"Heparin是血液氣體分析及酸鹼平衡檢測的標準抗凝劑，但heparin會使血液塗抹片背景染色不均勻（藍色背景），影響細胞形態判讀，故不適用於血液塗抹片染色。","we":["A. EDTA是血液塗抹片及CBC最常用的抗凝劑，適合染色檢查。","B. Oxalates現已少用，不是血液氣體分析的標準抗凝劑。","（正確）C. Heparin適用於血液氣體分析，但不適用於血液塗抹片染色，為正確答案。","D. NaF主要用於血糖保存，不適用於血液氣體分析。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_038","year":2018,"roc_year":107,"session":"2","examNo":38,"q":"下列何者為大多數動物全血球計數檢測（CBC）最常用的抗凝血劑？","opts":["A. EDTA","B. heparin","C. citrates","D. oxalates"],"ans":0,"exp":"EDTA（乙二胺四乙酸）是大多數動物全血球計數（CBC）的標準抗凝劑，可良好保存細胞形態且不影響白血球分類計數。","we":["（正確）A. EDTA是CBC最常用的抗凝劑，細胞保存效果最佳，為正確答案。","B. Heparin會使血塗片背景染色異常，不適合CBC。","C. Citrates（檸檬酸鹽）主要用於凝血功能檢測（PT、APTT），非CBC常規選擇。","D. Oxalates已少用，且對細胞形態保存效果不如EDTA。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_039","year":2018,"roc_year":107,"session":"2","examNo":39,"q":"下列何者通常不會造成嗜中性球減少症？","opts":["A. chloramphenicol中毒","B. phenylbutazone中毒","C. 犬封閉型子宮蓄膿","D. cephalosporin中毒"],"ans":3,"exp":"Cephalosporin（頭孢菌素）引起白血球減少的報告極少，不是造成嗜中性球減少症的典型藥物；chloramphenicol及phenylbutazone均可抑制骨髓，犬封閉型子宮蓄膿在早期造成嗜中性球增多（後期可能因骨髓衰竭而減少）。","we":["A. Chloramphenicol可抑制骨髓造血，造成嗜中性球減少症，需注意。","B. Phenylbutazone（保泰松）在犬貓可引起骨髓抑制，造成嗜中性球減少。","C. 犬封閉型子宮蓄膿早期白血球和嗜中性球通常增加，但嚴重時骨髓受抑，此選項具爭議性。","（正確）D. Cephalosporin通常不造成嗜中性球減少症，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_040","year":2018,"roc_year":107,"session":"2","examNo":40,"q":"下列關於淋巴球之敘述何者正確？","opts":["A. 循環血中之T-淋巴球，大部分為從胃腸道或支氣管淋巴組織來的功能性淋巴球（effector cells）","B. 大部分T-淋巴球留於淋巴組織中，並不進入血中","C. 目前認為淋巴胚細胞（lymphoblast）並非淋巴球之前驅細胞，而是有絲分裂期之前或後之淋巴球","D. 一般而言，T-淋巴球及記憶B-淋巴球壽命較非記憶B-淋巴球短"],"ans":2,"exp":"淋巴球lymphoblast被認為是有絲分裂前後的淋巴球形態，而非前驅細胞的傳統觀念已被修正；目前認為lymphoblast是淋巴球活化後進入分裂期前後的形態，並非獨立的前驅細胞。","we":["A. 循環血中T淋巴球大部分來自胸腺及次級淋巴器官，非腸胃道/支氣管淋巴組織的effector cells，敘述錯誤。","B. 大部分T淋巴球在循環中再循環（recirculate），並非留在淋巴組織不進入血液，敘述錯誤。","（正確）C. 目前認為lymphoblast是有絲分裂期前後的淋巴球形態，而非前驅細胞，此敘述為正確。","D. T淋巴球及記憶B淋巴球壽命較非記憶B淋巴球長（非短），敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_041","year":2018,"roc_year":107,"session":"2","examNo":41,"q":"下列關於嗜中性球之敘述何者正確？","opts":["A. 馬之核分葉間較為細小，但絲狀連繫不明。細胞質呈淡粉紅色，有塵埃狀淡粉紅色顆粒","B. 犬之核常為一或數處凹陷，不明顯之絲狀連繫，分葉不甚明顯。顆粒細小不明顯，使細胞質呈淺橙紅色","C. 牛之核膜呈明顯的鋸齒狀缺口，而葉間呈明顯之絲狀連繫，且有明顯之多分葉狀","D. 帶狀核嗜中性球係指其核較厚，核染質比成熟分葉嗜中性球均勻無明顯的聚集，其核呈現帶狀無凹凸處兩側\r 平行"],"ans":3,"exp":"帶狀核嗜中性球（band neutrophil）之核呈帶狀，兩側平行，核染質均勻，無明顯聚集，此為正確描述。馬嗜中性球分葉間有明顯絲狀連繫，並非不明；犬嗜中性球分葉較明顯；牛的核分葉間連繫為細絲狀，非鋸齒狀。","we":["A為馬的嗜中性球：分葉間有明顯絲狀連繫，而非「絲狀連繫不明」，描述錯誤。","B為犬的嗜中性球：核常呈明顯分葉，細胞質顆粒使其呈淡橘紅色，描述基本正確但非本題正確選項。","C為牛的嗜中性球：分葉間呈細絲狀連繫，核膜並非鋸齒狀缺口，描述錯誤。","（正確）D描述帶狀核嗜中性球：核呈帶狀、兩側平行、核染質均勻，為正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_042","year":2018,"roc_year":107,"session":"2","examNo":42,"q":"凝血因子的活性值必須少於正常值的多少%才會使APTT延長？","opts":["A. 2","B. 10","C. 20","D. 30"],"ans":3,"exp":"APTT（活化部分凝血酶原時間）需凝血因子活性低於正常值的30%以下才會延長。此為臨床血液學的重要閾值概念。","we":["A. 2%過低，凝血因子需降至極端才會影響，不符合APTT延長的臨界值。","B. 10%為PT延長的參考閾值，非APTT所需的標準。","C. 20%仍不足以使APTT出現顯著延長。","（正確）D. 凝血因子活性需低於正常值30%以下，APTT才會延長，為正確閾值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_043","year":2018,"roc_year":107,"session":"2","examNo":43,"q":"大部分正常動物每µL血液之血小板數為多少？","opts":["A. 3,000～4,000","B. 30,000～40,000","C. 300,000～400,000","D. 3,000,000～4,000,000"],"ans":2,"exp":"大部分正常動物（犬貓等）每µL血液中血小板數約為300,000～400,000（即3～4×10⁵/µL），此為臨床參考正常值。","we":["A. 3,000～4,000/µL遠低於正常值，屬嚴重血小板低下症。","B. 30,000～40,000/µL仍屬血小板減少症範圍，低於正常。","（正確）C. 300,000～400,000/µL（3～4×10⁵/µL）為大多數動物的正常血小板數。","D. 3,000,000～4,000,000/µL遠超正常值，屬血小板增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_044","year":2018,"roc_year":107,"session":"2","examNo":44,"q":"下列何者為Vitamin B 12 及葉酸缺乏在骨髓細胞的影響？①可見大型後骨髓球 ②可見高度分葉之嗜中性球 ③可見大於正常之前紅血細胞 ④造成小紅血球","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":0,"exp":"Vit B12及葉酸缺乏造成巨幼球性貧血，骨髓可見：①大型後骨髓球（巨大後骨髓球）、②高分葉嗜中性球（核過分葉）、③大於正常之前紅血細胞（巨幼紅血球）；缺乏時造成大球性貧血而非小球性，故④錯誤。","we":["（正確）A. ①②③均正確：大型後骨髓球、高度分葉嗜中性球、大型前紅血細胞均為巨幼球性變化。","B. ④小紅血球不符，Vit B12/葉酸缺乏造成大球性貧血，故含④的選項有誤。","C. ④小紅血球不符，故含④之①③④組合錯誤。","D. ④小紅血球不符，故含④之①②④組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_045","year":2018,"roc_year":107,"session":"2","examNo":45,"q":"下列有關急性骨髓性白血病的敘述，何者錯誤？","opts":["A. 急性未分化型的白血病可能為CD34陽性，為淋巴造血起源","B. 人最常見之紅血球白血病為AML-M6a","C. 在動物最常見的紅血球白血病為AML-M6b","D. 急性骨髓單核球性白血病（AML-M4），骨髓常嚴重硬化和乾髓"],"ans":0,"exp":"急性未分化型白血病（AML-M0）CD34陽性代表造血幹細胞起源，屬骨髓造血系列而非淋巴造血起源，故A的「淋巴造血起源」說法錯誤。","we":["（正確）A. 急性未分化型白血病為骨髓造血起源而非淋巴造血起源，此敘述錯誤，為本題答案。","B. 人最常見之紅血球白血病為AML-M6a，此敘述正確。","C. 動物最常見的紅血球白血病為AML-M6b（純紅血球白血病），此敘述正確。","D. AML-M4（急性骨髓單核球性白血病）常伴骨髓嚴重硬化及乾髓，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_046","year":2018,"roc_year":107,"session":"2","examNo":46,"q":"下列有關犬急性淋巴球性白血病的敘述，何者正確？","opts":["A. 是一種已分化的淋巴球腫瘤","B. 病灶常發展至次級淋巴器官，如脾臟","C. 可能發生在任何年齡","D. 病程通常可持續幾個月到幾年"],"ans":1,"exp":"犬急性淋巴球性白血病（ALL）病灶常快速擴散至次級淋巴器官如脾臟、淋巴結和肝臟，此為其特徵性表現。ALL為未分化淋巴球腫瘤，多發生於中老年犬，病程通常只有數週至數月。","we":["A. ALL為未分化淋巴球腫瘤，而非已分化，故A錯誤。","（正確）B. ALL病灶常快速擴散至次級淋巴器官（脾臟、肝臟等），為正確敘述。","C. ALL多發生於中老年犬，並非任何年齡均等可能，故C不精確。","D. ALL病程通常短暫（數週至數月），而非可持續幾個月到幾年，故D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_047","year":2018,"roc_year":107,"session":"2","examNo":47,"q":"犬鈎蟲感染，長期下痢且糞中帶血，長期慢性出血狀況下，最可能出現下列何種貧血？","opts":["A. 小球性低色性","B. 大球性高色性","C. 正球性低色性","D. 正球性正色性"],"ans":0,"exp":"慢性失血（如鈎蟲長期出血）導致鐵缺乏，紅血球合成受阻，形成小球性（MCV↓）低色性（MCHC↓）貧血，此為缺鐵性貧血的典型血像。","we":["（正確）A. 慢性失血導致鐵缺乏，出現小球性低色性貧血（缺鐵性貧血），為正確答案。","B. 大球性高色性貧血見於Vit B12/葉酸缺乏，與慢性失血無關。","C. 正球性低色性貧血不符合缺鐵的典型表現。","D. 正球性正色性貧血多見於急性失血或溶血初期，非慢性缺鐵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_048","year":2018,"roc_year":107,"session":"2","examNo":48,"q":"下列何者缺乏時，紅血球常易形成海因滋小體而導致貧血？","opts":["A. pyruvate kinase","B. glutathione synthetase","C. methemoglobin reductase","D. phosphofructokinase"],"ans":1,"exp":"Glutathione synthetase缺乏時，谷胱甘肽（GSH）無法充分合成，紅血球抗氧化能力下降，血紅素易被氧化形成變性血紅素聚集於紅血球膜，形成海因滋小體（Heinz body），導致溶血性貧血。","we":["A. Pyruvate kinase缺乏造成溶血性貧血，但不直接造成海因滋小體形成。","（正確）B. Glutathione synthetase缺乏使GSH不足，氧化性血紅素沉積形成海因滋小體，為正確答案。","C. Methemoglobin reductase缺乏造成高鐵血紅素血症，但海因滋小體主要與GSH缺乏相關。","D. Phosphofructokinase缺乏造成溶血，但不直接造成海因滋小體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_049","year":2018,"roc_year":107,"session":"2","examNo":49,"q":"一般而言，下列何者最適合用來評估體內之鐵總貯藏量？","opts":["A. 血清中之鐵蛋白（ferritin）","B. 總鐵結合量（total iron-binding capacity）","C. 血清中之運鐵蛋白（transferrin）","D. 血漿中之藍胞漿素（ceruloplasmin）"],"ans":0,"exp":"血清鐵蛋白（ferritin）是體內鐵儲存的主要形式，其血清濃度直接反映體內鐵總貯藏量，是評估鐵儲量最佳的指標。","we":["（正確）A. 血清鐵蛋白（ferritin）直接反映體內鐵總貯藏量，為最佳評估指標。","B. 總鐵結合量（TIBC）反映轉鐵蛋白的運輸能力，間接評估鐵缺乏，非直接測量儲存量。","C. 運鐵蛋白（transferrin）為鐵的運輸蛋白，反映鐵運輸而非儲存。","D. 藍胞漿素（ceruloplasmin）為銅相關蛋白，與鐵儲量評估無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_050","year":2018,"roc_year":107,"session":"2","examNo":50,"q":"下列有關白血病樣（leukemoid）反應之敘述何者正確？①表示有嚴重化膿性疾病 ②可能出現淋巴球增多\r ③可能出現骨髓胚細胞 ④疾病末期可能出現嗜中性球減少症","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":2,"exp":"白血病樣反應特徵：①嚴重化膿性疾病可見、③骨髓胚細胞可出現、④疾病末期嗜中性球可耗盡而減少；②淋巴球增多不屬於白血病樣反應的特徵（白血病樣反應以嗜中性球系列增生為主）。","we":["A. ①②③含②（淋巴球增多），②不屬白血病樣反應特徵，故A錯誤。","B. ①②④含②，同樣因②錯誤。","（正確）C. ①③④：嚴重化膿、骨髓胚細胞出現、末期嗜中性球減少，均為白血病樣反應特徵，為正確答案。","D. ②③④含②（淋巴球增多），②不符，故D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_051","year":2018,"roc_year":107,"session":"2","examNo":51,"q":"肝素及組織胺可來自下列那種血球？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 單核球"],"ans":2,"exp":"嗜鹼性球（basophil）及其組織對應細胞（肥大細胞）含有肝素和組織胺兩種顆粒物質，在過敏及炎症反應中釋放，為主要來源。","we":["A. 嗜中性球顆粒含溶菌酶等抗菌物質，不含肝素及組織胺。","B. 嗜酸性球含主要鹼性蛋白及過氧化物酶，主要參與過敏及寄生蟲反應，不是肝素/組織胺來源。","（正確）C. 嗜鹼性球顆粒含肝素和組織胺，為此兩種物質的主要血液中來源。","D. 單核球參與吞噬及免疫調節，不含肝素和組織胺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_052","year":2018,"roc_year":107,"session":"2","examNo":52,"q":"下列何種激素可促進脂蛋白脂酶之活性？①胰島素 ②甲狀腺素 ③生長素 ④肝素","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":3,"exp":"脂蛋白脂酶（LPL）活性受多種激素調控：胰島素①、甲狀腺素②、肝素④均可促進LPL活性；生長素③則抑制LPL，促進脂肪分解，故③不在促進之列，答案為①②④。","we":["A. ①②③含生長素③，生長素抑制LPL，故A錯誤。","B. ②③④含生長素③，同樣因③錯誤。","C. ①③④含生長素③，同樣錯誤。","（正確）D. ①②④：胰島素、甲狀腺素、肝素均促進LPL活性，不含生長素，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_053","year":2018,"roc_year":107,"session":"2","examNo":53,"q":"何種狀況下易引起高血脂症？①急性胰臟壞死 ②糖尿病 ③甲狀腺功能亢進 ④膽汁淤積","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":3,"exp":"高血脂症常見誘因：①急性胰臟壞死（脂肪分解增加）、②糖尿病（胰島素不足→LPL活性↓→VLDL清除↓）、④膽汁淤積（脂質代謝障礙）；而③甲狀腺功能亢進加速脂質代謝，反而造成低血脂，故不包含③，答案為①②④。","we":["A. ①②③含甲亢③，甲亢促進脂質分解而降低血脂，故A錯誤。","B. ②③④含甲亢③，同樣錯誤。","C. ①③④含甲亢③，同樣錯誤。","（正確）D. ①②④：急性胰臟壞死、糖尿病、膽汁淤積均易引起高血脂症，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_054","year":2018,"roc_year":107,"session":"2","examNo":54,"q":"測定體液（如尿及腦脊髓液）中微量蛋白質，以下列那種方法較常使用？","opts":["A. 血清電泳法","B. 三氯醋酸沉澱後用色素結合法","C. 屈折計法","D. 加熱沉澱法"],"ans":1,"exp":"體液（尿液、腦脊髓液）中微量蛋白質測定，常用三氯醋酸（TCA）沉澱蛋白後再以色素結合法（如考馬斯亮藍法）定量，此法靈敏度高，適合偵測微量蛋白。","we":["A. 血清電泳法用於分析血清蛋白組成，不適合體液微量蛋白定量。","（正確）B. 三氯醋酸沉澱後用色素結合法，靈敏度高，適合偵測尿液/CSF中微量蛋白，為正確答案。","C. 屈折計法測比重，用於快速估計總蛋白，精確度不足以測微量蛋白。","D. 加熱沉澱法靈敏度低，僅能偵測較高濃度蛋白，不適用微量測定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_055","year":2018,"roc_year":107,"session":"2","examNo":55,"q":"下列何種犬種較常罹患特發性（idiopathic）高血脂症？","opts":["A. 大丹犬","B. 灰色獵犬","C. 迷你雪納瑞犬","D. 秋田犬"],"ans":2,"exp":"迷你雪納瑞犬（Miniature Schnauzer）為已知具有遺傳性特發性高血脂症傾向的犬種，常表現為原發性高三酸甘油脂血症，與胰臟炎風險升高有關。","we":["A. 大丹犬無特別的特發性高血脂症遺傳傾向。","B. 灰色獵犬（Greyhound）血液學參數特殊，但非高血脂症易感犬種。","（正確）C. 迷你雪納瑞犬有遺傳性特發性高血脂症傾向，為最常見的易感犬種。","D. 秋田犬無特別的特發性高血脂症遺傳傾向。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_056","year":2018,"roc_year":107,"session":"2","examNo":56,"q":"複選題 56.下列關於酵素的命名與分類原則，何者正確？","opts":["A. 依據世界動物衛生組織之建議訂定命名原則","B. 依據觸媒的反應內容訂定酵素的系統名，共有七大分類（EC1~7）","C. 肌酸激酶（creatine kinase，CK）屬於EC1群酵素","D. "],"ans":3,"exp":"此題為複選題且選項D缺字，依現有選項判斷：酵素命名由國際生化聯盟（IUBMB）負責，非世界動物衛生組織（OIE）；共有六大分類（EC1~6），非七大；CK屬轉酶類（EC2），非氧化還原酶（EC1）；故A、B、C均錯誤，D為正確答案（原題選項D疑為完整命名原則的正確說明）。","we":["A. 酵素命名由國際生化聯盟（IUBMB）制定，非世界動物衛生組織（OIE），故A錯誤。","B. 酵素共有六大分類（EC1~EC6），非七大，故B錯誤。","C. CK屬轉酶類（EC2，transferases），而非氧化還原酶（EC1），故C錯誤。","（正確）D. 依題目設計，D為正確選項（原題選項D內容缺字，需看圖/原卷確認）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1072_實診_057","year":2018,"roc_year":107,"session":"2","examNo":57,"q":"下列何者屬於細胞內酵素？","opts":["A. 腎素（renin）","B. 山梨醇脫氫酶（SDH）","C. 纖維素原（fibrinogen）","D. 微血管增滲素（kallikrein）"],"ans":1,"exp":"山梨醇脫氫酶（SDH）是肝細胞內的胞內酵素，主要存在於肝細胞細胞質中，肝臟損傷時釋放入血，為肝特異性的胞內酵素指標。其他選項（腎素、纖維素原、微血管增滲素）均為分泌性/血漿蛋白，屬胞外蛋白。","we":["A. 腎素（renin）為腎臟分泌的蛋白酶，屬分泌性酵素，非胞內酵素。","（正確）B. SDH為肝細胞胞內酵素，存在細胞質中，肝損傷後釋出血中，為正確答案。","C. 纖維素原（fibrinogen）為肝臟合成並分泌的血漿凝血蛋白，非胞內酵素。","D. 微血管增滲素（kallikrein）為血漿中的絲胺酸蛋白酶，屬分泌性蛋白，非胞內酵素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_058","year":2018,"roc_year":107,"session":"2","examNo":58,"q":"澱粉酶在人類可用作急性胰臟炎的診斷標記，但在犬則會由何種器官代謝和破壞而無法作為相似的診斷應\r 用？","opts":["A. 肝臟","B. 腎臟","C. 胰臟","D. 心臟"],"ans":1,"exp":"犬的澱粉酶主要由腎臟代謝和排泄，因此腎臟疾病也會使犬血中澱粉酶升高，導致其特異性低，無法像人一樣作為急性胰臟炎的可靠診斷標記。","we":["A. 肝臟並非犬澱粉酶的主要代謝器官。","（正確）B. 犬澱粉酶主要由腎臟代謝，腎疾病亦會升高血中澱粉酶，故其對胰臟炎特異性低，為正確答案。","C. 胰臟是澱粉酶的分泌來源，不是其代謝破壞的器官。","D. 心臟與澱粉酶代謝無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_059","year":2018,"roc_year":107,"session":"2","examNo":59,"q":"下列何種方法無法去除脂血症對其他實驗室檢查之影響？","opts":["A. 採血前禁食24小時","B. 靜脈注射heparin","C. 使用檸檬酸鹽抗凝","D. 將脂血症血漿冷藏後離心"],"ans":2,"exp":"使用檸檬酸鹽抗凝劑僅改變抗凝方式，並不能去除血漿中已存在的脂肪微粒（乳糜），無法消除脂血症對實驗室檢查（光學比色法等）的干擾。","we":["A. 採血前禁食24小時可避免飯後乳糜血，有效減少外源性脂血症干擾。","B. 靜脈注射heparin可活化脂蛋白脂酶（LPL），加速三酸甘油脂清除，能降低血中脂質。","（正確）C. 使用檸檬酸鹽抗凝無法去除血漿中脂肪微粒，不能消除脂血症干擾，為正確答案。","D. 脂血症血漿冷藏離心可使乳糜微粒上浮後去除，能有效減少干擾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_060","year":2018,"roc_year":107,"session":"2","examNo":60,"q":"下列何者最常造成單源性γ-球蛋白病（gammopathy）？","opts":["A. 貓傳染性腹膜炎","B. 漿細胞性骨髓瘤","C. 類風濕性關節炎","D. 全身性紅斑性狼瘡"],"ans":1,"exp":"單源性γ-球蛋白病（monoclonal gammopathy）最常由漿細胞性骨髓瘤（multiple myeloma）造成，腫瘤性漿細胞大量分泌單一種類免疫球蛋白，電泳出現M-spike。","we":["A. 貓傳染性腹膜炎（FIP）造成多源性高球蛋白血症（polyclonal），非單源性。","（正確）B. 漿細胞性骨髓瘤（multiple myeloma）是最常見造成單源性γ-球蛋白病的原因，為正確答案。","C. 類風濕性關節炎造成慢性炎症性多源性球蛋白升高，非單源性。","D. 全身性紅斑性狼瘡造成多源性高球蛋白血症，非單源性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_061","year":2018,"roc_year":107,"session":"2","examNo":61,"q":"肌酸激酶（creatine kinase）的異構酶中，CK2主要存在於下列何者？","opts":["A. 腦","B. 骨骼肌","C. 末梢神經","D. 心肌"],"ans":3,"exp":"肌酸激酶（CK）有三種異構酶：CK1（BB）主要在腦、CK2（MB）主要在心肌、CK3（MM）主要在骨骼肌。CK2（即CK-MB）升高是心肌損傷的重要標記。","we":["A. CK1（BB型）主要存在於腦，非CK2。","B. CK3（MM型）主要存在於骨骼肌，非CK2。","C. 末梢神經不是CK2的主要來源。","（正確）D. CK2（MB型）主要存在於心肌，心肌受損時升高，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_062","year":2018,"roc_year":107,"session":"2","examNo":62,"q":"比較犬血清中AST活性值與CK活性值的半衰期，以下何者正確？","opts":["A. 前者長","B. 後者長","C. 二者相同","D. 二者無關"],"ans":0,"exp":"犬血清中AST的半衰期約為12小時，而CK的半衰期僅約1～2小時，因此AST（前者）的半衰期明顯長於CK（後者）。","we":["（正確）A. AST半衰期（約12小時）長於CK半衰期（約1～2小時），故前者長，為正確答案。","B. CK半衰期較短，並非後者長。","C. 兩者半衰期差異顯著，並非相同。","D. 兩者半衰期有明確差異，非無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_063","year":2018,"roc_year":107,"session":"2","examNo":63,"q":"犬呈現少尿且尿比重為1.007～1.013，最可能為","opts":["A. 脫水","B. 中樞性尿崩症","C. 末期慢性腎衰竭","D. 高腎上腺皮質功能症"],"ans":2,"exp":"少尿合併尿比重1.007～1.013（等滲尿，isosthenuria），代表腎臟喪失濃縮與稀釋能力，為末期慢性腎衰竭的典型表現，此時腎小管功能嚴重受損。","we":["A. 脫水會造成少尿但尿比重應升高（>1.030），非等滲尿。","B. 中樞性尿崩症表現為多尿且尿比重極低（<1.006），非少尿。","（正確）C. 末期慢性腎衰竭腎小管失去濃縮能力，出現少尿合併等滲尿（1.007～1.013），為正確答案。","D. 高腎上腺皮質功能症（庫興症）多表現多尿多飲，尿比重低，非此模式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_064","year":2018,"roc_year":107,"session":"2","examNo":64,"q":"下列何種尿液結晶常與乙二醇（ethylene glycol）中毒有關？","opts":["A. ammonium urate","B. cystine","C. calcium carbonate","D. calcium oxalate monohydrate"],"ans":3,"exp":"乙二醇（防凍劑）在體內代謝為草酸，與鈣結合形成草酸鈣（calcium oxalate）沉積，尿液中出現大量calcium oxalate monohydrate（hipurate型，柱狀/啞鈴形）結晶為其特徵性表現。","we":["A. Ammonium urate結晶與肝臟疾病/門脈分流有關，非乙二醇中毒的特徵。","B. Cystine結晶與胺基酸代謝缺陷有關，非乙二醇中毒。","C. Calcium carbonate結晶常見於草食動物（馬），與乙二醇中毒無關。","（正確）D. Calcium oxalate monohydrate結晶為乙二醇中毒的特徵性尿液結晶，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_065","year":2018,"roc_year":107,"session":"2","examNo":65,"q":"尿液中的何種尿圓柱，主要於集尿管形成，通常代表有腎小管的慢性病變？","opts":["A. 上皮尿圓柱","B. 蠟樣尿圓柱","C. 脂肪滴尿圓柱","D. 紅血球尿圓柱"],"ans":1,"exp":"蠟樣尿圓柱（waxy cast）主要在集尿管形成，較透明管型更寬大，外觀蠟質光滑，代表腎小管長期慢性病變及腎元廢用（chronic tubular degeneration），常見於末期慢性腎臟病。","we":["A. 上皮尿圓柱含脫落腎小管上皮細胞，代表急性腎小管損傷，非慢性病變指標。","（正確）B. 蠟樣尿圓柱主要在集尿管形成，代表腎小管慢性病變，為正確答案。","C. 脂肪滴尿圓柱見於貓（特別是糖尿病/腎小管脂肪變性），代表脂質代謝異常。","D. 紅血球尿圓柱代表腎絲球損傷出血，非慢性腎小管病變指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_066","year":2018,"roc_year":107,"session":"2","examNo":66,"q":"下列何種原因並不會造成腎前性氮血症（prerenal azotemia）？","opts":["A. 脫水","B. 休克","C. 膀胱破裂","D. 心血管疾病"],"ans":2,"exp":"腎前性氮血症係因腎臟灌流不足造成。膀胱破裂使尿液漏入腹腔，尿素被腹膜再吸收入血而升高BUN/Creatinine，屬腎後性（或腹腔尿液再吸收性）氮血症，並非腎前性。","we":["A. 脫水減少腎臟灌流，會造成腎前性氮血症。","B. 休克減少心輸出量及腎灌流，會造成腎前性氮血症。","（正確）C. 膀胱破裂造成尿液腹腔累積、腹膜再吸收氮質，屬腎後性氮血症，並非腎前性，為正確答案。","D. 心血管疾病降低心輸出量及腎灌流，會造成腎前性氮血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_067","year":2018,"roc_year":107,"session":"2","examNo":67,"q":"下列何種高腎上腺皮質功能症最可能在進行高或低劑量dexamethasone抑制試驗時，沒有出現抑制作用？","opts":["A. 腦垂腺依賴性高腎上腺皮質功能症（pituitary-dependent hyperadrenocorticism）","B. 腎上腺依賴性高腎上腺皮質功能症（adrenal-dependent hyperadrenocorticism）","C. 醫源性庫興症候群（iatrogenic Cushing's syndrome）","D. 繼發性高腎上腺皮質功能症（secondary hyperadrenocorticism）"],"ans":1,"exp":"腎上腺依賴性高腎上腺皮質功能症（ADH，腎上腺腫瘤）自主性分泌皮質醇，不受垂腦軸回饋調控，因此高劑量及低劑量dexamethasone均無法抑制，是最典型的無抑制作用情況。","we":["A. 腦垂腺依賴性（PDH）高劑量dexamethasone通常可抑制（至少50%案例），低劑量無法抑制。","（正確）B. 腎上腺依賴性（ADH，腎上腺腫瘤）因腫瘤自主分泌，高低劑量dexamethasone均無法抑制，為正確答案。","C. 醫源性庫興症（外源性類固醇所致）內源性皮質醇已被抑制，dexamethasone試驗意義不同。","D. 繼發性高腎上腺皮質功能症本質仍受垂腦軸影響，並非本題最符合情境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_068","year":2018,"roc_year":107,"session":"2","examNo":68,"q":"胰臟蘭氏小島的何種細胞分泌somatostatin？","opts":["A. α細胞","B. β細胞","C. δ細胞","D. F細胞"],"ans":2,"exp":"胰臟蘭氏小島中：α細胞分泌升糖素、β細胞分泌胰島素、δ（delta）細胞分泌體制素（somatostatin）、F細胞分泌胰多肽（pancreatic polypeptide）。","we":["A. α細胞分泌升糖素（glucagon），非somatostatin。","B. β細胞分泌胰島素（insulin），非somatostatin。","（正確）C. δ細胞分泌體制素（somatostatin），抑制胰島素與升糖素分泌，為正確答案。","D. F細胞分泌胰多肽（pancreatic polypeptide），非somatostatin。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_069","year":2018,"roc_year":107,"session":"2","examNo":69,"q":"下列何者之主要作用為升高血鈣值、增加尿中排磷量及降低血磷值？","opts":["A. 甲狀腺素","B. 副甲狀腺素","C. 糖質皮質酮","D. 胰島素"],"ans":1,"exp":"副甲狀腺素（PTH）的主要作用為：升高血鈣（促進骨鈣釋放、腸道吸收鈣及腎臟再吸收鈣）、增加尿中排磷量及降低血磷，為鈣磷恆定的核心調控激素。","we":["A. 甲狀腺素影響代謝率，升鈣作用非其主要功能。","（正確）B. 副甲狀腺素（PTH）升高血鈣、增加尿排磷、降低血磷，為正確答案。","C. 糖質皮質酮（glucocorticoid）反而抑制鈣吸收，造成血鈣下降。","D. 胰島素主要調控血糖，無直接升鈣降磷作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_070","year":2018,"roc_year":107,"session":"2","examNo":70,"q":"血清胰島素樣生長因子1（serum insulin-like growth factor 1）基礎值的測量，可用來診斷下列何種疾病？","opts":["A. 糖尿病（diabetes mellitus）","B. 肢端肥大症（acromegaly）","C. 尿崩症（diabetes insipidus）","D. 高腎上腺皮質功能症（hyperadrenocorticism）"],"ans":1,"exp":"血清IGF-1（胰島素樣生長因子1）由肝臟在生長激素（GH）刺激下分泌，基礎值升高可作為GH過多所致肢端肥大症（acromegaly）的診斷依據，因其半衰期較長且較GH穩定。","we":["A. 糖尿病診斷使用血糖、糖化血色素等指標，與IGF-1無關。","（正確）B. 肢端肥大症（GH過多）使IGF-1持續升高，血清IGF-1基礎值為其診斷指標，為正確答案。","C. 尿崩症診斷使用水剝奪試驗/ADH測定，與IGF-1無關。","D. 高腎上腺皮質功能症診斷使用ACTH刺激試驗或dexamethasone抑制試驗，非IGF-1。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_071","year":2018,"roc_year":107,"session":"2","examNo":71,"q":"小狗被車撞，胸部呈現廣泛擦傷，體溫39.4℃、呼吸速率62次/分、心跳140 bpm，其動脈血液氣體分析結果 如下：pH 7.48、PaO 2 63 mmHg、PaCO 2 26 mmHg、HCO 3 - 18.8 mEq/L， 此犬之Alveolar-arterial (A-a)  oxygen gradient（肺泡－動脈氧氣壓力差）為何？註：arterial blood gas results（FiO 2 =21%）","opts":["A. 63","B. 54.5","C. 6.8","D. 119"],"ans":1,"exp":"肺泡-動脈氧壓差（A-a gradient）= PAO2 - PaO2。PAO2 = (FiO2 × 713) - (PaCO2/0.8) = (0.21 × 713) - (26/0.8) = 149.73 - 32.5 = 117.23 mmHg。A-a gradient = 117.23 - 63 ≈ 54.5 mmHg（正常<15 mmHg，此犬明顯升高表示肺換氣障礙）。","we":["A. 63為PaO2數值，並非A-a gradient計算結果。","（正確）B. A-a gradient ≈ 117.2 - 63 ≈ 54.5 mmHg，計算正確，為答案。","C. 6.8非正確計算結果。","D. 119約為PAO2數值，非A-a gradient。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_072","year":2018,"roc_year":107,"session":"2","examNo":72,"q":"投予下列何者最容易造成小動物出現低血鉀現象？","opts":["A. furosemide","B. spironolactone","C. non-steroidal anti-inflammatory agents","D. ACE inhibitors"],"ans":0,"exp":"Furosemide為亨利氏環利尿劑，抑制Na-K-2Cl共同轉運體，造成大量鈉鉀隨尿排出，是最常見造成低血鉀（hypokalemia）的藥物。","we":["（正確）A. Furosemide（亨利氏環利尿劑）促進鉀排出，最易造成低血鉀，為正確答案。","B. Spironolactone為保鉀利尿劑，反而造成高血鉀。","C. NSAIDs不直接造成低血鉀，可能影響腎功能但非低血鉀主因。","D. ACE inhibitors抑制醛固酮分泌，傾向造成高血鉀而非低血鉀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_073","year":2018,"roc_year":107,"session":"2","examNo":73,"q":"下列何者最不可能造成呼吸性鹼中毒之原因？","opts":["A. 全身性麻醉","B. 高熱","C. 肺水腫","D. 肺脈管分流"],"ans":0,"exp":"呼吸性鹼中毒由過度換氣（CO2排出過多）引起。全身性麻醉通常抑制呼吸中樞造成通氣不足→CO2積累→呼吸性酸中毒，而非鹼中毒，故A最不可能造成呼吸性鹼中毒。","we":["（正確）A. 全身性麻醉抑制呼吸，造成通氣不足及CO2累積，引起呼吸性酸中毒，而非鹼中毒，為正確答案。","B. 高熱刺激呼吸中樞造成過度換氣，可引起呼吸性鹼中毒。","C. 肺水腫刺激肺受器造成代償性過度換氣，可引起呼吸性鹼中毒。","D. 肺脈管分流（V/Q不匹配）刺激化學受器，引發代償性過度換氣，可造成呼吸性鹼中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_074","year":2018,"roc_year":107,"session":"2","examNo":74,"q":"下列何種類型之酸鹼不平衡，其陰離子差是在正常值內？","opts":["A. 分泌性酸中毒","B. 中和性酸中毒","C. 混合型鹼中毒及酸中毒","D. 有機酸過多性酸中毒"],"ans":0,"exp":"陰離子差（AG）正常的代謝性酸中毒（正常AG酸中毒）發生於HCO3⁻丟失伴隨Cl⁻補充（高氯性酸中毒），如腹瀉、腎小管性酸中毒等，即「分泌性酸中毒」（secretory/hyperchloremic acidosis）。","we":["（正確）A. 分泌性（高氯性）酸中毒：HCO3⁻丟失由Cl⁻補償，AG維持正常，為正確答案。","B. 中和性酸中毒並非標準分類術語，與AG正常的酸中毒概念不吻合。","C. 混合型鹼中毒及酸中毒情況複雜，AG可正常或異常，非最典型答案。","D. 有機酸過多（如乳酸酸中毒、酮酸酸中毒）造成高AG酸中毒，AG升高而非正常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_075","year":2018,"roc_year":107,"session":"2","examNo":75,"q":"下列那種離子常與血清氯離子之增加或減少呈正相關？","opts":["A. 鈉","B. 鉀","C. 鈣","D. 鎂"],"ans":0,"exp":"血清氯離子（Cl⁻）與鈉離子（Na⁺）常呈正相關變動，因兩者均為細胞外液主要陽/陰離子，維持電中性；低鈉血症常伴低氯，高鈉血症常伴高氯，稱為「跟隨鈉」現象。","we":["（正確）A. 鈉離子與氯離子共同維持細胞外液電中性，兩者增減常呈正相關，為正確答案。","B. 鉀離子主要為細胞內陽離子，其變化與氯離子無直接正相關。","C. 鈣離子調控機制不同（PTH/維生素D），與氯離子無正相關。","D. 鎂離子調控與氯離子無直接正相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_076","year":2018,"roc_year":107,"session":"2","examNo":76,"q":"檢測滲液及血液中的三酸甘油脂及膽固醇濃度可用來區分","opts":["A. 純粹性與修飾性漏出液","B. 非乳糜性與乳糜性滲液","C. 非化膿性與化膿性滲出液","D. 出血性與淋巴性滲液"],"ans":1,"exp":"乳糜性滲液診斷：測定滲液三酸甘油脂>血液濃度（>100 mg/dL）且膽固醇<血液濃度，即可判定為乳糜液；反之（三酸甘油脂↓、膽固醇↑）為非乳糜性，故三酸甘油脂及膽固醇比值可區分乳糜性與非乳糜性滲液。","we":["A. 純粹性與修飾性漏出液主要以蛋白質及細胞數區分，非三酸甘油脂/膽固醇。","（正確）B. 測定滲液與血液三酸甘油脂及膽固醇比值可區分乳糜性與非乳糜性滲液，為正確答案。","C. 化膿性/非化膿性滲出液以細胞組成（嗜中性球比例）區分，非脂質測定。","D. 出血性與淋巴性滲液以紅血球/淋巴球比例區分，非脂質指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_077","year":2018,"roc_year":107,"session":"2","examNo":77,"q":"正常腦脊髓液之葡萄糖含量約為血糖含量之多少%","opts":["A. 20～40","B. 30～50","C. 40～60","D. 60～80"],"ans":3,"exp":"正常腦脊髓液（CSF）中葡萄糖含量約為同時血糖的60～80%，此比例反映血腦屏障對葡萄糖的主動轉運；腦膜炎等感染時細菌消耗葡萄糖，CSF葡萄糖比例會下降。","we":["A. 20～40%過低，不符合正常CSF葡萄糖比例。","B. 30～50%低於正常範圍。","C. 40～60%接近但仍偏低，正常值下限約60%。","（正確）D. 60～80%為正常CSF葡萄糖佔血糖比例，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_078","year":2018,"roc_year":107,"session":"2","examNo":78,"q":"下列何者不屬於圓形細胞瘤（round cell tumors）？","opts":["A. 組織細胞瘤（histiocytoma）","B. 肥胖細胞瘤（mast cell tumor)","C. 脂肪瘤（lipoma）","D. 傳染性生殖器腫瘤 （transmissible venereal tumor）"],"ans":2,"exp":"圓形細胞瘤（round cell tumors）包括：組織細胞瘤、肥胖細胞瘤（肥大細胞瘤）、淋巴瘤、漿細胞瘤、傳染性生殖器腫瘤（TVT）等；脂肪瘤（lipoma）為間葉組織（脂肪細胞）腫瘤，不屬於圓形細胞瘤。","we":["A. 組織細胞瘤（histiocytoma）屬圓形細胞瘤，故A不是答案。","B. 肥胖細胞瘤（mast cell tumor）屬圓形細胞瘤，故B不是答案。","（正確）C. 脂肪瘤（lipoma）為脂肪細胞腫瘤，屬間葉性腫瘤，不屬圓形細胞瘤，為正確答案。","D. TVT（傳染性生殖器腫瘤）屬圓形細胞瘤，故D不是答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_079","year":2018,"roc_year":107,"session":"2","examNo":79,"q":"若關節囊液凝固不良，且未見凝塊，則其最可能的疾病為下列何者？","opts":["A. 免疫疾病性關節炎","B. 關節水腫","C. 非化膿性關節炎","D. 風濕性關節炎"],"ans":0,"exp":"正常關節囊液含黏蛋白（hyaluronic acid），受傷或炎症時可形成凝塊（mucin clot test）；免疫疾病性關節炎（如類風濕性關節炎、SLE相關關節炎）因關節液成分改變，黏蛋白降解，凝固能力下降，不易形成凝塊。","we":["（正確）A. 免疫疾病性關節炎因黏蛋白品質下降，關節囊液凝固不良且未見凝塊，為正確答案。","B. 關節水腫（joint effusion）主要為漏出液，蛋白質及細胞數少，但仍可形成輕微凝塊。","C. 非化膿性關節炎（輕度炎症）關節液凝固能力通常尚可，非典型無凝塊表現。","D. 風濕性關節炎（感染後反應性）關節液含較多蛋白質，仍有一定凝固能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1072_實診_080","year":2018,"roc_year":107,"session":"2","examNo":80,"q":"下列關於體腔滲液之敘述，何者錯誤？","opts":["A. 體腔液體若為白色混濁，可能為乳糜液或含有多數細胞之偽乳糜液","B. 體腔液體若為黃綠色，可能含有膽汁或綠膿桿菌之感染","C. 正常體腔液體，其蛋白質含量＞4 g/dL以上","D. 如懷疑有胸管或腹腔淋巴管漏出性病變時，可測定滲液之三酸甘油脂濃度"],"ans":2,"exp":"正常體腔液體蛋白質含量極低（<1.5～2.5 g/dL），遠不到4 g/dL，選項C「蛋白質含量＞4 g/dL以上」為錯誤敘述，實際上蛋白質>3 g/dL才屬滲出液（exudate）範疇。","we":["A. 白色混濁體腔液可為乳糜液或偽乳糜液，此敘述正確。","B. 黃綠色體腔液可含膽汁（膽汁性腹膜炎）或綠膿桿菌感染，此敘述正確。","（正確）C. 正常體腔液蛋白質極低（<2.5 g/dL），非>4 g/dL，此敘述錯誤，為正確答案。","D. 懷疑胸管/淋巴管漏出時測定三酸甘油脂濃度以診斷乳糜液，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_001","year":2019,"roc_year":108,"session":"1","examNo":1,"q":"進行尿液檢査時，下列敘述何者最正確？","opts":["A. 寄生蟲學檢査時，可用10%福馬林液防腐","B. 微生物學檢査時，可添加化學防腐劑","C. 細胞學檢査時，尿渣抹片可用甲醛固定","D. 化學分析檢査時，以甲醛防腐優於甲苯"],"ans":0,"exp":"尿液寄生蟲學檢查時，可使用10%福馬林液作為防腐劑以保存原蟲及蟲卵形態。微生物學檢查不可添加化學防腐劑，否則會殺滅細菌影響培養結果。細胞學抹片應用甲醇（methanol）固定，而非甲醛。化學分析以甲苯防腐優於甲醛，因甲醛會干擾許多化學試驗。","we":["（正確）寄生蟲學檢查可用10%福馬林液防腐，能保存寄生蟲形態而不影響結果。","微生物學檢查不可添加化學防腐劑，防腐劑會抑制或殺滅細菌，導致培養失敗。","細胞學抹片應使用甲醇（methanol）固定，甲醛固定會破壞細胞形態。","化學分析防腐應使用甲苯（toluene），甲苯優於甲醛，因甲醛會干擾化學反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_002","year":2019,"roc_year":108,"session":"1","examNo":2,"q":"血小板進行止血作用之順序依序為","opts":["A. 活化、黏著、凝集、變形","B. 黏著、活化、變形、凝集","C. 變形、活化、黏著、凝集","D. 凝集、黏著、變形、活化"],"ans":1,"exp":"血小板止血的正確順序為：黏著（adhesion）→ 活化（activation）→ 變形（shape change）→ 凝集（aggregation）。血管受損後，von Willebrand因子媒介血小板黏著於受損血管壁，隨後活化並釋放顆粒內容物，形態改變為偽足形，最終互相凝集形成血栓。","we":["活化→黏著→凝集→變形的順序錯誤；黏著必須先於活化發生。","（正確）黏著→活化→變形→凝集是血小板止血的正確生理順序。","變形→活化→黏著→凝集錯誤；變形是活化後的結果，不能先於黏著。","凝集→黏著→變形→活化錯誤；凝集是最後步驟，不能排在最前。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_003","year":2019,"roc_year":108,"session":"1","examNo":3,"q":"封魏氏（von\tWillebrand )病之檢驗.最不可能出現之結果為","opts":["A. 血小板數正常","B. 口腔黏膜出血時間（BMBT)延長","C. 活化部分成栓質時間（APTT\t)正常","D. —段式凝血酶原時間（OSPT\t)延長"],"ans":3,"exp":"von Willebrand病是vWF（von Willebrand factor）缺乏，vWF主要協助血小板黏著與攜帶Factor VIII。vWD特徵：血小板數正常（A正確）、BMBT延長（B正確）、APTT可延長（因vWF攜帶FVIII，FVIII減少→內源性凝血路徑受影響→APTT延長，而非正常）。OSPT（一段式凝血酶原時間）檢測外源性路徑，vWD不影響外源性路徑，故OSPT通常正常而非延長。因此「OSPT延長」最不可能出現。","we":["vWD時血小板數量正常，因缺乏的是vWF蛋白而非血小板生成異常，此結果正確可見。","vWD時一期止血功能異常，BMBT延長是典型表現，此結果正確可見。","vWF攜帶FVIII，vWF缺乏→FVIII減少→APTT可延長，故APTT「正常」不一定成立，但題目選項問「最不可能」，此較有可能見到。","（正確）OSPT檢測外源性凝血路徑（FVII、X、V、II），vWD不影響此路徑，故OSPT延長最不可能出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_004","year":2019,"roc_year":108,"session":"1","examNo":4,"q":"犬每μL血小板數至少低於多少時才會發生血小板減少症導致出血？","opts":["A. 100,000","B. 50,000","C. 25,000","D. 10,000"],"ans":3,"exp":"犬血小板正常值約200,000～500,000/μL。當血小板數低於30,000/μL（部分教科書為10,000/μL）才會發生自發性出血。一般而言，低於10,000/μL時才會出現嚴重自發性出血。","we":["100,000/μL時通常不發生自發性出血，僅在手術時出血風險增加。","50,000/μL時出血風
