②④","D. ①②⑤"],"ans":1,"exp":"直接調控血鈣的因素：①副甲狀腺素（PTH）升高血鈣；③calcitriol（1,25-dihydroxyvitamin D，活性型維生素D）促進腸道鈣吸收；④抑鈣素（calcitonin）降低血鈣（抑制骨吸收）。Vitamin D2（②）為前驅物，需經肝腎活化為calcitriol才有直接作用；攝入之鈣量（⑤）是間接影響因素，非直接調控荷爾蒙。","we":["A. ②④⑤：Vitamin D2需活化為calcitriol才有調控作用，非直接調控；攝入鈣量是外源性因素，非直接荷爾蒙調控機制。","（正確）B. ①PTH、③calcitriol、④calcitonin是直接參與血鈣調控的三個荷爾蒙/活性物質。","C. ①②④：Vitamin D2（②）為非活性前驅物，需轉換後才能發揮作用，不算直接調控。","D. ①②⑤：同樣含有非活性的Vitamin D2和外源性攝入鈣量，非直接調控機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_023","year":2017,"roc_year":106,"session":"1","examNo":23,"q":"低甲狀腺功能症之患犬可用何種試驗來幫助確診？","opts":["A. 增壓素注射試驗","B. ACTH刺激試驗","C. TSH刺激試驗","D. 血中鈣磷比"],"ans":2,"exp":"低甲狀腺功能症（hypothyroidism）的確診試驗為TSH刺激試驗：注射外源性TSH後，若甲狀腺無法正常釋放T4，則確認甲狀腺功能低下。增壓素試驗用於診斷尿崩症；ACTH刺激試驗用於診斷腎上腺疾病；血中鈣磷比無診斷特異性。","we":["A. 增壓素（vasopressin/ADH）注射試驗用於鑑別中樞性與腎源性尿崩症，非甲狀腺疾病診斷。","B. ACTH刺激試驗用於評估腎上腺皮質功能（Cushing's或Addison's病），非甲狀腺功能。","（正確）C. TSH刺激試驗可確認甲狀腺是否能對TSH刺激作出反應，若注射TSH後T4未上升，可確診原發性低甲狀腺功能症。","D. 血中鈣磷比主要用於副甲狀腺疾病評估，與甲狀腺功能無直接相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_024","year":2017,"roc_year":106,"session":"1","examNo":24,"q":"ACTH刺激試驗時，ACTH注射後之cortisol值為注射前之幾倍時，可判定為腎上腺皮質萎縮？","opts":["A. 2倍以下","B. 2.5～3倍","C. 3.5～4倍","D. 4倍以上"],"ans":0,"exp":"ACTH刺激試驗中，注射ACTH後cortisol值若為注射前的2倍以下（即腎上腺反應不足），可判定為腎上腺皮質萎縮或功能低下（Addison's病）。正常犬應升高3～4倍以上。","we":["（正確）A. 注射ACTH後cortisol值為注射前的2倍以下，代表腎上腺皮質儲備功能不足，可判定為腎上腺皮質萎縮（Addison's病）。","B. 2.5～3倍屬臨界偏低，尚需結合臨床症狀判斷，非標準萎縮判定值。","C. 3.5～4倍為正常反應範圍，不支持腎上腺皮質萎縮診斷。","D. 4倍以上為正常至亢進反應（可疑Cushing's），不符合萎縮判斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_025","year":2017,"roc_year":106,"session":"1","examNo":25,"q":"動物罹患混合型代謝性酸中毒及鹼中毒時，其陰離子差將呈下列何種變化？","opts":["A. 增加","B. 正常無變化","C. 降低","D. 不一定"],"ans":0,"exp":"陰離子差（anion gap, AG）= Na⁺－（Cl⁻＋HCO₃⁻）。混合性代謝性酸中毒（有機酸增加，AG升高）合併代謝性鹼中毒（HCO₃⁻上升，AG降低）時，淨結果是AG增加，因為代謝性酸中毒的組分（未測量陰離子如乳酸、酮酸）仍存在，AG整體仍高於正常。","we":["（正確）A. 混合性代謝性酸中毒（AG型酸中毒）合併代謝性鹼中毒時，未測量陰離子（如乳酸）仍增加，AG整體呈增加。","B. 若AG正常無變化，代表無有機酸堆積，與代謝性酸中毒的典型表現不符。","C. AG降低見於低白蛋白血症或某些鹼中毒，非此混合情形的預期結果。","D. 純粹AG酸中毒時AG必然增加，混合情形下AG的方向由酸中毒組分主導。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_026","year":2017,"roc_year":106,"session":"1","examNo":26,"q":"當有體腔滲液需採樣時，若細胞數極少，可將檢體移入含何種抗凝劑之無菌試管中，再將此檢體進行遠心分離來濃縮？","opts":["A. 肝素（heparin）","B. EDTA","C. 草酸鈉（sodium oxalate）","D. 氟化鈉（NaF）"],"ans":1,"exp":"體腔滲液細胞數極少時，為了保存細胞形態並減少細胞凝集，建議使用EDTA抗凝管（EDTA對細胞形態保存最佳）收集後離心濃縮，再製作細胞學抹片。肝素可能產生背景顆粒；草酸鹽和NaF則影響細胞形態或代謝。","we":["A. 肝素（heparin）雖可抗凝，但在染色抹片上會產生藍紫色顆粒背景，影響細胞學判讀。","（正確）B. EDTA是體腔液細胞學樣本的首選抗凝劑，能最佳保存細胞形態，適合離心濃縮後製片。","C. 草酸鈉（sodium oxalate）可影響細胞結構並干擾多種生化檢驗，不是細胞學的首選。","D. 氟化鈉（NaF）主要作為血糖保存劑，可能導致細胞溶解，不適合細胞學保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_027","year":2017,"roc_year":106,"session":"1","examNo":27,"q":"正常淋巴結之抽取物的細胞相，其主要之類型及比例為何？","opts":["A. 50～60％為小型淋巴球","B. 15～30％為漿細胞","C. 80～90％為大型淋巴球","D. 80～90％為小型淋巴球"],"ans":3,"exp":"正常淋巴結細針抽吸物以小型成熟淋巴球為主，佔80～90%；大型淋巴球、漿細胞、巨噬細胞等佔少數（各不超過10～15%）。若漿細胞或大型淋巴球比例升高，才提示反應性或腫瘤性變化。","we":["A. 50～60%為小型淋巴球的比例偏低，正常應達80～90%。","B. 15～30%為漿細胞過高，正常漿細胞佔比應低於5%。","C. 80～90%為大型淋巴球則提示大細胞性淋巴瘤，非正常表現。","（正確）D. 正常淋巴結抽取物以80～90%小型成熟淋巴球為主，代表正常的細胞學表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_028","year":2017,"roc_year":106,"session":"1","examNo":28,"q":"細菌性腦膜炎時，腦脊髓液中葡萄糖濃度與血中葡萄糖濃度之比率會呈現下列何種變化？","opts":["A. 變低","B. 變高","C. 不一定","D. 不變"],"ans":0,"exp":"細菌性腦膜炎時，細菌消耗腦脊髓液（CSF）中的葡萄糖，使CSF/血液葡萄糖比率「變低」（正常CSF葡萄糖約為血糖的60～70%，細菌性腦膜炎時可降至40%以下）。","we":["（正確）A. 細菌及發炎細胞大量消耗CSF葡萄糖，使CSF葡萄糖濃度相對血糖「變低」，是細菌性腦膜炎的典型表現。","B. 變高不符合，細菌性腦膜炎消耗葡萄糖，CSF葡萄糖只會降低。","C. 不一定不正確，細菌性腦膜炎的葡萄糖降低是相對一致的表現。","D. 不變不符合，有細菌存在時葡萄糖必然被消耗而下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_029","year":2017,"roc_year":106,"session":"1","examNo":29,"q":"退行性關節病的關節囊液以何種細胞為主？","opts":["A. 巨噬細胞","B. 關節囊上皮細胞","C. 嗜中性球","D. 單核細胞"],"ans":1,"exp":"退行性關節病（degenerative joint disease, DJD/OA）的關節囊液以滑液膜上皮細胞（關節囊上皮細胞/滑液細胞）為主，細胞數量偏低至中等，無核左轉或大量嗜中性球（後者見於化膿性關節炎）。","we":["A. 巨噬細胞為主見於慢性炎性關節病，非退行性關節病的典型細胞。","（正確）B. 退行性關節病的關節囊液以關節囊上皮細胞（滑液細胞）為主，細胞總數低至中等，為非炎性表現。","C. 嗜中性球為主見於感染性（化膿性）或免疫媒介性關節炎，非退行性關節病。","D. 單核細胞為主見於免疫媒介性關節炎，非退行性關節病的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_030","year":2017,"roc_year":106,"session":"1","examNo":30,"q":"若28隻有傳染性腹膜炎（FIP）的貓中，有23隻血液淋巴球數絕對值呈現過低值，則以淋巴球減少症來診斷貓傳染性腹膜炎的\r 敏感度和特異性，下列何者正確？","opts":["A. 敏感度約為82%","B. 特異性約為82%","C. 敏感度約為18%","D. 特異性約為22%"],"ans":0,"exp":"敏感度（sensitivity）= 真陽性 ÷（真陽性＋偽陰性）= 23/28 ≈ 82%。此值表示以淋巴球減少症診斷FIP的敏感度（偵測率）約82%；特異性需知道非FIP貓中淋巴球減少症的情況，題目未提供，無法從28/23計算特異性。","we":["（正確）A. 敏感度 = 23/28 ≈ 82%，表示有FIP的貓中，82%可被此檢測正確識別為陽性。","B. 特異性約82%不能從此數據得出，特異性需要對照組（非FIP貓的淋巴球正常率）才能計算。","C. 敏感度約18%錯誤，18% = 5/28是偽陰性率（漏診率），非敏感度。","D. 特異性約22%無法從題目數據推算。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_031","year":2017,"roc_year":106,"session":"1","examNo":31,"q":"下列何種動物之heterophils或neutrophils有較少的分葉，因此最難分辨核左轉？","opts":["A. 牛","B. 豬","C. 鳥","D. 貓"],"ans":2,"exp":"鳥類的異嗜球（heterophils，相當於哺乳動物的嗜中性球）細胞核分葉較少（常為桿狀或S形），且顆粒為嗜伊紅色棒狀，不像哺乳動物嗜中性球那樣明顯多分葉，因此最難判斷核左轉。","we":["A. 牛的嗜中性球雖分葉較少，但仍可觀察核形變化。","B. 豬的嗜中性球分葉較明顯，不是最難分辨核左轉的物種。","（正確）C. 鳥類的heterophils核分葉極少（桿狀核），與幼稚型難以區分，因此核左轉最難判斷。","D. 貓的嗜中性球分葉明顯，核左轉的判斷相對容易。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_032","year":2017,"roc_year":106,"session":"1","examNo":32,"q":"當犬貓有輕度毒血症時，嗜中性球細胞質內最易出現大小不一藍色角狀的包涵體為何者？","opts":["A. Golgi bodies","B. Pelger-Huet anomaly","C. Döhle bodies","D. Russell bodies"],"ans":2,"exp":"Döhle bodies是嗜中性球細胞質內藍灰色角狀包涵體，由粗糙內質網聚集形成，是輕度毒血症時最早出現的毒性變化指標。Golgi bodies是正常胞器；Pelger-Huet anomaly是核分葉不足的遺傳異常；Russell bodies見於漿細胞。","we":["A. Golgi bodies是正常細胞的高基氏體，非毒性包涵體。","B. Pelger-Huet anomaly（偽Pelger-Huet）是嗜中性球核分葉不足，非細胞質包涵體，且通常為遺傳性或藥物引起。","（正確）C. Döhle bodies是嗜中性球細胞質內藍灰色角狀包涵體，由殘留內質網形成，是毒血症時最常見的早期毒性變化。","D. Russell bodies是漿細胞內免疫球蛋白聚集形成的圓形包涵體，不出現在嗜中性球。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_033","year":2017,"roc_year":106,"session":"1","examNo":33,"q":"下列何者不是末梢血中嗜中性球數增多的原因？","opts":["A. 生理性之腎上腺素分泌","B. 緊迫性之腎上腺皮質酮分泌","C. 炎症反應時","D. 循環嗜中性球池轉移至邊緣嗜中性球池"],"ans":3,"exp":"循環嗜中性球池（circulating pool）轉移至邊緣嗜中性球池（marginal pool）時，嗜中性球從循環中消失，WBC計數中的嗜中性球數反而「減少」（假性中性球減少症），非增多。其他三者均會使循環嗜中性球增多。","we":["A. 生理性腎上腺素分泌使邊緣嗜中性球回到循環，嗜中性球數增多（生理性白血球增多症）。","B. 緊迫性腎上腺皮質酮（糖皮質素）分泌促進骨髓釋放與減少邊緣化，嗜中性球數增多。","C. 炎症反應需要大量嗜中性球，骨髓加速生成釋放，末梢嗜中性球數增多。","（正確）D. 循環池嗜中性球轉移至邊緣池，意即嗜中性球從可計數的循環中消失，計數值下降，是嗜中性球「減少」的原因，非增多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_034","year":2017,"roc_year":106,"session":"1","examNo":34,"q":"嗜中性球之中毒性顆粒最常出現於下列何種動物？","opts":["A. 馬","B. 犬","C. 豬","D. 牛"],"ans":0,"exp":"中毒性顆粒（toxic granulation）是嗜中性球細胞質內持續存在的初級顆粒（azurophilic granules），在馬的嗜中性球中最容易觀察到，因為馬的中毒性顆粒染色後較其他動物明顯。","we":["（正確）A. 馬的嗜中性球最易出現中毒性顆粒，且染色後顆粒清晰可辨，是獸醫臨床病理的重要特徵。","B. 犬嗜中性球可見中毒性顆粒，但不如馬常見且明顯。","C. 豬嗜中性球中毒性顆粒不是特別常見。","D. 牛嗜中性球有時可見中毒性變化，但中毒性顆粒最常見且最具代表性的是馬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_035","year":2017,"roc_year":106,"session":"1","examNo":35,"q":"下列有關one-stage prothrombin time（OSPT）的敘述何者錯誤？","opts":["A. 需使用EDTA抗凝之全血","B. 纖維素原必須於50 mg/dL以下才可延長OSPT","C. 用生理鹽水稀釋抗凝之血漿可提高此試驗之敏感性","D. 肝功能衰竭可能使OSPT延長"],"ans":0,"exp":"OSPT（one-stage prothrombin time）需使用含枸椽酸鹽（citrate）抗凝的血漿，而非EDTA抗凝血。EDTA會螯合鈣離子，且不適合OSPT操作（需重新加入鈣離子）；枸椽酸鹽試管才是標準用管。","we":["（正確）A. OSPT應使用枸椽酸鹽（sodium citrate）抗凝管，而非EDTA。使用EDTA抗凝血進行OSPT是錯誤的做法。","B. 纖維素原需低至50 mg/dL以下才能延長OSPT，這是事實，非錯誤敘述。","C. 以生理鹽水稀釋抗凝血漿可提高試驗敏感性，確實為正確操作，非錯誤敘述。","D. 肝功能衰竭使維生素K依賴凝血因子合成減少，可使OSPT延長，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_036","year":2017,"roc_year":106,"session":"1","examNo":36,"q":"下列何者不是血小板的membrane-bound質內顆粒？","opts":["A. α-granules","B. β-granules","C. dense granules","D. lysosomal granules"],"ans":1,"exp":"血小板的膜結合性胞內顆粒包括：α-granules（含纖維素原、vWF等）、dense granules（δ granules，含ADP、血清素等）、lysosomal granules。β-granules並不是血小板公認存在的顆粒類型，此為虛構選項。","we":["A. α-granules是血小板最多的顆粒類型，含有纖維素原、vWF、fibronectin等，確實存在。","（正確）B. β-granules並非血小板公認的membrane-bound胞內顆粒，此選項為不存在的顆粒類型。","C. Dense granules（δ granules）含ADP、血清素、鈣，確實存在於血小板中。","D. Lysosomal granules含有水解酶，確實存在於血小板中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_037","year":2017,"roc_year":106,"session":"1","examNo":37,"q":"紅血球生成素於犬慢性缺氧時主要由何處生成？","opts":["A. 腎臟","B. 肝臟","C. 脾臟","D. 骨髓"],"ans":0,"exp":"紅血球生成素（erythropoietin, EPO）在犬及大多數哺乳動物中主要由腎臟（腎皮質間質細胞）在低氧環境下生成，佔約90%；肝臟可生成約10%，但腎臟是慢性缺氧時的主要來源。","we":["（正確）A. 腎臟（腎皮質間質細胞）是犬慢性缺氧時紅血球生成素的主要產生部位，佔總量約90%。","B. 肝臟可產生少量EPO（約10%），但非主要來源；胎兒期肝臟是主要來源，成體後轉移至腎臟。","C. 脾臟不產生EPO。","D. 骨髓是EPO的作用靶器官（促進紅血球成熟），不產生EPO。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_038","year":2017,"roc_year":106,"session":"1","examNo":38,"q":"下列有關紅血球的代謝，何者正確？","opts":["A. 大部分glucose進行嗜氧醣解作用","B. 嗜氧醣解作用產生之ATP為維持紅血球型態完整之主要能源","C. 嗜氧和厭氧醣解作用均可還原變性血紅素","D. 厭氧醣解作用產生之NADPH是紅血球內主要還原物質"],"ans":1,"exp":"成熟紅血球無粒線體，只能進行厭氧糖解（Embden-Meyerhof pathway），無嗜氧代謝。厭氧糖解產生ATP為主要能源，維持細胞形態與離子泵；磷酸戊糖途徑（HMP shunt）產生NADPH，用於還原glutathione，防止氧化損傷。NADPH是磷酸戊糖途徑的產物，並非厭氧糖解的產物。","we":["A. 紅血球無粒線體，不能進行嗜氧糖解（氧化磷酸化），glucose全部進行厭氧糖解，此敘述錯誤。","（正確）B. 厭氧糖解（Embden-Meyerhof pathway）產生ATP，是維持紅血球細胞膜完整性和離子泵運作的主要能量來源。","C. 嗜氧糖解在紅血球中不存在；還原變性血紅素（methemoglobin）依賴NADH（厭氧途徑）或NADPH（磷酸戊糖途徑），不是兩者均可。","D. NADPH是磷酸戊糖途徑（HMP shunt）的產物，非厭氧糖解產物；且NADPH主要用於保護細胞免受氧化，非紅血球內「主要還原物質」的一般敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_039","year":2017,"roc_year":106,"session":"1","examNo":39,"q":"下列有關骨髓細胞的敘述，何者正確？","opts":["A. 正染色性紅血細胞已無細胞核，且細胞質中血紅素含量已近似成熟紅血球","B. 前骨髓球細胞核成腎形且細胞核已不再進行分裂","C. 巨核球的細胞形態變大是因細胞核進行分裂，但細胞本身不分裂","D. 巨核胚細胞比骨髓中其他細胞之胚細胞都要小"],"ans":2,"exp":"巨核球（megakaryocyte）的特殊之處在於細胞核進行多次分裂（核內有絲分裂/endomitosis），但細胞本身不分裂，導致巨核球成為體內最大的細胞（多倍體，含多個核葉）。正染色性紅血細胞（orthochromatic erythroblast）仍有細胞核，進入網狀球期才排核；前骨髓球為圓形核且仍可分裂；巨核胚細胞是骨髓中最大的胚細胞之一。","we":["A. 正染色性紅血細胞（orthochromatic erythroblast）仍有細胞核，需排核後成為網狀球（reticulocyte），而非已無細胞核的階段，此敘述錯誤。","B. 前骨髓球（promyelocyte）核呈圓形或卵圓形，且仍可進行分裂，腎形核是屬於骨髓球（myelocyte）之後的階段，此敘述錯誤。","（正確）C. 巨核球的細胞核反覆進行核內有絲分裂（endomitosis）而細胞本身不分裂，造成多倍體，使細胞體積極大。","D. 巨核胚細胞（megakaryoblast）反而是骨髓中最大的胚細胞，非最小，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_040","year":2017,"roc_year":106,"session":"1","examNo":40,"q":"下列有關犬漿細胞性骨髓瘤的敘述，何者錯誤？","opts":["A. 常可見高球蛋白血症","B. 骨髓中有大於15～20％的漿細胞","C. 血小板的製造受到抑制，數目大量減少，影響止血作用","D. 有一半以上可能有輕鏈蛋白尿"],"ans":3,"exp":"犬漿細胞性骨髓瘤的典型特徵：高球蛋白血症（常見單株性，M-spike）、骨髓中漿細胞>15～20%、血小板減少影響止血、Bence Jones蛋白尿（輕鏈蛋白尿）。輕鏈蛋白尿（Bence Jones proteinuria）的發生率在犬骨髓瘤中約為40%左右，並非「一半以上」，故D敘述為錯誤。","we":["A. 高球蛋白血症（通常為M-spike）是漿細胞性骨髓瘤的典型且常見表現，非錯誤。","B. 骨髓中漿細胞>15～20%是診斷骨髓瘤的標準之一，非錯誤。","C. 骨髓浸潤抑制正常血小板生成，血小板明顯減少並影響止血，非錯誤。","（正確）D. 犬漿細胞性骨髓瘤中輕鏈蛋白尿（Bence Jones protein）的發生率約40%，未達「一半以上」，此敘述為錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_041","year":2017,"roc_year":106,"session":"1","examNo":41,"q":"下列有關骨髓增生性腫瘤的敘述，何者正確？","opts":["A. 淋巴球性骨髓細胞株毫無目的的增生","B. 不會出現白血病輪廓","C. 白血病細胞通常會形成分離的團塊","D. 此病最常見於貓"],"ans":3,"exp":"骨髓增生性腫瘤（myeloproliferative neoplasia）是骨髓源性（非淋巴球性）細胞株毫無目的地增生；通常會出現白血病輪廓；白血病細胞呈瀰漫性浸潤，不形成分離的腫瘤塊；此病在貓最常見（尤其與FeLV感染相關）。","we":["A. 骨髓增生性腫瘤增生的是骨髓源性細胞株（如紅血球、顆粒球、巨核球等），非淋巴球性細胞株，此敘述錯誤。","B. 骨髓增生性腫瘤會出現白血病輪廓（leukemia profile），此敘述「不會出現」為錯誤。","C. 白血病細胞通常瀰漫性浸潤，不形成分離的腫瘤塊（固體腫瘤），此敘述錯誤。","（正確）D. 骨髓增生性腫瘤在動物中最常見於貓，與FeLV感染密切相關，此為正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_042","year":2017,"roc_year":106,"session":"1","examNo":42,"q":"下列那些情形會導致相對性多血症？①劇烈嘔吐 ②高山上的犬 ③高腎上腺皮質功能症 ④強力掙扎的貓","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":3,"exp":"相對性多血症（relative polycythemia）是因血漿量減少造成紅血球濃度增加，而非真正紅血球增多。①劇烈嘔吐→脫水→血漿量減少→相對多血；④強力掙扎的貓→興奮釋放腎上腺素→脾臟收縮→紅血球釋放→相對多血。②高山上的犬→缺氧→紅血球生成素↑→絕對性多血症（真性）；③高腎上腺皮質功能症→可能輕度使PCV升高，但主要為其他表現，非典型相對性多血症。","we":["A. ①②：高山缺氧引起的是絕對性多血症（EPO增加），非相對性。","B. ②③：高山為絕對性；高腎上腺皮質功能症主要表現為其他代謝異常。","C. ③④：高腎上腺皮質功能症非典型相對性多血症原因。","（正確）D. ①劇烈嘔吐造成脫水（相對性）；④強力掙扎的貓腎上腺素釋放使脾臟收縮釋出紅血球（相對性），兩者均為相對性多血症原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_043","year":2017,"roc_year":106,"session":"1","examNo":43,"q":"下列有關犬慢性淋巴球性白血病的敘述，何者錯誤？","opts":["A. 由骨髓中未分化的淋巴球產生","B. 病灶可發展至次級淋巴器官，如脾臟","C. 通常發生在高齡犬","D. 病程通常可持續幾個月到幾年"],"ans":0,"exp":"犬慢性淋巴球性白血病（CLL）起源於已分化、成熟的小型淋巴球（B細胞為主），非由骨髓中「未分化」的淋巴球產生；CLL的細胞形態成熟，這點與急性白血病不同。其他敘述均正確：可擴散至脾臟等次級淋巴器官、多見高齡犬、病程可達數月至數年。","we":["（正確）A. CLL來源於已分化的成熟小型淋巴球，而非未分化淋巴球，「未分化」為錯誤敘述。","B. CLL病灶可轉移至脾臟、淋巴結等次級淋巴器官，此敘述正確。","C. CLL通常見於老年犬（>9歲），此敘述正確。","D. CLL病程緩慢，可持續數月至數年，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_044","year":2017,"roc_year":106,"session":"1","examNo":44,"q":"第VII凝血因子缺乏者，其prothrombin time（PT）、activated partial thromboplastin time（APTT）、thrombin time（TT），\r 最可能出現下列何種檢查結果？","opts":["A. PT正常、APTT延長、TT延長","B. PT正常、APTT正常、TT延長","C. PT延長、APTT正常、TT正常","D. PT延長、APTT延長、TT正常"],"ans":2,"exp":"PT（外源性路徑，因子VII→X→V→II→I）；APTT（內源性路徑，因子XII→XI→IX→VIII→X→V→II→I）；TT（thrombin time，評估纖維素原轉變為纖維素）。第VII因子僅參與外源性路徑，缺乏時PT延長，而APTT（內源性路徑完整）及TT（纖維素原正常）均正常。","we":["A. PT正常/APTT延長/TT延長：不符合，第VII缺乏應使PT延長，非APTT延長。","B. PT正常/APTT正常/TT延長：不符合，第VII缺乏應使PT延長，且TT反映纖維素原，不受第VII因子影響。","（正確）C. PT延長/APTT正常/TT正常：第VII因子僅參與外源性路徑，缺乏只使PT延長，APTT與TT不受影響。","D. PT延長/APTT延長/TT正常：不符合，APTT不涉及第VII因子，不應延長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_045","year":2017,"roc_year":106,"session":"1","examNo":45,"q":"下圖為貓劉氏染色血液抹片，中央之有核細胞最可能是下列何者？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 單核球"],"ans":2,"exp":"此題需看圖判斷。貓的嗜鹼性球（basophil）顆粒呈淡紫色至深紫色，細胞核常呈分葉或帶狀，顆粒較少且不規則，在劉氏染色（Wright-Giemsa染色）下具有特徵性。若圖示顯示淡色顆粒的白血球，最可能為嗜鹼性球。（本題需圖片才能確認，已標記needs_review）","we":["A. 嗜中性球：細胞質無明顯特殊顆粒（或顆粒呈中性染色），核多葉。","B. 嗜酸性球：顆粒呈橘紅色、大且圓，在貓特別明顯。","（正確）C. 嗜鹼性球：貓的嗜鹼性球具有淡紫色至深紫色不規則顆粒，核常呈帶狀，需圖片確認。","D. 單核球：細胞質較多且呈灰藍色，核呈馬蹄形或腎形，無特殊顆粒。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1061_實診_046","year":2017,"roc_year":106,"session":"1","examNo":46,"q":"下列何者為紅血球產生能量之主要pathway？","opts":["A. hexose-monophosphate pathway","B. Embden-Meyerhof pathway","C. Luebering-Rapoport pathway","D. methemoglobin reductase pathway"],"ans":1,"exp":"紅血球主要能量來源為Embden-Meyerhof pathway（EMP，厭氧糖解），產生95%的ATP，維持細胞膜泵和形態。Hexose-monophosphate pathway（磷酸戊糖途徑）產生NADPH，用於抗氧化；Luebering-Rapoport pathway調節2,3-DPG；methemoglobin reductase pathway還原高鐵血紅素。","we":["A. Hexose-monophosphate pathway（磷酸戊糖途徑）產生NADPH，主要功能是抗氧化保護，非主要能量來源。","（正確）B. Embden-Meyerhof pathway（厭氧糖解）是紅血球產生ATP的主要途徑，提供約95%能量。","C. Luebering-Rapoport pathway是EMP的旁路，產生2,3-DPG調節血紅素氧親和力，非主要能量途徑。","D. Methemoglobin reductase pathway（NADH依賴）主要用於還原methemoglobin，非能量產生的主要途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_047","year":2017,"roc_year":106,"session":"1","examNo":47,"q":"貓送至醫院後立即血檢，出現嗜中性球增加但無核左轉，最有可能為下列何者？","opts":["A. 生理性反應","B. 溶血性疾病","C. 炎症性反應","D. 脫水"],"ans":0,"exp":"貓送至醫院後立即採血，若出現嗜中性球增多但無核左轉，最可能是生理性反應（腎上腺素釋放→邊緣嗜中性球池→循環池），稱為「生理性白血球增多症」，特點是發作快（數分鐘內）、持續時間短、無核左轉、淋巴球也可能同步增多。","we":["（正確）A. 貓就診時緊張/興奮釋放腎上腺素，使邊緣嗜中性球回到循環，造成快速但短暫的嗜中性球增多，無核左轉，此為生理性反應。","B. 溶血性疾病主要表現為貧血、再生性反應，不直接導致嗜中性球增多。","C. 炎症性反應通常伴隨核左轉（帶狀核增多），且變化較慢（數小時至天），與題目不符。","D. 脫水會使PCV升高，但不直接引起嗜中性球顯著增多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_048","year":2017,"roc_year":106,"session":"1","examNo":48,"q":"下列正常家畜之末梢血液抹片中，何者最易出現異型球（poikilocytes）？","opts":["A. 馬","B. 豬","C. 牛","D. 綿羊"],"ans":2,"exp":"牛的正常末梢血液抹片中，正常即可見多種異型球（poikilocytes），如棘球細胞（acanthocytes）、裂形細胞（schistocytes）等，這是牛的正常生理特點。其他動物異型球一般提示病理狀態。","we":["A. 馬的正常血抹片中異型球不明顯，異型球出現多屬病理。","B. 豬的正常血抹片中異型球不特別常見。","（正確）C. 牛正常末梢血中即可見多種異型球（如棘球細胞），是牛的正常生理現象，無病理意義。","D. 綿羊正常血抹片可見少量異型球，但不如牛顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_049","year":2017,"roc_year":106,"session":"1","examNo":49,"q":"下列何者是組織胺、過敏時之嗜酸性球引誘因子及血小板致活因子等炎症媒介物的來源？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 淋巴球"],"ans":2,"exp":"嗜鹼性球（basophil）是組織胺（histamine）、過敏時嗜酸性球引誘因子（ECF-A）及血小板致活因子（PAF）等炎症媒介物的主要來源，在Ⅰ型過敏反應（IgE媒介）中起重要作用；組織中的肥大細胞（mast cells）功能相似。","we":["A. 嗜中性球主要釋放溶菌酶、MPO、中性蛋白酶等，非組織胺或ECF-A的主要來源。","B. 嗜酸性球是ECF-A的「目標細胞」（被吸引到過敏部位），而非主要「來源」。","（正確）C. 嗜鹼性球含有組織胺、ECF-A、PAF等多種炎症媒介物，是Ⅰ型過敏反應的關鍵效應細胞。","D. 淋巴球主要產生細胞激素（如IL-2、IFN-γ），非組織胺或血小板致活因子的主要來源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_050","year":2017,"roc_year":106,"session":"1","examNo":50,"q":"關於犬慢性腎衰竭所引發之貧血，下列敘述何者錯誤？","opts":["A. 主要是因紅血球生成素減少造成","B. 尿毒性毒素也會使紅血球之壽命減短","C. 通常會表現出正球性低色性貧血","D. 貧血之程度通常為輕微至中等程度（PCV 20-30%）"],"ans":2,"exp":"慢性腎衰竭引發的貧血通常為「正球性正色性」貧血（normocytic normochromic），而非低色性貧血，這是因為EPO缺乏導致紅血球生成不足，而非鐵缺乏。其他敘述均正確：EPO減少為主因；尿毒毒素縮短RBC壽命；貧血程度通常輕至中等（PCV 20～30%）。","we":["A. EPO減少是慢性腎衰竭貧血的主要原因，此敘述正確。","B. 尿毒性毒素可縮短紅血球壽命，此敘述正確。","（正確）C. 慢性腎衰竭的貧血通常是正球性正色性貧血（非低色性），因為是EPO缺乏導致，不是鐵缺乏，「低色性」的描述為錯誤。","D. PCV 20～30%屬輕至中等貧血，符合慢性腎衰竭的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_051","year":2017,"roc_year":106,"session":"1","examNo":51,"q":"下列何者可能造成低血糖？①乳牛之乳熱 ②牛隻酮病 ③馬黃麴毒素中毒 ④高腎上腺皮質功能症","opts":["A. ①②","B. ②③","C. ①③","D. ①④"],"ans":1,"exp":"②牛隻酮病（ketosis）：酮體堆積，葡萄糖缺乏，血糖偏低。③馬黃麴毒素中毒：黃麴毒素（aflatoxin）造成肝臟損傷，影響糖質新生，可引起低血糖。乳熱（①）是低鈣血症，非低血糖；高腎上腺皮質功能症（④）升高皮質醇，導致高血糖，非低血糖。","we":["A. ①②：乳牛乳熱是低鈣血症（hypocalcemia），並非低血糖；②酮病確實會低血糖，但①錯誤。","（正確）B. ②牛隻酮病（血糖低，酮體積累）及③馬黃麴毒素中毒（肝損傷致糖質新生障礙）均可造成低血糖。","C. ①③：乳熱為低血鈣，非低血糖，組合不正確。","D. ①④：乳熱為低血鈣；高腎上腺皮質功能症反而引起高血糖，兩者均非低血糖原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_052","year":2017,"roc_year":106,"session":"1","examNo":52,"q":"下列關於犬貓脂蛋白之敘述何者錯誤？","opts":["A. HDL約占全部脂蛋白的50～75％","B. HDL是最大且密度最小的脂蛋白","C. 約有50％健康犬隻在電泳圖α2 區上有一個HDL條帶","D. 貓隻具有3個HDL條帶"],"ans":1,"exp":"在犬貓脂蛋白中，HDL是最小且密度最高的脂蛋白（高密度），VLDL才是最大且密度最小的脂蛋白。HDL約佔全部脂蛋白50～75%；犬約有50%個體在α2區有HDL條帶；貓具有3個HDL條帶——這些均正確。","we":["A. HDL約佔全部脂蛋白50～75%，此敘述正確。","（正確）B. HDL是最小且密度最高的脂蛋白，並非「最大且密度最小」；VLDL才是最大且密度最小的脂蛋白，此敘述錯誤。","C. 約50%健康犬隻在電泳α2區有HDL條帶，此敘述正確。","D. 貓具有3個HDL條帶（HDL1、HDL2、HDL3），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_053","year":2017,"roc_year":106,"session":"1","examNo":53,"q":"血漿中下列何者所含之三酸甘油脂（triglyceride）比率最高？","opts":["A. 極低密度脂蛋白（VLDL）","B. 低密度脂蛋白（LDL）","C. 高密度脂蛋白（HDL）","D. 極高密度脂蛋白（VHDL）"],"ans":0,"exp":"各脂蛋白的三酸甘油脂含量：乳糜微粒（chylomicron）最高（約85～90%）；VLDL次之（約50～65%）；IDL約30%；LDL約10%；HDL最低（約5%）。在選項中VLDL三酸甘油脂比率最高。","we":["（正確）A. VLDL（極低密度脂蛋白）含三酸甘油脂約50～65%，在所列選項中三酸甘油脂比率最高（乳糜微粒未列入選項）。","B. LDL主要含膽固醇酯（約50%），三酸甘油脂含量低（約10%）。","C. HDL三酸甘油脂含量最低（約5%），主要含磷脂和蛋白質。","D. VHDL（極高密度脂蛋白）不是常規使用的脂蛋白分類術語，臨床上不常用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_054","year":2017,"roc_year":106,"session":"1","examNo":54,"q":"以屈折計法測定血清蛋白質濃度時，下列敘述何者正確？","opts":["A. 含高濃度葡萄糖之樣本可能示假低值","B. 含高濃度尿素之樣本可能示假低值","C. 嚴重溶血之樣本可能示假低值","D. 血清混濁者不適用此法"],"ans":3,"exp":"屈折計法（refractometry）測定血清總蛋白質時，高濃度葡萄糖和高尿素均可造成假高值（非假低值），溶血也可造成假高值；但血清混濁（脂血/乳糜血）時，光線散射影響折射率讀數，使結果不可靠，故混濁樣本不適用此法。","we":["A. 高濃度葡萄糖會增加折射率，造成假高值而非假低值，此敘述錯誤。","B. 高濃度尿素也會增加折射率，造成假高值而非假低值，此敘述錯誤。","C. 嚴重溶血釋放血紅素，增加折射率，造成假高值而非假低值，此敘述錯誤。","（正確）D. 血清混濁（如脂血/乳糜血）會散射光線，干擾折射率讀數，確實不適用屈折計法，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_055","year":2017,"roc_year":106,"session":"1","examNo":55,"q":"選出關於血清中酵素判讀要點之正確組合？①酵素來源多為逸脫酵素 ②必須在24小時內，完成活性值之測定 ③同一樣本，\r 清晨與傍晚的測定值通常會相近 ④血清分離，應於採血後30分鐘內完成，並於5小時內完成活性值之測定 ⑤溶血僅對少數\r 酵素發生影響 ⑥最好使用EDTA作為抗凝劑","opts":["A. ①②","B. ①④","C. ②③","D. ④⑥"],"ans":1,"exp":"血清酵素判讀要點：①酵素來源多為逸脫酵素（正確，細胞受損後逸出）；④血清分離應於採血後30分鐘內完成，並於5小時內完成測定（正確）。②24小時內完成測定太寬鬆（應更快）；③清晨與傍晚值可能不同（存在日變化）；⑤溶血對多數酵素有影響；⑥EDTA會抑制許多酵素（如鹼性磷酸酶），不宜作為酵素測定的抗凝劑。","we":["A. ①②：①正確；②說24小時內完成過於寬鬆，且許多酵素在室溫不穩定，此組合不完全正確。","（正確）B. ①酵素來源多為逸脫酵素（正確）；④血清分離30分鐘內、5小時內完成測定（正確）。兩者均為正確判讀要點。","C. ②③：③說清晨與傍晚值相近不正確（存在日變化）；②亦有疑義，此組合不正確。","D. ④⑥：⑥EDTA抑制多種酵素活性（如ALP需Mg²⁺），不應作為酵素測定的抗凝劑，此組合有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_056","year":2017,"roc_year":106,"session":"1","examNo":56,"q":"犬約有多少％的結合型膽紅素經由膽汁排出體外？","opts":["A. 10","B. 40","C. 75","D. 90"],"ans":3,"exp":"犬的結合型膽紅素（direct bilirubin）約有90%經由膽汁排出至腸道，再由腸道菌轉化為尿膽素原等，由糞便排出；只有少部分經腎臟排出。","we":["A. 10%過低，犬的結合型膽紅素主要經膽汁排出，僅少部分由腎臟排出。","B. 40%仍偏低，不符合實際比例。","C. 75%接近但仍偏低於正確值。","（正確）D. 犬約90%的結合型膽紅素經由膽汁排出，是主要排泄途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_057","year":2017,"roc_year":106,"session":"1","examNo":57,"q":"肝臟功能區損壞至少達多少％以上時，BSP或ICG試驗才會顯現異常結果？","opts":["A. 35","B. 55","C. 75","D. 95"],"ans":1,"exp":"BSP（溴磺酞）或ICG（吲哚青綠）肝功能試驗需要肝臟有足夠的摄取、結合與排泄能力，只有當肝臟功能損壞達55%以上時，此類試驗才會顯現明顯異常。這反映肝臟巨大的代償儲備能力。","we":["A. 35%損壞時，肝臟尚有足夠代償能力，BSP/ICG試驗可能仍正常。","（正確）B. 肝臟功能區損壞達55%以上時，BSP或ICG試驗才會出現異常，體現肝臟強大的儲備功能。","C. 75%雖更嚴重時也會異常，但題目問「至少達多少%才會顯現」，55%是閾值，不是75%。","D. 95%幾乎是全部損壞，遠超出最低閾值，非正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_058","year":2017,"roc_year":106,"session":"1","examNo":58,"q":"15歲母馬，有厭食、繞圈漫步、共濟失調、肌肉顫抖及黃疸現象，血檢發現bilirubin上升，則同時見到下列那些參數之上升更\r 能確診為肝源性疾病？①SDH ②ALT ③ALP ④AST ⑤bile acids","opts":["A. ①②③","B. ①③④","C. ②③⑤","D. ②④⑤"],"ans":1,"exp":"馬的肝臟特異性酵素為SDH（山梨醇脫氫酶，sorbital dehydrogenase）；馬無肝臟特異性ALT（ALT在馬中非肝特異性）；ALP在馬年齡因素影響大；AST見於肌肉與肝臟，非肝特異性。確診馬肝臟疾病最佳組合：①SDH（肝特異性）+ ③ALP（膽汁鬱滯標誌）+ ④AST（但需結合SDH鑑別來源）+ ⑤膽汁酸。考選部答案為B（①③④）即SDH+ALP+AST的組合。","we":["A. ①②③：ALT（②）在馬不具肝臟特異性，不是確診馬肝臟疾病的首選酵素。","（正確）B. ①SDH（馬肝特異性酵素）、③ALP（膽汁鬱滯指標）、④AST（需結合SDH才能確認肝源性），是確認馬肝臟疾病的最佳組合。","C. ②③⑤：ALT在馬非肝特異性，含ALT的組合不如含SDH的組合更能確診。","D. ②④⑤：ALT在馬非肝特異性，此組合缺乏SDH，確診力不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_059","year":2017,"roc_year":106,"session":"1","examNo":59,"q":"馬匹確診罹有肝臟疾病，則下列敘述何者正確？","opts":["A. 若無溶血性貧血，則其結合型膽紅素應偏高","B. 若血氨上升，則顯示有膽汁鬱滯的可能性","C. 若膽汁酸也上升，則膽汁鬱滯及肝實質功能區減少均有可能","D. 若患畜腎臟灌流正常，則當血氨因肝臟疾病上升時，BUN也會隨之上升"],"ans":2,"exp":"馬肝臟疾病時：膽汁酸上升反映肝細胞攝取/排泄功能減弱，可能源於膽汁鬱滯或肝實質功能區（hepatocyte mass）減少，兩者均可使膽汁酸升高，故C正確。若無溶血，黃疸多為結合型（直接型）膽紅素升高，但也可能因肝臟攝取未結合型膽紅素能力下降而使未結合型升高；血氨升高代表肝臟解毒功能喪失，與膽汁鬱滯無直接關係；BUN在肝衰竭時可能下降（合成尿素所需氨無法轉化），不一定隨血氨升高而升高。","we":["A. 若無溶血性貧血但有肝臟疾病，可能因肝臟不能正常攝取未結合型膽紅素而使其升高，或因膽汁鬱滯使結合型升高；「結合型應偏高」不一定正確，未結合型也可能升高。","B. 血氨升高代表肝臟尿素循環功能喪失（氨解毒障礙），與「膽汁鬱滯」無直接因果關係，此敘述錯誤。","（正確）C. 膽汁酸升高可能源於膽汁鬱滯（排泄受阻）或肝實質功能區減少（攝取/結合能力下降），兩者均可使血中膽汁酸升高，此敘述正確。","D. 肝衰竭時尿素合成減少，BUN可能下降；血氨升高時BUN不一定隨之升高，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_060","year":2017,"roc_year":106,"session":"1","examNo":60,"q":"下列何種檢驗方法無法直接檢測出球蛋白量？","opts":["A. 免疫電泳法","B. 硫酸鋅混濁試驗","C. 血清電泳法配合血清總蛋白質量","D. 雙脲法（biuret method）"],"ans":3,"exp":"雙脲法（biuret method）測定的是總蛋白質（所有含肽鍵蛋白質），無法區分白蛋白與球蛋白；球蛋白量通常以「總蛋白－白蛋白（biuret）」計算，或由電泳法分離後計算。免疫電泳、電泳法結合總蛋白均可直接測量球蛋白量；硫酸鋅混濁試驗是估計球蛋白的半定量法。","we":["A. 免疫電泳法（immunoelectrophoresis）可直接分型並定量各類球蛋白，可直接測球蛋白。","B. 硫酸鋅混濁試驗（zinc sulfate turbidity test）是評估球蛋白（及免疫球蛋白）濃度的半定量法，雖為間接/半定量，但可反映球蛋白量。","C. 血清電泳法分離各蛋白分區後結合血清總蛋白量，可計算球蛋白量，屬直接測量。","（正確）D. 雙脲法（biuret）測定的是總蛋白質，無法直接測量球蛋白量；球蛋白需由「總蛋白－白蛋白」間接計算，無法直接測出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_061","year":2017,"roc_year":106,"session":"1","examNo":61,"q":"懷疑犬小腸內細菌過度增殖時，則下列那種檢測最不可能用來診斷此病？","opts":["A. serum folate","B. serum cobalamin","C. breath hydrogen assay","D. plasma turbidity test"],"ans":3,"exp":"小腸內細菌過度增殖（SIBO）的診斷試驗包括：serum folate（細菌合成葉酸→升高）、serum cobalamin（細菌競爭吸收→降低）、breath hydrogen assay（細菌發酵→氫氣呼出增多）。Plasma turbidity test（血漿混濁試驗）用於評估脂肪消化吸收，非SIBO的常規診斷工具。","we":["A. Serum folate：SIBO時腸道細菌合成葉酸使血清葉酸升高，可用於診斷SIBO。","B. Serum cobalamin：SIBO時細菌競爭消耗cobalamin（維生素B12），使血清B12降低，是SIBO的重要指標。","C. Breath hydrogen assay：細菌發酵碳水化合物產生氫氣，呼氣氫氣增多可診斷SIBO。","（正確）D. Plasma turbidity test（血漿混濁試驗）評估的是小腸脂肪吸收能力（乳糜微粒形成），非SIBO的診斷工具，最不可能用於診斷SIBO。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_062","year":2017,"roc_year":106,"session":"1","examNo":62,"q":"關於肌酸激酶（creatine kinase）的敘述，下列何者錯誤？①具臟器特異性 ②半衰期長 ③不受溶血影響 ④中樞性運動性\r 神經系疾病時，CK活性值會升高","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"CK（creatine kinase）的特性：①不具臟器特異性（錯誤，CK-MM為肌肉、CK-BB為腦、CK-MB為心肌，有一定組織特異性，但一般教科書說CK具肌肉特異性）；②半衰期「短」（約2～12小時），非「長」，故②錯誤；③受溶血影響（紅血球含CK，溶血可干擾，故③「不受溶血影響」為錯誤）；④中樞性神經疾病時CK不升高（外周神經/肌肉損傷才升高），故④正確（CK不升高）。錯誤敘述為①和②。","we":["（正確）A. ①②均為錯誤敘述：①CK具有肌肉（骨骼肌與心肌）特異性，而非「無臟器特異性」；②CK半衰期短（數小時），並非「長」。","B. ②③：②CK半衰期短（錯誤敘述，正確）；③CK確實受溶血輕微影響（紅血球含少量CK），「不受溶血影響」為錯誤敘述，但此組合不完整。","C. ③④：③CK受溶血影響（故「不受溶血影響」為錯誤）；④中樞性運動神經疾病CK不升高為正確知識，故④並非「錯誤敘述」，此組合不正確。","D. ①④：①CK臟器特異性描述錯誤（CK確有肌肉特異性）；④中樞神經疾病CK不升高，④是正確知識，非錯誤敘述，此組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_063","year":2017,"roc_year":106,"session":"1","examNo":63,"q":"下列肌肉酵素，於「非進行性」肌肉受傷之病畜，何者最快恢復至正常範圍？","opts":["A. creatine kinase","B. lactate dehydrogenase","C. aspartate aminotransferase","D. alkaline phosphatase"],"ans":0,"exp":"CK（creatine kinase）的血清半衰期最短（犬約2～4小時，馬約12小時），因此在非進行性肌肉傷害後，CK最快恢復正常；LDH次之（數天）；AST更長（數天至一週）；ALP主要反映膽汁鬱滯或骨病，非肌肉酵素。","we":["（正確）A. CK（creatine kinase）半衰期最短（2～12小時，依動物種別），非進行性損傷後最快恢復正常。","B. LDH半衰期較長（數天），恢復速度慢於CK。","C. AST半衰期更長（犬約12小時，但組織清除較慢），恢復速度慢於CK。","D. ALP主要為膽汁鬱滯/骨代謝指標，非肌肉損傷特異性酵素，不在此比較範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_064","year":2017,"roc_year":106,"session":"1","examNo":64,"q":"何種動物若要進行突然不給飲水試驗時，須停止給水3～4天後再進行？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":2,"exp":"突然不給飲水試驗（water deprivation test）用於診斷尿崩症等多尿多飲疾病。牛因為具有多胃（瘤胃儲水量大），需停水較長時間（3～4天）才能充分評估腎臟濃縮能力；犬貓通常僅需停水數小時至1天。","we":["A. 犬通常停水數小時至24小時即可進行此試驗，不需3～4天。","B. 貓停水時間亦不需3～4天。","（正確）C. 牛有龐大的瘤胃儲水，停水3～4天才能確保充分脫水，適合進行突然不給飲水試驗。","D. 馬停水時間雖比犬貓長，但通常不需長達3～4天。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_065","year":2017,"roc_year":106,"session":"1","examNo":65,"q":"關於血清中肌酸酐（creatinine）的敘述，下列何者正確？①高血脂症時會有假高值 ②嚴重脫水時，血中濃度會上升 ③比\r BUN更易受食物及體內分解代謝影響 ④比BUN更可正確反應絲球體濾過率 ⑤其正常血中濃度依動物肌肉量而不同","opts":["A. ①②③⑤","B. ①②④⑤","C. ②③④⑤","D. ①②③④"],"ans":1,"exp":"Creatinine的特性：①脂血症可使某些比色法（如Jaffé法）偶有干擾，但通常造成假高值；②嚴重脫水使GFR下降，creatinine升高，正確；③creatinine比BUN「較少」受食物及體內分解代謝影響（BUN受蛋白質攝取影響大），故③「更易受影響」錯誤；④creatinine比BUN更能正確反映GFR（更穩定），正確；⑤正常血中creatinine依動物肌肉量（肌肉產生creatinine）而不同，正確。組合①②④⑤正確。","we":["A. ①②③⑤：③說creatinine「比BUN更易受食物及體內分解代謝影響」為錯誤（正好相反），此組合含③錯誤。","（正確）B. ①②④⑤均為正確敘述：脂血可干擾（①）、脫水使其升高（②）、比BUN更反映GFR（④）、因肌肉量不同而差異（⑤）。","C. ②③④⑤：含③錯誤（creatinine不易受食物影響），此組合不正確。","D. ①②③④：含③錯誤，此組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_066","year":2017,"roc_year":106,"session":"1","examNo":66,"q":"關於犬慢性腎病可能出現下列那些現象？①PU/PD ②貧血 ③尿比重＞1.030 ④體重下降或不變","opts":["A. ①②④","B. ①②③","C. ②③④","D. ①③④"],"ans":0,"exp":"犬慢性腎病典型表現：①多尿多飲（PU/PD，腎臟濃縮能力下降）；②貧血（EPO分泌減少）；③尿比重通常下降至等滲（1.008～1.012），不會大於1.030；④體重下降（食慾下降、代謝消耗）。故現象①②④均會出現，③尿比重>1.030不符（應低）。","we":["（正確）A. ①PU/PD、②貧血、④體重下降均是慢性腎病的典型表現；③尿比重>1.030代表腎臟濃縮能力正常，慢性腎病時不應出現，故排除③。","B. 含③（尿比重>1.030）：慢性腎病腎小管濃縮功能受損，尿比重應偏低（等滲），不應>1.030，此組合有誤。","C. 含③且去掉①：PU/PD是慢性腎病的早期且重要徵狀，不應排除。","D. 含③且去掉②：貧血是慢性腎病的常見表現，不應排除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_067","year":2017,"roc_year":106,"session":"1","examNo":67,"q":"檢測犬腎臟濃縮能力，若行突然不給飲水試驗後，其尿比重大於多少，就可認定為具有尿濃縮能力？","opts":["A. 1.008","B. 1.025","C. 1.030","D. 1.035"],"ans":2,"exp":"犬行突然不給飲水試驗後，若尿比重大於1.030，可認定為具有正常的腎臟尿濃縮能力（正常犬最高可達1.040～1.060）。貓的閾值更高（>1.035）；1.025以下代表腎臟濃縮功能低下；1.008是等滲。","we":["A. 尿比重>1.008僅代表超過等滲，腎臟可能仍有濃縮不足，不能認定為具正常濃縮能力。","B. 尿比重>1.025代表有一定濃縮能力，但國考標準值為>1.030才能確認。","（正確）C. 犬突然不給飲水後尿比重>1.030即可認定具有正常腎臟濃縮能力。","D. 尿比重>1.035是貓的判斷標準，犬的閾值較低（>1.030）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_068","year":2017,"roc_year":106,"session":"1","examNo":68,"q":"維生素D經過那兩個器官被活化成1,25-dihydroxycholecalciferol？","opts":["A. 肝、腎","B. 脾、胃","C. 肝、腎上腺","D. 脾、腎上腺"],"ans":0,"exp":"維生素D的活化分兩步驟：首先在肝臟（25-hydroxylation，形成25-hydroxyvitamin D），再到腎臟（1α-hydroxylation，形成1,25-dihydroxycholecalciferol，即calcitriol，活性型）。需要肝臟和腎臟共同完成活化。","we":["（正確）A. 維生素D先在肝臟進行25-羥化，再至腎臟進行1α-羥化，最終形成活性型1,25-dihydroxycholecalciferol（calcitriol）。","B. 脾、胃不參與維生素D的活化過程。","C. 腎上腺不參與維生素D的活化；肝臟正確，腎上腺錯誤。","D. 脾和腎上腺均不參與維生素D的活化，此組合完全錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_069","year":2017,"roc_year":106,"session":"1","examNo":69,"q":"下列何者最易造成犬低血鈣症？","opts":["A. 淋巴瘤（lymphoma）","B. 原發性高副甲狀腺功能症","C. 慢性腎衰竭","D. 高維生素D症"],"ans":2,"exp":"慢性腎衰竭是犬最常見的低血鈣症原因，機制包括：腎臟無法活化維生素D（1,25-dihydroxyvitamin D減少）→腸道鈣吸收下降；高磷血症→鈣磷沉澱；腎臟EPO與鈣代謝調節受損。淋巴瘤和高維生素D症造成高血鈣；原發性高副甲狀腺功能症也造成高血鈣。","we":["A. 淋巴瘤（尤其T細胞型）是犬最常見的惡性腫瘤相關高血鈣症（humoral hypercalcemia of malignancy）原因，非低血鈣。","B. 原發性高副甲狀腺功能症（primary hyperparathyroidism）使PTH升高，血鈣升高（高血鈣），非低血鈣。","（正確）C. 慢性腎衰竭是犬低血鈣症最常見原因，腎臟無法正常活化維生素D及排磷，導致低鈣高磷。","D. 高維生素D症（維生素D中毒）造成腸道鈣吸收過多，引起高血鈣，非低血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_070","year":2017,"roc_year":106,"session":"1","examNo":70,"q":"要鑑別貓糖尿病或緊迫引起之高血糖症，應施行下列何種檢測？","opts":["A. ACTH刺激試驗","B. TSH刺激試驗","C. 血中BUN及creatinine濃度","D. 血清果糖胺（fructosamine）濃度"],"ans":3,"exp":"血清果糖胺（fructosamine）反映過去2～3週的平均血糖水平，不受短期緊迫性高血糖影響。若貓是真性糖尿病，果糖胺升高；若只是緊迫性高血糖（短暫性），果糖胺值正常。ACTH/TSH刺激試驗、BUN/creatinine等均無法區分兩者。","we":["A. ACTH刺激試驗用於診斷腎上腺疾病（Cushing's或Addison's），無法區分糖尿病與緊迫性高血糖。","B. TSH刺激試驗用於評估甲狀腺功能，與高血糖鑑別無關。","C. BUN和creatinine評估腎功能，無法區分糖尿病與緊迫性高血糖的原因。","（正確）D. 血清果糖胺反映過去2～3週的平均血糖，若緊迫性高血糖（短暫），果糖胺正常；若真性糖尿病（持久性高血糖），果糖胺升高，是最佳鑑別工具。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_071","year":2017,"roc_year":106,"session":"1","examNo":71,"q":"下列何者不是因純粹水分流失而導致高血鈉症？","opts":["A. central diabetes insipidus","B. primary adipsia","C. diabetes mellitus","D. heatstroke"],"ans":2,"exp":"純粹水分流失（pure water loss）引起高血鈉症的原因：central diabetes insipidus（中樞性尿崩症，ADH缺乏→大量稀尿）；primary adipsia（原發性缺渴感，飲水不足）；heatstroke（熱射病，出汗蒸發大量純水）均屬此類。Diabetes mellitus（糖尿病）是低滲透壓尿導致低滲性體液喪失，並非「純粹水分流失」，高血鈉不典型。","we":["A. Central diabetes insipidus（中樞性尿崩症）ADH分泌不足，排出大量低滲尿→純粹水分流失→高血鈉，屬於此類。","B. Primary adipsia（原發性缺渴感）飲水減少，水分蒸發→純粹水分流失→高血鈉，屬於此類。","（正確）C. Diabetes mellitus（糖尿病）因滲透性利尿，排出的是含有葡萄糖及電解質的低滲溶液，非「純粹水分流失」，可能反而低血鈉或等滲，非典型純粹水分流失導致高血鈉。","D. Heatstroke（熱射病）通過出汗大量蒸發純水→高血鈉，屬於純粹水分流失。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_072","year":2017,"roc_year":106,"session":"1","examNo":72,"q":"下列何者會因脂血症而造成假性低值？","opts":["A. ALT activity","B. albumin","C. glucose","D. total bilirubin"],"ans":1,"exp":"脂血症（lipemia）可干擾多種比色法測定：白蛋白（albumin，用溴甲酚綠/溴甲酚紫法）測定時，脂血造成光散射或顏色干擾，呈假性低值。葡萄糖（脂血輕度影響，通常假高或正常）；ALT、total bilirubin均有各自的干擾方向，但白蛋白假低是最典型考題。","we":["A. ALT activity：脂血主要對吸光度造成基線偏差，但ALT酵素活性測定不如albumin受脂血影響顯著。","（正確）B. Albumin：脂血症使溴甲酚綠/紫比色法產生光散射干擾，造成白蛋白假性低值，是最典型的脂血干擾項目。","C. Glucose：脂血症對葡萄糖測定影響較小，或造成假高值，非假低值。","D. Total bilirubin：脂血可干擾膽紅素比色法（Jendrassik-Grof法），有時造成假高值，非主要假低值項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_073","year":2017,"roc_year":106,"session":"1","examNo":73,"q":"牛之兩眼球凹陷嚴重、皮膚皺摺試驗保留20～45秒，推估脫水程度為","opts":["A. 5%以下","B. 5-7%","C. 8-10%","D. 10%以上"],"ans":2,"exp":"牛脫水評估：5%以下：輕微（皮膚彈性稍差）；5～7%：眼球稍凹、皮膚皺摺保留5～10秒；8～10%：眼球明顯凹陷、皮膚皺摺保留20～45秒；10%以上：眼球嚴重凹陷、皮膚皺摺保留45秒以上、昏迷。題目描述「兩眼球凹陷嚴重（明顯）、皮膚皺摺保留20～45秒」符合8～10%脫水。","we":["A. 5%以下脫水時，眼球凹陷不明顯，皮膚皺摺回復快，不符合題目描述。","B. 5～7%脫水時，眼球稍凹、皺摺保留5～10秒，不符合「20～45秒」的描述。","（正確）C. 8～10%脫水：眼球明顯凹陷、皮膚皺摺保留20～45秒，符合題目描述。","D. 10%以上脫水：皮膚皺摺保留>45秒且常有昏迷，題目描述的20～45秒不到10%以上標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_074","year":2017,"roc_year":106,"session":"1","examNo":74,"q":"門靜脈高血壓（portal hypertension）所致的滲液，可能屬於：①純粹性漏出液 ②修飾性漏出液 ③非化膿性滲出液 ④化\r 膿性滲出液","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"門靜脈高血壓（portal hypertension）引起血管靜水壓升高，使液體漏出，形成的腹腔積液性質為：輕度時為純粹性漏出液（pure transudate，蛋白質極低）；持續時因蛋白質逐漸滲出可轉變為修飾性漏出液（modified transudate）。因此可能出現①純粹性漏出液或②修飾性漏出液。","we":["（正確）A. ①②：門靜脈高血壓導致靜水壓升高，最初形成純粹性漏出液（①），隨著蛋白質滲出，可進展為修飾性漏出液（②），兩者均可能。","B. ②③：非化膿性滲出液（③）見於炎症性疾病，非單純門靜脈高血壓的典型結果。","C. ③④：化膿性（④）及非化膿性（③）滲出液均代表炎症/感染，不符合門靜脈高血壓的病理機制。","D. ①④：化膿性滲出液（④）代表細菌感染，非門靜脈高血壓的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_075","year":2017,"roc_year":106,"session":"1","examNo":75,"q":"腦脊髓液之細胞數每µL超過多少，通常即會使腦脊髓液呈現混濁？","opts":["A. 200","B. 300","C. 400","D. 500"],"ans":3,"exp":"腦脊髓液（CSF）正常時幾乎透明，細胞極少。當細胞數每µL超過500時，CSF通常會呈現混濁外觀。細胞數200～300雖異常，但尚不足以明顯使CSF混濁。","we":["A. 200個/µL：CSF已異常（正常<5/µL），但尚不足以使CSF明顯混濁。","B. 300個/µL：仍可能呈現乳白色但輕度混濁，尚不達到典型混濁閾值。","C. 400個/µL：接近但一般教科書以500作為混濁的界值。","（正確）D. CSF細胞數超過500個/µL時，通常可見明顯混濁，是普遍接受的閾值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_076","year":2017,"roc_year":106,"session":"1","examNo":76,"q":"犬心絲蟲感染症引起右心功能衰竭時，其腹水之性狀屬於何者？","opts":["A. 純粹性滲出液","B. 修飾性漏出液","C. 化膿性滲出液","D. 非化膿性滲出液"],"ans":1,"exp":"犬心絲蟲感染症引起右心功能衰竭時，靜脈壓升高，導致腹水，其性質為修飾性漏出液（modified transudate）：蛋白質含量中等（2.5～5.0 g/dL）、細胞數偏低至中等，不含大量白血球，非化膿性或滲出液。","we":["A. 純粹性滲出液（pure exudate）：此為純粹性「滲出液」，用詞混淆；純粹性「漏出液」蛋白質<2.5 g/dL，右心衰竭的腹水蛋白質稍高，不完全符合。","（正確）B. 修飾性漏出液（modified transudate）：靜脈高壓導致液體漏出，蛋白質中等，細胞數低至中等，符合右心衰竭腹水的典型性質。","C. 化膿性滲出液：含大量嗜中性球，代表細菌感染，非心絲蟲右心衰竭的腹水性質。","D. 非化膿性滲出液：含炎症細胞（單核/淋巴），見於FIP等炎性疾病，非右心衰竭典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1061_實診_077","year":2017,"roc_year":106,"session":"1","examNo":77,"q":"最不可能為","opts":["A. 早期膽汁鬱滯","B. 使用類固醇","C. 肝功能不全","D. 大範圍肌肉損傷"],"ans":3,"exp":"此題為承接題（最不可能為何），需看前題情境。若前題描述犬ALP顯著升高而ALT輕度升高，典型鑑別包括早期膽汁鬱滯（ALP升高）、使用類固醇（犬類固醇誘導ALP升高）、肝功能不全（ALP升高）。「大範圍肌肉損傷」主要使CK、AST升高，ALP不受影響，故最不可能為D（大範圍肌肉損傷）導致單純ALP升高。（需圖/前題確認，標記needs_review）","we":["A. 早期膽汁鬱滯可使ALP顯著升高，是ALP升高的常見原因，可能。","B. 使用類固醇（glucocorticoids）在犬可誘導肝臟ALP同功酶（steroid-induced ALP）顯著升高，可能。","C. 肝功能不全時肝細胞受損，各種肝酵素可能升高，可能。","（正確）D. 大範圍肌肉損傷主要使CK、AST升高，ALP並非肌肉酵素，不受肌肉損傷影響，最不可能是ALP升高的原因。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1061_實診_078","year":2017,"roc_year":106,"session":"1","examNo":78,"q":"承上題，若懷疑肝功能不全，以下何項檢測最不能進一步協助診斷肝功能？","opts":["A. 禁食膽汁酸濃度","B. 血氨濃度","C. 白蛋白濃度","D. 直接型與間接型膽紅素比例"],"ans":3,"exp":"此為承接題（承Q77）。若懷疑肝功能不全，評估肝功能的最佳指標包括：禁食膽汁酸（反映肝臟攝取/排泄功能）、血氨（反映肝臟解毒功能）、白蛋白（反映肝臟合成功能）。「直接型與間接型膽紅素比例」僅能區分溶血性黃疸（間接型↑）與膽汁鬱滯性（直接型↑），不能直接反映肝細胞功能儲備，是最不能協助診斷肝功能不全的指標。（需前題確認，標記needs_review）","we":["A. 禁食膽汁酸濃度直接反映肝臟攝取、結合、排泄功能，是評估肝功能最敏感的指標之一。","B. 血氨升高代表尿素循環功能受損（肝臟解毒功能喪失），是肝功能不全的重要指標。","C. 白蛋白由肝臟合成，持續低白蛋白血症反映慢性肝功能不全，是有用的評估指標。","（正確）D. 直接型與間接型膽紅素比例主要用於鑑別黃疸類型（溶血性vs膽汁鬱滯性），不能直接反映肝功能儲備，是最不能協助診斷肝功能不全的指標。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1061_實診_079","year":2017,"roc_year":106,"session":"1","examNo":79,"q":"依前述結果判斷其可能為","opts":["A. 呼吸性酸中毒","B. 呼吸性鹼中毒","C. 代謝性酸中毒","D. 代謝性鹼中毒"],"ans":2,"exp":"此為承接題（承前），需看血氣分析數據。若前題呈現pH降低、HCO₃⁻降低、PCO₂代償性降低，符合代謝性酸中毒。代謝性酸中毒時：原發性HCO₃⁻↓→pH↓，呼吸代償性PCO₂↓（加速呼吸）。（需前題數據確認，標記needs_review）","we":["A. 呼吸性酸中毒：PCO₂升高→pH降低，HCO₃⁻繼發性升高，與代謝性酸中毒不同。","B. 呼吸性鹼中毒：PCO₂降低→pH升高（非降低），不符。","（正確）C. 代謝性酸中毒：HCO₃⁻原發性降低→pH↓，PCO₂代償性降低（呼吸加速），符合此承接題情境。","D. 代謝性鹼中毒：HCO₃⁻升高→pH↑，與酸中毒相反，不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1061_實診_080","year":2017,"roc_year":106,"session":"1","examNo":80,"q":"承上題，欲緩解上述變化需進行何種代償作用？","opts":["A. 腎排泄H + ，重吸收HCO 3 -","B. 腎增加H + 的保存與HCO 3 - 的排除","C. 加速呼吸","D. 緩慢呼吸"],"ans":2,"exp":"代謝性酸中毒（承Q79）的代償機制：呼吸代償為加速呼吸（hyperventilation），增加CO₂排出，降低PCO₂，使pH往正常回調（Kussmaul呼吸）。腎臟則為長期代償（重吸收HCO₃⁻、排泄H⁺），但題目問「緩解上述變化」的主要代償作用。（需前題確認，標記needs_review）","we":["A. 腎排泄H⁺、重吸收HCO₃⁻：這是腎臟對代謝性酸中毒的長期代償，方向正確，但主要即時代償是呼吸加速。","B. 腎增加H⁺保存與HCO₃⁻排除：此為代謝性鹼中毒時的腎臟代償，方向相反，錯誤。","（正確）C. 加速呼吸（hyperventilation）：代謝性酸中毒的即時代償反應，加速排出CO₂，使PCO₂↓，H₂CO₃↓，回調pH。","D. 緩慢呼吸：緩慢呼吸造成CO₂滯留、pH進一步降低，是代謝性鹼中毒的代償，不適用於酸中毒。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1062_實診_001","year":2017,"roc_year":106,"session":"2","examNo":1,"q":"最適於尿中固形物之保存法為","opts":["A. 冷藏","B. 冷凍","C. 添加二甲苯","D. 添加40％甲醛"],"ans":0,"exp":"尿液固形物（尿沉渣）保存最適方式為冷藏（2-8°C），可抑制細菌生長及細胞自溶，又不破壞有形成分的形態。冷凍會破壞細胞結構；二甲苯及甲醛適用於組織學切片，不適合尿液沉渣保存。","we":["（正確）冷藏（2-8°C）可抑制細菌增殖及細胞自溶，為尿液固形物保存的最佳方式。","冷凍會使細胞膨脹破裂，破壞有形成分形態，不適用於尿液固形物保存。","二甲苯（xylene）為有機溶劑，適用於組織學切片脫水透明步驟，不適合尿液保存。","40%甲醛（福馬林）適用於組織固定，濃度過高且不適合尿液固形物保存，會使細胞嚴重變形。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_002","year":2017,"roc_year":106,"session":"2","examNo":2,"q":"溶血檢體可能會使下列何項檢驗項目呈現假高值？","opts":["A. 肌酸酐","B. ALP","C. 葡萄糖","D. 血容比"],"ans":0,"exp":"溶血時紅血球破裂，細胞內大量肌酸酐（creatinine）釋出到血清，造成假性偏高。溶血對ALP影響不顯著；葡萄糖在溶血後因紅血球糖解作用反而降低；血容比（PCV）測量的是紅血球體積，溶血後本身即為干擾因素，並非假高值。","we":["（正確）溶血時紅血球內肌酸酐大量釋出，造成血清肌酸酐假性升高（假高值）。","ALP主要來自肝臟、骨骼、腸道，溶血對其活性影響不大，通常不呈假高值。","溶血後紅血球進行無氧糖解消耗葡萄糖，血清葡萄糖反而呈假低值，而非假高值。","血容比（PCV/HCT）是直接測量紅血球比例，溶血本身即影響其準確性，不適合稱為「假高值」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_003","year":2017,"roc_year":106,"session":"2","examNo":3,"q":"使用檸檬酸鈉抗凝管可能會使下列何項檢驗呈現假低值？","opts":["A. 鉀","B. 鎂","C. 膽固醇","D. 膽汁酸"],"ans":0,"exp":"檸檬酸鈉（sodium citrate）抗凝管會與血液中鉀離子（K+）螯合，導致血清鉀呈假低值。鎂、膽固醇、膽汁酸受檸檬酸鈉影響較小。","we":["（正確）檸檬酸鈉會螯合鉀離子，使得血清鉀離子濃度呈現假低值。","鎂離子雖也為二價陽離子，但檸檬酸鈉對鎂的干擾遠不如對鈣、鉀的影響顯著。","膽固醇為脂質，不受離子螯合劑影響，檸檬酸鈉不會造成其假低值。","膽汁酸為有機酸，不被檸檬酸鈉螯合，檸檬酸鈉不影響膽汁酸測定值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_004","year":2017,"roc_year":106,"session":"2","examNo":4,"q":"1 mL血液需加入多少量的肝素，其抗凝作用最佳？","opts":["A. 0.002 mg","B. 0.02 mg","C. 0.2 mg","D. 2 mg"],"ans":2,"exp":"肝素抗凝最佳用量為每1 mL血液添加0.2 mg肝素。用量不足（<0.1 mg/mL）抗凝不完全；用量過多則影響某些檢驗項目（如血鈣）。","we":["0.002 mg/mL肝素劑量過低，無法有效抑制凝血，抗凝作用不足。","0.02 mg/mL肝素劑量仍偏低，抗凝效果不佳，不符合最佳用量標準。","（正確）每1 mL血液加入0.2 mg肝素為公認最佳抗凝用量，可完全抑制凝血而不影響大多數檢測。","2 mg/mL肝素劑量過高，可能干擾電解質（如血鈣）的測定結果，造成假低值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_005","year":2017,"roc_year":106,"session":"2","examNo":5,"q":"下列那一情況通常不會使凝血酶時間（thrombin time）延長？","opts":["A. congenital fibrinogen deficiency","B. severe liver disease","C. heparin treatment","D. acute disseminated intravascular coagulation(E)本題送分"],"ans":3,"exp":"凝血酶時間（TT）測定的是Thrombin將纖維蛋白原轉化為纖維蛋白的時間，反映共同徑路末端及纖維蛋白原狀態。先天性纖維蛋白原缺乏（A）、嚴重肝病（B，減少纖維蛋白原合成）、肝素治療（C，抑制Thrombin）均會使TT延長。急性DIC（D）消耗纖維蛋白原也會延長TT，故本題為送分題（選項D原標注「(E)本題送分」）。","we":["先天性纖維蛋白原缺乏時，底物不足，TT明顯延長，此選項確實使TT延長。","嚴重肝病使纖維蛋白原合成減少，TT延長，此選項確實使TT延長。","肝素治療抑制Thrombin活性，直接使TT延長，此選項確實使TT延長。","（正確）急性DIC大量消耗凝血因子及纖維蛋白原，TT亦會延長；本題為送分題，無一答案符合「不會延長」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_006","year":2017,"roc_year":106,"session":"2","examNo":6,"q":"某病畜thrombin time（TT）延長，最可能是下列何徑路（pathway）不正常？","opts":["A. 內因徑路（intrinsic pathway）","B. 外因徑路（extrinsic pathway）","C. 共同徑路（common pathway）","D. 纖維溶解徑路（fibrinolysis pathway）"],"ans":2,"exp":"凝血酶時間（TT）反映Thrombin將纖維蛋白原轉化為纖維蛋白的速率，是共同徑路（common pathway）末端步驟的指標。TT延長代表共同徑路功能異常（如纖維蛋白原缺乏、纖維蛋白聚合障礙）。","we":["內因徑路異常以aPTT延長為主要指標，TT不直接反映內因徑路。","外因徑路異常以PT延長為主要指標，TT不直接反映外因徑路。","（正確）TT測量Thrombin→纖維蛋白的轉換，屬共同徑路末端，TT延長表示共同徑路功能異常。","纖維溶解徑路的指標為FDP及D-dimer，TT不反映纖維溶解徑路狀態。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_007","year":2017,"roc_year":106,"session":"2","examNo":7,"q":"下列有關淋巴瘤（lymphoma）之敘述，何者正確？","opts":["A. 慢性淋巴球性白血病（chronic lymphocytic leukemia）常為骨髓來源淋巴胚細胞之惡性增殖而成\r 之白血病","B. 結節性比瀰漫性淋巴瘤較常見於家畜，且病程較短","C. 牛和犬常發生之淋巴瘤為淋巴胚細胞性淋巴瘤（lymphoblastic lymphoma）","D. 前淋巴球性淋巴瘤（prolymphocytic lymphoma）核染質呈輕度之聚集，且可能看到核仁之殘留物"],"ans":3,"exp":"前淋巴球性淋巴瘤（prolymphocytic lymphoma）的細胞核染質呈輕度聚集，且可看到核仁的殘留物，此描述正確。慢性淋巴球性白血病（CLL）是成熟淋巴球而非骨髓來源淋巴胚細胞；瀰漫性比結節性更常見且病程較短；牛和犬常發生的淋巴瘤為小淋巴球性，非淋巴胚細胞性。","we":["CLL是由成熟小淋巴球增殖而成，而非骨髓來源淋巴胚細胞；淋巴胚細胞性白血病才是骨髓來源胚細胞。","瀰漫性淋巴瘤比結節性更常見於家畜，且瀰漫性病程較短（更惡性），敘述相反。","牛和犬常發生的淋巴瘤主要為小淋巴球性（small lymphocytic lymphoma），並非淋巴胚細胞性。","（正確）前淋巴球性淋巴瘤細胞核染質輕度聚集，且可見核仁殘留物，為此型特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_008","year":2017,"roc_year":106,"session":"2","examNo":8,"q":"哈士奇犬全身淋巴結腫大並發現腫瘤，但其他器官正常（無腫瘤出現），此犬之淋巴瘤\r （lymphoma）依病期分類屬於第幾期？","opts":["A. 第一期","B. 第二期","C. 第三期","D. 第四期"],"ans":2,"exp":"犬淋巴瘤的WHO分期：第一期=單一淋巴結；第二期=多個淋巴結（同側）；第三期=全身性淋巴結腫大（廣泛）；第四期=有肝脾侵犯；第五期=有血液或骨髓侵犯。本題哈士奇全身淋巴結腫大、其他器官正常，屬第三期。","we":["第一期指單一淋巴結受波及，本題為全身性淋巴結腫大，不符合第一期。","第二期指單一解剖區域多個淋巴結腫大，本題為全身性，不符合第二期。","（正確）第三期指全身性淋巴結腫大但無肝脾或血液骨髓侵犯，符合本題描述。","第四期需同時有肝臟或脾臟的腫瘤侵犯，本題其他器官正常，不符合第四期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_009","year":2017,"roc_year":106,"session":"2","examNo":9,"q":"下列有關貓淋巴瘤（lymphoma）之敘述，何者錯誤？","opts":["A. 最常見為感染feline leukemia virus所致","B. FeLV陽性病貓中僅有約10～20％呈現淋巴瘤","C. 縱隔型淋巴瘤好發於3～5歲成年貓","D. 貓腫瘤病毒（feline sarcoma virus）具有病毒性癌遺傳因子"],"ans":2,"exp":"貓縱隔型淋巴瘤（mediastinal lymphoma）好發於年輕貓（2歲以下），不是3～5歲成年貓，因此C項敘述錯誤。FeLV與貓淋巴瘤密切相關（A正確）；FeLV陽性貓中約10-20%發展為淋巴瘤（B正確）；貓肉瘤病毒（FeSV）含有病毒性癌遺傳因子（D正確）。","we":["FeLV感染確實是貓淋巴瘤最常見原因，此敘述正確，非錯誤選項。","FeLV陽性病貓中僅約10-20%最終發展為淋巴瘤，此比例描述正確，非錯誤選項。","（正確）縱隔型淋巴瘤好發於年輕（<2歲）FeLV陽性貓，而非3-5歲，此敘述錯誤。","貓肉瘤病毒（feline sarcoma virus）確實含有病毒性癌遺傳因子（v-onc），此敘述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_010","year":2017,"roc_year":106,"session":"2","examNo":10,"q":"下列有關大顆粒性淋巴球（large granular lymphocyte，LGL）淋巴瘤（lymphoma）／白血病\r （leukemia）之敘述，何者錯誤？","opts":["A. 通常發生於腹部淋巴結、腸、肝和脾臟","B. 本病為不常見之疾病","C. 循環中之LGL數目不會增加","D. 大顆粒性淋巴球之大小不一致，有粗短的粉紅色到紫紅色細胞質顆粒"],"ans":2,"exp":"大顆粒性淋巴球（LGL）淋巴瘤/白血病時，循環中的LGL數目通常會增加（白血病相），因此C項「不會增加」為錯誤敘述。LGL腫瘤確實好發於腹腔器官（A正確）；本病確為不常見疾病（B正確）；LGL形態特徵為大小不一，有粗短粉紅至紫紅色顆粒（D正確）。","we":["LGL淋巴瘤/白血病確實好發於腹部淋巴結、腸、肝和脾臟，此敘述正確，非錯誤選項。","本病確實不常見，此敘述正確，非錯誤選項。","（正確）LGL白血病時循環中LGL數目通常會增加，「不會增加」之說法錯誤。","LGL細胞大小不一、具粗短粉紅至紫紅色細胞質顆粒，此形態描述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_011","year":2017,"roc_year":106,"session":"2","examNo":11,"q":"成熟紅血球的生化徑路中，大部分的葡萄糖進行下列何種徑路？","opts":["A. 衛－梅徑路（Embden-Meyerhof pathway或Anaerobic glycolysis）","B. 己糖－單磷酸鹽徑路（hexose-monophosphate pathway）","C. 變性血紅素還原酶徑路（methemoglobin reductase pathway）","D. 盧－拉徑路（Luebering-Rapoport pathway）"],"ans":0,"exp":"成熟紅血球缺乏粒線體，大部分葡萄糖（約90%）經由衛－梅徑路（Embden-Meyerhof pathway，即無氧糖解）代謝，產生ATP以維持細胞功能及離子幫浦運作。","we":["（正確）約90%的葡萄糖經由衛－梅無氧糖解徑路（EMP）代謝，為成熟紅血球的主要能量來源。","己糖單磷酸鹽徑路（HMP shunt）僅占紅血球葡萄糖代謝的約5-10%，主要用於產生NADPH以防止氧化傷害。","變性血紅素還原酶徑路消耗NADH將MetHb還原，僅為輔助性少量徑路，非主要葡萄糖代謝途徑。","盧－拉徑路（Luebering-Rapoport pathway）負責產生2,3-DPG調節血紅素氧親和力，利用EMP中間產物，非主要葡萄糖消耗途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_012","year":2017,"roc_year":106,"session":"2","examNo":12,"q":"下列何種病原主要寄生於白血球？","opts":["A. 牛泰勒氏蟲（Theileria annulata）","B. 犬焦蟲（Babesia canis）","C. 牛邊蟲（Anaplasma marginale）","D. 馬艾利希體（Ehrlichia equi）"],"ans":3,"exp":"馬艾利希體（Ehrlichia equi）主要寄生於白血球（中性球及嗜酸性球）中，形成桑葚體（morulae）。牛泰勒氏蟲寄生於紅血球及淋巴球；犬焦蟲寄生於紅血球；牛邊蟲寄生於紅血球邊緣。","we":["牛泰勒氏蟲（Theileria annulata）主要寄生於紅血球及淋巴球，並非主要寄生白血球。","犬焦蟲（Babesia canis）寄生於紅血球內，不寄生白血球。","牛邊蟲（Anaplasma marginale）寄生於紅血球邊緣（瘧疾小體），不寄生白血球。","（正確）馬艾利希體（Ehrlichia equi，現稱Anaplasma phagocytophilum）主要寄生於嗜中性球和嗜酸性球。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_013","year":2017,"roc_year":106,"session":"2","examNo":13,"q":"緊迫性（腎上腺皮質酮）原因對嗜中性球動力學的影響，下列敘述何者錯誤？","opts":["A. 初期因由骨髓釋出，呈現嗜中性球增多症","B. 通常無核左轉的現象","C. 嗜中性球易黏於血管內膜，導致循環嗜中性球池增加","D. 整體而言，血液中嗜中性球總數增加"],"ans":2,"exp":"緊迫（腎上腺皮質酮）使嗜中性球去黏附效應增強，導致邊緣嗜中性球池減少，循環嗜中性球池增加（非減少）。C項說「易黏於血管內膜，導致循環池增加」邏輯矛盾（黏附應使循環池減少），故C項錯誤。","we":["緊迫初期骨髓釋出大量嗜中性球使血液中數量增加，敘述正確，非錯誤選項。","緊迫性嗜中性球增多症通常不出現核左轉（無感染刺激），敘述正確，非錯誤選項。","（正確）腎上腺皮質酮使嗜中性球去黏附，減少邊緣池，增加循環池——故「易黏附導致循環池增加」敘述邏輯錯誤。","整體而言緊迫確實使血液中嗜中性球總數增加，敘述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_014","year":2017,"roc_year":106,"session":"2","examNo":14,"q":"下列那種白血球可致活肝素和血漿脂蛋白脂酶？","opts":["A. 單核球","B. 嗜中性球","C. 嗜酸性球","D. 嗜鹼性球"],"ans":3,"exp":"嗜鹼性球（basophil）含有肝素及組織胺等介質，能激活血漿脂蛋白脂酶（lipoprotein lipase）並釋放肝素。單核球、嗜中性球、嗜酸性球不具此功能。","we":["單核球主要功能為吞噬、抗原呈現，不含肝素，不活化脂蛋白脂酶。","嗜中性球主要功能為吞噬細菌，其顆粒不含肝素，不活化脂蛋白脂酶。","嗜酸性球主要參與抗寄生蟲及過敏反應，不含肝素，不活化脂蛋白脂酶。","（正確）嗜鹼性球顆粒中含有肝素和組織胺，可激活血漿脂蛋白脂酶，促進脂質代謝。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_015","year":2017,"roc_year":106,"session":"2","examNo":15,"q":"下列有關B淋巴球的敘述，何者正確？","opts":["A. 主要產自胸腺","B. 主要參與細胞性免疫","C. 大部分留在淋巴組織中","D. 非記憶型較記憶型長壽"],"ans":2,"exp":"B淋巴球大部分留在淋巴組織中（淋巴結、脾臟），只有少部分循環至血液。B淋巴球主要產自骨髓（非胸腺）；主要參與體液性免疫（非細胞性）；記憶型B淋巴球比非記憶型壽命更長。","we":["B淋巴球主要產自骨髓（哺乳動物）而非胸腺；胸腺是T淋巴球的分化場所。","B淋巴球主要參與體液性免疫（分泌抗體），細胞性免疫主要由T淋巴球負責。","（正確）大部分B淋巴球留存於淋巴組織（淋巴結、脾臟）中，僅少量進入循環血液。","記憶型B淋巴球壽命比非記憶型（效應型）更長，可存活數年，敘述相反故錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_016","year":2017,"roc_year":106,"session":"2","examNo":16,"q":"血紅質（heme）之合成過程，由下列何者受丁二酸基輔酶（succinyl CoA）之濃縮開始？","opts":["A. 麩氨酸","B. 甘氨酸","C. 白氨酸","D. 甲硫氨酸"],"ans":1,"exp":"血紅質（Heme）合成的第一步是在粒線體中，succinyl CoA與甘氨酸（glycine）在ALA合成酶催化下縮合形成δ-氨基乙酰丙酸（δ-ALA），為整個合成過程的起始步驟。","we":["麩氨酸（glutamate）不是heme合成起始底物，不參與succinyl CoA縮合的第一步。","（正確）甘氨酸（glycine）與succinyl CoA在ALA合成酶作用下縮合，為heme合成的第一步。","白氨酸（leucine）為支鏈氨基酸，不參與heme合成途徑。","甲硫氨酸（methionine）為含硫氨基酸，不參與heme合成的起始縮合反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_017","year":2017,"roc_year":106,"session":"2","examNo":17,"q":"缺乏下列何種物質時，因血紅素量不易上升至一定程度，因此會增加細胞分裂次數，進而出現小球性貧血 （microcytic anemia）？","opts":["A. vitamin B 12","B. vitamin C","C. folic acid","D. iron"],"ans":3,"exp":"缺鐵時，血紅素合成不足，血紅素量無法達到正常程度，細胞需增加分裂次數以試圖填充足夠血紅素，最終導致小球性低色性貧血（microcytic hypochromic anemia）。vitamin B12及葉酸缺乏造成大球性貧血，非小球性。","we":["Vitamin B12缺乏影響DNA合成，造成大球性正色性貧血，不是小球性貧血。","Vitamin C缺乏主要造成壞血病，不直接造成小球性貧血。","葉酸（folic acid）缺乏影響DNA合成，造成大球性貧血，不是小球性貧血。","（正確）缺鐵導致血紅素合成不足，細胞分裂增加，最終產生小球性低色性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_018","year":2017,"roc_year":106,"session":"2","examNo":18,"q":"下列何種動物之平均紅血球壽命最長？","opts":["A. 犬","B. 貓","C. 豬","D. 馬"],"ans":3,"exp":"馬的平均紅血球壽命最長，約為140-150天。犬約100-120天；貓約70-78天；豬約60-70天。因此馬的紅血球壽命在常見家畜中最長。","we":["犬紅血球平均壽命約100-120天，不是最長。","貓紅血球平均壽命約70-78天，為常見家畜中較短者。","豬紅血球平均壽命約60-70天，為常見家畜中最短者之一。","（正確）馬的紅血球平均壽命約140-150天，為常見家畜中最長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_019","year":2017,"roc_year":106,"session":"2","examNo":19,"q":"慢性腎病或低雄性素症等紅血球生成素缺乏時，常呈下列那種類型之貧血？","opts":["A. 大球性高色性","B. 正球性正色性","C. 小球性低色性","D. 小球性正色性"],"ans":1,"exp":"慢性腎病或低雄性素症等紅血球生成素（EPO）缺乏時，紅血球生成減少，但其形態大小及血紅素含量正常，呈正球性正色性（normocytic normochromic）非再生性貧血。","we":["大球性高色性貧血見於缺乏維生素B12或葉酸，與EPO缺乏無關。","（正確）EPO缺乏時紅血球生成減少但形態正常，呈正球性正色性非再生性貧血。","小球性低色性貧血主要見於缺鐵或慢性病性貧血晚期，不是EPO缺乏的典型表現。","小球性正色性貧血較少見，不是EPO缺乏的典型類型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_020","year":2017,"roc_year":106,"session":"2","examNo":20,"q":"下列何者於電泳時，會以最高速度往正極移動？","opts":["A. α-球蛋白","B. β-球蛋白","C. γ-球蛋白","D. 白蛋白"],"ans":3,"exp":"蛋白質電泳時，白蛋白（albumin）等電點最低（pI≈4.9），在生理pH下帶最多負電荷，因此往正極移動速度最快，位置最靠近陽極端。γ-球蛋白移動最慢，α、β球蛋白居中。","we":["α-球蛋白在電泳中移動速度居中偏快，但仍不及白蛋白。","β-球蛋白移動速度居中，慢於白蛋白。","γ-球蛋白帶電量最少，電泳移動速度最慢，最靠近陰極端。","（正確）白蛋白等電點最低，帶最多負電，電泳中往正極移動速度最快。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_021","year":2017,"roc_year":106,"session":"2","examNo":21,"q":"血清脂蛋白經過電泳後，何者會最接近陽極？","opts":["A. HDL","B. LDL","C. VLDL","D. 乳糜微粒"],"ans":0,"exp":"血清脂蛋白電泳中，HDL（高密度脂蛋白）蛋白質含量最高、脂質含量最少，帶電量最大，因此電泳移動最快，最接近陽極（α位置）。LDL在β位；VLDL在pre-β位；乳糜微粒幾乎不移動，留在原點。","we":["（正確）HDL蛋白質比例最高，電泳中帶電最大，移動最快，最靠近陽極（α帶）。","LDL位於β帶，電泳移動速度慢於HDL。","VLDL位於pre-β帶，電泳移動速度介於LDL與乳糜微粒之間。","乳糜微粒幾乎不帶電，電泳幾乎停在原點，最遠離陽極。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_022","year":2017,"roc_year":106,"session":"2","examNo":22,"q":"下列何者不是反芻獸酮血症及酮尿的常見原因？","opts":["A. 綿羊懷孕毒血症","B. 腎功能不足","C. 高脂肪飼料","D. 牛肝脂肪代謝障礙"],"ans":1,"exp":"反芻獸酮血症及酮尿的原因包括：能量負平衡（綿羊懷孕毒血症）、高脂肪飼料、牛肝脂肪代謝障礙等，均為脂肪代謝異常導致酮體生成過多。腎功能不足不會造成酮體生成增加，因此不是酮血症/酮尿的常見原因。","we":["綿羊懷孕毒血症（pregnancy toxemia）為能量負平衡，大量動員脂肪，產生酮體，是酮尿的常見原因。","（正確）腎功能不足不影響脂肪代謝及酮體生成，不是造成酮血症及酮尿的常見原因。","高脂肪飼料使血中游離脂肪酸增加，肝臟β氧化產生大量酮體，是酮血症的常見原因。","牛肝脂肪代謝障礙（fatty liver）使肝臟處理脂肪酸能力下降，酮體生成增加，是酮尿常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_023","year":2017,"roc_year":106,"session":"2","examNo":23,"q":"下列何者不是組成極低密度脂蛋白（VLDL）的主要成分？","opts":["A. triglyceride","B. cholesterol","C. cholesterol esters","D. phospholipid"],"ans":2,"exp":"VLDL（極低密度脂蛋白）主要成分為triglyceride（約50-65%）、cholesterol、phospholipid及apo B-100。cholesterol esters（膽固醇酯）主要存在於LDL和HDL，不是VLDL的主要成分。","we":["Triglyceride為VLDL最主要成分（約50-65%），是VLDL的組成核心。","Cholesterol為VLDL的成分之一（約10-15%），屬於VLDL主要成分。","（正確）Cholesterol esters主要見於LDL（約35-40%）和HDL，不是VLDL的主要成分。","Phospholipid為VLDL表面主要成分之一（約15-20%），屬於VLDL主要成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_024","year":2017,"roc_year":106,"session":"2","examNo":24,"q":"何種疾病不是造成蛋白質流失（protein loss）的主因？","opts":["A. 失血","B. 嚴重絲球體性腎炎","C. 嚴重肝病","D. 大範圍燒燙傷"],"ans":2,"exp":"嚴重肝病造成肝臟蛋白質合成減少（尤其白蛋白），屬於蛋白質「生成不足」，並非蛋白質「流失」。蛋白質流失的主要原因包括失血、腎病症候群（蛋白尿）、大範圍燒燙傷（皮膚滲漏）。","we":["失血直接使蛋白質（血漿蛋白）大量流失體外，是蛋白質流失的主要原因。","嚴重絲球體性腎炎造成大量蛋白尿，蛋白質自尿液流失，是腎病症候群的典型表現。","（正確）嚴重肝病是蛋白質合成不足（非流失），不屬於蛋白質流失的主因。","大範圍燒燙傷使皮膚屏障破壞，大量蛋白質自傷口滲出流失，是蛋白質流失的主要原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_025","year":2017,"roc_year":106,"session":"2","examNo":25,"q":"一般認為膽汁鬱滯（cholestasis）時，GGT是比ALP更敏感的指標，但在下列動物何者除外？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":0,"exp":"一般而言膽汁鬱滯時GGT比ALP更敏感，但犬是例外——犬的ALP對膽汁鬱滯和糖皮質激素誘導均非常敏感，GGT相對敏感度不及ALP。貓、牛、馬則以GGT為更好的膽汁鬱滯指標。","we":["（正確）犬是例外：犬的ALP對膽汁鬱滯及皮質酮刺激均極為敏感，比GGT更靈敏。","貓中GGT確實比ALP更敏感（因貓ALP半衰期短），不是例外。","牛中GGT為更好的膽汁鬱滯指標，不是例外。","馬中GGT比ALP更能反映膽汁鬱滯，不是例外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_026","year":2017,"roc_year":106,"session":"2","examNo":26,"q":"何者不是造成血中amylase活性值上升的原因？","opts":["A. 腎臟疾病","B. 攝食高蛋白質飼料","C. 胰臟炎","D. macroamylase上升"],"ans":1,"exp":"攝食高蛋白質飼料不會使血中澱粉酶升高。澱粉酶（amylase）主要來自胰臟，其活性上升原因為：腎臟疾病（排泄減少）、胰臟炎（胰腺腺泡細胞受損釋出）、macroamylase（大分子澱粉酶複合物，分子量大，腎臟無法過濾而在血中累積）。","we":["腎臟疾病（腎絲球濾過率降低）使澱粉酶排除減少，血中活性值上升，是常見原因。","（正確）攝食高蛋白質飼料不影響澱粉酶合成或排泄，不造成血中澱粉酶上升。","胰臟炎使胰腺腺泡細胞受損，大量澱粉酶釋入血流，是最常見原因。","Macroamylase（澱粉酶與免疫球蛋白形成的大分子複合物）無法被腎臟過濾，在血中累積使活性值上升。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_027","year":2017,"roc_year":106,"session":"2","examNo":27,"q":"犬處於慢性緊迫時最易造成下列何者血中活性值增加？","opts":["A. 鹼性磷酸酶（ALP）","B. 加瑪麩胺醯轉移酶（GGT）","C. 麩氨酸鹽脫氫酶（GLDH）","D. 氨基丙酸轉氨酶（ALT）"],"ans":0,"exp":"犬在慢性緊迫（高皮質醇）狀態下，皮質醇誘導的ALP同工酶（皮質醇誘導型ALP，corticosteroid-induced ALP）大量合成，是最易使血中ALP活性上升的酵素。此為犬特有現象，GGT、GLDH、ALT雖也可能上升，但不如ALP顯著。","we":["（正確）犬慢性緊迫時，皮質醇誘導型ALP（corticosteroid-induced isoenzyme）大量合成，ALP活性值最易顯著上升。","GGT在犬中對皮質醇誘導的反應不如ALP顯著，慢性緊迫時不是最易上升的酵素。","GLDH（麩氨酸鹽脫氫酶）為粒線體酵素，主要反映嚴重肝細胞損傷，慢性緊迫不是其主要誘因。","ALT在肝細胞損傷時上升，慢性緊迫可使ALT輕度上升，但遠不及ALP顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_028","year":2017,"roc_year":106,"session":"2","examNo":28,"q":"下列關於血清酵素ALT之敘述，何者正確？","opts":["A. 不論在什麼狀態下，ALT活性值上升程度皆與受傷害細胞數成正比","B. 血清ALT活性值可因肝細胞膜通透性改變而升高","C. ALT可為犬、貓、豬等動物之特異診斷用酵素","D. 在馬、牛、羊等動物之肌肉疾病時，均易出現ALT活性值上升"],"ans":1,"exp":"血清ALT活性值可因肝細胞膜通透性改變（不一定有細胞壞死）而升高，此為亞致死性損傷的表現，B項正確。ALT上升程度與受傷細胞數並非完全正比（受半衰期、損傷類型影響）；ALT對豬特異性差（豬骨骼肌也含ALT）；馬、牛、羊的肌肉疾病造成AST、CK上升，ALT不是這些動物的肌肉損傷指標。","we":["ALT活性值上升程度並非在任何狀態下都與受傷細胞數成正比，受細胞損傷程度、半衰期等因素影響。","（正確）肝細胞膜通透性改變（亞致死性損傷）即可使ALT滲出至血液，造成活性值升高。","ALT對犬、貓具有肝臟特異性，但豬的骨骼肌中也含有大量ALT，因此豬不適合用ALT做特異診斷。","馬、牛、羊的肝臟ALT活性低，肌肉疾病時主要上升AST及CK，ALT不是這些動物肌肉病變的良好指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_029","year":2017,"roc_year":106,"session":"2","examNo":29,"q":"下述何種疾病，通常不會使血清澱粉酶活性值升高？","opts":["A. 胰腺泡細胞之壞死","B. 腸管阻塞","C. 原發性高血脂症","D. 腎絲球體濾過率降低"],"ans":2,"exp":"原發性高血脂症（primary hyperlipidemia）不會直接使血清澱粉酶活性升高。造成澱粉酶上升的原因有：胰腺腺泡細胞壞死、腸管阻塞（壓力使胰管內澱粉酶逆流入血）、腎絲球體濾過率降低（排泄減少）。高血脂症本身不增加澱粉酶生成或減少其排泄。","we":["胰腺泡細胞壞死（急性胰臟炎）使大量澱粉酶釋入血液，是最常見使澱粉酶上升的原因。","腸管阻塞使腸管內壓力升高，促使澱粉酶由胰管逆流至血液，可使澱粉酶升高。","（正確）原發性高血脂症不影響澱粉酶生成或清除，通常不會使血清澱粉酶活性升高。","腎絲球體濾過率降低使澱粉酶由腎臟的排泄減少，導致血中澱粉酶蓄積升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_030","year":2017,"roc_year":106,"session":"2","examNo":30,"q":"馬骨骼肌嚴重受損後CK、ALT及AST活性值上升之幅度大小排序通常為","opts":["A. CK＞AST＞ALT","B. CK＞ALT＞AST","C. CK＞ALT＝AST","D. AST＞CK＞ALT"],"ans":0,"exp":"馬骨骼肌嚴重受損後，CK（半衰期最短，約12小時）上升幅度最大且最早；AST（半衰期約7天，來自肌肉及肝臟）上升次之；ALT在馬骨骼肌中含量極低，上升幅度最小。故排序為CK > AST > ALT。","we":["（正確）馬骨骼肌受損後酵素上升幅度排序為CK>AST>ALT，因CK主要來自肌肉且半衰期短，上升最顯著。","ALT在馬骨骼肌含量極低，不會高於AST，CK>ALT>AST排序錯誤。","ALT在馬骨骼肌含量極低，不會等於AST，CK>ALT=AST排序錯誤。","馬骨骼肌受損時CK上升幅度遠大於AST，AST>CK的排序與實際情形相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_032","year":2017,"roc_year":106,"session":"2","examNo":32,"q":"那種尿圓柱的出現，在貓與腎小管的傷害有關；在犬則與糖尿病有關？","opts":["A. 白血球性","B. 透明性","C. 脂肪性","D. 顆粒性"],"ans":2,"exp":"脂肪性尿圓柱（fatty cast）：在貓中出現與腎小管損傷有關（貓腎小管細胞富含脂質）；在犬中出現則與糖尿病有關（高血糖導致腎小管細胞脂肪變性）。","we":["白血球性尿圓柱出現表示腎盂腎炎或間質性腎炎，不具有本題描述的貓/犬差異特性。","透明性尿圓柱為正常少量出現，或見於脫水、發燒，不具本題描述特性。","（正確）脂肪性尿圓柱在貓中與腎小管損傷相關，在犬中則與糖尿病相關。","顆粒性尿圓柱為腎小管細胞退化產物，表示腎小管疾病，不具本題描述的貓/犬差異特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_033","year":2017,"roc_year":106,"session":"2","examNo":33,"q":"下列何種症狀不會發生於罹患糖尿病的病畜？","opts":["A. ketoacidosis","B. hypersomatotropism","C. Somogyi effect","D. Bence-Jones proteinuria"],"ans":3,"exp":"Bence-Jones蛋白尿（本瓊斯蛋白尿）是多發性骨髓瘤產生的輕鏈免疫球蛋白從尿液排出，與糖尿病無關。糖尿病可出現ketoacidosis（酮酸中毒）、hypersomatotropism（貓高生長激素症誘發糖尿病）及Somogyi effect（胰島素過量後的反彈性高血糖）。","we":["Ketoacidosis（糖尿病酮酸中毒）是第一型及重度第二型糖尿病的嚴重併發症，可發生於病畜。","Hypersomatotropism（高生長激素症）在貓可誘發胰島素阻抗性糖尿病，與糖尿病相關。","Somogyi effect為胰島素過量後血糖反彈性升高的現象，見於糖尿病治療期間，屬糖尿病相關。","（正確）Bence-Jones proteinuria是多發性骨髓瘤（漿細胞瘤）的表現，與糖尿病無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_034","year":2017,"roc_year":106,"session":"2","examNo":34,"q":"胰島素／葡萄糖校正比（amended insulin glucose ratio）至少大於多少，可作為製造胰島素之功能性腫瘤診\r 斷依據？","opts":["A. 5","B. 10","C. 20","D. 30"],"ans":2,"exp":"胰島素/葡萄糖校正比（AIGR）= [血清胰島素(μU/mL) × 100] / (血糖mg/dL - 30)。當AIGR ≥ 30時，高度懷疑功能性胰島素瘤（insulinoma）。此數值為診斷功能性胰臟β細胞腫瘤的重要依據。","we":["AIGR ≥ 5的閾值過低，特異性不足，不能作為胰島素瘤的診斷依據。","AIGR ≥ 10的閾值仍偏低，假陽性率較高，不是公認的診斷閾值。","（正確）AIGR ≥ 30被認為是功能性胰島素分泌腫瘤的診斷依據，為最廣泛採用的閾值。","AIGR ≥ 30已足夠作為診斷依據，提高至30以上才計算不符合教科書標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_035","year":2017,"roc_year":106,"session":"2","examNo":35,"q":"脫水達到體重之多少％時，即可引發休克？","opts":["A. 8～10","B. 13～15","C. 18～20","D. 22～24"],"ans":1,"exp":"脫水程度達體重13~15%時，循環血容量嚴重不足，可引發低容量性休克。輕度脫水（<5%）無症狀；中度（5-10%）有皮膚失彈性；8-10%出現眼球凹陷；>12-15%出現休克徵象。","we":["8-10%脫水時出現皮膚明顯失彈性、眼球凹陷等症狀，尚未達到休克程度。","（正確）脫水達體重13-15%時，血容量嚴重不足，可引發低容量性休克。","18-20%的脫水程度通常已超過致死量，實際上休克更早發生（13-15%即開始）。","22-24%的脫水幾乎為致死劑量，早在此程度之前休克就已發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_036","year":2017,"roc_year":106,"session":"2","examNo":36,"q":"下列何者不會造成細胞外液（extracellular fluid，ECF）的增加？","opts":["A. 低蛋白血症","B. 細胞內液中的鈉離子蓄積增加","C. 心衰竭","D. 肝硬化"],"ans":1,"exp":"細胞內液中的鈉離子蓄積（如低鈉血症時細胞腫脹）不會造成細胞外液增加；實際上細胞外液鈉降低時，水分進入細胞內，細胞外液反而減少。低蛋白血症、心衰竭、肝硬化均會造成ECF積液（水腫）增加。","we":["低蛋白血症使膠體滲透壓降低，水分由血管漏出至間質，造成細胞外液增加（水腫）。","（正確）細胞內液鈉蓄積使水分移入細胞內，不會造成細胞外液增加，反而可能使ECF減少。","心衰竭使靜脈壓升高，促使水分滲出至間質及體腔，造成ECF積液增加。","肝硬化使白蛋白合成減少且門靜脈高壓，導致腹水及ECF增加。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_037","year":2017,"roc_year":106,"session":"2","examNo":37,"q":"犬腫塊細胞學採樣鏡檢觀察結果如下圖，該犬最可能罹患下列何種腫瘤？","opts":["A. 淋巴瘤（lymphoma）","B. 肥胖細胞瘤（mast cell tumor）","C. 組織細胞瘤（histiocytoma）","D. 傳染性花柳性腫瘤（transmissible venereal tumor）"],"ans":1,"exp":"本題為看圖題，描述細胞質含大量嗜鹼性顆粒，為肥胖細胞瘤（mast cell tumor，MCT）的細胞學特徵。肥胖細胞瘤細胞含有大量紫色/藍色異染性顆粒（metachromatic granules），為犬最常見的皮膚腫瘤之一。","we":["淋巴瘤細胞為大型淋巴球，細胞質少，核大，不含特殊顆粒，不符合本題圖示。","（正確）肥胖細胞瘤細胞含大量異染性紫色顆粒（含組織胺、肝素），為其細胞學特徵。","組織細胞瘤（histiocytoma）細胞為組織細胞樣，核呈腎形，細胞質無大量顆粒。","傳染性花柳性腫瘤（TVT）細胞呈圓形，核仁明顯，細胞質有空泡，無大量嗜鹼性顆粒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_038","year":2017,"roc_year":106,"session":"2","examNo":38,"q":"貓之心臟衰竭所引起之胸水，細胞學所見以何者為主？","opts":["A. 嗜中性球","B. 單核球","C. 大型淋巴球","D. 小型淋巴球"],"ans":3,"exp":"貓心臟衰竭引起的胸水（漏出液/修飾性漏出液）由於低蛋白、靜脈壓升高等機制產生，細胞成分以小型淋巴球為主（為漏出液特徵），蛋白質含量低，有核細胞數少。","we":["嗜中性球占多數的胸水為化膿性滲出液，見於膿胸或細菌感染，不是心衰竭的表現。","單核球占多數見於非化膿性炎症，不是心衰竭漏出液的主要細胞。","大型淋巴球占多數見於乳糜胸或淋巴瘤引起的積液，不是單純心衰竭的特徵。","（正確）心臟衰竭引起的漏出液以小型淋巴球為主，細胞密度低，蛋白質含量低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_039","year":2017,"roc_year":106,"session":"2","examNo":39,"q":"下列何種動物最易出現因腎上腺皮質酮刺激引起的單核球增多症？","opts":["A. 牛","B. 馬","C. 貓","D. 犬"],"ans":3,"exp":"犬對腎上腺皮質酮刺激反應最為明顯，包括單核球增多症（monocytosis）。這是犬特有的「緊迫性白血球相」的一部分（嗜中性球增多+淋巴球減少+嗜酸性球減少+單核球增多）。牛、馬、貓對皮質酮的單核球反應不及犬顯著。","we":["牛對腎上腺皮質酮的反應以嗜中性球增多為主，單核球增多症不顯著。","馬對皮質酮的白血球反應以嗜中性球增多及淋巴球減少為主，單核球增多不明顯。","貓對皮質酮的反應較不典型，單核球增多症不如犬顯著。","（正確）犬對腎上腺皮質酮刺激最易出現單核球增多症，為犬特有的緊迫性白血球相之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_040","year":2017,"roc_year":106,"session":"2","examNo":40,"q":"關於健康動物嗜中性球之敘述何者正確？","opts":["A. 於微血管後之小靜脈（postcapillary venules）之移動速度比紅血球及血漿快","B. 健康動物血中之嗜中性球，平均存在於血管中的時間約為16～20小時","C. 血中嗜中性球移入組織間隙是隨機的，與年齡無關","D. 健康動物之嗜中性球離開血管後，少部分由脾、肝及骨髓之巨噬細胞吞噬，大部分再回到血液"],"ans":1,"exp":"健康動物血中嗜中性球平均存在於血管中的時間約為16-20小時（半衰期約6-8小時，總循環時間約16-20小時）。其在微血管後小靜脈移動速度比紅血球和血漿慢（因滾動黏附）；嗜中性球離開血管後不會再回到血液；移入組織與年齡相關（老齡嗜中性球優先移出）。","we":["嗜中性球在微血管後小靜脈移動緩慢（因邊緣化/滾動），速度比紅血球及血漿慢，非快。","（正確）健康動物血中嗜中性球平均存在於血管中的時間約16-20小時，此描述正確。","嗜中性球移入組織間隙與細胞年齡有關（老化細胞優先離開血管），並非隨機且與年齡無關。","嗜中性球離開血管後不會再回到血液，最終在組織中凋亡後由巨噬細胞清除，「大部分再回到血液」錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_041","year":2017,"roc_year":106,"session":"2","examNo":41,"q":"下列有關Chediak-Higashi syndrome之敘述何者正確？","opts":["A. 血小板表面glyoprotein IIb-IIIa缺陷造成","B. 缺乏第Ⅷ凝血因子","C. 雙香豆素中毒造成","D. 血小板緻密顆粒缺乏以及腺嘌呤核苷酸、二價陽離子和血清素儲存不足所致"],"ans":3,"exp":"Chediak-Higashi syndrome是一種遺傳性血小板緻密顆粒缺陷症，導致腺嘌呤核苷酸（ADP/ATP）、二價陽離子（Ca2+）及血清素（serotonin）的儲存不足，造成血小板功能障礙及出血傾向。另外也有嗜中性球顆粒融合異常。","we":["血小板表面glycoprotein IIb-IIIa缺陷所致的是Glanzmann's thrombasthenia（血小板無力症），不是Chediak-Higashi syndrome。","缺乏第Ⅷ凝血因子為血友病A（hemophilia A），與Chediak-Higashi syndrome無關。","雙香豆素中毒影響維生素K依賴性凝血因子合成，不是Chediak-Higashi syndrome的機制。","（正確）Chediak-Higashi syndrome的特徵為血小板緻密顆粒缺乏，導致ADP、ATP、二價陽離子和血清素儲存不足，造成血小板功能障礙。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_042","year":2017,"roc_year":106,"session":"2","examNo":42,"q":"下列有關TEG（Thromboelastogram）之敘述何者錯誤？","opts":["A. 可使用檸檬酸鈉抗凝或直接用新鮮全血","B. 此法可分辨高凝固或低凝固狀態","C. 可測量血液中纖維素聚合期間的黏彈性變化","D. 可區別內因以及外因凝血因子的缺乏"],"ans":3,"exp":"TEG（血栓彈性圖）測量血液在凝固過程中的黏彈性變化，可區分高/低凝固狀態，但無法區別內因性（intrinsic）或外因性（extrinsic）凝血因子的缺乏，因為TEG使用全血測量整體凝血過程，不能分辨特定徑路的個別凝血因子。","we":["TEG確實可使用檸檬酸鈉抗凝血或新鮮全血進行測定，敘述正確，非錯誤選項。","TEG確實可分辨高凝固（hypercoagulable）或低凝固（hypocoagulable）狀態，敘述正確，非錯誤選項。","TEG確實可測量纖維素聚合期間血液的黏彈性變化，敘述正確，非錯誤選項。","（正確）TEG無法區分內因性或外因性凝血因子缺乏，若需區分須用aPTT（內因）或PT（外因）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_043","year":2017,"roc_year":106,"session":"2","examNo":43,"q":"下列何種動物在嚴重貧血時，於末梢血片上最不易看到紅血球嗜鹼性斑點？","opts":["A. 犬","B. 馬","C. 貓","D. 山羊"],"ans":1,"exp":"馬的紅血球在嚴重貧血時，末梢血片上最不易看到嗜鹼性斑點（basophilic stippling）。這是因為馬成熟紅血球在正常成熟過程中會完全消除RNA，且網狀球（reticulocyte）不會在血液中循環（貓也少見，但馬更極端）。","we":["犬在嚴重再生性貧血時可見到嗜鹼性斑點，因未成熟紅血球（含殘留RNA）釋入血液。","（正確）馬的紅血球成熟過程嚴格，網狀球不在外周血液循環，嚴重貧血時也幾乎看不到嗜鹼性斑點。","貓在貧血時雖少見網狀球，但偶可見到嗜鹼性斑點，不如馬極端。","山羊在貧血時也可見到網狀球及嗜鹼性斑點，不符合「最不易看到」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_044","year":2017,"roc_year":106,"session":"2","examNo":44,"q":"下列何者不會造成紅血球形成作用減退或缺陷性貧血？","opts":["A. 輸血不當","B. Anaplasma spp.感染","C. 慢性腎病","D. vitamin B 12 缺乏"],"ans":0,"exp":"輸血不當（如輸錯血型）會造成溶血性貧血（破壞性貧血），不是「紅血球形成作用減退或缺陷性」貧血。Anaplasma感染侵犯紅血球前驅細胞可造成生成減退；慢性腎病使EPO減少造成生成減退；vitamin B12缺乏造成巨球性缺陷性貧血。","we":["（正確）輸血不當導致溶血性貧血（紅血球被破壞），屬破壞性貧血，不是生成減退或缺陷性貧血。","Anaplasma spp.感染可侵犯骨髓，抑制紅血球生成，造成生成減退性貧血。","慢性腎病使EPO（紅血球生成素）合成減少，造成非再生性正球性正色性貧血（生成減退）。","Vitamin B12缺乏影響DNA合成，造成巨球性（大球性）缺陷性貧血，屬生成缺陷性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_045","year":2017,"roc_year":106,"session":"2","examNo":45,"q":"下列有關骨髓增殖性腫瘤（myeloproliferative neoplasma）的敘述，何者正確？","opts":["A. 慢性顆粒球性白血病（CGL）是比較年輕的嗜中性球的增殖","B. 骨髓檢查時，慢性顆粒球性白血病（CGL）比急性骨髓性白血病（AML）有較占優勢的骨髓胚細胞","C. 真性多血症其紅血球之增殖，依賴紅血球生成素（EPO）之刺激","D. 實質性血小板血症，血小板呈形態異常，且伴有巨大血小板和強烈顆粒性"],"ans":3,"exp":"實質性血小板血症（essential thrombocythemia）的特徵為血小板形態異常，包括巨大血小板（macroplatelets）及強烈顆粒性，為骨髓增殖性腫瘤的一種。CGL是較成熟嗜中性球（非年輕細胞）的增殖；AML有較多骨髓胚細胞；真性多血症的紅血球增殖獨立於EPO刺激之外。","we":["慢性顆粒球性白血病（CGL）是較成熟嗜中性球（如帶狀核及分葉核）的增殖，而非比較年輕的細胞。","急性骨髓性白血病（AML）比CGL有更多不成熟的骨髓胚細胞，敘述順序相反。","真性多血症的紅血球增殖是EPO非依賴性（autonomous）的，並非依賴EPO刺激。","（正確）實質性血小板血症特徵為血小板形態異常，出現巨大血小板及強烈顆粒性，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_046","year":2017,"roc_year":106,"session":"2","examNo":46,"q":"下列何種凝血因子可使纖維蛋白單體（monomer）變成不溶性纖維蛋白？","opts":["A. 第X因子","B. 第XI因子","C. 第XII因子","D. 第XIII因子"],"ans":3,"exp":"第XIII凝血因子（纖維蛋白穩定因子，fibrin-stabilizing factor）在Thrombin活化後，可使可溶性纖維蛋白單體（monomer）之間形成共價交聯（covalent cross-links），成為不溶性纖維蛋白聚合物，使血凝塊穩定。","we":["第X因子（Stuart-Prower factor）活化Prothrombin為Thrombin，屬共同徑路，不參與纖維蛋白交聯。","第XI因子（plasma thromboplastin antecedent）活化第IX因子，屬內因徑路，不參與纖維蛋白交聯。","第XII因子（Hageman factor）啟動內因徑路，不參與纖維蛋白單體的交聯穩定。","（正確）第XIII因子（纖維蛋白穩定因子）使纖維蛋白單體形成共價交聯，轉變為不溶性穩定纖維蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_047","year":2017,"roc_year":106,"session":"2","examNo":47,"q":"下列何者最可能出現嗜酸性球增多症？","opts":["A. 低腎上腺皮質功能症","B. 高腎上腺皮質功能症","C. 急性全身性感染","D. 緊迫"],"ans":0,"exp":"低腎上腺皮質功能症（Addison's disease）缺乏皮質醇，因此失去抑制嗜酸性球的作用，嗜酸性球數量上升，出現嗜酸性球增多症。高皮質醇、急性感染、緊迫均使嗜酸性球減少。","we":["（正確）低腎上腺皮質功能症缺乏皮質醇，失去對嗜酸性球的抑制，最易出現嗜酸性球增多症。","高腎上腺皮質功能症（Cushing's）皮質醇過多，抑制嗜酸性球，造成嗜酸性球減少症。","急性全身性感染時皮質醇應激性升高，嗜酸性球受抑制而減少，不會出現增多症。","緊迫狀態下皮質醇升高，抑制嗜酸性球，造成嗜酸性球減少，不出現增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_048","year":2017,"roc_year":106,"session":"2","examNo":48,"q":"急性未代償性之散播性血管內凝血（DIC）最不可能出現之凝血相關檢驗結果為","opts":["A. 血小板增多","B. activated partial thromboplastin time延長","C. prothrombin time及activated partial thromboplastin time皆延長","D. fibrin degradation products濃度上升"],"ans":0,"exp":"急性未代償性DIC的特徵是大量消耗血小板及凝血因子，因此血小板減少（thrombocytopenia）而非增多。DIC時aPTT延長、PT延長、FDP/D-dimer升高均是典型表現。「血小板增多」最不可能出現於DIC。","we":["（正確）急性DIC消耗血小板，造成血小板減少症，血小板增多是最不可能出現的表現。","aPTT延長見於DIC（消耗內因徑路凝血因子），是可能出現的結果。","PT及aPTT皆延長見於DIC晚期（廣泛凝血因子消耗），是典型表現。","FDP（纖維蛋白降解產物）濃度上升見於DIC（繼發性纖維溶解增加），是典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_049","year":2017,"roc_year":106,"session":"2","examNo":49,"q":"犬再生性貧血時，若血容比為25％，網狀球成熟時間約為多久？","opts":["A. 2天","B. 75小時","C. 23小時","D. 4天"],"ans":0,"exp":"犬再生性貧血時網狀球成熟時間計算：正常血容比（PCV）約45%，貧血時PCV 25%，成熟時間=正常基準天數×(正常PCV/實際PCV) = 1天×(45/25)≈2天（採用公式maturation time = 1 + [(normal PCV - patient PCV)/15]，即1+(45-25)/15 ≈ 2.3天，約2天）。","we":["（正確）犬PCV 25%時，網狀球成熟時間約2天（依校正公式計算）。","75小時（約3天）超出正確範圍，計算值不符合網狀球校正公式結果。","23小時（約1天）為正常動物的網狀球成熟時間，貧血時應延長，不適用。","4天過長，通常嚴重貧血（PCV<15%）才達到此成熟時間延長程度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_050","year":2017,"roc_year":106,"session":"2","examNo":50,"q":"牛血糖值至少超過多少mg/dL時，即可驗到尿糖？","opts":["A. 60","B. 100","C. 180","D. 240"],"ans":3,"exp":"牛的腎臟葡萄糖閾值（renal threshold）約為180-200 mg/dL，但牛的實際腎閾值較高，達到240 mg/dL以上才能在尿液中檢出葡萄糖。（牛的腎閾值高於犬的180 mg/dL）","we":["60 mg/dL為正常血糖範圍，遠低於腎閾值，不會出現尿糖。","100 mg/dL仍在正常或輕度高血糖範圍，低於牛的腎閾值，不會出現尿糖。","180 mg/dL為犬的腎閾值，牛的腎閾值高於此值，達180 mg/dL時牛不一定出現尿糖。","（正確）牛的腎閾值約為240 mg/dL，血糖超過此值才能在尿中檢出葡萄糖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_051","year":2017,"roc_year":106,"session":"2","examNo":51,"q":"那一種動物不能以口服葡萄糖耐受性試驗（oral glucose tolerance test）來評估該動物的碳水化合物平衡狀\r 態？","opts":["A. 馬","B. 牛","C. 犬","D. 豬"],"ans":1,"exp":"牛（反芻動物）不能以口服葡萄糖耐受性試驗（OGTT）評估碳水化合物代謝，因為反芻動物的瘤胃菌群會迅速發酵葡萄糖，葡萄糖無法有效從消化道吸收入血液，OGTT結果不可靠。反芻動物需使用靜脈注射葡萄糖耐受性試驗（IV-GTT）。","we":["馬可進行口服葡萄糖耐受性試驗（雖有限制），主要用於評估澱粉消化吸收，可應用。","（正確）牛為反芻動物，瘤胃菌群發酵葡萄糖，無法有效進行口服葡萄糖耐受性試驗。","犬可進行標準口服葡萄糖耐受性試驗，是常用的糖尿病篩查方法。","豬為單胃動物，可進行口服葡萄糖耐受性試驗，不受反芻動物瘤胃的限制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_052","year":2017,"roc_year":106,"session":"2","examNo":52,"q":"一隻14歲6公斤重的馬爾濟斯犬，長期有出現高血脂症的現象，每天吃飽就會睡覺，喝水量約為350 mL，最\r 可能的初步診斷為","opts":["A. hypothyroidism","B. diabetes mellitus","C. hepatic lipidosis","D. pyometra"],"ans":0,"exp":"14歲老年馬爾濟斯犬、長期高血脂症、嗜睡（吃飽就睡）、正常飲水量（350 mL/6 kg ≈ 58 mL/kg，在正常範圍）——最符合甲狀腺功能低下症（hypothyroidism）的臨床特徵：肥胖、高血脂症、嗜睡，且無多飲多尿。","we":["（正確）老年犬長期高血脂症合併嗜睡、無多飲多尿，最符合甲狀腺功能低下症的典型表現。","糖尿病（diabetes mellitus）通常表現多飲多尿（PU/PD）及體重減輕，本題飲水量正常且無此描述，不符合。","肝臟脂肪浸潤（hepatic lipidosis）在貓較常見，犬較少見，且通常有更明顯的肝病症狀和急性表現。","子宮蓄膿（pyometra）主要表現為陰道分泌物、多飲多尿、腹部膨大，本題公犬無此可能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_053","year":2017,"roc_year":106,"session":"2","examNo":53,"q":"罹患慢性肝病時，病畜的血清蛋白變化為何？","opts":["A. 白蛋白增高，γ-球蛋白降低，Ａ/G ratio增高","B. 白蛋白降低，β-球蛋白降低，Ａ/G ratio降低","C. 白蛋白降低，高球蛋白血症，Ａ/G ratio降低","D. 白蛋白降低，低球蛋白血症，Ａ/G ratio增高"],"ans":2,"exp":"慢性肝病時，肝臟合成白蛋白能力下降→白蛋白降低；同時慢性炎症和抗原刺激使γ-球蛋白（免疫球蛋白）升高（高球蛋白血症）；白蛋白降低且球蛋白升高，導致A/G比例降低。","we":["慢性肝病時白蛋白應降低而非增高，A/G ratio應降低而非增高，此選項描述完全相反。","β-球蛋白降低不是慢性肝病的典型表現；A/G ratio降低部分正確，但β-球蛋白描述不符。","（正確）慢性肝病：白蛋白降低、γ-球蛋白升高（高球蛋白血症）、A/G ratio降低，此描述正確。","慢性肝病時球蛋白通常升高（非低球蛋白血症）；A/G ratio應降低而非增高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_054","year":2017,"roc_year":106,"session":"2","examNo":54,"q":"關於血氨（ammonia）的檢測下列敘述何者正確？","opts":["A. 需用ammonia-free EDTA之抗凝血","B. 採血後應立即分離血漿做檢驗，否則需即時冷凍保存","C. 即時檢測之目的在防止血氨與其他離子發生作用","D. 需用進食後的血液進行檢測"],"ans":0,"exp":"血氨檢測需使用無氨的EDTA（ammonia-free EDTA）抗凝管，因普通EDTA管含銨鹽會造成假高值。採血後需立即置於冰水中並於30分鐘內完成血漿分離，以防止紅血球代謝繼續產生氨；使用空腹血液（非進食後）；即時檢測防止紅血球進一步代謝產氨。","we":["（正確）血氨檢測需用無氨的EDTA抗凝管，避免普通EDTA管中銨鹽造成的假高值干擾。","採血後需置於冰水中運送，分離血漿後若無法立即檢測，應冷藏（非冷凍）短暫保存，「冷凍保存」描述不夠精確。","即時檢測的目的是防止紅血球繼續代謝葡萄糖和氨基酸產生氨，使血氨值偏高，而非防止離子反應。","血氨檢測應使用空腹血液（至少禁食8小時），進食後蛋白質代謝會使血氨升高，「進食後血液」不適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_055","year":2017,"roc_year":106,"session":"2","examNo":55,"q":"下列那一種犬心絲蟲治療藥最常引發肝臟酵素及膽紅素上升？","opts":["A. melarsomine dihydrochloride","B. thiacetarsamide sodium","C. ivermectin","D. milbemycin oxime"],"ans":1,"exp":"Thiacetarsamide sodium（醋胂酸鈉）為含砷化合物，主要由肝臟代謝排泄，對肝臟有明顯毒性，最常引起肝臟酵素（ALT、AST、ALP）及膽紅素上升。目前已被melarsomine取代，但考題仍以其肝毒性為考點。","we":["Melarsomine dihydrochloride為肌肉注射製劑，主要副作用為注射部位肌炎及肺栓塞，肝毒性較少。","（正確）Thiacetarsamide sodium（含砷）主要由肝臟代謝，具明顯肝毒性，最常引起肝酵素及膽紅素上升。","Ivermectin為廣效驅蟲藥，主要用於預防心絲蟲，肝毒性不顯著，不是引起肝酵素上升的主要原因。","Milbemycin oxime為預防性藥物，副作用主要為神經毒性（極少），不以肝毒性著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_056","year":2017,"roc_year":106,"session":"2","examNo":56,"q":"完全的膽汁鬱滯性高膽紅素血症時，可見到下列那種現象？","opts":["A. 血中結合態膽紅素量增加","B. 尿中膽紅素量正常","C. 血中總膽紅素量正常","D. 糞便顏色呈現橙黃色"],"ans":0,"exp":"完全膽汁鬱滯性高膽紅素血症時，膽汁無法排入腸道，結合型（直接）膽紅素在血中蓄積：血中結合型膽紅素增加；結合型膽紅素為水溶性，可由腎臟排出，故尿膽紅素增加（非正常）；血中總膽紅素升高（非正常）；膽汁無法進入腸道，糞便顏色變灰白（陶土色），非橙黃色。","we":["（正確）完全膽汁鬱滯時，結合型（直接）膽紅素無法排入腸道，在血中大量蓄積，血中結合型膽紅素增加。","結合型膽紅素為水溶性，可由腎臟濾出，完全膽汁鬱滯時尿膽紅素應增加而非正常。","完全膽汁鬱滯時大量膽紅素蓄積，血中總膽紅素應顯著升高而非正常。","完全膽汁鬱滯時膽汁無法進入腸道，糞便呈灰白色（陶土色），而非橙黃色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_057","year":2017,"roc_year":106,"session":"2","examNo":57,"q":"動物僅分泌何種澱粉酶之異構酶？","opts":["A. α","B. β","C. γ","D. δ"],"ans":0,"exp":"動物體內只分泌α-澱粉酶（α-amylase）的同工酶。α-澱粉酶分解澱粉的α-1,4糖苷鍵；β-澱粉酶主要見於植物；γ-澱粉酶（葡萄糖澱粉酶）見於植物；動物不產生β或γ型澱粉酶。","we":["（正確）動物僅分泌α-澱粉酶的同工酶，包括胰源性（P型）和唾液腺源性（S型）兩種。","β-澱粉酶主要存在於植物（大麥、小麥等）中，動物不分泌β-澱粉酶。","γ-澱粉酶（葡萄糖澱粉酶）主要存在於植物及微生物中，動物不分泌γ型澱粉酶。","δ-澱粉酶不是正式分類的澱粉酶型別，動物不存在此型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_058","year":2017,"roc_year":106,"session":"2","examNo":58,"q":"一般而言，犬罹患exocrine pancreatic insufficiency時，最常出現的血檢變化為何？","opts":["A. folate↓，vitamin B 12 ↓，TLI↓","B. folate↑，vitamin B 12 ↓，TLI↓","C. folate↑，vitamin B 12 ↓，TLI↑","D. folate↓，vitamin B 12 ↓，TLI↑"],"ans":1,"exp":"犬外分泌性胰臟功能不全（EPI）時：(1) 因小腸細菌過度增殖，細菌消耗葉酸使folate下降，同時細菌合成維生素B12使B12下降不一定——但EPI時小腸吸收障礙使B12降低；(2) TLI（trypsin-like immunoreactivity）降低（胰臟分泌不足）。典型：folate↑（某些描述folate因bacteria過度增殖升高），B12↓（吸收不良），TLI↓。","we":["Folate↓+B12↓+TLI↓：folate不應降低，EPI時細菌過度增殖反而使folate升高，此選項folate方向錯誤。","（正確）EPI典型結果：folate↑（細菌過度增殖合成folate）、vitamin B12↓（迴腸吸收不良）、TLI↓（胰臟分泌不足）。","TLI↑表示胰臟分泌增加，與EPI相反；EPI的TLI應為降低，此選項TLI方向錯誤。","Folate↓+B12↓+TLI↑：folate及TLI方向均不符合EPI的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_059","year":2017,"roc_year":106,"session":"2","examNo":59,"q":"下列何種動物的high density lipoprotein比low density lipoprotein多5～6倍？","opts":["A. 牛","B. 豬","C. 貓","D. 犬"],"ans":3,"exp":"犬的血清脂蛋白以HDL為主，HDL濃度比LDL高出5-6倍，因此犬為「HDL優勢」動物（HDL-rich species）。貓、牛、豬的脂蛋白分布比例不同，不符合此特徵。","we":["牛以VLDL和LDL為主要脂蛋白，HDL並非高於LDL 5-6倍。","豬的脂蛋白分布類似人類，LDL比例相對較高，HDL不高於LDL 5-6倍。","貓以HDL為主，但比例不達HDL高於LDL 5-6倍的程度。","（正確）犬為HDL優勢動物，血清中HDL濃度比LDL高5-6倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_060","year":2017,"roc_year":106,"session":"2","examNo":60,"q":"使用免疫電泳法來區分肌酸激酶（creatine kinase）的異構酶中，下列何者最靠近陽極？","opts":["A. CK1","B. CK2","C. CK3","D. CK-Mt"],"ans":0,"exp":"肌酸激酶（CK）免疫電泳中：CK1（BB型，腦）帶最多負電，移動最快，最靠近陽極；CK2（MB型，心肌）居中；CK3（MM型，骨骼肌）最靠近陰極；CK-Mt（粒線體型）留在原點附近。","we":["（正確）CK1（BB型）主要來自腦組織，帶電量最大，電泳移動最快，最靠近陽極。","CK2（MB型）來自心肌，電泳位置介於CK1和CK3之間，不是最靠近陽極。","CK3（MM型）來自骨骼肌，為最大分子，帶電量最小，最靠近陰極端。","CK-Mt（粒線體型）帶電量最少，幾乎留在原點，最遠離陽極。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_061","year":2017,"roc_year":106,"session":"2","examNo":61,"q":"肌酸激酶（creatine kinase）和乳酸鹽脫氫酶（lactate dehydrogenase）檢測時，若CK2（MB）及LDH1活性\r 值上升，表示何種意義？","opts":["A. 骨骼肌之退行性變化","B. 心肌之退行性變化","C. 溶血","D. 腦病"],"ans":1,"exp":"CK2（MB亞型）主要來自心肌，LDH1（HHHH型）主要分布於心肌及紅血球。當CK2-MB及LDH1同時上升，表示心肌（cardiac muscle）發生退行性變化或損傷（心肌炎、心肌梗塞等）。","we":["骨骼肌退行性變化以CK3（MM型）及LDH5（MMMM型）上升為主，不是CK2-MB及LDH1。","（正確）CK2（MB型）及LDH1同時上升是心肌損傷的特異性指標，反映心肌退行性變化。","溶血時LDH1升高（紅血球來源），但CK2-MB不上升，不能以此組合診斷溶血。","腦病時CK1（BB型）升高，不是CK2-MB；LDH亞型也不以LDH1為主要上升型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_062","year":2017,"roc_year":106,"session":"2","examNo":62,"q":"犬尿比重低於多少時，表示溶質之重吸收大於水？","opts":["A. 1.008","B. 1.025","C. 1.035","D. 1.065"],"ans":0,"exp":"犬尿比重1.008（等滲尿）表示溶質重吸收與水的重吸收達到平衡。當尿比重低於1.008時（低滲尿），表示腎臟對水的重吸收超過溶質，即溶質重吸收相對大於水的留存（實際上是腎臟稀釋尿液能力正常但ADH反應相對不足）。","we":["（正確）尿比重低於1.008（低滲）表示腎臟對水的清除大於溶質，即溶質重吸收相對大於水的淨重吸收。","1.025為犬最低適當濃縮能力的閾值，高於此值表示腎臟有足夠濃縮功能，與本題問的相反。","1.035為犬正常良好尿濃縮的指標，不是「溶質重吸收大於水」的臨界值。","1.065為極度濃縮尿，表示腎臟濃縮功能良好，非本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_063","year":2017,"roc_year":106,"session":"2","examNo":63,"q":"肌酸（creatine）主要在那裡合成？","opts":["A. 肝臟","B. 骨骼肌","C. 腎臟","D. 腸道"],"ans":0,"exp":"肌酸（creatine）的合成分兩步：第一步在腎臟，由精氨酸和甘氨酸合成胍基乙酸（guanidinoacetate）；第二步在肝臟，由甲基化反應將胍基乙酸轉化為肌酸。因此肌酸的主要合成場所為腎臟（第一步）和肝臟（第二步），腎臟是起始合成的主要場所。","we":["（正確）肌酸合成的第一步（由精氨酸+甘氨酸→胍基乙酸）主要在腎臟進行，為肌酸的主要起始合成場所。","骨骼肌是肌酸的儲存和利用場所（肌酸→磷酸肌酸），不是合成場所。","腎臟是肌酸合成的第一步場所，肝臟為第二步（甲基化），但第一步起始合成在腎臟。","腸道不是肌酸合成的主要場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_064","year":2017,"roc_year":106,"session":"2","examNo":64,"q":"活性型維生素D 3 主要於何處產生？","opts":["A. 腎臟","B. 肝臟","C. 小腸","D. 骨骼"],"ans":0,"exp":"活性型維生素D3（1,25-二羥維生素D3，calcitriol）主要在腎臟近端小管細胞中，由25-羥維生素D3經1α-羥化酶作用轉化生成。腎臟疾病時此步驟受阻，導致鈣磷代謝異常。","we":["（正確）活性型維生素D3（calcitriol）主要在腎臟近端小管由1α-羥化酶催化生成。","肝臟負責將維生素D3羥化為25-羥維生素D3（中間產物），不是活性型的生成場所。","小腸是活性維生素D3的作用目標器官（促進鈣磷吸收），不是生成場所。","骨骼是活性維生素D3的作用靶器官（促進骨鈣重吸收），不是生成場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_065","year":2017,"roc_year":106,"session":"2","examNo":65,"q":"突然不給飲水試驗中，牛馬的尿比重達多少時，即判定腎臟有足夠之尿濃縮能力？","opts":["A. 1.008","B. 1.025","C. 1.030","D. 1.035"],"ans":2,"exp":"突然不給飲水試驗（water deprivation test）中，牛和馬的尿比重達到1.030以上即判定腎臟有足夠濃縮能力。犬貓的標準不同（需達1.030-1.035以上）。1.025為等滲點以上但尚不足以判定牛馬的濃縮能力；1.035為犬貓的標準。","we":["1.008為等滲尿，表示腎臟無濃縮能力，遠低於判定標準，不符合。","1.025對牛馬而言不足以判定有足夠濃縮能力，此值仍偏低。","（正確）牛馬突然不給飲水後，尿比重達1.030以上即判定腎臟有足夠的尿濃縮能力。","1.035為犬貓的判定標準，不適用於牛馬；牛馬尿液最大濃縮能力較犬貓低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_066","year":2017,"roc_year":106,"session":"2","examNo":66,"q":"那種原因最不可能造成犬尿液偏鹼性？","opts":["A. 代謝性酸中毒","B. 呼吸性鹼中毒","C. Proteus感染所引起之膀胱炎","D. 進食後"],"ans":0,"exp":"代謝性酸中毒時，腎臟代償性增加H+分泌、保留HCO3-，尿液呈酸性（pH降低），而非偏鹼性。呼吸性鹼中毒、Proteus引起的膀胱炎（產尿素酶分解尿素產NH3）、進食後（鹼潮現象）均可使尿液偏鹼。","we":["（正確）代謝性酸中毒時腎臟代償性排酸，尿液呈酸性，最不可能造成尿液偏鹼性。","呼吸性鹼中毒時腎臟代償性增加HCO3-排出，尿液偏鹼，可造成鹼性尿。","Proteus產尿素酶分解尿素生成NH3及CO2，使尿液偏鹼，可造成鹼性尿。","進食後胃酸分泌增加，血液暫時偏鹼（鹼潮），腎臟排出鹼性尿，可造成鹼性尿。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_067","year":2017,"roc_year":106,"session":"2","examNo":67,"q":"下列何者不是犬高腎上腺皮質功能症（canine hyperadrenocorticism）常見之白血球相？","opts":["A. 淋巴球減少症","B. 嗜酸性球減少症","C. 單核球減少症","D. 嗜中性球增多症"],"ans":2,"exp":"犬高腎上腺皮質功能症（Cushing's）典型白血球相為：嗜中性球增多症、淋巴球減少症、嗜酸性球減少症、單核球增多症（非減少症）。因此單核球「減少症」不是此症候群的表現，C為不常見/不符合的選項。","we":["淋巴球減少症是犬高腎上腺皮質功能症的典型表現（皮質醇抑制淋巴球），非錯誤選項。","嗜酸性球減少症是犬高腎上腺皮質功能症的典型表現（皮質醇抑制嗜酸性球），非錯誤選項。","（正確）犬高腎上腺皮質功能症通常出現「單核球增多症」，而非單核球減少症，C項錯誤。","嗜中性球增多症是犬高腎上腺皮質功能症的典型表現（皮質醇刺激骨髓釋出），非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_068","year":2017,"roc_year":106,"session":"2","examNo":68,"q":"犬血液中T4大多是與下列何種蛋白結合？","opts":["A. albumin","B. high density lipoprotein","C. thyroxine binding prealbumin","D. thyroxine binding globulin"],"ans":0,"exp":"犬血液中T4主要與白蛋白（albumin）結合（約50-60%），其次與α-球蛋白中的甲狀腺素結合前白蛋白（TBPA）結合。不同於人類T4主要與thyroxine binding globulin（TBG）結合，犬缺乏TBG，以白蛋白為主要結合蛋白。","we":["（正確）犬T4主要與白蛋白（albumin）結合，因犬缺乏人類的thyroxine binding globulin（TBG）。","高密度脂蛋白（HDL）不是甲狀腺素的主要載體蛋白，T4不與HDL結合。","甲狀腺素結合前白蛋白（TBPA）在犬中也可結合少量T4，但不是最主要的結合蛋白。","Thyroxine binding globulin（TBG）是人類T4的主要結合蛋白，但犬缺乏此蛋白，不適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_069","year":2017,"roc_year":106,"session":"2","examNo":69,"q":"下列何者最適合用來監控糖尿病之治療效果？","opts":["A. 血糖值","B. 尿糖值","C. 血清胰島素濃度","D. 血清果糖胺濃度"],"ans":3,"exp":"血清果糖胺（fructosamine）反映過去2-3週的平均血糖水平，不受短期血糖波動影響，是監控糖尿病治療效果的最佳指標（類似人類的HbA1c）。血糖值只反映當時狀態；尿糖受腎閾值影響；血清胰島素濃度反映分泌功能而非控制效果。","we":["血糖值只反映採血當時的血糖狀態，受飲食、緊迫等多種因素影響，不適合監控長期治療效果。","尿糖值受腎閾值影響，且只反映近期血糖是否超過腎閾，不是監控治療效果的最佳方法。","血清胰島素濃度反映胰臟β細胞的分泌功能，不直接反映血糖控制效果。","（正確）血清果糖胺反映2-3週平均血糖，不受短期波動影響，是監控糖尿病治療效果的最佳長期指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_070","year":2017,"roc_year":106,"session":"2","examNo":70,"q":"下列何者最會抑制transmembrane potential（造成心跳變慢，嚴重時心跳停止）？","opts":["A. 高血鉀症","B. 低血鉀症","C. 高血鈣症","D. 低血鈣症"],"ans":0,"exp":"高血鉀症使細胞外鉀離子濃度升高，導致靜止膜電位（resting membrane potential）去極化，心肌跨膜電位差減少（transmembrane potential降低），造成傳導減緩、心跳變慢，嚴重時心跳停止（心室纖維顫動或停跳）。","we":["（正確）高血鉀症使細胞外K+升高，靜止膜電位去極化，抑制transmembrane potential，造成心跳變慢甚至停止。","低血鉀症使靜止膜電位超極化，心肌興奮性降低，但主要引起心律不整而非直接停跳。","高血鈣症影響心肌收縮力，可使心跳變慢，但主要機制不是抑制transmembrane potential。","低血鈣症使神經肌肉興奮性增加（tetany），通常不直接抑制transmembrane potential造成心跳停止。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_071","year":2017,"roc_year":106,"session":"2","examNo":71,"q":"犬之皮膚失去彈性導致拉起後緩慢回復、微血管再充血時間（CRT）為2～3秒，推估此犬之脫水程度為多\r 少？","opts":["A. 5%以下","B. 5～7%","C. 8～10%","D. 10%以上"],"ans":2,"exp":"皮膚失彈性（拉起後緩慢回復）且CRT為2-3秒（正常<2秒），對應脫水程度約8-10%。脫水5-7%時皮膚稍失彈性但CRT正常；8-10%時皮膚明顯失彈性且CRT延長至2-3秒；>10%則更嚴重（眼球凹陷、休克前兆）。","we":["5%以下脫水通常無明顯臨床症狀，皮膚彈性正常，CRT<2秒，不符合本題描述。","5-7%脫水時皮膚輕度失彈性，CRT仍在正常範圍（<2秒），不符合CRT 2-3秒的描述。","（正確）皮膚失彈性且CRT 2-3秒對應脫水8-10%，符合中度脫水的評估標準。","10%以上脫水更嚴重，通常伴有眼球凹陷、黏膜乾燥、CRT>3秒及休克前兆，超出本題描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_072","year":2017,"roc_year":106,"session":"2","examNo":72,"q":"健康犬之HCO 3 - /H 2 CO 3 比約為","opts":["A. 10：1","B. 20：1","C. 30：1","D. 40：1"],"ans":1,"exp":"Henderson-Hasselbalch方程式：pH = pKa + log([HCO3-]/[H2CO3])。在pH 7.4時，[HCO3-]/[H2CO3] = 10^(7.4-6.1) = 10^1.3 ≈ 20:1。健康動物的HCO3-/H2CO3比約為20:1，pH維持在7.4。","we":["10:1的比例對應pH約7.1（pKa 6.1 + log10 = 7.1），偏低，不符合健康犬的生理pH 7.4。","（正確）20:1的比例對應pH = 6.1 + log20 = 6.1 + 1.3 = 7.4，符合健康犬的正常血液pH。","30:1的比例對應pH約7.58，偏鹼性，不符合正常生理狀態。","40:1的比例對應pH約7.7，明顯偏鹼，不符合健康犬的生理pH值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_073","year":2017,"roc_year":106,"session":"2","examNo":73,"q":"馬經過激烈運動後，出現乳酸性酸中毒的現象，則其實驗室檢查結果可能包括：①高血鈉症 ②高血鉀症  ③血清氯離子（Cl - ）增加 ④血漿重碳酸基（HCO 3 - ）減少 ⑤pH＜7.36 ⑥陰離子差（AG）增大","opts":["A. ①②⑤⑥","B. ①③④⑥","C. ①②③⑤","D. ②④⑤⑥"],"ans":3,"exp":"乳酸性酸中毒的實驗室特徵：②高血鉀症（酸中毒使K+從細胞內移出）；④血漿HCO3-減少（緩衝酸）；⑤pH<7.36（酸中毒）；⑥陰離子差（AG=Na+-(Cl-+HCO3-)）增大（乳酸根為未計量陰離子）。氯離子不一定增加（AG型代謝性酸中毒，Cl-通常正常或降低），高血鈉症不典型。","we":["①高血鈉症不是乳酸性酸中毒的典型表現；③血清Cl-不增加（此為AG型酸中毒，Cl-不升高）；選項①②⑤⑥含①高鈉不對。","①高血鈉症不典型；③Cl-增加屬高氯性酸中毒，非乳酸酸中毒；④HCO3-確實減少，但③錯。","①高血鈉症不典型；③Cl-不增加；⑤pH<7.36正確，但①③組合不符。","（正確）②高血鉀症+④HCO3-減少+⑤pH<7.36+⑥AG增大，為乳酸性（AG型）代謝性酸中毒的典型組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_074","year":2017,"roc_year":106,"session":"2","examNo":74,"q":"單純創傷造成膽囊破裂所導致的滲液可能屬於","opts":["A. 純粹性漏出液","B. 修飾性漏出液","C. 非化膿性滲出液","D. 膿性滲出液"],"ans":2,"exp":"單純創傷造成膽囊破裂，膽汁漏入腹腔，初期為化學性刺激（非感染性），細胞數中等，蛋白質含量較高，屬非化膿性滲出液（non-septic exudate）。漏出液蛋白質低、細胞少；化膿性滲出液需有細菌感染；修飾性漏出液蛋白質介於漏出液和滲出液之間。","we":["純粹性漏出液（pure transudate）蛋白質極低（<2.5 g/dL）、細胞極少，不符合膽汁性腹水的特徵。","修飾性漏出液（modified transudate）蛋白質中等（2.5-5 g/dL），見於心衰竭、肝病等，膽囊破裂初期可能，但更準確應為非化膿性滲出液。","（正確）膽囊破裂初期為無菌性化學性腹膜炎，呈非化膿性滲出液（non-septic exudate），蛋白質高、細胞數中至高，以巨噬細胞為主。","膿性滲出液需有細菌感染，單純創傷性膽囊破裂初期無細菌感染，不符合膿性滲出液的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_075","year":2017,"roc_year":106,"session":"2","examNo":75,"q":"病毒感染時，腦脊髓液可能引起多細胞症，通常以下列何種細胞占多數？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 血小板","D. 淋巴球"],"ans":3,"exp":"病毒感染引起的腦膜炎/腦炎，腦脊髓液（CSF）細胞增多症（pleocytosis）主要以淋巴球為主（單核球型多細胞症），反映病毒誘發的免疫反應。細菌感染時以嗜中性球為主（化膿性）；真菌感染也可能有嗜酸性球。","we":["嗜中性球為主的CSF細胞增多見於細菌性腦膜炎（化膿性），不是病毒感染的典型表現。","嗜酸性球為主的CSF細胞增多罕見，可見於某些寄生蟲（如Baylisascaris）感染，不是病毒感染的典型。","血小板不是CSF的正常或病理性增多細胞，不適用於本題。","（正確）病毒感染引起的CSF多細胞症以淋巴球為主，反映淋巴球性（單核球型）腦膜炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_076","year":2017,"roc_year":106,"session":"2","examNo":76,"q":"下列何種腫瘤不屬於紡錘型細胞腫瘤（spindle cell tumor）？","opts":["A. lipoma","B. fibroma","C. plasmacytoma","D. hemangiosarcoma"],"ans":2,"exp":"漿細胞瘤（plasmacytoma）為圓形細胞腫瘤（round cell tumor），不是紡錘型細胞腫瘤。紡錘型細胞腫瘤包括：纖維瘤（fibroma）、脂肪瘤（lipoma，雖脂肪細胞本身為圓形，但纖維母細胞成分可呈紡錘形）、血管肉瘤（hemangiosarcoma）等間葉來源腫瘤。","we":["Lipoma（脂肪瘤）雖主要由脂肪細胞組成，但間質纖維成分呈紡錘形，廣義歸類為間葉腫瘤，部分分類包含其中。","Fibroma（纖維瘤）為纖維母細胞來源，細胞呈紡錘形，是典型的紡錘型細胞腫瘤。","（正確）Plasmacytoma（漿細胞瘤）來源為漿細胞（淋巴系），細胞呈圓形，屬圓形細胞腫瘤，不是紡錘型細胞腫瘤。","Hemangiosarcoma（血管肉瘤）來源於血管內皮細胞，細胞呈紡錘形，是紡錘型細胞腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_077","year":2017,"roc_year":106,"session":"2","examNo":77,"q":"下列有關於關節囊液之敘述，何者錯誤？","opts":["A. 於大部分動物都是無色，但馬可能呈淡黃色","B. 細菌感染及關節水腫及發炎時，其黏稠度會增加","C. 正常之關節囊液不含纖維素原，故不會形成凝塊","D. 混濁表示有細胞及纖維素量之增加，亦即為炎症性者，有絮狀物可能表示軟骨之退行性變化"],"ans":1,"exp":"細菌感染及發炎性關節炎時，關節囊液黏稠度會「降低」（而非增加），因為玻尿酸被細菌或炎症細胞釋放的玻尿酸酶（hyaluronidase）分解，導致黏稠度下降、液體量增加。B項「黏稠度增加」與實際相反，為錯誤敘述。","we":["大部分動物關節囊液確實為無色透明，馬可能呈淡黃色，敘述正確，非錯誤選項。","（正確）細菌感染及炎症時關節囊液黏稠度應「降低」（玻尿酸被酶分解），「增加」之說法錯誤。","正常關節囊液不含纖維素原，不會自然凝塊，敘述正確，非錯誤選項。","混濁表示細胞及纖維素增加（炎症性），絮狀物可能表示軟骨退行性變化，敘述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_078","year":2017,"roc_year":106,"session":"2","examNo":78,"q":"貓傳染性腹膜炎之腹水抹片經Wright's stain，呈現許多紅色沉澱物，這些沉澱物可能為下列何者？","opts":["A. 脂肪球","B. 球蛋白","C. 澱粉粒","D. 嗜酸性球之細胞核破碎物"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）的腹水含有大量蛋白質，主要為球蛋白（globulin）。Wright's stain染色後，這些蛋白質沉澱物呈現紅色（嗜酸性）沉澱物。FIP腹水高球蛋白含量（>3.5 g/dL）及蛋白質電泳以γ球蛋白為主，為其特徵之一。","we":["脂肪球（lipid droplets）在染色後呈圓形空泡或淡染，不呈紅色沉澱物分布形態。","（正確）FIP腹水含大量球蛋白，Wright's stain後蛋白質沉澱呈紅色（嗜酸性）沉澱物。","澱粉粒（amyloid）在特殊染色（Congo red）時可見，Wright's stain不呈典型紅色顆粒沉澱。","嗜酸性球核破碎物形態上為碎片狀，且不是FIP腹水的主要成分，不符合大量紅色沉澱的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1062_實診_080","year":2017,"roc_year":106,"session":"2","examNo":80,"q":"承上題，上述病犬的血檢中最有可能還會出現那種異常？","opts":["A. GGT上升","B. BUN下降","C. hypercalcemia","D. 血糖上升"],"ans":2,"exp":"本題為「承上題」，上題（Q79，本檔案中無該題）描述的應為淋巴瘤病犬（依r4的Q80位置推斷為T細胞淋巴瘤或高鈣血症相關腫瘤）。淋巴瘤（尤其T細胞性）常伴隨副腫瘤性高鈣血症（hypercalcemia），因腫瘤細胞分泌PTHrP（副甲狀腺素相關蛋白）所致。","we":["GGT上升主要見於膽汁鬱滯或腎上腺皮質功能亢進，不是淋巴瘤的特徵性血檢異常。","BUN下降見於肝衰竭（尿素合成減少）或過度輸液，不是淋巴瘤的典型表現。","（正確）T細胞性淋巴瘤常伴隨副腫瘤性高鈣血症（hypercalcemia），因腫瘤細胞分泌PTHrP，為最常見的伴隨血檢異常。","血糖上升見於糖尿病或高皮質醇症，不是淋巴瘤的特徵性表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_001","year":2018,"roc_year":107,"session":"1","examNo":1,"q":"下列何種檢查結果在慢性散播性血管內凝血（DIC）病例中最容易穩定上升？","opts":["A. 纖維素原（fibrinogen）濃度","B. 血小板數目","C. 纖維素降解產物（FDP）濃度","D. 活化凝血時間（ACT）"],"ans":2,"exp":"慢性散播性血管內凝血（DIC）時，持續性纖維素形成與溶解使FDP（纖維素降解產物）穩定上升，是最可靠的指標。fibrinogen在慢性DIC中可能因急性期反應而正常或升高，但不如FDP穩定；血小板與ACT變化較不一致。","we":["A. fibrinogen在慢性DIC中因急性期蛋白效應可能正常或偏高，並不是最穩定上升的指標。","B. 血小板在慢性DIC中消耗後可被骨髓代償，數值不一定穩定下降，更不會穩定上升。","（正確）C. FDP為纖維素被纖維蛋白溶酶裂解的產物，慢性DIC持續溶纖，FDP最易穩定累積上升。","D. ACT在急性DIC時延長，慢性期變化不定，不是最易穩定上升的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_002","year":2018,"roc_year":107,"session":"1","examNo":2,"q":"有關犬隻淋巴瘤之症狀，下列敘述何者錯誤？","opts":["A. 胸腺型會發生呼吸及吞嚥困難","B. 多中心型可能出現多處淋巴結無痛性腫大","C. 皮膚型有潰瘍性紅斑，且通常會出現劇癢","D. 白血病型之骨髓及脾皆有病變，但淋巴結卻不一定有病變"],"ans":2,"exp":"犬皮膚型淋巴瘤（epitheliotropic lymphoma）雖可見潰瘍性紅斑與脫屑，但通常不會出現劇癢（pruritus），或僅有輕微搔癢；其他選項描述均正確。","we":["A. 胸腺型淋巴瘤因縱膈腫大壓迫食道與氣管，確實會引起呼吸及吞嚥困難，敘述正確。","B. 多中心型為最常見型，典型表現為多處淋巴結無痛性腫大，敘述正確。","（正確）C. 皮膚型淋巴瘤有潰瘍性紅斑，但通常不出現劇癢，此敘述錯誤，故為答案。","D. 白血病型病變主要在骨髓及脾，淋巴結不一定受波及，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_003","year":2018,"roc_year":107,"session":"1","examNo":3,"q":"下列有關犬淋巴瘤之實驗室診斷，何者正確？","opts":["A. 血片檢查一定可見腫瘤細胞","B. 骨髓片中一定可見腫瘤細胞","C. 於血片之羽狀末端較易找到淋巴胚細胞","D. 70％以上病犬有低蛋白血症"],"ans":2,"exp":"製備血片時，大型細胞（如淋巴胚細胞）因離心力作用較集中於羽狀末端，因此在血片羽狀末端（feathered edge）較易找到淋巴胚細胞，是正確的實驗室技術要點。","we":["A. 淋巴瘤病例血片中不一定能見到腫瘤細胞，尤其非白血病型者可能血片正常。","B. 骨髓片中並非所有淋巴瘤病例都有腫瘤細胞，白血病型才較常見骨髓浸潤。","（正確）C. 血片羽狀末端（feathered edge）聚集大型細胞，淋巴胚細胞體積大，在此處較易被發現。","D. 犬淋巴瘤約30%可見高蛋白血症，70%以上有低蛋白血症的說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_004","year":2018,"roc_year":107,"session":"1","examNo":4,"q":"有關牛胸腺－青年期（thymic-adolescent）型淋巴瘤之敘述，下列何者錯誤？","opts":["A. 特徵為胸腺腫大","B. 好發於6～30月齡","C. 常見有全身性淋巴瘤","D. 多為散發性"],"ans":2,"exp":"牛胸腺-青年期型淋巴瘤（thymic-adolescent lymphoma）特徵為胸腺腫大、好發於6～30月齡、多為散發性。常見有全身性淋巴瘤的說法錯誤，此型通常局限於胸腺，而非全身性分布。","we":["A. 特徵確為胸腺腫大，敘述正確。","B. 好發於6～30月齡為正確資訊。","（正確）C. 此型通常局限於胸腺，不常見全身性淋巴瘤，敘述錯誤，故為答案。","D. 多為散發性（非BLV相關），敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_005","year":2018,"roc_year":107,"session":"1","examNo":5,"q":"下列何者不是再生性貧血的特徵？","opts":["A. 多染色性（polychromasia）紅血球相","B. 網狀球（reticulocyte）增加","C. 大紅血球性（macrocytosis）紅血球相","D. M/E ratio偏高值"],"ans":3,"exp":"再生性貧血（regenerative anemia）特徵包括：多染色性紅血球（polychromasia）、網狀球增加、大紅血球性。骨髓M/E ratio（骨髓球系/紅血球系比值）在再生性貧血時因紅血球系增生旺盛而降低（偏低值），而非偏高值。","we":["A. 多染色性紅血球代表含RNA的幼稚紅血球，是再生性貧血的典型特徵。","B. 網狀球（reticulocyte）增加是判定再生性貧血最重要的指標。","C. 大紅血球性（macrocytosis）因骨髓快速釋放幼稚紅血球，MCV偏高，屬再生性貧血特徵。","（正確）D. 再生性貧血時紅血球系增生，M/E ratio應偏低而非偏高，故D不是再生性貧血特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_006","year":2018,"roc_year":107,"session":"1","examNo":6,"q":"下列何種白血球的增多最常和寄生蟲感染症或過敏性疾病有關？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 單核球"],"ans":1,"exp":"嗜酸性球（eosinophil）增多症最常與寄生蟲感染及過敏性（IgE媒介）疾病相關，因嗜酸性球在Type I過敏反應及抗寄生蟲免疫中扮演重要角色。","we":["A. 嗜中性球增多主要與細菌感染、發炎、壓力反應有關，不是寄生蟲/過敏的主要指標。","（正確）B. 嗜酸性球增多最常見於寄生蟲感染及過敏性疾病，為正確答案。","C. 嗜鹼性球增多較少見，可見於過敏或慢性炎症，但不是最常見的對應白血球。","D. 單核球增多主要見於慢性炎症、肉芽腫性疾病，而非寄生蟲/過敏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_007","year":2018,"roc_year":107,"session":"1","examNo":7,"q":"羅列小體（Döhle bodies）較常見於下列何種動物？","opts":["A. 牛","B. 貓","C. 犬","D. 豬"],"ans":1,"exp":"羅列小體（Döhle bodies）為嗜中性球細胞質中的RNA殘留灰藍色斑塊，在貓的正常嗜中性球中即可見到，屬貓的生理特徵；其他動物出現Döhle bodies通常代表毒性變化。","we":["A. 牛的嗜中性球不以Döhle bodies為常見特徵。","（正確）B. 貓的正常嗜中性球中即常見Döhle bodies，為貓的生理性特徵，故為正確答案。","C. 犬出現Döhle bodies通常代表毒性嗜中性球（toxic change），並非常態。","D. 豬不以Döhle bodies為常見特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_008","year":2018,"roc_year":107,"session":"1","examNo":8,"q":"成牛感染何種病毒時，會引起牛白血病（bovine leukosis）？","opts":["A. leukemia virus","B. coronavirus","C. enterovirus","D. calicivirus"],"ans":0,"exp":"成牛地方性白血病（enzootic bovine leukosis）由牛白血病病毒（Bovine Leukemia Virus, BLV）引起，BLV屬於反轉錄病毒科（Retroviridae）中的δ-retrovirus，俗稱leukemia virus。","we":["（正確）A. BLV（leukemia virus）即牛白血病病毒，是引起成牛白血病的病原，為正確答案。","B. Coronavirus引起牛冠狀病毒性腸炎與呼吸道疾病，不引起白血病。","C. Enterovirus引起消化道相關疾病，不引起白血病。","D. Calicivirus與貓杯狀病毒、兔出血症等有關，不引起牛白血病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1071_實診_009","year":2018,"roc_year":107,"session":"1","examNo":9,"q":"骨髓中下列那一種細胞系的增生並不屬於骨髓增殖性疾病（myeloproliferative disorder，MPD）之一？","opts":["A. 淋巴球系","B. 單核球系","C. 紅血球系","D
