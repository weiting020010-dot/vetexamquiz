血症（低白蛋白血症）。","嚴重滲出性皮膚病使蛋白質經皮膚大量流失，可導致低蛋白血症。","大量出血使全血蛋白質流失，輸液後蛋白質被稀釋，可導致低蛋白血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_039","year":2022,"roc_year":111,"session":"","examNo":39,"q":"血清蛋白質電泳時，下列何者負電荷最小，而停留在電泳的起點附近？","opts":["A. 白蛋白","B. α-球蛋白","C. β-球蛋白","D. γ-球蛋白"],"ans":3,"exp":"血清蛋白質電泳在 pH 8.6 的鹼性緩衝液中進行，所有蛋白質帶負電向正極移動。白蛋白負電荷最多，移動最快、最遠；γ-球蛋白負電荷最少（接近等電點），移動最慢，停留在電泳起點附近。","we":["白蛋白在 pH 8.6 下負電荷最多，移動距離最遠（最接近正極端），不停留於起點。","α-球蛋白負電荷次多，移動距離僅次於白蛋白，不停留於起點。","β-球蛋白負電荷中等，移動距離中等，不停留於起點。","（正確）γ-球蛋白負電荷最小（等電點最高），在電泳中移動最慢，停留在起點附近。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_040","year":2022,"roc_year":111,"session":"","examNo":40,"q":"脂肪細胞可分泌多種脂肪細胞激素（adipokines），調控脂質代謝、血管新生及參與免疫反應等，下列何者不\r  是 adipokines？","opts":["A. leptin","B. fibronectin","C. adiponectin","D. resistin"],"ans":1,"exp":"Adipokines 是脂肪細胞分泌的細胞激素，包括 leptin、adiponectin、resistin、visfatin 等。Fibronectin 是細胞外基質糖蛋白，由多種細胞（纖維母細胞、內皮細胞、肝細胞）分泌，並非脂肪細胞特異性的 adipokine。","we":["Leptin 是由脂肪細胞分泌的 adipokine，調控食慾與能量代謝，屬 adipokine。","（正確）Fibronectin 是細胞外基質成分，非脂肪細胞特異性分泌的 adipokine，為本題答案。","Adiponectin 由脂肪細胞大量分泌，具抗炎及胰島素增敏作用，屬 adipokine。","Resistin 由脂肪細胞分泌，與胰島素阻抗相關，屬 adipokine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_041","year":2022,"roc_year":111,"session":"","examNo":41,"q":"有關脂血症之敘述，下列何者錯誤？","opts":["A. 促進溶血","B. 血漿冷藏 4～8 小時後仍混濁，表示因乳糜微粒所致","C. 禁食 24 小時後採血可除去食後性脂血症","D. 糖尿病可能繼發高脂血症"],"ans":1,"exp":"脂血症（lipemia）中，若血漿冷藏 4～8 小時後混濁消失，表示混濁係乳糜微粒（chylomicrons）所致（乳糜微粒浮力高，冷藏後上浮形成奶油層，下層澄清）；若仍混濁，才表示是 VLDL 等較小脂蛋白所致。選項 B 敘述方向相反——冷藏後仍混濁代表不是乳糜微粒，故 B 錯誤。","we":["脂血症確實會促進溶血（脂質干擾紅血球膜），此敘述正確，非本題錯誤選項。","（正確）冷藏後仍混濁代表混濁由 VLDL 等小型脂蛋白引起，非乳糜微粒；若由乳糜微粒所致，冷藏後上清應澄清，此敘述錯誤，為本題答案。","禁食 12～24 小時後採血可消除食後性（餐後）脂血症，此敘述正確。","糖尿病造成脂肪分解增加，繼發高三酸甘油脂血症，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_042","year":2022,"roc_year":111,"session":"","examNo":42,"q":"當犬進行經口葡萄糖耐受試驗（OGTT）時，於 180 分鐘後尚未回到基礎血糖值，則該犬可能有何種病症？","opts":["A. 正常","B. 甲狀腺功能低下","C. 糖尿病","D. 高胰島素症"],"ans":2,"exp":"正常犬在口服葡萄糖耐受試驗（OGTT）中，血糖應於 90～120 分鐘內回到基礎值；若 180 分鐘後仍未回到基礎值，表示胰島素分泌不足或組織對胰島素反應異常，最可能為糖尿病（diabetes mellitus）。","we":["正常犬應在 120 分鐘內回到基礎值，180 分鐘仍高血糖代表不正常，非正常範圍。","甲狀腺功能低下可能使葡萄糖耐受力輕微下降，但通常不是 OGTT 180 分鐘仍未恢復的主要原因。","（正確）OGTT 180 分鐘後血糖仍高，最符合糖尿病（胰島素分泌不足或阻抗）的診斷。","高胰島素症（insulinoma）反而造成低血糖，OGTT 結果呈快速降至過低，非延遲回復。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_043","year":2022,"roc_year":111,"session":"","examNo":43,"q":"下列何者不是高乳酸鹽血症的原因？","opts":["A. 休克","B. 過度勞動","C. 馬之疝痛","D. 牛之乳熱"],"ans":3,"exp":"高乳酸鹽血症的原因：組織缺氧（休克）使無氧糖解產生大量乳酸；過度勞動使肌肉無氧代謝增加；馬之疝痛因腸道缺氧。牛之乳熱（milk fever）是低鈣血症，主要問題是鈣代謝失衡，並非高乳酸鹽血症的典型原因。","we":["休克時組織灌流不足、缺氧，無氧糖解產生乳酸大量堆積，是高乳酸鹽血症的主要原因。","過度勞動（運動性乳酸中毒）是高乳酸鹽血症的常見原因，尤其在競賽馬。","馬的疝痛（colic）常伴隨腸道缺血，可造成高乳酸鹽血症，是常見關聯。","（正確）牛的乳熱（產後低鈣血症）以鈣代謝失衡為主，不是高乳酸鹽血症的原因，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_044","year":2022,"roc_year":111,"session":"","examNo":44,"q":"正常犬隻投與多次高劑量 prednisolone（＞5 mg/kg），可在血中觀察到下列那一種肝臟酵素的活性值大幅度上\r  升？","opts":["A. ALT","B. AST","C. GGT","D. LDH"],"ans":2,"exp":"犬服用高劑量皮質類固醇（prednisolone＞5 mg/kg）後，可誘導肝臟合成類固醇誘導性鹼磷酶（steroid-induced ALP isoenzyme），使血清 ALP 大幅升高；此為犬特有反應，貓幾乎不發生。GGT 也可升高但程度不如 ALP 顯著。","we":["ALT 是肝細胞損傷指標，皮質類固醇可輕微升高 ALT，但升幅遠不如 ALP，非最主要變化。","AST 存在於多種組織，皮質類固醇對 AST 升高幅度不如 ALP。","（正確）高劑量 prednisolone 在犬誘導類固醇誘導性 ALP（SI-ALP），使 ALP 大幅升高，此為犬的特異性反應。","LDH 廣泛存在於各組織，皮質類固醇對 LDH 的影響不顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_045","year":2022,"roc_year":111,"session":"","examNo":45,"q":"下列何犬種常見尿酸銨（ammonium urate）尿？","opts":["A. 大麥町犬","B. 哈士奇犬","C. 北京犬","D. 杜賓犬"],"ans":0,"exp":"大麥町犬（Dalmatian）因缺乏尿酸酶（uricase）或尿酸轉運蛋白異常，無法將尿酸轉化為尿囊素，導致高尿酸尿症，易形成尿酸銨（ammonium urate）結晶，是大麥町犬的特有體質。","we":["（正確）大麥町犬因尿酸代謝異常，尿中尿酸濃度高，易形成尿酸銨結晶，是本題答案。","哈士奇犬無特定尿酸代謝異常，不以尿酸銨尿著稱。","北京犬無尿酸銨尿的特殊遺傳背景。","杜賓犬無尿酸代謝異常的特殊體質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_046","year":2022,"roc_year":111,"session":"","examNo":46,"q":"犬貓肝細胞受損或壞死時，下列那一項試驗最具敏感性？","opts":["A. ALT & AST","B. albumin","C. ammonia tolerance test","D. bile acids"],"ans":0,"exp":"ALT（丙氨酸氨基轉移酶）和 AST（天冬氨酸氨基轉移酶）是肝細胞胞漿酵素，當肝細胞受損或壞死時大量釋放入血，是犬貓肝細胞損傷最敏感（sensitive）的指標，尤其 ALT 對犬貓的肝細胞具高度特異性。","we":["（正確）ALT & AST 是肝細胞損傷/壞死的最敏感酵素指標，急性肝炎時可升高數倍至數十倍。","Albumin 反映肝臟合成功能，慢性肝病末期才下降，敏感性低，不用於早期肝細胞損傷偵測。","氨耐受試驗反映肝臟解毒功能，為肝功能試驗，非肝細胞損傷的最敏感指標。","膽汁酸（bile acids）反映肝腸循環功能，為肝功能指標，敏感性不如 ALT/AST 用於急性肝細胞損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_047","year":2022,"roc_year":111,"session":"","examNo":47,"q":"下列何物種不適合使用鹼磷酶（ALP）作為診斷膽汁滯鬱性肝病之依據？","opts":["A. 犬","B. 綿羊","C. 貓","D. 豬"],"ans":1,"exp":"ALP（鹼磷酶）在不同物種的半衰期和組織分布不同。綿羊的血清 ALP 半衰期極短（僅數分鐘），且骨骼 ALP 活性高，因此即使有肝膽疾病，血清 ALP 也不易升高，診斷膽汁滯鬱的靈敏度極低，不適合用於綿羊。","we":["犬的 ALP 對膽汁滯鬱高度敏感，且有類固醇誘導型 ALP，是臨床常用指標，適合使用。","（正確）綿羊血清 ALP 半衰期短，即使膽汁滯鬱也不易升高，最不適合作為診斷依據。","貓的 ALP 半衰期較短（約 6 小時），敏感性較低但仍有一定診斷價值，尚可使用。","豬的 ALP 有一定診斷價值，不是「最不適合」的物種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_048","year":2022,"roc_year":111,"session":"","examNo":48,"q":"下列何種酵素被視為鳥類肝臟疾病診斷的特異性酵素？","opts":["A. 異檸檬酸鹽脫氫酶（ICDH）","B. 麩氨酸鹽脫氫酶（GLDH）","C. 乳酸鹽脫氫酶（LDH）","D. 白氨酸氨基胜酶（LAP）"],"ans":1,"exp":"鳥類肝臟疾病診斷中，麩氨酸鹽脫氫酶（GLDH，glutamate dehydrogenase）被視為鳥類肝臟特異性酵素，因其主要存在於肝細胞線粒體，在鳥類肝臟含量豐富，肝細胞損傷時大量釋放，具高度器官特異性。","we":["ICDH（異檸檬酸鹽脫氫酶）在部分動物用於肝臟診斷，但對鳥類的特異性不如 GLDH。","（正確）GLDH 是鳥類肝臟疾病診斷的特異性酵素，肝細胞損傷時大量釋放，具高度特異性。","LDH 廣泛存在於多種組織（心肌、骨骼肌、紅血球等），對肝臟缺乏特異性。","LAP（白氨酸氨基胜酶）在某些動物用於肝膽指標，但對鳥類不是最特異性的肝臟酵素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_049","year":2022,"roc_year":111,"session":"","examNo":49,"q":"15 歲結紮母犬，精神沉鬱，多渴多尿。血檢發現膽汁酸（bile acids）、膽紅素（bilirubin）、血糖均有顯著上\r  升之現象。ALP 與 ALT 輕微上升，總蛋白與 A/G ratio 下降，且超音波檢查發現肝臟有變小的現象。推估該犬 的肝臟最有可能發生何種問題？","opts":["A. 脂肪肝","B. 膽管肝炎","C. 類固醇性肝病","D. 後天性門脈分流"],"ans":3,"exp":"15歲結紮母犬，多渴多尿，膽汁酸/膽紅素/血糖升高，ALP/ALT 輕微上升，TP 及 A/G ratio 下降，肝臟縮小：此組合高度符合後天性門脈分流（acquired portosystemic shunt）——肝臟萎縮（缺少門脈血流營養）、膽汁酸升高（門脈血繞過肝臟）、血氨升高繼發高血糖（糖代謝異常）。","we":["脂肪肝通常使肝臟增大（非縮小），ALP/ALT 顯著升高，與本題肝臟縮小不符。","膽管肝炎通常有較明顯的 ALP/ALT 升高及發炎徵象，且肝臟不一定縮小。","類固醇性肝病（HAC）通常使肝臟增大（肝糖蓄積），且常見 ALP 大幅升高，與肝臟縮小不符。","（正確）後天性門脈分流因長期門脈血繞過肝臟，導致肝臟萎縮（縮小）、膽汁酸顯著升高，符合本題所有特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_050","year":2022,"roc_year":111,"session":"","examNo":50,"q":"下列何種物質能有效率地透過腸肝循環（enterohepatic circulation）被回收？","opts":["A. 膽汁酸","B. 膽紅素","C. 尿素","D. 膽固醇"],"ans":0,"exp":"腸肝循環（enterohepatic circulation）最高效回收的物質是膽汁酸：由肝臟合成→分泌入膽汁→小腸協助脂肪消化後→回腸主動吸收→門脈→回到肝臟，回收率高達 95%。","we":["（正確）膽汁酸經腸肝循環的回收效率極高（95%），是腸肝循環最主要的回收物質。","膽紅素是膽汁的廢物，在腸道被細菌轉化後大部分隨糞便排出，腸肝循環回收效率低。","尿素主要由腎臟排泄，少量可進入腸道被細菌分解，腸肝循環回收率低。","膽固醇雖可經腸肝循環部分回收，但回收效率與調節機制遠不如膽汁酸高效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_051","year":2022,"roc_year":111,"session":"","examNo":51,"q":"下列何種疾病會造成先天性的膽汁鬱滯？","opts":["A. 犬的鐵查病（Tyzzer's disease）","B. 馬的 Gilbert 症候群","C. 貓的傳染性腹膜炎","D. 綿羊的 Dubin-Johnson 症候群"],"ans":3,"exp":"Dubin-Johnson 症候群是先天性有機陰離子（結合型膽紅素）排泄障礙，造成先天性膽汁鬱滯（conjugated hyperbilirubinemia）。已知綿羊有此遺傳性疾病。","we":["犬的鐵查病（Tyzzer's disease，Clostridium piliforme 感染）是肝臟壞死性感染，非先天性膽汁鬱滯。","Gilbert 症候群是非結合型膽紅素升高（葡萄糖醛酸轉移酶不足），在馬中無特定描述，且為非結合型，非典型膽汁鬱滯。","貓傳染性腹膜炎（FIP）是後天性感染性疾病，非先天性膽汁鬱滯。","（正確）綿羊的 Dubin-Johnson 症候群是先天性結合型膽紅素排泄障礙，造成先天性膽汁鬱滯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_052","year":2022,"roc_year":111,"session":"","examNo":52,"q":"下列何種動物在發生胰臟炎時較少出現高澱粉酶血症？","opts":["A. 雪納瑞犬","B. 鸚鵡","C. 貴賓犬","D. 亞洲短毛家貓"],"ans":1,"exp":"鸚鵡（及多數鳥類）血清中的澱粉酶（amylase）主要來自唾液腺而非胰臟，且鳥類胰腺炎時血清澱粉酶升高不明顯，因此鸚鵡發生胰臟炎時較少出現高澱粉酶血症（hyperamylasemia）。","we":["雪納瑞犬（Miniature Schnauzer）是犬胰臟炎的高危險品種，發病時澱粉酶顯著升高。","（正確）鸚鵡（鳥類）胰臟炎時血清澱粉酶升高不明顯，因其澱粉酶來源與哺乳動物不同。","貴賓犬亦是胰臟炎好發品種，發病時可出現高澱粉酶血症。","亞洲短毛家貓胰臟炎雖然澱粉酶升高幅度不如犬大，但仍可出現高澱粉酶血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_053","year":2022,"roc_year":111,"session":"","examNo":53,"q":"5 歲 Terrier 犬，食慾不振，常有嘔吐及下痢症狀，體重減輕，超音波顯示胰臟有一腫塊，有類似 Zollinger-\r  Ellison syndrome 之症狀，則此犬最易出現下列何種現象？","opts":["A. 血中的 trypsin 呈現低值","B. 血中的 gastrin 呈現高值","C. 常伴有高血糖出現","D. 胃中 pH 值偏高"],"ans":1,"exp":"Zollinger-Ellison syndrome 是胃泌素瘤（gastrinoma）引起的疾病，特徵為胰臟非β細胞腫瘤分泌大量 gastrin，刺激胃壁細胞分泌大量胃酸，導致胃及十二指腸潰瘍、嘔吐下痢。因此血中 gastrin 呈高值，胃中 pH 偏低（非偏高）。","we":["Zollinger-Ellison syndrome 為胃泌素瘤，trypsin 不是主要指標；血中 trypsin 低值見於胰外分泌功能不全（EPI），非本病特徵。","（正確）胃泌素瘤大量分泌 gastrin，血中 gastrin 呈高值，為本病最特異性指標。","gastrin 刺激胰臟分泌胰島素的作用有限；高血糖不是本病特徵（本病主要影響消化道，非血糖）。","胃泌素瘤使胃酸大量分泌，胃中 pH 偏低（酸性）而非偏高，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_054","year":2022,"roc_year":111,"session":"","examNo":54,"q":"懷疑動物有胰外分泌功能不全（EPI）時，最有可能出現下列何種特異檢測結果？","opts":["A. 脂肪酶與澱粉酶低於標準值","B. 維生素 B12 上升","C. 維生素Ａ下降","D. trypsin-like immunoreactivity（TLI）活性下降"],"ans":3,"exp":"胰外分泌功能不全（EPI, exocrine pancreatic insufficiency）時，胰臟腺泡細胞萎縮，分泌的胰蛋白酶原（trypsinogen）大量減少，因此血清 trypsin-like immunoreactivity（TLI）活性顯著下降，是診斷 EPI 的最特異性且敏感的指標。","we":["EPI 時脂肪酶與澱粉酶可下降，但 TLI 更特異；血清酵素低值不如 TLI 具特異性診斷價值。","EPI 時因小腸菌叢過度增生（SIBO），細菌消耗維生素 B12，故 B12 通常下降而非上升。","EPI 時脂溶性維生素（A、D、E、K）吸收不良，維生素 A 可下降，但此非最特異性指標。","（正確）TLI 活性下降是診斷 EPI 的最特異性指標，因 TLI 直接反映胰腺腺泡細胞功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_055","year":2022,"roc_year":111,"session":"","examNo":55,"q":"以蘇丹（Sudan）III 或 IV 染色稀釋糞便抹片，若在每一 400 倍視野下至少有多少個以上的脂肪滴，即可以判\r   斷為罹患脂肪漏瀉（steatorrhea）？","opts":["A. 5","B. 10","C. 15","D. 20"],"ans":1,"exp":"以蘇丹 III/IV 染色稀釋糞便抹片，若在每一 400 倍視野下有 10 個以上脂肪滴，即可診斷為脂肪漏瀉（steatorrhea），提示脂肪消化吸收不良（如 EPI 或嚴重腸道疾病）。","we":["5 個脂肪滴閾值過低，易造成偽陽性，非標準診斷值。","（正確）每 400 倍視野≥10 個脂肪滴即可判定為脂肪漏瀉（steatorrhea），為標準診斷閾值。","15 個閾值過高，可能遺漏輕至中度的脂肪漏瀉，非標準值。","20 個閾值過高，特異性雖高但敏感性下降，非標準診斷值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_056","year":2022,"roc_year":111,"session":"","examNo":56,"q":"有關 small intestinal bacterial overgrowth（SIBO）之敘述，下列何者最正確？","opts":["A. 腸道菌叢正常情況下只存在於大腸，不應在小腸出現","B. idiopathic SIBO 好發於年輕動物，德國狼犬是好發品種之一","C. 細菌會利用葉酸鹽（folate）幫助增生","D. 檢驗糞便中的 trypsinogen 可作為 SIBO 的診斷指標"],"ans":1,"exp":"小腸菌叢過度增生（SIBO）：細菌在小腸異常大量增生（正常小腸細菌數極少）；idiopathic SIBO 好發於年輕德國狼犬；過度增生的細菌會消耗（利用）維生素 B12（cobalamin），但細菌自身可合成葉酸鹽，故 SIBO 時血清 B12 下降，folate 上升而非下降。","we":["正常情況下小腸確有少量細菌存在，並非完全無菌；SIBO 是指細菌數量異常增多，此敘述不完全正確。","（正確）idiopathic SIBO 好發於年輕德國狼犬（German Shepherd Dog），此為已知好發品種，敘述正確。","SIBO 時細菌消耗 cobalamin（B12），且細菌自身合成 folate（葉酸鹽），使血清 folate 升高而非下降；細菌是「受益於」folate 不是「利用 folate 幫助增生」，此敘述不夠精確。","trypsinogen 是胰臟分泌的前驅酶，不是 SIBO 的診斷指標；SIBO 診斷指標包括 TLI、B12/folate 比值及呼氣試驗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_057","year":2022,"roc_year":111,"session":"","examNo":57,"q":"有關肌氨酸激酶（creatine kinase, CK）的異構體，下列敘述何者錯誤？","opts":["A. CK1 為由兩個腦型的次單位組合而成的雙聚體（dimer）","B. CK-Mt 存在於心肌之微粒體（microsome）","C. 酵素分類上 CK 屬於 EC2 群的轉移酶（transferase）","D. CK2 主要存在心肌，少量存在於骨骼肌"],"ans":1,"exp":"CK-Mt（線粒體型 CK）存在於心肌及骨骼肌的線粒體（mitochondria）外膜，而非 microsome（微粒體）。其他敘述：CK1=BB（兩個腦型次單位，存在於腦）；CK 屬 EC 2（轉移酶）；CK2=MB（心肌特異）均正確。","we":["CK1（BB isoform）由兩個腦型（B）次單位組成，存在於腦組織，此敘述正確。","（正確）CK-Mt 存在於心肌及骨骼肌的線粒體（mitochondria），非 microsome（微粒體），此敘述錯誤，為本題答案。","CK 屬 EC 2.7.3.2，為磷酸基轉移酶（transferase），此分類正確。","CK2（MB isoform）主要存在心肌，少量存在骨骼肌，為心肌損傷特異性指標，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_058","year":2022,"roc_year":111,"session":"","examNo":58,"q":"利用心肌肌鈣蛋白（troponins）評估心肌是否損傷，下列敘述何者錯誤？","opts":["A. 肌鈣蛋白由三種蛋白構成複合物，分別為 troponin I、troponin T 及 troponin C","B. 心肌 troponin I 及 troponin T 適用於評估心肌是否損傷","C. 腎損傷也可能造成血中心肌肌鈣蛋白上升","D. 心肌肌鈣蛋白半衰期約為 24 小時"],"ans":3,"exp":"心肌肌鈣蛋白（cardiac troponin）在血中釋放後的半衰期：troponin I 在犬約 2～4 小時，troponin T 約 4～6 小時，並非 24 小時。24 小時是人類 troponin 的舊概念，或某些測量方法的偵測窗口，並非半衰期。","we":["肌鈣蛋白複合物由 troponin I、T、C 三種蛋白組成，共同調控肌肉收縮，此敘述正確。","心肌特異性的 troponin I 和 troponin T 適合評估心肌損傷，因其在骨骼肌與心肌的亞型不同，此敘述正確。","腎損傷（腎衰竭）可減少心肌肌鈣蛋白的腎臟清除，或引起心肌缺血，導致血中濃度升高，此敘述正確。","（正確）心肌肌鈣蛋白半衰期約 2～6 小時（非 24 小時），24 小時的說法不正確，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_059","year":2022,"roc_year":111,"session":"","examNo":59,"q":"罹患肌肉疾病時，最不易見到下列何種異常？","opts":["A. LDH 值上升","B. 肌紅素尿","C. 高鉀血症","D. 低鈣血症"],"ans":3,"exp":"肌肉疾病（如橫紋肌溶解）時，典型異常包括：CK/LDH 升高（肌細胞破壞）、肌紅素尿（myoglobinuria）、高鉀血症（細胞內鉀釋出）。低鈣血症不是肌肉疾病的直接結果（低鈣血症反而可引起肌肉痙攣，是病因而非結果），故最不易見到低鈣血症。","we":["肌肉損傷使 LDH 大量釋出，LDH 值上升是肌肉疾病的常見異常。","肌紅素（myoglobin）由損傷肌細胞釋出，由尿液排出形成肌紅素尿，是橫紋肌溶解的特徵。","大量肌細胞破壞使細胞內鉀離子釋入血液，可引起高鉀血症，是肌肉疾病的常見異常。","（正確）低鈣血症是肌肉痙攣的病因，非肌肉疾病的結果，肌肉疾病本身最不易造成低鈣血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_060","year":2022,"roc_year":111,"session":"","examNo":60,"q":"罹患尿石症動物之鹼性尿，最常見下列何種結晶？","opts":["A. 草酸鹽（oxalate）","B. 三重磷酸鹽（triple phosphate）","C. 馬尿酸（hippurate）","D. 酥氨酸（tyrosine）"],"ans":1,"exp":"鹼性尿（pH＞7）有利於三重磷酸鹽（struvite，磷酸銨鎂，triple phosphate）結晶沉澱，因為其溶解度在鹼性環境下降低。草酸鹽在酸性尿中較常見，尿酸在酸性尿中沉澱，酥氨酸（tyrosine）較罕見。","we":["草酸鹽（oxalate，尤其草酸鈣）在酸性至中性尿中較常見，非鹼性尿中的主要結晶。","（正確）三重磷酸鹽（struvite/磷酸銨鎂）在鹼性尿中最常見，是鹼性尿石症的主要成分。","馬尿酸（hippurate）在馬尿中可見，非犬貓鹼性尿中的主要結晶。","酥氨酸（tyrosine）結晶罕見，見於嚴重肝病，非尿石症鹼性尿的常見結晶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_061","year":2022,"roc_year":111,"session":"","examNo":61,"q":"下列何者的尿液在正常情況下即呈現混濁的樣態？","opts":["A. 馬","B. 牛","C. 狗","D. 貓"],"ans":0,"exp":"馬的尿液在正常情況下即呈現混濁外觀，原因是尿液中含有大量碳酸鈣（calcium carbonate）及黏液（mucus），使尿液呈米湯或稀粥狀的混濁，此為馬的正常生理現象，與疾病無關。","we":["（正確）馬的正常尿液因含大量碳酸鈣結晶和黏液而呈混濁，為生理正常現象。","牛的正常尿液清澈至淡黃色，混濁非正常狀態。","狗的正常尿液清澈至淡黃色，混濁代表異常（如感染、蛋白尿等）。","貓的正常尿液清澈至淡黃色，混濁代表異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_062","year":2022,"roc_year":111,"session":"","examNo":62,"q":"下列何種疾病會造成腎性糖尿病？","opts":["A. lymphoma","B. Cushing syndrome","C. Fanconi-like syndrome","D. amyloidosis"],"ans":2,"exp":"Fanconi-like syndrome 是一種近端腎小管廣泛功能障礙，導致葡萄糖、胺基酸、磷酸鹽、尿酸等正常閾值以下的物質大量流失至尿液中，造成腎性糖尿（renal glucosuria），即血糖正常但尿糖陽性。","we":["lymphoma 可能引起高鈣血症，但不是腎性糖尿的直接原因。","Cushing syndrome（腎上腺皮質功能亢進）因高血糖超過腎小管再吸收閾值而出現血糖性糖尿，非腎性糖尿。","（正確）Fanconi-like syndrome 是近端腎小管廣泛功能缺損，血糖正常時仍有尿糖，即腎性糖尿。","amyloidosis（澱粉樣變性）破壞腎小球基底膜，主要造成蛋白尿，非腎性糖尿的典型原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_063","year":2022,"roc_year":111,"session":"","examNo":63,"q":"下列何種結晶最易出現於鹼性尿中？","opts":["A. cholesterol","B. cystine","C. magnesium ammonium phosphate","D. uric acid"],"ans":2,"exp":"Magnesium ammonium phosphate（磷酸銨鎂，struvite）在鹼性尿中溶解度低，最易沉澱形成結晶。Uric acid 在酸性尿中沉澱，cystine 在酸性或中性尿中沉澱，cholesterol 少見於正常尿液。","we":["Cholesterol 結晶罕見，偶見於乳糜尿或腎病症候群，與尿液 pH 關係不直接，非鹼性尿的常見結晶。","Cystine 在酸性至中性尿中較易沉澱（cystine 溶解度在酸性環境下降低），非鹼性尿常見結晶。","（正確）Magnesium ammonium phosphate（struvite）在鹼性尿中最易析出，是鹼性尿結晶的代表。","Uric acid 在酸性尿中（低 pH）溶解度最低，最易沉澱，非鹼性尿常見結晶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_064","year":2022,"roc_year":111,"session":"","examNo":64,"q":"造成該犬低血氯最 有可能的原因為何？","opts":["A. 嘔吐","B. 乏尿","C. 脫水","D. 用於平衡血液中過低的重碳酸鹽濃度"],"ans":0,"exp":"嘔吐時大量鹽酸（HCl）隨胃液流失，導致血氯（Cl⁻）降低，形成低血氯（hypochloremia）。低血氯同時引起代謝性鹼中毒（因 H⁺ 損失與 HCO₃⁻ 相對增加）。本題在系列題情境中，嘔吐是造成低血氯最主要的原因。","we":["（正確）嘔吐使大量 HCl 流失，直接導致低血氯（hypochloremia），是最常見且直接的原因。","乏尿（oliguria）使電解質滯留，通常造成高血氯或電解質升高，非低血氯的主因。","脫水使電解質濃縮，通常造成輕度高血氯或正常，非低血氯的原因。","低血氯本身就與重碳酸鹽升高（代謝性鹼中毒）相關，但不是「平衡過低的 HCO₃⁻」，此描述邏輯顛倒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_065","year":2022,"roc_year":111,"session":"","examNo":65,"q":"承上題，由臨床症狀及血檢結果可判定該犬有下列何種酸鹼不平衡？","opts":["A. 呼吸性酸中毒","B. 呼吸性鹼中毒","C. 代謝性酸中毒","D. 代謝性鹼中毒"],"ans":3,"exp":"承上題（嘔吐導致 HCl 流失）：大量 H⁺ 和 Cl⁻ 隨嘔吐流失，血中 HCO₃⁻ 相對增加，pH 上升，形成代謝性鹼中毒（metabolic alkalosis）。呼吸代償為呼吸抑制（CO₂ 輕微升高）。","we":["呼吸性酸中毒由 CO₂ 滯留引起（如呼吸道阻塞），非嘔吐的主要酸鹼異常。","呼吸性鹼中毒由 CO₂ 過度排出引起（如過度換氣），非嘔吐的結果。","代謝性酸中毒由 H⁺ 增加或 HCO₃⁻ 減少引起，嘔吐流失 H⁺ 反而造成鹼中毒，非酸中毒。","（正確）嘔吐使 H⁺ 和 Cl⁻ 大量流失，HCO₃⁻ 相對升高，形成代謝性鹼中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_066","year":2022,"roc_year":111,"session":"","examNo":66,"q":"承上題，輸液後若該犬尿檢中出現等比重尿、輕微的蛋白尿，但無血尿或是膿尿之結果，且尿渣中觀察到單\r  水草酸鈣結晶，則下列何者最可能是造成該犬臨床症狀之病因？","opts":["A. ethylene glycol 中毒","B. 肝腦病變","C. 子宮蓄膿","D. 輸尿管結石"],"ans":0,"exp":"承上題系列案例，輸液後若出現等比重尿（isosthenuria）、輕微蛋白尿，且尿渣中見到單水草酸鈣（calcium oxalate monohydrate）結晶，為乙二醇（ethylene glycol）中毒的特徵性發現。乙二醇代謝產生草酸，與鈣結合沉積於腎小管，造成急性腎損傷及草酸鈣結晶尿。","we":["（正確）乙二醇（ethylene glycol，防凍液）中毒的特徵：急性腎損傷、等比重尿、蛋白尿、尿渣出現單水草酸鈣結晶，為本題最符合的答案。","肝腦病變（hepatic encephalopathy）造成神經症狀及高血氨，尿渣不出現草酸鈣結晶。","子宮蓄膿（pyometra）主要造成菌血症及腎小球腎炎，尿渣不出現草酸鈣結晶。","輸尿管結石造成腎後性氮血症，尿液可能無結晶或有其他類型結晶，不特異出現單水草酸鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_067","year":2022,"roc_year":111,"session":"","examNo":67,"q":"一病犬血清生化及荷爾蒙檢查結果如下：total calcium 上升、ionized calcium 上升、phosphate 上升、PTH 下降。\r   根據上述檢查結果，下列何者為造成該病犬高鈣血症最可能之原因？","opts":["A. 維生素 D 過多症","B. 惡性腫瘤","C. 原發性副甲狀腺功能亢進","D. 慢性腎衰竭"],"ans":0,"exp":"維生素 D 過多症（hypervitaminosis D）：外源性維生素 D 過多促進腸道鈣磷吸收，使 total Ca、ionized Ca 及 phosphate 均升高；同時高血鈣負回饋抑制甲狀腺旁腺，使 PTH 下降。此組合（Ca↑、P↑、PTH↓）符合維生素 D 過多症。","we":["（正確）維生素 D 過多症使 Ca 及 P 均升高，同時 PTH 因高血鈣的負回饋而下降，符合本題所有檢驗數值。","惡性腫瘤（PTHrP 分泌）：Ca↑、P↓（PTHrP 使腎臟排 P 增加）、PTH↓，磷酸鹽應降低，與本題 P 上升不符。","原發性副甲狀腺功能亢進：PTH↑（非↓）、Ca↑、P↓，與本題 PTH↓ 及 P↑ 不符。","慢性腎衰竭：高磷血症（因腎排磷減少）、低鈣血症（維生素 D 活化不足），與本題高鈣血症不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_068","year":2022,"roc_year":111,"session":"","examNo":68,"q":"副甲狀腺於下列何組織器官將 25-hydroxy-cholecalciferol 轉化成具有生理活性之維生素 D3？","opts":["A. 腎小管細胞","B. 肝細胞","C. 腸道細胞","D. 骨骼細胞"],"ans":0,"exp":"25-hydroxy-cholecalciferol（25-OH-D3，骨化二醇）在腎小管細胞（近端腎小管上皮細胞）的線粒體中，由 1α-hydroxylase 轉化為具有生理活性的 1,25-dihydroxy-cholecalciferol（calcitriol，骨化三醇）。此羥化過程受 PTH 刺激。","we":["（正確）25-OH-D3 在腎小管細胞（近端腎小管）中由 1α-hydroxylase 活化為具生理活性的 1,25-(OH)₂-D3（calcitriol）。","肝細胞負責將 cholecalciferol（D3）25-羥基化為 25-OH-D3，非最終活化步驟。","腸道細胞是 calcitriol 的靶器官（促進鈣磷吸收），而非轉化場所。","骨骼細胞是 calcitriol 的靶器官，不負責其活化轉化過程。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_069","year":2022,"roc_year":111,"session":"","examNo":69,"q":"造成犬高血鈣的原因眾多，若病犬血中 total Ca、ionized Ca、parathyroid hormone-related peptide（PTHrP）皆增\r   加，但血中 PTH 及 phosphate 皆下降，則造成此病犬高血鈣最有可能之原因為","opts":["A. lymphoma","B. primary hyperparathyroidism","C. chronic kidney disease","D. granulomatous disease"],"ans":0,"exp":"PTHrP（副甲狀腺素相關胜肽）升高伴隨高鈣血症（Ca↑）、低磷血症（P↓），且 PTH 下降（因高血鈣負回饋），此組合典型見於惡性腫瘤引起的體液性高鈣血症（humoral hypercalcemia of malignancy），在犬中以 lymphoma（尤其 T-cell lymphoma）最常見。","we":["（正確）PTHrP 升高、PTH 下降、Ca 升高、P 下降，最典型見於惡性腫瘤（尤其 lymphoma）的體液性高鈣血症。","原發性副甲狀腺功能亢進（Primary hyperparathyroidism）：PTH 升高（非下降）、PTHrP 不升高，與本題不符。","慢性腎病（CKD）：通常造成高磷血症及繼發性 PTH 升高，PTHrP 不升高，與本題不符。","肉芽腫性疾病：通過活化維生素 D 升高鈣，PTH 及 PTHrP 均不升高，與本題不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_070","year":2022,"roc_year":111,"session":"","examNo":70,"q":"下列何種內分泌疾病最不常出現膽固醇增加之血脂異常？","opts":["A. 甲狀腺功能亢進","B. 甲狀腺功能低下","C. 腎上腺皮質功能亢進","D. 糖尿病"],"ans":0,"exp":"甲狀腺功能亢進（hyperthyroidism）時，甲狀腺素加速脂質代謝（促進膽固醇分解及清除），通常使膽固醇降低（低膽固醇血症），而非升高。其他三種：甲狀腺功能低下、腎上腺皮質功能亢進（Cushing's）、糖尿病均常見膽固醇升高。","we":["（正確）甲狀腺功能亢進加速脂質代謝，使膽固醇下降，最不常出現膽固醇增加，為本題答案。","甲狀腺功能低下使脂質代謝減慢，膽固醇清除下降，常見高膽固醇血症。","腎上腺皮質功能亢進（HAC/Cushing's）使脂肪動員增加，常伴隨高膽固醇血症。","糖尿病使脂肪分解及 VLDL 合成增加，常伴隨高脂血症及高膽固醇血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_071","year":2022,"roc_year":111,"session":"","examNo":71,"q":"下列何項因素最不會干擾或影響血清果糖胺之濃度？","opts":["A. 白蛋白濃度","B. 甲狀腺功能亢進","C. 貧血","D. 氮血症"],"ans":3,"exp":"血清果糖胺（fructosamine）是白蛋白等血清蛋白的非酵素性糖化產物，反映過去 2～3 週的平均血糖。干擾因素：白蛋白濃度（低白蛋白→低果糖胺）、甲狀腺亢進（蛋白更新加速→低果糖胺）、貧血（血樣稀釋干擾某些測定法）。氮血症對果糖胺的直接干擾最小，影響最不顯著。","we":["白蛋白濃度直接影響果糖胺基礎值（果糖胺主要來自白蛋白糖化），低白蛋白血症可低估血糖控制。","甲狀腺功能亢進加速蛋白質更新，縮短蛋白質半衰期，使果糖胺偏低，為重要干擾因素。","貧血可影響某些測定方法的比色值（溶血或蛋白稀釋），對果糖胺測定有一定干擾。","（正確）氮血症對血清果糖胺濃度的直接干擾最小，是本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_072","year":2022,"roc_year":111,"session":"","examNo":72,"q":"下列何者不是犬隻糖尿病常見之臨床症狀？","opts":["A. 多渴／多尿","B. 體重下降","C. 步態改變","D. 白內障"],"ans":2,"exp":"犬糖尿病的常見臨床症狀包括多渴多尿（滲透性利尿）、體重下降（能量利用障礙）、白內障（晶狀體山梨醇蓄積）。步態改變（共濟失調）是貓糖尿病的特徵（糖尿病神經病變），在犬並不常見，故步態改變為本題答案。","we":["多渴多尿是犬糖尿病的典型首發症狀（高血糖造成滲透性利尿），為常見症狀。","體重下降因胰島素不足使細胞無法利用葡萄糖，轉而分解脂肪和蛋白質，為常見症狀。","（正確）步態改變（後肢無力/共濟失調）是貓糖尿病神經病變的特徵，在犬較不常見，為本題答案。","白內障（cataract）在犬糖尿病極為常見，因晶狀體利用山梨醇途徑代謝多餘葡萄糖，造成滲透壓損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_073","year":2022,"roc_year":111,"session":"","examNo":73,"q":"下列何者不是犬腎上腺皮質功能亢進（hyperadrenocorticism）常見之實驗室檢查結果？","opts":["A. 淋巴球減少","B. ALP 上升","C. Total T4 上升","D. 高血糖"],"ans":2,"exp":"犬腎上腺皮質功能亢進（HAC/Cushing's disease）的實驗室特徵：淋巴球減少、嗜酸性球減少、嗜中性球增多（緊迫血球相）、ALP 大幅升高（類固醇誘導型）、高血糖。Total T4 通常下降（皮質酮抑制甲狀腺功能），而非上升。","we":["淋巴球減少是 HAC 的典型緊迫血球相表現，為常見實驗室發現。","ALP 升高（類固醇誘導型 ALP）是 HAC 的特徵性發現，常見且顯著。","（正確）Total T4 在 HAC 時通常下降（皮質酮抑制甲狀腺），而非上升，此為非常見發現，為本題答案。","高血糖因皮質酮的胰島素拮抗作用，是 HAC 的常見實驗室發現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_074","year":2022,"roc_year":111,"session":"","examNo":74,"q":"某犬疑似患有腎上腺皮質功能異常疾病， 其 ACTH 刺激試驗及低劑量 dexamethasone 抑制試驗結果如下。該犬  最有可能患有下列何種腎上腺皮質功能異常疾病？（ACTH 試驗參考值 pre-ACTH：20～250 nmol/L, post- ACTH：200～450 nmol/L）","opts":["A. 腎上腺依賴性腎上腺皮質功能亢進症（adrenal-dependent hyperadrenocorticism）","B. 腦垂腺依賴性腎上腺皮質功能亢進症（pituitary-dependent hyperadrenocorticism）","C. 醫源性庫興症候群（iatrogenic Cushing's syndrome）","D. 腎上腺皮質功能低下症（hypoadrenocorticism）"],"ans":3,"exp":"ACTH 刺激試驗：pre-ACTH 值極低（低於參考值 20 nmol/L）且 post-ACTH 值也極低（低於 200 nmol/L），表示腎上腺對 ACTH 刺激無法反應，提示腎上腺皮質萎縮或功能喪失，最符合腎上腺皮質功能低下症（hypoadrenocorticism, Addison's disease）。","we":["腎上腺依賴性 HAC：pre-ACTH 升高，post-ACTH 大幅升高（＞450 nmol/L），低劑量 dexamethasone 不抑制，與本題數值相反。","腦垂腺依賴性 HAC：pre-ACTH 升高，post-ACTH 大幅升高，低劑量 dex 不抑制，與本題不符。","醫源性庫興症候群：pre-ACTH 極低（外源性皮質酮抑制 ACTH 分泌），post-ACTH 也低，但病史須有長期皮質酮投予；需結合臨床病史鑑別。","（正確）ACTH 試驗 pre 及 post 均低於參考值，腎上腺無法反應，最符合腎上腺皮質功能低下症（Addison's disease）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_實診_075","year":2022,"roc_year":111,"session":"","examNo":75,"q":"組織間液（interstitial fluid）約占總體重之多少？","opts":["A. 40%","B. 30%","C. 20%","D. 15%"],"ans":3,"exp":"體液分布：細胞內液（ICF）約占體重 40%；細胞外液（ECF）約占體重 20%（血漿約 5%＋組織間液約 15%）。因此組織間液（interstitial fluid）約占總體重的 15%。","we":["40% 為細胞內液（ICF）的比例，非組織間液。","30% 不對應任何標準體液分區。","20% 為細胞外液（ECF）總量的比例，非單獨組織間液。","（正確）組織間液約占體重 15%（細胞外液 20% 中，扣除血漿 5%）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_076","year":2022,"roc_year":111,"session":"","examNo":76,"q":"PCO 2 在 40 mmHg 及 37℃的標準條件下，以酸或鹼滴定患畜血漿，使達到 pH7.4 時的鹼量稱為","opts":["A. Base excess","B. TCO 2","C. ","D. Anion gap"],"ans":0,"exp":"Base excess（鹼超）定義：在標準條件下（PCO₂ = 40 mmHg、37°C），以酸或鹼滴定患畜血漿（或全血）至 pH 7.4 時所需的鹼量（或酸量）。正值表示代謝性鹼中毒傾向，負值表示代謝性酸中毒傾向。","we":["（正確）Base excess 是在標準 PCO₂ 及溫度條件下滴定至 pH 7.4 所需的鹼量，反映代謝性酸鹼狀態。","TCO₂（總 CO₂）是血液中所有 CO₂ 形式的總和（HCO₃⁻＋dissolved CO₂），非滴定所需鹼量。","選項 C 題目原文為空白，可能為 HCO₃⁻，但 HCO₃⁻ 是緩衝鹼的計算值，非滴定定義的 base excess。","Anion gap 是陽離子與陰離子的差值（[Na⁺]－[Cl⁻＋HCO₃⁻]），用於評估代謝性酸中毒原因，非滴定定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_077","year":2022,"roc_year":111,"session":"","examNo":77,"q":"正常動物血漿 TCO 2 值比 高多少？","opts":["A. 3%","B. 5%","C. 7%","D. 10%"],"ans":0,"exp":"血漿 TCO₂（total CO₂）= HCO₃⁻ + dissolved CO₂ + carbamino CO₂。其中 HCO₃⁻ 佔約 95%，dissolved CO₂ 約佔 5%（0.03 × PCO₂）。因此 TCO₂ 比 HCO₃⁻ 高約 1–3 mmol/L，換算比例約 3%（依題目提供的選項，答案為 3%）。","we":["（正確）TCO₂ 比 HCO₃⁻ 高約 3%（主要因溶解 CO₂ 的貢獻），為本題答案。","5% 過高估計了溶解 CO₂ 的貢獻比例，非標準答案。","7% 過高，不符合生理數值。","10% 過高，不符合實際 TCO₂ 與 HCO₃⁻ 的關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_078","year":2022,"roc_year":111,"session":"","examNo":78,"q":"下列何者不是造成高鉀血症（hyperkalemia）之原因？","opts":["A. 莢竹桃中毒","B. 鹼血症","C. 大量組織壞死","D. 腎上腺功能低下症"],"ans":1,"exp":"高鉀血症的原因：莢竹桃中毒（抑制 Na⁺/K⁺-ATPase）、大量組織壞死（細胞內鉀釋出）、腎上腺功能低下（醛固酮不足→腎臟保鉀排鈉）。鹼血症反而造成低鉀血症，因鹼中毒時 H⁺ 從細胞內移出至細胞外，K⁺ 進入細胞內以維持電中性。","we":["莢竹桃中毒抑制 Na⁺/K⁺-ATPase，使 K⁺ 無法進入細胞，造成高鉀血症，此為高鉀原因之一。","（正確）鹼血症使 K⁺ 向細胞內轉移（H⁺ 移出以緩衝鹼中毒），造成低鉀血症，非高鉀血症的原因，為本題答案。","大量組織壞死（橫紋肌溶解、腫瘤溶解）釋放細胞內 K⁺，造成高鉀血症。","腎上腺功能低下症（Addison's disease）醛固酮不足，腎臟無法排鉀，造成高鉀血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_079","year":2022,"roc_year":111,"session":"","examNo":79,"q":"下列何者不是造成低血鉀之原因？","opts":["A. 嘔吐／下痢","B. 血小板增多症","C. 代謝性鹼中毒","D. thiazide 給予"],"ans":1,"exp":"血小板增多症（thrombocytosis）造成假性高鉀血症（pseudohyperkalemia）而非低血鉀：過多血小板在凝血時釋放 K⁺ 至血清，使血清 K⁺ 偏高。嘔吐/下痢（GI鉀流失）、代謝性鹼中毒（K⁺進入細胞）、thiazide 利尿劑（增加腎臟鉀排出）均可造成低血鉀。","we":["嘔吐和下痢使大量 K⁺ 隨胃腸液流失，是低血鉀的常見原因。","（正確）血小板增多症使血清（非血漿）K⁺ 假性偏高（因血小板凝血時釋出 K⁺），不造成真正的低血鉀，為本題答案。","代謝性鹼中毒使 K⁺ 向細胞內轉移，造成低血鉀，是常見關聯。","Thiazide 類利尿劑抑制遠端腎小管 Na⁺/Cl⁻ 共同轉運體，增加遠端小管流速，促進 K⁺ 排出，造成低血鉀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_實診_080","year":2022,"roc_year":111,"session":"","examNo":80,"q":"下列何犬種之紅血球內含有較高鉀離子，溶血時較易引起高血鉀？","opts":["A. 德國牧羊犬","B. 黃金獵犬","C. 鬥牛犬","D. 秋田犬"],"ans":3,"exp":"秋田犬（Akita Inu）的紅血球內含有較高的鉀離子濃度（high potassium/HK red blood cells），與多數犬種（low potassium/LK）不同。因此秋田犬溶血時，大量細胞內 K⁺ 釋放，較其他犬種更易引起高血鉀（hyperkalemia），採血後若溶血也需特別注意假性高鉀血症。","we":["德國牧羊犬屬 low potassium（LK）紅血球犬種，溶血時釋出的 K⁺ 量少，不易引起高血鉀。","黃金獵犬屬 LK 紅血球犬種，溶血高血鉀風險不高。","鬥牛犬屬 LK 紅血球犬種，無特殊高鉀紅血球的記載。","（正確）秋田犬（及柴犬等日本犬種）具有 high potassium（HK）紅血球特性，溶血時較易引起高血鉀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_001","year":2023,"roc_year":112,"session":"","examNo":1,"q":"下列何者不是惡性腫瘤細胞之細胞核特徵？","opts":["A. 細胞核大小不一","B. 嗜鹼性","C. 異常有絲分裂","D. 核質比變大"],"ans":1,"exp":"惡性腫瘤細胞的細胞核特徵包括：核大小不一（anisokaryosis）、異常有絲分裂、核質比增大、核仁明顯且多個。嗜鹼性（basophilia）是細胞質的特徵，反映 RNA 含量增加，屬於細胞質而非細胞核的惡性特徵。","we":["A. 細胞核大小不一（anisokaryosis）是惡性腫瘤細胞核的典型特徵之一，屬於惡性標準。","B.（正確）嗜鹼性是細胞質的特性（反映豐富 RNA），不是細胞核本身的惡性特徵，故本題問「不是細胞核特徵」，答案為 B。","C. 異常有絲分裂（abnormal mitosis）是惡性腫瘤細胞核的重要特徵。","D. 核質比變大（increased N:C ratio）是惡性腫瘤細胞核特徵之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_002","year":2023,"roc_year":112,"session":"","examNo":2,"q":"正常馬隻腹腔穿刺液中蛋白質濃度為多少g/dL？","opts":["A. ＜2.5","B. 2.6～3.2","C. 2.8～4.2","D. 3.5～5"],"ans":0,"exp":"正常馬腹腔穿刺液（腹水）蛋白質濃度應低於 2.5 g/dL，細胞數低於 5,000 cells/μL。超過此值提示腹膜炎或其他病變。","we":["A.（正確）正常馬腹腔穿刺液蛋白質 < 2.5 g/dL，為正常參考值上限。","B. 2.6–3.2 g/dL 已超過正常上限，屬於異常範圍。","C. 2.8–4.2 g/dL 明顯過高，提示滲出液或炎症。","D. 3.5–5 g/dL 為高蛋白滲出液範圍，非正常值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_003","year":2023,"roc_year":112,"session":"","examNo":3,"q":"某犬下顎及肩胛淋巴結腫大，其細針抽取細胞學型態為85%大型未成熟之淋巴球及少量吞有細胞屑之巨噬細 胞。據此檢查結果，其最有可能之病因為何？","opts":["A. 淋巴結增生","B. 淋巴腺炎","C. 淋巴肉瘤","D. 肥大細胞瘤轉移至淋巴結"],"ans":2,"exp":"細針抽取細胞學（FNA）顯示 85% 大型未成熟淋巴球（母細胞）及少量含吞噬細胞碎屑的巨噬細胞（starry sky pattern），此為高度惡性淋巴肉瘤（lymphosarcoma）的典型細胞學表現。淋巴結增生以小型成熟淋巴球為主；淋巴腺炎以嗜中性球為主；肥大細胞瘤轉移會見到肥大細胞。","we":["A. 淋巴結增生（reactive hyperplasia）以成熟小淋巴球為主，不會出現大量未成熟母細胞。","B. 淋巴腺炎以嗜中性球浸潤為主，伴有巨噬細胞，但不以大型未成熟淋巴球為主。","C.（正確）85% 大型未成熟淋巴球 + 巨噬細胞為淋巴肉瘤（高惡性度淋巴瘤）的典型 FNA 表現。","D. 肥大細胞瘤轉移至淋巴結會見到大量含顆粒的肥大細胞，與本題描述不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_004","year":2023,"roc_year":112,"session":"","examNo":4,"q":"罹患犬瘟熱時，腦脊髓液之蛋白質量增加，並伴有下列何種現象？","opts":["A. 嗜中性球增多","B. 嗜酸性球增多","C. 淋巴球增多","D. 巨噬細胞增多"],"ans":2,"exp":"犬瘟熱病毒（CDV）屬於副黏液病毒，侵犯中樞神經系統後引起腦脊髓液（CSF）中蛋白質增加，並伴有淋巴球增多症（lymphocytic pleocytosis），此為病毒性腦炎的典型 CSF 表現。","we":["A. 嗜中性球增多症見於細菌性腦膜炎，不是病毒性腦炎的典型表現。","B. 嗜酸性球增多症見於真菌感染或寄生蟲移行，非犬瘟熱的典型表現。","C.（正確）犬瘟熱腦脊髓液以淋巴球增多為特徵，反映病毒誘發的免疫反應。","D. 巨噬細胞增多見於肉芽腫性腦炎（如真菌性），非犬瘟熱典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_005","year":2023,"roc_year":112,"session":"","examNo":5,"q":"有關正常關節囊液之敘述，下列何者錯誤？","opts":["A. 只含少數紅血球","B. 呈現透明清晰","C. 含大量纖維素原","D. 黏稠度可牽絲2 cm以上"],"ans":2,"exp":"正常關節囊液（滑液）的特性：透明清晰、淡黃色、高黏稠度（可牽絲 ≥ 2.5 cm）、只含少數紅血球（< 2,000 cells/μL）、幾乎不含纖維素原（fibrinogen）。纖維素原屬血漿蛋白，正常滑液中含量極少，因此「含大量纖維素原」是錯誤描述。","we":["A. 正常關節囊液只含少數紅血球，此敘述正確，非答案。","B. 正常滑液呈透明清晰，此敘述正確，非答案。","C.（正確）正常關節囊液不含大量纖維素原；纖維素原增多是炎症或創傷的特徵，故此敘述錯誤，為本題答案。","D. 黏稠度可牽絲 ≥ 2 cm 是正常滑液特性，此敘述正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_006","year":2023,"roc_year":112,"session":"","examNo":6,"q":"犬陰道抹片可見以小的中間層及副基底層上皮細胞為主，且有多量紅血球。上述細胞學特徵，最可能為發情週\r  期的那一時期？","opts":["A. anestrus","B. metestrus","C. estrus","D. proestrus"],"ans":1,"exp":"發情後期（metestrus）的陰道抹片以中間層及副基底層上皮細胞為主（角化程度降低），並伴有多量紅血球（出血），這是因為黃體期開始，雌激素下降後子宮內膜修復出血的特徵。發情期以角化細胞為主；前發情期以中間層細胞及紅血球為主，但角化程度較metestrus高。","we":["A. Anestrus（乏情期）：以副基底層細胞為主，幾乎無紅血球，不符。","B.（正確）Metestrus（發情後期）：小的中間層及副基底層細胞為主 + 多量紅血球，符合題意。","C. Estrus（發情期）：以大型角化上皮細胞為主（> 80%），無核，無紅血球，不符。","D. Proestrus（前發情期）：中間層細胞及紅血球，但角化細胞比例較 metestrus 高，不符本題描述的「副基底層為主」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_007","year":2023,"roc_year":112,"session":"","examNo":7,"q":"脂血症會導致下列何種檢測值呈現偽低值？","opts":["A. 鹼磷酶（ALP）","B. 總膽紅素（total bilirubin）","C. 葡萄糖（glucose）","D. 白蛋白（albumin）"],"ans":3,"exp":"脂血症（lipemia）會使血清呈乳白色混濁，干擾比色法，造成吸光度讀值偏差。白蛋白（albumin）以染料結合法（如 BCG 法）測定，脂血症會使光線散射增加，導致白蛋白測定值偽低。ALP、總膽紅素、葡萄糖等也可能受脂血影響，但白蛋白的偽低效應最為典型。","we":["A. ALP 測定受脂血影響相對較小，且通常不呈現顯著偽低值。","B. 總膽紅素在脂血症時可能偽高（因脂質本身有顏色干擾）。","C. 葡萄糖測定受脂血影響較小，不是典型偽低值項目。","D.（正確）白蛋白（BCG 染料法）在脂血症時因光線散射而呈現偽低值，為最典型的受影響項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_008","year":2023,"roc_year":112,"session":"","examNo":8,"q":"有關鈎端螺旋體症檢體採取處理，何者最不適當？","opts":["A. 對急性期者採取成對血清（10～14天間隔）檢驗","B. 死後取肝及腎送檢","C. 送檢臟器以甲醇保存，做病原體分離之用","D. 送檢臟器以10%中性福馬林液保存，做病理檢查之用"],"ans":2,"exp":"鉤端螺旋體病原體分離需使用新鮮檢體或特殊培養液（如 EMJH 培養基）保存，甲醇（methanol）具有強烈毒性，會殺死病原體，完全不適合用於病原體分離保存。正確保存方式應使用生理食鹽水或特殊培養液冷藏運送。","we":["A. 急性期採取成對血清（間隔 10–14 天）進行抗體效價比較，是正確的血清學診斷方式。","B. 死後取肝及腎送檢是正確的，因鉤端螺旋體在這兩個器官集中。","C.（正確）以甲醇保存送檢臟器做病原體分離是最不適當的，甲醇會殺死鉤端螺旋體，無法分離活菌。","D. 以 10% 中性福馬林液保存做病理（組織學）檢查是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_009","year":2023,"roc_year":112,"session":"","examNo":9,"q":"下列寄生蟲或原蟲疾病感染的檢體，何者採樣保存方式最為正確？","opts":["A. 遠距離運送糞便做寄生蟲檢查時，以乾冰保存檢體","B. 取動物毛囊做寄生蟲檢查時，以50%甘油甲醇保存","C. 懷疑感染焦蟲病的犬隻，其血液抹片以70%乙醇固定之","D. 懷疑帶有弓蟲的貓糞，以冷藏或10%中性福馬林液固定送檢"],"ans":3,"exp":"懷疑帶有弓蟲（Toxoplasma gondii）的貓糞，應以冷藏（4°C）保存或以 10% 中性福馬林液固定，前者維持卵囊活性，後者固定形態供顯微鏡檢查。這是正確的保存方式。","we":["A. 遠距離運送糞便做寄生蟲檢查時，應以 10% 福馬林液或 PVA 固定液保存，不應使用乾冰（會造成卵囊形態破壞）。","B. 取毛囊做寄生蟲檢查（如蠕形蟎），應以液態石蠟（mineral oil）保存，50% 甘油甲醇不適合。","C. 懷疑焦蟲病（Babesia）的血液抹片應以甲醇固定，而非 70% 乙醇（乙醇固定效果差，形態保存不佳）。","D.（正確）弓蟲貓糞以冷藏或 10% 中性福馬林液固定送檢，均為正確保存方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_010","year":2023,"roc_year":112,"session":"","examNo":10,"q":"血液檢查時，使用過量EDTA抗凝可能會使何項檢驗呈現偽低值？","opts":["A. 鈉","B. MCHC","C. PCV","D. 鉀"],"ans":1,"exp":"過量 EDTA 抗凝劑會使血液中水分滲入紅血球（紅血球皺縮），導致 MCV 和 PCV 降低；同時 EDTA 螯合二價離子，干擾比色法，造成 MCHC 偽低值。鈉和鉀的測定通常不受 EDTA 直接影響。","we":["A. 鈉的測定通常使用離子選擇性電極，不受 EDTA 直接干擾，不會呈現偽低值。","B.（正確）過量 EDTA 導致紅血球皺縮，PCV 和 MCV 下降，MCHC 可能因計算偏差而呈偽低值，是最常被引用的偽低項目。","C. PCV 在過量 EDTA 時因紅血球皺縮而偽低，但 MCHC 是最典型的答案。","D. 鉀的測定不受 EDTA 直接干擾，不呈偽低值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_011","year":2023,"roc_year":112,"session":"","examNo":11,"q":"下列紅血球系細胞，何者不具氧化代謝性作用？","opts":["A. 前紅血細胞（prorubricyte）","B. 後紅血細胞（metarubricyte）","C. 網狀球前期（reticulocyte）","D. 成熟紅血球"],"ans":3,"exp":"成熟紅血球（erythrocyte）無細胞核、無粒線體，只能進行無氧糖解（anaerobic glycolysis），無法進行需要粒線體的氧化磷酸化（oxidative metabolism）。前紅血細胞、後紅血細胞及網狀球均尚有代謝胞器。","we":["A. 前紅血細胞（prorubricyte）仍有細胞核和粒線體，可進行氧化代謝。","B. 後紅血細胞（metarubricyte）雖核固縮，仍有少量粒線體，保有部分氧化代謝能力。","C. 網狀球（reticulocyte）仍含有核糖體和殘存粒線體，可進行氧化代謝及血紅素合成。","D.（正確）成熟紅血球無核、無粒線體，不具氧化代謝功能，只能進行無氧糖解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_012","year":2023,"roc_year":112,"session":"","examNo":12,"q":"慢性失血可能造成體內之鐵儲存量耗盡，造成缺鐵性貧血，其檢查結果不包括下列何者？","opts":["A. 低血清鐵值","B. 低運鐵蛋白之飽和度","C. 低總鐵結合能力","D. 小球性低色性紅血球"],"ans":2,"exp":"缺鐵性貧血（IDA）的特徵：低血清鐵、低運鐵蛋白飽和度、高總鐵結合能力（TIBC 升高，因運鐵蛋白代償性增加）、小球性低色性紅血球。TIBC 在缺鐵性貧血時應「升高」而非降低，因此「低 TIBC」不是 IDA 的特徵。","we":["A. 低血清鐵（low serum iron）是缺鐵性貧血的典型特徵，此項正確。","B. 低運鐵蛋白飽和度（low transferrin saturation）是缺鐵性貧血的特徵，此項正確。","C.（正確）缺鐵性貧血時 TIBC 應「升高」（代償性），「低 TIBC」是慢性病性貧血的特徵，不是 IDA 的特徵，故本題答案為 C。","D. 小球性低色性紅血球（microcytic hypochromic RBC）是缺鐵性貧血的典型形態特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_013","year":2023,"roc_year":112,"session":"","examNo":13,"q":"以普魯士藍（prussian blue）染色的骨髓抹片，可在何種細胞染到血鐵素（hemosiderin），藉以評估貧血種\r  類？","opts":["A. 骨髓球胚細胞（myeloblast）","B. 巨噬細胞","C. 後紅血細胞（metarubricyte）","D. 網狀球"],"ans":1,"exp":"普魯士藍（Prussian blue / Perls' stain）是評估鐵儲存的特異性染色，可在骨髓巨噬細胞（reticuloendothelial cells）中染出血鐵素（hemosiderin，含鐵的儲存蛋白），呈藍色顆粒。此染色可鑑別缺鐵性貧血（骨髓鐵減少）與慢性病性貧血（骨髓鐵正常或增加）。","we":["A. 骨髓球胚細胞（myeloblast）是顆粒球前驅細胞，不儲存鐵，普魯士藍染色不在此細胞出現。","B.（正確）骨髓巨噬細胞負責儲存鐵（以 hemosiderin 形式），普魯士藍染色在巨噬細胞中顯示藍色顆粒。","C. 後紅血細胞（metarubricyte）不是鐵的儲存細胞，普魯士藍不在此細胞顯色。","D. 網狀球不儲存 hemosiderin，普魯士藍染色結果陰性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_014","year":2023,"roc_year":112,"session":"","examNo":14,"q":"血液樣本置放超過24小時，紅血球檢測數值可能有下列那些情形？①MCV增加 ②MCV減少 ③MCHC增\r  加 ④MCHC減少","opts":["A. ①③","B. ②③","C. ①④","D. ②④"],"ans":2,"exp":"血液樣本置放超過 24 小時後，紅血球會因滲透作用吸水而腫脹，導致 MCV 增加；同時細胞內血紅素濃度相對稀釋，MCHC 降低。因此正確組合為①MCV 增加 + ④MCHC 減少。","we":["A. ①③組合：MCV 增加正確，但 MCHC 增加錯誤（放置後 MCHC 應降低）。","B. ②③組合：MCV 減少錯誤（放置後紅血球吸水膨脹，MCV 應增加）。","C.（正確）①④組合：放置後紅血球吸水導致 MCV 增加，細胞內 Hb 濃度相對降低，MCHC 減少。","D. ②④組合：MCV 減少錯誤，不符合放置後紅血球腫脹的事實。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_015","year":2023,"roc_year":112,"session":"","examNo":15,"q":"下列何部位最不適合採集骨髓進行檢查？","opts":["A. 肋骨","B. 股骨","C. 脛骨","D. 蹠骨"],"ans":3,"exp":"骨髓採集常用部位：犬貓常用肱骨頭、股骨近端、脛骨近端、髂骨嵴、肋骨。蹠骨（metatarsal bone）骨皮質厚、骨髓腔小且位置深，不適合作為骨髓採集部位。","we":["A. 肋骨是可接受的骨髓採集部位，尤其在大型動物常用。","B. 股骨（近端大轉子）是犬貓骨髓採集的常用部位之一。","C. 脛骨（近端）是犬貓骨髓採集常用部位，操作方便。","D.（正確）蹠骨骨髓腔小、骨皮質厚，採集困難，是最不適合的部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_016","year":2023,"roc_year":112,"session":"","examNo":16,"q":"有關貓之血型和輸血，下列敘述何者正確？","opts":["A. 主要有A、B、O等3種血型","B. B血型貓較適合做為供血貓","C. 第一次輸血不會造成不良輸血反應","D. 血液配合試驗中，不論溶血或血球凝集均應判定為不配合"],"ans":3,"exp":"貓輸血的正確知識：貓有 A、B、AB 三種血型（無 O 型）；B 型貓血清中含有高效價抗 A 抗體，即使第一次輸不合血型的血也會發生嚴重輸血反應；血液配合試驗中，溶血或凝集均判定為不相容，均不得輸血。","we":["A. 貓的血型主要有 A、B、AB 三種，並無 O 型，此敘述錯誤。","B. B 型貓含高效價抗 A 天然抗體，輸錯血反應極嚴重，不適合作供血貓，此敘述錯誤。","C. 貓（尤其 B 型貓）第一次輸血即可因天然抗體發生嚴重不良反應，此敘述錯誤。","D.（正確）血液配合試驗中，溶血或凝集均應判定為不配合，均不得輸血，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_017","year":2023,"roc_year":112,"session":"","examNo":17,"q":"有關失血性貧血之特徵，下列敘述何者最符合？","opts":["A. 外出血時鐵和血漿蛋白質會流失，但較內出血時更快恢復","B. 急性出血時常伴隨嗜中性球增多，並有核左轉","C. 慢性失血常可見持續性血小板減少","D. 慢性失血時網織球數目會持續性增加"],"ans":1,"exp":"急性出血時，組織損傷和缺氧會刺激腎上腺分泌腎上腺素，導致骨髓釋放儲備池嗜中性球，出現嗜中性球增多症並伴有核左轉（左轉=出現桿狀核等未成熟型態）。","we":["A. 外出血時鐵和蛋白質會流失，恢復速度較內出血慢（因為鐵無法重吸收），此敘述錯誤。","B.（正確）急性出血時常伴有嗜中性球增多症（應激白血球象）並有核左轉，此敘述正確。","C. 慢性失血時血小板通常增多（反應性血小板增多症），而非減少，此敘述錯誤。","D. 慢性失血因鐵耗盡，骨髓造血受限，網織球數目不會持續增加，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_018","year":2023,"roc_year":112,"session":"","examNo":18,"q":"下列正常家畜末梢血液抹片中，何者之紅血球中央淡染最不明顯？","opts":["A. 貓","B. 馬","C. 牛","D. 山羊"],"ans":2,"exp":"牛的紅血球形狀較小且呈球形（無明顯雙凹碟形），細胞中央幾乎無淡染區（pallor），是所有家畜中中央淡染最不明顯的。","we":["A. 貓的紅血球較小，中央淡染不明顯，但不如牛典型。","B. 馬的紅血球大，且有明顯的錢串現象（rouleaux），有一定程度的淡染區。","C.（正確）牛的紅血球幾乎無雙凹碟形，中央淡染最不明顯，是各家畜中最典型的例子。","D. 山羊紅血球亦缺乏明顯淡染區，但整體而言牛更為典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_019","year":2023,"roc_year":112,"session":"","examNo":19,"q":"下列何種骨髓細胞已無細胞核，細胞質為多染性？","opts":["A. prorubricyte","B. reticulocyte","C. promyelocyte","D. metamyelocyte"],"ans":1,"exp":"網狀球（reticulocyte）是已脫去細胞核（extrusion of nucleus）但尚含殘存 RNA 和粒線體的紅血球前驅細胞，其細胞質因含 RNA 而呈多染性（polychromasia）。prorubricyte 仍有核；promyelocyte 和 metamyelocyte 是顆粒球系列，不符合描述。","we":["A. Prorubricyte 仍有大型細胞核，細胞質嗜鹼性，不符合「無細胞核且多染性」的描述。","B.（正確）Reticulocyte（網狀球）已無細胞核，細胞質含殘存 RNA 故呈多染性，完全符合題意。","C. Promyelocyte 是顆粒球系列的前驅細胞，仍有細胞核，不符合描述。","D. Metamyelocyte 是顆粒球系列，仍有腎形核，不符合描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_020","year":2023,"roc_year":112,"session":"","examNo":20,"q":"在血漿中主要由下列何種物質擔任鐵的運輸？","opts":["A. albumin","B. hemosiderin","C. transferrin","D. haptoglobin"],"ans":2,"exp":"血漿中鐵的運輸主要由運鐵蛋白（transferrin，又稱 siderophilin）負責，每個 transferrin 分子可結合 2 個 Fe³⁺。Albumin 運輸脂肪酸和藥物；hemosiderin 是鐵的儲存形式；haptoglobin 負責結合游離血紅素。","we":["A. Albumin 主要運輸脂肪酸、膽紅素、藥物等，不是鐵的主要運輸蛋白。","B. Hemosiderin 是細胞內鐵的儲存形式（在巨噬細胞中），不是血漿運輸蛋白。","C.（正確）Transferrin（運鐵蛋白）是血漿中專門負責運輸鐵的蛋白質，將鐵從腸道和儲存部位運送至骨髓。","D. Haptoglobin 負責結合游離血紅素（hemoglobin），不是鐵的運輸蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_021","year":2023,"roc_year":112,"session":"","examNo":21,"q":"有關骨髓鐵含量之敘述，下列何者正確？","opts":["A. Wright's stain可特異性評估骨髓鐵貯藏量","B. 過氧化酶染色可特異性評估骨髓鐵貯藏量","C. 慢性病性貧血常見骨髓鐵貯藏量減少","D. 缺鐵性貧血常見骨髓鐵貯藏量減少"],"ans":3,"exp":"骨髓鐵的特異性評估使用普魯士藍（Prussian blue / Perls'）染色。缺鐵性貧血時骨髓儲存鐵（hemosiderin）減少；慢性病性貧血（anemia of chronic disease）時骨髓鐵正常或增加（鐵被巨噬細胞扣留，無法釋出供造血使用）。","we":["A. Wright's stain 是一般血液及骨髓形態染色，無法特異性評估鐵含量。","B. 過氧化酶染色（peroxidase stain）用於鑑別顆粒球系列，不是評估鐵儲存的方法。","C. 慢性病性貧血骨髓鐵儲存量通常正常或增加（因發炎導致鐵滯留），此敘述錯誤。","D.（正確）缺鐵性貧血常見骨髓鐵儲存量減少（普魯士藍染色陰性或極少），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_022","year":2023,"roc_year":112,"session":"","examNo":22,"q":"嗜鹼性球增多症不伴隨嗜酸性球增多症之情形非常少見，但偶爾可見於何種動物？","opts":["A. 牛","B. 馬","C. 貓","D. 犬"],"ans":3,"exp":"在大多數物種，嗜鹼性球增多症幾乎都伴隨嗜酸性球增多症（因共同的調控機制）。但在犬（dog），嗜鹼性球增多症有時可單獨出現而不伴嗜酸性球增多症，此為犬的特殊現象，常見於心絲蟲感染等情況。","we":["A. 牛不是嗜鹼性球增多症不伴嗜酸性球增多症的特殊例子。","B. 馬不是此特殊現象的代表動物。","C. 貓不是此特殊現象的代表動物。","D.（正確）犬偶爾可見嗜鹼性球增多症而不伴嗜酸性球增多症，為犬的特殊臨床特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_023","year":2023,"roc_year":112,"session":"","examNo":23,"q":"何種白血球在移行到組織後，可能還會再進入循環中？","opts":["A. 嗜酸性球","B. 嗜中性球","C. 淋巴球","D. 嗜鹼性球"],"ans":2,"exp":"淋巴球是唯一在移行到組織後仍可再進入血液循環的白血球，稱為淋巴球再循環（lymphocyte recirculation）。其他白血球（嗜中性球、嗜酸性球、嗜鹼性球）移行到組織後便不再返回循環。","we":["A. 嗜酸性球移行至組織後即在組織中發揮功能，不會再返回循環。","B. 嗜中性球移行至組織後執行吞噬功能後凋亡，不會再返回血液循環。","C.（正確）淋巴球具有再循環能力，可從組織經淋巴管回到血液循環，此為其免疫監視功能的基礎。","D. 嗜鹼性球移行至組織後不會再返回循環。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_024","year":2023,"roc_year":112,"session":"","examNo":24,"q":"急性骨髓性白血病（acute myeloid leukemia, AML）是以骨髓內非淋巴性母細胞占所有有核細胞比率多少以上\r   為診斷依據？","opts":["A. 5%","B. 10%","C. 30%","D. 60%"],"ans":2,"exp":"急性骨髓性白血病（AML）的診斷標準：骨髓內非淋巴性母細胞（myeloid blasts）占所有有核細胞比率 ≥ 30%。這是獸醫臨床常用的傳統診斷閾值（與人醫的 20% 閾值略有差異）。","we":["A. 5% 的母細胞比率尚屬正常範圍，不足以診斷 AML。","B. 10% 不足以診斷 AML，仍屬較低比例。","C.（正確）獸醫 AML 診斷標準為非淋巴性母細胞佔有核細胞 ≥ 30%。","D. 60% 雖是 AML 的高度表現，但診斷門檻為 30%，不需到 60%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_025","year":2023,"roc_year":112,"session":"","examNo":25,"q":"有關單核球之敘述，下列何者正確？①於骨髓形成 ②可變成破骨細胞 ③有抗感染功能 ④在血中變成巨\r   噬細胞後對化膿性細菌之反應比嗜中性球強","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":0,"exp":"單核球的正確特性：①於骨髓形成（由骨髓單核球前驅細胞分化）；②移行到組織後可分化為破骨細胞（osteoclast）；③具抗感染功能（吞噬及抗原呈現）；④在血中進入組織後變成巨噬細胞，但巨噬細胞對化膿性細菌的急性反應不如嗜中性球強（嗜中性球是化膿性感染的第一線細胞）。故①②③正確，④錯誤。","we":["A.（正確）①②③均正確：單核球在骨髓形成，可分化為破骨細胞，具抗感染功能。④錯誤：巨噬細胞對化膿性細菌的快速反應不如嗜中性球。","B. ①②④：④錯誤，巨噬細胞對化膿性細菌的反應不比嗜中性球強。","C. ①③④：④錯誤，理由同上。","D. ②③④：①骨髓形成是正確的，此組合排除了①不合理；且④仍錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_026","year":2023,"roc_year":112,"session":"","examNo":26,"q":"下圖為犬Liu's stain血液抹片，中央處白血球內物質最有可能是下列何者？","opts":["A. Ehrlichia canis","B. Hepatozoon canis","C. Trypanosoma cruzi","D. canine distemper inclusion body"],"ans":0,"exp":"題目描述犬血液抹片中白血球內物質，依圖示判斷（含圖題）。Ehrlichia canis 感染單核球或顆粒球，在白血球細胞質內形成桑椹狀包涵體（morula）。本題依照考選部公布答案為 A（Ehrlichia canis）。","we":["A.（正確）Ehrlichia canis 在白血球（單核球/顆粒球）細胞質內形成桑椹狀包涵體（morula），為 Liu's stain 可見的典型包涵體形態。","B. Hepatozoon canis 的配子體（gamont）位於白血球細胞質內，但形態為大型橢圓形，與桑椹狀不同。","C. Trypanosoma cruzi 在心肌細胞內形成假囊，不在血液白血球中形成包涵體。","D. 犬瘟熱包涵體（CDV inclusion body）可出現於紅血球或白血球，呈圓形嗜酸性或嗜鹼性，但形態有別於 Ehrlichia 的桑椹狀。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_實診_027","year":2023,"roc_year":112,"session":"","examNo":27,"q":"下圖為何種嗜中性球增多症之機轉？（每個嗜中性球池之相對大小以長方形面積大小表示，箭頭大小表示各\r   嗜中性球池之細胞進出量。上圖為正常機轉之圖示。）","opts":["A. 化膿性炎症病變之完成期","B. 非炎症性之全身性緊迫","C. 慢性化膿性炎症","D. 化膿性炎症病變之形成期"],"ans":1,"exp":"題目為圖形題，描述嗜中性球各池的大小與流動。非炎症性全身性緊迫（stress/glucocorticoid effect）的特徵：儲備池（bone marrow reserve）大量釋出、邊緣池縮小、循環池增大，表現為成熟型嗜中性球增多，無核左轉。依考選部公布答案為 B。","we":["A. 化膿性炎症完成期：儲備池趨向正常，循環池仍稍高，核左轉減少。","B.（正確）非炎症性全身緊迫（皮質醇效應）：骨髓儲備池大量釋出成熟嗜中性球至循環池，邊緣池細胞減少，圖形顯示循環池擴大而無未成熟細胞。","C. 慢性化膿性炎症：各池持續活化，核左轉持續存在。","D. 化膿性炎症形成期：循環池減少（大量細胞移行至組織），核左轉明顯，圖形顯示循環池縮小。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_實診_028","year":2023,"roc_year":112,"session":"","examNo":28,"q":"有關犬慢性淋巴球性白血病之敘述，下列何者正確？","opts":["A. 可為B 或T細胞來源","B. 淋巴球增多症是短暫的，脾臟不會腫大","C. 只發生在腸、肝的附屬淋巴結","D. 循環中的大顆粒性淋巴球絕對數通常每μL超過100,000個"],"ans":0,"exp":"犬慢性淋巴球性白血病（CLL）可由 B 細胞或 T 細胞來源，最常見為 B 細胞型。特徵為緩慢進行性淋巴球增多症、脾臟腫大、骨髓浸潤。","we":["A.（正確）犬 CLL 可為 B 或 T 細胞來源，此敘述正確。","B. CLL 的淋巴球增多症是持續性（非短暫），且常見脾臟腫大，此敘述錯誤。","C. CLL 是全身性疾病，不只局限於腸、肝淋巴結，此敘述錯誤。","D. 循環中大顆粒淋巴球通常每 μL 數千至數萬，不會常規超過 100,000，此敘述誇大錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_029","year":2023,"roc_year":112,"session":"","examNo":29,"q":"貓嗜中性球在循環池和邊緣池的比例為何？","opts":["A. 1：1","B. 3：1","C. 1：3","D. 1：5"],"ans":0,"exp":"貓的嗜中性球在循環池（circulating pool）和邊緣池（marginating pool）的比例為 1:1，與犬（約 1:1）類似。考選部公布答案為 A（1:1）。","we":["A.（正確）貓嗜中性球循環池與邊緣池的比例為 1:1，與犬相似，此為教科書標準答案。","B. 3:1 是不正確的比例，循環池不大於邊緣池如此懸殊。","C. 1:3 表示邊緣池遠大於循環池，不符合貓的生理特性。","D. 1:5 嚴重誇大邊緣池比例，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_030","year":2023,"roc_year":112,"session":"","examNo":30,"q":"健康動物的血清與陳舊血漿中，皆具有下列何種凝血因子？","opts":["A. II","B. III","C. XI","D. XIII"],"ans":2,"exp":"血清是血液凝固後的上清液，凝血過程中因子 I（fibrinogen）、II、V、VIII 等已消耗，故血清中不含這些因子。陳舊血漿中因子 V、VIII 也因不穩定而降解。凝血因子 XI（接觸活化因子）在血清和陳舊血漿中均仍存在，因其不被消耗且較穩定。","we":["A. 因子 II（凝血酶原）在凝血過程中被消耗，血清中含量極少。","B. 因子 III（組織因子/thromboplastin）存在於組織中，不是血清或血漿中的成分。","C.（正確）因子 XI 在凝血過程中未被消耗，在血清和陳舊血漿中均存在。","D. 因子 XIII（纖維蛋白穩定因子）在凝血過程中被消耗，血清中大量減少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_031","year":2023,"roc_year":112,"session":"","examNo":31,"q":"下列何種因子不參與plasminogen活化成plasmin的過程？","opts":["A. urokinase","B. XIIa因子","C. antithrombin III","D. kallikrein"],"ans":2,"exp":"Plasminogen 活化為 plasmin 的過程由多種活化物參與：urokinase（uPA）、tPA、XIIa 因子（接觸活化途徑）、kallikrein 等。Antithrombin III（AT III）是凝血酶抑制劑，主要抑制凝血酶（thrombin）及 Xa 因子，不參與 plasminogen 的活化過程。","we":["A. Urokinase（尿激酶）是 plasminogen 的直接活化劑，參與活化過程。","B. XIIa 因子（活化的 Hageman factor）可活化 plasminogen，參與接觸活化途徑的纖溶反應。","C.（正確）Antithrombin III 是凝血抑制蛋白，不參與 plasminogen → plasmin 的活化，故不屬於此過程。","D. Kallikrein 可活化 plasminogen，是纖溶系統的一部分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_032","year":2023,"roc_year":112,"session":"","examNo":32,"q":"何種藥物於犬隻可能具有增加血小板總數及反應性的作用？","opts":["A. erythropoietin","B. aspirin","C. penicillin","D. barbiturates"],"ans":0,"exp":"紅血球生成素（erythropoietin, EPO）除促進紅血球生成外，在犬也有促進血小板生成及增加血小板反應性的作用，此為 EPO 的跨系列作用。Aspirin 抑制血小板；penicillin 和 barbiturates 不促進血小板。","we":["A.（正確）Erythropoietin 在犬可增加血小板總數及反應性，具有促血小板作用。","B. Aspirin 不可逆地抑制 COX-1，減少 thromboxane A2 合成，降低血小板凝集，與題意相反。","C. Penicillin 對血小板無顯著的增加效應，不符合題意。","D. Barbiturates 為中樞抑制劑，不具有增加血小板的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_033","year":2023,"roc_year":112,"session":"","examNo":33,"q":"血管內皮細胞會分泌下列那些物質促進止血作用？①fibronectin ②prostacyclin ③plasminogen activator\r   ④thromboplastin","opts":["A. ①②","B. ①③","C. ①④","D. ②④"],"ans":2,"exp":"血管內皮細胞促進止血的物質：①fibronectin（促血小板黏著）、④thromboplastin（組織因子，啟動外源性凝血途徑）。Prostacyclin（PGI2）是抑制血小板凝集的物質（anti-platelet）；plasminogen activator（tPA）是促進纖溶的物質（anti-coagulant）。故促進止血的為①④。","we":["A. ①②：prostacyclin（PGI2）是內皮細胞分泌的血小板抑制劑，不促進止血，此組合錯誤。","B. ①③：plasminogen activator 促進纖溶（溶解血栓），不促進止血，此組合錯誤。","C.（正確）①fibronectin（促血小板黏著）+ ④thromboplastin（啟動凝血）均為促進止血的內皮物質。","D. ②④：prostacyclin 抑制血小板，不促進止血，此組合不完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_034","year":2023,"roc_year":112,"session":"","examNo":34,"q":"有關止血作用中血小板的敘述，下列何者錯誤？","opts":["A. 黏著的血小板會釋出ADP促使血小板持續聚集","B. 血小板和纖維素可形成穩定血栓而止血","C. 由成熟巨核細胞裂解後，須經過約5天才釋出至血液中","D. 血小板膜會釋出血小板磷脂參與連鎖性致活作用"],"ans":2,"exp":"血小板由成熟巨核細胞（megakaryocyte）的細胞質裂解（budding）後直接釋出至血液中，無需額外的 5 天等待。巨核細胞成熟本身約需 4–5 天，但裂解釋出血小板是即時發生的，不是「形成後再等 5 天」。","we":["A. 黏著的血小板釋出 ADP 促使血小板持續聚集，此為血小板活化的正向回饋機制，敘述正確。","B. 血小板和纖維素形成穩定血栓（二期止血），敘述正確。","C.（正確）血小板由成熟巨核細胞裂解後「直接」釋出至血液，不需額外 5 天，「須經過約 5 天才釋出」的說法錯誤，故本題答案為 C。","D. 血小板膜釋出血小板磷脂（platelet phospholipid）參與凝血連鎖反應，敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_035","year":2023,"roc_year":112,"session":"","examNo":35,"q":"若病畜血小板數正常，APTT，OSPT延長，TT，纖維素原，纖維素（原）降解產物正常，最可能為下列何種\r   原因？","opts":["A. 封魏氏病（vWD）","B. 維生素K缺乏","C. DIC","D. 第VII因子缺乏"],"ans":1,"exp":"血小板正常、APTT 延長、OSPT（PT）延長、TT 正常、纖維素原正常、FDP 正常，此組合提示維生素 K 缺乏。維生素 K 缺乏影響因子 II、VII、IX、X，導致 APTT 和 PT 均延長，但纖維素原和血小板不受影響。","we":["A. vWD（封魏氏病）主要延長 buccal mucosal bleeding time 和 APTT（輕度），PT 通常正常，不符合 APTT 和 OSPT 均延長的模式。","B.（正確）維生素 K 缺乏影響依賴維生素 K 的凝血因子（II, VII, IX, X），導致 APTT 和 PT（OSPT）均延長，TT 和纖維素原正常，符合題目所有條件。","C. DIC（瀰漫性血管內凝血）會消耗凝血因子和血小板，導致血小板減少、纖維素原降低、FDP 升高，與本題血小板正常、FDP 正常不符。","D. 第 VII 因子缺乏只影響外源性途徑，導致 PT（OSPT）延長，APTT 正常，不符合本題 APTT 也延長的情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_036","year":2023,"roc_year":112,"session":"","examNo":36,"q":"犬之von Willebrand's disease（vWD）通常90%以上為何種類型？","opts":["A. Type 1","B. Type 2","C. Type 3","D. Type 4"],"ans":0,"exp":"犬的 von Willebrand's disease（vWD）超過 90% 屬於 Type 1，即 vWF 蛋白量減少但結構正常（量的缺乏）。Type 2 為質的缺陷（大分子量多聚體缺失），Type 3 為完全缺乏（最嚴重），無 Type 4 的分類。","we":["A.（正確）犬 vWD 90% 以上為 Type 1，即 vWF 數量減少，是最常見的類型。","B. Type 2 vWD 較罕見，為 vWF 高分子量多聚體缺失，在某些特定犬種可見。","C. Type 3 vWD 是 vWF 完全缺乏，最嚴重，但非最常見類型。","D. vWD 無 Type 4 分類，此選項為干擾選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_037","year":2023,"roc_year":112,"session":"","examNo":37,"q":"急性炎症反應期間，下列何者不是血中的負急性期蛋白（negative acute phase proteins）？","opts":["A. haptoglobin","B. albumin","C. 牛及豬的transferrin","D. 牛的α2-macroglobulin"],"ans":0,"exp":"急性炎症反應期間，正急性期蛋白（positive APP）升高（如 haptoglobin、CRP、fibrinogen），負急性期蛋白（negative APP）降低（如 albumin、transferrin、α2-macroglobulin 在牛）。Haptoglobin 是正急性期蛋白（升高），不是負急性期蛋白，故答案為 A。","we":["A.（正確）Haptoglobin 是正急性期蛋白（acute phase reactant），在炎症時升高，不是負急性期蛋白，為本題答案。","B. Albumin 是典型的負急性期蛋白，炎症時降低，此敘述正確。","C. 牛及豬的 transferrin 是負急性期蛋白，炎症時降低，此敘述正確。","D. 牛的 α2-macroglobulin 是負急性期蛋白，炎症時降低，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_038","year":2023,"roc_year":112,"session":"","examNo":38,"q":"Biuret method為臨床上最常用於檢測下列何者之方法？","opts":["A. 總蛋白質濃度","B. 白蛋白","C. 纖維素原","D. 球蛋白"],"ans":0,"exp":"Biuret method（雙縮脲法）是臨床上最常用於測定血清總蛋白質濃度的方法。原理是蛋白質中的胜肽鍵在鹼性環境中與銅離子形成紫色複合物，吸光度與蛋白質濃度成正比。白蛋白用 BCG 染料法；纖維素原用加熱沉澱法；球蛋白由總蛋白減白蛋白計算得出。","we":["A.（正確）Biuret method 測定血清總蛋白質濃度，是最常用的標準方法。","B. 白蛋白通常以溴甲酚綠（BCG）或溴甲酚紫（BCP）染料結合法測定，非 Biuret。","C. 纖維素原測定使用加熱沉澱法（56–58°C）或凝血功能分析計算，非 Biuret。","D. 球蛋白（globulin）由總蛋白 - 白蛋白計算而得，無直接測定法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_039","year":2023,"roc_year":112,"session":"","examNo":39,"q":"下列何種疾病較不易引起繼發性高脂血症？","opts":["A. 甲狀腺功能低下","B. 糖尿病","C. 馬的肝脂肪代謝障礙","D. 腎上腺皮質功能低下"],"ans":3,"exp":"繼發性高脂血症的常見原因：甲狀腺功能低下、糖尿病、腎病症候群、庫興氏症候群、急性胰臟炎、馬的肝脂肪代謝障礙。腎上腺皮質功能低下（Addison's disease）因皮質醇缺乏，脂質分解減少，較不易引起繼發性高脂血症。","we":["A. 甲狀腺功能低下使脂蛋白脂解酶活性降低，三酸甘油脂和膽固醇清除減少，造成繼發性高脂血症。","B. 糖尿病造成胰島素不足，脂肪分解增加，游離脂肪酸和 VLDL 增加，引起繼發性高脂血症。","C. 馬的肝脂肪代謝障礙（hepatic lipidosis）可造成三酸甘油脂升高，屬繼發性高脂血症。","D.（正確）腎上腺皮質功能低下（Addison's disease）因皮質醇缺乏，脂質分解減少，較不易引起繼發性高脂血症，是本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_040","year":2023,"roc_year":112,"session":"","examNo":40,"q":"下列那一種犬血清脂蛋白質於電泳圖中位於β區？","opts":["A. 乳糜微粒","B. LDL","C. HDL 1","D. HDL 2"],"ans":1,"exp":"犬血清脂蛋白電泳各帶位置：乳糜微粒（chylomicron）留在原點；VLDL 在 pre-β 帶；LDL 在 β 帶；HDL1 和 HDL2 在 α 帶。","we":["A. 乳糜微粒（chylomicron）因分子量最大，電泳時停留在原點（不移動），不在 β 帶。","B.（正確）LDL 在電泳圖中位於 β 帶，與人類脂蛋白電泳位置相同。","C. HDL1 位於 α 帶（靠近陽極端），不在 β 帶。","D. HDL2 也位於 α 帶，不在 β 帶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_041","year":2023,"roc_year":112,"session":"","examNo":41,"q":"下列何種疾病所造成之高三酸甘油脂血症為原發性？","opts":["A. 貓糖尿病","B. 絲球體性腎炎","C. 不列塔尼獵犬（Brittany Spaniels）高三酸甘油脂血症","D. 犬急性胰臟炎"],"ans":2,"exp":"不列塔尼獵犬（Brittany Spaniels）高三酸甘油脂血症是已知的原發性（遺傳性）高脂蛋白血症，為特定犬種的遺傳缺陷。貓糖尿病、絲球體性腎炎、犬急性胰臟炎均屬繼發性（繼發於其他疾病）的高脂血症。","we":["A. 貓糖尿病引起的高三酸甘油脂血症是繼發性，因胰島素不足導致脂質代謝異常。","B. 絲球體性腎炎引起的高脂血症是繼發性，與蛋白尿及白蛋白流失有關。","C.（正確）不列塔尼獵犬高三酸甘油脂血症是原發性遺傳缺陷，為特定品種的代謝病。","D. 犬急性胰臟炎引起的高脂血症是繼發性，因胰脂解酶活性異常所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_042","year":2023,"roc_year":112,"session":"","examNo":42,"q":"動物過度興奮或受到驚嚇時，腎上腺素主要經由下列何種作用使血糖濃度上升？","opts":["A. 食入碳水化合物的消化和吸收","B. glycogenolysis","C. gluconeogenesis","D. glycogenesis"],"ans":1,"exp":"動物受到驚嚇或過度興奮時，腎上腺素主要透過肝醣分解（glycogenolysis）迅速將肝糖原分解為葡萄糖釋入血液，使血糖快速上升（數分鐘內）。糖質新生（gluconeogenesis）是較慢速的過程（需 cortisol 參與，小時尺度）。","we":["A. 食入碳水化合物的消化吸收是餐後血糖上升的機制，與腎上腺素急性作用無關。","B.（正確）腎上腺素主要透過 glycogenolysis（肝醣分解），激活 adenylyl cyclase → cAMP → PKA → phosphorylase，迅速分解肝糖原，使血糖急速上升。","C. Gluconeogenesis（糖質新生）主要受皮質醇調控，反應較慢，不是腎上腺素急性升血糖的主要機制。","D. Glycogenesis（肝糖合成）是將葡萄糖儲存為肝糖原的過程，會降低血糖，非題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_043","year":2023,"roc_year":112,"session":"","examNo":43,"q":"貓血糖值至少超過多少mg/dL時，即會出現尿糖？","opts":["A. 100","B. 150","C. 180","D. 280"],"ans":3,"exp":"貓的腎臟葡萄糖腎閾（renal glucose threshold）約為 280 mg/dL，遠高於犬（約 180 mg/dL）和人。因此貓血糖需超過 280 mg/dL 才會出現尿糖，這也是為何應激性高血糖的貓不一定有尿糖。","we":["A. 100 mg/dL 是正常血糖濃度，遠低於腎閾，不會出現尿糖。","B. 150 mg/dL 低於貓的腎閾，不會出現尿糖。","C. 180 mg/dL 是犬的腎閾，不是貓的腎閾，貓的腎閾更高。","D.（正確）貓的葡萄糖腎閾約為 280 mg/dL，血糖超過此值才出現尿糖，故答案為 D。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_044","year":2023,"roc_year":112,"session":"","examNo":44,"q":"急性腎小管傷害較可能導致下列那些物質之尿中濃度增加，但血中濃度通常不受影響？①ALP ②GGT\r   ③glucose ④bilirubin","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"急性腎小管傷害（ATI）時，近端腎小管受損，ALP 和 GGT（富含於近端腎小管上皮刷狀緣）從管腔刷狀緣釋入尿液，導致尿中濃度增加。由於它們是結合在細胞膜上的酵素，血中濃度不受腎小管傷害直接影響。","we":["A.（正確）①ALP 和 ②GGT 均存在於腎小管上皮刷狀緣，腎小管傷害時釋入尿液，尿中濃度增加，但血中濃度通常不受影響。","B. ②③：glucose（尿糖）出現是因腎小管重吸收障礙，血糖不一定上升；但 GGT+glucose 不是最完整的組合。","C. ③④：bilirubin 在尿中增加通常反映高膽紅素血症（血中增加），不符合「血中不受影響」的條件。","D. ①④：bilirubin（④）不符合條件，理由同上。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_045","year":2023,"roc_year":112,"session":"","examNo":45,"q":"有關鹼磷酶（ALP）上升之敘述，下列何者正確？","opts":["A. 接受類固醇治療的貓，其ALP會有顯著的升高","B. 類固醇所引發的ALP上升，來源主要來自於骨頭","C. 類固醇所引發的ALP上升，在停用類固醇一週後即可恢復到正常值","D. 糖尿病、某些肝臟腫瘤，或是服用抗癲癇藥物等，可能也會引發ALP上升"],"ans":3,"exp":"ALP 上升的正確知識：貓的 ALP 半衰期極短（約 6 小時），接受類固醇治療的貓 ALP 不會像犬一樣顯著升高；犬類固醇誘導的 ALP 來源主要是肝臟（非骨頭）；停用類固醇後 ALP 需數週至數月才能恢復正常；糖尿病、某些肝臟腫瘤、抗癲癇藥物（如 phenobarbital）確實可引發 ALP 上升。","we":["A. 貓的 ALP 半衰期很短，類固醇治療後 ALP 不會顯著升高（與犬不同），此敘述錯誤。","B. 類固醇引發的 ALP 上升在犬主要來源是肝臟（glucocorticoid-induced isoenzyme），不是骨頭，此敘述錯誤。","C. 類固醇誘發的 ALP 升高在停藥後需數週甚至數月才能恢復，「一週後即可恢復」的說法錯誤。","D.（正確）糖尿病、某些肝臟腫瘤、抗癲癇藥物（phenobarbital）等確實可引發 ALP 上升，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_046","year":2023,"roc_year":112,"session":"","examNo":46,"q":"有關丙氨酸轉胺酶（ALT）之敘述，下列何者正確？","opts":["A. 狨猴肝臟細胞中具有高量的ALT，能做為肝臟功能之指標","B. ALT在肝細胞之作用為代謝冬胺酸","C. 犬貓的肝臟細胞受損時，ALT會首先上升，且一般有較AST長的半衰期","D. ALT主要位於肝細胞的粒線體上"],"ans":2,"exp":"ALT（丙氨酸轉胺酶）的正確知識：ALT 在犬貓肝細胞中含量高，肝損傷時首先上升；ALT 主要位於細胞質（cytosol），非粒線體；犬貓 ALT 的半衰期比 AST 長（犬 ALT 約 60 小時 vs AST 約 22 小時），因此可反映持續性肝損傷。","we":["A. 狨猴（marmoset）非犬貓，且本敘述關於物種不準確，此敘述有誤。","B. ALT 代謝丙氨酸（alanine），而非冬胺酸（aspartate，那是 AST 的底物），此敘述錯誤。","C.（正確）犬貓肝細胞受損時 ALT 首先上升，且 ALT 的半衰期比 AST 長，是更持久的肝損傷指標。","D. ALT 主要位於細胞質（cytoplasm），「位於粒線體」說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_047","year":2023,"roc_year":112,"session":"","examNo":47,"q":"有關高膽紅素血症與膽紅素尿之形成原因，下列敘述何者正確？","opts":["A. 溶血所造成之高膽紅素血症以結合型膽紅素增多為特徵","B. 溶血所造成之高膽紅素血症必定伴隨有膽紅素尿的出現","C. 膽汁滯鬱性的高膽紅素血症多伴隨有血氨過高的現象","D. 在犬罹患膽汁滯鬱性的高膽紅素血症時，其膽紅素尿常比高膽紅素血症先出現"],"ans":3,"exp":"膽汁滯鬱性高膽紅素血症：結合型膽紅素（水溶性）可由腎臟排出，因此膽紅素尿常在血中膽紅素顯著升高前即可在尿中偵測到，即「膽紅素尿先於高膽紅素血症出現」在膽汁滯鬱的犬是正確的描述。","we":["A. 溶血造成的高膽紅素血症以非結合型（unconjugated）膽紅素增多為特徵（非結合型為脂溶性，不易從腎臟排出），此敘述錯誤。","B. 溶血造成的高膽紅素血症，非結合型膽紅素增多，不易過腎小球，不必然伴隨膽紅素尿，此敘述錯誤。","C. 膽汁滯鬱性高膽紅素血症與血氨無直接關係，血氨升高見於肝功能衰竭，此敘述錯誤。","D.（正確）犬膽汁滯鬱時，結合型膽紅素（水溶性）可由腎臟排出，膽紅素尿常比血中高膽紅素血症先出現，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_048","year":2023,"roc_year":112,"session":"","examNo":48,"q":"2歲雄性混種犬，近日發現有疲倦、厭食及黃疸現象。體溫為攝氏39.5度，血液生化檢查發現PCV37%，總膽\r   紅素值與ALP活性值顯著上升，ALT、AST活性值升高。則該犬最可能是何種肝臟病變？","opts":["A. 銅中毒","B. 先天性門脈分流","C. 免疫性溶血性貧血","D. 膽管肝炎"],"ans":3,"exp":"題目犬：疲倦、厭食、黃疸、體溫 39.5°C、PCV 37%（輕微貧血）、總膽紅素和 ALP 顯著上升、ALT/AST 升高。此模式（以 ALP 和膽紅素顯著升高為主，伴有肝酵素中度升高）最符合膽管肝炎（cholangiohepatitis）的特徵，即膽管炎症引起的膽汁滯鬱型肝病。","we":["A. 銅中毒主要引起溶血性貧血（PCV 會更低）和 ALT/AST 顯著升高，ALP 升高不如膽汁滯鬱顯著，不符。","B. 先天性門脈分流（portosystemic shunt）多見於幼犬，主要表現為高血氨、神經症狀，膽紅素升高不明顯，不符。","C. 免疫性溶血性貧血（IMHA）以嚴重貧血為主（PCV 通常更低），ALP 升高不明顯，不符本題 PCV 37% 及 ALP 顯著升高的模式。","D.（正確）膽管肝炎以 ALP 和總膽紅素顯著升高、ALT/AST 中度升高、黃疸、發燒為特徵，符合本題所有臨床描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_049","year":2023,"roc_year":112,"session":"","examNo":49,"q":"承上題，該犬之血檢同時發現有磷及BUN、creatinine顯著上升，初判下列何種原因最有可能造成此現象？","opts":["A. 鈎端螺旋體感染","B. 心絲蟲症","C. 腺狀病毒第一型（CAV-1）感染","D. 銅中毒"],"ans":0,"exp":"承 Q48（膽管肝炎犬）：若同時出現磷、BUN 和 creatinine 顯著上升（腎功能指標異常），同時伴有黃疸和發燒，最符合鉤端螺旋體感染（leptospirosis）。鉤端螺旋體同時侵犯肝臟和腎臟，引起肝腎同時受損，是犬中最常見的同時導致肝腎損傷的感染性疾病。","we":["A.（正確）鉤端螺旋體感染（leptospirosis）是犬同時引起肝臟和腎臟損傷的典型感染，解釋 BUN/Cr 升高 + 肝酵素升高 + 黃疸的組合。","B. 心絲蟲症主要影響心臟和肺臟，腎臟損傷不是其主要表現，不符。","C. CAV-1（犬腺狀病毒第一型）主要引起傳染性肝炎，腎臟損傷不常見且通常不嚴重，不符。","D. 銅中毒主要影響肝臟（溶血性貧血），不直接造成腎功能顯著損傷，不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_050","year":2023,"roc_year":112,"session":"","examNo":50,"q":"下列何種疾病會造成多處微小的肝細胞壞死？","opts":["A. 綿羊懷孕毒血症","B. 馬病毒性鼻肺炎（rhinopeumonia）","C. 犬小病毒腸炎","D. 貓傳染性腹膜炎"],"ans":1,"exp":"馬病毒性鼻肺炎（EHV-1）感染肝臟可造成多處微小（multifocal）肝細胞壞死灶，這是其病理特徵之一。綿羊懷孕毒血症為肝臟脂肪變性；犬小病毒主要造成腸道壞死；貓傳染性腹膜炎為肉芽腫性病變。","we":["A. 綿羊懷孕毒血症主要引起肝臟脂肪蓄積（fatty change），而非多處微小壞死。","B.（正確）馬病毒性鼻肺炎（EHV-1）感染可引起肝臟多處微小壞死（multifocal hepatic necrosis），為其典型病理表現。","C. 犬小病毒腸炎主要造成腸道絨毛壞死和出血性腸炎，肝臟不是主要靶器官。","D. 貓傳染性腹膜炎（FIP）引起的肝臟病變以肉芽腫（pyogranuloma）為特徵，不是多處微小壞死。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_051","year":2023,"roc_year":112,"session":"","examNo":51,"q":"有關氨耐受力試驗（ammonia tolerance test）之敘述，下列何者正確？","opts":["A. 單胃動物須先禁食8小時以上方能採血，取得基礎值","B. 血液僅能以EDTA抗凝","C. 如有溶血會有偽低值出現","D. 判讀時應考慮病畜的酸鹼平衡狀態"],"ans":3,"exp":"氨耐受力試驗的正確操作：需禁食 12 小時（不是 8 小時）；血液以肝素（heparin）或 EDTA 抗凝均可；溶血會使氨呈偽高值（非偽低值，因為紅血球富含氨）；判讀時需考慮酸鹼平衡，鹼血症會使 NH4+ 轉為 NH3，影響氨的分布和毒性。","we":["A. 單胃動物應禁食 12 小時（非 8 小時）以確保胃腸道氨生成最少，此敘述錯誤。","B. 血液可使用 EDTA 或肝素抗凝，「僅能使用 EDTA」說法過於絕對且錯誤。","C. 溶血會使氨呈偽「高」值（非低值），因紅血球含豐富氨，溶血後氨釋入血漿，此敘述錯誤。","D.（正確）判讀時應考慮酸鹼平衡：鹼血症增加 NH3 比例（毒性強），酸血症增加 NH4+ 比例（毒性弱），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_052","year":2023,"roc_year":112,"session":"","examNo":52,"q":"有關膽汁酸代謝與功能之敘述，下列何者最正確？","opts":["A. 膽汁酸乃由三酸甘油脂合成而來","B. 膽汁酸會幫助膽固醇的吸收","C. 當小腸吸收不良時，可造成血中膽汁酸濃度偏低","D. 膽汁酸具有殺菌功效，肝細胞則因有自我保護的機制，不受膽汁酸傷害"],"ans":1,"exp":"膽汁酸（bile acid）由膽固醇合成（非三酸甘油脂）；膽汁酸協助脂肪（包括膽固醇）的消化吸收（乳化作用），幫助膽固醇吸收是正確的；腸道吸收不良時，未被重吸收的膽汁酸從糞便流失，可能導致血中膽汁酸濃度偏低（此描述也是事實，但 B 更直接正確）。","we":["A. 膽汁酸由膽固醇合成（非三酸甘油脂），此敘述錯誤。","B.（正確）膽汁酸協助膽固醇等脂肪的乳化和吸收，此敘述正確。","C. 小腸吸收不良時膽汁酸從腸肝循環流失，血中膽汁酸可降低，此敘述也正確，但與 B 相比 B 更為直接。","D. 肝細胞在嚴重膽汁滯鬱時仍會受到膽汁酸傷害，「不受傷害」的說法過於絕對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_053","year":2023,"roc_year":112,"session":"","examNo":53,"q":"下列何者的唾液中即含有足量的澱粉酶？","opts":["A. 牛","B. 豬","C. 狗","D. 羊"],"ans":1,"exp":"豬的唾液中含有足量的澱粉酶（salivary amylase），可在口腔即開始澱粉消化，這與雜食性飲食習慣有關。犬貓等肉食性動物唾液中澱粉酶含量極少或缺乏；牛羊等反芻動物唾液中澱粉酶也很少。","we":["A. 牛的唾液中缺乏有效量的澱粉酶，反芻動物主要依靠瘤胃微生物消化碳水化合物。","B.（正確）豬的唾液中含有足量澱粉酶，可在口腔進行澱粉的初步消化。","C. 狗的唾液中幾乎不含澱粉酶，澱粉消化從小腸開始（胰澱粉酶）。","D. 羊的唾液中澱粉酶含量極低，與牛類似，主要靠瘤胃微生物發酵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_054","year":2023,"roc_year":112,"session":"","examNo":54,"q":"6歲已結紮德國牧羊犬，2個月來持續地慢性下痢、食慾佳、外觀消瘦。血檢發現淋巴球偏低，血清總蛋白與\r   白蛋白均偏低，A/G ratio落在參考值範圍內，血糖也偏低，其血中蛋白質濃度過低的原因最有可能為何？","opts":["A. 脾臟腫大造成滯留","B. 體內重分布不均","C. 腎臟功能喪失","D. 腸道吸收功能不佳"],"ans":3,"exp":"此犬：慢性下痢、食慾佳、消瘦、淋巴球偏低、血清總蛋白和白蛋白均偏低、A/G ratio 正常（兩者等比例下降）、血糖偏低。A/G 正常且兩者均低提示蛋白質從腸道流失（protein-losing enteropathy, PLE），食慾佳但消瘦+蛋白質流失=腸道吸收功能不佳。","we":["A. 脾臟腫大造成蛋白質滯留不會使 A/G ratio 保持正常（滯留主要影響球蛋白），且下痢症狀不符。","B. 體內重分布不均（如腹水）不會解釋 A/G 正常且兩者均低的情況。","C. 腎臟功能喪失（腎病症候群）主要使白蛋白（小分子）流失，A/G ratio 通常降低，不符。","D.（正確）腸道吸收功能不佳（PLE/吸收不良）：蛋白質和白蛋白等比流失，A/G 維持正常；同時有低血糖（糖吸收不足）、淋巴球偏低（腸道淋巴管擴張流失淋巴球），完全符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_055","year":2023,"roc_year":112,"session":"","examNo":55,"q":"承上題，將該犬透過右旋木糖（D-xylose）試驗尋找病因，投予後的0.5～2小時，其血漿中的右旋木糖濃度均\r   偏低，造成此結果可能的原因為何？","opts":["A. 肝門靜脈分流","B. 內出血","C. 腎絲球體腎炎","D. 空腸吸收不良"],"ans":3,"exp":"D-xylose（右旋木糖）試驗：口服後在空腸被動吸收，不需消化酵素，直接進入血液。若口服後 0.5–2 小時血漿木糖濃度偏低，表示空腸（jejunum）的被動吸收能力不足，即空腸吸收不良（jejunal malabsorption）。","we":["A. 肝門靜脈分流：木糖被吸收後直接分流至全身循環，血漿濃度反而可能正常或升高，不是偏低的原因。","B. 內出血不影響小腸對木糖的吸收，不是造成血漿木糖偏低的原因。","C. 腎絲球體腎炎：木糖從腎臟大量排出，血漿濃度可能偏低，但這是排除而非吸收問題；且本案例其他指標更符合腸道吸收不良。","D.（正確）D-xylose 試驗中血漿濃度偏低，最直接的原因是空腸吸收不良（jejunal malabsorption），木糖無法有效從小腸被動吸收進入血液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_056","year":2023,"roc_year":112,"session":"","examNo":56,"q":"承上題，該犬隻的trypsin-like immunoreactivity（TLI）值若在正常範圍內，糞便進行明膠消化試驗呈現陽性反\r   應，則下列敘述何者最正確？","opts":["A. 血清總蛋白濃度偏低，可能會有繼發性凝血功能不足的情況出現","B. 低血糖可能源自於內分泌胰腺之功能不足","C. 低血糖可能源自於外分泌胰腺之功能不足","D. 淋巴球數目偏低可能源自於腸道的流失"],"ans":3,"exp":"TLI 正常表示外分泌胰腺功能正常（非 EPI）；明膠消化試驗陽性表示糞便中有蛋白酶活性（外分泌胰腺功能正常）。該犬的淋巴球偏低最可能源自腸道淋巴管擴張（lymphangiectasia），淋巴球從腸道流失（protein-losing enteropathy/lymphangiectasia）導致血中淋巴球減少。","we":["A. 血清總蛋白濃度偏低確實可能影響凝血因子合成，但本題問的是「最正確」的敘述，凝血問題非此病例的核心發現。","B. 低血糖不源自「內分泌」胰腺功能不足（胰島素瘤），因為 TLI 正常且症狀指向吸收不良。","C. TLI 正常且明膠消化試驗陽性，表示外分泌胰腺功能正常，低血糖不源於外分泌胰腺功能不足，此敘述錯誤。","D.（正確）淋巴球偏低最可能源自腸道淋巴管擴張，淋巴球經腸道流失（腸道性淋巴球丟失），符合蛋白流失性腸病（PLE/lymphangiectasia）的病理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_057","year":2023,"roc_year":112,"session":"","examNo":57,"q":"有關乳酸鹽脫氫酶（lactate dehydrogenase, LDH）之異構體，下列敘述何者正確？","opts":["A. LDH為四聚體（tetramer），由兩種次單位，心型（heart）及肌肉型（muscle）組合而成","B. 電泳法定量時，LDH5最靠近陽極","C. LDH1對熱不安定，容易降解","D. 酵素分類上LDH屬於EC3群的水解酶（hydrolase）"],"ans":0,"exp":"LDH（乳酸脫氫酶）的正確特性：LDH 是四聚體（tetramer），由 H 型（heart）和 M 型（muscle）兩種次單位組成 5 種異構體（LDH1–LDH5）；電泳中 LDH1 最靠近陽極（負電荷最多），LDH5 靠近陰極；LDH1 對熱穩定（heat-stable）；LDH 酵素分類屬於 EC1（氧化還原酶/oxidoreductase）。","we":["A.（正確）LDH 為四聚體，由心型（H）和肌肉型（M）次單位組合，共 5 種異構體（H4, H3M, H2M2, HM3, M4），此敘述正確。","B. 電泳中 LDH1（H4）最靠近陽極（最快移動），LDH5 靠近陰極，「LDH5 最靠近陽極」說法錯誤。","C. LDH1 對熱穩定（heat-stable），不是「不安定」，此敘述錯誤（LDH5 才是熱不安定）。","D. LDH 酵素分類屬於 EC1（氧化還原酶，oxidoreductase），不是 EC3（水解酶，hydrolase），此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_058","year":2023,"roc_year":112,"session":"","examNo":58,"q":"以修飾性Gomori trichrome染色肌肉組織，可分別將肌肉蛋白質及粒線體染成什麼顏色？","opts":["A. 前者染成粉紅色，後者染成綠色","B. 前者染成綠色，後者染成紅色","C. 前者染成紫色，後者染成粉紅色","D. 兩者無法以Gomori trichrome染色法區別顏色"],"ans":0,"exp":"修飾性 Gomori trichrome 染色（modified Gomori trichrome stain）用於肌肉組織：正常肌肉蛋白質（肌纖維）染成紅色至粉紅色；異常聚積的粒線體（如 ragged-red fibers）染成綠色至藍綠色。此染色常用於診斷粒線體肌病（mitochondrial myopathy）中的 ragged-red fibers。","we":["A.（正確）修飾性 Gomori trichrome 染色：肌肉蛋白質染成粉紅色，粒線體聚積區域（異常）染成綠色，此為正確描述。","B. 前者綠色後者紅色的說法顛倒了兩者的染色結果。","C. 紫色和粉紅色不是 Gomori trichrome 染色的典型結果。","D. Gomori trichrome 染色可以區別正常肌纖維和粒線體聚積區域，此說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_059","year":2023,"roc_year":112,"session":"","examNo":59,"q":"下列肌肉疾病，何者屬於退行性肌病？","opts":["A. 牛梭菌性肌炎","B. 豬旋毛蟲感染症","C. 犬免疫媒介性多發性肌炎","D. 犬肌肉強直症"],"ans":3,"exp":"退行性肌病（degenerative myopathy）是指肌肉細胞因代謝或遺傳缺陷而漸進性退化，非炎症、非感染性。犬肌肉強直症（myotonia congenita）是遺傳性退行性肌病（氯離子通道缺陷）。梭菌性肌炎為感染性、旋毛蟲感染為寄生蟲性、免疫媒介性多發性肌炎為炎症性。","we":["A. 牛梭菌性肌炎（blackleg, Clostridium chauvoei）是感染性（細菌性）肌肉疾病，非退行性。","B. 豬旋毛蟲感染症是寄生蟲性肌肉疾病，非退行性肌病。","C. 犬免疫媒介性多發性肌炎是炎症性肌病，非退行性。","D.（正確）犬肌肉強直症（myotonia）是遺傳性退行性肌病，因肌肉細胞膜氯離子通道缺陷導致肌肉持續收縮，屬退行性類別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_060","year":2023,"roc_year":112,"session":"","examNo":60,"q":"下列何種物質存在時，對於血液中肌酸酐（creatinine）測定出現偽高值之影響最為顯著？","opts":["A. 乳酸（lactic acid）","B. 酮體（ketone body）","C. 紫質（prophyrin）","D. 膽綠素（biliverdin）"],"ans":1,"exp":"Jaffe 法（鹼性苦味酸法）是最常用的肌酸酐測定法，但酮體（ketone bodies，尤其是 acetoacetate）結構類似苦味酸的反應底物，會與苦味酸發生非特異性反應，造成肌酸酐偽高值。酮尿/酮血症患者（如糖尿病酮酸中毒）的肌酸酐可能被高估。","we":["A. 乳酸對 Jaffe 法的干擾相對較小，不是最顯著的偽高值來源。","B.（正確）酮體（尤其是 acetoacetate）對 Jaffe 法有顯著的非特異性反應，造成肌酸酐偽高值，影響最為顯著。","C. 紫質（porphyrin）對肌酸酐測定的干擾不如酮體顯著。","D. 膽綠素（biliverdin）可干擾某些比色法，但對 Jaffe 法肌酸酐偽高值的影響不如酮體顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_061","year":2023,"roc_year":112,"session":"","examNo":61,"q":"何種健康動物的尿通常是混濁的？","opts":["A. 牛","B. 馬","C. 犬","D. 貓"],"ans":1,"exp":"馬的尿液因富含碳酸鈣結晶、黏蛋白及各種鹽類，外觀通常呈混濁白色至乳白色，這是正常現象，不代表病理。其他健康動物（犬、貓、牛）的尿液通常是清澈至淡黃色。","we":["A. 牛的正常尿液通常清澈至淡黃色，不是混濁的。","B.（正確）馬的正常尿液因含大量碳酸鈣結晶和黏蛋白，外觀呈混濁乳白色，屬正常現象。","C. 犬的正常尿液為清澈至淡黃色，混濁尿提示病理狀態。","D. 貓的正常尿液清澈，若混濁則需警惕泌尿道問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_062","year":2023,"roc_year":112,"session":"","examNo":62,"q":"尿中膽紅素可因下列那一項狀況而被破壞降解？","opts":["A. 室溫升高","B. 暴露在陽光下","C. 含有血液成分","D. 含有白蛋白"],"ans":1,"exp":"尿液中的膽紅素（bilirubin）對光（尤其是紫外線和自然光）極為敏感，暴露在陽光下會迅速光氧化降解為膽綠素（biliverdin）等無色代謝物，導致假陰性結果。因此尿液樣本必須避光保存並盡快檢測。","we":["A. 室溫升高雖會加速代謝，但主要是微生物代謝的問題，不是膽紅素降解的主要因素。","B.（正確）暴露在陽光下會使尿中膽紅素光氧化分解，是造成膽紅素降解的最主要原因。","C. 含有血液成分不會使膽紅素降解，反而可能干擾試紙讀值（偽陽性）。","D. 含有白蛋白不會使膽紅素降解，白蛋白反而可以結合膽紅素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_063","year":2023,"roc_year":112,"session":"","examNo":63,"q":"尿液試紙之檢驗中，下列那一項與泌尿系統之疾病最不相關？","opts":["A. glucose","B. bilirubin","C. occult blood","D. protein"],"ans":1,"exp":"尿液試紙中 bilirubin 的升高反映肝臟疾病（膽汁滯鬱）或溶血，不是直接的泌尿系統疾病指標。Glucose、occult blood（潛血）、protein 均與泌尿系統疾病直接相關（腎小管傷害、腎絲球疾病、泌尿道出血等）。因此 bilirubin 與泌尿系統疾病的直接相關性最低。","we":["A. Glucose 在尿中出現（glycosuria）可能提示腎小管吸收障礙（腎性糖尿）或血糖過高，與泌尿系統相關。","B.（正確）Bilirubin 尿主要反映肝臟或溶血疾病（前腎性/肝性），與泌尿系統疾病本身最不直接相關。","C. Occult blood（潛血）直接反映泌尿道出血、溶血尿（hemoglobinuria）或肌紅蛋白尿，與泌尿系統相關。","D. Protein 尿反映腎絲球或腎小管疾病，是泌尿系統疾病的重要指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_064","year":2023,"roc_year":112,"session":"","examNo":64,"q":"有關腎小管各段對離子與水分吸收狀況之敘述，下列何者最正確？","opts":["A. 尿液的滲透壓在近曲小管（proximal tubule）為高張狀態（hyperosmotic）","B. 尿液的滲透壓在亨利氏環（loop of Henle）下降支為高張狀態（hyperosmotic）","C. 血管增壓素（vasopressin, ADH）作用於近曲小管，幫助水分的重吸收","D. 中樞性尿崩症在投與血管增壓素（vasopressin, ADH）時會有惰性反應"],"ans":1,"exp":"亨利氏環（loop of Henle）的下降支（descending limb）對水有通透性但對溶質不通透，隨著深入腎髓質，尿液水分滲出，溶質濃縮，尿液滲透壓逐漸升高，在最深點呈高張狀態（hyperosmotic）。近曲小管等張重吸收；ADH 作用於集尿管；中樞性尿崩症在投與 ADH 後反應良好（腎源性尿崩症才有惰性反應）。","we":["A. 近曲小管（proximal tubule）進行等張性重吸收（isotonic reabsorption），尿液在此段呈等張狀態，非高張，此敘述錯誤。","B.（正確）亨利氏環下降支對水通透、對溶質不通透，水分外滲使尿液滲透壓升高，呈高張狀態（hyperosmotic），此敘述正確。","C. ADH（vasopressin）作用於集尿管和遠曲小管，不是近曲小管，此敘述錯誤。","D. 中樞性尿崩症是 ADH 分泌不足，投與外源性 ADH 後「有正常反應」，腎源性尿崩症才有惰性反應，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_065","year":2023,"roc_year":112,"session":"","examNo":65,"q":"腎前性氮血症病畜之尿中溶質含量高、尿滲透力與血漿滲透力之比亦高，但尿中何種離子之濃度會偏低？","opts":["A. 鉀離子","B. 銨離子","C. 重碳酸根離子","D. 鈉離子"],"ans":3,"exp":"腎前性氮血症時，腎臟有效循環血量減少，腎素–血管張力素–醛固酮系統（RAAS）活化，醛固酮增加腎小管對鈉的重吸收，鈉離子大量回收，因此尿中鈉離子濃度會偏低（尿鈉低），這是鑑別腎前性與腎因性氮血症的重要指標。","we":["A. 鉀離子：醛固酮促進鉀排泄，腎前性氮血症時尿鉀可能增加，不是偏低的主要離子。","B. 銨離子：氮血症時蛋白質代謝增加，尿中氨排泄可增加，不會偏低。","C. 重碳酸根離子：在代謝性鹼中毒時可能從尿中排出，腎前性氮血症本身不特別造成尿重碳酸根偏低。","D.（正確）腎前性氮血症時，RAAS 活化使腎小管大量重吸收鈉，尿中鈉離子濃度偏低（< 20 mEq/L），是鑑別腎前性與腎因性氮血症的重要指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_066","year":2023,"roc_year":112,"session":"","examNo":66,"q":"有關各種氮血症之敘述，下列何者正確？①尿道阻塞所引起之氮血症，會出現少尿或無尿 ②腎因性氮血症\r   的urinary protein/creatinine ratios可能會上升 ③腎前性氮血症可能會貧血 ④腎因性氮血症尿比重較常會上  升","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"正確分析：①尿道阻塞引起腎後性氮血症，確實會出現少尿或無尿（正確）；②腎因性氮血症（腎絲球損傷）可使尿蛋白/肌酸酐比值（UPC）上升（正確）；③腎前性氮血症（脫水、出血）不會直接造成貧血；④腎因性氮血症時腎臟無法正常濃縮尿液，尿比重通常「下降」而非上升。故①②正確。","we":["A.（正確）①尿道阻塞導致少尿/無尿（正確）+ ②腎因性氮血症 UPC 可上升（正確），此組合正確。","B. ②③：③腎前性氮血症不直接引起貧血（腎因性慢性腎病才會因 EPO 不足引起貧血），此組合部分錯誤。","C. ③④：兩者均有誤，③腎前性不引起貧血，④腎因性尿比重下降而非上升。","D. ①④：④腎因性氮血症尿比重應「下降」（腎臟無法濃縮），此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_067","year":2023,"roc_year":112,"session":"","examNo":67,"q":"有關血鈣的分布情形，下列敘述何者正確？","opts":["A. 主要為與檸檬酸鹽或磷酸鹽結合的複合體鈣","B. 約有40～50%的鈣離子會與白蛋白結合","C. 主要為與碳酸鹽結合的複合體鈣","D. 約有40～50%的鈣離子會與球蛋白結合"],"ans":1,"exp":"血鈣的分布：約 40–50% 與白蛋白結合（蛋白結合鈣）；約 10% 與檸檬酸鹽、磷酸鹽等形成複合體；約 50% 為游離離子鈣（ionized calcium）。主要的結合形式是與白蛋白結合，因此白蛋白濃度會顯著影響血鈣測定值。","we":["A. 與檸檬酸鹽或磷酸鹽結合的複合體鈣只占約 10%，不是「主要」形式，此敘述錯誤。","B.（正確）約 40–50% 的鈣與白蛋白結合，是蛋白結合鈣的主要載體，此敘述正確。","C. 與碳酸鹽結合的複合體鈣比例極小，不是主要形式，此敘述錯誤。","D. 與球蛋白結合的鈣量遠少於與白蛋白結合的量，40–50% 與球蛋白結合的說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_068","year":2023,"roc_year":112,"session":"","examNo":68,"q":"下列何者通常會引起高磷血症？","opts":["A. 營養性副甲狀腺功能亢進","B. 溶血的檢體導致之偽性上升","C. 呼吸性鹼血症","D. 尿崩症"],"ans":1,"exp":"溶血檢體中紅血球內含有高濃度的有機磷酸鹽（2,3-BPG、ATP），溶血後這些磷酸鹽釋入血漿，導致血漿磷濃度假性升高（偽高磷血症）。這是臨床上溶血樣本常見的干擾。","we":["A. 營養性副甲狀腺功能亢進（NSHP）PTH 升高促進腎臟磷排泄增加，最終通常造成低磷血症，而非高磷血症。","B.（正確）溶血檢體中紅血球磷酸鹽釋出，造成血磷偽性升高（pseudo-hyperphosphatemia），是最常見的高磷血症假象。","C. 呼吸性鹼血症（過度換氣）會使磷酸鹽由血漿移入細胞內，造成低磷血症，不是高磷血症。","D. 尿崩症導致多尿，磷由尿液流失增加，通常造成低磷血症，不是高磷血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_069","year":2023,"roc_year":112,"session":"","examNo":69,"q":"有關抑鈣素及活性型維生素D3（1,25-dihydroxycholecalciferol）之敘述，下列何者正確？","opts":["A. 抑鈣素（calcitonin）由副甲狀腺之濾泡細胞分泌","B. 活性型維生素D3主要促進腸黏膜對鈣吸收之能力","C. 低血鈣時會刺激calcitonin之分泌","D. 低血鈣時會使活性型維生素D3在肝臟被加速轉化"],"ans":1,"exp":"活性型維生素 D3（1,25-(OH)2-D3，calcitriol）的主要功能是促進腸黏膜對鈣（和磷）的吸收，增加腸道鈣吸收效率。Calcitonin 由甲狀腺 C 細胞（旁濾泡細胞）分泌，在高血鈣時分泌；活性維生素 D3 在腎臟（而非肝臟）被活化（1α-hydroxylase）。","we":["A. Calcitonin 由甲狀腺的旁濾泡細胞（C 細胞）分泌，不是副甲狀腺，此敘述錯誤。","B.（正確）活性型維生素 D3 主要促進腸黏膜對鈣的吸收，增加腸道鈣吸收能力，此敘述正確。","C. 低血鈣時刺激 PTH 分泌；低血鈣反而「抑制」calcitonin 分泌（高血鈣才刺激 calcitonin），此敘述錯誤。","D. 活性型維生素 D3（1,25-(OH)2-D3）在腎臟由 1α-hydroxylase 活化，不是在肝臟（肝臟負責第 25 位羥基化），此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_071","year":2023,"roc_year":112,"session":"","examNo":71,"q":"尿液試紙主要測試尿液中那些酮體？","opts":["A. acetone & acetoacetate","B. acetoacetate & β-hydroxybutyrate","C. acetone & β-hydroxybutyrate","D. acetone, acetoacetate & β-hydroxybutyrate"],"ans":0,"exp":"尿液試紙（nitroprusside reaction）主要檢測 acetone 和 acetoacetate，對 β-hydroxybutyrate 不反應（因 β-hydroxybutyrate 缺乏酮基）。糖尿病酮酸中毒（DKA）時血中 β-hydroxybutyrate 比例最高，但試紙可能低估酮體總量。","we":["A.（正確）尿液試紙（亞硝基鐵氰化鈉法）偵測 acetone 和 acetoacetate，不偵測 β-hydroxybutyrate。","B. Acetoacetate + β-hydroxybutyrate：試紙對 β-hydroxybutyrate 無反應，此組合不正確。","C. Acetone + β-hydroxybutyrate：試紙對 β-hydroxybutyrate 無反應，此組合不正確。","D. 三者全測：試紙對 β-hydroxybutyrate 無反應，無法同時測到三者，此說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_072","year":2023,"roc_year":112,"session":"","examNo":72,"q":"胰臟中的δ細胞主要分泌下列何種激素？","opts":["A. insulin-like growth factor -1（IGF-1）","B. somatotropin","C. somatostatin","D. glucagon"],"ans":2,"exp":"胰臟的 Langerhans 島中有三種主要細胞：α 細胞分泌 glucagon；β 細胞分泌 insulin；δ 細胞分泌 somatostatin（體制素）。Somatostatin 抑制 glucagon 和 insulin 的分泌，並抑制多種消化道激素的分泌。","we":["A. IGF-1 主要由肝臟在 GH（生長激素）刺激下合成，不是胰臟 δ 細胞分泌。","B. Somatotropin（生長激素，GH）由腦下垂體前葉分泌，不是胰臟 δ 細胞。","C.（正確）胰臟 δ 細胞分泌 somatostatin（體制素），抑制相鄰的 α 和 β 細胞功能。","D. Glucagon 由胰臟 α 細胞分泌，不是 δ 細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_073","year":2023,"roc_year":112,"session":"","examNo":73,"q":"下列何者是腎上腺皮質功能低下最常見之電解質變化？","opts":["A. 低血鈉","B. 低血鉀","C. 低血鈣","D. 低血磷"],"ans":0,"exp":"腎上腺皮質功能低下（Addison's disease / hypoadrenocorticism）因醛固酮缺乏，腎小管無法保鈉排鉀，導致低血鈉（hyponatremia）和高血鉀（hyperkalemia）。低血鈉是最常見的電解質變化，也是最重要的診斷線索（Na:K 比值 < 27 為診斷依據之一）。","we":["A.（正確）腎上腺皮質功能低下最常見電解質變化為低血鈉（因醛固酮缺乏，腎小管無法保留鈉離子）。","B. 腎上腺皮質功能低下時血鉀通常「升高」（高血鉀），而非低血鉀，此敘述錯誤。","C. 低血鈣不是腎上腺皮質功能低下的典型電解質表現，此敘述錯誤。","D. 低血磷不是腎上腺皮質功能低下的典型電解質表現，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_074","year":2023,"roc_year":112,"session":"","examNo":74,"q":"下列何種測試不能被用來篩檢庫興氏症候群（Cushing's syndrome）的可能患犬？","opts":["A. 內源性血漿ACTH濃度","B. ACTH刺激試驗","C. 低劑量之dexamethasone抑制試驗","D. 尿中cortisol/creatinine比值"],"ans":0,"exp":"庫興氏症候群（Cushing's syndrome）的篩查試驗包括：ACTH 刺激試驗、低劑量 dexamethasone 抑制試驗（LDDST）、尿中 cortisol/creatinine 比值（UCCR）。內源性血漿 ACTH 濃度是用來鑑別 PDH（垂體依賴性）和腎上腺腫瘤（ADT）的「鑑別診斷」試驗，而非篩查試驗，不能用於篩檢是否有庫興氏症。","we":["A.（正確）內源性血漿 ACTH 濃度是用於鑑別庫興氏症病因的試驗（分型），不能用於篩查是否患有庫興氏症候群。","B. ACTH 刺激試驗可用於篩查庫興氏症（腎上腺反應過度），屬篩查試驗，可排除此選項。","C. 低劑量 dexamethasone 抑制試驗（LDDST）是最常用的庫興氏症篩查試驗，敏感性高。","D. 尿中 cortisol/creatinine 比值（UCCR）是高敏感性篩查試驗，陰性可排除庫興氏症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_075","year":2023,"roc_year":112,"session":"","examNo":75,"q":"成年動物總體液約占體重之多少？","opts":["A. 70%","B. 60%","C. 40%","D. 20%"],"ans":1,"exp":"成年動物的總體液（total body water, TBW）約占體重的 60%（人和大多數哺乳動物）。新生兒約 70–80%；老年動物因肌肉減少而略低。60% 為標準答案，其中約 2/3（40%）為細胞內液，1/3（20%）為細胞外液。","we":["A. 70% 是新生兒的 TBW 比例，不是成年動物的標準值。","B.（正確）成年動物 TBW 約占體重 60%，此為獸醫臨床和生理學標準答案。","C. 40% 僅為細胞內液的比例，不是 TBW 的總值。","D. 20% 為細胞外液的比例，不是 TBW 的總值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_076","year":2023,"roc_year":112,"session":"","examNo":76,"q":"有關酸鹼控制之敘述，下列何者正確？","opts":["A. 的改變稱為呼吸性異常，需較長的時間進行代償作用","B. 的改變稱為呼吸性異常，可於數分鐘內完成代償作用","C. PCO 2 的改變稱為呼吸性異常，需較長的時間進行代償作用","D. PCO 2 的改變稱為呼吸性異常，可於數分鐘內完成代償作用"],"ans":3,"exp":"PCO2 的改變稱為呼吸性酸鹼異常（respiratory acid-base disturbance），肺臟可在數分鐘內（minutes）通過調整呼吸速率完成代償。HCO3-（重碳酸根）的改變稱為代謝性異常，腎臟代償需數天時間。","we":["A. 選項 A 文字不完整（HCO3- 符號可能遺失），但若指代謝性異常的腎臟代償，確實需較長時間，與「呼吸性異常」分類混淆。","B. 選項 B 文字不完整，若指 HCO3- 改變稱為呼吸性異常則定義錯誤；且代謝性代償不能在數分鐘完成。","C. PCO2 改變確為呼吸性異常，但「需較長時間進行代償」的說法不準確——呼吸性本身代償快，是代謝性代償需較長時間。","D.（正確）PCO2 的改變稱為呼吸性異常，肺臟可在數分鐘內調整呼吸頻率和深度以完成代償，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_077","year":2023,"roc_year":112,"session":"","examNo":77,"q":"何者會造成低血氧症（hypoxemia）及肺泡－動脈氧氣壓力差（alveolar-arterial oxygen gradient）顯著上升（大\r   於25 mmHg）？","opts":["A. 換氣不足（hypoventilation）","B. 降低吸入氧濃度（low inspired oxygen concentration）","C. 換氣與血液灌流不搭配［ventilation/perfusion（V/Q）mismatch］","D. 過度換氣（hyperventilation）"],"ans":2,"exp":"肺泡–動脈氧氣壓力差（A-a gradient）顯著上升（> 25 mmHg）表示肺內氣體交換障礙。換氣/血流不搭配（V/Q mismatch）是最常見的造成 A-a gradient 顯著上升且伴有低血氧的原因（如肺炎、肺水腫、肺栓塞）。換氣不足和低吸入氧濃度也會造成低血氧，但 A-a gradient 不一定顯著上升。","we":["A. 換氣不足（hypoventilation）造成 PaCO2 升高、PaO2 下降，但 A-a gradient 通常正常（因肺本身氣體交換功能正常），不符合 A-a gradient > 25 mmHg。","B. 低吸入氧濃度（如高海拔）造成 PaO2 下降，但肺臟本身功能正常，A-a gradient 不顯著上升，不符合條件。","C.（正確）V/Q mismatch 造成肺內分流效應，動脈血未能充分氧合，A-a gradient 顯著上升（> 25 mmHg）且伴有明顯低血氧，符合所有條件。","D. 過度換氣（hyperventilation）會使 PaCO2 下降、PaO2 升高，反而不造成低血氧症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_078","year":2023,"roc_year":112,"session":"","examNo":78,"q":"下列何者在乳酸中毒之血液氣體分析中最不常見？","opts":["A. 下降","B. anion gap增加","C. hyperchloremia","D. pH下降"],"ans":2,"exp":"乳酸中毒（lactic acidosis）是高 anion gap 代謝性酸中毒，特徵：pH 下降、HCO3- 下降、anion gap 增加（乳酸根為未測量陰離子）。Hyperchloremia（高氯血症）是正常 anion gap 代謝性酸中毒（如腸道 HCO3- 流失、腎小管酸中毒）的特徵，不是乳酸中毒的表現，因此最不常見。","we":["A. HCO3- 下降（緩衝系統消耗）在乳酸中毒中常見，符合預期。","B. Anion gap 增加（乳酸根作為未測量陰離子）是乳酸中毒的定義性特徵。","C.（正確）Hyperchloremia（高氯血症）是正常 anion gap 酸中毒的特徵（非乳酸中毒），乳酸中毒為高 anion gap 酸中毒，氯離子通常正常，故高氯血症最不常見於乳酸中毒。","D. pH 下降是乳酸中毒（代謝性酸中毒）的基本特徵，常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_079","year":2023,"roc_year":112,"session":"","examNo":79,"q":"下列何者不是造成呼吸性酸中毒常見之原因？","opts":["A. 焦慮（anxiety）","B. 氣胸（pneumothorax）","C. 嚴重肺炎（severe pneumonia）","D. 胸腔積液（pleural effusion）"],"ans":0,"exp":"呼吸性酸中毒的常見原因是任何導致 CO2 瀦留的呼吸障礙，如：氣胸、嚴重肺炎、胸腔積液、上呼吸道阻塞、呼吸抑制藥物等。焦慮（anxiety）導致過度換氣（hyperventilation），CO2 排出增加，造成「呼吸性鹼中毒」，而非酸中毒，因此焦慮不是呼吸性酸中毒的原因。","we":["A.（正確）焦慮導致過度換氣，造成呼吸性鹼中毒，不是呼吸性酸中毒的原因，為本題答案。","B. 氣胸使肺臟無法擴張，通氣量減少，CO2 瀦留，造成呼吸性酸中毒，是常見原因。","C. 嚴重肺炎阻礙氣體交換，CO2 無法有效排出，造成呼吸性酸中毒，是常見原因。","D. 胸腔積液壓迫肺臟，限制肺擴張，導致通氣不足和 CO2 瀦留，是常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_實診_080","year":2023,"roc_year":112,"session":"","examNo":80,"q":"下列何者常會引起呼吸性鹼中毒？","opts":["A. 全身性麻醉","B. 中暑","C. 重症肌肉無力症","D. 嚴重肺水腫"],"ans":1,"exp":"中暑（heat stroke）時動物因體溫過高而喘氣（panting），CO2 大量排出，PaCO2 下降，pH 上升，造成呼吸性鹼中毒。全身性麻醉和重症肌肉無力症抑制呼吸，造成 CO2 瀦留（呼吸性酸中毒）；嚴重肺水腫造成換氣不足（呼吸性酸中毒）。","we":["A. 全身性麻醉抑制呼吸中樞，造成 CO2 瀦留和呼吸性酸中毒，非鹼中毒。","B.（正確）中暑（heat stroke）時過度喘氣（過度換氣），CO2 大量排出，PaCO2 下降，造成呼吸性鹼中毒。","C. 重症肌肉無力症（myasthenia gravis）造成呼吸肌無力，通氣不足，CO2 瀦留，造成呼吸性酸中毒。","D. 嚴重肺水腫造成換氣障礙，CO2 無法有效排出，最終導致呼吸性酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_001","year":2024,"roc_year":113,"session":"","examNo":1,"q":"母犬陰道常見傳染性腫瘤的細胞學特徵為何？","opts":["A. 細胞質有顆粒","B. 細胞質有空泡","C. 細胞質旁有一透明區域（perinuclear zone）","D. 細胞核內有三個核仁"],"ans":2,"exp":"犬傳染性性器官腫瘤（CTVT）的細胞學特徵為圓形細胞，細胞質內常見多個空泡（vacuoles），最具代表性的是細胞質旁具有一透明區域（perinuclear vacuolization/perinuclear zone）。此特徵有助於與其他圓形細胞腫瘤區分。","we":["細胞質有顆粒為肥大細胞瘤的特徵，而非CTVT的主要特徵。","細胞質有空泡雖可見於CTVT，但最具診斷特異性的特徵是核旁透明區域，而非單純空泡。","（正確）CTVT細胞學最典型的特徵為細胞質旁的透明區域（perinuclear zone/vacuolization）。","細胞核內三個核仁並非CTVT的特定診斷特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_002","year":2024,"roc_year":113,"session":"","examNo":2,"q":"下列何種細胞，在正常的情況下不應出現在淋巴結中？","opts":["A. 巨噬細胞","B. 肥大細胞","C. 淋巴母細胞","D. 上皮鱗狀細胞"],"ans":3,"exp":"正常淋巴結細胞學包含淋巴球（各分化程度）、巨噬細胞、漿細胞及少量肥大細胞；上皮鱗狀細胞為非淋巴組織的細胞，正常情況下不應出現在淋巴結中，若出現則提示轉移性腫瘤或採樣汙染。","we":["巨噬細胞（組織球）正常存在於淋巴結中，負責抗原呈現和吞噬功能。","肥大細胞少量可出現在正常淋巴結中，屬正常組成。","淋巴母細胞在活化的淋巴結中可正常存在，代表免疫反應。","（正確）上皮鱗狀細胞屬於非淋巴組織細胞，正常淋巴結中不應出現，若見到提示轉移性鱗狀細胞癌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_003","year":2024,"roc_year":113,"session":"","examNo":3,"q":"有關犬隻漿細胞瘤（plasma cell tumor）的特徵，下列敘述何者正確？","opts":["A. 獨立型漿細胞瘤（solitary plasma cell tumor）因為產生多量免疫球蛋白，在犬隻會造成高球蛋白血症","B. 漿細胞瘤造成之高黏稠血症，在犬隻主要為IgG分泌過多所致","C. 漿細胞瘤在血清蛋白電泳檢驗時，常會出現多群珈瑪球蛋白增多症（polyclonal gammopathy）","D. 多發性漿細胞瘤（multiple myeloma）在有多處骨溶解病灶時，以細針抽吸病灶可獲得具有診斷意義之腫瘤漿細胞"],"ans":3,"exp":"多發性骨髓瘤（multiple myeloma）在有骨溶解病灶時，可對病灶進行細針抽吸（FNA），獲得具診斷意義的腫瘤漿細胞；血清電泳呈現的是單株性伽瑪球蛋白增多症（monoclonal gammopathy），犬主要為IgA或IgM所致而非IgG。","we":["獨立型漿細胞瘤（solitary plasmacytoma）通常不會造成高球蛋白血症，因腫瘤量少且多為局部性。","犬高黏稠血症主要由IgA或IgM過多所致，IgG造成者較少見。","漿細胞瘤的血清電泳特徵為單株性（monoclonal）而非多株性（polyclonal）伽瑪球蛋白增多症。","（正確）多發性骨髓瘤在骨溶解病灶處進行FNA，可抽取到具診斷意義的腫瘤漿細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_004","year":2024,"roc_year":113,"session":"","examNo":4,"q":"以臨床屈折計測定體腔滲液，蛋白質含量至少大於多少g/dL時，即可能有局部炎症？","opts":["A. 5","B. 4","C. 3","D. 2"],"ans":2,"exp":"以臨床折光計（refractometer）檢測體腔液蛋白質，蛋白質含量大於2.5 g/dL（有些教科書以3 g/dL為切點）提示滲出液（exudate），表示可能有局部炎症；低於此值則判定為漏出液（transudate）。","we":["5 g/dL過高，此數值遠超過滲出液的診斷切點。","4 g/dL也高於一般滲出液的蛋白質切點標準。","（正確）體腔液蛋白質大於3 g/dL提示滲出液，表示可能有局部炎症反應。","2 g/dL低於標準滲出液切點（2.5~3 g/dL），此蛋白濃度傾向漏出液判定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_005","year":2024,"roc_year":113,"session":"","examNo":5,"q":"關節囊液染色塗抹片，若每一視野看到1顆白血球就同時看到500顆以上之紅血球，可判定為下列何種疾病？","opts":["A. 關節炎","B. 關節血腫","C. 退行性關節病","D. 腫瘤性關節病"],"ans":1,"exp":"關節囊液中若每視野1顆白血球對應500顆以上紅血球，表示大量紅血球存在且白血球比例極低，符合關節血腫（hemarthrosis）的細胞學特徵，血腫中WBC:RBC比例接近正常血液。","we":["關節炎的關節液特徵為白血球（尤其是嗜中性球）顯著增加，紅血球/白血球比值不會如此高。","（正確）關節血腫的關節液中大量紅血球占主導，WBC:RBC比例接近周邊血液，每視野1顆WBC對應500顆以上RBC符合此診斷。","退行性關節病的關節液白血球數輕微增加（以單核球為主），不呈現此比例。","腫瘤性關節病的關節液中可見腫瘤細胞及不同程度的炎症細胞，並非以大量紅血球為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_006","year":2024,"roc_year":113,"session":"","examNo":6,"q":"下列何者為狗最常見之關節炎（arthritis）？","opts":["A. 類風濕性關節炎（rheumatoid arthritis）","B. 創傷性關節炎（traumatic arthritis）","C. 骨關節炎（osteoarthritis）","D. 免疫媒介之關節炎（immune-mediated polyarthritis）"],"ans":2,"exp":"骨關節炎（osteoarthritis，退行性關節病）是犬隻最常見的關節炎類型，尤其好發於大型犬及老年犬，與關節軟骨退化、磨損相關，佔犬關節疾病的大多數。","we":["類風濕性關節炎（rheumatoid arthritis）在犬屬免疫媒介疾病，較為少見。","創傷性關節炎（traumatic arthritis）雖偶見，但整體流行率低於骨關節炎。","（正確）骨關節炎（osteoarthritis）為犬隻最常見的關節炎，與軟骨退化及老化相關。","免疫媒介性多發性關節炎（immune-mediated polyarthritis）為免疫性疾病，犬相對少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_007","year":2024,"roc_year":113,"session":"","examNo":7,"q":"有一5歲馬爾濟斯犬，呈現精神沉鬱、共濟失調、一個月內發生過2次癲癇且狀況逐漸變差。其腦脊髓液檢查  結果如下：稍微混濁、總蛋白質6.0 g/dL、有核細胞總數為400/μL，80％的淋巴球，根據上述臨床症狀及腦脊髓液檢查結果，推測此病犬最有可能罹患下列何種病症？","opts":["A. canine distemper","B. steroid-responsive suppurative meningitis-arteritis","C. necrotizing encephalitis","D. granulomatous meningoencephalitis"],"ans":3,"exp":"馬爾濟斯犬是肉芽腫性腦膜腦炎（GME）及壞死性腦炎（NE）的好發品種；本病例CSF呈現高蛋白（6.0 g/dL）、高有核細胞（400/μL）且以淋巴球為主（80%），搭配進行性神經症狀，最符合GME的特徵。","we":["犬瘟熱（canine distemper）的CSF變化通常較輕微，且有核細胞以淋巴球為主但蛋白質升高不如此顯著，亦常伴隨其他全身性症狀。","類固醇反應性化膿性腦膜炎（SRMA）的CSF特徵是嗜中性球顯著增多（>90%），而非以淋巴球為主。","壞死性腦炎（NE）常見於馬爾濟斯，但CSF變化以單核球/淋巴球混合為主，蛋白質中等升高，和GME難以單憑CSF區分，但題目數據更偏GME典型表現。","（正確）GME（肉芽腫性腦膜腦炎）好發於小型犬，CSF特徵為高蛋白、高淋巴球性有核細胞增多，符合本題描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_008","year":2024,"roc_year":113,"session":"","examNo":8,"q":"有關溶血的敘述，下列何者正確？","opts":["A. creatine kinase（CK）和aspartate aminotransferase（AST）檢驗值通常不受溶血影響","B. 紅血球破裂所釋放出來的血紅素可能影響吸光值，進而產生誤差","C. total protein使用折光度計檢測不會因為紅血球破裂而出現檢驗值誤差","D. PCV與MCHC會因此出現偽低值"],"ans":1,"exp":"溶血時紅血球破裂釋放血紅素，血紅素有顏色且在特定波長下會影響吸光值，造成多種光度計測定的生化指標（如ALT、AST、LDH等）出現偽高或偽低；折光計測定total protein也會因釋出之蛋白及血紅素而偏高。","we":["CK和AST均受溶血影響，尤其AST在RBC中含量高，溶血會使AST偽高。","（正確）溶血時血紅素釋放影響吸光值，干擾以光度計測定的多項生化指標，產生測定誤差。","折光計測定total protein確實會因溶血（血紅素及RBC內蛋白釋出）而出現偽高值，並非不受影響。","溶血時MCHC計算用到的血紅素值偽性升高（血漿中游離血紅素），而PCV/HCT不變，故MCHC出現偽高值，而非偽低值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_009","year":2024,"roc_year":113,"session":"","examNo":9,"q":"選擇實驗室診斷時，應把握下列那些原則？①對疾病診斷有幫助者才做 ②不施作帶給病畜極大痛苦之檢  查 ③即使可能招致獸醫師傷害，仍應採取檢體 ④獸醫師應全力救助動物，不需考慮檢驗費用多寡","opts":["A. ①②","B. ①③","C. ③④","D. ②④"],"ans":0,"exp":"選擇實驗室診斷應遵循的原則：①僅施作對診斷有實際幫助的檢查，②避免施作會帶給病畜極大痛苦的檢查；③不應為採檢而危及獸醫師安全，④費用也是合理考量因素之一。","we":["（正確）①對疾病診斷有幫助才施作，以及②不施作帶給動物極大痛苦的檢查，是實驗室診斷的基本倫理原則。","③若採集檢體可能招致獸醫師傷害，應以安全為優先，不應強行採樣，故①③組合錯誤。","③④均有問題：不應冒險採樣，且費用確實是需考量的現實因素，故③④組合錯誤。","②雖正確，但④「不需考慮費用」為錯誤原則，費用是臨床決策的合理考量之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_010","year":2024,"roc_year":113,"session":"","examNo":10,"q":"有關鳥類尿液檢體採集和保存，下列敘述何者正確？","opts":["A. 尿液檢查在鳥類因為有泄殖腔的構造所以沒有臨床診斷價值","B. 鳥類的尿液含有白色尿素（urea）會影響鏡檢結果","C. sodium hydroxide可以用來溶解尿酸鹽，但也可能降低cast的檢出率","D. 緊張的鳥通常會憋尿，不利尿液採集"],"ans":2,"exp":"鳥類排泄物中含有大量尿酸鹽結晶（白色沉澱），會干擾尿液鏡檢；加入NaOH可溶解尿酸鹽以改善視野，但鹼性環境也可能分解或破壞管型（cast），降低其檢出率，因此使用時需注意此取捨。","we":["鳥類尿液檢查仍有臨床診斷價值，可評估腎功能，只是因泄殖腔特殊構造使採樣較複雜。","鳥類尿液含有的白色物質主要是尿酸鹽（urates），而非尿素（urea），兩者是不同的化合物。","（正確）NaOH可溶解尿酸鹽改善鏡檢視野，但同時可能破壞管型（cast）降低其檢出率。","緊張的鳥類通常會增加排泄頻率（應激性多尿），而非憋尿，反而更容易採集尿液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_011","year":2024,"roc_year":113,"session":"","examNo":11,"q":"有關抗凝血劑的敘述，下列何者正確？","opts":["A. EDTA屬於金屬結合劑","B. oxalates最適合做為輸血用血液之抗凝","C. heparin抗凝的血液最適合做血液塗抹片","D. citrates抗凝的血液最適用於一般血液學及血清生化學檢查"],"ans":0,"exp":"EDTA（乙二胺四乙酸）是一種螯合劑（chelating agent/金屬結合劑），藉由結合鈣離子（Ca²⁺）來達到抗凝效果；EDTA是血液學檢查（CBC）的首選抗凝劑，而citrate用於凝血檢測，heparin適合血清生化，oxalate已較少使用。","we":["（正確）EDTA為螯合劑（金屬結合劑），通過螯合鈣離子阻止凝血而發揮抗凝作用。","輸血用血液的最佳抗凝劑為ACD（acid citrate dextrose）或CPD（citrate phosphate dextrose），而非oxalate。","Heparin抗凝的血液會干擾Wright's stain使塗片背景呈藍色，不適合製作血液塗抹片，EDTA抗凝血液才最適合。","Citrate抗凝血液最適合凝血功能檢查（PT、APTT），而非一般血液學或血清生化學檢查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_012","year":2024,"roc_year":113,"session":"","examNo":12,"q":"哺乳類動物因紅血球中沒有粒線體，需通過醣解作用（glycolysis）產生能量，下列那一種反應並不會出現\r   在紅血球醣解途徑？","opts":["A. Embden-Meyerhof pathway","B. hexosamine biosynthetic pathway","C. methemoglobin reductase pathway","D. pentose phosphate pathway"],"ans":1,"exp":"哺乳類紅血球的醣解途徑包含：Embden-Meyerhof pathway（主要能量途徑）、methemoglobin reductase pathway（維持血紅素鐵為二價）及pentose phosphate pathway（產生NADPH防止氧化損傷）；hexosamine biosynthetic pathway主要存在於有核細胞中，並不是紅血球醣解的一部分。","we":["Embden-Meyerhof pathway是紅血球主要的糖解途徑，產生ATP和2,3-DPG，確實存在於紅血球中。","（正確）Hexosamine biosynthetic pathway不存在於紅血球醣解途徑中，此途徑主要在有核細胞中發生。","Methemoglobin reductase pathway存在於紅血球中，負責將高鐵血紅素（Fe³⁺）還原為正常血紅素（Fe²⁺）。","Pentose phosphate pathway（磷酸戊糖途徑）存在於紅血球中，產生NADPH以維持還原性谷胱甘肽。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_013","year":2024,"roc_year":113,"session":"","examNo":13,"q":"下列何種動物之血液抹片中，最常見斑點型（punctate type）和聚集型（aggregate type）之網織球\r   （reticulocyte）？","opts":["A. 豬","B. 犬","C. 牛","D. 貓"],"ans":3,"exp":"貓是唯一同時出現兩種網織球型態的動物：aggregate type（聚集型，含大量RNA殘留）代表急性再生反應，punctate type（斑點型，含少量RNA顆粒）代表較成熟階段；其他動物（犬、牛、豬）只有一種型態的網織球。","we":["豬的血液學中網織球不具有明顯的兩型分型特徵。","犬的網織球以aggregate type為主，不同時具有punctate type。","牛的再生性貧血反應較弱，周邊血液中不易見到大量網織球，且不具兩型分型。","（正確）貓同時具有punctate type和aggregate type兩種網織球，是獸醫血液學的重要特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_014","year":2024,"roc_year":113,"session":"","examNo":14,"q":"某犬的血液檢查如下，血容比：12.8％；血紅素值：4.0 g/dL；紅血球數：2.25×10 6 /μL。則該犬平均紅血球血紅素濃度（MCHC）為何（g/dL）？","opts":["A. 31.25","B. 17.78","C. 56.89","D. 無法計算"],"ans":0,"exp":"MCHC（平均紅血球血紅素濃度）計算公式為：MCHC = 血紅素（g/dL）÷ 血容比（PCV，以小數表示）= 4.0 ÷ 0.128 = 31.25 g/dL，此數值在正常範圍（犬正常MCHC約32-36 g/dL）略低，為再生性貧血的表現。","we":["（正確）MCHC = Hb ÷ PCV = 4.0 ÷ 0.128 = 31.25 g/dL，計算正確。","17.78為錯誤計算（可能誤用RBC數值計算），不符合MCHC公式。","56.89數值明顯超過正常MCHC範圍（正常最高約36 g/dL），為錯誤計算。","MCHC可以由題目提供的Hb和PCV數值直接計算，並非無法計算。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_015","year":2024,"roc_year":113,"session":"","examNo":15,"q":"下列何種內泌素會抑制紅血球生成作用？","opts":["A. 雄性素（androgen）","B. 動情素（estrogen）","C. 甲狀腺素（thyroxine）","D. 生長激素（growth hormone）"],"ans":1,"exp":"動情素（estrogen）會抑制骨髓造血功能，抑制紅血球生成（erythropoiesis），臨床上見於發情期延長的雌性動物（如雪貂子宮蓄膿/持續發情）造成再生不良性貧血；而雄性素、甲狀腺素、生長激素均促進紅血球生成。","we":["雄性素（androgen）刺激促紅血球生成素（EPO）分泌，促進紅血球生成而非抑制。","（正確）動情素（estrogen）抑制骨髓造血，尤其長期高濃度暴露可造成全血球減少症。","甲狀腺素（thyroxine）通過提高代謝率增加EPO分泌，促進紅血球生成。","生長激素（growth hormone）促進肝臟產生IGF-1，間接促進紅血球生成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_016","year":2024,"roc_year":113,"session":"","examNo":16,"q":"有關平均紅血球血紅素濃度（mean corpuscular hemoglobin concentration, MCHC）之敘述，下列何者正\r   確？","opts":["A. 脂血症時MCHC上升","B. 網織球增多症時MCHC上升","C. 缺鐵性貧血時MCHC上升","D. 球狀紅血球明顯增多時MCHC下降"],"ans":0,"exp":"脂血症（lipemia）時血漿混濁，使用比色法測量血紅素值會出現偽高值，而PCV不受影響，導致計算出的MCHC偽性升高；球狀紅血球（spherocyte）因細胞表面積減少使MCHC上升，缺鐵性貧血和網織球增多症則使MCHC降低。","we":["（正確）脂血症造成血漿混濁，干擾比色法血紅素測定使其偽高，計算所得MCHC偽性升高。","網織球（reticulocyte）含血紅素較少（低色素性大球），網織球增多症時MCHC下降，而非上升。","缺鐵性貧血因血紅素合成不足，紅血球呈低色素性，MCHC下降，而非上升。","球狀紅血球（spherocyte）因表面積減少、細胞縮小、血紅素濃縮，MCHC實際上升高而非下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_017","year":2024,"roc_year":113,"session":"","examNo":17,"q":"下圖為新亞甲基藍染色之犬隻血液抹片，箭頭所指最可能為何種血球？","opts":["A. reticulocyte","B. neutrophil","C. eosinophil","D. platelet"],"ans":0,"exp":"新亞甲基藍（new methylene blue）為活體染色，專用於顯示網織球（reticulocyte）內殘留的RNA聚集體，使其呈現藍色顆粒或網狀結構；此染色無法顯示白血球或血小板的特定結構。","we":["（正確）新亞甲基藍染色的目的即為識別reticulocyte（網織球），其特有的藍色RNA網狀結構是診斷特徵。","嗜中性球（neutrophil）在新亞甲基藍染色下不具特異性藍色RNA聚集，無法以此染色識別。","嗜酸性球（eosinophil）在新亞甲基藍染色下同樣無特異性表現，以W-G染色才可見其橘紅色顆粒。","血小板體積遠小於網織球，且不含RNA聚集體，新亞甲基藍染色下不呈現網狀藍色結構。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_實診_018","year":2024,"roc_year":113,"session":"","examNo":18,"q":"承上題，犬隻在下列何種狀況下此種血球數目最容易增多﹖","opts":["A. 急性發炎","B. 犬小病毒感染","C. 急性失血3天後","D. 採血時緊張"],"ans":2,"exp":"犬急性失血後骨髓加速造血，約3-5天後周邊血液開始出現大量網織球（reticulocytosis），這是再生性貧血的骨髓代償反應；急性發炎和壓力（兒茶酚胺釋放）則主要造成嗜中性球增多和脾臟收縮。","we":["急性發炎主要引起嗜中性球增多（核左轉），而非網織球增多；急性失血才是網織球增多的主因。","犬小病毒感染會破壞骨髓幹細胞造成全血球減少症（包括網織球減少），而非網織球增多。","（正確）急性失血3天後骨髓加速造血，周邊血液中網織球（reticulocyte）數量明顯增加，呈再生性反應。","採血時緊張會因腎上腺素釋放導致脾臟收縮，釋放貯存的成熟紅血球（非網織球）使PCV短暫升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_019","year":2024,"roc_year":113,"session":"","examNo":19,"q":"血管內溶血最常出現下列何者？","opts":["A. 血紅素血症（hemoglobinemia）","B. 血紅素尿（hemoglobinuria）","C. 高膽紅素血症（hyperbilirubinemia）","D. 膽紅素尿（bilirubinuria）"],"ans":0,"exp":"血管內溶血時，紅血球在血管內直接破裂，血紅素大量釋入血漿，首先出現血紅素血症（hemoglobinemia）；隨後血漿結合蛋白（haptoglobin）飽和後，多餘血紅素經腎臟排出才出現血紅素尿；膽紅素血症是後續的代謝產物，出現較晚。","we":["（正確）血管內溶血時血紅素直接釋入血漿，血紅素血症（hemoglobinemia）是最早且最常見的表現。","血紅素尿（hemoglobinuria）在血漿結合蛋白飽和後才會出現，為血紅素血症之後的繼發表現。","高膽紅素血症（hyperbilirubinemia）為血紅素代謝後產物，需時間代謝轉化，不是最先出現的表現。","膽紅素尿（bilirubinuria）是高膽紅素血症的後續結果，出現時間最晚。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_實診_020","year":2024,"roc_year":113,"session":"","examNo":20,"q":"Spherocyte主要成因為何？","opts":["A. 鐵缺乏","B. 血管肉瘤","C. 免疫溶血性貧血","D. 再生性貧血"],"ans":
