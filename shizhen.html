險上升，但自發性出血尚不常見。","25,000/μL時出血風險明顯，但仍非一定發生自發性出血的臨界值。","（正確）血小板低於10,000/μL時，才會出現自發性嚴重出血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_005","year":2019,"roc_year":108,"session":"1","examNo":5,"q":"下列何者之細胞標記是CD41陽性？","opts":["A. 紅血球","B. 血小板","C. 淋巴球","D. 單核球"],"ans":1,"exp":"CD41（又稱GPIIb，整合素αIIb）是血小板及巨核細胞的特異性表面標記，為血小板鑑別的重要分子。紅血球標記為CD235a，T淋巴球為CD3，單核球為CD14。","we":["紅血球的細胞標記為CD235a（Glycophorin A），而非CD41。","（正確）CD41（GPIIb）陽性表達於血小板及其前驅細胞巨核細胞。","淋巴球的標記為CD3（T細胞）或CD19（B細胞），而非CD41。","單核球的標記為CD14、CD64，而非CD41。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_006","year":2019,"roc_year":108,"session":"1","examNo":6,"q":"下列何者不是漿細胞骨髓瘤之特徵？","opts":["A. 高球蛋白血症","B. 骨溶解","C. 班瓊斯蛋白尿","D. 紅血球增多症"],"ans":3,"exp":"漿細胞骨髓瘤（plasma cell myeloma）的典型特徵包括：高球蛋白血症（A）、骨溶解（B）、班瓊斯蛋白尿（Bence-Jones proteinuria，C）。紅血球增多症（D）不是特徵；相反地，骨髓瘤常造成貧血（因骨髓被腫瘤細胞佔據，正血球正色素性貧血）。","we":["高球蛋白血症是漿細胞骨髓瘤的典型特徵，腫瘤漿細胞大量分泌單株免疫球蛋白。","骨溶解是漿細胞骨髓瘤的典型特徵，因破骨細胞活化造成骨質破壞。","班瓊斯蛋白（免疫球蛋白輕鏈）可自腎臟濾出，為骨髓瘤的典型尿液表現。","（正確）紅血球增多症不是骨髓瘤的特徵；骨髓瘤反而常導致非再生性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_007","year":2019,"roc_year":108,"session":"1","examNo":7,"q":"下列何種動物的血片最容易觀察出球狀紅血球（spherocytes）？","opts":["A. 犬","B. 貓","C. 豬","D. 山羊"],"ans":0,"exp":"球狀紅血球（spherocytes）在犬血片中最容易辨認，因為犬的正常紅血球有明顯的中央淡染區，球狀紅血球缺乏此淡染區，對比明顯。貓、豬、山羊的正常紅血球本身中央淡染區不明顯或幾乎無，因此球狀紅血球難以辨識。","we":["（正確）犬的紅血球有明顯中央淡染區，球狀紅血球無此特徵，在犬血片中最易辨認。","貓的紅血球中央淡染區本就不明顯，球狀紅血球難以與正常紅血球區分。","豬的紅血球形態多變，球狀紅血球辨識困難。","山羊紅血球體積小且中央淡染區不明顯，球狀紅血球難以辨識。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_008","year":2019,"roc_year":108,"session":"1","examNo":8,"q":"下列有關Heinz bodies的敘述，何者錯誤？","opts":["A. 又稱紅血球折光性小體","B. 為RNA殘留物","C. 會破壞紅血球膜，使血紅素釋出","D. 會導致紅血球易被吞噬細胞吞食"],"ans":1,"exp":"Heinz bodies（海因茨小體）是變性血紅素（氧化變性的血紅蛋白）聚集形成的折光性小體，附著於紅血球膜內側。B選項描述「RNA殘留物」是錯誤的，RNA殘留物形成的是嗜鹼性斑點（basophilic stippling）或網狀球中的核糖體，而非Heinz bodies。","we":["Heinz bodies又稱紅血球折光性小體，此敘述正確。","（正確）Heinz bodies是氧化變性的血紅蛋白聚集物，並非RNA殘留物；RNA殘留物形成嗜鹼性斑點。","Heinz bodies附著於紅血球膜，會破壞膜結構，導致血紅素釋出，此敘述正確。","帶有Heinz bodies的紅血球膜受損，易被脾臟巨噬細胞辨識並吞噬，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_009","year":2019,"roc_year":108,"session":"1","examNo":9,"q":"下列何者不是骨髓系幹細胞（myeloid stem cell）所演化而成之細胞？","opts":["A. T cell","B. eosinophil","C. neutrophil","D. monocyte"],"ans":0,"exp":"骨髓系幹細胞（myeloid stem cell）演化出嗜酸性球、嗜中性球、嗜鹼性球、單核球、紅血球、血小板等。T細胞屬於淋巴系幹細胞（lymphoid stem cell）的演化產物，不屬於骨髓系。","we":["（正確）T cell屬淋巴系幹細胞演化，不屬於骨髓系幹細胞的演化。","嗜酸性球（eosinophil）屬骨髓系，由骨髓系幹細胞演化而來。","嗜中性球（neutrophil）屬骨髓系，由骨髓系幹細胞演化而來。","單核球（monocyte）屬骨髓系，由骨髓系幹細胞演化而來。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_010","year":2019,"roc_year":108,"session":"1","examNo":10,"q":"下列動物中，何者紅血球平均壽命最短？","opts":["A. 鳥","B. 犬","C. 貓","D. 豬"],"ans":0,"exp":"鳥類（禽類）紅血球壽命最短，約28～45天；犬約100～120天；貓約60～70天；豬約60～70天。鳥類有有核紅血球，代謝較快，壽命最短。","we":["（正確）鳥類紅血球壽命最短，約28～45天，因有核且代謝率高。","犬紅血球壽命約100～120天，較鳥類長得多。","貓紅血球壽命約60～70天，較鳥類長。","豬紅血球壽命約60～70天，較鳥類長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_011","year":2019,"roc_year":108,"session":"1","examNo":11,"q":"下列對不同動物網狀球的敘述，何者錯誤？","opts":["A. 牛健康時不常出現網狀球，但貧血時則較易出現","B. 在健康乳豬常見","C. 在健康鳥中比在哺乳動物中少","D. 在貓急性嚴重出血時以計算聚集型者為主"],"ans":2,"exp":"關於網狀球（reticulocyte）：牛健康時極少出現，貧血時也不易見到（A正確）。健康乳豬常見網狀球（B正確）。鳥類本就有有核紅血球，網狀球比例在健康鳥中其實高於哺乳動物（C錯誤，應是鳥比哺乳動物多）。貓有兩型網狀球：聚集型與點狀型，急性出血後以聚集型（aggregate）為主（D正確）。","we":["牛健康時確實不常出現網狀球，且貧血時的再生反應也較弱，此敘述正確。","健康乳豬確實常見網狀球，此敘述正確。","（正確）鳥類網狀球（有核幼稚紅血球）在健康狀態下比哺乳動物多，而非少，此敘述錯誤。","貓急性嚴重出血時，以聚集型網狀球為主要評估指標，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_012","year":2019,"roc_year":108,"session":"1","examNo":12,"q":"下列何種白血球壽命較長，甚至數月、數年？","opts":["A. 淋巴球","B. 單核球","C. 嗜酸性球","D. 嗜鹼性球"],"ans":0,"exp":"淋巴球（lymphocyte）是壽命最長的白血球，記憶性T細胞和B細胞可存活數月至數年，甚至終生。單核球在血中半衰期僅數小時至數天，嗜酸性球及嗜鹼性球壽命較短。","we":["（正確）淋巴球（尤其是記憶細胞）壽命可達數月至數年甚至終生。","單核球血中半衰期約8～12小時，壽命遠短於淋巴球。","嗜酸性球血中壽命約數小時至數天，不如淋巴球長壽。","嗜鹼性球血中壽命極短，僅數小時，壽命最短的白血球之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_013","year":2019,"roc_year":108,"session":"1","examNo":13,"q":"下列何種情況最不會引起生理性白血球增多症？","opts":["A. 年輕健康馬匹","B. 分娩中的健康牛","C. 貓於保定時掙扎","D. 犬在通風不良的環境下"],"ans":0,"exp":"生理性白血球增多症由腎上腺素或皮質醇驅動：興奮、運動、恐懼可引起（貓掙扎、犬高溫環境）。分娩中的健康牛因應激反應也可見生理性白血球增多症。年輕健康馬匹在靜息狀態下不會特別引起生理性白血球增多症，馬在興奮或運動時才有，但單純「年輕健康馬匹」並非引發條件。","we":["（正確）年輕健康馬匹在安靜狀態下不會引起生理性白血球增多症，此最不可能。","分娩過程屬強烈應激，皮質醇釋放可引起生理性白血球增多症。","貓保定時掙扎→腎上腺素大量分泌→邊緣池白血球動員→生理性白血球增多症。","犬在通風不良的熱環境下→熱緊迫→腎上腺素釋放→可引起生理性白血球增多症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_014","year":2019,"roc_year":108,"session":"1","examNo":14,"q":"一般動物若嗜中性球有中度中毒反應，通常指中毒反應細胞的出現頻率為何？","opts":["A. 5～10％","B. 11～30％","C. 31～40％","D. 41～50％"],"ans":1,"exp":"嗜中性球中毒反應（toxic change）分級：輕度（mild）：5～10%；中度（moderate）：11～30%；重度（severe）：31～70%；極重度（marked）：>70%。中度中毒反應對應11～30%。","we":["5～10%為輕度（mild）中毒反應，非中度。","（正確）11～30%為中度（moderate）中毒反應的定義範圍。","31～40%已達重度（severe）中毒反應範圍。","41～50%屬重度中毒反應範圍，非中度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_015","year":2019,"roc_year":108,"session":"1","examNo":15,"q":"下列何種健康動物嗜酸性球之嗜酸性顆粒很小，且呈短桿狀，會占滿細胞質，被染成模糊的橙紅色？","opts":["A. 貓","B. 犬","C. 馬","D. 豬"],"ans":2,"exp":"馬的嗜酸性球顆粒呈短桿狀（rod-shaped），體積極小，充滿細胞質，被染色為模糊的橙紅色，與犬貓的嗜酸性球（犬：大型圓形橙紅顆粒；貓：細小桿狀淡粉色顆粒）明顯不同。此描述符合馬的嗜酸性球特徵。","we":["貓的嗜酸性顆粒呈細小桿狀，淡粉色至無色，不占滿細胞質，形態不同於此描述。","犬的嗜酸性顆粒呈大型圓形，橙紅色，數量較少，不符合「短桿狀充滿細胞質」的描述。","（正確）馬的嗜酸性球顆粒呈短桿狀，極小且充滿細胞質，染成模糊橙紅色，為馬特有形態。","豬的嗜酸性顆粒呈圓形，較大，與此描述不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_016","year":2019,"roc_year":108,"session":"1","examNo":16,"q":"下列有關紅血球嗜鹼性斑點之敘述，何者正確？①為核之殘留物 ②可能出現於反應性貧血牛 ③較多見\r 於反應性貧血貓 ④為犬鉛中毒之特徵之一","opts":["A. ①②","B. ②③","C. ②④","D. ③④"],"ans":2,"exp":"嗜鹼性斑點（basophilic stippling）：①為核之殘留物（RNA/核糖體殘留）—正確；②可能出現於反應性貧血的牛—正確（牛貧血時可見）；③較多見於反應性貧血貓—錯誤（貓很少出現嗜鹼性斑點）；④為犬鉛中毒特徵—正確（鉛抑制血紅素合成，導致RNA殘留）。因此②④正確，選C。","we":["①②組合正確但缺少④（鉛中毒），不完整。","②③組合錯誤，③（貓多見嗜鹼性斑點）是錯誤敘述，貓很少見到嗜鹼性斑點。","（正確）②④正確：牛貧血時可見嗜鹼性斑點，犬鉛中毒亦為特徵。","③④組合錯誤，③關於貓的描述有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_017","year":2019,"roc_year":108,"session":"1","examNo":17,"q":"下列有關嗜中性球之敘述，何者正確？①具有黏著及通過血管壁之功能 ②對血小板第4因子有趨化性 ③\r 有免疫球蛋白之受器，可預防類風濕性關節炎（rheumatoid arthritis） ④具有調節顆粒性白血球形成作用\r 之功能","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":1,"exp":"嗜中性球功能：①黏著及通過血管壁—正確；②對血小板第4因子（platelet factor 4）有趨化性—正確；③有免疫球蛋白受器（Fc receptor），但此功能是促進吞噬（調理作用），並非「預防類風濕性關節炎」—錯誤；④具有調節顆粒球形成的功能—正確（負向回饋調節）。故①②④正確，選B。","we":["①②③組合中，③（預防類風濕性關節炎）的描述錯誤，嗜中性球Fc受器是促吞噬，非預防自體免疫。","（正確）①②④均正確：黏著穿越血管壁、對PF4趨化、調節顆粒球生成。","①③④中③錯誤，故此組合不正確。","②③④中③錯誤，故此組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_018","year":2019,"roc_year":108,"session":"1","examNo":18,"q":"犬之缺乏丙酮酸激酶（pyruvate kinase）貧血，主要是影響下列何種代謝徑路？","opts":["A. 衛－梅徑路（Embden-Meyerhof pathway）","B. 己糖－單磷酸鹽徑路（hexose-monophosphate pathway）","C. 變性血紅素還原酶徑路（methemoglobin reductase pathway）","D. 盧－拉徑路（Luebering-Rapoport pathway）"],"ans":0,"exp":"丙酮酸激酶（pyruvate kinase, PK）是無氧糖解的關鍵酶，位於衛－梅徑路（Embden-Meyerhof pathway，即糖解路徑）中，催化磷酸烯醇丙酮酸→丙酮酸的步驟並產生ATP。PK缺乏→糖解無法完成→ATP不足→紅血球無法維持離子平衡→溶血性貧血。","we":["（正確）丙酮酸激酶是Embden-Meyerhof pathway（糖解路徑）的關鍵酶，PK缺乏影響此路徑。","己糖-單磷酸鹽路徑（HMP shunt）與NADPH產生及抗氧化相關，其關鍵酶為G6PD，非PK。","變性血紅素還原酶路徑處理methemoglobin的還原，與PK無直接關係。","盧-拉徑路（Luebering-Rapoport）產生2,3-DPG調節氧氣親和力，非PK的主要路徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_019","year":2019,"roc_year":108,"session":"1","examNo":19,"q":"有一貧血犬之嗜中性球及血小板數正常，骨髓M/E比高。下列選項何者可能是其貧血之原因？①缺少紅血球\r 生成素 ②炎症性疾病 ③骨髓纖維化 ④放射線照射引起之多潛能幹細胞損傷","opts":["A. ①②","B. ①③","C. ①④","D. ③④"],"ans":0,"exp":"題目：嗜中性球及血小板正常，M/E比高（骨髓中骨髓系/紅血球系比值高，表示紅血球系生成相對減少）。這符合選擇性紅血球生成不足（非再生性貧血），且不影響其他血球系。①缺少紅血球生成素（EPO）→選擇性紅血球系抑制，嗜中性球與血小板正常，M/E比升高—正確；②炎症性疾病→非再生性貧血，但白血球常改變，不符合嗜中性球正常；③骨髓纖維化→多種血球系均受影響，嗜中性球與血小板也會異常；④放射線→多潛能幹細胞損傷→全血球減少，不符合嗜中性球及血小板正常。故①②最符合（炎症性疾病的慢性貧血也可能嗜中性球正常），答案A。","we":["（正確）①EPO缺乏和②炎症性疾病均可造成選擇性紅血球減少，嗜中性球與血小板正常，M/E比升高。","①③組合中，③骨髓纖維化通常影響多種血球系，不符合嗜中性球及血小板正常。","①④組合中，④放射線傷害多潛能幹細胞，導致全血球減少，不符合此病例。","③④組合均會影響多血球系，與嗜中性球及血小板正常的描述不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_020","year":2019,"roc_year":108,"session":"1","examNo":20,"q":"下列那一品種的狗較常罹患先天性IgM deficiency？","opts":["A. Maltese","B. Dobermann","C. Miniature Schnauzer","D. English Bull Terrier"],"ans":0,"exp":"先天性IgM缺乏（primary IgM deficiency）在Maltese（馬爾濟斯）犬中有品種性遺傳報告，為該品種的已知先天性免疫缺乏症。Dobermann常見IgA缺乏；Miniature Schnauzer常見原發性高脂血症；English Bull Terrier則與其他免疫問題相關。","we":["（正確）Maltese（馬爾濟斯）犬較常罹患先天性IgM缺乏症。","Dobermann常見IgA缺乏（IgA deficiency），而非IgM缺乏。","Miniature Schnauzer以原發性高脂血症及胰臟炎聞名，非IgM缺乏。","English Bull Terrier有遺傳性腎病等問題，但先天性IgM缺乏非其特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_021","year":2019,"roc_year":108,"session":"1","examNo":21,"q":"下列對於犬隻脂血症的影響何者正確？","opts":["A. 絕食12小時後採血可除去食後性脂血症","B. 如絕食後仍有脂血症，可靜脈注射EDTA以消除脂血症","C. 脂血症會造成AST、ALT活性值之偽性降低","D. 脂血症會促進溶血"],"ans":0,"exp":"食後性脂血症：餵食高脂肪食物後出現；禁食12小時可消除食後性脂血症（A正確）。若禁食後仍有脂血症，應抽取血漿離心以去除乳糜，靜脈注射肝素（heparin）可活化脂蛋白脂肪酶（LPL），EDTA無此功用（B錯）。脂血症對AST、ALT的影響取決於檢測方法，多數情況下造成偽性升高或無影響（C錯）。脂血症本身會形成保護性界面，不促進溶血，反而高濃度脂質可抑制溶血（D錯）。","we":["（正確）絕食12小時可消除食後性（postprandial）脂血症，此敘述正確。","靜脈注射EDTA無法消除脂血症；若需加速清除，應注射肝素（heparin）以活化LPL。","脂血症通常造成AST、ALT的偽性升高（非降低），因為乳糜會干擾吸光度測定。","脂血症不會促進溶血；高脂血漿反而可能因乳糜顆粒形成物理屏障而減少溶血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_022","year":2019,"roc_year":108,"session":"1","examNo":22,"q":"下列有關血糖檢驗之敘述何者正確？","opts":["A. 全血樣本之血糖若不立即檢驗，室溫下每小時約降低20%","B. 全血之試條試驗法對於低血糖可信度高，但對高血糖之可信度低","C. 病畜於24小時絕食後，血糖值應在180 mg/dL以上才能視為正常","D. 貓採血時若激烈掙扎，易因兒茶酚胺分泌導致出現高血糖"],"ans":3,"exp":"貓在採血時若激烈掙扎→腎上腺素（兒茶酚胺）大量分泌→促進肝糖分解及抑制胰島素→出現應激性高血糖，此為貓的特殊生理現象，血糖可急速上升至300mg/dL以上，故D正確。全血血糖室溫下每小時降低約7%（非20%，A錯）。試條法對低血糖可信度低（非高，B錯）。正常空腹血糖低於180mg/dL（C錯）。","we":["全血血糖在室溫下因紅血球糖解，每小時約降低7%（非20%），A敘述誇大。","試條試驗法對低血糖的可信度相對較低（非高），因低血糖時誤差比例較大。","動物空腹24小時後血糖應在正常範圍（犬貓約70～120 mg/dL），180 mg/dL以上才算正常的說法錯誤。","（正確）貓採血時激烈掙扎→兒茶酚胺分泌→應激性高血糖，此為貓特有的顯著現象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_023","year":2019,"roc_year":108,"session":"1","examNo":23,"q":"下列那種動物之ALP活性值半衰期僅6小時，因此血中活性值雖只有輕微上升仍不可忽視？","opts":["A. 馬","B. 貓","C. 兔","D. 牛"],"ans":1,"exp":"貓的ALP血清半衰期僅約6小時（相較於犬約70小時），因此貓血清ALP即使輕微上升也具有臨床意義，不可忽視。馬、牛的ALP半衰期較長，輕微上升臨床意義相對較小。","we":["馬的ALP半衰期較長，輕微上升的臨床意義不如貓顯著。","（正確）貓的ALP半衰期僅6小時，因此輕微上升即具重要臨床意義。","兔的ALP半衰期資料非此題重點，且非最短。","牛的ALP半衰期較長，輕微上升臨床意義相對不顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_024","year":2019,"roc_year":108,"session":"1","examNo":24,"q":"關於AST、ALT及SDH活性值的敘述，何者錯誤？","opts":["A. 三者大多存在於細胞質中","B. ALT在馬肝病的應用性不高，但為馬肌肉傷害之主要指標","C. 就馬、牛的肝細胞傷害而言，較佳指標為SDH，較常用指標為AST","D. AST之肝特異性在犬雖低於ALT，但卻是進行性（active）肝病的較佳指標"],"ans":1,"exp":"ALT在馬的肝病應用性不高是正確的，但馬肌肉傷害的主要指標是CK（creatine kinase）和AST，而非ALT。馬幾乎不含ALT（肝特異性極低），故B選項「ALT為馬肌肉傷害之主要指標」是錯誤的。AST存在於肌肉和肝臟，不是馬肌肉傷害的特異指標；SDH才是馬肝特異酶。","we":["AST、ALT及SDH大多存在於細胞質（部分在粒線體），此敘述正確。","（正確）ALT在馬的含量極少，既不適用於馬肝病診斷，也不是馬肌肉傷害的主要指標；馬肌肉傷害應用CK。","馬、牛肝病較佳指標是SDH（特異性高、半衰期短），常用指標是AST，此敘述正確。","AST在犬的肝特異性雖低於ALT，但AST半衰期較短，可作為活動性肝病的敏感指標，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_025","year":2019,"roc_year":108,"session":"1","examNo":25,"q":"下列有關氨基丙酸轉氨酶（ALT）之敘述，何者錯誤？","opts":["A. 可為犬貓肝之特異診斷用酵素","B. 此酶在犬血漿中之半衰期約為60小時","C. 血清活性值可因肝細胞膜透過性之改變而上升","D. 腎上腺皮質酮會抑制其血清中活性值"],"ans":3,"exp":"腎上腺皮質酮（glucocorticoid/皮質醇）在犬中會誘導產生類固醇誘導型ALT（steroid-induced hepatopathy），導致血清ALT活性值上升，而非抑制。因此D「腎上腺皮質酮會抑制ALT血清活性」是錯誤的。","we":["ALT主要存在於犬貓肝細胞，為犬貓肝特異性診斷酶，此敘述正確。","ALT在犬血漿中半衰期約60小時，此敘述正確。","肝細胞膜透過性改變（即使無壞死）也會導致細胞質ALT釋放，血清活性值上升，此正確。","（正確）腎上腺皮質酮在犬中會刺激（非抑制）ALT的合成與釋放，導致血清活性值升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_026","year":2019,"roc_year":108,"session":"1","examNo":26,"q":"下列有關庫弗細胞對肝功能試驗之影響，何者正確？","opts":["A. 庫弗細胞屬於淋巴系統，與肝病機轉無關","B. 慢性纖維化性疾病引起之庫弗細胞數減少可能導致高免疫球蛋白血症","C. 庫弗細胞數減少可導致低免疫球蛋白血症","D. 庫弗細胞數減少可導致低白蛋白血症"],"ans":1,"exp":"庫弗細胞（Kupffer cells）是肝臟的常駐巨噬細胞，負責清除門靜脈血中的細菌及抗原（非淋巴系統，A錯）。庫弗細胞減少→門靜脈血中抗原無法被過濾→刺激全身免疫系統→高免疫球蛋白血症（B正確）。C（低免疫球蛋白）與B相反錯誤。D（低白蛋白）是肝實質細胞功能不足，非庫弗細胞功能。","we":["庫弗細胞屬於單核吞噬細胞系統（巨噬細胞），非淋巴系統，且與肝病機轉密切相關。","（正確）庫弗細胞減少→門靜脈抗原過濾不足→刺激B細胞→高免疫球蛋白血症，此敘述正確。","庫弗細胞減少應導致高免疫球蛋白血症（因過濾失能），而非低免疫球蛋白血症。","低白蛋白血症是肝實質細胞（hepatocyte）合成功能下降的結果，與庫弗細胞數量無直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_027","year":2019,"roc_year":108,"session":"1","examNo":27,"q":"有關肌紅素之敘述，下列何者錯誤？","opts":["A. 通常不會造成血漿變色","B. 通常可造成尿液變色","C. 和血紅素一樣，通常與溶血相關","D. 較血紅素小，可自由濾過絲球體"],"ans":2,"exp":"肌紅素（myoglobin）分子量約17,000 Da，遠小於血紅素（約64,000 Da），可自由通過腎絲球濾過→造成尿液變色（紅褐色）。肌紅素不與血漿蛋白結合，血中濃度即使升高，血漿顏色通常不變（A正確）。C「和血紅素一樣通常與溶血相關」—錯誤，肌紅素來自肌肉損傷，而非溶血（血紅素才與溶血相關）。","we":["肌紅素在血漿中不與蛋白結合，濃度即使升高也不使血漿變色，A正確。","肌紅素可自由通過腎絲球，在尿中造成紅褐色尿，B正確。","（正確）肌紅素來自肌肉損傷（myopathy），與溶血無關；血紅素才是溶血的指標，C錯誤。","肌紅素分子量小（17kDa），可自由濾過腎絲球，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_028","year":2019,"roc_year":108,"session":"1","examNo":28,"q":"下列尿結晶，何者最容易在鹼性尿液中見到？","opts":["A. 草酸鈣（calcium oxalate）","B. 尿酸銨（ammonium urate）","C. 磷酸銨鎂（magnesium ammonium phosphate）","D. 胱氨酸（cystine）"],"ans":2,"exp":"磷酸銨鎂結晶（magnesium ammonium phosphate, struvite）在鹼性尿液中最易形成，因pH升高促進NH4+及Mg2+與磷酸根結合沉澱。草酸鈣及胱氨酸在酸性尿液中易見；尿酸銨在偏酸至中性尿中多見。","we":["草酸鈣結晶在酸性至中性尿液中較常見，鹼性尿中不是最易見。","尿酸銨在偏酸至中性尿液中較常見，且與尿素酶分解尿素相關。","（正確）磷酸銨鎂（struvite）在鹼性尿液中最易形成，為最常見的鹼性尿結晶。","胱氨酸結晶在酸性尿液中才易析出，鹼性尿中反而較少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_029","year":2019,"roc_year":108,"session":"1","examNo":29,"q":"尿分析時，混濁尿加熱至60℃仍無變化，再加入稀醋酸呈透明且產生氣泡，判定為何種結晶？","opts":["A. 尿酸鹽","B. 碳酸鹽","C. 磷酸鹽","D. 草酸鹽"],"ans":1,"exp":"混濁尿加熱至60℃無變化（排除尿酸鹽，尿酸鹽加熱後會溶解），再加稀醋酸透明並產生氣泡（CO2）→為碳酸鹽結晶（carbonate）。磷酸鹽加醋酸會溶解但不產生氣泡；草酸鹽不溶於醋酸；尿酸鹽加熱即溶解。","we":["尿酸鹽混濁尿加熱至60℃會溶解變透明，而此題加熱後仍無變化，排除尿酸鹽。","（正確）加稀醋酸後透明且產生氣泡（CO2），為碳酸鹽（carbonate）結晶的典型反應。","磷酸鹽加稀醋酸後會溶解呈透明，但不產生氣泡，可與碳酸鹽區分。","草酸鹽結晶不溶於稀醋酸，與此題描述不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_030","year":2019,"roc_year":108,"session":"1","examNo":30,"q":"下述關於犬罹患腎上腺依賴性高腎上腺皮質功能症（ADH）之直接檢查結果，何者正確？","opts":["A. cortisol高值、ACTH刺激試驗反應正常或低下、LDDST無反應","B. cortisol正常或高值、ACTH刺激試驗反應正常或低下、LDDST明顯降低","C. cortisol正常或高值、ACTH刺激試驗反應正常或升高、LDDST無反應","D. cortisol高值、ACTH刺激試驗反應正常或升高、LDDST明顯降低"],"ans":2,"exp":"腎上腺依賴性（ADH，adrenal-dependent hyperadrenocorticism）：功能性腎上腺腫瘤自主分泌皮質醇，不受ACTH調控。結果：cortisol高值；ACTH刺激試驗反應正常或升高（腫瘤細胞可能對ACTH有反應，但也有低下情況，文獻有差異，多數為正常至升高）；LDDST（低劑量地塞米松抑制試驗）無法壓制（無反應）。故選C。","we":["ADH時ACTH刺激試驗通常反應正常或升高，而非「正常或低下」，A描述有誤。","「LDDST明顯降低」表示能被地塞米松壓制，此為正常犬的表現，非ADH。","（正確）ADH：cortisol高、ACTH刺激試驗反應正常或升高、LDDST無反應，此為正確描述。","D描述「LDDST明顯降低」錯誤，ADH應為LDDST無法壓制（無反應）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_031","year":2019,"roc_year":108,"session":"1","examNo":31,"q":"Addison's disease可能伴隨的血液檢驗結果為：①淋巴球減少症（lymphopenia） ②嗜中性球\r 增多症（neutrophilia） ③Na/K＜23 ④ Na/K＞23 ⑤血磷上升 ⑥BUN上升","opts":["A. ①③⑤","B. ②③⑥","C. ②④⑤","D. ③⑤⑥"],"ans":3,"exp":"Addison's disease（低腎上腺皮質功能症，aldosterone+cortisol缺乏）：缺少醛固酮→Na+流失、K+滯留→Na/K比下降（低於23，正常≥27）；缺少皮質醇→淋巴球增多（非減少）、嗜中性球減少（非增多）；鉀滯留→高血鉀；鈉流失→低血鈉→低血容→BUN上升（腎前性）；高血磷（aldosterone缺乏影響磷排泄）。故③Na/K<23、⑤血磷上升、⑥BUN上升正確，選D。","we":["①淋巴球減少症是Cushing's（高腎上腺皮質）的表現，Addison's反而淋巴球增多。","②嗜中性球增多症是Cushing's的表現，Addison's應為嗜中性球減少。","④Na/K>23是正常或Cushing's的表現，Addison's為Na/K<23。","（正確）③Na/K<23、⑤血磷上升、⑥BUN上升均為Addison's disease的典型血液變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_032","year":2019,"roc_year":108,"session":"1","examNo":32,"q":"關於牛的乳熱，下列敘述何者正確？","opts":["A. 血液相呈現低血鈣、高血磷","B. 因攝入的磷量不足造成維生素D活性不足","C. 血液相呈現高血鈣、高血磷","D. 血液相呈現低血鈣、低血磷"],"ans":3,"exp":"牛乳熱（milk fever，產後低血鈣症）：分娩時大量鈣進入乳汁→低血鈣；低血鈣刺激PTH分泌→促進磷排泄→低血磷。典型血液相：低血鈣＋低血磷（D正確）。並非維生素D攝入問題，而是鈣的大量需求超過調節能力。","we":["乳熱為低血鈣，並非高血磷；A的「高血磷」錯誤。","乳熱是由鈣的需求劇增（非磷攝入不足）引起，且維生素D活性通常已被激發，B描述錯誤。","C的「高血鈣」根本與乳熱相反，乳熱即為低血鈣症。","（正確）乳熱的典型血液相為低血鈣＋低血磷，D敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_033","year":2019,"roc_year":108,"session":"1","examNo":33,"q":"血液的膠體滲透壓主要由下列何種物質的存在來維持？","opts":["A. 纖維素原","B. 白蛋白","C. 膠原蛋白","D. 脂蛋白"],"ans":1,"exp":"血液膠體滲透壓（oncotic pressure）主要由白蛋白（albumin）維持，佔血漿蛋白的80%以上貢獻，因白蛋白分子量小（約66kDa）且濃度高（3.5～5 g/dL），Gibbs-Donnan效應貢獻大。纖維素原、膠原蛋白（不在血漿中）、脂蛋白的貢獻遠小於白蛋白。","we":["纖維素原（fibrinogen）雖為血漿蛋白，但濃度較低（0.2～0.4 g/dL），對膠體滲透壓貢獻遠小於白蛋白。","（正確）白蛋白是維持血漿膠體滲透壓最主要的蛋白質，佔總滲透壓的大部分。","膠原蛋白（collagen）存在於組織，非血漿蛋白，不維持血液膠體滲透壓。","脂蛋白分子量大且濃度低，對膠體滲透壓貢獻極小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_034","year":2019,"roc_year":108,"session":"1","examNo":34,"q":"大部分之陰離子差（anion gap）能反應出循環中的何種變化？","opts":["A. 氯離子（Cl - ）","B. 重碳酸根離子（HCO 3 - ）","C. 鈉離子（Na + ）","D. 白蛋白與小分子量有機酸"],"ans":3,"exp":"陰離子差（Anion gap, AG）= Na+ - (Cl- + HCO3-)，正常值約12～20 mEq/L。AG增加通常反映循環中未測量陰離子的增加，包括白蛋白（帶負電）及各種小分子量有機酸（乳酸、酮酸、尿毒酸等）。","we":["Cl-本身是AG計算的一部分（已測量），AG升高通常反映「未測量」陰離子增加，非Cl-本身的變化。","HCO3-也是AG計算的已測量陰離子，AG升高反映的是其他未測量陰離子，非HCO3-本身。","Na+是已測量陽離子，AG升高不直接反映Na+的循環變化。","（正確）AG主要反映白蛋白（帶負電）及小分子有機酸（乳酸、酮酸等）的循環變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_035","year":2019,"roc_year":108,"session":"1","examNo":35,"q":"牛隻發生第四胃液體滯留時，會引發下列何種變化？","opts":["A. 呼吸性酸中毒","B. 呼吸性鹼中毒","C. 代謝性酸中毒","D. 代謝性鹼中毒"],"ans":3,"exp":"牛第四胃液體滯留（abomasal displacement/obstruction）時，大量HCl滯留於第四胃，無法進入小腸→H+與Cl-均流失於循環（應進入腸道但被截留）→低氯、低氫離子（鹼化）→代謝性鹼中毒，同時常伴低鉀血症。","we":["呼吸性酸中毒是由CO2排出不足引起，與第四胃液體滯留的機制不符。","呼吸性鹼中毒是由CO2過度排出引起，非消化道問題。","代謝性酸中毒是H+增加或HCO3-減少，與第四胃液滯留（導致H+/Cl-滯留於胃→體循環鹼化）相反。","（正確）第四胃HCl滯留→體循環失去H+和Cl-→代謝性鹼中毒（低氯低鉀性代謝性鹼中毒）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_036","year":2019,"roc_year":108,"session":"1","examNo":36,"q":"犬貓嚴重代謝性鹼中毒時，其血漿HCO 3 - 之濃度應為多少mmol/L？","opts":["A. 20以下","B. 20～24","C. 25～30","D. 32以上"],"ans":3,"exp":"犬貓血漿HCO3-正常值約18～24 mmol/L；25～30為輕至中度代謝性鹼中毒；32以上才符合嚴重代謝性鹼中毒（severe metabolic alkalosis）的定義。","we":["HCO3- 20以下為代謝性酸中毒範圍，非鹼中毒。","HCO3- 20～24為正常範圍，非鹼中毒。","HCO3- 25～30為輕至中度代謝性鹼中毒，非嚴重。","（正確）HCO3- 32 mmol/L以上才符合嚴重代謝性鹼中毒的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_037","year":2019,"roc_year":108,"session":"1","examNo":37,"q":"於體腔滲液中，細胞具有紅色毛刷狀細胞膜突起，細胞質染成深藍色，且有一至數個深色之圓形至卵圓形核\r 之特徵，為下列何者？","opts":["A. 反應型間皮細胞","B. 變形間皮細胞","C. 巨噬細胞","D. 肥胖細胞"],"ans":0,"exp":"反應型間皮細胞（reactive mesothelial cell）的特徵：具有明顯的紅色毛刷狀細胞膜突起（microvilli/刷狀緣），細胞質深藍色，含一至數個深色圓形至卵圓形核。這是間皮細胞受到刺激後活化的形態表現，常見於慢性體腔滲液中。","we":["（正確）反應型間皮細胞具有紅色毛刷狀突起、深藍色細胞質及多個深色核的典型特徵。","變形間皮細胞形態多樣，但不特別具有明顯的毛刷狀突起，且常呈退行性變化。","巨噬細胞（macrophage）細胞質空泡多，不具毛刷狀突起，細胞核呈腎形或馬蹄形。","肥胖細胞（mast cell）含有大量紫色顆粒，形態完全不同於此描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_038","year":2019,"roc_year":108,"session":"1","examNo":38,"q":"馬之腹腔穿刺液，每μL之細胞總數在多少且考慮其形態學變化，即判定為炎症性滲出液（exudates）？","opts":["A. 1,000～1,500","B. 2,000～3,000","C. 4,000～5,000","D. 10,000以上"],"ans":1,"exp":"馬腹腔穿刺液的正常細胞數低於5,000/μL，當細胞數達到10,000/μL以上（有些教科書以>5,000/μL為界），且細胞形態有炎症性變化（退行性嗜中性球為主），即判定為炎症性滲出液（exudate）。一般以10,000/μL以上為馬腹腔炎症性滲出液的診斷標準。","we":["1,000～1,500/μL為極低細胞數，在馬仍屬漏出液（transudate）範圍。","（正確）馬腹腔穿刺液細胞數達10,000/μL以上，結合細胞形態學變化，即診斷為炎症性滲出液。","2,000～3,000/μL仍在漏出液至改良型漏出液範圍，尚未達炎症性滲出液標準。","4,000～5,000/μL接近診斷臨界值，但尚未達到馬的炎症性滲出液標準（>10,000）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_039","year":2019,"roc_year":108,"session":"1","examNo":39,"q":"下列關於關節囊液之敘述，何者錯誤？","opts":["A. 正常關節囊液之淋巴球、單核球、巨噬細胞及關節囊上皮細胞約占總有核細胞之90%","B. 化膿性細菌感染時細胞數可達100,000 /μL，以退行性嗜中性球、淋巴球及活動性巨噬細胞等為主","C. 糜爛性多發性關節炎時，以退行性嗜中性球占絕對多數","D. 退行性關節病時，其細胞數在正常值或稍增，以單核細胞為主，巨噬細胞及關節囊上皮細胞也有稍增"],"ans":1,"exp":"關節囊液（synovial fluid）各疾病表現：正常關節液：>90%為單核細胞（A正確）；化膿性細菌感染：細胞數可達100,000/μL，以退行性嗜中性球為主（非淋巴球及巨噬細胞，B錯誤）；糜爛性多發性關節炎（如RA）：以退行性嗜中性球為主（C正確）；退行性關節病：細胞數正常或稍增，以單核細胞為主（D正確）。","we":["正常關節囊液中淋巴球、單核球及關節囊上皮細胞約占90%，A正確。","（正確）化膿性細菌感染時主要細胞應是退行性嗜中性球（>90%），而非淋巴球及活動性巨噬細胞，B描述錯誤。","糜爛性多發性關節炎（免疫媒介性）時，退行性嗜中性球占絕對多數，C正確。","退行性關節病的關節液細胞數在正常或稍增，以單核細胞為主，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_040","year":2019,"roc_year":108,"session":"1","examNo":40,"q":"下列何者通常被使用於輸血用血液之抗凝？","opts":["A. EDTA-2K","B. 檸檬酸鹽","C. 肝素","D. 草酸鹽"],"ans":1,"exp":"輸血用血液抗凝劑需滿足：不影響血球活性、可長時間保存、不影響受血者生理。檸檬酸鹽（citrate）通過螯合鈣離子抑制凝血，對血球無毒，為標準輸血抗凝劑（血袋常用ACD或CPD含檸檬酸鹽溶液）。EDTA適合血液學檢驗但有細胞毒性；肝素影響後續血液學檢測；草酸鹽有毒。","we":["EDTA-2K適合血液學（CBC）採樣，但對紅血球有一定影響，不用於輸血保存。","（正確）檸檬酸鹽是輸血用血液的標準抗凝劑，通過螯合Ca2+抑制凝血，對血球無毒。","肝素會影響後續血液學和生化檢測，且可能活化血小板，不適合輸血抗凝。","草酸鹽具有細胞毒性，對紅血球有損害，不適合輸血使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_041","year":2019,"roc_year":108,"session":"1","examNo":41,"q":"下列何種情況之樣本可造成血液中AST與ALT之濃度上升，但ALP與creatinine之濃度下降？","opts":["A. lipemia","B. hemolysis","C. icterus","D. hyperglycemia"],"ans":1,"exp":"溶血（hemolysis）的干擾：AST和ALT在紅血球中濃度高，溶血釋放→血中AST、ALT偽性升高（正確）。ALP在紅血球含量低，溶血對ALP影響輕微，可造成輕度下降（因稀釋效果或干擾吸光度）。Creatinine測定（Jaffé法）受血紅素干擾，造成偽性下降。故hemolysis造成AST/ALT升高、ALP/creatinine下降，選B。","we":["脂血症（lipemia）主要造成吸光度干擾，使多數酶偽性升高或降低，不是最符合「AST/ALT升高、ALP/creatinine降低」的選項。","（正確）溶血（hemolysis）導致紅血球內的AST、ALT釋放（升高），同時干擾ALP及creatinine測定（降低）。","黃疸（icterus）主要干擾比色法測定，對各項指標的影響模式與此題不符。","高血糖（hyperglycemia）對AST、ALT、ALP及creatinine無此特定干擾模式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_042","year":2019,"roc_year":108,"session":"1","examNo":42,"q":"反芻獸瘤胃內容物通常以何種方法保存運送？","opts":["A. 冷藏","B. 2%福馬林液","C. 50%甘油生理鹽水","D. 生理鹽水"],"ans":0,"exp":"反芻獸瘤胃內容物的微生物相（纖毛蟲、細菌）活性需維持，才能進行有意義的瘤胃液分析（纖毛蟲活動性評估）。應在採集後立即保溫（37℃）或以冷藏（接近體溫的保溫袋）保存運送，並盡快送檢。化學固定劑（福馬林、甘油）和生理鹽水無法維持纖毛蟲活性。冷藏（不過冷）是最實際的保存方式。","we":["（正確）冷藏（4℃）可短暫減緩腐敗，適合瘤胃內容物的運送保存，且不破壞微生物形態。","2%福馬林液會立即殺滅纖毛蟲並固定形態，無法評估纖毛蟲活動性。","50%甘油生理鹽水對瘤胃微生物有毒性，不適合保存活的瘤胃微生物群落。","生理鹽水會稀釋瘤胃液並可能加速微生物死亡，不適合長途運送保存。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_043","year":2019,"roc_year":108,"session":"1","examNo":43,"q":"X'mas disease是缺乏第幾凝血因子造成之疾病？","opts":["A. Ⅷ","B. Ⅶ","C. Ⅸ","D. Ⅱ"],"ans":2,"exp":"X'mas disease（聖誕節病）是缺乏第IX凝血因子（Factor IX）的遺傳性出血疾病，又稱B型血友病（Hemophilia B）。缺乏Factor VIII為A型血友病（Hemophilia A）；缺乏Factor VII為低轉化酶血症；缺乏Factor II（凝血酶原）極為罕見。","we":["缺乏Factor VIII為A型血友病（Hemophilia A），而非X'mas disease。","缺乏Factor VII（低轉化酶血症）可造成OSPT延長，但非X'mas disease。","（正確）X'mas disease即B型血友病，為缺乏Factor IX（第九凝血因子）。","缺乏Factor II（凝血酶原）極為罕見，非X'mas disease。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_044","year":2019,"roc_year":108,"session":"1","examNo":44,"q":"犬正常mean platelet volume（MPV）範圍為多少fL？","opts":["A. 6.1-10.1","B. 12-18","C. 4-6","D. 3.5-6.5"],"ans":0,"exp":"犬正常mean platelet volume（MPV，平均血小板體積）為6.1～10.1 fL。貓的MPV約為12～18 fL（較犬大）。MPV是評估血小板大小及產生速率的指標，MPV升高提示血小板更新加速（如免疫媒介性血小板減少症）。","we":["（正確）犬正常MPV為6.1～10.1 fL，此為標準教科書數值。","12～18 fL為貓的MPV正常範圍，非犬。","4～6 fL偏小，不在犬正常範圍內。","3.5～6.5 fL過小，不符合犬的正常MPV範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_045","year":2019,"roc_year":108,"session":"1","examNo":45,"q":"B型血友病是缺乏第幾凝血因子？","opts":["A. Ⅱ","B. Ⅴ","C. Ⅸ","D. Ⅹ"],"ans":2,"exp":"B型血友病（Hemophilia B）是缺乏第IX凝血因子（Factor IX），與X'mas disease相同（即同一疾病）。A型血友病（Hemophilia A）缺乏Factor VIII。此題與Q43考同一概念，答案均為Factor IX（C選項）。","we":["Factor II（凝血酶原）缺乏為低凝血酶原血症，極為罕見，非B型血友病。","Factor V缺乏為副血友病（parahemophilia），非B型血友病。","（正確）B型血友病（Hemophilia B）即缺乏Factor IX，又稱Christmas disease。","Factor X缺乏為Stuart-Prower因子缺乏症，非B型血友病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_046","year":2019,"roc_year":108,"session":"1","examNo":46,"q":"下列何者不是血紅質（heme）合成過程所必需？","opts":["A. 銅（Cu）","B. 鐵（Fe）","C. 鈷（Co）","D. 鋅（Zn）"],"ans":2,"exp":"血紅質（heme）合成需要：鐵（Fe）—構成heme的核心元素；銅（Cu）—亞鐵氧化酶（ceruloplasmin）需要Cu才能將Fe2+氧化為Fe3+以進行運輸，但直接合成heme的酶需要Zn和Fe；鋅（Zn）—ALA合成酶等需要Zn作為輔因子。鈷（Co）是維生素B12的組成元素，與紅血球生成有間接關係，但不是heme合成（卟啉合成）直接必需的元素。","we":["銅（Cu）在鐵代謝中扮演角色（銅藍蛋白），間接參與血紅素合成，不是答案。","鐵（Fe）是heme的核心金屬離子，為血紅質合成絕對必需，不是答案。","（正確）鈷（Co）是維生素B12的成分，與heme合成路徑（卟啉合成）無直接關係，為最不必要的元素。","鋅（Zn）是多種heme合成酶的輔因子（如δ-ALA脫水酶），間接必需，不是答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_047","year":2019,"roc_year":108,"session":"1","examNo":47,"q":"下列那幾項是慢性出血的特徵？①低血容比較其他臨床症狀更早出現 ②通常不會有再生性反應 ③常可\r 見低蛋白血症 ④常有血小板增多症","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":1,"exp":"慢性出血的特徵：①低血容比較其他臨床症狀更早出現—錯誤（慢性出血時因代償，貧血緩慢進展，臨床症狀先出現）；②通常不會有再生性反應—錯誤（慢性失血可有再生性反應）；③常見低蛋白血症—正確（慢性失血同時流失蛋白質）；④常有血小板增多症—正確（慢性出血刺激血小板生成）。另外，慢性出血常見缺鐵性貧血（小球性低色素性），且缺鐵抑制再生反應。故②③④正確，選B。","we":["①②③：①「低血容比更早出現」錯誤，慢性貧血有代償，臨床症狀通常先被注意到。","（正確）②③④：不會有再生性反應（缺鐵抑制骨髓）、低蛋白血症（蛋白隨血流失）、血小板增多症（刺激生成）均為慢性出血特徵。","①③④：含①（低血容比更早出現），此描述不正確，慢性貧血有代償機制。","①②④：含①錯誤，且②（無再生性反應）在選項組合順序有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_048","year":2019,"roc_year":108,"session":"1","examNo":48,"q":"下圖為何種嗜中性球減少症的機制？（長方格之大小表示各嗜中性球池之相對大小，箭頭大小表示各嗜中性 球池之細胞進出量。上圖為正常機轉之圖示。）","opts":["A. 顆粒球之形成作用受到抑制時","B. 組織對嗜中性球突然有大量需求時","C. 嗜中性球被抑留於邊緣池時","D. 非炎症性之全身性緊迫"],"ans":2,"exp":"此題需看圖才能判斷。根據題目描述的嗜中性球減少症機制圖示（長方格大小表示池的大小，箭頭表示進出量），若邊緣池（marginal pool）增大而循環池（circulating pool）縮小，且各池間的流量未改變，此形態符合「嗜中性球被抑留於邊緣池（marginal pool sequestration）」的機制，為無炎症性假性嗜中性球減少症。","we":["顆粒球形成受抑制時，骨髓池和成熟池均會縮小，各池均偏小，與此題圖示不完全吻合。","組織對嗜中性球突然有大量需求時，組織端的箭頭會增大，循環池縮小，骨髓池加速釋放。","（正確）嗜中性球被抑留於邊緣池時，循環池縮小但邊緣池增大，整體骨髓池正常，需看圖確認。","非炎症性全身性緊迫（腎上腺素效應）應使嗜中性球從邊緣池移至循環池，造成白血球增多而非減少。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1081_實診_049","year":2019,"roc_year":108,"session":"1","examNo":49,"q":"下列有關動物淋巴瘤（lymphoma）的敘述，何者正確？","opts":["A. 犬淋巴瘤大多為消化道淋巴瘤，且是T細胞起源","B. 乳牛持續性淋巴球增多症即表示有淋巴瘤","C. 在貓淋巴瘤大多可見白血病血液輪廓","D. 在雪貂最常見消化道淋巴瘤"],"ans":3,"exp":"雪貂（ferret）最常見的淋巴瘤為消化道淋巴瘤（alimentary lymphoma），常為T細胞起源。犬淋巴瘤大多為多中心型，B細胞起源；貓淋巴瘤多為消化道型，但不一定有白血病輪廓；乳牛持續性淋巴球增多症（PL）並不等同於淋巴瘤，僅有少數PL牛會發展為淋巴瘤。","we":["犬淋巴瘤大多為多中心型（multicentric），且多為B細胞起源（非消化道型或T細胞），A錯誤。","乳牛PL（persistent lymphocytosis）由BLV（牛白血病病毒）引起，不一定發展為淋巴瘤，B錯誤。","貓淋巴瘤多數不出現白血病血液輪廓（白血病期），C錯誤。","（正確）雪貂最常見消化道淋巴瘤，且常為T細胞起源，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_050","year":2019,"roc_year":108,"session":"1","examNo":50,"q":"下列有關正常犬嗜中性球動力學之敘述，何者正確？①血中嗜中性球一天約有2.5～4.0次的轉換 ②血中嗜\r 中性球移入組織間隙是採隨機方式 ③血中老年嗜中性球將優先移入組織 ④離開血管移行至胸腹腔之嗜中\r 性球約僅有60%可以再回到血中","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"正常犬嗜中性球動力學：①血中嗜中性球一天約有2.5～4.0次的轉換—正確；②血中嗜中性球移入組織間隙是採隨機方式（非依老舊程度）—正確；③並非老年嗜中性球優先移入組織，而是隨機移入；④離開血管至胸腹腔的嗜中性球「不」會再回到血中（單向）。故①②正確，選A。","we":["（正確）①血中嗜中性球每天轉換2.5～4.0次、②隨機進入組織，均正確。","②③：③老年嗜中性球優先移入組織不正確，嗜中性球進入組織是隨機的。","③④：③錯誤；④離開血管至胸腹腔的嗜中性球無法再回到血中（單向遷移），④也錯誤。","①④：④錯誤，嗜中性球進入體腔後不會再回到血中，不只有40%無法回來。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_051","year":2019,"roc_year":108,"session":"1","examNo":51,"q":"有關泛血球減少症（pancytopenia）之敘述，下列何者正確？①骨髓內可能有腫瘤細胞增生 ②周邊血液常\r 同時出現大量後紅血細胞及網狀球 ③骨髓可能有纖維化 ④骨髓可能呈脂肪變性","opts":["A. ①②③","B. ①③④","C. ①②④","D. ②③④"],"ans":1,"exp":"泛血球減少症（pancytopenia）原因包括：①骨髓腫瘤細胞增生（佔據骨髓）—正確；②周邊血液同時出現大量後紅血細胞及網狀球—錯誤（泛血球減少症通常是非再生性，不會大量出現網狀球）；③骨髓纖維化—正確；④骨髓脂肪變性（aplastic anemia）—正確。故①③④正確，選B。","we":["①②③：②大量後紅血細胞及網狀球出現代表再生性反應，泛血球減少症通常為非再生性，②錯誤。","（正確）①骨髓腫瘤、③骨髓纖維化、④骨髓脂肪變性均可造成泛血球減少症，①③④正確。","①②④：含②（大量網狀球），此為再生性表現，不符合泛血球減少症。","②③④：含②錯誤，泛血球減少症不會見到大量再生性紅血球。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_052","year":2019,"roc_year":108,"session":"1","examNo":52,"q":"網狀球可用下列何種染色替代new methylene blue？","opts":["A. Giemsa stain","B. 1% brilliant cresyl blue","C. 5% carbol fuchsin","D. Wright's stain"],"ans":1,"exp":"網狀球（reticulocyte）染色需使用超活染色（supravital stain），以顯示殘留RNA/核糖體（網狀結構）。常用超活染色：new methylene blue（NMB）及1% brilliant cresyl blue（BCB）。Giemsa和Wright's stain為常規血片染色（非活染色）；carbol fuchsin為抗酸染色。","we":["Giemsa stain是常規固定後染色，無法顯示網狀球的RNA網狀結構，不能替代NMB。","（正確）1% brilliant cresyl blue是超活染色劑，可顯示網狀球的RNA網狀結構，可替代NMB。","5% carbol fuchsin是Ziehl-Neelsen抗酸染色的成分，用於結核分枝桿菌染色，非網狀球染色。","Wright's stain是常規固定後血片染色，無法顯示網狀結構，不適用於網狀球計數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_053","year":2019,"roc_year":108,"session":"1","examNo":53,"q":"下列何項原因均可引起犬貓血中球蛋白上升？①感染 ②發炎 ③懷孕末期 ④排卵時","opts":["A. ①②③","B. ①②④","C. ①③④","D. ②③④"],"ans":0,"exp":"犬貓血中球蛋白（globulin）上升的原因：①感染（刺激B細胞產生抗體）—正確；②發炎（急性期反應蛋白含球蛋白成分）—正確；③懷孕末期（免疫球蛋白移至初乳）—通常球蛋白會下降而非上升；④排卵時—不是球蛋白上升的原因。故①②正確，選A。","we":["（正確）①感染和②發炎均可刺激免疫球蛋白合成，導致球蛋白上升，①②③的組合中③（懷孕末期）有疑義，但①②本身正確。","①②④：④排卵不是球蛋白上升的原因，此組合有誤。","①③④：③懷孕末期球蛋白可能因免疫球蛋白轉移至乳汁而下降，且④不正確。","②③④：③④均有疑義，不如①②組合可靠。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_054","year":2019,"roc_year":108,"session":"1","examNo":54,"q":"馬疝痛時，若血清生化檢查出現下列何種情況，表示預後不良？","opts":["A. 低膽固醇血症","B. 酮血症","C. 低乳酸鹽血症","D. 高乳酸鹽血症"],"ans":3,"exp":"馬疝痛（colic）時，組織缺血→無氧代謝→乳酸堆積。高乳酸鹽血症（hyperlactatemia）反映腸道缺血的嚴重程度，是預後不良的指標。血清乳酸 > 8 mmol/L 時預後極差。低乳酸鹽反而表示組織灌流尚可，預後較好。","we":["低膽固醇血症在馬疝痛中不是主要預後指標。","酮血症（ketosis）在馬較不常見，且不是疝痛預後的主要指標。","低乳酸鹽血症反映組織灌流良好，為預後良好的指標，而非不良。","（正確）高乳酸鹽血症（>8 mmol/L）反映腸道缺血和組織灌流不足，為馬疝痛預後不良的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_055","year":2019,"roc_year":108,"session":"1","examNo":55,"q":"關於乳酸鹽脫氫酶（lactate dehydrogenase，LDH）的敘述，下列何者正確？","opts":["A. 屬於細胞外酵素","B. 負責催化乳酸與丙酮酸之反應","C. 欲測定LDH的樣本可保存於-20℃以維持酵素之穩定性","D. 測定肌肉損傷的最佳指標酵素"],"ans":1,"exp":"乳酸鹽脫氫酶（LDH）：屬於細胞內酵素（非細胞外，A錯）；負責催化乳酸（lactate）⇌丙酮酸（pyruvate）的可逆反應（B正確）；LDH在冷凍後活性不穩定，應保存於室溫或4℃（不宜-20℃，C錯）；測定肌肉損傷最佳指標是CK，而非LDH（D錯）。","we":["LDH是細胞內酵素（存在於細胞質），細胞損傷後釋放至血漿，並非細胞外酵素。","（正確）LDH催化乳酸與丙酮酸之間的可逆反應（乳酸 + NAD+ ⇌ 丙酮酸 + NADH），B正確。","LDH樣本不適合冷凍於-20℃，冷凍會破壞酶活性；應室溫短期保存或4℃冷藏。","CK（creatine kinase）才是測定急性肌肉損傷的最佳指標，LDH特異性較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_056","year":2019,"roc_year":108,"session":"1","examNo":56,"q":"下列有關國際上測量酵素之單位敘述，何者正確？","opts":["A. 國際單位（IU）：於規定條件（溫度、pH及基質濃度）下，每分鐘能分解1莫耳基質或輔酶數量","B. 卡達耳（kat）：每秒鐘分解1微莫耳（micro mole）之酵素量","C. 1 IU=16.67 nanokatal（nkat）","D. 由IU或kat之測定值能直接有效反映出臨床意義"],"ans":2,"exp":"酵素單位定義：國際單位（IU）：於規定條件下，每分鐘能分解1「微莫耳（μmol）」基質的酵素量（A錯，A說「1莫耳」）；卡達耳（katal, kat）：每秒鐘分解1「莫耳（mol）」基質的酵素量（B錯，B說「1微莫耳」）；1 IU = 16.67 nanokatal（nkat）—正確（1 IU/L = 16.67 nkat/L）；IU和kat的測定值需結合臨床判斷，不能直接反映臨床意義（D正確但不完整）。","we":["IU定義為每分鐘分解1微莫耳（μmol）基質，而非1莫耳（mol），A的「1莫耳」描述錯誤。","katal（kat）定義為每秒鐘分解1莫耳（mol）基質，而非1微莫耳（μmol），B描述錯誤。","（正確）1 IU = 16.67 nanokatal（nkat）的換算關係正確（1 IU/min = 1 μmol/min = 1/60 μmol/s = 16.67 nmol/s = 16.67 nkat）。","IU和kat的測定值需結合臨床正常值和病史才能判斷意義，不能「直接有效反映」臨床意義，D描述有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_057","year":2019,"roc_year":108,"session":"1","examNo":57,"q":"貓acetaminophen中毒可能會出現下列何種病症？","opts":["A. 溶血性貧血","B. 骨髓抑制","C. 代謝性鹼中毒","D. 心肌炎"],"ans":0,"exp":"貓acetaminophen（撲熱息痛）中毒：貓缺乏葡萄糖醛酸化酶（glucuronyl transferase），無法代謝acetaminophen，毒性代謝物（NAPQI）累積→氧化血紅蛋白為變性血紅蛋白（methemoglobin）→形成Heinz bodies→溶血性貧血。同時可能引起高鐵血紅素血症（methemoglobinemia），造成黏膜發紺。","we":["（正確）貓acetaminophen中毒導致Heinz body形成及溶血性貧血，此為最典型表現。","骨髓抑制不是acetaminophen中毒的主要表現，而是苯丙胺等藥物的副作用。","代謝性鹼中毒不是acetaminophen中毒的特徵；中毒時可能因組織缺氧而出現代謝性酸中毒。","心肌炎不是貓acetaminophen中毒的典型病症，主要影響紅血球和肝臟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_058","year":2019,"roc_year":108,"session":"1","examNo":58,"q":"下列何種情況會造成ALP的上升？①混合型乳房瘤 ②服用primidone ③腦膜炎 ④骨折生長期 ⑤溶\r 血","opts":["A. ①②③","B. ①②④","C. ②③⑤","D. ③④⑤"],"ans":1,"exp":"ALP上升的原因：①混合型乳房瘤—骨性ALP同工酶可因骨轉移上升，正確；②服用primidone（苯巴比妥類抗癲癇藥）—誘導肝臟ALP同工酶生成，正確；③腦膜炎—不直接引起ALP上升；④骨折生長期—骨性ALP（BALP）上升，正確；⑤溶血—ALP在紅血球中含量低，溶血不顯著引起ALP上升。故①②④正確，選B。","we":["①②③：腦膜炎（③）不直接引起ALP上升，此組合有誤。","（正確）①混合型乳房瘤（骨轉移）、②primidone（藥物誘導）、④骨折生長期（骨性ALP）均可引起ALP上升。","②③⑤：③腦膜炎和⑤溶血均不顯著引起ALP上升，此組合有誤。","③④⑤：③腦膜炎和⑤溶血不引起ALP上升，此組合有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_059","year":2019,"roc_year":108,"session":"1","examNo":59,"q":"有關巨胰澱粉酶（macroamylase）之敘述，何者錯誤？","opts":["A. 為amylase與免疫球蛋白或其他蛋白之複合體","B. 犬隻腎病時較常見","C. 其血中濃度上升常與胰臟炎相關","D. 其血中濃度上升時常伴隨蛋白尿"],"ans":2,"exp":"巨胰澱粉酶（macroamylase）：為amylase與免疫球蛋白複合體（A正確）；分子量大→無法被腎臟濾過→血中濃度上升但尿中澱粉酶不升高，故常伴隨「無蛋白尿」（D錯，D說「伴隨蛋白尿」）；常見於腎病（無法濾過，積聚）；其血中濃度上升「不」與胰臟炎直接相關（C錯），因為是腎濾過減少所致。故C「血中濃度上升常與胰臟炎相關」是錯誤的。","we":["巨胰澱粉酶是amylase與免疫球蛋白（或其他蛋白）形成的複合體，A正確。","犬隻腎病時因腎臟無法濾過大分子的巨胰澱粉酶，導致血中濃度上升，B正確。","（正確）巨胰澱粉酶血中濃度上升是因無法被腎臟清除（非胰臟炎所致），與胰臟炎無直接關聯，C錯誤。","巨胰澱粉酶分子量大，不能被腎臟濾過，因此尿中不會出現，不伴隨蛋白尿，D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_060","year":2019,"roc_year":108,"session":"1","examNo":60,"q":"下列何種動物之白蛋白半衰期最短？","opts":["A. 馬","B. 犬","C. 小白鼠","D. 乳牛"],"ans":2,"exp":"各動物白蛋白半衰期：犬約8天；馬約19天；乳牛約15天；小白鼠（mice）約1.9天。小白鼠的白蛋白半衰期最短，約不到2天，因代謝率最高。","we":["馬的白蛋白半衰期約19天，為列舉動物中最長。","犬的白蛋白半衰期約8天，較小白鼠長得多。","（正確）小白鼠白蛋白半衰期最短（約1.9天），因其代謝率極高。","乳牛白蛋白半衰期約15天，遠長於小白鼠。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_061","year":2019,"roc_year":108,"session":"1","examNo":61,"q":"某犬之血漿總蛋白為8 gm/dL，纖維素原為0.4 gm/dL，造成此現象最可能原因為","opts":["A. 脫水","B. 高纖維素原血症","C. 低纖維素原血症","D. 營養不良"],"ans":0,"exp":"犬血漿總蛋白8 g/dL（偏高正常值上限～偏高），纖維素原0.4 g/dL（正常值0.2～0.4 g/dL）。血漿蛋白高而纖維素原正常→並非因為纖維素原高，而是因為白蛋白或球蛋白增高。最常見原因是脫水（hemoconcentration）→血漿蛋白濃縮而升高，但纖維素原因為也被濃縮仍在正常範圍。選A（脫水）。","we":["（正確）脫水造成血液濃縮，血漿總蛋白升高，而纖維素原也因濃縮而在正常高限，最可能原因是脫水。","高纖維素原血症（>0.4 g/dL）表示纖維素原升高，但此題纖維素原僅0.4 g/dL（正常範圍），不支持此診斷。","低纖維素原血症是纖維素原低於正常（<0.1 g/dL），與此題數值不符。","營養不良通常導致低蛋白血症（總蛋白降低），而非升高至8 g/dL。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_062","year":2019,"roc_year":108,"session":"1","examNo":62,"q":"下列何者不是繼發性高血脂症之原因？","opts":["A. 糖尿病","B. 膽汁淤積","C. 急性胰臟壞死","D. 高甲狀腺功能症"],"ans":3,"exp":"繼發性高血脂症（secondary hyperlipidemia）的常見原因：糖尿病（胰島素不足→脂肪分解↑）、膽汁淤積（膽汁酸滯留→脂質代謝異常）、急性胰臟壞死（脂肪酶失調）、甲狀腺功能「低下」（hypothyroidism，甲狀腺素不足→脂質清除率↓）。高甲狀腺功能症（hyperthyroidism）反而加速脂質代謝，不引起高血脂症。故D（高甲狀腺功能症）不是繼發性高血脂症的原因。","we":["糖尿病是繼發性高血脂症的常見原因，胰島素缺乏導致脂肪分解增加。","膽汁淤積（cholestasis）導致脂質代謝異常，為繼發性高血脂症原因之一。","急性胰臟壞死時脂肪酶釋放，可導致脂質代謝紊亂，為高血脂原因之一。","（正確）高甲狀腺功能症（hyperthyroidism）加速脂質代謝，通常導致低血脂而非高血脂，不是繼發性高血脂症的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_063","year":2019,"roc_year":108,"session":"1","examNo":63,"q":"關於血清胰蛋白酶樣免疫反應活性（trypsin-like immunoreactivity，TLI）檢測之臨床意義，下列敘述何者錯\r 誤？","opts":["A. 急性胰炎時，TLI會急激上升","B. 慢性腎功能不足時，TLI會下降","C. 胰外分泌不足時，TLI會下降","D. 應使用放射性免疫分析法測定"],"ans":1,"exp":"TLI（trypsin-like immunoreactivity）是犬貓胰外分泌功能的特異性指標：急性胰炎→TLI急激上升（A正確）；慢性腎功能不足→TLI「上升」（因腎臟清除率下降，B錯誤，B說「下降」）；胰外分泌不足（EPI）→TLI下降（C正確）；TLI應使用物種特異性的免疫分析法（如ELISA），而非放射性免疫分析（RIA），但D說「應使用RIA」需視教科書，現多用ELISA（D可能爭議，但B最明確錯誤）。","we":["急性胰炎時，大量胰蛋白酶原釋放至血液→TLI急激上升，A正確。","（正確）慢性腎功能不足時，腎臟清除TLI的能力下降，導致TLI「上升」而非下降，B描述錯誤。","胰外分泌不足（EPI）時，胰腺分泌功能下降→TLI降低，C正確。","TLI測定需使用物種特異性免疫分析法（犬用犬專一性試劑），現代多用ELISA，D說法有時代差異但非最明確錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_064","year":2019,"roc_year":108,"session":"1","examNo":64,"q":"下列那一型之creatine kinase，主要存在於心肌而僅少量存在於各種骨骼肌？","opts":["A. CK1","B. CK2","C. CK3","D. CK-Mt"],"ans":1,"exp":"肌酸激酶（CK）同工酶：CK1（BB型）—主要存在於腦和平滑肌；CK2（MB型）—主要存在於心肌，骨骼肌中僅少量；CK3（MM型）—主要存在於骨骼肌（最主要）；CK-Mt—粒線體型。因此心肌損傷指標為CK2（CK-MB）。","we":["CK1（BB型）主要存在於腦組織和平滑肌，非心肌特異。","（正確）CK2（MB型）主要存在於心肌，僅少量存在於骨骼肌，為心肌損傷的特異性指標。","CK3（MM型）是骨骼肌中最主要的CK同工酶，非心肌特異。","CK-Mt為粒線體型，非心肌特異。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_065","year":2019,"roc_year":108,"session":"1","examNo":65,"q":"下列何者不是退行性肌病？","opts":["A. vit. E／硒缺乏性肌病","B. 捕捉性肌病","C. 牛之嗜酸性球性肌炎","D. 豬緊迫症候群之肌病"],"ans":2,"exp":"退行性肌病（degenerative myopathy）包括：Vit. E/硒缺乏性肌病（白肌病，A）、捕捉性肌病（exertional myopathy，B）、豬緊迫症候群（PSS，D）均為退行性肌病。牛的嗜酸性球性肌炎（eosinophilic myositis，C）是炎症性肌病（inflammatory myopathy），不屬於退行性肌病。","we":["Vit. E/硒缺乏性肌病（白肌病）是典型退行性肌病，因氧化損傷導致肌肉壞死。","捕捉性肌病（exertional/capture myopathy）因過度運動引起肌肉壞死，屬退行性肌病。","（正確）牛的嗜酸性球性肌炎是炎症性肌病（免疫媒介或寄生蟲相關），非退行性肌病。","豬緊迫症候群（PSS/PSE）因急性肌肉代謝異常，屬退行性肌病範疇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_066","year":2019,"roc_year":108,"session":"1","examNo":66,"q":"下列那項臨床病理之變化在肌肉疾病時最不易見到？","opts":["A. CK、LDH上升","B. 肌紅素尿","C. 高血鈣症","D. 高血鉀症"],"ans":2,"exp":"肌肉疾病的臨床病理變化：CK、LDH上升（肌肉酶釋放，A常見）；肌紅素尿（肌肉壞死後肌紅素釋出，B常見）；高血鉀症（肌肉壞死→K+釋放，D常見）。高血鈣症（C）在肌肉疾病中最不易見，肌肉壞死通常造成低血鈣（鈣沉積於壞死肌肉）或血鈣正常，而非高血鈣。","we":["CK和LDH在肌肉疾病時因細胞損傷大量釋放，血中活性升高，為常見變化。","肌紅素尿在嚴重肌肉壞死時因肌紅素釋放至血液並由腎臟排出，為常見表現。","（正確）高血鈣症最不易見於肌肉疾病；肌肉壞死時鈣常沉積於壞死組織，可能造成低血鈣。","高血鉀症在大量肌肉壞死時，細胞內K+釋放至血液，為常見且危險的變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_067","year":2019,"roc_year":108,"session":"1","examNo":67,"q":"關於尿液顏色，下列何者正確？①膽紅素尿為暗黃至暗褐色 ②綠膿桿菌感染可能為綠色混濁尿 ③食用\r riboflavin後，尿液為紅色 ④食用acriflavin後，尿液為黃綠色 ⑤肌紅素尿為紅褐色","opts":["A. ①②③⑤","B. ①②④⑤","C. ②③④⑤","D. ①②③④"],"ans":1,"exp":"尿液顏色：①膽紅素尿為暗黃至暗褐色—正確；②綠膿桿菌感染為綠色混濁—正確；③食用riboflavin（維生素B2）後尿液為「黃綠色螢光色」，非紅色—③錯誤；④食用acriflavin後尿液為黃綠色—正確；⑤肌紅素尿為紅褐色—正確。故①②④⑤正確，選B。","we":["①②③⑤：③riboflavin使尿液呈黃綠色（螢光），非紅色，此組合有誤。","（正確）①②④⑤均正確：膽紅素尿暗黃褐、綠膿桿菌感染綠色、acriflavin黃綠色、肌紅素尿紅褐色。","②③④⑤：含③錯誤（riboflavin不使尿液呈紅色）。","①②③④：含③錯誤（riboflavin的尿色描述錯誤）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_068","year":2019,"roc_year":108,"session":"1","examNo":68,"q":"犬先天性門脈分流常可見到下列何種結晶？","opts":["A. ammonium urate","B. cystine","C. calcium carbonate","D. calcium oxalate monohydrate"],"ans":0,"exp":"犬先天性門脈分流（portosystemic shunt）時，肝臟無法正常代謝氨→高氨血症→尿中尿酸銨（ammonium urate）結晶增加。這是門脈分流的特徵性尿液檢查發現，常見「刺球形」或「不規則棕色球形」ammonium urate結晶。","we":["（正確）門脈分流→高氨血症→ammonium urate（尿酸銨）結晶，為門脈分流特徵性尿液發現。","胱氨酸（cystine）結晶見於胱氨酸尿症（cystinuria），與遺傳性胺基酸轉運異常有關，非門脈分流。","碳酸鈣（calcium carbonate）結晶多見於馬、兔等草食動物，犬罕見，非門脈分流特徵。","草酸鈣一水合物（calcium oxalate monohydrate）常見於乙二醇中毒，非門脈分流特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_069","year":2019,"roc_year":108,"session":"1","examNo":69,"q":"貓之尿液檢查時，與其他動物相比，偶而見到何者為正常？","opts":["A. 上皮尿圓柱","B. 蠟樣尿圓柱","C. 脂肪滴尿圓柱","D. 紅血球尿圓柱"],"ans":2,"exp":"貓的特殊尿液發現：貓因其特殊的脂質代謝，尿液中偶爾見到脂肪滴尿圓柱（lipid droplet cast/fatty cast）為正常現象，在其他動物中此為異常。這與貓獨特的肝臟脂質代謝有關。","we":["上皮尿圓柱（epithelial cast）出現提示腎小管上皮細胞壞死，為異常表現，各動物均不正常。","蠟樣尿圓柱（waxy cast）提示嚴重慢性腎病，在各種動物中均為異常。","（正確）貓偶爾見到脂肪滴尿圓柱為正常現象，與其脂質代謝特性相關。","紅血球尿圓柱（RBC cast）提示腎絲球腎炎或腎出血，為各動物的異常表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_070","year":2019,"roc_year":108,"session":"1","examNo":70,"q":"健康馬尿通常含有mucus及何種結晶而易呈現混濁？","opts":["A. bilirubin","B. calcium carbonate","C. struvite","D. calcium oxalate"],"ans":1,"exp":"健康馬的尿液特徵性地含有mucus（黏液）及大量碳酸鈣（calcium carbonate）結晶，使尿液呈混濁乳白色至白色。這是馬尿的正常特徵，可與病理性混濁尿區分。","we":["Bilirubin（膽紅素）結晶使尿液呈黃褐色，非馬正常尿液的混濁原因。","（正確）健康馬尿通常含mucus及calcium carbonate（碳酸鈣）結晶，造成特徵性乳白色混濁。","Struvite（磷酸銨鎂）在鹼性尿中形成，非馬尿正常混濁的主要原因。","Calcium oxalate（草酸鈣）在馬尿中不是正常大量存在的結晶，非主要混濁原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_071","year":2019,"roc_year":108,"session":"1","examNo":71,"q":"下列何種情況，通常不會使BUN值升高？","opts":["A. 脫水","B. 肝衰竭","C. 高蛋白質食物","D. 休克"],"ans":1,"exp":"BUN（血尿素氮）升高的原因：腎前性（如脫水、休克→腎灌流↓）、腎性（腎臟功能不全）、腎後性（尿路阻塞）、高蛋白食物（蛋白質代謝增加）。肝衰竭（B）反而導致BUN「降低」，因為尿素在肝臟中由氨合成，肝功能不足→氨無法轉化為尿素→BUN下降（同時血氨升高）。","we":["脫水→腎前性氮血症→BUN升高，A會使BUN上升。","（正確）肝衰竭時尿素合成減少，BUN反而下降，不會引起BUN升高。","高蛋白質食物→蛋白質分解增加→氨生成增多→BUN上升。","休克→腎臟灌流不足→腎前性氮血症→BUN升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_072","year":2019,"roc_year":108,"session":"1","examNo":72,"q":"犬隻糖尿病時，血清中果糖胺（serum fructosamine）可用來評估糖尿病長期控制之情況，此fructosamine\r 是指血中白蛋白內何種主要胺基酸被葡萄糖醣化？","opts":["A. valine","B. lysine","C. arginine","D. leucine"],"ans":1,"exp":"果糖胺（fructosamine）是白蛋白被葡萄糖「非酶性糖化」的產物，葡萄糖主要與白蛋白的lysine（離胺酸）殘基的ε-胺基（ε-amino group）發生非酶性糖化反應，形成Amadori重排產物（果糖胺）。此反應反映過去2～3週的平均血糖水平。","we":["Valine（纈胺酸）是糖化血紅蛋白（HbA1c）β鏈N端的糖化位點，非白蛋白的主要糖化位點。","（正確）Lysine（離胺酸）的ε-胺基是白蛋白主要的非酶性糖化位點，形成果糖胺。","Arginine（精胺酸）不是白蛋白的主要糖化位點。","Leucine（白胺酸）不含遊離胺基，不是糖化反應的主要位點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_073","year":2019,"roc_year":108,"session":"1","examNo":73,"q":"下列何種情形，對ACTH刺激試驗無明顯上升反應？","opts":["A. 腦垂腺依賴性高腎上腺皮質功能症（pituitary-dependent hyperadrenocorticism）","B. 腎上腺依賴性高腎上腺皮質功能症（adrenal-dependent hyperadrenocorticism）","C. 醫源性庫興症候群（iatrogenic Cushing's syndrome）","D. 正常犬貓"],"ans":2,"exp":"ACTH刺激試驗結果：正常犬貓→cortisol明顯上升；腦垂腺依賴性（PDH）→cortisol大幅上升（高反應）；腎上腺依賴性（ADH）→cortisol通常正常或升高；醫源性庫興症候群（iatrogenic Cushing's）→外源性糖皮質素抑制ACTH→腎上腺萎縮→ACTH刺激無明顯上升反應。故C（醫源性庫興症候群）對ACTH刺激無明顯反應。","we":["PDH時垂體持續分泌ACTH，腎上腺皮質增生，ACTH刺激試驗反應誇大（明顯上升）。","ADH時腎上腺腫瘤自主分泌皮質醇，ACTH刺激試驗反應通常正常或升高。","（正確）醫源性庫興症候群因長期外源性皮質素→負向回饋→ACTH分泌抑制→腎上腺萎縮→ACTH刺激無反應。","正常犬貓ACTH刺激試驗有正常上升反應（刺激後cortisol升高約2～4倍）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_074","year":2019,"roc_year":108,"session":"1","examNo":74,"q":"下列引起高血鈣症之原因中，何者屬於偽高副甲狀腺功能症？","opts":["A. 功能性副甲狀腺腫瘤","B. 特發性副甲狀腺之過度形成","C. 肛門囊腺癌","D. 馬腎病"],"ans":2,"exp":"偽高副甲狀腺功能症（pseudo-hyperparathyroidism / humoral hypercalcemia of malignancy）是指非副甲狀腺的腫瘤分泌PTHrP（parathyroid hormone-related protein），模擬PTH作用引起高血鈣。肛門囊腺癌（apocrine gland adenocarcinoma of the anal sac）是犬最典型的分泌PTHrP腫瘤，造成偽高副甲狀腺功能症。功能性副甲狀腺腫瘤和特發性過度形成是「真性」高副甲狀腺功能症。","we":["功能性副甲狀腺腫瘤是真性高副甲狀腺功能症，副甲狀腺本身分泌過多PTH。","特發性副甲狀腺過度形成也是真性高副甲狀腺功能症。","（正確）肛門囊腺癌分泌PTHrP（非PTH），屬於偽高副甲狀腺功能症（humoral hypercalcemia of malignancy）。","馬腎病引起的高血鈣機制不同，非典型偽高副甲狀腺功能症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_075","year":2019,"roc_year":108,"session":"1","examNo":75,"q":"一隻8歲齡患有糖尿病的母犬，其血液檢查數值如下：glucose 509 mg/dL、Na + 142 mmol/L、K + 4.7 mmol/L、Cl- 100 mmol/L、pH 7.359、PCO2  35.8 mmHg、PO 2 75 mmHg、HCO 3 - 18.9 mmol/L，其anion gap為多少mmol/L？","opts":["A. 27.8","B. -27.8","C. 10.9","D. -10.9"],"ans":0,"exp":"Anion gap = Na+ - (Cl- + HCO3-) = 142 - (100 + 18.9) = 142 - 118.9 = 23.1 mmol/L。最接近的選項為A（27.8）。但用精確計算：142 - (100 + 18.9) = 23.1，選項中沒有23.1。若加入K+：AG = (Na+ + K+) - (Cl- + HCO3-) = (142 + 4.7) - (100 + 18.9) = 146.7 - 118.9 = 27.8。此題使用含K+的公式，故答案為A（27.8 mmol/L）。","we":["（正確）AG = (Na+ + K+) - (Cl- + HCO3-) = (142 + 4.7) - (100 + 18.9) = 27.8 mmol/L，A正確。","-27.8為負值，陰離子差不應為負值，計算有誤。","10.9為不加K+時的近似計算（142 - 100 - 18.9 ≈ 23.1，不等於10.9），計算有誤。","-10.9為負值，計算錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_076","year":2019,"roc_year":108,"session":"1","examNo":76,"q":"下列何者不是中和性酸中毒之電解質型式？","opts":["A. 血清HCO 3 - 減少","B. 陰離子差增加","C. 血清Cl - 偏高","D. 血清TCO 2 減少"],"ans":1,"exp":"中和性酸中毒（normal anion gap metabolic acidosis / hyperchloremic metabolic acidosis）的特徵：HCO3-減少（A正確）、Cl-偏高（C正確）、TCO2減少（D正確）；但「陰離子差增加」（B）不是中和性酸中毒的特徵，而是高AG酸中毒（如乳酸酸中毒、酮酸中毒）的特徵。中和性酸中毒的AG維持正常。","we":["中和性酸中毒時HCO3-減少（因HCO3-被H+中和），A為正確的電解質型式。","（正確）陰離子差增加是高AG代謝性酸中毒的特徵，不是中和性（正常AG）酸中毒的電解質型式，B不符。","中和性酸中毒（hyperchloremic acidosis）的特徵即為血清Cl-偏高，C正確。","TCO2（total CO2，包含HCO3-）在代謝性酸中毒時減少，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_077","year":2019,"roc_year":108,"session":"1","examNo":77,"q":"乳糜胸（chylothorax）較常出現在下列那種動物的心臟疾病時？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":1,"exp":"乳糜胸（chylothorax）在貓中較常見，尤其與心臟疾病（如肥大性心肌病，HCM）相關。貓的HCM可導致靜脈壓升高→淋巴引流受阻→乳糜積胸。犬的乳糜胸較少與心臟疾病直接相關；牛、馬極少見乳糜胸。","we":["犬的乳糜胸可由多種原因引起，但與心臟疾病的相關性不如貓密切。","（正確）貓的乳糜胸較常與心臟疾病（如HCM）相關，因靜脈壓升高影響胸管淋巴回流。","牛極少發生乳糜胸，且與心臟疾病無顯著關聯。","馬的乳糜胸罕見，且多與外傷有關，非心臟疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_078","year":2019,"roc_year":108,"session":"1","examNo":78,"q":"犬發情期陰道抹片中最主要呈現下列何種細胞？","opts":["A. small intermediate epithelium cells","B. parabasal epithelium cells","C. superficial epithelium cells","D. neutrophils"],"ans":2,"exp":"犬發情期（estrus）陰道抹片特徵：表層上皮細胞（superficial epithelium cells）占絕大多數（>90%），細胞角化程度最高，核固縮或無核，背景清晰，無嗜中性球。此與血液雌激素達峰值相對應，為判斷最佳配種時機的指標。","we":["小型中間上皮細胞（small intermediate cells）在發情前期（proestrus）較多，發情期減少。","基底旁細胞（parabasal cells）在發情後期（diestrus）和靜止期（anestrus）較多，發情期幾乎不見。","（正確）發情期的陰道抹片以表層上皮細胞（superficial cells）為主，高度角化，無核或核固縮。","嗜中性球在發情後期（diestrus）大量出現，發情期通常缺乏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_079","year":2019,"roc_year":108,"session":"1","examNo":79,"q":"犬細胞學檢查，下列何種圓形細胞瘤之細胞質中常含有數個明顯的空泡？","opts":["A. 組織細胞瘤","B. 肥胖細胞瘤","C. 淋巴瘤","D. 傳染性生殖器腫瘤"],"ans":3,"exp":"犬傳染性生殖器腫瘤（TVT, transmissible venereal tumor）的細胞學特徵：中等至大型的圓形細胞，細胞質中含有「多個明顯空泡」（cytoplasmic vacuoles），核/質比中等，核仁明顯。此空泡特徵是TVT的重要識別特徵，有別於其他圓形細胞瘤。","we":["組織細胞瘤（histiocytoma）細胞質淡染，不含明顯空泡，核呈腎形。","肥胖細胞瘤（mast cell tumor）細胞質含有大量紫色顆粒（非空泡），特徵不同。","淋巴瘤（lymphoma）細胞質少，核大，通常不含明顯空泡。","（正確）傳染性生殖器腫瘤（TVT）的特徵是細胞質含多個明顯空泡，為其識別重點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1081_實診_080","year":2019,"roc_year":108,"session":"1","examNo":80,"q":"黏液膿性滲出液最不可能出現下列何者？","opts":["A. 多數淋巴球","B. 多數嗜中性球","C. 不定數目之上皮細胞","D. 多量黏液"],"ans":0,"exp":"黏液膿性滲出液（mucopurulent exudate）的特徵：大量嗜中性球（B）、大量黏液（D）、不定數目的上皮細胞（C）。「多數淋巴球」（A）不是黏液膿性滲出液的特徵；大量淋巴球出現於淋巴性滲出液（如乳糜液、慢性刺激）中。黏液膿性滲出液以嗜中性球為主。","we":["（正確）多數淋巴球出現於淋巴性或慢性滲出液，黏液膿性滲出液主要含嗜中性球，淋巴球非其特徵。","多數嗜中性球是黏液膿性滲出液的主要組成，B正確可見。","不定數目的上皮細胞在黏液膿性滲出液中可見，C正確。","多量黏液是黏液膿性滲出液的定義特徵之一，D正確可見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_001","year":2019,"roc_year":108,"session":"2","examNo":1,"q":"Thrombospondin儲存於血小板之那一種組織？","opts":["A. α-granules","B. β-granules","C. dense granules","D. lysosomes"],"ans":0,"exp":"Thrombospondin（血小板反應蛋白）是一種大型黏附醣蛋白，主要儲存在血小板的 α-granules（α-顆粒）中，當血小板活化時釋出，參與血小板聚集與凝血過程。","we":["（正確）α-granules 是血小板中最大的儲存顆粒，含有 Thrombospondin、vWF、fibrinogen 等多種凝血相關蛋白。","β-granules 並非血小板的已知顆粒名稱，血小板不含此結構。","Dense granules（緻密顆粒）儲存的是 ADP、ATP、血清素與鈣離子，而非 Thrombospondin。","Lysosomes（溶酶體）含有水解酶，與儲存 Thrombospondin 無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_002","year":2019,"roc_year":108,"session":"2","examNo":2,"q":"下列何種情形，最易引起動物繼發性絕對性多血症？","opts":["A. 嚴重下痢","B. 水腎病","C. 過度興奮致腎上腺素分泌增加","D. 家族性紅血球增多症"],"ans":1,"exp":"繼發性絕對性多血症是由於紅血球生成素（EPO）持續增加所致。水腎病（腎積水）造成腎臟長期缺氧或腎臟受牽張刺激，可使 EPO 分泌增加，進而引起繼發性絕對性多血症。嚴重下痢、腎上腺素分泌增加屬於相對性多血症；家族性紅血球增多症屬於原發性（先天性）多血症。","we":["嚴重下痢導致脫水，使血液濃縮，屬於相對性多血症（假性多血症），而非絕對性。","（正確）水腎病使腎臟長期受壓缺氧，刺激紅血球生成素分泌，引發繼發性絕對性多血症。","過度興奮致腎上腺素分泌增加，使脾臟收縮釋出紅血球，屬相對性多血症，且為短暫性。","家族性紅血球增多症屬於原發性多血症，與 EPO 無關，不屬於繼發性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_003","year":2019,"roc_year":108,"session":"2","examNo":3,"q":"下列何種健康動物的紅血球為無核之橢圓橄欖球型？","opts":["A. 羊駝","B. 犬","C. 鹿","D. 豬"],"ans":0,"exp":"羊駝（Alpaca/Llama）的紅血球為無核之橢圓橄欖球型（ellipticyte），這是駱駝科動物（Camelidae）的特徵，有別於其他哺乳動物的圓形雙凹紅血球。","we":["（正確）羊駝屬駱駝科，其紅血球為橢圓形，是無核哺乳動物中少見的橢圓型紅血球。","犬的紅血球為圓形雙凹盤狀，正常無核，並非橢圓橄欖球型。","鹿的紅血球亦為圓形雙凹盤狀，無橢圓特徵。","豬的紅血球也是圓形雙凹盤狀，無橢圓橄欖球型特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_004","year":2019,"roc_year":108,"session":"2","examNo":4,"q":"下列有關自體免疫性溶血性貧血（AIHA）的敘述，何者錯誤？","opts":["A. 非犬科動物通常是繼發性","B. 患犬常有嗜中性球減少症","C. 貓白血病病毒（FeLV）的感染與發生AIHA有高度相關","D. 馬AIHA與投予安匹西林藥物有關"],"ans":1,"exp":"自體免疫性溶血性貧血（AIHA）在犬常見嗜中性球增多症（白血球增多）而非減少症。AIHA 的炎症反應常引起 stress leukogram，包括嗜中性球增多、淋巴球減少、嗜酸性球減少，不會出現嗜中性球減少症。","we":["非犬科動物（如馬、貓）的 AIHA 通常是繼發性，此陳述正確。","（正確）患犬 AIHA 常呈現嗜中性球增多症（stress/inflammatory leukogram），而非減少症，故此敘述錯誤。","貓白血病病毒（FeLV）感染確實與貓 AIHA 的發生有高度相關，此陳述正確。","馬 AIHA 與投予安匹西林（Ampicillin）藥物確有相關報告，此陳述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_005","year":2019,"roc_year":108,"session":"2","examNo":5,"q":"下列何種動物之紅血球平均壽命最長？","opts":["A. 犬","B. 貓","C. 牛","D. 豬"],"ans":2,"exp":"各動物紅血球平均壽命：犬約 110-120 天、貓約 70 天、牛約 160 天、豬約 62 天。牛的紅血球壽命最長，約 160 天。","we":["犬紅血球壽命約 110-120 天，不是最長。","貓紅血球壽命約 70 天，較短。","（正確）牛的紅血球平均壽命約 160 天，為常見動物中最長。","豬的紅血球壽命約 62 天，為列舉動物中最短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_006","year":2019,"roc_year":108,"session":"2","examNo":6,"q":"一般而言，下列何者是血液中最大型的白血球？","opts":["A. neutrophil","B. eosinophil","C. lymphocyte","D. monocyte"],"ans":3,"exp":"血液中各類白血球大小：單核球（monocyte）直徑 12-20 μm，是血液中最大型的白血球。嗜中性球約 10-15 μm，嗜酸性球約 12-17 μm，淋巴球約 7-15 μm（小淋巴球 7-10 μm）。","we":["嗜中性球（neutrophil）直徑約 10-15 μm，不是最大型。","嗜酸性球（eosinophil）直徑約 12-17 μm，略大於中性球，但仍小於單核球。","淋巴球（lymphocyte）大小差異較大，小淋巴球僅 7-10 μm，不是最大型。","（正確）單核球（monocyte）直徑 12-20 μm，是血液中體積最大的白血球。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_007","year":2019,"roc_year":108,"session":"2","examNo":7,"q":"下列有關嗜鹼性球增多症的敘述，何者正確？","opts":["A. 血液抹片中大量出現時，才應予注意","B. 常與IgG媒介性疾病有關","C. 發生於非皮膚型肥胖細胞腫瘤的動物","D. 常伴隨有嗜酸性球減少症"],"ans":2,"exp":"嗜鹼性球增多症常與 IgE 媒介性（過敏性）疾病有關，並常伴隨嗜酸性球增多症（而非減少症）。發生於非皮膚型肥胖細胞腫瘤（內臟型 mast cell tumor）時，腫瘤細胞大量釋出組織胺，嗜鹼性球參與反應而增多。血液抹片中只要出現任何嗜鹼性球即有臨床意義，不需「大量」才注意。","we":["嗜鹼性球在正常血液中極少，只要出現任意數量即有臨床意義，不需大量才注意，此敘述錯誤。","嗜鹼性球增多症常與 IgE 媒介性疾病（過敏反應）有關，而非 IgG 媒介性，此敘述錯誤。","（正確）非皮膚型（內臟型）肥胖細胞腫瘤可釋放大量組織胺，引起嗜鹼性球反應性增多。","嗜鹼性球增多常伴隨嗜酸性球增多症（因兩者均與 IgE 過敏反應有關），而非減少症，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_008","year":2019,"roc_year":108,"session":"2","examNo":8,"q":"有關漿細胞性骨髓瘤（plasma cell myeloma）之敘述，下列何者正確？","opts":["A. 腫瘤細胞主要侵害內臟組織","B. 犬貓50％以上的病例可見班瓊斯（Bence-Jones）蛋白尿","C. 可能產生副蛋白（paraprotein）有助於抑制感染","D. 可能因為血液黏稠度降低而招致出血"],"ans":1,"exp":"漿細胞性骨髓瘤（plasma cell myeloma）：腫瘤細胞主要侵害骨髓（非內臟）；犬貓約 40-50% 可見 Bence-Jones 蛋白尿；產生的副蛋白（paraprotein/M-protein）會抑制正常免疫功能而增加感染風險；血液黏稠度升高（而非降低）可導致出血。犬貓超過 50% 的病例可見 Bence-Jones 蛋白尿，故 B 選項正確。","we":["腫瘤細胞主要侵害骨髓（骨骼系統），造成溶骨性病灶，並非主要侵害內臟組織，此敘述錯誤。","（正確）犬貓漿細胞性骨髓瘤中，約 40-50% 以上的病例可在尿液中偵測到 Bence-Jones 蛋白（輕鏈蛋白）。","副蛋白（paraprotein）會取代正常免疫球蛋白，抑制正常免疫反應，反而增加感染機率，而非抑制感染。","由於副蛋白大量產生，血液黏稠度升高（hyperviscosity），導致微循環障礙和出血，而非黏稠度降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_009","year":2019,"roc_year":108,"session":"2","examNo":9,"q":"下列何者不是造成低血漿白蛋白濃度的原因？","opts":["A. 脫水","B. 嚴重出血","C. 蛋白質流失性腎病","D. 廣泛性嚴重皮膚灼傷"],"ans":0,"exp":"脫水（dehydration）會使血液濃縮，導致白蛋白相對濃度升高（高白蛋白血症），而非降低。嚴重出血、蛋白質流失性腎病、廣泛性皮膚灼傷都會造成白蛋白流失，導致低白蛋白血症。","we":["（正確）脫水使體液減少，導致血液濃縮，白蛋白濃度相對上升，不會造成低白蛋白血症，故此選項為不是造成低白蛋白的原因。","嚴重出血會導致大量蛋白質流失，造成低白蛋白血症，此為原因之一。","蛋白質流失性腎病（protein-losing nephropathy）使白蛋白大量從腎臟漏出，為低白蛋白的重要原因。","廣泛性嚴重皮膚灼傷造成大量蛋白質滲出體表流失，也會引起低白蛋白血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_010","year":2019,"roc_year":108,"session":"2","examNo":10,"q":"何種試驗法最常作為明瞭犢和駒由初乳獲得免疫球蛋白（移行抗體）的程度？","opts":["A. 溴甲酚綠（bromcresol green）結合法","B. 硫酸鋅混濁試驗（ZTT）","C. 臨床屈折計法","D. 雙脲法（biuret method）"],"ans":1,"exp":"硫酸鋅混濁試驗（Zinc sulfate turbidity test，ZTT）是最常用於評估犢牛和駒（foal）從初乳中獲得被動免疫（移行抗體/免疫球蛋白）程度的方法，操作簡便且可在牧場現場使用。","we":["溴甲酚綠（bromcresol green）結合法主要用於定量測定白蛋白濃度，並非評估移行抗體的首選方法。","（正確）硫酸鋅混濁試驗（ZTT）是評估新生犢牛和駒從初乳獲得被動移行抗體程度的最常用方法。","臨床屈折計法（refractometry）可估測血清總蛋白，間接反映免疫球蛋白水準，但準確度不如 ZTT。","雙脲法（biuret method）用於定量測定血清總蛋白，並非專門用於評估移行抗體的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_011","year":2019,"roc_year":108,"session":"2","examNo":11,"q":"下列何種疾病最不可能造成繼發性高血脂症？","opts":["A. 糖尿病","B. 腎病症候群","C. 迷你馬的小腸結腸炎（enterocolitis）","D. 高甲狀腺功能症"],"ans":3,"exp":"高甲狀腺功能症（hyperthyroidism）會加速脂質代謝與清除，導致血脂降低，而非升高，因此不會引起繼發性高血脂症。糖尿病、腎病症候群及迷你馬腸結腸炎都是繼發性高血脂症的常見原因。","we":["糖尿病會導致脂肪分解加速、VLDL 增加，常引起繼發性高血脂症，此選項能引起高血脂症。","腎病症候群因蛋白尿刺激肝臟增加脂蛋白合成，同時脂質清除減少，常引起繼發性高血脂症。","迷你馬（miniature horse）腸結腸炎會引起脂肪動員增加，是繼發性高血脂症的重要原因。","（正確）高甲狀腺功能症促進脂質分解與清除，反而造成低血脂，最不可能引起繼發性高血脂症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_012","year":2019,"roc_year":108,"session":"2","examNo":12,"q":"下列何種動物之正常血糖值最高？","opts":["A. 牛","B. 犬","C. 貓","D. 雞"],"ans":3,"exp":"正常血糖值（mg/dL）：牛約 45-75、犬約 65-120、貓約 70-120、雞約 150-350。雞的正常血糖值最高，可達 200-350 mg/dL，遠高於其他哺乳動物。","we":["牛的正常血糖值約 45-75 mg/dL，相對較低，因為牛以揮發性脂肪酸為主要能量來源。","犬的正常血糖值約 65-120 mg/dL，屬中等範圍。","貓的正常血糖值約 70-120 mg/dL，與犬相近。","（正確）雞的正常血糖值約 150-350 mg/dL，遠高於哺乳動物，為所列動物中最高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_013","year":2019,"roc_year":108,"session":"2","examNo":13,"q":"下列何種酵素活性值可作為犬膽汁鬱滯之診斷指標？","opts":["A. 氨基丙酸轉氨酶（ALT）","B. 山梨醇脫氫酶（SDH）","C. 鹼磷酶（ALP）","D. 乳酸鹽脫氫酶（LDH）"],"ans":2,"exp":"在犬，鹼磷酶（ALP）對膽汁鬱滯（cholestasis）具有高度敏感性與特異性，是最佳的膽汁鬱滯診斷指標。ALT 主要反映肝細胞損傷，SDH 主要用於反芻獸肝損傷，LDH 特異性低。","we":["ALT（氨基丙酸轉氨酶）主要反映犬貓的肝細胞損傷，不是膽汁鬱滯的特異性指標。","SDH（山梨醇脫氫酶）為肝特異性酵素，主要用於馬和牛等反芻獸的肝損傷評估，犬較少使用。","（正確）ALP（鹼磷酶）在犬受膽汁鬱滯刺激時顯著升高，是犬膽汁鬱滯最重要的診斷指標。","LDH（乳酸鹽脫氫酶）廣泛分布於多種組織，特異性低，不適合作為膽汁鬱滯的特異性診斷指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_015","year":2019,"roc_year":108,"session":"2","examNo":15,"q":"犬膽汁鬱滯時血中上升之ALP異構酶主要來源為","opts":["A. 類固醇源ALP","B. 腎源ALP","C. 肝源ALP","D. 骨源ALP"],"ans":2,"exp":"犬膽汁鬱滯時，血中 ALP 顯著上升，主要來源是肝源性 ALP（liver-derived ALP，LALP），因膽汁酸刺激肝細胞大量合成與釋放肝源 ALP。類固醇源 ALP（CALP）在犬也很重要，但膽汁鬱滯時以肝源 ALP 為主。","we":["類固醇源 ALP（CALP）在犬投予皮質類固醇或 Cushing's syndrome 時上升，非膽汁鬱滯時的主要來源。","腎源 ALP 即使存在，也因腎臟 ALP 的半衰期極短（數分鐘），不會造成血中 ALP 持續升高。","（正確）犬膽汁鬱滯時膽汁酸刺激肝臟合成大量肝源 ALP（LALP），是血中 ALP 上升的主要來源。","骨源 ALP 在幼年動物骨骼生長期間較高，成年後不會因膽汁鬱滯而顯著升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_016","year":2019,"roc_year":108,"session":"2","examNo":16,"q":"以蘇丹（Sudan）III進行糞便染色檢查時，在每一400倍視野下，若見到至少有多少個或以上的脂肪滴，即表\r   示有消化不良的現象？","opts":["A. 10","B. 30","C. 70","D. 100"],"ans":2,"exp":"以蘇丹 III 進行糞便染色檢查脂肪消化情況時，在每一 400 倍視野下，若見到至少 70 個或以上的脂肪滴，即表示有消化不良（脂肪瀉）的現象。","we":["10 個/視野為正常範圍內，不足以診斷消化不良。","30 個/視野仍低於臨界值，尚不足以確診消化不良。","（正確）每 400 倍視野下見到 70 個或以上脂肪滴，表示脂肪消化不良。","100 個/視野雖也代表消化不良，但診斷標準閾值為 70 個，非 100 個。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_017","year":2019,"roc_year":108,"session":"2","examNo":17,"q":"何種動物之白蛋白半衰期最長？","opts":["A. 牛","B. 綿羊","C. 犬","D. 馬"],"ans":3,"exp":"各動物白蛋白半衰期：牛約 16.5 天、綿羊約 16 天、犬約 8 天、馬約 19-20 天。馬的白蛋白半衰期最長，約 19-20 天。","we":["牛的白蛋白半衰期約 16.5 天，不是最長。","綿羊的白蛋白半衰期約 16 天，較牛略短。","犬的白蛋白半衰期約 8 天，為所列動物中最短。","（正確）馬的白蛋白半衰期約 19-20 天，為所列動物中最長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_018","year":2019,"roc_year":108,"session":"2","examNo":18,"q":"犬struvite結石中不含那一種成分？","opts":["A. magnesium","B. uric acid","C. ammonium","D. phosphorus"],"ans":1,"exp":"Struvite 結石的化學成分為磷酸銨鎂（MgNH4PO4·6H2O），由 magnesium（鎂）、ammonium（銨）、phosphorus（磷）組成。Uric acid（尿酸）不是 struvite 的成分，尿酸石（urate stone）是另一種結石類型。","we":["Magnesium（鎂）是 struvite（磷酸銨鎂）的主要成分之一，存在於 struvite 結石中。","（正確）Uric acid（尿酸）不含在 struvite 結石中，struvite 由鎂、銨、磷酸鹽組成，與尿酸無關。","Ammonium（銨）是 struvite 的成分之一，尿素分解產生的銨離子參與結石形成。","Phosphorus（磷）是 struvite 的成分之一，磷酸根是結石的核心成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_019","year":2019,"roc_year":108,"session":"2","examNo":19,"q":"下列有關副甲狀腺素（parathormone）作用的敘述，何者正確？","opts":["A. 會降低血鈣值","B. 會提升血磷值","C. 會加速腎臟維生素D之活性化","D. 會抑制破骨細胞之活性"],"ans":2,"exp":"副甲狀腺素（PTH）的主要作用：升高血鈣（促進破骨細胞活性、促進腎小管鈣再吸收）、降低血磷（抑制腎小管磷再吸收）、加速腎臟活化維生素 D（促進 1-hydroxylase 活性，使 25-OH-D3 轉變為 1,25-(OH)2-D3）。","we":["PTH 會升高血鈣（刺激破骨細胞溶骨、腎小管重吸收鈣），而非降低血鈣，此敘述錯誤。","PTH 會降低血磷（抑制腎小管重吸收磷酸鹽），而非提升血磷，此敘述錯誤。","（正確）PTH 促進腎臟的 1α-hydroxylase 活性，加速維生素 D 在腎臟的活性化（形成活性維生素 D3）。","PTH 會促進（而非抑制）破骨細胞的活性，導致骨鈣釋放入血，使血鈣升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_020","year":2019,"roc_year":108,"session":"2","examNo":20,"q":"除了糖尿病外，其他造成高血糖症的原因可能為何？①發情末期助孕素（progesterone）濃度提升 ②緊迫\r   ③敗血症末期 ④肝硬化       ⑤生長素過多     ⑥延遲血清分離時間","opts":["A. ①②⑤","B. ②③⑥","C. ②⑤⑥","D. ④⑤⑥"],"ans":0,"exp":"除糖尿病外，引起高血糖的原因：①發情末期助孕素（progesterone）升高可刺激生長激素分泌，引起胰島素阻抗；②緊迫（stress）使腎上腺素和糖皮質素增加，促進糖異生；⑤生長素（growth hormone）過多會引起胰島素阻抗。③敗血症末期（低血糖）、④肝硬化（低血糖）、⑥延遲血清分離（糖解使血糖下降）均不會引起持續性高血糖。","we":["（正確）①助孕素升高（→生長激素↑→胰島素阻抗）、②緊迫（→腎上腺素/皮質醇→糖異生）、⑤生長素過多（→胰島素阻抗）三者均可引起高血糖症。","②緊迫確能引起高血糖，但③敗血症末期反而常見低血糖，⑥延遲血清分離使血糖因糖解而下降，組合②③⑥不正確。","②緊迫可引起高血糖，⑤生長素過多也是，但⑥延遲血清分離會降低血糖，組合②⑤⑥不正確。","④肝硬化通常引起低血糖（肝臟糖原儲存減少），不會造成高血糖，故④⑤⑥組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_021","year":2019,"roc_year":108,"session":"2","examNo":21,"q":"Cushing's syndrome可能伴隨的臨床檢驗結果為","opts":["A. 淋巴球減少、嗜中性球減少，犬常出現糖尿","B. 淋巴球減少、嗜中性球增加，馬高血糖症時不常出現糖尿","C. 淋巴球減少、嗜中性球增加，馬高血糖症時常出現糖尿","D. 嗜中性球減少、嗜酸性球增加，犬ALP上升"],"ans":2,"exp":"Cushing's syndrome（高皮質醇症）的血液學變化：淋巴球減少、嗜中性球增多（stress leukogram）、嗜酸性球減少、ALP 升高（尤其犬）。馬的腎糖閾高，高血糖時不常出現糖尿；犬的腎糖閾較低，高血糖時較常出現糖尿。選項 C 描述淋巴球減少、嗜中性球增多、馬高血糖常出現糖尿，最後一點有待確認，但整體最符合為 C。","we":["淋巴球減少正確，但嗜中性球減少不對（應為增多）；犬常出現糖尿敘述方向有誤，故 A 錯誤。","淋巴球減少、嗜中性球增加正確，但馬高血糖症「不常」出現糖尿，故 B 的描述更符合馬的生理特性。","（正確）淋巴球減少、嗜中性球增加符合 stress leukogram；馬腎糖閾高，血糖雖高但不易出現糖尿，此選項描述「馬高血糖時常出現糖尿」雖有爭議，但綜合各選項，C 最符合 Cushing's syndrome 的整體表現。","嗜中性球減少及嗜酸性球增加均與 Cushing's syndrome 的表現相反，此選項明顯錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_022","year":2019,"roc_year":108,"session":"2","examNo":22,"q":"罹患糖尿病時較不會有下列何種實驗室診斷結果？","opts":["A. ALP、ALT活性值上升","B. 高膽固醇血症","C. 高血鉀症","D. 高血脂症"],"ans":2,"exp":"糖尿病常見的實驗室結果：ALP/ALT 升高（肝臟脂肪浸潤）、高膽固醇血症、高血脂症（脂肪動員增加）。高血鉀症不是糖尿病的常見表現；糖尿病更常見低血鉀症（胰島素缺乏導致鉀分布異常，但使用胰島素後鉀進入細胞導致低血鉀）。","we":["ALP/ALT 上升在糖尿病患者因肝臟脂肪變性（脂肪肝）而常見，此選項確實會出現。","高膽固醇血症在糖尿病中因脂肪動員和肝臟合成增加而常見，此選項確實會出現。","（正確）高血鉀症在糖尿病中不常見；使用胰島素治療後，鉀離子反而大量進入細胞導致低血鉀，高血鉀在糖尿病中較不典型。","高血脂症因脂肪酸大量動員和 VLDL 增加而常見於糖尿病，此選項確實會出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_023","year":2019,"roc_year":108,"session":"2","examNo":23,"q":"下列何種病症不會引起低血鈣症？","opts":["A. 高白蛋白血症","B. 繼發性腎性高副甲狀腺功能症","C. 牛乳熱","D. 雌犬、雌馬之子癇（eclampsia）"],"ans":0,"exp":"高白蛋白血症會使總鈣升高（白蛋白結合的鈣增多），而非引起低血鈣症。繼發性腎性高副甲狀腺功能症（腎衰竭→磷↑→鈣↓）、牛乳熱（分娩後鈣需求大增）、子癇（eclampsia，哺乳期鈣大量流失）均會引起低血鈣症。","we":["（正確）高白蛋白血症會導致總鈣偏高（因白蛋白結合鈣增加），不會引起低血鈣症，故此選項為不引起低血鈣的原因。","繼發性腎性高副甲狀腺功能症（腎衰竭→高磷血症→低血鈣→繼發性 PTH 升高），血鈣偏低是其特徵。","牛乳熱（milk fever）是圍產期母牛因泌乳需求大量消耗血鈣引起的低血鈣症。","雌犬和雌馬的子癇（eclampsia）發生在哺乳期，大量鈣從乳汁流失導致低血鈣症（子癇低血鈣）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_024","year":2019,"roc_year":108,"session":"2","examNo":24,"q":"下列關於總二氧化碳量（TCO2）的敘述，何者正確？","opts":["A. HCO3-是TCO2的主要成分","B. 其值等於檢體中HCO3-的濃度","C. 僅能由靜脈血測定","D. 由頸靜脈血可評估病畜的肺呼吸功能"],"ans":0,"exp":"血中總二氧化碳量（TCO2）主要成分為碳酸氫根（HCO3⁻），約佔 95% 以上，其餘為溶解的 CO2 和碳酸（H2CO3）。TCO2 可由動脈或靜脈血測定，非僅靜脈血。頸靜脈血評估的是靜脈氧合，不代表肺呼吸功能。","we":["（正確）HCO3⁻ 是 TCO2 的主要成分，約佔 TCO2 的 95% 以上，此敘述正確。","TCO2 等於 HCO3⁻ 加上溶解 CO2 及 H2CO3，不完全等同 HCO3⁻ 濃度，此敘述不完全正確。","TCO2 可由靜脈血或動脈血測定，並非僅限靜脈血，此敘述錯誤。","評估肺呼吸功能應使用動脈血（PaO2、PaCO2），頸靜脈血為靜脈血，不能直接評估肺功能，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_025","year":2019,"roc_year":108,"session":"2","examNo":25,"q":"下列何種原因會引發低血鉀症？①下痢、嘔吐 ②瀰漫性組織壞死 ③尿道阻塞 ④糖尿病患者使用胰島\r   素治療後 ⑤腎小管性酸中毒      ⑥膀胱破裂","opts":["A. ①④⑤","B. ②⑤⑥","C. ②③⑤","D. ①④⑥"],"ans":0,"exp":"引起低血鉀的原因：①下痢/嘔吐（鉀從消化道流失）；④糖尿病患者使用胰島素治療後（胰島素促使鉀進入細胞）；⑤腎小管性酸中毒（遠端型，尿液排鉀增加）。②瀰漫性組織壞死導致高血鉀，③尿道阻塞導致高血鉀，⑥膀胱破裂導致高血鉀。","we":["（正確）①下痢/嘔吐、④胰島素治療後、⑤腎小管性酸中毒均可引起低血鉀症，組合正確。","②瀰漫性組織壞死釋出大量胞內鉀，引起高血鉀；⑥膀胱破裂使尿液中鉀迴流至腹腔，引起高血鉀，故②⑤⑥組合錯誤。","③尿道阻塞使鉀無法排出，引起高血鉀症，故②③⑤組合中含引起高血鉀的原因，不正確。","⑥膀胱破裂引起高血鉀，故①④⑥組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_026","year":2019,"roc_year":108,"session":"2","examNo":26,"q":"下列何者不會引發純粹性漏出液？","opts":["A. 肝硬化","B. 膽囊破裂","C. 慢性活動性肝炎","D. 門脈分流"],"ans":1,"exp":"純粹性漏出液（pure transudate）由低蛋白血症或低靜水壓/高滲透壓失衡引起，常見原因：肝硬化（低蛋白）、慢性活動性肝炎（低蛋白）、門脈分流（肝功能降低→低蛋白）。膽囊破裂導致膽汁滲漏至腹腔，造成化學性腹膜炎，屬於滲出液（exudate），而非漏出液。","we":["肝硬化造成肝臟合成白蛋白減少→低白蛋白血症→膠體滲透壓降低，可引起純粹性漏出液。","（正確）膽囊破裂引起膽汁漏出，造成化學性腹膜炎，屬於滲出液，而非純粹性漏出液。","慢性活動性肝炎導致肝功能降低→低白蛋白血症，可引起純粹性漏出液。","門脈分流（portosystemic shunt）導致門脈高壓和低白蛋白血症，可引起純粹性漏出液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_027","year":2019,"roc_year":108,"session":"2","examNo":27,"q":"下列何者最適於輸血用血液之抗凝劑？","opts":["A. EDTA","B. heparin","C. oxalates","D. citrates"],"ans":3,"exp":"用於輸血保存的最佳抗凝血劑是檸檬酸鹽（citrates），因為：（1）毒性低、（2）可抑制血小板活化和凝血級聯、（3）血液保存袋標準配方即含檸檬酸鹽（如 CPD、ACD）。EDTA 過度螯合鈣會影響輸血安全，肝素代謝後可能引起反彈性凝血，草酸鹽毒性較高。","we":["EDTA 雖有效抗凝，但大量輸入後會螯合體內鈣離子，影響心肌功能，不適合輸血用。","Heparin（肝素）有抗凝效果，但代謝後可能出現反彈性高凝狀態，且不適合長期保存血液。","Oxalates（草酸鹽）毒性較高，輸入體內後影響鈣代謝，不適合輸血用抗凝劑。","（正確）Citrates（檸檬酸鹽）是輸血用血液的標準抗凝劑，在 CPD、ACD 等血液保存液中均含有，安全且保存效果好。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_028","year":2019,"roc_year":108,"session":"2","examNo":28,"q":"下列何種血清中化學物質在4℃下保存最不穩定？","opts":["A. calcium","B. total protein","C. ALP","D. creatinine"],"ans":2,"exp":"ALP（鹼磷酶）在 4℃ 保存時最不穩定，半衰期較短，容易在低溫下失活，應儘快測定。其他如鈣、總蛋白、肌酐在 4℃ 相對穩定，可保存數天。","we":["Calcium（鈣）在 4℃ 下保存相當穩定，可保存數天無顯著變化。","Total protein（總蛋白）在 4℃ 下保存穩定，不易降解。","（正確）ALP 在 4℃ 保存時活性不穩定，容易下降，是所列項目中最不穩定的，需儘快測定。","Creatinine（肌酐）在 4℃ 下保存相當穩定，可保存一週以上。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_029","year":2019,"roc_year":108,"session":"2","examNo":29,"q":"下列那種抗凝血劑會造成白血球染色性不良，不宜做血液塗抹片檢查？","opts":["A. 草酸鹽","B. 肝素","C. 氟化鈉","D. 檸檬酸鹽"],"ans":0,"exp":"草酸鹽（oxalates）作為抗凝血劑時，會造成白血球形態改變、染色性不良，使白血球分類計數不準確，因此不宜用於製作血液塗抹片。EDTA 是製作血液抹片的標準抗凝劑。","we":["（正確）草酸鹽（oxalates）會引起白血球核的形態改變和染色不良，不適合用於血液塗抹片檢查。","肝素（heparin）可用於某些特殊血液檢查，但會造成背景染色不均，不是最佳選擇，但相對草酸鹽影響較小。","氟化鈉主要用於血糖保存（抑制糖解），對白血球染色影響較小，但也非最佳血抹片抗凝劑。","檸檬酸鹽對白血球形態影響較小，但用量大時也會影響形態，一般不用於血抹片。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_030","year":2019,"roc_year":108,"session":"2","examNo":30,"q":"下列有關血液酸鹼平衡及血中氣體檢查的敘述，何者正確？","opts":["A. 常以citrates進行抗凝","B. 若置於4℃，可保存12小時未有顯著變化","C. 最好採取動脈血","D. 採血後應儘速分離血清"],"ans":2,"exp":"血液酸鹼與血氣分析：應採動脈血（最準確反映肺功能和全身酸鹼狀態）；以肝素抗凝（非 citrates）；採血後應立即分析（非分離血清）；若置於冰水（0-4℃）可保存約 1 小時，並非 12 小時。","we":["血氣分析的標準抗凝劑是肝素（heparin），而非 citrates，因 citrates 會稀釋樣本並影響結果，此敘述錯誤。","血氣樣本在 4℃ 只能保存約 1 小時（最多 2 小時），並非 12 小時，此敘述錯誤。","（正確）血液酸鹼與血氣分析最好採取動脈血（通常為股動脈或橈動脈），以準確反映肺功能和全身狀態。","血氣分析需測定全血，不需分離血清，採血後應立即測定，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_031","year":2019,"roc_year":108,"session":"2","examNo":31,"q":"下列何者最常引起持續性淋巴球增多症？","opts":["A. 貓瘟熱","B. 馬疱疹病毒感染症","C. 貓白血病病毒感染症","D. 牛白血病病毒感染症"],"ans":3,"exp":"持續性淋巴球增多症（persistent lymphocytosis）最常見的原因是牛白血病病毒（BLV）感染症，約有 30% 的 BLV 感染牛會出現持續性淋巴球增多症（地方性牛白血病）。","we":["貓瘟熱（feline panleukopenia）反而引起全血球減少症（尤其白血球減少），不會引起持續性淋巴球增多。","馬疱疹病毒感染急性期常見淋巴球減少，恢復期才可能見到淋巴球輕度增多，不是「持續性」增多的典型原因。","貓白血病病毒（FeLV）感染可引起各種血液腫瘤，但持續性淋巴球增多症較不典型，更常見貧血和免疫抑制。","（正確）牛白血病病毒（BLV）感染是引起持續性淋巴球增多症最常見的原因，約 30% 感染牛出現此現象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_032","year":2019,"roc_year":108,"session":"2","examNo":32,"q":"下列何項之白血球為monocyte？","opts":["A. ","B. ","C. ","D. "],"ans":0,"exp":"此題為圖片辨識題，需辨認圖中白血球形態。單核球（monocyte）特徵：胞體大（12-20 μm）、核形態不規則（腎形、馬蹄形或折疊狀）、細胞質豐富且呈灰藍色、含細小空泡或顆粒。正確答案需依圖判斷，標記待審查。","we":["（正確）依題目圖示，此選項所示細胞為單核球，具有不規則折疊核和豐富灰藍色細胞質。","此選項圖中細胞可能為其他白血球種類（如淋巴球或中性球），需對照圖片判斷。","此選項圖中細胞可能為其他白血球種類，需對照圖片判斷。","此選項圖中細胞可能為其他白血球種類，需對照圖片判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1082_實診_033","year":2019,"roc_year":108,"session":"2","examNo":33,"q":"下列何者通常不會造成犬貓嗜中性球減少症？","opts":["A. FIV","B. FeLV","C. Ehrlichia canis","D. 皮質類固醇投予時"],"ans":3,"exp":"皮質類固醇（corticosteroids）投予反而會引起嗜中性球增多症（類固醇性白血球增多），而非嗜中性球減少症。FIV、FeLV 及 Ehrlichia canis 感染均可抑制骨髓造血，引起嗜中性球減少症。","we":["FIV（貓免疫缺乏病毒）感染可抑制骨髓造血，引起嗜中性球減少症。","FeLV（貓白血病病毒）感染可浸潤骨髓，抑制正常造血，引起嗜中性球減少症。","Ehrlichia canis 感染可引起骨髓抑制和全血球減少，包括嗜中性球減少症。","（正確）皮質類固醇投予反而促使骨髓釋放嗜中性球進入血液，引起嗜中性球增多症（而非減少症）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_034","year":2019,"roc_year":108,"session":"2","examNo":34,"q":"生理性白血球增多症不常出現於下列何種動物？","opts":["A. 犬","B. 年幼小貓","C. 年輕健康馬","D. 泌乳母豬"],"ans":2,"exp":"生理性白血球增多症（physiological leukocytosis）由腎上腺素分泌引起，使邊緣池嗜中性球進入循環池。此現象主要見於激動/受驚的犬、幼貓。年輕健康馬的生理性白血球增多現象不明顯，因馬的邊緣池較小，腎上腺素反應不如犬、貓顯著。","we":["犬在激動或受驚時常出現生理性白血球增多症（腎上腺素效應），此動物常見此現象。","年幼小貓在受到驚嚇或抓取時容易出現生理性白血球增多症，是常見現象。","（正確）年輕健康馬的生理性白血球增多症不明顯，因馬的邊緣池嗜中性球比例較少，腎上腺素效應相對不顯著。","泌乳母豬的生理性白血球增多症有其生理基礎（哺乳期壓力），不是「不常出現」的典型例子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_035","year":2019,"roc_year":108,"session":"2","examNo":35,"q":"關於活化凝血時間（activated clotting time，ACT）的敘述何者為正確？","opts":["A. 本試驗再現性欠佳","B. 延長表示外因系統所需凝血因子缺乏","C. 無法同時檢驗血塊品質","D. 適用於出血病畜緊急外科手術前之評估"],"ans":3,"exp":"活化凝血時間（ACT）測試的是內因性凝血路徑（需要 XII、XI、IX、VIII、X、V、II 因子及血小板），可同時觀察血塊品質。ACT 再現性佳（可重複操作），延長表示內因系統異常，適用於緊急手術前止血評估。","we":["ACT 試驗的再現性良好，可在床邊重複執行，此敘述錯誤。","ACT 延長表示內因性凝血路徑異常（非外因系統），外因系統缺陷應用 PT（一段式凝血酶原時間）檢測，此敘述錯誤。","ACT 可同時觀察血塊形成的品質（如血塊硬度、縮退），並非無法觀察，此敘述錯誤。","（正確）ACT 操作簡便、快速，適用於出血病畜緊急外科手術前的止血功能評估，這是其臨床最重要的應用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_036","year":2019,"roc_year":108,"session":"2","examNo":36,"q":"下列有關網狀球的敘述，何者錯誤？","opts":["A. 貓在急性大出血後，以聚集型網狀球評估其骨髓反應","B. 馬末梢血液之網狀球數大於3％，且M/E比大於0.5時，表示再生性貧血","C. 健康乳豬的血片常可見許多網狀球","D. 健康鳥的網狀球比例較哺乳動物高"],"ans":1,"exp":"馬末梢血液中通常不見網狀球（reticulocyte），因為馬在貧血時不會釋放未成熟紅血球（網狀球）到末梢血液；因此不能以末梢血液網狀球數來評估馬的再生性貧血，需做骨髓檢查。此題所述「馬末梢血液網狀球數大於 3% 且 M/E 比大於 0.5 表示再生性貧血」的說法有誤。","we":["貓的急性大出血後，以聚集型（aggregate）網狀球評估骨髓再生反應是正確的，因貓有兩種網狀球型態。","（正確）馬末梢血液幾乎不見網狀球，無法用末梢血液的網狀球數評估再生性貧血，需靠骨髓檢查，此敘述錯誤。","健康乳豬（哺乳期仔豬）血片常見網狀球是正確的，此為生理現象。","健康鳥類的網狀球比例較哺乳動物高是正確的，因鳥類有核紅血球更替率較高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_037","year":2019,"roc_year":108,"session":"2","examNo":37,"q":"下列有關犬淋巴瘤（lymphoma）的敘述，何者錯誤？","opts":["A. 最常見的淋巴瘤為多中心性","B. 常呈輕度貧血","C. 常可見嚴重的帶狀核嗜中性球增多症","D. 常與高血鈣症有關"],"ans":2,"exp":"犬淋巴瘤（lymphoma）的常見血液學特徵：最常見多中心性（multicentric）、輕度貧血（非再生性）、常與高血鈣症有關（尤其 T 細胞性淋巴瘤）。帶狀核嗜中性球增多症（left shift）可見於炎症性疾病，但在淋巴瘤中並不「嚴重且常見」，犬淋巴瘤較常見的是輕度中性球增多或正常白血球計數。","we":["多中心性淋巴瘤確實是犬最常見的淋巴瘤型態（約 80-85%），此敘述正確。","犬淋巴瘤常呈輕度非再生性貧血，此敘述正確。","（正確）嚴重的帶狀核嗜中性球增多症（left shift）並不是犬淋巴瘤的典型表現，淋巴瘤更多表現為淋巴球增多或正常分類，嚴重 left shift 通常見於化膿性炎症，此敘述錯誤。","犬淋巴瘤（尤其 T 細胞性）常伴隨高血鈣症（PTHrP 分泌），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_038","year":2019,"roc_year":108,"session":"2","examNo":38,"q":"下圖為何種嗜中性球增多症的機轉？（每個嗜中性球池之相對大小以長方形面積大小表示，箭頭大小表示各   嗜中性球池之細胞進出量。上圖為正常機轉之圖示。）","opts":["A. 化膿性炎症病變之完成期","B. 非炎症性之全身性緊迫","C. 慢性化膿性炎症","D. 化膿性炎症病變之形成期"],"ans":3,"exp":"此題需參考圖示判斷嗜中性球池分布模式。化膿性炎症病變形成期（初期）：骨髓產生和釋放增加、邊緣池減少、組織需求大增，血中嗜中性球增多伴 left shift（帶狀核增多）。圖示若顯示骨髓釋放大量、循環池增大、組織消耗大，為化膿性炎症形成期的典型模式，正確答案標記待審查。","we":["化膿性炎症完成期（消退期）：組織炎症緩解，骨髓釋放逐漸正常化，left shift 消失，各池趨於平衡。","非炎症性全身性緊迫：腎上腺素/皮質類固醇作用，使邊緣池進入循環池，不見 left shift。","慢性化膿性炎症：骨髓代償增生，嗜中性球持續增多，left shift 較輕微，各池相對穩定。","（正確）化膿性炎症形成期：骨髓大量釋放嗜中性球（含帶狀核），組織消耗急遽增加，血中呈現顯著 left shift 的嗜中性球增多症，符合題目圖示模式。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1082_實診_039","year":2019,"roc_year":108,"session":"2","examNo":39,"q":"血小板數減少，口腔黏膜出血時間延長，活化部分成栓質時間正常，一段式凝血酶原時間正常，凝血酶時間\r   正常，纖維素降解產物正常，代表何種止血障礙？","opts":["A. 血小板功能缺損","B. 血小板減少症","C. 封魏氏病","D. 散播性血管內凝血症候群"],"ans":1,"exp":"此止血異常模式分析：血小板數減少 + 出血時間延長 + APTT 正常 + PT 正常 + 凝血酶時間正常 + FDP 正常。此模式符合血小板減少症（thrombocytopenia）：血小板數量不足導致初期止血障礙（出血時間延長），凝血因子相關的二期止血正常（APTT、PT、TT 均正常），無 DIC（FDP 正常）。","we":["血小板功能缺損（thrombocytopathia）：血小板數量正常但功能異常，出血時間延長，但血小板數量應正常，與題目血小板數減少不符。","（正確）血小板減少症：血小板數量減少→初期止血障礙→出血時間延長，而凝血因子路徑（APTT、PT、TT）均正常，FDP 正常，完全符合此模式。","封魏氏病（von Willebrand disease）：vWF 缺乏→血小板黏附障礙，出血時間延長，血小板數量通常正常，但 APTT 可能延長（因 vWF 攜帶 Factor VIII），與題目不完全符合。","散播性血管內凝血（DIC）：應見 APTT/PT 延長、FDP 升高、血小板減少，但本題 FDP 正常、APTT/PT 正常，不符合 DIC。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_040","year":2019,"roc_year":108,"session":"2","examNo":40,"q":"下列有關動物血型和輸血的敘述，何者正確？","opts":["A. 犬隻第一次輸入DEA1.1陽性血時未發生嚴重溶血反應，表示之後都可再接受DEA1.1陽性血","B. 交叉－比對試驗中未出現溶血現象，即表示兩犬隻具有相同血型","C. 將A型血液輸給B型貓，第一次並不會發生嚴重溶血反應","D. 馬重要的紅血球異體抗原為Aa及Qa，而牛以A、F、V較重要"],"ans":3,"exp":"馬的重要紅血球異體抗原（alloantigen）為 Aa 和 Qa；牛較重要的血型系統為 B 系統（B, C, S, U, Z 等），以及 A、F、V 等，其中 B 系統最複雜。選項 D「馬重要的紅血球異體抗原為 Aa 及 Qa，牛以 A、F、V 較重要」最為正確。","we":["犬第一次輸入 DEA1.1 陽性血雖不會有立即嚴重溶血，但會產生抗體，第二次輸入 DEA1.1 陽性血時會發生嚴重溶血，故之後仍有風險，此敘述錯誤。","交叉比對未出現溶血不代表兩者血型完全相同，只表示該次輸血相容，仍可能有少數次要血型不同，此敘述錯誤。","B 型貓對 A 型抗原具有強自然抗體，將 A 型血液輸給 B 型貓，第一次即可發生嚴重溶血反應（與犬相反），此敘述錯誤。","（正確）馬最重要的紅血球異體抗原確為 Aa 和 Qa（可引起輸血反應和新生駒溶血病）；牛以 A、F、V 因子較重要，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_041","year":2019,"roc_year":108,"session":"2","examNo":41,"q":"骨髓抹片之紅血球胚細胞數占有核細胞總數（ANC）之50％以上，且非紅血球系胚細胞（NEC）有20％以上\r   是骨髓胚細胞，則此病例可分類為下列何者？","opts":["A. 急性骨髓性白血病（AML）","B. 慢性骨髓性白血病（CML）","C. 骨髓異形成症候群之紅血病前癌狀態（MDS-Er）","D. 紅血球性白血病（M6）"],"ans":3,"exp":"依 FAB 分類系統：骨髓抹片中紅血球胚細胞（erythroblast）占 ANC 50% 以上，且非紅血球系胚細胞（NEC）有 20% 以上是骨髓胚細胞（myeloblast），此情形分類為紅血球性白血病（Erythroleukemia，M6）。若 NEC 中骨髓胚細胞不足 20%，則分類為 MDS-Er。","we":["急性骨髓性白血病（AML）需要 NEC 中骨髓胚細胞 ≥20%，且紅血球系胚細胞不需佔 ANC 50% 以上，分類條件不同。","慢性骨髓性白血病（CML）為分化較成熟的骨髓系細胞持續增生，骨髓胚細胞比例通常低，不符合本題描述。","MDS-Er（骨髓異形成症候群紅血病前癌狀態）：紅血球胚細胞 ≥50% ANC，但 NEC 中骨髓胚細胞不足 20%，本題已達 20% 故應分類為 M6。","（正確）紅血球胚細胞 ≥50% ANC，且 NEC 中骨髓胚細胞 ≥20%，符合紅血球性白血病（M6，Erythroleukemia）的 FAB 分類標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_042","year":2019,"roc_year":108,"session":"2","examNo":42,"q":"下列有關纖維素降解產物（fibrin degradation product，FDP）的敘述，何者正確？","opts":["A. 會抑制血小板之聚集作用","B. 會促進血小板之聚集作用","C. 會促進纖維素原轉變為纖維素","D. 會促進纖維素之多聚合作用"],"ans":0,"exp":"纖維素降解產物（FDP）是纖維蛋白溶解（fibrinolysis）的產物，FDP 具有抑制血小板聚集、抑制纖維素聚合的作用，同時也能競爭性抑制凝血酶的活性，因此 FDP 升高（如 DIC）時會加重出血傾向。","we":["（正確）FDP 會抑制血小板的聚集作用，並抑制纖維素形成，是 DIC 時出血加重的機制之一。","FDP 是抑制（而非促進）血小板聚集，此敘述錯誤。","FDP 是抑制（而非促進）纖維素原轉變為纖維素的過程，此敘述錯誤。","FDP 是抑制（而非促進）纖維素的多聚合作用，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_043","year":2019,"roc_year":108,"session":"2","examNo":43,"q":"進行血液配合試驗時，下列何者正確？","opts":["A. 供血者血清是否能與受血者之紅血球配合最為重要","B. 雖然鏡檢有血球凝集，但沒有溶血，也判定為可輸血","C. 牛、馬以溶血反應結果作為判定為佳","D. 無溶血或血球凝集反應表示兩者具有相同血型"],"ans":2,"exp":"血液配合試驗（cross-matching）重點：主要配合（major cross-match）是供血者紅血球 + 受血者血清，這是最重要的；出現溶血或凝集均判定不相容；牛、馬應同時以溶血和凝集反應判定（因牛馬的天然溶血素很重要）；配合試驗相容不等於血型完全相同。","we":["主要配合（major cross-match）是「受血者血清」與「供血者紅血球」的反應最重要，而非供血者血清與受血者紅血球，此敘述錯誤。","只要出現溶血或血球凝集任一現象，均應判定為不相容，不能輸血，此敘述錯誤。","（正確）牛和馬的血液配合試驗應以溶血反應作為主要判定標準（因牛馬有較強的天然溶血素），同時也觀察凝集，此敘述正確。","無溶血或凝集只表示「配合相容」，不等於兩者具有完全相同的血型，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_044","year":2019,"roc_year":108,"session":"2","examNo":44,"q":"紅血球形成2,3二磷甘油酸鹽（2,3-diphosphoglycerate）的主要生化徑路為","opts":["A. 衛－梅徑路（Embden-Meyerhof pathway）","B. 己糖－磷酸鹽徑路（hexose monophosphate pathway）","C. 變性血紅素還原酶徑路（methemoglobin reductase pathway）","D. 盧－拉徑路（Luebering-Rapoport pathway）"],"ans":3,"exp":"2,3-二磷甘油酸鹽（2,3-DPG）是透過 Luebering-Rapoport 旁路徑（盧－拉徑路）合成，此徑路在紅血球的 Embden-Meyerhof 糖解主路徑旁，使 1,3-DPG 轉化為 2,3-DPG 而非直接進入 ATP 生成路徑。","we":["衛－梅徑路（Embden-Meyerhof pathway）是紅血球主要糖解路徑，生成 ATP 和 NADH，不直接產生 2,3-DPG。","己糖磷酸鹽徑路（HMP shunt）生成 NADPH，用於抵抗氧化壓力，不產生 2,3-DPG。","變性血紅素還原酶徑路（methemoglobin reductase pathway）用於將高鐵血紅素還原，不產生 2,3-DPG。","（正確）2,3-DPG 由 Luebering-Rapoport 旁路徑合成，此徑路使 1,3-DPG 不進入 ATP 合成步驟，而轉化為 2,3-DPG，調節血紅素對氧的親和力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_045","year":2019,"roc_year":108,"session":"2","examNo":45,"q":"反芻獸之白血球減少症常與下列那種細胞之減少最為有關？","opts":["A. 嗜酸性球","B. 淋巴球","C. 嗜鹼性球","D. 單核球"],"ans":1,"exp":"反芻獸（牛、羊）血液中以淋巴球為最主要的白血球（淋巴球佔白血球 45-75%），因此反芻獸的白血球減少症主要與淋巴球減少有關。","we":["嗜酸性球在反芻獸白血球中比例較低，其減少不是白血球減少症的主要原因。","（正確）反芻獸正常血液分類中淋巴球佔多數（45-75%），白血球減少症主要反映淋巴球的減少。","嗜鹼性球在反芻獸血液中比例極少，不是白血球減少症的主要相關細胞。","單核球在反芻獸中比例也較少，不是白血球減少症的主要相關細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_046","year":2019,"roc_year":108,"session":"2","examNo":46,"q":"鳥類和爬蟲類的何種白血球，因染色特性，必須與heterophil加以區別？","opts":["A. 嗜中性球","B. 嗜酸性球","C. 嗜鹼性球","D. 單核球"],"ans":1,"exp":"鳥類和爬蟲類沒有嗜中性球，功能相當的細胞稱為 heterophil（異嗜球）。嗜酸性球在染色特性上（胞質顆粒的染色反應）有時與 heterophil 相似，需要仔細鑑別區分。","we":["鳥類和爬蟲類的「嗜中性球」功能由 heterophil 取代，並非另外存在嗜中性球需要與 heterophil 區別。","（正確）嗜酸性球的胞質顆粒染色特性（嗜伊紅性）有時與 heterophil 相似，在鳥類和爬蟲類血液抹片鑑別時需特別注意區分。","嗜鹼性球的顆粒為嗜鹼性（深藍色），染色特性與 heterophil 不同，通常不需要與之鑑別。","單核球形態特殊（大核、豐富胞質），與 heterophil 的多葉核/分葉核形態明顯不同，不需鑑別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_047","year":2019,"roc_year":108,"session":"2","examNo":47,"q":"犬呈現大球性低（染）色性貧血，且抹片出現有核紅血球，最可能為","opts":["A. 鉛中毒","B. 缺鐵性貧血","C. 骨髓之竇狀隙破壞","D. 再生性貧血"],"ans":0,"exp":"犬呈現大球性低色性貧血（macrocytic hypochromic anemia）且血液抹片出現有核紅血球，此組合最常見於鉛中毒（lead poisoning）。鉛中毒干擾血基質（heme）合成，產生低色性貧血，同時抑制有核紅血球成熟退核，使有核紅血球釋出至末梢血液，並可見嗜鹼性顆粒（basophilic stippling）。","we":["（正確）鉛中毒抑制 heme 合成酵素→低色性貧血，同時干擾紅血球成熟→大球性且有核紅血球出現，是典型表現。","缺鐵性貧血為小球性低色性貧血，不是大球性，且有核紅血球不常見，此組合不符合。","骨髓竇狀隙破壞（myelophthisis）可導致有核紅血球釋放，但貧血型態不一定是大球性低色性，且特異性較低。","再生性貧血（regenerative anemia）可見大球性貧血和網狀球增多，但有核紅血球在犬並非典型特徵，且應伴隨網狀球增多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_048","year":2019,"roc_year":108,"session":"2","examNo":48,"q":"下列何種凝血因子受α 1 - antitrypsin抑制？","opts":["A. VIIa","B. XIa","C. Ia","D. Va"],"ans":1,"exp":"α1-抗胰蛋白酶（α1-antitrypsin）是一種絲胺酸蛋白酶抑制劑（serine protease inhibitor），主要抑制凝血因子 XIa（Factor XIa），屬內因性凝血路徑的調節因子。","we":["Factor VIIa 是外因性凝血路徑的活化因子，其主要抑制劑是 TFPI（組織因子路徑抑制劑），而非 α1-antitrypsin。","（正確）α1-antitrypsin（α1-AT）主要抑制 Factor XIa，屬於內因性凝血路徑的絲胺酸蛋白酶抑制劑。","Factor Ia 即纖維素（fibrin），不是凝血酶絲胺酸蛋白酶，不是 α1-AT 的主要抑制對象。","Factor Va 是凝血酶原酶複合體的輔因子，由活化蛋白質 C（APC）降解，不是 α1-AT 的抑制對象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_049","year":2019,"roc_year":108,"session":"2","examNo":49,"q":"下列何者不屬於急性骨髓系白血病（acute myeloid leukemia）？","opts":["A. mast cell leukemia","B. monocytic leukemia","C. erythroleukemia","D. megakaryoblastic leukemia"],"ans":0,"exp":"急性骨髓系白血病（AML）包括：骨髓系胚細胞白血病（M1、M2）、顆粒球性白血病、單核球性白血病（M5）、紅血球性白血病（M6）、巨核球性白血病（M7）等。肥胖細胞白血病（mast cell leukemia）屬於肥胖細胞腫瘤，肥胖細胞（mast cell）起源於骨髓前驅細胞但並不歸類在傳統 FAB 的 AML 分類中，通常歸類為獨立的肥胖細胞腫瘤（mastocytoma）。","we":["（正確）肥胖細胞白血病（mast cell leukemia）屬於肥胖細胞腫瘤範疇，在獸醫腫瘤學中不歸類於典型的急性骨髓系白血病，而是獨立分類。","單核球性白血病（monocytic leukemia，M5）屬於 AML 的一種，不是此題答案。","紅血球性白血病（erythroleukemia，M6）屬於 AML 的一種，不是此題答案。","巨核球性白血病（megakaryoblastic leukemia，M7）屬於 AML 的一種，不是此題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_050","year":2019,"roc_year":108,"session":"2","examNo":50,"q":"下列何種情形會導致低蛋白血症？①炎症 ②慢性營養不良 ③蛋白尿 ④新生仔牛未吸吮母乳","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":1,"exp":"引起低蛋白血症的原因：②慢性營養不良（蛋白質攝取/合成不足）、③蛋白尿（腎流失）、④新生仔牛未吸吮母乳（無法獲得免疫球蛋白，但初乳免疫球蛋白的缺乏不完全等同低蛋白血症，此題以低蛋白血症討論）。炎症（①）急性期常見急性期蛋白（acute phase proteins）上升，導致球蛋白增加，總蛋白可能升高，不引起低蛋白血症。","we":["①炎症急性期促進肝臟合成急性期蛋白（如纖維素原、CRP），球蛋白升高，不引起低蛋白血症，故含①的選項不正確。","（正確）②慢性營養不良、③蛋白尿（腎流失）、④新生仔牛未吸吮母乳（免疫球蛋白缺乏）均可導致低蛋白血症。","①炎症不引起低蛋白血症，故含①的 C 選項不正確。","①炎症不引起低蛋白血症，故含①的 D 選項不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_051","year":2019,"roc_year":108,"session":"2","examNo":51,"q":"那項疾病通常不會造成低白蛋白血症？","opts":["A. acute renal failure","B. hepatic insufficiency","C. exocrine pancreatic insufficiency","D. hemorrhage"],"ans":0,"exp":"急性腎衰竭（acute renal failure）雖然影響腎功能，但早期腎臟仍保留部分合成功能，且急性腎衰竭最主要的蛋白質異常是氮血症（BUN/Creatinine 升高），不一定立即引起顯著的低白蛋白血症。肝臟功能不全（合成減少）、外分泌胰臟功能不全（蛋白質消化吸收障礙）和出血（蛋白質流失）均會引起低白蛋白血症。","we":["（正確）急性腎衰竭主要引起氮血症和電解質異常，初期不一定引起顯著低白蛋白血症，是所列選項中最不會引起低白蛋白血症的。","肝臟功能不全（hepatic insufficiency）使白蛋白合成減少，是低白蛋白血症的重要原因。","外分泌胰臟功能不全（EPI）造成蛋白質消化吸收障礙，長期可引起蛋白質缺乏和低白蛋白血症。","出血（hemorrhage）使白蛋白大量流失，直接引起低白蛋白血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_052","year":2019,"roc_year":108,"session":"2","examNo":52,"q":"關於犬血清酵素半衰期長短之排序，下列何者正確？","opts":["A. IALP ＜ LDH ＜ AST ＜ GGT","B. AST ＜ LDH ＜ IALP ＜ GGT","C. IALP ＜ GGT ＜ LDH ＜ AST","D. IALP ＜ LDH ＜ GGT ＜ AST"],"ans":3,"exp":"犬血清酵素半衰期（由短到長）：IALP（腸源性 ALP）約數分鐘→LDH 約數小時→GGT 約 3 天→AST 約 5 小時（有些資料 AST 半衰期 1-2 小時，但相對 GGT 較短）。正確排序應為 IALP ＜ LDH ＜ GGT ＜ AST 或 IALP ＜ LDH ＜ AST ＜ GGT，需依教材確認。依多數獸醫臨床病理教材：IALP（分鐘級）< LDH（數小時）< GGT（72小時）< AST（較長），選 D。","we":["IALP ＜ LDH ＜ AST ＜ GGT 的排序，GGT 最長，此排序在部分教材中成立，但需進一步確認。","AST ＜ LDH ＜ IALP ＜ GGT 的排序，IALP 排在中間，但 IALP 半衰期極短（分鐘級），此排序明顯錯誤。","IALP ＜ GGT ＜ LDH ＜ AST 的排序，GGT 排在 LDH 之前，但 GGT 半衰期（72小時）一般長於 LDH（數小時），此排序不正確。","（正確）IALP（分鐘）＜ LDH（數小時）＜ GGT（約 72 小時）＜ AST（依部分教材 AST 最長），此排序符合多數獸醫臨床病理教材的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_053","year":2019,"roc_year":108,"session":"2","examNo":53,"q":"關於血中酵素降解機制之敘述何者正確？","opts":["A. 犬血中之CALP（corticosteroid ALP）酵素因結構高度酯化而降解較慢","B. ALP酵素由尿液排出體外","C. lipase酵素由膽汁排出體外","D. amylase由腎絲球體濾過，這種排泄對其血中活性值上升機轉之影響不大"],"ans":0,"exp":"犬 CALP（corticosteroid-induced ALP，皮質類固醇源 ALP）因結構含有高度醣化（glycosylation），使其對蛋白酶的降解有抵抗性，因此半衰期較長（約 3-4 天）。ALP 主要透過膽汁排出，非尿液；lipase 主要由腎臟清除；amylase 由腎絲球體濾過，這種清除機制對其血中活性有重要影響。","we":["（正確）犬 CALP 的結構高度醣化（glycosylated），使其抵抗血清中蛋白酶的降解，因此半衰期較長，血中持續升高，此敘述正確。","ALP 酵素主要由膽汁排出（非尿液），血中 ALP 升高反映肝膽疾病而非腎臟排泄問題，此敘述錯誤。","Lipase 主要由腎臟清除（腎絲球濾過並由近端腎小管降解），而非膽汁排出，此敘述錯誤。","Amylase 由腎絲球體濾過，但由近端腎小管大量再吸收和降解，因此腎臟對血中 amylase 濃度的影響相當顯著，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_055","year":2019,"roc_year":108,"session":"2","examNo":55,"q":"下列那些酵素會因膽汁淤積或是藥物毒性引發其製造量的增加？①AST ②ALT ③ALP ④GGT\r   ⑤SDH ⑥LDH","opts":["A. ①②","B. ③④","C. ③⑥","D. ④⑤"],"ans":1,"exp":"膽汁淤積或藥物毒性（如苯巴比妥）會誘導肝細胞增加合成 ALP 和 GGT，這是酵素誘導（enzyme induction）的機制。AST、ALT、SDH、LDH 等屬於「漏出酶」（leakage enzymes），其升高是因肝細胞損傷後細胞膜破裂漏出，而非合成量增加。","we":["AST 和 ALT 是漏出酶，其升高是因肝細胞損傷後胞內酵素漏出，不是因膽汁淤積誘導合成增加，此選項錯誤。","（正確）ALP（③）和 GGT（④）是誘導合成酶（induced enzymes），膽汁淤積或藥物毒性會誘導肝細胞大量合成並釋放這兩種酵素。","ALP（③）正確，但 LDH（⑥）是漏出酶，不是誘導合成酶，此組合不完全正確。","GGT（④）正確，但 SDH（⑤）是漏出酶，不是誘導合成酶，此組合不完全正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_056","year":2019,"roc_year":108,"session":"2","examNo":56,"q":"下列何者是犬血中氨基丙酸轉氨酶（ALT）活性值顯著上升之最常見原因？","opts":["A. 肝外性膽管阻塞","B. 急性瀰漫性肝細胞損傷","C. 類固醇性肝病","D. 慢性進行性原發性肝病"],"ans":1,"exp":"犬血中 ALT 活性值顯著上升，最常見原因是急性瀰漫性肝細胞損傷（如急性肝炎、肝毒性藥物、犬傳染性肝炎），因 ALT 主要位於肝細胞質中，大量肝細胞壞死時大量釋放入血，引起顯著升高（可達正常值 100 倍以上）。","we":["肝外性膽管阻塞主要引起 ALP 顯著升高，ALT 升高幅度較小且較慢，不是 ALT 顯著上升的最常見原因。","（正確）急性瀰漫性肝細胞損傷（如急性肝炎、毒性肝病）是犬 ALT 顯著升高的最常見原因，大量肝細胞壞死釋放胞內 ALT。","類固醇性肝病（steroid hepatopathy）主要引起 ALP 升高，ALT 升高幅度相對較小。","慢性進行性原發性肝病（如肝纖維化）引起 ALT 慢性輕度至中度升高，不會造成最顯著的 ALT 上升。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_057","year":2019,"roc_year":108,"session":"2","examNo":57,"q":"下列那種健康家畜血中AST活性值之半衰期最短？","opts":["A. 牛","B. 豬","C. 犬","D. 貓"],"ans":0,"exp":"各動物血中 AST 半衰期：牛約 4-6 小時（最短）、豬約 24 小時、犬約 22 小時、貓約 77 分鐘（但貓有特殊爭議）。依多數教材，牛的 AST 半衰期最短，約 4-6 小時，因此在牛的 AST 升高後，若病因消除，血中 AST 在數小時內即可回到正常。","we":["（正確）牛的血中 AST 半衰期約 4-6 小時，為所列動物中最短，是評估牛肌肉或肝損傷的動態指標。","豬的 AST 半衰期約 24 小時，較牛長。","犬的 AST 半衰期約 22 小時，較牛長。","貓的 AST 半衰期雖有不同資料（部分說較短），但一般教材中牛最短，此選項不是最正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_058","year":2019,"roc_year":108,"session":"2","examNo":58,"q":"犬alkaline phosphatase（ALP）之異構酶中，下列何種器官來源者之半衰期最長？","opts":["A. 骨骼","B. 腸","C. 腎","D. 胎盤"],"ans":1,"exp":"犬 ALP 各異構酶的半衰期：IALP（腸源性）約數分鐘（最短）、骨源性約 1-2 天、腎源性約 1-2 天、胎盤源性約 1-2 天、肝源性（LALP）約 2-3 天、類固醇源性（CALP）約 3-4 天（最長）。但此題問「半衰期最長」，在器官來源的選項（骨、腸、腎、胎盤）中，腸源（IALP）最短，骨源性最長（相對其他所列器官來源）。","we":["骨源性 ALP 半衰期相對其他所列選項中較長，但需與腸源性比較確認。","（正確）腸源性 ALP（IALP）半衰期極短（分鐘級），在所列選項中最短；相對而言，骨源性 ALP 半衰期（約 1-2 天）在骨/腸/腎/胎盤四個選項中最長，此為考題考點。","腎源性 ALP 半衰期極短（分鐘至小時級），不是最長。","胎盤源性 ALP 在懷孕動物中出現，半衰期中等，但非所列中最長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_059","year":2019,"roc_year":108,"session":"2","examNo":59,"q":"下列何種動物，其唾液中具有足夠的澱粉酶？","opts":["A. 牛","B. 豬","C. 犬","D. 貓"],"ans":1,"exp":"豬的唾液中含有足量的澱粉酶（salivary amylase），可有效消化食物中的澱粉，這是豬與其他許多動物的不同之處。犬和貓的唾液中澱粉酶活性極低或不含，反芻獸（牛）也幾乎不含。","we":["牛是反芻獸，其唾液主要含有緩衝成分，澱粉酶含量極少。","（正確）豬的唾液含有足夠量的澱粉酶，能在口腔中開始澱粉的消化，這是豬的消化生理特點。","犬的唾液中幾乎不含澱粉酶，犬主要靠胰臟澱粉酶消化澱粉。","貓的唾液中同樣幾乎不含澱粉酶，貓為絕對肉食性動物，對澱粉消化能力有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_060","year":2019,"roc_year":108,"session":"2","examNo":60,"q":"脂酶在下列何種臟器中被非活化？","opts":["A. 肝","B. 小腸","C. 胰臟","D. 腎臟"],"ans":3,"exp":"脂酶（lipase）在腎臟（腎小管）被非活化（inactivated）或降解，這是脂酶從循環中清除的主要機制。當腎功能不全時，血中脂酶活性可能升高，但需與胰臟疾病鑑別。","we":["肝臟不是脂酶被非活化的主要器官，肝臟主要處理膽固醇和脂蛋白代謝。","小腸是胰臟脂酶發揮消化功能的場所，不是使脂酶非活化的器官。","胰臟是分泌脂酶的器官，以酶原（prolipase）形式分泌，在腸道中活化，不是非活化脂酶的場所。","（正確）脂酶主要在腎臟被非活化（腎小管攝取和降解），因此腎功能不全時血中脂酶可能升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_062","year":2019,"roc_year":108,"session":"2","examNo":62,"q":"下列何者為牛及綿羊之黑腿病病原？","opts":["A. Clostridium chauvoei","B. Clostridium perfringens type A","C. Clostridium novyi type A","D. Clostridium sordelli"],"ans":0,"exp":"黑腿病（Blackleg）是牛和綿羊的急性發熱性肌炎，病原為 Clostridium chauvoei（傷氣莢膜梭菌）。本病特徵是骨骼肌氣性壞疽，主要侵害健康幼年牛隻。","we":["（正確）Clostridium chauvoei 是牛和綿羊黑腿病的病原，引起骨骼肌的氣性壞疽性肌炎。","Clostridium perfringens type A 主要引起牛羊的腸毒血症，不是黑腿病的病原。","Clostridium novyi type A 引起牛的黑病（black disease，壞死性肝炎），不是黑腿病的病原。","Clostridium sordelli 可引起牛羊的腸炎和出血性腸炎，不是黑腿病的病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_063","year":2019,"roc_year":108,"session":"2","examNo":63,"q":"乳酸鹽脫氫酶（lactate dehydrogenase）的異構酶中，對熱很安定的是下列何者？","opts":["A. LDH1","B. LDH2","C. LDH3","D. LDH4"],"ans":0,"exp":"乳酸鹽脫氫酶（LDH）異構酶中，LDH1（心肌型，H4 四聚體）對熱最安定（thermostable），因為由 H（heart）亞基組成，富含帶電胺基酸，熱穩定性高。LDH5（M4 四聚體，肌肉/肝型）對熱最不穩定。","we":["（正確）LDH1（H4型）是 LDH 異構酶中對熱最穩定的，由四個心肌型（H 型）亞基組成，熱穩定性最高。","LDH2（H3M1型）熱穩定性次於 LDH1，不是最穩定的。","LDH3（H2M2型）為混合型，熱穩定性居中。","LDH4（HM3型）含較多 M 型亞基，熱穩定性低，不是最穩定的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_064","year":2019,"roc_year":108,"session":"2","examNo":64,"q":"在乳酸鹽脫氫酶（LDH）的異構酶中，何者主要是存在於動物的骨骼肌中？","opts":["A. LDH1","B. LDH3","C. LDH4","D. LDH5"],"ans":3,"exp":"LDH 異構酶中，LDH5（M4型，全為肌肉型亞基）主要存在於骨骼肌（和肝臟）。LDH 的分布規律：LDH1（H4）→心肌、LDH2（H3M1）→心肌/紅血球、LDH3（H2M2）→脾/肺/胰腺、LDH4（HM3）→肝/骨骼肌、LDH5（M4）→骨骼肌/肝臟。","we":["LDH1（H4型）主要存在於心肌和紅血球，不是骨骼肌。","LDH3（H2M2型）主要存在於脾臟、肺、胰腺，不是骨骼肌的主要異構酶。","LDH4（HM3型）存在於肝臟和骨骼肌中，但不是骨骼肌的「主要」LDH 型。","（正確）LDH5（M4型）由四個骨骼肌型亞基組成，主要存在於骨骼肌和肝臟，是骨骼肌的代表性 LDH 異構酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_065","year":2019,"roc_year":108,"session":"2","examNo":65,"q":"下列何處的腎單元滲透力（osmolality）最大？","opts":["A. 近端腎小管","B. 下行亨雷氏蹄係（Henle's loop）之末端","C. 上行亨雷氏蹄係（Henle's loop）之末端","D. 遠端腎小管"],"ans":1,"exp":"在腎臟集尿管系統中，髓質滲透梯度最高點位於下行亨雷氏蹄係（Henle's loop）的末端（即髓質深部的折返點），此處受到逆流倍增機制影響，組織間液滲透壓可高達 1200-1400 mOsm/kg。","we":["近端腎小管的滲透壓與血漿相近（約 300 mOsm/kg），不是最高點。","（正確）下行亨雷氏蹄係末端位於腎髓質最深處，受逆流倍增機制影響，此處滲透壓最高。","上行亨雷氏蹄係末端的 NaCl 主動運輸使管腔液滲透壓下降，組織間液滲透壓相對較低。","遠端腎小管的滲透壓較下行蹄係末端低，不是最高點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_066","year":2019,"roc_year":108,"session":"2","examNo":66,"q":"抗利尿荷爾蒙主要作用於何處促進水分重吸收？","opts":["A. 近端腎小管","B. 遠端腎小管","C. 下行亨雷氏蹄係（Henle's loop）","D. 集尿管"],"ans":3,"exp":"抗利尿荷爾蒙（ADH/AVP）主要作用於集尿管（collecting duct），使集尿管管壁對水的通透性增加（插入 AQP2 水通道），促進水分重吸收，使尿液濃縮。ADH 對遠端腎小管也有部分作用，但集尿管是最主要的作用部位。","we":["近端腎小管的水分重吸收為等滲性，不依賴 ADH 調控，而是靠溶質的主動運輸帶動水被動吸收。","遠端腎小管後段雖也受 ADH 影響，但集尿管是最主要的作用位置。","下行亨雷氏蹄係對水有高通透性，但此為固有特性，非 ADH 直接作用部位。","（正確）集尿管是 ADH 最主要的作用位置，ADH 誘導 AQP2 水通道插入管腔膜，大量增加水分重吸收，濃縮尿液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_067","year":2019,"roc_year":108,"session":"2","examNo":67,"q":"混濁尿經加熱60℃及加稀醋酸後，呈現透明且無氣泡產生者，為下列何種結晶？","opts":["A. 胱氨酸","B. 草酸鹽","C. 磷酸鹽","D. 碳酸鹽"],"ans":2,"exp":"磷酸鹽（phosphates）結晶在混濁尿液中，加熱至 60℃ 後結晶溶解，尿液變透明，且加入稀醋酸後同樣溶解但不產生氣泡。碳酸鹽加熱加醋酸會產生氣泡（CO2），草酸鹽和胱氨酸的溶解反應不同。","we":["胱氨酸結晶不溶於加熱，而是溶於氨（鹼性條件），加稀醋酸（酸性）反而使其沉澱增加，不符合本題描述。","草酸鹽結晶加熱不溶解（加稀鹽酸溶解），不符合加熱後透明的描述。","（正確）磷酸鹽結晶在加熱 60℃ 後溶解（尿液變透明），加入稀醋酸後也溶解但不產生氣泡，此為磷酸鹽的特徵反應。","碳酸鹽結晶在加稀醋酸後會溶解並產生大量氣泡（CO2），與題目「無氣泡」不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_068","year":2019,"roc_year":108,"session":"2","examNo":68,"q":"尿中電解質廓清比試驗中，何種離子不適用於馬？","opts":["A. 鈉離子","B. 鉀離子","C. 磷離子","D. 鈣離子"],"ans":3,"exp":"尿中電解質廓清比試驗（fractional excretion of electrolytes）在馬中不適用於鈣離子（Ca²⁺），因為馬的鈣代謝具有特殊性——馬主要經腸道調節鈣，且尿液中鈣的排泄量很高（正常馬尿液中鈣濃度遠高於其他動物），因此其廓清比結果難以用標準參考值解讀。","we":["鈉離子廓清比在馬腎功能評估中有應用價值，此選項適用於馬。","鉀離子廓清比在馬中有應用價值，此選項適用於馬。","磷離子廓清比在馬中有應用價值，此選項適用於馬。","（正確）鈣離子廓清比不適用於馬，因為馬的尿液鈣排泄量本身就遠高於其他動物（正常馬尿液常見大量碳酸鈣），無法以標準廓清比評估腎功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_069","year":2019,"roc_year":108,"session":"2","examNo":69,"q":"何種健康動物之尿液中通常易見到脂肪滴？","opts":["A. 犬","B. 貓","C. 牛","D. 馬"],"ans":1,"exp":"健康貓的尿液中常可見到脂肪滴（lipid droplets），這是貓正常的生理現象，因為貓對脂肪代謝的特殊性（脂肪酸是重要能量來源），尿液中出現少量脂肪滴屬正常。","we":["犬的正常尿液中不常見脂肪滴，脂肪尿在犬可能提示脂肪代謝異常。","（正確）健康貓的尿液中常可見到脂肪滴，此為貓的正常生理特徵，不代表病理狀態。","牛的尿液中不常見脂肪滴，若出現可能與酮症或脂肪肝有關。","馬的尿液中不常見脂肪滴作為正常現象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_071","year":2019,"roc_year":108,"session":"2","examNo":71,"q":"Blood gas檢查結果為血液pH值下降、PaCO 2 上升、HCO 3 - 正常、HCO 3 - /H 2 CO 3 比下降，診斷為何種酸鹼異   常？","opts":["A. 代謝性酸中毒","B. 呼吸性酸中毒","C. 代謝性鹼中毒","D. 呼吸性鹼中毒"],"ans":1,"exp":"血液 pH 下降 + PaCO2 上升 + HCO3⁻ 正常 + HCO3⁻/H2CO3 比下降：pH 下降為酸血症，PaCO2 升高表示 CO2 瀦留（呼吸系統問題），HCO3⁻ 正常表示代謝補償尚未發生（急性），診斷為急性呼吸性酸中毒（respiratory acidosis）。","we":["代謝性酸中毒：HCO3⁻ 下降（非正常），PaCO2 下降（代償性過度換氣），與本題 PaCO2 上升不符。","（正確）PaCO2 升高（CO2 瀦留）+ pH 下降 + HCO3⁻ 正常 = 急性呼吸性酸中毒，符合本題所有血氣變化。","代謝性鹼中毒：HCO3⁻ 升高（非正常），pH 升高（非下降），與本題不符。","呼吸性鹼中毒：PaCO2 下降（非上升），pH 升高（非下降），與本題不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1082_實診_072","year":2019,"roc_year":108,"session":"2","examNo":72,"q":"下列何者非繼發於內在性K + 平衡改變所引起高血鉀症之原因？","opts":["A. 鹼血症","B. 大量組織壞死","C. 胰島素不足","D. 莢竹桃中毒"],"ans":0,"exp":"內在性
