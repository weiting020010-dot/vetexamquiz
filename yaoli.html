），此陳述符合藥理事實，不符合題目問的「不是」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_020","year":2025,"roc_year":114,"session":"","examNo":20,"q":"由於phenoxybenzamine之作用機制，致使其對受體產生下列何種作用？","opts":["A. 可逆性阻斷","B. 不可逆性阻斷","C. 短暫性阻斷","D. 永久性阻斷"],"ans":1,"exp":"Phenoxybenzamine透過與α腎上腺素受體形成共價鍵（烷化反應，alkylation），對α1及α2受體產生不可逆性（irreversible）阻斷，效果持續24-48小時直到新受體重新合成，與可逆性競爭拮抗劑（如phentolamine）不同。","we":["錯誤：可逆性阻斷是競爭型拮抗劑的特徵（如phentolamine），phenoxybenzamine是烷化劑，形成的是不可逆性共價鍵。","","錯誤：「短暫性阻斷」暗示可逆且短效，phenoxybenzamine作用持久（24-48小時），且為不可逆性，不屬此類。","錯誤：「永久性阻斷」概念上雖接近，但實際上隨著新受體的合成，效果會逐漸恢復，正確術語應為「不可逆性阻斷」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_021","year":2025,"roc_year":114,"session":"","examNo":21,"q":"下列何者可經口投予，最適合應用於犬尿失禁之治療？","opts":["A. norepinephrine","B. dopamine","C. phenylephrine","D. phenylpropanolamine"],"ans":3,"exp":"Phenylpropanolamine（PPA）為α1受體促效劑，具有良好口服生體可用率，可增加尿道括約肌及膀胱頸平滑肌的張力，是犬荷爾蒙反應性尿失禁的首選口服治療藥物，已獲批准使用。","we":["錯誤：Norepinephrine（正腎上腺素）主要用於靜脈注射升壓，口服生體可用率極低（被消化道及肝臟首渡代謝），不適合口服用於尿失禁。","錯誤：Dopamine口服生體可用率極低，且主要用於靜脈給予治療休克，不用於尿失禁治療。","錯誤：Phenylephrine雖是α1促效劑，但口服後大量被首渡代謝，生體可用率低，且未被批准用於犬尿失禁治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_022","year":2025,"roc_year":114,"session":"","examNo":22,"q":"當犬隻受到虎頭蜂攻擊後，出現過敏性休克症狀，下列何者為緊急適用藥物？","opts":["A. norepinephrine","B. phenylephrine","C. isoproterenol","D. epinephrine"],"ans":3,"exp":"Epinephrine（腎上腺素）是過敏性休克的首選緊急藥物，同時作用於α1（血管收縮、升壓）、β1（增加心輸出量）及β2（支氣管擴張）受體，可同時逆轉過敏性休克的低血壓、支氣管痙攣及心搏過緩等致命症狀。","we":["錯誤：Norepinephrine主要激活α及β1受體，缺乏β2受體活性，無法有效擴張支氣管，不是過敏性休克的首選藥物。","錯誤：Phenylephrine為純α1促效劑，只有血管收縮效果，無法改善支氣管痙攣或心搏過緩，不適合單獨用於過敏性休克。","錯誤：Isoproterenol為純β促效劑，可擴張支氣管，但因β2活性引起血管擴張，反而可能加重低血壓，不是首選。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_023","year":2025,"roc_year":114,"session":"","examNo":23,"q":"交感神經系統作用藥物中，下列何者為phenylephrine作用之受體？","opts":["A. &alpha;1","B. &alpha;2","C. &beta;1","D. &beta;2"],"ans":0,"exp":"Phenylephrine是高度選擇性α1腎上腺素受體促效劑，主要作用為血管收縮（升壓）及散瞳（眼科使用），在臨床劑量下幾乎不影響α2、β1或β2受體。","we":["","錯誤：α2受體是clonidine、xylazine等藥物的主要作用受體，phenylephrine對α2受體的選擇性極低。","錯誤：β1受體位於心臟，由catecholamines（如dobutamine）活化，phenylephrine不具β1受體親和力。","錯誤：β2受體位於支氣管和血管平滑肌，由albuterol、terbutaline等藥物活化，phenylephrine不具β2受體活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_024","year":2025,"roc_year":114,"session":"","examNo":24,"q":"下列何者的主要用途是增加經濟動物的飼料利用率與增重率？","opts":["A. isoxsuprine","B. zilpaterol","C. albuterol","D. terbutaline"],"ans":1,"exp":"Zilpaterol是β2腎上腺素受體促效劑，可促進骨骼肌蛋白合成並抑制脂肪沉積，作為飼料添加劑用於提高肉牛的飼料利用率及增重率（增加瘦肉率），是經濟動物常用的β-促效劑生長促進劑（類似ractopamine）。","we":["錯誤：Isoxsuprine是β2促效劑，主要用於馬的蹄葉炎和提高子宮血流，不用於增重及飼料利用率改善。","","錯誤：Albuterol（salbutamol）是短效β2促效劑，主要用於支氣管擴張（哮喘治療），並非批准用於經濟動物的生長促進。","錯誤：Terbutaline是β2促效劑，主要用於支氣管擴張及子宮鬆弛，不用於飼料利用率改善或增重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_025","year":2025,"roc_year":114,"session":"","examNo":25,"q":"下列藥物何者不屬於&alpha;1-受體拮抗劑？","opts":["A. prazosin","B. clonidine","C. terazosin","D. doxazosin"],"ans":1,"exp":"Clonidine是中樞性α2受體促效劑（agonist），而非α1受體拮抗劑；它透過活化中樞α2受體降低交感神經輸出，產生降壓及鎮靜效果。Prazosin、terazosin及doxazosin才是選擇性α1受體拮抗劑。","we":["此為正確描述：Prazosin是選擇性α1受體拮抗劑，用於治療高血壓及尿道阻力增加，此陳述符合藥理事實，不符合題目問的「不屬於」描述。","","此為正確描述：Terazosin是選擇性α1受體拮抗劑，臨床用途與prazosin相似，此陳述符合藥理事實，不符合題目問的「不屬於」描述。","此為正確描述：Doxazosin是長效選擇性α1受體拮抗劑，用於良性攝護腺增生及高血壓，此陳述符合藥理事實，不符合題目問的「不屬於」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_026","year":2025,"roc_year":114,"session":"","examNo":26,"q":"Atropine於犬隻出現中樞神經系統興奮與狂躁症狀時，最佳解毒劑為何？","opts":["A. vecuronium","B. neostigmine","C. physostigmine","D. pralidoxime"],"ans":2,"exp":"Physostigmine是三級胺（tertiary amine）膽鹼酯酶抑制劑，可穿越血腦屏障（BBB），抑制CNS中的乙醯膽鹼酯酶，提高中樞乙醯膽鹼濃度，有效逆轉atropine過量引起的中樞興奮及狂躁症狀。","we":["錯誤：Vecuronium是非去極化型神經肌肉阻斷劑，作用於周邊神經肌肉接頭，無法逆轉中樞性抗膽鹼毒性。","錯誤：Neostigmine是四級胺（quaternary amine）膽鹼酯酶抑制劑，無法穿越BBB，只能逆轉周邊（神經肌肉接頭）的膽鹼能作用，不能解除中樞症狀。","","錯誤：Pralidoxime（2-PAM）用於有機磷中毒，可再生被有機磷磷醯化的膽鹼酯酶，但對atropine過量引起的受體阻斷無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_027","year":2025,"roc_year":114,"session":"","examNo":27,"q":"下列何者最適合用於減輕鬱血性心衰竭所造成之後負荷（afterload）阻力？","opts":["A. norepinephrine","B. aspirin","C. morphine","D. hydralazine"],"ans":3,"exp":"Hydralazine是直接作用的動脈血管擴張劑，透過鬆弛動脈平滑肌降低全身血管阻力（SVR），從而減輕鬱血性心衰竭的心臟後負荷（afterload），改善心臟輸出並緩解症狀。","we":["錯誤：Norepinephrine為強力血管收縮劑，會增加後負荷及心臟做功，在心衰竭中使用反而有害，不能減輕afterload。","錯誤：Aspirin是非類固醇抗炎藥（NSAID），作用為抗凝血及抗炎，對心臟後負荷沒有直接減輕效果。","錯誤：Morphine主要透過靜脈擴張減輕前負荷（preload），並有鎮靜及降低焦慮效果，不是減輕後負荷的首選藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_028","year":2025,"roc_year":114,"session":"","examNo":28,"q":"第四類抗心律不整藥物不可以和下列何者併用？","opts":["A. propranolol","B. lidocaine","C. quinidine","D. bretylium"],"ans":0,"exp":"第四類抗心律不整藥物為鈣離子通道阻斷劑（如verapamil、diltiazem），具有負性變時（chronotropic）及負性傳導作用。與propranolol（第二類，β阻斷劑）併用時，兩者的負性心搏和負性傳導效果相加，可能導致嚴重心搏過緩、房室傳導阻斷甚至心臟停搏。","we":["","錯誤：Lidocaine（第一B類，Na通道阻斷劑）與第四類CCB作用機制不同，無嚴重加乘心臟抑制風險，通常可合用。","錯誤：Quinidine（第一A類，Na通道阻斷劑）與第四類CCB的危險交互作用較β阻斷劑輕，並非最主要禁忌。","錯誤：Bretylium（第三類，K通道阻斷劑）與第四類CCB的主要交互作用是低血壓加重，不是最嚴重的房室傳導阻斷風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_029","year":2025,"roc_year":114,"session":"","examNo":29,"q":"下列何者能 適度地減緩傳導，增加動作電位的時程，且能延長QRS波和QT間隔時間 ？","opts":["A. atropine","B. procainamide","C. epinephrine","D. verapamil"],"ans":1,"exp":"Procainamide屬於第一A類（Class IA）抗心律不整藥物，阻斷心肌Na+通道，可適度減緩心肌傳導速率，延長動作電位時程（APD）及不應期，心電圖上表現為QRS波群增寬及QT間隔延長。","we":["錯誤：Atropine是毒蕈鹼受體拮抗劑，用於治療心搏過緩，加速房室傳導，不延長QRS或QT間隔。","","錯誤：Epinephrine是腎上腺素受體促效劑，可加速心搏並縮短傳導時間，與題目描述的「減緩傳導、延長QRS」相反。","錯誤：Verapamil（第四類，Ca通道阻斷劑）主要作用在竇房結及房室結，減慢心率，但不延長QRS（主要延長PR間隔），動作電位時程改變模式不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_030","year":2025,"roc_year":114,"session":"","examNo":30,"q":"下列藥物與其作用之配對，何者錯誤？","opts":["A. procainamide：阻斷鈉離子通道","B. mexiletine：阻斷鈣離子通道","C. atenolol：阻斷&beta;-腎上腺素性受體","D. amiodarone：阻斷鉀離子通道"],"ans":1,"exp":"Mexiletine屬於第一B類（Class IB）抗心律不整藥物，阻斷心肌Na+（鈉）通道，而非Ca2+（鈣）通道。選項B說「阻斷Ca通道」為錯誤描述，是本題答案。鈣通道阻斷劑為第四類抗心律不整藥（如verapamil、diltiazem）。","we":["此為正確描述：Procainamide是第一A類藥物，透過阻斷Na+通道發揮抗心律不整效果，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","","此為正確描述：Atenolol是選擇性β1受體拮抗劑（第二類抗心律不整藥），透過阻斷β受體減慢心率，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：Amiodarone是第三類抗心律不整藥，主要阻斷K+通道（延長動作電位時程），此陳述符合藥理事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_031","year":2025,"roc_year":114,"session":"","examNo":31,"q":"下列何種抗血栓藥物為口服劑型？","opts":["A. streptokinase","B. enoxaparin","C. heparin","D. dicumarol"],"ans":3,"exp":"Dicumarol（雙香豆素）是口服香豆素類抗凝血劑，透過競爭性拮抗維生素K，抑制肝臟凝血因子II、VII、IX、X的合成，可口服給予用於抗血栓治療。Heparin及enoxaparin需注射給予，streptokinase為靜脈給予的溶血栓藥。","we":["錯誤：Streptokinase是血栓溶解劑（thrombolytic），需靜脈注射給予，不是口服抗血栓藥。","錯誤：Enoxaparin（低分子量肝素）需皮下注射給予，無口服劑型，因其為大分子多醣無法口服吸收。","錯誤：Heparin為未分餾肝素，需靜脈或皮下注射，口服無效，因其為帶強負電的大分子，不能穿越腸道黏膜。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_032","year":2025,"roc_year":114,"session":"","examNo":32,"q":"下列何者非furosemide主要引起之不良反應？","opts":["A. 低血鉀症","B. 代謝性鹼中毒","C. 高血鈣症","D. 高尿酸血症"],"ans":2,"exp":"Furosemide（袢利尿劑）抑制亨利氏環粗段Na-K-2Cl共輸送蛋白，在增加Na+、K+、Cl-排出的同時，也增加Ca2+的腎臟排泄（低鈣血症），並非「高鈣血症」，高鈣血症是噻嗪類利尿劑（thiazides）的副作用。","we":["此為正確描述：Furosemide透過排Na帶走大量K+，常造成低血鉀症（hypokalemia），此陳述符合藥理事實，不符合題目問的「非主要引起」描述。","此為正確描述：Furosemide造成的代謝性鹼中毒是因為大量Na+排泄導致繼發性醛固酮增加及H+分泌增加，此陳述符合藥理事實，不符合題目問的「非主要引起」描述。","","此為正確描述：Furosemide可抑制尿酸排泌，導致血尿酸升高（高尿酸血症），此陳述符合藥理事實，不符合題目問的「非主要引起」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_033","year":2025,"roc_year":114,"session":"","examNo":33,"q":"當一隻患有高鈣血症的動物併發全身性水腫時，下列何種利尿劑應避免使用？","opts":["A. furosemide","B. mannitol","C. chlorothiazide","D. spironolactone"],"ans":2,"exp":"Chlorothiazide（噻嗪類利尿劑）透過促進遠端腎小管對Ca2+的再吸收，可引起高鈣血症（hypercalcemia）；對已有高鈣血症的患畜使用會加重病情，應避免使用。Furosemide反而可增加尿鈣排泄，常用於治療高鈣血症。","we":["錯誤：Furosemide（袢利尿劑）可增加鈣的腎臟排泄，用於高鈣血症的治療，不需避免，反而是治療選擇之一。","錯誤：Mannitol是滲透性利尿劑，主要作用於腎小管，對鈣的代謝影響不大，高鈣血症患畜使用無特殊禁忌。","","錯誤：Spironolactone是保鉀利尿劑（醛固酮拮抗劑），對鈣代謝影響較小，不會加重高鈣血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_034","year":2025,"roc_year":114,"session":"","examNo":34,"q":"當動物因車禍致頭部重擊，引發腦水腫之治療藥物為何？","opts":["A. methazolamide, furosemide","B. mannitol, furosemide","C. ammonium chloride, furosemide","D. triamterene, furosemide"],"ans":1,"exp":"頭部外傷引起的腦水腫（cerebral edema）治療首選為甘露醇（mannitol）靜脈輸注，其高滲透壓可將腦組織中水分吸引至血管內；合併furosemide可加速液體排出，協同降低顱內壓（ICP）。","we":["錯誤：Methazolamide是碳酸酐酶抑制劑，主要用於降低眼壓，對急性腦水腫治療效果不如mannitol＋furosemide組合。","","錯誤：Ammonium chloride是酸化劑，用於酸化尿液，對腦水腫治療無效，反而可能加重代謝性酸中毒。","錯誤：Triamterene是保鉀利尿劑，利尿效果弱且不具滲透性利尿作用，不適合用於急性腦水腫降低顱內壓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_035","year":2025,"roc_year":114,"session":"","examNo":35,"q":"當動物出現代謝性酸中毒時，最常使用的間接鹼化劑為何？","opts":["A. sodium bicarbonate","B. sodium lactate","C. Ringer's solution","D. ammonium chloride"],"ans":1,"exp":"間接鹼化劑（indirect alkalinizer）是指在體內代謝後產生碳酸氫根（HCO3-）的物質。Sodium lactate在肝臟中被代謝轉化為bicarbonate，是代謝性酸中毒最常使用的間接鹼化劑，常見於Lactated Ringer's solution中。","we":["錯誤：Sodium bicarbonate（碳酸氫鈉）是直接鹼化劑，給予後直接提供HCO3-，不需代謝轉換，不屬於「間接」鹼化劑。","","錯誤：Ringer's solution（林格氏液）是等張電解質溶液，不含鹼化劑成分，無法糾正代謝性酸中毒。","錯誤：Ammonium chloride是尿液酸化劑，代謝後產生NH3和HCl，用於酸化尿液，與鹼化相反，不適合治療代謝性酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_036","year":2025,"roc_year":114,"session":"","examNo":36,"q":"下列消化性潰瘍治療藥物，何者為質子幫浦抑制劑？","opts":["A. lansoprazole","B. cimetidine","C. misoprostol","D. sucralfate"],"ans":0,"exp":"質子幫浦抑制劑（PPI, proton pump inhibitor）不可逆性阻斷胃壁細胞的H+/K+-ATPase，有效抑制胃酸分泌。Lansoprazole（與omeprazole、pantoprazole等）均屬PPI，是消化性潰瘍治療的一線藥物。","we":["","錯誤：Cimetidine是H2受體阻斷劑（histamine H2 blocker），透過阻斷H2受體減少胃酸分泌，不屬於PPI類。","錯誤：Misoprostol是前列腺素E1（PGE1）類似物，透過增強黏膜保護及輕度抑制胃酸分泌發揮作用，不屬於PPI類。","錯誤：Sucralfate是黏膜保護劑，與潰瘍表面的蛋白質結合形成保護層，不影響胃酸分泌，不屬於PPI類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_037","year":2025,"roc_year":114,"session":"","examNo":37,"q":"下列何者為中樞作用的催吐劑？","opts":["A. sodium chloride","B. xylazine","C. loperamide","D. propantheline"],"ans":1,"exp":"中樞性催吐劑透過作用於延腦化學受體觸發帶（CTZ）或直接興奮嘔吐中樞發揮催吐作用。Xylazine（α2促效劑）在貓犬（尤其貓）中可直接作用於延腦引發嘔吐，屬中樞性催吐劑，常用於貓的麻醉前催吐。Sodium chloride為周邊刺激性催吐劑。","we":["錯誤：Sodium chloride（食鹽水）大量口服可刺激胃黏膜產生催吐作用，屬於周邊性（刺激性）催吐劑，而非中樞性。","","錯誤：Loperamide是鴉片受體促效劑，作用於腸道的μ受體，是止瀉劑（antidiarrheal），無催吐作用。","錯誤：Propantheline是抗膽鹼藥物，用於減少腸道蠕動和分泌，具有止瀉及解痙作用，不是催吐劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_038","year":2025,"roc_year":114,"session":"","examNo":38,"q":"下列何種止吐劑最可能會產生錐體外作用（extrapyramidal effects）的副作用？","opts":["A. metoclopramide","B. promethazine","C. scopolamine","D. maropitant"],"ans":0,"exp":"Metoclopramide透過阻斷多巴胺D2受體發揮止吐效果，但D2受體廣泛分佈於紋狀體，高劑量或長期使用時阻斷紋狀體D2受體，可引起錐體外徑症狀（EPS，extrapyramidal symptoms），包括靜坐不能（akathisia）及遲發性運動障礙（tardive dyskinesia）等。","we":["","錯誤：Promethazine是吩噻嗪類抗組織胺藥，雖有D2拮抗成分，但其H1阻斷及抗膽鹼作用降低了錐體外徑副作用的風險，不是最容易產生EPS的止吐劑。","錯誤：Scopolamine是抗毒蕈鹼藥（anticholinergic），透過阻斷前庭系統的毒蕈鹼受體止吐，無D2拮抗活性，不引起錐體外徑症狀。","錯誤：Maropitant是NK1（neurokinin-1）受體拮抗劑，作用機制與多巴胺無關，無錐體外徑副作用，是犬貓常用的安全止吐劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_039","year":2025,"roc_year":114,"session":"","examNo":39,"q":"Sulfasalazine是由磺胺劑sulfapyridine與下列何者鍵結合成的炎症腸道疾病治療藥物？","opts":["A. prednisolone","B. azathioprine","C. budesonide","D. 5-aminosalicylic acid"],"ans":3,"exp":"Sulfasalazine由磺胺嘧啶（sulfapyridine）與5-胺基水楊酸（5-aminosalicylic acid, 5-ASA/mesalazine）透過偶氮鍵（azo bond）連結而成。腸道細菌分解偶氮鍵後釋放5-ASA，在結腸局部發揮抗炎作用，用於治療炎性腸道疾病（IBD）。","we":["錯誤：Prednisolone是腎上腺皮質固醇類藥物，與sulfasalazine的組成無關；sulfasalazine的活性部分是5-ASA而非糖皮質固醇。","錯誤：Azathioprine是嘌呤類免疫抑制劑，不是sulfasalazine的組成成分；兩者雖都用於IBD，但屬不同藥物。","錯誤：Budesonide是局部作用的糖皮質固醇，用於IBD治療，但與sulfasalazine的化學組成無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_040","year":2025,"roc_year":114,"session":"","examNo":40,"q":"下列瀉劑（laxative）何者屬於irritant laxatives類？","opts":["A. lactulose","B. methylcellulose","C. senna","D. docusate"],"ans":2,"exp":"刺激性瀉劑（irritant/stimulant laxatives）透過刺激腸黏膜神經叢增加蠕動，或直接影響腸壁電解質分泌。Senna（番瀉葉）含蒽醌類配醣體（anthraquinone glycosides），在結腸被細菌活化後刺激腸黏膜，屬典型刺激性瀉劑。","we":["錯誤：Lactulose是滲透性瀉劑（osmotic laxative），透過滲透壓吸引水分進入腸腔，並在結腸發酵產酸，不屬於刺激性瀉劑。","錯誤：Methylcellulose是膨脹性（容積性）瀉劑（bulk-forming laxative），吸水膨脹增加糞便體積，刺激腸蠕動，不屬於刺激性瀉劑。","","錯誤：Docusate是糞便軟化劑（emollient/stool softener），透過降低表面張力使水分滲入糞便，不屬於刺激性瀉劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_041","year":2025,"roc_year":114,"session":"","examNo":41,"q":"下列何種支氣管擴張劑，無法作為緊急氣喘之治療用藥？","opts":["A. salmeterol","B. pirbuterol","C. terbutaline","D. bitolterol"],"ans":0,"exp":"Salmeterol 為長效型 β2 受體促進劑（LABA），起效時間約 20 分鐘，持續 12 小時以上，無法提供急性氣喘所需的快速支氣管擴張效果，因此不適合作為緊急救治用藥。緊急氣喘應使用短效型 β2 促進劑（如 salbutamol、terbutaline、pirbuterol、bitolterol），其起效時間在 5 分鐘以內。","we":["","錯誤：pirbuterol 屬短效型 β2 促進劑，起效迅速，可用於急性支氣管痙攣的緊急治療。","錯誤：terbutaline 屬短效型 β2 促進劑，可皮下或吸入給藥，適合緊急氣喘治療。","錯誤：bitolterol 為前驅藥物，在組織中水解後釋出 colterol（短效 β2 促進劑），起效快，可用於急性支氣管痙攣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_042","year":2025,"roc_year":114,"session":"","examNo":42,"q":"犬隻外科手術時，欲先逆轉morphine之呼吸抑制但保留其止痛作用，再刺激呼吸使麻醉劑過量之犬 隻甦醒，則先後分別投予那兩項藥物最為適當？","opts":["A. nalbuphine；naloxone","B. buprenorphine；doxapram","C. butorphanol；doxapram","D. butorphanol；naloxone"],"ans":2,"exp":"Butorphanol 為混合型 opioid（μ 拮抗／κ 促進），能部分拮抗 μ 受體介導的呼吸抑制，同時因 κ 活性保留部分鎮痛效果，是此情境的首要用藥。Doxapram 為呼吸興奮劑，可直接刺激延腦呼吸中樞並活化頸動脈化學受器，兩者合用可逆轉過量麻醉藥引起的呼吸抑制並維持一定程度的止痛。","we":["錯誤：nalbuphine 雖亦為混合型 opioid 可部分逆轉呼吸抑制，但與 naloxone（完全拮抗劑）合用將完全移除鎮痛效果，不符題意。","錯誤：buprenorphine 與 μ 受體親和力極高且解離慢，其他 opioid 難以取代，並非適合逆轉過量麻醉藥的選擇；與 doxapram 合用亦無法保留足夠止痛。","","錯誤：butorphanol 搭配 naloxone（完全拮抗劑）會完全移除 opioid 效果，包括鎮痛，不符合「保留止痛」的要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_043","year":2025,"roc_year":114,"session":"","examNo":43,"q":"下列何者可做為控制氣喘之藥物？","opts":["A. propranolol","B. zafirlukast","C. aspirin","D. poractant alfa"],"ans":1,"exp":"Zafirlukast 為白三烯素（leukotriene）受體拮抗劑，阻斷 LTD4 所媒介的支氣管收縮與氣道發炎，適合作為慢性氣喘的長期控制藥物。其透過抑制肥大細胞與嗜酸性白血球釋出的炎症介質，降低氣道過度反應性，而非提供急性支氣管擴張，因此歸類為「控制」而非「緩解」藥物。","we":["錯誤：propranolol 為非選擇性 β 受體阻斷劑，會阻斷 β2 受體導致支氣管收縮，在氣喘動物屬禁忌。","","錯誤：aspirin 等 NSAIDs 可抑制 COX，使花生四烯酸轉向 5-LOX 途徑產生更多白三烯素，在敏感個體可誘發或加重氣喘。","錯誤：poractant alfa 為肺泡表面張力素（surfactant），用於新生兒呼吸窘迫症候群，與氣喘控制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_044","year":2025,"roc_year":114,"session":"","examNo":44,"q":"下列何者不是抑制COX-2大於抑制COX-1作用的非固醇類消炎藥？","opts":["A. tepoxalin","B. robenacoxib","C. etodolac","D. deracoxib"],"ans":0,"exp":"Tepoxalin 為 COX 與 5-LOX 雙重抑制劑，並非選擇性抑制 COX-2 大於 COX-1；它同時抑制花生四烯酸的兩條代謝途徑，以減少前列腺素與白三烯素的產生。Robenacoxib、etodolac、deracoxib 均屬 COX-2 優先或選擇性抑制劑，符合「COX-2 > COX-1」的定義。","we":["","錯誤：robenacoxib 為高選擇性 COX-2 抑制劑，COX-2/COX-1 抑制比值顯著，符合「COX-2 > COX-1」的定義。","錯誤：etodolac 為 COX-2 優先抑制劑，在治療劑量下對 COX-2 的抑制明顯強於 COX-1。","錯誤：deracoxib 為犬用選擇性 COX-2 抑制劑，具有高 COX-2/COX-1 選擇比。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_045","year":2025,"roc_year":114,"session":"","examNo":45,"q":"H1-組織胺受體主要媒介下列何種反應？","opts":["A. 小動脈及靜脈之血管收縮","B. 支氣管及腸道之平滑肌收縮","C. 降低微血管通透性","D. 體溫上升"],"ans":1,"exp":"H1 受體活化時主要引起支氣管平滑肌收縮、腸道平滑肌收縮、小血管擴張及微血管通透性增加，這些效應共同構成過敏反應的主要表現。H1 受體介導的血管效應是擴張（降低血壓），而非收縮；H2 受體才與胃酸分泌及部分心臟效應相關。","we":["錯誤：H1 受體活化引起小動脈「擴張」而非收縮，導致血壓下降與潮紅；血管收縮是 α1 受體或血管加壓素的效應。","","錯誤：H1 受體活化會「增加」微血管通透性，使血漿蛋白外漏形成水腫，而非降低通透性。","錯誤：H1 受體與體溫調節關係不直接；發燒主要由前列腺素 E2（PGE2）在下視丘作用所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_046","year":2025,"roc_year":114,"session":"","examNo":46,"q":"下列那一藥物之藥理作用與5-HT4受體之相關性最低？","opts":["A. cisapride","B. metoclopramide","C. ondansetron","D. prucalopride"],"ans":2,"exp":"Ondansetron 為選擇性 5-HT3 受體拮抗劑，其止吐機制是阻斷腸道與延腦化學觸發區（CTZ）的 5-HT3 受體，與 5-HT4 受體完全無關。Cisapride、metoclopramide 及 prucalopride 的促腸動力作用均透過活化 5-HT4 受體來達成，因此 ondansetron 是本題中與 5-HT4 受體相關性最低的藥物。","we":["錯誤：cisapride 為 5-HT4 受體促進劑，可加速胃腸蠕動，其促動力作用高度依賴 5-HT4 受體。","錯誤：metoclopramide 同時具有 5-HT4 促進活性與 D2 拮抗活性，前者負責促腸動力效應。","","錯誤：prucalopride 為高選擇性 5-HT4 受體促進劑，臨床用於便秘治療，完全依賴 5-HT4 機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_047","year":2025,"roc_year":114,"session":"","examNo":47,"q":"複選題\n47.下列何者對貓的安全性極差而應避免投予貓？","opts":["A. paracetamol","B. phenytoin","C. pimobenden","D. prednisolone"],"ans":0,"exp":"貓缺乏足夠的肝臟 UDP-葡萄糖醛酸轉移酶（UGT1A6），無法有效將 paracetamol（acetaminophen）代謝為無毒的葡萄糖醛酸結合物，導致毒性代謝物 NAPQI 大量累積，引起變性血紅素血症（methemoglobinemia）、Heinz 小體溶血性貧血及肝細胞壞死，即使少量也可能致命，因此貓絕對禁用。","we":["","錯誤：phenytoin 為抗癲癇藥，貓可在嚴格監控下使用，雖代謝較慢，但不屬於絕對禁忌如 paracetamol。","錯誤：pimobendan（強心藥）為犬心臟病常用藥，貓亦可在適應症下使用，安全性問題與 paracetamol 完全不同。","錯誤：prednisolone 為皮質類固醇，貓可安全使用（貓偏好 prednisolone 而非 prednisone，因貓的肝臟對 prednisone 活化效率較低，但兩者均非禁忌）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_048","year":2025,"roc_year":114,"session":"","examNo":48,"q":"下列非固醇類消炎藥物（NSAIDs）中，何者核准用於處理馬骨關節炎，且其作用可維持24～72小 時？","opts":["A. aspirin","B. ibuprofen","C. ketoprofen","D. phenylbutazone"],"ans":3,"exp":"Phenylbutazone 為吡唑酮類 NSAID，是歷史最悠久的馬用消炎止痛藥，核准用於馬骨關節炎、軟組織炎症及跛行，其止痛效果持續 24 至 72 小時，可每日一至兩次給藥。本藥為馬匹肌肉骨骼疾病的標準用藥，但因其對消化道及腎臟的毒性，不建議長期高劑量使用。","we":["錯誤：aspirin 在馬的半衰期短（約 1 小時），每日需多次給藥才能維持效果，且對馬的消炎效果不如 phenylbutazone，並無 24-72 小時的持效性。","錯誤：ibuprofen 在馬中具有顯著胃腸毒性，未被核准用於馬骨關節炎，不應使用。","錯誤：ketoprofen 在馬效果持續約 12 小時，未達 24-72 小時，且主要以注射方式使用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_049","year":2025,"roc_year":114,"session":"","examNo":49,"q":"下列藥物以鎮痛目的投予犬時，何者消炎效果最低？","opts":["A. flunixin","B. meloxicam","C. firocoxib","D. acetaminophen"],"ans":3,"exp":"Acetaminophen（paracetamol）具有解熱鎮痛作用，但幾乎沒有周邊 COX 抑制活性，因此消炎效果極為有限，不適合作為消炎藥使用。相比之下，flunixin、meloxicam 及 firocoxib 均為有效的 COX 抑制劑，具有明確的消炎效果。","we":["錯誤：flunixin meglumine 為強效 COX 抑制劑，具有顯著消炎、止痛及退燒效果，常用於犬的急性發炎情況。","錯誤：meloxicam 為 COX-2 優先抑制劑，具有良好的消炎與止痛效果，是犬貓最常用的 NSAID 之一。","錯誤：firocoxib 為高選擇性 COX-2 抑制劑，專門核准用於犬的骨關節炎，具有顯著消炎效果。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_050","year":2025,"roc_year":114,"session":"","examNo":50,"q":"下列有關血管收縮素轉換酵素（angiotensin-converting enzyme）抑制劑的敘述，何者正確？","opts":["A. 促進angiotensin Ⅱ的生成","B. 促使angiotensin Ⅰ之堆積","C. 抑制bradykinin之堆積","D. 可用來升高血壓"],"ans":1,"exp":"ACE（血管收縮素轉換酶）抑制劑阻斷 angiotensin I 轉化為 angiotensin II 的過程，導致 angiotensin I 無法被代謝而在循環中堆積，同時 angiotensin II 濃度降低，產生血管擴張、降低前後負荷的效果，用於治療充血性心衰竭及高血壓。","we":["錯誤：ACE 抑制劑「阻斷」angiotensin II 的生成，血中 angiotensin II 濃度下降，而非促進其生成。","","錯誤：ACE 同時也是分解 bradykinin 的激肽酶 II（kininase II）；ACE 抑制劑會導致 bradykinin「堆積」而非抑制其堆積，bradykinin 累積是引起乾咳副作用的原因。","錯誤：ACE 抑制劑的整體效果為「降低」血壓，透過減少 angiotensin II 及 aldosterone，產生血管擴張與利尿效應；不可用於升高血壓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_051","year":2025,"roc_year":114,"session":"","examNo":51,"q":"Altrenogest的藥理性質與下列何者最相近？","opts":["A. estrogen","B. gonadotropin","C. hydrocortisone","D. progesterone"],"ans":3,"exp":"Altrenogest（Regu-Mate）為合成的 19-nor 孕激素，具有高度黃體素受體親和力，其藥理作用與 progesterone 最為相近，用於馬匹同期發情、抑制發情及維持妊娠初期。雖結構上衍生自雄激素骨架，但其生物活性表現為強效孕激素效應。","we":["錯誤：altrenogest 無雌激素活性，不與 estrogen 受體結合；estrogen 主要負責促進子宮內膜增生與第二性徵發育。","錯誤：gonadotropin（如 FSH、LH）為垂體分泌的蛋白質激素，與 altrenogest 的類固醇化合物性質及藥理機制完全不同。","錯誤：hydrocortisone 為糖皮質素（glucocorticoid），作用於腎上腺皮質激素受體，與 altrenogest 的孕激素作用無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_052","year":2025,"roc_year":114,"session":"","examNo":52,"q":"複選題\n52.牛飼料中添加melengestrol acetate的主要目的為何？","opts":["A. 控制腸道脹氣","B. 預防腸道細菌感染","C. 調節牛隻繁殖週期","D. 作為生長促進劑"],"ans":0,"exp":"Melengestrol acetate（MGA）為合成孕激素，添加於牛飼料中可抑制發情週期、改善飼料轉換效率及促進增重，屬於生長促進劑的一種。本題標示答案為 A（控制腸道脹氣），但依據藥理學文獻，MGA 的主要核准用途為抑制發情與促進生長，建議核對原始試題答案。","we":["","錯誤：MGA 不具有抗菌活性，不用於預防腸道細菌感染；腸道感染的預防需使用抗生素類飼料添加劑。","錯誤：MGA 雖可抑制發情（因孕激素效應），但「調節繁殖週期」並非其在飼料添加中的主要核准目的；其主要目標是生長促進。","錯誤：MGA 作為生長促進劑的機制是透過孕激素效應改善飼料轉換效率，而非促進腸道脹氣控制；D 選項描述雖接近正確用途，但本題標示答案為 A。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_藥理_053","year":2025,"roc_year":114,"session":"","examNo":53,"q":"下列有關desoxycorticosterone和fludrocortisone之敘述，何者正確？","opts":["A. 二者皆具有顯著的glucocorticoid活性，而幾乎無mineralocorticoid活性","B. 二者皆具有顯著的mineralocorticoid活性，而幾乎無glucocorticoid活性","C. desoxycorticosterone同時具有顯著的glucocorticoid及mineralocorticoid活性","D. fludrocortisone同時具有顯著的glucocorticoid及mineralocorticoid活性"],"ans":3,"exp":"Fludrocortisone 是一種合成類固醇，同時具有強效 mineralocorticoid 活性（約為 aldosterone 的 10 倍）以及顯著的 glucocorticoid 活性，常用於犬貓的腎上腺皮質功能低下症（Addison's disease）。Desoxycorticosterone（DOCP）則主要為 mineralocorticoid，幾乎無 glucocorticoid 活性。","we":["錯誤：兩者均有 mineralocorticoid 活性；desoxycorticosterone 的 glucocorticoid 活性極低，fludrocortisone 則有顯著 glucocorticoid 活性，故此描述不正確。","錯誤：desoxycorticosterone 確有顯著 mineralocorticoid 而幾乎無 glucocorticoid，但 fludrocortisone 同時具有兩種活性，因此「二者皆有顯著 mineralocorticoid 無 glucocorticoid」的描述對 fludrocortisone 而言是錯誤的。","錯誤：desoxycorticosterone 主要為 mineralocorticoid，glucocorticoid 活性極低，並非「同時有顯著兩種活性」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_054","year":2025,"roc_year":114,"session":"","examNo":54,"q":"下列有關trilostane用於治療hyperadrenocorticism的敘述，何者正確？","opts":["A. 對pituitary dependent hyperadrenocorticism（PDH）有效，但對adrenal dependent hyperadrenocorticism（ADH）無效","B. 對pituitary dependent hyperadrenocorticism（PDH）無效，但對adrenal dependent hyperadrenocorticism（ADH）有效","C. 對pituitary dependent hyperadrenocorticism（PDH）和adrenal dependent hyperadrenocorticism（ADH）皆有效","D. 對pituitary dependent hyperadrenocorticism（PDH）和adrenal dependent hyperadrenocorticism（ADH）皆無效"],"ans":2,"exp":"Trilostane 透過抑制腎上腺皮質的 3β-羥基類固醇脫氫酶（3β-HSD），直接減少腎上腺合成皮質醇，因此無論是垂體依賴性腎上腺皮質功能亢進（PDH）還是腎上腺瘤所致的腎上腺依賴性皮質醇增多症，均可透過降低腎上腺類固醇合成而達到療效。","we":["錯誤：trilostane 作用於腎上腺本身的類固醇合成，對 PDH 及腎上腺依賴性兩型均有效，並非只對 PDH 有效。","錯誤：trilostane 對兩型均有效，並非只對腎上腺依賴性有效而對 PDH 無效。","","錯誤：trilostane 對 PDH 及腎上腺依賴性皮質醇增多症均有療效，並非兩者皆無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_055","year":2025,"roc_year":114,"session":"","examNo":55,"q":"下列何者可用於治療貓甲狀腺功能亢進？","opts":["A. glimepiride","B. ipodate","C. fludrocortisone","D. thyroxine"],"ans":1,"exp":"Ipodate 為含碘的放射顯影劑，可抑制甲狀腺素脫碘酶，阻斷 T4 轉換為活性較強的 T3，用於貓甲狀腺功能亢進的短期控制，常作為手術或放射碘治療前的過渡用藥。其效果通常在數週內減弱，不適合長期單獨使用。","we":["錯誤：glimepiride 為磺醯脲類（sulfonylurea）口服降血糖藥，作用於胰島 β 細胞促進胰島素分泌，與甲狀腺功能無關。","","錯誤：fludrocortisone 為礦質皮質素，用於 Addison's disease（腎上腺皮質功能低下），與甲狀腺功能亢進的治療無關。","錯誤：thyroxine（T4）是補充甲狀腺素的藥物，用於甲狀腺功能「低下」；給予甲狀腺功能亢進的貓使用 thyroxine 將使病情惡化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_056","year":2025,"roc_year":114,"session":"","examNo":56,"q":"有關人類絨毛膜性腺激素（human chorionic gonadotropin）之敘述，下列何者錯誤？","opts":["A. 主要具FSH活性","B. 主要具LH活性","C. 由懷孕婦女胎盤分泌","D. 為一種glycoprotein"],"ans":0,"exp":"人類絨毛膜性腺激素（hCG）的受體結合特性與 LH 相似，主要具有 LH 樣活性，可刺激排卵、促進黃體形成及 progesterone 分泌，在動物生殖上常作為 LH 替代品誘導排卵。hCG 幾乎不具有 FSH 活性，因此「主要具 FSH 活性」的描述為錯誤。","we":["","此為正確描述：hCG 主要具有 LH 樣活性，其結構與 LH 高度相似，可作用於 LH 受體，不符合題目問的「錯誤」描述。","此為正確描述：hCG 由懷孕婦女的胎盤滋養層細胞（trophoblast）分泌，是確認懷孕的重要生物標誌，不符合題目問的「錯誤」描述。","此為正確描述：hCG 為糖蛋白（glycoprotein）激素，由 α 和 β 次單元組成，α 次單元與 FSH、LH、TSH 相同，β 次單元具有特異性，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_057","year":2025,"roc_year":114,"session":"","examNo":57,"q":"下列有關amoxicillin的敘述，何者錯誤？","opts":["A. 胃腸吸收比ampicillin差","B. 有效對抗革蘭氏陰性好氧菌","C. 具耐酸性但不能對抗青黴素酶","D. 為廣效性抗菌劑"],"ans":0,"exp":"Amoxicillin 的口服吸收率約為 75-90%，顯著優於 ampicillin（約 30-40%），這是 amoxicillin 相對於 ampicillin 的主要藥動學優勢，因此「胃腸吸收比 ampicillin 差」的描述為錯誤。兩者同屬氨基青黴素，均具廣效性、耐酸性，但不耐青黴素酶。","we":["","此為正確描述：amoxicillin 對革蘭氏陰性好氧菌（如 E. coli、Pasteurella）有效，屬廣效性青黴素，不符合題目問的「錯誤」描述。","此為正確描述：amoxicillin 在胃酸環境中穩定（耐酸），但其 β-lactam 環易被青黴素酶（β-lactamase）水解，不符合題目問的「錯誤」描述。","此為正確描述：amoxicillin 屬廣效性（broad-spectrum）抗菌劑，對多種革蘭氏陽性及陰性菌均有效，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_058","year":2025,"roc_year":114,"session":"","examNo":58,"q":"下列有關bacitracin的敘述中，何者錯誤？","opts":["A. 作用機制為抑制細菌細胞壁的合成","B. 對螺旋體具殺菌作用","C. 臨床上常用於注射使用","D. 與neomycin併用可添加於飼料中作為生長促進劑"],"ans":2,"exp":"Bacitracin 具有強烈的腎毒性，全身性注射後可引起嚴重的腎小管損傷，因此臨床上僅限於局部外用（皮膚、眼睛、耳朵）或口服使用，「臨床上常用於注射使用」的描述為錯誤。","we":["此為正確描述：bacitracin 干擾細菌細胞壁前驅物（undecaprenyl pyrophosphate）的去磷酸化再生，阻礙細胞壁脂質載體循環，從而抑制細胞壁合成，不符合題目問的「錯誤」描述。","此為正確描述：bacitracin 對螺旋體（spirochetes）具有殺菌活性，不符合題目問的「錯誤」描述。","","此為正確描述：bacitracin 常與 neomycin 合併添加於飼料中作為生長促進劑，兩者抗菌譜互補，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_059","year":2025,"roc_year":114,"session":"","examNo":59,"q":"下列何者屬於注射型的第一代cephalosporin？","opts":["A. cefaclor","B. cefadroxil","C. cefixime","D. cephapirin"],"ans":3,"exp":"第一代頭孢菌素分為口服型（cephalexin、cefadroxil）與注射型（cephapirin、cephaloridine、cefazolin），Cephapirin 為注射型第一代頭孢菌素，常用於乳牛乳腺炎的乳管灌注治療。Cefaclor 屬第二代，cefixime 屬第三代，二者均非第一代。","we":["錯誤：cefaclor 屬第二代頭孢菌素，口服劑型，對革蘭氏陰性菌的涵蓋更廣，不屬於第一代。","錯誤：cefadroxil 為口服型第一代頭孢菌素，雖屬第一代，但為口服劑型而非注射型，不符合題意。","錯誤：cefixime 屬第三代頭孢菌素，口服劑型，對革蘭氏陰性菌涵蓋廣但不具注射型第一代的特性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_060","year":2025,"roc_year":114,"session":"","examNo":60,"q":"下列何者最適合用於犬貓及鳥，治療皮膚、呼吸道及泌尿道之感染，在牛則用於呼吸道感染症？","opts":["A. carbenicillin","B. methicillin","C. oxacillin","D. enrofloxacin"],"ans":3,"exp":"Enrofloxacin 為獸醫專用氟喹諾酮類抗菌藥，具廣效殺菌活性，核准用於犬貓（皮膚、呼吸道、泌尿道感染）及鳥類，並核准用於牛的呼吸道疾病（如 BRD，bovine respiratory disease）。其高組織穿透性與口服生體可用率使其成為多物種用藥的理想選擇。","we":["錯誤：carbenicillin 為抗假單胞菌青黴素，主要用於革蘭氏陰性菌（Pseudomonas）感染，並非廣泛用於犬貓鳥及牛呼吸道疾病的首選藥物。","錯誤：methicillin 為抗青黴素酶的半合成青黴素，主要針對 Staphylococcus aureus，目前幾乎已由 oxacillin 取代，並非多物種廣效用藥。","錯誤：oxacillin 為抗葡萄球菌的 β-lactamase 穩定青黴素，抗菌譜窄，不適合治療犬貓鳥的呼吸道、泌尿道感染及牛的 BRD。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_061","year":2025,"roc_year":114,"session":"","examNo":61,"q":"下列何者適用於具有&beta;-lactamase引起之葡萄球菌感染症，但對抗鏈球菌效果比天然青黴素差？","opts":["A. aztreonem","B. penicillin","C. methicillin","D. neomycin"],"ans":2,"exp":"Methicillin 為半合成 β-lactamase 穩定青黴素，透過龐大的側鏈空間障礙保護 β-lactam 環，能對抗產青黴素酶的葡萄球菌感染；然而，其對青黴素結合蛋白（PBP）的親和力不如天然青黴素，因此抗鏈球菌效果較天然青黴素差。","we":["錯誤：aztreonam 為單環 β-lactam（monobactam），僅對革蘭氏陰性需氧菌有效，對葡萄球菌或鏈球菌均無活性，不符合題意。","錯誤：penicillin G 為天然青黴素，對鏈球菌效果極佳，但易被 β-lactamase 水解，無法用於產酶的葡萄球菌感染。","","錯誤：neomycin 為胺基糖苷類抗生素，毒性高（腎毒性、耳毒性），僅限局部或口服使用，與 β-lactamase 的葡萄球菌感染治療選項無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_062","year":2025,"roc_year":114,"session":"","examNo":62,"q":"下列何者可以抵抗penicillinase的破壞？","opts":["A. carbenicillin","B. ampicillin","C. penicillin G","D. oxacillin"],"ans":3,"exp":"Oxacillin 屬於耐青黴素酶（penicillinase-resistant）半合成青黴素，其 β-lactam 環旁的龐大異噁唑側鏈形成空間障礙，阻止 β-lactamase 靠近並水解 β-lactam 鍵，是治療產 β-lactamase 葡萄球菌（包括 MSSA）的首選之一。","we":["錯誤：carbenicillin 為抗假單胞菌廣效青黴素，對 penicillinase 不穩定，容易被 β-lactamase 水解。","錯誤：ampicillin 為廣效氨基青黴素，但對 penicillinase 不穩定，需與 β-lactamase 抑制劑（如 sulbactam）合用才能克服此缺點。","錯誤：penicillin G 為天然青黴素，對 penicillinase 高度敏感，容易被葡萄球菌的 β-lactamase 水解失活。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_063","year":2025,"roc_year":114,"session":"","examNo":63,"q":"下列何者與胺基醣苷類（aminoglycosides）抗生素造成的不良反應較無關？","opts":["A. 耳毒性","B. 腎毒性","C. 肌肉麻痺","D. 永久齒著色"],"ans":3,"exp":"牙齒永久著色（黃褐色）是 tetracyclines 的特有不良反應，因 tetracycline 與鈣離子螯合沉積於發育中的骨骼與牙齒；aminoglycosides 不與鈣螯合，不引起牙齒著色。Aminoglycosides 的主要毒性為耳毒性（第八對腦神經受損）、腎毒性（近曲小管損傷）及神經肌肉阻斷。","we":["此為正確描述：aminoglycosides（如 gentamicin）會蓄積於內耳淋巴液，損傷耳蝸毛細胞及前庭，引起不可逆耳毒性，不符合題目問的「較無關」選項。","此為正確描述：aminoglycosides 蓄積於腎近曲小管上皮細胞，引起腎小管壞死，腎毒性是其常見且嚴重的不良反應，不符合題目問的「較無關」選項。","此為正確描述：aminoglycosides 可阻斷神經肌肉接合處（NMJ）前膜鈣離子內流及後膜 ACh 受體，高劑量可引起肌肉麻痺甚至呼吸停止，不符合題目問的「較無關」選項。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_064","year":2025,"roc_year":114,"session":"","examNo":64,"q":"下列何者易引起再生不良性貧血，不可使用於產食動物？","opts":["A. chloramphenicol","B. thiamphenicol","C. florfenicol","D. florfenicol amine"],"ans":0,"exp":"Chloramphenicol 可引起兩種骨髓抑制：一為劑量依賴性可逆性骨髓抑制，二為與劑量無關的特異體質性再生不良性貧血（aplastic anemia），後者在人類可為致命且不可逆。因其在動物性食品中無安全殘留限量，故禁用於所有產食動物。","we":["","錯誤：thiamphenicol 為 chloramphenicol 的結構類似物，引起再生不良性貧血的風險顯著較低，且在部分國家核准用於食用動物（有殘留限量規定）。","錯誤：florfenicol 為氟化 thiamphenicol 類似物，已核准用於多種食用動物（牛、豬、魚），有明確的休藥期規定，再生不良性貧血風險極低。","錯誤：florfenicol amine 為 florfenicol 的代謝物，不是獨立的治療藥物；florfenicol 本身可用於食用動物，不符合題目描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_065","year":2025,"roc_year":114,"session":"","examNo":65,"q":"動物投予lincomycin容易引起下列何種微生物過度生長，而造成動物嚴重的腸炎、結腸炎，導致下 痢、死亡？","opts":["A. Salmonella spp.","B. Staphylococcus aureus","C. Toxoplasma gondii","D. Clostridium difficile"],"ans":3,"exp":"Lincomycin（及 clindamycin）會破壞腸道正常厭氧菌叢，使 Clostridium difficile 大量繁殖並產生毒素 A 和 B，引起偽膜性腸炎（pseudomembranous colitis），可導致嚴重甚至致死性腸道病變。","we":["錯誤：Salmonella 引起腸道感染通常與飼料或環境污染有關，並非 lincomycin 使用後選擇性過度生長的特定病原。","錯誤：Staphylococcus aureus 有時可在廣效抗生素使用後過度生長，但與 lincomycin 相關的腸炎主要由 C. difficile 引起，而非 S. aureus。","錯誤：Toxoplasma gondii 為原蟲類寄生蟲，不會因抗生素使用而在腸道過度生長，且不引起抗生素相關性腸炎。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_066","year":2025,"roc_year":114,"session":"","examNo":66,"q":"下列何者與amoxicillin併用後，可用於治療penicillinase-producing細菌的感染？","opts":["A. carbenicillin","B. chlorambucil","C. clavulanate","D. cyclosporine A"],"ans":2,"exp":"Clavulanate（克拉維酸）為 β-lactamase 的自殺性底物抑制劑，可不可逆地與 β-lactamase 結合，保護 amoxicillin 的 β-lactam 環不被水解；兩者合用（如 Clavamox）可有效治療產 β-lactamase 的細菌感染。","we":["錯誤：carbenicillin 本身即為青黴素類抗生素，對 β-lactamase 不穩定，不具有 β-lactamase 抑制活性。","錯誤：chlorambucil 為烷化劑化療藥物，用於淋巴瘤等腫瘤治療，與抗菌治療及 β-lactamase 抑制無任何關係。","","錯誤：cyclosporine A 為鈣調磷酸酶（calcineurin）抑制劑，用於免疫抑制（器官移植、自體免疫疾病），與抗菌治療及 β-lactamase 抑制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_067","year":2025,"roc_year":114,"session":"","examNo":67,"q":"Polymyxin B、bacitracin與neomycin三者併用的主要目的為何？","opts":["A. 增加口服的生體可用率","B. 降低對腸道常在菌叢的影響","C. 增廣抗菌譜","D. 降低腎毒性"],"ans":2,"exp":"Polymyxin B 主要對革蘭氏陰性菌具殺菌活性（破壞細胞外膜），bacitracin 主要對革蘭氏陽性菌有效（抑制細胞壁合成），neomycin 對革蘭氏陰性及部分革蘭氏陽性菌均有效；三者合用的主要目的是增廣整體抗菌譜，以達到廣效的局部抗菌覆蓋。","we":["錯誤：三者均口服不吸收或毒性高而僅限局部使用，此組合並不能增加口服生體可用率；增廣抗菌譜才是合用的主要原因。","錯誤：此組合用於局部給藥，目的是擴大抗菌涵蓋範圍；降低對腸道常在菌叢的影響並非此局部外用組合的主要考量。","","錯誤：neomycin 本身具有腎毒性，三者合用並不能降低腎毒性；降低腎毒性需透過劑量調整或使用毒性較低的替代藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_068","year":2025,"roc_year":114,"session":"","examNo":68,"q":"下列胺基醣苷類（aminoglycosides）中，何者因毒性強，而最好僅使用於局部或口服投 藥？","opts":["A. amikacin","B. apramycin","C. gentamicin","D. neomycin"],"ans":3,"exp":"Neomycin 是胺基糖苷類中腎毒性及耳毒性最強的藥物，全身性使用（注射）會導致嚴重不可逆的腎衰竭與耳毒性，因此臨床上僅限於局部外用（皮膚、眼、耳）或口服（不吸收，用於腸道去污）。","we":["錯誤：amikacin 雖具腎毒性及耳毒性，但相對於 neomycin 毒性較低，且對抗 gentamicin 抗藥菌有效，可在監控腎功能下全身性使用（注射）。","錯誤：apramycin 主要用於豬、牛的腸道感染，毒性雖存在但不及 neomycin 嚴重，在獸醫學有注射劑型的核准使用。","錯誤：gentamicin 為廣泛使用的注射型胺基糖苷類抗生素，有腎毒性及耳毒性風險，需監控用藥，但其系統性使用是被核准且常見的，不若 neomycin 般受限。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_069","year":2025,"roc_year":114,"session":"","examNo":69,"q":"下列何者會因併用而使療效變差？","opts":["A. amphotericin B＋flucytosine","B. ciprofloxacin＋azlocillin","C. penicillin＋tetracycline","D. sulfamethoxazole＋trimethoprim"],"ans":2,"exp":"Penicillin 為殺菌性抗生素，作用於正在合成細胞壁的活躍分裂細菌；tetracycline 為抑菌性抗生素，使細菌停止生長分裂，導致 penicillin 失去作用標的，兩者合用產生藥理拮抗（antagonism），使整體療效降低。","we":["錯誤：amphotericin B 與 flucytosine 合用對抗深部真菌感染（如隱球菌）具有協同效果，amphotericin B 增加細胞膜通透性，有助 flucytosine 進入菌體。","錯誤：ciprofloxacin（喹諾酮類）與 azlocillin（廣效青黴素）合用對 Pseudomonas 等革蘭氏陰性菌具有協同或相加效果，不會產生拮抗。","","錯誤：sulfamethoxazole 與 trimethoprim 合用（Co-trimoxazole）分別阻斷葉酸合成的不同步驟，具有顯著協同效果，是經典的協同抗菌組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_070","year":2025,"roc_year":114,"session":"","examNo":70,"q":"下列何種抗病毒藥不屬於核苷酸類似物？","opts":["A. cidofovir","B. AZT","C. idoxuridine","D. L-lysine"],"ans":3,"exp":"L-lysine 為必需胺基酸，其抗病毒機制是透過競爭性抑制精胺酸（arginine）的腸道吸收與細胞攝取，降低胞內精胺酸濃度，進而抑制疱疹病毒複製所需的精胺酸代謝；此機制與核苷酸類似物（nucleoside/nucleotide analogue）阻斷病毒 DNA 聚合酶的機制完全不同。","we":["錯誤：cidofovir 為核苷酸類似物（無環嘌呤磷酸鹽），摻入病毒 DNA 鏈後終止複製，屬於核苷酸類似物。","錯誤：AZT（zidovudine）為核苷類似物，摻入 HIV 逆轉錄酶合成的 DNA 中並終止鏈延長，屬於核苷類似物。","錯誤：idoxuridine 為碘化尿苷類似物，可取代胸腺嘧啶嵌入病毒 DNA，干擾複製，屬於核苷類似物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_071","year":2025,"roc_year":114,"session":"","examNo":71,"q":"下列何種抗真菌藥物腸胃道不吸收，故多以靜脈注射方式投藥？","opts":["A. terbinafine","B. amphotericin B","C. itraconazole","D. griseofulvin"],"ans":1,"exp":"Amphotericin B 為多烯大環內酯抗真菌藥，口服後幾乎完全不被腸道吸收（因極性大、分子量高），需靜脈注射（傳統製劑或脂質體製劑）才能達到治療深部真菌感染所需的全身血中濃度。其作用機制為與真菌細胞膜的 ergosterol 結合，形成離子通道導致細胞內容物外漏。","we":["錯誤：terbinafine 為丙烯胺類抗真菌藥，口服吸收良好（約 70% 以上），口服劑型廣泛用於系統性及皮膚真菌感染。","","錯誤：itraconazole 為三唑類抗真菌藥，有口服膠囊及溶液劑型，以食物同服可提高吸收；用於系統性及皮膚真菌感染。","錯誤：griseofulvin 口服可吸收（以脂肪性餐食同服可提高吸收），用於皮膚、毛髮、指甲的表淺性真菌感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_072","year":2025,"roc_year":114,"session":"","examNo":72,"q":"下列何者成分之藥效與抑制ergosterol合成無關？","opts":["A. miconazole","B. clotrimazole","C. metronidazole","D. ketoconazole"],"ans":2,"exp":"Metronidazole 為硝基咪唑類藥物，其抗原蟲與抗厭氧菌的機制是在無氧環境中被還原為自由基，直接損傷 DNA，與真菌 ergosterol 合成的抑制機制完全無關。Miconazole、clotrimazole 及 ketoconazole 均為唑類抗真菌藥，透過抑制 CYP51（羊毛甾醇 14α-去甲基酶）阻斷 ergosterol 合成。","we":["錯誤：miconazole 為咪唑類抗真菌藥，抑制 CYP51 酵素阻斷 ergosterol 合成，其抗真菌藥效與抑制 ergosterol 合成高度相關。","錯誤：clotrimazole 為咪唑類抗真菌藥，同樣透過抑制 CYP51 阻斷 ergosterol 合成，用於局部真菌感染治療。","","錯誤：ketoconazole 為咪唑類抗真菌藥，對 CYP51 的抑制是其主要抗真菌機制，與 ergosterol 合成抑制密切相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_073","year":2025,"roc_year":114,"session":"","examNo":73,"q":"常用於治療犬傳染性花柳性腫瘤（canine transmissible venereal tumor, CTVT）的化療藥物是 下列何者？","opts":["A. 5-fluorouracil","B. 6-mercaptopurine","C. paclitaxel","D. vincristine"],"ans":3,"exp":"Vincristine 為長春花生物鹼（vinca alkaloid），透過結合微管蛋白（tubulin）阻止微管聚合，使細胞停留於有絲分裂中期，是治療犬傳染性花柳性腫瘤（CTVT）的第一線化療藥物，單藥治療緩解率可達 90% 以上。","we":["錯誤：5-fluorouracil（5-FU）為嘧啶類抗代謝藥物，且對貓具致死性神經毒性；在犬的 CTVT 治療中並非標準用藥，vincristine 療效更佳且安全性更高。","錯誤：6-mercaptopurine 為嘌呤類抗代謝藥物，用於淋巴性白血病等，不是 CTVT 的標準化療選擇。","錯誤：paclitaxel 為紫杉烷類（taxane）藥物，促進微管穩定而非抑制聚合，主要用於人類上皮性腫瘤；不是 CTVT 的一線用藥。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_074","year":2025,"roc_year":114,"session":"","examNo":74,"q":"癌症患犬接受ifosfamide治療，於靜脈注射藥物前後應給與大量生理鹽水的主要目的為何？","opts":["A. 維持足夠的循環血量以避免休克","B. 補充水分以加速藥物代謝","C. 補充水分以防止動物脫水","D. 促進排尿以降低腎臟毒性"],"ans":3,"exp":"Ifosfamide 在體內代謝產生丙烯醛（acrolein），此代謝物在腎小管及膀胱黏膜具有直接毒性，可引起出血性膀胱炎及腎小管損傷；靜脈輸注大量生理食鹽水可稀釋並加速 acrolein 經腎臟排出，降低其在尿路中的停留濃度，從而減少腎臟及膀胱毒性。","we":["錯誤：ifosfamide 引起的主要急性毒性是 acrolein 對腎臟與膀胱的直接損傷，而非低血容休克；輸液的主要目的是促進排尿稀釋毒性代謝物，而非維持循環血量。","錯誤：大量生理食鹽水並非為了加速 ifosfamide 本身的代謝，而是為了稀釋並沖洗 acrolein 代謝物，防止其在尿路中累積造成損傷。","錯誤：雖然補充水分可防止脫水，但 ifosfamide 輸液的主要目的是促進 acrolein 的腎臟排泄，降低其在膀胱及腎小管的毒性濃度，而非單純防止脫水。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_075","year":2025,"roc_year":114,"session":"","examNo":75,"q":"下列何者因會引起致死性的神經毒性，而不可使用於貓？","opts":["A. doxorubicin","B. 5-fluorouracil","C. gemcitabine","D. methotrexate"],"ans":1,"exp":"5-Fluorouracil（5-FU）對貓具有物種特異性的致死性神經毒性，即使極低劑量（甚至皮膚外用製劑接觸）亦可引起嚴重的神經系統症狀（癲癇、共濟失調）並在短時間內死亡，機制尚未完全明確，但貓對 5-FU 代謝異常敏感，臨床上貓絕對禁用。","we":["錯誤：doxorubicin 雖具有心臟毒性（心肌病變）和一般化療毒性（骨髓抑制），但並非因「致死性神經毒性」而禁用於貓；且 doxorubicin 在特定適應症下可謹慎用於貓。","","錯誤：gemcitabine 為核苷類似物化療藥，貓可在監控下使用，並無致死性神經毒性的特異性禁忌（相對安全性較 5-FU 高）。","錯誤：methotrexate 為葉酸拮抗劑，貓可在謹慎監控下使用，其毒性主要為骨髓抑制與胃腸道毒性，而非物種特異性神經毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_076","year":2025,"roc_year":114,"session":"","examNo":76,"q":"下列關於鉑類抗腫瘤藥物（platinating agents）的藥理機制，何者正確？","opts":["A. 結構類似嘌呤（purines），讓DNA鹼基進行配對時發生錯誤","B. 與細胞的DNA交互連結，導致DNA雙股無法分離並複製","C. 抑制微管形成，導致細胞無法進行有絲分裂","D. 抑制第二型拓樸異構酶（topoisomerase Ⅱ），導致DNA雙股無法分離並複製"],"ans":1,"exp":"鉑類抗腫瘤藥（cisplatin、carboplatin、oxaliplatin）在水溶液中水解後，與 DNA 鳥嘌呤的 N7 位置形成鏈內或鏈間交叉連結（intrastrand/interstrand crosslink），使 DNA 雙股無法正常解開，阻礙 DNA 複製與轉錄，最終誘導腫瘤細胞凋亡。","we":["錯誤：使 DNA 鹼基配對錯誤的機制屬於嘌呤類似物（如 6-mercaptopurine）的作用；鉑類藥物是透過 DNA 交叉連結而非鹼基配對錯誤發揮作用。","","錯誤：抑制微管形成（阻止微管聚合）是 vinca alkaloid（如 vincristine）的機制；鉑類藥物作用於 DNA 而非微管。","錯誤：抑制 topoisomerase II 是 doxorubicin（蒽環類）等藥物的機制；鉑類藥物透過 DNA 共價結合而非拓撲異構酶抑制發揮抗腫瘤效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_077","year":2025,"roc_year":114,"session":"","examNo":77,"q":"Fenbendazole對下列何者無效？","opts":["A. 豬肺蟲（Metastrongylus sp.）","B. 馬蛔蟲（Parascaris sp.）","C. 牛肺蟲（Dictyocaulus sp.）","D. 牛絲狀蟲（Setaria sp.）"],"ans":3,"exp":"Fenbendazole 為苯咪唑類驅蟲藥，透過結合 β-tubulin 抑制微管聚合，對多種線蟲有效，包括豬肺蟲（Metastrongylus）、馬蛔蟲（Parascaris）及牛肺蟲（Dictyocaulus）；然而對絲狀蟲（Filarioidea），如 Setaria 屬，效果不佳，此類寄生蟲通常需使用大環內酯類（如 ivermectin）或其他特定藥物。","we":["此為正確描述：fenbendazole 對豬肺蟲（Metastrongylus spp.）有效，可用於豬的肺蟲感染治療，不符合題目問的「無效」選項。","此為正確描述：fenbendazole 對馬蛔蟲（Parascaris equorum）有效，是馬匹驅蟲的常用選擇之一，不符合題目問的「無效」選項。","此為正確描述：fenbendazole 對牛肺蟲（Dictyocaulus viviparus）有效，可用於控制牛的肺蟲病，不符合題目問的「無效」選項。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_078","year":2025,"roc_year":114,"session":"","examNo":78,"q":"治療犬焦蟲Babesia spp.，可以使用imidocarb治療，其作用機制為：","opts":["A. 抑制犬體內焦蟲配子體的結合，以中斷其生活史","B. 抑制焦蟲粒線體的功能，中斷滋養體的生物功能","C. 與焦蟲DNA結合，干擾寄生蟲核酸複製","D. 溶解焦蟲蟲體，造成其死亡"],"ans":2,"exp":"Imidocarb dipropionate 屬於脒基（amidine）類化合物，其抗焦蟲機制是嵌入（intercalate）Babesia 蟲體的 DNA 小溝（minor groove），干擾 DNA 複製與核酸合成，使滋養體（trophozoite）無法正常繁殖而死亡。","we":["錯誤：抑制配子體結合中斷生活史是某些抗瘧疾藥物（如 primaquine）的機制；imidocarb 主要作用於滋養體的 DNA，而非配子體階段。","錯誤：抑制粒線體功能中斷滋養體生物功能是 atovaquone（作用於線粒體電子傳遞鏈）的機制；imidocarb 的主要作用靶點是 DNA 而非粒線體。","","錯誤：imidocarb 並非透過直接溶解蟲體來殺蟲，而是透過 DNA 交互作用干擾核酸複製，使蟲體無法繁殖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_079","year":2025,"roc_year":114,"session":"","examNo":79,"q":"下列藥物何者無法控制或治療梨形鞭毛蟲症（giardiasis）？","opts":["A. albendazole","B. metronidazole","C. terbinafine","D. nitazoxanide"],"ans":2,"exp":"Terbinafine 為丙烯胺類抗真菌藥，透過抑制真菌的角鯊烯環氧酶（squalene epoxidase）阻斷 ergosterol 合成，僅對真菌有效，對寄生性原蟲（如 Giardia）完全無抗原蟲活性，因此無法用於治療梨形鞭毛蟲病（giardiasis）。","we":["錯誤：albendazole 為苯咪唑類藥物，除驅蟲外亦具有抗 Giardia 活性，可用於梨形鞭毛蟲病的治療。","錯誤：metronidazole 為治療 giardiasis 的第一線藥物，透過在無氧環境中還原為毒性自由基損傷 Giardia 的 DNA，療效確實。","","錯誤：nitazoxanide 為廣效抗原蟲藥物，對 Giardia 及 Cryptosporidium 均有效，是治療 giardiasis 的有效選項之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_080","year":2025,"roc_year":114,"session":"","examNo":80,"q":"Fipronil與下列何者併用可殺滅發育階段的跳蚤？","opts":["A. imiquimod","B. tacrolimus","C. ecoxia","D. methoprene"],"ans":3,"exp":"Methoprene 為昆蟲生長調節劑（IGR），是幼蟲保幼激素（juvenile hormone）的類似物，可阻止跳蚤幼蟲蛻變為成蟲，使跳蚤無法完成生活史；與 fipronil（殺成蟲劑，GABA 受體氯離子通道阻斷劑）合用，可同時殺滅成蟲與發育階段（幼蟲、蛹），達到全面防治效果。","we":["錯誤：imiquimod 為 toll-like receptor 7/8 促進劑，用於刺激免疫反應治療病毒性皮膚疣或表淺性腫瘤，與跳蚤防治無關。","錯誤：tacrolimus 為鈣調磷酸酶抑制劑（calcineurin inhibitor），用於免疫調節治療異位性皮膚炎，無殺蟲或蟲體發育抑制作用。","錯誤：ecoxia 非已知的標準跳蚤防治成分；此選項在跳蚤生長調節的藥理學中並無依據。",""],"needs_review":false,"imgs":[]}];

let currentUser=null;
const ACCOUNTS_KEY='vetquiz_accounts';
const CUR_USER_KEY='vetquiz_current_user';
const SAVE_KEY_BASE='vetquiz_yaoli_v1';
const NOTES_KEY_BASE='vetquiz_yaoli_notes_v1';
function getAccounts(){try{return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)||'{}');}catch(e){return {};}}
function saveAccounts(a){localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(a));}
function getUserSaveKey(){return SAVE_KEY_BASE+'_'+currentUser;}
function getUserNotesKey(){return NOTES_KEY_BASE+'_'+currentUser;}
async function hashPin(text){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('VetQuiz:'+text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function setMsg(id,msg,color){const el=document.getElementById(id);if(el){el.textContent=msg;el.style.color=color||'#f08080';}}
function showLoginScreen(hint){
  document.getElementById('us-screen').style.display='flex';
  document.getElementById('us-reg-screen').style.display='none';
  document.getElementById('main-app').style.display='none';
  setMsg('us-msg',hint||'','');
  setTimeout(()=>{const i=document.getElementById('us-name');if(i){i.value='';i.focus();}},80);
  const p=document.getElementById('us-pin');if(p)p.value='';
}
function showRegisterScreen(){
  document.getElementById('us-screen').style.display='none';
  document.getElementById('us-reg-screen').style.display='flex';
  document.getElementById('main-app').style.display='none';
  setMsg('reg-msg','','');
  setTimeout(()=>{const i=document.getElementById('reg-name');if(i){i.value='';i.focus();}},80);
  ['reg-pin','reg-pin2'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
}
async function login(){
  const name=(document.getElementById('us-name').value||'').trim();
  const pin=document.getElementById('us-pin').value||'';
  if(!name){setMsg('us-msg','請輸入姓名');return;}
  const accs=getAccounts();
  if(!accs[name]){setMsg('us-msg','帳號不存在，請建立新帳號');return;}
  const hash=await hashPin(pin);
  if(hash!==accs[name]){setMsg('us-msg','密碼錯誤');return;}
  enterApp(name);
}
async function register(){
  const name=(document.getElementById('reg-name').value||'').trim();
  const pin=document.getElementById('reg-pin').value||'';
  const pin2=document.getElementById('reg-pin2').value||'';
  if(!name){setMsg('reg-msg','請輸入姓名');return;}
  if(name.length>24){setMsg('reg-msg','名稱最多24個字元');return;}
  if(!pin){setMsg('reg-msg','請設定密碼');return;}
  if(pin!==pin2){setMsg('reg-msg','兩次密碼不一致');return;}
  const accs=getAccounts();
  if(accs[name]){setMsg('reg-msg','此名稱已被使用，請換一個或回登入頁');return;}
  accs[name]=await hashPin(pin);
  saveAccounts(accs);
  enterApp(name);
}
function enterApp(name){
  currentUser=name;
  localStorage.setItem(CUR_USER_KEY,name);
  qStates={};errorCounts={};unsureSet={};notesStore={};
  state={qi:0,done:0,cor:0};mode=0;curFilter='all';
  loadNotes();loadProgress();
  document.getElementById('us-screen').style.display='none';
  document.getElementById('us-reg-screen').style.display='none';
  document.getElementById('main-app').style.display='';
  document.getElementById('cur-user-name').textContent=name;
  const yrsel=document.getElementById('yrsel');if(yrsel)yrsel.value='all';
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===0)});
  render();
}
function logout(){
  currentUser=null;localStorage.removeItem(CUR_USER_KEY);
  qStates={};errorCounts={};unsureSet={};notesStore={};state={qi:0,done:0,cor:0};
  showLoginScreen();
}
function deleteOwnAccount(){
  if(!currentUser)return;
  if(!confirm(`確定刪除帳號「${currentUser}」的所有資料？\n此操作無法復原，會立即登出。`))return;
  const accs=getAccounts();delete accs[currentUser];saveAccounts(accs);
  localStorage.removeItem(getUserSaveKey());localStorage.removeItem(getUserNotesKey());
  logout();
}
function switchUser(){logout();}
let mode=0,curFilter='all',state={qi:0,done:0,cor:0},qStates={},errorCounts={},unsureSet={},notesStore={},navOpen=false;
function saveNotes(){try{localStorage.setItem(getUserNotesKey(),JSON.stringify(notesStore));}catch(e){alert('儲存空間不足，請刪除部分筆記圖片後重試。');}}
function loadNotes(){try{const d=JSON.parse(localStorage.getItem(getUserNotesKey())||'null');if(d)notesStore=d;}catch(e){}}
function getNote(id){return notesStore[id]||(notesStore[id]={text:'',imgs:[]});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function saveNoteText(id,text){getNote(id).text=text;saveNotes();}
function compressImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=720;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleNoteImgs(id,fcIdx,input){
  const files=Array.from(input.files);if(!files.length)return;
  const note=getNote(id);
  for(const f of files){try{note.imgs.push(await compressImg(f));}catch(e){}}
  saveNotes();renderNoteImgs(id,fcIdx);input.value='';
}
function removeNoteImg(id,i,fcIdx){
  const note=getNote(id);note.imgs.splice(i,1);saveNotes();renderNoteImgs(id,fcIdx);
}
function renderNoteImgs(id,fcIdx){
  const el=document.getElementById('ni-'+fcIdx);if(!el)return;
  const imgs=getNote(id).imgs;
  el.innerHTML=imgs.map((src,i)=>`<div class="note-img-wrap"><img src="${src}" alt="筆記圖片" onclick="viewImg('${src}')"><button class="note-img-del" onclick="removeNoteImg('${id}',${i},${fcIdx})" title="刪除">✕</button></div>`).join('');
}
function viewImg(src){
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;padding:1rem';
  m.innerHTML=`<img src="${src}" style="max-width:100%;max-height:90vh;border-radius:8px">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);
}

function saveProgress(){if(!currentUser)return;try{localStorage.setItem(getUserSaveKey(),JSON.stringify({qStates,errorCounts,unsureSet,mode,curFilter,qi:state.qi}));}catch(e){}}
function loadProgress(){
  if(!currentUser)return;
  try{
    const d=JSON.parse(localStorage.getItem(getUserSaveKey())||'null');
    if(!d)return;
    if(d.qStates)qStates=d.qStates;
    if(d.errorCounts)errorCounts=d.errorCounts;
    if(d.unsureSet)unsureSet=d.unsureSet;
    if(d.mode!==undefined)mode=d.mode;
    if(d.curFilter)curFilter=d.curFilter;
    recalcStats();
    const qs=getQs();
    state.qi=Math.min(Math.max(d.qi||0,0),Math.max(qs.length-1,0));
  }catch(e){}
}
function recalcStats(){
  const qs=getQs();state.done=0;state.cor=0;
  qs.forEach(q=>{const st=qStates[q.id];if(st){state.done++;if(st==='ok')state.cor++;}});
}
function clearProgress(){
  if(!confirm('確定清除所有作答記錄與錯題歷史？此操作無法復原。'))return;
  qStates={};errorCounts={};unsureSet={};state={qi:0,done:0,cor:0};
  try{localStorage.removeItem(getUserSaveKey());}catch(e){}
  render();
}
function toggleNav(){
  navOpen=!navOpen;
  const g=document.getElementById('nav-grid');
  const a=document.getElementById('nav-arrow');
  if(navOpen){g.classList.remove('hidden');a.classList.add('open');}
  else{g.classList.add('hidden');a.classList.remove('open');}
}
function renderNav(){
  const g=document.getElementById('nav-grid');
  if(!g)return;
  const qs=getQs();
  g.innerHTML=qs.map((q,i)=>{
    const st=qStates[q.id];
    const ec=errorCounts[q.id]||0;
    const isUnsure=!!unsureSet[q.id];
    let cls='qnb'+(i===state.qi?' cur':'');
    if(st==='ok')cls+=isUnsure?' ans-unsure':' ans-ok';
    else if(st)cls+=' ans-no';
    else if(isUnsure)cls+=' ans-unsure';
    const ecBadge=ec>=2?`<sup style="font-size:8px;color:#f0c060;margin-left:1px">${ec}</sup>`:'';
    const unsureDot=isUnsure&&st==='ok'?`<sup style="font-size:8px;color:var(--yellow);margin-left:1px">?</sup>`:'';
    return `<button class="${cls}" onclick="jumpTo(${i})" title="民國${q.roc_year}年 第${q.examNo}題${ec?' | 錯'+ec+'次':''}${isUnsure?' | ⚠️ 不確定':''}">${q.examNo}${ecBadge}${unsureDot}</button>`;
  }).join('');
}
function jumpTo(idx){
  state.qi=idx;render();
  const area=document.getElementById('area');
  if(area)area.scrollIntoView({behavior:'smooth',block:'start'});
}
function setM(m){
  mode=m;
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===m)});
  state={qi:0,done:0,cor:0};recalcStats();saveProgress();render();
}
function setFilter(v){
  curFilter=v;state={qi:0,done:0,cor:0};recalcStats();saveProgress();render();
}
function getQs(){
  if(curFilter==='all')return ALL_QS;
  const m=curFilter.match(/^(\d{4})-([12])$/);
  if(m)return ALL_QS.filter(q=>String(q.year)===m[1]&&q.session===m[2]);
  return ALL_QS.filter(q=>String(q.year)===curFilter&&!q.session);
}
function setProg(p){const f=document.getElementById('pf');if(f)f.style.width=p+'%';}
function updStats(){
  const qs=getQs();
  document.getElementById('qtotal').textContent=qs.length;
  document.getElementById('sd').textContent=state.done;
  document.getElementById('sc').textContent=state.cor;
  document.getElementById('sa').textContent=state.done?Math.round(state.cor/state.done*100)+'%':'—';
}
function getWrongQs(){
  return getQs().filter(q=>qStates[q.id]&&qStates[q.id].startsWith('no'));
}
function getReviewQs(){
  return getQs().filter(q=>(qStates[q.id]&&qStates[q.id].startsWith('no'))||unsureSet[q.id]);
}
function render(){
  const a=document.getElementById('area');
  updStats();renderNav();
  if(mode===0)renderQ(a);
  else if(mode===1)renderFlashcards(a);
  else renderSummary(a);
}
function renderFlashcards(a){
  const reviewQs=getReviewQs();
  if(!reviewQs.length){
    a.innerHTML=`<div class="card" style="text-align:center;padding:2.5rem 1rem">
      <div style="font-size:2.2rem;margin-bottom:.75rem">🎯</div>
      <div style="font-size:15px;color:var(--text2);margin-bottom:.5rem">目前沒有複習字卡</div>
      <div style="font-size:12px;color:var(--text3)">答錯或標記「不確定」的題目，會自動在這裡生成翻轉字卡</div>
    </div>`;return;
  }
  const wCnt=reviewQs.filter(q=>qStates[q.id]&&qStates[q.id].startsWith('no')).length;
  const uCnt=reviewQs.filter(q=>unsureSet[q.id]).length;
  const countLabel=[wCnt?`答錯 ${wCnt} 題`:'',uCnt?`不確定 ${uCnt} 題`:''].filter(Boolean).join('、');
  let html=`<div style="margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <span style="font-size:12px;color:var(--text3);font-family:'Courier New',monospace">共 ${reviewQs.length} 張字卡（${countLabel}）· 點擊翻面</span>
    <button class="btn-clr" onclick="expandAllFC()">全部展開</button>
  </div>`;
  reviewQs.forEach((q,idx)=>{
    const isWrong=qStates[q.id]&&qStates[q.id].startsWith('no');
    const isUnsure=!!unsureSet[q.id];
    const picked=parseInt((qStates[q.id]||'').split('-')[1]);
    const pickedLetter=isNaN(picked)?'?':String.fromCharCode(65+picked);
    const ansLetter=String.fromCharCode(65+q.ans);
    const sessionLabel=q.session?` 第${q.session}次`:'';
    const ec=errorCounts[q.id]||0;
    const ecTag=ec>=2?`<span style="font-size:10px;color:#f0c060;margin-left:5px">✕${ec}次</span>`:'';
    const tags=[
      isWrong?`<span class="bdg wrong-tag">答錯</span>`:'',
      isUnsure?`<span class="bdg unsure-tag">⚠️ 不確定</span>`:'',
    ].filter(Boolean).join('');
    const frontNote=isWrong
      ?`<div style="font-size:12px;color:#f08080;margin-top:.5rem">你選了 (${pickedLetter}) — 點擊查看正確答案</div>`
      :`<div style="font-size:12px;color:var(--yellow);margin-top:.5rem">已標記不確定 — 點擊確認正確答案</div>`;
    const note=getNote(q.id);
    const noteImgsHtml=note.imgs.map((src,i)=>`<div class="note-img-wrap"><img src="${src}" alt="筆記圖片" onclick="viewImg('${src}')"><button class="note-img-del" onclick="removeNoteImg('${q.id}',${i},${idx})" title="刪除">✕</button></div>`).join('');
    html+=`<div class="fc-container">
      <div class="fc-wrap" onclick="this.classList.toggle('flipped')" id="fc${idx}">
        <div class="fc-front">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:.55rem">
            <span style="font-size:11px;color:var(--text3);font-family:'Courier New',monospace">民國${q.roc_year}年${sessionLabel} 第${q.examNo}題${ecTag}</span>
            ${tags}
          </div>
          <div style="font-size:14px;color:var(--text);line-height:1.7">${q.q}</div>
          ${frontNote}
        </div>
        <div class="fc-back">
          <div style="font-size:11px;color:var(--green);font-family:'Courier New',monospace;margin-bottom:.5rem">✓ 正確答案：(${ansLetter})</div>
          <div style="font-size:14px;color:#7dd9a4;margin-bottom:.7rem;font-weight:600">${q.opts[q.ans].replace(/^[A-D]\. /,'')}</div>
          <div style="font-size:12px;color:var(--text2);line-height:1.75">${q.exp}</div>
        </div>
        <div class="fc-hint">▸ 點擊翻面</div>
      </div>
      <div class="fc-note" onclick="event.stopPropagation()">
        <div class="fc-note-hdr">
          <span class="fc-note-label">📝 筆記</span>
          <label class="btn-note-img" for="ni-input-${idx}">＋ 上傳圖片</label>
          <input type="file" id="ni-input-${idx}" accept="image/*" multiple style="display:none" onchange="handleNoteImgs('${q.id}',${idx},this)">
        </div>
        <textarea class="fc-note-ta" placeholder="在這裡寫下筆記…" oninput="saveNoteText('${q.id}',this.value)">${esc(note.text)}</textarea>
        <div class="note-imgs" id="ni-${idx}">${noteImgsHtml}</div>

  a.innerHTML=html;

function expandAllFC(){
  document.querySelectorAll('.fc-wrap').forEach(el=>el.classList.add('flipped'));
}
function renderSummary(a){
  const reviewQs=getReviewQs();
  if(!reviewQs.length){
    a.innerHTML=`<div class="card" style="text-align:center;padding:2.5rem 1rem">
      <div style="font-size:2.2rem;margin-bottom:.75rem">🎉</div>
      <div style="font-size:15px;color:var(--text2);margin-bottom:.5rem">目前沒有需要複習的題目</div>
      <div style="font-size:12px;color:var(--text3)">答錯或標記「不確定」的題目，重點整理會出現在這裡</div>
    </div>`;return;
  }
  const wCnt=reviewQs.filter(q=>qStates[q.id]&&qStates[q.id].startsWith('no')).length;
  const uCnt=reviewQs.filter(q=>unsureSet[q.id]).length;
  const countLabel=[wCnt?`答錯 ${wCnt} 題`:'',uCnt?`不確定 ${uCnt} 題`:''].filter(Boolean).join('、');
  let html=`<div style="margin-bottom:1rem;font-size:12px;color:var(--text3);font-family:'Courier New',monospace">共 ${reviewQs.length} 題需複習（${countLabel}）</div>`;
  reviewQs.forEach(q=>{
    const isWrong=qStates[q.id]&&qStates[q.id].startsWith('no');
    const isUnsure=!!unsureSet[q.id];
    const picked=parseInt((qStates[q.id]||'').split('-')[1]);
    const pickedLetter=isNaN(picked)?'?':String.fromCharCode(65+picked);
    const ansLetter=String.fromCharCode(65+q.ans);
    const sessionLabel=q.session?` 第${q.session}次`:'';
    const ec=errorCounts[q.id]||0;
    const wexp=(!isNaN(picked)&&q.we&&q.we[picked])?q.we[picked]:'';
    const tags=[
      isWrong?`<span class="bdg wrong-tag">答錯</span>`:'',
      isUnsure?`<span class="bdg unsure-tag">⚠️ 不確定</span>`:'',
    ].filter(Boolean).join(' ');
    html+=`<div class="sp-card">
      <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:.5rem">
        <span style="font-size:11px;color:var(--text3);font-family:'Courier New',monospace">民國${q.roc_year}年${sessionLabel} 第${q.examNo}題${ec>1?` · 錯 ${ec} 次`:''}</span>
        ${tags}
      </div>
      <div class="sp-q">${q.q}</div>
      <div class="sp-ans">✓ 正確答案：(${ansLetter}) ${q.opts[q.ans].replace(/^[A-D]\. /,'')}</div>
      <div class="sp-exp">${q.exp}</div>
      ${wexp?`<div class="sp-wrong">你選了 (${pickedLetter})：${wexp}</div>`:''}
    </div>`;
  });
  a.innerHTML=html;
}
function startExam(){
  const qs=getQs();
  const unanswered=qs.filter(q=>!qStates[q.id]);
  const label=curFilter==='all'?'全部題目':document.getElementById('yrsel').options[document.getElementById('yrsel').selectedIndex].text;
  const msg=unanswered.length===qs.length
    ?`開始測驗：${label}（${qs.length} 題）？`
    :`「${label}」還有 ${unanswered.length} 題未作答。\n\n• 繼續作答剩餘題目：點「繼續」\n• 重新測驗全部：點「重新開始」`;
  if(unanswered.length===qs.length){
    if(!confirm(msg))return;
  }else{
    const choice=confirm(msg+'\n\n（確定 = 重新開始，取消 = 繼續作答）');
    if(choice){
      qs.forEach(q=>{delete qStates[q.id];delete errorCounts[q.id];delete unsureSet[q.id];});
      state={qi:0,done:0,cor:0};saveProgress();
    }else{
      const firstUnanswered=qs.findIndex(q=>!qStates[q.id]);
      if(firstUnanswered>=0)state.qi=firstUnanswered;
    }
  }
  mode=0;
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===0)});
  recalcStats();saveProgress();render();
}
function renderQ(a){
  const qs=getQs();
  if(!qs.length){a.innerHTML='<div class="card" style="text-align:center;color:var(--text3);padding:2rem">此年份暫無題目</div>';return;}
  if(state.qi>=qs.length){
    setProg(100);
    const pct=state.done?Math.round(state.cor/state.done*100):0;
    const reviewCount=getReviewQs().length;
    const wrongBtns=reviewCount>0?`
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn" onclick="setM(1)" style="border-color:var(--green-border);color:#7dd9a4">字卡複習 ${reviewCount} 題</button>
        <button class="btn" onclick="setM(2)" style="border-color:var(--accent)">重點整理</button>
      </div>`:'';
    a.innerHTML=`<div class="card res"><div class="res-s mono">${pct}%</div>
    <div class="res-sub">全部 ${qs.length} 題完成！</div>
    <div class="res-row">
      <div class="ri"><div class="rn grn">${state.cor}</div><div class="rl">答對</div></div>
      <div class="ri"><div class="rn red">${state.done-state.cor}</div><div class="rl">答錯</div></div>
      <div class="ri"><div class="rn">${qs.length}</div><div class="rl">總題數</div></div>
    </div>
    ${wrongBtns}
    <button class="btn btnp" onclick="restartQuiz()" style="margin-top:12px">重新練習</button></div>`;
    return;
  }
  const q=qs[state.qi];
  const answered=qStates[q.id];
  const ec=errorCounts[q.id]||0;
  setProg(Math.round(state.qi/qs.length*100));
  const noteHtml=q.note?`<div class="note-box">注意：${q.note}</div>`:'';
  const pickedIdx=answered&&answered.startsWith('no')?parseInt(answered.split('-')[1]):-1;
  let optsHtml=q.opts.map((o,i)=>{
    let cls='opt';let oc='';
    if(answered){
      if(i===q.ans){cls+=' dis ok';}
      else if(i===pickedIdx){cls+=' no';oc=`onclick="peekWexp(${i})"`;}
      else{cls+=' peek';oc=`onclick="peekWexp(${i})"`;}
    }else{oc=`onclick="pick(${i},${q.ans})"`;}
    return `<div class="${cls}" id="o${i}" ${oc}><span class="okey mono">${String.fromCharCode(65+i)}</span><span>${o.replace(/^[A-D]\. /,'')}</span></div>`;
  }).join('');
  const expShow=answered?'show':'';
  let wexpShow='',wexpBody='',wexpTitle='你可能選這個，是因為&#x2026;&#x2026;';
  if(answered&&pickedIdx>=0&&q.we&&q.we[pickedIdx]&&q.we[pickedIdx]!==''){
    wexpShow='show';wexpBody=q.we[pickedIdx];
  }
  const nbDisplay=answered?'':'none';
  const ecBadge=ec>0?`<span class="bdg ec-badge">錯誤 ${ec} 次</span>`:'';
  const isUnsure=!!unsureSet[q.id];
  const unsureBtn=answered?`<button class="btn btn-unsure${isUnsure?' active':''}" id="unsure-btn" onclick="toggleUnsure()">${isUnsure?'⚠️ 已標記不確定':'🤔 標記不確定'}</button>`:'';
  const aiBtn=answered?`<button class="btn btn-ai" onclick="showAIModal(${state.qi})">🤖 問 AI</button>`:'';
  const ecHint=answered&&ec>=2?`<div class="note-box ec-hint" style="margin-top:.5rem">⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。</div>`:'';
  const sessionLabel=q.session?` 第${q.session}次`:'';
  const unsureMeta=isUnsure?`<span class="bdg unsure-tag">⚠️ 不確定</span>`:'';
  a.innerHTML=`<div class="card">
    <div class="meta">
      <span class="bdg bdg-yr mono">民國${q.roc_year}年${sessionLabel} 第${q.examNo}題</span>
      <span class="bdg bdg-src">官方歷屆</span>
      ${q.needs_review?'<span class="bdg bdg-rv">答案待確認</span>':''}
      ${ecBadge}${unsureMeta}
      <span class="qn mono">${state.qi+1} / ${qs.length}</span>
    </div>
    <div class="qt">${q.q}</div>
    ${q.imgs&&q.imgs.length?`<div class="q-imgs">${q.imgs.map(s=>`<img src="${s}" alt="題目圖片" onclick="this.style.maxWidth=this.style.maxWidth?'':'none'">`).join('')}</div>`:''}
    <div class="opts">${optsHtml}</div>
    <div class="exp ${expShow}" id="exp"><div class="exp-t mono">解析</div>${q.exp}${noteHtml}${ecHint}</div>
    <div class="wexp ${wexpShow}" id="wexp"><div class="wexp-t mono" id="wexp-t">${wexpTitle}</div><span id="wexp-body">${wexpBody}</span></div>
    <div class="act">
      <button class="btn" onclick="jumpTo(Math.max(0,state.qi-1))" ${state.qi===0?'disabled':''}>&#8592; 上一題</button>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${unsureBtn}${aiBtn}<button class="btn btnp" id="nb" onclick="jumpTo(state.qi+1)" style="display:${nbDisplay}">下一題 &#8594;</button></div>
    </div>
  </div>`;
}
function pick(i,ans){
  const qs=getQs();const q=qs[state.qi];
  if(!q||qStates[q.id])return;
  const correct=(i===ans);
  state.done++;if(correct)state.cor++;
  qStates[q.id]=correct?'ok':'no-'+i;
  if(!correct)errorCounts[q.id]=(errorCounts[q.id]||0)+1;
  saveProgress();
  for(let j=0;j<q.opts.length;j++){
    const d=document.getElementById('o'+j);if(!d)continue;
    if(j===ans){d.classList.add('dis','ok');d.removeAttribute('onclick');}
    else if(j===i&&!correct){d.classList.add('no');d.setAttribute('onclick','peekWexp('+j+')');}
    else{d.classList.add('peek');d.setAttribute('onclick','peekWexp('+j+')');}
  }
  document.getElementById('exp').classList.add('show');
  if(!correct&&q.we&&q.we[i]&&q.we[i]!==''){
    const we=document.getElementById('wexp');const t=document.getElementById('wexp-t');
    if(we){document.getElementById('wexp-body').textContent=q.we[i];if(t)t.innerHTML='你可能選這個，是因為&#x2026;&#x2026;';we.classList.add('show');}
  }
  const nb=document.getElementById('nb');if(nb)nb.style.display='';
  const actInner=nb&&nb.parentNode;
  if(actInner&&!actInner.querySelector('.btn-unsure')){
    const ubtn=document.createElement('button');
    ubtn.id='unsure-btn';ubtn.className='btn btn-unsure';
    ubtn.textContent='🤔 標記不確定';ubtn.onclick=()=>toggleUnsure();
    actInner.insertBefore(ubtn,actInner.querySelector('.btn-ai')||nb);
  }
  if(actInner&&!actInner.querySelector('.btn-ai')){
    const btn=document.createElement('button');
    btn.className='btn btn-ai';btn.textContent='🤖 問 AI';
    btn.onclick=()=>showAIModal(state.qi);
    actInner.insertBefore(btn,nb);
  }
  const ec=errorCounts[q.id]||0;
  if(!correct&&ec>=2){
    const expEl=document.getElementById('exp');
    if(expEl&&!expEl.querySelector('.ec-hint')){
      const hint=document.createElement('div');
      hint.className='note-box ec-hint';hint.style.marginTop='.5rem';
      hint.innerHTML=`⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。`;
      expEl.appendChild(hint);
    }
  }
  updStats();renderNav();
}
function peekWexp(i){
  const qs=getQs();const q=qs[state.qi];
  document.querySelectorAll('.opt.peek').forEach(el=>el.classList.remove('peek-active'));
  const el=document.getElementById('o'+i);if(el)el.classList.add('peek-active');
  const we=document.getElementById('wexp');const weBody=document.getElementById('wexp-body');const weT=document.getElementById('wexp-t');
  if(!we||!weBody)return;
  const letter=String.fromCharCode(65+i);
  const isPicked=el&&el.classList.contains('no');
  if(weT)weT.textContent=isPicked?'你選了 ('+letter+')，為什麼不對？':'選項 ('+letter+') 為什麼不對？';
  const txt=(q.we&&q.we[i]&&q.we[i]!=='')?q.we[i]:'（解析待補充）';
  weBody.textContent=txt;we.classList.add('show');
}
function toggleUnsure(){
  const qs=getQs();const q=qs[state.qi];if(!q)return;
  if(unsureSet[q.id])delete unsureSet[q.id];
  else unsureSet[q.id]=true;
  saveProgress();
  const btn=document.getElementById('unsure-btn');
  if(btn){
    const active=!!unsureSet[q.id];
    btn.textContent=active?'⚠️ 已標記不確定':'🤔 標記不確定';
    btn.classList.toggle('active',active);
  }
  const meta=document.querySelector('.meta');
  if(meta){
    const old=meta.querySelector('.unsure-tag');if(old)old.remove();
    if(unsureSet[q.id]){
      const tag=document.createElement('span');
      tag.className='bdg unsure-tag';tag.textContent='⚠️ 不確定';
      const qn=meta.querySelector('.qn');if(qn)meta.insertBefore(tag,qn);else meta.appendChild(tag);
    }
  }
  renderNav();
}
function restartQuiz(){
  const qs=getQs();
  qs.forEach(q=>{delete qStates[q.id];});
  state={qi:0,done:0,cor:0};saveProgress();render();
}
function showAIModal(qIdx){
  const qs=getQs();const q=qs[qIdx];if(!q)return;
  const ec=errorCounts[q.id]||0;
  const sessionLabel=q.session?` 第${q.session}次`:'';
  const lines=['【獸醫藥理 國考題目】',`民國${q.roc_year}年${sessionLabel} 第${q.examNo}題`,'',q.q,''];
  q.opts.forEach(o=>lines.push(o));
  lines.push('',`【正確答案】${String.fromCharCode(65+q.ans)}`,'',`【現有解析】${q.exp}`,'');
  if(ec>0)lines.push(`備注：此題你已答錯 ${ec} 次。`,'');
  lines.push('請針對此題提供更詳細的藥理學解析，說明相關機制、藥物特性及常見混淆點。');
  const text=lines.join('\n');
  const existing=document.getElementById('ai-modal');if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='ai-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem';
  modal.innerHTML=`<div style="background:#1a1d27;border:1px solid #3d4260;border-radius:12px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-size:14px;font-weight:700;color:#7986cb">🤖 問 AI 獲取更詳細解析</div>
      <button onclick="document.getElementById('ai-modal').remove()" style="background:none;border:none;color:#9096b8;cursor:pointer;font-size:20px;line-height:1">✕</button>
    </div>
    <div style="font-size:11px;color:#9096b8;margin-bottom:.5rem">以下文字將傳給 AI。點 AI 按鈕時自動複製，開啟網站後貼上（Ctrl+V）：</div>
    <div id="ai-preview" style="font-size:11px;color:#9096b8;background:#0f1117;border:1px solid #2e3347;border-radius:6px;padding:10px;max-height:130px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-bottom:.75rem"></div>
    <button onclick="copyAIText()" style="width:100%;padding:9px;background:#22263a;border:1px solid #3d4260;border-radius:8px;color:#e8eaf6;cursor:pointer;margin-bottom:6px;font-size:13px">📋 複製題目文字</button>
    <div id="copy-ok" style="text-align:center;color:#43a867;font-size:12px;min-height:18px;margin-bottom:6px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem">
      <a href="https://chat.openai.com/" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#10a37f15;border:1px solid #10a37f40;border-radius:8px;color:#10a37f;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">🤖<span>ChatGPT</span></a>
      <a href="https://claude.ai/new" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#d97a2015;border:1px solid #d97a2040;border-radius:8px;color:#d97a20;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">⚡<span>Claude</span></a>
      <a href="https://gemini.google.com/app" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#4285f415;border:1px solid #4285f440;border-radius:8px;color:#4285f4;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">✨<span>Gemini</span></a>
    </div>
    <div style="font-size:11px;color:#555d80;text-align:center">點 AI 按鈕後在新分頁貼上即可</div>
  </div>`;
  modal.querySelector('#ai-preview').textContent=text;
  modal._aiText=text;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
}
function copyAIText(){
  const modal=document.getElementById('ai-modal');if(!modal||!modal._aiText)return;
  const ok=document.getElementById('copy-ok');
  const show=msg=>{if(ok){ok.textContent=msg;setTimeout(()=>ok.textContent='',2500);}};
  navigator.clipboard.writeText(modal._aiText).then(()=>show('✓ 已複製到剪貼簿！開啟 AI 後貼上')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=modal._aiText;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
    show('✓ 已複製！');
  });
}
document.getElementById('qtotal').textContent=ALL_QS.length;
(function(){
  const sel=document.getElementById('yrsel');
  const seen=new Set();const opts=[];
  ALL_QS.forEach(q=>{
    const key=q.session?String(q.year)+'-'+q.session:String(q.year);
    if(!seen.has(key)){seen.add(key);opts.push({key,year:q.year,roc:q.roc_year,session:q.session||''});}
  });
  opts.sort((a,b)=>b.year-a.year||(b.session<a.session?-1:1));
  opts.forEach(o=>{
    const op=document.createElement('option');op.value=o.key;
    op.textContent=o.session?'民國'+o.roc+'年 第'+o.session+'次':'民國'+o.roc+'年';
    sel.appendChild(op);
  });
  if(curFilter!=='all')sel.value=curFilter;
})();
(function(){
  const savedUser=localStorage.getItem(CUR_USER_KEY);
  const accs=getAccounts();
  if(savedUser&&accs[savedUser]){enterApp(savedUser);}
  else{showLoginScreen();}
})();

</script>
