性神經炎、「星視症」、腿軟）。","we":["","錯誤：維生素 B2（riboflavin）缺乏的原因通常是飼料配方不足，與 amprolium 的結構拮抗機制（針對 B1）無關；amprolium 不影響 B2 的吸收或利用。","錯誤：維生素 B6（pyridoxine）缺乏通常由飲食不足或長期使用 isoniazid 等藥物引起；amprolium 的結構與 B1（非 B6）相似，不會特異性拮抗 B6。","錯誤：維生素 B12（cyanocobalamin）缺乏由內因子缺乏（惡性貧血）或飲食來源不足引起；amprolium 不影響 B12 的吸收或功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_038","year":2016,"roc_year":105,"session":"1","examNo":38,"q":"下列何者是prostaglandin E1的衍生物，具有保護腸胃黏膜的作用？","opts":["A. sucralfate","B. kaolin-pectin","C. misoprostol","D. bismuth subcarbonate"],"ans":2,"exp":"Misoprostol 是合成的前列腺素 E1（PGE1）類似物（methyl ester 衍生物），口服後在胃腸黏膜發揮保護作用：①透過 EP3 受體抑制 cAMP，減少胃壁細胞基底性及刺激性胃酸分泌；②透過 EP1/EP4 受體促進胃腸黏膜上皮的黏液（mucus）及碳酸氫鹽（bicarbonate）分泌，增強黏膜屏障；③促進黏膜血流（cytoprotection）。臨床上用於預防 NSAIDs 引起的胃潰瘍。","we":["錯誤：sucralfate 是胃潰瘍保護劑，在酸性環境聚合成凝膠覆蓋潰瘍面，是物理性保護機制，非前列腺素衍生物，不涉及 PGE1 受體。","錯誤：kaolin-pectin 是止瀉吸附劑，吸附腸道毒素及細菌，增加糞便黏稠度，保護腸黏膜；與前列腺素 E1 衍生物及胃黏膜保護機制無關。","","錯誤：bismuth subcarbonate 是鉍鹽制酸/保護劑，在胃酸中形成膠體硫酸鉍覆蓋潰瘍，並有抗幽門螺旋桿菌作用；屬無機鹽類，非前列腺素衍生物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_039","year":2016,"roc_year":105,"session":"1","examNo":39,"q":"關於deracoxib之敘述，下列何者錯誤？","opts":["A. 可能造成肝腎毒性","B. 主要為cyclooxygenase-1抑制劑","C. 可使用於犬骨關節炎（osteoarthritis）有關之疼痛及炎症","D. 可使用於控制整形外科有關之術後疼痛及其炎症反應"],"ans":1,"exp":"Deracoxib 是高選擇性 COX-2 抑制劑（selective cyclooxygenase-2 inhibitor），屬於 coxib 類 NSAIDs，對 COX-1 的抑制極弱。COX-2 在炎症部位高度表達，介導前列腺素合成引起疼痛、發熱及炎症；選擇性抑制 COX-2 可達到抗炎止痛效果，同時減少因抑制 COX-1（維護胃黏膜保護性前列腺素）引起的胃腸副作用。Deracoxib 被美國 FDA 批准用於犬骨關節炎疼痛及整形外科術後疼痛控制。","we":["此為正確描述：deracoxib 確實可能造成肝腎毒性（COX-2 選擇性藥物的已知不良反應），此描述正確，不符合題目問的「錯誤」描述。","","此為正確描述：deracoxib 確實被核准用於犬骨關節炎相關疼痛及炎症治療，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：deracoxib 亦被核准用於控制犬整形外科手術（如切骨術、關節置換）術後的疼痛及炎症，此描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_040","year":2016,"roc_year":105,"session":"1","examNo":40,"q":"下列何者催化leukotrienes的生合成？","opts":["A. cyclooxygenase","B. 5-lipoxygenase","C. 15-lipoxygenase","D. phosphodiesterase"],"ans":1,"exp":"花生四烯酸（arachidonic acid）在細胞膜磷脂被磷脂酶 A2（PLA2）釋放後，進入兩條主要代謝通路：①cyclooxygenase（COX）通路 → 前列腺素（prostaglandins）及血栓素（thromboxanes）；②lipoxygenase（LOX）通路 → 白三烯素（leukotrienes）及脂氧素（lipoxins）。其中，5-脂氧合酶（5-lipoxygenase，5-LOX）催化花生四烯酸生成 5-HPETE，再轉化為 LTA4（leukotriene A4），是白三烯素生合成的關鍵限速酶，主要在嗜中性球、肥大細胞及嗜酸性球中表達，與過敏反應及氣喘發病機制密切相關。","we":["錯誤：cyclooxygenase（COX）催化花生四烯酸生成前列腺素 G2（PGG2）及 H2（PGH2），是前列腺素和血栓素合成的關鍵酶；白三烯素的生合成路徑不經過 cyclooxygenase。","","錯誤：15-lipoxygenase（15-LOX）催化花生四烯酸在 C-15 位氧化，主要生成 15-HPETE 及脂氧素（lipoxin），具有抗炎及促消退（pro-resolving）功能；並非白三烯素的主要合成酶（白三烯素由 5-LOX 催化）。","錯誤：phosphodiesterase（PDE）水解細胞內環核苷酸（cAMP、cGMP），與花生四烯酸的代謝通路完全無關，不參與白三烯素的生合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_041","year":2016,"roc_year":105,"session":"1","examNo":41,"q":"關於動情素（estrogens）治療用途的敘述，下列何者錯誤？","opts":["A. 治療有關子宮卵巢摘除術後之問題，例如尿失禁","B. 使用於鬆弛子宮頸及生殖道尾部以誘發分娩或流產","C. 使用於不發情之動物以有效的誘發動物之發情","D. 無法處理治療子宮蓄膿（pyometra）及木乃伊化之胎兒"],"ans":3,"exp":"動情素（estrogen）能使子宮頸鬆弛、擴張，因此確實可用於協助排出子宮蓄膿（pyometra）或木乃伊化胎兒，故D選項「無法處理」的說法是錯誤的。Estrogen透過鬆弛子宮頸及生殖道，使膿液或胎兒殘骸得以排出，臨床上曾被用於開放型子宮蓄膿的輔助治療。","we":["此為正確描述：動情素確實可用於治療子宮卵巢摘除術後引起的尿失禁，因為子宮頸韌帶張力降低或尿道括約肌受雌激素影響，給予estrogen可改善相關症狀，不符合題目問的「錯誤」描述。","此為正確描述：動情素能鬆弛子宮頸及生殖道尾部，臨床上可用於誘發分娩或人工流產，此為已知的正確用途，不符合題目問的「錯誤」描述。","此為正確描述：動情素可用於不發情（anestrus）動物以誘發發情週期，透過對下視丘-腦垂腺-性腺軸的反饋調控促進發情，此說法正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_042","year":2016,"roc_year":105,"session":"1","examNo":42,"q":"下列何者不屬於glucocorticoids的藥理作用機制？","opts":["A. 和glucocorticoid受體結合","B. 增加lipocortin基因的表現","C. 抑制phospholipase A2的活性","D. 增加Na+ pump的活性"],"ans":3,"exp":"Glucocorticoids（GC）的主要藥理機制為：與細胞內glucocorticoid受體（GR）結合（A），進入細胞核後誘導lipocortin（annexin-1）基因表現（B），所生成的lipocortin蛋白再抑制磷脂酶A2（phospholipase A2）的活性（C），進而減少花生四烯酸的釋放，抑制前列腺素及白三烯素的合成。增加Na⁺/K⁺-ATPase（Na+ pump）活性屬於礦性腎上腺皮質素（mineralocorticoid）對腎小管的作用，並非glucocorticoid的藥理機制，故D為不屬於glucocorticoids機制的選項。","we":["此為正確描述：Glucocorticoids確實需先與細胞質中的glucocorticoid受體（GR）結合，才能形成活化的受體-配體複合物進入細胞核，這是GC作用的第一步，屬於其藥理機制，不符合題目問的「不屬於」描述。","此為正確描述：GC-GR複合物進入細胞核後，可誘導lipocortin（也稱annexin-1）的基因表現，使細胞合成lipocortin蛋白，屬於GC藥理機制的一環，不符合題目問的「不屬於」描述。","此為正確描述：由lipocortin蛋白抑制磷脂酶A2（PLA2）的活性，阻止細胞膜磷脂水解為花生四烯酸，進而抑制炎症介質的合成，屬於GC的抗炎機制，不符合題目問的「不屬於」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_043","year":2016,"roc_year":105,"session":"1","examNo":43,"q":"下列何者為自泌素（autacoids）？","opts":["A. 動情素（estrogen）","B. 甲狀腺素（thyroxine）","C. 胰島素（insulin）","D. 前列腺素（prostaglandins）"],"ans":3,"exp":"自泌素（autacoids）是指在局部組織合成、就近發揮作用、無固定靶器官、且在局部迅速被分解的生理活性物質，又稱「局部荷爾蒙」。前列腺素（prostaglandins）符合所有自泌素的特徵：由各組織細胞的膜磷脂經花生四烯酸路徑合成，作用於鄰近細胞，並在局部迅速代謝失活，故為自泌素的代表。動情素、甲狀腺素及胰島素均屬於由特定內分泌腺分泌、經血液循環至遠端靶器官作用的傳統荷爾蒙，不符合自泌素定義。","we":["錯誤：動情素（estrogen）由卵巢分泌，經血液循環運送至生殖器官、骨骼、心血管系統等遠端靶器官發揮作用，屬於傳統內分泌荷爾蒙，不符合「局部合成、局部作用」的自泌素定義。","錯誤：甲狀腺素（thyroxine）由甲狀腺濾泡細胞合成並分泌入血液，作用於全身幾乎所有細胞的細胞核受體以調節基礎代謝，屬於全身性荷爾蒙而非自泌素。","錯誤：胰島素（insulin）由胰臟蘭氏島B細胞分泌，透過血液循環作用於肝臟、肌肉、脂肪等組織的胰島素受體，調節血糖，屬於傳統內分泌荷爾蒙，而非自泌素。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_044","year":2016,"roc_year":105,"session":"1","examNo":44,"q":"松果腺褪黑激素（melatonin）可用於治療犬隻的何種疾病？","opts":["A. 脫毛","B. 心衰竭","C. 水腫","D. 過敏"],"ans":0,"exp":"松果腺褪黑激素（melatonin）與犬隻毛髮週期（hair cycle）的調控密切相關，其分泌受光週期（photoperiod）影響。臨床上melatonin被用於治療犬隻與光週期相關的脫毛症，包括犬側腹脫毛症（canine flank alopecia）及X型脫毛症（alopecia X），推測機制是透過調節促黑激素（MSH）及毛囊生長週期而改善毛髮再生。","we":["","錯誤：心衰竭的治療主要使用強心劑（如digoxin）、利尿劑（如furosemide）及血管擴張劑（如ACE抑制劑），melatonin並非心衰竭的治療藥物，此選項錯誤。","錯誤：水腫的治療主要依病因使用利尿劑或消除原發病，melatonin並無利尿或消腫的藥理作用，不用於治療水腫。","錯誤：過敏反應的治療主要使用抗組織胺藥（antihistamines）、糖皮質素（glucocorticoids）或腎上腺素（epinephrine），melatonin並非抗過敏藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_045","year":2016,"roc_year":105,"session":"1","examNo":45,"q":"下列對於serotonin之敘述，何者錯誤？","opts":["A. 又稱5-hydroxytryptamine","B. 可促進血小板凝集","C. 可減緩腸胃道的蠕動","D. 可影響睡眠和情緒"],"ans":2,"exp":"血清素（serotonin，5-HT）對腸胃道的作用是「促進」蠕動，而非「減緩」，故C選項敘述錯誤。Serotonin主要透過5-HT4受體活化腸壁的蠕動反射（peristaltic reflex），增加腸道平滑肌的收縮及分泌。5-HT4受體致效劑（如cisapride、metoclopramide）正是利用此機制作為促腸胃動力藥（prokinetics）使用；5-HT3受體拮抗劑（如ondansetron）則用於止吐，恰好說明5-HT對腸道的刺激作用。","we":["此為正確描述：血清素（serotonin）即5-羥色胺（5-hydroxytryptamine，5-HT），兩者為同一物質，此為正確的化學命名，不符合題目問的「錯誤」描述。","此為正確描述：血清素可促進血小板聚集（platelet aggregation），當血小板活化時會從密集顆粒（dense granules）釋放血清素，進一步促進更多血小板聚集，參與止血反應，此敘述正確，不符合題目問的「錯誤」描述。","","此為正確描述：血清素作用於腦幹縫核（raphe nuclei）及其他中樞血清素能神經元，廣泛參與睡眠、情緒、食慾及認知功能的調節，低血清素與憂鬱症相關，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_046","year":2016,"roc_year":105,"session":"1","examNo":46,"q":"下列何者不是腎上腺皮質抑制劑？","opts":["A. mitotane","B. metyrapone","C. propylthiouracil","D. ketoconazole"],"ans":2,"exp":"Propylthiouracil（PTU）是抗甲狀腺藥（antithyroid drug），其作用機制為抑制甲狀腺過氧化酶（thyroid peroxidase），阻礙碘的有機化及甲狀腺素的合成，並在周邊組織抑制T4轉換為活性更強的T3，用於治療甲狀腺功能亢進症，與腎上腺皮質（adrenal cortex）完全無關。其餘三者均為腎上腺皮質抑制劑：mitotane（o,p'-DDD）直接破壞腎上腺皮質細胞、metyrapone抑制11β-羥化酶阻止皮質醇合成、ketoconazole（咪唑類抗黴菌藥）抑制多種類固醇合成酵素。","we":["此為正確描述：Mitotane（o,p'-DDD）為腎上腺皮質細胞毒性藥物，可選擇性破壞腎上腺皮質的束狀帶及網狀帶細胞，抑制皮質醇分泌，用於治療犬腎上腺皮質功能亢進（PDH及AT型庫欣氏症），確實屬於腎上腺皮質抑制劑，不符合題目問的「不是」描述。","此為正確描述：Metyrapone抑制腎上腺皮質的11β-羥化酶（11β-hydroxylase），阻礙11-去氧皮質醇轉換為皮質醇，為腎上腺皮質功能診斷試驗及抑制劑，確實屬於腎上腺皮質抑制劑，不符合題目問的「不是」描述。","","此為正確描述：Ketoconazole除抗黴菌作用外，高劑量時可抑制腎上腺及性腺的多種類固醇合成酵素（包括17α-羥化酶、11β-羥化酶等），降低皮質醇及性激素的合成，臨床上被用於治療犬庫欣氏症，確實屬於腎上腺皮質抑制劑，不符合題目問的「不是」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_047","year":2016,"roc_year":105,"session":"1","examNo":47,"q":"5-Fluorouracil代謝物最主要阻礙下列何種酵素反應而抑制DNA之合成？","opts":["A. ribonucleotide reductase","B. topoisomerase II","C. thymidylate synthase","D. dihydrofolate reductase"],"ans":2,"exp":"5-氟尿嘧啶（5-Fluorouracil，5-FU）在體內代謝後形成活性代謝物氟尿嘧啶去氧核苷酸（FdUMP，fluorodeoxyuridine monophosphate），FdUMP與胸苷酸合成酶（thymidylate synthase）及其輔因子亞甲基四氫葉酸（methylenetetrahydrofolate）形成三元共價複合物，不可逆地抑制thymidylate synthase的活性，導致胸腺嘧啶去氧核苷酸（dTMP）無法由dUMP合成，進而阻斷DNA複製所需的去氧胸腺嘧啶核苷酸供應，最終抑制DNA的合成。","we":["錯誤：核糖核苷酸還原酶（ribonucleotide reductase）是將核糖核苷酸（NDP）還原為去氧核糖核苷酸（dNDP）的酵素，抑制此酵素的藥物為hydroxyurea，而非5-FU的主要作用機制。","錯誤：拓撲異構酶II（topoisomerase II）負責調節DNA雙鏈在複製及轉錄時的超螺旋張力，抑制此酵素的藥物包括doxorubicin（嵌入DNA）及etoposide，並非5-FU的作用標靶。","","錯誤：二氫葉酸還原酶（dihydrofolate reductase，DHFR）是將二氫葉酸還原為四氫葉酸的酵素，抑制DHFR的藥物為甲氨喋呤（methotrexate）及trimethoprim，並非5-FU的直接作用標靶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_048","year":2016,"roc_year":105,"session":"1","examNo":48,"q":"使用bleomycin後，最可能會引起下列何種不良反應？","opts":["A. 心臟毒性","B. 肺纖維化","C. 自主神經病變","D. 腎毒性"],"ans":1,"exp":"Bleomycin（博萊黴素）最主要且劑量限制性的毒性為肺毒性，表現為肺纖維化（pulmonary fibrosis）及間質性肺炎。其原因在於肺臟和皮膚組織中缺乏bleomycin hydrolase（可水解bleomycin的酵素），導致bleomycin在肺組織蓄積，並透過產生活性氧自由基（ROS）損傷肺臟DNA及組織，引發纖維化反應。其他組織因含有較多bleomycin hydrolase，相對不易發生相同毒性。","we":["錯誤：心臟毒性（cardiotoxicity）是蒽環類抗腫瘤藥（anthracyclines）如doxorubicin的主要劑量限制性毒性，而非bleomycin；bleomycin的心臟毒性極罕見，不是其主要不良反應。","","錯誤：自主神經病變（autonomic neuropathy）並非bleomycin已知的主要不良反應；神經毒性（包括周邊神經病變）較常見於長春花鹼類（如vincristine）或鉑類（如cisplatin）化療藥物。","錯誤：腎毒性（nephrotoxicity）是cisplatin最主要的劑量限制性毒性，以及aminoglycosides的重要副作用，bleomycin本身並無顯著的直接腎毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_049","year":2016,"roc_year":105,"session":"1","examNo":49,"q":"在相同的條件下，下列何者在中樞神經系統的濃度最高？","opts":["A. chlortetracycline","B. tetracycline","C. oxytetracycline","D. doxycycline"],"ans":3,"exp":"四環素類藥物的親脂性（lipophilicity）決定其穿透中樞神經系統血腦屏障（blood-brain barrier，BBB）的能力。在常見四環素類中，親脂性由低至高排列為：tetracycline < chlortetracycline < oxytetracycline < doxycycline，其中doxycycline的親脂性最高，分布容積（Vd）最大，因此在相同條件下於中樞神經系統中可達到最高濃度。此特性使doxycycline在治療CNS感染（如神經型布氏菌病、萊姆病）方面具有優勢。","we":["錯誤：Chlortetracycline（金黴素）的親脂性在四環素類中屬中等偏低，口服生體可用率也較低，中樞神經系統穿透能力不如doxycycline，故並非CNS濃度最高者。","錯誤：Tetracycline（四環素）為此類藥物的原型，親脂性最低，分布容積最小，血腦屏障穿透率低，CNS濃度在四者中最低。","錯誤：Oxytetracycline（土黴素）的親脂性介於tetracycline與doxycycline之間，CNS穿透能力優於tetracycline但仍不及doxycycline，故不是CNS濃度最高者。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_050","year":2016,"roc_year":105,"session":"1","examNo":50,"q":"下列有關含氯消毒劑的敘述中，何者正確？","opts":["A. 僅具有抗細菌和抗病毒的能力","B. NaOCl和鹼作用時，可形成具有毒性的氯氣","C. 家用漂白水約含有90-95%的次氯酸","D. 當pH值大於8時，漂白水的效用會下降"],"ans":3,"exp":"含氯消毒劑（如漂白水NaOCl）的殺菌效力主要來自次氯酸（HOCl），其活性與溶液pH值高度相關。當pH值大於8時，HOCl的解離平衡向生成次氯酸根（OCl⁻）方向移動，而OCl⁻的殺菌活性僅為HOCl的1/80到1/100，因此在高pH值（鹼性）環境中漂白水的消毒效力確實會顯著下降，D選項敘述正確。","we":["錯誤：含氯消毒劑（漂白水）除抗細菌和抗病毒外，對黴菌（包括真菌孢子）及部分原蟲（如Cryptosporidium在高濃度時）也有一定效果，並非「僅具有抗細菌和抗病毒」的能力，A選項敘述不完整且有誤。","錯誤：NaOCl（次氯酸鈉）與酸性物質反應才會釋放有毒的氯氣（Cl₂），而非與「鹼」作用；NaOCl本身已是鹼性，與酸混合才危險，B選項的說法錯誤。","錯誤：家用漂白水（household bleach）的次氯酸鈉（NaOCl）含量通常約為3–6%（濃縮型可達10–12%），而非「90–95%次氯酸」；次氯酸（HOCl）是NaOCl在水中的解離形態，不以純次氯酸的形式存在，C選項數字與描述均錯誤。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_051","year":2016,"roc_year":105,"session":"1","examNo":51,"q":"下列何種抗菌劑較不會對肝臟的代謝酶具有抑制或誘導作用？","opts":["A. methicillin","B. chloramphenicol","C. erythromycin","D. rifampin"],"ans":0,"exp":"Methicillin為β-內醯胺類青黴素（β-lactam penicillin），屬於耐青黴素酶型盤尼西林，其分子結構不會與肝臟細胞色素P450（CYP）酵素系統發生顯著的抑制或誘導作用，因此較不影響其他藥物的肝臟代謝，藥物交互作用風險最低。相反地，chloramphenicol（B）透過與CYP結合抑制多種CYP同工酶，erythromycin（C）透過生成亞硝基代謝物抑制CYP3A4，rifampin（D）為強力的CYP誘導劑（尤其是CYP1A2、CYP2C9、CYP3A4），均會顯著影響肝臟藥物代謝。","we":["","錯誤：Chloramphenicol（氯黴素）是著名的CYP酵素抑制劑，可抑制CYP2C9、CYP2C19及CYP3A4等同工酶，使合併使用的藥物（如苯巴比妥、phenytoin）代謝減慢、血中濃度升高，具有顯著的藥物交互作用風險，不符合題意。","錯誤：Erythromycin（紅黴素）透過其代謝物（亞硝基衍生物）與CYP3A4形成複合物而抑制其活性，屬於CYP3A4抑制劑，可升高多種藥物（如cisapride、terfenadine）的血中濃度，不符合「較不會影響肝臟代謝酶」的描述。","錯誤：Rifampin（利福平）是最強效的肝臟CYP誘導劑之一，可顯著誘導CYP1A2、CYP2C9、CYP2C19及CYP3A4等多種同工酶及P-糖蛋白，大幅加速許多藥物的代謝，引起廣泛的藥物交互作用，完全不符合「較不會影響」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_052","year":2016,"roc_year":105,"session":"1","examNo":52,"q":"下列何種抗菌劑不易在巨噬細胞中具有較高的濃度？","opts":["A. enrofloxacin","B. rifampin","C. azithromycin","D. streptomycin"],"ans":3,"exp":"Streptomycin（鏈黴素）為氨基糖苷類（aminoglycoside）抗生素，具有高度水溶性和極性，無法有效穿透細胞膜進入巨噬細胞（macrophages）的胞內，因此在巨噬細胞中的濃度甚低。由於許多胞內病原（如Brucella、Mycobacterium等）可在巨噬細胞內存活，aminoglycosides對這些胞內感染的療效受到限制。相反地，氟喹諾酮類（enrofloxacin，A）、利福平（rifampin，B）及阿奇黴素（azithromycin，C）均具有良好的細胞內穿透力，在巨噬細胞中可達到遠高於血漿的濃度，適合治療胞內菌感染。","we":["此為正確描述：Enrofloxacin（恩諾沙星）等氟喹諾酮類藥物具有高親脂性，可有效穿透細胞膜，在巨噬細胞及多種組織細胞內達到高濃度，適合治療胞內菌感染，確實易在巨噬細胞中達到較高濃度，不符合題目問的「不易」描述。","此為正確描述：Rifampin（利福平）具有高親脂性，可輕易穿透細胞膜，在巨噬細胞中達到高濃度，是治療胞內菌（如結核菌、布氏菌）感染的重要藥物，確實易在巨噬細胞中達到較高濃度，不符合題目問的「不易」描述。","此為正確描述：Azithromycin（阿奇黴素）在細胞內（尤其是巨噬細胞及吞噬細胞）的濃度可達血漿濃度的數十至數百倍，是治療胞內病原（如Chlamydia、Mycoplasma）的首選藥物之一，不符合題目問的「不易」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_053","year":2016,"roc_year":105,"session":"1","examNo":53,"q":"對已有腎臟疾病的患畜，使用下列何者較不會造成更嚴重的腎臟傷害？","opts":["A. streptomycin","B. cefazolin","C. sulfadimethoxine","D. doxycycline"],"ans":3,"exp":"Doxycycline（去氧四環素）是四環素類中最特殊的成員，主要透過膽汁分泌進入腸道，再以糞便排出，腎臟排泄量極少（即使在腎衰竭患者，其血中半衰期改變不大）。因此對已有腎臟疾病的患畜，doxycycline是四環素類中最安全的選擇，不會因腎排泄障礙而蓄積毒性。其餘選項均對腎臟有害：streptomycin（A）具直接腎毒性（近曲小管損傷）、cefazolin（B）主要經腎臟排泄，腎衰竭時濃度蓄積、磺胺劑sulfadimethoxine（C）代謝物（乙醯化物）溶解度低，易在尿液中析出結晶，阻塞腎小管造成結晶尿。","we":["錯誤：Streptomycin（鏈黴素）屬氨基糖苷類，主要由腎臟排泄（腎絲球過濾），本身具有直接腎毒性，可造成近曲小管細胞損傷，在腎功能不全患畜使用時毒性風險大幅增加，不適合腎臟疾病患畜使用。","錯誤：Cefazolin（頭孢唑啉）主要以原型藥物由腎臟排泄，腎功能衰退時清除率下降，血中濃度升高，可能加重腎臟損傷或造成其他毒性，應減量或避免在嚴重腎衰竭患畜使用。","錯誤：磺胺劑（如sulfadimethoxine）及其N4-乙醯化代謝物在酸性尿液中溶解度低，容易在腎小管和集尿管中析出結晶（crystalluria），造成阻塞性腎病變，在腎臟疾病患畜中使用有加重損傷的風險。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_054","year":2016,"roc_year":105,"session":"1","examNo":54,"q":"下列有關盤尼西林類製劑特性的敘述中，何者正確？","opts":["A. Procaine製劑最常以靜脈注射方式投藥","B. Benzathine製劑可產生低的血中濃度，但維持較長的時間","C. 鈉鹽製劑因鹼性過強，不可肌肉注射","D. 在胃中，amoxicillin較penicillin G容易被破壞"],"ans":1,"exp":"Benzathine penicillin（苄星青黴素）為青黴素G的長效鹽類製劑，肌肉注射後在注射部位緩慢水解釋放青黴素G，產生低但持久（可維數日至數週）的血中濃度，適合需要長期低劑量維持的感染（如鏈球菌咽喉炎的預防）。其餘選項均有誤：procaine penicillin為肌肉注射劑型（非靜脈注射）、鈉鹽製劑（penicillin G sodium）並非因鹼性過強而不可肌注（其pH約在6.0–8.5，實際上可肌注）、amoxicillin的耐酸性優於penicillin G（amoxicillin在胃酸中較穩定，故口服生體可用率更高）。","we":["錯誤：Procaine製劑（procaine penicillin）因procaine為局部麻醉藥，靜脈注射會造成心臟毒性及CNS毒性，因此只能肌肉注射（IM），絕對不可靜脈注射（IV），A選項「最常以靜脈注射方式投藥」是錯誤的。","","錯誤：青黴素鈉鹽（sodium penicillin G）製劑的pH值通常在6.0–8.5之間，並非「鹼性過強」，實際上可以肌肉注射，也可靜脈注射，C選項「不可肌肉注射」的說法是錯誤的。","錯誤：在胃中，amoxicillin因其側鏈結構（含氨基）增加了對胃酸的穩定性，比penicillin G更「不易」被胃酸破壞，因此amoxicillin的口服生體可用率（約75–90%）遠高於penicillin G（口服幾乎無效），D選項的描述與事實相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_055","year":2016,"roc_year":105,"session":"1","examNo":55,"q":"下列關於amphotericin B的敘述，何者錯誤？","opts":["A. 產生腎血管收縮","B. 不可與flucytosine併用","C. 造成腎小管上皮細胞損害","D. 降低腎絲球體過濾率"],"ans":1,"exp":"Amphotericin B與flucytosine（5-氟胞嘧啶）的聯合使用是臨床上治療嚴重隱球菌性腦膜炎（Cryptococcal meningitis）的標準療法，兩者具有協同抗黴菌作用：amphotericin B增加真菌細胞膜通透性，促進flucytosine進入細胞內發揮抑制核酸合成的效果，同時可減少flucytosine的單獨使用量以降低其骨髓毒性。因此B選項「不可與flucytosine併用」的敘述是錯誤的。其餘選項A/C/D均為amphotericin B已知的腎毒性機制之正確描述。","we":["此為正確描述：Amphotericin B確實可引起腎血管收縮（renal vasoconstriction），導致腎血流量（RBF）及腎絲球過濾率（GFR）下降，此為其腎毒性機制之一，不符合題目問的「錯誤」描述。","","此為正確描述：Amphotericin B可直接損傷腎小管上皮細胞，造成腎小管壞死及功能障礙，表現為低鉀血症、低鎂血症及腎小管性酸中毒，此為其腎毒性的重要機制，不符合題目問的「錯誤」描述。","此為正確描述：Amphotericin B透過腎血管收縮及直接腎小管損傷，使腎絲球體過濾率（GFR）降低，臨床表現為血清肌酐（creatinine）及血尿素氮（BUN）上升，此描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_056","year":2016,"roc_year":105,"session":"1","examNo":56,"q":"被應用於眼科用製劑的磺胺劑是：","opts":["A. sulfacetamide","B. sulfisoxazole","C. sulfachlorpyridazine","D. sulfamethazine"],"ans":0,"exp":"Sulfacetamide（磺胺乙醯胺）具有極高的水溶性，可配製成高濃度（10–30%）水溶液或眼膏，且在眼部的pH環境下刺激性相對較小，是專門用於眼科感染（如細菌性結膜炎）的磺胺製劑。其他磺胺劑因水溶性較低或對眼睛刺激性較大，不適合製成眼用製劑。Sulfisoxazole（B）雖可用於眼科，但sulfacetamide是最常見的眼科磺胺；sulfachlorpyridazine（C）主要用於腸道感染；sulfamethazine（D）主要用於全身性感染，均非眼科專用製劑。","we":["","錯誤：Sulfisoxazole主要以口服或注射劑型用於泌尿道感染及其他全身性感染，雖偶有眼用製劑，但並非「專門應用於眼科用製劑的磺胺劑」的最佳代表，與sulfacetamide相比應用範疇不同。","錯誤：Sulfachlorpyridazine（磺胺氯嗒嗪）主要用於動物腸道感染（如豬、牛的腸炎、下痢），為腸道不吸收型磺胺劑之一，並非眼科用製劑。","錯誤：Sulfamethazine（磺胺甲嘧啶）為全身吸收型磺胺劑，廣泛用於畜禽的全身性細菌感染，並非針對眼科應用的磺胺製劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_057","year":2016,"roc_year":105,"session":"1","examNo":57,"q":"下列何者是磺胺劑引起腎毒性的主要原因？","opts":["A. 代謝物引起氧化性傷害","B. 代謝物誘發的免疫反應","C. 藥物在尿液中沉澱形成結晶","D. 藥物抑制前列腺素生合成，進而干擾腎臟血流"],"ans":2,"exp":"磺胺劑（sulfonamides）引起腎毒性的最主要機制是結晶尿（crystalluria）：磺胺劑及其乙醯化代謝物（N4-acetyl sulfonamide）在酸性尿液中溶解度顯著降低，容易析出結晶並沉積於腎小管、集尿管及腎盂，造成機械性梗阻、腎小管上皮損傷及炎症反應，嚴重時可導致少尿或無尿。為預防結晶尿，臨床上常建議給藥期間給予大量飲水或同時使用碳酸氫鈉鹼化尿液，以提高磺胺劑在尿液中的溶解度。","we":["錯誤：氧化性傷害（oxidative injury）是某些磺胺劑在紅血球中可能引起高鐵血紅素血症（methemoglobinemia）或溶血的機制，但並非磺胺劑引起腎毒性的主要原因，此選項描述的是血液毒性而非腎毒性。","錯誤：磺胺劑代謝物誘發的免疫反應（過敏反應）確實可能發生，表現為皮疹、藥物熱或史蒂文斯-強森症候群（SJS），但並非其腎毒性的主要機制，免疫介導的腎炎雖可發生但屬罕見，不是最主要的腎毒性原因。","","錯誤：磺胺劑抑制前列腺素合成進而干擾腎臟血流的機制，是NSAIDs（如aspirin）引起腎毒性的主要機制，而非磺胺劑的腎毒性機制；磺胺劑本身並無顯著抑制前列腺素合成的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_058","year":2016,"roc_year":105,"session":"1","examNo":58,"q":"Benzalkonium chloride在下列何種水質中使用，其毒性增強？","opts":["A. 高溫、硬水","B. 高溫、軟水","C. 低溫、軟水","D. 低溫、硬水"],"ans":1,"exp":"Benzalkonium chloride（苯扎氯銨）屬於四級銨鹽化合物（quaternary ammonium compound，QAC），其消毒效力受水質硬度和溫度兩大因素影響。軟水（soft water）中缺乏鈣（Ca²⁺）、鎂（Mg²⁺）等二價陽離子，這些陽離子會與QAC的陽離子活性中心競爭，降低其殺菌效力；因此在軟水中使用，QAC分子能充分與菌體膜的磷脂帶負電頭基結合，殺菌效力增強。同時，高溫可提升分子運動速度，增強QAC與菌體膜的作用，進一步提高毒性（效力）。故在高溫、軟水條件下，benzalkonium chloride的效力最強。","we":["錯誤：在高溫、硬水條件下，硬水中的Ca²⁺和Mg²⁺等二價陽離子會與benzalkonium chloride（陽離子化合物）競爭結合菌體膜，顯著降低其殺菌效力，此條件下效力反而下降，並非效力增強的最佳環境。","","錯誤：低溫、軟水條件下，雖然軟水有利於QAC發揮作用，但低溫會降低分子動能，抑制QAC與菌體的相互作用速率，使整體效力低於高溫條件，故此條件下效力不如高溫軟水。","錯誤：低溫、硬水為最不利的條件，低溫降低反應速率，而硬水中的二價陽離子更嚴重干擾QAC的陽離子活性，兩者疊加使benzalkonium chloride的消毒效力大幅下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_059","year":2016,"roc_year":105,"session":"1","examNo":59,"q":"下列何者會與鈣、鎂、鐵或鋁等離子形成不溶性螯合物而易積聚於成長中的牙齒和骨骼中？","opts":["A. oxacillin","B. oxytetracycline","C. polymyxin B","D. bacitracin"],"ans":1,"exp":"Oxytetracycline（土黴素）及其他四環素類藥物（tetracyclines）含有多個可解離的羥基和羰基，能與Ca²⁺、Mg²⁺、Fe²⁺及Al³⁺等多價陽離子形成穩定的螯合物（chelates）。此螯合物與骨骼及牙齒中的羥基磷灰石（hydroxyapatite）具有高度親和性，容易沉積在正在礦化的骨骼和牙齒組織中。若在動物生長發育期間（包括胎兒期）給予，會造成牙齒黃染（tetracycline staining）及骨骼發育影響，因此幼齡動物及妊娠動物應避免使用。","we":["錯誤：Oxacillin（奧沙西林）為β-內醯胺類耐青黴素酶青黴素，作用機制為抑制細胞壁PBP，其化學結構不含多個可螯合多價金屬離子的基團，不會積聚於骨骼和牙齒。","","錯誤：Polymyxin B（多黏菌素B）為多肽類抗生素，作用機制為破壞革蘭氏陰性菌外膜的磷脂雙層，其結構為環形多肽，不會與Ca²⁺等陽離子形成螯合物沉積於骨骼牙齒。","錯誤：Bacitracin（桿菌肽）為多肽類抗生素，主要抑制細菌細胞壁前驅物的轉運（C55-undecaprenyl diphosphate去磷酸化），其化學結構不具螯合多價金屬離子的特性，不會積聚於骨骼和牙齒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_060","year":2016,"roc_year":105,"session":"1","examNo":60,"q":"下列何者最適合用於治療犬隻的革蘭氏陰性細菌感染所引起的腸胃炎及下痢？","opts":["A. penicillin V","B. cephalexin","C. kanamycin","D. erythromycin"],"ans":2,"exp":"Kanamycin（卡那黴素）屬氨基糖苷類（aminoglycoside）抗生素，對多種革蘭氏陰性腸道菌（如大腸桿菌Escherichia coli、沙門氏菌Salmonella spp.等）具有良好的殺菌活性。口服給藥時，kanamycin吸收極少，在腸道內維持高藥物濃度，可有效治療犬隻革蘭氏陰性細菌引起的腸胃炎及下痢。其餘選項均不適合：penicillin V（A）主要抗革蘭氏陽性菌、cephalexin（B）以革蘭氏陽性菌為主、erythromycin（D）主要抗革蘭氏陽性及非典型菌，對革蘭氏陰性腸道菌效果較差。","we":["錯誤：Penicillin V（苯氧甲基青黴素）主要對革蘭氏陽性球菌（如鏈球菌、葡萄球菌）有效，對大多數革蘭氏陰性腸道菌（如大腸桿菌）缺乏活性（因外膜屏障），不適合治療革蘭氏陰性細菌引起的腸胃炎。","錯誤：Cephalexin（頭孢氨苄）為第一代頭孢菌素，主要抗革蘭氏陽性菌，雖對部分革蘭氏陰性菌（如大腸桿菌）有輕度活性，但並非治療革蘭氏陰性腸道感染的首選，且對腸道革蘭氏陰性菌的療效不如aminoglycosides。","","錯誤：Erythromycin（紅黴素）屬巨環內酯類（macrolide），主要對革蘭氏陽性菌（金黃色葡萄球菌、鏈球菌）及部分非典型病原（Mycoplasma、Campylobacter）有效，對腸道革蘭氏陰性菌（如大腸桿菌、沙門氏菌）效果甚差，不適合治療犬革蘭氏陰性腸胃炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_061","year":2016,"roc_year":105,"session":"1","examNo":61,"q":"下列何者具有與penicillins相似的抗菌機制？","opts":["A. streptomycin","B. tetracycline","C. cephalexin","D. florfenicol"],"ans":2,"exp":"Cephalexin（頭孢氨苄）屬於頭孢菌素類（cephalosporins），與青黴素類（penicillins）同屬β-內醯胺類（β-lactam）抗生素，兩者的抗菌機制相同：均含有β-內醯胺環，能與細菌的青黴素結合蛋白（penicillin-binding proteins，PBPs），即轉肽酶（transpeptidase）共價結合，抑制細菌細胞壁肽聚糖（peptidoglycan）的最後交叉連結步驟，導致細胞壁缺損，最終使細菌溶菌死亡。其餘選項均屬不同機制的抗生素：streptomycin（A）抑制核糖體30S亞單位、tetracycline（B）抑制30S核糖體阻礙aminoacyl-tRNA結合、florfenicol（D）抑制50S核糖體肽基轉移酶。","we":["錯誤：Streptomycin（鏈黴素）屬氨基糖苷類，其作用機制為不可逆地與細菌核糖體30S亞單位（16S rRNA的A位點）結合，導致mRNA誤讀及蛋白質合成錯誤，與penicillins的細胞壁抑制機制完全不同。","錯誤：Tetracycline（四環素）屬四環素類，其作用機制為可逆地與核糖體30S亞單位結合，阻礙aminoacyl-tRNA進入A位點，抑制肽鏈延長，與penicillins作用機制不同。","","錯誤：Florfenicol（氟苯尼考）屬苯尼考類（fenicol），其作用機制為與核糖體50S亞單位的肽基轉移酶（peptidyl transferase）結合，抑制肽鍵形成，與penicillins的細胞壁合成抑制機制完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_062","year":2016,"roc_year":105,"session":"1","examNo":62,"q":"下列何種消毒劑是陽離子性化合物？","opts":["A. glutaraldehyde","B. chlorhexidine","C. iodophor","D. ethylene oxide"],"ans":1,"exp":"Chlorhexidine（氯己定）為雙胍類（bisbiguanide）消毒劑，其分子含有兩個正電荷的胍基（guanidinium groups），在生理pH下帶有強正電荷，屬於陽離子性化合物（cationic compound）。陽離子特性使其能與細菌細胞膜帶負電的磷脂頭基強力吸附結合，破壞細胞膜完整性，造成胞內物質滲漏。其餘選項：glutaraldehyde（A）為非離子型（中性）醛類消毒劑、iodophor（C）為非離子型碘伏製劑、ethylene oxide（D）為非離子型烷化劑，均非陽離子性化合物。","we":["錯誤：Glutaraldehyde（戊二醛）為非離子型（中性）雙功能醛類消毒滅菌劑，作用機制為交叉連結（cross-linking）蛋白質和核酸，使微生物蛋白質變性固化，並非陽離子性化合物。","","錯誤：Iodophor（碘伏）是碘（iodine）與增溶劑（如聚乙烯吡咯酮，PVP）的複合物，為非離子型製劑，其殺菌活性來自釋放出的游離碘（I₂），並非陽離子性化合物。","錯誤：Ethylene oxide（環氧乙烷，EtO）為氣體烷化劑，具有非離子性質，透過烷化（alkylation）微生物DNA、蛋白質及核酸發揮殺菌作用，常用於對熱或濕氣敏感器械的低溫滅菌，並非陽離子性化合物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_063","year":2016,"roc_year":105,"session":"1","examNo":63,"q":"下列何種藥物與磺胺劑併用有抗菌相乘作用？","opts":["A. trimethoprim","B. procaine","C. folic acid","D. p-aminobenzoic acid"],"ans":0,"exp":"Trimethoprim（甲氧苄啶）與磺胺劑（sulfonamides）合併使用時，對細菌葉酸合成路徑產生連續阻斷（sequential blockade）的雙重抑制作用：磺胺劑競爭性抑制二氫葉酸合成酶（dihydropteroate synthase），阻止PABA轉化為二氫蝶酸；trimethoprim則選擇性抑制細菌的二氫葉酸還原酶（dihydrofolate reductase，DHFR），阻止二氫葉酸（DHF）還原為四氫葉酸（THF）。兩藥作用於同一路徑的不同步驟，產生協同（synergistic）抗菌效果。","we":["","錯誤：Procaine（普魯卡因）為酯類局部麻醉藥，可在體內水解為PABA（對氨基苯甲酸），而PABA是磺胺劑的競爭性拮抗劑，因此procaine會「拮抗」磺胺劑的抗菌作用，而非產生協同作用。","錯誤：Folic acid（葉酸）為維生素，是磺胺劑作用標靶的下游產物，給予外源性葉酸可繞過磺胺劑的阻斷作用，使細菌直接利用外源葉酸，反而會降低磺胺劑的抗菌效果，無相乘抗菌作用。","錯誤：p-Aminobenzoic acid（PABA，對氨基苯甲酸）是磺胺劑的底物競爭物，磺胺劑正是透過競爭性抑制PABA的利用來發揮抗菌作用；添加PABA會直接拮抗磺胺劑的抗菌活性，不可能產生協同作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_064","year":2016,"roc_year":105,"session":"1","examNo":64,"q":"下列何種病原可用ribavirin防治？","opts":["A. 細菌","B. 病毒","C. 原蟲","D. 黴菌"],"ans":1,"exp":"Ribavirin（利巴韋林）為廣效型核苷類似物（nucleoside analogue）抗病毒藥，進入細胞後磷酸化為三磷酸形式，主要透過以下機制發揮抗病毒活性：抑制RNA依賴的RNA聚合酶（RdRp），阻礙病毒RNA的複製；誘導病毒RNA突變積累（error catastrophe）；抑制mRNA加帽（capping）等。Ribavirin對多種DNA和RNA病毒均有效，包括流感病毒、呼吸道合胞病毒（RSV）、病毒性出血熱病毒等，不具有抗細菌、抗原蟲或抗黴菌的活性。","we":["錯誤：細菌感染的治療使用抗生素，ribavirin並無抑制細菌細胞壁合成、核糖體蛋白質合成或DNA迴旋酶等細菌特有標靶的活性，對細菌感染無效。","","錯誤：原蟲（protozoa）感染的治療使用抗原蟲藥物（如metronidazole、pyrimethamine、amprolium等），ribavirin對原蟲缺乏活性，不用於治療原蟲感染。","錯誤：黴菌（真菌）感染的治療使用抗真菌藥（如amphotericin B、azoles、echinocandins等），ribavirin無抗真菌活性，不用於治療黴菌感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_065","year":2016,"roc_year":105,"session":"1","examNo":65,"q":"下列何者最適宜用於治療腎臟功能損傷之高齡貓的血巴東體感染症？","opts":["A. tetracycline","B. chlortetracycline","C. doxycycline","D. oxytetracycline"],"ans":2,"exp":"血巴東體（Haemobartonella，現稱Mycoplasma haemofelis）為貓科動物的胞內寄生菌，四環素類為首選治療藥物。然而，在腎臟功能損傷的高齡貓，大多數四環素（tetracycline A、chlortetracycline B、oxytetracycline D）主要依賴腎臟排泄，腎功能下降時血中濃度升高，毒性增加。Doxycycline例外，因其主要透過膽汁分泌進入腸道，以糞便排出，腎臟排泄量極少，故在腎功能損傷的患畜中使用最安全，血中半衰期受腎功能影響甚微，仍能有效治療血巴東體感染症。","we":["錯誤：Tetracycline（四環素）主要由腎臟排泄（腎絲球過濾），在腎功能損傷的患畜中清除率顯著下降，血中濃度升高可能加重腎臟損傷，不適合用於腎臟功能不全的高齡貓。","錯誤：Chlortetracycline（金黴素）同樣依賴腎臟排泄，且口服生體可用率較低，在腎功能損傷患畜中可能蓄積，不是首選；同時其胃腸道刺激性也較大。","","錯誤：Oxytetracycline（土黴素）亦主要由腎臟排泄，在腎功能不全患畜中使用同樣存在蓄積風險，且其親脂性不如doxycycline，組織穿透力較差，不適合腎功能損傷的高齡貓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_066","year":2016,"roc_year":105,"session":"1","examNo":66,"q":"能活化節肢動物的章魚涎胺（octopamine）受體而抑制神經傳導的藥物是：","opts":["A. amitraz","B. imidacloprid","C. fipronil","D. dinotefuran"],"ans":0,"exp":"Amitraz（雙甲脒）為甲脒類（formamidine）殺蟎劑，其主要作用機制為活化節肢動物（蜱螨、昆蟲）神經系統中的章魚涎胺（octopamine）受體，此受體功能類似脊椎動物的α₂腎上腺素受體。Octopamine受體的異常活化導致神經系統持續興奮，進而引起神經傳導抑制（paradoxical inhibition via autoreceptor activation）及昆蟲麻痺死亡。Amitraz同時也具有α₂腎上腺素受體致效劑活性（在哺乳動物），過量時可能引起鎮靜、心跳過慢等副作用。其餘選項：imidacloprid（B）為菸鹼型乙醯膽鹼受體（nAChR）致效劑、fipronil（C）阻斷GABA門控氯離子通道、dinotefuran（D）為neonicotinoid（nAChR致效劑）。","we":["","錯誤：Imidacloprid（益達胺）屬新菸鹼類（neonicotinoid）殺蟲劑，其作用機制為選擇性結合並持續活化昆蟲神經元的菸鹼型乙醯膽鹼受體（nAChR），導致昆蟲神經系統過度興奮而死亡，並非透過章魚涎胺受體作用。","錯誤：Fipronil（芬普尼）為苯基吡唑類（phenylpyrazole）殺蟲劑，其作用機制為阻斷節肢動物神經系統中GABA門控氯離子通道（GABA-gated chloride channels）及谷氨酸門控氯離子通道，導致神經過度興奮及死亡，並非透過章魚涎胺受體。","錯誤：Dinotefuran（啶蟲脒）同屬新菸鹼類（neonicotinoid）殺蟲劑，與imidacloprid相似，作用機制為結合昆蟲神經元的菸鹼型乙醯膽鹼受體（nAChR），誘發持續神經興奮，並非作用於章魚涎胺受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_067","year":2016,"roc_year":105,"session":"1","examNo":67,"q":"Febantel在動物之胃腸道內可被轉換為：","opts":["A. fenbendazole","B. mebendazole","C. albendazole","D. oxibendazole"],"ans":0,"exp":"Febantel（苯硫胺）本身為前驅藥（prodrug），在動物胃腸道經代謝後主要轉換為fenbendazole（芬苯達唑），屬苯并咪唑（benzimidazole）類驅蟲藥。Fenbendazole作用機制為選擇性結合寄生蟲的β-微管蛋白（β-tubulin），抑制微管聚合，破壞線蟲細胞骨架及葡萄糖攝取。市售複方製劑（如Drontal Plus）即含有febantel，利用其在腸道內轉化為fenbendazole的特性，發揮廣效驅蟲活性。","we":["","錯誤：Mebendazole（甲苯達唑）雖同為苯并咪唑類驅蟲藥，但febantel在腸道內的代謝產物主要為fenbendazole及oxfendazole，並非mebendazole；mebendazole是獨立的藥物，不是febantel的代謝產物。","錯誤：Albendazole（阿苯達唑）雖也是苯并咪唑類，但並非febantel的代謝轉化產物；albendazole本身即具活性，febantel的代謝路徑是轉化為fenbendazole而非albendazole。","錯誤：Oxibendazole（奧苯達唑）雖為苯并咪唑類驅蟲藥，但同樣不是febantel在動物腸道中的主要代謝產物；febantel的主要代謝轉化產物為fenbendazole（及次要產物oxfendazole）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_068","year":2016,"roc_year":105,"session":"1","examNo":68,"q":"作用機制能活化glutamate-gated chloride channels，導致線蟲與節肢動物骨骼肌鬆弛性癱瘓\r 的藥物是：","opts":["A. levamisole","B. ivermectin","C. morantel","D. dichlorvos"],"ans":1,"exp":"Ivermectin（依維菌素）屬阿維菌素類（avermectins），其作用機制為選擇性活化並增強節肢動物及線蟲神經肌肉接合處的谷氨酸門控氯離子通道（glutamate-gated chloride channels，GluCl channels），導致氯離子（Cl⁻）大量內流，引起細胞膜過極化（hyperpolarization），阻斷神經衝動傳導，造成蟲體骨骼肌鬆弛性癱瘓（flaccid paralysis）及死亡。此通道僅存在於無脊椎動物，哺乳動物不具有（雖有類似的GABA-gated Cl⁻ channels，但ivermectin在正常劑量下不易穿越哺乳動物血腦屏障），故選擇毒性高。","we":["錯誤：Levamisole（左旋咪唑）的作用機制為激動（agonist）線蟲神經肌肉接合處的菸鹼型乙醯膽鹼受體（nAChR），引起持續的去極化及痙攣性癱瘓（spastic paralysis），而非活化glutamate-gated Cl⁻ channels的鬆弛性癱瘓機制。","","錯誤：Morantel（莫蘭特）與levamisole相似，同為菸鹼型乙醯膽鹼受體致效劑，引起線蟲神經肌肉的持續去極化及痙攣性癱瘓，並非透過glutamate-gated Cl⁻ channels作用。","錯誤：Dichlorvos（敵敵畏）屬有機磷類殺蟲劑，作用機制為不可逆抑制乙醯膽鹼酯酶（AChE），導致突觸間乙醯膽鹼蓄積，引起節肢動物持續膽鹼能興奮，與glutamate-gated Cl⁻ channels的機制完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_069","year":2016,"roc_year":105,"session":"1","examNo":69,"q":"能抑制昆蟲幼蟲及卵之幾丁質生成的藥物是：","opts":["A. amitraz","B. fipronil","C. cyromazine","D. lufenuron"],"ans":3,"exp":"Lufenuron（諾弗隆）屬苯甲醯苯脲類（benzoylphenyl urea）昆蟲生長調節劑（insect growth regulator，IGR），作用機制為抑制昆蟲幾丁質合成酶（chitin synthase），阻礙幾丁質（chitin）的生合成，使昆蟲幼蟲無法形成正常的外骨骼（cuticle），幼蟲蛻皮（molt）失敗而死亡；同時可滲入卵中抑制孵化。Lufenuron口服給予貓狗，透過血液分布至皮脂腺，跳蚤吸血時攝入lufenuron，使其後代無法正常發育，屬於環境及動物身上的跳蚤防制策略。","we":["錯誤：Amitraz（雙甲脒）的作用機制為活化節肢動物的章魚涎胺（octopamine）受體，抑制神經傳導，主要用於殺蜱及殺蟎，並非抑制幾丁質生合成的昆蟲生長調節劑。","錯誤：Fipronil（芬普尼）的作用機制為阻斷節肢動物神經的GABA門控氯離子通道，導致神經過度興奮，屬於殺蟲劑而非昆蟲生長調節劑，不具抑制幾丁質合成的作用。","錯誤：Cyromazine（滅蠅胺）雖也屬昆蟲生長調節劑，能干擾昆蟲的蛻皮過程（可能透過影響蛻皮激素相關路徑），但其主要抑制的標靶機制與lufenuron的幾丁質合成抑制有所不同，且主要用途為防治蒼蠅幼蟲（蛆），並非「幾丁質生合成抑制」的最佳代表選項。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_070","year":2016,"roc_year":105,"session":"1","examNo":70,"q":"下列何者經口投藥吸收不佳，但可使用於胃腸道之酵母菌感染症？","opts":["A. nystatin","B. fluconazole","C. flucytosine","D. griseofulvin"],"ans":0,"exp":"Nystatin（制黴菌素）為多烯類（polyene）抗真菌藥，其化學特性使口服後幾乎不被胃腸道吸收，藥物以高濃度留存於整個消化道中。利用這一特性，nystatin口服可用於治療口腔至腸道的局部酵母菌（主要為Candida spp.，念珠菌）感染，包括口腔念珠菌病（鵝口瘡）及腸道念珠菌過度增殖。Nystatin的作用機制與amphotericin B相同，均為與真菌細胞膜的麥角固醇（ergosterol）結合，形成孔道，導致細胞膜通透性喪失，離子外漏，最終細胞死亡。","we":["","錯誤：Fluconazole（氟康唑）屬三唑類（triazole）抗真菌藥，口服後吸收良好（生體可用率接近100%），可分布至全身包括CSF，用於治療系統性真菌感染，其口服可吸收的特性使其作用方式與nystatin完全相反。","錯誤：Flucytosine（5-FC，5-氟胞嘧啶）口服吸收良好，分布廣泛，可穿透血腦屏障，用於治療Cryptococcus（隱球菌）及Candida系統性感染，通常與amphotericin B聯用，並非「口服不吸收但局部作用」的藥物。","錯誤：Griseofulvin（灰黃黴素）口服吸收良好（高脂肪食物可提高吸收），廣泛分布至皮膚、毛髮及指甲的角蛋白層，用於治療皮癬菌（dermatophyte）引起的皮膚真菌病，並非針對腸道酵母菌感染的局部作用藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_071","year":2016,"roc_year":105,"session":"1","examNo":71,"q":"下列何者為rotenone之抗蟲機制？","opts":["A. 溶解蟲體角皮層","B. 抑制幾丁質的生合成","C. 干擾昆蟲體內之NADH代謝","D. 干擾昆蟲生長激素的作用"],"ans":2,"exp":"Rotenone（魚藤酮）的殺蟲機制為抑制粒線體電子傳遞鏈的複合體I（Complex I，NADH：ubiquinone oxidoreductase，即NADH去氫酶），阻斷NADH將電子傳遞至輔酶Q（ubiquinone）的步驟，使昆蟲細胞無法正常進行氧化磷酸化生成ATP，造成細胞能量耗竭死亡。此機制即「干擾昆蟲體內之NADH代謝」的確切描述。Rotenone廣泛存在於豆科魚藤（Derris）植物中，可作為天然殺蟲殺魚藥物使用。","we":["錯誤：「溶解蟲體角皮層」描述的是某些油劑或界面活性劑類殺蟲劑的物理性殺蟲機制，rotenone並無溶解昆蟲外骨骼（cuticle）角皮層的作用，其殺蟲機制為針對細胞代謝的生化抑制。","錯誤：「抑制幾丁質的生合成」是苯甲醯苯脲類昆蟲生長調節劑（如lufenuron、diflubenzuron）的作用機制，rotenone對幾丁質合成酶（chitin synthase）無直接抑制作用。","","錯誤：「干擾昆蟲生長激素的作用」是保幼激素類似物（juvenile hormone analogues，如methoprene、pyriproxyfen）或蛻皮激素干擾劑的作用機制，rotenone並不影響昆蟲的生長激素系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_072","year":2016,"roc_year":105,"session":"1","examNo":72,"q":"下列何者用於治療牛Fasciola hepatica感染症？","opts":["A. avermectin","B. romifidine","C. clorsulon","D. clenbuterol"],"ans":2,"exp":"Clorsulon（氯磺隆）為磺胺醯胺類（sulfonamide-like）殺吸蟲藥（fasciolicide），專用於治療牛（及羊）的肝片吸蟲（Fasciola hepatica）感染症。其作用機制為抑制吸蟲糖解途徑中的兩種關鍵酵素：磷酸烯醇丙酮酸羧化激酶（phosphoenolpyruvate carboxykinase，PEPCK）及磷酸甘油酸激酶（phosphoglycerate kinase，PGK），阻斷吸蟲的能量代謝，導致蟲體死亡。Clorsulon常與ivermectin複方使用（如Ivomec Plus），兼顧驅除線蟲及吸蟲。","we":["錯誤：Avermectin（阿維菌素）為廣效型大環內酯類抗寄生蟲藥，作用機制為活化無脊椎動物的麩胺酸門控氯離子通道，主要對線蟲（nematodes）及節肢動物（arthropods）有效，對肝片吸蟲（trematodes/flukes）效果極差，不用於治療牛Fasciola hepatica感染。","錯誤：Romifidine（羅咪定）屬α₂腎上腺素受體致效劑（α₂-adrenergic agonist），為大動物（馬、牛）的鎮靜止痛藥，完全不具有抗寄生蟲活性，與治療肝片吸蟲感染毫無關聯。","","錯誤：Clenbuterol（克倫特羅）為β₂腎上腺素受體致效劑（β₂-agonist），臨床上用於馬的支氣管擴張（治療慢性阻塞性肺病），以及作為子宮平滑肌鬆弛劑（tocolytic），完全不具有抗寄生蟲活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_073","year":2016,"roc_year":105,"session":"1","examNo":73,"q":"下列何者可用於驅除犬Dirofilaria immitis之microfilaria？","opts":["A. piperazine citrate","B. milbemycin oxime","C. metronidazole","D. roxarsone"],"ans":1,"exp":"Milbemycin oxime（米爾貝黴素肟）屬米爾貝黴素類（milbemycins），與阿維菌素類（avermectins）同屬大環內酯類，作用機制為活化無脊椎動物神經的谷氨酸門控氯離子通道（GluCl channels），引起蟲體麻痺死亡。Milbemycin oxime在預防劑量下可殺滅犬心絲蟲（Dirofilaria immitis）的幼蟲（L3/L4期），同時對已存在的微絲蟲（microfilaria，L1期）也具有清除作用，臨床上用作每月一次的心絲蟲預防用藥（如Interceptor、Sentinel）。","we":["錯誤：Piperazine citrate（哌嗪）為老式氨基乙醇類驅蟲藥，作用機制為作用於線蟲的GABA受體，引起鬆弛性癱瘓，主要有效對象為蛔蟲（Toxocara、Ascaris），對犬心絲蟲（Dirofilaria immitis）的微絲蟲無效，且幾乎已被更有效的驅蟲藥取代。","","錯誤：Metronidazole（甲硝唑）屬硝基咪唑類（nitroimidazole），為抗原蟲藥及抗厭氧菌藥，用於治療賈第鞭毛蟲（Giardia）、毛滴蟲（Trichomonas）及厭氧菌感染，對絲狀線蟲（如心絲蟲Dirofilaria immitis）完全無效。","錯誤：Roxarsone（羅沙砷）為有機砷類飼料添加劑，曾用於禽類的球蟲病（coccidiosis）預防及促進生長，對犬心絲蟲微絲蟲無驅除活性，且現已因食安疑慮大幅限制使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_074","year":2016,"roc_year":105,"session":"1","examNo":74,"q":"下列何者為犬驅除蚤之用藥？","opts":["A. imidacloprid","B. imidocarb","C. imidazole","D. triamcinolone"],"ans":0,"exp":"Imidacloprid（益達胺）屬新菸鹼類（neonicotinoid）殺蟲劑，作用機制為選擇性持續激動（agonist）昆蟲神經系統的菸鹼型乙醯膽鹼受體（nAChR），導致昆蟲神經持續去極化，過度興奮而死亡。Imidacloprid選擇性高（對哺乳動物nAChR親和性低），製成犬貓外用點滴劑（spot-on），局部塗抹於頸背皮膚，藉皮脂腺分布至全身毛髮，可有效殺滅犬貓身上的跳蚤成蟲（adulticide），為最早上市的spot-on跳蚤成蟲殺滅劑之一（Advantage）。","we":["","錯誤：Imidocarb（咪多卡）屬脒類（diamidine）藥物，為抗原蟲藥（antiprotozoal），主要用於治療犬貓的巴貝西蟲病（Babesiosis）及犬無漿體病（Anaplasmosis），與跳蚤防治毫無關係。","錯誤：Imidazole（咪唑）為有機化合物，本身是抗真菌藥（如clotrimazole、miconazole）及某些獸醫用藥的化學基本結構，並非用於犬跳蚤驅除的殺蟲劑藥物名稱。","錯誤：Triamcinolone（曲安奈德）為合成糖皮質素（synthetic glucocorticoid），具有抗炎及免疫抑制作用，用於治療過敏反應、皮膚炎及關節炎等，不具任何殺蟲活性，與跳蚤防治完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_075","year":2016,"roc_year":105,"session":"1","examNo":75,"q":"下列何者慢性中毒稱為「鹼病（alkali disease）」，會引起牛隻明顯跛足及蹄部異常？","opts":["A. 砷","B. 硒","C. 碘","D. 汞"],"ans":1,"exp":"硒（selenium）慢性中毒在牛隻稱為「鹼病（alkali disease）」，因早期誤認中毒原因為土壤中的鹼性物質而得名，臨床主要症狀包括：蹄部變形與腐爛（蹄冠區域環形壞死、蹄部脫落）、明顯跛行（lameness）、毛髮脫落（尾毛及鬃毛脫落為特徵）、神經症狀（「blind staggers」，盲目徘徊型）及貧血等。硒慢性中毒見於長期採食富含硒植物（如Astragalus spp.，黃耆屬）的牧草地區動物，或飼料添加硒過量時。","we":["錯誤：砷（arsenic）慢性中毒（砷中毒，arsenicosis）的主要臨床表現包括皮膚角化過度（hyperkeratosis）、皮膚色素沉著（hyperpigmentation）、Mees' lines（指甲白線）、周邊神經病變及胃腸道症狀，牛隻並不出現「鹼病」及典型蹄部異常，與硒中毒的表現不同。","","錯誤：碘（iodine）慢性中毒（碘過多症，iodism）的主要表現為流淚、流鼻水、皮膚病變（碘疹）及甲狀腺功能異常，並不以「鹼病」及蹄部變形為特徵，與硒中毒的臨床表現不符。","錯誤：汞（mercury）慢性中毒（汞中毒，mercurialism）主要造成神經系統損害（震顫、步態不穩）、腎臟損傷及口腔炎，並不稱為「鹼病」，也不以牛隻跛足及蹄部異常為典型特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_076","year":2016,"roc_year":105,"session":"1","examNo":76,"q":"動物亞硝酸鹽的急性中毒可用下列何者治療？","opts":["A. 四甲基藍溶液","B. 硫代硫酸鈉溶液","C. 硫酸鈉溶液","D. 氯酸鹽溶液"],"ans":0,"exp":"亞硝酸鹽（nitrite）急性中毒的主要機制為：亞硝酸鹽將血紅素中的Fe²⁺（亞鐵）氧化為Fe³⁺（鐵），生成高鐵血紅素（methemoglobin，MetHb），無法攜帶氧氣，造成組織缺氧、黏膜發紫（發紺）等症狀。治療首選為四甲基藍溶液（即亞甲藍，methylene blue），其作為電子傳遞媒介，經NADPH-methemoglobin reductase作用，將Fe³⁺重新還原為Fe²⁺，恢復血紅素攜氧功能。適用劑量需注意，過量亞甲藍本身會造成氧化性溶血。","we":["","錯誤：硫代硫酸鈉溶液（sodium thiosulfate）為氰化物（cyanide）中毒的解毒劑，可與硫氰酸酶（rhodanese）將氰化物轉化為毒性較低的硫氰酸鹽（thiocyanate），對亞硝酸鹽中毒（高鐵血紅素血症）無解毒作用；硫代硫酸鈉有時也作為氰化物解毒方案的第二步（與亞硝酸鹽搭配），但不用於治療亞硝酸鹽本身的中毒。","錯誤：硫酸鈉溶液（sodium sulfate）為瀉劑（cathartic），可用於加速腸道毒物排出，對亞硝酸鹽急性中毒引起的高鐵血紅素血症無特異性解毒作用，不是本症的治療藥物。","錯誤：氯酸鹽溶液（chlorate solution）本身即是一種氧化性毒物，可造成高鐵血紅素血症及溶血，使用氯酸鹽治療亞硝酸鹽中毒不僅無效，反而會加重病情，絕對禁忌使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_077","year":2016,"roc_year":105,"session":"1","examNo":77,"q":"動物硫化氫中毒時血液及組織呈現何種顏色？","opts":["A. 櫻紅色","B. 暗黑色","C. 褐色","D. 黃色"],"ans":1,"exp":"硫化氫（H₂S）中毒時，H₂S可與血紅素中的Fe²⁺結合形成硫化血紅素（sulfhemoglobin）及鐵硫化物（iron sulfide），同時H₂S在組織中也可與含鐵的粒線體細胞色素氧化酶（cytochrome c oxidase）結合形成鐵硫化物沉積，使血液及組織呈現暗黑色（dark/blackish color）。此顏色改變為硫化氫中毒的特徵性病理所見，有助於區分其他中毒症狀。此外，H₂S本身具有類似「臭雞蛋」的特殊氣味，也是中毒現場的重要線索。","we":["錯誤：血液及組織呈「櫻紅色（cherry red）」是一氧化碳（CO）中毒的特徵性表現，CO與血紅素結合形成碳氧血紅素（carboxyhemoglobin，COHb），使血液呈鮮艷的櫻紅色，與硫化氫中毒的暗黑色完全不同。","","錯誤：血液或組織呈「褐色（brown）」是亞硝酸鹽或氯酸鹽中毒（高鐵血紅素血症，methemoglobinemia）的特徵，高鐵血紅素（MetHb）使血液呈巧克力棕色，與硫化氫中毒的暗黑色不同。","錯誤：血液或組織呈「黃色（yellow）」通常與溶血性黃疸（hemolytic jaundice，如洋蔥或甲狀腺素過量引起溶血）或肝臟疾病引起的黃疸相關，並非硫化氫中毒的典型色彩改變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_078","year":2016,"roc_year":105,"session":"1","examNo":78,"q":"有機磷中毒時，關於atropine的使用，下列何者錯誤？","opts":["A. 需每隔3-6小時重複注射一次","B. 當瞳孔已恢復得較大，流涎已停止，而動物似已逐漸復原時，仍須給與適量的藥物","C. 過量時，會導致行為激動、運動過度以及譫妄症狀","D. 可以阻斷中毒時的膽鹼性反應"],"ans":3,"exp":"Atropine為毒蕈鹼型膽鹼受體（muscarinic receptor）拮抗劑，在有機磷中毒時，可有效阻斷毒蕈鹼性（muscarinic）效應，包括：流涎、流淚、瞳孔縮小、支氣管痙攣、心跳過慢等副交感神經亢進症狀。然而，atropine無法阻斷菸鹼型（nicotinic）膽鹼受體效應：包括神經肌肉接合處（NMJ）的骨骼肌持續收縮（導致肌肉顫抖及麻痺）及自律神經節的效應，故D選項「可以阻斷中毒時的膽鹼性反應（全部）」的描述為錯誤，因atropine僅能阻斷毒蕈鹼性而非「所有」膽鹼性反應。","we":["此為正確描述：有機磷中毒時，由於AChE被抑制，乙醯膽鹼持續蓄積，每隔3–6小時重複注射atropine確實是標準治療方案的一部分（需根據臨床症狀調整頻率），此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：即使動物症狀逐漸改善（瞳孔恢復較大、流涎停止），仍應繼續給予適量atropine以防止症狀反彈，因有機磷中毒時AChE抑制可能持續較長時間，此建議正確，不符合題目問的「錯誤」描述。","此為正確描述：Atropine過量時確實可引起抗膽鹼毒性（anticholinergic toxicity），表現為行為激動（agitation）、心跳加速、運動過度（hyperactivity）及譫妄（delirium）等症狀，此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_079","year":2016,"roc_year":105,"session":"1","examNo":79,"q":"下列何者之化學結構屬於四級銨鹽類，對中樞神經系統及眼睛之作用最小？","opts":["A. atropine","B. glycopyrrolate","C. tropicamide","D. scoploamine"],"ans":1,"exp":"Glycopyrrolate（格隆溴銨）為四級銨鹽類（quaternary ammonium compound）抗膽鹼藥，因分子帶有永久正電荷，極性高、親脂性低，在生理條件下幾乎不能穿越血腦屏障（blood-brain barrier，BBB）或血眼屏障（blood-ocular barrier）。因此，與tertiary amine（三級胺類）的atropine、scopolamine、tropicamide等相比，glycopyrrolate對中樞神經系統（無鎮靜、無譫妄）及眼睛（無明顯散瞳）的作用最小，特別適合用於術前給藥或需要減少口腔及氣道分泌但不想影響CNS及眼睛的情況。","we":["錯誤：Atropine屬三級胺類（tertiary amine）結構，親脂性高，可輕易穿越血腦屏障及血眼屏障，產生中樞效應（包括大劑量時的鎮靜或激動、譫妄）及散瞳效果（mydriasis），並非「對CNS及眼睛作用最小」的選項。","","錯誤：Tropicamide（托吡卡胺）屬三級胺類合成抗膽鹼藥，親脂性佳，常製成眼藥水用於眼科散瞳及調節麻痺（cycloplegia），可穿越血眼屏障，對眼睛有顯著作用，並非「眼睛作用最小」。","錯誤：Scopolamine（東莨菪鹼，scoploamine）屬三級胺類，親脂性高，較atropine更易穿越血腦屏障，對CNS鎮靜作用甚至強於atropine，常用於止暈（anti-motion sickness）及術前給藥，並非CNS及眼睛作用最小的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_080","year":2016,"roc_year":105,"session":"1","examNo":80,"q":"下列何者為腎上腺素性β2受體致效劑？","opts":["A. aminophylline","B. prazosin","C. propranolol","D. terbutaline"],"ans":3,"exp":"Terbutaline（沙丁胺醇的類似物）為選擇性β₂腎上腺素受體致效劑（selective β₂-adrenergic agonist），主要作用為：擴張支氣管（bronchodilation，用於氣喘及犬貓慢性阻塞性肺病）及鬆弛子宮平滑肌（tocolysis，用於防止早產及難產）。其餘選項均不是β₂受體致效劑：aminophylline（A）為甲基黃嘌呤類（xanthine），透過抑制磷酸二酯酶提升cAMP，為非選擇性支氣管擴張劑；prazosin（B）為選擇性α₁腎上腺素受體拮抗劑（antihypertensive）；propranolol（C）為非選擇性β₁/β₂腎上腺素受體拮抗劑（β-blocker）。","we":["錯誤：Aminophylline（胺茶鹼）屬甲基黃嘌呤類（methylxanthine），作用機制為抑制磷酸二酯酶（phosphodiesterase）使cAMP蓄積，並拮抗腺苷受體，是非選擇性的支氣管擴張劑，並非β₂腎上腺素受體致效劑，兩者作用機制完全不同。","錯誤：Prazosin（哌唑嗪）為選擇性α₁腎上腺素受體拮抗劑（α₁-blocker），用於治療高血壓及前列腺增生，可舒張血管平滑肌降低血壓，與β₂受體毫無關聯，不具支氣管擴張或子宮鬆弛作用。","錯誤：Propranolol（普萘洛爾）為非選擇性β受體拮抗劑（non-selective β-blocker），同時阻斷β₁及β₂腎上腺素受體，用於心律不整及高血壓，其阻斷β₂受體的作用反而可能引起支氣管收縮，是terbutaline的藥理學對立面。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_001","year":2016,"roc_year":105,"session":"2","examNo":1,"q":"下列何者的葡萄醛酸接合反應（glucuronidation）能力最低？","opts":["A. 犬","B. 貓","C. 豬","D. 人"],"ans":1,"exp":"貓缺乏足夠的UDP-葡萄醛酸基轉移酶（UDP-glucuronosyltransferase, UGT），尤其是UGT1A6亞型幾乎缺失，因此貓的葡萄醛酸接合反應（glucuronidation）能力在常見獸醫動物中最低。這使貓對乙醯胺酚（acetaminophen）、阿斯匹林等依賴此代謝途徑的藥物特別敏感，容易發生毒性反應。犬、豬和人均具有較完整的UGT酵素，葡萄醛酸接合能力正常。","we":["錯誤：犬具有功能性的UDP-葡萄醛酸基轉移酶，可進行葡萄醛酸接合反應，其能力遠高於貓，並非最低。","","錯誤：豬的葡萄醛酸接合代謝能力正常，UGT酵素功能完整，不是此反應能力最低的動物。","錯誤：人類具有多種UGT亞型，葡萄醛酸接合能力正常，不是此反應能力最低的物種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_002","year":2016,"roc_year":105,"session":"2","examNo":2,"q":"下列何者最適合顯示藥物之AUC（area under curve）？","opts":["A. 血漿中藥物之分布容積","B. 血漿中結合態之藥物濃度","C. 藥物之絲球體濾過清除率","D. 藥物血中濃度"],"ans":3,"exp":"AUC（area under the curve，血中濃度-時間曲線下面積）是以藥物血中濃度（blood/plasma drug concentration）對時間作圖所得曲線的下方面積，代表藥物系統性暴露量。繪製AUC的橫軸為時間，縱軸為血漿中藥物濃度，因此「藥物血中濃度」對時間的圖形最能直接顯示AUC。","we":["錯誤：分布容積（volume of distribution, Vd）是描述藥物在體內分布範圍的藥動學參數，以容積單位（L或L/kg）表示，無法直接顯示AUC圖形。","錯誤：血漿中結合態藥物濃度不代表總藥物濃度，AUC計算需使用總血漿藥物濃度（結合態＋游離態），僅測結合態會低估真實暴露量。","錯誤：絲球體濾過清除率（GFR clearance）是描述腎臟排泄功能的參數，而非可顯示AUC的圖形縱軸。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_003","year":2016,"roc_year":105,"session":"2","examNo":3,"q":"當定時定量給與藥物，經過多少個半衰期之後，其血漿中藥物濃度可達到穩定狀態之93.75%？","opts":["A. 2","B. 3","C. 4","D. 5"],"ans":2,"exp":"每經過一個半衰期，血漿藥物濃度達到穩定狀態（steady state）的百分比依次為：1個t½＝50%、2個t½＝75%、3個t½＝87.5%、4個t½＝93.75%、5個t½＝96.875%。因此達到穩定狀態93.75%需經過4個半衰期。計算方式：1 − (1/2)⁴ = 1 − 1/16 = 15/16 = 93.75%。","we":["錯誤：2個半衰期後，血漿濃度僅達穩定狀態的75%（1 − (1/2)² = 75%），不是93.75%。","錯誤：3個半衰期後，血漿濃度達穩定狀態的87.5%（1 − (1/2)³ = 87.5%），不是93.75%。","","錯誤：5個半衰期後，血漿濃度達穩定狀態的96.875%，已超過93.75%，並非恰好達到93.75%的時間點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_004","year":2016,"roc_year":105,"session":"2","examNo":4,"q":"大多數藥品經皮下注射後，會以何種機制被吸收？","opts":["A. 被動擴散（passive diffusion）","B. 主動運輸（active transport）","C. 吞噬作用（phagocytosis）","D. 促進性擴散（facilitated diffusion）"],"ans":0,"exp":"藥物經皮下注射後，其主要吸收機制為被動擴散（passive diffusion）。藥物從注射部位的高濃度沿濃度梯度，被動地擴散穿越微血管壁的膜脂質雙層進入血液循環，此過程不需消耗能量。大多數藥物具有一定的脂溶性，能以被動擴散方式通過生物膜。","we":["","錯誤：主動運輸（active transport）需消耗ATP能量且需要特定載體蛋白，主要發生在腎小管和腸道上皮等特定組織，並非皮下注射藥物的主要吸收方式。","錯誤：吞噬作用（phagocytosis）是細胞吞入大型顆粒（如細菌、細胞碎片）的過程，極少量的大分子或顆粒劑型可能涉及，但不是大多數藥物皮下吸收的機制。","錯誤：促進性擴散（facilitated diffusion）雖不耗能，但需要特定載體蛋白，主要用於葡萄糖等特定分子的跨膜轉運，不是一般藥物皮下注射後的主要吸收機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_005","year":2016,"roc_year":105,"session":"2","examNo":5,"q":"腎臟排泄藥物的二種主要機制為何？","opts":["A. 絲球體過濾、被動分泌","B. 尿液濃縮、主動分泌","C. 主動分泌、絲球體過濾","D. 絲球體過濾、尿液濃縮"],"ans":2,"exp":"腎臟排泄藥物的兩種主要機制為：①絲球體過濾（glomerular filtration）：游離（未結合蛋白質）的小分子藥物隨血漿被過濾至鮑氏囊；②主動分泌（active secretion）：藥物由腎小管上皮細胞上的轉運蛋白（OAT、OCT等）主動泵入管腔，可排泄與蛋白質結合的藥物，為耗能過程。被動重吸收雖存在，但非主要「排泄」機制。","we":["錯誤：「被動分泌」並非腎臟排泄藥物的標準分類機制；腎小管確實存在被動重吸收，但排泄的兩大主要機制是絲球體過濾與主動分泌，而非被動分泌。","錯誤：尿液濃縮是腎臟調節水分和電解質的功能，可使藥物隨尿液排出時濃度升高，但本身不是主動排泄藥物的機制，更非兩大主要排泄機制之一。","","錯誤：尿液濃縮不屬於藥物腎臟排泄的主要機制，正確配對應為「主動分泌」與「絲球體過濾」，而非「尿液濃縮」與「絲球體過濾」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_006","year":2016,"roc_year":105,"session":"2","examNo":6,"q":"若以肌肉注射投藥，為減少血中藥物高低濃度的差距，則下列方法中，何者較可行？","opts":["A. 增加藥品生物轉換速率","B. 增加藥品分布體積","C. 增加藥品排泄速率","D. 增加投藥頻率"],"ans":3,"exp":"肌肉注射給藥後，血中濃度呈現峰谷交替。若要減少血中藥物濃度的高低差距（峰谷波動），最可行的方法是增加投藥頻率（縮短給藥間隔）。每次劑量雖減少，但藥物更頻繁補充，可維持血中濃度在較窄的範圍內，達到更平穩的血中濃度曲線，接近靜脈滴注的效果。","we":["錯誤：增加生物轉換速率（代謝速率）只會使藥物更快被消除，加速濃度下降，反而可能加大峰谷差距，無法平穩血中濃度。","錯誤：增加分布體積（Vd）使藥物更多分布至組織，雖可降低血漿峰濃度，但也會使谷值更低，不能有效縮小峰谷差距。","錯誤：增加排泄速率只會加速藥物從體內清除，使谷濃度更低，峰谷差距反而可能增大。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_007","year":2016,"roc_year":105,"session":"2","examNo":7,"q":"已知尿液pH=6.4，甲藥物pKa=5.4，乙藥物pKa=8.4，若同時靜脈注射這二種弱鹼性藥物，乙藥物於尿中之離子型態所占百分\r 比為何？","opts":["A. 9","B. 1","C. 99","D. 50"],"ans":2,"exp":"依Henderson-Hasselbalch方程式，弱鹼性藥物：pH = pKa + log([B]/[BH⁺])，其中[B]為非離子型、[BH⁺]為離子型。乙藥物（pKa=8.4）在尿液（pH=6.4）中：6.4 = 8.4 + log([B]/[BH⁺])，故 log([B]/[BH⁺]) = −2，即 [B]/[BH⁺] = 10⁻² = 1/100。因此 [BH⁺]/[B] = 100，離子型：非離子型 = 100:1。離子型百分比 = 100/(100+1) × 100 ≈ 99%。弱鹼在酸性尿液中大量離子化，有利於腎臟排泄。","we":["錯誤：9% 對應 [BH⁺]/[B] = 9/91，不符合Henderson-Hasselbalch方程式的計算結果（比值應為100:1）。","錯誤：1% 是混淆計算方向，若[B]/[BH⁺]=100，則離子型僅佔1%，但此為pKa=6.4在pH=8.4的情況，而題目是弱鹼pKa=8.4在pH=6.4，應以100:1計算，離子型佔99%。","","錯誤：50% 僅在 pH = pKa（即pH=8.4）時離子型與非離子型各半；在pH=6.4（比pKa低2個單位）的酸性環境下，弱鹼高度離子化，遠不止50%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_008","year":2016,"roc_year":105,"session":"2","examNo":8,"q":"關於clomipramine的作用機制與治療用途的敘述，下列何者錯誤？","opts":["A. 抑制正腎上腺素及血清素的再吸收","B. 不可用於治療犬的強迫性障礙","C. 在貓使用於治療尿噴行為和心因性禿毛","D. 可用於治療犬的優越性攻擊（dominance-related aggression）行為"],"ans":1,"exp":"Clomipramine（氯米帕明）是三環類抗憂鬱藥，可抑制正腎上腺素（norepinephrine）及血清素（serotonin）的再吸收。在獸醫臨床上，clomipramine是美國FDA核准用於治療犬強迫性障礙（canine obsessive-compulsive disorder, OCD）的藥物，因此選項B「不可用於治療犬的強迫性障礙」是錯誤的描述。此藥確實可用於犬OCD、犬優越性攻擊行為，以及貓的尿噴行為和心因性禿毛。","we":["此為正確描述：clomipramine的作用機制確實是抑制正腎上腺素及血清素的再回收（再吸收），為其抗憂鬱和行為改善作用的基礎，不符合題目問的「錯誤」描述。","","此為正確描述：clomipramine在貓確實用於治療尿噴（urine spraying）行為和心因性禿毛（psychogenic alopecia），不符合題目問的「錯誤」描述。","此為正確描述：clomipramine可用於治療犬的優越性攻擊（dominance-related aggression）行為，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_009","year":2016,"roc_year":105,"session":"2","examNo":9,"q":"關於buspirone的敘述，下列何者錯誤？","opts":["A. 為不具有鎮靜作用的抗焦慮劑","B. 是一個5-HT1A受體部分致效劑","C. 引起的中樞神經抑制作用非常大","D. 不引起精神運動性的困擾（psychomotor disturbance）"],"ans":2,"exp":"Buspirone（丁螺環酮）是一種非苯二氮平類（non-benzodiazepine）抗焦慮藥，其特點是不具有鎮靜催眠作用，對中樞神經的抑制作用極微（minimal CNS depression）。因此選項C「引起的中樞神經抑制作用非常大」是錯誤的描述。Buspirone為5-HT1A受體部分致效劑，抗焦慮效果緩慢（需數週），且不引起精神運動困擾、不產生依賴性、不鎮靜，是其與benzodiazepines的主要區別。","we":["此為正確描述：buspirone確實不具鎮靜作用，被歸類為「非鎮靜性抗焦慮藥」（non-sedating anxiolytic），不符合題目問的「錯誤」描述。","此為正確描述：buspirone是5-HT1A受體的部分致效劑（partial agonist），此為其抗焦慮作用的主要機制，不符合題目問的「錯誤」描述。","","此為正確描述：buspirone不引起精神運動性困擾（psychomotor disturbance），不影響協調和反應能力，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_010","year":2016,"roc_year":105,"session":"2","examNo":10,"q":"關於抗焦慮劑chlordiazepoxide之敘述，下列何者錯誤？","opts":["A. 不具有刺激食慾，但有抗焦慮，以及鎮靜的特性","B. 使用於治療多種動物園動物的攻擊和極度的恐懼","C. 作用於腦的邊緣系統，因而調節情感反應","D. 在中等劑量時，對心臟或血壓很少有作用"],"ans":0,"exp":"Chlordiazepoxide（氯二氮平）是benzodiazepine類抗焦慮藥，其已知特性包括：具有刺激食慾（appetite stimulation）的效果。因此選項A「不具有刺激食慾」的描述是錯誤的；chlordiazepoxide確實可刺激食慾，這一效果在臨床上偶爾被利用。其餘特性（抗焦慮、鎮靜、用於動物園動物、作用於邊緣系統、低劑量對心臟血壓影響小）均屬正確。","we":["","此為正確描述：chlordiazepoxide確實用於多種動物園動物的攻擊行為和極度恐懼（extreme fear）的鎮靜管理，不符合題目問的「錯誤」描述。","此為正確描述：benzodiazepine類藥物作用於腦的邊緣系統（limbic system），增強GABA的抑制作用，調節情感反應（emotional response），不符合題目問的「錯誤」描述。","此為正確描述：chlordiazepoxide在中等劑量下對心臟功能和血壓影響極小，是其相對安全的特性之一，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_011","year":2016,"roc_year":105,"session":"2","examNo":11,"q":"Benzodiazepine類衍生物對神經之影響主要造成以下何種現象？","opts":["A. 神經之去極化","B. 神經之過極化","C. 促使神經電位趨向於零","D. 對神經電位無影響"],"ans":1,"exp":"Benzodiazepine類藥物與GABA-A受體上的苯二氮平結合位點結合，增強GABA（γ-氨基丁酸）的抑制性神經傳導效果，使Cl⁻通道開放頻率增加，導致更多氯離子流入神經元，造成神經細胞膜電位更負（超極化，hyperpolarization），即「過極化」，使神經元更難產生動作電位。此為其抗焦慮、鎮靜及抗痙攣作用的基礎。","we":["錯誤：去極化（depolarization）指膜電位由負值向正值方向移動，使神經元興奮，benzodiazepine恰好相反，是促進抑制而非興奮神經。","","錯誤：「促使神經電位趨向於零」是部分去極化的描述（靜止膜電位約−70 mV趨近於0 mV），不正確；benzodiazepine使膜電位更負（更遠離零），非趨向零。","錯誤：Benzodiazepine對神經電位有明確的影響，即增強GABA介導的Cl⁻內流造成超極化，並非無影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_012","year":2016,"roc_year":105,"session":"2","examNo":12,"q":"下列有關chloral hydrate的敘述中，何者正確？","opts":["A. 在體內可被代謝而產生chloroform","B. 僅可靜脈注射投藥","C. 麻醉劑量遠低於半致死劑量","D. 具有抑制中樞神經的作用"],"ans":3,"exp":"Chloral hydrate（水合氯醛）是中樞神經抑制劑，作用於中樞神經系統產生鎮靜、催眠及麻醉效果。其主要透過增強GABA介導的抑制性神經傳導發揮作用。選項D「具有抑制中樞神經的作用」是正確的描述。補充說明：chloral hydrate在體內被代謝為trichloroethanol（活性代謝物），而非chloroform；可口服或直腸給藥，不限靜脈注射；其麻醉劑量與半致死劑量相近，安全域（safety margin）窄。","we":["錯誤：Chloral hydrate在體內的代謝產物主要是trichloroethanol（三氯乙醇），而非chloroform（氯仿）。Trichloroethanol才是其主要活性代謝物。","錯誤：Chloral hydrate可經口服（灌胃）或直腸給藥，並非僅限靜脈注射投藥。事實上靜脈注射反而少用，因刺激性強。","錯誤：Chloral hydrate的安全域（safety margin）窄，其麻醉劑量與半致死劑量（LD50）相近，而非「遠低於」，使用時需謹慎。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_013","year":2016,"roc_year":105,"session":"2","examNo":13,"q":"Morphine 對犬造成嘔吐之作用機制主要為透過活化何種受體所引起？","opts":["A. 多巴胺D2受體","B. µ受體","C. δ受體","D. κ受體"],"ans":0,"exp":"Morphine在犬中引起嘔吐的主要機制是直接刺激位於第四腦室底部的化學感受器觸發區（chemoreceptor trigger zone, CTZ）。CTZ富含多巴胺D2受體，morphine透過活化D2受體興奮CTZ，進而觸發嘔吐中樞（vomiting center）產生嘔吐反應。這也是為何多巴胺D2拮抗劑（如metoclopramide、acepromazine）可用於預防morphine誘發的嘔吐。","we":["","錯誤：µ受體（mu opioid receptor）是morphine的主要鎮痛和鎮靜作用受體，也介導呼吸抑制和便秘，但在犬誘發嘔吐的途徑主要是透過CTZ的D2受體，而非直接的µ受體刺激。","錯誤：δ受體（delta opioid receptor）參與部分鎮痛和情緒調節，不是morphine在犬誘發嘔吐的主要受體機制。","錯誤：κ受體（kappa opioid receptor）主要介導鎮靜和脊髓鎮痛，在某些物種（如貓）可引起嗜睡，但不是morphine在犬誘發嘔吐的主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_014","year":2016,"roc_year":105,"session":"2","examNo":14,"q":"氣體麻醉機的氣體衝出瓣（pop-off valve）的主要功用為何？","opts":["A. 預防nitrous oxide的吸入","B. 協助二氧化碳的排出","C. 預防呼吸循環中的壓力過高","D. 用於分隔吸入與呼出的氣體"],"ans":2,"exp":"氣體麻醉機的氣體衝出瓣（pop-off valve，又稱APL valve，adjustable pressure-limiting valve）的主要功用是預防呼吸循環迴路中的壓力過高。當氣體在迴路中積聚時，此閥門開放排出多餘氣體，防止壓力過高導致氣壓傷（barotrauma）或影響呼吸。在控制呼吸模式下通常關閉此閥並改以呼吸機控制。","we":["錯誤：預防nitrous oxide吸入是透過氣體流量計和氣體選擇器（flow meter和gas selector）來控制，而非pop-off valve的功能。","錯誤：二氧化碳的排出由CO2吸收罐（soda lime canister）和單向瓣膜（unidirectional valves）負責，pop-off valve是排出過多氣體以控制迴路壓力，而非專門協助CO2排出。","","錯誤：分隔吸入與呼出氣體的功能由單向瓣膜（inspiratory and expiratory unidirectional valves）負責，非pop-off valve。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_015","year":2016,"roc_year":105,"session":"2","examNo":15,"q":"治療貓之膀胱無力最適宜使用下列何種藥物？","opts":["A. carbachol","B. methacholine","C. acetylcholine","D. bethanechol"],"ans":3,"exp":"治療貓膀胱無力（atony of urinary bladder）最適合使用bethanechol（氯貝膽鹼），因為它是選擇性膽鹼激性藥（cholinomimetic），僅作用於毒蕈鹼（muscarinic）受體，可刺激膀胱逼尿肌（detrusor muscle）收縮、促進排尿，且對尼古丁受體無作用，因此不會引起骨骼肌興奮等副作用。Bethanechol不被膽鹼酯酶水解，作用時間較長，是臨床首選。","we":["錯誤：Carbachol（卡巴膽鹼）同時作用於毒蕈鹼和尼古丁受體，副作用較多，且全身性作用強烈，臨床不作為膀胱無力的首選，相比bethanechol安全性較低。","錯誤：Methacholine（氯醋甲膽鹼）雖具毒蕈鹼作用，但對心臟和血管的作用較強，且易引起支氣管痙攣，不適合用於治療膀胱無力。","錯誤：Acetylcholine（乙醯膽鹼）在體內迅速被膽鹼酯酶水解，作用時間極短，且同時作用於毒蕈鹼和尼古丁受體，臨床上不適合用於治療膀胱無力。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_016","year":2016,"roc_year":105,"session":"2","examNo":16,"q":"以下那一抗痙攣藥物經口投予之後可於肝臟代謝產生phenobarbital？","opts":["A. primidone","B. phenytoin","C. diazepam","D. acepromazine"],"ans":0,"exp":"Primidone（普里米酮）是一種抗痙攣藥，口服後在肝臟內被代謝為phenobarbital（苯巴比妥）和苯乙基丙二醯胺（PEMA, phenylethylmalonamide），其中phenobarbital是主要的活性代謝物，也是primidone抗癲癇作用的主要貢獻者。因此primidone被視為phenobarbital的前驅藥（prodrug）。","we":["","錯誤：Phenytoin（苯妥英）在肝臟代謝產生p-HPPH（4-hydroxyphenyl苯乙基乙内酰脲）等代謝物，不會產生phenobarbital。Phenytoin是另一種抗痙攣藥，作用機制為阻斷電壓依賴性Na⁺通道。","錯誤：Diazepam（煩寧）代謝為nordiazepam、temazepam、oxazepam等苯二氮平代謝物，不會產生phenobarbital。","錯誤：Acepromazine（乙醯丙嗪）是吩噻嗪類鎮靜劑，用於術前鎮靜，並非抗痙攣藥，代謝後不產生phenobarbital。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_017","year":2016,"roc_year":105,"session":"2","examNo":17,"q":"下列何者是acetazolamide之利尿作用主要影響部位？","opts":["A. 遠端彎曲腎小管","B. 近端彎曲腎小管","C. 亨利氏環（loop of Henle）","D. 集尿管"],"ans":1,"exp":"Acetazolamide（乙醯唑胺）是碳酸酐酶抑制劑（carbonic anhydrase inhibitor），其利尿作用的主要作用部位為近端彎曲腎小管（proximal convoluted tubule）。在近端小管，碳酸酐酶催化CO2 + H2O → H2CO3 → H⁺ + HCO3⁻，H⁺分泌至管腔換回Na⁺（間接促進NaHCO3重吸收）。抑制此酶後，HCO3⁻重吸收減少，Na⁺和水的重吸收也相應減少，產生利尿效果，同時尿液變為鹼性。","we":["錯誤：遠端彎曲腎小管是保鉀利尿劑（如aldosterone拮抗劑spironolactone）及噻嗪類利尿劑的次要作用位點，不是acetazolamide的主要作用部位。","","錯誤：亨利氏環是loop利尿劑（如furosemide、bumetanide）的主要作用部位，不是acetazolamide的作用位點。","錯誤：集尿管是抗利尿激素（ADH/vasopressin）及保鉀利尿劑的作用位點，acetazolamide主要在近端小管發揮作用，不在集尿管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_018","year":2016,"roc_year":105,"session":"2","examNo":18,"q":"下列何者為強心配醣體digoxin之主要作用機轉？","opts":["A. 增加心肌纖維對Ca++之敏感性","B. 抑制phosphodiesterase而增加cAMP之含量","C. 抑制對ATP敏感之K +通道","D. 抑制心肌細胞之Na+ , K+ -ATPase"],"ans":3,"exp":"Digoxin（地高辛）的主要作用機轉是抑制心肌細胞膜上的Na⁺/K⁺-ATPase（鈉鉀腺苷三磷酸酶）。此酶受抑制後，細胞內Na⁺升高，進而抑制Na⁺/Ca²⁺交換體（NCX）的運作，使細胞內Ca²⁺濃度增加，心肌收縮力增強（正性肌力作用）。Digoxin也藉迷走神經增強作用（vagal effect）降低心率，用於治療充血性心臟衰竭和心房顫動。","we":["錯誤：增加心肌纖維對Ca²⁺的敏感性是另一類正性肌力藥物的機制，如某些鈣增敏劑（calcium sensitizers），不是digoxin的主要機轉。","錯誤：抑制phosphodiesterase而增加cAMP含量是milrinone、amrinone等磷酸二酯酶抑制劑的作用機轉，不是digoxin的機制。","錯誤：抑制ATP敏感的K⁺通道是磺醯脲類降血糖藥（如glibenclamide）促進胰島素分泌的機制，與digoxin無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_019","year":2016,"roc_year":105,"session":"2","examNo":19,"q":"下列何者能明顯地減緩心臟傳導，但不改變動作電位時程？","opts":["A. phenytoin","B. procainamide","C. propranolol","D. flecainide"],"ans":3,"exp":"Flecainide屬於Class Ic抗心律不整藥物，其特點是明顯減緩心臟傳導（降低Na⁺通道開放速率，減慢動作電位上升速率Vmax），但對動作電位時程（action potential duration, APD）影響極小，因此QRS波明顯增寬但QT間期變化不大。此特性與Class Ia（同時延長APD，如procainamide、quinidine）和Class Ib（縮短APD，如lidocaine、phenytoin）不同。","we":["錯誤：Phenytoin屬於Class Ib藥物，其特點是縮短動作電位時程，對正常心肌傳導影響小，不符合「明顯減緩傳導但不改變APD」的描述。","錯誤：Procainamide屬於Class Ia藥物，不僅減緩傳導，還明顯延長APD（延長QT間期），並非「不改變動作電位時程」的代表。","錯誤：Propranolol屬於Class II抗心律不整藥（β受體阻斷劑），主要減慢竇房結放電和AV結傳導，對Na⁺通道作用不顯著，不屬於「明顯減緩傳導不改變APD」的Class Ic特徵。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_020","year":2016,"roc_year":105,"session":"2","examNo":20,"q":"Dalteparin sodium對下列何種凝血因子的抑制作用最強？","opts":["A. XII","B. XI","C. X","D. IX"],"ans":2,"exp":"Dalteparin sodium是低分子量肝素（low molecular weight heparin, LMWH），其主要藥理作用是透過與抗凝血酶III（antithrombin III, AT III）結合，增強AT III對凝血因子Xa的抑制作用。與標準未分化肝素（unfractionated heparin）相比，LMWH對因子Xa的抑制活性遠大於對凝血酶（因子IIa）的抑制，抗Xa/抗IIa活性比約2:1至4:1。因子X是外源性和內源性凝血途徑的共同途徑關鍵因子。","we":["錯誤：凝血因子XII（Hageman factor）啟動接觸活化（內源性凝血）的最上游，dalteparin對因子XII無直接抑制作用。","錯誤：凝血因子XI（plasma thromboplastin antecedent）位於內源性凝血途徑，dalteparin的作用靶點不在此，其主要作用是抑制因子Xa。","","錯誤：凝血因子IX（Christmas factor）位於內源性凝血途徑，dalteparin對其抑制效果遠低於對因子Xa的抑制，不是主要作用靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_021","year":2016,"roc_year":105,"session":"2","examNo":21,"q":"下列何者抗血小板凝集作用很微弱，但冠狀動脈擴張作用很強？","opts":["A. dipyrimadole","B. ticlopidine","C. clopidogrel","D. aspirin"],"ans":0,"exp":"Dipyridamole（雙嘧達莫）的藥理特性：①抗血小板凝集作用相對微弱，主要是抑制磷酸二酯酶（PDE）使血小板內cAMP升高、以及抑制腺苷（adenosine）攝取，但臨床抗血栓效果不顯著；②具有強烈的冠狀動脈擴張作用，透過抑制腺苷回收使局部腺苷濃度升高，腺苷是強效冠狀血管擴張物質。因此dipyridamole常用於心臟壓力試驗（pharmacologic stress test）和作為冠狀動脈擴張劑。","we":["","錯誤：Ticlopidine（噻氯匹定）是ADP受體拮抗劑（P2Y12拮抗劑），具有強效不可逆的抗血小板凝集作用，且無顯著冠狀動脈擴張效果，與題目描述不符。","錯誤：Clopidogrel（氯吡格雷）同為P2Y12 ADP受體拮抗劑，抗血小板作用強效，廣泛用於預防血栓，並無明顯的冠狀動脈擴張作用。","錯誤：Aspirin（阿斯匹林）透過不可逆抑制COX-1阻斷血小板血栓素A2（TXA2）的生成，具有中等偏強的抗血小板效果，但無冠狀動脈擴張作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_022","year":2016,"roc_year":105,"session":"2","examNo":22,"q":"下列何種治療鬱血性心臟衰竭藥物，並非自然界產物？","opts":["A. digoxin","B. ouabain","C. amrinone","D. digitoxin"],"ans":2,"exp":"Amrinone（氨力農）是合成的雙吡啶酮衍生物（bipyridine derivative），不存在於自然界，屬於人工合成的正性肌力藥物。相較之下，digoxin和digitoxin來自毛地黃植物（Digitalis purpurea及D. lanata），ouabain來自非洲夾竹桃科植物（Strophanthus gratus），均屬天然強心配醣體（cardiac glycosides）。Amrinone透過抑制磷酸二酯酶III（PDE III）升高心肌細胞內cAMP，增強心肌收縮力。","we":["錯誤：Digoxin是從紫花毛地黃（Digitalis purpurea）中提取的天然強心配醣體，屬於自然界產物，不符合題目「非自然界產物」的描述。","錯誤：Ouabain是從非洲夾竹桃科植物Strophanthus gratus或旋花木（Acokanthera）提取的天然強心配醣體，屬於自然界產物，不符合題目描述。","","錯誤：Digitoxin是從毛地黃植物（主要是Digitalis purpurea）中提取的天然強心配醣體，屬於自然界產物，不符合題目「非自然界產物」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_023","year":2016,"roc_year":105,"session":"2","examNo":23,"q":"下列何者為Ca++阻斷劑，且其抑制心肌收縮作用最強？","opts":["A. amlodipine","B. verapamil","C. nifedipine","D. diltiazem"],"ans":1,"exp":"Verapamil（維拉帕米）是非二氫吡啶類（non-dihydropyridine）鈣通道阻斷劑，其對心臟的負性肌力作用（negative inotropic effect，抑制心肌收縮）在鈣通道阻斷劑中最強。Verapamil同時阻斷心肌和血管平滑肌的L型鈣通道，且對心臟的抑制作用尤為顯著，用於心律不整（室上性心搏過速）和高血壓。Diltiazem的負性肌力作用次之，而二氫吡啶類（如nifedipine、amlodipine）主要作用於血管，對心肌收縮抑制作用較弱。","we":["錯誤：Amlodipine屬於二氫吡啶類鈣通道阻斷劑，主要擴張血管、降低血壓，對心肌收縮力的直接抑制作用很弱，不是負性肌力作用最強者。","","錯誤：Nifedipine亦為二氫吡啶類鈣通道阻斷劑，以血管擴張作用為主，由於反射性交感興奮（reflex sympathetic activation），對心肌收縮力的淨效果影響不顯著，不是負性肌力最強的鈣拮抗劑。","錯誤：Diltiazem是苯硫氮平類（benzothiazepine）鈣通道阻斷劑，雖具心臟抑制作用，但其負性肌力效果弱於verapamil，不是最強者。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_024","year":2016,"roc_year":105,"session":"2","examNo":24,"q":"下列何者能抑制phosphodiesterase III而增強心肌收縮力？","opts":["A. dobutamine","B. digoxin","C. epinephrine","D. amrinone"],"ans":3,"exp":"Amrinone（氨力農）透過選擇性抑制心肌和血管平滑肌中的磷酸二酯酶III（phosphodiesterase III, PDE III），阻止cAMP（環磷腺苷）的降解，使細胞內cAMP濃度升高，進而增強心肌收縮力（正性肌力作用）並擴張血管（降低前後負荷）。Amrinone與milrinone同屬PDE III抑制劑類正性肌力藥，用於治療嚴重充血性心臟衰竭。","we":["錯誤：Dobutamine是合成的β1腎上腺素受體選擇性致效劑，透過活化β1受體使細胞內cAMP升高（間接途徑），而非直接抑制PDE III；其機制與amrinone不同。","錯誤：Digoxin透過抑制Na⁺/K⁺-ATPase增強心肌收縮力，與cAMP途徑無關，不具PDE III抑制活性。","錯誤：Epinephrine透過活化β1腎上腺素受體（及α、β2受體）刺激腺苷酸環化酶（adenylyl cyclase）增加cAMP，但不是直接抑制PDE III。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_025","year":2016,"roc_year":105,"session":"2","examNo":25,"q":"下列何者會加重糖尿病的病況？","opts":["A. acetazolamide","B. bumetanide","C. dichlorphenamide","D. chlorothiazide"],"ans":3,"exp":"Chlorothiazide（氯噻嗪）及其他噻嗪類利尿劑可加重糖尿病病況，因為噻嗪類利尿劑會降低胰島素分泌（抑制胰臟β細胞鉀通道關閉所需的去極化）並增加胰島素阻抗，導致血糖升高（高血糖症）。此副作用在長期使用時尤為明顯，糖尿病患者使用需特別監測血糖。此外，噻嗪類也可能引起低血鉀，進一步抑制胰島素分泌。","we":["錯誤：Acetazolamide是碳酸酐酶抑制劑，主要用於降眼壓和特定水腫，雖可造成代謝性酸中毒，但不是典型的加重糖尿病的利尿劑。","錯誤：Bumetanide是loop利尿劑（亨利氏環作用），雖可能輕微影響葡萄糖代謝，但與噻嗪類相比，加重糖尿病的效果不顯著。","錯誤：Dichlorphenamide（二氯苯磺胺）是碳酸酐酶抑制劑，用於青光眼，不以加重糖尿病著稱，不是此題的正確答案。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_026","year":2016,"roc_year":105,"session":"2","examNo":26,"q":"早產新生動物因先天性缺乏介面活性劑導致呼吸窘迫症（respiratory distress syndrome），下列何者療效最佳？","opts":["A. epinephrine","B. calfactant","C. prednisolone","D. terbutaline"],"ans":1,"exp":"Calfactant（牛肺表面活性劑）是從小牛肺部提取的天然肺表面活性劑（surfactant），含有磷脂（主要為磷脂醯膽鹼DPPC）及相關蛋白（SP-B、SP-C），可直接補充缺乏的介面活性劑，降低肺泡表面張力，預防肺泡塌陷，是治療早產新生動物呼吸窘迫症候群（neonatal respiratory distress syndrome, NRDS）的最有效療法。","we":["錯誤：Epinephrine（腎上腺素）是支氣管擴張劑和血管收縮劑，用於急性過敏和心臟停止，不能直接補充缺乏的肺表面活性劑，不是NRDS的最佳療法。","","錯誤：Prednisolone（普雷得尼龍）可用於懷孕母畜預防早產（促進胎兒肺成熟），但對於已出生、已缺乏表面活性劑的新生動物，直接補充calfactant療效更佳且更直接。","錯誤：Terbutaline是β2腎上腺素受體致效劑，用於舒張支氣管（治療氣喘）和抑制子宮收縮（安胎），不能直接補充表面活性劑，不是NRDS的最佳選擇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_027","year":2016,"roc_year":105,"session":"2","examNo":27,"q":"下列何者是N-acetylcysteine的作用機制？","opts":["A. 破壞氣管黏液分子的雙硫鍵降低黏度","B. 抑制氣管平滑肌phosphodiesterase的活性","C. 增強呼吸道纖毛運動排除黏液","D. 阻斷平滑肌細胞內cyclic AMP的降解"],"ans":0,"exp":"N-acetylcysteine（N-乙醯半胱氨酸，NAC）的祛痰（mucolytic）機制是破壞黏液蛋白分子中的雙硫鍵（disulfide bonds, −S−S−），因為黏液的黏稠度主要由雙硫鍵交聯的黏蛋白（mucin）聚合物決定。NAC的游離巰基（−SH）可還原並切斷這些雙硫鍵，使黏液分子結構解體、黏度降低、易於排出。此外NAC也是乙醯胺酚中毒的解毒劑（補充glutathione）。","we":["","錯誤：抑制磷酸二酯酶活性是甲基黃嘌呤類（theophylline、aminophylline）的作用機制，使cAMP升高達到支氣管擴張效果，不是NAC的機制。","錯誤：增強呼吸道纖毛運動是某些祛痰劑（如guaifenesin）的機制，NAC本身並不直接增強纖毛運動；其主要機制是破壞黏液的化學結構。","錯誤：阻斷cAMP降解是磷酸二酯酶抑制劑的機制，用於支氣管擴張，與NAC的黏液溶解機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_028","year":2016,"roc_year":105,"session":"2","examNo":28,"q":"下列何者為天然釀酒酵母中耐糖因子（glucose tolerance factor）的成分，此成分可促進葡萄糖代謝，協助胰島素調節血糖？","opts":["A. 鉻","B. 銅","C. 鈣","D. 鎂"],"ans":0,"exp":"天然釀酒酵母中的耐糖因子（glucose tolerance factor, GTF）的主要活性成分是鉻（chromium, Cr），以三價鉻（Cr³⁺）的形式存在。鉻可增強胰島素受體的敏感性，協助胰島素促進葡萄糖攝取和代謝，改善葡萄糖耐受性。缺乏鉻可能導致葡萄糖耐受性降低，與糖尿病前期相關症狀類似。","we":["","錯誤：銅（copper）是多種酵素（如超氧化物歧化酶、細胞色素c氧化酶）的輔因子，參與鐵代謝和結締組織合成，不是耐糖因子的成分。","錯誤：鈣（calcium）是骨骼、肌肉收縮和神經傳導的重要礦物質，不構成耐糖因子，也不直接協助胰島素調節血糖。","錯誤：鎂（magnesium）參與多種酵素反應和ATP代謝，雖然缺鎂可能輕微影響胰島素敏感性，但鎂並非耐糖因子的成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_029","year":2016,"roc_year":105,"session":"2","examNo":29,"q":"下列何者可阻斷serotonin及H1 -histamine的受體？","opts":["A. diphenhydramine","B. hydroxyzine","C. cyproheptadine","D. cromolyn sodium"],"ans":2,"exp":"Cyproheptadine（賽庚啶）是具有雙重拮抗作用的藥物，同時阻斷血清素（serotonin, 5-HT）受體和H1組織胺（histamine H1）受體，因此又稱為「抗組織胺兼抗血清素藥物」。在獸醫臨床上，cyproheptadine常用於貓的食慾促進、支氣管痙攣及某些過敏症狀的治療，也用於治療貓的5-HT綜合症（serotonin syndrome）。","we":["錯誤：Diphenhydramine（苯海拉明）僅為H1組織胺受體拮抗劑，同時有抗膽鹼和鎮靜作用，但不具有顯著的血清素受體拮抗活性。","錯誤：Hydroxyzine（羥嗪）是H1受體拮抗劑，具有抗焦慮、抗組織胺作用，但不具有血清素受體拮抗效果。","","錯誤：Cromolyn sodium（色甘酸鈉）是肥大細胞穩定劑，阻止肥大細胞脫顆粒釋放組織胺等介質，但本身不直接拮抗血清素或組織胺受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_030","year":2016,"roc_year":105,"session":"2","examNo":30,"q":"缺乏維生素K的動物不易止血的原因為何？","opts":["A. 血小板數量減少","B. 血小板功能受損","C. 血中凝血因子含量不足","D. 血鈣濃度過低"],"ans":2,"exp":"維生素K（Vitamin K）是肝臟合成多種凝血因子所必需的輔因子。維生素K依賴性凝血因子包括：因子II（凝血酶原, prothrombin）、因子VII、因子IX、因子X，以及抗凝血蛋白C和蛋白S。這些因子需要維生素K進行γ-羧基化（gamma-carboxylation）才具有活性。缺乏維生素K時，上述凝血因子的血中含量不足（功能性缺乏），導致凝血障礙、不易止血。","we":["錯誤：血小板數量減少是血小板減少症（thrombocytopenia）的表現，由骨髓疾病、免疫破壞等原因引起，與維生素K缺乏無直接關係。","錯誤：血小板功能受損是血小板病（thrombasthenia）或藥物（如aspirin）的影響，維生素K缺乏不直接影響血小板功能。","","錯誤：血鈣濃度過低（低血鈣症）確實可影響凝血（Ca²⁺是凝血因子IV），但維生素K缺乏不會直接導致低血鈣，兩者為不同的止血障礙機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_031","year":2016,"roc_year":105,"session":"2","examNo":31,"q":"下列有關中樞性鎮咳劑的敘述，何者錯誤？","opts":["A. 常伴有鎮定作用","B. 長期使用鴉片類可造成便秘","C. Noscapine不屬鴉片類製劑","D. Codeine具輕微的止痛作用"],"ans":2,"exp":"Noscapine（那可汀）是從罌粟植物（Papaver somniferum）中提取的天然生物鹼，屬於鴉片類（opioid）製劑，但不具有成癮性和止痛作用，僅有中樞性鎮咳效果。因此選項C「Noscapine不屬鴉片類製劑」是錯誤的描述。其他選項中：中樞性鎮咳劑（如codeine）常伴有鎮靜作用（A正確）；長期使用鴉片類確實可造成便秘（B正確）；codeine確實具輕微止痛作用（D正確）。","we":["此為正確描述：中樞性鎮咳劑（如codeine、hydrocodone）透過作用於腦幹咳嗽中樞，常伴有鎮靜作用，不符合題目問的「錯誤」描述。","此為正確描述：鴉片類（opioids）長期使用確實可造成腸蠕動減慢和便秘，因為鴉片受體廣泛分布於腸道神經，不符合題目問的「錯誤」描述。","","此為正確描述：Codeine（可待因）是弱效鴉片類藥物，可在體內代謝為少量嗎啡，具有輕微的鎮痛作用，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_032","year":2016,"roc_year":105,"session":"2","examNo":32,"q":"下列何者最適合使用於癌症化療嘔吐副作用的控制？","opts":["A. cisapride","B. diphenhydramine","C. ondansetron","D. scopolamine"],"ans":2,"exp":"Ondansetron（昂丹司瓊）是選擇性5-HT3受體拮抗劑，透過阻斷迷走神經末梢和化學感受器觸發區（CTZ）的5-HT3受體，有效抑制化療藥物引起的嘔吐。化療藥物（cisplatin等）刺激腸嗜鉻細胞（enterochromaffin cells）大量釋放血清素，活化5-HT3受體觸發嘔吐；ondansetron是目前控制化療誘發嘔吐（chemotherapy-induced nausea and vomiting, CINV）最有效的藥物之一。","we":["錯誤：Cisapride是胃腸道促動力劑（prokinetic），作用於5-HT4受體促進腸蠕動，用於胃腸遲緩，不是控制化療嘔吐的首選藥物。","錯誤：Diphenhydramine是H1受體拮抗劑，有輕微止吐效果，主要用於暈車嘔吐和術後輕微噁心，對化療引起的嘔吐效果遠遜於ondansetron。","","錯誤：Scopolamine（東莨菪鹼）是抗膽鹼藥，主要用於預防暈動症（motion sickness）引起的嘔吐，對化療誘發嘔吐的效果有限，不是首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_033","year":2016,"roc_year":105,"session":"2","examNo":33,"q":"下列制酸劑藥物中，何者經口投予後的全身性作用最顯著？","opts":["A. 碳酸氫鈉","B. 氫氧化鋁","C. 氫氧化鎂","D. 氧化鎂"],"ans":0,"exp":"碳酸氫鈉（NaHCO3，小蘇打）是唯一一種口服後大量被腸道吸收進入全身循環的制酸劑，因此全身性作用（systemic effect）最顯著，可引起代謝性鹼中毒（metabolic alkalosis）和「反彈性胃酸過多」（acid rebound）等全身副作用。其他制酸劑如氫氧化鋁、氫氧化鎂、氧化鎂主要在腸道局部發揮作用，吸收率低，全身性作用較小。","we":["","錯誤：氫氧化鋁（Al(OH)3）在腸道吸收極少，其全身性作用甚微；長期使用可能造成便秘和低磷血症，但全身性鹼中毒不常見。","錯誤：氫氧化鎂（Mg(OH)2）少量被吸收，腎功能正常時迅速排泄，全身性作用遠低於碳酸氫鈉；主要副作用是輕瀉效果。","錯誤：氧化鎂（MgO）在胃中與鹽酸反應生成氯化鎂，吸收有限；腎功能正常者全身性影響較小，不如碳酸氫鈉的全身吸收顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_034","year":2016,"roc_year":105,"session":"2","examNo":34,"q":"下列何種藥物可用於視診評估犬在輕度麻醉中之喉頭麻痺情形，並作為呼吸甦醒劑？","opts":["A. ipratropium","B. sildenafil","C. clenbuterol","D. doxapram"],"ans":3,"exp":"Doxapram（多沙普侖）是呼吸刺激劑（respiratory stimulant / analeptic），主要作用於延腦呼吸中樞和頸動脈竇化學受體（carotid body chemoreceptors），增加呼吸頻率和深度。在獸醫臨床上，doxapram可用於：①靜脈注射後短暫誘發自發呼吸用於評估犬在輕度麻醉中的喉頭運動（鑑別喉頭麻痺）；②術後或新生動物呼吸甦醒（respiratory resuscitation）。","we":["錯誤：Ipratropium（異丙托銨）是抗膽鹼性支氣管擴張劑，用於慢性阻塞性肺病（COPD）和氣喘的支氣管痙攣，不具評估喉頭麻痺或呼吸甦醒的功能。","錯誤：Sildenafil（矽地那非）是磷酸二酯酶5（PDE5）抑制劑，用於治療犬的肺動脈高壓（pulmonary arterial hypertension），不是呼吸刺激劑或用於喉頭麻痺評估。","錯誤：Clenbuterol是長效β2腎上腺素受體致效劑，用於馬的支氣管痙攣及子宮收縮抑制，不是呼吸甦醒劑，也不用於喉頭麻痺評估。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_035","year":2016,"roc_year":105,"session":"2","examNo":35,"q":"下列何者為前驅藥物（prodrug），在酸性條件下才轉變為活性藥物？","opts":["A. famotidine","B. misoprostol","C. omeprazole","D. sucralfate"],"ans":2,"exp":"Omeprazole（奧美拉唑）是質子幫浦抑制劑（proton pump inhibitor, PPI），屬於前驅藥物（prodrug）。它本身在中性pH下相對穩定，但在胃壁細胞的分泌小管（secretory canaliculus）酸性環境（pH < 4）中，omeprazole轉變為活性磺醯胺（sulfenamide）形式，不可逆地共價結合並抑制H⁺/K⁺-ATPase（質子幫浦），阻斷胃酸分泌。因此其在酸性條件下才活化為活性藥物。","we":["錯誤：Famotidine是H2受體拮抗劑，直接以活性形式阻斷壁細胞的H2受體抑制胃酸，不是前驅藥物，不需酸性環境活化。","錯誤：Misoprostol是前列腺素E1類似物（PGE1 analogue），直接以活性形式作用於胃壁細胞PG受體，抑制胃酸分泌並增加黏液保護，不是酸性環境才活化的前驅藥物。","","錯誤：Sucralfate是硫糖鋁（sucrose octasulfate鋁鹽），在酸性環境下解聚形成黏性膠質覆蓋潰瘍面（保護作用），雖在酸性下有更好效果，但不屬於典型的「前驅藥物在酸性下活化」機制，也無抑制胃酸的系統性效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_036","year":2016,"roc_year":105,"session":"2","examNo":36,"q":"經口投予含emodin的藥物如大黃，下列何者是其發揮藥效的作用部位？","opts":["A. 十二指腸","B. 空腸","C. 迴腸","D. 結腸"],"ans":3,"exp":"Emodin是大黃（Rheum spp.）等植物中的蒽醌類（anthraquinone）成分，口服後以非活性形式（蒽醌配醣體）通過小腸不被吸收，進入結腸（大腸）後由腸道細菌（大腸菌群）水解代謝釋放活性蒽醌，刺激結腸黏膜神經叢，增強腸蠕動，並抑制腸道水分和電解質的重吸收，產生刺激性瀉下效果（stimulant laxative）。因此其作用部位主要在結腸。","we":["錯誤：蒽醌配醣體在十二指腸不被活化和吸收，通過十二指腸時仍為非活性前驅形式，無法在此發揮瀉下作用。","錯誤：空腸（jejunum）是小腸的主要吸收段，蒽醌類在此處仍不被活化，不是其藥效發揮的部位。","錯誤：迴腸（ileum）是小腸末段，蒽醌配醣體通過迴腸時仍未被腸道細菌充分活化，不是主要作用部位。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_037","year":2016,"roc_year":105,"session":"2","examNo":37,"q":"下列何者刺激胃酸分泌的作用最強？","opts":["A. serotonin","B. histamine","C. PGI2","D. dopamine"],"ans":1,"exp":"Histamine（組織胺）是刺激胃酸分泌最強的生理物質。壁細胞（parietal cells）上的H2受體被組織胺活化後，透過cAMP途徑強力激活H⁺/K⁺-ATPase（質子幫浦）分泌胃酸。Gastrin（胃泌素）和乙醯膽鹼（acetylcholine）也刺激胃酸分泌，但效果部分依賴組織胺的釋放（paracrine機制）。前列腺素（如PGI2）、血清素（serotonin）和多巴胺對胃酸分泌的直接刺激作用較弱或具抑制性。","we":["錯誤：Serotonin（血清素）在胃腸道主要由腸嗜鉻細胞分泌，促進腸道蠕動，對胃酸分泌的直接刺激作用遠弱於組織胺。","","錯誤：PGI2（前列環素）對胃酸分泌有抑制作用，可保護胃黏膜（與PGE2類似），而非刺激胃酸分泌。","錯誤：Dopamine對胃壁細胞的直接胃酸刺激作用不顯著，不是主要的胃酸分泌促進劑，不符合此題要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_038","year":2016,"roc_year":105,"session":"2","examNo":38,"q":"Xylazine用於貓靜脈或肌肉注射可誘導催吐，其作用於下列何種受體？","opts":["A. α1","B. α2","C. µ","D. κ"],"ans":1,"exp":"Xylazine（甲苯噻嗪）是α2腎上腺素受體致效劑（α2-adrenoceptor agonist），在貓靜脈或肌肉注射後可高度可靠地誘發嘔吐，其機制是活化位於第四腦室底部的化學感受器觸發區（CTZ）的α2受體，觸發嘔吐反應。貓的CTZ對α2受體激動劑特別敏感（比犬強得多），因此小劑量xylazine即可在貓誘發嘔吐，臨床上可用於需要催吐時（如誤食毒物）。","we":["錯誤：α1受體主要負責血管收縮和括約肌收縮，xylazine的催吐作用是透過α2受體（非α1）作用於CTZ所介導，α1不是此機制的主要受體。","","錯誤：µ受體是鴉片類受體，morphine等鴉片類藥物透過µ受體（及CTZ的D2受體）誘發犬嘔吐，但xylazine的催吐機制是α2受體，非µ受體。","錯誤：κ受體是另一類鴉片受體，在貓可引起鎮靜，但xylazine的催吐作用與κ受體無關，主要是α2受體的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_039","year":2016,"roc_year":105,"session":"2","examNo":39,"q":"關於meloxicam之敘述，下列何者錯誤？","opts":["A. 為cyclooxygenase-2選擇性抑制劑","B. 使用於犬、貓骨關節炎（osteoarthritis）之慢性疼痛","C. 可有效的控制手術後之疼痛","D. 可使用於懷孕、泌乳或小於4月齡之動物"],"ans":3,"exp":"Meloxicam是COX-2選擇性抑制劑，用於犬貓骨關節炎慢性疼痛及手術後疼痛控制，均屬正確。選項D「可使用於懷孕、泌乳或小於4月齡之動物」是錯誤的描述：NSAIDs（包括meloxicam）禁用於懷孕動物（抑制前列腺素可影響胎兒發育、抑制子宮收縮、造成動脈導管早閉）、泌乳動物及幼齡動物（因前列腺素在腎臟發育和功能維持中有重要作用），使用應謹慎或禁忌。","we":["此為正確描述：meloxicam確實是COX-2（cyclooxygenase-2）選擇性抑制劑，相比傳統NSAIDs對COX-1的影響較小，胃腸道副作用相對較低，不符合題目問的「錯誤」描述。","此為正確描述：meloxicam已核准用於犬、貓骨關節炎（osteoarthritis）的慢性疼痛管理，不符合題目問的「錯誤」描述。","此為正確描述：meloxicam可有效控制手術後（術後）急性疼痛，也是獸醫常用的術後鎮痛藥，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_040","year":2016,"roc_year":105,"session":"2","examNo":40,"q":"關於phenylbutazone的敘述，下列何者錯誤？","opts":["A. 在馬及犬具有抑制cyclooxygenase-2之效應","B. 經口投予有效","C. 可用於跛腳及骨關節炎等疼痛情況","D. 代謝產物oxyphenbutazone不具藥理活性"],"ans":3,"exp":"Phenylbutazone（保泰松）的代謝產物oxyphenbutazone（羥基保泰松）仍具有藥理活性，因此選項D「代謝產物oxyphenbutazone不具藥理活性」是錯誤的描述。Oxyphenbutazone同樣具有抗炎、鎮痛、解熱作用，可作為活性代謝物繼續發揮藥效，並延長保泰松的總體藥理作用時間。其他敘述均正確：phenylbutazone在馬及犬有COX-2抑制效應；可口服給藥；可用於跛腳及骨關節炎等疼痛情況。","we":["此為正確描述：phenylbutazone在馬及犬確實具有抑制cyclooxygenase-2（COX-2）之效應，發揮抗炎鎮痛作用，不符合題目問的「錯誤」描述。","此為正確描述：phenylbutazone可以口服（PO）投予且有效，在馬上應用尤為廣泛，不符合題目問的「錯誤」描述。","此為正確描述：phenylbutazone臨床上用於治療跛腳（lameness）、骨關節炎（osteoarthritis）等慢性疼痛和炎症情況，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_041","year":2016,"roc_year":105,"session":"2","examNo":41,"q":"下列何者的抗發炎作用效價最高？","opts":["A. prednisolone","B. hydrocortisone","C. cortisone","D. dexamethasone"],"ans":3,"exp":"糖質腎上腺皮質素（glucocorticoids）的抗發炎效價由低至高排列為：cortisone（0.8）< hydrocortisone（1）< prednisolone（4）< dexamethasone（25）。Dexamethasone 的抗發炎效價最高，同時鹽皮質素活性極低，是最常用的高效價糖質皮質素之一。","we":["錯誤：Prednisolone 的抗發炎效價約為 hydrocortisone 的 4 倍，效價雖高於 hydrocortisone 及 cortisone，但仍遠低於 dexamethasone（25 倍）。","錯誤：Hydrocortisone 為標準參考藥物，其抗發炎效價定為 1，是四者中效價第二低者。","錯誤：Cortisone 本身為前驅藥，需在肝臟代謝為 hydrocortisone 才具活性，抗發炎效價約 0.8，為四者中最低。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_042","year":2016,"roc_year":105,"session":"2","examNo":42,"q":"下列何者為H2 -組織胺受體的阻斷劑？","opts":["A. histidine","B. cyproheptadine","C. famotidine","D. amantadine"],"ans":2,"exp":"H2 受體位於胃壁細胞（parietal cells），活化後促進胃酸分泌。H2 受體阻斷劑（H2-blockers）可抑制胃酸分泌，常用於治療消化性潰瘍。選項中 famotidine 為第三代 H2 受體拮抗劑，效力強且作用持久。Histidine 為胺基酸（組胺酸），是組織胺的前驅物；cyproheptadine 為 H1 受體拮抗劑兼血清素拮抗劑；amantadine 為抗病毒及多巴胺促進劑，均非 H2 拮抗劑。","we":["錯誤：Histidine（組胺酸）為胺基酸，是合成組織胺的前驅物，本身不具受體拮抗作用。","錯誤：Cyproheptadine 為第一代 H1 受體拮抗劑，同時具有抗血清素（5-HT）作用，不作用於 H2 受體。","","錯誤：Amantadine 為抗病毒藥（抑制 M2 離子通道）及多巴胺促進劑，無 H2 受體拮抗作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_043","year":2016,"roc_year":105,"session":"2","examNo":43,"q":"下列何者是非固醇類消炎藥（NSAIDs）最常見及最嚴重之副作用？","opts":["A. 胃腸道潰瘍","B. 便秘","C. 下痢","D. 白血球增加症"],"ans":0,"exp":"NSAIDs 藉由抑制環氧化酶（COX-1、COX-2）而減少前列腺素合成，但 COX-1 同時負責保護胃黏膜的生理性前列腺素（PGE2、PGI2）產生，因此長期或高劑量使用 NSAIDs 後，胃黏膜保護屏障受損，最常見且最嚴重的副作用為胃腸道潰瘍（包括胃潰瘍及十二指腸潰瘍），嚴重時可引起出血或穿孔。","we":["","錯誤：便秘較常見於鴉片類藥物（opioids）的副作用，並非 NSAIDs 的主要不良反應。","錯誤：下痢雖可能偶發，但並非 NSAIDs 最常見及最嚴重的副作用；胃腸道潰瘍的臨床危害遠大於下痢。","錯誤：白血球增加症（leukocytosis）非 NSAIDs 的典型副作用，骨髓抑制反而是氯黴素等藥物的不良反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_044","year":2016,"roc_year":105,"session":"2","examNo":44,"q":"Testosterone常與下列何者聯合刺激精子的發生及精蟲的成熟？","opts":["A. ADH","B. FSH","C. TSH","D. STH"],"ans":1,"exp":"精子的發生（spermatogenesis）及精蟲的成熟需要睪固酮（testosterone）與促濾泡素（FSH，follicle-stimulating hormone）兩者共同作用。FSH 作用於塞托利氏細胞（Sertoli cells），提供支持性環境；testosterone 則由萊迪希細胞（Leydig cells）分泌，維持精子發生所需的局部高雄激素濃度，兩者缺一不可。","we":["錯誤：ADH（抗利尿激素，vasopressin）作用於腎臟集尿管，調節水分再吸收，與精子發生無直接關聯。","","錯誤：TSH（促甲狀腺素）作用於甲狀腺，促進甲狀腺素分泌，不直接參與精子的發生或成熟。","錯誤：STH（生長激素，somatotropin）促進全身生長，不直接配合 testosterone 調控精子發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_045","year":2016,"roc_year":105,"session":"2","examNo":45,"q":"下列何者屬於sulfonylureas類藥物？","opts":["A. glipizide","B. insulin","C. finasteride","D. flumethasone"],"ans":0,"exp":"Sulfonylureas 類降血糖藥的作用機制為關閉胰臟 β 細胞上的 ATP 敏感性鉀通道（K-ATP channel），促使細胞膜去極化，進而誘導胰島素分泌，適用於第二型糖尿病。Glipizide 為第二代 sulfonylurea 藥物；insulin 為多肽激素；finasteride 為 5α-還原酶抑制劑；flumethasone 為氟化糖質皮質素，均非 sulfonylureas。","we":["","錯誤：Insulin 為胰臟 β 細胞直接分泌的多肽激素，需注射給藥，屬生物製劑，非 sulfonylureas 類小分子藥物。","錯誤：Finasteride 為 5α-還原酶（5α-reductase）抑制劑，可抑制睪固酮轉化為二氫睪固酮，用於前列腺肥大，不影響血糖。","錯誤：Flumethasone 為含氟的糖質腎上腺皮質素，具抗發炎作用，長期使用反而可能升高血糖，非降血糖的 sulfonylurea。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_046","year":2016,"roc_year":105,"session":"2","examNo":46,"q":"關於firocoxib的敘述，下列何者正確？","opts":["A. 具cyclooxygenase-2選擇性之抑制劑","B. 具cyclooxygenase-1選擇性之抑制劑","C. 屬於salicylates藥物","D. 通常使用於犬胃潰瘍發作"],"ans":0,"exp":"Firocoxib 為高度選擇性的 COX-2 抑制劑（coxib 類），對 COX-1 的抑制作用極低，因此胃腸道副作用較傳統 NSAIDs 少。其主要用途為緩解犬的骨關節炎疼痛及術後疼痛，而非用於治療胃潰瘍；恰好相反，選擇性 COX-2 抑制劑較不造成胃潰瘍，但仍需謹慎用於已有胃腸道問題的動物。","we":["","錯誤：Firocoxib 屬選擇性 COX-2 抑制劑，對 COX-1 活性的抑制極弱，選擇性 COX-1 抑制劑的敘述不正確。","錯誤：Salicylates 類（如 aspirin）為非選擇性 COX 抑制劑，firocoxib 屬 coxib 類，兩者化學結構及選擇性截然不同。","錯誤：Firocoxib 用於止痛抗炎，不適用於治療胃潰瘍；胃潰瘍治療應使用 H2 拮抗劑、PPI 或黏膜保護劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_047","year":2016,"roc_year":105,"session":"2","examNo":47,"q":"盤尼西林類無法用於治療Mycoplasma感染的原因為何？","opts":["A. 因脂溶性過低","B. 因被水解的速度過快","C. 因Mycoplasma無細胞壁","D. 因Mycoplasma能產生大量的β-lactamase"],"ans":2,"exp":"盤尼西林（penicillin）的抗菌機制為抑制細菌細胞壁肽聚糖（peptidoglycan）的合成，具體為結合青黴素結合蛋白（PBPs）、抑制轉肽酶（transpeptidase）活性。Mycoplasma 是唯一完全缺乏細胞壁的原核生物，因此盤尼西林無目標結構可作用，完全無效。此外，tetracyclines 或 fluoroquinolones 等作用於細胞內靶點的抗生素才對 Mycoplasma 有效。","we":["錯誤：盤尼西林的脂溶性確實偏低，但這並非無法治療 Mycoplasma 的根本原因；關鍵在於 Mycoplasma 缺乏細胞壁。","錯誤：盤尼西林在酸性環境中確實不穩定，但此敘述描述的是口服吸收問題，非對 Mycoplasma 無效的原因。","","錯誤：Mycoplasma 確實天然對盤尼西林不敏感，但原因並非產生 β-lactamase，而是根本不具有細胞壁，β-lactam 的作用靶點不存在。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_048","year":2016,"roc_year":105,"session":"2","examNo":48,"q":"下列有關spectinomycin和aminoglycosides比較的敘述中，何者正確？","opts":["A. spectinomycin較不易造成腎毒性","B. spectinomycin可抗大多數的厭氧菌","C. 兩者的分布體積均大於1 L/kg","D. 兩者經口投予的吸收率均高於50%"],"ans":0,"exp":"Spectinomycin 與 aminoglycosides 同為作用於 30S 核醣體的抗生素，但兩者有重要差異：aminoglycosides（如 gentamicin、tobramycin）具顯著腎毒性（nephrotoxicity）及耳毒性（ototoxicity），而 spectinomycin 的腎毒性較低。此外，aminoglycosides 對厭氧菌無效（需氧性攝入機制），spectinomycin 亦對厭氧菌無效；兩者口服吸收率均極低（< 5%），分布體積約 0.26 L/kg，均不超過 1 L/kg。","we":["","錯誤：Spectinomycin 對大多數厭氧菌無效，因為其進入菌體需依賴好氧性電子傳遞鏈，厭氧環境下藥物無法被主動攝入。","錯誤：Spectinomycin 與 aminoglycosides 的分布體積均約 0.26 L/kg，遠低於 1 L/kg，此敘述錯誤。","錯誤：兩者均為極性大分子，口服後經胃腸道吸收率極低（通常低於 5%），需注射給藥方能達到有效血中濃度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_049","year":2016,"roc_year":105,"session":"2","examNo":49,"q":"併用trimethoprim-sulfonamide，通常對下列何種病原有效？","opts":["A. Campylobacter jejuni","B. Psedomonas spp.","C. Bacteriodes","D. Toxoplasma gondii"],"ans":3,"exp":"Trimethoprim（TMP）與磺胺劑（sulfonamide）聯用可達協同抗菌效果，因兩者分別抑制葉酸合成路徑的不同步驟：磺胺劑競爭抑制二氫蝶酸合成酶（DHPS），TMP 則抑制二氫葉酸還原酶（DHFR），雙重阻斷導致細菌無法合成四氫葉酸，進而抑制核苷酸合成。TMP-SMZ 對弓漿蟲（Toxoplasma gondii）有效，常用於治療貓弓漿蟲病。","we":["錯誤：Campylobacter jejuni 對 TMP-sulfonamide 天然抗藥，因其 DHFR 對 TMP 親和力極低，此組合臨床上對 Campylobacter 通常無效。","錯誤：Pseudomonas spp. 對 TMP-sulfonamide 通常不敏感，綠膿桿菌感染需使用抗假單胞菌的 β-lactam 或 fluoroquinolones。","錯誤：Bacteroides 為嚴格厭氧菌，對磺胺劑通常具有天然抗藥性，TMP-sulfonamide 對厭氧菌效果差。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_050","year":2016,"roc_year":105,"session":"2","examNo":50,"q":"Carbapenems較penicillin G 抗革蘭氏陰性菌作用為佳的主要原因為何？","opts":["A. 生體可用率較高","B. 蛋白結合率較低","C. 具有抗β-lactamase作用","D. 不易誘導細菌產生突變"],"ans":2,"exp":"Carbapenems（如 imipenem、meropenem）較 penicillin G 對革蘭氏陰性菌抗菌活性強的主要原因在於：carbapenems 的化學結構對多數 β-lactamase（包括超廣譜 β-lactamase，ESBL）具抗水解穩定性，不易被 β-lactamase 分解。此外，carbapenems 也較易穿透革蘭氏陰性菌的外膜孔蛋白（porins）。","we":["錯誤：生體可用率（bioavailability）是影響口服藥物吸收的因素，carbapenems 通常需注射給藥，生體可用率的高低並非其抗陰性菌優勢的主因。","錯誤：蛋白結合率低可增加游離藥物濃度，但這不是 carbapenems 對抗革蘭氏陰性菌優於 penicillin G 的主要機制。","","錯誤：不易誘導細菌突變並非 carbapenems 相對優勢的主要機制；其優勢在於耐 β-lactamase 的結構特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_051","year":2016,"roc_year":105,"session":"2","examNo":51,"q":"革蘭氏陰性菌對antistaphylococcal penicillins具抗藥性的主因為：","opts":["A. 不易穿過G（–）的細胞膜","B. 與核醣體可逆性的結合","C. 噬菌體較容易攜抗藥基因入侵","D. 僅為抑菌性的抗菌劑"],"ans":0,"exp":"Antistaphylococcal penicillins（如 oxacillin、methicillin、cloxacillin）的設計目的是對抗產 β-lactamase 的金黃色葡萄球菌，其化學結構具有空間位阻以抵抗酶的水解。然而，革蘭氏陰性菌（G-）具有外膜（outer membrane）構成的第二道屏障，這類 penicillin 分子較大，難以穿越 G- 菌外膜的孔蛋白（porins），因此對大多數革蘭氏陰性菌無效。","we":["","錯誤：與核醣體可逆性結合是抑菌性抗生素的特性描述，與 antistaphylococcal penicillins 無法對抗 G- 菌的機制無關。","錯誤：噬菌體傳播抗藥基因是某些抗藥性的來源，但並非此類 penicillin 對 G- 菌天然無效的主因。","錯誤：Antistaphylococcal penicillins 屬殺菌性（bactericidal）藥物，不是「僅為抑菌性」，此敘述本身有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_052","year":2016,"roc_year":105,"session":"2","examNo":52,"q":"下列有關antiseptics或disinfectants作用的敘述中，何者正確？","opts":["A. 環境有機質對含iodines者的活性影響較小","B. 環境有機質對含glutaraldehyde者的活性影響較小","C. 環境有機質對含hypochlorites者的活性影響較小","D. 使用硬水稀釋不會對四級銨化合物的作用造成影響"],"ans":1,"exp":"常用消毒劑中，glutaraldehyde（戊二醛）對有機質（如血液、組織碎片等）的耐受性最佳，有機質的存在對其殺菌活性的影響相對最小，因此適用於受污染環境及器械消毒。相比之下，含碘製劑（iodines）和次氯酸鹽（hypochlorites）活性均會被有機質顯著降低；四級銨化合物（QACs）則因硬水中的鈣鎂離子而活性下降。","we":["錯誤：含碘製劑（iodophors、povidone-iodine）活性會被有機質（如血液、蛋白質）顯著降低，此敘述錯誤。","","錯誤：次氯酸鹽（hypochlorites，如漂白水）對有機質非常敏感，大量有機質存在時其殺菌活性會急劇下降，需先清潔後才能有效消毒。","錯誤：四級銨化合物（quaternary ammonium compounds，QACs）在硬水（含高濃度鈣、鎂離子）中會與礦物質螯合，導致活性明顯降低，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_053","year":2016,"roc_year":105,"session":"2","examNo":53,"q":"難溶性磺胺劑在泌尿道中產生晶尿症是因下列何種生物轉換（biotransformation）所致？","opts":["A. 乙醯化（acetylation）","B. 羧化（carboxylation）","C. 羥基化（hydroxylation）","D. 氧化（oxidation）"],"ans":0,"exp":"磺胺劑在體內經肝臟代謝時，主要的生物轉換為 N-乙醯化（N-acetylation），在乙醯轉移酶催化下形成乙醯化代謝產物。乙醯化磺胺劑水溶性通常低於原藥，在偏酸性的尿液中溶解度更低，容易析出結晶，在泌尿道形成晶尿症（crystalluria），嚴重時可導致血尿或腎小管阻塞。","we":["","錯誤：羧化（carboxylation）是指加入羧基（-COOH）的生物轉換，並非磺胺劑晶尿症的形成機制。","錯誤：羥基化（hydroxylation）通常會增加藥物的水溶性，有助於腎臟排泄，反而不易造成晶尿。","錯誤：氧化（oxidation）是多種藥物的第一相代謝反應，但磺胺劑晶尿症的主要成因為乙醯化後水溶性降低，而非氧化代謝。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_054","year":2016,"roc_year":105,"session":"2","examNo":54,"q":"關於amphotericin B，下列何者錯誤？","opts":["A. 具腎毒性","B. 治療犬histoplasmosis","C. 治療犬blastomycosis","D. macrolides類抗生素"],"ans":3,"exp":"Amphotericin B 是多烯類（polyene）抗黴菌藥物，其作用機制為與黴菌細胞膜中的麥角固醇（ergosterol）結合，破壞膜完整性，導致細胞內容物外漏而殺菌。它並非 macrolides 類抗生素（大環內酯類，如 erythromycin、azithromycin 等為抗細菌藥物，作用於細菌 50S 核醣體）。Amphotericin B 具有腎毒性，廣泛用於治療全身性黴菌感染，包括犬的 histoplasmosis 和 blastomycosis。","we":["此為正確描述：Amphotericin B 確實具有顯著腎毒性，為其主要副作用，臨床使用時需監測腎功能。不符合題目問的「錯誤」描述。","此為正確描述：Amphotericin B 可用於治療犬的組織胞漿菌病（histoplasmosis），為重要的全身性黴菌感染治療藥物。不符合題目問的「錯誤」描述。","此為正確描述：Amphotericin B 可用於治療犬的芽生菌病（blastomycosis），在犬的全身性真菌病治療中具重要地位。不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_055","year":2016,"roc_year":105,"session":"2","examNo":55,"q":"何者為可用於治療牛呼吸性疾病之第三代cephalosporins？","opts":["A. cephalexin","B. cephapirin","C. ceftiofur","D. cefuroxime"],"ans":2,"exp":"Cephalosporins 依世代分類：第一代（cephalexin、cephapirin）、第二代（cefuroxime）、第三代（ceftiofur、cefoperazone）、第四代（cefquinome）。Ceftiofur 為第三代 cephalosporin，專門核准用於牛、豬、馬等食用動物的呼吸性疾病（如牛的 Mannheimia haemolytica、Pasteurella multocida 感染），對革蘭氏陰性菌活性強，且具組織殘留量低、休藥期短的特點。","we":["錯誤：Cephalexin 為第一代 cephalosporin，主要對革蘭氏陽性菌有效，對革蘭氏陰性菌的活性較弱，不用於治療牛呼吸性疾病。","錯誤：Cephapirin 為第一代 cephalosporin，主要用於乳房炎（mastitis）的乳管內（intramammary）給藥，非牛呼吸性疾病的首選。","","錯誤：Cefuroxime 為第二代 cephalosporin，雖對革蘭氏陰性菌活性優於第一代，但並非專門核准用於牛呼吸性疾病的第三代藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_056","year":2016,"roc_year":105,"session":"2","examNo":56,"q":"Penicillin G常用注射方式給藥的原因為何？","opts":["A. 具有苦味不易入口","B. 容易潮解不易製劑","C. 易受胃酸不活化","D. 易滋生黴菌污染"],"ans":2,"exp":"Penicillin G（苄青黴素）在酸性環境中（如胃酸，pH 1-3）非常不穩定，β-lactam 環會水解開裂而迅速失去活性。因此，口服後大部分在胃中被胃酸破壞，生體可用率極低，臨床上必須採用注射途徑（肌肉注射或靜脈注射）給藥。口服穩定的 penicillin 如 penicillin V（phenoxymethylpenicillin）則設計為耐酸型。","we":["錯誤：苦味雖可能影響動物口服接受度，但這並非 penicillin G 必須注射給藥的根本藥理原因。","錯誤：Penicillin G（尤其是鉀鹽或鈉鹽）確實易吸濕，但潮解問題可透過劑型設計克服，不是無法口服的主因。","","錯誤：黴菌污染可藉由無菌製劑工藝控制，不是 penicillin G 必須注射的藥理學理由。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_057","year":2016,"roc_year":105,"session":"2","examNo":57,"q":"下列何者最適合使用於治療犬貓結腸炎的細菌感染？","opts":["A. sulfadiazine","B. sulfamethoxazole","C. sulfasalazine","D. sulfathiazole"],"ans":2,"exp":"Sulfasalazine 為磺胺劑與 5-aminosalicylic acid（5-ASA）的前驅複合物，口服後在結腸中被腸道細菌分解，釋出 sulfapyridine 與 5-ASA；5-ASA 在局部發揮抗炎作用（抑制前列腺素合成）。由於 sulfasalazine 在結腸才裂解釋放活性成分，特別適合治療結腸炎（colitis）及炎症性腸病，是犬貓結腸炎的重要藥物。","we":["錯誤：Sulfadiazine 為易吸收型磺胺劑，主要在全身性感染中使用（如弓漿蟲症），並非針對腸道局部炎症設計的結腸炎用藥。","錯誤：Sulfamethoxazole 常與 trimethoprim 合用（TMP-SMZ），主要作為全身性抗菌劑，不專一作用於結腸。","","錯誤：Sulfathiazole 為較老的磺胺劑，主要作為局部抗菌藥（如皮膚感染），不具備 sulfasalazine 在結腸定向釋放 5-ASA 的特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_058","year":2016,"roc_year":105,"session":"2","examNo":58,"q":"磺胺劑和下列何者併用時，可具協同之抗菌效果？","opts":["A. butyrophenones","B. diaminopyrimidines","C. acetaminophen","D. cisapride"],"ans":1,"exp":"磺胺劑與 diaminopyrimidines（二氨基嘧啶類，如 trimethoprim、ormetoprim）合用可達協同（synergistic）抗菌效果。原理為雙重阻斷葉酸合成路徑：磺胺劑抑制二氫蝶酸合成酶（DHPS），trimethoprim 則抑制二氫葉酸還原酶（DHFR），兩者分別阻斷前後兩個步驟，協同削弱細菌的葉酸代謝。","we":["錯誤：Butyrophenones（如 haloperidol、azaperone）為多巴胺 D2 受體拮抗劑，用作鎮靜劑，與磺胺劑無協同抗菌關係。","","錯誤：Acetaminophen（paracetamol）為解熱鎮痛藥，抑制 COX-3，與磺胺劑無任何協同抗菌作用，且貓對 acetaminophen 具嚴重毒性，禁用。","錯誤：Cisapride 為促腸蠕動藥（胃腸道動力藥），作用於 5-HT4 受體，與磺胺劑的抗菌機制完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_059","year":2016,"roc_year":105,"session":"2","examNo":59,"q":"下列何者可用於驅除牛的Anaplasma marginale？","opts":["A. niclofolan","B. hexachlorophene","C. oxytetracycline","D. levamisole"],"ans":2,"exp":"Anaplasma marginale 為立克次體目（Rickettsiales）的專性胞內寄生菌，寄生於紅血球（為「邊緣蟲」），可引起牛的牛無漿體病（bovine anaplasmosis）。Oxytetracycline（土黴素）屬四環素類，可穿入細胞內抑制 Anaplasma 的蛋白質合成（結合 30S 核醣體），是治療及預防 Anaplasma marginale 感染的標準藥物。","we":["錯誤：Niclofolan 為苯酚系（nitrophenol）肝臟吸蟲驅蟲藥，主要用於驅殺牛羊的肝片吸蟲（Fasciola hepatica），無抗 Anaplasma 的作用。","錯誤：Hexachlorophene 為酚類消毒劑，具殺細菌作用，但主要用於外用消毒，不用於全身性立克次體感染的治療。","","錯誤：Levamisole 為咪唑噻唑類驅蟲藥，作用機制為乙醯膽鹼受體致效劑，可麻痺線蟲，對立克次體屬的 Anaplasma 無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_060","year":2016,"roc_year":105,"session":"2","examNo":60,"q":"在密飼之豬場中使用tiamulin後，豬隻會有紅斑和搔癢的皮膚炎之原因為何？","opts":["A. 藥物直接引起皮膚過敏","B. 尿中刺激性代謝產物所致","C. 豬隻免疫力降低所致","D. 藥物直接刺激末梢神經所致"],"ans":1,"exp":"Tiamulin 在代謝後會產生具有刺激性的尿中代謝產物，在密飼豬場中，這些刺激性代謝物隨尿液排出後滯留於豬圈地板，豬隻在密集環境中長時間接觸帶有代謝物的尿液，接觸皮膚後引起接觸性紅斑及搔癢性皮膚炎。這是 tiamulin 在高密度飼養條件下特有的副作用，非藥物直接的免疫反應或神經毒性。","we":["錯誤：藥物直接引起的過敏性皮膚炎為 IgE 介導的免疫反應，需要致敏化過程，且不會因密飼環境而特別加重；tiamulin 皮膚炎的成因在於尿中代謝物的接觸刺激。","","錯誤：豬隻免疫力降低是某些免疫抑制藥物的副作用，tiamulin 本身無顯著免疫抑制作用，皮膚炎成因並非免疫功能下降。","錯誤：藥物直接刺激末梢神經會引起疼痛或感覺異常，但 tiamulin 的皮膚炎發生於接觸尿液的皮膚部位，並非全身性神經刺激所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_061","year":2016,"roc_year":105,"session":"2","examNo":61,"q":"下列何者不是胺基醣苷類（aminoglycosides）抗生素常見的不良反應？","opts":["A. 腎毒性","B. 耳毒性","C. 骨髓抑制","D. 神經肌肉阻斷"],"ans":2,"exp":"Aminoglycosides（胺基醣苷類，如 gentamicin、tobramycin、amikacin）的常見不良反應包括：（1）腎毒性（nephrotoxicity）：藥物蓄積於腎近曲小管；（2）耳毒性（ototoxicity）：損害前庭及耳蝸毛細胞；（3）神經肌肉阻斷（neuromuscular blockade）：高劑量時可抑制乙醯膽鹼釋放。骨髓抑制（bone marrow suppression）並非 aminoglycosides 的典型副作用，骨髓抑制常見於氯黴素（chloramphenicol）或細胞毒性藥物。","we":["此為正確描述：腎毒性是 aminoglycosides 最重要的劑量限制性副作用，藥物蓄積於腎近曲小管細胞，長期或高劑量使用可引起急性腎小管壞死。不符合題目問的「不是」描述。","此為正確描述：耳毒性（ototoxicity）為 aminoglycosides 另一嚴重副作用，可損害第八對腦神經（聽神經），引起前庭毒性（vestibular toxicity）及耳蝸毒性（cochlear toxicity），可能造成永久性聽力損失。不符合題目問的「不是」描述。","","此為正確描述：神經肌肉阻斷為 aminoglycosides 少見但嚴重的副作用，高劑量或快速靜脈注射時可抑制突觸前乙醯膽鹼釋放，引起呼吸肌麻痺，鈣離子可拮抗此效應。不符合題目問的「不是」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_062","year":2016,"roc_year":105,"session":"2","examNo":62,"q":"多少重量百分比的isopropyl alcohol的抗菌作用與70%（重量）乙醇相近？","opts":["A. 5","B. 10","C. 30","D. 50"],"ans":3,"exp":"Isopropyl alcohol（異丙醇）的最佳抗菌濃度為 70%（重量/體積），與 70% 乙醇（ethanol）的抗菌效力相近。兩者均透過使蛋白質變性及溶解脂質細胞膜發揮殺菌作用。異丙醇的抗菌效果與濃度之間呈現鐘形曲線，過高（無水，100%）或過低（< 30%）濃度均效果較差，70% 左右為最適殺菌濃度。","we":["錯誤：5% 的 isopropyl alcohol 濃度過低，僅具有輕微的殺菌效果，遠不足以達到與 70% 乙醇相當的抗菌作用。","錯誤：10% isopropyl alcohol 濃度仍太低，無法產生等同於 70% 乙醇的有效蛋白質變性及脂質溶解作用。","錯誤：30% isopropyl alcohol 雖較低濃度有效，但抗菌效力仍未達最優，與 70% 乙醇的效果有差距。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_063","year":2016,"roc_year":105,"session":"2","examNo":63,"q":"下列何者無法用於治療觀賞魚類的外寄生蟲感染？","opts":["A. sodium sulfate","B. copper sulfate","C. hydrogen peroxide","D. formalin"],"ans":0,"exp":"觀賞魚外寄生蟲感染（如 Ichthyophthirius multifiliis 白點病、monogenea 等）常用水族驅蟲/消毒藥物包括：copper sulfate（硫酸銅，抗原蟲）、hydrogen peroxide（過氧化氫，殺菌除蟲）、formalin（甲醛，廣效外寄生蟲）。Sodium sulfate（硫酸鈉）為電解質/輕瀉劑，無驅除外寄生蟲的活性，不用於觀賞魚外寄生蟲治療。","we":["","此為正確描述：Copper sulfate（硫酸銅）可有效治療觀賞魚的外寄生蟲感染（尤其是原蟲如 Ichthyophthirius、Chilodonella），為常用水族藥物，但治療濃度窗窄，需精確控制。不符合題目問的「無法用於」描述。","此為正確描述：Hydrogen peroxide（過氧化氫）可作為短時間浴劑，對外寄生蟲（如 monogenea）及部分細菌感染有效，已有水產核准使用。不符合題目問的「無法用於」描述。","此為正確描述：Formalin（甲醛）為傳統廣效水族消毒劑，對多種外寄生蟲（原蟲、monogenea）均有效，可作浸泡或藥浴使用。不符合題目問的「無法用於」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_064","year":2016,"roc_year":105,"session":"2","examNo":64,"q":"獸醫師給與病貓畜主一瓶含有idoxuridine之眼藥水，請問該藥物主要用於治療下列何者？","opts":["A. 青光眼","B. 病毒性結膜炎","C. 黴菌性結膜炎","D. 披衣菌結膜炎"],"ans":1,"exp":"Idoxuridine（碘苷）為核苷類似物型抗病毒藥，其化學結構類似胸腺嘧啶（thymidine），可摻入病毒 DNA，干擾病毒 DNA 複製。由於毒性限制，臨床主要用於局部（外用眼藥水）抗病毒治療，適應症為疱疹病毒（herpesvirus）引起的病毒性角膜結膜炎（keratoconjunctivitis），貓的疱疹病毒性結膜炎為常見適應症。","we":["錯誤：青光眼（glaucoma）的治療藥物為 β 受體拮抗劑（如 timolol）、carbonic anhydrase 抑制劑（如 dorzolamide）或前列腺素類似物，idoxuridine 無降眼壓作用。","","錯誤：黴菌性結膜炎需使用抗黴菌藥（如 natamycin、voriconazole），idoxuridine 為抗病毒藥，對黴菌無效。","錯誤：披衣菌（Chlamydia）結膜炎為細菌性感染，需使用四環素類或氯黴素眼藥，idoxuridine 對 Chlamydia 無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_065","year":2016,"roc_year":105,"session":"2","examNo":65,"q":"下列何者的抗菌作用機制為藥物結合於30S核醣體，進而抑制蛋白質的合成？","opts":["A. spectinomycin","B. rifampin","C. lincomycin","D. vancomycin"],"ans":0,"exp":"Spectinomycin 結合於細菌 30S 核醣體的 16S rRNA 上（特定位於 30S 亞基的 h34 區），阻斷 tRNA 在 A 位的移位（translocation），進而抑制蛋白質合成。雖與 aminoglycosides 同樣作用於 30S 核醣體，但 spectinomycin 的結合位點不同（不引起錯碼讀取），且通常為抑菌性。Rifampin 作用於 RNA 聚合酶；lincomycin 及 vancomycin 分別作用於 50S 核醣體及細胞壁合成。","we":["","錯誤：Rifampin 與細菌的 DNA 依賴性 RNA 聚合酶（β 亞基）結合，抑制 mRNA 轉錄，其作用靶點為轉錄而非翻譯過程，不作用於核醣體。","錯誤：Lincomycin（及 clindamycin）作用於細菌 50S 核醣體的 23S rRNA，抑制胜肽基轉移酶活性，阻礙胜肽鍵形成，與 30S 核醣體無關。","錯誤：Vancomycin 作用機制為結合細菌細胞壁前驅物 D-Ala-D-Ala，抑制肽聚糖合成，不作用於核醣體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_066","year":2016,"roc_year":105,"session":"2","examNo":66,"q":"屬於一種抗代謝劑，可阻斷黴菌DNA與RNA合成的藥物是：","opts":["A. amphotericin B","B. flucytosine","C. itraconazole","D. nystatin"],"ans":1,"exp":"Flucytosine（5-FC）為嘧啶類抗代謝藥，進入黴菌細胞後，由胞嘧啶去氨酶（cytosine deaminase）轉化為 5-fluorouracil（5-FU），再進一步代謝成活性形式，分別摻入 RNA（干擾 RNA 功能）及抑制胸腺嘧啶合成酶（thymidylate synthase），從而阻斷 DNA 和 RNA 的合成，是黴菌的抗代謝劑。哺乳類細胞缺乏 cytosine deaminase，具選擇性毒性。","we":["錯誤：Amphotericin B 為多烯類，作用機制為與黴菌細胞膜麥角固醇結合，破壞膜通透性，不是抗代謝劑，不直接阻斷 DNA/RNA 合成。","","錯誤：Itraconazole 為三唑類抗黴菌藥，作用機制為抑制細胞色素 P-450 依賴性羊毛固醇 14α-去甲基酶（CYP51），阻斷麥角固醇合成，不屬於抗代謝劑。","錯誤：Nystatin 為多烯類（與 amphotericin B 同類），作用機制亦為與麥角固醇結合破壞細胞膜，不阻斷核酸合成，不是抗代謝劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_067","year":2016,"roc_year":105,"session":"2","examNo":67,"q":"下列benzimidazoles的藥物中，其化學構造內不含S原子的是：","opts":["A. albendazole","B. fenbendazole","C. oxfendazole","D. oxibendazole"],"ans":3,"exp":"在苯並咪唑類（benzimidazoles）驅蟲藥中，albendazole、fenbendazole 和 oxfendazole 的化學結構中均含有硫原子（S），屬於含硫苯並咪唑。Oxibendazole 的化學結構為甲氧基苯並咪唑（methoxy-substituted benzimidazole），側鏈為甲氧基（-OCH3）而非含硫基團，因此不含硫（S）原子。Oxfendazole 為 fenbendazole 的亞碸代謝物（兩者可互換），均含 S。","we":["錯誤：Albend
