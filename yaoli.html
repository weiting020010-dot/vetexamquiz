"2","examNo":28,"q":"下列有關bismuth subsalicylate的作用，何者錯誤？","opts":["A. 具吸附作用","B. 抗下痢作用","C. 黏膜保護作用","D. 促進前列腺素合成"],"ans":3,"exp":"Bismuth subsalicylate（次水楊酸鉍）的水楊酸成分具有COX抑制（環氧化酶抑制）作用，會抑制前列腺素合成，而非促進。選項D（促進前列腺素合成）為錯誤描述。Bismuth subsalicylate確實具有吸附作用（鉍吸附毒素）、抗下痢（antidiarrheal）和黏膜保護（黏膜塗覆）等正確特性。","we":["此為正確描述：Bismuth subsalicylate中的鉍成分確實具有吸附毒素和細菌的作用（adsorbent），不符合「錯誤」描述。","此為正確描述：Bismuth subsalicylate可抑制腸道分泌、增加電解質吸收，具有抗下痢（antidiarrheal）效果，不符合「錯誤」描述。","此為正確描述：Bismuth subsalicylate中的鉍在酸性pH下可與腸黏膜蛋白結合，形成保護膜（mucosal protectant），不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_029","year":2017,"roc_year":106,"session":"2","examNo":29,"q":"Zileuton降低leukotrienes的作用機制是：","opts":["A. 抑制cyclooxygenase","B. 抑制phospholipase A2","C. 抑制diacylglycerol lipase","D. 抑制lipoxygenase"],"ans":3,"exp":"Zileuton為5-脂氧合酶（5-lipoxygenase）抑制劑，阻斷花生四烯酸（arachidonic acid）經由脂氧合酶途徑轉化為白三烯素（leukotrienes，LTs）的過程，從而減少LTB4、LTC4、LTD4和LTE4的生成，發揮抗炎和抗氣喘作用。","we":["錯誤：COX（cyclooxygenase）抑制是NSAIDs（如阿司匹林、布洛芬）的作用機制，阻斷前列腺素合成；zileuton不抑制COX，而是抑制lipoxygenase。","錯誤：Phospholipase A2（磷脂酶A2）抑制是糖皮質素（corticosteroids）的間接機制（誘導lipocortin/annexin-1），可同時阻斷COX和LOX途徑；zileuton不抑制phospholipase A2。","錯誤：Diacylglycerol lipase（二酰甘油脂酶）參與花生四烯酸從二酰甘油釋出，不是zileuton的主要靶點；zileuton直接抑制5-lipoxygenase。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_030","year":2017,"roc_year":106,"session":"2","examNo":30,"q":"下列何者是misoprostol用於預防非固醇類消炎藥所引起胃潰瘍的主要原理？","opts":["A. 抑制胃酸分泌的作用優於質子幫浦抑制劑","B. 不具全身性作用","C. 不經肝臟代謝","D. 具有類似prostaglandin E1的作用"],"ans":3,"exp":"Misoprostol為合成的前列腺素E1（PGE1）類似物，透過模擬內源性PGE1的作用：(1)抑制胃酸分泌（EP3受體介導）；(2)促進胃黏膜分泌黏液和碳酸氫鹽（cytoprotection）。因NSAIDs抑制COX導致保護性前列腺素減少，misoprostol透過補充PGE1效果預防NSAID引起的胃潰瘍。","we":["錯誤：Misoprostol抑制胃酸分泌的效果不如質子幫浦抑制劑（PPI）強，且其主要優勢在於黏膜保護（促黏液和碳酸氫鹽），不是以「抑酸優於PPI」著稱。","錯誤：Misoprostol確實有全身性作用（子宮收縮、腹瀉等副作用），不符合「不具全身性作用」的描述；其PGE1類似物特性會引起子宮平滑肌收縮，孕畜禁用。","錯誤：Misoprostol在肝臟和腸道被快速代謝（de-esterification），確實經歷肝臟代謝；「不經肝臟代謝」的描述不正確。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_031","year":2017,"roc_year":106,"session":"2","examNo":31,"q":"在動物氣喘時，下列何者可以有效地作為緊急支氣管擴張用？","opts":["A. cromolyn","B. ipratropium","C. terbutaline","D. budesonide"],"ans":2,"exp":"Terbutaline（特布他林）為β2腎上腺素受體致效劑，可快速鬆弛支氣管平滑肌，是急性支氣管痙攣的緊急支氣管擴張劑首選。皮下注射或吸入作用迅速（數分鐘內起效），適合緊急使用。其他選項均不適用於緊急支氣管擴張。","we":["錯誤：Cromolyn（色甘酸鈉）為肥大細胞穩定劑，阻止肥大細胞脫粒釋放介質，用於預防過敏性氣喘發作，無直接支氣管擴張作用，不適合緊急使用。","錯誤：Ipratropium（異丙托溴銨）為抗膽鹼性支氣管擴張劑，起效較β2致效劑慢，且擴張支氣管的效果不如β2致效劑強，不是第一線緊急支氣管擴張劑。","","錯誤：Budesonide（布地奈德）為吸入性糖皮質素，需數小時至數天才能發揮抗炎效果，不是緊急支氣管擴張劑，為長期抗炎預防藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_032","year":2017,"roc_year":106,"session":"2","examNo":32,"q":"動物缺乏下列何種營養素會導致出血？","opts":["A. phylloquinone","B. retinol","C. thiamine","D. tocopherol"],"ans":0,"exp":"Phylloquinone為維生素K1（葉綠醌），在肝臟作為羧化酶（γ-glutamyl carboxylase）的輔助因子，參與凝血因子II（凝血酶原）、VII、IX、X及蛋白C、S的合成後修飾（γ-羧化）。缺乏維生素K1時，這些凝血因子無法活化，導致出血傾向。","we":["","錯誤：Retinol（視黃醇）為維生素A，與視覺（視紫質regeneration）、上皮細胞分化和生殖有關，缺乏時出現夜盲症和皮膚角化，不直接引起出血。","錯誤：Thiamine（硫胺素）為維生素B1，作為脫羧酶輔因子參與糖類代謝；缺乏時引起腳氣病（beriberi）和韋尼克腦病，不引起出血。","錯誤：Tocopherol（生育酚）為維生素E，主要作用為抗氧化（清除自由基），與硒協同保護細胞膜；缺乏時引起肌肉退化或不孕，不直接引起出血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_033","year":2017,"roc_year":106,"session":"2","examNo":33,"q":"使用非選擇性腎上腺素性藥物擴張支氣管，最可能出現的副作用為：","opts":["A. 腹痛下痢","B. 心跳過快","C. 瞳孔縮小","D. 血壓降低"],"ans":1,"exp":"非選擇性腎上腺素性藥物（non-selective adrenergic agonists，如epinephrine）同時活化α和β（包含β1）受體。β1受體活化使心臟竇房結自發放電頻率增加，導致心跳過快（tachycardia）。這是使用此類藥物擴張支氣管（β2效果）時最常見的副作用。","we":["錯誤：腹痛下痢為副交感神經過度興奮或腸道M受體激活的結果，使用腎上腺素性藥物（交感神經藥）時反而抑制腸胃蠕動，不引起下痢。","","錯誤：瞳孔縮小（縮瞳）為副交感神經M受體激活或α受體阻斷的效果；腎上腺素性藥物活化α受體（瞳孔放大肌）引起散瞳（mydriasis），不引起縮瞳。","錯誤：使用非選擇性腎上腺素性藥物時，α1受體激活引起全身血管收縮，血壓往往升高，而非降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_034","year":2017,"roc_year":106,"session":"2","examNo":34,"q":"下列何者對貓具有催吐作用？","opts":["A. phenothiazines","B. dolasetron","C. xylazine","D. ondansetron"],"ans":2,"exp":"Xylazine（甲苯噻嗪）為α2腎上腺素受體致效劑，在貓具有獨特的催吐效果（emetic effect），透過中樞α2受體的刺激（可能涉及延腦嘔吐中樞附近的化學感受器觸發區）引起嘔吐，且這種效果在貓比其他動物更為明顯和可靠。其他選項均為止吐藥。","we":["錯誤：Phenothiazines（吩噻嗪類，如acepromazine）為D2受體阻斷劑，具有強效止吐作用（阻斷CTZ的D2受體），不是催吐劑。","錯誤：Dolasetron為5-HT3受體拮抗劑，阻斷化學感受器觸發區（CTZ）和腸道的5-HT3受體，是止吐劑，不是催吐劑。","","錯誤：Ondansetron為5-HT3受體拮抗劑，廣泛用於化療引起的嘔吐和其他原因的止吐，不是催吐劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_035","year":2017,"roc_year":106,"session":"2","examNo":35,"q":"下列何者不是使用制酸劑（antacids）常見的副作用？","opts":["A. 代償性胃酸分泌","B. 便秘／緩瀉","C. 減少其他同時服用藥品的吸收","D. 中樞抑制"],"ans":3,"exp":"制酸劑（antacids，如碳酸鈣、氫氧化鎂、氫氧化鋁）主要在胃腸道局部中和胃酸，全身吸收極少，不穿透血腦屏障，因此不引起中樞抑制（CNS depression）。選項D為錯誤描述。其他三個選項均為制酸劑的真實副作用或藥物交互作用。","we":["此為正確描述：制酸劑短暫中和胃酸後，胃酸pH升高觸發促胃液素（gastrin）分泌增加，導致代償性胃酸分泌（acid rebound），不符合「不是副作用」。","此為正確描述：含鋁制酸劑（如氫氧化鋁）引起便秘，含鎂制酸劑（如氫氧化鎂）引起緩瀉，是真實的副作用，不符合「不是副作用」。","此為正確描述：制酸劑可吸附或改變腸道pH影響其他藥物的溶解和吸收（如抗生素、鐵劑的吸收），是已知的藥物交互作用，不符合「不是副作用」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_036","year":2017,"roc_year":106,"session":"2","examNo":36,"q":"下列何者不是維生素A的生理功能？","opts":["A. 維持正常視力","B. 維持上皮細胞的正常結構","C. 維持正常生殖功能","D. 維持肌肉張力"],"ans":3,"exp":"維生素A（retinol）的已知生理功能包括：(1)維持正常視力（視紫質的組成成分，感光作用）；(2)維持上皮細胞正常結構和分化（皮膚、黏膜、角膜上皮）；(3)維持正常生殖功能（精子形成、胚胎發育）。「維持肌肉張力」不是維生素A的功能，肌肉張力的維持主要與神經肌肉系統和礦物質（鈣、鎂）有關。","we":["此為正確描述：維生素A（retinal，視黃醛）為感光物質視紫質（rhodopsin）的組成部分，缺乏時出現夜盲症，維持正常視力是其公認功能，不符合「不是」描述。","此為正確描述：維生素A調控上皮細胞的分化和角化，缺乏時黏膜和皮膚上皮角化異常，維持上皮細胞正常結構是其公認功能，不符合「不是」描述。","此為正確描述：維生素A參與睾丸的精子形成和胎兒正常發育，缺乏時可引起生殖障礙，維持正常生殖功能是其公認功能，不符合「不是」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_037","year":2017,"roc_year":106,"session":"2","examNo":37,"q":"下列何者常作為化痰劑以加強酸性黏多醣體的水解？","opts":["A. dimenhydrinate","B. hydroxyzine","C. phenylephrine","D. bromhexine"],"ans":3,"exp":"Bromhexine（溴己新）為黏液溶解劑（mucolytic agent），透過水解酸性黏多醣（acid mucopolysaccharides）的硫酸酯鍵，降解痰液中的黏蛋白分子，降低黏液黏稠度（解聚黏多醣），使痰液更容易排出，是呼吸道疾病的輔助治療藥物。","we":["錯誤：Dimenhydrinate（苯茶苯海明）為H1受體拮抗劑兼抗膽鹼藥，用於暈車症和止吐，不是化痰劑，不具水解黏多醣的活性。","錯誤：Hydroxyzine（羥嗪）為第一代H1受體拮抗劑，具有鎮靜和抗過敏作用，不是化痰劑，無水解黏多醣的活性。","錯誤：Phenylephrine為α1腎上腺素受體致效劑，用於血管收縮解除鼻充血，不是化痰劑，不具黏多醣水解活性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_038","year":2017,"roc_year":106,"session":"2","examNo":38,"q":"Methylcellulose是屬於下列何種瀉劑？","opts":["A. 容積性瀉劑（bulk laxatives）","B. 潤滑性瀉劑（emollient laxatives）","C. 刺激性瀉劑（irritant laxatives）","D. 高滲透壓性瀉劑（hyperosmotic laxatives）"],"ans":0,"exp":"Methylcellulose（甲基纖維素）為不可消化的多醣衍生物，口服後在腸道中吸收大量水分，使腸道內容物體積膨脹、增加糞便含水量和體積，刺激腸蠕動，屬於容積性瀉劑（bulk laxative）。與psyllium（車前子）同類，作用溫和，適合長期使用。","we":["","錯誤：潤滑性瀉劑（emollient laxatives，如礦物油、docusate sodium）透過潤滑或軟化糞便促進排便，不是依賴吸水膨脹的機制。","錯誤：刺激性瀉劑（irritant laxatives，如bisacodyl、cascara、蓖麻油）透過直接刺激腸黏膜神經或增加腸蠕動排便，不是依賴吸水膨脹。","錯誤：高滲透壓性瀉劑（hyperosmotic laxatives，如lactulose、polyethylene glycol）透過在腸道中產生高滲透壓使水分保留，機制與甲基纖維素的吸水膨脹不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_039","year":2017,"roc_year":106,"session":"2","examNo":39,"q":"關於ketoprofen之敘述，下列何者錯誤？","opts":["A. 為選擇性cyclooxygenase抑制劑","B. 可阻斷leukotriene B4之生合成","C. 促進蛋白多醣（proteoglycan）之生合成","D. 對發炎關節具有消炎作用"],"ans":0,"exp":"Ketoprofen（酮洛芬）為非選擇性COX抑制劑（同時抑制COX-1和COX-2），選項A描述「為選擇性cyclooxygenase抑制劑」為錯誤。Ketoprofen的其他特點均正確：可阻斷LTB4生成（具5-脂氧合酶抑制活性）、可促進蛋白多醣合成（對軟骨有保護作用）、具有強效抗炎作用。","we":["","此為正確描述：Ketoprofen除抑制COX外，還具有5-脂氧合酶（5-LOX）抑制活性，可減少LTB4（促炎性白三烯素）的生成，不符合「錯誤」描述。","此為正確描述：Ketoprofen（尤其在軟骨研究中）被認為可促進蛋白多醣（proteoglycan）合成，對關節軟骨具有一定保護作用，不符合「錯誤」描述。","此為正確描述：Ketoprofen為強效NSAID，對發炎關節具有顯著的抗炎鎮痛作用，廣泛用於犬貓的骨關節炎治療，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_040","year":2017,"roc_year":106,"session":"2","examNo":40,"q":"關於ergovaline之敘述，下列何者錯誤？","opts":["A. 由Acremonium coenophialum的黴菌所產生","B. 是牛毛草中毒（Fescue grass toxicity）的主要毒物","C. 是動脈之收縮劑","D. 對胃腸道、子宮、支氣管平滑肌皆具有抑制作用"],"ans":3,"exp":"Ergovaline（麥角纈胺酸）是牛毛草（fescue grass，高羊茅）中真菌（Acremonium coenophialum）產生的麥角生物鹼，為牛毛草中毒（fescue toxicosis）的主要毒素。它具有強效的平滑肌收縮（stimulatory）和血管收縮作用，包括胃腸道、子宮和支氣管平滑肌。選項D描述「對平滑肌皆具有抑制作用」為錯誤，應為刺激/收縮作用。","we":["此為正確描述：Ergovaline確實由寄生在高羊茅（tall fescue grass）中的Acremonium coenophialum（現稱Neotyphodium coenophialum）黴菌所產生，不符合「錯誤」描述。","此為正確描述：Ergovaline是牛毛草中毒（fescue toxicosis）的主要毒素，與牛、馬在採食受感染高羊茅後出現肢端壞疽、泌乳減少等症狀有關，不符合「錯誤」描述。","此為正確描述：Ergovaline具有強效動脈收縮作用，引起外周血管收縮，導致肢端缺血（壞疽）是fescue toxicosis的主要病理表現，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_041","year":2017,"roc_year":106,"session":"2","examNo":41,"q":"血管升壓素II（angiotensin II）有二個受體亞型，下列何者是AT1受體的拮抗劑？","opts":["A. losartan","B. aliskiren","C. captopril","D. enalapril"],"ans":0,"exp":"Losartan 屬於血管升壓素 II 第一型受體（AT1）拮抗劑（ARB），可阻斷 AT1 受體，抑制血管收縮及醛固酮分泌，達到降壓效果。Aliskiren 為直接腎素抑制劑；captopril 與 enalapril 均為血管轉化酶抑制劑（ACEI），作用位點不同。","we":["","錯誤：Aliskiren 為直接腎素（renin）抑制劑，作用於腎素-血管升壓素系統的最上游，並非 AT1 受體拮抗劑。","錯誤：Captopril 為血管轉化酶抑制劑（ACEI），抑制 ACE 將 angiotensin I 轉化為 angiotensin II，不直接拮抗 AT1 受體。","錯誤：Enalapril 同為 ACEI（需在體內水解為 enalaprilat 才具活性），與 losartan 的作用機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_042","year":2017,"roc_year":106,"session":"2","examNo":42,"q":"下列有關H2 -抗組織胺的敘述，何者正確？","opts":["A. 常用於治療過敏反應","B. 無法口服投予","C. Cimetidine具抑制cytochrome P-450的作用","D. Ranitidine和cromolyn的作用機制相同"],"ans":2,"exp":"Cimetidine 為 H2 受體拮抗劑，同時具有抑制肝臟細胞色素 P-450（CYP2C、CYP3A）的作用，可減慢多種藥物的代謝，引起臨床上重要的藥物交互作用。H2 拮抗劑主要用於消化性潰瘍和胃酸過多，而非過敏反應（過敏反應使用 H1 拮抗劑）。","we":["錯誤：H2 抗組織胺主要作用於胃壁細胞的 H2 受體，用於抑制胃酸，不用於治療過敏反應（過敏反應需要 H1 拮抗劑）。","錯誤：H2 拮抗劑（如 cimetidine、ranitidine）均可口服投予，吸收良好，此敘述有誤。","","錯誤：Ranitidine 為 H2 受體拮抗劑；cromolyn 為肥大細胞穩定劑，兩者作用機制完全不同，並非相同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_043","year":2017,"roc_year":106,"session":"2","examNo":43,"q":"糖質腎上腺皮質素酮（glucocorticoids）於藥理劑量時的消炎作用之機制為何？","opts":["A. 抑制磷脂酶A2（phospholipase A2）","B. 抑制酪胺酸激酶（tyrosine kinase）","C. 抑制血管加壓素轉化酶（angiotensin converting enzyme）","D. 抑制protein kinase G"],"ans":0,"exp":"糖質腎上腺皮質素在藥理劑量下，可誘導合成 lipocortin（annexin），進而抑制磷脂酶 A2（phospholipase A2），阻止細胞膜磷脂釋放花生四烯酸（arachidonic acid），從而同時減少前列腺素（prostaglandins）和白三烯素（leukotrienes）的生成，達到廣泛的抗發炎效果。","we":["","錯誤：抑制酪胺酸激酶（tyrosine kinase）是某些生長因子受體拮抗劑（如 imatinib）的機制，非糖質皮質素的消炎機制。","錯誤：抑制血管轉化酶（ACE）是 ACEI 類降壓藥（如 captopril）的機制，與糖質皮質素的消炎作用無關。","錯誤：抑制 protein kinase G 屬於影響 cGMP 訊號路徑，非糖質皮質素的主要消炎機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_044","year":2017,"roc_year":106,"session":"2","examNo":44,"q":"Propylthiouracil可用於下列何種疾病？","opts":["A. 腫瘤","B. 心衰竭","C. 甲狀腺亢進","D. 球蟲感染"],"ans":2,"exp":"Propylthiouracil（PTU）屬於 thioamide 類藥物，可抑制甲狀腺過氧化酶（thyroid peroxidase），阻礙碘化與甲狀腺素（T3、T4）的合成，同時亦可抑制 T4 在週邊組織轉化為活性較強的 T3，主要用於治療甲狀腺機能亢進。","we":["錯誤：PTU 為抗甲狀腺藥，不具有抗腫瘤活性，不用於治療腫瘤。","錯誤：PTU 不影響心肌收縮力或容量負荷，無心衰竭治療適應症。","","錯誤：球蟲感染需使用抗球蟲藥（如 amprolium、sulfonamides），PTU 不具抗寄生蟲作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_045","year":2017,"roc_year":106,"session":"2","examNo":45,"q":"下列何者屬於第一代的抗組織胺？","opts":["A. dopamine","B. dobutamine","C. hydroxytryptamine","D. chlorpheniramine"],"ans":3,"exp":"Chlorpheniramine 為第一代 H1 受體拮抗劑，具有中樞鎮靜作用及抗膽鹼效果，常用於犬貓過敏性疾病。Dopamine 和 dobutamine 為兒茶酚胺類心血管藥物，hydroxytryptamine（5-HT）為神經傳導物質，均非抗組織胺藥。","we":["錯誤：Dopamine 為兒茶酚胺類神經傳導物質及血管活性藥物（作用於多巴胺、α、β受體），不屬於抗組織胺。","錯誤：Dobutamine 為選擇性 β1 腎上腺素受體致效劑，用於心衰竭的正性肌力治療，不是抗組織胺藥。","錯誤：Hydroxytryptamine（血清素，5-HT）為神經傳導物質，非抗組織胺藥，臨床用途完全不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_046","year":2017,"roc_year":106,"session":"2","examNo":46,"q":"快速靜脈注射下列何者，最有可能導致肥大細胞釋放組織胺？","opts":["A. meclizine","B. morphine","C. metronidazole","D. mannitol"],"ans":1,"exp":"嗎啡（morphine）快速靜脈注射時，可直接觸發肥大細胞（mast cells）非免疫性去顆粒化，釋放組織胺，引起局部血管擴張、蕁麻疹及低血壓等反應，此為非 IgE 介導的組織胺釋放。因此，靜脈注射嗎啡時應緩慢給藥以減少此副作用。","we":["錯誤：Meclizine 為第一代 H1 抗組織胺，具抗暈車作用，不會導致肥大細胞釋放組織胺。","","錯誤：Metronidazole 為抗原蟲及抗厭氧菌藥，不具有誘發肥大細胞去顆粒化的特性。","錯誤：Mannitol 為滲透性利尿劑，不會引起肥大細胞釋放組織胺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_047","year":2017,"roc_year":106,"session":"2","examNo":47,"q":"下列有關chlorhexidine的敘述中，何者正確？","opts":["A. 分類上屬於天然植物鹼","B. 可為硬水所不活化","C. 常用於大規模的環境消毒","D. 殺菌能力較酒精快，但殘留時間短"],"ans":1,"exp":"Chlorhexidine 為雙胍類（biguanide）合成消毒劑，其最大優點之一是不被硬水中的礦物質離子（Ca²⁺、Mg²⁺）所不活化，與第四銨鹽（QAC）不同。此外，chlorhexidine 殺菌速率雖較酒精慢，但具有長效殘留抗菌活性，適合皮膚消毒使用。","we":["錯誤：Chlorhexidine 屬於人工合成的雙胍類化合物，並非天然植物鹼，此分類描述錯誤。","","錯誤：Chlorhexidine 成本較高，主要用於皮膚、手術部位及傷口消毒，不常用於大規模環境消毒（環境消毒多用酚類或醛類消毒劑）。","錯誤：Chlorhexidine 的殺菌速率比酒精慢，但其殘留抗菌活性反而較酒精長，此選項描述顛倒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_048","year":2017,"roc_year":106,"session":"2","examNo":48,"q":"下列有關乙醇（ethyl alcohol）及異丙醇（isopropyl alcohol）特性的敘述中，何者正確？","opts":["A. 乙醇僅可溶解脂肪而不會使蛋白質變性","B. 異丙醇僅可使蛋白質變性而不會溶解脂肪","C. 血液等有機物可明顯下降乙醇的作用","D. 異丙醇最常使用的濃度為35-45％（v/v）"],"ans":2,"exp":"乙醇（ethyl alcohol）及異丙醇均可溶解脂質並使蛋白質變性，兩者的殺菌機制兼具此二作用。然而，血液、膿汁等有機物會與乙醇結合或稀釋，顯著降低其殺菌效力，因此酒精在有機物存在時活性明顯下降，使用前應清潔傷口或器械表面。","we":["錯誤：乙醇既可溶解脂質（破壞細胞膜）又可使蛋白質變性（破壞酵素），兩種機制均有，此敘述不正確。","錯誤：異丙醇同樣兼具溶脂及使蛋白質變性的作用，並非只有一種機制，此敘述不正確。","","錯誤：異丙醇最有效的殺菌濃度為 70-90%（v/v），並非 35-45%；過低濃度的酒精殺菌力不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_049","year":2017,"roc_year":106,"session":"2","examNo":49,"q":"下列何者不具有β-lactam雙環的基本結構？","opts":["A. imipenem","B. aztreonam","C. oxacillin","D. cefazolin"],"ans":1,"exp":"Aztreonam 為單環內醯胺（monobactam）抗生素，其 β-lactam 環為單環結構，不具有 β-lactam 雙環（bicyclic）骨架，此點使其對產生 β-lactamase 的 G(-)菌仍有選擇性活性。Imipenem（carbapenem）、oxacillin（penicillin）及 cefazolin（cephalosporin）均具有 β-lactam 雙環基本結構。","we":["錯誤：Imipenem 為 carbapenem 類抗生素，具有 β-lactam 與 thiazolidine（五員含硫環）融合的雙環結構，並非單環。","","錯誤：Oxacillin 為 penicillin 類，具有 β-lactam 環與 thiazolidine 環融合的雙環（penam）結構。","錯誤：Cefazolin 為第一代頭孢菌素，具有 β-lactam 環與 dihydrothiazine 六員環融合的雙環（cephem）結構。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_050","year":2017,"roc_year":106,"session":"2","examNo":50,"q":"併用三種磺胺劑的最主要原因在於：","opts":["A. 延長投藥的間隔期間","B. 減少尿結石的產生","C. 縮短治療期間","D. 增高血中濃度並增強抗菌效力"],"ans":1,"exp":"三種磺胺劑（triple sulfonamide）併用的最主要原因在於減少尿結石（crystalluria）的形成。每種磺胺劑各自的溶解度獨立計算，三種各使用 1/3 劑量時，個別濃度均低於其在尿液中的飽和點，因此不會結晶析出，但三種藥物的抗菌效力可以相加，仍維持完整療效。","we":["錯誤：三種磺胺劑併用並不能顯著延長投藥間隔，延長給藥間隔需要選用半衰期較長的磺胺劑（如 sulfadimethoxine），不是三重合劑的目的。","","錯誤：縮短治療期間需依靠藥物本身的藥效學特性，三重磺胺劑的主要目的在減少結晶尿而非縮短療程。","錯誤：三重磺胺劑各成分劑量均只有 1/3，血中總磺胺濃度約等於單一磺胺全劑量，並非「增高血中濃度」，此敘述不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_051","year":2017,"roc_year":106,"session":"2","examNo":51,"q":"下列何者投藥後不需經過分解程序，藥物本身即具有活性？","opts":["A. chloramphenicol succinate","B. erythromycin estolate","C. clindamycin hydrochloride","D. sulfasalazine"],"ans":2,"exp":"Clindamycin hydrochloride（鹽酸克林達黴素）為鹽酸鹽形式，本身直接具有抗菌活性，投藥後不需在體內水解或代謝才能發揮作用。相比之下，chloramphenicol succinate（琥珀酸酯形式）、erythromycin estolate（酯類前驅藥）及 sulfasalazine（由腸道菌叢分解後釋放有效成分）均屬前驅藥（prodrug）。","we":["錯誤：Chloramphenicol succinate 為不具活性的前驅藥酯，需在體內由酯酶水解為 chloramphenicol 後才具殺菌活性，不符合題目「不需分解即具活性」。","錯誤：Erythromycin estolate 為前驅藥酯鹽形式，吸收後水解釋出活性 erythromycin，不符合題目「直接具活性」的條件。","","錯誤：Sulfasalazine 在體內由大腸菌群（anaerobes）分解，釋出 sulfapyridine 及 5-aminosalicylic acid（5-ASA）才發揮療效，屬前驅藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_052","year":2017,"roc_year":106,"session":"2","examNo":52,"q":"下列有關磺胺劑併用ormetoprim的敘述，何者錯誤？","opts":["A. 延長藥物在體內的作用時間","B. 可達到殺菌（bacteriocidal）效果","C. 增廣抗菌範圍","D. 增強抗菌作用"],"ans":0,"exp":"磺胺劑與 ormetoprim 的合併使用，主要目的在於透過分別抑制葉酸合成路徑的連續步驟（磺胺劑阻斷 PABA 利用，ormetoprim 抑制二氫葉酸還原酶 DHFR），達到協同殺菌（bactericidal）效果並擴大抗菌範圍。「延長藥物在體內的作用時間」並非此組合的主要目的，故此敘述為錯誤。","we":["","此為正確描述：磺胺劑與 ormetoprim 協同阻斷葉酸合成的連續兩個步驟，可達到殺菌（bactericidal）效果，不符合題目問的「錯誤」描述。","此為正確描述：此組合因作用於不同位點，可擴大對多種細菌的抗菌範圍，不符合題目問的「錯誤」描述。","此為正確描述：兩藥協同作用可顯著增強抗菌效力（synergistic effect），不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_053","year":2017,"roc_year":106,"session":"2","examNo":53,"q":"養殖魚類以trichlorfon藥浴，其停藥期為：","opts":["A. 5日","B. 7日","C. 14日","D. 21日"],"ans":0,"exp":"Trichlorfon（有機磷類殺蟲藥）用於養殖魚類藥浴時，台灣法規規定停藥期為 5 日，確保魚體內藥物殘留量降至安全範圍後才可供人食用。有機磷化合物雖水解較快，但仍需遵守規定停藥期。","we":["","錯誤：7 日停藥期不符合 trichlorfon 藥浴養殖魚的法規規定，正確停藥期為 5 日。","錯誤：14 日停藥期過長，不符合 trichlorfon 藥浴的實際規定，可能混淆其他藥物的停藥期。","錯誤：21 日停藥期過長，不符合 trichlorfon 藥浴養殖魚的法定停藥期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_054","year":2017,"roc_year":106,"session":"2","examNo":54,"q":"下列何者對魚類具鎮定作用？","opts":["A. hydrogen peroxide","B. magnesium sulfate","C. potassium permanganate","D. tricaine methanesulfonate"],"ans":3,"exp":"Tricaine methanesulfonate（MS-222）為魚類專用的局部麻醉兼鎮靜藥，透過藥浴方式經鰓吸收，抑制神經膜的鈉離子通道，對魚類產生鎮靜和全身麻醉效果，廣泛用於魚類採樣、手術及運輸時的固定。","we":["錯誤：Hydrogen peroxide（過氧化氫）用於魚類外寄生蟲（如海蝨）的治療或水質殺菌，不具鎮靜麻醉作用。","錯誤：Magnesium sulfate（硫酸鎂）用於調節水體離子平衡，不作為魚類鎮靜劑使用。","錯誤：Potassium permanganate（高錳酸鉀）為魚類外寄生蟲和細菌感染的消毒殺菌劑，不具鎮靜麻醉作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_055","year":2017,"roc_year":106,"session":"2","examNo":55,"q":"臨床上amoxicillin常與下列何者合併投藥？","opts":["A. ascorbic acid","B. clavulanic acid","C. folic acid","D. oxalic acid"],"ans":1,"exp":"Amoxicillin 為廣效型青黴素，但易被細菌產生的 β-lactamase 水解失效。臨床上常與 clavulanic acid（克拉維酸）合併使用，後者為 β-lactamase 不可逆抑制劑（自殺性底物），可保護 amoxicillin 不被酵素分解，此組合即為 Augmentin（阿莫克拉），大幅擴展了抗菌範圍。","we":["錯誤：Ascorbic acid（維生素 C）為抗氧化劑，與 amoxicillin 無協同抗菌作用，不是常見的臨床合併用藥。","","錯誤：Folic acid（葉酸）為維生素，用於貧血或妊娠補充，不與 amoxicillin 合併用於抗菌治療。","錯誤：Oxalic acid（草酸）為有機酸，無抗菌或 β-lactamase 抑制作用，不與 amoxicillin 配伍使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_056","year":2017,"roc_year":106,"session":"2","examNo":56,"q":"下列何者最適合用於治療立克次體（Rickettsiae）或披衣菌（chlamydiae）之感染症？","opts":["A. neomycin","B. minocycline","C. tylosin","D. cephalexin"],"ans":1,"exp":"立克次體（Rickettsia）和披衣菌（Chlamydia）均為胞內寄生菌，需要具有優良細胞穿透性的藥物才能有效殺菌。Minocycline 屬於四環素類，脂溶性最高，細胞穿透力強，可有效進入感染細胞發揮作用，是治療此類胞內病原首選藥物之一。","we":["錯誤：Neomycin 為胺基糖苷類，細胞穿透力差，幾乎無法進入宿主細胞殺滅胞內病原，不適用於立克次體或披衣菌感染。","","錯誤：Tylosin 為大環內酯類，主要用於黴漿菌（Mycoplasma）感染，對立克次體和披衣菌的療效不及 minocycline。","錯誤：Cephalexin 為第一代頭孢菌素，作用於細胞壁合成，而立克次體和披衣菌為胞內寄生菌，頭孢菌素無法有效治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_057","year":2017,"roc_year":106,"session":"2","examNo":57,"q":"下列何者為polymyxin B、bacitracin和neomycin可局部使用或經口投藥，但不能注射投藥的主要原因？","opts":["A. 肝毒性太強","B. 腎毒性太強","C. 耳毒性太強","D. 神經毒性太強"],"ans":1,"exp":"Polymyxin B、bacitracin 和 neomycin 三者全身注射時均具有顯著的腎毒性（nephrotoxicity），注射劑量可造成腎小管細胞壞死，因此限制其全身給藥的使用。臨床上此三藥常製成局部皮膚/眼睛用製劑（OTC 三聯抗生素軟膏）或口服用於腸道不吸收感染，避免全身暴露引起腎損傷。","we":["錯誤：肝毒性不是限制此三藥注射給藥的主要原因，其腎毒性才是臨床上最重要的限制因素。","","錯誤：耳毒性（ototoxicity）雖然 aminoglycosides 類（如 neomycin）確有此副作用，但三藥不能注射的「最主要原因」是腎毒性，而非耳毒性。","錯誤：雖然 polymyxin B 也具有神經毒性，但限制此三藥注射給藥的最主要原因仍為腎毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_058","year":2017,"roc_year":106,"session":"2","examNo":58,"q":"下列那一種消毒劑在有機物質（血液、黏液）存在時，仍然具有較強之消毒作用？","opts":["A. benzalkonium chloride","B. 70% alcohol","C. iodophors","D. 50% isopropyl alcohol"],"ans":2,"exp":"碘伏（iodophors，碘與界面活性劑的複合物）在有機物存在時，其殺菌活性下降幅度遠小於第四銨鹽（QAC）或酒精，因此在血液或黏液等有機物污染環境中仍保有較強的消毒效果。碘伏廣泛用於手術部位及傷口消毒，正因其受有機物影響較小。","we":["錯誤：Benzalkonium chloride（苯扎氯銨，QAC 類）在有機物存在時會被大量失活，殺菌效力顯著下降，不符合「仍具較強消毒作用」的描述。","錯誤：70% 酒精在血液等有機物存在時，其殺菌效力明顯降低，因為有機物會稀釋酒精濃度並消耗其活性。","","錯誤：50% 異丙醇濃度低於最佳殺菌濃度（70-90%），本身殺菌效力即不足，更無法在有機物存在下維持強效消毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_059","year":2017,"roc_year":106,"session":"2","examNo":59,"q":"Aminoglycosides之殺菌機制為：","opts":["A. 抑制核醣體30S合成蛋白質","B. 抑制核醣體50S合成蛋白質","C. 抑制DNA合成","D. 抑制細胞壁合成"],"ans":0,"exp":"Aminoglycosides（如 gentamicin、neomycin、streptomycin）的殺菌機制為不可逆地與細菌 30S 核醣體次單位結合，造成 mRNA 誤讀（misreading），導致合成異常蛋白質，最終使細菌死亡。此類藥物具有濃度依賴性殺菌（concentration-dependent killing）的特性。","we":["","錯誤：抑制 50S 核醣體次單位的抗生素包括 chloramphenicol、macrolides 及 lincosamides，不是 aminoglycosides 的作用位點。","錯誤：抑制 DNA 合成是 fluoroquinolones（作用於 DNA gyrase）或 metronidazole（損傷 DNA）的機制，非 aminoglycosides 的作用。","錯誤：抑制細胞壁合成是 β-lactam 類（青黴素、頭孢菌素）及 vancomycin 的機制，非 aminoglycosides 的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_060","year":2017,"roc_year":106,"session":"2","examNo":60,"q":"下列何者對G（-）具有良好的抗菌能力，並且於注射給藥後，具有類似penicillin G之分布？","opts":["A. minocycline","B. aztreonam","C. azithromycin","D. tylosin"],"ans":1,"exp":"Aztreonam 為單環內醯胺（monobactam）抗生素，專門針對 G(-) 需氧菌，對 G(+) 菌及厭氧菌無效。注射後其在體內的分布特性（血漿蛋白結合率、分布容積、清除途徑）與 penicillin G 相近，不同於四環素類或大環內酯類藥物。","we":["錯誤：Minocycline 屬於四環素類，具有廣效抗菌活性（G+/-、胞內菌），分布特性與 penicillin G 不同，且脂溶性高、分布容積大。","","錯誤：Azithromycin 為大環內酯類抗生素，組織穿透力強、半衰期極長，分布與 penicillin G 完全不同，且主要用於 G(+)、非典型病原及 G(-) 的部分菌種。","錯誤：Tylosin 為大環內酯類，主要用於 G(+) 細菌及黴漿菌感染，在家禽獸醫中常見，分布特性與 penicillin G 不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_061","year":2017,"roc_year":106,"session":"2","examNo":61,"q":"下列何者會增加sulfonamides產生尿結石症？","opts":["A. 增加尿液的酸性","B. 併用三種同類sulfonamides藥","C. 使用sulfonamides鈉鹽之製劑","D. 增高尿的pH值"],"ans":0,"exp":"磺胺劑（sulfonamides）在酸性尿液中溶解度降低，容易達到飽和濃度而析出結晶，造成腎小管損傷（crystalluria）。因此增加尿液酸性（降低 pH 值）會顯著增加磺胺劑尿結石的風險。臨床上常給予碳酸氫鈉鹼化尿液以預防結晶尿。","we":["","錯誤：併用三種同類磺胺劑（triple sulfonamide）的目的恰好是「減少」結晶尿，因每種磺胺劑各自溶解度獨立計算，三者各 1/3 劑量均低於飽和點，故不會增加結晶尿風險。","錯誤：使用磺胺劑鈉鹽製劑（sodium salt）可增加藥物在尿液中的溶解度，反而有助於減少結晶尿的發生，不會增加尿結石症。","錯誤：增高尿液 pH 值（鹼化尿液）可提高磺胺劑的溶解度，防止結晶析出，是預防磺胺劑結晶尿的措施，而非誘因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_062","year":2017,"roc_year":106,"session":"2","examNo":62,"q":"下列何者經口投藥易與金屬離子形成螯合物，影響腸道吸收？","opts":["A. chlortetracycline","B. streptomycin","C. spectinomycin","D. spiramycin"],"ans":0,"exp":"四環素類抗生素（tetracyclines，如 chlortetracycline）具有螯合二價及三價金屬離子（Ca²⁺、Mg²⁺、Fe²⁺、Al³⁺）的能力，在胃腸道中與食物或制酸劑中的金屬離子形成不溶性螯合物，大幅降低藥物的腸道吸收率，因此四環素類應避免與牛奶、鈣鐵製劑或含金屬的制酸劑同時服用。","we":["","錯誤：Streptomycin 為胺基糖苷類，本身在腸道幾乎不被吸收，且不具有顯著螯合二價金屬離子的特性，此選項不正確。","錯誤：Spectinomycin 屬於 aminocyclitol 類，與金屬離子的螯合交互作用不如四環素類顯著，不是此機制的代表藥。","錯誤：Spiramycin 為大環內酯類抗生素，不具有多羥基酮結構，不會與腸道金屬離子形成螯合物影響吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_063","year":2017,"roc_year":106,"session":"2","examNo":63,"q":"抗生素tilmicosin是屬於：","opts":["A. aminoglycosides","B. cephalosporins","C. macrolides","D. polypeptides"],"ans":2,"exp":"Tilmicosin 為半合成大環內酯類（macrolide）抗生素，由 tylosin 衍生而來，主要用於牛、豬及家禽的呼吸道感染（尤其是黴漿菌和多殺性巴氏桿菌），具有較長的半衰期和良好的組織穿透力，但對牛以外的動物（如馬、靈長類）靜脈注射具有心臟毒性。","we":["錯誤：Aminoglycosides 類（如 gentamicin、streptomycin）的作用機制為抑制 30S 核醣體，tilmicosin 屬大環內酯類，兩者藥理類別不同。","錯誤：Cephalosporins 為 β-lactam 類抗生素，作用於細胞壁合成，tilmicosin 的結構與作用機制均與頭孢菌素完全不同。","","錯誤：Polypeptides 類（如 polymyxin B、bacitracin）為多肽類抗生素，與大環內酯類結構和作用機制均不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_064","year":2017,"roc_year":106,"session":"2","examNo":64,"q":"Fluoroquinolone類抗菌劑的主要抗菌機制為抑制下列何者？","opts":["A. DNA","B. RNA","C. 蛋白質","D. 細胞壁"],"ans":0,"exp":"Fluoroquinolones（氟喹諾酮類，如 enrofloxacin、ciprofloxacin）的主要抗菌機制為抑制細菌的 DNA 旋轉酶（DNA gyrase，topoisomerase II）及拓樸異構酶 IV（topoisomerase IV），阻礙細菌 DNA 的超螺旋鬆弛和複製，屬於殺菌性抗生素。","we":["","錯誤：抑制 RNA 合成是 rifampicin（作用於 RNA 聚合酶）的機制，非 fluoroquinolones 的作用靶點。","錯誤：抑制蛋白質合成是 aminoglycosides（30S）、tetracyclines（30S）、macrolides、chloramphenicol（50S）等的機制，fluoroquinolones 的靶點為 DNA 合成而非蛋白質合成。","錯誤：抑制細胞壁合成是 β-lactam 類及 vancomycin 的機制，不是 fluoroquinolones 的作用靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_065","year":2017,"roc_year":106,"session":"2","examNo":65,"q":"下列何者常用於治療家禽的黴漿菌感染症？","opts":["A. streptomycin","B. aztreonam","C. tylosin","D. ampicillin"],"ans":2,"exp":"Tylosin（泰黴素）為大環內酯類抗生素，對黴漿菌（Mycoplasma）具有優良療效，廣泛用於防治家禽慢性呼吸道病（CRD）及豬黴漿菌肺炎。黴漿菌因無細胞壁，對 β-lactam 類（如 ampicillin）天然抗藥，氨基糖苷類（streptomycin）和 monobactam（aztreonam）對黴漿菌效果亦差。","we":["錯誤：Streptomycin 為胺基糖苷類，主要作用於有細胞壁的 G(-) 菌，對黴漿菌（無細胞壁）效果不佳，不是治療家禽黴漿菌感染的首選。","錯誤：Aztreonam 為單環內醯胺（monobactam），作用於細胞壁合成，黴漿菌無細胞壁故天然抗藥，無法用於黴漿菌感染。","","錯誤：Ampicillin 為 β-lactam 類青黴素，作用於細胞壁肽聚糖合成，黴漿菌無細胞壁，對 β-lactam 天然抗藥，不適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_066","year":2017,"roc_year":106,"session":"2","examNo":66,"q":"下列抗黴菌藥中，藥物本身不具殺菌活性，須進入黴菌細胞被代謝後始具活性的藥物是：","opts":["A. ketoconazole","B. griseofulvin","C. flucytosine","D. amphotericin B"],"ans":2,"exp":"Flucytosine（5-FC）本身為前驅藥（prodrug），不具直接殺菌活性，進入黴菌細胞後由細胞質中的胞嘧啶去胺酶（cytosine deaminase）代謝轉化為 5-氟尿嘧啶（5-fluorouracil，5-FU），5-FU 再進一步轉化為活性代謝物，抑制胸腺嘧啶合成酶及 RNA 合成，發揮抗黴菌作用。哺乳動物細胞缺乏此酵素，故具有選擇毒性。","we":["錯誤：Ketoconazole 為 azole 類抗黴菌藥，本身直接具有活性，抑制 CYP51（lanosterol 14α-demethylase），阻礙麥角固醇合成，不是前驅藥。","錯誤：Griseofulvin 本身直接具有抗皮癬菌活性，與黴菌微管蛋白結合抑制有絲分裂，不需在體內代謝活化，不是前驅藥。","","錯誤：Amphotericin B 為多烯類（polyene），本身直接與黴菌細胞膜中的麥角固醇結合，造成膜穿孔，具有直接殺菌活性，不是前驅藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_067","year":2017,"roc_year":106,"session":"2","examNo":67,"q":"Griseofulvin對下列何種黴菌無效？","opts":["A. 念珠球菌（Candida spp.）","B. 表皮癬菌（Epidermophyton spp.）","C. 毛癬菌（Trichophyton spp.）","D. 小芽孢癬菌（Microsporum spp.）"],"ans":0,"exp":"Griseofulvin 為多烯類抗黴菌藥（取自 Penicillium griseofulvum），其作用機制為與黴菌微管蛋白（tubulin）結合，干擾有絲分裂紡錘體形成，對皮癬菌（dermatophytes，包括 Epidermophyton、Trichophyton、Microsporum）具有選擇性療效。但 griseofulvin 對念珠菌（Candida spp.，為酵母菌）完全無效，治療念珠菌病需改用 azole 類或 amphotericin B。","we":["","此為正確描述：Griseofulvin 對表皮癬菌（Epidermophyton spp.）有效，屬其適應症範圍，不符合題目問的「無效」描述。","此為正確描述：Griseofulvin 對毛癬菌（Trichophyton spp.）有效，包括引起貓狗皮癬的 T. mentagrophytes，不符合「無效」描述。","此為正確描述：Griseofulvin 對小芽孢癬菌（Microsporum spp.）有效，是治療貓犬皮癬症的傳統用藥，不符合「無效」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_068","year":2017,"roc_year":106,"session":"2","examNo":68,"q":"下列何者可殺滅犬心絲蟲之成蟲與第5期幼蟲？","opts":["A. milbemycin","B. melarsomine","C. selamectin","D. moxidectin"],"ans":1,"exp":"Melarsomine（美拉沙明，含砷有機化合物）為唯一核准用於殺滅犬心絲蟲（Dirofilaria immitis）成蟲的藥物，深層肌肉注射後可殺滅成蟲及第 5 期幼蟲（L5）。Milbemycin、selamectin 及 moxidectin 均屬 macrocyclic lactone 類，只能殺滅微絲蚴和 L3/L4 幼蟲，用於預防感染，無法殺滅成蟲。","we":["錯誤：Milbemycin 為大環內酯類，作用於 GABA/glutamate-gated Cl⁻ 通道，用於心絲蟲預防（殺滅 L3/L4）及驅除微絲蚴，無法殺滅成蟲。","","錯誤：Selamectin 為 avermectin 衍生物，可預防心絲蟲感染並殺滅微絲蚴，但對成蟲無效，不能取代 melarsomine 的成蟲殺滅療法。","錯誤：Moxidectin 為大環內酯類，可殺滅 L3/L4 幼蟲用於預防，亦可減少微絲蚴數量，但對心絲蟲成蟲的殺滅效果不如 melarsomine 確實。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_069","year":2017,"roc_year":106,"session":"2","examNo":69,"q":"作用機制屬於nicotinic agonist的抗寄生蟲藥是：","opts":["A. milbemycin","B. moxidectin","C. piperazine","D. pyrantel"],"ans":3,"exp":"Pyrantel（抹蟲露）為煙鹼型乙醯膽鹼受體（nicotinic AChR）致效劑，與寄生蟲神經肌肉接頭的 nAChR 結合，引起去極化性神經肌肉阻斷（depolarizing NMJ block），使蟲體持續痙攣收縮而麻痺排出。Milbemycin 和 moxidectin 作用於 GABA/Glu-gated Cl⁻ 通道；piperazine 為 GABA 模擬物，引起超極化。","we":["錯誤：Milbemycin 為大環內酯類（macrocyclic lactone），作用於 GABA/glutamate-gated Cl⁻ 通道，引起超極化麻痺，而非 nicotinic agonist。","錯誤：Moxidectin 亦為大環內酯類，與 milbemycin 作用機制相同（Cl⁻ 通道開放→超極化），不是 nicotinic receptor agonist。","錯誤：Piperazine 為 GABA 模擬物，作用於蟲體 GABA 受體，導致神經肌肉超極化（hyperpolarization）使蟲體弛緩麻痺，與 pyrantel 的去極化機制相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_070","year":2017,"roc_year":106,"session":"2","examNo":70,"q":"不屬於ionophores的抗球蟲藥是何者？","opts":["A. lasalocid","B. monensin","C. robenidine","D. semduramicin"],"ans":2,"exp":"Ionophore 類抗球蟲藥（如 lasalocid、monensin、semduramicin、narasin、maduramicin）透過攜帶金屬陽離子（Na⁺、K⁺、Ca²⁺）穿越球蟲細胞膜，干擾離子平衡，導致細胞腫脹死亡。Robenidine 屬於鹽酸胍類（guanidine derivative），作用機制不同（干擾 ATP 合成），故不屬於 ionophore 類抗球蟲藥。","we":["此為正確描述：Lasalocid 為 ionophore 類抗球蟲藥，可攜帶二價陽離子（如 Ca²⁺），不符合題目問的「不屬於 ionophore」描述。","此為正確描述：Monensin 為 ionophore 類，主要攜帶 Na⁺，廣泛用於家禽球蟲病防治，不符合「不屬於 ionophore」描述。","","此為正確描述：Semduramicin 為 polyether ionophore，其效力強，主要用於肉雞，不符合「不屬於 ionophore」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_071","year":2017,"roc_year":106,"session":"2","examNo":71,"q":"下列何者可用於驅除牛肺蟲？","opts":["A. amprolium","B. bunamidine","C. robenidine","D. levamisole"],"ans":3,"exp":"Levamisole（左旋咪唑）為咪唑并噻唑類（imidazothiazole）驅蟲藥，作用機制為 nicotinic AChR 致效劑，引起蟲體神經肌肉去極化麻痺，對牛肺蟲（Dictyocaulus viviparus）及多種胃腸線蟲均具有良好驅除效果。Amprolium 和 robenidine 為抗球蟲藥，bunamidine 為舊型滅條蟲藥，均無驅肺蟲療效。","we":["錯誤：Amprolium 為球蟲感染的預防及治療藥（維生素 B1 結構類似物，干擾球蟲硫胺素代謝），不是驅肺蟲藥。","錯誤：Bunamidine 為舊型滅條蟲藥（cestocide），用於驅除絛蟲，對肺蟲無效。","錯誤：Robenidine 為鹽酸胍類抗球蟲藥，用於家禽球蟲病預防，不具有驅肺蟲活性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_072","year":2017,"roc_year":106,"session":"2","examNo":72,"q":"下列何者適用於治療滴蟲症？","opts":["A. cyproheptadine","B. metronidazole","C. propranolol","D. quinidine"],"ans":1,"exp":"Metronidazole（滅滴靈）為硝基咪唑類（nitroimidazole）藥物，在厭氧環境中還原為活性代謝物，破壞原蟲或厭氧菌的 DNA，對滴蟲（Trichomonas spp.）、梨形鞭毛蟲（Giardia）及厭氧菌感染均有效，是治療犬貓滴蟲症的標準用藥。","we":["錯誤：Cyproheptadine 為第一代 H1 抗組織胺，同時具有抗血清素作用，用於貓食慾不振或 Cushing's disease 輔助治療，無抗原蟲活性。","","錯誤：Propranolol 為非選擇性 β 腎上腺素受體阻斷劑，用於心律不整和甲狀腺亢進相關心血管症狀，無抗原蟲作用。","錯誤：Quinidine 為鈉通道阻斷劑，用於心室性心律不整，不具有抗寄生蟲活性，不用於滴蟲症治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_073","year":2017,"roc_year":106,"session":"2","examNo":73,"q":"下列何者非以阻止神經肌肉的去極化來麻痺蟲體？","opts":["A. fenbendazole","B. levamisole","C. pyrantel","D. morantel"],"ans":0,"exp":"Fenbendazole 為苯并咪唑類（benzimidazole）驅蟲藥，其作用機制為與線蟲的 β-微管蛋白（β-tubulin）結合，抑制微管聚合，干擾蟲體的細胞骨架和葡萄糖攝取，使蟲體逐漸死亡。此機制與神經肌肉去極化無關。相反，levamisole、pyrantel 和 morantel 均為 nicotinic AChR 致效劑，造成去極化性 NMJ 阻斷，使蟲體痙攣麻痺。","we":["","此為正確描述：Levamisole 為 nicotinic AChR 致效劑，透過去極化性 NMJ 阻斷使蟲體麻痺，屬於「以阻止 NMJ 去極化」機制，不符合題目問的「非以去極化機制」描述。","此為正確描述：Pyrantel 為 nicotinic AChR agonist，引起去極化性 NMJ 阻斷，與題目問「非去極化機制」不符。","此為正確描述：Morantel 與 pyrantel 結構相近，同為 nicotinic AChR 致效劑，引起去極化性 NMJ 阻斷，不符合「非去極化機制」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_074","year":2017,"roc_year":106,"session":"2","examNo":74,"q":"下列何藥物可抑制chitin的生合成？","opts":["A. diflubenzuron","B. dithiazanine iodide","C. bithionol","D. diamphenethide"],"ans":0,"exp":"Diflubenzuron 為苯甲酰脲類（benzoylurea）昆蟲生長調節劑（IGR），可抑制昆蟲 chitin 合酶（chitin synthetase）的活性，阻止幾丁質（chitin）的生物合成，使昆蟲幼蟲在蛻皮時無法形成正常的外骨骼而死亡。對哺乳動物毒性極低，因哺乳動物不具 chitin 合成系統。","we":["","錯誤：Dithiazanine iodide 為舊型抗絲蟲藥，用於犬心絲蟲微絲蚴的治療，不具有抑制 chitin 合成的作用。","錯誤：Bithionol 為苯酚類殺蟲藥，主要用於驅除肝臟吸蟲（肝吸蟲病），不抑制 chitin 合成。","錯誤：Diamphenethide 為有機磷類前驅藥，用於治療急性羊肝吸蟲（Fasciola hepatica）感染，不具 chitin 合成抑制活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_075","year":2017,"roc_year":106,"session":"2","examNo":75,"q":"下列何者歸類為腎毒性黴菌毒素？","opts":["A. ochratoxin","B. phallotoxin","C. zearalenone","D. aflatoxin B1"],"ans":0,"exp":"Ochratoxin（赭麴毒素）由 Aspergillus ochraceus 及 Penicillium verrucosum 等黴菌產生，是重要的腎毒性黴菌毒素（nephrotoxic mycotoxin），可引起腎小管壞死和腎功能衰竭，並具有免疫抑制及致癌性，豬和禽類最為敏感。","we":["","錯誤：Phallotoxin 為毒鵝膏蕈（Amanita phalloides）等毒菇所含的環狀多肽毒素，主要造成肝細胞損傷（肝毒性），不屬於黴菌毒素，也不是腎毒性毒素。","錯誤：Zearalenone 為鐮刀菌（Fusarium）產生的非固醇類雌激素樣黴菌毒素，主要引起雌激素樣毒性（外陰陰道炎、假發情、繁殖障礙），而非腎毒性。","錯誤：Aflatoxin B1 為 Aspergillus flavus/parasiticus 產生，主要具有強烈的肝毒性和致肝癌性（hepatocarcinogen），不是以腎毒性為主的黴菌毒素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_076","year":2017,"roc_year":106,"session":"2","examNo":76,"q":"Acetylcysteine常用於治療貓的何種藥物中毒？","opts":["A. neostigmine","B. acetaminophen","C. morphine","D. corticosteroids"],"ans":1,"exp":"貓對 acetaminophen（撲熱息痛）的代謝能力極差，因貓體內缺乏足夠的 UDP-葡萄糖醛酸轉移酶（UGT），無法有效結合代謝中間產物 NAPQI，導致 NAPQI 堆積，耗盡谷胱甘肽（glutathione）並造成高鐵血紅素血症（methemoglobinemia）及肝細胞壞死。Acetylcysteine 為谷胱甘肽前驅物，可補充 GSH 儲量，是解毒治療的首選。","we":["錯誤：Neostigmine 中毒（膽鹼酯酶抑制）的解毒藥為 atropine（拮抗膽鹼毒蕈鹼效應）及 pralidoxime（有機磷中毒時），不使用 acetylcysteine。","","錯誤：嗎啡中毒的解毒藥為 naloxone（opioid receptor antagonist），不使用 acetylcysteine。","錯誤：皮質類固醇（corticosteroids）不屬於急性中毒的情境，無對應特效解毒藥；acetylcysteine 不用於此類中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_077","year":2017,"roc_year":106,"session":"2","examNo":77,"q":"於銅和鉛中毒時，可用下列何者與其螯合？","opts":["A. tetracycline","B. pralidoxime","C. acetylcysteine","D. penicillamine"],"ans":3,"exp":"D-Penicillamine（青黴胺）為含巰基的胺基酸螯合劑，可與銅（Cu²⁺）、鉛（Pb²⁺）、汞（Hg²⁺）及砷（As）等重金屬形成穩定的水溶性螯合物，經腎臟排出，是犬銅相關性肝病（如 Bedlington Terrier 銅儲積症）及鉛中毒的重要治療藥物。","we":["錯誤：Tetracycline 雖能螯合 Ca²⁺、Mg²⁺、Fe²⁺ 等金屬離子（影響口服吸收），但不是治療銅或鉛中毒的解毒螯合劑，療效不足且不用於此適應症。","錯誤：Pralidoxime（PAM）為有機磷農藥中毒的解毒劑，可重新活化被磷酸化失活的膽鹼酯酶，不具有重金屬螯合作用。","錯誤：Acetylcysteine 為谷胱甘肽前驅物，主要用於 acetaminophen 中毒的解毒，雖含巰基（-SH），但不用作銅或鉛中毒的螯合治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_078","year":2017,"roc_year":106,"session":"2","examNo":78,"q":"下列那一種動物對α-naphthyl thiourea最不敏感？","opts":["A. 反芻獸","B. 馬","C. 貓","D. 禽類"],"ans":3,"exp":"α-Naphthyl thiourea（ANTU，萘硫脲）為滅鼠藥，主要引起肺水腫和胸水（pleural effusion）。不同動物對 ANTU 的敏感性差異很大：大鼠最敏感，豬、貓及犬敏感性中等，反芻獸和馬次之，而禽類（鳥類）對 ANTU 最不敏感（LD50 遠高於哺乳動物）。","we":["錯誤：反芻獸對 ANTU 具有一定敏感性，但比大鼠敏感性低，不是「最不敏感」的動物。","錯誤：馬對 ANTU 的敏感性屬中等程度，不是對 ANTU 最不敏感的動物。","錯誤：貓對 ANTU 具有中度敏感性，其 LD50 低於禽類，不是最不敏感的動物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_079","year":2017,"roc_year":106,"session":"2","examNo":79,"q":"下列何者為注射投予isoproterenol之主要臨床用途？","opts":["A. 治療心跳過快","B. 治療急性支氣管收縮","C. 控制心室性心律不整","D. 治療鼻黏膜充血"],"ans":1,"exp":"Isoproterenol（異丙腎上腺素）為非選擇性 β1 + β2 受體完全致效劑，靜脈注射的主要臨床用途為治療急性支氣管收縮（β2 效應使支氣管平滑肌鬆弛）及輕度至中度心傳導阻滯（β1 效應增加心率）。它會引起心跳加速（tachycardia）而非治療心跳過快；強力 β2 作用使血管擴張，降低血壓，不用於高血壓；鼻黏膜充血需要 α1 收縮劑，isoproterenol 無此作用。","we":["錯誤：Isoproterenol 具有強力 β1 作用，會引起心跳加速（tachycardia）而非減緩心跳，不用於治療心跳過快，此敘述錯誤。","","錯誤：Isoproterenol 的 β2 作用使全身血管擴張，造成舒張壓下降和平均動脈壓降低，不適用於控制心室性心律不整（需利多卡因或 amiodarone）。","錯誤：鼻黏膜充血（nasal congestion）需使用 α1 腎上腺素受體致效劑（如 xylometazoline、oxymetazoline）使血管收縮，isoproterenol 缺乏 α 活性，不用於此適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_080","year":2017,"roc_year":106,"session":"2","examNo":80,"q":"下列何者為臨床上經口投予prazosin後主要之不良反應？","opts":["A. 血糖過高","B. 低血壓","C. 嗜睡昏迷","D. 肌肉鬆弛無力"],"ans":1,"exp":"Prazosin 為選擇性 α1 腎上腺素受體阻斷劑，口服後阻斷周邊血管 α1 受體，導致靜脈和動脈擴張，使血壓明顯下降。尤其在首次服藥時（first-dose effect）或從臥位突然站立時，可出現顯著的姿勢性低血壓（orthostatic hypotension），為最常見且最重要的不良反應。","we":["錯誤：Prazosin 不影響胰島素分泌或胰島素受體，不會引起高血糖；引起高血糖的降壓藥如 thiazides 或 β-blockers 才有此副作用。","","錯誤：Prazosin 雖可輕微通過血腦屏障，但嗜睡昏迷不是其主要不良反應；中樞性鎮靜主要見於 α2 致效劑（如 clonidine）。","錯誤：肌肉鬆弛無力不是 prazosin 的主要不良反應；神經肌肉阻斷劑或中樞肌鬆藥才會引起此類效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_001","year":2018,"roc_year":107,"session":"1","examNo":1,"q":"在致效劑的對數劑量－反應（LDR）曲線圖中，曲線會因競爭性拮抗劑的存在，而向那一個方向移動？","opts":["A. 向左移動","B. 向右移動","C. 向上移動","D. 向下移動"],"ans":1,"exp":"競爭性拮抗劑與致效劑競爭同一受體結合位，使致效劑需要更高濃度才能達到相同效果。在對數劑量－反應（LDR）曲線圖中，曲線會向右移動（right shift），表示EC₅₀增大，但最大效應（Emax）不變。此現象可透過增加致效劑劑量來克服，是競爭性拮抗的典型特徵。","we":["錯誤：競爭性拮抗劑使曲線向右移動而非向左；向左移動代表致效劑需較低劑量即可達到相同效果，意味增效而非拮抗。","","錯誤：向上移動代表最大效應（Emax）增加，競爭性拮抗劑並不增強最大效應，而是使曲線平移。","錯誤：向下移動代表最大效應下降，這是不可逆（非競爭性）拮抗劑的特徵，而非競爭性拮抗劑的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_002","year":2018,"roc_year":107,"session":"1","examNo":2,"q":"當定時定量投予藥物，經過5個半衰期後，其血漿中藥物濃度預期可以達到穩定狀態濃度之百分比為：","opts":["A. 75%","B. 87.5%","C. 93.75%","D. 96.875%"],"ans":3,"exp":"每經過一個半衰期，藥物累積至穩定狀態的比例增加一半的剩餘差距：1個半衰期達50%、2個達75%、3個達87.5%、4個達93.75%、5個達96.875%。此規律源自一階動力學的指數累積公式：Css%＝（1－0.5ⁿ）×100%，n為半衰期數目。臨床上通常以5個半衰期視為達到穩定狀態。","we":["錯誤：75% 只是經過2個半衰期時的累積比例，尚未達到5個半衰期。","錯誤：87.5% 對應的是3個半衰期後的累積比例，不符合題目所問的5個半衰期。","錯誤：93.75% 對應的是4個半衰期後的累積比例，仍差一個半衰期才到題目所求。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_003","year":2018,"roc_year":107,"session":"1","examNo":3,"q":"血漿中親脂性藥物主要依賴何種運輸機制進入肝細胞？","opts":["A. 胞飲作用","B. 主動運輸","C. 被動擴散","D. 離子通道"],"ans":2,"exp":"親脂性藥物本身具有高脂溶性，可直接穿越肝細胞的脂質雙層膜，以被動擴散（passive diffusion）方式進入肝細胞。被動擴散不需消耗能量，也不需要載體蛋白，藥物依濃度梯度自由穿透。這也是大多數親脂性藥物在肝臟能快速被代謝的基礎。","we":["錯誤：胞飲作用（pinocytosis）主要用於大分子物質的胞內吞，一般小分子親脂性藥物不以此方式進入細胞。","錯誤：主動運輸需要消耗ATP並依賴特定載體蛋白，主要用於極性分子或特定藥物（如有機陰離子），而非一般親脂性藥物的主要進入機制。","","錯誤：離子通道主要讓離子（Na⁺、K⁺、Ca²⁺等）通過，不適合藥物分子穿越，且此機制需要特定的通道蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_004","year":2018,"roc_year":107,"session":"1","examNo":4,"q":"乙醯膽鹼（acetylcholine）降低心跳速率的作用與atropine增加心跳速率的作用屬於下列何種拮抗？","opts":["A. 受體拮抗（receptor antagonism）","B. 生理拮抗（physiologic antagonism）","C. 化學拮抗（chemical antagonism）","D. 酵素拮抗（enzymic antagonism）"],"ans":0,"exp":"乙醯膽鹼（ACh）作用於心臟M2毒蕈素受體（muscarinic receptor），降低心跳速率；atropine則競爭性地阻斷同一受體，阻止ACh結合，從而增加心跳速率。兩者作用於相同的受體系統，一為致效劑，一為拮抗劑，屬於受體拮抗（receptor antagonism）。","we":["","錯誤：生理拮抗是指兩種藥物作用於不同受體，產生相反的生理效果（如腎上腺素與組織胺），而ACh與atropine作用在同一受體，不屬此類。","錯誤：化學拮抗是指兩種物質在體外或體內發生化學反應，相互中和（如protamine中和肝素），與本題受體競爭機制不同。","錯誤：酵素拮抗是指藥物干擾某種酵素的活性，與本題描述的受體競爭性結合無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_005","year":2018,"roc_year":107,"session":"1","examNo":5,"q":"依照Henderson-Hasselbalch方程式，阿司匹靈（aspirin）經由尿液排除的速率，下列何種情形最快？","opts":["A. 尿液pH 3","B. 尿液pH 5","C. 尿液pH 7","D. 尿液pH 9"],"ans":3,"exp":"阿司匹靈（aspirin）為弱酸性藥物（pKa≈3.5）。根據Henderson-Hasselbalch方程式，當尿液pH升高（鹼性），藥物大量解離為離子型，無法再被腎小管重吸收，因而被「離子陷阱（ion trapping）」留在尿液中加速排出。pH 9的鹼性尿液使aspirin幾乎完全解離，腎清除率最高，排泄速率最快。","we":["錯誤：pH 3的酸性尿液使aspirin維持非離子型，有利於腎小管重吸收，排泄速率反而最慢。","錯誤：pH 5的尿液仍偏酸性，aspirin解離程度低，重吸收量多，排泄速率較慢。","錯誤：pH 7的尿液接近中性，aspirin有一定程度解離，排泄速率居中，但仍不及pH 9鹼性尿液的排泄效率。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_006","year":2018,"roc_year":107,"session":"1","examNo":6,"q":"乙醯膽鹼（acetylcholine）會被血液中何種酵素生物轉換（biotransformation）？","opts":["A. 酯酶（esterase）","B. 醯胺酶（amidase）","C. 單胺氧化酶（monoamine oxidase）","D. 去氫酶（dehydrogenase）"],"ans":0,"exp":"乙醯膽鹼（ACh）在血液中主要被血漿膽鹼酯酶（plasma cholinesterase，又稱假膽鹼酯酶 pseudocholinesterase）水解成膽鹼和醋酸，迅速失去活性。這是ACh作用時間極短的主要原因。神經突觸的ACh則主要被突觸乙醯膽鹼酯酶（AChE）分解。","we":["","錯誤：醯胺酶（amidase）水解醯胺鍵，ACh含有的是酯鍵（ester bond），由酯酶而非醯胺酶分解。","錯誤：單胺氧化酶（MAO）負責分解兒茶酚胺類（如多巴胺、正腎上腺素、血清素），不參與ACh的代謝。","錯誤：去氫酶（dehydrogenase）催化氧化還原反應，與ACh的水解代謝途徑無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_007","year":2018,"roc_year":107,"session":"1","examNo":7,"q":"下列何種性質的藥物具有穿透細胞膜進入腦脊髓液、關節液及乳汁","opts":["A. 脂溶性離子型","B. 脂溶性非離子型","C. 極性非離子型","D. 極性離子型"],"ans":1,"exp":"藥物穿越生物膜（如血腦屏障、關節囊膜、乳腺）需要同時具備脂溶性（lipophilic）和非離子型（non-ionized）兩個特性。脂溶性確保可溶入脂質雙層膜，非離子型確保電中性、不被膜排斥，兩者缺一不可。臨床上，脂溶性非離子型藥物在腦脊髓液、關節液及乳汁中分布廣泛，需注意其潛在毒性。","we":["錯誤：脂溶性離子型藥物雖有脂溶性，但帶電荷狀態（離子型）會妨礙穿越膜的能力，尤其血腦屏障對帶電分子的阻隔性強。","","錯誤：極性非離子型藥物雖不帶電，但水溶性高、脂溶性低，難以溶入脂質雙層膜，穿透性差。","錯誤：極性離子型藥物同時缺乏脂溶性且帶有電荷，最難穿越細胞膜，幾乎無法進入血腦屏障或乳汁。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_008","year":2018,"roc_year":107,"session":"1","examNo":8,"q":"關於ketamine的敘述，下列何者錯誤？","opts":["A. 在臺灣是第三級管制藥品","B. 是NMDA受體的強效非競爭性拮抗劑","C. 馬和犬單獨投予ketamine可引起癲癇的發作","D. xylazine-ketamine的組合可用於心肺功能不良的犬貓"],"ans":3,"exp":"此題問何者「錯誤」。Xylazine（α2-agonist）具有心臟抑制和低血壓作用，ketamine則刺激心血管系統增加心率和血壓；兩者組合在心肺功能不良的動物中，xylazine的心臟抑制效應可能導致嚴重危險，是禁忌組合。選項D的敘述「可用於心肺功能不良的犬貓」是錯誤的，因此為本題答案。","we":["此為正確描述：Ketamine在臺灣依法列為第三級管制藥品，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：Ketamine是NMDA（N-methyl-D-aspartate）受體的強效非競爭性拮抗劑，藉此產生解離性麻醉效果，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：馬和犬單獨使用ketamine可能因刺激中樞神經而引起肌肉僵直、震顫甚至癲癇，需搭配鎮定藥，此敘述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_009","year":2018,"roc_year":107,"session":"1","examNo":9,"q":"關於fentanyl的敘述，下列何者錯誤？","opts":["A. 經皮吸收可發揮藥效","B. 是一個強效κ致效劑","C. 可用於犬貓麻醉前給藥","D. 用於術後和慢性疼痛的控制"],"ans":1,"exp":"此題問何者「錯誤」。Fentanyl是強效的μ（mu）類鴉片受體致效劑，其鎮痛效力約為嗎啡的100倍，並非κ受體致效劑。選項B稱fentanyl為「強效κ致效劑」是錯誤的，故為本題答案。κ受體致效劑的代表藥物是butorphanol等。","we":["此為正確描述：Fentanyl具高度脂溶性，可製成貼片（transdermal patch）經皮吸收發揮持續鎮痛效果，此敘述正確，不符合題目問的「錯誤」描述。","","此為正確描述：Fentanyl可作為麻醉前給藥（preanesthetic medication），提供鎮靜和預先鎮痛，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：Fentanyl廣泛用於術後疼痛及慢性疼痛管理，可透過靜脈輸注或貼片給藥，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_010","year":2018,"roc_year":107,"session":"1","examNo":10,"q":"關於amitriptyline的敘述，下列何者錯誤？","opts":["A. 被使用為抗焦慮藥物","B. 不用於治療狗的攻擊、自殘行為","C. 可用於治療貓的心因性禿毛症","D. 很容易從腸胃吸收"],"ans":1,"exp":"此題問何者「錯誤」。Amitriptyline是三環抗憂鬱藥（TCA），在獸醫行為醫學中廣泛用於治療犬的攻擊行為（aggression）和自殘（self-mutilation）等行為問題。選項B稱「不用於治療狗的攻擊、自殘行為」是錯誤的，amitriptyline正是此適應症的常用藥物，故B為本題答案。","we":["此為正確描述：Amitriptyline具有抗焦慮（anxiolytic）效果，可用於治療犬貓的分離焦慮症等行為問題，此敘述正確，不符合題目問的「錯誤」描述。","","此為正確描述：Amitriptyline可用於治療貓的心因性禿毛症（psychogenic alopecia），透過減少強迫性理毛行為來改善症狀，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：Amitriptyline口服後可由腸胃道良好吸收，生物利用度尚可，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_011","year":2018,"roc_year":107,"session":"1","examNo":11,"q":"靜脈投予propofol時，常見動物暫時性停止呼吸，請問如何減少此現象的發生？","opts":["A. 將全量一次快速注射完畢","B. 先投予ketamine刺激呼吸","C. 使用肌肉注射減慢吸收速率","D. 緩慢靜脈注射"],"ans":3,"exp":"Propofol靜脈快速注射時，因血漿濃度急速升高，對延腦呼吸中樞的抑制強烈，容易引起暫時性呼吸暫停（apnea）。採用緩慢靜脈注射（slow IV injection）可使血漿濃度逐漸升高，讓呼吸中樞有時間適應，從而降低呼吸暫停的發生率。臨床上建議以滴定方式給藥，並隨時準備輔助通氣設備。","we":["錯誤：一次快速注射會使血漿濃度瞬間飆高，對呼吸中樞的抑制更強烈，反而增加呼吸暫停的風險，與正確做法相反。","錯誤：Ketamine雖能刺激心血管系統，但其對呼吸的影響不足以抵消propofol引起的呼吸抑制，且兩者合用有藥物交互作用的疑慮，並非減少呼吸暫停的首選方法。","錯誤：Propofol刺激性強，不適合肌肉注射（IM）；即使肌注能延緩吸收，也無法精確控制麻醉深度，且此給藥途徑並非臨床常規做法。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_012","year":2018,"roc_year":107,"session":"1","examNo":12,"q":"Morphine 之止痛作用主要透過活化何種受體造成？","opts":["A. 多巴胺D2受體","B. δ受體","C. µ受體","D. κ受體"],"ans":2,"exp":"Morphine的鎮痛作用主要透過活化μ（mu）類鴉片受體（μ-opioid receptor）來實現。μ受體活化後，透過Gi蛋白抑制腺苷酸環化酶（adenylyl cyclase），降低cAMP，並開啟K⁺通道和關閉Ca²⁺通道，最終抑制疼痛信號傳遞。μ受體也介導morphine的欣快感、呼吸抑制和便秘等副作用。","we":["錯誤：多巴胺D2受體主要與精神系統功能（運動控制、獎賞機制）有關，不是morphine鎮痛作用的主要受體。","錯誤：δ（delta）受體也參與鎮痛，但morphine對μ受體的選擇性和親和力遠高於δ受體，鎮痛作用以μ受體為主。","","錯誤：κ（kappa）受體也有鎮痛作用，但主要由butorphanol等κ致效劑活化；morphine主要是μ受體致效劑，對κ受體作用相對較弱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_013","year":2018,"roc_year":107,"session":"1","examNo":13,"q":"Doxapram於獸醫臨床上之用途主要為：","opts":["A. 鬆弛平滑肌","B. 解熱鎮痛","C. 興奮呼吸","D. 強心作用"],"ans":2,"exp":"Doxapram是一種呼吸興奮劑（respiratory stimulant），主要作用機制是刺激頸動脈體（carotid body）的化學感受器，反射性地增加呼吸頻率與深度。在獸醫臨床上，doxapram常用於新生動物（如難產後的仔犬貓）呼吸抑制的緊急處理，以及麻醉後呼吸恢復遲緩的輔助治療。","we":["錯誤：鬆弛平滑肌的藥物包括支氣管擴張劑（如沙丁胺醇）和解痙劑，doxapram無此作用，其目標是興奮呼吸而非鬆弛肌肉。","錯誤：解熱鎮痛藥物的代表為NSAIDs（如aspirin、meloxicam），doxapram不具有解熱或鎮痛的藥理作用。","","錯誤：強心作用屬於正性肌力藥物（如digitalis、dobutamine）的功能，doxapram的主要臨床用途是興奮呼吸，而非增強心肌收縮力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_014","year":2018,"roc_year":107,"session":"1","examNo":14,"q":"下列何種情況可能增加一些特定病畜麻醉時之最低肺泡濃度（minimum alveolar concentration，MAC）值？","opts":["A. 甲狀腺亢進","B. 低體溫","C. 併用安神藥","D. 麻醉期間延長"],"ans":0,"exp":"最低肺泡濃度（MAC）是評估吸入性麻醉劑效力的指標，代表使50%動物對傷害性刺激無反應所需的最低肺泡濃度。甲狀腺亢進時，基礎代謝率（BMR）升高，中樞神經系統興奮性增加，需要更高濃度的麻醉劑才能達到麻醉效果，因此MAC值升高。此外，高體溫（如甲亢引起的）也可獨立導致MAC增加。","we":["","錯誤：低體溫會降低中樞神經系統的代謝率和興奮性，使動物對麻醉劑更敏感，MAC值下降而非增加。","錯誤：併用安神藥（如phenothiazines、苯二氮平類）具有協同麻醉效果，可降低所需的MAC值，而非增加。","錯誤：麻醉期間延長後，動物對麻醉劑的需求通常不會增加；長時間麻醉反而可能因蓄積效應使麻醉需求降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_015","year":2018,"roc_year":107,"session":"1","examNo":15,"q":"Chlorpromazine 對中樞之安神作用主要為阻斷以下何種受體？","opts":["A. nicotine受體","B. dopamine受體","C. histamine受體","D. GABA受體"],"ans":1,"exp":"Chlorpromazine屬於吩噻嗪類（phenothiazine）安神藥，其中樞安神作用主要透過阻斷多巴胺D2受體（dopamine receptor）來實現。阻斷中腦邊緣系統和中腦皮質系統的D2受體，產生鎮靜、抗精神病效果。阻斷黑質紋狀體途徑的D2受體則可能引起錐體外系副作用（extrapyramidal effects）。","we":["錯誤：尼古丁受體（nicotinic receptor）是離子型ACh受體，位於神經肌肉接合處和自律神經節，阻斷此受體主要影響神經肌肉傳遞，與chlorpromazine的安神作用機制無關。","","錯誤：雖然chlorpromazine對組織胺H1受體也有阻斷作用（引起鎮靜），但其主要的安神作用機制是多巴胺D2受體阻斷，而非組織胺受體阻斷。","錯誤：GABA受體促進劑（如苯二氮平類、barbiturates）可產生鎮靜效果，但chlorpromazine的安神機制是多巴胺D2受體阻斷，不是GABA受體作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_016","year":2018,"roc_year":107,"session":"1","examNo":16,"q":"下列何者最適合居家經口投藥，以控制犬、貓癲癇之發作？","opts":["A. ketamine","B. diazepam","C. atropine","D. tubocurarine"],"ans":1,"exp":"Diazepam是苯二氮平類（benzodiazepine）藥物，可口服（錠劑）或直腸給藥（肛門塞劑），是最適合居家使用以控制癲癇急性發作的藥物。其作用機制是增強GABA-A受體功能，提高氯離子通道開放頻率，迅速抑制神經元異常放電。安全性高，飼主可在家自行給藥，是犬貓癲癇家庭急救的標準選擇。","we":["錯誤：Ketamine是解離性麻醉劑（NMDA受體拮抗劑），會刺激中樞神經系統，可能誘發或加重癲癇，不適合用於控制癲癇發作。","","錯誤：Atropine是抗膽鹼藥，用於解除迷走神經性心搏過緩、有機磷中毒解毒等，對癲癇發作無治療效果。","錯誤：Tubocurarine是非去極化型神經肌肉阻斷劑，只能鬆弛骨骼肌，無法抑制腦部的異常電活動，且需靜脈給藥並配合機械通氣，不適合居家使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_017","year":2018,"roc_year":107,"session":"1","examNo":17,"q":"臨床上使用過量之furosemide，常見之不良反應主要為何？","opts":["A. 高血鈣症","B. 代謝性酸中毒","C. 低血鉀症","D. 低血氯症"],"ans":2,"exp":"Furosemide是袢利尿劑（loop diuretic），作用於亨利氏環（loop of Henle）升支粗段，抑制Na⁺-K⁺-2Cl⁻共同轉運體（NKCC2），促進大量Na⁺、K⁺和Cl⁻的排泄。過量使用時，K⁺大量從腎臟流失，導致低血鉀症（hypokalemia），可引發肌肉無力、心律不整（尤其與digitalis合用時危險性增加）等嚴重後果。","we":["錯誤：高血鈣症（hypercalcemia）並非furosemide的常見副作用；相反地，furosemide會促進鈣的排泄，可用於治療高血鈣症的急性發作。","錯誤：Furosemide使大量Cl⁻排出，並因H⁺/K⁺交換使H⁺排出減少，通常引起代謝性鹼中毒（metabolic alkalosis）而非酸中毒。","","錯誤：低血氯症（hypochloremia）確實可能發生於furosemide過量使用，但題目問「常見之不良反應主要為何」，低血鉀症是更核心、臨床意義更大的首要副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_018","year":2018,"roc_year":107,"session":"1","examNo":18,"q":"下列何者最適合使用於控制竇性心搏過緩（sinus bradycardia）之心律不整？","opts":["A. atropine","B. digitalis","C. phenytoin","D. procaine"],"ans":0,"exp":"竇性心搏過緩（sinus bradycardia）是由迷走神經張力過高或病理性原因造成心跳過慢。Atropine是毒蕈素受體（muscarinic receptor）拮抗劑，可阻斷迷走神經對竇房結的抑制作用，解除副交感神經張力，使心跳加速，是治療竇性心搏過緩的首選藥物。","we":["","錯誤：Digitalis是正性肌力藥物，但同時具有負性變時作用（negative chronotropic effect），會減慢心跳，用於心搏過緩反而會使情況惡化。","錯誤：Phenytoin是第IB類抗心律不整藥，主要用於洋地黃引起的心室心律不整，對竇性心搏過緩無效且可能進一步抑制竇房結功能。","錯誤：Procaine（procainamide）是第IA類抗心律不整藥，具有膜穩定作用，會減慢心臟傳導，不適合用於心搏過緩，應用於心搏過速型心律不整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_019","year":2018,"roc_year":107,"session":"1","examNo":19,"q":"Digitalis增強心肌細胞收縮力的作用機制為：","opts":["A. 抑制Ca++從肌漿網釋出","B. 增強cAMP的產生","C. 降低細胞內Na+濃度","D. 抑制Na+\r , K+\r -ATPase"],"ans":3,"exp":"Digitalis（洋地黃）增強心肌收縮力（正性肌力作用）的機制是抑制心肌細胞膜上的Na⁺/K⁺-ATPase。此酶被抑制後，細胞內Na⁺濃度升高，進而抑制Na⁺/Ca²⁺交換體（NCX），使細胞內Ca²⁺濃度升高，Ca²⁺與肌鈣蛋白（troponin）結合增加，導致心肌收縮力增強。","we":["錯誤：Digitalis的作用恰好相反——它促進Ca²⁺在細胞內蓄積。抑制Ca²⁺從肌漿網釋出反而會減弱心肌收縮，與digitalis的正性肌力作用相反。","錯誤：增強cAMP是β1-agonist（如dobutamine）和磷酸二酯酶抑制劑（如pimobendan、amrinone）的作用機制，不是digitalis的作用方式。","錯誤：Digitalis抑制Na⁺/K⁺-ATPase後，細胞內Na⁺濃度升高（而非降低），繼而透過NCX使Ca²⁺升高，正是此「升高Na⁺→升高Ca²⁺」的連鎖反應才產生強心作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_020","year":2018,"roc_year":107,"session":"1","examNo":20,"q":"下列藥物，何者能減緩Purkinje fibers動作電位第0期的去極化，亦能降低第4期自發性去極化？","opts":["A. diltiazem","B. quinidine","C. esmolol","D. sotalol"],"ans":1,"exp":"Quinidine屬於第IA類抗心律不整藥，具有雙重作用：（1）阻斷Na⁺通道，減緩Purkinje纖維動作電位第0期（快速去極化）的速率；（2）阻斷K⁺通道，抑制第4期自發性去極化（diastolic depolarization），從而降低異位起搏點的自律性。同時具備這兩種效果，是quinidine的特徵性藥理作用。","we":["錯誤：Diltiazem屬於第IV類抗心律不整藥（Ca²⁺通道阻斷劑），主要抑制Ca²⁺依賴的慢動作電位，對竇房結和房室結影響較大，但不具備第IA類的Na⁺通道阻斷效果，無法顯著減緩Purkinje纖維第0期去極化速率。","","錯誤：Esmolol屬於第II類抗心律不整藥（β-blocker），透過阻斷β1受體減少交感神經對心臟的刺激，可降低自律性，但其主要機制是腎上腺素受體阻斷，而非直接Na⁺通道阻斷。","錯誤：Sotalol屬於第III類抗心律不整藥（K⁺通道阻斷劑），可延長動作電位時程，但它同時具有β-blocker特性；第III類藥物主要阻斷K⁺通道，對第0期Na⁺通道的直接阻斷作用較第IA類藥物弱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_021","year":2018,"roc_year":107,"session":"1","examNo":21,"q":"下列藥物均能增強心肌收縮力，何者屬於β1\r -agonist？","opts":["A. digoxin","B. dobutamine","C. pimobendan","D. amrinone"],"ans":1,"exp":"在各類正性肌力藥物中，dobutamine是選擇性β1-腎上腺素受體致效劑（β1-agonist），透過活化β1受體增加心肌細胞cAMP，進而活化蛋白激酶A（PKA），磷酸化鈣通道使Ca²⁺內流增加，增強心肌收縮力。Dobutamine常用於急性心衰竭的短期支持治療，尤其適合低心輸出量的患者。","we":["錯誤：Digoxin（洋地黃配醣體）的正性肌力機制是抑制Na⁺/K⁺-ATPase，而非β1-agonist，作用機制與β腎上腺素受體無關。","","錯誤：Pimobendan是鈣離子增敏劑（calcium sensitizer）及磷酸二酯酶3（PDE3）抑制劑，增強心肌對Ca²⁺的敏感性，並非透過β1受體發揮正性肌力作用。","錯誤：Amrinone是磷酸二酯酶（PDE）抑制劑，抑制cAMP的分解使cAMP濃度升高，其作用位點在磷酸二酯酶，而非β1-腎上腺素受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_022","year":2018,"roc_year":107,"session":"1","examNo":22,"q":"下列何種藥物是藉由擴張靜脈而改善鬱血性心衰竭的症狀？","opts":["A. digitoxin","B. enalapril","C. dobutamine","D. amrinone"],"ans":1,"exp":"Enalapril是血管收縮素轉化酶抑制劑（ACE inhibitor），抑制angiotensin I轉化為angiotensin II，減少aldosterone分泌，同時減少緩激肽（bradykinin）的降解。此作用使靜脈和動脈均擴張，降低前負荷（preload）和後負荷（afterload），改善鬱血性心衰竭的症狀，尤其以靜脈擴張減輕肺水腫效果顯著。","we":["錯誤：Digitoxin是強心配醣體（cardiac glycoside），其主要作用是正性肌力（增強心肌收縮力），並非以血管擴張改善心衰竭症狀。","","錯誤：Dobutamine是β1-agonist，正性肌力藥物，主要增加心肌收縮力；雖對血管有輕微β2擴張作用，但不是以靜脈擴張為主要機制的心衰竭治療藥。","錯誤：Amrinone是PDE抑制劑，具有正性肌力和血管擴張雙重作用，但其主要藥理機制是增加心肌cAMP，而非以靜脈擴張為主的ACE抑制機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_023","year":2018,"roc_year":107,"session":"1","examNo":23,"q":"關於thiazide利尿劑之副作用，下列何者錯誤？","opts":["A. 降低血糖","B. 升高血鈣","C. 降低血鉀","D. 增高尿酸"],"ans":0,"exp":"此題問何者「錯誤」。Thiazide利尿劑的已知副作用包括高血鈣（增加遠曲小管Ca²⁺重吸收）、低血鉀（促進K⁺排泄）和高尿酸血症（競爭有機酸分泌機制）。Thiazides會導致血糖升高（高血糖症）而非降低血糖，因為它們會抑制胰島β細胞的K⁺通道、抑制胰島素分泌。選項A的「降低血糖」是錯誤描述，故為答案。","we":["","此為正確描述：Thiazide利尿劑增加腎小管遠端對Ca²⁺的重吸收，可導致高血鈣症（hypercalcemia），此為已知副作用，不符合題目問的「錯誤」描述。","此為正確描述：Thiazide抑制Na⁺-Cl⁻共同轉運體，增加Na⁺排泄，伴隨K⁺流失（低血鉀症，hypokalemia），此為重要副作用，不符合題目問的「錯誤」描述。","此為正確描述：Thiazide與尿酸競爭相同的有機酸分泌途徑，抑制尿酸排泄，導致高尿酸血症（hyperuricemia），此為已知副作用，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_024","year":2018,"roc_year":107,"session":"1","examNo":24,"q":"下列何者屬於抗凝血劑（anticoagulant drug）？","opts":["A. dipyridamol","B. warfarin","C. clopidogrel","D. ticlopidine"],"ans":1,"exp":"抗凝血劑（anticoagulant）作用於凝血因子，干擾凝血級聯反應。Warfarin是口服抗凝血劑，透過抑制維生素K依賴性凝血因子（II、VII、IX、X）的γ-羧化作用，阻止這些因子的活化，從而抑制凝血。在獸醫上亦用作滅鼠藥（殺鼠靈），中毒時以維生素K₁解毒。","we":["錯誤：Dipyridamol是抗血小板藥（antiplatelet drug），透過抑制磷酸二酯酶和阻斷腺苷再攝取，增加血小板內cAMP，抑制血小板聚集，作用在血小板層面而非凝血因子。","","錯誤：Clopidogrel是ADP受體（P2Y12）拮抗劑，屬於抗血小板藥，阻斷ADP誘導的血小板活化，不屬於作用於凝血因子的抗凝血劑。","錯誤：Ticlopidine與clopidogrel同屬thienopyridine類抗血小板藥，也是P2Y12受體拮抗劑，作用機制與凝血因子無關，屬於抗血小板而非抗凝血劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_025","year":2018,"roc_year":107,"session":"1","examNo":25,"q":"下列何者用於治療腎源性尿崩症？","opts":["A. acetazolamide","B. chlorothiazide","C. furosemide","D. spironolactone"],"ans":1,"exp":"腎源性尿崩症（nephrogenic diabetes insipidus, NDI）的矛論性治療之一是使用thiazide利尿劑（如chlorothiazide）。Thiazide減少遠曲小管Na⁺重吸收，造成輕度低鈉血症，觸發醛固酮反應，促使近曲小管代償性增加水分和溶質重吸收，最終使到達集合管的液體量減少，反而降低尿量（paradoxical antidiuresis）。","we":["錯誤：Acetazolamide是碳酸酐酶抑制劑，主要用於青光眼、高山症等，不是腎源性尿崩症的標準治療藥物。","","錯誤：Furosemide是袢利尿劑，利尿效果強烈，會加重腎源性尿崩症患者的多尿症狀，是相反適應症，不應使用。","錯誤：Spironolactone是醛固酮拮抗劑（保鉀利尿劑），主要用於原發性高醛固酮症和心衰竭，對腎源性尿崩症無矛論性抗利尿效果，不是本症的治療選擇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_026","year":2018,"roc_year":107,"session":"1","examNo":26,"q":"下列何者可抑制鈣離子進入mast cell而抑制細胞釋放發炎物質？","opts":["A. guaifenesin","B. bromhexine","C. theobromine","D. cromolyn"],"ans":3,"exp":"Cromolyn（sodium cromoglycate，色甘酸鈉）是肥大細胞穩定劑，透過抑制Ca²⁺進入肥大細胞（mast cell），阻止肥大細胞脫顆粒（degranulation），從而抑制組織胺、白三烯素等發炎介質的釋放。Cromolyn屬於預防性抗過敏藥物，需在接觸過敏原前使用，不具有直接解痙效果。","we":["錯誤：Guaifenesin是祛痰劑（expectorant），作用於呼吸道黏液，降低痰液黏稠度，與抑制肥大細胞Ca²⁺進入的機制完全無關。","錯誤：Bromhexine也是祛痰劑，分解黏液多醣鏈降低痰液黏稠度，促進痰液排出，不涉及肥大細胞穩定作用。","錯誤：Theobromine是甲基黃嘌呤類（methylxanthine）藥物，主要透過抑制磷酸二酯酶使cAMP升高，發揮支氣管擴張作用，不具有抑制Ca²⁺進入肥大細胞的特異性機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_027","year":2018,"roc_year":107,"session":"1","examNo":27,"q":"下列何者為抗血清素性（antiserotonergic），常用於控制癌症化療藥物導致的嘔吐？","opts":["A. acepromazine","B. metoclopramide","C. ondansetron","D. phenothiazine"],"ans":2,"exp":"Ondansetron是選擇性5-HT₃（血清素）受體拮抗劑（antiserotonergic），透過阻斷消化道迷走神經末梢和延腦化學接受觸發帶（CTZ）的5-HT₃受體，有效抑制化療藥物引起的急性和延遲性嘔吐。由於化療藥物刺激腸嗜鉻細胞大量釋放血清素，ondansetron針對此機制，是癌症化療止吐的重要藥物。","we":["錯誤：Acepromazine是phenothiazine類安神藥，阻斷多巴胺D2受體產生止吐效果，雖有止吐作用但機制是多巴胺拮抗，而非5-HT₃拮抗（antiserotonergic）。","錯誤：Metoclopramide雖然也有止吐效果，但其主要止吐機制是D2受體拮抗加上5-HT₄受體促進劑，並非主要透過5-HT₃拮抗；且題目強調「抗血清素性（antiserotonergic）」，最符合者為ondansetron。","","錯誤：Phenothiazine（吩噻嗪類）藥物（如chlorpromazine、acepromazine）主要是多巴胺D2受體拮抗劑，不是選擇性5-HT₃拮抗劑，不符合「抗血清素性」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_028","year":2018,"roc_year":107,"session":"1","examNo":28,"q":"下列何者直接作用於平滑肌細胞，促使支氣管擴張？","opts":["A. triamcinolone","B. zileuton","C. salmeterol","D. diphenhydramine"],"ans":2,"exp":"Salmeterol是長效選擇性β₂-腎上腺素受體致效劑（long-acting β2-agonist, LABA），直接作用於支氣管平滑肌細胞的β₂受體，活化腺苷酸環化酶，升高cAMP，活化PKA，使肌球蛋白輕鏈激酶磷酸化而鬆弛平滑肌，達到持續支氣管擴張效果（作用時間可達12小時）。","we":["錯誤：Triamcinolone是皮質類固醇（corticosteroid），主要發揮抗炎作用，減少黏膜水腫和炎症因子；雖可改善氣道阻塞，但並非直接作用於平滑肌的支氣管擴張機制。","錯誤：Zileuton是5-脂氧合酶（5-LOX）抑制劑，阻斷白三烯素（leukotrienes）的合成，屬於抗炎機制的支氣管治療，並非直接作用於平滑肌收縮蛋白的擴張機制。","","錯誤：Diphenhydramine是第一代H1抗組織胺藥，可緩解過敏性支氣管痙攣，但其作用是阻斷組織胺受體，而非直接作用於支氣管平滑肌細胞產生持續擴張。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_029","year":2018,"roc_year":107,"session":"1","examNo":29,"q":"下列何種維生素可於動物體內轉化成calcitriol，促進小腸對鈣的吸收和利用？","opts":["A. A","B. B","C. C","D. D"],"ans":3,"exp":"維生素D在體內需經過兩步羥化才能轉為活性型：首先在肝臟羥化為25-hydroxyvitamin D₃（calcidiol），再於腎臟由1α-羥化酶轉化為1,25-dihydroxyvitamin D₃（calcitriol，骨化三醇）。Calcitriol是維生素D的活性型，透過核受體（VDR）調控小腸鈣結合蛋白（calbindin）的合成，促進小腸對Ca²⁺的吸收，以及腎臟對Ca²⁺的重吸收。","we":["錯誤：維生素A（retinol）參與視覺循環、細胞分化和免疫功能，不能在體內轉化為calcitriol，與鈣代謝調控的特定途徑無直接關聯。","錯誤：維生素B類（包含B1、B2、B6、B12等）為水溶性維生素，主要作為輔酶參與各種代謝反應，不參與鈣的代謝調控途徑。","錯誤：維生素C（ascorbic acid）是抗氧化劑，參與膠原蛋白合成，雖間接有助骨骼健康，但不能在體內轉化為calcitriol。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_030","year":2018,"roc_year":107,"session":"1","examNo":30,"q":"下列何者直接在潰瘍的部位形成薄膜層，免於胃酸傷害？","opts":["A. aluminum hydroxide","B. misoprostol","C. sucralfate","D. calcium carbonate"],"ans":2,"exp":"Sucralfate（硫糖鋁）是胃潰瘍保護藥，在酸性環境（pH<4）下聚合形成黏稠的膠狀保護膜，優先黏附在潰瘍部位的暴露蛋白質上，形成保護性薄膜層，隔絕胃酸、胃蛋白酶和膽汁對潰瘍表面的傷害。Sucralfate本身不制酸，而是提供物理性屏障保護潰瘍癒合。","we":["錯誤：Aluminum hydroxide是制酸劑（antacid），中和胃酸降低pH值，不是透過在潰瘍部位形成薄膜來保護，而是化學性中和胃酸。","錯誤：Misoprostol是前列腺素E₁（PGE₁）類似物，透過結合胃壁細胞EP3受體抑制胃酸分泌，並刺激胃黏液和碳酸氫根分泌，機制是生化性保護，而非直接在潰瘍表面形成薄膜。","","錯誤：Calcium carbonate是制酸劑，與aluminum hydroxide類似，化學中和胃酸，不具有在潰瘍部位形成保護薄膜的物理性機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_031","year":2018,"roc_year":107,"session":"1","examNo":31,"q":"下列何者最適合用於治療H2\r -受體拮抗劑無效的消化性潰瘍？","opts":["A. loperamide","B. metoclopramide","C. omeprazole","D. ondansetron"],"ans":2,"exp":"H₂受體拮抗劑（如cimetidine、ranitidine）可有效抑制組織胺刺激的胃酸分泌，但對乙醯膽鹼和胃泌素（gastrin）刺激的胃酸分泌效果有限。Omeprazole是質子幫浦抑制劑（PPI），直接抑制胃壁細胞的H⁺/K⁺-ATPase（質子幫浦），無論何種刺激路徑，均能最終阻斷胃酸分泌，是H₂拮抗劑無效時的首選替代藥物。","we":["錯誤：Loperamide是阿片類腸道μ受體致效劑，透過抑制腸蠕動和增加腸道水分吸收來止瀉，與消化性潰瘍治療無關。","錯誤：Metoclopramide是D2受體拮抗劑兼5-HT₄致效劑，具有止吐和促進胃腸蠕動功能，但不具有抑制胃酸分泌的作用，不適合治療消化性潰瘍。","","錯誤：Ondansetron是5-HT₃受體拮抗劑，主要用於化療引起的嘔吐，不具有抑制胃酸分泌的功能，無法治療消化性潰瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_032","year":2018,"roc_year":107,"session":"1","examNo":32,"q":"甲基黃嘌呤（methylxanthines）藥物作為支氣管擴張劑的作用機制為抑制下列何種酵素？","opts":["A. phosphodiesterase","B. acetylcholinesterase","C. alcohol dehydrogenase","D. aldehyde dehydrogenase"],"ans":0,"exp":"甲基黃嘌呤類藥物（如茶鹼theophylline、氨茶鹼aminophylline、可可鹼theobromine）透過抑制磷酸二酯酶（phosphodiesterase, PDE）來發揮支氣管擴張作用。PDE被抑制後，cAMP的降解受阻，細胞內cAMP濃度升高，活化PKA，促使支氣管平滑肌鬆弛。此外，這類藥物也可阻斷腺苷受體和促進兒茶酚胺釋放，進一步加強支氣管擴張效果。","we":["","錯誤：乙醯膽鹼酯酶（acetylcholinesterase）的抑制劑（如neostigmine）會增加ACh的作用，使支氣管收縮而非擴張，與甲基黃嘌呤的支氣管擴張機制相反。","錯誤：乙醇去氫酶（alcohol dehydrogenase）負責乙醇代謝，與呼吸道平滑肌鬆弛和支氣管擴張的機制完全無關。","錯誤：乙醛去氫酶（aldehyde dehydrogenase）參與乙醛的進一步代謝，同樣與支氣管擴張機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_033","year":2018,"roc_year":107,"session":"1","examNo":33,"q":"下列何者具有抑制胃酸分泌的作用？","opts":["A. acetylcholine","B. gastrin","C. diphenoxylate","D. prostaglandin E2"],"ans":3,"exp":"前列腺素E₂（prostaglandin E₂, PGE₂）透過結合胃壁細胞（parietal cell）上的EP₃受體，抑制腺苷酸環化酶，降低細胞內cAMP，從而抑制胃酸分泌。PGE₂同時還能刺激胃黏液和碳酸氫根分泌，保護胃黏膜。NSAIDs透過抑制COX減少前列腺素合成，破壞此保護機制，是NSAIDs引起胃潰瘍的重要原因。","we":["錯誤：乙醯膽鹼（ACh）作用於胃壁細胞的M3毒蕈素受體，活化磷脂酶C，升高胞內Ca²⁺，是促進胃酸分泌的物質，與題目「抑制胃酸分泌」相反。","錯誤：胃泌素（gastrin）由G細胞分泌，與胃壁細胞的CCK-B受體結合，強力促進胃酸分泌，也是促胃酸物質，不符題意。","錯誤：Diphenoxylate是阿片類腸道受體致效劑，用於止瀉，透過抑制腸蠕動發揮作用，與胃酸分泌調控無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_034","year":2018,"roc_year":107,"session":"1","examNo":34,"q":"下列何者具有止吐和促進胃腸蠕動的雙重作用？","opts":["A. cisapride","B. haloperidol","C. metoclopramide","D. ondansetron"],"ans":2,"exp":"Metoclopramide具有雙重藥理作用：（1）阻斷延腦化學接受觸發帶（CTZ）和胃腸道的多巴胺D2受體，產生止吐效果；（2）致效5-HT₄受體，增強胃腸蠕動，加速胃排空，是兼具止吐和胃腸促動（prokinetic）雙重功能的代表藥物。臨床上廣泛用於犬貓的嘔吐和胃腸蠕動不全。","we":["錯誤：Cisapride是5-HT₄受體致效劑，具有胃腸促動作用，但由於嚴重心臟毒性（延長QT間期），在許多國家已撤市，且其止吐效果不如metoclopramide顯著，不是雙重止吐+促動的典型藥物。","錯誤：Haloperidol是D2受體拮抗劑，具有強效止吐作用，但無胃腸促動（prokinetic）功能，不具備雙重作用。","","錯誤：Ondansetron是5-HT₃受體拮抗劑，止吐效果優良，但不具有促進胃腸蠕動的功能，因此不符合「雙重作用」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_035","year":2018,"roc_year":107,"session":"1","examNo":35,"q":"下列支氣管擴張藥中，何者是屬於抗膽鹼性藥物？","opts":["A. ipratropium","B. metaproterenol","C. isoetharine","D. theophylline"],"ans":0,"exp":"Ipratropium是選擇性毒蕈素受體（muscarinic receptor）拮抗劑（抗膽鹼藥），透過阻斷支氣管平滑肌和腺體上的M3受體，抑制副交感神經誘發的支氣管收縮和黏液分泌過多，達到支氣管擴張效果。Ipratropium以吸入劑型給藥，全身性副作用少，常用於慢性阻塞性肺病（COPD）的維持治療。","we":["","錯誤：Metaproterenol是β₂腎上腺素受體致效劑（β2-agonist），透過活化β₂受體增加cAMP擴張支氣管，屬於擬交感神經藥物，而非抗膽鹼性藥物。","錯誤：Isoetharine也是β₂-agonist，作用機制與metaproterenol相似，屬於擬交感神經支氣管擴張劑，不屬於抗膽鹼藥。","錯誤：Theophylline是甲基黃嘌呤類支氣管擴張劑，透過抑制磷酸二酯酶（PDE）升高cAMP，屬於PDE抑制劑，而非抗膽鹼性藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_036","year":2018,"roc_year":107,"session":"1","examNo":36,"q":"下列何者最符合胃腸促動劑domperidone的藥理性質？","opts":["A. dopamine受體致效劑","B. dopamine受體拮抗劑","C. serotonin受體致效劑","D. serotonin受體拮抗劑"],"ans":1,"exp":"Domperidone是外周性多巴胺D2受體拮抗劑（dopamine receptor antagonist），作用於胃腸道的D2受體，抑制多巴胺對胃腸蠕動的抑制作用，促進胃腸運動（prokinetic effect）；同時阻斷延腦CTZ的D2受體，具有止吐效果。與metoclopramide相比，domperidone幾乎不穿越血腦屏障，中樞錐體外系副作用極少。","we":["錯誤：若domperidone是多巴胺受體致效劑，則會模擬多巴胺的作用，抑制胃腸蠕動並可能誘發嘔吐，與其促動和止吐的臨床用途完全相反。","","錯誤：血清素受體致效劑（如cisapride、metoclopramide的5-HT₄作用）也具有促動效果，但domperidone的主要藥理機制是D2受體拮抗，而非血清素受體致效。","錯誤：血清素受體拮抗劑（如ondansetron）主要用於止吐，但domperidone的機制是多巴胺D2拮抗，不符合其藥理分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_037","year":2018,"roc_year":107,"session":"1","examNo":37,"q":"下列何者不屬於抗副交感神經藥物？","opts":["A. isopropamide","B. aminopentamide","C. propantheline","D. bismuth subsalicylate"],"ans":3,"exp":"此題問何者「不屬於」抗副交感神經（抗膽鹼）藥物。Bismuth subsalicylate（次水楊酸鉍）是胃腸黏膜保護劑和吸附劑，具有抗菌、收斂和保護胃黏膜的作用，不屬於抗副交感神經藥物。Isopropamide、aminopentamide和propantheline均是季銨類抗膽鹼藥，用於減少胃腸道蠕動和分泌，屬於抗副交感神經藥物。","we":["此為正確描述：Isopropamide是季銨類抗膽鹼（抗副交感神經）藥物，用於減少胃腸道過度蠕動和腺體分泌，確實屬於抗副交感神經藥物，不符合題目問的「不屬於」描述。","此為正確描述：Aminopentamide是抗副交感神經藥物，常用於控制犬貓的嘔吐和腹瀉，具有解痙和抑制分泌的抗膽鹼作用，不符合題目問的「不屬於」描述。","此為正確描述：Propantheline是季銨類抗膽鹼藥，用於胃腸道解痙和減少分泌，廣泛用於治療胃腸道痙攣，確屬抗副交感神經藥物，不符合題目問的「不屬於」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_038","year":2018,"roc_year":107,"session":"1","examNo":38,"q":"下列袪痰劑可直接分解痰黏液的是：","opts":["A. acetylcysteine","B. ammonium chloride","C. potassium iodide","D. guaiacol"],"ans":0,"exp":"Acetylcysteine（乙醯半胱胺酸）是直接作用型黏液溶解劑（mucolytic agent），分子中含有游離的巰基（-SH），直接斷裂痰液黏蛋白中連接多醣鏈的二硫鍵（disulfide bonds，-S-S-），使黏液的大分子結構瓦解，降低黏稠度，便於排出。Acetylcysteine也是acetaminophen中毒解毒劑（補充麩胱甘肽前體）。","we":["","錯誤：Ammonium chloride是間接祛痰劑（indirect expectorant），口服後刺激胃黏膜，反射性增加呼吸道黏液分泌，使痰液變稀，但不直接分解黏蛋白分子結構。","錯誤：Potassium iodide也是間接祛痰劑，透過刺激胃黏膜和腺體，增加呼吸道分泌稀化痰液，不具有直接斷裂二硫鍵的化學作用。","錯誤：Guaiacol（癒創木酚）屬於祛痰劑，一般認為可輕度刺激呼吸道分泌，促進纖毛運動，但不是直接分解黏蛋白的黏液溶解劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_039","year":2018,"roc_year":107,"session":"1","examNo":39,"q":"關於抗組織胺的治療用途，下列何者錯誤？","opts":["A. 可以口服、注射或局部投藥","B. 可改善過敏症狀","C. 可用於治療蕁麻疹及搔癢症","D. 抗暈車船（止吐）作用主要為阻斷腸道的組織胺受體"],"ans":3,"exp":"此題問何者「錯誤」。抗組織胺藥物（H1拮抗劑）的抗暈車和止吐效果是透過作用於中樞神經系統，阻斷前庭系統（vestibular apparatus）和嘔吐中樞（vomiting center）的H1受體，而非透過阻斷腸道（周邊）的組織胺受體。選項D的「主要為阻斷腸道的組織胺受體」是錯誤的描述，故為答案。","we":["此為正確描述：抗組織胺藥物可以口服、注射或局部（外用）多種途徑給藥，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：H1受體拮抗劑可阻斷組織胺引起的血管擴張、血管通透性增加等過敏反應，有效改善過敏症狀，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：抗組織胺藥物可阻斷皮膚H1受體，有效緩解蕁麻疹（urticaria）和搔癢症（pruritus），此敘述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_040","year":2018,"roc_year":107,"session":"1","examNo":40,"q":"關於動情素（estrogens）藥理作用的敘述，下列何者錯誤？","opts":["A. 刺激及維持成長動物生殖道之功能","B. 造成子宮頸的擴張","C. 刺激乳腺之生長","D. 不具有蛋白質同化功能"],"ans":3,"exp":"此題問何者「錯誤」。動情素（estrogens）實際上具有蛋白質同化功能（anabolic activity），可促進骨基質（osteoid）的蛋白質合成、維持骨密度，並有輕度的肌肉蛋白合成促進作用。選項D稱「不具有蛋白質同化功能」是錯誤的，故為答案。Estrogens的蛋白質同化作用雖弱於雄性素，但確實存在。","we":["此為正確描述：動情素刺激並維持成長動物生殖道（子宮、陰道、輸卵管）的正常功能和上皮細胞增殖，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：動情素促進子宮頸腺體分泌黏液、使子宮頸軟化和擴張，有利於精子通過和分娩，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：動情素刺激乳腺導管系統的生長和分支，是乳腺發育的重要激素之一，此敘述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_041","year":2018,"roc_year":107,"session":"1","examNo":41,"q":"下列何者為非選擇性cyclooxygenase抑制劑，此外亦可阻斷leukotriene B4之合成而增加其消炎效力？","opts":["A. ketoprofen","B. carprofen","C. deracoxib","D. aspirin"],"ans":0,"exp":"Ketoprofen 為非選擇性 COX 抑制劑（同時抑制 COX-1 及 COX-2），且獨特地可阻斷 5-lipoxygenase 路徑，從而抑制 leukotriene B4（LTB4）的合成，使消炎效力較其他 NSAID 更強。Carprofen 與 deracoxib 為選擇性 COX-2 抑制劑，對 LTB4 無明顯阻斷效果；aspirin 雖為非選擇性 COX 抑制劑，但不能阻斷 LTB4 合成。","we":["","錯誤：Carprofen 為選擇性 COX-2 抑制劑，不具備阻斷 leukotriene B4 合成的特性，消炎機制僅限於 COX 路徑。","錯誤：Deracoxib 為高度選擇性 COX-2 抑制劑，無法阻斷 5-lipoxygenase 路徑，故不能抑制 LTB4 合成。","錯誤：Aspirin 為非選擇性 COX 抑制劑，但其機制僅透過不可逆乙醯化 COX 來抑制前列腺素合成，並不能阻斷 leukotriene B4 的合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_042","year":2018,"roc_year":107,"session":"1","examNo":42,"q":"下列有關PGF2α臨床治療用途的敘述，何者錯誤？","opts":["A. 引起子宮收縮","B. 治療子宮感染","C. 誘導分娩","D. 上升血壓"],"ans":3,"exp":"PGF2α（前列腺素F2α）的臨床用途包括引起黃體溶解（luteolysis）、子宮收縮（誘導分娩）及治療子宮積膿等感染，並可引起支氣管收縮。PGF2α 的血管效應複雜，在全身效應中可因靜脈擴張導致低血壓，而非升高血壓，故「上升血壓」並非其臨床用途，選項 D 敘述錯誤。","we":["此為正確描述：PGF2α可引起子宮肌層平滑肌強力收縮，臨床上用於誘導分娩或流產，不符合題目問的「錯誤」描述。","此為正確描述：PGF2α可促進黃體溶解並引起子宮收縮，用於治療子宮積膿（pyometra）等子宮感染，不符合題目問的「錯誤」描述。","此為正確描述：PGF2α可促進子宮平滑肌收縮並引發黃體退化，臨床上廣泛用於誘導分娩或同期發情，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_043","year":2018,"roc_year":107,"session":"1","examNo":43,"q":"下列有關somatostatin於消化道功能的敘述，何者正確？","opts":["A. 促進胃酸分泌","B. 抑制胃排空","C. 增加胰島素的分泌","D. 促進胰臟bicarbonate分泌"],"ans":1,"exp":"Somatostatin（體抑素）對消化道具有廣泛的抑制作用，包括抑制胃酸分泌、抑制胃排空、抑制胰島素與升糖素分泌、以及降低消化道蠕動。其中「抑制胃排空」為正確敘述，選項 B 為正確答案。","we":["錯誤：Somatostatin 為抑制性賀爾蒙，會抑制（而非促進）胃酸分泌，與胃酸分泌促進劑作用相反。","","錯誤：Somatostatin 會抑制胰臟中 β 細胞分泌胰島素及 α 細胞分泌升糖素，而非增加胰島素分泌。","錯誤：Somatostatin 抑制胰臟外分泌（包括 bicarbonate 分泌），而非促進，其整體效應為抑制消化道功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_044","year":2018,"roc_year":107,"session":"1","examNo":44,"q":"下列抗組織胺中，何者較不會引起中樞鎮靜作用？","opts":["A. chlorpheniramine","B. cyproheptadine","C. diphenhydramine","D. cetirizine"],"ans":3,"exp":"Cetirizine 為第二代 H1 抗組織胺，因脂溶性低、難以穿透血腦屏障，故中樞鎮靜副作用最小。Chlorpheniramine、cyproheptadine 及 diphenhydramine 均為第一代抗組織胺，脂溶性較高，可進入中樞神經系統，引起明顯鎮靜作用。","we":["錯誤：Chlorpheniramine 為第一代 H1 抗組織胺，具有顯著中樞鎮靜作用，因其脂溶性足以穿越血腦屏障。","錯誤：Cyproheptadine 為第一代 H1 抗組織胺，同時具有抗血清素作用，中樞鎮靜效果明顯，不符合「較不會引起鎮靜」的條件。","錯誤：Diphenhydramine 為第一代 H1 抗組織胺，中樞鎮靜作用極強，常被用作鎮靜劑，是鎮靜副作用最明顯的抗組織胺之一。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_045","year":2018,"roc_year":107,"session":"1","examNo":45,"q":"下列有關組織胺作用的敘述，何者正確？","opts":["A. 可造成高血壓","B. 可使心跳速率增加","C. 可使呼吸道平滑肌放鬆","D. 可減少胃酸的分泌"],"ans":1,"exp":"組織胺可作用於竇房結的 H2 受體，增加心跳速率（正性變時效應）。組織胺對血管的作用以擴張為主（H1/H2 受體），可引起低血壓而非高血壓；在肺部作用於 H1 受體引起支氣管收縮（非放鬆）；並透過 H2 受體促進胃壁細胞增加胃酸分泌，而非減少。","we":["錯誤：組織胺主要透過 H1 及 H2 受體擴張血管，導致低血壓（hypotension），而非高血壓（hypertension）。","","錯誤：組織胺作用於肺部 H1 受體，引起支氣管平滑肌收縮（bronchospasm），而非放鬆，是過敏反應中氣管痙攣的主因。","錯誤：組織胺透過 H2 受體刺激胃壁細胞（parietal cell）分泌鹽酸，會增加（而非減少）胃酸分泌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_046","year":2018,"roc_year":107,"session":"1","examNo":46,"q":"Piroxicam屬於下列那一類藥物？","opts":["A. H1\r -抗組織胺","B. H2\r -抗組織胺","C. 非類固醇消炎藥","D. 利尿劑"],"ans":2,"exp":"Piroxicam 屬於 oxicam 類化合物，歸類為非類固醇消炎藥（NSAIDs），透過抑制 COX 酶減少前列腺素合成，具有消炎、鎮痛及退熱作用，也用於犬膀胱移行細胞癌的輔助治療。其與 H1 或 H2 抗組織胺及利尿劑的作用機制完全不同。","we":["錯誤：H1 抗組織胺（如 diphenhydramine）競爭性阻斷 H1 組織胺受體，與 piroxicam 的 COX 抑制機制無關。","錯誤：H2 抗組織胺（如 cimetidine）阻斷胃壁 H2 受體以抑制胃酸，與 piroxicam 的消炎機制完全不同。","","錯誤：利尿劑作用於腎臟，促進水鈉排泄，與 piroxicam 的前列腺素抑制機制無任何關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_047","year":2018,"roc_year":107,"session":"1","examNo":47,"q":"下列有關aminopenicillin在馬經口投藥與吸收的敘述中，何者正確？","opts":["A. 成馬吸收ampicillin的比率約90%","B. 成馬ampicillin的生體可用率較amoxicillin為高","C. 成馬bacampicillin的生體可用率較ampicillin為高","D. 成馬amoxicillin的生體可用率較仔馬為高"],"ans":2,"exp":"Bacampicillin 為 ampicillin 的前驅藥（prodrug），口服後在消化道水解成 ampicillin，其生體可用率（bioavailability）在成馬中顯著高於直接口服 ampicillin（約 3–30%），故選項 C 正確。成馬對 ampicillin 的口服吸收率僅約 3–30%，並非 90%；成馬口服 amoxicillin 的生體可用率高於 ampicillin；而成馬口服 amoxicillin 的吸收率實際低於仔馬。","we":["錯誤：成馬口服 ampicillin 的生體可用率很低，約僅 3–30%，遠非 90%，因為成馬消化道環境不利於 ampicillin 完整吸收。","錯誤：成馬口服 amoxicillin 的生體可用率高於 ampicillin，而非 ampicillin 高於 amoxicillin，因為 amoxicillin 在馬腸道中吸收較佳。","","錯誤：研究顯示仔馬（foals）對 amoxicillin 的口服吸收率高於成馬，而非成馬高於仔馬，因仔馬胃腸道環境較有利於吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_048","year":2018,"roc_year":107,"session":"1","examNo":48,"q":"造成cefovecin在犬與貓半衰期較長的主要原因為何？","opts":["A. 吸收快速與完全","B. 血漿蛋白結合率高","C. 可抑制肝臟代謝酶","D. 具有明顯的腸肝再循環"],"ans":1,"exp":"Cefovecin（Convenia）在犬與貓中半衰期長達 5.5–6.9 天，主要原因是其血漿蛋白結合率極高（超過 99%），與白蛋白緊密結合形成大分子複合物，大幅減慢腎臟清除速率，延長藥物在體內的滯留時間。快速吸收並非影響半衰期的主要原因；cefovecin 亦無明顯的肝臟代謝酶抑制或腸肝再循環現象。","we":["錯誤：吸收速度（快或慢）影響的是達峰時間（Tmax）而非半衰期（t½），高血漿蛋白結合才是 cefovecin 長半衰期的主因。","","錯誤：Cefovecin 不具備抑制肝臟代謝酶（如 CYP450）的特性，其長半衰期係來自高血漿蛋白結合而非代謝酶抑制。","錯誤：Cefovecin 無顯著的腸肝再循環（enterohepatic recycling），其長半衰期的主要藥動學機制是高血漿蛋白結合率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_049","year":2018,"roc_year":107,"session":"1","examNo":49,"q":"Triclosan在分類上屬於下列何類？","opts":["A. halogens","B. biguanides","C. aldehydes","D. phenols"],"ans":3,"exp":"Triclosan（三氯沙）屬於酚類（phenols）消毒劑，化學結構為 2,4,4'-三氯-2'-羥基二苯醚，透過破壞細菌細胞膜通透性及抑制脂肪酸合成酶（FabI）發揮殺菌作用，廣泛添加於肥皂與牙膏中。Halogens 代表碘/氯類；biguanides 代表氯己定（chlorhexidine）；aldehydes 代表甲醛/戊二醛。","we":["錯誤：Halogens（鹵素類）消毒劑包括碘（iodine）及氯（chlorine）製劑，如碘伏、次氯酸鹽，其化學結構與 triclosan 完全不同。","錯誤：Biguanides（雙胍類）消毒劑的代表為 chlorhexidine（氯己定），triclosan 為雙苯醚結構，不屬於此類。","錯誤：Aldehydes（醛類）消毒劑包括甲醛（formaldehyde）及戊二醛（glutaraldehyde），其作用機制為使蛋白質變性，與 triclosan 的酚類結構不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_050","year":2018,"roc_year":107,"session":"1","examNo":50,"q":"消毒劑抗菌作用之大小順序為：","opts":["A. 黴菌＞繁殖中細菌＞細菌孢子","B. 細菌孢子＞黴菌＞繁殖中細菌","C. 繁殖中細菌＞黴菌＞細菌孢子","D. 細菌孢子＞黴菌＝繁殖中細菌"],"ans":2,"exp":"消毒劑的抗菌效果由強至弱依序為：繁殖中細菌（actively dividing bacteria）> 黴菌（fungi）> 細菌孢子（bacterial spores）。細菌孢子具有厚實的芽孢外壁及多層保護結構，對大多數消毒劑的抵抗力最強；繁殖中細菌代謝旺盛、細胞壁薄，最容易被消毒劑殺滅。","we":["錯誤：此排序將黴菌排在繁殖中細菌之前是錯誤的；繁殖中細菌代謝活躍、缺乏孢子保護，應為最易被消毒劑殺滅的類型。","錯誤：細菌孢子因具有多層保護構造（包括芽孢皮質與皮質酸），對消毒劑抵抗力最強，不應排在最容易被殺滅的位置。","","錯誤：細菌孢子的抗藥性遠強於黴菌，且繁殖中細菌應最易被殺滅，故此選項的排序不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_051","year":2018,"roc_year":107,"session":"1","examNo":51,"q":"Calcium borogluconate可預防因快速靜脈注射下列何藥而引起的低血壓及衰竭？","opts":["A. procaine penicillin G","B. neomycin sulfate","C. chloramphenicol palmitate","D. oxytetracycline hydrochloride"],"ans":3,"exp":"Oxytetracycline hydrochloride（鹽酸土黴素）快速靜脈注射時，其螯合鈣離子（chelation）的特性會迅速降低血清鈣濃度，導致低鈣血症，引起心血管抑制、低血壓甚至衰竭。預先或同時緩慢靜脈注射 calcium borogluconate（硼酸葡萄糖酸鈣）可補充鈣離子，預防此不良反應。","we":["錯誤：Procaine penicillin G 快速靜脈注射的主要風險是 procaine 引起的神經毒性及心臟毒性，並非螯合鈣離子，不需 calcium borogluconate 預防。","錯誤：Neomycin sulfate 的主要毒性為腎毒性及耳毒性（aminoglycoside），不具螯合鈣離子特性，不需 calcium borogluconate 預防。","錯誤：Chloramphenicol palmitate 為緩釋型氯黴素製劑，其毒性為骨髓抑制（再生不良性貧血），不具螯合鈣離子特性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_052","year":2018,"roc_year":107,"session":"1","examNo":52,"q":"下列何者用於治療綠膿桿菌（Pseudomonas aeruginosa）感染的效果最佳？","opts":["A. erythromycin","B. oxacillin","C. ceftazidime","D. tetracycline"],"ans":2,"exp":"Ceftazidime 為第三代頭孢菌素，具有優異的抗綠膿桿菌（Pseudomonas aeruginosa）活性，其側鏈結構賦予其穿透 Pseudomonas 外膜的能力，為治療 P. aeruginosa 感染的首選抗生素之一。Erythromycin 為巨環類；oxacillin 為抗葡萄球菌青黴素；tetracycline 對 Pseudomonas 缺乏有效的抗菌活性。","we":["錯誤：Erythromycin 為巨環類抗生素，主要對 G(+) 菌及非典型病原有效，對 Pseudomonas aeruginosa 幾乎無抗菌活性。","錯誤：Oxacillin 為抗甲氧西林敏感葡萄球菌（MSSA）的青黴素，專一對 G(+) 菌有效，對 P. aeruginosa 無治療效果。","","錯誤：Tetracycline 對 Pseudomonas aeruginosa 無有效的抗菌活性，P. aeruginosa 對四環黴素具有天然抵抗性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_053","year":2018,"roc_year":107,"session":"1","examNo":53,"q":"下列何者用於治療犬隻之G（-）所引起的腦膜炎之效果最佳？","opts":["A. cephalexin","B. cephapirin","C. cefadroxil","D. cefotaxime"],"ans":3,"exp":"Cefotaxime 為第三代頭孢菌素，具有良好的血腦屏障穿透力，且對 G(-) 菌（包括常見腦膜炎病原如大腸桿菌、克雷伯菌）具有強效殺菌活性，是治療犬隻 G(-) 細菌性腦膜炎的首選藥物。Cephalexin、cephapirin 及 cefadroxil 均為第一代頭孢菌素，穿透血腦屏障能力差，不適用於細菌性腦膜炎。","we":["錯誤：Cephalexin 為第一代頭孢菌素，血腦屏障穿透力差，對 G(-) 菌的抗菌活性有限，不適合用於治療 G(-) 腦膜炎。","錯誤：Cephapirin 為第一代頭孢菌素，同樣血腦屏障穿透力不足，無法在腦脊髓液（CSF）中達到有效抗菌濃度。","錯誤：Cefadroxil 為第一代頭孢菌素，與 cephalexin 結構相近，穿透血腦屏障的能力差，不適用於腦膜炎治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_054","year":2018,"roc_year":107,"session":"1","examNo":54,"q":"Enrofloxacin含有下列何種元素？","opts":["A. Br","B. Cl","C. F","D. Fe"],"ans":2,"exp":"Enrofloxacin 為氟喹諾酮類（fluoroquinolone）抗菌劑，其分子結構中在喹諾酮環的 6 號位置含有氟（fluorine，F）原子，此氟原子顯著增強藥物對細菌 DNA 旋轉酶（DNA gyrase）及拓樸異構酶 IV 的親和力，並提升抗菌活性及口服生體可用率。","we":["錯誤：Br（溴）不存在於 enrofloxacin 的化學結構中，氟喹諾酮類的特徵元素為氟（F）而非溴。","錯誤：Cl（氯）雖存在於部分抗菌藥（如氯黴素），但 enrofloxacin 的特徵性結構元素為氟（F），賦予其「氟喹諾酮」名稱的根據。","","錯誤：Fe（鐵）為金屬元素，不存在於 enrofloxacin 的有機化學結構中，鐵元素屬於生物體必需微量礦物質，非抗菌藥的結構組成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_055","year":2018,"roc_year":107,"session":"1","examNo":55,"q":"Amoxicillin對犬隻下列何種G（+）感染症的治療效果最差？","opts":["A. 泌尿道","B. 呼吸道","C. 前列腺","D. 消化道"],"ans":2,"exp":"Amoxicillin 為氨基青黴素（aminopenicillin），雖對 G(+) 菌有效，但由於前列腺存在血液-前列腺屏障（blood-prostate barrier），且 amoxicillin 屬於弱酸性、水溶性較高的藥物，脂溶性不足，難以穿透此屏障在前列腺達到有效抑菌濃度，故前列腺感染是 amoxicillin 治療效果最差的部位。","we":["錯誤：泌尿道（包括膀胱）並無特殊藥物屏障，且藥物隨尿液在尿道中濃度較高，amoxicillin 對泌尿道 G(+) 感染有良好療效。","錯誤：呼吸道無特殊屏障限制藥物分佈，amoxicillin 可在肺部達到有效治療濃度，對呼吸道 G(+) 感染效果良好。","","錯誤：消化道（胃腸道）為藥物主要吸收部位，局部黏膜暴露量高，amoxicillin 對消化道 G(+) 感染有一定效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_056","year":2018,"roc_year":107,"session":"1","examNo":56,"q":"下列何者會抑制細菌細胞壁之合成？","opts":["A. ticarcillin","B. doxycycline","C. nystatin","D. florfenicol"],"ans":0,"exp":"Ticarcillin 為廣效型青黴素（extended-spectrum penicillin），與所有 β-lactam 類抗生素相同，其作用機制為與細菌細胞壁合成所需的青黴素結合蛋白（PBPs）共價結合，抑制肽聚糖（peptidoglycan）交聯，阻礙細胞壁合成。Doxycycline 與 florfenicol 抑制核糖體蛋白質合成；nystatin 則結合真菌細胞膜的麥角固醇破壞膜完整性。","we":["","錯誤：Doxycycline 為四環黴素類，其機制為結合細菌 30S 核糖體次單元，抑制 aminoacyl-tRNA 與核糖體結合，從而抑制蛋白質合成，非細胞壁合成抑制。","錯誤：Nystatin 為多烯類抗黴菌藥，其機制為與真菌細胞膜上的麥角固醇（ergosterol）結合，形成離子通道破壞膜通透性，非抑制細胞壁合成。","錯誤：Florfenicol 為氯黴素類衍生物，其機制為結合細菌 50S 核糖體次單元，抑制肽基轉移酶（peptidyl transferase）活性，阻礙蛋白質合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_057","year":2018,"roc_year":107,"session":"1","examNo":57,"q":"犬使用sulfadiazine可能會發生何種副作用？","opts":["A. 乾燥性角結膜炎","B. 視網膜退化症","C. 眼球震顫","D. 眼壓上升"],"ans":0,"exp":"磺胺劑（sulfonamides）在犬使用時，已知會抑制淚腺上皮細胞的葉酸代謝，進而減少淚液分泌，長期使用可引起乾燥性角結膜炎（keratoconjunctivitis sicca，KCS）。Sulfadiazine 是最常見引起犬 KCS 的磺胺藥物，停藥後有些動物可恢復淚液分泌，有些則造成永久性損傷。","we":["","錯誤：視網膜退化症（retinal degeneration）在犬中與某些藥物（如 enrofloxacin 高劑量於貓）有關，但非 sulfadiazine 的已知主要副作用。","錯誤：眼球震顫（nystagmus）為前庭神經或小腦病變所致，與 sulfadiazine 的磺胺類副作用機制無關。","錯誤：眼壓上升（intraocular pressure elevation）為青光眼（glaucoma）的特徵，與 sulfadiazine 用藥無直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_058","year":2018,"roc_year":107,"session":"1","examNo":58,"q":"下列何者屬於長效型磺胺劑？","opts":["A. sulfadiazine","B. sulfadimethoxine","C. sulfisoxazole","D. sulfachlorpyridazine"],"ans":1,"exp":"Sulfadimethoxine（磺胺二甲氧基嘧啶）因其分子具有兩個甲氧基取代基，大幅提升脂溶性及腎小管重吸收率，使其半衰期長達 11–14 小時（犬），屬於長效型磺胺劑，每日給藥一次即可維持有效血中濃度。Sulfadiazine、sulfisoxazole 及 sulfachlorpyridazine 均屬短效型磺胺劑，需每日多次給藥。","we":["錯誤：Sulfadiazine 為短效型磺胺劑，半衰期較短，需每日多次給藥，不符合長效型的定義。","","錯誤：Sulfisoxazole 為短效型磺胺劑，水溶性高，腎小管重吸收率低，排泄快，半衰期約 6 小時，需頻繁給藥。","錯誤：Sulfachlorpyridazine 為短效型磺胺劑，常用於家畜腸道感染，半衰期短，不屬於長效型磺胺劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_059","year":2018,"roc_year":107,"session":"1","examNo":59,"q":"擬於面積5,000平方公尺水深1公尺的養殖池中投予1 ppm之A藥，購買到含有效成分A藥50%之製劑，請問養\r 殖池中應加入多少此製劑？","opts":["A. 2 L","B. 5 L","C. 10 L","D. 15 L"],"ans":2,"exp":"計算步驟：水池體積 = 5,000 m² × 1 m = 5,000 m³ = 5,000,000 L；1 ppm = 1 mg/L，所需有效成分 = 5,000,000 mg = 5,000 g；製劑濃度 50%，即每公升含 500 g 有效成分；所需製劑體積 = 5,000 g ÷ 500 g/L = 10 L，故答案為 C。","we":["錯誤：2 L × 500 g/L = 1,000 g 有效成分，僅能在水池中達到 0.2 ppm，遠低於目標 1 ppm，計算結果不正確。","錯誤：5 L × 500 g/L = 2,500 g 有效成分，加入 5,000,000 L 中濃度為 0.5 ppm，仍未達到目標 1 ppm。","","錯誤：15 L × 500 g/L = 7,500 g 有效成分，加入 5,000,000 L 中濃度為 1.5 ppm，超過目標 1 ppm，劑量過高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_060","year":2018,"roc_year":107,"session":"1","examNo":60,"q":"下列何者於酸性溶液中能釋放出甲醛而產生抗菌效果？","opts":["A. carbadox","B. fusidic acid","C. methenamine","D. nalidixic acid"],"ans":2,"exp":"Methenamine（烏洛托品，hexamine）在酸性溶液（尤其是酸性尿液，pH < 5.5）中水解分解為甲醛（formaldehyde）及氨（ammonia），甲醛直接殺滅泌尿道中的細菌，發揮局部抗菌效果。因甲醛僅在酸性環境中才能充分釋放，臨床上需確保尿液 pH 足夠低方能發揮療效。","we":["錯誤：Carbadox 為喹噁啉類（quinoxaline）促生長抗菌劑，用於豬的飼料添加，其機制非甲醛釋放，而是抑制 DNA 合成。","錯誤：Fusidic acid（夫西地酸）為類固醇結構抗生素，透過抑制蛋白質合成中的伸長因子（EF-G）發揮作用，不會釋放甲醛。","","錯誤：Nalidixic acid 為第一代喹諾酮類抗菌劑，透過抑制細菌 DNA 旋轉酶（DNA gyrase）發揮殺菌作用，不具有甲醛釋放特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_061","year":2018,"roc_year":107,"session":"1","examNo":61,"q":"Fluoroquinolones對動物的不良反應主要為何？","opts":["A. 再生不良性貧血","B. 變性血紅素血症","C. 組織黃染現象","D. 影響新生動物軟骨的發育"],"ans":3,"exp":"Fluoroquinolones（氟喹諾酮類）對幼齡動物（尤其是幼犬、幼貓）的主要不良反應是影響關節軟骨的發育，引起軟骨病變（chondrotoxicity）。此藥會干擾軟骨中的 II 型膠原蛋白合成，導致關節腔積液、跛行及軟骨侵蝕，因此不建議用於骨骼尚未發育完全的幼齡動物。","we":["錯誤：再生不良性貧血（aplastic anemia）為氯黴素（chloramphenicol）的特有毒性，與氟喹諾酮類藥物無關。","錯誤：變性血紅素血症（methemoglobinemia）與某些氧化性藥物（如苯佐卡因過量）有關，非氟喹諾酮類的已知不良反應。","錯誤：組織黃染現象（tissue yellowing）為四環黴素類（tetracyclines）的特有副作用，因其與鈣離子螯合沉積於骨骼及牙齒造成，與氟喹諾酮類無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_062","year":2018,"roc_year":107,"session":"1","examNo":62,"q":"下列何者的作用機制為抑制病原微生物dihydrofolate reductase？","opts":["A. methenamine","B. aztreonam","C. sulfadimethoxine","D. trimethoprim"],"ans":3,"exp":"Trimethoprim 透過競爭性抑制細菌的二氫葉酸還原酶（dihydrofolate reductase，DHFR），阻止二氫葉酸（DHF）還原為四氫葉酸（THF），使細菌無法合成核苷酸，發揮殺菌作用。常與磺胺劑聯用（如 TMP-SMZ），協同阻斷葉酸代謝途徑的兩個步驟。","we":["錯誤：Methenamine 在酸性溶液中水解釋放甲醛發揮殺菌作用，其機制非抑制 dihydrofolate reductase。","錯誤：Aztreonam 為單環 β-lactam 類抗生素，透過抑制細菌細胞壁合成（與 PBP3 結合）發揮作用，不涉及葉酸代謝。","錯誤：Sulfadimethoxine 透過競爭性抑制二氫葉酸合成酶（dihydropteroate synthase，DHPS）阻斷葉酸合成的上游步驟，非抑制 dihydrofolate reductase。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_063","year":2018,"roc_year":107,"session":"1","examNo":63,"q":"下列何者的主要抗菌機制為抑制蛋白質合成？","opts":["A. vancomycin","B. novobiocin","C. aztreonam","D. kanamycin"],"ans":3,"exp":"Kanamycin 為胺基糖苷類（aminoglycoside）抗生素，主要機制為不可逆結合細菌 30S 核糖體次單元（16S rRNA），阻礙 mRNA 的正常讀碼，導致蛋白質合成錯誤或完全抑制，屬於蛋白質合成抑制劑。Vancomycin 抑制細胞壁合成；novobiocin 抑制 DNA 旋轉酶；aztreonam 為細胞壁合成抑制劑。","we":["錯誤：Vancomycin 為糖肽類抗生素，透過結合細胞壁前驅物 D-Ala-D-Ala 末端，阻止肽聚糖交聯，抑制細胞壁合成，非蛋白質合成抑制。","錯誤：Novobiocin 透過抑制細菌 DNA 旋轉酶（gyrase）中的 B 次單元（GyrB）阻斷 DNA 複製，非蛋白質合成抑制劑。","錯誤：Aztreonam 為單環 β-lactam 類抗生素，與細菌 PBP3 共價結合，抑制細胞壁肽聚糖合成，非蛋白質合成抑制劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_064","year":2018,"roc_year":107,"session":"1","examNo":64,"q":"Macrolides抗菌劑的主要抗菌機制為抑制下列何者的合成？","opts":["A. RNA","B. DNA","C. 蛋白質","D. 細胞壁"],"ans":2,"exp":"Macrolides（巨環類抗生素，如 erythromycin、azithromycin、tylosin）的主要抗菌機制為結合細菌 50S 核糖體次單元（23S rRNA 的特定位點），阻礙肽鏈延伸及核糖體轉位，從而抑制細菌蛋白質合成，為抑菌性（bacteriostatic）抗生素。","we":["錯誤：RNA 合成抑制為 rifamycin 類（如利福平）的作用機制，Macrolides 作用於核糖體蛋白質合成而非 RNA 合成。","錯誤：DNA 合成抑制為喹諾酮類（quinolones）及甲硝唑（metronidazole）等藥物的機制，非 macrolides 的作用靶點。","","錯誤：細胞壁合成抑制為 β-lactam 類（青黴素、頭孢菌素）及 vancomycin 的機制，macrolides 不作用於細胞壁合成步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_065","year":2018,"roc_year":107,"session":"1","examNo":65,"q":"下列有關抗腫瘤藥物之敘述，何者正確？","opts":["A. 藥物對位於細胞週期G0之腫瘤細胞的毒殺效果最佳","B. 在每個劑量下藥物能毒殺固定數目的腫瘤細胞","C. 藥物因為能迅速毒殺腫瘤細胞故很少產生抗藥性","D. 藥物投予劑量大多依體表面積計算"],"ans":3,"exp":"抗腫瘤藥物的劑量大多依體表面積（body surface area，BSA）計算，因為 BSA 能更準確地預測藥物的代謝速率及毒性閾值。G0 期細胞（靜止期）由於代謝不活躍，對細胞週期特異性藥物最具抵抗性；每次劑量殺滅的是固定比例（而非固定數目）的腫瘤細胞（對數殺滅假說，log-kill hypothesis）；且腫瘤抗藥性的問題在臨床上十分常見。","we":["錯誤：位於 G0 期（靜止期）的腫瘤細胞代謝不活躍，對大多數細胞週期特異性抗腫瘤藥物具有最強的抵抗性，並非毒殺效果最佳。","錯誤：根據「對數殺滅假說」（log-kill hypothesis），每一劑量抗腫瘤藥物殺滅的是固定比例的腫瘤細胞，而非固定數目；細胞越多，被殺滅的絕對數量越多。","錯誤：腫瘤細胞抗藥性在臨床上極為常見，是抗腫瘤治療失敗的主要原因之一，並非罕見現象。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_066","year":2018,"roc_year":107,"session":"1","examNo":66,"q":"口服吸收不佳但可靜脈注射，對深部器官的黴菌感染最有效的藥物是：","opts":["A. ketoconazol","B. terbinafine","C. amphotericin B","D. nystatin"],"ans":2,"exp":"Amphotericin B 為多烯類（polyene）抗黴菌藥，口服後幾乎完全不被腸道吸收（生體可用率 < 5%），但靜脈注射後可分佈至深部器官（腎臟、肺臟等），是治療系統性深部黴菌感染（如麴菌病、隱球菌腦膜炎、念珠菌敗血症）的重要選擇，療效優越但腎毒性大。","we":["錯誤：Ketoconazole 為口服 azole 類抗黴菌藥，口服吸收良好，不適合靜脈注射，與題目「口服吸收不佳但可靜脈注射」的條件不符。","錯誤：Terbinafine 為丙烯胺類（allylamine）抗黴菌藥，口服吸收佳，主要用於皮膚黴菌感染（皮癬菌），無靜脈注射製劑用於深部感染。","","錯誤：Nystatin 雖然口服吸收差，但沒有靜脈注射劑型（因全身毒性過大），主要用於局部（皮膚、黏膜）或口服腸道黴菌感染，不用於深部器官感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_067","year":2018,"roc_year":107,"session":"1","examNo":67,"q":"在動物之胃腸道內可被轉換為albendazole的藥物是：","opts":["A. fenbendazole","B. netobimin","C. febantel","D. mebendazole"],"ans":1,"exp":"Netobimin 為前驅苯咪唑類驅蟲劑（pro-benzimidazole），在動物腸道中水解轉化為 albendazole，後者再進一步代謝為 albendazole sulfoxide（活性代謝物）發揮驅蟲效果。Fenbendazole 氧化為 fenbendazole sulfoxide（即 oxfendazole）；febantel 轉化為 fenbendazole；mebendazole 則不在腸道中轉化為 albendazole。","we":["錯誤：Fenbendazole 在體內被氧化為 fenbendazole sulfoxide（即 oxfendazole），而非轉化為 albendazole，兩者為不同的苯咪唑類化合物。","","錯誤：Febantel 為 pro-benzimidazole，在腸道內轉化為 fenbendazole（而非 albendazole），再進一步氧化為 fenbendazole sulfoxide 發揮作用。","錯誤：Mebendazole 直接以原型藥物形式在腸道中作用，不在胃腸道內轉化為 albendazole，兩者為化學結構相近但獨立的苯咪唑類驅蟲劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_068","year":2018,"roc_year":107,"session":"1","examNo":68,"q":"下列何者可用於驅除豬的Sarcoptes spp.？","opts":["A. ivermectin","B. levamisole","C. pyrethrin","D. trimethoprim"],"ans":0,"exp":"Ivermectin 為大環內酯類（macrocyclic lactone）抗寄生蟲藥，可有效治療豬的 Sarcoptes scabiei（疥蟎）感染，透過增強寄生蟲 GABA 介導的 Cl⁻ 通道開放，使蟲體肌肉持續麻痺而死亡，對外寄生蟲及線蟲均有效。Levamisole 僅用於線蟲；pyrethrin 對外寄生蟲有效但對 Sarcoptes 效果較差；trimethoprim 為抗菌藥，對寄生蟲無效。","we":["","錯誤：Levamisole 為膽鹼能受體促效劑類驅蟲劑，使線蟲肌肉持續收縮麻痺，對線蟲有效，但無法治療 Sarcoptes（外寄生蟲/疥蟎）感染。","錯誤：Pyrethrin 為天然除蟲菊酯，雖屬外寄生蟲驅除劑，但穿透皮膚能力有限，對豬的深部組織疥蟎（Sarcoptes scabiei）治療效果不如 ivermectin。","錯誤：Trimethoprim 為葉酸代謝抑制劑，屬於抗菌藥，對寄生蟲（包括疥蟎）完全無驅除效果，不適用於此情境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_069","year":2018,"roc_year":107,"session":"1","examNo":69,"q":"用於治療家禽腸道黴菌感染，下列何者最佳？","opts":["A. nystatin","B. dichlorophene","C. praziquantel","D. clorsulon"],"ans":0,"exp":"Nystatin 為多烯類（polyene）抗黴菌藥，口服後幾乎不被腸道吸收，可直接在消化道黏膜局部發揮抗黴菌作用，是治療家禽消化道黴菌感染（如白色念珠菌 Candida albicans）的首選藥物。Dichlorophene、praziquantel 及 clorsulon 均為抗寄生蟲藥（驅絛蟲或吸蟲），對黴菌無效。","we":["","錯誤：Dichlorophene 為酚類驅絛蟲藥（cestocide），用於驅除絛蟲，對黴菌感染無效，不適用於消化道黴菌感染治療。","錯誤：Praziquantel 為吡喹酮類驅絛蟲及吸蟲藥，透過使蟲體皮層通透性改變及肌肉麻痺發揮作用，對黴菌無任何療效。","錯誤：Clorsulon 為苯磺醯胺類（benzenesulfonamide）殺吸蟲藥，用於治療肝片吸蟲（Fasciola hepatica）感染，對黴菌感染無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_070","year":2018,"roc_year":107,"session":"1","examNo":70,"q":"下列何者非用於驅除犬絛蟲？","opts":["A. moxidectin","B. fenbendazole","C. oxfendazole","D. praziquantel"],"ans":0,"exp":"Moxidectin 為大環內酯類（macrocyclic lactone）抗寄生蟲藥，對線蟲及外寄生蟲（包括蟎）有良好療效，但對絛蟲（cestodes/tapeworms）無效，因其機制為增強 GABA 介導的 Cl⁻ 通道，而絛蟲的神經肌肉系統對此不敏感。Fenbendazole 及 oxfendazole（苯咪唑類）以及 praziquantel 均具有驅絛蟲效果。","we":["","此為正確描述：Fenbendazole 屬苯咪唑類驅蟲劑，透過抑制微管蛋白聚合阻礙絛蟲細胞功能，臨床上可用於驅除犬絛蟲，不符合題目問的「非用於」描述。","此為正確描述：Oxfendazole 為 fenbendazole 的亞碸代謝物，同屬苯咪唑類，對犬的某些絛蟲（如帶絛蟲科）具有驅除活性，不符合題目問的「非用於」描述。","此為正確描述：Praziquantel 為治療犬絛蟲的首選藥物，透過破壞絛蟲皮層通透性使其麻痺並被宿主免疫系統消滅，不符合題目問的「非用於」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_071","year":2018,"roc_year":107,"session":"1","examNo":71,"q":"下列何者不用於驅除豬Oesophagostomum dentatum之感染？","opts":["A. levamisole","B. piperazine","C. diminazene diaceturate","D. pyrantel tartrate"],"ans":2,"exp":"Diminazene diaceturate（貝尼爾）為芳香脒類（aromatic diamidine）抗原蟲藥，主要用於治療巴貝斯蟲病（babesiosis）及錐蟲病（trypanosomiasis）等血液原蟲感染，對線蟲（nematodes，包括 Oesophagostomum dentatum）完全無效，不屬於抗蠕蟲藥（anthelmintic）。Levamisole、piperazine 及 pyrantel 均為有效的抗線蟲藥物。","we":["此為正確描述：Levamisole 為胆鹼能受體促效劑，使豬 Oesophagostomum dentatum 肌肉持續收縮麻痺而死亡，是有效的抗線蟲藥，不符合題目問的「不用於」描述。","此為正確描述：Piperazine 透過增強線蟲神經肌肉 GABA 受體活性，使蟲體鬆弛麻痺，對豬的 Oesophagostomum 有效，不符合題目問的「不用於」描述。","","此為正確描述：Pyrantel tartrate 為去極化型神經肌肉阻斷劑（nicotinic agonist），使線蟲持續痙攣麻痺，對豬的食道口線蟲（Oesophagostomum）有效，不符合題目問的「不用於」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_072","year":2018,"roc_year":107,"session":"1","examNo":72,"q":"下列何者可促進寄生蟲體內GABA釋放，而使其肌肉麻痺？","opts":["A. pyrantel","B. selamectin","C. levamisole","D. mebendazole"],"ans":1,"exp":"Selamectin 為阿維菌素類（avermectin）大環內酯抗寄生蟲藥，透過開放寄生蟲體內谷胺酸閘控氯離子通道（glutamate-gated Cl⁻ channels，GluCl），同時促進 GABA 於神經末梢的釋放，使氯離子大量內流，導致肌肉持續超極化麻痺。Pyrantel 及 levamisole 為膽鹼能受體促效劑（去極化麻痺）；mebendazole 為微管蛋白聚合抑制劑。","we":["錯誤：Pyrantel 為煙鹼型乙醯膽鹼受體（nAChR）促效劑，引起線蟲神經肌肉接頭去極化持續收縮麻痺，與 GABA 釋放促進機制完全不同。","","錯誤：Levamisole 同為膽鹼能受體促效劑，透過持續刺激線蟲的乙醯膽鹼受體使蟲體痙攣麻痺，並非促進 GABA 釋放。","錯誤：Mebendazole 屬苯咪唑類，透過不可逆結合線蟲 β-tubulin，抑制微管蛋白聚合，破壞蟲體細胞骨架及養分攝取，非 GABA 相關機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_073","year":2018,"roc_year":107,"session":"1","examNo":73,"q":"下列何者抑制黴菌之麥角固醇的合成？","opts":["A. terbinafine","B. amantadine","C. acyclovir","D. zidovudine"],"ans":0,"exp":"Terbinafine 為丙烯胺類（allylamine）抗黴菌藥，透過抑制黴菌的鯊烯環氧化酶（squalene epoxidase），阻礙麥角固醇（ergosterol）的生合成前驅物角鯊烯環氧化物（squalene epoxide）的形成，導致麥角固醇缺乏及角鯊烯堆積，最終破壞真菌細胞膜結構。Amantadine、acyclovir 及 zidovudine 均為抗病毒藥物。","we":["","錯誤：Amantadine 為抗病毒藥（抗流感病毒 A），透過阻斷 M2 離子通道抑制病毒脫殼，與麥角固醇合成完全無關；在獸醫臨床也用作 NMDA 受體拮抗劑止痛。","錯誤：Acyclovir 為核苷類似物抗病毒藥（抗疱疹病毒），需磷酸化後抑制病毒 DNA 聚合酶，與麥角固醇合成無任何關聯。","錯誤：Zidovudine（AZT）為核苷逆轉錄酶抑制劑（NRTI），用於抗反轉錄病毒（HIV）治療，不涉及麥角固醇合成抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_074","year":2018,"roc_year":107,"session":"1","examNo":74,"q":"下列關於寄生蟲藥物作用機制的敘述，何者最適當？","opts":["A. Rotenone為昆蟲生長激素拮抗劑","B. Carbaryl會結合在蟲體tubulin上","C. Lufenuron為幾丁質合成抑制劑","D. Fipronil為乙醯膽鹼酯酶抑制劑"],"ans":2,"exp":"Lufenuron 為昆蟲生長調節劑（insect growth regulator），透過抑制幾丁質合成酶，阻礙幾丁質（chitin）的合成，使跳蚤幼蟲無法正常蛻皮，是正確的機制配對。Rotenone 為粒線體電子傳遞鏈複合體 I（Complex I）抑制劑，非昆蟲生長激素拮抗劑；carbaryl 為胺基甲酸鹽類乙醯膽鹼酯酶抑制劑；fipronil 為 GABA 閘控 Cl⁻ 通道阻斷劑，非乙醯膽鹼酯酶抑制劑。","we":["錯誤：Rotenone 的機制為抑制粒線體電子傳遞鏈的 NADH 去氫酶（複合體 I），干擾 ATP 合成導致蟲體能量耗竭，並非昆蟲生長激素（juvenile hormone）拮抗劑。","錯誤：Carbaryl（西維因）為胺基甲酸鹽類（carbamate）殺蟲劑，透過可逆性抑制乙醯膽鹼酯酶（AChE）使蟲體 ACh 堆積導致神經麻痺，並非結合 tubulin 的驅蟲藥。","","錯誤：Fipronil 為苯基吡唑類殺蟲劑，透過阻斷昆蟲 GABA 閘控 Cl⁻ 通道（而非 AChE），使昆蟲中樞神經過度興奮致死；其作用機制與有機磷或胺基甲酸鹽類的 AChE 抑制完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_075","year":2018,"roc_year":107,"session":"1","examNo":75,"q":"下列藥物中毒與解毒劑配對，何者錯誤？","opts":["A. iron salts－deferoxamine","B. acetaminophen－acetylcysteine","C. fluoroacetate－phytonadione","D. carbamate－atropine"],"ans":2,"exp":"Fluoroacetate（氟乙酸鈉，1080）為有機氟化物鼠藥，進入細胞後轉變為 fluorocitrate，抑制三羧酸循環中的順烏頭酸酶（aconitase），阻斷 ATP 合成，導致細胞能量耗竭；其解毒劑為乙醯胺（acetamide）或乙醇，而非 phytonadione（維生素 K1）。Phytonadione 是抗凝血型鼠藥（如滅鼠靈/warfarin）的解毒劑，故選項 C（fluoroacetate－phytonadione）配對錯誤。","we":["此為正確描述：Iron salts 中毒（鐵中毒）的解毒劑為 deferoxamine（去鐵胺），其能螯合遊離鐵離子促進排泄，配對正確，不符合題目問的「錯誤」描述。","此為正確描述：Acetaminophen（乙醯胺酚）中毒產生毒性代謝物 NAPQI，解毒劑為 acetylcysteine（乙醯半胱胺酸），可補充還原型谷胱甘肽，配對正確，不符合題目問的「錯誤」描述。","","此為正確描述：Carbamate（胺基甲酸
