鹽）殺蟲劑中毒引起膽鹼能危象，解毒劑為 atropine（阻斷毒蕈鹼受體），配對正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_076","year":2018,"roc_year":107,"session":"1","examNo":76,"q":"下列何者為xylazine使用過量的拮抗劑？","opts":["A. yohimbine","B. cimetidine","C. naloxone","D. propranolol"],"ans":0,"exp":"Xylazine 為 α2 腎上腺素受體致效劑（α2 adrenergic agonist），用於鎮靜及輕度麻醉。Yohimbine 為選擇性 α2 腎上腺素受體拮抗劑，可競爭性阻斷 xylazine 的受體結合，迅速逆轉其鎮靜、肌肉鬆弛及心血管抑制等效應，是 xylazine 過量的標準解毒劑。Atipamezole 為另一更選擇性的 α2 拮抗劑，也可使用。","we":["","錯誤：Cimetidine 為 H2 組織胺受體拮抗劑，用於抑制胃酸，對 α2 腎上腺素受體無拮抗作用，無法逆轉 xylazine 的鎮靜效果。","錯誤：Naloxone 為阿片類（opioid）μ 受體拮抗劑，用於逆轉嗎啡等阿片藥物的呼吸抑制，對 xylazine 的 α2 腎上腺素受體作用無效。","錯誤：Propranolol 為非選擇性 β 腎上腺素受體阻斷劑，不具有 α2 受體拮抗作用，無法逆轉 xylazine 的鎮靜效果，且可能加重心血管抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_077","year":2018,"roc_year":107,"session":"1","examNo":77,"q":"下列何者不會增加有機磷類的毒性？","opts":["A. phenothiazine","B. succinylcholine","C. levamisole","D. pralidoxime"],"ans":3,"exp":"Pralidoxime（2-PAM，碘解磷定）為有機磷中毒的解毒劑，透過重新活化（reactivation）被有機磷磷酸化的乙醯膽鹼酯酶（AChE），恢復 ACh 分解功能，是減少有機磷毒性的藥物，不會增加毒性。Phenothiazine 的抗多巴胺效果使有機磷毒性加重；succinylcholine 及 levamisole 也因抑制 AChE 或增加膽鹼能活性而增強有機磷毒性。","we":["錯誤：Phenothiazine 可降低肝臟微粒體酶（cytochrome P450）活性，延緩有機磷代謝，且其抗多巴胺效應可能加重有機磷的神經毒性，故可增加有機磷毒性。","錯誤：Succinylcholine 本身為膽鹼酯酶受質，與有機磷同用時可競爭 AChE，且在 AChE 已受抑制的情況下其去極化作用持續加強，可增加整體膽鹼能毒性。","錯誤：Levamisole 具有膽鹼能（cholinergic）活性，可模擬乙醯膽鹼效應，在有機磷中毒時 ACh 已大量堆積的情況下，levamisole 可進一步增強膽鹼能毒性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_078","year":2018,"roc_year":107,"session":"1","examNo":78,"q":"下列造成犬隻中毒的家用物品中，何者在治療時會使用碳酸氫鈉（sodium bicarbonate）？","opts":["A. benzalkonium chloride","B. ethylene glycol","C. 有機磷殺蟲劑","D. 漂白水"],"ans":1,"exp":"乙二醇（ethylene glycol）在犬隻中毒後，經肝臟代謝產生乙醇酸及草酸，草酸與鈣結合沉積於腎小管引起腎衰竭，同時代謝性酸中毒（metabolic acidosis）嚴重。治療包括給予碳酸氫鈉（sodium bicarbonate）糾正酸中毒，及乙醇（ethanol）或 4-methylpyrazole（4-MP/fomepizole）阻斷乙二醇代謝。","we":["錯誤：Benzalkonium chloride（氯化苄烷銨）為陽離子型四級銨消毒劑，誤食後引起消化道腐蝕性損傷，治療以催吐（若早期）或給予牛奶/水稀釋為主，不使用碳酸氫鈉。","","錯誤：有機磷殺蟲劑中毒引起膽鹼能危象（流涎、縮瞳、支氣管痙攣等），治療以 atropine 及 pralidoxime 為主，碳酸氫鈉並非標準治療用藥。","錯誤：漂白水（次氯酸鈉溶液）誤食後引起消化道刺激，治療主要為稀釋（給予水或牛奶）及支持療法，不使用碳酸氫鈉，因可能產生二氧化氯氣體加重傷害。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_079","year":2018,"roc_year":107,"session":"1","examNo":79,"q":"下列何者為犬、貓皮下注射低劑量atropine之主要臨床目的？","opts":["A. 抑制心律不整","B. 抑制消化道之分泌","C. 解熱鎮痛消炎","D. 抑制唾液之分泌"],"ans":3,"exp":"Atropine 為抗膽鹼藥（muscarinic antagonist），低劑量皮下注射時選擇性地抑制分泌腺（如唾液腺、淚腺、支氣管腺），可顯著減少唾液分泌，是麻醉前給藥（premedication）的常見目的，以維持術野乾淨及防止分泌物阻塞氣道。高劑量方可有效治療心跳過慢（bradycardia）；atropine 不具解熱鎮痛消炎作用。","we":["錯誤：低劑量 atropine 對心跳的影響有限（可能因阻斷心臟迷走神經而短暫減慢，再加速），有效治療心律不整（如竇性心跳過慢）需要較高劑量，非低劑量給藥的主要目的。","錯誤：Atropine 雖可阻斷消化道平滑肌上的 M 受體減少腸道蠕動，但低劑量皮下注射的主要目的是抑制唾液腺（外分泌腺）分泌，而非針對消化道分泌，且其抑制消化道作用不如抑制唾液腺顯著。","錯誤：解熱鎮痛消炎為 NSAID（如 aspirin、meloxicam）的作用，atropine 為抗膽鹼藥，完全不具備解熱鎮痛或消炎機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1071_080","year":2018,"roc_year":107,"session":"1","examNo":80,"q":"下列何者最適合使用於拮抗tubocurarine過量所造成之神經肌肉阻斷作用？","opts":["A. atropine","B. yohimbine","C. neostigmine","D. scopolamine"],"ans":2,"exp":"Tubocurarine（箭毒素）為非去極化型神經肌肉阻斷劑（non-depolarizing NMJ blocker），競爭性阻斷菸鹼型乙醯膽鹼受體（nAChR）。Neostigmine 為可逆性抗膽鹼酯酶藥（acetylcholinesterase inhibitor），可抑制 AChE 使突觸 ACh 濃度增加，競爭性取代 tubocurarine 與受體的結合，逆轉神經肌肉阻斷。臨床上給予 neostigmine 時需同時給 atropine 以阻斷其毒蕈鹼副作用（如心跳過慢、流涎），但 atropine 本身不是逆轉 tubocurarine 的藥物。","we":["錯誤：Atropine 為毒蕈鹼型（muscarinic）受體拮抗劑，用於對抗 neostigmine 引起的膽鹼能副作用，本身無法逆轉 tubocurarine 的神經肌肉阻斷作用。","錯誤：Yohimbine 為 α2 腎上腺素受體拮抗劑，用於逆轉 xylazine 鎮靜，與 tubocurarine 的神經肌肉阻斷機制（菸鹼型受體）完全無關。","","錯誤：Scopolamine（東莨菪鹼）為抗膽鹼藥（毒蕈鹼受體拮抗劑），具有鎮靜及抑制分泌作用，對 tubocurarine 的神經肌肉阻斷無任何拮抗作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_001","year":2018,"roc_year":107,"session":"2","examNo":1,"q":"短效巴比妥（pentobarbital）經靜脈注射於犬隻及山羊後，下列敘述何者正確？","opts":["A. 犬隻的血中濃度較山羊的血中濃度下降為快","B. 正向反射（righting reflex）在犬隻較早恢復","C. 兩者部分相同的反射皆在具有相似的血中濃度時恢復","D. 動物種別並不會影響靜脈注射短效巴比妥的半衰期（t2）"],"ans":2,"exp":"IV pentobarbital後，兩個物種的血中濃度-效應相關性相同：相同反射在相同血中濃度時恢復，不受動物種別影響，因為受體藥理學（藥效學）相似。然而兩物種的消除半衰期不同（犬較短），代表血中濃度下降速率不同，但恢復反射的「閾值濃度」則相同。","we":["錯誤：靜脈注射pentobarbital後，犬的血中濃度下降（消除）速率不一定較山羊快；種別間消除半衰期不同，但本題關鍵是相同反射在相同血中濃度時恢復。","錯誤：正向反射的恢復取決於血中藥物濃度，而非動物種別；相同濃度下兩者恢復相似。","","錯誤：不同動物種別對pentobarbital的代謝速率（CYP450活性）和蛋白結合率不同，半衰期確實受種別影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_002","year":2018,"roc_year":107,"session":"2","examNo":2,"q":"下列何藥品具有四級銨的結構？","opts":["A. phenytoin","B. probenecid","C. propantheline","D. propofol"],"ans":2,"exp":"四級銨（quaternary ammonium）結構帶有永久正電荷，常見於抗膽鹼藥物。Propantheline為抗膽鹼性解痙劑，含有四級銨結構。其他選項均不含四級銨基團：phenytoin（三級氮的hydantoin）、probenecid（苯甲酸類）、propofol（烷基酚類）。","we":["錯誤：Phenytoin為乙內醯脲類（hydantoin）抗癲癇藥，含三級氮，非四級銨結構。","錯誤：Probenecid為苯甲酸類尿酸排出促進劑，不含四級銨基團。","","錯誤：Propofol為烷基酚類靜脈麻醉劑，結構為2,6-二異丙基苯酚，不含四級銨。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_003","year":2018,"roc_year":107,"session":"2","examNo":3,"q":"有關藥品之敘述，下列何者錯誤？","opts":["A. 大部分的藥品為弱酸性或弱鹼性","B. 大部分藥品在體內為離子態和非離子態共存","C. 四級銨類藥品在口服時不易被吸收","D. 發生ion-trapping時，藥物在非離子化部位的相對濃度較高"],"ans":3,"exp":"Ion trapping（離子捕捉）原理：藥物在某一pH區間因大量離子化而被困留於該區間，「離子化程度較高的部位」才是藥物相對濃度較高的地方（離子態無法穿透膜而堆積），而非非離子化部位。故選項D描述相反，為錯誤敘述。","we":["此為正確描述：大多數藥品屬弱酸或弱鹼，依pH值部分解離，不符合「錯誤」描述。","此為正確描述：弱酸/弱鹼藥物在生理pH下同時存在離子態和非離子態，不符合「錯誤」描述。","此為正確描述：四級銨類藥品帶永久正電荷，口服後難以跨越腸道上皮，生體可用率低，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_004","year":2018,"roc_year":107,"session":"2","examNo":4,"q":"下列何者不會形成不溶性的複合物？","opts":["A. alkaloids與tannic acid","B. lincomycin與spectinomycin","C. tetracycline與Mg++","D. dimercaprol與Hg++"],"ans":1,"exp":"Lincomycin與spectinomycin均為抗生素，兩者在臨床上有時合用（對豬隻呼吸道感染有協同效果），但不形成不溶性複合物。其他選項均有形成不溶性複合物的機制：alkaloids與tannic acid沉澱、tetracycline與Mg²⁺螯合、dimercaprol與Hg²⁺螯合。","we":["錯誤：生物鹼（alkaloids）會與鞣酸（tannic acid）形成不溶性的沉澱物，影響吸收。","","錯誤：Tetracycline會與鎂（Mg²⁺）等二價陽離子螯合，形成不溶性複合物，降低生體可用率。","錯誤：Dimercaprol（BAL）為重金屬螯合劑，會與Hg²⁺形成穩定的可溶性螯合物，此為其解毒機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_005","year":2018,"roc_year":107,"session":"2","examNo":5,"q":"有關處方籤拉丁縮寫所代表的意義，下列何者錯誤？","opts":["A. 飯前 a.c.","B. 右耳 a.d.","C. 左耳 a.s.","D. 飯後 a.u."],"ans":3,"exp":"拉丁縮寫中，a.u.（aures utrae）意為「雙耳」，並非「飯後」。飯後的正確縮寫為p.c.（post cibum）。其他選項均正確：a.c.（ante cibum）=飯前、a.d.（auris dextra）=右耳、a.s.（auris sinistra）=左耳。","we":["此為正確描述：a.c.（ante cibum）確為飯前投藥的拉丁縮寫，不符合「錯誤」描述。","此為正確描述：a.d.（auris dextra）確為右耳的拉丁縮寫，不符合「錯誤」描述。","此為正確描述：a.s.（auris sinistra）確為左耳的拉丁縮寫，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_006","year":2018,"roc_year":107,"session":"2","examNo":6,"q":"有關首渡效應（first-pass effect）之敘述，下列何者正確？","opts":["A. 首渡效應僅會發生於口服投藥","B. 首渡效應皆會使prodrug的藥效變得更差","C. 和口服投藥相比，舌下投藥會明顯增加首渡效應的影響","D. 口服propranolol錠劑可見明顯的首渡效應"],"ans":3,"exp":"Propranolol口服後在肝臟有顯著的首渡效應（first-pass effect），約70%在首渡時被代謝，因此口服生體可用率僅約25-30%。其他選項均錯誤：首渡效應可發生於口服及部分直腸投藥；prodrug需要首渡活化（效果增加）；舌下投藥繞過首渡效應。","we":["錯誤：首渡效應主要發生於口服，但部分直腸投藥（靠近乙狀結腸）也可能涉及首渡代謝；首渡效應的發生取決於藥物是否通過門靜脈進入肝臟。","錯誤：某些前體藥（prodrug）需要經過首渡代謝才能活化（如enalapril→enalaprilat），首渡效應反而使其藥效增加，而非降低。","錯誤：舌下投藥可繞過首渡效應，因藥物直接從口腔黏膜吸收進入全身循環，不經過門靜脈系統。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_007","year":2018,"roc_year":107,"session":"2","examNo":7,"q":"下列何者藥品的作用機制和酶（enzymes）的抑制無關？","opts":["A. phenylbutazone","B. enalapril","C. propranolol","D. trimethoprim"],"ans":2,"exp":"Propranolol為β-腎上腺素受體拮抗劑（β-blocker），其作用機制為競爭性阻斷β受體，屬於受體拮抗劑，與酶抑制無關。其他三者均為酶抑制藥：phenylbutazone抑制COX、enalapril（enalaprilat）抑制ACE、trimethoprim抑制DHFR。","we":["錯誤：Phenylbutazone為NSAID，抑制環氧化酶（COX-1/COX-2），其消炎鎮痛作用與酶抑制直接相關。","錯誤：Enalapril（前體藥）轉化為enalaprilat後抑制血管收縮素轉化酶（ACE），降低血管收縮素II生成，其作用直接涉及酶抑制。","","錯誤：Trimethoprim競爭性抑制細菌二氫葉酸還原酶（DHFR），干擾葉酸合成，是典型的酶抑制機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_008","year":2018,"roc_year":107,"session":"2","examNo":8,"q":"研究藥物對生物體的生理和生化作用及其作用機制的科學稱為：","opts":["A. 藥效學（pharmacodynamics）","B. 藥物治療學（pharmacotherapeutics）","C. 藥物動力學（pharmacokinetics）","D. 生物藥劑學（biopharmaceutics）"],"ans":0,"exp":"藥效學（pharmacodynamics）研究藥物對生物體的生理和生化作用及其作用機制，即「藥物對身體做了什麼（what the drug does to the body）」。相對地，藥物動力學（pharmacokinetics）研究身體對藥物的處置（ADME）。","we":["","錯誤：藥物治療學（pharmacotherapeutics）研究藥物在臨床上的治療應用，包括治療方案、適應症及預後，不專注於藥物與生物體的作用機制。","錯誤：藥物動力學（pharmacokinetics）研究藥物在體內的吸收、分布、代謝和排泄（ADME），是研究藥物的量（濃度-時間關係），不是藥物的作用機制。","錯誤：生物藥劑學（biopharmaceutics）研究藥物劑型設計與體內生物利用的關係，不是研究藥物對生物體的生理生化作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_009","year":2018,"roc_year":107,"session":"2","examNo":9,"q":"影響藥物穿過胎盤由母體到胎仔的主要因素為何？","opts":["A. 藥物的分子量","B. 藥物的脂溶性","C. 藥物的半衰期","D. 藥物的投予途徑"],"ans":1,"exp":"藥物穿過胎盤主要靠被動擴散，脂溶性高的藥物可快速穿過胎盤脂質雙層膜。雖然分子量也有影響（>1000 Da較難穿透），但脂溶性是最主要的決定因素。半衰期和投予途徑不直接決定胎盤穿透能力。","we":["錯誤：藥物分子量影響胎盤穿透程度，但脂溶性才是被動擴散穿越胎盤的最主要決定因素。","","錯誤：半衰期決定藥物在體內滯留時間，不直接決定能否穿越胎盤。","錯誤：投予途徑影響吸收速率，但一旦藥物進入體循環，決定胎盤穿透的是藥物本身的脂溶性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_010","year":2018,"roc_year":107,"session":"2","examNo":10,"q":"皮膚構造中影響外用藥物吸收之主要障壁為何？","opts":["A. 真皮層","B. 顆粒層","C. 角質層","D. 毛、髮及汗腺"],"ans":2,"exp":"皮膚的角質層（stratum corneum）是外用藥物吸收的主要障壁，由已死亡的角質細胞和豐富的脂質（神經醯胺等）組成，形成防水的「磚牆結構」。真皮層有血管有助吸收，毛囊/汗腺提供輔助吸收途徑，但角質層才是最主要障壁。","we":["錯誤：真皮層富含血管，有利於藥物的全身吸收，不是主要吸收障壁。","錯誤：顆粒層位於角質層深部，雖含有緊密連接，但主要障壁功能由最外層的角質層承擔。","","錯誤：毛囊和汗腺提供藥物吸收的次要途徑（附屬器途徑），可加速某些藥物吸收，不是主要障壁。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_011","year":2018,"roc_year":107,"session":"2","examNo":11,"q":"下列何者最適合說明藥物廓清率之定義？","opts":["A. 藥物以原型及代謝產物由腎臟排出之量","B. 單位時間內藥物由腎臟濾過之量","C. 單位時間內腎臟排除之藥物含量","D. 單位時間內完全清除藥物之血液量"],"ans":3,"exp":"廓清率（clearance，CL）的定義為：單位時間內能將藥物完全清除的血漿體積（volume of plasma completely cleared of drug per unit time），單位為 mL/min 或 L/h。這是一個「虛擬體積/時間」的概念，反映藥物從體內消除的效率。","we":["錯誤：此描述為腎臟清除量（renal excretion amount），不是廓清率（clearance）的定義；廓清率是體積/時間的概念。","錯誤：此描述偏向腎小球過濾率（GFR），廓清率是更廣義的概念，包括過濾、分泌和再吸收的綜合效果，且以血液體積/時間表示。","錯誤：此偏向腎臟排除速率（量/時間），廓清率的正確定義是完全清除藥物的血漿體積/時間。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_012","year":2018,"roc_year":107,"session":"2","examNo":12,"q":"若欲以靜脈快速注射達到設定之血漿藥物濃度，下列何者為計算起始劑量之決定因素？","opts":["A. 藥物之生體可用率","B. 藥物分子量之大小","C. 藥物之分布容積","D. 藥物之排除速率"],"ans":2,"exp":"靜脈快速注射的起始劑量（loading dose）計算公式：Loading dose = Vd × 目標血漿濃度（Cp）。分布容積（Vd）決定了達到目標血漿濃度所需的藥物總量。靜脈注射時F=1，排除速率決定維持劑量而非起始劑量，分子量不直接用於計算。","we":["錯誤：生體可用率（F）用於非靜脈注射劑量計算（Dose = Css×CL/F），靜脈注射F=1，不影響起始劑量計算的關鍵因素。","錯誤：藥物分子量影響分布和過濾特性，不是計算靜脈注射起始劑量（loading dose）的直接依據。","","錯誤：藥物排除速率（CL）決定維持劑量（maintenance dose = Css×CL），不是起始劑量的計算依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_013","year":2018,"roc_year":107,"session":"2","examNo":13,"q":"化學結構為酯類（ester）連接之藥物，其生物轉換（biotransformation）主要經過下列那一途徑？","opts":["A. 水解作用","B. 去胺作用","C. 乙醯化作用","D. 氧化作用"],"ans":0,"exp":"酯類（ester）結構中的酯鍵（-COO-）主要由血漿及組織中的酯酶（esterases）進行水解作用（hydrolysis）來代謝，是第一相（Phase I）代謝的主要途徑之一。例如procaine、aspirin、succinylcholine均透過水解代謝。","we":["","錯誤：去胺作用（deamination）適用於含胺基結構（如amino acids）的藥物代謝，不適用於酯類結構。","錯誤：乙醯化（acetylation）為第二相結合反應，適用於含胺基、羥基或磺胺基的藥物，不是酯類的主要代謝途徑。","錯誤：氧化作用（oxidation）為CYP450主導的第一相代謝，主要作用於芳香環或脂肪鏈，不是酯類的主要代謝途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_014","year":2018,"roc_year":107,"session":"2","examNo":14,"q":"投予amitraz後，再投予yohimbine的主因為何？","opts":["A. 產生相乘（synergism）的殺蟲藥效","B. 能夠明顯增加驅蟲的種類","C. 可抑制CYP- 450代謝amitraz","D. 拮抗（antagonism）副作用"],"ans":3,"exp":"Amitraz為α2-腎上腺素受體致效劑，其毒性（過度鎮靜、心搏過緩、高血糖等）由α2受體過度活化引起。Yohimbine為選擇性α2受體拮抗劑，可競爭性逆轉amitraz的α2受體效應，是amitraz中毒的解毒藥，主要目的是拮抗副作用，而非協同殺蟲或代謝干預。","we":["錯誤：Yohimbine是α2受體拮抗劑，與amitraz作用相反，不會產生相乘殺蟲效果。","錯誤：Yohimbine不具有殺蟲或驅蟲活性，不能擴大驅蟲範圍。","錯誤：Yohimbine不抑制CYP-450酶，不影響amitraz的代謝速率。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_015","year":2018,"roc_year":107,"session":"2","examNo":15,"q":"有關etomidate之敘述，下列何者錯誤？","opts":["A. 是一個超短效的非barbiturate藥物","B. 會降低腦血流、代謝率和氧氣消耗","C. 具有類似γ-胺基丁酸的作用","D. 對心血管和呼吸功能的抑制比propofol大"],"ans":3,"exp":"Etomidate為非巴比妥類超短效靜脈麻醉藥，透過增強GABA-A受體功能發揮作用，可降低腦代謝率、腦血流及顱內壓。其最大優點是對心血管和呼吸功能的抑制遠比propofol和barbiturates輕微，是心血管功能不良患者的首選誘導藥物，故選項D描述錯誤。","we":["此為正確描述：Etomidate確為超短效非巴比妥類靜脈麻醉誘導劑，廣泛用於心血管功能不良患者，不符合「錯誤」描述。","此為正確描述：Etomidate可降低腦代謝率（CMRO2）、腦血流及顱內壓，用於神經外科麻醉，不符合「錯誤」描述。","此為正確描述：Etomidate透過增強GABA-A受體的氯離子電流產生鎮靜催眠效果，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_016","year":2018,"roc_year":107,"session":"2","examNo":16,"q":"犬隻使用抗痙攣藥物phenobarbital治療，最主要且常見之不良反應為何？","opts":["A. 胃潰瘍","B. 肝毒性","C. 聽神經傷害","D. 骨質疏鬆症"],"ans":1,"exp":"犬隻長期使用phenobarbital（苯巴比妥）治療癲癇，最主要且最嚴重的不良反應為肝毒性（hepatotoxicity），表現為肝酵素升高、肝細胞空泡化，嚴重者可發展為肝硬化和肝衰竭。其原因與phenobarbital誘導CYP450酶，導致肝臟代謝負荷加重及氧化壓力增加有關。","we":["錯誤：胃潰瘍較常見於NSAIDs（如aspirin）和類固醇的使用，不是phenobarbital的主要不良反應。","","錯誤：聽神經傷害（耳毒性）為aminoglycoside類抗生素（如gentamicin）的特徵性副作用，不是phenobarbital的問題。","錯誤：骨質疏鬆症為長期使用糖皮質素的副作用，phenobarbital長期使用的主要問題是肝臟損傷（誘導CYP450導致肝細胞損傷）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_017","year":2018,"roc_year":107,"session":"2","examNo":17,"q":"下列何種藥物最適合使用於過敏性休克反應時之緊急治療？","opts":["A. norepinephrine","B. epinephrine","C. chlorpromazine","D. naloxone"],"ans":1,"exp":"過敏性休克（anaphylaxis）的第一線治療為腎上腺素（epinephrine），因其同時具有：α1效果（血管收縮，升血壓）、β1效果（強心，增加心輸出量）、β2效果（支氣管擴張，緩解呼吸困難）。三重效果共同對抗過敏性休克的低血壓、支氣管痙攣和心血管崩潰。","we":["錯誤：Norepinephrine主要作用α受體收縮血管，缺乏β2支氣管擴張作用，不是過敏性休克的首選，epinephrine因同時具α和β效果更適合。","","錯誤：Chlorpromazine為吩噻嗪類安神劑，具有α阻斷作用，可能加重休克引起的低血壓，禁用於過敏性休克。","錯誤：Naloxone為鴉片類拮抗劑，用於逆轉鴉片中毒，對過敏性休克無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_018","year":2018,"roc_year":107,"session":"2","examNo":18,"q":"投予治療劑量範圍內之metoprolol治療貓之心律不整時，最可能出現的現象為何？","opts":["A. 膀胱括約肌鬆弛","B. 子宮收縮","C. 支氣管擴張","D. 腎素分泌減少"],"ans":3,"exp":"Metoprolol為選擇性β1腎上腺素受體阻斷劑。β1受體阻斷後，腎臟近球細胞（juxtaglomerular cells）分泌腎素（renin）減少，因為腎素釋放受β1受體調控。其他效應（膀胱括約肌、子宮、支氣管）不是β1選擇性阻斷的主要效果。","we":["錯誤：膀胱括約肌控制主要為α腎上腺素受體（收縮）和M受體（鬆弛），β1選擇性阻斷不直接影響膀胱括約肌。","錯誤：子宮收縮由催產素和前列腺素介導，β受體（尤其β2）拮抗理論上可增加子宮張力，但非metoprolol治療劑量的主要效果。","錯誤：支氣管擴張為β2受體活化的效果；選擇性β1阻斷劑（metoprolol）雖對β2影響較小，但仍有輕微支氣管收縮風險，不是支氣管擴張。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_019","year":2018,"roc_year":107,"session":"2","examNo":19,"q":"下列何者使用在馬時最可能引發惡性高熱（malignant hyperthermia）？","opts":["A. tubocurarine","B. dantrolene","C. succinylcholine","D. propantheline"],"ans":2,"exp":"惡性高熱（malignant hyperthermia，MH）主要由去極化型神經肌肉阻斷劑succinylcholine（或吸入性麻醉劑如halothane）觸發，特別在具有遺傳性RYR1基因突變的個體（馬、豬易感）。Succinylcholine觸發肌漿網大量釋放Ca²⁺，導致肌肉持續收縮產熱。Dantrolene為治療藥物（阻斷Ca²⁺釋放）。","we":["錯誤：Tubocurarine為非去極化型神經肌肉阻斷劑，競爭性拮抗ACh，不是惡性高熱的觸發劑。","錯誤：Dantrolene為惡性高熱的治療藥物（抑制肌漿網Ca²⁺釋放），不是觸發劑。","","錯誤：Propantheline為抗膽鹼藥，不具神經肌肉阻斷作用，不觸發惡性高熱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_020","year":2018,"roc_year":107,"session":"2","examNo":20,"q":"下列何者最適合用於治療鬱血性心衰竭，且為選擇性β1\r -腎上腺素性藥物？","opts":["A. dobutamine","B. norepinephrine","C. epinephrine","D. dopamine"],"ans":0,"exp":"Dobutamine為選擇性β1腎上腺素受體致效劑，具有強效正性肌力（inotropic）作用，可增加心肌收縮力和心輸出量，是治療鬱血性心衰竭急性期的首選強心藥。相比之下，norepinephrine和epinephrine為非選擇性，dopamine依劑量作用不同受體，選擇性均不如dobutamine。","we":["","錯誤：Norepinephrine主要作用α1（強力血管收縮）和β1受體，增加後負荷，不是選擇性β1藥物，不適合單純用於改善心肌收縮力。","錯誤：Epinephrine同時活化α1、α2、β1和β2受體，非選擇性β1藥物，心跳加速和血壓波動副作用較大。","錯誤：Dopamine依劑量作用不同受體（低劑量D1、中劑量β1、高劑量α1），不是選擇性β1藥物，且選擇性低於dobutamine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_021","year":2018,"roc_year":107,"session":"2","examNo":21,"q":"屬於選擇性&alpha;1 -adrenergic antagonist，且能使血管舒張的藥物何？","opts":["A. hydralazine","B. nitroprusside","C. prazosin","D. amlodipine"],"ans":2,"exp":"Prazosin為選擇性α1腎上腺素受體拮抗劑，阻斷血管平滑肌上的α1受體，使血管（動脈和靜脈）擴張，降低外周血管阻力。用於犬的高血壓、鬱血性心衰竭及尿道痙攣等。Hydralazine為直接血管擴張劑（cGMP相關），nitroprusside為NO供體，amlodipine為鈣離子阻斷劑，均非α1拮抗劑。","we":["錯誤：Hydralazine為直接作用的血管擴張劑，可能涉及cGMP機制，不是選擇性α1拮抗劑。","錯誤：Nitroprusside為NO供體，引起血管平滑肌cGMP增加而舒張，不是α1拮抗劑。","","錯誤：Amlodipine為二氫吡啶類鈣離子阻斷劑，透過阻斷L型鈣通道擴張血管，不是α1拮抗劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_022","year":2018,"roc_year":107,"session":"2","examNo":22,"q":"Pimobendan具有增強心肌收縮力之作用，其作用機制為何？","opts":["A. 興奮交感神經的活性","B. 興奮Na＋-K＋ATPase的活性","C. 抑制phosphodiesterase的活性","D. 抑制Na＋-K＋ATPase的活性"],"ans":2,"exp":"Pimobendan的正性肌力作用機制有兩個：(1)抑制磷酸二酯酶III（PDE III）→ cAMP增加 → 鈣離子內流增加；(2)鈣增敏作用（calcium sensitizer）→ 心肌肌鈣蛋白對鈣的敏感性增加。以上合稱「雙重機制」，磷酸二酯酶抑制是主要的酶學機制。","we":["錯誤：Pimobendan不透過興奮交感神經發揮正性肌力作用，其機制為磷酸二酯酶抑制和鈣增敏。","錯誤：興奮Na+-K+ATPase與增強心肌收縮力相反（Na+-K+ATPase抑制才增加細胞內Ca²⁺）；pimobendan不作用於Na+-K+ATPase。","","錯誤：抑制Na+-K+ATPase為強心配糖體（digitalis）的機制，pimobendan的作用機制為磷酸二酯酶抑制，非Na+-K+ATPase抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_023","year":2018,"roc_year":107,"session":"2","examNo":23,"q":"治療犬隻快速、持久上心室性心跳過快或心房纖維性顫動之優先選擇藥物為何？","opts":["A. procainamide","B. diltiazem","C. lidocaine","D. spironolactone"],"ans":1,"exp":"Diltiazem（非二氫吡啶類鈣離子阻斷劑）為犬隻上心室性快速心律不整（SVT）及心房纖維性顫動（AF）的優先選擇，因為它選擇性抑制房室結（AV node）的傳導速率，有效控制心室速率。Procainamide主要用於心室性心律不整，lidocaine也針對心室性，spironolactone為利尿劑。","we":["錯誤：Procainamide為Class IA抗心律不整藥，主要用於心室性心律不整，不是上心室性快速心跳或心房纖維性顫動的首選。","","錯誤：Lidocaine為Class IB抗心律不整藥，主要用於心室性心律不整（如心室纖維性顫動），不是上心室性心律不整的首選。","錯誤：Spironolactone為醛固酮拮抗劑利尿劑，用於心臟衰竭輔助治療，不具直接控制心律的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_024","year":2018,"roc_year":107,"session":"2","examNo":24,"q":"下列何者為Class II抗心律不整藥，且能選擇性降低交感神經對心肌的興奮作用？","opts":["A. esmolol","B. sotalol","C. propranolol","D. amiodarone"],"ans":0,"exp":"Esmolol為超短效選擇性β1腎上腺素受體阻斷劑（Class II抗心律不整藥），半衰期約9分鐘（被紅血球中的酯酶水解），適用於急性、短暫性上心室性快速心律不整的控制。其選擇性β1阻斷作用可有效降低交感神經對心肌的興奮性，減慢心室速率。","we":["","錯誤：Sotalol兼具Class II（β阻斷）和Class III（K通道阻斷）活性，且為非選擇性β阻斷劑，選擇性低於esmolol。","錯誤：Propranolol為非選擇性β阻斷劑（β1+β2），雖同屬Class II，但非選擇性，β2阻斷會引起支氣管收縮副作用。","錯誤：Amiodarone主要為Class III抗心律不整藥，阻斷鉀離子通道延長動作電位，不以選擇性降低交感神經興奮為主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_025","year":2018,"roc_year":107,"session":"2","examNo":25,"q":"下列何者不屬於膠體（colloids）輸液？","opts":["A. dextran 70","B. acetated polyionic solution","C. hetastarch","D. 5% oxypolygelatin"],"ans":1,"exp":"膠體輸液（colloids）含有大分子物質（如多醣、蛋白質、明膠），可增加血漿膠體滲透壓，長時間維持血管內容積。晶體輸液（crystalloids）則為含電解質的水溶液，如acetated polyionic solution（乳酸林格氏液類似物，含醋酸根緩衝），不含大分子，屬晶體輸液，無法有效擴充血漿容積。","we":["錯誤：Dextran 70為高分子多醣類膠體輸液，可增加血漿膠體滲透壓，屬於膠體輸液。","","錯誤：Hetastarch（羥乙基澱粉）為合成膠體，廣泛用於擴充血漿容積，屬於膠體輸液。","錯誤：5%氧化多聚明膠（oxypolygelatin）為明膠類膠體輸液，用於血漿容積擴充，屬於膠體輸液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_026","year":2018,"roc_year":107,"session":"2","examNo":26,"q":"Bumetanide屬於下列那一類利尿劑？","opts":["A. carbonic anhydrase inhibitors","B. loop diuretics","C. osmotic diuretics","D. potassium sparing diuretics"],"ans":1,"exp":"Bumetanide（布美他尼）為loop利尿劑（亨利氏環利尿劑），與furosemide同類，作用於亨利氏環上昇支粗段，抑制Na-K-2Cl共同運輸體（NKCC2），是強效利尿劑，效力約為furosemide的40倍。常用於頑固性水腫或對furosemide反應不佳的患者。","we":["錯誤：碳酸酐酶抑制劑（如acetazolamide）作用於近曲小管，bumetanide作用於亨利氏環上昇支。","","錯誤：滲透性利尿劑（如mannitol）透過滲透壓效應阻止水再吸收，bumetanide為主動抑制Na-K-2Cl共同運輸體的loop利尿劑。","錯誤：保鉀利尿劑（如spironolactone、amiloride）保留鉀離子，bumetanide屬排鉀的loop利尿劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_027","year":2018,"roc_year":107,"session":"2","examNo":27,"q":"有關大多數藥物經由尿液排出之敘述，下列何者正確？","opts":["A. 降低尿液的pH值，則酸性藥物較易排出","B. 升高尿液的pH值，則鹼性藥物較易排出","C. 水溶性較高的藥物較易排出","D. 脂溶性較高的藥物較易排出"],"ans":2,"exp":"水溶性較高的藥物在腎小管中不易被脂質膜再吸收，因此較易隨尿液排出。相反，脂溶性高的藥物容易被腎小管被動再吸收（passive reabsorption）而減少排泄。尿液pH影響弱酸/弱鹼藥物的離子化程度：鹼化尿液促進弱酸性藥物排除（離子化↑→再吸收↓），酸化尿液促進弱鹼性藥物排除。","we":["錯誤：降低尿液pH使弱酸性藥物更易為非離子型（pH<pKa），更容易被腎小管再吸收，反而減少排泄，而非增加。","錯誤：升高尿液pH使鹼性藥物更易為非離子型，被再吸收增加，排泄減少；鹼化尿液有利於弱酸性藥物的排除（離子化增加）。","","錯誤：脂溶性高的藥物容易被腎小管被動再吸收，反而不易隨尿液排出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_028","year":2018,"roc_year":107,"session":"2","examNo":28,"q":"下列何者可減少鉀離子的分泌，進而增加血鉀濃度？","opts":["A. acetazolamide","B. amiloride","C. hydrochlorothiazide","D. furosemide"],"ans":1,"exp":"Amiloride為保鉀利尿劑，作用於遠曲小管和集合管，阻斷上皮性鈉離子通道（ENaC），減少Na進入細胞→管腔電位差降低→K+分泌驅動力減少→血鉀升高。其他選項（acetazolamide、hydrochlorothiazide、furosemide）均會導致鉀離子流失（低血鉀）。","we":["錯誤：Acetazolamide為碳酸酐酶抑制劑，促進NaHCO3排泄，同時伴隨鉀離子流失，不保鉀。","","錯誤：Hydrochlorothiazide為噻嗪類利尿劑，促進Na排出同時引起鉀流失，可能導致低血鉀，不保鉀。","錯誤：Furosemide（loop利尿劑）作用於亨利氏環上昇支，促進大量電解質排泄包括鉀，是常見低血鉀的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_029","year":2018,"roc_year":107,"session":"2","examNo":29,"q":"下列何者具有和胃腸道潰瘍黏膜結合的作用？","opts":["A. cisapride","B. loperamide","C. misoprostol","D. sucralfate"],"ans":3,"exp":"Sucralfate（蔗糖硫酸鋁）在酸性環境（pH<4）下，鋁離子釋放並與潰瘍表面的蛋白質（尤其是壞死組織中帶負電的蛋白）結合，形成黏稠的保護膜，物理性覆蓋潰瘍創面，防止胃酸、胃蛋白酶和膽汁進一步侵蝕。此機制為「黏附潰瘍表面形成保護膜」，是其獨特作用機制。","we":["錯誤：Cisapride為促進胃腸動力藥（多巴胺拮抗劑/5-HT4激動劑），促進胃腸蠕動，不與潰瘍黏膜結合。","錯誤：Loperamide為腸道鴉片受體激動劑，減緩腸蠕動止瀉，不具結合潰瘍黏膜的特性。","錯誤：Misoprostol為前列腺素E1類似物，透過增加黏液和碳酸氫鹽分泌保護胃黏膜，不直接與潰瘍表面結合。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_030","year":2018,"roc_year":107,"session":"2","examNo":30,"q":"下列何者是血清素（serotonin）受體拮抗劑，並且具有刺激食慾的作用？","opts":["A. cimetidine","B. cisapride","C. cyproheptadine","D. ondansetron"],"ans":2,"exp":"Cyproheptadine為第一代抗組織胺藥（H1受體拮抗劑）兼5-HT2受體拮抗劑，因阻斷5-HT2受體可刺激食慾（下視丘層次）。常用於貓咪的食慾不振和惡病質治療。其同時具有H1拮抗（抗過敏）和5-HT拮抗（促食慾）的雙重效果。","we":["錯誤：Cimetidine為H2受體拮抗劑，抑制胃酸分泌，不是血清素受體拮抗劑，且不具刺激食慾的特性。","錯誤：Cisapride為5-HT4受體致效劑兼促進胃腸動力藥，而非5-HT拮抗劑，不以刺激食慾著稱。","","錯誤：Ondansetron為5-HT3受體拮抗劑，主要用於止吐（化療引起的嘔吐），不具刺激食慾的效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_031","year":2018,"roc_year":107,"session":"2","examNo":31,"q":"下列何者不是mirtazapine的臨床用途？","opts":["A. 促進貓的食慾","B. 促進犬的食慾","C. 犬的止吐","D. 犬的鎮靜"],"ans":3,"exp":"Mirtazapine（米氮平）的臨床獸醫用途包括：貓和犬的食慾促進（透過5-HT3和H1阻斷）、止吐（5-HT3拮抗）。但mirtazapine在犬的「鎮靜」並非其主要臨床用途；其鎮靜作用在貓較明顯，在犬則以食慾促進和止吐為主。故「犬的鎮靜」不是mirtazapine被認可的主要臨床適應症。","we":["錯誤：Mirtazapine（noradrenergic/specific serotonergic antidepressant，NaSSA）在貓具有強效促進食慾的效果，為臨床常用用途。","錯誤：Mirtazapine在犬也可作為食慾促進劑，為臨床使用的適應症。","錯誤：Mirtazapine透過阻斷5-HT3受體具有止吐作用，在犬的止吐為臨床用途之一。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_032","year":2018,"roc_year":107,"session":"2","examNo":32,"q":"下列何者抑制胃酸分泌作用的臨床效果最佳？","opts":["A. ranitidine","B. misoprostol","C. omeprazole","D. sucralfate"],"ans":2,"exp":"Omeprazole為質子幫浦抑制劑（PPI），不可逆性地抑制胃壁細胞的H+/K+-ATPase（質子幫浦），是目前最強效的抑制胃酸分泌藥物。其抑酸效果顯著優於H2阻斷劑（ranitidine）、前列腺素類似物（misoprostol）和黏膜保護劑（sucralfate，不抑酸）。","we":["錯誤：Ranitidine為H2受體拮抗劑，抑制胃酸分泌效果優於antacids，但不如質子幫浦抑制劑（PPI）omeprazole強效。","錯誤：Misoprostol（前列腺素E1類似物）可輕度抑制胃酸分泌，並刺激黏液和碳酸氫鹽，但對胃酸的抑制效果不及H2阻斷劑或PPI。","","錯誤：Sucralfate為黏膜保護劑，本身不抑制胃酸分泌，而是在酸性pH下與潰瘍黏膜結合形成保護膜。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_033","year":2018,"roc_year":107,"session":"2","examNo":33,"q":"下列何者為作用於histamine-receptor (H1\r ) 之解充血劑（decongestant）？","opts":["A. phenylephrine","B. dimenhydrinate","C. guaifenesin","D. pseudoephedrine"],"ans":1,"exp":"Dimenhydrinate（苯海拉明茶苯海明，Dramamine）含有diphenhydramine成分，為第一代H1受體拮抗劑，同時具有抗膽鹼作用，常用於暈車症（motion sickness）和止吐。題目詢問「作用於H1受體之解充血劑」，dimenhydrinate的H1阻斷作用可減少鼻黏膜充血（通過抑制組織胺引起的血管擴張）。","we":["錯誤：Phenylephrine為選擇性α1受體致效劑，透過血管收縮解除鼻黏膜充血，不作用於組織胺受體。","","錯誤：Guaifenesin（甘油胍柯素）為祛痰劑，稀化痰液促進排出，不是解充血劑也不作用於H1受體。","錯誤：Pseudoephedrine為擬交感神經藥，透過α+β受體效果解除充血，不是H1受體相關的解充血劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_034","year":2018,"roc_year":107,"session":"2","examNo":34,"q":"下列物質何者是祛痰劑？","opts":["A. dextromethorphan","B. glyceryl guaiacolate","C. ipratropium","D. theophylline"],"ans":1,"exp":"Glyceryl guaiacolate（甘油guaiacol，guaifenesin）為常見的祛痰劑（expectorant），可降低呼吸道分泌物黏稠度，促進黏液纖毛清除（mucociliary clearance），幫助痰液排出。其他選項均非祛痰劑：dextromethorphan為鎮咳劑，ipratropium為支氣管擴張劑，theophylline為支氣管擴張劑。","we":["錯誤：Dextromethorphan（右美沙芬）為鎮咳劑，作用於NMDA受體和σ受體，不具祛痰效果。","","錯誤：Ipratropium為抗膽鹼性支氣管擴張劑，通過阻斷M3受體減少支氣管分泌，不是祛痰劑。","錯誤：Theophylline為甲基黃嘌呤，主要功效為支氣管擴張，具輕度利尿和興奮呼吸中樞作用，不是祛痰劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_035","year":2018,"roc_year":107,"session":"2","examNo":35,"q":"下列何者不是治療氣喘的用藥？","opts":["A. α-agonist","B. β-agonist","C. corticosteroid","D. leukotriene antagonist"],"ans":0,"exp":"氣喘治療的標準藥物包括：β2受體致效劑（支氣管擴張）、皮質素（抗炎）和白三烯素拮抗劑（抗炎）。α受體致效劑（α-agonists）主要引起血管收縮，不具支氣管擴張作用（α受體活化使支氣管平滑肌收縮），不用於治療氣喘，故為答案。","we":["","錯誤：β受體致效劑（如β2-agonist albuterol）為治療氣喘的主要支氣管擴張劑，活化β2受體使支氣管平滑肌鬆弛。","錯誤：皮質素（如prednisolone、fluticasone）具有強效抗炎作用，是治療慢性氣喘的重要藥物。","錯誤：白三烯素拮抗劑（如zafirlukast、montelukast）透過阻斷白三烯素受體減少過敏性炎症，為氣喘的治療藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_036","year":2018,"roc_year":107,"session":"2","examNo":36,"q":"Methylxanthine derivatives因抑制下列何種酵素，使得細胞內cAMP的量增加，進而產生支氣管擴張效果？","opts":["A. phospholipase","B. adenyl cyclase","C. phosphorylase","D. phosphodiesterase"],"ans":3,"exp":"Methylxanthines（如theophylline、aminophylline）透過抑制磷酸二酯酶（phosphodiesterase，PDE）來發揮支氣管擴張作用。PDE負責將cAMP分解為5-AMP，抑制PDE後cAMP濃度升高，活化蛋白激酶A（PKA），導致支氣管平滑肌鬆弛（擴張）。","we":["錯誤：Phospholipase分解磷脂，產生花生四烯酸，與前列腺素合成有關，不是methylxanthine的主要標靶。","錯誤：Adenyl cyclase（腺苷酸環化酶）合成cAMP，methylxanthine不抑制此酵素；若抑制adenyl cyclase反而降低cAMP，效果相反。","錯誤：Phosphorylase參與肝醣分解，不是methylxanthine的主要作用標靶。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_037","year":2018,"roc_year":107,"session":"2","examNo":37,"q":"第二代H1\r -抗組織胺對中樞系統影響甚輕或甚至無影響，其原因為何？","opts":["A. 口服吸收差，作用時間短","B. 受P-醣蛋白質之排出作用","C. 分子結構太大無法穿過血腦障壁","D. 受P-酵素之分解作用"],"ans":1,"exp":"第二代H1抗組織胺藥（如cetirizine、loratadine、fexofenadine）中樞鎮靜效果輕微，主因是血腦屏障（BBB）的P-醣蛋白（P-glycoprotein，P-gp）主動將這些藥物泵出中樞神經系統（efflux transporter），使藥物無法在CNS中積累，因此不產生明顯鎮靜效果。","we":["錯誤：第二代抗組織胺（如cetirizine、loratadine）口服吸收良好，作用時間長（12-24小時），不是無中樞鎮靜效果的原因。","","錯誤：第二代抗組織胺分子量不一定特別大，其無法進入CNS主要是因為P-醣蛋白的主動排出作用，而非分子大小限制。","錯誤：P-酵素（P-enzymes）並非特定的已知藥理概念；P-醣蛋白（P-glycoprotein）才是限制CNS穿透的主要因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_038","year":2018,"roc_year":107,"session":"2","examNo":38,"q":"Flunixin的化學結構屬於那一類NSAIDs？","opts":["A. nicotinic acid","B. propionic acid","C. acetic acid","D. oxicam"],"ans":0,"exp":"Flunixin meglumine（氟尼辛葡甲胺）的化學結構屬於菸鹼酸（nicotinic acid）衍生物，為非甾類抗炎藥（NSAID）中的fenamate類（芬那酸類），廣泛用於馬、牛、豬等大動物的消炎鎮痛。其他NSAIDs分類：ibuprofen、carprofen屬丙酸類；indomethacin屬醋酸類；piroxicam、meloxicam屬oxicam類。","we":["","錯誤：Propionic acid類NSAIDs包括ibuprofen、carprofen、ketoprofen，不包括flunixin。","錯誤：Acetic acid類NSAIDs包括indomethacin、diclofenac，不包括flunixin。","錯誤：Oxicam類NSAIDs包括piroxicam、meloxicam，不包括flunixin。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_039","year":2018,"roc_year":107,"session":"2","examNo":39,"q":"下列何者為麥角鹼衍生物，具有dopaminergic致效劑之活性，能抑制prolactin之分泌，進而造成黃體崩解\r （luteolysis）？","opts":["A. ergonovine","B. finasteride","C. bromocriptine","D. flumethasone"],"ans":2,"exp":"Bromocriptine為麥角鹼（ergot alkaloid）衍生物，選擇性多巴胺D2受體致效劑，透過活化垂體前葉泌乳素細胞上的D2受體，強效抑制prolactin分泌。Prolactin對黃體具有促黃體功能（luteotropic），抑制後黃體退化，用於犬的假孕（pseudopregnancy）治療及終止懷孕。","we":["錯誤：Ergonovine（麥角新鹼）為麥角鹼，主要用於子宮收縮止血，為α-腎上腺素性效果，不是多巴胺受體致效劑。","錯誤：Finasteride抑制5α-還原酶，阻礙睪固酮轉化為dihydrotestosterone，用於良性攝護腺肥大和雄性禿，與多巴胺無關。","","錯誤：Flumethasone為糖皮質素，具抗炎和免疫抑制作用，不是多巴胺受體致效劑，不抑制prolactin。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_040","year":2018,"roc_year":107,"session":"2","examNo":40,"q":"下列何者為gonadorelin之治療用途？","opts":["A. 牛濾泡囊腫","B. 子宮蓄膿","C. 誘發分娩","D. 促進生長"],"ans":0,"exp":"Gonadorelin（GnRH類似物）可刺激垂體前葉釋放LH（黃體生成素）和FSH，在牛隻靜脈或肌肉注射後，可引發LH峰值，促使濾泡排卵，有效治療濾泡囊腫（follicular cysts）。濾泡囊腫是因LH峰值不足，濾泡無法排卵而持續存在所致。GnRH不用於子宮蓄膿、誘發分娩或促進生長。","we":["","錯誤：子宮蓄膿的治療為PGF2α（黃體退化）或卵巢子宮摘除，gonadorelin不用於子宮蓄膿。","錯誤：誘發分娩使用oxytocin（催產素）或dexamethasone，GnRH不是誘發分娩的藥物。","錯誤：促進生長的藥物為同化雄性素（如stanozolol）或生長荷爾蒙（somatotropin），GnRH不直接用於促進生長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_041","year":2018,"roc_year":107,"session":"2","examNo":41,"q":"下列何者可用於犬良性攝護腺肥大？","opts":["A. finasteride","B. boldenone","C. danazol","D. stanozolol"],"ans":0,"exp":"Finasteride 為 5α-reductase 抑制劑，可減少睪固酮轉化為雙氫睪固酮（DHT），降低攝護腺組織的雄激素刺激，用於治療犬良性攝護腺肥大（BPH）。Boldenone、danazol 及 stanozolol 均具有合成雄性素或雄激素性質，不適用於此適應症。","we":["","錯誤：Boldenone為合成雄性素，具合成代謝作用，雄激素效果反而會刺激攝護腺增生，不用於良性攝護腺肥大。","錯誤：Danazol為雄性素受體部分致效劑，用於免疫相關血液疾病，不是治療犬良性攝護腺肥大的藥物。","錯誤：Stanozolol為合成雄性素，同化作用強，雄激素活性可能加重攝護腺肥大，不用於此適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_042","year":2018,"roc_year":107,"session":"2","examNo":42,"q":"有關結晶鋅胰島素（crystalline zinc insulin）之敘述，下列何者錯誤？","opts":["A. 為短效型","B. 可以皮下或靜脈注射","C. 可用於糖尿病性之酮酸血症（ketoacidosis）","D. 含魚精蛋白之結晶製劑"],"ans":3,"exp":"結晶鋅胰島素（crystalline zinc insulin，即 regular insulin）為短效型胰島素，可皮下或靜脈注射，也是唯一可靜脈給藥的胰島素製劑，適用於糖尿病性酮酸血症（DKA）的緊急處置。含魚精蛋白（protamine）的製劑為 NPH（isophane）胰島素，而非結晶鋅胰島素，故 D 選項描述錯誤。","we":["此為正確描述：結晶鋅胰島素（regular insulin）為短效型，皮下注射後0.5-1小時起效，作用6-8小時，不符合「錯誤」描述。","此為正確描述：結晶鋅胰島素（短效型）可皮下注射（常規控制）也可靜脈注射（緊急處置如DKA），不符合「錯誤」描述。","此為正確描述：糖尿病酮酸血症需要短效胰島素（只有regular insulin可IV），不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_043","year":2018,"roc_year":107,"session":"2","examNo":43,"q":"下列何者最適合使用於控制貓因甲狀腺機能亢進所誘發之高血壓？","opts":["A. nitroglycerin","B. lidocaine","C. atenolol","D. phenytoin"],"ans":2,"exp":"Atenolol 為選擇性 β1 腎上腺素受體阻斷劑，可降低心跳速率和血壓，有效對抗甲狀腺機能亢進引起的心跳過速和高血壓，是貓甲狀腺亢進相關心血管症狀的首選用藥。","we":["錯誤：Nitroglycerin為靜脈擴張劑，主要降低前負荷，對甲狀腺亢進引起的高血壓和心跳過速效果有限。","錯誤：Lidocaine主要用於心室性心律不整，不是控制甲狀腺亢進相關高血壓的首選。","","錯誤：Phenytoin為抗癲癇藥，不是控制甲狀腺亢進引起高血壓的藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_044","year":2018,"roc_year":107,"session":"2","examNo":44,"q":"下列何者與維生素E都有抗氧化作用，可共同作為降低脂肪的過氧化作用？","opts":["A. 硒","B. 銅","C. 錳","D. 鈷"],"ans":0,"exp":"硒（Se）是穀胱甘肽過氧化酶（glutathione peroxidase）的必需輔因子，與維生素 E 協同作為抗氧化劑，共同防止細胞膜脂質過氧化。兩者缺乏均可引起白肌病（white muscle disease）等氧化損傷疾病。","we":["","錯誤：銅為超氧化物歧化酶（SOD）的輔因子，有一定抗氧化作用，但與維生素E協同抗氧化的特異性不如硒。","錯誤：錳也是SOD的輔因子，但與維生素E協同防止脂肪過氧化的效果不如硒-谷胱甘肽過氧化酶系統。","錯誤：鈷是維生素B12的核心元素，不具有顯著的脂肪抗氧化作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_045","year":2018,"roc_year":107,"session":"2","examNo":45,"q":"飼料中添加methionine是為補充下列何種微量元素？","opts":["A. 硒","B. 銅","C. 硫","D. 鈷"],"ans":2,"exp":"Methionine（甲硫胺酸）為含硫胺基酸，其分子中含有硫元素（S），在體內可轉化為半胱胺酸等含硫化合物。在飼料中添加 methionine 主要目的為補充硫的攝取，硫為多種輔酶和胺基酸的組成成分。","we":["錯誤：硒的補充需要使用含硒的無機鹽（如亞硒酸鈉）或含硒有機化合物，methionine不含硒。","錯誤：銅需透過銅鹽（如硫酸銅）補充，methionine不含銅。","","錯誤：鈷為維生素B12的核心元素，需透過鈷鹽補充，methionine不含鈷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_046","year":2018,"roc_year":107,"session":"2","examNo":46,"q":"下列何者是用於治療產後麻痺最有效的藥物？","opts":["A. calcium gluconate","B. MgO","C. methionine","D. CuSO4"],"ans":0,"exp":"產後麻痺（milk fever）為分娩前後低鈣血症（hypocalcemia）所致，最有效的治療為靜脈緩慢注射葡萄糖酸鈣（calcium gluconate）溶液，可迅速補充血鈣，恢復神經肌肉功能。","we":["","錯誤：氧化鎂（MgO）為鎂補充劑，用於低鎂血症，不是低鈣血症（產後麻痺）的首選治療。","錯誤：Methionine為含硫胺基酸，用於補充硫，不用於治療產後麻痺的低鈣血症。","錯誤：硫酸銅（CuSO4）用於銅補充，不是治療產後麻痺的藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_047","year":2018,"roc_year":107,"session":"2","examNo":47,"q":"下列何者為草食性動物所需維生素A的主要來源？","opts":["A. ergosterol","B. phytonadione","C. α-tocopherol","D. β-carotene"],"ans":3,"exp":"β-胡蘿蔔素（β-carotene）為維生素 A 的前驅物（provitamin A），廣泛存在於牧草等植物性食物中，草食性動物攝入後可在腸壁細胞中被 β-carotene 15,15'-monooxygenase 切割轉化為維生素 A（視網醇）。","we":["錯誤：Ergosterol為植物固醇，是維生素D2（麥角鈣化醇）的前驅物，不是維生素A的來源。","錯誤：Phytonadione（phylloquinone）為植物性維生素K1，參與凝血因子合成，不是維生素A的來源。","錯誤：α-Tocopherol為維生素E，為抗氧化劑，不是維生素A或其前驅物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_048","year":2018,"roc_year":107,"session":"2","examNo":48,"q":"Valacyclovir經投藥後在動物體內會轉變為下列何者？","opts":["A. famciclovir","B. penciclovir","C. oseltamivir","D. acyclovir"],"ans":3,"exp":"Valacyclovir 為 acyclovir 的纈胺酸酯前體藥（prodrug），口服後經腸道和肝臟的酯酶水解，迅速轉化為活性形式 acyclovir，生體可用率（bioavailability）遠高於直接口服 acyclovir。","we":["錯誤：Famciclovir為penciclovir的前體藥（不是valacyclovir），兩者都用於疱疹病毒，但為不同的藥物。","錯誤：Penciclovir為famciclovir的活性代謝物，不是valacyclovir的轉化產物。","錯誤：Oseltamivir為神經胺酸酶抑制劑，針對流感病毒，不是valacyclovir的代謝物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_049","year":2018,"roc_year":107,"session":"2","examNo":49,"q":"臨床上依據下列那一特性而常併用不同的磺胺劑以防止造成腎毒性？","opts":["A. 為弱有機鹼之化學特性","B. 具有高度之脂溶性","C. 具有獨立之溶解度","D. 對體組織之親和性低"],"ans":2,"exp":"多種磺胺劑聯合使用（如 triple sulfa）的依據是各磺胺劑具有獨立溶解度（independent solubility）。每種藥物在尿液中的溶解度各自計算，聯用時每種藥的濃度均低於其飽和點，因而大幅降低結晶尿（crystalluria）和腎毒性的風險。","we":["錯誤：磺胺劑的弱鹼特性影響解離度，與多種磺胺並用降低結晶尿的依據是各藥物的獨立溶解度，而非弱鹼性本身。","錯誤：高度脂溶性藥物不易在腎臟結晶，反而易被再吸收；磺胺劑並用的目的是基於各藥獨立溶解度，降低個別藥物濃度。","","錯誤：組織親和性低與腎臟結晶尿的形成無直接關聯；預防結晶尿的依據是各磺胺劑的獨立溶解度原則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_050","year":2018,"roc_year":107,"session":"2","examNo":50,"q":"下列那一種抗微生物之併用組合對細菌生長之抑制具有最佳之藥物相乘性？","opts":["A. sulfadiazine-sulfamethoxazole","B. sulfadiazine-trimethoprim","C. trimethoprim-ormetoprim","D. sulafasalazine-sulfaguanindine"],"ans":1,"exp":"Sulfadiazine 抑制二氫蝶酸合成酶（DHPS），trimethoprim 抑制二氫葉酸還原酶（DHFR），兩者阻斷細菌葉酸合成途徑中的連續兩個步驟，產生序列阻斷（sequential block）而達到藥物相乘（synergism）效果，抗菌效力大幅提升。","we":["錯誤：兩種磺胺劑（sulfadiazine+sulfamethoxazole）均抑制DHPS（二氫蝶酸合成酶），作用相同步驟，效果為相加而非相乘。","","錯誤：Trimethoprim和ormetoprim均為DHFR（二氫葉酸還原酶）抑制劑，作用相同步驟，效果為相加，不如磺胺+DHFR抑制劑的序列阻斷有相乘效果。","錯誤：此組合中兩種均為磺胺類，抑制相同酵素（DHPS），不具序列阻斷的相乘效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_051","year":2018,"roc_year":107,"session":"2","examNo":51,"q":"抗微生物藥物enrofloxacin及danofloxacin經常被使用於治療牛那一組織之感染症？","opts":["A. 消化道","B. 呼吸道","C. 關節軟組織","D. 生殖系統"],"ans":1,"exp":"Enrofloxacin 和 danofloxacin 均為氟喹諾酮類（fluoroquinolone），在肺組織中濃度高，對引起牛呼吸道疾病（Bovine Respiratory Disease, BRD）的病原菌（如 Mannheimia haemolytica、Pasteurella multocida、Mycoplasma bovis）具有良好活性，為牛呼吸道感染的主要適應症。","we":["錯誤：Fluoroquinolones用於牛呼吸道感染（BRD）優先，消化道感染通常使用磺胺或tetracycline。","","錯誤：關節感染可能使用fluoroquinolones，但其最主要用途是牛的呼吸道疾病（BRD）。","錯誤：生殖系統感染（如子宮炎）通常使用penicillin或tetracycline，fluoroquinolone的主要獸醫適應症為呼吸道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_052","year":2018,"roc_year":107,"session":"2","examNo":52,"q":"頭孢菌素類（cephalosporins）藥物之作用機制，主要為抑制細菌那一成分之合成？","opts":["A. 細胞壁","B. 細胞膜","C. 核酸DNA","D. 蛋白質"],"ans":0,"exp":"頭孢菌素類（cephalosporins）為 β-內醯胺類抗生素，與細菌青黴素結合蛋白（PBPs）結合，抑制肽聚糖（peptidoglycan）轉肽酶活性，阻礙細菌細胞壁合成，最終導致細菌死亡。","we":["","錯誤：細胞膜為polymyxins（如colistin、polymyxin B）的作用標靶，頭孢菌素不破壞細胞膜。","錯誤：核酸DNA合成抑制為fluoroquinolones（抑制DNA gyrase）和nitroimidazoles的機制，不是頭孢菌素。","錯誤：蛋白質合成抑制為aminoglycosides、tetracyclines、macrolides、chloramphenicol的機制，不是頭孢菌素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_053","year":2018,"roc_year":107,"session":"2","examNo":53,"q":"下列那一臨床症狀為碳青黴烯類（carbapenems）抗生素對中樞神經系統產生之主要不良反應？","opts":["A. 嗜睡","B. 躁動不安","C. 視幻覺","D. 痙攣"],"ans":3,"exp":"碳青黴烯類抗生素（尤其是 imipenem）可干擾 GABA-A 受體功能，降低 GABA 介導的中樞神經抑制作用，導致神經系統過度興奮，最嚴重且最具特徵性的中樞神經毒性表現為痙攣（seizures）。","we":["錯誤：嗜睡不是碳青黴烯類（如imipenem）的主要CNS不良反應；碳青黴烯類可透過干擾GABA受體引起CNS興奮而非抑制。","錯誤：躁動不安雖可見，但不是碳青黴烯類CNS毒性的最主要症狀；痙攣是最嚴重且最具特徵性的CNS不良反應。","錯誤：視幻覺不是碳青黴烯類的特徵性CNS副作用，痙攣才是其最受關注的CNS毒性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_054","year":2018,"roc_year":107,"session":"2","examNo":54,"q":"Chloramphenicol引起再生不良性貧血，與其具有下列何種結構有關？","opts":["A. sulfur group","B. para-nitro group","C. aromatic group","D. carboxyl group"],"ans":1,"exp":"Chloramphenicol 分子中的 para-nitrophenyl（對硝基苯基）基團在體內代謝後可產生亞硝基苯（nitroso benzene）等活性代謝物，這些毒性代謝物可直接損傷骨髓造血幹細胞，引起特異質性（idiosyncratic）再生不良性貧血（aplastic anemia）。","we":["錯誤：硫基並非chloramphenicol引起再生不良性貧血的關鍵結構；para-nitrophenyl基團才是毒性關鍵。","","錯誤：芳香環本身廣泛存在於許多藥物，不是chloramphenicol特異性引起再生不良性貧血的結構基礎。","錯誤：羧基存在於許多有機化合物，不是chloramphenicol引起骨髓毒性的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_055","year":2018,"roc_year":107,"session":"2","examNo":55,"q":"Tilmicosin造成心血管毒性之原因，與下列何者於心肌細胞內濃度改變有關？","opts":["A. Ca2+","B. Mg2+","C. Na+","D. K\r +"],"ans":0,"exp":"Tilmicosin 為大環內酯類抗生素，其心臟毒性的機制與心肌細胞內鈣離子（Ca²⁺）濃度異常升高有關。Tilmicosin 可抑制心肌細胞的 Na⁺/Ca²⁺ 交換和鈣泵功能，導致細胞內 Ca²⁺ 過載，引起心跳減慢、心收縮力下降等心臟毒性，豬和人對此毒性尤為敏感。","we":["","錯誤：Mg²⁺的改變不是tilmicosin心臟毒性的主要機制；心肌細胞內鈣離子濃度增加才是導致心臟毒性的關鍵。","錯誤：Na⁺改變不是tilmicosin心臟毒性的主要機制；鈣超載（Ca²⁺）才是主要原因。","錯誤：K⁺不是tilmicosin心臟毒性的主要相關離子；tilmicosin主要影響心肌細胞的鈣離子平衡。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_056","year":2018,"roc_year":107,"session":"2","examNo":56,"q":"下列何者不屬於macrolides？","opts":["A. oleandomycin","B. rokitamycin","C. gamithromycin","D. pirlimycin"],"ans":3,"exp":"Pirlimycin 屬於林可醯胺類（lincosamide）抗生素，不是大環內酯類（macrolides），主要用於牛乳房炎的治療。Oleandomycin、rokitamycin 及 gamithromycin 均為大環內酯類抗生素（作用於細菌 50S 核糖體次單位）。","we":["錯誤：Oleandomycin為大環內酯類（macrolide）抗生素，作用於細菌50S核糖體。","錯誤：Rokitamycin為大環內酯類抗生素，用於呼吸道感染。","錯誤：Gamithromycin為大環內酯類（半合成）抗生素，用於牛呼吸道疾病（BRD）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_057","year":2018,"roc_year":107,"session":"2","examNo":57,"q":"下列何者與tiamulin的抗菌作用機制相似？","opts":["A. bacitracin","B. neomycin","C. tylosin","D. vancomycin"],"ans":2,"exp":"Tiamulin 為截短侧耳素類（pleuromutilin）抗生素，作用於細菌 50S 核糖體次單位的肽基轉移酶中心（PTC），抑制蛋白質合成。Tylosin 為大環內酯類抗生素，同樣作用於 50S 核糖體，兩者作用機制相似，均抑制細菌蛋白質合成。","we":["錯誤：Bacitracin抑制細菌細胞壁中undecaprenyl pyrophosphate的脫磷酸化，干擾肽聚糖合成，與tiamulin作用機制不同。","錯誤：Neomycin為aminoglycoside，作用於30S核糖體次單位，與tiamulin作用於50S核糖體的機制不同。","","錯誤：Vancomycin為糖肽類抗生素，抑制肽聚糖合成中D-Ala-D-Ala末端的轉肽酶作用，與tiamulin機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_058","year":2018,"roc_year":107,"session":"2","examNo":58,"q":"下列何者與novobiocin的抗菌機制相似？","opts":["A. azithromycin","B. chloramphenicol","C. enrofloxacin","D. trimethoprim"],"ans":2,"exp":"Novobiocin 與 DNA 旋轉酶（DNA gyrase，即拓樸異構酶 II）的 B 次單位結合，抑制 ATP 水解，阻礙 DNA 超螺旋鬆解。Enrofloxacin（氟喹諾酮類）同樣抑制 DNA gyrase（作用於 A 次單位），兩者均干擾細菌 DNA 複製，機制最為相似。","we":["錯誤：Azithromycin為大環內酯類，抑制細菌50S核糖體，不作用於DNA gyrase。","錯誤：Chloramphenicol抑制50S核糖體的肽基轉移酶，與novobiocin（DNA拓樸異構酶）機制不同。","","錯誤：Trimethoprim抑制二氫葉酸還原酶（DHFR），干擾葉酸合成，不作用於DNA gyrase。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_059","year":2018,"roc_year":107,"session":"2","examNo":59,"q":"下列何者長期投藥易引起神經毒性的症狀？","opts":["A. erythromycin","B. doxycycline","C. florfenicol","D. metronidazole"],"ans":3,"exp":"Metronidazole（甲硝唑）長期高劑量使用可引起神經毒性，表現為周邊神經病變（peripheral neuropathy）及小腦毒性（cerebellar toxicity），症狀包括共濟失調（ataxia）、眼球震顫（nystagmus）及四肢虛弱，犬貓均有報告。","we":["錯誤：Erythromycin長期使用的主要問題為胃腸道副作用（噁心、嘔吐），神經毒性不是其特徵。","錯誤：Doxycycline長期使用相對安全，主要副作用為胃腸道不適和光敏感，神經毒性不顯著。","錯誤：Florfenicol為氟甲砜黴素（chloramphenicol類似物），長期使用主要關注骨髓毒性（雖較chloramphenicol弱），神經毒性非其特徵。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_060","year":2018,"roc_year":107,"session":"2","examNo":60,"q":"下列何者因會引起致命性的肺臟毒性，不應使用於貓？","opts":["A. chlorambucil","B. cisplatin","C. 5-fluorouracil","D. carboplatin"],"ans":1,"exp":"Cisplatin 在貓禁用，因為貓對 cisplatin 非常敏感，投藥後可引起致命性肺水腫（pulmonary edema）和胸腔積液（pleural effusion）。相比之下，carboplatin 毒性較低，可在貓安全使用；5-fluorouracil 在貓雖然也禁用，但主要引起致命性中樞神經毒性而非肺臟毒性。","we":["錯誤：Chlorambucil可相對安全地用於貓的淋巴瘤等腫瘤治療，肺臟毒性不是其主要禁忌。","","錯誤：5-fluorouracil（5-FU）在貓確實禁用，但主要原因是致命性的中樞神經毒性（cerebellar toxicity），不是肺臟毒性。","錯誤：Carboplatin為cisplatin的類似物但毒性較低，在貓有臨床使用（較cisplatin安全），不以肺臟毒性著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_061","year":2018,"roc_year":107,"session":"2","examNo":61,"q":"有關長期投予低劑量cyclophosphamide（CY），進行metronomic low-dose chemotherapy之敘述，下列何者\r 錯誤？","opts":["A. 可應用於因高劑量CY療程產生抗藥性腫瘤細胞的治療","B. 可活化對CY具抗藥性的腫瘤細胞進入細胞週期，並直接殺滅細胞","C. 可降低調節性T細胞（regulatory T cells）的活性，改善宿主抗腫瘤免疫反應","D. 連續低劑量CY可抑制腫瘤血管生成（angiogenesis）"],"ans":1,"exp":"本題問節拍性化療（metronomic low-dose chemotherapy）中何者錯誤。選項B「可活化對CY具抗藥性的腫瘤細胞進入細胞週期，並直接殺滅細胞」為錯誤描述——節拍性化療的主要機制是抑制腫瘤血管生成（anti-angiogenesis）和抑制調節性T細胞（Treg）活性，並非直接活化抗藥性腫瘤細胞進入細胞週期殺滅之。","we":["錯誤：持續低劑量節拍性化療的主要標靶為腫瘤新生血管的內皮細胞，而非直接克服高劑量CY療程產生的抗藥性腫瘤細胞。","","錯誤：降低調節性T細胞（Treg）的活性確為節拍性CY的機制之一，可改善宿主抗腫瘤免疫，但非本題的錯誤描述。","錯誤：抑制腫瘤血管生成也是節拍性化療的重要機制，屬於正確描述，非本題所問的錯誤項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_062","year":2018,"roc_year":107,"session":"2","examNo":62,"q":"有關piroxicam之敘述，下列何者錯誤？","opts":["A. 可抑制cyclooxygenase的活性","B. 可作為犬乳腺癌的輔助療法藥物","C. 經口投藥，由腸道吸收良好","D. 藥物主要經由膽汁排泄"],"ans":3,"exp":"Piroxicam 為非選擇性 COX 抑制劑（NSAID），口服吸收良好，具有抗腫瘤輔助療效（尤其對犬移行上皮癌及乳腺癌），主要經肝臟代謝後由腎臟（尿液）排泄，而非膽汁排泄，故選項 D 描述錯誤。","we":["此為正確描述：Piroxicam為非選擇性COX-1/COX-2抑制劑，抑制前列腺素合成，不符合「錯誤」描述。","此為正確描述：Piroxicam因抑制COX-2（腫瘤相關前列腺素）而用於犬移行上皮細胞癌和乳腺癌的輔助治療，不符合「錯誤」描述。","此為正確描述：Piroxicam口服後由腸胃道吸收良好，生體可用率高，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_063","year":2018,"roc_year":107,"session":"2","examNo":63,"q":"水產動物感染下列何種細菌，較適合以amoxicillin治療？","opts":["A. Aeromonas hydrophila","B. Streptococcus spp.","C. Vibrio spp.","D. Yersinia ruckeri"],"ans":1,"exp":"Amoxicillin 為廣效 β-內醯胺類抗生素，對革蘭氏陽性菌（如 Streptococcus spp.）具有優良抗菌活性。在水產醫學中，Streptococcus 感染（如魚鏈球菌病）對 amoxicillin 敏感，為最適合的治療選擇。","we":["錯誤：Aeromonas hydrophila常對amoxicillin具抗藥性（產β-lactamase），不是最適合用amoxicillin治療的水產病原。","","錯誤：Vibrio spp.通常對氨苄青黴素類（amoxicillin）有一定抗藥性，不是最適合用amoxicillin治療的水產病原。","錯誤：Yersinia ruckeri（鮭魚赤口病）通常需要使用tetracycline或quinolone，對amoxicillin敏感性較差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_064","year":2018,"roc_year":107,"session":"2","examNo":64,"q":"下列何種抗生素具有陽離子界面活性劑的作用？","opts":["A. bacitracin","B. polymyxins","C. rifampin","D. tylosin"],"ans":1,"exp":"Polymyxins（多黏菌素類，如 polymyxin B、colistin）具有陽離子多肽結構，作用類似陽離子界面活性劑，可與革蘭氏陰性菌外膜的脂多醣（LPS）中的磷酸基結合，破壞外膜完整性，造成細胞內容物外漏而殺菌。","we":["錯誤：Bacitracin為多肽類抗生素，抑制細胞壁合成，不具有陽離子界面活性劑的作用機制。","","錯誤：Rifampin抑制細菌RNA聚合酶，不具有界面活性劑特性。","錯誤：Tylosin為大環內酯類抗生素，抑制50S核糖體蛋白質合成，不是陽離子界面活性劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_065","year":2018,"roc_year":107,"session":"2","examNo":65,"q":"下列何者適合使用nalidixic acid來治療？","opts":["A. 革蘭氏陽性菌","B. 革蘭氏陰性菌","C. 立克次體","D. 黴漿菌"],"ans":1,"exp":"Nalidixic acid 為早期窄效喹諾酮類（narrow-spectrum quinolone），主要對革蘭氏陰性菌有效，通過抑制 DNA gyrase（拓樸異構酶 II）阻礙細菌 DNA 複製。對革蘭氏陽性菌、細胞內寄生的立克次體及缺乏細胞壁的黴漿菌效果均不佳。","we":["錯誤：Nalidixic acid對革蘭氏陽性菌效果差；早期喹諾酮類（如nalidixic acid）幾乎只對革蘭氏陰性菌有效。","","錯誤：立克次體為細胞內寄生菌，nalidixic acid細胞穿透力有限，不是治療立克次體感染的藥物；首選為doxycycline。","錯誤：黴漿菌缺乏細胞壁，nalidixic acid對其效果不佳；macrolides或tetracyclines是治療黴漿菌的首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_066","year":2018,"roc_year":107,"session":"2","examNo":66,"q":"Furosemide可用以降低下列何種抗腫瘤藥物引起出血性膀胱炎之風險？","opts":["A. carmustine","B. cyclophosphamide","C. melphalan","D. methotrexate"],"ans":1,"exp":"Cyclophosphamide（CY）在體內代謝產生的丙烯醛（acrolein）為引起出血性膀胱炎的主要毒素，丙烯醛在尿液中濃縮並刺激膀胱黏膜。使用 furosemide 強迫利尿可增加尿液產生，稀釋尿中丙烯醛濃度，從而降低出血性膀胱炎的風險。","we":["錯誤：Carmustine（BCNU）的主要毒性為肺毒性和骨髓抑制，出血性膀胱炎不是其特徵性問題，furosemide不用於此目的。","","錯誤：Melphalan（氮芥類）的主要毒性為骨髓抑制，不特別引起出血性膀胱炎。","錯誤：Methotrexate的腎毒性通過充分水化和鹼化尿液來預防，出血性膀胱炎不是其主要毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_067","year":2018,"roc_year":107,"session":"2","examNo":67,"q":"下列何者的主要抗菌機制為阻斷聚合物從細胞膜釋出，進而抑制細菌細胞壁合成？","opts":["A. polymyxin B","B. vancomycin","C. novobiocin","D. virginiamycin"],"ans":1,"exp":"Vancomycin 為糖肽類抗生素，與細胞壁前驅物末端的 D-丙胺酸-D-丙胺酸（D-Ala-D-Ala）結合，立體阻礙轉糖基酶和轉肽酶的作用，阻斷肽聚糖聚合物從細胞膜釋出及交聯，進而抑制細菌細胞壁合成。","we":["錯誤：Polymyxin B破壞革蘭氏陰性菌的脂多醣外膜，為陽離子界面活性劑作用，不抑制肽聚糖聚合物的釋放。","","錯誤：Novobiocin抑制DNA旋轉酶（DNA gyrase，類似quinolones），不作用於細胞壁合成的轉糖基化步驟。","錯誤：Virginiamycin（鏈黴黴素A族）為鏈陽菌素類，作用於50S核糖體，不抑制肽聚糖合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_068","year":2018,"roc_year":107,"session":"2","examNo":68,"q":"下列何者為抑制昆蟲幾丁質生成劑？","opts":["A. diflubenzuron","B. rotenone","C. permethrin","D. fenvalerate"],"ans":0,"exp":"Diflubenzuron 為苯甲醯脲類（benzoylurea）昆蟲生長調節劑（IGR），透過抑制幾丁質合成酶（chitin synthase）阻斷幾丁質（chitin）的生合成，使昆蟲蛻皮時無法形成新外骨骼而死亡。","we":["","錯誤：Rotenone為魚藤酮，抑制昆蟲和其他生物的線粒體電子傳遞鏈複合體I，不抑制幾丁質合成。","錯誤：Permethrin為擬除蟲菊酯類（pyrethroid），阻斷電位依賴性鈉離子通道，不是幾丁質合成抑制劑。","錯誤：Fenvalerate為擬除蟲菊酯類，同樣作用於鈉離子通道，不具幾丁質抑制活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_069","year":2018,"roc_year":107,"session":"2","examNo":69,"q":"下列何者無法殺滅肝吸蟲？","opts":["A. clorsulon","B. mitotane","C. albendazole","D. praziquantel"],"ans":1,"exp":"Mitotane（o,p'-DDD）為腎上腺皮質抑制劑，用於治療犬腎上腺皮質功能亢進症（Cushing's disease）或腎上腺皮質腺癌，對肝吸蟲完全無效。Clorsulon、albendazole 及 praziquantel 均為有效的抗肝吸蟲藥物。","we":["錯誤：Clorsulon抑制肝片吸蟲的糖解酵素，為治療大動物肝片吸蟲的有效藥物。","","錯誤：Albendazole（苯并咪唑類）可有效治療成熟肝片吸蟲感染，抑制微管蛋白聚合。","錯誤：Praziquantel對多種吸蟲（包括肝吸蟲）有效，增加Ca²⁺通透性導致蟲體痙攣和死亡。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_070","year":2018,"roc_year":107,"session":"2","examNo":70,"q":"Nystatin主要用途為治療下列何者之感染？","opts":["A. 小芽孢癬菌","B. 念珠菌","C. 麴菌","D. 組織漿菌"],"ans":1,"exp":"Nystatin 為多烯類抗真菌藥，與真菌細胞膜的麥角固醇（ergosterol）結合，形成通道造成細胞膜通透性增加，主要用於治療念珠菌（Candida spp.）感染，包括口腔念珠菌病（thrush）和腸道念珠菌感染，毒性大不適合全身性投藥。","we":["錯誤：小芽孢癬菌（皮癬菌）引起的皮膚真菌病使用局部或口服抗癬藥（如griseofulvin、terbinafine），nystatin對皮癬菌效果差。","","錯誤：麴菌（Aspergillus）感染通常使用amphotericin B、itraconazole或voriconazole，nystatin對麴菌的全身感染效果不佳。","錯誤：組織漿菌病（Histoplasmosis）使用itraconazole或amphotericin B治療，不是nystatin的適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_071","year":2018,"roc_year":107,"session":"2","examNo":71,"q":"有關imidocarb dipropionate之敘述，下列何者錯誤？","opts":["A. 可經口投予，不能注射投藥","B. 干擾原蟲DNA之複製","C. 可用於治療犬之焦蟲症與肝簇蟲症","D. 不可使用於懷孕動物"],"ans":0,"exp":"Imidocarb dipropionate 為芳香族脒類（aromatic diamidine）抗原蟲藥，標準給藥途徑為皮下注射（SC）或肌肉注射（IM），不能口服給藥（口服生體可用率差），故選項A「可經口投予，不能注射投藥」描述錯誤。","we":["","此為正確描述：Imidocarb結合至原蟲DNA，干擾其複製，為其抗原蟲作用機制，不符合「錯誤」描述。","此為正確描述：Imidocarb用於治療犬焦蟲症（Babesia spp.）和肝簇蟲症（Hepatozoon spp.），不符合「錯誤」描述。","此為正確描述：Imidocarb不建議使用於懷孕動物，有致畸胎風險，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_072","year":2018,"roc_year":107,"session":"2","examNo":72,"q":"下列何者為amphotericin B之分類？","opts":["A. 巨環內酯類抗生素","B. 多烯巨環內酯類抗生素","C. 胺基醣苷體類抗生素","D. 嘧啶類抗生素"],"ans":1,"exp":"Amphotericin B 為多烯巨環內酯類抗生素（polyene macrolide antibiotic），其分子結構含有多個共軛雙鍵（polyene）的大環內酯骨架。其作用機制為與真菌細胞膜上的麥角固醇結合，形成離子通道，破壞細胞膜完整性。","we":["錯誤：一般巨環內酯類（macrolides如erythromycin）抑制細菌50S核糖體，amphotericin B屬於含多個共軛雙鍵的特殊多烯巨環結構。","","錯誤：胺基醣苷體類（aminoglycosides如gentamicin）作用於細菌30S核糖體，與amphotericin B的化學結構和機制完全不同。","錯誤：嘧啶類（如flucytosine）為pyrimidine類似物，干擾真菌DNA和RNA合成，不是amphotericin B的分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_073","year":2018,"roc_year":107,"session":"2","examNo":73,"q":"下列何者為皮膚黴菌症之治療劑？","opts":["A. clindamycin","B. erythromycin","C. neomycin","D. natamycin"],"ans":3,"exp":"Natamycin（匹馬菌素）為多烯類抗真菌藥，用於局部治療皮膚及眼科真菌感染（皮膚黴菌症），可有效對抗皮癬菌（dermatophytes）及念珠菌。Clindamycin、erythromycin 及 neomycin 均為抗細菌藥物，無抗真菌活性。","we":["錯誤：Clindamycin為林可醯胺類抗菌素，用於革蘭氏陽性菌感染，不是抗黴菌藥。","錯誤：Erythromycin為大環內酯類抗菌素，用於敏感菌感染，不用於皮膚黴菌症治療。","錯誤：Neomycin為aminoglycoside類抗菌素，用於局部細菌感染，不具抗真菌活性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_074","year":2018,"roc_year":107,"session":"2","examNo":74,"q":"下列何者為硫代化合物之有機磷製劑？","opts":["A. coumaphos","B. imidocarb","C. tetrachlorvinphos","D. dichlorvos"],"ans":0,"exp":"Coumaphos 為硫代磷酸酯型有機磷化合物（含 P=S 硫代結構），需在體內活化為氧類似物（oxon form）後才發揮抑制膽鹼酯酶的活性，常用於牛的外寄生蟲（蜱、蟎、蝨等）防治。Dichlorvos 及 tetrachlorvinphos 為磷酸酯型（P=O），imidocarb 則非有機磷。","we":["","錯誤：Imidocarb為苯甲脒類（amidine）抗原蟲藥，不是有機磷化合物，也不含硫代化學結構。","錯誤：Tetrachlorvinphos為含氯的有機磷，但其P=O型（磷酸酯），非P=S型的硫代有機磷。","錯誤：Dichlorvos（DDVP）為磷酸酯型（P=O）有機磷，非硫代（P=S）型有機磷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_075","year":2018,"roc_year":107,"session":"2","examNo":75,"q":"下列何者可用於防治牛球蟲症？","opts":["A. amprolium","B. bithionol","C. coumaphos","D. kamala"],"ans":0,"exp":"Amprolium 為維生素 B1（硫胺素，thiamine）結構類似物，競爭性拮抗球蟲對硫胺的吸收，干擾球蟲的能量代謝，常添加於飼料中防治牛（犢牛）及禽類球蟲症（coccidiosis）。","we":["","錯誤：Bithionol為抗吸蟲和絛蟲藥，不用於球蟲症（coccidiosis）的防治。","錯誤：Coumaphos為有機磷殺外寄生蟲劑，用於蟎蟲、蝨子控制，不用於防治球蟲症。","錯誤：Kamala用於驅絛蟲（傳統藥材），不用於球蟲症防治。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_076","year":2018,"roc_year":107,"session":"2","examNo":76,"q":"下列何者是橡樹葉中可能導致反芻動物中毒的成分？","opts":["A. tannic acid","B. alkaloid","C. glycoprotein","D. glycoside"],"ans":0,"exp":"橡樹（oak）葉及果實含有大量鞣酸（tannic acid）及其水解產物（如沒食子酸、焦性沒食子酸），反芻動物（牛、羊）大量攝食後可引起腎小管壞死（renal tubular necrosis）、胃腸炎及肝毒性等中毒症狀。","we":["","錯誤：生物鹼（alkaloids）存在於許多有毒植物（如nightshade），但橡樹葉中毒的主要成分為鞣酸（tannic acid）及其水解產物。","錯誤：糖蛋白（glycoprotein）不是橡樹葉中毒的主要毒性成分。","錯誤：配糖體（glycoside）在部分植物（如洋地黃）中有毒，但橡樹葉中毒主要由鞣酸引起。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_077","year":2018,"roc_year":107,"session":"2","examNo":77,"q":"下列何者為牛羊因殺鼠劑warfarin中毒的解毒劑？","opts":["A. phytonadione","B. ascorbic acid","C. menadione","D. Ca-EDTA"],"ans":0,"exp":"Warfarin 為維生素 K 拮抗劑，抑制維生素 K 環氧化物還原酶（VKOR），使凝血因子 II、VII、IX、X 無法活化。解毒劑為植物性維生素 K1（phytonadione，phylloquinone），可直接補充活性維生素 K，促進凝血因子合成，快速逆轉抗凝血效果。","we":["","錯誤：Ascorbic acid（維生素C）有輕微抗氧化作用，但不能有效逆轉warfarin抗凝血劑引起的凝血因子缺乏。","錯誤：Menadione（維生素K3）雖可作為Vit K補充，但對牛羊等大型動物，phytonadione（Vit K1）起效更快且效果更確定，非首選。","錯誤：Ca-EDTA為鈣螯合劑，用於鉛中毒解毒，不能逆轉warfarin的抗凝血效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_078","year":2018,"roc_year":107,"session":"2","examNo":78,"q":"下列何者為肉毒桿菌毒素（botulinum toxin）的中毒機制？","opts":["A. 阻斷acetylcholine之釋放","B. 抑制acetylcholine esterase活性","C. 抑制monoamine oxidase活性","D. 增加神經細胞鈉離子的通透性"],"ans":0,"exp":"肉毒桿菌毒素（botulinum toxin）為鋅依賴性內肽酶，可特異性切割神經肌肉接頭突觸前膜的 SNARE 蛋白（如 SNAP-25、synaptobrevin、syntaxin），阻斷乙醯膽鹼（ACh）囊泡與突觸前膜的融合，使 ACh 無法釋放，導致弛緩性麻痺（flaccid paralysis）。","we":["","錯誤：抑制acetylcholinesterase（如有機磷中毒）使ACh積聚於突觸，效果與肉毒桿菌毒素（減少ACh釋放）相反。","錯誤：抑制單胺氧化酶（MAO）會增加兒茶酚胺和血清素濃度，與肉毒桿菌毒素的機制完全不同。","錯誤：增加神經細胞鈉離子通透性為veratridine等毒素的機制，肉毒桿菌毒素不影響Na⁺通道，而是切割SNARE蛋白阻止ACh釋放。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_079","year":2018,"roc_year":107,"session":"2","examNo":79,"q":"有關動物用藥停藥期之敘述，下列何者錯誤？","opts":["A. 停藥期採用之原則應按實足日數計算","B. 合併使用2種動物用藥，停藥期以其中最長者為準","C. 停藥期等於藥物殘留期間","D. 因動物或給藥途徑不同，停藥期可能不同"],"ans":2,"exp":"停藥期（withdrawal period）是指最後一次給藥至動物可屠宰供食用（或牛乳可供人食用）的最短間隔時間，確保可食用組織中藥物殘留量低於最高殘留限量（MRL）。停藥期不等於藥物殘留期間（residue depletion period），而是考量安全邊際後訂定的法定期限，故選項 C 描述錯誤。","we":["此為正確描述：停藥期以實足日數計算，確保可食用組織中藥物殘留量降至最高殘留限量（MRL）以下，不符合「錯誤」描述。","此為正確描述：合併用藥時，停藥期取最長者，以確保所有藥物均已消散至安全水平，不符合「錯誤」描述。","","此為正確描述：不同動物的代謝能力和給藥途徑影響藥物消散速率，停藥期因此可能不同，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_藥理_1072_080","year":2018,"roc_year":107,"session":"2","examNo":80,"q":"牛隻因尿素（urea）添加不當中毒，除立即停止餵食尿素，並可給予下列何者治療？","opts":["A. acetic acid","B. urease","C. ammonia","D. calcium hydroxide"],"ans":0,"exp":"牛隻尿素（urea）中毒機制：瘤胃中脲酶細菌將尿素分解為大量氨（NH3），氨在鹼性環境下以非離子型（脂溶性）穿過瘤胃壁進入血液，引起高氨血症和神經毒性。治療：灌服稀醋酸（acetic acid）可降低瘤胃 pH 值，抑制脲酶活性並將 NH3 轉化為 NH4⁺（離子型，不易吸收），緩解中毒。","we":["","錯誤：Urease（尿素酶）將尿素分解為氨（NH3），投予urease反而會加速產氨，加重中毒，應當抑制urease活性，而非投予urease。","錯誤：投予氨（ammonia）顯然會加重氨中毒的症狀，應當降低瘤胃氨濃度，而非補充。","錯誤：氫氧化鈣（calcium hydroxide）為鹼性物質，會升高瘤胃pH值，促進尿素水解成氨，反而加重尿素中毒，不是正確治療措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_001","year":2019,"roc_year":108,"session":"1","examNo":1,"q":"Phenoxybezamine與α1 受體的結合可被視為：","opts":["A. 全致效劑（full agonist）","B. 部分致效劑（partial agonist）","C. 競爭性拮抗劑（competitive antagonist）","D. 非競爭性拮抗劑（non-competitive antagonist）"],"ans":3,"exp":"Phenoxybenzamine為不可逆的α腎上腺素受體拮抗劑，以共價鍵與受體結合，不能被高濃度激動劑取代，屬於非競爭性拮抗劑（non-competitive antagonist）。其特徵為：(1)結合不可逆；(2)即使增加激動劑濃度也無法完全恢復最大反應；(3)使量效曲線最大反應（Emax）下移。","we":["錯誤：全致效劑與受體結合後產生最大藥理反應，phenoxybenzamine與受體結合後阻斷其活化，為拮抗劑而非致效劑。","錯誤：部分致效劑與受體結合後只產生部分最大反應，phenoxybenzamine結合後不活化受體，是拮抗劑。","錯誤：競爭性拮抗劑可被高濃度激動劑取代，呈現可逆性，而phenoxybenzamine以共價鍵不可逆結合，屬非競爭性拮抗劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_002","year":2019,"roc_year":108,"session":"1","examNo":2,"q":"有關藥品命名的敘述，下列何者錯誤？","opts":["A. 局部麻醉劑常以「caine」結尾","B. β-blocker常以「olol」結尾","C. 生物鹼（alkaloids）常以「ine」結尾","D. 由Streptomyces所產生的抗生素，常以「micin」結尾"],"ans":3,"exp":"由Streptomyces（鏈黴菌）所產生的抗生素命名以'-mycin'結尾（如streptomycin、erythromycin），而以'-micin'結尾者（如gentamicin、tobramycin）來自Micromonospora。故D選項敘述錯誤。","we":["此為正確描述：局部麻醉劑的通用命名以-caine結尾（如lidocaine、procaine），不符合「錯誤」描述。","此為正確描述：β腎上腺素受體阻斷劑以-olol結尾（如propranolol、atenolol），不符合「錯誤」描述。","此為正確描述：生物鹼多以-ine結尾（如morphine、atropine、cocaine），不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_003","year":2019,"roc_year":108,"session":"1","examNo":3,"q":"有關藥品名稱的敘述，下列何者錯誤？","opts":["A. meperidine和pethidine為相同的藥品","B. sulfamethazine和sulfadimidine為相同的藥品","C. acetaminophen和paracetamol為相同的藥品","D. ergonovine和ergometrine為不同的藥品"],"ans":3,"exp":"Ergonovine（麥角新鹼）與ergometrine為同一藥品的不同命名，ergonovine為美式名，ergometrine為英式名，兩者完全相同。故D選項「不同的藥品」敘述錯誤。","we":["此為正確描述：Meperidine和pethidine為同一鴉片類止痛藥的美式和英式命名，不符合「錯誤」描述。","此為正確描述：Sulfamethazine（美式）和sulfadimidine（英式）為同一磺胺劑，不符合「錯誤」描述。","此為正確描述：Acetaminophen和paracetamol為同一解熱鎮痛藥的不同命名，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_004","year":2019,"roc_year":108,"session":"1","examNo":4,"q":"有關劑型的敘述，下列何者錯誤？","opts":["A. 栓劑的溶解常和溫度相關","B. 口服磨粉後的腸衣錠不能增加生體可用率（bioavailability）","C. 1號膠囊的容量為0.5mL","D. 水溶性軟膏的基質常為petrolatum"],"ans":3,"exp":"水溶性軟膏（water-soluble ointment）的基質為親水性材料（如polyethylene glycol, PEG），而petrolatum（凡士林）為油脂性（oleaginous/lipophilic）基質，用於油性軟膏而非水溶性軟膏。故D選項敘述錯誤。","we":["此為正確描述：栓劑基質（如可可奶油）在體溫時熔化釋放藥物，溶解確實與溫度相關，不符合「錯誤」描述。","此為正確描述：磨粉腸衣錠破壞了腸溶包衣，藥物在胃中被破壞，不能增加生體可用率，不符合「錯誤」描述。","此為正確描述：1號明膠膠囊容量約0.5 mL，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_005","year":2019,"roc_year":108,"session":"1","examNo":5,"q":"有關經皮吸收（transdermal absorption）藥品的敘述，下列何者正確？","opts":["A. 增加藥品的脂溶性，必可平行增加藥品的吸收","B. 經皮膚吸收的過程中皆不會發生藥品的代謝","C. 因吸收緩慢，同一劑量的皮膚貼布常能以相同的方式用於不同種別的動物","D. Fentanyl止痛貼布現已被使用於犬、貓與馬"],"ans":3,"exp":"Fentanyl止痛貼布（transdermal patch）已商品化並被許可使用於犬、貓與馬，為臨床上重要的鴉片類鎮痛給藥方式。其他選項均有藥理學錯誤（脂溶性過高不一定增加吸收；皮膚有代謝酵素；不同種動物皮膚差異大）。","we":["錯誤：脂溶性過高的藥物滯留於皮脂層不易穿透真皮，因此增加脂溶性並不一定能線性增加經皮吸收。","錯誤：皮膚含有代謝酵素（如CYP450、酯酶），可在藥物穿越皮膚時進行代謝，並非完全無代謝作用。","錯誤：不同動物種別的皮膚厚度、密度及血流量不同，相同劑量的貼布不能同等用於所有動物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_006","year":2019,"roc_year":108,"session":"1","examNo":6,"q":"有關投藥的敘述，下列何者正確？","opts":["A. 除了靜脈注射外，其他任何給藥方式皆需要經過吸收步驟才會產生藥效","B. 若能增快胃的排空速率，必能增加吸收口服藥品的百分率","C. 投予的劑量（dose）為預測藥效的最佳方式","D. 緩釋劑型常可保持較為穩定的血中濃度"],"ans":3,"exp":"緩釋劑型（extended-release formulation）設計讓藥物緩慢釋放，可維持較為穩定的血中藥物濃度，減少血中濃度的峰谷波動，延長投藥間隔。","we":["錯誤：雖然多數非靜脈注射需要吸收步驟，但此說法過於絕對化，且與選項D的確定性相比，D更完整正確。","錯誤：加快胃排空不一定增加所有藥物的吸收百分率，如需在胃中吸收的藥物（弱酸性藥物）反而可能因排空加速而減少吸收。","錯誤：劑量不如血中藥物濃度更能預測藥效，因不同投藥途徑的生體可用率差異極大。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_007","year":2019,"roc_year":108,"session":"1","examNo":7,"q":"有關靜脈注射barbital和thiopental的敘述，下列何者正確？","opts":["A. 注射1分鐘後，barbital在腦中濃度較血中濃度為高","B. 注射1分鐘後，thiopental在腦中濃度較血中濃度為高","C. 注射1分鐘後，在腦中thiopental的濃度較barbital的濃度為高","D. barbital的脂溶性較thiopental為高"],"ans":2,"exp":"Thiopental（thiopentone）脂溶性極高，靜脈注射後迅速分布至腦部（高血流量+高脂溶性），在1分鐘內腦中濃度遠高於脂溶性低的barbital。Barbital（脂溶性低）分布至腦部緩慢，腦中濃度遠低於thiopental。","we":["錯誤：Barbital（脂溶性低）靜脈注射後主要留在血漿中，分布到腦部緩慢，1分鐘內腦中濃度不會高於血中。","錯誤：Thiopental雖高度脂溶性可快速進入腦部，但注射1分鐘後，腦與血中濃度的相對關係複雜；此選項描述不如C選項精確。","","錯誤：Thiopental（thiopentone）具有極高脂溶性（硫代巴比妥），barbital則脂溶性低，兩者相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_008","year":2019,"roc_year":108,"session":"1","examNo":8,"q":"有關血漿蛋白結合特性的敘述，下列何者正確？","opts":["A. 半衰期長的藥品皆是因藥品與白蛋白以共價鍵結合","B. 與血漿蛋白結合的藥品一定無法經由腎臟排泄","C. 嚴重的低白蛋白血症不會改變藥品的白蛋白結合率","D. 在嚴重的肝硬化時，主要是降低酸性藥品和白蛋白結合"],"ans":3,"exp":"嚴重肝硬化時，肝臟合成白蛋白的能力下降，導致低白蛋白血症。白蛋白主要與酸性藥物（如苯妥英、NSAIDs、磺胺劑）結合，故肝硬化主要降低酸性藥物與白蛋白的結合率，使游離型藥物濃度增加，毒性風險上升。","we":["錯誤：大多數藥物與血漿蛋白的結合為可逆性非共價鍵（氫鍵、離子鍵），而非共價鍵；半衰期長的原因是蛋白質結合使藥物在血漿中滯留。","錯誤：腎小管分泌（tubular secretion）不需要藥物為游離型即可排泄，可主動分泌蛋白結合型藥物的一部分。","錯誤：低白蛋白血症使血漿中可供結合的白蛋白減少，游離藥物比率增加，會改變蛋白結合率。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_009","year":2019,"roc_year":108,"session":"1","examNo":9,"q":"若擬於 60 L水量之水族箱中投予 25 ppm之A藥，購得含A藥有效成分 10%之藥劑，則應加入多少mL之該藥\r 劑，始能達到預期之效果？","opts":["A. 0.15","B. 1.5","C. 15","D. 30"],"ans":2,"exp":"所需劑量計算：60 L × 25 mg/L = 1500 mg。10%藥劑含100 mg/mL，需要1500 mg ÷ 100 mg/mL = 15 mL。","we":["錯誤：60L×25mg/L=1500mg；10%藥劑含100mg/mL，需要15mL，不是0.15mL。","錯誤：1500mg÷100mg/mL=15mL，不是1.5mL（相差10倍）。","","錯誤：所需體積為1500mg÷100mg/mL=15mL，不是30mL（30mL會投予2倍劑量）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_010","year":2019,"roc_year":108,"session":"1","examNo":10,"q":"影響藥物能否穿過血腦障壁（blood-brain barrier）的主要因素為何？","opts":["A. 藥物的分子量","B. 藥物的脂溶性","C. 藥物的生體可用率","D. 藥物的排除速率"],"ans":1,"exp":"血腦障壁（BBB）由緊密連接的腦微血管內皮細胞組成，藥物主要以被動擴散方式穿越。脂溶性（lipophilicity）是決定藥物能否穿越BBB的最主要因素：脂溶性越高，穿越BBB越容易（如thiopental、diazepam）；分子量有影響但次要。","we":["錯誤：分子量影響穿越程度，但脂溶性才是決定藥物能否穿越血腦障壁的最主要因素，分子量其次。","","錯誤：生體可用率決定藥物進入體循環的比率，與能否穿越血腦障壁無直接相關。","錯誤：排除速率決定藥物在體內的持續時間，不決定藥物能否穿越血腦障壁。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_011","year":2019,"roc_year":108,"session":"1","examNo":11,"q":"生體可用率（bioavailability）愈高，代表投藥後：","opts":["A. 脂肪組織中累積愈多","B. 藥物半衰期愈長","C. 藥物分布愈廣","D. 能被吸收之藥物愈多"],"ans":3,"exp":"生體可用率（bioavailability, F）定義為投藥後到達體循環的藥物比率。生體可用率愈高，代表能被吸收進入體循環的藥物量愈多，即可利用的藥量愈多。","we":["錯誤：脂肪累積由藥物的脂溶性和分布容積決定，與生體可用率無直接關係。","錯誤：半衰期由分布容積和清除率決定（t½=0.693×Vd/CL），不直接反映生體可用率。","錯誤：藥物分布廣泛與分布容積（Vd）有關，高生體可用率表示吸收多，但不代表分布廣。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_012","year":2019,"roc_year":108,"session":"1","examNo":12,"q":"長時間使用某一藥品，藥效漸減而需增加劑量才能達到原始效果的現象稱為：","opts":["A. 成癮性（addiction）","B. 感受性（sensitivity）","C. 專一性（specificity）","D. 耐受性（tolerance）"],"ans":3,"exp":"耐受性（tolerance）指長時間使用某藥物後，相同劑量產生的藥效漸減，需不斷增加劑量才能維持原有效果。機制可能包括：受體下調（down-regulation）、代謝酵素誘導加速代謝等。","we":["錯誤：成癮性（addiction）指對藥物的心理或生理依賴，停藥後出現戒斷症狀，不單指藥效減少需增加劑量。","錯誤：感受性（sensitivity）指動物對藥物反應的程度，不是長期使用後藥效減退的現象。","錯誤：專一性（specificity）指藥物選擇性地作用於特定受體，不描述長期使用後的藥效改變。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_013","year":2019,"roc_year":108,"session":"1","examNo":13,"q":"下列何者是藥物動力學Cmax之意義？","opts":["A. 藥物之最大代謝速率","B. 藥物最大之分布容積","C. 血漿中藥物之最高濃度","D. 藥物所產生之最大效應"],"ans":2,"exp":"Cmax（最高血漿濃度，peak plasma concentration）指口服或注射後，藥物在血漿中能達到的最高濃度，是藥物動力學的重要參數之一，與藥效峰值及毒性評估相關。","we":["錯誤：藥物最大代謝速率以Vmax表示（Michaelis-Menten動力學），不是Cmax。","錯誤：分布容積以Vd表示，描述藥物在體內分布的理論體積，不是Cmax。","","錯誤：藥物最大效應以Emax表示（藥效動力學），Cmax是血漿濃度參數，不是藥效參數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_014","year":2019,"roc_year":108,"session":"1","examNo":14,"q":"使用ketamine後的麻醉恢復期，較易見的副作用為何？","opts":["A. 呼吸抑制","B. 低血壓","C. 腎毒性","D. 蹣跚興奮"],"ans":3,"exp":"Ketamine為解離性麻醉劑（dissociative anesthetic），恢復期特有副作用包括：肌肉不協調（蹣跚）、幻覺、嘔吐及興奮（emergence excitement）。這些反應在馬尤其明顯，使用benzodiazepine可減輕。","we":["錯誤：Ketamine不顯著抑制呼吸（常維持保護性反射），呼吸抑制更常見於barbiturate類麻醉劑。","錯誤：Ketamine通常增加血壓和心跳（交感神經興奮），低血壓非其主要副作用。","錯誤：腎毒性不是ketamine麻醉的特徵性副作用，aminoglycoside類抗生素及NSAIDs才常見腎毒性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_015","year":2019,"roc_year":108,"session":"1","examNo":15,"q":"下列何者不是α2\r -受體的致效劑？","opts":["A. xylazine","B. ranitidine","C. detomidine","D. medetomidine"],"ans":1,"exp":"Ranitidine為H2組織胺受體拮抗劑（histamine H2 receptor antagonist），用於抑制胃酸分泌，不屬於α2腎上腺素受體致效劑。α2受體致效劑包括xylazine、detomidine、medetomidine、clonidine等。","we":["錯誤：Xylazine為α2腎上腺素受體致效劑，廣泛用於大小動物的化學保定和鎮靜。","","錯誤：Detomidine為高選擇性α2受體致效劑，主要用於馬的鎮靜和鎮痛。","錯誤：Medetomidine為選擇性α2受體致效劑，常用於犬貓的鎮靜，其活性異構物為dexmedetomidine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_016","year":2019,"roc_year":108,"session":"1","examNo":16,"q":"下列何者對於增強肝臟P-450代謝酵素活性有最大效果？","opts":["A. amobarbital","B. secobarbital","C. pentobarbital","D. phenobarbital"],"ans":3,"exp":"Phenobarbital（苯巴比妥）為長效巴比妥類，是所有巴比妥中誘導肝臟細胞色素P-450（CYP450）酵素活性最強的藥物，長期使用可加速自身及其他藥物的代謝（如糖皮質素、甲狀腺素等），臨床上常用於治療犬的癲癇。","we":["錯誤：Amobarbital為中效巴比妥，雖有輕微CYP誘導效果，但遠不及phenobarbital強。","錯誤：Secobarbital為短效巴比妥，CYP誘導作用不如phenobarbital顯著。","錯誤：Pentobarbital有一定CYP誘導能力，但相較於phenobarbital仍較弱，phenobarbital為最強效的巴比妥類CYP誘導劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_017","year":2019,"roc_year":108,"session":"1","examNo":17,"q":"吸入性麻醉劑在肺泡中的氣體濃度下降速率愈快，則表示：","opts":["A. 生物轉換速率愈快","B. 麻醉之恢復愈快","C. 溶解度愈大","D. 麻醉劑之重分布"],"ans":1,"exp":"吸入性麻醉劑的麻醉恢復，主要靠肺部廓清（washout）——藥物從肺泡排出的速率。肺泡濃度下降愈快，代表麻醉劑從血液和組織排出愈快（與血液/氣體分配係數呈反比），麻醉恢復就愈快（如desflurane、sevoflurane恢復快；halothane恢復慢）。","we":["錯誤：肺泡濃度下降速率主要反映肺部廓清效率，而非肝臟生物轉換速率（大多數吸入麻醉劑主要由肺排出）。","","錯誤：溶解度大（如halothane）代表藥物大量溶於血液和組織，肺泡濃度下降慢，麻醉恢復慢，與本題相反。","錯誤：重分布指吸入麻醉劑從腦部再分布至其他組織（如肌肉、脂肪），是恢復初期的機制，不等同於肺泡濃度的下降速率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_018","year":2019,"roc_year":108,"session":"1","examNo":18,"q":"下列何者無法阻斷神經肌肉接合處終板電位的產生？","opts":["A. succinylcholine","B. pancuronium","C. edrophonium","D. hemicholinium"],"ans":2,"exp":"Edrophonium為可逆性乙醯膽鹼酯酶（AChE）抑制劑，使突觸間隙乙醯膽鹼濃度增加，從而增強、不是阻斷終板電位（EPP）的產生。Edrophonium常作為非去極化NMJ阻斷劑的拮抗解毒劑。","we":["錯誤：Succinylcholine為去極化型NMJ阻斷劑，持續活化N2受體造成去極化阻滯，阻斷終板電位的維持。","錯誤：Pancuronium為非去極化型NMJ阻斷劑，競爭性阻斷乙醯膽鹼，阻礙終板電位產生。","","錯誤：Hemicholinium阻斷膽鹼再攝取，使乙醯膽鹼無法充分合成，長期使用可使終板電位逐漸消失。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_019","year":2019,"roc_year":108,"session":"1","examNo":19,"q":"有關scopolamine的使用，下列何者正確？","opts":["A. 為長效型藥物","B. 可治療因motion sickness引起的嘔吐","C. 主要作用為拮抗α2 -受體","D. 最常用於貓"],"ans":1,"exp":"Scopolamine（hyoscine）為蕈毒鹼受體拮抗劑，能有效抑制前庭系統對嘔吐中樞的刺激，是治療暈動症（motion sickness）引起嘔吐的重要藥物，常製成耳後貼片使用。","we":["錯誤：Scopolamine（hyoscine）作用時間短於atropine，屬短到中效型抗膽鹼藥，非長效型。","","錯誤：Scopolamine為蕈毒鹼（muscarinic）受體拮抗劑，不拮抗α2腎上腺素受體；α2受體拮抗劑如yohimbine。","錯誤：Scopolamine在獸醫實際應用上並非最常用於貓；其最重要的特定用途為暈動症（motion sickness）的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_020","year":2019,"roc_year":108,"session":"1","examNo":20,"q":"下列何者為β1 -腎上腺素性受體活化後之主要藥理作用？","opts":["A. 散瞳","B. 抑制唾液分泌","C. 增加心跳速率","D. 抑制肝醣分解"],"ans":2,"exp":"β1受體（主要分布於心臟）活化後產生正性頻率效應（positive chronotropy）：增加竇房結自律性，心跳速率增加。同時也有正性肌力（positive inotropy）和正性傳導（positive dromotropy）效應。","we":["錯誤：散瞳由α1受體（瞳孔放大肌收縮）活化引起，不是β1受體的效果。","錯誤：抑制唾液分泌為抗膽鹼藥（阻斷M3受體）的作用，不是β1受體活化的效果。","","錯誤：肝醣分解（glycogenolysis）由β2受體（及glucagon）促進；β1受體主要作用於心臟，不是肝醣代謝的主要調節者。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_021","year":2019,"roc_year":108,"session":"1","examNo":21,"q":"下列何者為經口投予phenylephrine之主要臨床用途？","opts":["A. 解除鼻黏膜充血","B. 治療腦性高血壓","C. 治療鬱血性心衰竭","D. 收縮瞳孔治療青光眼"],"ans":0,"exp":"Phenylephrine為選擇性α1受體致效劑，口服後引起鼻腔黏膜血管收縮，減少血管充血，解除鼻塞。為常見的感冒藥（非處方藥）成分，用於解除鼻黏膜充血（nasal decongestant）。","we":["","錯誤：Phenylephrine為α1受體致效劑，會升高血壓，不用於治療高血壓；治療腦性高血壓需要降壓藥。","錯誤：鬱血性心衰竭需要正性肌力藥和利尿劑，phenylephrine升高後負荷反而不利，不是治療心衰竭的藥物。","錯誤：Phenylephrine局部滴眼可散瞳（α1活化瞳孔放大肌），不收縮瞳孔；且此為局部眼藥水用途，不是口服途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_022","year":2019,"roc_year":108,"session":"1","examNo":22,"q":"下列治療高血壓的藥物，何者之作用機制為刺激腦幹神經細胞α2接受器，因而降低交感神經活性？","opts":["A. reserpine","B. prazosin","C. guanethidine","D. clonidine"],"ans":3,"exp":"Clonidine為中樞性α2腎上腺素受體致效劑，作用於腦幹（延腦）的α2受體，減少交感神經輸出，降低周邊血管阻力和心輸出量，進而降低血壓。為人醫和獸醫均使用的抗高血壓藥。","we":["錯誤：Reserpine耗竭突觸前囊泡中的兒茶酚胺，機制為减少交感神經傳遞物質儲存，不是中樞α2受體刺激。","錯誤：Prazosin為周邊α1受體拮抗劑，阻斷血管收縮，不刺激中樞α2受體。","錯誤：Guanethidine抑制突觸前正腎上腺素的儲存和釋放，為周邊腎上腺素能神經元阻斷劑，不是中樞α2受體激動劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_023","year":2019,"roc_year":108,"session":"1","examNo":23,"q":"下列何者會抑制鈣離子流入心臟傳導系統的細胞？","opts":["A. amiodarone","B. atenolol","C. verapamil","D. flecainide"],"ans":2,"exp":"Verapamil為非二氫吡啶類鈣離子通道阻斷劑（non-DHP CCB），選擇性阻斷心臟L型鈣離子通道，抑制鈣離子流入竇房結和房室結細胞，減慢心跳、延長PR間期，用於室上性心搏過速和心房顫動的心率控制。","we":["錯誤：Amiodarone為第三類抗心律不整藥，主要阻斷鉀離子通道延長不反應期，也有其他多重機制，但非主要透過抑制鈣離子通道作用於傳導系統。","錯誤：Atenolol為選擇性β1受體阻斷劑，抑制兒茶酚胺對心臟的刺激，不直接阻斷鈣離子通道。","","錯誤：Flecainide為第一類C類抗心律不整藥，主要阻斷鈉離子通道，不以鈣通道阻斷為主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_024","year":2019,"roc_year":108,"session":"1","examNo":24,"q":"下列何者為鈣離子阻斷劑，且能使血管平滑肌擴張？","opts":["A. amlodipine","B. minoxidil","C. atenolol","D. hydralazine"],"ans":0,"exp":"Amlodipine為二氫吡啶類（dihydropyridine, DHP）鈣離子通道阻斷劑，高度選擇性作用於血管平滑肌的L型鈣通道，使血管擴張而降低血壓，對心臟傳導系統影響小。為貓高血壓的一線治療藥物。","we":["","錯誤：Minoxidil為直接作用的血管擴張劑（開放鉀離子通道），不是鈣離子阻斷劑。","錯誤：Atenolol為選擇性β1腎上腺素受體阻斷劑，不是鈣離子阻斷劑。","錯誤：Hydralazine為直接作用的動脈擴張劑（機制不明，可能涉及cGMP），不是鈣離子阻斷劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_025","year":2019,"roc_year":108,"session":"1","examNo":25,"q":"下列何者為使用enalapril後之主要藥理作用？","opts":["A. 增加心肌收縮力","B. 促進腎素（renin）分泌","C. 擴張靜脈及小動脈","D. 利尿而消除肺部積水"],"ans":2,"exp":"Enalapril為前驅藥（prodrug），在體內轉化為enalaprilat，抑制血管收縮素轉化酶（ACE）。ACE抑制後：血管收縮素II減少→小動脈擴張（後負荷降低）；醛固酮減少→靜脈擴張（前負荷降低）。同時保留緩激肽（bradykinin）促進血管擴張。","we":["錯誤：Enalapril（ACE抑制劑）不直接增加心肌收縮力；正性肌力藥如digoxin和pimobendan才增加收縮力。","錯誤：ACE抑制劑降低血管收縮素II濃度，這反而會反射性增加腎素分泌（負回饋解除），但這不是其主要藥理作用。","","錯誤：Enalapril的利尿效果是間接的（減少醛固酮→排鈉），主要藥理作用是擴張血管降低前後負荷，非直接利尿作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_026","year":2019,"roc_year":108,"session":"1","examNo":26,"q":"Chlorothiazide利尿劑主要作用於腎小管的那個部位？","opts":["A. 近曲小管（proximal tubule）","B. 收集管（collecting tubule）","C. 亨利氏環上昇端（ascending limb of the loop of Henle）","D. 遠曲小管（distal tubule）"],"ans":3,"exp":"Thiazide類利尿劑（chlorothiazide、hydrochlorothiazide）的主要作用部位為遠曲小管（distal convoluted tubule, DCT），抑制管腔側的Na-Cl共同運輸體（NCC），減少鈉和氯的再吸收，增加尿液排出。","we":["錯誤：近曲小管為碳酸酐酶抑制劑（acetazolamide）的作用部位，不是thiazide的主要作用處。","錯誤：收集管為aldosterone拮抗劑（spironolactone）和ENaC阻斷劑（amiloride、triamterene）的作用部位。","錯誤：亨利氏環上昇端為loop diuretics（furosemide）的作用部位，抑制Na-K-2Cl共同運輸體。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_027","year":2019,"roc_year":108,"session":"1","examNo":27,"q":"使用下列何種利尿劑可能引發高血鉀之副作用？","opts":["A. bumetanide","B. ethacrynic acid","C. hydrochlorothiazide","D. spironolactone"],"ans":3,"exp":"Spironolactone為醛固酮（aldosterone）受體拮抗劑，阻斷收集管醛固酮的作用，減少鈉的再吸收及鉀的排出，屬「保鉀利尿劑」，長期使用可能導致高血鉀症（hyperkalemia），在腎臟疾病患者尤其需注意。","we":["錯誤：Bumetanide（同furosemide）為loop利尿劑，排除大量Na⁺同時也排出K⁺，會造成低血鉀，不是高血鉀的原因。","錯誤：Ethacrynic acid為loop利尿劑，同樣促進鉀排泄，可能造成低血鉀，不造成高血鉀。","錯誤：Hydrochlorothiazide為噻嗪類利尿劑，促進鉀排泄，可能造成低血鉀，不造成高血鉀。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_028","year":2019,"roc_year":108,"session":"1","examNo":28,"q":"下列何者作用於亨利氏環上昇端？","opts":["A. ethacrynic acid","B. amiloride","C. spironolactone","D. triamterene"],"ans":0,"exp":"Ethacrynic acid（依他尼酸）為loop利尿劑，作用於亨利氏環上昇粗段（thick ascending limb），抑制管腔側Na-K-2Cl共同運輸體（NKCC2），是唯一非磺胺結構的loop利尿劑，可用於對furosemide過敏的患者。","we":["","錯誤：Amiloride抑制收集管上皮鈉離子通道（ENaC），不作用於亨利氏環。","錯誤：Spironolactone拮抗醛固酮受體，作用於收集管，不作用於亨利氏環上昇端。","錯誤：Triamterene抑制收集管ENaC，為保鉀利尿劑，不在亨利氏環發揮作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_029","year":2019,"roc_year":108,"session":"1","examNo":29,"q":"下列何者之作用機制主要為抑制碳酸酐酶？","opts":["A. acetazolamide","B. aminophylline","C. furosemide","D. thiazides"],"ans":0,"exp":"Acetazolamide（乙醯唑胺）為碳酸酐酶抑制劑，作用於近曲小管，抑制碳酸酐酶後，HCO₃⁻無法被再吸收，造成碳酸氫鈉和水分隨尿液排出，達到利尿效果，同時造成輕微代謝性酸血症。","we":["","錯誤：Aminophylline（茶鹼）透過抑制磷酸二酯酶和阻斷腺嘌呤受體發揮支氣管擴張及輕度利尿效果，不抑制碳酸酐酶。","錯誤：Furosemide（loop利尿劑）抑制亨利氏環上昇端Na-K-2Cl共同運輸體，不是碳酸酐酶抑制劑。","錯誤：Thiazide類利尿劑抑制遠曲小管Na-Cl共同運輸體，不是碳酸酐酶抑制劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_030","year":2019,"roc_year":108,"session":"1","examNo":30,"q":"下列何者是ranitidine促進胃腸蠕動的作用機轉？","opts":["A. 刺激腸道神經","B. 抑制乙醯膽鹼酯酶（acetylcholinesterase）","C. 阻斷組織胺（histamine）受體","D. 阻斷多巴胺（dopamine）受體"],"ans":1,"exp":"Ranitidine（H2受體拮抗劑）除了抑制胃酸分泌外，還具有輕微的乙醯膽鹼酯酶（AChE）抑制作用，使突觸間隙乙醯膽鹼增加，進而促進胃腸道平滑肌收縮、增加蠕動。這是其促進胃排空的機制，有別於metoclopramide的多巴胺阻斷機制。","we":["錯誤：直接刺激腸道神經不是ranitidine的作用機制；促進腸蠕動是透過其膽鹼酯酶抑制效果間接增加ACh。","","錯誤：Ranitidine阻斷H2組織胺受體是其抑制胃酸分泌的機制，不是促進胃腸蠕動的機制。","錯誤：阻斷多巴胺受體（如metoclopramide）可促進胃腸蠕動，但這不是ranitidine的作用機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_031","year":2019,"roc_year":108,"session":"1","examNo":31,"q":"下列影響腸胃功能的藥物中，何者最容易引起尿液滯留的副作用？","opts":["A. cimetidine","B. misoprostol","C. omeprazole","D. propantheline"],"ans":3,"exp":"Propantheline為抗膽鹼藥（quaternary ammonium antimuscarinic agent），阻斷膀胱逼尿肌（detrusor muscle）的M3蕈毒鹼受體，抑制膀胱收縮，臨床上用於治療膀胱過動症，但副作用包括尿液滯留（urinary retention），尤其在前列腺肥大動物需慎用。","we":["錯誤：Cimetidine為H2受體阻斷劑，抑制胃酸，泌尿道副作用不顯著。","錯誤：Misoprostol為前列腺素E1類似物，保護胃黏膜並促進子宮收縮，不造成尿液滯留。","錯誤：Omeprazole為質子幫浦抑制劑，不具抗膽鹼性，不影響膀胱功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_032","year":2019,"roc_year":108,"session":"1","examNo":32,"q":"下列何者經口投予犬後，可能會導致糞便呈現黑⾊？","opts":["A. bismuth subsalicylate","B. misoprostol","C. omeprazole","D. sucralfate"],"ans":0,"exp":"Bismuth subsalicylate（次水楊酸鉍）經口投予後，鉍在腸道與糞便中的硫化氫（H₂S）反應生成黑色的硫化鉍（bismuth sulfide），使糞便呈現黑色。此為正常現象，不應誤判為消化道出血（黑便）。","we":["","錯誤：Misoprostol為前列腺素類似物，不會在腸道形成黑色化合物，不導致糞便變黑。","錯誤：Omeprazole為無色透明膠囊劑，不影響糞便顏色。","錯誤：Sucralfate（鹽基性硫酸鋁）為白色黏性藥物，不與腸道硫化物反應形成黑色化合物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_033","year":2019,"roc_year":108,"session":"1","examNo":33,"q":"下列何者不具止吐作用？","opts":["A. dolasetron","B. droperidol","C. morphine","D. promethazine"],"ans":2,"exp":"Morphine在犬中可刺激化學感應觸發區（chemoreceptor trigger zone, CTZ）的mu受體，引起嘔吐，因此不具止吐作用（實際上可致吐）。其他選項（dolasetron、droperidol、promethazine）均有止吐作用，機制各異。","we":["錯誤：Dolasetron為5-HT3受體拮抗劑，有效用於化療所致嘔吐的預防，具止吐作用。","錯誤：Droperidol為多巴胺受體拮抗劑，作用於化學感應觸發區（CTZ），具止吐效果。","","錯誤：Promethazine為第一代H1抗組織胺藥，也具有抗膽鹼性，臨床用作止吐劑（特別是暈動症）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_034","year":2019,"roc_year":108,"session":"1","examNo":34,"q":"下列支氣管擴張劑何者屬於非選擇性β-受體致效劑（nonselective β-receptor agonists）？","opts":["A. ephedrine","B. isoetharine","C. albuterol","D. terbutaline"],"ans":0,"exp":"Ephedrine為混合型擬交感神經藥，同時具有直接（作用於α和β受體）和間接（促進去甲腎上腺素釋放）作用，非選擇性地活化α1、α2、β1和β2受體，可擴張支氣管，但同時伴有心率加快、血壓升高等副作用。","we":["","錯誤：Isoetharine為β2選擇性致效劑，相對少心跳加速副作用，屬選擇性支氣管擴張劑。","錯誤：Albuterol（salbutamol）為β2選擇性致效劑，為常用的選擇性支氣管擴張劑。","錯誤：Terbutaline為β2選擇性致效劑，對β1受體影響較小，屬選擇性藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_035","year":2019,"roc_year":108,"session":"1","examNo":35,"q":"下列那一種鴉片類藥物之鎮咳作用遠大於鎮痛作用？","opts":["A. codeine","B. fentanyl","C. morphine","D. hydromorphone"],"ans":0,"exp":"Codeine（可待因）為天然鴉片生物鹼，鎮咳效力強（作用於延腦咳嗽中樞），但鎮痛效力相對弱（約為morphine的1/10）。臨床上主要用作止咳藥，也有輕度鎮痛和止瀉作用。","we":["","錯誤：Fentanyl為強效鴉片類鎮痛藥，主要用於手術麻醉及術後疼痛，鎮咳作用非其主要用途。","錯誤：Morphine為鴉片類標準鎮痛藥，鎮痛效力強，鎮咳為次要用途。","錯誤：Hydromorphone為強效鴉片類鎮痛劑，鎮痛效力約為morphine的5倍，不以鎮咳作用著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_036","year":2019,"roc_year":108,"session":"1","examNo":36,"q":"下列何種藥物不具有鎮咳作用？","opts":["A. hydrocodone","B. butorphanol","C. bromhexine HCl","D. dextromethorphan"],"ans":2,"exp":"Bromhexine HCl（溴己新）為黏液溶解劑（mucolytic agent），作用為稀化痰液、促進纖毛運動以排出痰液，屬於化痰藥（expectorant/mucolytic），不具鎮咳（antitussive）作用。其他選項（hydrocodone、butorphanol、dextromethorphan）均具有鎮咳效果。","we":["錯誤：Hydrocodone為鴉片類止咳鎮痛藥，具有強效鎮咳作用，常用於犬的止咳。","錯誤：Butorphanol為混合型鴉片受體致效/拮抗劑，在犬貓廣泛用作鎮咳劑。","","錯誤：Dextromethorphan為右旋美沙芬，具非鴉片性鎮咳機制（NMDA受體拮抗），常用於非處方止咳藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_037","year":2019,"roc_year":108,"session":"1","examNo":37,"q":"下列何者是β2 -selective氣管擴張劑？","opts":["A. epinephrine","B. terbutaline","C. isoproterenol","D. ephedrine"],"ans":1,"exp":"Terbutaline為選擇性β2腎上腺素受體致效劑，主要作用於支氣管平滑肌的β2受體使其擴張，同時也可用於抑制早產（子宮平滑肌β2受體）。相對於非選擇性藥物，對心臟（β1）影響較小。","we":["錯誤：Epinephrine（腎上腺素）同時活化α1、α2、β1和β2受體，為非選擇性藥物。","","錯誤：Isoproterenol（異丙腎上腺素）同時活化β1和β2受體，不具β2選擇性，會明顯增加心跳。","錯誤：Ephedrine為混合型擬交感神經藥，同時具直接作用（α和β受體）和間接作用（促NE釋放），非β2選擇性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_038","year":2019,"roc_year":108,"session":"1","examNo":38,"q":"貓因下列何種因素而需小心使用NSAIDs藥物？","opts":["A. 無法排泄此類藥物","B. NSAIDs對血中蛋白具高度結合力，致使藥物半衰期很長，容易有藥物蓄積中毒情形","C. cytochrome p450及葡萄醛酸接合系統不足","D. P-醣蛋白質排除效率低"],"ans":2,"exp":"貓缺乏葡萄醛酸接合酵素（UDP-glucuronosyltransferase, UGT1A6）及相關CYP450代謝能力不足，使NSAIDs（如aspirin、acetaminophen）在體內代謝緩慢，易蓄積至毒性濃度。因此貓對許多NSAIDs高度敏感，投藥需極為謹慎。","we":["錯誤：貓並非無法排泄NSAIDs，而是因葡萄醛酸接合能力不足使代謝速率顯著降低，容易蓄積中毒。","錯誤：雖然高蛋白結合可延長半衰期，但貓對NSAIDs敏感性高的主要原因是葡萄醛酸接合酵素（UGT）表現不足。","","錯誤：P-醣蛋白排除效率低主要影響藥物的組織分布和多重抗藥性，不是貓對NSAIDs敏感的主要原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_039","year":2019,"roc_year":108,"session":"1","examNo":39,"q":"下列何者為貓acetaminophen中毒時的最佳解毒劑？","opts":["A. atropine","B. acetylcysteine","C. physostigmine","D. pralidoxime"],"ans":1,"exp":"貓的acetaminophen（paracetamol）中毒：代謝產物NAPQI（N-acetyl-p-benzoquinone imine）蓄積，導致氧化損傷和高鐵血紅素血症（methemoglobinemia）。N-乙醯半胱胺酸（N-acetylcysteine, NAC）能補充谷胱甘肽（glutathione）儲備，解毒NAPQI，為最佳解毒劑。","we":["錯誤：Atropine為抗膽鹼藥，用於有機磷中毒，對acetaminophen（paracetamol）中毒無解毒作用。","","錯誤：Physostigmine為可逆性膽鹼酯酶抑制劑，用於抗膽鹼藥物中毒，對acetaminophen中毒無效。","錯誤：Pralidoxime（PAM）用於有機磷中毒使acetylcholinesterase再活化，不是acetaminophen中毒的解毒劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_040","year":2019,"roc_year":108,"session":"1","examNo":40,"q":"下列何者主要作用於血清素的受體？","opts":["A. atropine","B. cloprostenol","C. captopril","D. ketanserin"],"ans":3,"exp":"Ketanserin為選擇性5-HT2A血清素受體拮抗劑（也有α1阻斷效果），主要作用於血清素受體，用於治療高血壓及血管痙攣。其他選項（atropine、cloprostenol、captopril）均不作用於血清素受體。","we":["錯誤：Atropine為蕈毒鹼（muscarinic）受體拮抗劑，阻斷副交感神經效應，不主要作用於血清素受體。","錯誤：Cloprostenol為前列腺素F2α類似物，主要作用於黃體使其退化，不作用於血清素受體。","錯誤：Captopril為血管收縮素轉化酶（ACE）抑制劑，不具有血清素受體拮抗作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_041","year":2019,"roc_year":108,"session":"1","examNo":41,"q":"下列何者具有血管擴張活性？","opts":["A. bradykinin","B. diphenhydramine","C. ouabain","D. digitoxin"],"ans":0,"exp":"Bradykinin為激肽（kinin）類物質，是強力的血管擴張劑，能增加血管通透性、引起疼痛及支氣管收縮。其作用透過B2受體（bradykinin receptor）介導，促使內皮細胞釋放NO和前列腺素，導致血管平滑肌舒張。其他選項如diphenhydramine為抗組織胺、ouabain和digitoxin為強心配糖體，不以血管擴張為主要功能。","we":["","錯誤：Diphenhydramine為H1受體拮抗劑，主要用於過敏反應，不具有顯著的血管擴張活性。","錯誤：Ouabain為強心配糖體，抑制Na/K-ATPase增強心肌收縮力，不以血管擴張為主要作用。","錯誤：Digitoxin為強心配糖體，用於充血性心衰竭，不具顯著血管擴張活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_042","year":2019,"roc_year":108,"session":"1","examNo":42,"q":"下列何者可用於治療副甲狀腺功能低下症？","opts":["A. dihydrotachysterol","B. calcitonin","C. levothyroxine","D. liothyronine"],"ans":0,"exp":"Dihydrotachysterol（DHT）為維生素D的類似物，能在體內轉化為活性形式，促進腸道鈣磷吸收並調高血鈣濃度，因此用於治療副甲狀腺功能低下症（hypoparathyroidism）所導致的低血鈣症。Calcitonin降血鈣，levothyroxine與liothyronine均為甲狀腺荷爾蒙，均不適用於此症。","we":["","錯誤：Calcitonin（降鈣素）抑制破骨細胞活性，降低血鈣，不用於副甲狀腺功能低下症。","錯誤：Levothyroxine（T4）為甲狀腺荷爾蒙，用於甲狀腺功能低下症，不治療副甲狀腺功能低下。","錯誤：Liothyronine（T3）為甲狀腺荷爾蒙，不具有升高血鈣的效果，不用於副甲狀腺功能低下症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_043","year":2019,"roc_year":108,"session":"1","examNo":43,"q":"下列何者因需在動物體內轉化後才具有活性，故應避免使用於貓？","opts":["A. prednisone","B. prednisolone","C. hydrocortisone","D. deoxycorticosterone"],"ans":0,"exp":"Prednisone為非活性前體藥，必須經由肝臟中11β-hydroxysteroid dehydrogenase（11β-HSD）將其轉化為活性的prednisolone，才能發揮糖皮質素效果。貓的肝臟對此轉化能力較弱，因此prednisone在貓體內效果不佳，臨床上應改用prednisolone（已為活性形式）。","we":["","錯誤：Prednisolone為活性形式，可直接在貓體內發揮效果，無需肝臟轉化，是貓推薦使用的皮質素。","錯誤：Hydrocortisone（氫皮質素）為活性糖皮質素，不需轉化即可直接作用，貓可使用。","錯誤：Deoxycorticosterone為礦性皮質素，具有直接活性，不需肝臟轉化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_044","year":2019,"roc_year":108,"session":"1","examNo":44,"q":"下列何者屬長效型glucocorticoids？","opts":["A. hydrocortisone","B. cortisone","C. triamcinolone","D. dexamethasone"],"ans":3,"exp":"糖皮質素依作用時間分為短效（<12h）、中效（12-48h）和長效（>48h）。長效型包括dexamethasone和betamethasone，生物活性期超過48小時。短效型包括hydrocortisone和cortisone；中效型包括prednisolone、prednisone、methylprednisolone、triamcinolone。","we":["錯誤：Hydrocortisone為短效型糖皮質素，生物活性期約8-12小時，不屬於長效型。","錯誤：Cortisone為短效型糖皮質素，需經肝臟轉化為氫皮質素才具活性，作用時間短。","錯誤：Triamcinolone為中效型糖皮質素，生物活性期約24-48小時，非長效型。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_045","year":2019,"roc_year":108,"session":"1","examNo":45,"q":"肉食獸因下列何種維生素被不飽和脂肪酸破壞而缺乏時，易發生脂肪組織炎？","opts":["A. A","B. B","C. D","D. E"],"ans":3,"exp":"維生素E（tocopherol）為脂溶性抗氧化劑，能保護細胞膜不飽和脂肪酸免受氧化損傷。當飲食中不飽和脂肪酸（PUFA）過多時，會大量消耗維生素E，造成脂肪組織氧化→脂肪組織炎（steatitis，又稱黃脂病）。此病多見於以高脂魚類為主食的貓，臨床表現為皮下脂肪疼痛性硬化和發炎。","we":["錯誤：維生素A缺乏主要影響視力、皮膚及免疫功能，不直接導致脂肪組織炎。","錯誤：維生素B群為水溶性維生素，不易被不飽和脂肪酸破壞，缺乏主要影響神經和代謝功能。","錯誤：維生素D缺乏影響鈣磷代謝，導致骨骼疾病，不造成脂肪組織炎。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_046","year":2019,"roc_year":108,"session":"1","examNo":46,"q":"下列何者與體內鈣、磷的代謝控制無關？","opts":["A. parathyroid hormone","B. calcitonin","C. vitamine D","D. phytonadione"],"ans":3,"exp":"體內鈣磷代謝主要受副甲狀腺素（PTH）、降鈣素（calcitonin）和維生素D三者調節。Phytonadione（植物性維生素K1）為脂溶性維生素，參與凝血因子（II、VII、IX、X）的羧化活化，與血鈣、血磷代謝完全無關。","we":["錯誤：副甲狀腺素（PTH）為調節血鈣和血磷的最重要荷爾蒙，促進骨鈣釋放和腎臟鈣再吸收。","錯誤：Calcitonin（降鈣素）由甲狀腺C細胞分泌，降低血鈣，是鈣磷代謝的重要調節者。","錯誤：Vitamin D促進腸道鈣磷吸收，是調節血鈣濃度的必要因子。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_047","year":2019,"roc_year":108,"session":"1","examNo":47,"q":"下列何者含有動物體內大部分的鐵？","opts":["A. globulin","B. hemoglobin","C. thyroxine","D. ceruloplasmin"],"ans":1,"exp":"體內鐵的分布：約65-70%存在於血紅素（hemoglobin）的血基質（heme）中，約25-30%以ferritin和hemosiderin形式儲存於肝臟、脾臟和骨髓，少量以transferrin形式在血液中運輸。肌紅素（myoglobin）含約4%。因此hemoglobin含有動物體內最大量的鐵。","we":["錯誤：Globulin為血漿蛋白，僅有transferrin等少數globulin含鐵，並非大部分體鐵的存在形式。","","錯誤：Thyroxine（甲狀腺素）的結構核心為碘，不含鐵。","錯誤：Ceruloplasmin為含銅的血漿蛋白，負責銅的運輸，不是鐵的主要儲存形式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_048","year":2019,"roc_year":108,"session":"1","examNo":48,"q":"家禽缺乏下列何種礦物質，會引起脫腱症、脛骨踝畸形與腓腸肌異位？","opts":["A. fluorine","B. copper","C. chromium","D. manganese"],"ans":3,"exp":"錳（Manganese）是家禽骨骼正常發育所必需的微量元素，參與mucopolysaccharide和glycoprotein合成。錳缺乏時，家禽（特別是肉雞）會發生脫腱症（perosis/slipped tendon）：腓腸肌腱從踝關節滑脫、脛骨踝（tibiotarsal）關節腫大畸形，為錳缺乏的特異性臨床症狀。","we":["錯誤：氟（fluorine）缺乏主要影響牙齒和骨骼密度，過多則造成氟中毒，不直接造成脫腱症。","錯誤：銅缺乏影響骨骼發育和造血，可引起共濟失調，但不是脫腱症（perosis）的特異性原因。","錯誤：鉻（chromium）參與胰島素作用和葡萄糖代謝，缺乏不造成家禽脫腱症。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_049","year":2019,"roc_year":108,"session":"1","examNo":49,"q":"下列何者之作用機制為抑制病毒的核糖核蛋白進入宿主細胞？","opts":["A. amantadine","B. zidovudine","C. oseltamivir","D. famciclovir"],"ans":0,"exp":"Amantadine（及其類似物rimantadine）能阻斷甲型流感病毒（Influenza A）的M2離子通道，M2通道在病毒進入宿主細胞後負責通過氫離子使病毒顆粒內部酸化，從而使核糖核蛋白（RNP）從病毒膜中解離，進入細胞核複製。Amantadine阻斷M2通道，防止病毒的核糖核蛋白（RNP complex）進入宿主細胞核，因而抑制病毒複製。","we":["","錯誤：Zidovudine（AZT）抑制反轉錄酶（reverse transcriptase），阻礙HIV等逆轉錄病毒的RNA→DNA過程，不阻止病毒核糖核蛋白進入細胞。","錯誤：Oseltamivir抑制神經胺酸酶（neuraminidase），阻止新生流感病毒從感染細胞釋放，不阻止病毒進入細胞。","錯誤：Famciclovir為前體藥，在體內轉化為penciclovir，抑制疱疹病毒DNA聚合酶，不阻止病毒核糖核蛋白進入細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_050","year":2019,"roc_year":108,"session":"1","examNo":50,"q":"下列何者為idoxuridine的作用機制？","opts":["A. 防止病毒轉錄後的轉譯作用","B. 終止病毒的DNA的合成","C. 抑制神經胺酸酶","D. 抑制病毒脫殼"],"ans":0,"exp":"Idoxuridine（IDU）為胸腺嘧啶核苷（thymidine）的鹵化類似物，可嵌入病毒DNA中取代thymidine，造成DNA結構異常，進而干擾病毒DNA的轉錄（transcription）及後續的蛋白質轉譯（translation）過程。此為其主要抗病毒機制，常用於眼科局部治療疱疹性角膜炎。","we":["","錯誤：終止病毒DNA合成為acyclovir等的機制（鏈終止），idoxuridine則嵌入DNA干擾轉錄，機制有所不同。","錯誤：神經胺酸酶抑制為oseltamivir的機制，idoxuridine不作用於神經胺酸酶。","錯誤：病毒脫殼抑制為amantadine（M2通道阻斷）的機制，idoxuridine作用於病毒DNA合成後的轉錄/轉譯步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_051","year":2019,"roc_year":108,"session":"1","examNo":51,"q":"於產食性經濟動物屠宰前之停藥期間，主要由下列那一因素所決定？","opts":["A. 給藥之間隔","B. 給藥之途徑","C. 藥物之吸收速率","D. 組織之殘留期間"],"ans":3,"exp":"產食性動物（food-producing animals）使用藥物後，必須等待足夠的停藥期（withdrawal time/period），確保可食用組織（肌肉、肝臟、腎臟、脂肪、奶、蛋）中的藥物殘留量降至最高殘留限量（MRL, maximum residue limit）以下，才可屠宰供食用。停藥期的長短主要由藥物在組織中的殘留消散時間（tissue residue depletion time）決定，即藥物從組織中清除至安全水準所需的時間。","we":["錯誤：給藥間隔影響血中穩定濃度，但停藥期主要以組織殘留量是否低於最高殘留限量（MRL）為準。","錯誤：給藥途徑影響吸收速率和分布，但決定停藥期的核心是藥物在可食用組織中的殘留消散時間。","錯誤：吸收速率影響達峰時間，但停藥期由組織中藥物消散至安全殘留量的時間決定。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_052","year":2019,"roc_year":108,"session":"1","examNo":52,"q":"Fluoroquinolones對敏感性細菌於增殖時，主要造成下列何種變化？","opts":["A. 細胞壁不完整","B. 細胞膜破裂","C. DNA裂解","D. 蛋白質胺基酸變異"],"ans":2,"exp":"Fluoroquinolones（氟喹諾酮類，如enrofloxacin、ciprofloxacin）的作用機制為抑制細菌的DNA旋轉酶（DNA gyrase，topoisomerase II）和拓樸異構酶IV（topoisomerase IV）。這兩種酵素是細菌DNA複製過程中解旋和超螺旋鬆弛所必需的。抑制後導致DNA雙鏈斷裂（double-strand breaks）和DNA碎裂，進而使細菌死亡。因此敏感細菌增殖時主要發生DNA裂解。","we":["錯誤：細胞壁合成不完整為β-lactam類（青黴素、頭孢子素）和vancomycin的作用結果，不是fluoroquinolones。","錯誤：細胞膜破裂為polymyxin類（如colistin）的作用機制，不是fluoroquinolones的主要效果。","","錯誤：蛋白質胺基酸變異不是fluoroquinolones直接造成的細菌細胞變化，而是基因突變的長期後果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_053","year":2019,"roc_year":108,"session":"1","examNo":53,"q":"下列那一藥物為耐酸而可以口服給予之廣效性青黴素？","opts":["A. methicillin","B. ticarcillin","C. amoxicillin","D. penicillin G"],"ans":2,"exp":"Amoxicillin為胺基青黴素（aminopenicillin），其化學結構對胃酸穩定，口服後吸收良好（生體可用率約74-92%），且抗菌譜廣，涵蓋多種革蘭氏陽性及部分革蘭氏陰性菌。相比之下，penicillin G和methicillin對酸不穩定，ticarcillin雖廣效但需注射，故amoxicillin為正確答案。","we":["錯誤：Methicillin對酸不穩定，需肌肉或靜脈注射，不能口服，且主要用於耐酶葡萄球菌感染。","錯誤：Ticarcillin為廣效性青黴素（抗假單胞菌），但對酸不穩定，只能注射給藥，不能口服。","","錯誤：Penicillin G（苄青黴素）對酸不穩定，口服後在胃酸中大量分解，生體可用率低，通常需注射給藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_054","year":2019,"roc_year":108,"session":"1","examNo":54,"q":"單環內醯胺類（monobactams）藥物，主要使用於治療下列何種微生物之嚴重感染？","opts":["A. 革蘭氏陰性菌","B. 革蘭氏陽性菌","C. 黴漿菌","D. 原蟲"],"ans":0,"exp":"單環內醯胺類（monobactams）的代表藥物為aztreonam，其結構特點是只有一個β-lactam環（無thiazolidine或dihydrothiazine環）。Aztreonam選擇性與革蘭氏陰性菌（包括Pseudomonas aeruginosa）的青黴素結合蛋白3（PBP3）高度親和，對革蘭氏陽性菌和厭氧菌幾乎無效，用於嚴重的革蘭氏陰性菌感染。","we":["","錯誤：單環內醯胺類（如aztreonam）對革蘭氏陽性菌幾乎無效，因其只能與革蘭氏陰性菌的PBP3結合。","錯誤：黴漿菌（Mycoplasma）缺乏細胞壁，所有β-lactam類（包括monobactams）對其無效，應使用tetracycline或macrolide。","錯誤：原蟲為真核生物，細胞壁結構不同，β-lactam類對原蟲無效，需用抗原蟲藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_055","year":2019,"roc_year":108,"session":"1","examNo":55,"q":"下列何者的作用機制與細菌核糖體30S次單位體無關？","opts":["A. oxytetracycline","B. neomycin","C. chloramphenicol","D. kanamycin"],"ans":2,"exp":"細菌核糖體分為30S和50S兩個次單位。作用於30S次單位的抗生素包括：tetracyclines（阻斷aminoacyl-tRNA與A位點結合）、aminoglycosides（如neomycin、kanamycin，造成mRNA錯讀）。Chloramphenicol則作用於50S次單位的23S rRNA，抑制肽基轉移酶（peptidyl transferase）活性，阻止肽鍵形成，因此與30S無關。","we":["錯誤：Oxytetracycline結合30S核糖體次單位，阻斷胺基醯tRNA（aminoacyl-tRNA）進入A位點，抑制蛋白質合成。","錯誤：Neomycin為aminoglycoside類，結合30S次單位16S rRNA，導致mRNA錯讀並抑制翻譯。","","錯誤：Kanamycin為aminoglycoside類，作用於30S核糖體次單位，與neomycin機制相似。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_056","year":2019,"roc_year":108,"session":"1","examNo":56,"q":"Tetracyclines對下列何者較無治療效果？","opts":["A. Haemobartonella spp.","B. Ehrlichia spp.","C. Borelia spp.","D. Clostridium spp."],"ans":3,"exp":"Tetracyclines對革蘭氏陽性菌、革蘭氏陰性菌、黴漿菌、立克次體、螺旋體（Borrelia）、Haemobartonella（Mycoplasma haemofelis）和Ehrlichia等細胞內寄生菌均有效。但對Clostridium spp.（革蘭氏陽性產芽孢厭氧菌）效果有限，治療嚴重梭狀芽孢桿菌感染（如gas gangrene）通常使用penicillin G或metronidazole。","we":["錯誤：Haemobartonella（現稱Mycoplasma haemofelis）對tetracycline敏感，為此類藥物的主要適應症。","錯誤：Ehrlichia為細胞內寄生菌，doxycycline為其首選治療藥物。","錯誤：Borrelia（萊姆病病原）對tetracyclines（特別是doxycycline）敏感，是重要的適應症。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_057","year":2019,"roc_year":108,"session":"1","examNo":57,"q":"下列何種macrolides臨床上使用會造成心臟毒性？","opts":["A. tilmicosin","B. tylosin","C. clarithromycin","D. tildipirosin"],"ans":0,"exp":"Tilmicosin為大環內酯類抗生素，廣泛用於牛和豬的呼吸道感染治療。然而，tilmicosin具有特殊的心臟毒性：在非牛科動物（如馬、豬、山羊）或過量時，可引起心跳加速、心肌收縮力降低，嚴重時可導致心臟停止。因此tilmicosin禁用於馬、在豬需控制劑量，並禁止靜脈注射。此心臟毒性與其對心肌β1腎上腺素受體和鈣通道的影響有關。","we":["","錯誤：Tylosin為大環內酯類，主要用於豬和家禽呼吸道感染，心臟毒性風險遠低於tilmicosin。","錯誤：Clarithromycin為人用大環內酯，心臟毒性非其主要獸醫問題，而tilmicosin在非牛科動物有明確的心臟毒性。","錯誤：Tildipirosin為大環內酯類獸藥，用於牛和豬呼吸道感染，不以心臟毒性著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理
