（neurotoxicity），通過破壞腎小管細胞膜引起急性腎損傷；高劑量或長期使用風險增加；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_023","year":2022,"roc_year":111,"session":"","examNo":23,"q":"下列何者的作用機制與其他三者顯著不同？","opts":["A. apramycin","B. erythromycin","C. tetracycline","D. spectinomycin"],"ans":1,"exp":"Apramycin（阿普拉黴素，aminoglycoside）、tetracycline（四環素）和spectinomycin（壯觀黴素，aminocyclitol）均作用於細菌核糖體30S亞基（阻斷tRNA結合或mRNA解讀）；而erythromycin（大環內酯類）作用於50S亞基（結合23S rRNA的peptide exit tunnel阻斷肽鏈延伸），作用靶點與其他三者完全不同。","we":["錯誤：Apramycin為aminoglycoside類，作用於16S rRNA的30S亞基（特定位點h44），通過干擾tRNA-mRNA複合物的形成和解碼保真度來抑制蛋白質合成；與tetracycline和spectinomycin同為30S靶向藥物，作用靶點相似。","","錯誤：Tetracycline可逆性結合30S亞基的A位（aminoacyl site），阻止aminoacyl-tRNA進入核糖體A位，停止肽鏈延伸；與apramycin（30S）和spectinomycin（30S）均為30S靶向，不是「機制與其他三者顯著不同」的選項。","錯誤：Spectinomycin（壯觀黴素，aminocyclitol）結合30S亞基的16S rRNA（h34/h35區），干擾EF-G介導的轉位（translocation）步驟，阻止mRNA和tRNA從A位移向P位；與apramycin和tetracycline同為30S靶向，非50S。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_024","year":2022,"roc_year":111,"session":"","examNo":24,"q":"可改變腸內菌叢、造成腎小管壞死、光敏感症，並可能使成長中幼獸牙齒染色的抗菌劑為何？","opts":["A. penicillin V","B. amikacin","C. erythromycin","D. tetracycline"],"ans":3,"exp":"Tetracycline（四環素）的特徵性副作用組合：(1) 改變腸道菌叢（二重感染）；(2) 腎小管壞死（過期四環素分解產物epianhydrotetracycline的毒性）；(3) 光敏感症（phototoxicity）；(4) 幼齒染色（chelation with Ca²⁺ in enamel/dentine，骨骼和牙齒形成期給藥）。此四種副作用是tetracycline特有的臨床毒性特徵。","we":["錯誤：Penicillin V（苯氧基甲基青黴素）主要副作用為過敏反應（hypersensitivity）、出疹等；不引起牙齒染色、光敏感或腎小管壞死；β-lactam類的特徵性副作用是過敏和免疫介導反應，與tetracycline完全不同。","錯誤：Amikacin（阿米卡星）為aminoglycoside類，主要副作用為腎毒性（近端腎小管）和耳毒性（inner ear hair cell damage）；不引起牙齒染色、光敏感或腸道菌叢改變；與tetracycline的毒性特徵不重疊。","錯誤：Erythromycin的主要副作用為腸胃不適（GI upset，包括噁心、嘔吐，因motilin receptor激活），不引起牙齒染色、腎小管壞死或光敏感；大環內酯類的典型副作用為消化道症狀和QTc延長（某些成員）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_025","year":2022,"roc_year":111,"session":"","examNo":25,"q":"Sulfamethoxazole與trimethoprim併用後具有殺菌效果，是屬於何種藥物交互作用？","opts":["A. 相加作用（additive effect）","B. 相乘作用（synergistic effect）","C. 耐受性（tolerance）","D. 複合物形成（complex formation）"],"ans":1,"exp":"Sulfamethoxazole（SMX）抑制二氫葉酸合成酶（dihydropteroate synthase，DHPS），阻斷PABA→二氫葉酸的合成；Trimethoprim（TMP）抑制二氫葉酸還原酶（dihydrofolate reductase，DHFR），阻斷二氫葉酸→四氫葉酸的還原。兩者連續阻斷葉酸合成途徑的不同步驟，產生真正的「相乘（synergistic）」協同作用，使殺菌效果遠超單獨使用（可從抑菌轉為殺菌）。","we":["錯誤：相加作用（additive effect）指兩藥合用效果等於兩藥單用效果之和，常發生在機制相似但靶點不完全相同的藥物；SMX+TMP阻斷同一代謝途徑的連續兩步，產生的聯合效果超越相加，屬於協同（synergistic）而非單純相加。","","錯誤：耐受性（tolerance）指反覆給藥後藥效降低，需增加劑量才能維持效果，屬於藥效動力學的適應現象；與SMX+TMP的協同作用（藥物交互作用類型）完全不同。","錯誤：複合物形成（complex formation）是藥物與另一藥物或物質化學結合而改變活性（如四環素與制酸劑形成螯合物降低吸收）；SMX+TMP並不形成化學複合物，而是通過阻斷連續代謝步驟產生協同，機制完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_026","year":2022,"roc_year":111,"session":"","examNo":26,"q":"下列藥物何者無法口服控制弓蟲症（toxoplasmosis）？","opts":["A. trimethoprim-sulfadiazine","B. pyrimethamine-sulfadiazine","C. clindamycin","D. nystatin"],"ans":3,"exp":"Nystatin（制黴菌素）為多烯類（polyene）抗真菌藥，通過結合真菌細胞膜的ergosterol形成孔洞，對真菌（Candida等）有效；但對原蟲（protozoa）如Toxoplasma gondii完全無抗原蟲活性；弓蟲症（toxoplasmosis）的治療需要抗原蟲藥物，nystatin不適用。","we":["錯誤：TMP-SDZ（增效磺胺）阻斷弓蟲葉酸合成（弓蟲無法利用外源性葉酸），是治療弓蟲症有效的藥物組合，口服可控制Toxoplasma gondii感染；不符合「無法」的條件。","錯誤：Pyrimethamine（乙胺嘧啶）特異性抑制Toxoplasma的DHFR（比哺乳動物DHFR活性高1000倍），與sulfadiazine合用為人醫和獸醫治療弓蟲症的黃金標準；口服有效，不符合「無法口服控制」的條件。","錯誤：Clindamycin（克林黴素）通過抑制弓蟲的頂端複合體（apicoplast）中的蛋白質合成（細菌型核糖體），對Toxoplasma gondii有效；犬貓弓蟲症的常用治療選擇，可口服，不符合條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_027","year":2022,"roc_year":111,"session":"","examNo":27,"q":"下列何者是心絲蟲成蟲的最佳殺滅劑？","opts":["A. milbemycin","B. kaolin","C. melarsomine","D. moxidectin"],"ans":2,"exp":"Melarsomine dihydrochloride（Immiticide，鹽酸甲胂胺）為有機砷類藥物，是目前唯一被批准用於犬心絲蟲（Dirofilaria immitis）成蟲殺滅的藥物（adulticide）；通過肌肉注射（腰背肌，epaxial muscles），干擾砷代謝（抑制丙酮酸氧化酶）殺滅成蟲；美國心臟病學會（AHS）推薦三針方案（1+1+1或1+2）。","we":["錯誤：Milbemycin oxime為預防藥（microfilaricide和L3/L4 larvae）；對成蟲活性有限（某些研究有部分效果但不被批准作為adulticide使用）；目前獸醫指南不推薦milbemycin作為心絲蟲成蟲的標準殺滅治療。","錯誤：Kaolin為矽鋁酸鹽，用作胃腸道吸附劑（止瀉）；完全無抗寄生蟲活性，與心絲蟲治療無任何關聯。","","錯誤：Moxidectin（GluCl channel agonist）主要用於心絲蟲預防（monthly preventive）和微絲蟲控制；有研究顯示長期高劑量可緩慢殺滅成蟲，但不是被批准的成蟲殺滅劑（adulticide），不如melarsomine有效和快速。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_028","year":2022,"roc_year":111,"session":"","examNo":28,"q":"下列何種藥品的作用不涉及受體（receptors）的結合？","opts":["A. epinephrine","B. mannitol","C. carbachol","D. cimetidine"],"ans":1,"exp":"Mannitol（甘露醇）為滲透性利尿劑，作用機制純粹為物理滲透壓效應：在腎小管和循環中形成高滲透壓，阻止水分再吸收（腎），同時從組織（腦、眼）抽取水分降低腫脹；整個作用過程不涉及任何特異性受體（receptor）的結合，為非受體介導的藥理機制（physicochemical action）。","we":["錯誤：Epinephrine（腎上腺素）必須與腎上腺素受體（α1、α2、β1、β2）結合才能發揮作用；受體結合後活化G蛋白→腺苷酸環化酶→cAMP或磷脂酶C等訊號途徑；是典型的受體介導作用藥物。","","錯誤：Carbachol必須結合毒蕈鹼（M1-M5）和尼古丁（Nm、Nn）受體才能發揮擬副交感神經效果；為典型的直接作用膽鹼性受體致效劑，其作用完全依賴受體結合。","錯誤：Cimetidine（西咪替丁）為H2組織胺受體的競爭性拮抗劑，必須結合胃壁細胞上的H2受體才能抑制胃酸分泌；同時也是CYP450抑制劑（非受體機制，但主要藥效仍為受體拮抗）；是典型的受體介導作用藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_029","year":2022,"roc_year":111,"session":"","examNo":29,"q":"下列何者與ionophore antibiotics造成離子變化而導致細胞死亡產生中毒症狀有關？","opts":["A. 增加細胞內的K+和細胞外的Na+","B. 減少細胞內的Na+和增加細胞外的K+","C. 增加細胞內的Ca2+和細胞外的K+","D. 增加細胞內的Ca2+和減少細胞外的K+"],"ans":2,"exp":"Ionophore antibiotics（離子載體類，如monensin、lasalocid、salinomycin）的毒性機制：這些藥物作為陽離子載體，在細胞膜上形成親脂性通道，使Na⁺/Ca²⁺大量流入細胞（交換出K⁺），導致：(1)細胞內Ca²⁺增加→肌肉收縮異常→心肌壞死和橫紋肌溶解；(2)細胞外K⁺減少→低血鉀→心律不整。馬和單胃動物對ionophore敏感性遠高於反芻動物（目標用於雞球蟲症的monensin可致馬死亡）。","we":["錯誤：Ionophores的作用相反——它們促進Na⁺和Ca²⁺內流、K⁺外流；Na⁺在細胞外（高濃度），ionophore使Na⁺進入細胞（細胞內Na⁺增加），並通過Na⁺/Ca²⁺交換使Ca²⁺內流；K⁺從細胞排出（細胞外K⁺增加或細胞內K⁺減少），描述方向錯誤。","錯誤：Ionophores使Na⁺進入細胞（細胞內Na⁺增加），並通過繼發性Na⁺/Ca²⁺交換使Ca²⁺進入細胞；同時K⁺從細胞排出（細胞外K⁺升高的趨勢，但臨床上常見低血鉀）；選項描述方向不正確。","","錯誤：此選項前半部分（增加細胞內Ca²⁺）正確，但後半部分「減少細胞外K⁺」的描述不準確——ionophore毒性使K⁺從細胞外排（K⁺從細胞內流出），細胞外K⁺可能初期升高，但整體離子失衡的關鍵是細胞內Ca²⁺的毒性增加。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_030","year":2022,"roc_year":111,"session":"","examNo":30,"q":"Clindamycin和erythromycin最大的不同點為：","opts":["A. Clindamycin主要作用在30S核糖體次單位上","B. Clindamycin無口服劑型","C. Clindamycin可用於治療犬和貓的弓蟲症","D. Clindamycin極容易進入腦脊髓液中"],"ans":2,"exp":"Clindamycin（克林黴素）與erythromycin最大的臨床差異在於：clindamycin有效治療犬貓的弓蟲症（toxoplasmosis），通過抑制Toxoplasma gondii頂複合體（apicoplast）的翻譯（原核型50S核糖體），能穿越血腦障壁及血眼障壁進入胞內；erythromycin對弓蟲症無效。Clindamycin也對Neospora caninum和某些Cryptosporidium有效。","we":["錯誤：Clindamycin（lincosamide類）作用於50S核糖體亞基（結合23S rRNA的domain V）；30S是aminoglycosides和tetracyclines的靶點；50S是Clindamycin、macrolides（erythromycin）和chloramphenicol的共同靶點，此選項描述錯誤。","錯誤：Clindamycin有口服劑型（capsules/oral solution），口服吸收良好（生體可用率>90%），可用於門診口服治療骨骼感染、軟組織感染和弓蟲症；此描述錯誤，為干擾選項。","","錯誤：Clindamycin的CSF穿透性實際上相對有限（正常BBB下CSF/plasma ratio較低）；雖在CNS感染時可達到一定濃度（因炎症改變BBB通透性），但「極容易進入CSF」的描述誇張；這也是為何治療CNS弓蟲症時clindamycin需與pyrimethamine合用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_031","year":2022,"roc_year":111,"session":"","examNo":31,"q":"觀賞魚患有指環蟲（Dactylogyrus）感染時，下列何者具有治療效果？","opts":["A. chlorhexidine","B. enrofloxacin","C. trichlorfon","D. trimethoprim"],"ans":2,"exp":"Dactylogyrus（指環蟲）為單殖吸蟲（monogenean trematode），寄生於魚鰓，以4個固定鉤（haptor）附著；治療首選trichlorfon（美曲膦酯，有機磷農藥）浸浴，通過抑制蟲體AChE（acetylcholinesterase）使蟲體麻痺脫落；也可使用formalin或praziquantel。有機磷類對單殖吸蟲和甲殼類寄生蟲（如copepods）有效。","we":["錯誤：Chlorhexidine（氯己定）為消毒劑（antiseptic），通過破壞細菌細胞膜發揮廣效抗菌作用；對單殖吸蟲（Dactylogyrus）無特效，用途為魚的細菌感染外用消毒，非驅蟲藥。","錯誤：Enrofloxacin為fluoroquinolone類抗菌藥，抑制細菌DNA旋轉酶；對真核生物的寄生蟲（吸蟲類）完全無效；在觀賞魚中用於細菌感染（G-細菌）的治療，非驅蟲用途。","","錯誤：Trimethoprim抑制細菌DHFR，為抗細菌藥物；對真核寄生蟲（指環蟲）無效；有機磷（trichlorfon）才是針對單殖吸蟲的有效治療藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_032","year":2022,"roc_year":111,"session":"","examNo":32,"q":"有關氰化物（cyanide）中毒的敘述何者錯誤？","opts":["A. 能夠在胃內被迅速吸收","B. 氰化物的檢體必須冷凍運輸","C. 反芻獸的感受性較馬與豬都高","D. 須立刻肌肉注射sodium thiosulfate解毒"],"ans":3,"exp":"氰化物中毒的標準解毒療法為靜脈注射（IV）：先給sodium nitrite（或hydroxocobalamin）使血紅蛋白變成methemoglobin，與CN⁻競爭結合；再給sodium thiosulfate（靜脈注射），提供硫基（sulfur donor），由硫氰酸酶（rhodanese）催化CN⁻→SCN⁻（硫氰酸鹽，低毒）排出。Sodium thiosulfate必須靜脈注射，肌肉注射（IM）吸收慢、緊急時效果不足，且兩者均需靜脈給藥才能達到快速有效的解毒濃度。","we":["此為正確描述：HCN（prussic acid）氣體和氰化物鹽類在胃酸環境中迅速釋放HCN，在胃黏膜和小腸快速吸收（未解離的HCN form親脂，吸收極快）；不符合「錯誤」描述。","此為正確描述：氰化物在血液中不穩定，常溫下迅速揮發和代謝（HCN氣體逸失）；診斷用血液檢體需加NaF防腐並立即冷凍（-20°C）運輸，避免分析前降解；不符合「錯誤」描述。","此為正確描述：反芻獸（牛、羊）因瘤胃細菌含有β-glucosidase，可水解含氰苷（cyanogenic glycoside）的植物（如蘇丹草、高粱、亞麻籽等），釋放HCN；反芻獸攝食含氰苷植物的易感性確比馬和豬高；不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_033","year":2022,"roc_year":111,"session":"","examNo":33,"q":"下列有關尿素中毒的敘述，何者錯誤？","opts":["A. 尿素可以被當作飼料中非蛋白氮的來源","B. 毒性主要是因為胃吸收了氨（ammonia）所致","C. 反芻獸較單胃動物不容易見到尿素中毒","D. 可以冷水－醋酸療法治療反芻獸的尿素中毒"],"ans":2,"exp":"反芻獸（牛、羊）因瘤胃微生物含有豐富的脲酶（urease），可迅速將飼料中的尿素（non-protein nitrogen，NPN）水解為氨（NH₃），在瘤胃/血液中形成高氨濃度（ammonia toxicity/hyperammonemia），導致中樞神經抑制、驚厥和死亡；因此反芻獸「較單胃動物更容易發生尿素中毒」（更敏感），選項C描述「反芻獸較單胃動物不容易見到尿素中毒」為錯誤。","we":["此為正確描述：尿素（NPN source）在反芻動物飼料中添加（通常<1%）用作廉價氮源，瘤胃微生物利用NH₃合成菌體蛋白，後被消化吸收；是合理的反芻動物飼養實踐，不符合「錯誤」描述。","此為正確描述：尿素→瘤胃脲酶→NH₃，過量NH₃在瘤胃吸收進入血液（尤其胃pH升高時，未解離NH₃比例增加更易吸收），造成高氨血症（hyperammonemia），NH₃直接影響TCA循環（消耗α-ketoglutarate）和CNS；不符合「錯誤」描述。","","此為正確描述：投予冷水（灌瘤胃，稀釋NH₃濃度）和醋酸（acetic acid/vinegar，酸化瘤胃使NH₃→NH₄⁺降低吸收）是尿素中毒的緊急對症治療方法；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_034","year":2022,"roc_year":111,"session":"","examNo":34,"q":"下列有關動物種別影響藥品使用的敘述，何者正確？","opts":["A. 誘導幼馬形成食道溝，將使藥品更快速通過食道","B. 一個pKa 3.5的弱酸性藥品不易在反芻獸的唾液中解離","C. 草食獸無法分解cellulose製成的膠囊","D. 脂溶性的有機鹼藥品在反芻獸常具有較大的分布體積"],"ans":3,"exp":"脂溶性有機鹼（如某些macrolides、sulfonamides）在反芻動物中確具有較大的分布體積（Vd）：反芻動物的唾液、瘤胃液和乳汁均偏鹼性（pH 7.5-8.5），脂溶性弱鹼性藥物在這些液相中大量「離子捕獲（ion trapping）」，提高分布體積；且反芻動物體重大，體液總量多，有機鹼藥物廣泛分布於各組織液。","we":["錯誤：食道溝（reticular groove）閉合後使液體繞過前胃直接進入皺胃（abomasum），是反芻動物（犢牛、羊羔）的機制，而非馬（馬為單胃動物，沒有食道溝）；幼馬的胃腸道解剖與反芻獸不同，此描述在動物種別上有根本錯誤。","錯誤：反芻獸唾液pH約8.1（鹼性），對pKa=3.5的弱酸（在pH=8.1條件下，Henderson-Hasselbalch：pH-pKa=4.6，[A⁻]/[HA]=39810），弱酸在此pH下高度解離（>99.99%）；「不易解離」描述完全相反。","錯誤：草食獸（馬、牛）的消化道微生物可以分解cellulose（纖維素）；目前常用的硬膠囊是gelatin（明膠，蛋白質）製成，而非cellulose；即使使用HPMC（羥丙基甲基纖維素）植物膠囊，草食獸的消化道也能分解大部分多糖；此選項邏輯和事實均有誤。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_035","year":2022,"roc_year":111,"session":"","examNo":35,"q":"飼料遭受黴菌Fusarium roseum污染，可能產生下列何種具有estrogen活性的黴菌毒素？","opts":["A. zearalenone","B. T-2 toxin","C. patulin","D. citrinin"],"ans":0,"exp":"Zearalenone（玉米赤黴烯酮）為Fusarium roseum（現稱F. graminearum或F. culmorum等）在穀物（玉米、小麥等）上產生的黴菌毒素，具有顯著的雌激素活性（通過結合雌激素受體ER-α和ER-β），引起豬（尤其母豬）的假性發情、外陰陰道炎腫脹、不孕、流產等繁殖障礙；對禽類和反芻動物影響較小。","we":["","錯誤：T-2 toxin（T-2毒素）為trichothecene類（鐮孢菌毒素），由F. tricinctum等產生，通過抑制蛋白質和DNA合成引起細胞毒性、免疫抑制、骨髓抑制和消化道損傷；不具有雌激素活性，毒性機制完全不同於zearalenone。","錯誤：Patulin（棒麯黴素）由Penicillium expansum等霉菌（非Fusarium）產生，主要見於腐爛蘋果等水果，具有細胞毒性和基因毒性；不具有雌激素活性，且來源黴菌屬不同（Penicillium vs Fusarium）。","錯誤：Citrinin（桔黴素）由Penicillium citrinum、Aspergillus citricus等黴菌（非Fusarium）產生，主要腎毒性（抑制腎小管粒線體功能）；不具有雌激素活性，與Fusarium contamination和繁殖障礙無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_036","year":2022,"roc_year":111,"session":"","examNo":36,"q":"下列有關藥物固體劑型之敘述，何者正確？","opts":["A. 錠劑（tablet）只用於口服","B. 延遲釋放劑型（delayed release）錠劑主要為達到延長藥物代謝速率","C. 軟膠囊（soft capsule）僅適用在脂溶性差的液體藥物","D. 大丸（bolus）適用於反芻獸"],"ans":3,"exp":"Bolus（大丸劑）是大而重的錠劑，設計用於反芻動物（牛、羊）吞服，利用反芻動物的食道解剖（食道直徑大）和前胃（瘤胃）的消化特點緩慢釋放藥物；常用於礦物質補充（長效selenium、copper等）和某些藥物的緩釋給藥；不適合單胃動物（噎喉風險）。","we":["錯誤：錠劑（tablet）除口服外，也有陰道錠（vaginal tablet，如黃體素）、舌下錠（sublingual tablet）、發泡錠（effervescent tablet）等不同給藥途徑；口服只是最常見的用途，並非唯一。","錯誤：延遲釋放劑型（delayed release/enteric coated）的目的是「延緩藥物在胃中釋放，到達腸道才溶解吸收」（保護對胃酸不穩定的藥物，或避免胃刺激）；目的是改變釋放時機和吸收位置，而非延長代謝速率。","錯誤：軟膠囊（soft gelatin capsule）主要用於油狀液體、脂溶性藥物（維生素A、E、D、魚油等）和部分難以壓製的固體藥物；「脂溶性差」描述相反，軟膠囊恰恰適合高脂溶性液態內容物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_037","year":2022,"roc_year":111,"session":"","examNo":37,"q":"下列有關藥物特性的敘述，何者錯誤？","opts":["A. 有機藥物製成鹽類後，常較易溶於水","B. 「易溶」表溶質1克（1 mL）能溶於1～10 mL溶劑以下","C. 醑劑（spirits）中含有酒精","D. 將維生素A溶於脂溶性的石蠟油中，可增加口服吸收的百分率"],"ans":3,"exp":"Paraffin oil（石蠟油）為礦物油，不被消化吸收（非食用油脂），反而在腸道中大量溶解脂溶性維生素（A、D、E、K），形成含維生素的礦物油相，阻止維生素被腸道吸收，並將維生素帶出體外；長期使用石蠟油（礦物油瀉劑）可導致脂溶性維生素缺乏。故「將維生素A溶於石蠟油中增加口服吸收」為錯誤描述（應使用植物油如corn oil才能增加吸收）。","we":["此為正確描述：有機酸（如penicillin）製成鈉鹽/鉀鹽，或有機鹼製成鹽酸鹽/硫酸鹽，大幅提高水溶性（離子形式易溶），有利於注射製劑和口服溶液的製備；不符合「錯誤」描述。","此為正確描述：中華藥典定義「易溶（freely soluble）」為1 g（或1 mL）溶質溶於1-10 mL溶劑；與「極易溶（very soluble，<1 mL）」和「溶（soluble，10-30 mL）」等區分；不符合「錯誤」描述。","此為正確描述：醑劑（spirits/spiritus）為藥典中以酒精（乙醇）為溶媒製成的含揮發性藥物的藥用製劑（如薄荷醑、氨醑等）；酒精為必要成分，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_038","year":2022,"roc_year":111,"session":"","examNo":38,"q":"下列何者對於逆轉類鴉片藥物的呼吸抑制較無效果？","opts":["A. butorphanol","B. buprenorphine","C. naloxone","D. naltrexone"],"ans":1,"exp":"Buprenorphine（丁丙諾啡）為高親和力的μ受體部分致效劑（partial agonist），其與μ受體的結合離解常數（kd）極低（親和力極高），且解離速率（koff）非常慢（ceiling effect和slow offset）；純拮抗劑naloxone無法有效競爭置換buprenorphine（需要極高劑量的naloxone才能部分拮抗），且即使給予naloxone，拮抗時間可能比buprenorphine效果持續時間短（需反覆給藥）；故buprenorphine是最難被naloxone逆轉的類鴉片藥物。","we":["錯誤：Butorphanol為κ致效劑/μ拮抗劑（或弱μ部分致效劑），雖對μ受體有一定親和力，但親和力遠低於buprenorphine；naloxone可有效拮抗butorphanol引起的μ受體效應（包括呼吸抑制），效果明顯優於拮抗buprenorphine。","","錯誤：Naloxone（納洛酮）本身為純阿片受體拮抗劑（μ、κ、δ），是逆轉類鴉片藥物呼吸抑制的標準解毒劑；不引起呼吸抑制（無激動活性），而是逆轉其他阿片類藥物的效果，不符合「逆轉效果較無效」的條件。","錯誤：Naltrexone為純阿片受體拮抗劑（比naloxone作用時間更長，24-72小時），可有效逆轉大多數阿片類藥物引起的呼吸抑制；對buprenorphine的逆轉也有效（在足夠劑量下），但整體逆轉效果仍優於naloxone拮抗buprenorphine（因naltrexone親和力更高）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_039","year":2022,"roc_year":111,"session":"","examNo":39,"q":"下列lidocaine造成的反應中，何者相對應的血漿中lidocaine濃度最高？","opts":["A. 止痛（analgesia）","B. 意識改變（altered consciousness）","C. 肌肉抽搐（muscle twitching）","D. 癲癇（seizure）"],"ans":3,"exp":"利多卡因（lidocaine）的中樞神經系統毒性反應與血漿濃度有劑量-效應關係，從低到高依序為：(1) 止痛/抗心律不整（1-5 μg/mL）→ (2) 輕微興奮/意識改變（5-10 μg/mL）→ (3) 肌肉抽搐/視覺聽覺異常（10-15 μg/mL）→ (4) 癲癇（>15 μg/mL）→ (5) 心臟毒性/心搏停止（>20 μg/mL）。癲癇發作對應最高的中毒性血漿濃度，是CNS毒性的嚴重徵兆。","we":["錯誤：止痛（analgesia）效果出現在最低的lidocaine血漿濃度（約1-5 μg/mL），為治療窗範圍內；低血漿濃度即可通過Na⁺通道阻斷發揮局部/全身鎮痛效果，對應最低濃度，而非最高。","錯誤：意識改變（altered consciousness，包括頭暈、耳鳴、口腔麻木、視覺異常）出現在中等毒性濃度（約5-10 μg/mL），早於肌肉抽搐和癲癇；是CNS毒性的早期表現，血漿濃度低於引起癲癇的濃度。","錯誤：肌肉抽搐（muscle twitching）出現在比意識改變更高的濃度（約10-15 μg/mL）；雖然高於意識改變，但仍低於癲癇發作（>15 μg/mL）；在lidocaine毒性發展序列中，肌肉抽搐先於癲癇出現。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_040","year":2022,"roc_year":111,"session":"","examNo":40,"q":"Benzodiazepine類衍生物作用與下列何種離子通道有關？","opts":["A. 氯離子","B. 鉀離子","C. 鈉離子","D. 鈣離子"],"ans":0,"exp":"Benzodiazepines（如diazepam、midazolam、alprazolam）通過與GABA-A受體（配體門控離子通道）的苯二氮平位點（BZD binding site，位於α和γ亞基間）結合，正向調節（potentiate）GABA對Cl⁻通道的開放頻率（增加chloride ion influx），使神經元超極化（hyperpolarization），產生抗焦慮、鎮靜、抗痙攣和肌肉鬆弛效果。","we":["","錯誤：K⁺通道（如Kir、KATP通道）主要與心臟節律（amiodarone/Class III阻斷K⁺通道）和胰島素分泌有關；Benzodiazepines不作用於K⁺通道，其鎮靜效果完全通過GABA-A受體的Cl⁻通道介導。","錯誤：Na⁺通道阻斷為局部麻醉劑（lidocaine）和Class I抗心律不整藥的機制；benzodiazepines不阻斷電壓依賴性Na⁺通道，其GABA-A受體調節作用是通過增加Cl⁻內流（非Na⁺）來降低神經元興奮性。","錯誤：Ca²⁺通道阻斷為Class IV抗心律不整藥（diltiazem、verapamil）的機制；gabapentin通過鈣通道（α2δ亞基）發揮作用；benzodiazepines不作用於電壓依賴性Ca²⁺通道，完全通過GABA-A受體的Cl⁻通道機制發揮藥效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_041","year":2022,"roc_year":111,"session":"","examNo":41,"q":"下列何者為競爭性α2-腎上腺素性受體拮抗劑，且投予過量會造成動物之高血壓？","opts":["A. propranolol","B. phenoxybenzamine","C. yohimbine","D. phenylpropanolamine"],"ans":2,"exp":"Yohimbine（育亨賓）是競爭性、選擇性的α2-腎上腺素性受體拮抗劑。α2受體主要分布於突觸前（presynaptic），具有負回饋調控功能，活化時會抑制正腎上腺素（NE）的釋放。Yohimbine阻斷α2受體後，解除此負回饋→NE大量釋放→活化周邊血管的α1受體（縮血管）→血壓升高。投予過量時，此周邊NE效應造成顯著高血壓（hypertension）及心跳加速，是yohimbine過量最典型的副作用。在臨床上，yohimbine常作為medetomidine/xylazine（α2 agonist）的拮抗解毒劑。","we":["錯誤：Propranolol為非選擇性β-腎上腺素性受體拮抗劑（β1+β2阻斷），不作用於α受體；其降低心搏輸出量和腎素分泌，用於降血壓及抗心律不整，與α2拮抗機制及過量造成高血壓的描述不符。","錯誤：Phenoxybenzamine為非選擇性、不可逆性的α受體拮抗劑（α1+α2），雖也阻斷α受體，但因同時阻斷α1（擴血管）導致低血壓，而非高血壓；且其選擇性和作用機制（不可逆共價結合）與yohimbine（競爭性、可逆、α2選擇性）不同。","","錯誤：Phenylpropanolamine為α1受體致效劑（agonist），可收縮血管、升高血壓，並用於治療尿失禁；其作用為激動受體而非拮抗，且主要作用於α1受體而非α2，不符合「競爭性α2拮抗劑且過量造成高血壓」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_042","year":2022,"roc_year":111,"session":"","examNo":42,"q":"下列何者不屬於三環類抗憂鬱劑？","opts":["A. amitriptyline","B. doxepin","C. imipramine","D. mirtazapine"],"ans":3,"exp":"三環類抗憂鬱劑（tricyclic antidepressants, TCAs）的化學結構特徵為三個融合環（dibenzazepine或dibenzocycloheptene核心）。Amitriptyline、doxepin和imipramine均具有此三環結構，屬於TCA類。Mirtazapine（米氮平）的化學結構為四環（tetracyclic）系統，屬於noradrenergic and specific serotonergic antidepressant（NaSSA）；它阻斷α2受體（增加NE/5-HT釋放）以及5-HT2和5-HT3受體，並有強效H1阻斷（鎮靜、促食慾）。在獸醫上mirtazapine常用於促進貓咪食慾（口服或經皮貼劑）。","we":["此為正確描述：Amitriptyline（阿米替林）具有三環結構（dibenzocycloheptene），抑制NE和5-HT再攝取，為典型TCA，廣泛用於抑鬱症和神經性疼痛；確實屬於三環類，不符合「不屬於TCA」的條件。","此為正確描述：Doxepin（多慮平）具有三環結構（dibenzoxepine），也抑制NE和5-HT再攝取，具有強效H1拮抗（抗過敏/抗組織胺），確實為TCA；不符合「不屬於TCA」的條件。","此為正確描述：Imipramine（丙咪嗪）為第一個被開發的TCA（dibenzazepine結構），主要抑制NE和5-HT再攝取，是TCA的代表藥物；不符合「不屬於TCA」的條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_043","year":2022,"roc_year":111,"session":"","examNo":43,"q":"下列何組吸入性麻醉劑之血液／氣體分配係數（blood/gas partition coefficient）最相近？","opts":["A. sevoflurane和isoflurane","B. isoflurane和nitrous oxide","C. desflurane和nitrous oxide","D. desflurane和isoflurane"],"ans":2,"exp":"血液/氣體分配係數（blood/gas partition coefficient）越低，表示藥物在血液中溶解度越低，麻醉誘導和恢復越快。各常用吸入性麻醉劑的血液/氣體分配係數：sevoflurane≈0.65、isoflurane≈1.46、nitrous oxide（笑氣）≈0.47、desflurane≈0.42、halothane≈2.4、methoxyflurane≈13。Desflurane（約0.42）和nitrous oxide（約0.47）數值最接近，兩者均屬血液溶解度最低（快速誘導/恢復）的麻醉劑，故本題答案為C。","we":["錯誤：Sevoflurane（約0.65）和isoflurane（約1.46）的血液/氣體分配係數相差約2.2倍，差異明顯；sevoflurane的誘導恢復速度明顯快於isoflurane，兩者分配係數並不相近。","錯誤：Isoflurane（約1.46）和nitrous oxide（約0.47）相差約3倍，差距顯著；isoflurane血中溶解度遠高於笑氣，兩者分配係數差異大，不符合「最相近」的條件。","","錯誤：Desflurane（約0.42）和isoflurane（約1.46）相差約3.5倍；isoflurane血中溶解度明顯高於desflurane，兩者分配係數差異相當大，不符合「最相近」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_044","year":2022,"roc_year":111,"session":"","examNo":44,"q":"下列何組吸入性麻醉劑具有最相似的蒸氣壓？","opts":["A. isoflurane和methoxyflurane","B. halothane和nitrous oxide","C. isoflurane和halothane","D. methoxyflurane和nitrous oxide"],"ans":2,"exp":"蒸氣壓（vapor pressure）反映麻醉劑在揮發器中的揮發性，20°C時的蒸氣壓：isoflurane≈240 mmHg、halothane≈243 mmHg、methoxyflurane≈23 mmHg、desflurane≈664 mmHg、nitrous oxide（氣態，≫760 mmHg）、sevoflurane≈160 mmHg。Isoflurane（約240 mmHg）和halothane（約243 mmHg）的蒸氣壓極為接近，故本題答案為C（isoflurane和halothane）。","we":["錯誤：Isoflurane（約240 mmHg）和methoxyflurane（約23 mmHg）相差約10倍；methoxyflurane揮發性極低（蒸氣壓遠低於isoflurane），兩者蒸氣壓相差懸殊，不符合「最相似」的條件。","錯誤：Halothane（約243 mmHg）和nitrous oxide（笑氣，在室溫下為氣體，蒸氣壓遠超760 mmHg）差異極大；nitrous oxide在常溫常壓下已是氣態，不能與halothane的液態揮發性蒸氣壓相比較。","","錯誤：Methoxyflurane（約23 mmHg）和nitrous oxide（氣態，極高蒸氣壓）之間差距極大；methoxyflurane揮發性最低，而nitrous oxide在常溫為氣體，兩者蒸氣壓完全不在同一量級，不符合「最相似」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_045","year":2022,"roc_year":111,"session":"","examNo":45,"q":"複選題\n45.關於barbiturates麻醉劑，下列敘述何者錯誤？","opts":["A. Barbiturates作用機制與抑制鈉和鉀離子通道，而抑制突觸的傳導有關","B. Barbiturates高劑量會引起嚴重的中樞神經系統抑制","C. Oxybarbiturates 較thiobarbiturates麻醉作用時間長","D. Thiobarbiturates由於脂溶性高而較快發揮藥效"],"ans":0,"exp":"本題詢問關於barbiturates麻醉劑的錯誤描述。選項A錯誤：Barbiturates的作用機制是正向調節GABA-A受體（結合barbiturate結合位點），延長氯離子通道（Cl⁻ channel）的開放時間（duration），使神經元超極化；並非抑制鈉離子（Na⁺）和鉀離子（K⁺）通道。Na⁺/K⁺通道抑制是局部麻醉劑（如lidocaine）的機制。其他選項均為正確描述：B（高劑量引起嚴重CNS抑制）、C（oxybarbiturates較thiobarbiturates作用時間長，因再分布後氧化代謝較慢）、D（thiobarbiturates脂溶性高，快速進入CNS，起效快）。","we":["","此為正確描述：Barbiturates高劑量確實會引起嚴重的中樞神經系統（CNS）抑制，包括呼吸中樞抑制、心血管抑制，甚至導致昏迷和死亡；這是barbiturate類藥物的已知毒性特徵；不符合「錯誤」描述。","此為正確描述：Oxybarbiturates（如pentobarbital）在腦中再分布後，需經由肝臟代謝才能消除，因此麻醉作用持續時間較長；Thiobarbiturates（如thiopental）也因再分布後仍存在體內脂肪，半衰期較長，但起效後初期的麻醉作用因再分布而快速消退，整體麻醉作用時間比oxybarbiturates短；不符合「錯誤」描述。","此為正確描述：Thiobarbiturates（如thiopental）含硫原子取代，脂溶性（lipophilicity）顯著高於oxybarbiturates，靜脈注射後迅速透過血腦障壁（BBB）進入CNS，因此發揮藥效快（one arm-brain circulation time）；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_046","year":2022,"roc_year":111,"session":"","examNo":46,"q":"Phenylephrine的藥理作用為何？","opts":["A. 可降低痰的黏稠度","B. 可使支氣管擴張","C. 可使鼻腔微血管收縮","D. 可使血壓降低"],"ans":2,"exp":"Phenylephrine（苯福林）是高度選擇性的α1-腎上腺素性受體致效劑（α1 agonist）。α1受體分布於血管平滑肌（包括鼻腔微血管），激動後引起平滑肌收縮→血管收縮（vasoconstriction）。用於鼻腔時，鼻黏膜微血管收縮→充血減輕→鼻塞改善；故phenylephrine常作為鼻黏膜充血去劑（nasal decongestant）。此作用是α1受體介導的血管收縮，而非支氣管擴張（β2）或降低痰的黏稠度（黏液溶解劑）。","we":["錯誤：降低痰的黏稠度（痰液稀化）是黏液溶解劑（mucolytics，如acetylcysteine、bromhexine）或祛痰劑（expectorants）的功能；phenylephrine為α1受體致效劑，具有血管收縮作用，不影響痰液黏稠度。","錯誤：支氣管擴張（bronchodilation）是β2受體致效劑（如terbutaline、salbutamol）的作用，或副交感神經阻斷劑（如ipratropium）的效果；phenylephrine主要作用於α1受體引起血管收縮，對支氣管平滑肌無直接擴張效果（α1激動反而可輕微收縮支氣管）。","","錯誤：使血壓降低是α受體拮抗劑（如phenoxybenzamine、prazosin）或其他降壓藥的作用；phenylephrine作為α1致效劑，激動全身α1受體→血管收縮→外周阻力增加→血壓上升（升壓效果），而非降壓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_047","year":2022,"roc_year":111,"session":"","examNo":47,"q":"下列關於succinylcholine的敘述，何者錯誤？","opts":["A. 可鬆弛骨骼肌","B. 只能以注射方式給藥","C. 可被血漿膽鹼脂酶（cholinesterase）水解","D. 為競爭性阻斷藥物"],"ans":3,"exp":"本題詢問關於succinylcholine（琥珀膽鹼）的錯誤描述。選項D錯誤：Succinylcholine是去極化型（depolarizing）神經肌肉阻斷劑，而非競爭性（competitive/non-depolarizing）阻斷藥物。其機制是模擬ACh持續激動神經肌肉接合處的菸鹼性受體（NMJ），造成持續去極化→終板電位維持→肌肉無法再度收縮（Phase I block）。競爭性阻斷劑（如vecuronium、atracurium）才是與ACh競爭受體但不激動。其他選項均正確：A（可鬆弛骨骼肌）、B（因口服後被血漿膽鹼酯酶迅速水解，只能注射給藥）、C（可被血漿偽膽鹼脂酶/butyrylcholinesterase水解）。","we":["此為正確描述：Succinylcholine確實可鬆弛骨骼肌；其持續去極化作用（持續激動NMJ受體）使肌肉先出現短暫的肌束顫動（fasciculations），後進入去極化型阻斷狀態，導致弛緩性骨骼肌麻痺；不符合「錯誤」描述。","此為正確描述：Succinylcholine化學結構為兩個ACh分子相連，含酯鍵，口服後迅速被胃腸道及血漿中的偽膽鹼脂酶（pseudocholinesterase/butyrylcholinesterase）水解，口服完全無效；因此只能靜脈注射或肌肉注射給藥；不符合「錯誤」描述。","此為正確描述：Succinylcholine在血漿中被偽膽鹼脂酶（plasma/pseudocholinesterase）迅速水解為琥珀酸單膽鹼，再進一步水解為琥珀酸和膽鹼，半衰期極短（約2-3分鐘）；若動物有先天性偽膽鹼脂酶缺乏，作用時間會大幅延長；不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_048","year":2022,"roc_year":111,"session":"","examNo":48,"q":"下列藥物何者是選擇性β2腎上腺素性－致效劑（β2 adrenergic-agonist）？","opts":["A. epinephrine","B. terbutaline","C. ephedrine","D. isoproterenol"],"ans":1,"exp":"選擇性β2腎上腺素性受體致效劑（selective β2 adrenergic agonist）在臨床上主要用於支氣管擴張（哮喘/慢性阻塞性肺病）。Terbutaline（特布他林）是選擇性β2受體致效劑，主要激動支氣管平滑肌的β2受體→腺苷酸環化酶活化→cAMP升高→平滑肌舒張→支氣管擴張；也可用於停止早產宮縮（子宮平滑肌β2受體）。其他選項：epinephrine同時激動α1、α2、β1、β2（非選擇性）；ephedrine同時作用α和β受體（非選擇性）；isoproterenol為非選擇性β1+β2受體致效劑（無α活性）。","we":["錯誤：Epinephrine（腎上腺素）為非選擇性腎上腺素受體致效劑，同時激動α1、α2、β1和β2受體；低劑量時β效應（心跳加速、支氣管擴張）為主，高劑量時α效應（血管收縮）明顯；並非「選擇性β2」致效劑。","","錯誤：Ephedrine為間接作用交感神經模擬藥（促進NE釋放）及直接作用非選擇性α和β受體致效劑；同時作用α1和β1、β2受體，不具有β2選擇性；且其藥效持續時間比terbutaline長但選擇性差。","錯誤：Isoproterenol（異丙腎上腺素）為非選擇性β受體致效劑，同時激動β1（心臟）和β2（支氣管、血管）受體；雖可擴張支氣管，但因β1活性導致顯著心跳加速（心動過速），不具有β2選擇性，臨床已少用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_049","year":2022,"roc_year":111,"session":"","examNo":49,"q":"有關phenoxybenzamine的藥理作用與臨床用途，下列敘述何者錯誤？","opts":["A. 會造成反射性心跳加速","B. 可用於降低犬貓尿道括約肌的緊張度","C. 為專一性α1受體致效劑","D. 可用於處理馬之蹄葉炎"],"ans":2,"exp":"本題詢問關於phenoxybenzamine藥理作用與臨床用途的錯誤描述。選項C錯誤：Phenoxybenzamine是不可逆的非選擇性α受體拮抗劑（α1+α2），而非「專一性α1受體致效劑（agonist）」；其作用描述有兩個根本錯誤：(1)是拮抗劑（antagonist）而非致效劑（agonist）；(2)非選擇性而非α1專一性。其臨床用途：A（阻斷α1引起血管擴張→反射性心跳加速為正確）、B（降低尿道括約肌α1受體介導的緊張度，協助排尿困難的貓犬）、D（用於馬蹄葉炎的血管擴張治療）。","we":["此為正確描述：Phenoxybenzamine阻斷α1受體→外周血管擴張→血壓下降→壓力感受器（baroreceptor）反射→心跳加速（reflex tachycardia）；且阻斷突觸前α2受體→NE釋放增加→進一步促進心跳加速；是phenoxybenzamine的已知副作用；不符合「錯誤」描述。","此為正確描述：Phenoxybenzamine透過阻斷尿道括約肌（internal urethral sphincter）的α1受體，降低括約肌緊張度，協助有尿道阻塞或功能性尿道緊張的犬貓排尿；是常用的臨床適應症；不符合「錯誤」描述。","","此為正確描述：馬蹄葉炎（laminitis）與指動脈收縮（digital arterial vasoconstriction）有關；phenoxybenzamine阻斷α受體→血管擴張→改善蹄部血液循環→輔助治療蹄葉炎；是已記錄的臨床應用；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_050","year":2022,"roc_year":111,"session":"","examNo":50,"q":"下列何者是有機磷中毒的專一性解劑？","opts":["A. atropine","B. pralidoxime","C. physostigmine","D. glycopyrrolate"],"ans":1,"exp":"有機磷（organophosphate）和胺甲酸酯（carbamate）農藥中毒的機制是不可逆（有機磷）或可逆（胺甲酸酯）地抑制乙醯膽鹼酯酶（AChE），導致ACh蓄積引起膽鹼性危機（SLUDGE症狀）。Pralidoxime（2-PAM，碘解磷定）是專一性（specific）解毒劑：其機制是直接與有機磷-AChE複合物的磷酸基結合，將有機磷從AChE的絲胺酸（serine）活化位點移除，使AChE重新活化（reactivation）；必須在「老化（aging）」前儘早給予。Atropine和glycopyrrolate只是對症治療（拮抗ACh的毒蕈鹼效應），並非恢復AChE活性的專一性解毒劑。","we":["錯誤：Atropine（阿托品）為毒蕈鹼性受體（muscarinic receptor）拮抗劑，可對抗有機磷中毒引起的毒蕈鹼性症狀（流涎、流淚、腹瀉、支氣管收縮、心跳減慢等），但不能恢復AChE的活性；atropine無法逆轉骨骼肌（NMJ）的菸鹼性效應，也不能恢復被抑制的AChE，不是「專一性解毒劑」。","","錯誤：Physostigmine（依色林）是可逆性AChE抑制劑，其本身也是抗膽鹼酯酶藥物；給予physostigmine會進一步抑制AChE（雖然是可逆的），而非解毒有機磷中毒；physostigmine不是有機磷中毒的解毒劑，反而會加重ACh蓄積。","錯誤：Glycopyrrolate（格隆溴銨）為季銨鹽毒蕈鹼性受體拮抗劑，與atropine類似，可對抗毒蕈鹼性症狀（但不穿越血腦障壁，無CNS效應）；同樣不能恢復AChE活性，不是有機磷中毒的「專一性解毒劑」（不能逆轉AChE失活）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_051","year":2022,"roc_year":111,"session":"","examNo":51,"q":"下列何者不是蕈毒鹼性受體（muscarinic receptors）拮抗劑的治療用途？","opts":["A. 麻痺睫狀肌","B. 治療緊迫性尿失禁","C. 治療心搏過速","D. 減少呼吸道黏液分泌"],"ans":2,"exp":"本題詢問何者「不是」蕈毒鹼性受體（muscarinic receptor）拮抗劑的治療用途。蕈毒鹼性受體拮抗劑（如atropine、glycopyrrolate、ipratropium）阻斷M受體→抑制副交感神經效應：(A)麻痺睫狀肌（M3→睫狀肌收縮，阻斷後→調節麻痺用於眼科）、(B)治療緊迫性尿失禁（阻斷逼尿肌M3受體）、(D)減少呼吸道黏液分泌（阻斷M3→腺體分泌減少）均為正確臨床用途。選項C錯誤：蕈毒鹼拮抗劑阻斷心臟M2受體→解除迷走神經抑制→心跳加速（tachycardia）；因此用於治療心跳過慢（bradycardia），而非治療心搏過速（tachycardia）；治療心搏過速需要心律不整藥物（如digoxin、β-blocker），而非muscarinic拮抗劑。","we":["此為正確描述：阻斷眼睛睫狀肌的M3受體→睫狀肌麻痺（cycloplegia）→調節麻痺（無法聚焦）；阻斷虹膜括約肌的M3受體→瞳孔散大（mydriasis）；這是散瞳劑（如atropine、tropicamide滴眼液）的眼科用途；不符合「非治療用途」的條件。","此為正確描述：膀胱逼尿肌受M3受體支配，副交感神經激動時引起逼尿肌收縮（排尿）；蕈毒鹼性受體拮抗劑（如oxybutynin、tolterodine）阻斷M3→抑制逼尿肌不自主收縮→治療緊迫性尿失禁（overactive bladder）；不符合「非治療用途」的條件。","","此為正確描述：呼吸道黏膜和支氣管腺體由副交感神經（M3受體）支配→分泌黏液；蕈毒鹼性受體拮抗劑（如glycopyrrolate、atropine）阻斷M3→減少呼吸道黏液分泌，用於麻醉前給藥（減少氣道分泌）或治療支氣管高分泌；不符合「非治療用途」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_052","year":2022,"roc_year":111,"session":"","examNo":52,"q":"下列何者作用於神經肌肉突觸前，以阻斷骨骼肌的收縮？","opts":["A. edrophonium","B. demecarium","C. decamethonium","D. hemicholinium"],"ans":3,"exp":"突觸前阻斷骨骼肌收縮的藥物，是指作用於神經末梢（presynaptic），干擾ACh的合成或釋放。Hemicholinium（半膽鹼）阻斷神經末梢上的高親和性膽鹼（choline）轉運蛋白（CHT1），阻止膽鹼被攝入神經末梢，使ACh合成原料枯竭→ACh逐漸耗竭→神經肌肉傳遞被阻斷。其效果在反覆刺激時更明顯（因ACh庫存逐漸消耗）。其他選項：edrophonium和demecarium均為AChE抑制劑（讓ACh增加，而非突觸前阻斷）；decamethonium為去極化型NMJ阻斷劑（突觸後）。","we":["錯誤：Edrophonium（騰喜龍）為可逆性AChE抑制劑，作用於突觸間隙（synaptic cleft）而非突觸前；它抑制AChE分解ACh，使突觸間ACh濃度增加，增強NMJ傳導；臨床用於診斷重症肌無力（Tensilon test）和拮抗非去極化型肌松藥，作用位點在突觸後（促進傳遞），而非突觸前阻斷。","錯誤：Demecarium（地美卡利）為長效可逆性AChE抑制劑，主要用於眼科（降低眼壓，治療青光眼）；其機制為抑制AChE使ACh蓄積，是突觸後效果增強，而非突觸前阻斷ACh合成/釋放；不符合「突觸前阻斷骨骼肌收縮」的描述。","錯誤：Decamethonium為去極化型神經肌肉阻斷劑，作用於NMJ的突觸後膜（postsynaptic）上的菸鹼性受體；它直接激動受體引起持續去極化→Phase I阻斷；作用位點在突觸後（postsynaptic），而非突觸前（presynaptic）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_053","year":2022,"roc_year":111,"session":"","examNo":53,"q":"對於因心臟收縮異常而給予digoxin治療之犬隻，必須注意下列何種臨床症狀易導致digoxin中毒？","opts":["A. hyperkalemia and hyponatremia","B. hypercalcemia and hypokalemia","C. hypernatremia and hypocalcemia","D. hypomagnesemia and hypercalcemia"],"ans":1,"exp":"Digoxin（地高辛）的毒性機制主要與其抑制心肌細胞膜Na⁺/K⁺-ATPase有關。兩種電解質異常顯著增加digoxin毒性：(1)高鈣血症（hypercalcemia）：細胞內Ca²⁺升高增加心肌收縮性（正性肌力），而digoxin本身也升高細胞內Ca²⁺；兩者協同→心律不整；(2)低鉀血症（hypokalemia）：K⁺是Na⁺/K⁺-ATPase的競爭底物；低血鉀時，K⁺競爭減少→digoxin更易與Na⁺/K⁺-ATPase結合→毒性增加；此外低血鉀本身也使心肌靜止膜電位降低→增加自律性。故本題答案B（hypercalcemia and hypokalemia）。","we":["錯誤：Hyperkalemia（高血鉀）與hyponatremia（低血鈉）的組合：高血鉀反而可降低digoxin毒性（K⁺與Na⁺/K⁺-ATPase結合位點的競爭增強，K⁺↑→digoxin結合減少→毒性降低）；低血鈉對digoxin毒性影響不顯著；此組合不符合「增加digoxin毒性」的條件。","","錯誤：Hypernatremia（高血鈉）與hypocalcemia（低血鈣）的組合：低血鈣降低心肌收縮力，可能反而對digoxin的正性肌力效果有所拮抗；高血鈉對digoxin毒性無直接顯著影響；此組合不是增加digoxin毒性的典型危險因素。","錯誤：Hypomagnesemia（低血鎂）可降低Na⁺/K⁺-ATPase活性並可增加digoxin毒性（低鎂與低鉀常並存），但hypercalcemia（高血鈣）才是主要增毒因素；此選項雖含低血鎂（部分正確），但搭配的是hypercalcemia（高血鈣），而正確組合應是hypercalcemia AND hypokalemia；低鎂配高鈣與B選項（低鉀配高鈣）相比，B才是最典型、最常考的組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_054","year":2022,"roc_year":111,"session":"","examNo":54,"q":"患有高血壓合併氣喘的犬隻，不宜使用下列何種降血壓藥物？","opts":["A. benazepril","B. nitroglycerin","C. propranolol","D. losartan"],"ans":2,"exp":"患有高血壓合併氣喘（asthma）的犬隻，禁用propranolol（普萘洛爾）。Propranolol是非選擇性β-腎上腺素性受體拮抗劑（β1+β2阻斷）。支氣管平滑肌上的β2受體活化後引起支氣管擴張；propranolol阻斷β2受體→支氣管平滑肌收縮→支氣管痙攣（bronchospasm）→加重氣喘症狀，在已有氣道過度反應的患畜中可能致命。其他選項可用於此患畜：A（benazepril=ACEI，安全降壓）、B（nitroglycerin=血管舒張藥，安全）、D（losartan=ARB，安全降壓）。","we":["錯誤：Benazepril為ACE抑制劑（ACEI），主要透過抑制angiotensin II生成（血管收縮↓）和增加緩激肽（bradykinin）降壓；不直接影響β受體，不引起支氣管收縮；對有氣喘的動物是安全的降壓選擇，不符合「不宜使用」的條件。","錯誤：Nitroglycerin（硝化甘油）為有機硝酸酯，釋放NO→血管平滑肌鬆弛→靜脈和動脈擴張→降低前負荷和後負荷；不作用於β受體，不引起支氣管痙攣；對氣喘患畜安全，不符合「不宜使用」的條件。","","錯誤：Losartan為血管張力素II受體拮抗劑（ARB/angiotensin receptor blocker），阻斷AT1受體→血管擴張→降壓；不影響β受體，不引起支氣管收縮；相較於ACEI，ARB更少引起乾咳（因不影響bradykinin代謝），對氣喘患畜安全，不符合「不宜使用」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_055","year":2022,"roc_year":111,"session":"","examNo":55,"q":"Dalteparin sodium要產生抗凝血作用必須先與下列何者結合？","opts":["A. prothrombin","B. antithrombin III","C. 凝血因子Xa","D. vitamin K"],"ans":1,"exp":"Dalteparin sodium（達肝素鈉）為低分子肝素（LMWH, low molecular weight heparin），其抗凝血機制必須與抗凝血酶III（antithrombin III, AT-III）結合才能發揮作用。LMWH與AT-III結合後，使AT-III構型改變→抑制凝血因子Xa的活性（主要）和凝血酶IIa的活性（部分）；LMWH對Xa的抑制比對IIa的抑制選擇性更高（Xa:IIa比約2:1至4:1），是與未分裂肝素（UFH，Xa:IIa=1:1）的主要區別。Dalteparin本身無直接抗凝血活性，必須透過AT-III才能發揮效果。","we":["錯誤：Prothrombin（凝血酶原，因子II）是凝血酶（thrombin）的前驅物；dalteparin不直接與prothrombin結合；LMWH的作用靶點是凝血因子Xa（主要）和凝血酶（次要），且必須通過AT-III間接作用，而非直接與prothrombin結合。","","錯誤：雖然dalteparin的最終效果是抑制凝血因子Xa，但其機制是透過先與AT-III結合（增強AT-III的活性），再由活化的AT-III去抑制Xa；dalteparin並非直接與Xa結合；直接Xa抑制劑（如rivaroxaban、apixaban）才是直接結合Xa，機制不同。","錯誤：Vitamin K是凝血因子II、VII、IX、X的γ-羧基化所必需的輔因子；warfarin（可華林）阻斷維生素K循環（抑制VKOR），間接抑制這些因子的合成；dalteparin是肝素類藥物，作用機制完全不同，不需要與vitamin K結合，也不影響維生素K依賴因子的合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_056","year":2022,"roc_year":111,"session":"","examNo":56,"q":"Clopidogrel抗血小板凝集之作用機制為何？","opts":["A. 阻斷血小板P2Y12受體與ADP之作用","B. 抑制thromboxane受體與arachidonic acid之作用","C. 抑制phosphodiesterase III之作用","D. 阻斷GpIIb-IIIa受體與fibrinogen結合"],"ans":0,"exp":"Clopidogrel（保栓通）為噻吩吡啶類（thienopyridine）抗血小板藥，是ADP受體（P2Y12受體）的不可逆拮抗劑。其作用機制：clopidogrel為前驅藥（prodrug），需經肝臟CYP2C19代謝為活性代謝物→活性代謝物不可逆地與血小板P2Y12受體（ADP受體）共價結合→阻斷ADP誘導的血小板活化和GPIIb-IIIa受體活化→抑制血小板聚集。血小板P2Y12受體阻斷後，cAMP升高→血小板活化信號受阻。在獸醫學上，clopidogrel用於貓的血栓栓塞症（如肥厚性心肌病引起的主動脈血栓）預防。","we":["","錯誤：抑制thromboxane受體（TP受體）與arachidonic acid的作用是其他抗血小板藥物的機制；如aspirin抑制COX-1→TXA2合成減少；terutroban等TP受體拮抗劑直接阻斷TP受體；clopidogrel的靶點是P2Y12（ADP受體），不是thromboxane受體。","錯誤：抑制phosphodiesterase III（PDE3）是cilostazol（西洛他唑）的抗血小板機制，PDE3抑制→cAMP升高→血小板活化受阻；此機制與clopidogrel（P2Y12拮抗劑）不同，clopidogrel的抑制血小板效果通過阻斷ADP受體而非直接升高cAMP。","錯誤：阻斷GpIIb-IIIa受體與fibrinogen結合是直接GpIIb-IIIa拮抗劑（如abciximab、eptifibatide、tirofiban）的機制；這類藥物直接阻斷血小板聚集的最終共同通路（fibrinogen橋接）；clopidogrel並非直接作用於GpIIb-IIIa，而是上游的P2Y12信號。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_057","year":2022,"roc_year":111,"session":"","examNo":57,"q":"下列何種利尿劑具有耳毒性之不良反應？","opts":["A. trichlorothiazide","B. torsemide","C. dichlorphenamide","D. triamterene"],"ans":1,"exp":"耳毒性（ototoxicity）是袢利尿劑（loop diuretics）的特徵性不良反應，尤其是furosemide、ethacrynic acid和torsemide。機制：袢利尿劑抑制耳蝸血管紋（stria vascularis）的Na⁺-K⁺-2Cl⁻（NKCC2）共轉運蛋白，干擾內淋巴液的離子組成→耳蝸電位改變→毛細胞（hair cell）受損→聽力損失（感音性耳聾）。高劑量靜脈注射時耳毒性最大；ethacrynic acid耳毒性最強。Torsemide為袢利尿劑，具有此不良反應。其他選項：trichlorothiazide（噻嗪類，無耳毒性）、dichlorphenamide（碳酸酐酶抑制劑，無耳毒性）、triamterene（保鉀利尿劑，無耳毒性）。","we":["錯誤：Trichlorothiazide為噻嗪類利尿劑（thiazide），作用於遠曲小管（DCT），抑制NaCl共轉運蛋白（NCC）；噻嗪類的主要副作用為低血鉀、高尿酸血症、高血糖、低血鈉等，不引起耳毒性；耳毒性是袢利尿劑的特性，不屬於噻嗪類。","","錯誤：Dichlorphenamide為碳酸酐酶抑制劑（carbonic anhydrase inhibitor），作用於近端小管（抑制HCO₃⁻再吸收）；主要副作用為代謝性酸中毒、腎結石、感覺異常（paresthesia）；不引起耳毒性，與袢利尿劑的作用機制和副作用完全不同。","錯誤：Triamterene為保鉀利尿劑（potassium-sparing diuretic），作用於集尿管（collecting duct），直接阻斷上皮鈉通道（ENaC）；主要副作用為高血鉀、腎結石（triamterene可析出結晶）；不引起耳毒性，與袢利尿劑作用靶點和副作用不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_058","year":2022,"roc_year":111,"session":"","examNo":58,"q":"下列影響食慾的藥物中，何者屬於serotonin拮抗劑？","opts":["A. diazepam","B. cyproheptadine","C. prednisolone","D. dirlotapide"],"ans":1,"exp":"Cyproheptadine（賽庚啶）是第一代抗組織胺（H1受體拮抗劑）兼serotonin（5-HT，主要為5-HT2受體）拮抗劑。其促進食慾的機制：拮抗下視丘的5-HT2C受體（5-HT2C活化時抑制食慾），解除5-HT對食慾的抑制→食慾增加。在獸醫臨床中，cyproheptadine最常用於促進貓的食慾（尤其用於厭食症/慢性腎衰竭的貓）。其他選項：diazepam（苯二氮平，GABA-A受體調節劑）、prednisolone（類固醇，不是serotonin拮抗劑）、dirlotapide（microsomal triglyceride transfer protein抑制劑，用於犬減重）。","we":["錯誤：Diazepam（安定）為苯二氮平類，正向調節GABA-A受體（Cl⁻通道），具有鎮靜、抗焦慮、肌肉鬆弛效果；雖在某些情況下可短期促進貓的食慾，但其機制是通過GABA-A受體，不是serotonin拮抗劑；不符合「屬於serotonin拮抗劑」的描述。","","錯誤：Prednisolone為合成糖質皮質素（glucocorticoid），作用於細胞內皮質素受體（GR），具有抗炎、免疫抑制效果；雖可能因改善炎症而增加動物食慾，但其機制為糖質皮質素效應，不是serotonin受體拮抗，不符合「屬於serotonin拮抗劑」的描述。","錯誤：Dirlotapide為微粒體甘油三酯轉運蛋白（MTP）抑制劑，作用於腸道上皮細胞，減少乳糜微粒合成→腸道脂質蓄積→釋放飽食訊號（PYY）→抑制食慾→減重；其機制為抑制食慾（非促進），且與serotonin受體無關；不符合「serotonin拮抗劑且促進食慾」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_059","year":2022,"roc_year":111,"session":"","examNo":59,"q":"有關misoprostol的敘述，下列何者錯誤？","opts":["A. prostaglandin E1 (PGE1) 衍生物","B. 抑制壁細胞胃酸的分泌","C. 可用於預防流產","D. 可能引起下痢、腹痛等不良反應"],"ans":2,"exp":"本題詢問關於misoprostol的錯誤描述。Misoprostol（米索前列醇）是PGE1（前列腺素E1）的合成衍生物，作用於子宮平滑肌和宮頸的前列腺素受體，引起子宮收縮（uterotonic/oxytocic effect）和宮頸軟化擴張。因此misoprostol是「引起子宮收縮和流產的藥物」，人醫中用於藥物性流產（與mifepristone合用）和引產。選項C錯誤：misoprostol不能「預防流產」，反而會「引起流產（終止妊娠）」。其他選項均正確：A（PGE1衍生物）、B（激動胃壁細胞PGE受體→抑制cAMP→抑制胃酸分泌，並促進黏液/碳酸氫鹽分泌，用於保護胃黏膜）、D（前列腺素的GI副作用，包括腹瀉和腹痛）。","we":["此為正確描述：Misoprostol確實是prostaglandin E1（PGE1）的合成甲基衍生物，具有PGE1的藥理活性（EP受體激動）；相較於天然PGE1，misoprostol口服後穩定性更好，作用時間更長；不符合「錯誤」描述。","此為正確描述：Misoprostol激動胃壁細胞（parietal cell）上的EP3受體→抑制adenylate cyclase→cAMP降低→H⁺/K⁺-ATPase（質子幫浦）活性降低→胃酸分泌減少；同時促進胃黏膜細胞分泌保護性黏液和碳酸氫鹽；是misoprostol的胃腸保護作用，不符合「錯誤」描述。","","此為正確描述：前列腺素類藥物對消化道平滑肌有刺激作用，misoprostol常見副作用包括腹瀉（最常見，約10-40%）、腹痛和腹部痙攣；這些副作用是由腸道EP受體介導的腸蠕動增加和腸液分泌增加引起；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_060","year":2022,"roc_year":111,"session":"","examNo":60,"q":"Sucralfate主要為下列何種複合物？","opts":["A. sucrose sulfate-magnesium hydroxide complex","B. sucrose sulfate-sodium bicarbonate complex","C. sucrose sulfate-magnesium bicarbonate complex","D. sucrose sulfate-aluminum hydroxide complex"],"ans":3,"exp":"Sucralfate（硫糖鋁）是sucrose octasulfate（蔗糖硫酸酯）與aluminum hydroxide（氫氧化鋁）形成的複合物（sucrose sulfate-aluminum hydroxide complex）。在胃酸環境下（pH<4），sucralfate解離為硫酸化蔗糖陰離子和Al³⁺，硫酸化蔗糖與潰瘍底部帶正電的蛋白質（炎症部位釋放的蛋白質）結合，形成黏稠保護膜（physical barrier），並促進胃黏膜前列腺素合成和黏液/碳酸氫鹽分泌；Al³⁺有收斂和中和作用。主要用於胃食道潰瘍的輔助治療。","we":["錯誤：此選項中的「magnesium hydroxide（氫氧化鎂）」是制酸劑（antacid），但sucralfate的組成中含有的是aluminum hydroxide（氫氧化鋁），而非氫氧化鎂；鎂鋁的混淆是常見干擾；sucralfate的正確成分為sucrose sulfate + aluminum hydroxide。","錯誤：此選項中的「sodium bicarbonate（碳酸氫鈉）」也是制酸劑，不是sucralfate的成分；碳酸氫鈉為鹼性，與sucralfate在酸性環境下發揮作用的機制相矛盾；sucralfate不含碳酸氫鈉，正確成分為aluminum hydroxide。","錯誤：此選項中的「magnesium bicarbonate（碳酸氫鎂）」既非sucralfate的鋁鹽成分，也非正確的硫酸化蔗糖搭配物；同時含錯誤陽離子（鎂而非鋁）和錯誤陰離子（碳酸氫而非氫氧）；不符合sucralfate的實際化學組成。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_061","year":2022,"roc_year":111,"session":"","examNo":61,"q":"Neostigmine可作為胃腸促動劑，其作用機制為何？","opts":["A. 抑制acetylcholinesterase","B. 5-HT4 受體致效劑","C. 受體拮抗劑","D. cholinergic受體致效劑"],"ans":0,"exp":"Neostigmine（新斯的明）作為胃腸促動劑（prokinetic agent）的作用機制是：抑制乙醯膽鹼酯酶（acetylcholinesterase, AChE）→突觸間ACh累積↑→激動腸道平滑肌的M3型毒蕈鹼性受體→腸道平滑肌收縮→蠕動增加→胃腸促動效果。換言之，neostigmine並非直接激動膽鹼性受體，而是透過抑制AChE間接使內源性ACh濃度升高，再由ACh激動腸道受體；屬於間接擬副交感神經藥。臨床上用於馬和牛的腸阻塞（ileus）、腸積氣的輔助治療。","we":["","錯誤：5-HT4受體致效劑（如metoclopramide的部分作用、mosapride、cisapride）是另一類促動劑的機制，通過激動腸肌層神經叢（myenteric plexus）的5-HT4受體促進ACh釋放→腸道蠕動；neostigmine不作用於5-HT4受體，而是透過抑制AChE使ACh蓄積，作用靶點和機制完全不同。","錯誤：受體拮抗劑（antagonist）是阻斷受體，如D2受體拮抗劑（metoclopramide的另一作用）阻斷嘔吐中樞；neostigmine為AChE抑制劑，效果等同於增加ACh的「致效劑樣」作用，而非拮抗（阻斷）任何受體；此描述完全相反。","錯誤：Cholinergic受體致效劑（直接作用型，如bethanechol）是直接與膽鹼性受體結合並激動；neostigmine為間接作用型（indirect-acting cholinergic agent），透過抑制AChE使內源性ACh蓄積，並非直接結合並激動受體；雖然最終效果類似，但選項D描述的機制（直接致效劑）與正確答案A（AChE抑制劑）不同。"],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAZAEUDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAUEBwIDBgEI/8QAKRAAAgIBBAEEAgIDAQAAAAAAAQIDBAUABhEhEhMUMUEiUSMyFVJicf/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/EACERAAIBAQkBAAAAAAAAAAAAAAABEfACEiEiMUFRsdHB/9oADAMBAAIRAxEAPwD6gtX6dSxWgtWoIZ7TlII5JArSsByQoPZPHfWpOqZym4bOafa2beUMkO4rMAxyIPJDFFZVQT/bzIXkg9fkOAOOTPXeuc/xODyVeetYTNYmzdKejytOWOISDjgglOT4EMefLjsfGpOV2uPJLGZWefYLX0aqEby3FjoIZclksdLBfwS5KKb2jKKkvlEgUhWPmG9Xr47H6+Nse8NwSWPYx2YIpU3GuJZ7ECPJ6TVxIPIIwXyBPHXXWtQ5u1rd7MyomtJ6LZ1opXK16FpaViGxErtGXicMAykqy8j7BBBH7Gqzw+59x+8xBu36liCXO2cJKi1fAyKglKy8+XTfxr0Bx2dY43c248jJt+rFepV5L+RydSaUU/LgQNKEKjy66QfPPf7+NTaa2f1FeGDrXxlq6NU7id9bgzdGpWr3cRQyq4wXfVuN6cVhxLJG3Xix8B6YJCkEeY71YC7ite4mgO3stJ6cYZbESxGGZjx+KEyBuyfllUdEnjQbxVYnRaNKNs5xc7Usye0sUrFWw1WxXseJaORQD8qSpBDAgg/ejQGT7bwb5Fr74bGteZxKbJqoZC4HAby455A+9aMjtyk+KytfFU6NG1egkiadK6qSXB5LePBbs8/PZ080ajSahlTacnO7e2njcZtmDE2cfjph7aOtaK1VCWQq8cup5557PB5+TqUm1tvxsjJgsUrI6yqRTjBV1HirDrogdA/Q040a0225ZlJJQhSm2sEhjKYXGKY5zZQipGPGU/Mg66Y/7fOvIds4GFoWhwmLjaF3kiK1IwUZ/wC7L10W+yPn7030ahRMdq7eaGpE2BxJiqOZKyGnH4wsTyWQcfiee+Rqbl2vrjbBw8dWW/4/wrakaOPy/wCmVWPH/g1M0aPgCXadS/Txrx5SrTrTmVnPtrLWPULds7O0cf5FiegvA64/QNOtGgP/2Q=="]},{"id":"AMO_2022_藥理_062","year":2022,"roc_year":111,"session":"","examNo":62,"q":"下列何者為最有效且常用於犬的家用催吐劑？","opts":["A. copper sulfate","B. hydrogen peroxide","C. sodium chloride","D. syrup of ipecac"],"ans":2,"exp":"本題詢問最有效且常用於犬的家用催吐劑（home emetic）。依據本考題標準答案，sodium chloride（食鹽水/高滲鹽水）為C選項。高濃度食鹽溶液刺激胃黏膜和中樞化學受體觸發帶（CRTZ）誘發嘔吐。雖然在臨床實際應用中，3%過氧化氫（hydrogen peroxide, H₂O₂）在國際上更常見，但依本題考選部答案，答案為C（sodium chloride）。其他選項：copper sulfate（硫酸銅）有嚴重全身毒性風險；hydrogen peroxide（H₂O₂）氣體可能引起胃腸黏膜傷害；syrup of ipecac（吐根糖漿）在犬效果不佳且有心毒性風險。","we":["錯誤：Copper sulfate（硫酸銅）雖有催吐效果，但銅離子毒性高，吸收後可引起全身毒性（肝毒性、紅血球溶解、腎損傷）；在犬中使用風險過高，目前不建議作為家用催吐劑；況且本考題標準答案為sodium chloride，而非copper sulfate。","錯誤：Hydrogen peroxide（H₂O₂，3%）口服後在胃中分解釋放O₂泡沫刺激胃壁引起嘔吐，雖國際上較常用，但高濃度或過量使用可引起胃黏膜出血、氣胸或空氣栓塞風險；本考題選定sodium chloride為最佳家用催吐劑答案。","","錯誤：Syrup of ipecac（吐根糖漿）含吐根鹼（emetine和cephaeline），在人醫曾廣泛使用，但在犬中催吐效果不如預期（效果不穩定），且重複或過量使用可引起心毒性（吐根鹼的心臟毒性）、肌肉毒性；現已不推薦用於犬的家用催吐。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_063","year":2022,"roc_year":111,"session":"","examNo":63,"q":"下列何者是作用於膽鹼性受體的止吐藥物？","opts":["A. droperidol","B. aminopentamide","C. bethanechol","D. ondansetron"],"ans":1,"exp":"本題詢問作用於膽鹼性受體（cholinergic receptor）的止吐藥物。Aminopentamide（胺基五胺酸，Centrine）是抗蕈毒鹼性（anticholinergic）藥物，屬於抗膽鹼性止吐劑，主要阻斷消化道和嘔吐中樞的毒蕈鹼性（M）受體→抑制胃腸過度蠕動→止吐、止瀉、解痙；也可減少唾液和胃液分泌。其他選項：droperidol（丁酮哌丁苯醇，D2受體拮抗劑）、bethanechol（毒蕈鹼性受體致效劑，促進腸蠕動，反而可能促嘔）、ondansetron（5-HT3受體拮抗劑）均非作用於膽鹼性受體的止吐藥。","we":["錯誤：Droperidol（丁酮哌丁苯醇）為丁苯酮類抗精神病藥，主要作用機制為D2受體拮抗劑（阻斷多巴胺D2受體），止吐作用通過阻斷化學受體觸發帶（CRTZ）的D2受體；並非作用於膽鹼性受體的藥物。","","錯誤：Bethanechol為毒蕈鹼性受體（M2/M3）直接致效劑，會促進腸道蠕動和腺體分泌，用於治療尿瀦留和反流性食道炎輔助；其作用是激動膽鹼性受體（非拮抗），且效果為促進腸道活動，而非止吐（甚至可能誘發嘔吐）。","錯誤：Ondansetron為5-HT3受體（血清素3型受體）的選擇性拮抗劑，通過阻斷迷走神經傳入纖維和嘔吐中樞（NTS）的5-HT3受體發揮止吐效果；不作用於膽鹼性受體；在犬貓嘔吐治療中廣泛使用，但機制與aminopentamide完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_064","year":2022,"roc_year":111,"session":"","examNo":64,"q":"下列何者投予後會造成支氣管平滑肌cAMP蓄積，而使支氣管舒張並增加腺體分泌？","opts":["A. atenolol","B. ipratropium","C. terbutaline","D. dexmedetomidine"],"ans":2,"exp":"Terbutaline（特布他林）為選擇性β2腎上腺素性受體致效劑，作用於支氣管平滑肌β2受體的機制：β2受體活化→偶聯Gs蛋白→腺苷酸環化酶（adenylate cyclase）活化→ATP→cAMP↑→protein kinase A（PKA）活化→(1)支氣管平滑肌肌球蛋白輕鏈激酶（MLCK）失活→平滑肌鬆弛→支氣管擴張；(2)氯離子通道開放→黏膜下腺體分泌增加（增加腺體分泌為β2副作用之一）。故terbutaline投予後造成「支氣管平滑肌cAMP蓄積→支氣管擴張並增加腺體分泌」，符合本題描述。","we":["錯誤：Atenolol為高度選擇性β1受體拮抗劑（β1-blocker），主要作用於心臟β1受體（減少心率和心搏輸出量），用於高血壓和心律不整；阻斷β受體不會使cAMP蓄積（反而降低腺苷酸環化酶活性），且主要作用於心臟β1受體而非支氣管β2受體。","錯誤：Ipratropium為季銨鹽抗膽鹼劑（毒蕈鹼性受體拮抗劑），主要阻斷M3受體→支氣管擴張（消除副交感神經收縮作用）；ipratropium的支氣管擴張機制是阻斷Gq/IP3途徑，而非透過cAMP；不會引起支氣管平滑肌cAMP蓄積。","","錯誤：Dexmedetomidine（右美托咪定）為高選擇性α2腎上腺素性受體致效劑，激動α2受體→偶聯Gi蛋白→腺苷酸環化酶受抑→cAMP降低；主要用於鎮靜/鎮痛（動物麻醉前給藥），不引起支氣管擴張，反而可能輕微引起支氣管平滑肌收縮。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_065","year":2022,"roc_year":111,"session":"","examNo":65,"q":"下列有關肥大細胞穩定劑的敘述，何者錯誤？","opts":["A. Cromolyn噴霧投予可預防馬的recurrent airway obstruction與heaves","B. Nedocromil有與cromolyn類似之穩定肥大細胞作用","C. Cromolyn眼滴劑可用於控制馬的過敏性結膜炎","D. Cromolyn拮抗肥大細胞第一型組織胺受體並打開鉀離子通道，使肥大細胞過極化"],"ans":3,"exp":"本題詢問關於肥大細胞穩定劑的錯誤描述。選項D錯誤：Cromolyn（色甘酸鈉）的正確機制是阻止Ca²⁺進入肥大細胞（抑制鈣離子通道），從而阻止肥大細胞脫顆粒（degranulation）和組織胺等炎症介質的釋放；cromolyn並不是H1組織胺受體拮抗劑，也不打開K⁺通道。選項D描述的「拮抗H1受體並打開鉀離子通道使肥大細胞過極化」是錯誤的機制描述（那是部分抗過敏藥的假設機制，非cromolyn的已知作用）。選項A、B、C均為正確描述。","we":["此為正確描述：Cromolyn（色甘酸鈉）噴霧投予可預防馬的recurrent airway obstruction（RAO）與heaves（慢性阻塞性肺病/反覆氣道阻塞），通過穩定肥大細胞、阻止炎症介質釋放；是馬呼吸道過敏的輔助預防用藥；不符合「錯誤」描述。","此為正確描述：Nedocromil（奈多羅米）與cromolyn同屬肥大細胞穩定劑，具有類似的穩定肥大細胞作用（阻止Ca²⁺流入、抑制脫顆粒），且nedocromil還有一定的抗炎活性（抑制嗜酸性球等）；不符合「錯誤」描述。","此為正確描述：Cromolyn眼滴劑確實可用於控制馬的過敏性結膜炎（allergic conjunctivitis），通過局部穩定結膜肥大細胞、減少組織胺等介質釋放，改善結膜過敏症狀；不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_066","year":2022,"roc_year":111,"session":"","examNo":66,"q":"化痰藥中何者最常被用來治療貓的acetaminophen中毒？","opts":["A. ethylenediamine dihydroiodide","B. glyceryl guaiacolate","C. potassium iodide","D. acetylcysteine"],"ans":3,"exp":"Acetylcysteine（乙醯半胱胺酸，NAC）雖然名稱和功能包含痰液稀化（mucolytic，斷裂痰液中雙硫鍵）的作用，但其更重要的臨床用途之一是治療acetaminophen（乙醯胺酚/撲熱息痛）中毒。機制：acetaminophen在肝臟代謝產生毒性代謝物NAPQI（N-acetyl-p-benzoquinone imine），正常情況下由glutathione（穀胱甘肽）解毒；大量攝取後glutathione耗盡→NAPQI蓄積→肝細胞壞死。NAC提供半胱胺酸（cysteine）前驅物→補充glutathione合成→解毒NAPQI。貓對acetaminophen特別敏感（缺乏葡萄糖醛酸轉移酶）。","we":["錯誤：Ethylenediamine dihydroiodide（EDDI）為有機碘化合物，常用於牛的呼吸道感染（配製成吸入劑）、真菌病（如actinomycosis、blastomycosis的輔助治療）以及補充碘源；為祛痰輔助劑，不是acetaminophen中毒的解毒劑。","錯誤：Glyceryl guaiacolate（愈創甘油醚，guaifenesin）為中樞性肌肉鬆弛劑（在靜脈注射劑量下）及祛痰劑（口服劑量下，刺激呼吸道分泌、稀化痰液，改善黏液纖毛清除）；不是acetaminophen中毒的解毒劑，與NAC（補充glutathione）的機制完全不同。","錯誤：Potassium iodide（碘化鉀）為祛痰劑（促進呼吸道分泌）和碘補充劑；也用於治療真菌病（sporotrichosis）和甲狀腺亢進術前準備；與acetaminophen解毒（glutathione補充）完全無關，不是本題描述的功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_067","year":2022,"roc_year":111,"session":"","examNo":67,"q":"【已刪除】67.下列何者藥理作用機制為提升周邊血管平滑肌內cyclic GMP的量，使血管擴張？","opts":["A. benazepril","B. losartan","C. amlodipine","D. amrinone"],"ans":4,"exp":"本題已刪除（考選部公告）。題目詢問何者藉由提升周邊血管平滑肌內cyclic GMP（cGMP）的量，使血管擴張。一般而言，cGMP升高的血管舒張機制包括：NO（一氧化氮）→可溶性鳥苷酸環化酶（sGC）→cGMP升高，或natriuretic peptides（ANP/BNP）→顆粒型鳥苷酸環化酶（pGC）→cGMP升高。本題選項中：A（benazepril）為ACE抑制劑（ACEI，抑制angiotensin II生成）、B（losartan）為AT1受體拮抗劑（ARB）、C（amlodipine）為鈣離子通道阻斷劑（CCB）、D（amrinone）為PDE3抑制劑（升高cAMP而非cGMP）；四個選項均非透過cGMP途徑直接使血管舒張，故本題無正確選項而遭刪除。","we":["本題已刪除，無正確答案。Benazepril為ACE抑制劑（ACEI），其降血壓機制是抑制血管張力素轉化酶（ACE）→angiotensin I無法轉化為angiotensin II→血管收縮力降低；作用機制涉及RAAS系統，不是透過cGMP途徑升高血管平滑肌cGMP來舒張血管；故不符合題目描述的cGMP機制。","本題已刪除，無正確答案。Losartan為血管張力素II受體拮抗劑（ARB），阻斷AT1受體→阻斷angiotensin II的縮血管作用→血壓降低；作用機制為阻斷AT1/Gq蛋白信號，不是升高cGMP的舒血管機制；故不符合題目描述的cGMP途徑。","本題已刪除，無正確答案。Amlodipine為二氫吡啶類（dihydropyridine）鈣離子通道阻斷劑（CCB），阻斷血管平滑肌細胞膜L型電壓依賴性Ca²⁺通道→細胞內Ca²⁺減少→平滑肌鬆弛→血管擴張；作用機制為阻斷鈣離子，不是升高cGMP；故不符合題目描述的cGMP機制。","本題已刪除，無正確答案。Amrinone（氨力農）為PDE3（磷酸二酯酶3型）抑制劑，抑制PDE3→cAMP降解受阻→細胞內cAMP升高→PKA活化→心肌收縮力增加（正性肌力）及血管平滑肌鬆弛；其舒血管機制是升高cAMP而非cGMP；故不符合題目「升高cGMP」的描述，本題因無正確選項而遭刪除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_068","year":2022,"roc_year":111,"session":"","examNo":68,"q":"當早產出生之小牛因缺乏內源性表面活性劑，並表現出呼吸窘迫時，下列何種處置對於改善小牛呼吸作用最\r 有利？","opts":["A. 靜脈注射doxapram","B. 噴霧投予terbutaline","C. 口服投予theophylline","D. 氣管導管投予beractant"],"ans":3,"exp":"早產小牛（premature calf）因肺部發育不成熟，缺乏內源性肺表面活性劑（endogenous surfactant），導致呼吸窘迫症候群（RDS, respiratory distress syndrome）：肺泡表面張力過高→肺泡萎陷（atelectasis）→換氣障礙。Beractant（貝拉坦，Survanta）是從牛肺臟萃取的天然表面活性劑替代品（natural bovine-derived surfactant replacement），含磷脂（主要為DPPC）和表面活性相關蛋白；氣管導管（intratracheal）直接投予肺部→降低肺泡表面張力→預防肺泡萎陷→改善換氣。此為最直接有效的治療RDS的方法。","we":["錯誤：Doxapram（多沙普侖）為呼吸興奮劑（respiratory stimulant），主要作用於頸動脈體化學受體和延髓呼吸中樞，增加呼吸頻率和呼吸幅度；但其無法解決表面活性劑缺乏導致的肺泡萎陷問題（根本原因），對RDS無根本治療效果；靜脈注射doxapram不能替代表面活性劑。","錯誤：Terbutaline（β2致效劑）噴霧投予可擴張支氣管，用於哮喘或支氣管痙攣；但早產小牛RDS的根本問題是表面活性劑缺乏導致肺泡萎陷，而非支氣管痙攣；β2受體致效劑不能補充表面活性劑，不是改善RDS的最有利處置。","錯誤：Theophylline（茶鹼）為methylxanthine類，機制為PDE抑制（cAMP升高）和腺苷受體拮抗，可輕微擴張支氣管和刺激呼吸中樞；雖在早產兒呼吸暫停（apnea of prematurity）中有一定用途，但口服吸收不穩定且不能解決表面活性劑缺乏問題；相較於直接補充beractant，效果遠遜。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_069","year":2022,"roc_year":111,"session":"","examNo":69,"q":"下列何者最容易通過血腦屏障，而具有較顯著的鎮靜作用？","opts":["A. cetirizine","B. fexofenadine","C. loratadine","D. promethazine"],"ans":3,"exp":"本題詢問最容易通過血腦屏障（BBB）並具有最顯著鎮靜作用的抗組織胺藥。Promethazine（異丙嗪）為第一代吩噻嗪類（phenothiazine）抗組織胺藥，高度親脂性（高log P值）→極易通過BBB→顯著中樞H1受體阻斷→強效鎮靜。其他選項均為第二代或低鎮靜性抗組織胺藥：cetirizine（賽替利嗪，第二代，極性高，BBB穿透有限）、fexofenadine（非索非那定，第二代，強有機陰離子轉運蛋白（P-gp）底物，被主動排出CNS）、loratadine（氯雷他定，第二代，雖有親脂性但P-gp底物特性使CNS穿透低）。","we":["錯誤：Cetirizine（賽替利嗪）為第二代抗組織胺，親脂性低（帶電荷的zwitter-ionic structure），BBB穿透率極低；設計上即為低鎮靜性（non-sedating/minimally sedating）抗組織胺，不符合「最容易通過BBB且具有最顯著鎮靜作用」的描述。","錯誤：Fexofenadine（非索非那定）為第二代抗組織胺，是P-醣蛋白（P-glycoprotein）的底物，在血腦障壁被P-gp主動外排泵（efflux pump）排出CNS；幾乎不進入大腦，鎮靜性最低，不符合題目描述。","錯誤：Loratadine（氯雷他定）雖為親脂性藥物，但也是P-gp底物，CNS穿透性低；第二代抗組織胺藥設計即為低鎮靜，臨床鎮靜副作用輕微；與promethazine相比，通過BBB的能力和鎮靜效果均遠低。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_070","year":2022,"roc_year":111,"session":"","examNo":70,"q":"下列何者具有促進子宮收縮作用，可用於控制產後出血？","opts":["A. cabergoline","B. ergonovine","C. ergotamine","D. ergovaline"],"ans":1,"exp":"Ergonovine（麥角新鹼/麥角諾文，也稱ergometrine）是麥角生物鹼（ergot alkaloid）中與子宮收縮最相關的藥物。其作用機制：直接作用於子宮平滑肌的α-腎上腺素性受體和多巴胺受體，引起強烈且持久的子宮收縮（oxytocic effect）。臨床用途：主要用於分娩後（產後）控制子宮出血（postpartum hemorrhage）。相比之下，ergotamine（麥角胺）主要用於偏頭痛，ergovaline為牧草真菌毒素，cabergoline（卡麥角林）為D2受體致效劑，用於抑制泌乳（多巴胺作用於泌乳素細胞）。","we":["錯誤：Cabergoline（卡麥角林）也是麥角生物鹼衍生物，但其主要藥理作用是多巴胺D2受體致效劑，用於抑制泌乳素（prolactin）分泌→抑制泌乳；也用於假孕（pseudopregnancy）的治療；不是用於子宮收縮控制產後出血，與ergonovine的子宮收縮機制不同。","","錯誤：Ergotamine（麥角胺）雖也是麥角生物鹼，並有一定的子宮收縮活性，但其在臨床上主要用途是治療偏頭痛（收縮擴張的顱內血管）；比ergonovine有更強的血管收縮副作用和更多不良反應，不是產後出血控制的首選；ergonovine才是專門用於子宮收縮控制產後出血的麥角類藥物。","錯誤：Ergovaline是由牧草中的Neotyphodium（Epichloë）共生真菌產生的麥角生物鹼毒素，是牧草中毒（fescue toxicosis、ryegrass staggers相關）的毒素之一；不是治療用藥物，不具有治療產後出血的臨床適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_071","year":2022,"roc_year":111,"session":"","examNo":71,"q":"下列何者是血清素（serotonin）拮抗劑ketanserin降低血壓的作用機轉？","opts":["A. 阻斷α-腎上腺素性受體","B. 阻斷多巴胺（dopamine）組織胺受體","C. 阻斷5-HT1-組織胺受體","D. 阻斷5-HT3-組織胺受體"],"ans":0,"exp":"Ketanserin（酮色林）是5-HT2A（血清素2A型）受體選擇性拮抗劑，同時也具有顯著的α1-腎上腺素性受體阻斷作用。其降低血壓的主要作用機制為：阻斷周邊血管平滑肌的α1受體→血管擴張→外周阻力降低→血壓下降。雖然ketanserin阻斷5-HT2A受體也有一定的血管舒張作用（5-HT通過5-HT2A引起血管收縮），但教科書和獸醫考試標準認為，其降壓效果中α1阻斷為主要機制。在獸醫學中ketanserin常用於馬的蹄葉炎血管管理和某些高血壓情況。","we":["","錯誤：阻斷多巴胺（dopamine）受體是其他藥物（如acepromazine阻斷D2受體）的機制；ketanserin的主要作用靶點是5-HT2A受體和α1腎上腺素受體，不是多巴胺組織胺受體；此選項描述的受體種類與ketanserin的藥理機制不符。","錯誤：5-HT1受體（如5-HT1B/1D）是腦血管收縮的靶點（triptans如sumatriptan阻斷5-HT1B/1D用於偏頭痛）；ketanserin主要阻斷5-HT2A受體（不是5-HT1），且H1組織胺受體阻斷也不是ketanserin降壓的主要機制；此選項受體類別描述錯誤。","錯誤：5-HT3受體為離子通道型（ion channel-linked），主要分布於外周神經末梢和腦幹嘔吐中樞；ondansetron等5-HT3拮抗劑用於止吐；ketanserin主要阻斷5-HT2A（G蛋白偶聯型受體），不是5-HT3受體；此選項受體類別錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_072","year":2022,"roc_year":111,"session":"","examNo":72,"q":"下列何者的藥理特性是消炎鎮痛作用強，為非固醇類消炎藥物（NSAIDs）中最適合用於減緩腸絞痛之臟器疼\r 痛？","opts":["A. acetaminophen","B. aspirin","C. flunixin","D. naproxen"],"ans":2,"exp":"Flunixin meglumine（速滅痛，癒痛）是強效非選擇性COX抑制劑（COX-1和COX-2均抑制），是馬科動物（horses）腸絞痛（colic）、內毒素血症和眼科炎症的首選NSAID。其鎮痛特性：(1)鎮痛強度高（比aspirin和phenylbutazone強）；(2)對臟器疼痛（visceral pain，如腸絞痛）特別有效；(3)具有強效抗炎和解熱作用。其他選項：acetaminophen在馬中幾乎不用；aspirin鎮痛效果較弱且抗血小板作用強；naproxen鎮痛效果中等，對臟器疼痛特異性不如flunixin。","we":["錯誤：Acetaminophen（乙醯胺酚/撲熱息痛）在馬中不常用作NSAID（馬對其代謝能力有限，且其對COX-1/2抑制效果弱，主要通過中樞機制鎮痛）；解熱效果優於抗炎，對臟器疼痛（腸絞痛）的效果遠不如flunixin；不符合「最適合減緩腸絞痛臟器疼痛」的描述。","錯誤：Aspirin（阿斯匹靈）在馬的NSAID使用中，主要作用為不可逆抑制COX-1（血小板TXA2合成受阻，抗血小板效果強）；鎮痛效果比flunixin弱，且對腸道黏膜（COX-1保護）的副作用更明顯；對臟器疼痛的效果遠不如flunixin，不是首選。","","錯誤：Naproxen（奈普生）為COX非選擇性NSAID，在馬中有一定使用（軟組織炎症、骨關節炎），但其對臟器疼痛（腸絞痛）的鎮痛效果不如flunixin；flunixin對prostaglandin合成的抑制效果更強，是馬腸絞痛疼痛管理的首選NSAID。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_073","year":2022,"roc_year":111,"session":"","examNo":73,"q":"非固醇類消炎藥（NSAIDs）etodolac在犬的血中半衰期長達10～14小時的原因為何？","opts":["A. 藥物與血漿蛋白高度結合","B. 藥物不易被肝臟代謝","C. 藥物不易被腎臟排除","D. 藥物進行腸肝循環"],"ans":3,"exp":"Etodolac（依托度酸）是選擇性COX-2抑制劑（NSAID），在犬中血中半衰期長達10-14小時。其長半衰期的主要原因是腸肝循環（enterohepatic recirculation）：etodolac在肝臟代謝後以葡萄糖醛酸結合物（glucuronide conjugate）形式隨膽汁排入腸道；腸道細菌的β-葡萄糖醛酸酶水解結合物→釋放游離etodolac→腸道再吸收→重新進入系統循環→延長藥物在體內的滯留時間。此腸肝再循環機制使其t½遠超過無再循環時的預期值。","we":["錯誤：雖然etodolac確實有高血漿蛋白結合率（>99%），但高蛋白結合可影響分布體積（Vd），對t½有間接影響（t½=0.693×Vd/CL）；然而，單純高蛋白結合不能解釋「10-14小時」的特異性長半衰期，且高蛋白結合在NSAID中普遍存在，其他NSAID（如aspirin）也有高蛋白結合但t½較短；腸肝循環才是etodolac在犬中特別長t½的主要原因。","錯誤：雖然NSAID主要由肝臟代謝，但「藥物不易被肝臟代謝」並非etodolac長t½的主要解釋；etodolac確實經肝臟充分代謝（形成葡萄糖醛酸結合物），問題在於代謝物可被腸道細菌再活化並重新吸收（腸肝循環），而非代謝速度慢。","錯誤：「藥物不易被腎臟排除」雖可延長半衰期（腎臟清除率低），但NSAID主要經膽汁和腎臟排泄；etodolac的長t½主要機制是腸肝循環使代謝物再吸收，而非腎臟清除率特別低；此解釋不能完整說明10-14小時的特異性長t½。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_074","year":2022,"roc_year":111,"session":"","examNo":74,"q":"下列何者是血管加壓素轉化酶抑制劑（angiotensin-converting enzyme inhibitor）？","opts":["A. aliskiren","B. benazepril","C. ketoprofen","D. losartan"],"ans":1,"exp":"血管加壓素轉化酶抑制劑（angiotensin-converting enzyme inhibitor, ACEI）的作用是抑制ACE（也稱為kininase II）→阻止angiotensin I轉化為angiotensin II→減少血管收縮→降低血壓；同時也抑制缓激肽（bradykinin）的降解（bradykinin蓄積→進一步血管舒張，但也可能引起乾咳副作用）。Benazepril（貝那普利）是獸醫臨床最常用的ACEI之一，常用於犬貓的高血壓、慢性腎病（蛋白尿）和充血性心臟衰竭。其他選項：aliskiren（腎素直接抑制劑）、ketoprofen（NSAID）、losartan（ARB，AT1受體拮抗劑）。","we":["錯誤：Aliskiren（阿利吉侖）為腎素（renin）直接抑制劑，作用於RAAS系統的最上游，抑制腎素將angiotensinogen轉化為angiotensin I；雖也降低angiotensin II水平，但屬於「腎素抑制劑」而非「血管加壓素轉化酶（ACE）抑制劑」，分類和靶點不同。","","錯誤：Ketoprofen（酮洛芬）為非選擇性COX抑制劑（NSAID），透過抑制COX-1和COX-2減少前列腺素合成發揮抗炎、鎮痛、解熱效果；與RAAS系統（腎素-血管加壓素系統）完全無關，不是ACE抑制劑。","錯誤：Losartan（氯沙坦）為血管張力素II受體拮抗劑（ARB/angiotensin receptor blocker），直接阻斷AT1受體（angiotensin II的靶受體）→血管舒張→降壓；雖也作用於RAAS，但靶點是AT1受體而非ACE（轉化酶），與benazepril的ACE抑制機制不同，屬不同藥物類別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_075","year":2022,"roc_year":111,"session":"","examNo":75,"q":"下列何者為desmopressin acetate的主要作用部位？","opts":["A. 心臟","B. 腦下垂體","C. 腎小管","D. 下視丘"],"ans":2,"exp":"Desmopressin acetate（DDAVP，去氨加壓素醋酸鹽）是天然精胺酸加壓素（AVP/ADH）的合成類似物，但選擇性主要作用於V2型受體（vasopressin V2 receptor），主要分布於腎臟集尿管（collecting duct）的主細胞（principal cells）上。DDAVP與V2受體結合→偶聯Gs蛋白→adenylate cyclase活化→cAMP升高→PKA磷酸化aquaporin-2（水通道蛋白2）→AQP2插入頂端細胞膜→水的再吸收增加→尿液濃縮（抗利尿）。臨床用於：中樞性尿崩症（DI）治療、von Willebrand disease的血小板功能調整。","we":["錯誤：心臟雖有心房腦性利尿鈉肽（ANP/BNP）等因素調節，但DDAVP的主要藥理靶器官不是心臟；V2受體主要在腎臟集尿管；DDAVP用於糾正尿崩症（腎臟水分保留），心臟不是其主要作用部位。","錯誤：腦下垂體（pituitary gland）是天然ADH（AVP）的分泌部位（由後葉分泌），而非DDAVP的主要作用靶點；DDAVP的藥理效果是發生在腎臟集尿管的V2受體，而非調節腦下垂體的分泌功能。","","錯誤：下視丘（hypothalamus）是合成ADH的神經元所在地（神經垂體中的漏斗柄接受訊號），不是DDAVP的主要作用部位；DDAVP的效果是在腎臟（V2受體）而非下視丘；ADH/DDAVP「調節」是透過腎臟而非作用於下視丘神經元。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_076","year":2022,"roc_year":111,"session":"","examNo":76,"q":"下列何者是治療貓甲狀腺亢進（hyperthyroidism）之首選藥物？","opts":["A. methimazole","B. thiouracil","C. propylthiouracil","D. radioactive iodide"],"ans":0,"exp":"治療貓甲狀腺亢進（feline hyperthyroidism）的首選藥物為methimazole（甲狀腺嘧啶，Felimazole）。作用機制：methimazole（thiamazole）抑制甲狀腺過氧化酶（thyroid peroxidase, TPO）→阻斷碘的氧化和有機化（organification）→阻斷碘酪胺酸的偶聯（coupling）→T3/T4合成減少。在貓中，methimazole是藥物治療的首選，因為propylthiouracil（PTU）在貓中副作用嚴重（免疫介導溶血性貧血等），thiouracil活性不足；radioactive iodine（¹³¹I）為根治性治療但需特殊設備。Methimazole也有經皮凝膠製劑（耳廓給藥），方便貓的給藥。","we":["","錯誤：Thiouracil（硫尿嘧啶）雖也是硫醯胺類抗甲狀腺藥，機制類似（抑制TPO），但藥效較methimazole弱，臨床效果不穩定；在貓的甲狀腺亢進治療中，thiouracil不是首選，methimazole在效果和安全性上優於thiouracil。","錯誤：Propylthiouracil（PTU，丙基硫尿嘧啶）雖在人醫中是甲狀腺亢進的常用藥（尤其懷孕），但在貓中使用引起嚴重副作用（免疫介導溶血性貧血、血小板減少症、抗核抗體產生）；因此PTU在貓中已不推薦使用，methimazole是貓的首選。","錯誤：Radioactive iodide（¹³¹I，放射碘）是貓甲狀腺亢進的根治性治療方法（選擇性破壞增生甲狀腺組織），治癒率高（>95%），但需要特殊放射性設施和隔離期；雖然效果極佳，但因需要特殊條件，通常被歸類為「根治性治療」而非「首選藥物治療」；methimazole（口服/外用）在可行性和便利性上更常作為首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_077","year":2022,"roc_year":111,"session":"","examNo":77,"q":"下列glucocorticoids何者作用時間最長？","opts":["A. dexamethasone","B. prednisone","C. cortisone","D. triamcinolone"],"ans":0,"exp":"不同glucocorticoids（糖質皮質素）依照生物半衰期（biological half-life）長短分為：短效（short-acting，8-12 h）：cortisone、hydrocortisone；中效（intermediate-acting，12-36 h）：prednisone、prednisolone、methylprednisolone；長效（long-acting，>36 h）：dexamethasone（地塞米松，約36-54 h）和triamcinolone（曲安奈德，約36-40 h）。Dexamethasone是最長效的常用glucocorticoid，生物半衰期最長（約36-54小時），且抗炎效力最強（約為cortisone的30-40倍）。","we":["","錯誤：Prednisone為中效glucocorticoid，生物半衰期約12-36小時（需先在肝臟轉化為prednisolone才具活性）；抗炎效力約為cortisone的4倍；作用時間中等，不是最長效的glucocorticoid。","錯誤：Cortisone（可體松）為天然glucocorticoid（腎上腺皮質產物的合成類似物），生物半衰期最短（約8-12小時），為短效glucocorticoid；抗炎效力最弱（基準值1）；是所列選項中作用時間最短的，與「作用時間最長」完全相反。","錯誤：Triamcinolone（曲安奈德）確實是長效glucocorticoid（生物半衰期約36-40小時），且抗炎效力較強（約為cortisone的5倍）；但在常見的比較中，dexamethasone的生物半衰期（36-54小時）和抗炎效力均高於triamcinolone；故在本題選項中，dexamethasone是作用時間最長者。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_078","year":2022,"roc_year":111,"session":"","examNo":78,"q":"下列何者具有高度礦性腎上腺皮質素及糖質腎上腺皮質素之作用效果，故常被使用於治療\r hypoadrenocorticism？","opts":["A. deoxycorticosterone pivalate","B. fludrocortisone","C. flumethasone","D. paramethasone"],"ans":1,"exp":"Hypoadrenocorticism（艾迪森氏病，Addison's disease）的患畜缺乏糖質皮質素（glucocorticoid）和礦質皮質素（mineralocorticoid）兩者。Fludrocortisone（氟氫可體松，fludrocortisone acetate）是合成腎上腺皮質素，兼具顯著的礦質皮質素活性（比aldosterone效力強）和一定的糖質皮質素活性，可同時補充兩種皮質素功能；口服每日一次，是犬貓hypoadrenocorticism的傳統口服治療藥物。其他選項：deoxycorticosterone pivalate（DOCP）只有礦質皮質素活性（無糖質皮質素），需搭配潑尼松；flumethasone和paramethasone均為純糖質皮質素，無礦質皮質素活性。","we":["錯誤：Deoxycorticosterone pivalate（DOCP，Percorten-V）僅具有礦質皮質素活性（無糖質皮質素效果），用於補充醛固酮（aldosterone）缺乏的部分；治療hypoadrenocorticism時需搭配glucocorticoid（如prednisolone）才能完整補充兩類皮質素功能；不符合「具有高度礦質性AND糖質腎上腺皮質素雙重作用效果」的描述。","","錯誤：Flumethasone（氟美松）為合成糖質皮質素，抗炎效力強（相當於dexamethasone），主要用於抗炎；不具有明顯的礦質皮質素活性；不符合「具有高度礦質性腎上腺皮質素作用效果」的描述，不適合單獨治療hypoadrenocorticism。","錯誤：Paramethasone（帕米松）為合成糖質皮質素，具有強效抗炎作用，礦質皮質素活性極低或幾乎無；如flumethasone和dexamethasone一樣，paramethasone不能補充醛固酮（鈉鉀電解質調節）功能，不符合hypoadrenocorticism治療的礦質皮質素補充需求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_079","year":2022,"roc_year":111,"session":"","examNo":79,"q":"下列何者非催產素（oxytocin）的臨床用途？","opts":["A. 引產（induction of labor）","B. 刺激排乳（milk letdown）","C. 促進發情週期性（enhancement of cyclicity）","D. 治療交配後所導致的子宮內膜炎（postmating endometritis）"],"ans":2,"exp":"本題詢問何者「非」催產素（oxytocin）的臨床用途。選項C（促進發情週期性，enhancement of cyclicity）是錯誤的——oxytocin不能促進發情週期的週期性；發情週期的調節需要下視丘-腦下垂體-性腺軸（GnRH→FSH/LH→性腺激素），與oxytocin無關。Oxytocin的正確臨床用途：A（引產：oxytocin刺激子宮肌收縮→引發產程）、B（刺激排乳：oxytocin作用於乳腺的肌上皮細胞→排乳反射）、D（治療交配後子宮內膜炎：oxytocin引起子宮收縮→排出子宮內膜炎分泌物）。","we":["此為正確描述：引產（induction of labor）是oxytocin的重要臨床用途，oxytocin激動子宮肌（M3型oxytocin receptor）→子宮收縮增強→輔助分娩；常用於分娩遲滯（dystocia）、引產或剖腹產後刺激子宮復舊；不符合「非臨床用途」的條件。","此為正確描述：刺激排乳（milk letdown）是oxytocin的典型作用，oxytocin作用於乳腺腺泡周圍的肌上皮細胞（myoepithelial cells）→收縮→乳汁自腺泡排至乳竇→促進排乳；用於泌乳不足的輔助排乳；不符合「非臨床用途」的條件。","","此為正確描述：交配後子宮內膜炎（postmating endometritis）是馬的常見繁殖問題；交配後給予oxytocin→子宮收縮→排出子宮內精漿/細菌/炎症液體→減少子宮感染；是馬匹繁殖獸醫的標準輔助療法；不符合「非臨床用途」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_080","year":2022,"roc_year":111,"session":"","examNo":80,"q":"下列何者有助於治療子宮蓄膿症？","opts":["A. progestins","B. melengestrol","C. androgens","D. "],"ans":3,"exp":"本題詢問何者有助於治療子宮蓄膿症（pyometra）。選項D為圖片顯示的藥物（依圖片內容判斷為prostaglandin F2α/dinoprost或類似PGF2α衍生物）。PGF2α（前列腺素F2α，dinoprost）的治療機制：(1)引起黃體溶解（luteolysis）→血清黃體酮（progesterone）下降→子宮頸鬆弛開放；(2)引起子宮平滑肌強力收縮→排出子宮內化膿性分泌物；主要用於開頸型子宮蓄膿症（open-cervix pyometra），可保留繁殖能力；必須在有效監督下使用（副作用包括腸絞痛、流涎、喘息等副交感神經效應）。其他選項均為促進子宮蓄膿症的因素（非治療）：progestins和androgens均加重病情。","we":["錯誤：Progestins（黃體素/孕激素）是子宮蓄膿症的促發因素之一——黃體素使子宮頸關閉、刺激子宮內膜增生（cystic endometrial hyperplasia, CEH）、抑制子宮局部免疫，為化膿性分泌物蓄積創造條件；使用progestins會加重或引發子宮蓄膿症，而非治療。","錯誤：Melengestrol（梅侖孕酮醋酸酯）為合成孕激素（synthetic progestin），用於飼料添加劑（牛生長促進劑和抑制發情）；與progestins一樣，長期使用合成孕激素會增加子宮蓄膿症風險；不是治療子宮蓄膿症的藥物。","錯誤：Androgens（雄性激素，如testosterone）可能干擾子宮內膜功能，但也不是子宮蓄膿症的治療藥物；子宮蓄膿症的治療選項包括外科手術（卵巢子宮切除術）、PGF2α（開頸型）或aglepristone（黃體酮受體拮抗劑）等；雄性激素無治療價值。",""],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAbACwDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6porxPxXok+r+O/HVlpGnebqsumWJtLpJFh+yTMZv3u/IZegJ2gk7cGt7wYkniDxX4ot/FGzULjRXgs4LaZcxhTCrGbYeN0jFvmxkAYHeha/18gejt/W1z06ivDNVubTVbLwg+n6XI8aeKJ7QW9/Krl9qz703fN+73LwDngDjgV6Da6ppvhDRGuNS0x9LM8ss89vY27zpCqnaZDsXCrtVSTgDkn1oW1/62T/UHvb+t2v0OyopsMiTRJLEweN1DKynIIPQinUBuZVp4f0601+81qCKVdSvI0inkNxIyuqZ2jYW2jG44wB1NF94e0y91IajLA8d/wCX5RuLeeSCRkzkKzIwLAHkA5x2rVooA5w+CdA8rTo1s5ETT7lry32XUy7ZmzukJDfMx3Nktnqab43lv3sVsLPRb/Ura8Vo7p7SSBWSPGCo82ROWBIyM45PXFdLRR5B1ueX3+h+IJdcS5XTrswf2ja3CCK7jURWiRJm327wOJRuIAwRkgk8V6hRRTvpb+un+QrH/9k="]},{"id":"AMO_2023_藥理_001","year":2023,"roc_year":112,"session":"","examNo":1,"q":"下列何者為抗微生物製劑（antimicrobials）最常使用的藥效學（PD）變數？","opts":["A. median effective concentration（EC50）","B. median effective dose（ED50）","C. minimum inhibitory concentration（MIC）","D. post-antibiotic effect（PAE）"],"ans":2,"exp":"抗微生物藥物的藥效學（PD）參數中，MIC（minimum inhibitory concentration，最低抑菌濃度）是最基本且最廣泛使用的指標。臨床PK/PD整合參數如 AUC/MIC（反映濃度依賴型）、Cmax/MIC 及 T>MIC（時間依賴型）均以MIC為基礎建立，用以預測藥物在體內的療效與決定給藥方案。","we":["錯誤：EC50是描述藥物對動物或細胞產生50%效應的濃度，屬一般藥效學參數，非抗微生物藥物最常使用的PD指標；抗微生物PD最重要的參數是MIC（最低抑菌濃度）。","錯誤：ED50是使50%受試個體產生特定反應的劑量，屬整體動物層次的藥效學描述，不是針對病原微生物的PD參數；MIC才是與抗微生物活性直接相關的標準指標。","","錯誤：PAE（post-antibiotic effect，抗生素後效應）是停藥後仍能抑制細菌生長的時間，雖是PD概念但非「最常使用」的PD變數；AUC/MIC、Cmax/MIC、T>MIC等以MIC為基礎的PK/PD參數才是臨床最廣泛應用的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_002","year":2023,"roc_year":112,"session":"","examNo":2,"q":"下列何者為酸性（acids）的抗微生物藥物？","opts":["A. cloxacillin","B. polymyxin B","C. spectinomycin","D. trimethoprim"],"ans":0,"exp":"Cloxacillin為isoxazolyl penicillin，含有羧基（-COOH）官能基，pKa約2.8，屬弱酸性藥物。其酸性特性來自penicillin核心的羧基，使藥物在生理pH下以陰離子形式存在。酸性藥物在鹼性環境（如腎小管、炎症組織）中解離程度高，而鹼性抗菌藥（如aminoglycosides、spectinomycin）則在酸性環境效果較佳。","we":["","錯誤：Polymyxin B為環狀多肽類，含多個陽性電荷（diaminobutyric acid殘基），屬鹼性藥物（cationic peptide）；其與革蘭氏陰性菌外膜脂多醣的結合依賴正電荷，而非酸性特性。","錯誤：Spectinomycin為胺基環醇類抗生素，其分子含多個胺基（-NH₂）在生理pH下帶正電，屬鹼性藥物；不具酸性羧基或磺醯胺基等使藥物呈酸性的官能基。","錯誤：Trimethoprim為二氨基嘧啶類，分子含兩個胺基，pKa約7.2，在生理pH下為弱鹼性；常與磺胺類（弱酸性）合用形成增效組合，兩者酸鹼性質不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_003","year":2023,"roc_year":112,"session":"","examNo":3,"q":"下列藥品與其相關副作用的敘述中，何者錯誤？","opts":["A. cisplatin/耳毒性","B. gentamicin/腎毒性","C. imipenem/癲癇","D. thiamphenicol/再生不良性貧血"],"ans":3,"exp":"Thiamphenicol（甲砜黴素）與chloramphenicol同為苯丙醇類，但兩者毒性不同：Thiamphenicol只引起可逆性骨髓抑制（reversible myelosuppression），停藥後恢復；再生不良性貧血（aplastic anemia）為不可逆毒性，是chloramphenicol特有的特異質反應（idiosyncratic reaction），與劑量無關。因此「thiamphenicol/再生不良性貧血」的配對是錯誤的。","we":["此為正確描述：Cisplatin確實具有耳毒性（ototoxicity），主要損傷內耳耳蝸外毛細胞，造成高頻聽力喪失；與腎毒性同為cisplatin最重要的劑量限制毒性，不符合「錯誤」描述。","此為正確描述：Gentamicin等胺基醣苷類藥物累積於近端腎小管細胞，抑制磷脂酶、造成溶酶體損傷，引起腎毒性（nephrotoxicity）；為胺基醣苷類最重要的臨床副作用之一，不符合「錯誤」描述。","此為正確描述：Imipenem可降低癲癇發作閾值，尤其在高劑量或腎功能不全患者（藥物累積）時，引起中樞神經毒性包括癲癇（seizure）；此為已知副作用，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_004","year":2023,"roc_year":112,"session":"","examNo":4,"q":"併用 azithromycin-rifampin的原因之一為何？","opts":["A. 產生協同抑制真菌蛋白質的合成","B. 藉由 azithromycin抑制肝臟細胞色素P450而增強藥效","C. 降低偽膜性腸炎（pseudomembrane colitis）的發生率","D. 預防標的菌對rifampin產生緊急抗藥性"],"ans":3,"exp":"Rifampin單藥治療時，目標菌（如Brucella spp.）極易因自發性突變而快速產生高度抗藥性，此現象稱為「緊急抗藥性（emergent resistance）」。加入azithromycin可對突變株形成協同殺菌壓力，降低抗rifampin突變株存活率，從而預防單藥耐藥性的產生。這是azithromycin-rifampin聯合使用的主要藥理依據。","we":["錯誤：Azithromycin為大環內酯類（macrolide），作用於細菌核醣體50S亞基抑制蛋白質合成；rifampin抑制RNA聚合酶；兩者均為抗菌藥物，非抗真菌劑，且作用機制不同，並非協同抑制真菌蛋白質合成。","錯誤：Azithromycin不是CYP450抑制劑（erythromycin才有顯著的CYP3A4抑制）；azithromycin對肝臟CYP450影響甚微，不能以此機制增強rifampin藥效，且rifampin本身是強力CYP誘導劑。","錯誤：Azithromycin不具有預防偽膜性腸炎的作用；rifampin聯用azithromycin是因rifampin單藥易快速誘導目標菌（如布氏桿菌Brucella）產生抗藥性突變，加入azithromycin可降低此風險，而非預防腸炎。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_005","year":2023,"roc_year":112,"session":"","examNo":5,"q":"下列何者於治療 Bacteroides nodosus 所引起的綿羊腐蹄病（foot rot）時，具有最佳的療效？","opts":["A. flucytosine-amphotericin B","B. gentamicin-piperacillin","C. lincomycin-spectinomycin","D. penicillin-chloramphenicol"],"ans":2,"exp":"Bacteroides nodosus（現更名Dichelobacter nodosus）為革蘭氏陰性專性厭氧桿菌，是綿羊腐蹄病的主要病原。Lincomycin-spectinomycin（LS）組合具有廣效抗厭氧菌及抗Mycoplasma活性，對D. nodosus療效確切，是標準的腐蹄病治療組合。此組合可肌肉注射或口服，在綿羊有良好的藥物動力學特性。","we":["錯誤：Flucytosine+amphotericin B為抗真菌組合（主要用於隱球菌腦膜炎）；Bacteroides nodosus（現更名Dichelobacter nodosus）為革蘭氏陰性厭氧桿菌，需用抗細菌藥物，非抗真菌藥。","錯誤：此組合對腸道革蘭氏陰性菌（如Pseudomonas）有效；Bacteroides nodosus為專性厭氧菌，gentamicin對厭氧菌無效（需要氧化磷酸化才能主動轉運進入細菌），不適合治療綿羊腐蹄病。","","錯誤：Penicillin雖對Bacteroides nodosus有效，但chloramphenicol因毒性限制（骨髓抑制）及食品動物停藥期問題，不用於綿羊腐蹄病；lincomycin-spectinomycin（LS）組合是針對Mycoplasma及Bacteroides的標準用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_006","year":2023,"roc_year":112,"session":"","examNo":6,"q":"下列有關抗微生物藥物口服吸收的敘述，何者錯誤？","opts":["A. Sucralfate 可減少 doxycycline 的口服吸收","B. Ranitidine可減少 itraconazole 的口服吸收","C. Omeprazole 可減少 fluconazole 的口服吸收","D. 脂肪性食物可增加 ketoconazole 的口服吸收"],"ans":2,"exp":"Fluconazole為水溶性極高的triazole，口服生物利用度接近90%，吸收不依賴胃酸環境（pH獨立型吸收）。因此，質子泵抑制劑（PPI）如omeprazole升高胃pH，並不影響fluconazole的吸收。相反，itraconazole膠囊劑型需要酸性環境溶解，受PPI或H2拮抗劑的影響顯著。故「omeprazole減少fluconazole吸收」為錯誤敘述。","we":["此為正確描述：Sucralfate在胃中形成黏稠膠體，可與tetracyclines（包括doxycycline）的多價陽離子結合，降低其口服吸收；建議間隔至少2小時服藥，不符合「錯誤」描述。","此為正確描述：Itraconazole膠囊劑型需要酸性胃環境溶解（capsule formulation）；Ranitidine為H2拮抗劑，升高胃pH，確實會減少itraconazole吸收；口服液劑型因含cyclodextrin而不受此影響，不符合「錯誤」描述。","","此為正確描述：Ketoconazole為親脂性藥物，與高脂餐同服可增加其口服生物利用度；同時ketoconazole在酸性環境溶解較好，與食物同服亦增加胃酸分泌，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_007","year":2023,"roc_year":112,"session":"","examNo":7,"q":"下列何者對肝臟 P-450 的作用與其它三者不同？","opts":["A. chloramphenicol","B. ketoconazole","C. erythromycin","D. rifampin"],"ans":3,"exp":"Rifampin是強力肝臟CYP450誘導劑（inducer），透過核受體PXR（pregnane X receptor）上調CYP1A2、CYP2C9、CYP2C19、CYP3A4等多種酶的表達，加速多種藥物代謝。而chloramphenicol、ketoconazole和erythromycin均為CYP450抑制劑（inhibitors），會減慢其他藥物代謝、升高血中濃度。因此rifampin（誘導劑）與其他三者（抑制劑）作用相反。","we":["錯誤：Chloramphenicol抑制肝臟CYP450（特別是CYP2C9、CYP3A4），減少其他藥物的代謝，延長藥效；與ketoconazole和erythromycin同為CYP抑制劑，與rifampin作用相反，故本題選項A與rifampin不同而與B、C相同。","錯誤：Ketoconazole為強效CYP3A4抑制劑，透過與血紅素鐵的配位結合阻斷CYP活性，可顯著升高多種藥物的血中濃度；屬CYP抑制劑，與chloramphenicol和erythromycin同類，與rifampin（誘導劑）不同。","錯誤：Erythromycin為CYP3A4抑制劑，形成「metabolic intermediate complex」（nitroso alkane-CYP3A4 complex）阻斷代謝；與chloramphenicol、ketoconazole同為抑制劑，而rifampin為強力誘導劑（通過PXR核受體上調CYP表達），作用相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_008","year":2023,"roc_year":112,"session":"","examNo":8,"q":"Amantadine 是與下列何種受體接合而具有止痛效果？","opts":["A. γ-aminobutyric acid（GABA）","B. neurokinin‐1（NK–1）","C. N-methyl-D-aspartate（NMDA）","D. μ–opioid"],"ans":2,"exp":"Amantadine最初為抗流感病毒藥物（M2 ion channel blocker），後來發現其對慢性疼痛具有輔助止痛效果，機制為非競爭性阻斷NMDA（N-methyl-D-aspartate）受體。NMDA受體在中樞敏感化（central sensitization）中扮演關鍵角色，glutamate透過NMDA受體持續活化脊髓背角神經元，使痛覺放大。Amantadine阻斷NMDA受體可抑制此過程，常作為多模鎮痛的輔助用藥。","we":["錯誤：GABA受體（GABA-A Cl⁻通道或GABA-B G蛋白偶聯受體）主要介導鎮靜、抗焦慮、抗痙攣效果；Amantadine雖最早作為抗流感藥，其止痛效果確與NMDA受體阻斷有關，而非GABA系統。","錯誤：NK-1受體（神經激肽-1，substance P受體）主要與痛覺傳遞和嘔吐相關；Maropitant為NK-1拮抗劑用於止吐；Amantadine的止痛機制是阻斷NMDA受體，減少中樞敏感化（central sensitization），非NK-1途徑。","","錯誤：μ阿片受體介導嗎啡類藥物的鎮痛效果；Amantadine無阿片類活性，其止痛機制為非競爭性NMDA受體阻斷（open-channel block），可作為多模鎮痛（multimodal analgesia）的輔助用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_009","year":2023,"roc_year":112,"session":"","examNo":9,"q":"抗腫瘤藥品組合「CHOP」縮寫中的「P」字代表：","opts":["A. paromomycin","B. pimobendan","C. piroxicam","D. prednisolone"],"ans":3,"exp":"CHOP為犬淋巴瘤的標準化療方案，縮寫各代表：C = Cyclophosphamide（環磷醯胺，烷化劑）；H = Hydroxydoxorubicin（即doxorubicin/adriamycin，蒽環類拓撲異構酶抑制劑）；O = Oncovin（即vincristine，長春花鹼，微管聚合抑制劑）；P = Prednisolone（強的松龍，糖皮質激素，具抗腫瘤及抗炎作用）。P代表prednisolone而非其他藥物。","we":["錯誤：Paromomycin為胺基醣苷類抗生素/抗原蟲藥（用於腸道阿米巴、賈第蟲），非抗腫瘤藥物；CHOP中不含任何抗生素成分。","錯誤：Pimobendan為心臟用藥（正性肌力+血管擴張劑），用於犬心衰竭治療；非抗腫瘤藥物，與CHOP化療方案無關。","錯誤：Piroxicam為NSAID（非類固醇抗炎藥），雖有研究用於某些腫瘤輔助治療，但CHOP中的P代表prednisolone（一種糖皮質激素），而非NSAIDs；CHOP = Cyclophosphamide + Hydroxydoxorubicin(doxorubicin) + Oncovin(vincristine) + Prednisolone。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_010","year":2023,"roc_year":112,"session":"","examNo":10,"q":"下列對 cephalosporins 的敘述，何者錯誤？","opts":["A. Cefazolin 為第一代藥品中對 G (-) 作用較佳者","B. Cefoxitin 為第二代藥品中抗厭氣菌效果較佳者之一","C. Cefuroxime 為口服抗 Enterobacter spp. 的第二代藥品","D. Ceftiofur 為第三代藥品中獸醫專用的藥品"],"ans":2,"exp":"Cefuroxime為第二代cephalosporin，其抗菌譜涵蓋常見G(-)腸道菌（Klebsiella、Proteus等），但對Enterobacter spp.效果差，因Enterobacter可誘導AmpC β-lactamase，而第二代cephalosporins對AmpC不穩定。需第三代（如ceftriaxone、ceftazidime）才對Enterobacter有效。故「cefuroxime為口服抗Enterobacter的第二代藥品」為錯誤敘述。","we":["此為正確描述：在第一代cephalosporins中，cefazolin對革蘭氏陰性菌的活性確實優於其他第一代藥物（如cephalexin、cefalothin），雖然第一代整體對G(-)活性仍有限；不符合「錯誤」描述。","此為正確描述：Cefoxitin（cephamycin類）確對厭氧菌（包括Bacteroides fragilis）具有較佳活性，是第二代中抗厭氧菌最強者之一，常用於腹腔感染；不符合「錯誤」描述。","","此為正確描述：Ceftiofur（ceftiofur sodium/free acid）為獸醫專用第三代頭孢菌素，廣泛用於牛、豬、馬的呼吸道感染；非人醫用藥，是標準獸醫用藥知識，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_011","year":2023,"roc_year":112,"session":"","examNo":11,"q":"下列對於 fluoroquinolones 口服吸收的敘述，何者錯誤？","opts":["A. 在綿羊的口服吸收較成牛為佳","B. 食物延遲到達最高血中濃度的時間","C. Difloxacin 主要經由腎臟排除","D. Probenecid 可減少 ciprofloxacin 的排泄"],"ans":2,"exp":"Difloxacin（difluoroquinolone）與大多數fluoroquinolones不同，其主要經由肝臟代謝（glucuronidation）及膽汁排泄，而非腎臟排除。腎功能不全患者使用difloxacin時，不需如ciprofloxacin般大幅調整劑量。此特性在獸醫PK考題中為重要鑑別點，「Difloxacin主要經由腎臟排除」為錯誤敘述。","we":["此為正確描述：Fluoroquinolones在綿羊的口服生物利用度確高於成牛（反芻前胃的破壞較少），成牛因瘤胃微生物的分解，fluoroquinolones口服吸收差；不符合「錯誤」描述。","此為正確描述：食物雖不顯著影響fluoroquinolones的整體生物利用度，但可延遲吸收而延後Cmax到達時間（Tmax延長）；不符合「錯誤」描述。","","此為正確描述：Probenecid為有機陰離子轉運體（OAT）抑制劑，可減少ciprofloxacin經腎小管的主動分泌，升高血中濃度；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_012","year":2023,"roc_year":112,"session":"","examNo":12,"q":"葡萄糖（glucose）最可能經由下列何種方式進入細胞？","opts":["A. 主動運輸（active transport）","B. 促進擴散（facilitated diffusion）","C. 簡單擴散（simple diffusion）","D. 胞攝作用（endocytosis）"],"ans":1,"exp":"葡萄糖（glucose）為極性大分子（MW 180，含多個-OH基），無法自由穿越疏水性細胞膜脂質雙層。其進入細胞依賴GLUT（glucose transporter）蛋白，屬促進擴散（facilitated diffusion）：順濃度梯度、需要膜蛋白（載體）、但不需消耗ATP。注意：腸道上皮和腎小管的葡萄糖吸收採用SGLT（Na⁺-glucose cotransporter）屬次級主動運輸，但題目問的是「進入細胞」的一般性描述。","we":["錯誤：主動運輸（active transport）需消耗ATP或依賴電化學梯度（次級主動運輸），葡萄糖的GLUT轉運體不需能量，順濃度梯度運輸，屬促進擴散；只有腸道上皮和腎小管的葡萄糖/Na⁺共轉運（SGLT）才是主動運輸。","","錯誤：簡單擴散（simple diffusion）不需轉運體蛋白，藥物或小分子直接穿越脂質雙層；葡萄糖分子極性強（多個OH基），水溶性高，無法自由穿越疏水的細胞膜，必須借助GLUT蛋白（促進擴散）。","錯誤：胞攝作用（endocytosis）是細胞將大分子或顆粒以囊泡包裹方式內化的過程，如receptor-mediated endocytosis；葡萄糖為小分子，通過GLUT轉運體即可進入細胞，不需耗能的囊泡機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_013","year":2023,"roc_year":112,"session":"","examNo":13,"q":"藥物與受體結合時，那一類鍵結因影響解離而較少見？","opts":["A. 凡得瓦力（van der Waals force）","B. 共價鍵（covalent bond）","C. 氫鍵（hydrogen bond）","D. 疏水鍵（hydrophobic interaction）"],"ans":1,"exp":"共價鍵（covalent bond）為最強的化學鍵（鍵能150-400 kJ/mol），在生理條件下通常不可逆地斷裂，因此形成共價鍵的藥物-受體複合體極難解離，導致持久性（甚至永久性）結合。藥物-受體結合若為不可逆，則藥效持續至新受體合成，臨床常見例子如aspirin（不可逆抑制COX）、某些有機磷（不可逆抑制AChE）。共價鍵因此在藥物-受體結合中「較少見」。","we":["錯誤：凡得瓦力（分散力）為非共價的微弱可逆引力，是藥物與受體結合時最普遍的非特異性鍵結之一；因容易形成和解離，在多數藥物-受體相互作用中均有參與，並非「較少見」。","","錯誤：氫鍵（H-bond）在藥物-受體結合中極為常見，幾乎所有具有-OH、-NH、-C=O基團的藥物都涉及氫鍵；氫鍵為可逆鍵結，其形成不影響解離，因此在藥物設計中廣泛應用。","錯誤：疏水相互作用（hydrophobic interaction）是非極性基團在水溶液中趨向聚集的現象，也是藥物與受體結合的重要力之一，為可逆且常見的鍵結類型；不以「較少見」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_014","year":2023,"roc_year":112,"session":"","examNo":14,"q":"排除速率常數為0.138/小時的藥物以靜脈注射方式每半衰期給藥一次，則其血漿濃度在15小時後，會達到多少\r 百分比之穩態濃度（steady-state concentration）？","opts":["A. 50","B. 75","C. 87.5","D. 93.75"],"ans":2,"exp":"計算步驟：k=0.138/h，t½=ln2/k=0.693/0.138≈5h。給藥間隔為1個半衰期（5h），15h後共經過3個給藥間隔（3個半衰期）。以「每半衰期給藥一次，計算累積到穩態的百分比」公式：Css% = (1 - 0.5ⁿ) × 100%，n=3時 = (1 - 0.125) × 100% = 87.5%。即15小時後約達87.5%穩態濃度。","we":["錯誤：50%穩態濃度發生在1個半衰期後（第一次給藥後5小時）；題目問15小時後（=3個半衰期），每增加1個半衰期從50%累積到87.5%，所以1個半衰期=50%是第一個給藥間隔後的狀態，不是15小時的答案。","錯誤：75%穩態濃度發生在2個半衰期後（第二次給藥後10小時達到75%）；k=0.138/h，t½=5h，15h=3×t½，應達到87.5%（=1-0.5³），而非75%（=1-0.5²）。","","錯誤：93.75%發生在4個半衰期後（4×5=20小時）；1-0.5⁴=93.75%；題目明確指15小時後=3個半衰期，對應87.5%（=1-0.5³=7/8），故93.75%是20小時後的結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_015","year":2023,"roc_year":112,"session":"","examNo":15,"q":"下列那個藥物代謝與微粒體酶（microsomal enzyme）無關？","opts":["A. morphine","B. diazepam","C. epinephrine","D. thiopental"],"ans":2,"exp":"Epinephrine（腎上腺素）為內源性兒茶酚胺，分子含鄰苯二酚（catechol）官能基，主要由兩種非微粒體酶代謝：MAO（monoamine oxidase，主要在粒線體）進行氧化脫胺，COMT（catechol-O-methyltransferase，存在於細胞質和胞外）進行甲基化。此兩酶均為胞漿酶（非微粒體/ER酶），因此epinephrine的代謝與微粒體CYP450無關。","we":["錯誤：Morphine主要由肝臟UGT（UDP-glucuronosyltransferase）進行葡萄糖醛酸化，雖UGT非CYP微粒體酶，但morphine也有部分經CYP3A4/CYP2D6代謝；本題關鍵是epinephrine完全由非微粒體的MAO/COMT分解。","錯誤：Diazepam為benzodiazepine類，主要經CYP3A4和CYP2C19的微粒體酶進行N-demethylation和hydroxylation；其活性代謝物desmethyldiazepam也依賴微粒體酶形成。","","錯誤：Thiopental為硫代巴比妥酸鹽，主要經肝臟微粒體CYP酶（CYP2C9等）進行氧化代謝；其再分布終止麻醉效果，而最終消除依賴微粒體氧化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_016","year":2023,"roc_year":112,"session":"","examNo":16,"q":"有關分布體積，下列敘述何者錯誤？","opts":["A. 血漿蛋白與藥物結合程度為影響分布體積因子之一","B. 分布體積決定初始劑量（loading dose）","C. 是體內藥物總量與血漿藥物濃度的比值","D. 注射用麻醉劑再分布現象會延長麻醉作用"],"ans":3,"exp":"靜脈注射用麻醉劑（如thiopental、propofol）的作用終止主要依賴「再分布（redistribution）」現象：藥物從高灌流的腦組織再分布至肌肉、脂肪等組織，使腦中濃度下降，麻醉效果提前終止。因此再分布是「縮短」而非「延長」靜脈麻醉劑的作用時間，「再分布現象會延長麻醉作用」為錯誤敘述。","we":["此為正確描述：高蛋白結合的藥物大量留在血漿中，組織分布少，分布體積（Vd）較小；蛋白結合確是影響Vd的重要因素之一，不符合「錯誤」描述。","此為正確描述：Loading dose = Vd × 目標血中濃度（Css），分布體積直接決定需要多少藥物才能達到目標濃度；此為PK基本公式，不符合「錯誤」描述。","此為正確描述：Vd = 體內藥物總量 / 血漿藥物濃度（Cp），這是分布體積的定義式；雖為「表觀」體積，並不代表實際解剖空間，但此定義本身正確，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_017","year":2023,"roc_year":112,"session":"","examNo":17,"q":"一弱酸藥之pKa=5.1，則此藥在血漿中的解離程度為何？","opts":["A. 76%","","",""],"ans":3,"exp":"Henderson-Hasselbalch公式：pH = pKa + log([A⁻]/[HA])。代入：7.4 = 5.1 + log([A⁻]/[HA]) → log([A⁻]/[HA]) = 2.3 → [A⁻]/[HA] = 10^2.3 ≈ 200。游離（解離）分數 = [A⁻] / ([A⁻] + [HA]) = 200 / (200 + 1) = 200/201 ≈ 99.5%。弱酸在pH遠高於pKa的環境（血漿pH 7.4 >> pKa 5.1）中，幾乎完全解離。選項D為正確答案（99.5%）。","we":["錯誤：76%游離分數對應的計算不匹配pKa=5.1在pH=7.4的條件；Henderson-Hasselbalch公式：pH=pKa+log(比值)→7.4=5.1+log(比值)→比值=10^2.3≈200，游離分數=200/201≈99.5%，遠高於76%。","錯誤：此選項文字缺失，為題目格式問題；根據Henderson-Hasselbalch公式計算，弱酸藥pKa=5.1在血漿pH=7.4條件下，游離（解離）分數約99.5%，遠大於各干擾選項。","錯誤：此選項文字缺失，為題目格式問題；弱酸在pH遠高於其pKa時（此處pH-pKa=2.3），以解離形式（A⁻）大量存在，比例超過99%，任何低於99%的選項均不正確。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_018","year":2023,"roc_year":112,"session":"","examNo":18,"q":"有關藥物通過細胞膜之機制，下列敘述何者正確？","opts":["A. 藥物分子大小不影響其簡單擴散（simple diffusion）","B. 促進擴散（facilitated diffusion）可對抗濃度梯度","C. Furosemide利用主動運輸方式於腎小管近端分泌","D. P-醣蛋白之受質較易通過血腦障壁"],"ans":2,"exp":"Furosemide（呋塞米）為loop diuretic，口服或注射後在腎近端小管以有機陰離子轉運體（OAT1/OAT3）介導的主動運輸方式分泌進入腎小管腔，才能到達其作用位點（亨利氏管粗升支頂端膜的NKCC2轉運體）。若腎小管分泌被阻斷（如probenecid競爭OAT），furosemide的利尿效果會顯著減弱。因此選項C「Furosemide利用主動運輸方式於腎小管近端分泌」為正確敘述。","we":["錯誤：分子大小確實影響簡單擴散速率；小分子親脂性藥物通過脂質雙層更快，分子越大擴散越慢；簡單擴散速率由濃度梯度、膜面積、溫度、分子大小及親脂性共同決定。","錯誤：促進擴散（facilitated diffusion）仍為被動運輸，需靠轉運蛋白但不消耗ATP，只能順濃度梯度進行，無法對抗濃度梯度；主動運輸才能逆濃度梯度（如Na⁺-K⁺-ATPase）。","","錯誤：P-醣蛋白（P-gp/MDR1）位於BBB毛細血管內皮細胞頂端膜，將進入腦組織的藥物泵回血液；P-gp受質因此更難通過血腦障壁，而非較易，這是許多CNS藥物難以進腦的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_019","year":2023,"roc_year":112,"session":"","examNo":19,"q":"有關抗真菌藥物作用機制之敘述，下列何者錯誤？","opts":["A. Itraconazole抑制黴菌細胞膜之形成","B. Griseofulvin抑制黴菌有絲分裂","C. Terbinafine抑制黴菌蛋白質合成","D. Flucytosine抑制黴菌DNA合成"],"ans":2,"exp":"Terbinafine（特比萘芬）為烯丙胺類（allylamine）抗真菌藥，作用機制為抑制真菌角鯊烯環氧酶（squalene epoxidase），阻斷麥角固醇合成路徑中角鯊烯→角鯊烯環氧化物的步驟，導致角鯊烯累積（對真菌有毒）和麥角固醇缺乏。Terbinafine不作用於真菌蛋白質合成，因此「Terbinafine抑制黴菌蛋白質合成」為錯誤敘述。","we":["此為正確描述：Itraconazole為azole類，抑制CYP51（lanosterol 14α-demethylase），阻斷ergosterol合成，影響真菌細胞膜完整性；說「抑制細胞膜形成」為正確概念，不符合「錯誤」描述。","此為正確描述：Griseofulvin與微管蛋白（tubulin）結合，干擾紡錘體形成，阻止真菌有絲分裂（M期）；這是griseofulvin獨特的抗真菌機制，不符合「錯誤」描述。","","此為正確描述：Flucytosine（5-FC）進入真菌後被轉化為5-fluorouracil，再轉化為5-fluoro-dUMP，抑制thymidylate synthase，阻斷DNA合成；也可轉化為5-FUTP干擾RNA，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_020","year":2023,"roc_year":112,"session":"","examNo":20,"q":"抗癌藥物methotrexate主要作用於細胞生長週期的那一期？","opts":["A. G1","B. G2","C. M","D. S"],"ans":3,"exp":"Methotrexate（甲胺蝶呤）為葉酸拮抗劑，競爭性抑制DHFR（dihydrofolate reductase，二氫葉酸還原酶），阻斷四氫葉酸（THF）生成，進而抑制嘌呤核苷酸和胸腺嘧啶核苷酸的合成，導致DNA複製停滯。DNA複製發生在細胞週期S期（DNA synthesis phase），因此methotrexate為S期特異性藥物（cell-cycle phase-specific agent）。","we":["錯誤：G1期為DNA合成前期（Gap 1），細胞進行生長和蛋白質合成準備；Methotrexate作用於S期而非G1期，因為S期才是DNA複製時DHFR（二氫葉酸還原酶）大量需要的時期。","錯誤：G2期為DNA合成後期（Gap 2），細胞準備進入有絲分裂；Vinca alkaloids（長春花鹼）等作用於G2/M期，Methotrexate是S期特異性藥物，因為其靶點DHFR在S期活性最高。","錯誤：M期（有絲分裂期）是染色體分離和細胞分裂的階段；Vincristine/vinblastine（微管聚合抑制劑）和taxanes（微管穩定劑）為M期特異性藥物；Methotrexate為S期特異性藥物，而非M期。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_021","year":2023,"roc_year":112,"session":"","examNo":21,"q":"癌症患犬接受口服cyclophosphamide治療期間出現嚴重膀胱炎，下列何者最適合作為cyclophosphamide的替代\r 藥品？","opts":["A. chlorambucil","B. mechlorethamine","C. ifosfamide","D. streptozocin"],"ans":0,"exp":"Cyclophosphamide在肝臟代謝後產生acrolein（丙烯醛），由腎臟排出後刺激膀胱上皮引起出血性膀胱炎（hemorrhagic cystitis）。Chlorambucil（苯丁酸氮芥）為另一種烷化劑，不產生acrolein代謝物，因此無膀胱毒性，是因cyclophosphamide引起膀胱炎時最常用的替代口服烷化劑，在犬淋巴瘤化療中可直接替換。","we":["","錯誤：Mechlorethamine（氮芥）為烷化劑，靜脈注射用（vesicant），刺激性強，不適合作為口服cyclophosphamide的替代品；且mechlorethamine同樣為雙功能烷化劑，未見有減少膀胱毒性的優勢。","錯誤：Ifosfamide與cyclophosphamide同為氧化磷胺類，同樣產生acrolein代謝物，引起出血性膀胱炎（hemorrhagic cystitis）；雖需要mesna解毒劑保護膀胱，但本身仍有膀胱毒性，不是因cyclophosphamide膀胱炎而選用的替代品。","錯誤：Streptozocin為天然亞硝基脲類（nitrosourea），主要用於胰島細胞腫瘤（insulinoma）；其主要毒性為腎毒性和糖尿病樣作用（因選擇性損傷胰島β細胞），非cyclophosphamide的常規替代品，且使用範圍窄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_022","year":2023,"roc_year":112,"session":"","examNo":22,"q":"乙醯膽鹼（acetylcholine）經酯酶（esterases）代謝的反應為何？","opts":["A. 氧化反應（oxidation）","B. 還原反應（reduction）","C. 接合反應（conjugation）","D. 水解反應（hydrolysis）"],"ans":3,"exp":"乙醯膽鹼（acetylcholine）在神經突觸和效應器接合處由乙醯膽鹼酯酶（acetylcholinesterase, AChE）迅速水解（hydrolysis）為膽鹼（choline）和乙酸（acetate）。此反應為水解反應（第一相代謝的特殊形式），由AChE（突觸處）和丁醯膽鹼酯酶（butyrylcholinesterase, BuChE，血漿中）催化。此過程在毫秒內完成，確保膽鹼能信號快速終止。","we":["錯誤：氧化反應（oxidation）通常由CYP450或MAO等酶催化，用於藥物的第一相代謝；乙醯膽鹼不含可被氧化的典型官能基（如苯環、胺基），其代謝靠水解酶，非氧化酶。","錯誤：還原反應（reduction）由硝基還原酶、羰基還原酶等催化，將硝基（-NO₂）或酮基（-C=O）還原；乙醯膽鹼分子中無可被還原的基團，其快速失活靠乙醯膽鹼酯酶水解，非還原代謝。","錯誤：接合反應（conjugation/phase II metabolism）包括葡萄糖醛酸化、硫化、乙醯化等，將藥物與內源性分子結合；乙醯膽鹼的代謝不涉及接合反應，而是由乙醯膽鹼酯酶（AChE）和丁醯膽鹼酯酶（BuChE）水解為膽鹼和乙酸。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_023","year":2023,"roc_year":112,"session":"","examNo":23,"q":"Ketoconazole抗真菌的作用機制為何？","opts":["A. 干擾膽固醇合成","B. 與細胞膜麥角固醇結合","C. 抑制麥角固醇合成","D. 抑制ACTH的作用"],"ans":2,"exp":"Ketoconazole為咪唑類（imidazole）抗真菌藥，其抗真菌機制是抑制真菌細胞色素P450酶CYP51（lanosterol 14α-demethylase，羊毛固醇14α-去甲基化酶），阻斷羊毛固醇（lanosterol）→麥角固醇（ergosterol）的生物合成路徑，導致麥角固醇缺乏，真菌細胞膜通透性異常增加，最終細胞死亡。","we":["錯誤：哺乳動物的膽固醇合成也依賴CYP51，但高濃度才有影響；ketoconazole在真菌治療濃度下主要靶向真菌CYP51（而非動物CYP51），干擾的是ergosterol（麥角固醇）合成，而非膽固醇合成。","錯誤：直接與麥角固醇結合（forming pores in membrane）是amphotericin B的作用機制，而非azole類；Azoles（ketoconazole、fluconazole等）是抑制麥角固醇的生合成，而非直接結合已存在的麥角固醇。","","錯誤：Ketoconazole確有抑制腎上腺皮質固醇合成的副作用（通過抑制CYP11A1等腎上腺酶），在人醫曾用於庫欣症（Cushing's disease）治療；但此為其「抗ACTH效應的機制」，不是其抗真菌的「作用機制」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_024","year":2023,"roc_year":112,"session":"","examNo":24,"q":"Fluoroquinolones以高劑量長期使用於年輕的犬與馬後，最常造成下列那一組織不可回復之傷害？","opts":["A. 關節軟骨","B. 前列腺","C. 腎小管","D. 甲狀腺"],"ans":0,"exp":"Fluoroquinolones（如enrofloxacin、ciprofloxacin）在高劑量長期使用下，對幼齡動物（特別是成長中的犬和馬）的關節軟骨（articular cartilage）具有不可逆毒性。機制為fluoroquinolones螯合軟骨細胞外基質中的鎂離子（Mg²⁺），同時誘導軟骨細胞凋亡，破壞軟骨基質合成，導致水泡樣病變（vesicular lesion）。此為幼齡動物禁用或慎用的重要依據。","we":["","錯誤：前列腺（prostate）非fluoroquinolones毒性靶器官；事實上，fluoroquinolones脂溶性高，在前列腺中濃度較高，臨床上常用於治療前列腺感染，而非引起前列腺損傷。","錯誤：腎毒性為aminoglycoside類（gentamicin、amikacin）的特徵性副作用，非fluoroquinolones的主要毒性；fluoroquinolones主要靠腎臟排泄但不累積損傷腎小管上皮。","錯誤：甲狀腺毒性非fluoroquinolones的特徵性副作用；長期使用某些藥物（如amiodarone）可影響甲狀腺功能，但fluoroquinolones不以甲狀腺毒性著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_025","year":2023,"roc_year":112,"session":"","examNo":25,"q":"臨床上，貓感染嚴重Histoplasma spp. 的全身性黴菌症，下列何者為最佳醫療方案？","opts":["A. 初始口服itraconazole，伴隨靜脈注射amphotericin B","B. 初始口服itraconazole，伴隨口服amphotericin B","C. 初始口服itraconazole，伴隨肌肉注射amphotericin B","D. 有腎損傷時，口服amphotericin B"],"ans":0,"exp":"貓嚴重全身性組織胞漿菌症（systemic histoplasmosis）的標準治療為：初始以itraconazole口服（廣效azole，對Histoplasma capsulatum有效）搭配amphotericin B靜脈注射（polyene類，直接結合麥角固醇破壞真菌膜，殺菌力強）。兩者聯用可快速殺菌（amphotericin B）同時維持長期療效（itraconazole）。待病情穩定後改為itraconazole單藥維持治療。","we":["","錯誤：Amphotericin B口服生物利用度極低（<10%），幾乎不被吸收，口服只用於腸道局部黴菌感染；全身性組織胞漿菌症需要靜脈注射amphotericin B才能達到有效血中濃度，不能口服。","錯誤：Amphotericin B為刺激性強的大環內酯類抗真菌藥，肌肉注射（IM）會造成嚴重組織壞死，禁止IM給藥；必須靜脈注射（IV），且通常需以5%葡萄糖液稀釋緩慢滴注。","錯誤：Amphotericin B（傳統靜脈劑型）本身具有顯著腎毒性（引起腎血管收縮、腎小管損傷）；有腎損傷時應更謹慎使用或改用脂質體劑型（liposomal amphotericin B），而非改為口服（因口服無法吸收）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_026","year":2023,"roc_year":112,"session":"","examNo":26,"q":"皮膚感染黴菌時，下列何者治療效果最佳？","opts":["A. itraconazole","B. iodine","C. enrofloxacin","D. isopropamide"],"ans":0,"exp":"皮膚黴菌感染（皮癬菌病/dermatophytosis，病原如Microsporum canis、Trichophyton spp.）的口服首選藥物為itraconazole（伊曲康唑）。Itraconazole具有廣效抗皮癬菌活性、高脂溶性（在皮膚和毛囊中濃度高）、半衰期長（適合間歇給藥），在犬貓皮膚真菌感染中療效確切，為小動物皮膚科臨床標準用藥。","we":["","錯誤：Iodine（碘）雖有廣效殺菌/殺黴菌作用，但刺激性強，全身性使用不安全，且對深層組織黴菌感染效果差；碘製劑（如Lugol's iodine）在獸醫中曾用於馬的孢子絲菌病（sporotrichosis）口服治療，但非皮膚黴菌感染首選。","錯誤：Enrofloxacin為氟喹諾酮類抗生素，對細菌有效（抑制DNA旋轉酶），但對真菌完全無效；皮膚黴菌感染（如皮癬菌病）不應使用抗細菌藥物治療。","錯誤：Isopropamide為抗膽鹼藥（抗毒蕈鹼劑），用於抑制胃腸道蠕動和胃酸分泌；無任何抗真菌活性，與皮膚黴菌治療完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_027","year":2023,"roc_year":112,"session":"","examNo":27,"q":"有關選用控制球蟲症的藥物，下列敘述何者錯誤？","opts":["A. dinotefuran與permethrin合併使用於貓","B. sulfonamides搭配ormetoprim","C. diclazuril治療哺乳類球蟲症","D. toltrazuril治療小豬球蟲症"],"ans":0,"exp":"Dinotefuran（新菸鹼類殺蟲劑）+permethrin（擬除蟲菊酯類）的複方外用製劑僅限用於犬，絕對禁止用於貓。原因是貓缺乏葡萄糖醛酸化酶（glucuronidase），無法代謝permethrin，導致permethrin在貓體內累積，引起嚴重神經毒性（顫抖、癲癇）甚至死亡。此為獸醫臨床安全用藥的重要知識，選項A「dinotefuran與permethrin合併使用於貓」為錯誤敘述。","we":["","此為正確描述：Sulfonamide（sulfonamide）+ormetoprim（二氨基嘧啶類）組合為增效磺胺（sulfonamide potentiators），共同阻斷葉酸合成的連續兩步，對球蟲（Eimeria、Isospora）確有效；不符合「錯誤」描述。","此為正確描述：Diclazuril為苯乙腈類（benzeneacetonitrile）抗球蟲藥，對多種Eimeria和Isospora有效，用於牛、豬、羊等哺乳類動物的球蟲症控制；不符合「錯誤」描述。","此為正確描述：Toltrazuril為triazinetrione類，對Isospora suis（豬球蟲症主要病原）具優良療效，是仔豬（suckling piglets）球蟲症的首選治療藥物，可有效降低發病率；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_028","year":2023,"roc_year":112,"session":"","examNo":28,"q":"下列何者非絛蟲殺滅劑？","opts":["A. dichlorophene","B. epsiprantel","C. azathioprine","D. praziquantel"],"ans":2,"exp":"Azathioprine（硫唑嘌呤）為免疫抑制劑（嘌呤抗代謝物），抑制淋巴細胞增殖，用於自體免疫疾病（如免疫性溶血性貧血、炎症性腸病）；其無任何抗絛蟲活性，完全非絛蟲殺滅劑（taenicide）。其餘選項dichlorophene、epsiprantel、praziquantel均為有效的taenicides。","we":["錯誤：Dichlorophene為酚類化合物，通過解偶聯氧化磷酸化（uncoupling oxidative phosphorylation）殺滅絛蟲；是有效的taenicide（絛蟲殺滅劑），不符合「非絛蟲殺滅劑」的條件。","錯誤：Epsiprantel（依西太）為犬貓絛蟲感染（Dipylidium caninum、Taenia spp.）的口服taenicide；作用機制與praziquantel相似（干擾鈣離子）；為有效的絛蟲殺滅劑，不符合條件。","","錯誤：Praziquantel為最廣效的抗蠕蟲藥之一，對絛蟲（Taenia、Echinococcus、Dipylidium）和吸蟲（Schistosoma、Paragonimus等）均有效；通過破壞蟲體表皮鈣離子平衡和增加膜通透性發揮殺蟲作用，是絛蟲殺滅劑的代表藥，不符合條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_029","year":2023,"roc_year":112,"session":"","examNo":29,"q":"下列有關藥品與相關作用機制的配對，何者正確？","opts":["A. enrofloxacin－G protein","B. nifedipine－tyrosine kinase","C. barbiturate－Cl- channel","D. omeprazole－nuclear receptors"],"ans":2,"exp":"Barbiturate（巴比妥類，如phenobarbital）的作用機制是增強GABA-A受體功能：在GABA存在下延長氯離子（Cl⁻）通道開放時間（增加開放頻率為benzodiazepine的機制），高濃度時甚至可在無GABA情況下直接開放Cl⁻通道。因此barbiturate–Cl⁻ channel為正確配對。其他選項：enrofloxacin靶點為細菌DNA旋轉酶（非G protein）；nifedipine阻斷電壓依賴性Ca²⁺通道（非tyrosine kinase）；omeprazole不可逆抑制H⁺/K⁺-ATPase（非nuclear receptors）。","we":["錯誤：Enrofloxacin（氟喹諾酮類）的作用靶點為細菌DNA旋轉酶（DNA gyrase）和拓撲異構酶IV，與G蛋白信號途徑（G protein-coupled receptor pathway）完全無關；G蛋白偶聯受體是哺乳動物細胞受體，非抗生素靶點。","錯誤：Nifedipine為二氫吡啶類鈣通道阻斷劑（calcium channel blocker，CCB），阻斷L型電壓依賴性鈣通道；酪胺酸激酶（tyrosine kinase）是生長因子受體的信號分子，與鈣通道完全不同。","","錯誤：Omeprazole為proton pump inhibitor（PPI），在胃壁細胞酸性環境中活化為亞磺醯胺（sulfenamide），共價結合並不可逆抑制H⁺/K⁺-ATPase（質子泵）；核受體（nuclear receptors）為類固醇、甲狀腺素等的受體，與PPI機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_030","year":2023,"roc_year":112,"session":"","examNo":30,"q":"下列何者造成氧化磷酸化之不耦合來耗盡絛蟲之ATP，並干擾橫跨外部皮膜之酸鹼值差異？","opts":["A. dichlorophene","B. praziquantel","C. arecoline","D. milbemycin"],"ans":0,"exp":"Dichlorophene（二氯苯酚）為酚類（phenolic）化合物，其殺絛蟲機制為解偶聯氧化磷酸化（uncoupling oxidative phosphorylation）：干擾絛蟲線粒體的跨膜質子梯度（pH差），使ATP合成酶無法利用質子動力勢生成ATP，導致蟲體ATP耗竭死亡。同時破壞蟲體皮膜（tegument）的酸鹼差異，影響膜功能完整性。","we":["","錯誤：Praziquantel的作用機制是增加絛蟲和吸蟲皮膜（tegument）的鈣離子通透性，引起蟲體痙攣、表皮損傷和空泡化；非透過解偶聯氧化磷酸化（不干擾蟲體的跨膜pH差），機制與dichlorophene不同。","錯誤：Arecoline（檳榔鹼）為擬副交感神經藥（cholinomimetic/muscarinic agonist），可刺激腸道蠕動，促進絛蟲節片排出；其驅蟲機制為增強蠕動（peristalsis）而非干擾能量代謝，作用方式完全不同。","錯誤：Milbemycin（如milbemycin oxime）為大環內酯類，作用於無脊椎動物的谷氨酸門控氯離子通道（GluCl channel），引起蟲體麻痺；主要對線蟲（nematodes）和節肢動物有效，非絛蟲（tapeworm）主要靶向藥物，且機制為神經抑制而非氧化磷酸化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_031","year":2023,"roc_year":112,"session":"","examNo":31,"q":"鐵中毒最容易在何種仔畜中見到？","opts":["A. 馬","B. 牛","C. 羊","D. 豬"],"ans":3,"exp":"仔豬（suckling piglets）是鐵中毒最常見的動物。原因：豬母乳鐵含量極低（約1 mg/L），而仔豬快速成長需鐵量大（約7 mg/day）；集約化飼養的仔豬被關在無法接觸土壤的欄舍內，無法從環境獲取鐵，因此必須在出生後2-3天常規接受肌肉注射鐵劑（iron dextran 200 mg）。若劑量計算錯誤或重複注射，容易引起急性鐵中毒（liver necrosis、sudden death）。","we":["錯誤：馬幼駒鐵中毒較少見，因成年馬乳汁鐵含量低但幼駒可從牧草補充；馬的鐵毒性通常與過度補充鐵劑有關，但不如仔豬常見；仔豬是鐵缺乏（含鐵母乳不足）且常規接受肌肉注射鐵劑的動物。","錯誤：牛犢可從牧草和固體飼
