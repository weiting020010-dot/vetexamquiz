_1081_058","year":2019,"roc_year":108,"session":"1","examNo":58,"q":"Carbadox劑量過高易引起保育豬生長遲緩、便秘、脫水等不良反應，其原因與下列何者有關？","opts":["A. hypernatremia","B. hypercalcemia","C. hypoinsulinemia","D. hypoaldosteronism"],"ans":3,"exp":"Carbadox為喹噁啉二氮氧化物類（quinoxaline-di-N-oxide）抗菌促長劑，常用於豬的飼料添加。高劑量使用時，carbadox會抑制腎上腺皮質功能，導致醛固酮（aldosterone）分泌不足，即低醛固酮血症（hypoaldosteronism）。醛固酮負責調節腎臟的鈉鉀交換（保鈉排鉀），缺乏時出現電解質失衡（低血鈉、高血鉀）、便秘、脫水及腎上腺皮質萎縮等症狀。","we":["錯誤：高血鈉不是carbadox毒性的主要機制；carbadox抑制醛固酮分泌，反而導致鈉排出增加和鉀積聚。","錯誤：高血鈣與carbadox毒性無關；鈣代謝異常不是其主要副作用。","錯誤：低胰島素血症（hypoinsulinemia）不是carbadox毒性的機制；carbadox主要影響腎上腺皮質功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_059","year":2019,"roc_year":108,"session":"1","examNo":59,"q":"下列何者屬於glycopeptide類抗菌劑？","opts":["A. ronidazole","B. pirlimycin","C. spectinomycin","D. vancomycin"],"ans":3,"exp":"Glycopeptide類抗生素的代表藥物為vancomycin和teicoplanin，其作用機制為結合細菌細胞壁前驅物的D-Ala-D-Ala端，阻止肽聚糖（peptidoglycan）交聯，抑制細胞壁合成。Vancomycin主要用於耐甲氧苯青黴素金黃色葡萄球菌（MRSA）及嚴重革蘭氏陽性菌感染。其他選項分屬不同藥物類別。","we":["錯誤：Ronidazole為硝基咪唑類（nitroimidazole），用於治療梨形鞭毛蟲症和毛滴蟲症，不屬於glycopeptide類。","錯誤：Pirlimycin為林可醯胺類（lincosamide），用於乳牛乳房炎，不是glycopeptide。","錯誤：Spectinomycin為胺基環醇類（aminocyclitol），作用於30S核糖體次單位，不是glycopeptide類。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_060","year":2019,"roc_year":108,"session":"1","examNo":60,"q":"下列何項組合可用於治療由Rhodococcus equi引起馬的肺炎？","opts":["A. clarithromycin+rifampin","B. cefoxitin+clindamycin","C. flucytosine+amphotericin B","D. penicillin+streptomycin"],"ans":0,"exp":"Rhodococcus equi（馬羅德球菌）為幼齡馬（駒）肉芽腫性肺炎的重要病原，是兼性細胞內寄生菌。由於其存在於巨噬細胞內，需使用能進入細胞內的抗菌劑。臨床標準療法為clarithromycin（或azithromycin）加上rifampin（rifampicin）的組合，兩者均能良好滲透細胞內並具協同效果。此組合已取代舊式的erythromycin+rifampin方案。","we":["","錯誤：Cefoxitin+clindamycin為手術感染預防或厭氧菌感染的組合，不是Rhodococcus equi的標準療法。","錯誤：Flucytosine+amphotericin B為抗真菌組合，用於全身性真菌感染，不用於Rhodococcus equi（細菌）感染。","錯誤：Penicillin+streptomycin的組合對Rhodococcus equi效果差，因R. equi為細胞內寄生菌，需要能穿入細胞的macrolide。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_061","year":2019,"roc_year":108,"session":"1","examNo":61,"q":"某犬服用某藥物後產生跛行、聽力受損、皮膚發疹、蛋白尿及血液學檢查有BUN、creatinine增加情況，其最\r 有可能為服用下列何種藥物中毒所致？","opts":["A. macrolides","B. lincosamides","C. aminoglycosides","D. tetracyclines"],"ans":2,"exp":"Aminoglycosides（胺基配糖體類，如gentamicin、amikacin、tobramycin）的特徵性毒性包括：腎毒性（nephrotoxicity）— 造成近端腎小管損傷，導致蛋白尿、BUN/creatinine升高；耳毒性（ototoxicity）— 損傷耳蝸毛細胞導致聽力受損，損傷前庭導致共濟失調/跛行；以及潛在的神經肌肉阻斷（NMJ blockade）。皮膚發疹為過敏反應。這些症狀的組合高度指向aminoglycosides中毒。","we":["錯誤：大環內酯類（macrolides）的主要毒性為胃腸道副作用和輕微心臟毒性，不以腎毒性和耳毒性為特徵。","錯誤：林可醯胺類（lincosamides）主要胃腸道副作用，可能影響NMJ，但不以耳毒性和腎毒性著稱。","","錯誤：四環素類（tetracyclines）主要副作用為胃腸道不適、骨骼和牙齒發育影響，不具aminoglycoside典型的耳腎毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_062","year":2019,"roc_year":108,"session":"1","examNo":62,"q":"下列何者為vincristine毒殺腫瘤細胞的主要作用機制？","opts":["A. 抑制胸腺嘧啶核苷酸合成酶（thymidylate synthase）","B. 抑制細胞有絲分裂紡錘體微管的形成","C. 抑制核糖核苷酸還原酶（ribonucleotide reductase）","D. 抑制第二型拓樸異構酶（topoisomerase-II）"],"ans":1,"exp":"Vincristine為長春花鹼類（vinca alkaloids），從長春花（Catharanthus roseus）中提取。其作用機制為結合微管蛋白二聚體（tubulin dimer），抑制微管聚合（microtubule polymerization），從而阻止有絲分裂紡錘體（mitotic spindle）的形成，使細胞停滯於有絲分裂中期（metaphase arrest）。此為細胞週期特異性（M期）藥物，用於淋巴瘤、肥大細胞瘤等治療。","we":["錯誤：抑制胸腺嘧啶核苷酸合成酶為5-fluorouracil（5-FU）和methotrexate的機制，不是vincristine。","","錯誤：抑制核糖核苷酸還原酶為hydroxyurea的作用機制，vincristine作用於微管蛋白（tubulin）。","錯誤：抑制topoisomerase-II為doxorubicin和etoposide的機制，vincristine的標靶是細胞有絲分裂紡錘體微管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_063","year":2019,"roc_year":108,"session":"1","examNo":63,"q":"犬隻使用cyclophosphamide，生物轉化產生acrolein最可能引起下列何種毒性？","opts":["A. 心肌病變","B. 肺纖維化","C. 膀胱炎","D. 神經病變"],"ans":2,"exp":"Cyclophosphamide為烷化劑（alkylating agent），需經肝臟細胞色素P-450活化，生成活性代謝物4-hydroxycyclophosphamide，進而自發分解為phosphoramide mustard（具抗腫瘤活性）和acrolein（具泌尿道毒性）。Acrolein為高度反應性的α,β-不飽和醛，排泄至膀胱時直接刺激並損傷膀胱移行上皮，引起出血性膀胱炎（hemorrhagic cystitis）。臨床上可使用mesna（mercaptoethane sulfonate）預防此毒性。","we":["錯誤：心肌病變（心臟毒性）為doxorubicin（anthracycline）的特徵性副作用，不是cyclophosphamide的主要毒性。","錯誤：肺纖維化（肺毒性）為bleomycin和busulfan的特徵性副作用，不是cyclophosphamide代謝物acrolein的效果。","","錯誤：神經病變為vincristine等長春花鹼類的特徵性副作用，acrolein主要刺激膀胱黏膜而非神經組織。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_064","year":2019,"roc_year":108,"session":"1","examNo":64,"q":"Rimantadine抗病毒作用機制是：","opts":["A. 抑制病毒顆粒組裝","B. 干擾病毒合成蛋白質","C. 干擾病毒合成DNA","D. 抑制reverse transcriptase"],"ans":0,"exp":"Rimantadine與amantadine同屬adamantane類抗病毒藥，其作用機制為阻斷甲型流感病毒（Influenza A）的M2蛋白質離子通道。M2通道正常功能是使H+進入病毒顆粒內部，引起pH下降，促進病毒核糖核蛋白（RNP）解離，完成病毒脫殼（uncoating）並讓RNP進入細胞核。阻斷M2通道即阻止此脫殼過程，同時也影響新合成病毒顆粒的裝配（assembly），因此稱為抑制病毒顆粒組裝。","we":["","錯誤：干擾病毒蛋白質合成為某些干擾素的作用，rimantadine阻斷M2離子通道影響病毒脫殼和裝配過程。","錯誤：干擾病毒DNA合成為acyclovir、ganciclovir等的機制，rimantadine作用於M2通道影響流感病毒包膜。","錯誤：抑制逆轉錄酶為AZT（zidovudine）等抗HIV藥的機制，rimantadine針對甲型流感病毒，不作用於逆轉錄酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_065","year":2019,"roc_year":108,"session":"1","examNo":65,"q":"大多數抗腫瘤藥物會影響骨髓的造血機能，原因為何？","opts":["A. 藥物促使腫瘤細胞轉移至骨髓","B. 藥物抑制骨髓細胞的分裂","C. 藥物殺死腫瘤細胞時釋放出毒性物質所致","D. 藥物引起的過敏性反應"],"ans":1,"exp":"大多數細胞毒性抗腫瘤藥物（cytotoxic drugs）主要針對快速分裂的細胞。骨髓為造血幹細胞持續增殖分化的場所，其細胞分裂速率僅次於腸道上皮細胞。因此，這些藥物在殺滅快速分裂的腫瘤細胞的同時，也不可避免地抑制骨髓中快速分裂的造血前驅細胞，導致骨髓抑制（myelosuppression），引起白血球減少症（leukopenia）、血小板減少症（thrombocytopenia）和貧血。","we":["錯誤：腫瘤細胞轉移至骨髓是某些惡性腫瘤的結果，不是抗腫瘤藥物造成骨髓抑制的原因。","","錯誤：腫瘤細胞死亡時會釋放細胞內容物，但此不是造成骨髓造血抑制的主要原因；骨髓細胞本身對細胞毒性藥物敏感。","錯誤：過敏性反應可能影響多個器官，但不是大多數抗腫瘤藥物造成骨髓抑制的主要解釋。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_066","year":2019,"roc_year":108,"session":"1","examNo":66,"q":"下列何者為抑菌性抗生素？","opts":["A. amoxicillin","B. oxytetracycline","C. bacitracin","D. streptomycin"],"ans":1,"exp":"抑菌性抗生素（bacteriostatic antibiotics）僅抑制細菌生長而不直接殺死，依靠宿主免疫系統最終清除細菌。Tetracyclines（包括oxytetracycline）為典型的抑菌性抗生素，可逆性結合細菌30S核糖體，阻止aminoacyl-tRNA與核糖體A位點結合，抑制蛋白質合成。其他抑菌性抗生素包括chloramphenicol、sulfonamides、lincosamides和macrolides（低濃度時）。","we":["錯誤：Amoxicillin為殺菌性（bactericidal）抗生素，破壞細胞壁合成導致細菌死亡。","","錯誤：Bacitracin為殺菌性多肽類抗生素，干擾細菌細胞壁的脂質載體循環，導致細菌死亡。","錯誤：Streptomycin為殺菌性aminoglycoside，作用於30S核糖體造成mRNA錯讀，高濃度時具殺菌效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_067","year":2019,"roc_year":108,"session":"1","examNo":67,"q":"下列何種抗菌劑為作用於30S核糖體次單位，且口服吸收差？","opts":["A. paromomycin","B. tylosin","C. clindamycin","D. rifampin"],"ans":0,"exp":"Paromomycin為aminoglycoside類抗生素，作用於細菌和原蟲30S核糖體次單位（16S rRNA），干擾蛋白質合成。由於具有高度親水性（水溶性離子化形式），口服後幾乎不被腸道吸收（<1%），因此作用局限於腸道，用於治療腸道阿米巴症（amebiasis）、隱孢子蟲症（cryptosporidiosis）和腸道細菌感染。此特性（30S作用＋口服吸收差）使其符合本題描述。","we":["","錯誤：Tylosin為大環內酯類，作用於50S核糖體次單位，口服後有一定吸收率，非30S作用且非口服吸收差。","錯誤：Clindamycin為林可醯胺類，作用於50S核糖體次單位，口服吸收良好，不符合本題條件。","錯誤：Rifampin（rifampicin）抑制細菌RNA聚合酶，口服吸收良好，不作用於30S核糖體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_068","year":2019,"roc_year":108,"session":"1","examNo":68,"q":"為降低難溶性磺胺劑在泌尿系統中產生結石，下列處置何者錯誤？","opts":["A. 併用同類藥","B. 供給充分水分","C. 降低尿液的pH值","D. 併用NaHCO3"],"ans":2,"exp":"磺胺劑溶解度隨尿液pH升高（鹼化）而增加；酸性尿液會降低磺胺劑溶解度，促進結晶析出，增加尿路結晶（crystalluria）和尿路阻塞的風險。因此降低尿液pH值（酸化尿液）是錯誤做法。正確預防措施包括：大量飲水稀釋尿液、使用NaHCO3鹼化尿液、使用三種磺胺合劑（triple sulfa）以降低各成分的個別濃度。","we":["此為正確描述：三種磺胺劑聯合使用（triple sulfa）可降低各藥物個別濃度，減少結晶析出，不符合「錯誤」描述。","此為正確描述：供給充分水分可稀釋尿液中的磺胺劑濃度，降低結晶沉積風險，不符合「錯誤」描述。","","此為正確描述：使用碳酸氫鈉（NaHCO3）鹼化尿液可增加磺胺劑溶解度，防止結晶，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_069","year":2019,"roc_year":108,"session":"1","examNo":69,"q":"下列何者為外寄生蟲殺滅劑？","opts":["A. naphazoline","B. lodoxamide","C. dinotefuran","D. hirudin"],"ans":2,"exp":"Dinotefuran為新菸鹼類殺蟲劑（neonicotinoid insecticide），作用機制為結合昆蟲神經元的菸鹼型乙醯膽鹼受體（nAChR），造成持續性神經興奮和昆蟲死亡。作為外寄生蟲殺滅劑（ectoparasiticide），廣泛用於犬貓的跳蚤（Ctenocephalides）和蜱防治，安全性高。其他選項均為非殺蟲劑藥物。","we":["錯誤：Naphazoline為α1腎上腺素受體致效劑，用作鼻黏膜充血舒解劑，不是殺蟲劑。","錯誤：Lodoxamide為肥大細胞穩定劑，用於過敏性眼部疾病，不具殺蟲活性。","","錯誤：Hirudin為水蛭來源的天然抗凝血劑，抑制凝血酶（thrombin），不是外寄生蟲殺滅劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_070","year":2019,"roc_year":108,"session":"1","examNo":70,"q":"下列何者用於噴灑於家用物及動物身上，以預防跳蚤之蟲卵、蛹及幼蟲發育為成體？","opts":["A. methoprene","B. methoxychlor","C. methotrexate","D. methohexital"],"ans":0,"exp":"Methoprene為保幼激素類似物（juvenile hormone analog），屬於昆蟲生長調節劑（insect growth regulator, IGR）。昆蟲正常發育從蛹化為成蟲需要保幼激素濃度下降；methoprene維持高濃度的保幼激素狀態，使昆蟲（特別是跳蚤）的卵、幼蟲和蛹無法正常發育為成體，從而中斷跳蚤的生活史。可噴灑於環境和動物身上作為跳蚤控制的重要手段。","we":["","錯誤：Methoxychlor為有機氯殺蟲劑，主要殺滅成蟲，不具昆蟲生長調節活性，也因環境持久性問題已限制使用。","錯誤：Methotrexate為抗代謝類抗腫瘤藥，抑制葉酸合成，不具任何殺蟲或昆蟲生長調節活性。","錯誤：Methohexital為超短效巴比妥類麻醉誘導劑，不具殺蟲效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_071","year":2019,"roc_year":108,"session":"1","examNo":71,"q":"下列何者能有效及安全治療兔疥癬症？","opts":["A. dorzolamide","B. acetazolamide","C. doramectin","D. glycopyrrolate"],"ans":2,"exp":"Doramectin為大環內酯類抗寄生蟲藥（avermectin group），作用機制為增強昆蟲和線蟲的氯離子通道（glutamate-gated Cl-channel）活性，導致神經肌肉超極化、麻痺死亡。用於兔疥癬症（sarcoptic mange, Sarcoptes scabiei）有效且相對安全，通常皮下注射給藥。其他三個選項為碳酸酐酶抑制劑或抗膽鹼藥，均無抗寄生蟲效果。","we":["錯誤：Dorzolamide為碳酸酐酶抑制劑，用於降低眼壓治療青光眼，不具抗疥癬效果。","錯誤：Acetazolamide為碳酸酐酶抑制劑利尿劑，不用於治療體外寄生蟲病。","","錯誤：Glycopyrrolate為長效型抗膽鹼藥，用於術前給藥或胃腸痙攣，不具抗寄生蟲效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_072","year":2019,"roc_year":108,"session":"1","examNo":72,"q":"臨床上，對於貓分離出Malassezia spp.的外耳道炎，下列何者為最佳醫療方案？","opts":["A. 口服tacrolimus","B. 肌肉注射amphotericin B","C. 局部塗抹nystatin","D. 局部塗抹imiquimod"],"ans":2,"exp":"Malassezia spp.（馬拉色黴菌）為貓外耳道酵母菌感染的常見病原。治療選擇以局部（topical）抗黴菌製劑為主。Nystatin為多烯類抗黴菌藥，作用機制為結合真菌細胞膜的麥角固醇（ergosterol），造成細胞膜通透性增加，對Malassezia外耳道炎的局部塗抹治療安全有效。Amphotericin B雖有效但全身毒性大，不用於單純性外耳炎；tacrolimus和imiquimod均無抗黴菌活性。","we":["錯誤：Tacrolimus為免疫調節劑（calcineurin inhibitor），用於過敏性皮膚炎，不具抗黴菌活性。","錯誤：Amphotericin B為廣效性抗黴菌藥，但靜脈或肌肉注射毒性大，外耳道黴菌感染優先使用局部製劑。","","錯誤：Imiquimod為免疫調節劑，用於人類乳突病毒（HPV）感染等病毒性皮膚疾患，對Malassezia黴菌感染無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_073","year":2019,"roc_year":108,"session":"1","examNo":73,"q":"下列何者為amphotericin B併用itraconazole的主要目的？","opts":["A. 不會進入體循環","B. 皆為口服投藥方便且有加乘作用","C. 降低腎毒性","D. 治療犬和貓的腎上腺皮質機能亢進症"],"ans":2,"exp":"Amphotericin B為多烯類廣效性抗黴菌藥，對全身性深部真菌感染有效，但其主要副作用為嚴重腎毒性（nephrotoxicity）。與itraconazole（咪唑類口服抗黴菌藥）合用時，由於兩者具有協同抗黴菌效果，可以降低amphotericin B的使用劑量，從而減少腎毒性的發生機率，同時維持治療效果。此為此組合的主要目的。","we":["錯誤：Amphotericin B靜脈注射後會進入體循環，此描述不正確；組合目的是降低amphotericin B的腎毒性。","錯誤：Amphotericin B需靜脈注射，不能口服給藥；組合目的是降低腎毒性，而非方便性或加乘。","","錯誤：腎上腺皮質機能亢進症（Cushing disease）使用trilostane或mitotane，不是amphotericin B+itraconazole的適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_074","year":2019,"roc_year":108,"session":"1","examNo":74,"q":"下列何者結合至DNA並干擾寄生蟲複製，可用於治療犬焦蟲症？","opts":["A. dichlorophene","B. clorsulon","C. imidocarb","D. fenthion"],"ans":2,"exp":"Imidocarb dipropionate為芳香族脒類（aromatic diamidine）抗原蟲藥，其作用機制為嵌入原蟲DNA（DNA intercalation），干擾DNA複製和轉錄，從而抑制Babesia（焦蟲）等血液原蟲的複製。Imidocarb為犬焦蟲症（canine babesiosis，Babesia canis和Babesia gibsoni感染）的標準治療藥物，通常肌肉注射給藥，需注意毒蕈鹼型副作用（可使用atropine預防）。","we":["錯誤：Dichlorophene為抗絛蟲藥，不用於犬焦蟲症（babesiosis）。","錯誤：Clorsulon抑制肝片吸蟲的糖解酵素，用於治療fasciolosis，不用於焦蟲症。","","錯誤：Fenthion為有機磷殺外寄生蟲劑，不用於犬焦蟲症治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_075","year":2019,"roc_year":108,"session":"1","examNo":75,"q":"下列何種酵素受到ketoconazole的抑制？","opts":["A. cytochrome P-450","B. monoamine oxidase","C. cholinesterase","D. cyclooxygenase"],"ans":0,"exp":"Ketoconazole（及其他azole類抗黴菌藥）的抗黴菌機制為抑制真菌細胞色素P-450酵素（特別是CYP51/lanosterol 14α-demethylase），干擾麥角固醇（ergosterol）生物合成，造成真菌細胞膜功能喪失。此外，ketoconazole也顯著抑制哺乳動物的CYP3A4等CYP450同工酵素，導致藥物交互作用（drug interactions）和腎上腺皮質荷爾蒙合成抑制。","we":["","錯誤：單胺氧化酶（MAO）抑制劑（如selegiline）用於行為和神經疾病，ketoconazole不抑制MAO。","錯誤：膽鹼酯酶抑制劑用於有機磷中毒治療（pralidoxime）或重症肌無力（edrophonium），ketoconazole不抑制膽鹼酯酶。","錯誤：環氧化酶（COX）為NSAIDs的作用標靶，ketoconazole的抗黴菌機制為抑制細胞色素P-450酵素（CYP51）干擾麥角固醇合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_076","year":2019,"roc_year":108,"session":"1","examNo":76,"q":"Amphotericin B與黴菌細胞膜中何種固醇類的結合力特別強？","opts":["A. tetrahymanol","B. sitosterol","C. cholesterol","D. ergosterol"],"ans":3,"exp":"Amphotericin B為多烯類（polyene）抗黴菌藥，其分子具有親脂性多烯鏈（polyene chain）和親水性多羥基鏈，能選擇性與真菌細胞膜中的麥角固醇（ergosterol）緊密結合，造成細胞膜出現孔洞（pore formation），導致K+、Na+等離子和細胞內容物外漏，最終導致真菌死亡。哺乳動物細胞膜含膽固醇（cholesterol）而非麥角固醇，amphotericin B對ergosterol的親和力遠高於cholesterol（約10倍），提供選擇性毒性。","we":["錯誤：Tetrahymanol為某些原生動物細胞膜的固醇，amphotericin B主要靶向真菌ergosterol，對tetrahymanol結合力弱。","錯誤：Sitosterol為植物固醇，不存在真菌細胞膜，不是amphotericin B的主要結合標靶。","錯誤：Cholesterol為哺乳動物細胞膜的主要固醇，amphotericin B對ergosterol的親和力遠高於cholesterol（約10倍），選擇性較高。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_077","year":2019,"roc_year":108,"session":"1","examNo":77,"q":"下列何者為治療犬隻慢性銅中毒的首選解毒劑？","opts":["A. penicillamine","B. sodium thiosulfate","C. methylpyrazole","D. phytonadione"],"ans":0,"exp":"D-Penicillamine（青黴胺）為含有巰基（-SH）的螯合劑，能與銅、鉛、汞等重金屬形成穩定的水溶性螯合物，促進其由尿液排泄。在犬隻（特別是Bedlington Terrier等銅代謝異常品種），慢性銅蓄積（hepatic copper toxicosis）為重要疾病，D-penicillamine為首選治療藥物，可長期口服使用。其他選項為針對氰化物、乙二醇或抗凝血劑中毒的解毒劑。","we":["","錯誤：Sodium thiosulfate用於氰化物中毒解毒（與nitrite配合），不具銅螯合能力。","錯誤：Methylpyrazole（4-MP/fomepizole）為乙二醇（antifreeze）中毒的解毒劑，不用於銅中毒。","錯誤：Phytonadione（維生素K1）用於抗凝血劑（如warfarin、rodenticide）中毒的治療，不具銅螯合作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_078","year":2019,"roc_year":108,"session":"1","examNo":78,"q":"Desferrioxamine緩慢的靜脈點滴注射用以治療下列何種金屬中毒？","opts":["A. 鐵","B. 銅","C. 汞","D. 鎘"],"ans":0,"exp":"Desferrioxamine（去鐵胺，deferoxamine）為天然微生物產生的鐵螯合劑（iron chelator），能選擇性結合游離鐵（free iron）及ferritin/hemosiderin中的三價鐵，形成水溶性的ferrioxamine複合物，由腎臟排出，使尿液呈橘紅色（vin rosé urine）。為急慢性鐵中毒（iron toxicosis）的特效解毒劑，以緩慢靜脈點滴或肌肉注射給藥。","we":["","錯誤：銅中毒使用penicillamine或trientine螯合，不使用deferoxamine。","錯誤：汞中毒使用dimercaprol（BAL）或DMSA（succimer）螯合，deferoxamine對汞無效。","錯誤：鎘中毒目前無特效螯合劑；deferoxamine特異性針對鐵離子，不用於鎘中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_079","year":2019,"roc_year":108,"session":"1","examNo":79,"q":"在治療氰化物（cyanide）中毒時，下列何者為佳？","opts":["A. ascorbic acid－oral","B. sodium nitrite－IV","C. methylene blue－SC","D. phytonadione－IM"],"ans":1,"exp":"氰化物中毒的解毒機制為誘導高鐵血紅素血症（methemoglobinemia）：靜脈注射亞硝酸鈉（sodium nitrite, NaNO2）使血紅素中的Fe2+氧化為Fe3+，形成methemoglobin（MHb）。Methemoglobin對氰離子（CN-）的親和力遠高於細胞色素氧化酶，故CN-轉而與MHb結合形成cyanmethemoglobin，解除對細胞色素氧化酶的抑制，恢復細胞有氧代謝。隨後使用sodium thiosulfate將cyanmethemoglobin中的CN-轉化為無毒的thiocyanate排出。","we":["錯誤：口服ascorbic acid（維生素C）吸收緩慢，無法提供氰化物中毒所需的快速解毒，不是最佳選擇。","","錯誤：Methylene blue用於治療高鐵血紅素血症（methemoglobinemia），將高鐵血紅素還原；而氰化物中毒需生成高鐵血紅素來競爭氰離子，兩者目標相反，且SC注射非正確用法。","錯誤：Phytonadione（維生素K1）用於抗凝血劑中毒（如殺鼠劑），對氰化物中毒完全無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1081_080","year":2019,"roc_year":108,"session":"1","examNo":80,"q":"有關有機氯殺蟲劑的敘述，下列何者錯誤？","opts":["A. 易溶於水親脂性","B. 環境中殘留時間長","C. 易儲存於脂肪中","D. 幼齡動物較老年動物感受性強"],"ans":0,"exp":"有機氯殺蟲劑（organochlorines，如DDT、lindane、chlordane）的主要特性：高度脂溶性（lipophilic）而非水溶性；在環境中極為穩定，殘留期長達數年至數十年；易在脂肪組織中蓄積（bioaccumulation and biomagnification）；幼齡動物因體脂比例高、肝臟代謝酵素未成熟，對其毒性較老年動物更敏感。選項A描述「易溶於水親脂性」為矛盾說法（水溶性和親脂性互相矛盾），且有機氯殺蟲劑為高度脂溶性而非水溶性，故A為錯誤描述。","we":["","此為正確描述：有機氯殺蟲劑（如DDT、lindane）在環境中高度穩定，殘留期可長達數年至數十年，不符合「錯誤」描述。","此為正確描述：有機氯殺蟲劑脂溶性高，易在脂肪組織中蓄積，不符合「錯誤」描述。","此為正確描述：幼齡動物體脂比例高、代謝酵素不成熟，對有機氯殺蟲劑的毒性較老年動物敏感，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_001","year":2019,"roc_year":108,"session":"2","examNo":1,"q":"有關種別造成藥品差異的敘述，下列何者錯誤？","opts":["A. Chloramphenicol在貓的消除半衰期大於犬","B. Primidone並不適用於貓癲癇的治療","C. 犬隻口服diazepam的生體可用率低於直腸投藥的生體可利用率","D. 犬隻口服enrofloxacin的生體可用率低於20%"],"ans":3,"exp":"本題問何者「錯誤」。犬隻口服enrofloxacin的生體可用率約為85%，遠高於20%，故D為錯誤敘述。A（貓的chloramphenicol半衰期較犬長）、B（primidone不適用於貓）、C（犬口服diazepam首渡效應大，BA低於直腸給藥）均為正確敘述。","we":["此為正確描述：貓缺乏葡萄醛酸接合（glucuronidation）能力，chloramphenicol半衰期較犬長，不符合「錯誤」描述。","此為正確描述：Primidone在貓體內代謝方式與犬不同，不建議使用於貓癲癇的治療，不符合「錯誤」描述。","此為正確描述：犬口服diazepam首渡效應顯著，生體可用率低於直腸給藥，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_002","year":2019,"roc_year":108,"session":"2","examNo":2,"q":"有關藥品於體內運輸的敘述，下列何者正確？","opts":["A. 凡使用載體運輸就必需要消耗ATP","B. 反向（antiport）運輸是指藥品均由低濃度往高濃度運輸","C. 同向（symport）運輸是指藥品均由高濃度往低濃度運輸","D. Methadone為P-glycoprotein的受質之一"],"ans":3,"exp":"Methadone為P-glycoprotein（P-gp）的受質之一，P-gp可將其排出細胞外，影響其腦部分布與腸道吸收。A錯誤：促進性擴散（facilitated diffusion）雖使用載體但不消耗ATP；B錯誤：反向運輸指兩種物質反向移動，非兩者均逆梯度；C錯誤：同向運輸可包含逆梯度的主動成分。","we":["錯誤：載體介導的促進性擴散（facilitated diffusion）不需消耗ATP，只有原發性主動運輸才需要ATP提供能量。","錯誤：反向運輸（antiport）指兩種物質向相反方向移動，並非兩者都必須逆濃度梯度運輸。","錯誤：同向運輸（symport）指兩種物質同方向移動，其中一種可順梯度，借助其能量驅動另一種逆梯度，並非兩者均為順梯度。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_003","year":2019,"roc_year":108,"session":"2","examNo":3,"q":"有關藥品異構物的敘述，下列何者正確？","opts":["A. S(-)Propranolol為eutomer","B. S(+)Ketamine為eutomer","C. S(+)Ketoprofen的消炎藥效較佳","D. R(-)Ketoprofen的鎮痛藥效較佳"],"ans":1,"exp":"S(+)Ketamine為eutomer（效優型），其麻醉效力約為R(-)型的3倍，且副作用較少。S(-)Propranolol才是eutomer（beta阻斷效力是R(+)的100倍），故A正確描述但題目問的是哪個敘述正確，B為本題正確答案。S(+)Ketoprofen的COX抑制能力確實強於R(-)型，D說R(-)鎮痛較佳亦為錯誤。","we":["錯誤：S(-)Propranolol確為eutomer（效優型），其β受體阻斷活性遠強於R(+)型，本選項敘述實為正確，但題目正確答案為B（S(+)Ketamine為eutomer）。","","錯誤：Ketoprofen中，S(+)型對COX-1抑制能力較強，R(-)型作用較弱；此選項說法本身不完全錯誤，但S(+)型確實是主要活性形式，故非最佳錯誤選項。","錯誤：R(-)Ketoprofen的鎮痛消炎效力較S(+)型弱，S(+)型對環氧化酶（COX）的抑制作用更強，R(-)型並非鎮痛藥效較佳的異構物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_004","year":2019,"roc_year":108,"session":"2","examNo":4,"q":"有關口服投藥之敘述，下列何者正確？","opts":["A. 口服neomycin常用於治療腎臟細菌性感染","B. 口服 nystatin具很高的生體可用率（bioavailability）","C. 口服 propranolol具明顯的首渡效應（first-pass effect）","D. 口服與肌肉注射penicillin G皆具有相似的生體可用率"],"ans":2,"exp":"Propranolol口服後，雖脂溶性高、吸收良好，但通過門脈循環時肝臟首渡效應顯著，約70%在到達體循環前即被代謝，故口服BA較低。Neomycin口服幾乎不吸收（用於腸道局部消毒）；Nystatin口服不吸收；Penicillin G口服因胃酸不穩定且首渡效應，BA遠低於注射。","we":["錯誤：Neomycin口服後幾乎不被吸收，無法到達腎臟，故不用於治療全身性或腎臟細菌感染，而是用於腸道局部抗菌或術前腸道準備。","錯誤：Nystatin口服後幾乎不被吸收，生體可用率極低，僅用於口腔或腸道黴菌感染的局部治療，不具全身作用。","","錯誤：Penicillin G因在胃酸中不穩定，口服後大量被破壞，加上首渡效應，生體可用率遠低於肌肉注射，兩者差異顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_005","year":2019,"roc_year":108,"session":"2","examNo":5,"q":"當一個血漿蛋白結合率為99%的A藥品，若於併用B藥時，會使其蛋白結合率較原始結合率下降10%，則於併用\r 後，A藥新的自由態約為原始自由態的幾倍？","opts":["A. 0.5","B. 1.5","C. 5","D. 11"],"ans":3,"exp":"原始血漿蛋白結合率99%，游離型1%。結合率下降10個百分點至89%，游離型升至11%。新游離型/原游離型 = 11% / 1% = 11倍。","we":["錯誤：新游離型比率為11%，原游離型比率為1%，比值為11倍，不是0.5倍。0.5倍代表游離型減少，與題意相反。","錯誤：蛋白結合率從99%降至89%，游離型從1%增至11%，增加11倍，而非1.5倍。若增加1.5倍，游離型僅需從1%增至1.5%。","錯誤：若游離型增加5倍（從1%到5%），則結合率應從99%降至95%（僅降4個百分點）。本題結合率降10個百分點，游離型增加11倍，不是5倍。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_006","year":2019,"roc_year":108,"session":"2","examNo":6,"q":"複選題\n6.有關高血漿白蛋白結合率的藥物特性，下列何者正確？","opts":["A. 較易經絲球體過濾","B. 較易通過細胞膜","C. 擬似分布體積較小","D. 不易穿過血腦障壁"],"ans":0,"exp":"本題為複選題，依yamol公布答案為A。高蛋白結合率藥物：(A) 較易經絲球體過濾——此說法有爭議，一般認為蛋白結合藥物反而不易被過濾，但依題目公布答案選A；(C) 擬似分布體積較小——正確；(D) 不易穿過血腦障壁——正確；(B) 較易通過細胞膜——錯誤，蛋白結合後分子量大，不易通過膜。","we":["","錯誤：與血漿蛋白結合的藥物分子量大，且為親水性複合體，不易通過脂質雙層細胞膜，故此說法不正確。","錯誤：高蛋白結合率藥物分布受限於血漿，擬似分布體積（Vd）確實較小，此為正確特性，非題目要問的錯誤選項。","錯誤：高蛋白結合率藥物因難以穿透血腦障壁，中樞作用受限，此亦為正確特性，非題目要問的錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_007","year":2019,"roc_year":108,"session":"2","examNo":7,"q":"假設某藥物從血漿中排除的速率是一階次動力反應（first-order kinetics），若其排除速率常數愈大，則其半衰\r 期：","opts":["A. 愈長","B. 愈短","C. 固定不變","D. 證據不足以判斷"],"ans":1,"exp":"一階次動力反應的半衰期公式：t½ = 0.693 / ke，其中ke為排除速率常數。ke愈大，t½愈短；ke愈小，t½愈長。兩者成反比關係。","we":["錯誤：根據t½ = 0.693/ke，ke（排除速率常數）愈大，半衰期愈短，而非愈長；兩者為反比關係。","","錯誤：半衰期與ke成反比（t½ = 0.693/ke），ke改變則t½隨之改變，不是固定不變。","錯誤：根據t½ = 0.693/ke的數學關係，ke與t½的關係明確且可量化，證據充分，可確定判斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_008","year":2019,"roc_year":108,"session":"2","examNo":8,"q":"某藥物經口投予的生體可用率（bioavailability）是直腸內投予的50%，下列何項原因的可能性最高？","opts":["A. 直腸的局部血流量大，利於藥物吸收","B. 藥物的首渡效應（first-pass effect）很高","C. 藥物進行腸肝再循環（enterohepatic recirculation）的比率很高","D. 藥物脂溶性高、不易形成離子型態"],"ans":1,"exp":"口服BA低於直腸給藥的最主要原因是首渡效應（first-pass effect）。口服藥物經腸道吸收後，經門靜脈進入肝臟，在到達全身循環前即被大量代謝。直腸下段的靜脈回流不經門脈，可部分繞過肝臟首渡效應，因此直腸給藥的BA較高。","we":["錯誤：直腸局部血流量大有助於直腸給藥的吸收，但這是解釋直腸給藥效果好的原因，而非口服BA較低的原因；兩者均有充足血流。","","錯誤：腸肝再循環是指藥物經膽汁排入腸道後再被吸收，這會增加藥物在體內的滯留時間，不能解釋口服BA低於直腸給藥。","錯誤：脂溶性高的藥物有利於腸道被動吸收，反而提升口服BA，不會使口服BA低於直腸給藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_009","year":2019,"roc_year":108,"session":"2","examNo":9,"q":"下列何者具有抑制肝臟微粒體酶，進而影響其他藥物的生物轉化（biotransformation）？","opts":["A. cimetidine","B. sucralfate","C. misoprostol","D. xylazine"],"ans":0,"exp":"Cimetidine為H2受體拮抗劑，同時是強效的肝臟CYP450酶抑制劑（尤其是CYP1A2、CYP2C9、CYP2D6、CYP3A4），可減緩多種藥物的代謝，增加其血中濃度，造成藥物交互作用。其他選項均不具顯著的CYP450抑制作用。","we":["","錯誤：Sucralfate為胃黏膜保護劑，在胃酸環境中形成保護膜，不具有抑制肝臟CYP450微粒體酶的作用，不影響其他藥物代謝。","錯誤：Misoprostol為前列腺素E1類似物（PGE1 analog），用於保護胃黏膜及抑制胃酸分泌，不影響肝臟CYP450酶活性。","錯誤：Xylazine為α2受體致效劑，主要用於鎮靜和肌肉鬆弛，不會顯著抑制肝臟微粒體CYP450酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_010","year":2019,"roc_year":108,"session":"2","examNo":10,"q":"藥物之生體可用率（bioavailability）主要測定下列那一參數指標？","opts":["A. 藥物吸收之程度","B. 藥物分布之快慢","C. 藥物吸收之機制","D. 藥物之作用強度"],"ans":0,"exp":"生體可用率（bioavailability，BA）定義為藥物經非靜脈途徑給藥後，到達全身循環的藥物比例，主要以藥時曲線下面積（AUC）評估，反映的是藥物「吸收的程度」，即有多少比例的藥物被吸收進入體循環。","we":["","錯誤：藥物分布的快慢由分布容積（Vd）和組織血流量決定，是分布動力學的參數，不是生體可用率測定的指標。","錯誤：藥物的吸收機制（主動運輸或被動擴散）是藥物動力學的研究範疇，但生體可用率測定的是吸收程度（量的多少），而非機制（方式）。","錯誤：藥物作用強度以效價（potency，ED50）衡量，屬於藥效學（pharmacodynamics）範疇，與藥物動力學的生體可用率無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_011","year":2019,"roc_year":108,"session":"2","examNo":11,"q":"治療指數（therapeutic index）係用於評估下列何者？","opts":["A. 半衰期之長短","B. 估計給藥間隔","C. 藥物安全範圍","D. 藥物之藥效強度"],"ans":2,"exp":"治療指數（Therapeutic Index，TI）定義為TI = TD50 / ED50（或LD50 / ED50），用於評估藥物的安全範圍。TI愈大，安全範圍愈寬；TI愈小，治療窗愈窄，需更謹慎給藥。","we":["錯誤：半衰期（t½）由消除速率常數（ke）決定，反映藥物消除動力學，與治療指數（安全性評估）無關。","錯誤：給藥間隔主要由藥物半衰期和目標血中濃度範圍決定，不是治療指數的用途。","","錯誤：藥物效力強度以ED50（半數有效劑量）表示，是效價的指標；治療指數反映的是安全範圍（毒性劑量與有效劑量的比值），不等同於藥效強度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_012","year":2019,"roc_year":108,"session":"2","examNo":12,"q":"藥物由血漿中被清除之廓清率的單位為：","opts":["A. 公升","B. 公升／小時","C. 毫克•小時／公升","D. 為一比值，無使用之單位"],"ans":1,"exp":"廓清率（clearance）定義為單位時間內，血漿中藥物被完全清除的體積，故單位為「體積 / 時間」，即公升/小時（L/hr）或毫升/分鐘（mL/min）。","we":["錯誤：公升（L）為體積單位，代表的是分布容積（Vd），不是廓清率的單位；廓清率需包含時間維度。","","錯誤：毫克•小時/公升（mg•h/L）為藥時曲線下面積（AUC）的單位，代表藥物暴露量，不是廓清率的單位。","錯誤：廓清率具有明確單位（體積/時間），不是無因次的比值；無單位的比值概念適用於生體可用率（F）等參數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_013","year":2019,"roc_year":108,"session":"2","examNo":13,"q":"以肌肉注射投予藥物，下列何者為影響藥物吸收的主要因素？","opts":["A. 藥物之注射劑量","B. 藥物之酸鹼值","C. 注射部位之血流量","D. 藥物之注射速率"],"ans":2,"exp":"肌肉注射後，藥物吸收速率最主要取決於注射部位的血流量。血流量豐富的部位（如三角肌）吸收快，血流量少的部位（如臀大肌）吸收慢。運動、按摩、局部溫度等也可影響血流量進而影響吸收。","we":["錯誤：注射劑量影響進入體內的藥物總量，但不是決定吸收速率的主要因素；注射部位的血流量才是吸收速率的關鍵決定因素。","錯誤：藥物pH值影響其離子化程度（根據Henderson-Hasselbalch方程），對口服吸收較重要，但對肌肉注射而言，注射部位血流量的影響更為關鍵。","","錯誤：注射速率影響局部組織壓力和刺激感，對靜脈注射較重要，但肌肉注射時注射部位血流量才是影響吸收的主要因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_014","year":2019,"roc_year":108,"session":"2","examNo":14,"q":"一瓶全新且適當裝填的nitrous oxide（750 PSI），於使用全量的50%後，其接鋼瓶端壓力調節錶的讀數，應約\r 為多少PSI？","opts":["A. 750","B. 500","C. 250","D. 50"],"ans":0,"exp":"氧化亞氮（N2O）鋼瓶中以液態儲存。只要鋼瓶中仍有液態N2O存在，其蒸氣壓在固定溫度下維持恆定（約750 PSI，25°C時）。使用50%內容物後，液體仍存在，蒸氣壓不變，壓力計讀數仍約為750 PSI。只有當液體幾乎耗盡時，壓力才急速下降。","we":["","錯誤：氧化亞氮以液態儲存於鋼瓶，液態存在時蒸氣壓恆定。使用50%內容物後，液體仍未耗盡，壓力不會線性降至500 PSI。","錯誤：N2O液態儲存時蒸氣壓恆定，使用50%後壓力計讀數仍維持在約750 PSI，而非250 PSI；只有液體接近耗盡時壓力才急速下滑。","錯誤：壓力50 PSI代表鋼瓶幾乎已空；使用50%內容物時，液態N2O仍在，蒸氣壓仍維持約750 PSI，不會降至50 PSI。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_015","year":2019,"roc_year":108,"session":"2","examNo":15,"q":"Halothane hepatitis與下列何者有關？","opts":["A. 免疫反應","B. 特定器官親和性","C. 排泄速度","D. 血漿白蛋白結合量"],"ans":0,"exp":"Halothane hepatitis（氟烷性肝炎）為免疫介導性肝損傷。Halothane經肝臟氧化代謝後產生三氟乙醯基（TFA）代謝物，TFA與肝細胞蛋白質共價結合形成新抗原，引發免疫反應（IgG抗體介導），造成肝細胞壞死。此機制與藥物對肝臟的特定親和性、排泄速度或蛋白質結合量無直接關係。","we":["","錯誤：Halothane hepatitis的發生機制為免疫介導，非藥物對肝臟具有特定的化學親和性所造成的直接毒性（劑量相關毒性）。","錯誤：Halothane的排泄速度與肝炎發生無直接相關；反覆暴露後免疫致敏才是關鍵，不是排泄快慢的問題。","錯誤：Halothane hepatitis與血漿白蛋白結合量無關；其機制是代謝產物（三氟乙醯基）作為半抗原，引發免疫反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_016","year":2019,"roc_year":108,"session":"2","examNo":16,"q":"Morphine對多種動物具有縮瞳作用，但對下列何者造成散瞳作用？","opts":["A. 人","B. 犬","C. 猴","D. 貓"],"ans":3,"exp":"Morphine在大多數動物（人、犬、猴等）造成縮瞳（miosis），但在貓則例外地引起散瞳（mydriasis）。此物種差異與貓的中樞神經系統對嗎啡的反應不同有關，貓對嗎啡常表現出興奮而非鎮靜。","we":["錯誤：Morphine在人類作用於瞳孔縮小肌，造成縮瞳（miosis），不造成散瞳。","錯誤：Morphine在犬亦造成縮瞳效果，不造成散瞳；犬對嗎啡的反應以鎮靜和縮瞳為主。","錯誤：Morphine在猴造成縮瞳，與人類相似，不造成散瞳。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_017","year":2019,"roc_year":108,"session":"2","examNo":17,"q":"臨床上可使用下列那一藥物逆轉morphine之鎮靜及呼吸抑制作用？","opts":["A. atropine","B. naloxone","C. yohimbine","D. diazepam"],"ans":1,"exp":"Naloxone為純競爭性鴉片受體拮抗劑，對μ、κ、δ受體均有拮抗作用，可快速逆轉嗎啡（morphine）引起的鎮靜、呼吸抑制及鎮痛效果。靜脈注射後數分鐘內起效。","we":["錯誤：Atropine為蕈毒鹼（muscarinic）受體拮抗劑，可加快心跳及擴張支氣管，但無法拮抗鴉片受體，不能逆轉morphine的鎮靜與呼吸抑制。","","錯誤：Yohimbine為α2腎上腺素受體拮抗劑，用於逆轉xylazine等α2致效劑的鎮靜效果，無法拮抗鴉片受體，不能逆轉morphine。","錯誤：Diazepam為苯二氮平類（benzodiazepine）藥物，具中樞鎮靜效果，本身並非拮抗劑，無法逆轉morphine的鎮靜及呼吸抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_018","year":2019,"roc_year":108,"session":"2","examNo":18,"q":"下列何者是神經肌肉阻斷劑，且作用機制會先將神經肌肉接合處之尼古丁性受體去極化？","opts":["A. hexamethonium","B. decamethonium","C. hemicholinium","D. tubocurarine"],"ans":1,"exp":"Decamethonium為去極化型神經肌肉阻斷劑，作用機制類似succinylcholine，與神經肌肉接合處（NMJ）的N2型菸鹼受體結合後，引起持續去極化，使終板無法再次去極化，導致肌肉麻痺。","we":["錯誤：Hexamethonium為神經節阻斷劑，作用於自律神經節的N1型菸鹼受體，阻斷自律神經傳導，不作用於神經肌肉接合處，不引起去極化。","","錯誤：Hemicholinium（HC-3）抑制突觸前神經末梢的膽鹼（choline）再攝取，間接減少乙醯膽鹼（ACh）合成，不直接作用於終板受體引起去極化。","錯誤：Tubocurarine為非去極化型（競爭型）神經肌肉阻斷劑，競爭性拮抗N2受體，不引起初期去極化，而是直接阻斷受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_019","year":2019,"roc_year":108,"session":"2","examNo":19,"q":"下列何者有降血壓功效，但會降低動物體內正腎上腺素的濃度，干擾中樞與交感神經的功能？","opts":["A. hemicholinium","B. reserpine","C. glycopyrrolate","D. ephedrine"],"ans":1,"exp":"Reserpine的作用機制是不可逆地抑制VMAT（囊泡單胺轉運體），阻止正腎上腺素（NE）、多巴胺等單胺類神經傳導物質進入儲存囊泡，導致這些物質在神經末梢被氧化分解，使體內兒茶酚胺濃度顯著降低，進而降低交感神經張力，導致血壓下降。","we":["錯誤：Hemicholinium抑制突觸前膽鹼再攝取，影響ACh的合成，不直接影響正腎上腺素或兒茶酚胺的濃度。","","錯誤：Glycopyrrolate為抗膽鹼藥（muscarinic antagonist），阻斷M受體，不影響正腎上腺素的儲存或釋放，不改變兒茶酚胺濃度。","錯誤：Ephedrine為混合型擬交感神經藥，可促進NE從神經末梢釋放（間接作用），同時直接激活腎上腺素受體，會增加體內正腎上腺素濃度，與題意（降低濃度）相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_020","year":2019,"roc_year":108,"session":"2","examNo":20,"q":"下列何者在口服或注射後，影響周邊神經系統兒茶酚胺（catecholamine）濃度的作用最小？","opts":["A. phenylpropanolamine","B. phenylephrine","C. amphetamine","D. ephedrine"],"ans":1,"exp":"Phenylephrine為選擇性α1腎上腺素受體直接致效劑，直接與受體結合發揮作用，不促進神經末梢釋放正腎上腺素（NE），因此對周邊神經系統兒茶酚胺濃度影響最小。其他三者均具有間接作用（促進NE釋放），會改變兒茶酚胺濃度。","we":["錯誤：Phenylpropanolamine為間接擬交感神經藥，可促進神經末梢釋放正腎上腺素，顯著改變周邊神經系統兒茶酚胺濃度。","","錯誤：Amphetamine為強效間接擬交感神經藥，大量促進兒茶酚胺從囊泡釋放，並抑制再攝取，對兒茶酚胺濃度影響最大。","錯誤：Ephedrine為混合型擬交感神經藥，既直接激活受體，也促進NE從神經末梢釋放（間接作用），會影響兒茶酚胺濃度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_021","year":2019,"roc_year":108,"session":"2","examNo":21,"q":"下列何種腎上腺素性致效劑可活化α1、α2、β1及β2受體？","opts":["A. dobutamine","B. phenylephrine","C. isoproterenol","D. epinephrine"],"ans":3,"exp":"Epinephrine（腎上腺素）為廣效型腎上腺素性致效劑，可同時活化α1、α2、β1及β2四種腎上腺素受體，適用於過敏休克、心臟停止等緊急狀況。Dobutamine主要作用β1；Phenylephrine選擇性α1；Isoproterenol非選擇性β（β1+β2）。","we":["錯誤：Dobutamine主要作用於β1受體，增強心肌收縮力，對α受體及β2受體作用較弱，不能活化全部四種腎上腺素受體。","錯誤：Phenylephrine為選擇性α1受體直接致效劑，主要引起血管收縮和血壓上升，不活化β1或β2受體。","錯誤：Isoproterenol為非選擇性β致效劑，同時活化β1（心臟）和β2（支氣管、血管），不活化α受體。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_022","year":2019,"roc_year":108,"session":"2","examNo":22,"q":"肝素（heparin）之抗凝血作用是經由下列何種機制產生？","opts":["A. 抑制prothrombin","B. 抑制vitamin K","C. 抑制凝血第VIII因子","D. 活化antithrombin III"],"ans":3,"exp":"肝素（heparin）的抗凝血機制是與antithrombin III（AT III）結合，使AT III的構型改變，大幅增強其對凝血酶（thrombin/IIa）及第Xa因子的抑制能力，達到迅速抗凝效果。此為間接抗凝機制。","we":["錯誤：肝素不直接抑制prothrombin（凝血因子II），而是透過活化antithrombin III間接加速多種凝血因子的失活。","錯誤：抑制vitamin K的作用機制屬於warfarin類藥物（口服抗凝劑），可阻斷維生素K依賴性凝血因子（II、VII、IX、X）的合成，不是肝素的作用機制。","錯誤：肝素透過活化antithrombin III，主要抑制凝血因子Xa和IIa（thrombin），對第VIII因子的直接抑制並非其主要抗凝機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_023","year":2019,"roc_year":108,"session":"2","examNo":23,"q":"主要用於治療犬心室性心跳過速心律不整的藥物為何？","opts":["A. digitalis、dobutamine","B. lidocaine、phenytoin","C. digoxin、pimobendan","D. amrinone、atenolol"],"ans":1,"exp":"Lidocaine和phenytoin均屬於Class IB抗心律不整藥物，透過阻斷Na+通道（減少Na+內流），縮短動作電位時期，主要用於治療心室性心律不整，是犬心室性心跳過速的標準治療選擇。","we":["錯誤：Digitalis和dobutamine均為正性肌力藥物，用於心臟衰竭的支持治療，不是治療心室性心律不整的首選，且digitalis本身過量可誘發心室性心律不整。","","錯誤：Digoxin和pimobendan用於治療充血性心臟衰竭，改善心肌收縮力，不是治療心室性心跳過速的主要抗心律不整藥物。","錯誤：Amrinone為磷酸二酯酶抑制劑（正性肌力），atenolol為β阻斷劑（用於上心室性心律不整為主），此組合不是犬心室性心跳過速的標準治療選擇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_024","year":2019,"roc_year":108,"session":"2","examNo":24,"q":"下列何者能有效減少心臟的前負荷及後負荷？","opts":["A. hydralazine","B. amlodipine","C. nitroprusside","D. pimobendan"],"ans":2,"exp":"Nitroprusside（硝普鈉）可同時擴張動脈（降低後負荷）和靜脈（降低前負荷），是平衡型血管擴張劑，能有效減少心臟的前負荷（preload）及後負荷（afterload），適用於急性心臟衰竭和高血壓危象的緊急治療。","we":["錯誤：Hydralazine為純動脈擴張劑（小動脈），主要降低後負荷，對靜脈張力影響有限，不能有效降低前負荷。","錯誤：Amlodipine為長效二氫吡啶類鈣通道阻斷劑，主要擴張動脈降低後負荷，對靜脈和前負荷效果有限。","","錯誤：Pimobendan為磷酸二酯酶抑制劑兼鈣增敏劑，主要增強心肌收縮力（正性肌力），雖有輕微血管擴張作用，但不以同時有效降低前後負荷為主要特性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_025","year":2019,"roc_year":108,"session":"2","examNo":25,"q":"下列何種血中金屬離子濃度的變化會加深digoxin的毒性？","opts":["A. 高血鎂","B. 低血鈉","C. 低血鈣","D. 低血鉀"],"ans":3,"exp":"低血鉀（hypokalemia）會增加心肌細胞對digoxin的敏感性。Digoxin抑制Na+/K+-ATPase，低血鉀時細胞外K+濃度降低，減少K+與digoxin對Na/K-ATPase結合位的競爭，使digoxin更容易結合酶，毒性加深，可引發心律不整。","we":["錯誤：高血鎂不會加深digoxin毒性；反而低血鎂（hypomagnesemia）可能增加毒性風險，因鎂與鉀的電解質平衡相關。","錯誤：低血鈉與digoxin毒性增強無直接關係；主要危險因子是低血鉀，鉀離子直接競爭digoxin與Na/K-ATPase的結合。","錯誤：低血鈣不會增加digoxin毒性；反而高血鈣（hypercalcemia）可協同增加digoxin毒性，因兩者均影響心肌細胞內Ca2+濃度。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_026","year":2019,"roc_year":108,"session":"2","examNo":26,"q":"下列利尿劑何者作用於腎臟亨氏環上昇支厚部端（thick ascending limb of the loop of Henle）？","opts":["A. furosemide","B. chlorothiazide","C. amiloride","D. acetazolamide"],"ans":0,"exp":"Furosemide為環形利尿劑（loop diuretic），作用於腎臟亨利氏環（loop of Henle）上昇支厚部端，抑制Na+-K+-2Cl-共同運輸體（NKCC2），大量排出Na+、K+、Cl-及水分，是效力最強的利尿劑。","we":["","錯誤：Chlorothiazide為噻嗪類（thiazide）利尿劑，作用於遠曲小管（distal convoluted tubule），抑制Na+-Cl-共同運輸體（NCC），不作用於亨利氏環上昇支。","錯誤：Amiloride為保鉀利尿劑，作用於皮質集尿管（cortical collecting duct）上皮的鈉通道（ENaC），阻斷鈉重吸收，不在亨利氏環發揮作用。","錯誤：Acetazolamide為碳酸酐酶抑制劑，主要作用於近曲小管（proximal convoluted tubule），抑制HCO3-的重吸收，不在亨利氏環作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_027","year":2019,"roc_year":108,"session":"2","examNo":27,"q":"下列何種抗凝劑不適合用於保存輸血用之血液？","opts":["A. 3.5% sodium citrate","B. citrate-phosphate-dextrose","C. heparin","D. citrate-phosphate-dextrose-adenine"],"ans":2,"exp":"Heparin雖可防止凝血，但不適合用於保存輸血用血液的原因：肝素半衰期短，無法長期保持血液抗凝效果；且肝素輸注給受血者可能引起副作用。citrate類保存液可螯合Ca2+以抗凝，同時提供葡萄糖維持紅血球代謝，能長期保存血液。","we":["錯誤：3.5%檸檬酸鈉（sodium citrate）可螯合Ca2+離子，防止凝血，同時對紅血球毒性低，可用於輸血用血液的短期保存。","錯誤：CPD（citrate-phosphate-dextrose，檸檬酸鹽-磷酸鹽-葡萄糖）為標準血液保存液，可保存血液達21天，廣泛用於血液保存。","","錯誤：CPDA（citrate-phosphate-dextrose-adenine，含腺嘌呤的CPD）為改良型血液保存液，腺嘌呤可協助紅血球合成ATP延長存活，保存期可達35天，適合保存輸血用血液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_028","year":2019,"roc_year":108,"session":"2","examNo":28,"q":"下列何者為保鉀利尿劑（potassium-sparing diuretics）？","opts":["A. triamterene","B. theophylline","C. mannitol","D. chlorothiazide"],"ans":0,"exp":"Triamterene為保鉀利尿劑，作用於皮質集尿管，直接阻斷上皮Na+通道（ENaC），減少Na+重吸收的同時保留K+，不依賴醛固酮（與spironolactone作用位點相同但機制不同）。","we":["","錯誤：Theophylline為甲基黃嘌呤類藥物，透過抑制磷酸二酯酶（PDE）發揮支氣管擴張和輕度利尿作用，不屬於保鉀利尿劑，不能保存鉀離子。","錯誤：Mannitol為滲透性利尿劑，在近曲小管和亨利氏環增加滲透壓，促進水分排出，不具保鉀效果，大量使用可能導致電解質失衡。","錯誤：Chlorothiazide為噻嗪類利尿劑，促進Na+和Cl-排出的同時，因集尿管中Na+減少、K+-Na+交換減少，導致K+代償性排出增加，屬於排鉀利尿劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_029","year":2019,"roc_year":108,"session":"2","examNo":29,"q":"下列何種利尿劑為礦性皮質素醛固酮的競爭型拮抗劑？","opts":["A. chlorothiazide","B. bumetanide","C. acetazolamide","D. spironolactone"],"ans":3,"exp":"Spironolactone為醛固酮（aldosterone）的競爭型拮抗劑，作用於皮質集尿管的礦性皮質素受體（mineralocorticoid receptor），阻斷醛固酮的鈉留鉀排作用，達到保鉀利尿效果，常用於充血性心臟衰竭和肝硬化腹水。","we":["錯誤：Chlorothiazide為噻嗪類利尿劑，作用於遠曲小管Na+-Cl-共同運輸體，不拮抗醛固酮受體，不具有保鉀效果。","錯誤：Bumetanide與furosemide相似，為亨利氏環利尿劑，抑制NKCC2，不具有醛固酮受體拮抗作用，屬排鉀利尿劑。","錯誤：Acetazolamide為碳酸酐酶抑制劑，作用於近曲小管，抑制HCO3-重吸收，不拮抗礦性皮質素受體，不作用於醛固酮相關路徑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_030","year":2019,"roc_year":108,"session":"2","examNo":30,"q":"下列同一類藥物中，何者抑制肝臟微粒體代謝酵素的作用最強？","opts":["A. cimetidine","B. famotidine","C. nizatidine","D. ranitidine"],"ans":0,"exp":"在H2受體拮抗劑（H2 blockers）中，cimetidine對肝臟CYP450酶（尤其CYP1A2、CYP2C9、CYP2D6、CYP3A4）的抑制作用最強，可顯著影響多種藥物（如warfarin、theophylline、diazepam、phenytoin）的代謝，是臨床上重要的藥物交互作用來源。","we":["","錯誤：Famotidine對肝臟CYP450酶的抑制作用極弱，臨床上幾乎不造成因代謝酶抑制引起的藥物交互作用，是H2阻斷劑中影響最小者之一。","錯誤：Nizatidine對肝臟代謝酵素的抑制作用極小，臨床上不具顯著的CYP450抑制效果，不是同類藥物中作用最強者。","錯誤：Ranitidine雖有輕微CYP450抑制作用（主要是CYP2D6），但其效力遠不及cimetidine，相較之下臨床上的藥物交互作用較少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_031","year":2019,"roc_year":108,"session":"2","examNo":31,"q":"質子幫浦（proton pump）抑制劑omeprazole的主要作用標的為胃壁細胞，其原因為何？","opts":["A. 藥物於酸性環境下被活化，才具有活性","B. 藥物於鹼性環境下被活化，才具有活性","C. 藥物於中性環境下被活化，才具有活性","D. 藥物不會進入體循環，藥效局限於胃腸道"],"ans":0,"exp":"Omeprazole為前體藥（prodrug），以弱鹼性非活化形式存在於血液中。進入胃壁細胞的高度酸性分泌小管（pH<2）後，在酸性環境下轉化為活性磺醯胺（sulfenamide）形式，與H+/K+-ATPase（質子幫浦）上的半胱胺酸殘基形成不可逆共價鍵，選擇性且持久地抑制胃酸分泌。","we":["","錯誤：Omeprazole在鹼性或中性環境中以非活化前體藥形式穩定存在，必須進入胃壁細胞的強酸性分泌小管後才被活化，在鹼性環境下不會活化。","錯誤：Omeprazole在中性環境（pH 7）不被活化，其活化需要強酸環境（pH<4），此特性使其能選擇性地作用於胃壁細胞的酸性腔室。","錯誤：Omeprazole口服後在小腸被吸收（有腸溶衣保護避免胃酸破壞），進入體循環後再選擇性積聚於胃壁細胞酸性分泌小管中活化，並非不進入體循環的局部作用藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_032","year":2019,"roc_year":108,"session":"2","examNo":32,"q":"下列何者同時具有中樞性及周邊性止吐作用？","opts":["A. acepromazine","B. droperidol","C. metoclopramide","D. propantheline"],"ans":2,"exp":"Metoclopramide（甲氧氯普胺）具有雙重止吐機制：（1）中樞性：阻斷化學感應觸發區（CTZ）的多巴胺D2受體；（2）周邊性：促進上消化道胃腸蠕動（prokinetic），增加食道下括約肌張力、加速胃排空，阻斷腸道的多巴胺和5-HT3受體。","we":["錯誤：Acepromazine主要透過阻斷中樞多巴胺受體發揮止吐作用（中樞性），缺乏顯著的周邊性胃腸促動作用，不具備雙重止吐機制。","錯誤：Droperidol主要作用於中樞化學感應觸發區的多巴胺受體，不具備顯著的周邊性胃腸促動（prokinetic）作用，僅為中樞性止吐藥。","","錯誤：Propantheline為抗膽鹼藥（muscarinic antagonist），抑制消化道平滑肌蠕動，減少腸痙攣，不具中樞性止吐作用，作用與metoclopramide相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_033","year":2019,"roc_year":108,"session":"2","examNo":33,"q":"下列何者是loperamide不具成癮性的原因？","opts":["A. 不是鴉片受體致效劑（agonist）","B. 不會通過血腦障壁（blood-brain barrier）","C. 代謝快速，作用短暫","D. 對鴉片受體的作用太差"],"ans":1,"exp":"Loperamide確實是鴉片（opioid）受體致效劑，作用於腸道μ受體，抑制腸道蠕動和分泌，發揮強效止瀉效果。其不具成癮性的原因是：loperamide為P-glycoprotein（P-gp）的受質，P-gp將其從腦部主動排出，loperamide無法有效穿越血腦障壁，不能作用於中樞神經系統的鴉片受體，故不產生欣快感或成癮性。","we":["錯誤：Loperamide確實是鴉片受體致效劑（主要作用μ受體），在腸道局部發揮強效作用，但因無法進入中樞而不成癮，並非因為它不是鴉片受體致效劑。","","錯誤：Loperamide的作用持續時間實際上較長（半衰期約10-14小時），代謝並非特別快速；其不成癮的原因是無法穿越血腦障壁，而非作用時間短暫。","錯誤：Loperamide對腸道鴉片μ受體具有強效結合親和力，止瀉效果顯著；不成癮是因無法進入中樞神經系統，而非受體親和力差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_034","year":2019,"roc_year":108,"session":"2","examNo":34,"q":"有關apomorphine的敘述，下列何者正確？","opts":["A. 中樞性催吐劑","B. 貓用催吐劑","C. 經口投藥吸收快速","D. 不可注射給藥"],"ans":0,"exp":"Apomorphine為多巴胺D2受體致效劑，作用於腦幹的化學感應觸發區（CTZ），是中樞性催吐劑，常用於犬的緊急催吐（皮下注射或結膜囊投藥）。對貓催吐效果不可靠（貓常用xylazine代替）。口服後首渡效應顯著，吸收不穩定，不依賴口服給藥。","we":["","錯誤：Apomorphine對貓的催吐效果不可靠，貓的CTZ對多巴胺刺激反應較弱，臨床上貓催吐通常使用xylazine（α2致效劑）而非apomorphine。","錯誤：Apomorphine口服後因首渡效應明顯且吸收不穩定（在胃腸道易被氧化），通常採用皮下注射、靜脈注射或結膜囊給藥，不依賴口服途徑。","錯誤：Apomorphine可經皮下注射、靜脈注射或結膜囊投藥給犬，注射是常見且有效的給藥途徑，並非不可注射。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_035","year":2019,"roc_year":108,"session":"2","examNo":35,"q":"下列氣管擴張劑何者屬於β-選擇性致效劑（β-selective agonists）？","opts":["A. theophylline","B. isoetharine","C. isoproterenol","D. epinephrine"],"ans":1,"exp":"Isoetharine為選擇性β2腎上腺素受體致效劑（β2-selective agonist），可選擇性擴張支氣管平滑肌，對心臟β1受體影響較小，屬於β-選擇性氣管擴張劑。Theophylline為PDE抑制劑；isoproterenol非選擇性β（β1+β2）；epinephrine同時激活α和β受體。","we":["錯誤：Theophylline為甲基黃嘌呤類藥物，透過抑制磷酸二酯酶（PDE），阻止cAMP分解而擴張支氣管，不是直接作用β受體的致效劑，不屬於β-選擇性致效劑。","","錯誤：Isoproterenol為非選擇性β致效劑，同時強力活化心臟β1受體和支氣管β2受體，心跳加速等心臟副作用顯著，不具β2選擇性。","錯誤：Epinephrine同時活化α1、α2、β1和β2受體，是廣效型腎上腺素性藥物，不具β2選擇性，除擴張支氣管外還有顯著的心臟和血管作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_036","year":2019,"roc_year":108,"session":"2","examNo":36,"q":"下列何者為theophylline之作用機制？","opts":["A. 刺激M3 receptor引發血管擴張","B. 阻斷interleukin-1β和TNF-α的釋放","C. 增加平滑肌cyclic AMP的濃度","D. 增加周邊化學受體（chemoreceptor）的敏感性"],"ans":2,"exp":"Theophylline的主要作用機制為抑制磷酸二酯酶（phosphodiesterase，PDE），阻止cAMP（環狀腺苷一磷酸）分解，使支氣管平滑肌細胞內cAMP濃度升高，啟動蛋白激酶A（PKA），導致平滑肌舒張和支氣管擴張。","we":["錯誤：Theophylline不刺激M3蕈毒鹼受體；M3受體活化反而引起支氣管收縮和腺體分泌增加。Theophylline的支氣管擴張是透過PDE抑制增加cAMP，與M3受體無關。","錯誤：Theophylline雖有輕微的抗炎效果（可能透過腺苷受體拮抗），但阻斷IL-1β和TNF-α的釋放並非其主要支氣管擴張機制，主要機制仍是PDE抑制導致cAMP升高。","","錯誤：Theophylline雖可輕度刺激呼吸中樞（中樞性作用），增加對CO2的敏感性，但此並非其主要的支氣管擴張機制，主要是透過PDE抑制發揮作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_037","year":2019,"roc_year":108,"session":"2","examNo":37,"q":"當動物氣喘發作時，可使用下列何者來治療？","opts":["A. dopamine","B. codeine","C. histamine","D. clenbuterol"],"ans":3,"exp":"Clenbuterol為選擇性β2腎上腺素受體致效劑，可有效擴張支氣管平滑肌，是治療動物（尤其馬匹）氣喘和慢性阻塞性肺病（COPD/heaves）的重要藥物。其β2選擇性高，對心臟β1受體影響相對較小。","we":["錯誤：Dopamine主要作用於腎臟多巴胺受體（低劑量）、心臟β1受體（中劑量）及血管α受體（高劑量），不是治療氣喘的首選支氣管擴張劑，用於治療休克和心臟衰竭。","錯誤：Codeine為鴉片類藥物，具鎮咳（antitussive）效果，透過抑制咳嗽中樞發揮作用，但不能有效擴張支氣管，不用於治療氣喘發作。","錯誤：Histamine是引發過敏和氣喘反應的媒介物質，作用於H1受體可引起支氣管收縮和黏液分泌增加，給予histamine治療氣喘會使病情惡化，適得其反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_038","year":2019,"roc_year":108,"session":"2","examNo":38,"q":"下列何種NSAIDs不可使用於貓，因該藥物對其肝臟具強毒性？","opts":["A. paracetamol","B. phenylbutazone","C. flunixin","D. carprofen"],"ans":0,"exp":"Paracetamol（乙醯胺酚/acetaminophen）在貓體內因缺乏葡萄醛酸轉移酶（UGT，glucuronosyltransferase），無法有效結合代謝其毒性代謝物NAPQI（N-乙醯-p-苯醌亞胺）。NAPQI積累後造成高鐵血紅蛋白血症（methemoglobinemia）和嚴重肝細胞壞死，是對貓具強毒性且禁用的NSAIDs類藥物。","we":["","錯誤：Phenylbutazone對貓有毒性，但主要影響骨髓造血功能（骨髓抑制），不以強肝臟毒性為主要特徵；paracetamol對貓的肝毒性機制更為特異且致命。","錯誤：Flunixin meglumine對貓使用需謹慎（腎毒性、胃腸道副作用風險），但並非以對貓肝臟的強毒性為主要禁忌原因。","錯誤：Carprofen在貓的使用需謹慎評估，部分來源建議貓可短期低劑量使用，相較於paracetamol，其對貓的肝臟毒性風險較低，不是最危險者。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_039","year":2019,"roc_year":108,"session":"2","examNo":39,"q":"有關抗組織胺藥物分類之敘述，下列何者錯誤？","opts":["A. 第一代抗組織胺容易通過血腦障壁","B. 第二代抗組織胺不易通過血腦障壁","C. Chlorpheniramine屬於第一代抗組織胺","D. Cyproheptadine屬於第二代抗組織胺"],"ans":3,"exp":"本題問何者「錯誤」。Cyproheptadine屬於第一代抗組織胺藥物（具有H1受體和5-HT受體雙重拮抗作用），而非第二代。第二代抗組織胺（如cetirizine、loratadine、fexofenadine）不易通過血腦障壁、鎮靜副作用少；第一代（如diphenhydramine、chlorpheniramine、cyproheptadine）則易通過血腦障壁、具鎮靜效果。","we":["此為正確描述：第一代抗組織胺（如diphenhydramine、chlorpheniramine）脂溶性高，可通過血腦障壁，引起中樞鎮靜效果，不符合「錯誤」描述。","此為正確描述：第二代抗組織胺（如cetirizine、loratadine）親水性較高或為P-gp受質，不易通過血腦障壁，鎮靜副作用顯著減少，不符合「錯誤」描述。","此為正確描述：Chlorpheniramine確為第一代H1受體拮抗劑，脂溶性高，具有顯著鎮靜副作用，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_040","year":2019,"roc_year":108,"session":"2","examNo":40,"q":"下列何者是serotonin的拮抗劑？","opts":["A. ketanserin","B. captopril","C. ketoprofen","D. carbachol"],"ans":0,"exp":"Ketanserin為選擇性5-HT2（血清素）受體拮抗劑，同時也具有α1腎上腺素受體拮抗作用，可降低血壓，用於馬的蹄葉炎（laminitis）等疾病的輔助治療。Captopril為ACE抑制劑；Ketoprofen為NSAIDs；Carbachol為膽鹼性受體致效劑，均不拮抗血清素受體。","we":["","錯誤：Captopril為血管收縮素轉化酶（ACE）抑制劑，阻斷血管收縮素I轉化為血管收縮素II，用於降血壓和心臟衰竭，不具有血清素（5-HT）受體拮抗作用。","錯誤：Ketoprofen為非類固醇性消炎藥（NSAIDs），透過抑制環氧化酶（COX-1和COX-2）減少前列腺素合成，不具有血清素受體拮抗作用。","錯誤：Carbachol為膽鹼性受體（muscarinic和nicotinic）致效劑，可刺激平滑肌收縮和腺體分泌，不拮抗血清素受體，作用機制與serotonin無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_041","year":2019,"roc_year":108,"session":"2","examNo":41,"q":"Trilostane為下列何者的競爭性抑制劑？","opts":["A. cyclooxygenase","B. endopeptidase","C. 3β-hydroxysteroid dehydrogenase","D. cytochrome P450"],"ans":2,"exp":"Trilostane用於治療腎上腺皮質機能亢進症（Cushing's disease），競爭性抑制3β-hydroxysteroid dehydrogenase（3β-HSD），阻斷皮質醇（cortisol）的合成路徑。","we":["錯誤：Cyclooxygenase（COX）被NSAIDs（如ibuprofen）所抑制，非trilostane的作用標靶。","錯誤：內切蛋白酶（endopeptidase）分解蛋白質，非trilostane的作用標靶。","","錯誤：Cytochrome P450為代謝酵素，部分藥物（如ketoconazole）可抑制，但trilostane選擇性抑制3β-HSD。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_042","year":2019,"roc_year":108,"session":"2","examNo":42,"q":"下列何者之作用機制為D2受體之拮抗劑，可用於治療低乳量或無乳症？","opts":["A. domperidone","B. melengestrol","C. leuprolide","D. stanozolol"],"ans":0,"exp":"Domperidone為D2受體拮抗劑，阻斷多巴胺對泌乳素分泌的抑制，增加泌乳素（prolactin）分泌，用於馬的低乳量或無乳症促乳治療。","we":["","錯誤：Melengestrol為合成黃體素，用於牛隻的生殖管理，不具多巴胺受體拮抗或促乳效果。","錯誤：Leuprolide為GnRH類似物，用於調節生殖功能，不影響泌乳素分泌。","錯誤：Stanozolol為合成雄性素，具同化作用，不具促乳效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_043","year":2019,"roc_year":108,"session":"2","examNo":43,"q":"下列何者為一種合成的雄性素受體部分致效劑，用於治療與犬免疫相關之血小板減少症（thrombocytopenia）\r 及溶血性貧血？","opts":["A. ketoconazole","B. danazol","C. melengestrol","D. triamcinolone"],"ans":1,"exp":"Danazol為合成雄性素的部分致效劑，具免疫調節作用，可用於治療免疫性溶血性貧血（IMHA）及免疫相關血小板減少症（ITP）。","we":["錯誤：Ketoconazole為抗黴菌藥，具CYP450抑制作用，不用於治療免疫性血液疾病。","","錯誤：Melengestrol為合成黃體素，用於生殖控制，無免疫調節效果。","錯誤：Triamcinolone為糖皮質素，具廣效性免疫抑制作用，但非雄性素受體部分致效劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_044","year":2019,"roc_year":108,"session":"2","examNo":44,"q":"下列何者是甲狀腺荷爾蒙的成分？","opts":["A. 鐵","B. 碘","C. 銅","D. 鈣"],"ans":1,"exp":"甲狀腺荷爾蒙T3（三碘甲狀腺素）和T4（四碘甲狀腺素）的結構含有碘原子，碘是合成甲狀腺荷爾蒙不可缺少的元素。","we":["錯誤：鐵為血紅素的成分，不是甲狀腺荷爾蒙的結構元素。","","錯誤：銅參與多種酵素的催化功能，但不是甲狀腺荷爾蒙的組成成分。","錯誤：鈣在骨骼及細胞訊號傳遞中扮演角色，不是甲狀腺荷爾蒙的組成成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_045","year":2019,"roc_year":108,"session":"2","examNo":45,"q":"下列何者是維生素B12的成分？","opts":["A. 鈷","B. 鎂","C. 鋅","D. 鐵"],"ans":0,"exp":"維生素B12（cobalamin）的核心結構為咕啉環（corrin ring），其中心含有鈷（cobalt）原子，因此又稱為鈷胺素。","we":["","錯誤：鎂為葉綠素和多種酵素的輔因子，不是維生素B12的核心成分。","錯誤：鋅為多種酵素的輔因子，不存在於維生素B12結構中。","錯誤：鐵為血紅素的核心成分，維生素B12的核心元素為鈷，非鐵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_046","year":2019,"roc_year":108,"session":"2","examNo":46,"q":"動物缺乏下列何種營養素會出現巨紅血球性貧血及白血球減少？","opts":["A. folic acid","B. pantothenic acid","C. thiamine","D. vitamin K"],"ans":0,"exp":"葉酸（folic acid）缺乏時，DNA合成受阻，骨髓細胞無法正常分裂，導致大球性（巨紅血球性）貧血及白血球減少。","we":["","錯誤：泛酸（pantothenic acid，vitamin B5）缺乏主要影響能量代謝，不會造成巨紅血球性貧血。","錯誤：硫胺素（thiamine，vitamin B1）缺乏導致神經病變和心臟問題（如貓的心肌病），不造成巨紅血球性貧血。","錯誤：Vitamin K缺乏導致凝血功能障礙，不造成巨紅血球性貧血或白血球減少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_047","year":2019,"roc_year":108,"session":"2","examNo":47,"q":"下列何者為dirlotapide的主要臨床用途？","opts":["A. 胃腸促動劑","B. 胃酸分泌抑制劑","C. 抗肥胖劑","D. 黏膜保護劑"],"ans":2,"exp":"Dirlotapide為MTP（微粒三酸甘油酯轉移蛋白，microsomal triglyceride transfer protein）抑制劑，減少腸道脂質吸收及誘發飽足感訊號，用於犬的肥胖症治療。","we":["錯誤：胃腸促動劑（如metoclopramide）促進腸蠕動，dirlotapide的作用機制為抑制腸道脂質吸收，非促動作用。","錯誤：胃酸分泌抑制劑如omeprazole、ranitidine，dirlotapide不影響胃酸分泌。","","錯誤：黏膜保護劑（如sucralfate）保護胃腸黏膜，dirlotapide作用於腸道脂質吸收，非黏膜保護。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_048","year":2019,"roc_year":108,"session":"2","examNo":48,"q":"Amantadine可緩解慢性疼痛與神經性疼痛，主要作用於下列何種受體？","opts":["A. NMDA","B. Mu","C. Kappa","D. Delta"],"ans":0,"exp":"Amantadine為NMDA（N-methyl-D-aspartate）受體拮抗劑，可抑制中樞敏感化（central sensitization），用於緩解慢性神經性疼痛，常與NSAIDs或opioids合用。","we":["","錯誤：Mu受體為嗎啡等鴉片類藥物的主要作用標靶，amantadine不主要作用於mu受體。","錯誤：Kappa受體致效劑（如butorphanol）產生鎮痛及鎮靜作用，amantadine不主要作用於kappa受體。","錯誤：Delta受體相關於情緒調節，amantadine的鎮痛機制為NMDA受體拮抗，非delta受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_049","year":2019,"roc_year":108,"session":"2","examNo":49,"q":"下列何者為局部使用於治療疱疹病毒引起的角膜炎？","opts":["A. idoxuridne","B. zidovudine","C. oseltamivir","D. amantadine"],"ans":0,"exp":"Idoxuridine（IDU）為胸腺嘧啶核苷類似物，干擾病毒DNA合成，局部滴眼可治療貓和犬疱疹病毒性角膜炎（herpetic keratitis）。","we":["","錯誤：Zidovudine（AZT）為核苷類逆轉錄酶抑制劑，用於貓免疫缺陷病毒（FIV）感染，不局部用於角膜炎。","錯誤：Oseltamivir為神經胺酸酶抑制劑，用於流感病毒治療，不用於疱疹病毒角膜炎。","錯誤：Amantadine主要用於流感A型和慢性疼痛管理，不用於疱疹病毒角膜炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_050","year":2019,"roc_year":108,"session":"2","examNo":50,"q":"有關omega interferon對治療貓病毒感染的作用機制，下列何者正確？","opts":["A. 誘發產生抵抗病毒入侵的蛋白質","B. 抑制神經胺酸酶","C. 抑制病毒的M2蛋白","D. 抑制病毒DNA聚合酶的作用"],"ans":0,"exp":"Omega interferon（IFN-ω）與細胞受體結合後，誘導干擾素刺激基因（interferon-stimulated genes, ISGs）表現，產生抗病毒蛋白（如2-5A synthetase、Mx蛋白），干擾病毒複製。","we":["","錯誤：神經胺酸酶抑制劑（如oseltamivir）阻斷流感病毒釋放，不是interferon的作用機制。","錯誤：M2蛋白抑制劑（如amantadine）阻斷甲型流感病毒脫殼，不是interferon的機制。","錯誤：DNA聚合酶抑制劑（如cidofovir）阻斷疱疹病毒複製，不是omega interferon的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_051","year":2019,"roc_year":108,"session":"2","examNo":51,"q":"下列藥品的配對中，何者為兩種不同的藥品？","opts":["A. flavomycin與bambermycin","B. sulphasalazine與salicylazosulfapyridine","C. colistin與polymyxin B","D. adrenaline與epinephrine"],"ans":2,"exp":"Colistin（黏菌素）屬於polymyxin E，與polymyxin B雖同屬polymyxin類抗生素，但兩者為不同的藥品；而A、B、D選項均為同一藥品的不同命名。","we":["錯誤：Flavomycin和bambermycin為同一藥品的不同商品名，均為磷酸糖脂類抗生素。","錯誤：Sulphasalazine和salicylazosulfapyridine為同一藥品，均為磺胺柳氮嘌呤，用於發炎性腸病。","","錯誤：Adrenaline和epinephrine為同一物質的英國和美國命名，均指腎上腺素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_052","year":2019,"roc_year":108,"session":"2","examNo":52,"q":"細菌利用噬菌體將抗藥性基因轉移之過程稱為何？","opts":["A. 篩選作用（selection）","B. 轉形作用（transformation）","C. 接合作用（conjugation）","D. 傳導作用（transduction）"],"ans":3,"exp":"傳導作用（transduction）指細菌透過噬菌體（bacteriophage）作為媒介，將一個細菌的DNA（包括抗藥性基因）轉移至另一個細菌。","we":["錯誤：選擇作用（selection）指在抗生素壓力下，具抗藥性菌株被篩選存活，非基因轉移機制。","錯誤：轉形作用（transformation）指細菌直接從環境中攝取裸露DNA，不透過噬菌體。","錯誤：接合作用（conjugation）指細菌透過性纖毛（pilus）直接接觸傳遞質體，不需噬菌體。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_053","year":2019,"roc_year":108,"session":"2","examNo":53,"q":"下列那一種磺胺劑於尿中具有高濃度、易溶解且排除快速，可減少腎臟排出結晶尿之風險而被使用於治療小\r 動物之泌尿道感染症？","opts":["A. sulfamethazine","B. sulfaguanindine","C. sulfathiazole","D. sulfamethoxazole"],"ans":3,"exp":"Sulfamethoxazole在尿液中濃度高且溶解度佳，不易結晶，常與trimethoprim合用（SMZ-TMP）治療小動物泌尿道感染。","we":["錯誤：Sulfamethazine主要用於大動物及呼吸道感染，尿中溶解度非最佳，腎臟結晶風險較高。","錯誤：Sulfaguanidine在腸道幾乎不被吸收，僅用於腸道感染，不適用於全身性或泌尿道感染。","錯誤：Sulfathiazole在尿中溶解度低，容易結晶沉積，不適合泌尿道感染使用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_054","year":2019,"roc_year":108,"session":"2","examNo":54,"q":"抗微生物藥物fluoroquinolones使用於貓會造成下列那一組織急性、瀰漫性且不可回復之傷害？","opts":["A. 腎小管","B. 肝細胞","C. 視網膜","D. 骨髓造血機能"],"ans":2,"exp":"高劑量enrofloxacin等fluoroquinolones在貓可造成急性、瀰漫性且不可逆的視網膜退化（acute retinal degeneration），導致失明，因此貓使用enrofloxacin需嚴格控制劑量。","we":["錯誤：腎小管毒性較常見於aminoglycoside類抗生素，fluoroquinolones在貓的特定毒性為視網膜損傷。","錯誤：Fluoroquinolones不以肝細胞毒性著稱；chloramphenicol等才對貓肝功能有較大影響。","","錯誤：骨髓造血毒性為氯黴素（chloramphenicol）的特殊副作用，不是fluoroquinolones在貓的主要毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_055","year":2019,"roc_year":108,"session":"2","examNo":55,"q":"下列何種tetracyclines對於泌尿道感染治療並不具顯著療效？","opts":["A. chlortetracycline","B. doxycycline","C. oxytetracycline","D. tetracycline"],"ans":1,"exp":"Doxycycline與其他tetracyclines不同，主要經膽汁和糞便排出，腎臟排泄量少，因此尿液中藥物濃度低，對泌尿道感染治療效果較差，反而適用於腎功能不全患者。","we":["錯誤：Chlortetracycline可在尿液中達到治療濃度，可用於某些泌尿道感染。","","錯誤：Oxytetracycline大部分以活性形式由腎臟排泄，尿液濃度高，可用於泌尿道感染。","錯誤：Tetracycline由腎臟排泄，尿液中濃度足夠，可用於泌尿道感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_056","year":2019,"roc_year":108,"session":"2","examNo":56,"q":"下列何者對大動物披衣菌和原蟲感染的治療效果較佳？","opts":["A. neomycin","B. kanamycin","C. plazomicin","D. tetracycline"],"ans":3,"exp":"Tetracycline為廣效性抗生素，可進入細胞內，對細胞內寄生的披衣菌（Chlamydia）及部分原蟲有效，是大動物相關感染的常用藥物。","we":["錯誤：Neomycin為aminoglycoside，主要用於腸道感染或局部給藥，對披衣菌和原蟲效果差。","錯誤：Kanamycin為aminoglycoside，主要對革蘭氏陰性菌有效，對披衣菌和原蟲無效。","錯誤：Plazomicin為新型aminoglycoside，主要用於多重抗藥性革蘭氏陰性菌，不用於大動物披衣菌或原蟲感染。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_057","year":2019,"roc_year":108,"session":"2","examNo":57,"q":"下列何者對Rickettsia無治療效果？","opts":["A. chloramphenicol","B. glycylcycline","C. kanamycin","D. tetracycline"],"ans":2,"exp":"Kanamycin為aminoglycoside類抗生素，無法穿透細胞膜進入細胞內，而Rickettsia為強制性細胞內寄生菌，因此kanamycin對立克次氏體感染無治療效果。","we":["錯誤：Chloramphenicol可穿入細胞，有效治療立克次氏體感染（Rickettsia），具有良好療效。","錯誤：Glycylcycline（如tigecycline）類似tetracycline可進入細胞，對立克次氏體有效。","","錯誤：Tetracycline為治療立克次氏體感染的首選藥物之一，可穿入細胞抑制蛋白質合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_058","year":2019,"roc_year":108,"session":"2","examNo":58,"q":"下列何者不屬於烷基化類（alkylating agents）抗腫瘤藥物？","opts":["A. dacarbazine","B. ifosfamide","C. lomustine","D. gemcitabine"],"ans":3,"exp":"Gemcitabine為核苷類似物（antimetabolite），干擾DNA合成，屬於抗代謝類藥物，不屬於烷基化劑（alkylating agents）。Dacarbazine、ifosfamide、lomustine均為烷基化劑。","we":["錯誤：Dacarbazine為非典型烷基化劑，可烷化DNA，屬於alkylating agents類。","錯誤：Ifosfamide為氮芥類烷基化劑，結構類似cyclophosphamide，屬於alkylating agents。","錯誤：Lomustine（CCNU）為nitrosourea類烷基化劑，可穿越血腦障壁，常用於腦腫瘤和肥大細胞瘤。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_059","year":2019,"roc_year":108,"session":"2","examNo":59,"q":"競爭性的抑制腫瘤細胞酪胺酸激酶（tyrosine kinase）與ATP結合，阻斷激酶磷酸化作用及信息傳遞路徑的藥\r 物為：","opts":["A. hydroxyurea","B. busulfan","C. toceranib","D. paclitaxel"],"ans":2,"exp":"Toceranib（Palladia）為酪胺酸激酶抑制劑（TKI），競爭性抑制腫瘤細胞酪胺酸激酶與ATP的結合，阻斷細胞增殖訊號，用於犬肥大細胞瘤（MCT）治療。","we":["錯誤：Hydroxyurea抑制核糖核苷酸還原酶，阻礙DNA合成，不抑制酪胺酸激酶。","錯誤：Busulfan為烷基化劑，直接修飾DNA，不競爭性抑制酪胺酸激酶。","","錯誤：Paclitaxel（taxol）穩定微管，抑制細胞有絲分裂，不作用於酪胺酸激酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_060","year":2019,"roc_year":108,"session":"2","examNo":60,"q":"下列抗腫瘤藥物，何者不具有抑制topoisomerase-II活性的作用？","opts":["A. mitoxantrone","B. etoposide","C. doxorubicin","D. cyclophosphamide."],"ans":3,"exp":"Cyclophosphamide為烷基化劑（alkylating agent），直接與DNA形成交叉連結，不抑制topoisomerase-II。Mitoxantrone、etoposide、doxorubicin均具抑制topoisomerase-II的活性。","we":["錯誤：Mitoxantrone插入DNA並抑制topoisomerase-II，阻礙DNA複製與轉錄。","錯誤：Etoposide（VP-16）為topoisomerase-II抑制劑，穩定酶-DNA複合物，導致DNA斷裂。","錯誤：Doxorubicin（adriamycin）嵌入DNA並抑制topoisomerase-II，具有廣效抗腫瘤活性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_061","year":2019,"roc_year":108,"session":"2","examNo":61,"q":"下列何種藥物為鮭魚罹患細菌性腎病時之首選治療藥物？","opts":["A. erythromycin","B. kitasamycin","C. nalidixic acid","D. neomycin"],"ans":0,"exp":"Erythromycin為大環內酯類抗生素，是治療鮭魚細菌性腎病（BKD，由Renibacterium salmoninarum引起）的首選藥物，可混入飼料口服給藥。","we":["","錯誤：Kitasamycin（北里黴素）為大環內酯類抗生素，有些水產應用，但不是BKD的首選治療藥物。","錯誤：Nalidixic acid為舊型喹諾酮，對BKD的病原菌（Renibacterium salmoninarum）效果不佳，不是首選。","錯誤：Neomycin口服不吸收，主要局部使用，對系統性BKD感染無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_062","year":2019,"roc_year":108,"session":"2","examNo":62,"q":"水產動物用藥品中的oxytetracycline之作用機制為何？","opts":["A. 抑制細菌蛋白質合成","B. 抑制細菌葉酸合成","C. 抑制細胞壁合成","D. 抑制DNA合成"],"ans":0,"exp":"Oxytetracycline（tetracycline類）結合細菌30S核糖體亞單位，阻斷aminoacyl-tRNA進入A位，抑制蛋白質合成，為水產動物常用廣效性抗生素。","we":["","錯誤：抑制葉酸合成為磺胺劑（sulfonamides）和trimethoprim的作用機制，非tetracycline。","錯誤：抑制細胞壁合成為β-lactam類（青黴素、頭孢子素）和vancomycin的機制，非tetracycline。","錯誤：抑制DNA合成為fluoroquinolones的機制（透過抑制DNA gyrase），非tetracycline。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_063","year":2019,"roc_year":108,"session":"2","examNo":63,"q":"在馬、豬與山羊等動物經注射投予下列何種抗菌劑後，易見心臟收縮力下降的副作用？","opts":["A. amoxicillin","B. cephalexin","C. danofloxacin","D. tilmicosin"],"ans":3,"exp":"Tilmicosin（大環內酯類抗生素）在馬、豬與山羊等非牛科動物注射後，易造成嚴重心臟毒性（心臟收縮力下降、心律不整），甚至引起死亡，使用時須特別謹慎。","we":["錯誤：Amoxicillin為β-lactam抗生素，心臟毒性罕見，不以心臟毒性著稱。","錯誤：Cephalexin為第一代頭孢子素，安全範圍廣，無顯著心臟收縮抑制作用。","錯誤：Danofloxacin為fluoroquinolone，對大動物有良好安全性，心臟毒性非其特徵性副作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_064","year":2019,"roc_year":108,"session":"2","examNo":64,"q":"有關glutaraldehyde之敘述，下列何者正確？","opts":["A. Glutaraldehyde即為10% formaldehyde的乙醇緩衝溶液","B. 在酸性環境之下，才能具有良好的殺孢子能力","C. 在蛋白質存在時仍見活性，主因其表面張力低","D. 在100 ppm的低濃度之下，不會對眼睛產生刺激性"],"ans":2,"exp":"Glutaraldehyde（戊二醛）在有機物（蛋白質）存在時仍能維持消毒活性，主因其表面張力低，穿透力強，能與蛋白質的胺基共價結合。","we":["錯誤：Glutaraldehyde是雙醛類消毒劑，與甲醛（formaldehyde）為不同化學物質，非formaldehyde乙醇緩衝溶液。","錯誤：Glutaraldehyde在鹼性環境（pH 7.5-8.5，即鹼化glutaraldehyde）才具有最佳殺孢子能力，酸性環境效果較差。","","錯誤：Glutaraldehyde即使在低濃度（如0.1-1 ppm）也可刺激眼睛及呼吸道，屬於強刺激性消毒劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_065","year":2019,"roc_year":108,"session":"2","examNo":65,"q":"下列何者在其結構式中不含有鹵素的存在？","opts":["A. florfenicol","B. clindamycin","C. flumequine","D. bacitracin"],"ans":3,"exp":"Bacitracin為多胜肽類（polypeptide）抗生素，結構中不含鹵素（fluorine、chlorine等）。Florfenicol含F和Cl、clindamycin含Cl、flumequine含F。","we":["錯誤：Florfenicol含有氟（F）和氯（Cl）兩種鹵素，是氯黴素的氟化衍生物。","錯誤：Clindamycin結構含有氯（Cl），為lincosamide類抗生素。","錯誤：Flumequine為喹諾酮類，結構含有氟（F）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_066","year":2019,"roc_year":108,"session":"2","examNo":66,"q":"下列何者為併用三種磺胺劑（triple-sulfas）的主要目的？","opts":["A. 增加血中濃度減少投藥次數","B. 擴大抗菌範圍並增強抗菌效力","C. 降低個別藥物劑量減少尿道結石生成","D. 縮短藥物治療期間"],"ans":2,"exp":"使用三種磺胺劑（triple-sulfas）組合的主要目的是：各別磺胺劑各自的溶解度獨立計算，在相同總抗菌濃度下，每種磺胺劑劑量降低，降低尿液中單一藥物濃度，從而減少結晶尿（crystalluria）及尿道結石的風險。","we":["錯誤：使用多種磺胺劑組合的目的非增加血中總濃度，而是降低個別藥物劑量，降低結晶尿風險。","錯誤：三種磺胺劑通常具有相同的抗菌範圍，組合目的非擴大抗菌範圍，而是降低腎毒性。","","錯誤：三磺胺組合不能縮短治療期間；磺胺劑的療程仍依感染情況而定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_067","year":2019,"roc_year":108,"session":"2","examNo":67,"q":"70%（W/V）乙醇溶液對下列何者的防腐殺菌能力最差？","opts":["A. gram-positive bacillus","B. gram-negative bacillus","C. tubercle bacillus","D. bacterial spores"],"ans":3,"exp":"70%乙醇對細菌孢子（bacterial spores）幾乎無效，因孢子具有高度抵抗力的外殼（cortex、spore coat）保護，乙醇無法穿透消滅孢子。","we":["錯誤：70%乙醇對革蘭氏陽性芽孢桿菌（非孢子型）有良好殺菌效果，非殺菌能力最差的對象。","錯誤：70%乙醇對革蘭氏陰性桿菌效果良好，能破壞外膜脂質，使細胞膜崩解。","錯誤：70%乙醇對結核桿菌（Mycobacterium tuberculosis）有效，因其含有大量脂質被乙醇溶解。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_068","year":2019,"roc_year":108,"session":"2","examNo":68,"q":"下列何種藥物對革蘭氏陰性菌的抗菌能力最好？","opts":["A. cephalexin","B. cephalothin","C. cefadroxil","D. ceftiofur"],"ans":3,"exp":"Ceftiofur為第三代頭孢子素，對革蘭氏陰性菌（包括Pasteurella、Mannheimia、Haemophilus等）具有優異的抗菌活性，廣泛用於大動物呼吸道感染。","we":["錯誤：Cephalexin為第一代頭孢子素，主要對革蘭氏陽性菌有效，對革蘭氏陰性菌效果有限。","錯誤：Cephalothin為第一代頭孢子素，對革蘭氏陰性菌的抗菌活性較弱。","錯誤：Cefadroxil為第一代頭孢子素，對革蘭氏陰性菌的覆蓋範圍不及第三代頭孢子素。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_069","year":2019,"roc_year":108,"session":"2","examNo":69,"q":"Amitraz對下列何種動物為使用禁忌，常造成致命性結腸阻塞？","opts":["A. 牛","B. 豬","C. 犬","D. 馬"],"ans":3,"exp":"Amitraz（雙甲脒）為α2-adrenergic receptor促效劑兼單胺氧化酶抑制劑，在馬使用後可造成致命性大腸阻塞（large colon impaction），為馬的使用禁忌。","we":["錯誤：Amitraz可用於牛的蜱蟲防治，不以致命性腸阻塞為主要禁忌。","錯誤：Amitraz在豬也需謹慎，但致命性結腸阻塞主要見於馬，非豬的特定禁忌。","錯誤：Amitraz在犬可安全使用（如治療蠕形蟎），為犬科動物的核准用藥，不造成結腸阻塞。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_070","year":2019,"roc_year":108,"session":"2","examNo":70,"q":"下列何者為脂溶性，進食後藉由增加膽汁分泌可能會增加胃腸道吸收此藥，用於鳥類全身性真菌症？","opts":["A. nystatin","B. silver sulfadiazine","C. terbinafine","D. chlorhexidine"],"ans":2,"exp":"Terbinafine為allylamine類抗真菌藥，脂溶性高，進食後膽汁分泌增加可促進其吸收，可用於鳥類系統性真菌感染（如麴黴菌病）的治療。","we":["錯誤：Nystatin口服後幾乎不被吸收，僅用於消化道局部黴菌感染，不能治療全身性真菌症。","錯誤：Silver sulfadiazine為局部抗菌藥，用於燒傷創面，不用於系統性黴菌感染。","","錯誤：Chlorhexidine為廣效性消毒劑，僅局部使用，不具系統性抗真菌療效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_071","year":2019,"roc_year":108,"session":"2","examNo":71,"q":"下列何者可藉由抑制核分裂有效對抗馬原蟲（Sarcocystis neurona）性腦脊髓炎之裂殖體？","opts":["A. nicarbazin","B. ponazuril","C. nitazoxanide","D. imidocarb"],"ans":1,"exp":"Ponazuril為triazinetrione類抗原蟲藥，抑制核分裂，有效對抗馬原蟲性腦脊髓炎（EPM）病原Sarcocystis neurona的裂殖體，為EPM的核准治療藥物。","we":["錯誤：Nicarbazin為抗球蟲藥，主要用於家禽，不用於治療馬Sarcocystis感染。","","錯誤：Nitazoxanide用於治療隱孢子蟲和梨形鞭毛蟲，對馬原蟲性腦脊髓炎療效不如ponazuril確定。","錯誤：Imidocarb為抗原蟲藥，主要用於治療梨形蟲病（babesiosis），不是馬EPM的首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_072","year":2019,"roc_year":108,"session":"2","examNo":72,"q":"下列何者造成絛蟲的麻痺，也造成其不可逆地單一局部空泡化及表面包被的崩解？","opts":["A. ivermectin","B. riclabendazole","C. praziquantel","D. pyrantel"],"ans":2,"exp":"Praziquantel增加絛蟲細胞膜對Ca²⁺的通透性，造成肌肉強直性麻痺，並引起蟲體表面（tegument）不可逆的空泡化及崩解，使絛蟲失去附著能力並被免疫系統清除。","we":["錯誤：Ivermectin作用於線蟲和節肢動物的GABA/麩胺酸氯離子通道，主要用於線蟲和外寄生蟲，對絛蟲無效。","錯誤：Ricobendazole（albendazole砜化物）用於肝片吸蟲，不以絛蟲空泡化機制著稱。","","錯誤：Pyrantel為去極化神經肌肉阻斷劑，造成線蟲痙攣性麻痺，對絛蟲無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_073","year":2019,"roc_year":108,"session":"2","examNo":73,"q":"下列何者抑制醣解路徑中的3-磷酸甘油酸激酶（3-phosphoglycerate kinase）及磷酸甘油酸變位酶\r （phosphoglyceromutase），使吸蟲之代謝能源喪失？","opts":["A. epsiprantel","B. levamisole","C. semduramicin","D. clorsulon"],"ans":3,"exp":"Clorsulon為有機磷酸鹽類抗吸蟲藥，選擇性抑制肝片吸蟲（Fasciola hepatica）糖解路徑中的3-磷酸甘油酸激酶（3-phosphoglycerate kinase）及磷酸甘油酸變位酶（phosphoglycerate mutase），干擾吸蟲能量代謝。","we":["錯誤：Epsiprantel為praziquantel類似物，用於絛蟲治療，不抑制糖解酵素。","錯誤：Levamisole作用於線蟲的煙鹼型受體，使肌肉持續收縮（痙攣性麻痺），不抑制糖解酵素。","錯誤：Semduramicin為聚醚類離子載體（ionophore）抗球蟲藥，不作用於糖解路徑酵素。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_074","year":2019,"roc_year":108,"session":"2","examNo":74,"q":"下列何者為一種使線蟲肌肉過極化的GABA受體致效劑，造成蟲體鬆弛性麻痺，且僅具有限的作用範圍但能\r 有效對付所有動物種的蛔蟲及結節蟲？","opts":["A. emodepside","B. albendazole","C. piperazine","D. pyrantel"],"ans":2,"exp":"Piperazine為GABA受體致效劑，使線蟲肌肉超極化（過極化）→鬆弛性麻痺（flaccid paralysis）；作用範圍較窄（主要對蛔蟲有效），但對各種動物（犬、貓、豬、馬等）均可使用。","we":["錯誤：Emodepside作用於SLO-1鉀離子通道及nematode-specific受體，造成肌肉弛緩，機制與GABA不同。","錯誤：Albendazole為苯并咪唑類，抑制微管蛋白（tubulin）聚合，影響線蟲能量代謝，不作用於GABA受體。","","錯誤：Pyrantel為去極化神經肌肉阻斷劑（ACh受體致效劑），造成痙攣性麻痺（spastic paralysis），與piperazine機制相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_075","year":2019,"roc_year":108,"session":"2","examNo":75,"q":"下列藥物中，何者不使用於治療梨形鞭毛蟲症（giardiasis）？","opts":["A. albendazole","B. metronidazole","C. clotrimazole","D. fenbendazole"],"ans":2,"exp":"Clotrimazole為azole類抗真菌藥，用於皮膚和黏膜黴菌感染（如念珠菌、皮膚真菌），不具抗原蟲活性，不用於梨形鞭毛蟲症（giardiasis）治療。","we":["錯誤：Albendazole可用於治療梨形鞭毛蟲症，抑制β-tubulin聚合干擾原蟲能量代謝。","錯誤：Metronidazole為治療梨形鞭毛蟲症（giardiasis）的首選藥物，可干擾原蟲DNA合成。","","錯誤：Fenbendazole（苯并咪唑類）可有效治療梨形鞭毛蟲症，常用於小動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_076","year":2019,"roc_year":108,"session":"2","examNo":76,"q":"下列何者為trichlorfon之藥理機制？","opts":["A. 抑制acetylcholinesterase之作用","B. 抑制glutamate之合成","C. 作用在絛蟲神經肌肉受體，使之鬆弛","D. 作用在絛蟲神經肌肉受體，使之興奮"],"ans":0,"exp":"Trichlorfon（蛆磷）為有機磷類殺蟲劑，不可逆性抑制乙醯膽鹼酯酶（acetylcholinesterase），造成乙醯膽鹼（ACh）在神經突觸大量積聚，引起SLUD等膽鹼激性症狀。","we":["","錯誤：抑制麩胺酸合成不是有機磷的作用機制；trichlorfon抑制acetylcholinesterase。","錯誤：Trichlorfon不特異性作用於絛蟲神經肌肉接合處使之鬆弛，其主要機制為抑制acetylcholinesterase。","錯誤：Trichlorfon透過抑制acetylcholinesterase使ACh積聚於突觸，造成神經肌肉持續興奮，非直接作用於絛蟲NMJ。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_077","year":2019,"roc_year":108,"session":"2","examNo":77,"q":"砷急性中毒可使用下列何者作為解毒劑？","opts":["A. dimercaprol","B. pralidoxime","C. methylene blue","D. deferoxamine"],"ans":0,"exp":"Dimercaprol（BAL，British Anti-Lewisite）為巰基螯合劑，可與砷、汞、鉛等重金屬形成穩定的螯合物，促進腎臟排泄，用於急性砷中毒的解毒治療。","we":["","錯誤：Pralidoxime（PAM）用於有機磷中毒，使被抑制的acetylcholinesterase再活化，不用於砷中毒解毒。","錯誤：Methylene blue用於高鐵血紅素血症（如nitrite中毒）的治療，不用於砷中毒。","錯誤：Deferoxamine為鐵螯合劑，用於急性鐵中毒，不用於砷中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_078","year":2019,"roc_year":108,"session":"2","examNo":78,"q":"可可豆中造成犬隻中毒的主要成分為何？","opts":["A. hydroquinone","B. theobromine","C. nicotine","D. coumarin"],"ans":1,"exp":"可可豆中含有大量theobromine（甲基黃嘌呤），犬因代謝theobromine的速度緩慢，可導致theobromine積聚，抑制磷酸二酯酶，引起心律不整、中樞神經興奮等毒性症狀。","we":["錯誤：Hydroquinone為酚類化合物，存在於某些植物，但非可可豆中導致犬中毒的主成分。","","錯誤：Nicotine存在於菸草中，不是可可豆的主要有毒成分。","錯誤：Coumarin（香豆素）存在於某些植物，可引起出血，但非可可豆中的主要有毒成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_079","year":2019,"roc_year":108,"session":"2","examNo":79,"q":"有關犬貓聚乙醛（metaldehyde）中毒之敘述，下列何者錯誤？","opts":["A. 腦中血清素（serotonin）及GABA的濃度下降","B. 可見過度流涎、嘔吐、沉鬱及共濟失調等中毒症狀","C. 輸液療法改善鹼血症（alkalosis）與脫水","D. 投予diazepam使動物鎮靜及控制癲癇"],"ans":2,"exp":"Metaldehyde中毒造成代謝性酸血症（metabolic acidosis）及脫水，輸液療法的目標是改善酸血症（acidosis）和脫水，而非鹼血症（alkalosis）。選項C描述「改善鹼血症」為錯誤。","we":["此為正確描述：Metaldehyde中毒確實導致腦中血清素及GABA濃度下降，引起過度興奮，不符合題目問的「錯誤」描述。","此為正確描述：Metaldehyde中毒的臨床症狀包括流涎、嘔吐、沉鬱及共濟失調，不符合題目問的「錯誤」描述。","","此為正確描述：Diazepam可用於控制metaldehyde中毒引起的癲癇和肌肉震顫，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_藥理_1082_080","year":2019,"roc_year":108,"session":"2","examNo":80,"q":"下列何者為河豚毒素（tetrodotoxin）的中毒機制？","opts":["A. 活化acetylcholine之受體","B. 拮抗acetylcholine之受體","C. 拮抗GABA之受體","D. 阻斷鈉離子通道"],"ans":3,"exp":"河豚毒素（tetrodotoxin，TTX）選擇性阻斷電位依賴性鈉離子通道（voltage-gated Na⁺ channels），使神經和肌肉細胞無法產生動作電位，導致肌肉麻痺、呼吸衰竭。","we":["錯誤：活化乙醯膽鹼受體為膽鹼藥（如carbachol）的機制，tetrodotoxin不活化此受體。","錯誤：拮抗乙醯膽鹼受體為抗膽鹼藥（如atropine）的機制，tetrodotoxin的毒性機制為阻斷鈉離子通道。","錯誤：拮抗GABA受體（如bicuculline）造成癲癇發作，tetrodotoxin不拮抗GABA受體。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_001","year":2020,"roc_year":109,"session":"1","examNo":1,"q":"若比較乳汁／血漿中藥品濃度的比值，下列何種藥品的比值最大？","opts":["A. cloxacillin","B. cephaloridine","C. erythromycin","D. penicillin G"],"ans":2,"exp":"erythromycin為鹼性藥物（pKa約8.8），乳汁pH約6.5-6.8，較血漿（pH 7.4）偏酸。鹼性藥物在較酸的乳汁中解離度增加（ion trapping），導致藥物被困於乳汁中無法回滲，乳汁／血漿濃度比可達4-10倍。cloxacillin、penicillin G及cephaloridine均為酸性藥物，在偏鹼的血漿中較容易滯留，乳汁／血漿比值低。","we":["錯誤：cloxacillin為酸性藥物，在偏酸的乳汁中解離度低，傾向留在血漿中，乳汁／血漿比值小。","錯誤：cephaloridine為酸性頭孢菌素，在偏酸性乳汁中溶解度雖高但不會發生ion trapping，乳汁／血漿比值較低。","","錯誤：penicillin G為酸性藥物（β-lactam類），在偏酸的乳汁中解離度低，不易被困於乳汁，乳汁／血漿比值低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_002","year":2020,"roc_year":109,"session":"1","examNo":2,"q":"下列藥品之代謝產物，何者不具有活性？","opts":["A. oxyphenbutazone","B. 4-hydroxypropranolol","C. phenothiazine sulfoxide","D. canrenone"],"ans":2,"exp":"phenothiazine sulfoxide為phenothiazine的代謝產物，為「無活性」代謝物，不具有鎮靜或抗精神病活性。oxyphenbutazone（phenylbutazone活性代謝物）、4-hydroxypropranolol（propranolol活性代謝物，仍具β-阻斷活性）、canrenone（spironolactone活性代謝物）均具有藥理活性。","we":["錯誤：oxyphenbutazone是phenylbutazone的活性代謝物，具有抗發炎活性，並非此題所求的「無活性代謝物」。","錯誤：4-hydroxypropranolol是propranolol的活性代謝物，仍具有β-腎上腺素阻斷活性，並非無活性代謝物。","","錯誤：canrenone是spironolactone的活性代謝物，具有醛固酮拮抗活性，並非無活性代謝物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_003","year":2020,"roc_year":109,"session":"1","examNo":3,"q":"下列何種藥品對肝臟 cytochrome P-450具有抑制作用？","opts":["A. lindane","B. cimetidine","C. griseofulvin","D. phenobarbital"],"ans":1,"exp":"cimetidine（H2受體阻斷劑）為cytochrome P-450的「抑制劑」，與P-450酵素的含鐵血基質結合，抑制其活性，減慢許多藥物的代謝速率。lindane（農藥）、griseofulvin（抗黴菌藥）、phenobarbital（巴比妥酸鹽）均為CYP酵素誘導劑，可增加P-450表現量，加速藥物代謝。","we":["錯誤：lindane（六氯苯）是cytochrome P-450的「誘導劑」，會增加肝臟P-450的表現，加速藥物代謝，而非抑制。","","錯誤：griseofulvin是cytochrome P-450的「誘導劑」，長期使用可使P-450活性增加，加速多種藥物代謝，而非抑制。","錯誤：phenobarbital是最典型的cytochrome P-450「誘導劑」，可顯著增加肝臟P-450酵素含量，加速藥物代謝，而非抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_004","year":2020,"roc_year":109,"session":"1","examNo":4,"q":"下列何種藥品的作用和受體（receptors）無關？","opts":["A. clenbuterol","B. morphine","C. biphosphonate","D. acepromazine"],"ans":2,"exp":"bisphosphonate（雙磷酸鹽）的作用機制與細胞表面受體無關。它直接與骨骼中的羥基磷灰石結合，被蝕骨細胞（osteoclast）吞噬後，在細胞內抑制甲羥戊酸（mevalonate）代謝路徑中的酵素（法尼基焦磷酸合酶），導致蝕骨細胞凋亡，不透過受體傳訊。clenbuterol（β2 agonist）、morphine（opioid receptor）、acepromazine（dopamine D2/α1 receptor）均透過特定受體發揮作用。","we":["錯誤：clenbuterol是β2腎上腺素受體促效劑，作用必須透過β2受體傳訊（cAMP路徑），與受體直接相關。","錯誤：morphine透過與μ（mu）、κ（kappa）、δ（delta）阿片類受體結合發揮鎮痛、鎮靜作用，作用機制與受體高度相關。","","錯誤：acepromazine是phenothiazine類藥物，主要透過阻斷多巴胺D2受體及α1腎上腺素受體發揮鎮靜作用，與受體直接相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_005","year":2020,"roc_year":109,"session":"1","examNo":5,"q":"於兩相式模式（two-state model）中，Neutral agonists 的作用大約相似於典型受體理論（classic receptor theory）中的：","opts":["A. 全致效劑（full agonists）","B. 部分拮抗劑（partial agonists）","C. 競爭性拮抗劑（competitive antagonists）","D. 非競爭性拮抗劑（non-competitive antagonists）"],"ans":2,"exp":"在兩相式模式（two-state model）中，受體存在活化態（R*）和非活化態（R）兩種狀態之間的平衡。Neutral agonist（中性促效劑）與R和R*的親和力相同，不改變兩態之間的平衡，維持基礎受體活性，效果類似於古典受體理論中的「競爭性拮抗劑」——佔據受體但不產生內在活性（intrinsic activity），也不改變基礎訊號。","we":["錯誤：全致效劑（full agonist）在兩相式模式中優先穩定活化態（R*），使平衡向R*偏移，產生最大反應，與neutral agonist行為不同。","錯誤：「部分拮抗劑」並非標準藥理學術語，此選項描述不準確；partial agonist（部分促效劑）仍有一定內在活性，與neutral agonist不同。","","錯誤：非競爭性拮抗劑透過不可逆或變構結合改變受體最大反應，機制與neutral agonist維持基礎平衡的方式不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_006","year":2020,"roc_year":109,"session":"1","examNo":6,"q":"乙醯膽鹼（acetylcholine）的縮瞳作用與腎上腺素（epinephrine）的散瞳作用屬於下列何種拮抗？","opts":["A. 受體拮抗（receptor antagonism）","B. 生理拮抗（physiologic antagonism）","C. 化學拮抗（chemical antagonism）","D. 酵素拮抗（enzymic antagonism）"],"ans":1,"exp":"乙醯膽鹼（ACh）透過M3毒蕈鹼受體作用於虹膜括約肌產生縮瞳；腎上腺素（epinephrine）透過α1腎上腺素受體作用於虹膜散大肌產生散瞳。兩藥作用於「不同受體、不同效應器」，透過相反的生理效應相互抵消，屬於生理拮抗（physiologic antagonism）。受體拮抗需競爭「同一受體」；化學拮抗是直接化學中和；酵素拮抗為酵素直接降解。","we":["錯誤：受體拮抗（receptor antagonism）指兩藥競爭「同一受體」，而ACh作用於M受體、epinephrine作用於α1受體，兩者受體不同，不符合受體拮抗的定義。","","錯誤：化學拮抗（chemical antagonism）指藥物在體內直接發生化學反應（如螯合）而相互失去活性，ACh與epinephrine並無此類化學交互作用。","錯誤：酵素拮抗（enzymic antagonism）指利用酵素分解某一藥物而達到拮抗，並非此處ACh與epinephrine相反效應的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_007","year":2020,"roc_year":109,"session":"1","examNo":7,"q":"下列何者不是肝臟對藥物的接合反應（conjugation）？","opts":["A. 葡萄醛酸（glucuronic acid）接合反應","B. 硫酸根（sulfate）接合反應","C. 麩胱甘肽（glutathione）接合反應","D. 氧（oxygen）接合反應"],"ans":3,"exp":"肝臟的接合反應（phase II conjugation）包括：葡萄醛酸接合、硫酸根接合、麩胱甘肽接合、甘胺酸接合、乙醯化、甲基化等。「氧接合反應」並非公認的phase II接合反應，屬於phase I氧化反應的範疇（如CYP介導的氧化反應），並非接合反應。","we":["錯誤：葡萄醛酸（glucuronic acid）接合反應是最重要的phase II接合反應之一，由UDP-葡萄醛酸轉移酶（UGT）催化，確為正式的肝臟接合反應。","錯誤：硫酸根（sulfate）接合反應由磺基轉移酶（sulfotransferase）催化，是公認的phase II接合反應，適用於酚類、醇類藥物。","錯誤：麩胱甘肽（glutathione）接合反應由麩胱甘肽-S-轉移酶催化，可解毒親電性代謝物，是重要的phase II接合反應。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_008","year":2020,"roc_year":109,"session":"1","examNo":8,"q":"首渡效應（first-pass effect）高的藥物容易造成下列何種現象？","opts":["A. 增加投藥間隔","B. 增加吸收速率","C. 降低生體可用率","D. 降低藥物的水溶性"],"ans":2,"exp":"首渡效應（first-pass effect）高的藥物經口投予後，在通過腸壁和肝臟時大量被代謝，使進入體循環的原形藥物大幅減少，導致「生體可用率（bioavailability）降低」。高首渡效應不代表需增加投藥間隔或改變吸收速率，也與水溶性無關；而是意味著口服劑量必須遠高於靜脈給藥劑量才能達到相同血中濃度。","we":["錯誤：增加投藥間隔與首渡效應無直接關聯；首渡效應高只表示生體可用率低，不會自動延長藥物作用時間而需要增加間隔。","錯誤：首渡效應高表示大量藥物在吸收後立即被代謝，並不代表藥物本身的吸收速率增加；吸收速率由溶解度、膜通透性等因素決定。","","錯誤：藥物水溶性由其化學結構決定，與首渡效應高低無直接因果關係；首渡效應是代謝問題，而非溶解度問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_009","year":2020,"roc_year":109,"session":"1","examNo":9,"q":"下列何種投藥方式最易達到肺部有效濃度？","opts":["A. 肌肉注射","B. 皮下注射","C. 表面塗擦","D. 噴霧吸入"],"ans":3,"exp":"噴霧吸入（nebulization/inhalation）將藥物直接輸送至呼吸道，藥物顆粒沉積於肺泡及小氣道，在肺部局部達到極高治療濃度，同時減少全身性副作用。肌肉注射（IM）、皮下注射（SC）均需透過體循環再分布至肺部，受肺部血流量和藥物分布特性限制，肺部濃度相對較低。表面塗擦僅作用於皮膚，不能有效到達肺部。","we":["錯誤：肌肉注射（IM）需藥物先進入體循環，再依血流分布到達肺部；受限於藥物的分布容積和肺部攝取率，肺部濃度遠低於噴霧吸入。","錯誤：皮下注射（SC）吸收速率比IM更慢，藥物同樣需透過體循環分布，達到肺部有效濃度的效率遠不及直接吸入給藥。","錯誤：表面塗擦（topical application）主要作用於皮膚局部，全身吸收量極少，無法有效提高肺部藥物濃度。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_010","year":2020,"roc_year":109,"session":"1","examNo":10,"q":"固體劑型藥物經口投予後，經由腸道黏膜吸收，其最先關鍵步驟主要為何？","opts":["A. 藥物劑型之崩解","B. 藥物之離子化","C. 藥物結合運送蛋白","D. 藥物結合細胞膜"],"ans":0,"exp":"固體劑型（錠劑、膠囊）口服後，藥物吸收的「第一個關鍵步驟」是劑型的崩解（disintegration）：固體劑型必須先瓦解成細小顆粒，才能進一步溶解（dissolution）成藥物分子，再被腸黏膜吸收。崩解是整個吸收過程的速率限制步驟之首。離子化、蛋白結合及細胞膜結合均發生在崩解和溶解之後的後續步驟。","we":["","錯誤：藥物的離子化發生在藥物已溶解成分子形式之後，受環境pH影響；在固體崩解和溶解之前，尚無自由藥物分子可供離子化，故非第一關鍵步驟。","錯誤：藥物結合運送蛋白（carrier protein）屬於跨膜轉運步驟，發生在藥物溶解並到達腸黏膜之後，並非固體劑型吸收的首要步驟。","錯誤：藥物結合細胞膜亦為後續的跨膜步驟，在劑型崩解→溶解→擴散至膜表面後才發生，並非第一關鍵步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_011","year":2020,"roc_year":109,"session":"1","examNo":11,"q":"依據各組織與器官之血流分布量，下列何者排除藥物所需時間最長？","opts":["A. 肌肉組織","B. 脂肪組織","C. 腦組織","D. 腎臟"],"ans":1,"exp":"脂肪組織血流量極低（每單位質量灌流量約0.03 mL/min/g），且親脂性藥物大量蓄積於脂肪中，釋放回血液的速度非常緩慢，因此脂肪組織排除藥物所需時間最長。相較之下，腎臟血流量最大（約4 mL/min/g），腦組織次之，肌肉再次之，血流充足的器官排除藥物較快。","we":["錯誤：肌肉組織血流量為中等程度（約0.025 mL/min/g），雖低於腎臟和腦部，但藥物在肌肉中蓄積程度遠低於脂肪，排除速度仍快於脂肪組織。","","錯誤：腦組織血流量高（約0.5 mL/min/g），有血腦屏障限制某些藥物進入，但已進入的藥物因高血流而能較快被清除，排除時間不是最長。","錯誤：腎臟是全身血流量相對最大的器官之一（約4 mL/min/g），藥物在腎臟的排除速度極快，絕非最慢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_012","year":2020,"roc_year":109,"session":"1","examNo":12,"q":"下列何者是血漿中藥物擬似分布容積之單位？","opts":["A. 毫莫耳濃度","B. 毫克•小時／公升","C. 公升／公斤","D. 公升／小時"],"ans":2,"exp":"擬似分布容積（apparent volume of distribution, Vd）的定義為：Vd = 體內藥物總量（mg）/ 血漿藥物濃度（mg/L），單位為「公升（L）」；以體重標準化後表示為「公升／公斤（L/kg）」。毫莫耳濃度為濃度單位；mg·h/L為藥時曲線下面積（AUC）單位；L/h為清除率（clearance）單位。","we":["錯誤：毫莫耳濃度（mmol/L）是藥物濃度的單位，並非分布容積的單位；Vd代表的是體積概念，單位應為公升或公升／公斤。","錯誤：毫克•小時／公升（mg·h/L）是藥時曲線下面積（AUC）的單位，用於評估藥物暴露量，並非Vd的單位。","","錯誤：公升／小時（L/h）是清除率（clearance, CL）的單位，代表單位時間內被清除的血漿體積，並非分布容積的單位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_013","year":2020,"roc_year":109,"session":"1","examNo":13,"q":"半衰期短之藥物所顯示之意義為何？","opts":["A. 藥物為脂溶性藥物","B. 靜脈輸注易快速達到穩定之血漿濃度","C. 藥物之吸收受到首渡效應影響","D. 藥物具有良好之生體可用率"],"ans":1,"exp":"達到穩態（steady state）所需時間等於約4-5個半衰期。半衰期短的藥物，4-5個半衰期所需的絕對時間短，因此在靜脈輸注時能「快速達到穩定之血漿濃度」。半衰期短只說明消除速率快，不能推論藥物的脂溶性、首渡效應大小或生體可用率高低。","we":["錯誤：半衰期短表示消除快，可能是因為清除率高或分布容積小，並非必然代表藥物為脂溶性；脂溶性高的藥物反而常有較大的Vd和較長的半衰期。","","錯誤：首渡效應是口服藥物在到達體循環前被腸壁或肝臟代謝的現象，與半衰期長短無直接因果關係。","錯誤：生體可用率取決於藥物吸收程度和首渡效應，與半衰期長短無直接關聯；半衰期短的藥物生體可用率可高可低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_014","year":2020,"roc_year":109,"session":"1","examNo":14,"q":"有關單獨使用ketamine麻醉的敘述，下列何者正確？","opts":["A. 僅適用於心衰竭的病畜","B. 可使咽喉反射完全消失","C. 僅具有限的止痛作用","D. 不可用於非人類的靈長類"],"ans":2,"exp":"單獨使用ketamine時，僅具有「有限的止痛作用」——對體幹（軀體）的淺表痛覺有一定阻斷，但對內臟痛止痛效果差，整體鎮痛深度不足以進行完整外科手術，故需合併其他鎮痛藥。ketamine可增加心率及血壓，不適合心衰竭患者（A錯誤）；ketamine保留咽喉反射，不會使之完全消失（B錯誤）；ketamine可用於非人類靈長類（D錯誤）。","we":["錯誤：ketamine會刺激交感神經，導致心率加快和血壓上升，對心衰竭病畜反而可能造成心臟負擔增加，「僅適用於心衰竭」的說法不正確。","錯誤：ketamine的特色之一是「保留咽喉反射」（pharyngeal-laryngeal reflexes），不會使之完全消失，這也是其與其他麻醉劑的重要區別。","","錯誤：ketamine廣泛用於非人類靈長類（如猴子）的保定麻醉，並非禁用；「不可用於非人類靈長類」的說法完全錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_015","year":2020,"roc_year":109,"session":"1","examNo":15,"q":"有關麻醉性藥物之敘述，下列何者正確？","opts":["A. Phenobarbital藥效長，最適用於外科手術時間較長的麻醉","B. Guaifenesin具有肌肉鬆弛作用","C. Methohexital不歸類為巴比妥酸鹽類","D. Propofol作用於dopamine接受體"],"ans":1,"exp":"guaifenesin（甘油醚）為中樞性肌肉鬆弛劑，作用於脊髓，能有效鬆弛橫紋肌（骨骼肌），常用於馬匹等大型動物的麻醉誘導輔助，具有肌肉鬆弛作用此敘述正確。phenobarbital藥效過長，恢復期延長，不適合長時間外科手術（A錯誤）；methohexital屬於巴比妥酸鹽類（C錯誤）；propofol作用於GABA-A受體而非dopamine受體（D錯誤）。","we":["錯誤：phenobarbital雖為長效巴比妥酸鹽，但其恢復期過長且術後抑制時間難以控制，並不適合作為外科手術時間較長的麻醉選擇；pentobarbital或其他短至中效藥物更常用。","","錯誤：methohexital（美索比妥）確實屬於巴比妥酸鹽（barbiturate）類，為超短效巴比妥酸鹽麻醉藥；「不歸類為巴比妥酸鹽類」的敘述錯誤。","錯誤：propofol（異丙酚）的作用機制是增強GABA-A受體（γ-胺基丁酸A型受體）的抑制性傳導，並非作用於dopamine受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_016","year":2020,"roc_year":109,"session":"1","examNo":16,"q":"下列何種吸入性麻醉劑的麻醉效力最弱而最小肺泡濃度（minimum alveolar concentration, MAC）最大？","opts":["A. enflurane","B. isoflurane","C. desflurane","D. sevoflurane"],"ans":2,"exp":"最小肺泡濃度（MAC）與麻醉效力成反比：MAC越大，效力越弱。desflurane的MAC在犬約6-9%，是現代常用吸入麻醉劑中最高的，因此效力最弱。相比之下，enflurane MAC約2.2%，isoflurane MAC約1.2-1.6%，sevoflurane MAC約2.4%，均遠低於desflurane，故desflurane為MAC最大、效力最弱者。","we":["錯誤：enflurane的MAC約為2.2%，雖高於isoflurane，但仍遠低於desflurane（約6-9%），並非MAC最大的吸入麻醉劑。","錯誤：isoflurane的MAC約為1.2-1.6%，是常用吸入麻醉劑中MAC較小（效力較強）的一種，並非MAC最大者。","","錯誤：sevoflurane的MAC約為2.4%，雖高於isoflurane，但遠低於desflurane，並非MAC最大的吸入麻醉劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_017","year":2020,"roc_year":109,"session":"1","examNo":17,"q":"對動物大量投予acepromazine後，對內分泌系統最可能產生之影響為何？","opts":["A. 高泌乳激素症","B. 刺激多發性排卵","C. 抑制皮質醇之分泌","D. 促進胰島素之分泌"],"ans":0,"exp":"acepromazine為phenothiazine類藥物，主要藥理作用之一是阻斷多巴胺D2受體。下視丘多巴胺正常抑制垂體前葉泌乳素（prolactin）的分泌；acepromazine阻斷D2受體後，解除多巴胺對泌乳素分泌的抑制，導致泌乳素濃度升高（高泌乳激素症, hyperprolactinemia）。此藥不具促排卵、抑制皮質醇或促進胰島素分泌的作用。","we":["","錯誤：acepromazine不具有促性腺激素樣作用，不會刺激多發性排卵；促排卵需要GnRH、FSH/LH等促性腺相關藥物。","錯誤：acepromazine對HPA軸（下視丘-腦下垂體-腎上腺軸）無直接抑制皮質醇分泌的作用；皮質醇抑制通常需要糖皮質素類藥物或特定下視丘抑制劑。","錯誤：acepromazine不具有促進胰島素分泌的作用；胰島素分泌促進劑通常為磺醯尿素類（sulfonylureas）或腸泌素（incretin）類藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_018","year":2020,"roc_year":109,"session":"1","examNo":18,"q":"可增加心肌收縮性與心跳速率，用於治療鬱血性心衰竭的腎上腺素性藥物是何者？","opts":["A. digoxin","B. dobutamine","C. propranolol","D. benazepril"],"ans":1,"exp":"dobutamine為合成的β1腎上腺素受體促效劑，直接刺激心臟β1受體，增加心肌收縮性（正性肌力）及心跳速率（正性頻率），用於治療鬱血性心衰竭（CHF），屬於腎上腺素性（adrenergic）藥物。digoxin為強心配醣體（非腎上腺素性藥物），propranolol為β阻斷劑（負性肌力），benazepril為ACE抑制劑（血管擴張劑）。","we":["錯誤：digoxin為強心配醣體，雖可增加心肌收縮性，但其主要機制是抑制Na⁺/K⁺-ATPase，並非腎上腺素性藥物；且digoxin會減慢心跳（負性頻率），不符合題目描述。","","錯誤：propranolol為非選擇性β腎上腺素阻斷劑，會「降低」心肌收縮性和心跳速率，用於控制心跳過速，而非治療心衰竭的正性肌力藥物。","錯誤：benazepril為ACE抑制劑，透過阻斷腎素-血管收縮素系統降低後負荷和血壓，並非直接增加心肌收縮性或心跳速率的腎上腺素性藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_019","year":2020,"roc_year":109,"session":"1","examNo":19,"q":"下列何者以競爭性方式與神經肌肉接合處之尼古丁性受體結合，產生鬆弛骨骼肌的作用？","opts":["A. aminopentamide","B. succinylcholine","C. atracurium","D. endrophonium"],"ans":2,"exp":"atracurium（阿曲庫銨）為非去極化型（non-depolarizing）神經肌肉阻斷劑，以競爭性方式與神經肌肉接合處（NMJ）的尼古丁性乙醯膽鹼受體（nAChR）結合，阻斷ACh與受體結合，從而抑制肌肉去極化，產生骨骼肌鬆弛。aminopentamide為抗毒蕈鹼性藥物，succinylcholine為去極化型NMB，edrophonium（D選項拼寫為endrophonium）為乙醯膽鹼酯酶抑制劑。","we":["錯誤：aminopentamide為抗毒蕈鹼性（antimuscarinic）藥物，阻斷M型膽鹼受體，主要用於止嘔和胃腸解痙，並非神經肌肉阻斷劑。","錯誤：succinylcholine（琥珀膽鹼）為「去極化型」神經肌肉阻斷劑，與nAChR結合後引起持續去極化，而非以競爭性拮抗方式阻斷受體，機制與atracurium不同。","","錯誤：edrophonium為乙醯膽鹼酯酶（AChE）抑制劑，用於診斷重症肌無力或拮抗非去極化NMB，本身並非神經肌肉阻斷劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_020","year":2020,"roc_year":109,"session":"1","examNo":20,"q":"動物體內的腎上腺素性受體中，活化那一型受體會減少環化腺核苷單磷酸（cyclic AMP）的形成？","opts":["A. α1","B. α2","C. β1","D. β2"],"ans":1,"exp":"α2腎上腺素受體與抑制性G蛋白（Gi protein）偶聯，活化後Gi蛋白抑制腺苷酸環化酶（adenylate cyclase），使cAMP生成「減少」。α1受體偶聯Gq→IP3/DAG途徑；β1和β2受體偶聯Gs→腺苷酸環化酶活化→cAMP增加，與α2效果相反。","we":["錯誤：α1受體偶聯Gq蛋白，活化後透過磷脂酶C（PLC）產生IP3和DAG，促進細胞內鈣釋放，並不直接影響cAMP濃度，不會減少cAMP形成。","","錯誤：β1受體偶聯Gs蛋白，活化後刺激腺苷酸環化酶，「增加」cAMP濃度，與題目所求的「減少cAMP形成」相反。","錯誤：β2受體同樣偶聯Gs蛋白，活化後增加cAMP濃度，常見於支氣管平滑肌舒張反應，與減少cAMP的效果相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_021","year":2020,"roc_year":109,"session":"1","examNo":21,"q":"下列何者不是選擇性β-阻斷劑（β-adrenergic blocker）？","opts":["A. metoprolol","B. esmolol","C. atenolol","D. propranolol"],"ans":3,"exp":"propranolol為「非選擇性」β腎上腺素阻斷劑，同時阻斷β1和β2兩種受體，不具有選擇性。metoprolol、esmolol、atenolol均為「選擇性」β1腎上腺素阻斷劑（cardioselective），主要作用於心臟β1受體，在治療劑量下對支氣管β2受體影響較小。","we":["錯誤：metoprolol為選擇性β1阻斷劑（心臟選擇性），主要阻斷心臟β1受體，對β2受體影響較小，屬於選擇性β阻斷劑。","錯誤：esmolol為超短效選擇性β1阻斷劑，半衰期約9分鐘，常用於術中心率控制，屬於選擇性β阻斷劑。","錯誤：atenolol為選擇性β1阻斷劑，水溶性高，主要阻斷心臟β1受體，不易透過血腦屏障，屬於選擇性β阻斷劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_022","year":2020,"roc_year":109,"session":"1","examNo":22,"q":"下列何種強心配醣體的血漿蛋白結合率最高且半衰期最長？","opts":["A. digitoxin","B. ouabain","C. digoxin","D. strophanthin"],"ans":0,"exp":"digitoxin（地黃毒苷）在所有強心配醣體中具有最高的血漿蛋白結合率（約90-97%）和最長的半衰期（約5-7天），因此蓄積性最強，毒性風險最大。ouabain幾乎不與血漿蛋白結合且半衰期極短（約21小時）；digoxin血漿蛋白結合率約20-25%，半衰期24-36小時；strophanthin血漿蛋白結合率極低且半衰期很短。","we":["","錯誤：ouabain（烏本苷）幾乎不與血漿蛋白結合（結合率近0%），且半衰期極短，是強心配醣體中血漿蛋白結合率最低且半衰期最短的，並非最高者。","錯誤：digoxin的血漿蛋白結合率約20-25%，半衰期約24-36小時，均遠低於digitoxin，不是血漿蛋白結合率最高且半衰期最長的強心配醣體。","錯誤：strophanthin血漿蛋白結合率極低，半衰期亦短，在強心配醣體中屬於結合率低、消除快的藥物，並非最高或最長者。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_023","year":2020,"roc_year":109,"session":"1","examNo":23,"q":"Erythropoietin主要用於治療下列何種貧血症？","opts":["A. 低血紅素小血球性貧血","B. 地中海型貧血","C. 末期腎臟疾病所導致之貧血","D. 巨母紅血球性貧血"],"ans":2,"exp":"Erythropoietin（EPO）是由腎臟分泌的造血生長激素，主要促進紅血球生成。末期腎臟疾病（end-stage renal disease, ESRD）患者因腎臟功能喪失，EPO生成不足，導致正常色素正常血球性貧血。補充外源性EPO是此類貧血的特異性治療。低血紅素小血球性貧血（缺鐵性）→補鐵；地中海型貧血→輸血/骨髓移植；巨母紅血球性貧血→補充B12/葉酸。","we":["錯誤：低血紅素小血球性貧血（低血色素小球性貧血）通常為缺鐵性貧血，治療應補充鐵劑，與EPO不足無關，EPO治療無效。","錯誤：地中海型貧血（thalassemia）為遺傳性血紅蛋白合成缺陷，EPO濃度通常不低，補充EPO無法矯正血紅蛋白結構異常，治療需輸血或骨髓移植。","","錯誤：巨母紅血球性貧血（megaloblastic anemia）為維生素B12或葉酸缺乏導致DNA合成障礙，與EPO缺乏無關，治療應補充B12或葉酸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_024","year":2020,"roc_year":109,"session":"1","examNo":24,"q":"下列何者能與antithrombin III結合而抑制thrombin，進而產生抗凝血作用？","opts":["A. aspirin","B. warfarin","C. heparin","D. dicumarol"],"ans":2,"exp":"heparin（肝素）透過與antithrombin III（抗凝血酶III，AT-III）結合，誘導AT-III的構型改變，使AT-III對凝血酶（thrombin, Factor IIa）及Factor Xa的抑制活性提高約1000倍，從而產生快速、強效的抗凝血作用。aspirin抑制COX防止血小板聚集；warfarin和dicumarol為維生素K拮抗劑，抑制因子II、VII、IX、X的合成，均與AT-III無關。","we":["錯誤：aspirin透過不可逆地乙醯化並抑制COX-1酵素，阻斷TXA2生成，減少血小板聚集，其作用機制與antithrombin III完全無關。","錯誤：warfarin為維生素K拮抗劑，抑制肝臟中維生素K依賴性凝血因子（II、VII、IX、X）的羧化合成，並不透過antithrombin III發揮作用。","","錯誤：dicumarol與warfarin相同，均為維生素K拮抗劑，透過抑制維生素K依賴性凝血因子的合成達到抗凝血效果，與antithrombin III無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_025","year":2020,"roc_year":109,"session":"1","examNo":25,"q":"牛經口投予cardiac glycosides後，藥物水解之主要部位為何？","opts":["A. 瘤胃","B. 大腸","C. 十二指腸","D. 空腸"],"ans":0,"exp":"牛為反芻動物，口服cardiac glycosides後，藥物首先進入瘤胃（rumen），瘤胃中豐富的微生物（細菌）含有配醣體水解酶（glycosidase），能將cardiac glycosides的糖基（sugar moiety）水解，使藥物部分失活，導致牛對口服cardiac glycosides的生體可用率極低。大腸、十二指腸、空腸均非此主要水解部位。","we":["","錯誤：大腸雖含有大量腸道菌群，但cardiac glycosides到達大腸之前已先在瘤胃中被大量水解，大腸並非主要水解部位。","錯誤：十二指腸為小腸最前段，主要功能為接受胰液和膽汁協助消化，cardiac glycosides在此處的微生物水解作用遠少於瘤胃。","錯誤：空腸為小腸中段，主要負責營養素的消化吸收，cardiac glycosides在空腸中的水解量極少，並非主要水解部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_026","year":2020,"roc_year":109,"session":"1","examNo":26,"q":"下列何種利尿劑可抑制proinsulin轉換成insulin，因而導致高血糖現象？","opts":["A. loop diuretics","B. carbonic anhydrase inhibitors","C. potassium-sparing diuretics","D. thiazide diuretics"],"ans":3,"exp":"thiazide類利尿劑（如hydrochlorothiazide）可抑制胰臟β細胞的鉀離子通道，影響胰島素分泌過程，並抑制proinsulin轉換成insulin，導致胰島素分泌減少，進而引起高血糖現象（hyperglycemia）。此副作用在長期使用thiazide時需注意。loop利尿劑、碳酸酐酶抑制劑及保鉀利尿劑均無此特定機制。","we":["錯誤：loop利尿劑（如furosemide）作用於亨利氏環粗升肢，雖也可能輕微影響血糖，但並無抑制proinsulin轉換為insulin的特定機制，此副作用與thiazide相關。","錯誤：碳酸酐酶抑制劑（如acetazolamide）主要抑制腎近曲小管的碳酸酐酶，對胰島素合成或proinsulin轉換無直接抑制作用。","錯誤：保鉀利尿劑（如spironolactone、amiloride）主要作用於遠曲小管和集合管，對proinsulin轉換為insulin無抑制作用，不會引起高血糖。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_027","year":2020,"roc_year":109,"session":"1","examNo":27,"q":"下列何者不是作用於近曲小管（proximal convoluted tubule）之利尿劑？","opts":["A. furosemide","B. mannitol","C. aminophylline","D. acetazolamide"],"ans":0,"exp":"furosemide（速尿）作用於亨利氏環粗升肢（thick ascending limb of loop of Henle），抑制管腔側的Na⁺-K⁺-2Cl⁻共同轉運體（NKCC2），並「不作用」於近曲小管（proximal convoluted tubule, PCT）。mannitol為滲透性利尿劑，作用部位含PCT；aminophylline（xanthine類）可輕度作用於PCT（腺苷拮抗）；acetazolamide抑制PCT的碳酸酐酶。","we":["","錯誤：mannitol為滲透性利尿劑，在近曲小管（PCT）大量存在時，提升管腔滲透壓，減少水分重吸收，確為作用於PCT的利尿劑。","錯誤：aminophylline（茶鹼乙二胺鹽）具有輕度利尿作用，機制包括拮抗腺苷受體，可在近曲小管增加腎血流並輕度減少鈉重吸收，屬作用於PCT的利尿劑之一。","錯誤：acetazolamide是碳酸酐酶抑制劑，主要作用於近曲小管（PCT），抑制HCO₃⁻重吸收，導致碳酸氫鹽尿症，確為作用於PCT的利尿劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_028","year":2020,"roc_year":109,"session":"1","examNo":28,"q":"下列何者不是利尿劑furosemide之臨床適應症？","opts":["A. 水腫（edema）","B. 急性腎衰竭（acute renal failure）","C. 高鈣血症（hypercalcemia）","D. 高尿酸血症（hyperuricemia）"],"ans":3,"exp":"furosemide的臨床適應症包括：水腫（各種原因引起的組織積液）、急性腎衰竭（維持尿流以防腎小管堵塞）、高鈣血症（loop利尿劑促進鈣從亨利氏環排泄，可降低血鈣）。高尿酸血症（hyperuricemia）並非furosemide的適應症，反而是其「副作用」——furosemide競爭性抑制尿酸排泄，導致血尿酸升高。","we":["錯誤：水腫（edema）是furosemide最主要的臨床適應症之一，其強效利尿作用可有效消除肺水腫、全身性水腫等各類積液，並非不適應症。","錯誤：急性腎衰竭時，furosemide常用於嘗試維持尿流、防止腎小管阻塞和少尿，雖療效有爭議，但仍是臨床常見適應症之一，並非不適應症。","錯誤：高鈣血症（hypercalcemia）是furosemide的適應症之一，furosemide抑制亨利氏環的鈣重吸收，促進尿鈣排泄，配合大量補液可用於治療高鈣血症，並非不適應症。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_029","year":2020,"roc_year":109,"session":"1","examNo":29,"q":"下列何者會升高血鈣濃度？","opts":["A. acetazolamide","B. furosemide","C. hydrochlorothiazide","D. spironolactone"],"ans":2,"exp":"hydrochlorothiazide（HCTZ，噻嗪類利尿劑）作用於遠曲小管，在抑制NaCl重吸收的同時，促進Ca²⁺的重吸收（透過基底側Na⁺-Ca²⁺交換體增強），導致尿鈣減少、血鈣濃度升高。acetazolamide對血鈣影響不顯著；furosemide抑制亨利氏環的鈣重吸收，降低血鈣；spironolactone對鈣代謝無顯著作用。","we":["錯誤：acetazolamide（碳酸酐酶抑制劑）主要影響碳酸氫鹽和鈉的排泄，對血鈣濃度無顯著影響，不會升高血鈣。","錯誤：furosemide（loop利尿劑）抑制亨利氏環粗升肢的Ca²⁺重吸收，促進尿鈣排泄，反而「降低」血鈣濃度，常用於治療高鈣血症，與升高血鈣相反。","","錯誤：spironolactone為醛固酮拮抗劑，作用於遠曲小管和集合管的Na⁺/K⁺交換，對鈣代謝無直接顯著影響，不會升高血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_030","year":2020,"roc_year":109,"session":"1","examNo":30,"q":"下列何者最容易引起下痢的副作用？","opts":["A. atropine","B. misoprostol","C. omeprazole","D. ranitidine"],"ans":1,"exp":"misoprostol為PGE1（前列腺素E1）合成類似物，作用於腸道PGE受體，刺激腸道平滑肌收縮、促進腸液分泌，最常見且最顯著的副作用為下痢（diarrhea），為其劑量限制性副作用，臨床上常導致病患停藥。atropine（抗膽鹼）→便秘；omeprazole（質子幫浦抑制劑）→消化道副作用輕微；ranitidine（H2阻斷劑）→輕微消化道症狀。","we":["錯誤：atropine為抗毒蕈鹼性（antimuscarinic）藥物，可抑制腸道平滑肌收縮，減少腸液分泌，副作用為「便秘」而非下痢，與misoprostol效果相反。","","錯誤：omeprazole為質子幫浦抑制劑（PPI），主要抑制胃酸分泌，消化道副作用輕微（偶發腹瀉、噁心），不如misoprostol容易引起嚴重下痢。","錯誤：ranitidine為H2受體阻斷劑，消化道副作用輕微，偶見便秘或腹瀉，但發生率和嚴重程度遠低於misoprostol。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_031","year":2020,"roc_year":109,"session":"1","examNo":31,"q":"下列何者是erythromycin促進胃腸蠕動的主要作用部位？","opts":["A. 胃","B. 盲腸","C. 結腸","D. 直腸"],"ans":0,"exp":"erythromycin作為促進胃腸蠕動藥（prokinetic）時，主要作用於「胃」部——它是胃部motilin受體的促效劑，可刺激胃竇蠕動、促進胃排空，改善胃輕癱。其對小腸也有輕度促動力作用，但「主要作用部位」為胃，而非盲腸、結腸或直腸。","we":["","錯誤：erythromycin的促進胃腸蠕動作用主要透過胃部motilin受體，盲腸並非其主要作用部位；促進盲腸蠕動較常見於其他類型的促動力藥物（如用於馬結腸的藥物）。","錯誤：erythromycin對結腸的促動力作用不顯著，結腸主要受5-HT4受體調控（如cisapride的作用部位），erythromycin的促進蠕動效果集中在胃部，並非結腸。","錯誤：直腸不是erythromycin促進胃腸蠕動的主要作用部位；erythromycin透過胃部motilin受體發揮促動力作用，直腸缺乏此機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_032","year":2020,"roc_year":109,"session":"1","examNo":32,"q":"下列何者是xylazine在貓引起嘔吐的作用受體？","opts":["A. α1","B. α2","C. 5-HT3","D. 5-HT4"],"ans":1,"exp":"xylazine在貓引起嘔吐的機制是透過刺激「α2腎上腺素受體」。在貓中，延髓最後區（area postrema，化學感受器觸發區/CTZ）有密集的α2受體，xylazine（α2促效劑）活化這些α2受體後觸發嘔吐反射。貓對xylazine誘發嘔吐的敏感性遠高於犬。α1受體、5-HT3及5-HT4受體並非此反應的主要機制。","we":["錯誤：α1腎上腺素受體並非xylazine誘發貓嘔吐的作用受體；xylazine主要為α2選擇性促效劑，透過α2受體產生鎮靜及嘔吐效應，與α1受體無關。","","錯誤：5-HT3受體（血清素3型受體）是止吐藥（如ondansetron）的作用靶點，與化療或運動引起的嘔吐相關，並非xylazine在貓誘發嘔吐的機制。","錯誤：5-HT4受體主要與胃腸道促動力有關（如cisapride的作用靶點），並非xylazine透過α2腎上腺素路徑引發嘔吐的相關受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_033","year":2020,"roc_year":109,"session":"1","examNo":33,"q":"Diazepam促進食慾的作用，對下列那一種動物最顯著？","opts":["A. 犬","B. 貓","C. 馬","D. 羊"],"ans":1,"exp":"diazepam（苯二氮平類）透過促進GABA-A受體的抑制性傳導，作用於下視丘的飲食調控中樞，刺激食慾。此促進食慾作用在「貓」中最為顯著且一致，臨床上曾用於刺激厭食症貓的食慾（但因肝毒性副作用現已較少使用）。在犬中效果較不穩定，在馬和羊中不典型。","we":["錯誤：diazepam在犬的食慾促進作用較不穩定且不如貓顯著，臨床上犬的厭食症通常不以diazepam作為首選食慾促進劑。","","錯誤：馬對diazepam促進食慾的反應不典型，且苯二氮平類在馬中主要用於抗癲癇和肌肉鬆弛，食慾促進作用不突出。","錯誤：羊並非diazepam食慾促進作用的代表動物；此效應最顯著的動物為貓，在反芻動物（牛、羊）中此作用未被臨床確立。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_034","year":2020,"roc_year":109,"session":"1","examNo":34,"q":"下列何種用藥為phospho
