azole 的化學結構含有亞碸硫（sulfoxide group，即 propylthio 側鏈），確實含有 S 原子，不符合「不含 S 原子」的條件。","錯誤：Fenbendazole 含有 phenylthio（苯硫醚）側鏈（-S-C₆H₅），確實含有 S 原子，不符合題目條件。","錯誤：Oxfendazole 為 fenbendazole 的亞碸（sulfoxide）代謝產物，含有亞碸基（-S(O)-），仍含有 S 原子。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_068","year":2016,"roc_year":105,"session":"2","examNo":68,"q":"Piperazine對下列何種寄生蟲有效？","opts":["A. 蛔蟲","B. 鈎蟲","C. 鞭蟲","D. 絛蟲"],"ans":0,"exp":"Piperazine 為胺基酸結構的驅蟲藥，其作用機制為超極化線蟲肌肉的氯離子通道（GABA 受體致效劑），使蛔蟲（Ascaris）肌肉麻痺，然後由腸蠕動排出。Piperazine 主要對蛔蟲（Ascaris spp.）有效，對鉤蟲、鞭蟲、絛蟲效果差或無效。","we":["","錯誤：鉤蟲感染需使用苯並咪唑類（如 fenbendazole、mebendazole）或 pyrantel，piperazine 對鉤蟲效果差。","錯誤：鞭蟲感染對多數驅蟲藥抵抗力強，通常需高劑量 fenbendazole 長療程治療，piperazine 對鞭蟲無效。","錯誤：絛蟲感染需使用 praziquantel、epsiprantel 或 niclosamide，piperazine 對絛蟲完全無效，作用靶點不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_069","year":2016,"roc_year":105,"session":"2","examNo":69,"q":"下列何者為昆蟲菸鹼性受體致效劑？","opts":["A. tiamulin","B. dinotefuran","C. rotenone","D. lindane"],"ans":1,"exp":"Dinotefuran 屬於新菸鹼類殺蟲劑（neonicotinoids），作用機制為選擇性與昆蟲的菸鹼型乙醯膽鹼受體（nAChR）結合，作為受體致效劑（agonist），持續活化受體，導致昆蟲神經系統過度興奮、麻痺而死亡。由於哺乳類動物的 nAChR 結構與昆蟲差異大，對哺乳類毒性相對低。","we":["錯誤：Tiamulin 為截短側耳素類（pleuromutilin）抗生素，作用於細菌 50S 核醣體，用於豬、禽的細菌感染，不具殺蟲作用，非昆蟲菸鹼受體致效劑。","","錯誤：Rotenone 為魚藤酮類殺蟲劑，作用機制為抑制線粒體電子傳遞鏈複合體 I（NADH 脫氫酶），阻斷細胞氧化磷酸化，與菸鹼受體無關。","錯誤：Lindane（γ-BHC，六六六）為有機氯殺蟲劑，作用機制為阻斷 GABA 受體（氯離子通道拮抗劑），導致神經過度興奮，非菸鹼型受體致效劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_070","year":2016,"roc_year":105,"session":"2","examNo":70,"q":"下列何者不屬於攜帶離子型（ionophores）藥物？","opts":["A. salinomycin","B. monensin","C. maduramicin","D. nicarbazin"],"ans":3,"exp":"攜帶離子型（ionophore）抗球蟲藥為多醚類聚醚抗生素（polyether antibiotics），透過攜帶陽離子（Na⁺、K⁺）穿越球蟲細胞膜，擾亂離子平衡而殺球蟲，常用者包括：salinomycin、monensin、maduramicin、lasalocid、narasin 等。Nicarbazin 為二苯甲醯肼（dinitrocarbanilide）衍生物，作用機制完全不同（抑制球蟲有氧代謝），不屬於攜帶離子型抗球蟲藥。","we":["此為正確描述：Salinomycin 為多醚類聚醚抗生素，屬於攜帶離子型抗球蟲藥，廣泛用於禽球蟲病的預防。不符合題目問的「不屬於」描述。","此為正確描述：Monensin 為最早使用的攜帶離子型抗球蟲藥之一，主要攜帶 Na⁺，廣泛用於禽及牛的球蟲防治，但對馬有毒性。不符合題目問的「不屬於」描述。","此為正確描述：Maduramicin 為高效攜帶離子型抗球蟲藥，安全範圍窄，主要用於家禽。不符合題目問的「不屬於」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_071","year":2016,"roc_year":105,"session":"2","examNo":71,"q":"下列何者可用於治療貓的Taenia taeniaeformis感染症？","opts":["A. cisplatin","B. methotrexate","C. piroxicam","D. epsiprantel"],"ans":3,"exp":"Taenia taeniaeformis 為貓的絛蟲（以鼠類為中間宿主），絛蟲感染的治療藥物為 praziquantel 或 epsiprantel。Epsiprantel 為 isoquinoline 衍生物（praziquantel 的類似物），作用機制為引起絛蟲體壁肌肉痙攣性收縮及破壞體表皮層，適用於貓狗絛蟲感染（Dipylidium、Taenia 屬）。Cisplatin、methotrexate 為抗腫瘤藥；piroxicam 為 NSAID。","we":["錯誤：Cisplatin 為鉑類抗癌藥，透過與 DNA 形成鉑-DNA 加合物（adducts）抑制 DNA 複製，用於腫瘤治療，對絛蟲感染無效。","錯誤：Methotrexate 為葉酸拮抗劑（抑制 DHFR），用於腫瘤及免疫疾病，不具驅蟲活性。","錯誤：Piroxicam 為 oxicam 類非選擇性 COX 抑制劑（NSAID），用於止痛抗炎，無驅除絛蟲的作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_072","year":2016,"roc_year":105,"session":"2","examNo":72,"q":"下列何者結合到黴菌微管（microtubule）而抑制有絲分裂？","opts":["A. griseofulvin","B. natamycin","C. nystatin","D. fluconazole"],"ans":0,"exp":"Griseofulvin 為由青黴菌（Penicillium griseofulvum）產生的抗真菌藥物，其作用機制為結合真菌的微管蛋白（tubulin），干擾微管的聚合，抑制有絲分裂（mitosis），阻止真菌菌絲伸長。Griseofulvin 主要用於皮膚癬菌（dermatophytes）感染的全身性治療。Natamycin、nystatin 為多烯類（作用於麥角固醇）；fluconazole 為三唑類（抑制麥角固醇合成）。","we":["","錯誤：Natamycin（匹馬菌素）為多烯類抗黴菌藥，作用機制為與麥角固醇結合，破壞細胞膜通透性，主要用於外用抗真菌，不影響微管。","錯誤：Nystatin 亦為多烯類，作用機制同 amphotericin B，結合麥角固醇破壞膜完整性，不干擾微管或有絲分裂。","錯誤：Fluconazole 為三唑類，抑制細胞色素 P-450 依賴性羊毛固醇 14α-去甲基酶（CYP51），阻礙麥角固醇合成，不作用於微管蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_073","year":2016,"roc_year":105,"session":"2","examNo":73,"q":"下列何者適合用於治療犬弓蟲症？","opts":["A. pyrantel","B. levamisole","C. clindamycin","D. zidovudine"],"ans":2,"exp":"犬弓蟲症（toxoplasmosis，Toxoplasma gondii 感染）的首選治療藥物為 clindamycin（克林黴素），其可穿透組織和細胞，在中樞神經系統及眼部達到有效濃度，抑制弓漿蟲的蛋白質合成。亦可與 pyrimethamine 合用。Pyrantel 和 levamisole 為線蟲驅蟲藥；zidovudine（AZT）為抗逆轉錄病毒藥，均對弓漿蟲無效。","we":["錯誤：Pyrantel 為四氫嘧啶類（tetrahydropyrimidine）驅蟲藥，作用為乙醯膽鹼受體致效劑，麻痺線蟲神經肌肉，對原蟲（如 Toxoplasma）完全無效。","錯誤：Levamisole 為左旋咪唑，屬乙醯膽鹼受體致效劑兼免疫調節劑，對線蟲有效，對弓漿蟲（原蟲）無驅蟲活性。","","錯誤：Zidovudine（AZT）為核苷類逆轉錄酶抑制劑（NRTI），用於 HIV 感染及貓的 FIV 感染，對 Toxoplasma gondii（原蟲）無治療效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_074","year":2016,"roc_year":105,"session":"2","examNo":74,"q":"下列何者非抑制黴菌之麥角固醇的合成？","opts":["A. flubendazole","B. ketoconazole","C. itraconazole","D. fluconazole"],"ans":0,"exp":"抑制黴菌麥角固醇（ergosterol）合成的藥物為唑類（azoles）抗黴菌藥，包括 ketoconazole、itraconazole、fluconazole 等，這些藥物均藉由抑制 CYP51（14α-去甲基酶）阻斷麥角固醇合成。Flubendazole 屬於苯並咪唑類（benzimidazole）驅蟲藥，作用機制為結合寄生蟲的 β-tubulin，抑制微管聚合，破壞葡萄糖攝取，是驅線蟲藥，不影響麥角固醇合成。","we":["","此為正確描述：Ketoconazole 為咪唑類抗黴菌藥，可抑制 CYP51（lanosterol 14α-demethylase），阻斷麥角固醇合成，廣泛用於全身性及皮膚黴菌感染。不符合題目問的「非」描述。","此為正確描述：Itraconazole 為三唑類抗黴菌藥，同樣透過抑制 CYP51 阻斷麥角固醇合成，對多種深部黴菌病有效（如組織胞漿菌病、芽生菌病）。不符合題目問的「非」描述。","此為正確描述：Fluconazole 為三唑類，作用機制亦為抑制 CYP51，阻礙麥角固醇合成，對念珠菌及隱球菌有效，滲透中樞神經系統能力強。不符合題目問的「非」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_075","year":2016,"roc_year":105,"session":"2","examNo":75,"q":"巧克力中因含有下列何種成分，而易造成犬隻中毒？","opts":["A. methylxanthines","B. digitalis","C. salicylates","D. sugar"],"ans":0,"exp":"巧克力中含有的 methylxanthines（甲基黃嘌呤類），主要為可可鹼（theobromine）及少量咖啡因（caffeine），是犬隻巧克力中毒的主要毒性成分。犬對 theobromine 的代謝能力遠低於人類（半衰期達 17-18 小時），可抑制磷酸二酯酶（PDE）、拮抗腺苷受體，引起心跳加速、中樞神經興奮、嘔吐、肌肉震顫，嚴重時致死。黑巧克力中 theobromine 含量最高，毒性最強。","we":["","錯誤：Digitalis 為強心配糖體，存在於毛地黃（Digitalis purpurea）植物中，並不存在於巧克力，不是巧克力毒性的成因。","錯誤：Salicylates（水楊酸鹽，如 aspirin）存在於某些植物（如柳樹皮），並不是巧克力的成分，亦非犬巧克力中毒的原因。","錯誤：Sugar（糖）雖為巧克力主要成分之一，但對犬的毒性極低；造成中毒的有毒成分是 methylxanthines（theobromine），而非糖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_076","year":2016,"roc_year":105,"session":"2","examNo":76,"q":"動物因氯酸鹽中毒時，其死後血液顏色為何？","opts":["A. 櫻紅色","B. 褐色","C. 綠色","D. 藍紫色"],"ans":1,"exp":"氯酸鹽（chlorate，ClO₃⁻）為強氧化劑，攝入後在體內會直接氧化血紅素中的亞鐵離子（Fe²⁺）為鐵離子（Fe³⁺），形成變性血紅素（methemoglobin，高鐵血紅素），使血液失去攜氧能力。高鐵血紅素呈褐色（巧克力棕色），因此氯酸鹽中毒動物死後血液呈褐色（棕色）。此與一氧化碳中毒（櫻紅色）截然不同。","we":["錯誤：櫻紅色（cherry red）血液為一氧化碳（CO）中毒的特徵，CO 與血紅素形成碳氧血紅素（carboxyhemoglobin），非氯酸鹽中毒的血色。","","錯誤：綠色血液見於某些特殊情況（如硫血紅素血症，sulfhemoglobinemia），為硫化氫或某些藥物所致，非氯酸鹽中毒的典型血色。","錯誤：藍紫色（cyanosis）見於低氧血症時末梢血液含氧量低，或亞硝酸鹽中毒時，但高鐵血紅素血症的典型顏色為褐色，非藍紫色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_077","year":2016,"roc_year":105,"session":"2","examNo":77,"q":"Ethylene glycol中毒時，血液酸鹼值的改變主要是因：","opts":["A. 呼吸性酸中毒","B. 代謝性酸中毒","C. 呼吸性鹼中毒","D. 代謝性鹼中毒"],"ans":1,"exp":"Ethylene glycol（乙二醇，防凍劑）中毒後，在體內被醇脫氫酶（ADH）代謝為乙醇醛（glycolaldehyde）、乙醛酸（glyoxylic acid）及草酸（oxalic acid）。這些代謝產物造成大量有機酸蓄積，消耗體內碳酸氫鹽（HCO₃⁻），導致陰離子間隙增大型代謝性酸中毒（anion gap metabolic acidosis）。草酸與鈣結合形成草酸鈣晶體，沉積於腎小管，亦造成急性腎衰竭。","we":["錯誤：呼吸性酸中毒（respiratory acidosis）由通氣不足引起 CO₂ 蓄積所致，ethylene glycol 中毒的酸中毒源自代謝產物（有機酸）蓄積，不是呼吸原因。","","錯誤：呼吸性鹼中毒（respiratory alkalosis）由過度換氣（CO₂ 排出過多）引起，與 ethylene glycol 中毒機制相反，早期偶有代償性過度換氣但主體仍為代謝性酸中毒。","錯誤：代謝性鹼中毒（metabolic alkalosis）為鹼性物質蓄積或氫離子過度喪失所致，ethylene glycol 中毒產生大量有機酸，引起的是代謝性酸中毒，而非鹼中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_078","year":2016,"roc_year":105,"session":"2","examNo":78,"q":"Dimercaprol為砷中毒的解毒劑，因其具有：","opts":["A. 雙硫醇","B. 單硫醇","C. 酮酸","D. 乙醯基"],"ans":0,"exp":"Dimercaprol（BAL，British Anti-Lewisite，二巰基丙醇）為砷（arsenic）、汞（mercury）、金（gold）、鉛（lead）中毒的解毒劑，其藥理作用基礎在於分子中含有兩個硫醇基（-SH），即「雙硫醇（vicinal dithiol）」結構。這兩個鄰近的 -SH 基能與砷等重金屬形成穩定的環狀螯合物（chelate），競爭性奪取金屬，恢復含巰基酵素的活性。","we":["","錯誤：單硫醇（monothiol，單個 -SH 基）與重金屬的螯合能力遠弱於雙硫醇，dimercaprol 的解毒功能依賴兩個 -SH 形成穩定的五員環螯合物，單硫醇結構無此效應。","錯誤：酮酸（keto acid，如 pyruvate）不含硫醇基，不具螯合重金屬的能力，非 dimercaprol 解毒機制的關鍵結構。","錯誤：乙醯基（acetyl group，-COCH₃）為乙醯化反應的功能基，用於藥物代謝，不具重金屬螯合活性，非 dimercaprol 解毒的結構基礎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_079","year":2016,"roc_year":105,"session":"2","examNo":79,"q":"下列何者最適合使用於拮抗atropine過量中毒所造成之中樞神經興奮作用？","opts":["A. diazepam","B. neostigmine","C. tolazoline","D. glycopyrrolate"],"ans":0,"exp":"Atropine 過量中毒引起的中樞神經興奮（如躁動、幻覺、抽搐）需要能穿越血腦屏障（BBB）的藥物來對抗。Diazepam（苯二氮平類，benzodiazepine）為脂溶性藥物，可穿越 BBB，增強中樞 GABA 抑制作用，有效控制中樞興奮及抽搐。Neostigmine 雖為膽鹼酯酶抑制劑，可對抗周邊抗膽鹼效應，但屬季銨鹽（quaternary ammonium），無法穿越 BBB，不能逆轉中樞毒性。","we":["","錯誤：Neostigmine 為可逆性膽鹼酯酶抑制劑，可增加周邊突觸乙醯膽鹼，對抗 atropine 的周邊副交感效應，但因其為季銨鹽（quaternary ammonium compound），不能穿越血腦屏障，無法對抗中樞神經興奮毒性。","錯誤：Tolazoline 為 α-腎上腺素受體拮抗劑，主要用於逆轉 xylazine（α2 agonist）的鎮靜效果，對 atropine 的中樞興奮作用無直接對抗效果。","錯誤：Glycopyrrolate 為抗膽鹼藥（anticholinergic），結構為季銨鹽，無法穿越 BBB，且其本身即具抗膽鹼作用，與 atropine 中毒方向相同，不應使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1052_080","year":2016,"roc_year":105,"session":"2","examNo":80,"q":"下列何者為中樞神經系統之dopaminergic D2受體活化後所產生之主要藥理作用？","opts":["A. 血管擴張造成血壓下降","B. 抑制神經內分泌之釋放","C. 造成中樞性之解熱鎮痛作用","D. 促進GABA之分泌"],"ans":1,"exp":"中樞神經系統（CNS）的多巴胺 D2 受體活化後，主要的藥理作用為抑制神經內分泌的釋放，特別是抑制垂體前葉泌乳素（prolactin）的分泌。多巴胺為生理性的「泌乳素抑制因子（prolactin-inhibiting factor）」，D2 受體活化可抑制 cAMP 生成，進而減少促性腺激素及泌乳素釋放。D2 拮抗劑（如 metoclopramide、butyrophenones）則可升高泌乳素。","we":["錯誤：血管擴張及血壓下降與外周多巴胺受體（D1/DA1 受體，位於腎臟及腸繫膜血管）有關，中樞 D2 受體活化的主要效應並非血管擴張；且 CNS D2 活化並非降血壓的主要機制。","","錯誤：中樞性解熱鎮痛作用主要與 COX 抑制、前列腺素合成減少有關（NSAIDs、acetaminophen），或涉及 μ-opioid 受體，與多巴胺 D2 受體無關。","錯誤：促進 GABA 分泌為 GABA 能神經系統的功能，多巴胺 D2 受體信號路徑（Gi 蛋白，抑制 cAMP）的主要作用並非直接促進 GABA 釋放。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_001","year":2017,"roc_year":106,"session":"1","examNo":1,"q":"肝臟的第二期生物轉換作用（phase II biotransformation）對藥物的影響為何？","opts":["A. 將藥物轉換為脂溶性較高的代謝物","B. 將藥物分解成分子量較小的代謝物","C. 使藥物和蛋白質結合，使其滯留於肝細胞中","D. 將藥物轉換成較容易被排除的代謝物"],"ans":3,"exp":"肝臟第二期生物轉換（Phase II biotransformation）主要透過結合反應（conjugation），包括葡萄醣醛酸化（glucuronidation）、硫酸化（sulfation）、乙醯化（acetylation）等，將藥物或其第一期代謝物與極性基團結合。此過程使代謝物極性增加、水溶性提高，更容易經由腎臟隨尿液或經由膽汁排除。因此第二期代謝的核心意義在於生成「較容易被排除的代謝物」。","we":["錯誤：第二期生物轉換的目的恰恰相反——是將藥物轉換為脂溶性較低、水溶性較高的代謝物，以利排泄；使藥物脂溶性增加的是第一期氧化反應的部分步驟，而非第二期。","錯誤：將藥物分解成分子量較小代謝物的是第一期生物轉換（如水解、氧化），第二期是「加上」極性基團，通常使分子量增大，而非縮小。","錯誤：藥物與蛋白質結合（protein binding）是藥物在血漿或組織中的分佈現象，與第二期生物轉換無直接關係；第二期反應是化學性結合（共價鍵），非蛋白質結合。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_002","year":2017,"roc_year":106,"session":"1","examNo":2,"q":"由公式「藥物分布容積 × 血漿藥物濃度」可以計算出：","opts":["A. 藥物之半衰期","B. 藥物之投藥劑量","C. 藥物之生體可利用率","D. 藥物之廓清率"],"ans":1,"exp":"藥物分布容積（Vd）的定義為：Vd＝劑量（Dose）／血漿藥物濃度（Cp）。因此反推，Vd × Cp＝劑量。當以單次靜脈注射後立即測量時，Cp代表初始血漿濃度，此乘積等於體內藥物總量，即投藥劑量。此公式是藥物動力學中估算體內藥量的基本關係式。","we":["錯誤：藥物半衰期的計算公式為 t½ ＝ 0.693 × Vd / CL（CL為廓清率），並非 Vd × Cp，兩者概念不同。","","錯誤：生體可利用率（bioavailability，F）為口服劑量到達體循環的比例，以AUC口服／AUC靜脈計算，與Vd × Cp無關。","錯誤：廓清率（CL）的單位為L/hr或mL/min，計算公式為CL ＝ Vd × ke（消除速率常數）或 CL ＝ Dose／AUC，不是Vd × Cp。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_003","year":2017,"roc_year":106,"session":"1","examNo":3,"q":"大多數作用於中樞神經系統的藥物如麻醉劑，也會對胎兒產生作用，其原因為何？","opts":["A. 藥物的排除較慢","B. 藥物與血漿蛋白的結合比率較低","C. 藥物的脂溶性較高，易穿過胎盤","D. 藥物的有效性（efficacy）較高"],"ans":2,"exp":"中樞神經藥物（如吸入性麻醉劑、鴉片類）之所以能穿過胎盤屏障影響胎兒，主要是因為這類藥物具有高脂溶性（high lipophilicity）且多以非離子型存在，可藉由被動擴散直接穿透胎盤滋養層細胞的脂質雙層膜。脂溶性越高，穿透生物膜的能力越強，包括血腦屏障和胎盤屏障。","we":["錯誤：藥物排除速率慢並非穿透胎盤的原因；排除慢會延長藥物作用時間，但要先能穿過胎盤才能對胎兒產生影響，穿透能力取決於理化性質而非排除速率。","錯誤：低蛋白結合率雖可增加游離藥物量，但游離藥物還需具備高脂溶性才能穿透胎盤；蛋白結合率低是穿透的「輔助因素」，並非「主因」。","","錯誤：有效性（efficacy）是指藥物與受體結合後產生最大效應的能力，屬於藥效動力學概念，與藥物能否穿越胎盤的藥物動力學性質無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_004","year":2017,"roc_year":106,"session":"1","examNo":4,"q":"藥物排除速率之單位為：","opts":["A. 毫克／小時","B. 公升／小時","C. 毫克•小時／公升","D. 為無單位之比值"],"ans":0,"exp":"藥物排除速率（elimination rate）是指單位時間內從體內消除的藥物量，其單位為「量／時間」，即毫克／小時（mg/hr）或μg/min等。這與廓清率（clearance，單位L/hr）的概念不同；廓清率代表單位時間內被「清除乾淨」的血漿體積，而非藥物量本身。","we":["","錯誤：公升／小時（L/hr）是廓清率（clearance）的單位，代表每小時從多少體積的血漿中完全清除藥物，而非藥物排除速率的單位。","錯誤：毫克•小時／公升（mg·h/L）是AUC（血漿濃度—時間曲線下面積）的單位，反映藥物暴露量，而非排除速率。","錯誤：無單位的比值通常代表生體可利用率（F）或比例性參數，排除速率必須有量綱（量/時間）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_005","year":2017,"roc_year":106,"session":"1","examNo":5,"q":"下列何者不適合經口投予以纖維素所製造之緩慢釋出之長效製劑？","opts":["A. 貓","B. 犬","C. 牛","D. 人"],"ans":2,"exp":"以纖維素（cellulose）製成的緩慢釋出製劑若經口投予牛（反芻動物），進入瘤胃後會被大量瘤胃微生物發酵分解，纖維素在到達小腸前即被破壞，藥物無法按設計速率釋出，導致劑型失效。貓、犬及人類為單胃動物，消化道不具此類微生物降解能力，故可正常使用此類製劑。","we":["錯誤：貓為肉食性單胃動物，消化道缺乏可大量降解纖維素的微生物，纖維素緩釋製劑可正常到達小腸發揮作用，不會在胃中被破壞。","錯誤：犬為雜食性單胃動物，同樣不具備瘤胃微生物環境，纖維素緩釋製劑不會在胃中被降解，可正常使用。","","錯誤：人類為單胃動物，雖然大腸中有部分細菌可發酵纖維，但小腸吸收段並無大量纖維素酶，口服纖維素緩釋製劑可順利通過小腸緩慢釋藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_006","year":2017,"roc_year":106,"session":"1","examNo":6,"q":"下列有關G蛋白偶合受體（G protein-coupled receptors）之訊息傳導的敘述，何者正確？","opts":["A. 反應速度是各類受體中最快的","B. 不會影響細胞內鉀離子的濃度","C. 不會影響鈣離子通道的開啟","D. G蛋白的活化具有放大訊息的效果"],"ans":3,"exp":"G蛋白偶合受體（GPCR）的訊息傳導具有放大效應（signal amplification）：一個受體活化後可依序活化多個G蛋白，每個G蛋白再活化多個效應酶（如adenylyl cyclase），產生大量第二傳訊者（如cAMP），從而放大最初的訊號。GPCR的反應速度居中——比離子通道型受體（毫秒級）慢，但比核受體（數小時）快（數秒至數分鐘）。","we":["錯誤：反應速度最快的是配體門控離子通道（ligand-gated ion channels），其訊號傳遞以毫秒計；GPCR屬於中等速度（秒至分鐘），並非各類受體中最快的。","錯誤：GPCR確實會影響細胞內鉀離子濃度，例如Gi蛋白偶合受體活化後可直接開啟心肌細胞的內向整流K⁺通道（IKACh），造成細胞過極化，使心跳減慢。","錯誤：GPCR會影響鈣離子通道，例如Gs偶合受體活化adenylyl cyclase→cAMP增加→PKA活化→L型Ca²⁺通道磷酸化開啟；Gq路徑產生IP₃亦可釋放胞內Ca²⁺。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_007","year":2017,"roc_year":106,"session":"1","examNo":7,"q":"對受體具有親和力（affinity），但是無法產生受體的內在活性（intrinsic activity）的藥物稱為：","opts":["A. 全致效劑（full agonist）","B. 部分致效劑（partial agonist）","C. 反致效劑（inverse agonist）","D. 拮抗劑（antagonist）"],"ans":3,"exp":"拮抗劑（antagonist）的定義是：對受體有親和力（affinity，能與受體結合），但沒有內在活性（intrinsic activity＝0），因此結合後不會激活受體、不產生生理效應。拮抗劑透過佔據受體位點來阻止致效劑發揮作用。若具有親和力且有完整內在活性（intrinsic activity＝1）為全致效劑；部分內在活性（0＜IA＜1）為部分致效劑；負內在活性（IA＜0）為反致效劑。","we":["錯誤：全致效劑（full agonist）不僅對受體有親和力，還能產生完整的內在活性（intrinsic activity＝1），引發最大生理效應，與題目描述「無內在活性」不符。","錯誤：部分致效劑（partial agonist）具有親和力且有部分內在活性（0＜IA＜1），即使飽和結合也只能產生次最大效應，並非完全無內在活性。","錯誤：反致效劑（inverse agonist）具有親和力，但其內在活性為負值（IA＜0），會將受體穩定在非活化構形，減低基礎活性，而非「無內在活性」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_008","year":2017,"roc_year":106,"session":"1","examNo":8,"q":"下列何者為合成的伽瑪-胺基丁酸致效劑，主要作用為抑制電位依賴的鈣離子通道，減少神經鈣離子量，進而抑制神經傳導物質\r 的釋放？","opts":["A. gabapentin","B. felbamate","C. midazolam","D. lorazepam"],"ans":0,"exp":"Gabapentin是合成的GABA類似物，但其作用機制並非直接作用於GABA受體，而是與電位依賴鈣離子通道的α2δ次單位結合，抑制神經末梢的Ca²⁺內流，從而減少興奮性神經傳導物質（如麩胺酸、P物質）的釋放，產生抗癲癇及鎮痛效果。Felbamate為麩胺酸受體拮抗劑；midazolam與lorazepam屬苯二氮平類，作用於GABA-A受體的苯二氮平結合位。","we":["","錯誤：Felbamate屬於新型抗癲癇藥，其主要機制為拮抗NMDA型麩胺酸受體並增強GABA-A受體活性，並非合成GABA致效劑，亦不以抑制鈣離子通道為主要機制。","錯誤：Midazolam為苯二氮平類藥物，作用於GABA-A受體上的苯二氮平結合位，增加Cl⁻通道開啟頻率，使細胞過極化；其機制與鈣離子通道無關。","錯誤：Lorazepam同為苯二氮平類，與midazolam作用機制相似，同樣是增強GABA-A受體功能，並非合成GABA致效劑也非抑制鈣離子通道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_009","year":2017,"roc_year":106,"session":"1","examNo":9,"q":"關於類鴉片物質的敘述，下列何者錯誤？","opts":["A. 止痛作用發生在大腦、脊髓，以及有可能在周邊","B. µ受體致效劑引起顯著的止痛","C. µ受體和κ受體媒介的周邊血管收縮造成高血壓","D. 經由刺激中樞（如µ）和周邊（如κ和µ）受體，引起止瀉作用和便秘"],"ans":2,"exp":"此題為「何者錯誤」題。類鴉片物質（opioids）作用於周邊血管時，主要透過促進組織胺釋放及降低交感神經張力，引起周邊血管擴張，導致低血壓（hypotension），而非血管收縮造成高血壓。選項C所述「µ受體和κ受體媒介的周邊血管收縮造成高血壓」與實際藥理作用相反，故為錯誤敘述。","we":["此為正確描述：類鴉片物質的止痛作用確實發生在大腦（如PAG）、脊髓（後角）以及周邊組織（如發炎部位的周邊傷害受器），不符合題目問的「錯誤」描述。","此為正確描述：µ受體致效劑（如morphine）確實能引起顯著的中樞及脊髓層次止痛效果，是臨床上最重要的鎮痛機制，不符合題目問的「錯誤」描述。","","此為正確描述：類鴉片物質透過作用於腸道µ受體和κ受體，減少腸蠕動、增加腸道張力，從而引起止瀉作用和便秘，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_010","year":2017,"roc_year":106,"session":"1","examNo":10,"q":"下列何者不屬於解離性麻醉劑（dissociative anesthetics）？","opts":["A. ketamine","B. phencyclidine","C. tiletamine","D. chlorpheniramine"],"ans":3,"exp":"此題為「不屬於」題。解離性麻醉劑（dissociative anesthetics）是指能造成感覺分離（感覺與意識分離）的藥物，其機制主要為拮抗NMDA麩胺酸受體，代表藥物包括ketamine、phencyclidine（PCP）和tiletamine。Chlorpheniramine為第一代H1抗組織胺藥，具有鎮靜與抗膽鹼作用，與解離性麻醉完全無關。","we":["此為正確描述：Ketamine是臨床上最常用的解離性麻醉劑，透過拮抗NMDA受體產生解離麻醉效果，屬於解離性麻醉劑，不符合題目問的「不屬於」描述。","此為正確描述：Phencyclidine（PCP）是最早被研發的解離性麻醉劑之一，同樣拮抗NMDA受體，屬於解離性麻醉劑，不符合題目問的「不屬於」描述。","此為正確描述：Tiletamine常與zolazepam合併使用（Telazol/Zoletil），為獸醫臨床常用的解離性麻醉劑，屬於解離性麻醉劑，不符合題目問的「不屬於」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_011","year":2017,"roc_year":106,"session":"1","examNo":11,"q":"對於手術後的止痛而言，下列何者藥效最佳？","opts":["A. acepromazine","B. propofol","C. morphine","D. diazepam"],"ans":2,"exp":"Morphine為强效µ-鴉片受體致效劑，是術後鎮痛的金標準藥物，可有效緩解中至重度疼痛。Acepromazine為酚噻嗪類鎮靜劑，本身無鎮痛活性；propofol為靜脈麻醉劑，停藥後意識恢復但無持續鎮痛效果；diazepam為苯二氮平類抗焦慮肌肉鬆弛藥，亦無實質止痛效果。","we":["錯誤：Acepromazine為酚噻嗪類（phenothiazine）鎮靜劑，主要作用為鎮靜、降低焦慮及止吐，本身完全不具有鎮痛活性，不適合作為術後止痛藥物。","錯誤：Propofol為靜脈全身麻醉誘導及維持劑，雖能在麻醉期間消除意識感受，但本身無鎮痛特性，麻醉恢復後無持續止痛效果，不適合用於術後疼痛管理。","","錯誤：Diazepam為苯二氮平類藥物，具有抗焦慮、肌肉鬆弛及抗癲癇作用，但無顯著鎮痛活性，不能有效控制術後疼痛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_012","year":2017,"roc_year":106,"session":"1","examNo":12,"q":"使用morphine而造成尿液生成減少的主因為何？","opts":["A. 腎臟分泌作用減少","B. 腎絲球體濾過量減少","C. 腎素（renin）分泌減少","D. 抗利尿激素（ADH）分泌增加"],"ans":3,"exp":"Morphine會刺激下視丘－腦垂腺後葉軸，促進抗利尿激素（ADH，又稱vasopressin）的分泌增加。ADH作用於腎臟集尿管的V2受體，促進水分重吸收，導致尿液濃縮、尿量減少（抗利尿效應）。此為morphine對腎臟最重要的間接影響機制。","we":["錯誤：腎臟分泌作用減少並非morphine影響尿量的主要機制；morphine主要透過增加ADH分泌來影響水分代謝，而非直接抑制腎小管分泌。","錯誤：Morphine在治療劑量下不會顯著降低腎絲球體濾過率（GFR）；GFR受腎臟血流量調控，morphine主要影響的是集尿管的水重吸收，而非過濾。","錯誤：腎素分泌減少並非morphine的主要作用；腎素分泌主要受血壓、交感神經及腎小管感知機制調控，morphine影響尿量的關鍵在於ADH路徑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_013","year":2017,"roc_year":106,"session":"1","examNo":13,"q":"下列有關guaifenesin的敘述中，何者錯誤？","opts":["A. 使肌肉鬆弛的作用機制與succinylcholine相似","B. 靜脈注射為最佳投藥方法","C. 投予治療劑量多不會造成肋間肌麻痺","D. 投予治療劑量多不會造成橫隔膜麻痺"],"ans":0,"exp":"此題為「何者錯誤」題。Guaifenesin是中樞性肌肉鬆弛劑，作用機制為抑制脊髓中間神經元（interneurons）的傳遞，屬中樞性（centrally acting）肌肉鬆弛劑，而非周邊性神經肌肉阻斷劑。Succinylcholine是去極化型神經肌肉接頭阻斷劑（peripherally acting depolarizing NMJ blocker），兩者作用機制根本不同，選項A的類比錯誤。","we":["","此為正確描述：Guaifenesin靜脈注射（IV）確實是最常用且最佳的給藥途徑，可產生平穩的肌肉鬆弛效果，常用於大動物麻醉誘導，不符合題目問的「錯誤」描述。","此為正確描述：在治療劑量下，guaifenesin主要鬆弛四肢及軀幹的骨骼肌，肋間肌（intercostal muscles）對其相對不敏感，需要更高劑量才會受影響，不符合題目問的「錯誤」描述。","此為正確描述：橫隔膜（diaphragm）同樣對guaifenesin的治療劑量相對抵抗，需要更高劑量才會造成橫隔膜麻痺，在治療劑量下呼吸多不受明顯影響，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_014","year":2017,"roc_year":106,"session":"1","examNo":14,"q":"吸入性麻醉劑之化學結構，若以氟取代氯或溴則其影響主要為：","opts":["A. 穩定性降低但麻醉效力增加","B. 穩定性及麻醉效力均降低","C. 穩定性及麻醉效力均增加","D. 穩定性增加但麻醉效力降低"],"ans":3,"exp":"在吸入性麻醉劑的化學結構中，以氟（F）取代氯（Cl）或溴（Br）後，分子的化學穩定性顯著增加（C-F鍵鍵能強），不易被代謝降解，使麻醉劑更安全耐用。然而，根據Meyer-Overton脂溶性理論，氟的脂溶性低於氯和溴，取代後麻醉效力（potency）反而降低，需要更高的MAC（最低肺泡麻醉濃度）才能達到麻醉效果。","we":["錯誤：以氟取代氯/溴後，化學穩定性確實增加（C-F鍵很穩定），但麻醉效力因脂溶性降低而減弱，而非增加，兩個方向描述顛倒。","錯誤：穩定性並不降低——氟取代後的分子對代謝更具抗性、更穩定；只有麻醉效力（potency）降低，穩定性與效力不會同時降低。","錯誤：穩定性和麻醉效力不會同時增加；穩定性增加是正確的，但麻醉效力因脂溶性下降而降低，兩者變化方向相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_015","year":2017,"roc_year":106,"session":"1","examNo":15,"q":"Pentobarbital之作用機制，主要為開啟下列那一離子通道，增加其通透性？","opts":["A. Na+","B. K +","C. Ca++","D. Cl-"],"ans":3,"exp":"Pentobarbital屬巴比妥酸鹽類（barbiturates），其作用機制為正向調控GABA-A受體——在GABA-A受體上有獨立的巴比妥結合位，結合後可延長Cl⁻通道開啟時間（延長開放時間，有別於苯二氮平增加開啟頻率），增加Cl⁻通透性，使細胞膜過極化，產生中樞神經抑制作用（鎮靜、催眠、麻醉）。","we":["錯誤：開啟Na⁺通道（去極化）是興奮性效應，巴比妥酸鹽的作用恰好相反——是增加抑制性Cl⁻通透性使細胞過極化，開啟Na⁺通道會導致神經興奮，非鎮靜麻醉。","錯誤：開啟K⁺通道雖然也有過極化效果，但Pentobarbital主要針對的是GABA-A受體上的Cl⁻通道，K⁺通道並非其主要作用目標。","錯誤：Pentobarbital不作用於Ca²⁺通道；抑制Ca²⁺通道是鈣離子拮抗劑（如verapamil）的機制，與巴比妥酸鹽的GABA-A/Cl⁻通道機制不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_016","year":2017,"roc_year":106,"session":"1","examNo":16,"q":"臨床上對低血量之動物使用acepromazine時，最可能產生之不良反應主要為：","opts":["A. 中樞神經興奮狂躁","B. 心律不整","C. 呼吸抑制","D. 造成低血壓"],"ans":3,"exp":"Acepromazine為α1-腎上腺素受體阻斷劑，可引起血管擴張及血壓下降。在血容量正常的動物，代償機制（心跳加速、血管收縮）可部分對抗此效應；但低血量（hypovolemia）動物的代償儲備已耗盡，使用acepromazine後會導致嚴重且難以控制的低血壓（profound hypotension），可能危及生命，故低血量動物為acepromazine的使用禁忌。","we":["錯誤：Acepromazine具有中樞神經抑制作用，不會引起CNS興奮狂躁；中樞興奮反應多見於苯丙胺類、可卡因或某些全身麻醉誘導的興奮期，而非acepromazine的副作用。","錯誤：Acepromazine對心律不整的風險較低；雖然曾有報告指出可能使特定品種犬隻對心室纖維性顫動敏感，但在低血量動物中最主要的威脅是嚴重低血壓，而非心律不整。","錯誤：Acepromazine對呼吸的直接抑制效應相對輕微，呼吸抑制不是其在低血量動物中最需擔心的問題；嚴重低血壓才是使用禁忌的主要原因。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_017","year":2017,"roc_year":106,"session":"1","examNo":17,"q":"臨床使用verapamil以拮抗心律不整之主要作用機制為：","opts":["A. 關閉K +離子通道","B. 阻斷Na+離子通道","C. 阻斷Ca++離子通道","D. 開啟Cl-離子通道"],"ans":2,"exp":"Verapamil屬於第IV類抗心律不整藥（Class IV antiarrhythmics），為L型電壓依賴鈣離子通道阻斷劑。心臟竇房結（SA node）和房室結（AV node）的去極化主要依賴L型Ca²⁺通道，verapamil阻斷此通道後可減慢SA結的自律性放電和AV結的傳導速度，從而治療室上性心律不整（如PSVT、心房顫動合併快速心室反應）。","we":["錯誤：關閉K⁺離子通道會使細胞膜難以復極化，延長動作電位時間，是第III類抗心律不整藥（如sotalol、amiodarone）的作用，而非verapamil的機制。","錯誤：阻斷Na⁺離子通道（減慢0相去極化速率）是第I類抗心律不整藥（如procainamide、lidocaine）的作用機制，verapamil不作用於Na⁺通道。","","錯誤：開啟Cl⁻離子通道不是任何主要抗心律不整藥的作用機制；Cl⁻電流在心臟動作電位中扮演次要角色，且開啟Cl⁻通道不會產生與verapamil相似的抗心律不整效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_018","year":2017,"roc_year":106,"session":"1","examNo":18,"q":"下列何者為具有增加尿鈣排除之作用而被使用於治療犬、貓之高血鈣症？","opts":["A. spironolactone","B. furosemide","C. acetazolamide","D. hydrochlorothiazide"],"ans":1,"exp":"Furosemide為亨利氏環（Loop of Henle）利尿劑，作用於亨利氏環厚上升支，阻斷Na⁺-K⁺-2Cl⁻共同轉運體（NKCC2）。此外，furosemide會顯著增加尿鈣（Ca²⁺）的排泄，因為正常情況下厚上升支的腔面電位差（lumen-positive potential）可驅動Ca²⁺重吸收，furosemide阻斷後此電位差消失，Ca²⁺隨之流失，故可用於治療犬貓的高血鈣症（hypercalcemia）。","we":["錯誤：Spironolactone為醛固酮（aldosterone）拮抗劑，作用於集尿管，主要影響Na⁺、K⁺和H⁺的交換，不會顯著增加尿鈣排泄，不用於治療高血鈣。","","錯誤：Acetazolamide為碳酸酐酶抑制劑，主要增加HCO₃⁻和Na⁺的排泄，對鈣的排泄無顯著促進作用，且可能間接促進鈣的重吸收，不用於治療高血鈣症。","錯誤：Hydrochlorothiazide（噻嗪類利尿劑）作用相反——它會減少尿鈣排泄（增加Ca²⁺重吸收），實際上用於治療腎結石（高尿鈣症），而非高血鈣症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_019","year":2017,"roc_year":106,"session":"1","examNo":19,"q":"下列何者為acetazolamide對腎小管細胞之主要影響？","opts":["A. 促進K +之分泌","B. 抑制Na+離子之排除","C. 促進Ca++之重吸收","D. 抑制H +離子之產生"],"ans":3,"exp":"Acetazolamide為碳酸酐酶（carbonic anhydrase，CA）抑制劑。在腎小管細胞內，CA催化反應：CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻，提供H⁺用於Na⁺-H⁺交換（重吸收Na⁺同時分泌H⁺）。Acetazolamide抑制CA後，H⁺產生減少，Na⁺-H⁺交換受阻，導致NaHCO₃大量隨尿排出，形成鹼性利尿。","we":["錯誤：促進K⁺分泌是acetazolamide的次要效應（繼發於Na⁺重吸收減少後的遠端小管補償性K⁺丟失），並非腎小管細胞受抑制的「主要直接影響」，且本身仍屬正確敘述而非抑制H⁺產生那樣的核心機制。","錯誤：Acetazolamide抑制CA後，Na⁺重吸收減少（Na⁺排泄增加），而非「抑制Na⁺排除」；此藥具有利尿作用，正是因為Na⁺和HCO₃⁻排泄增加。","錯誤：Acetazolamide對Ca²⁺的作用為促進Ca²⁺排泄（輕度），而非促進重吸收；噻嗪類利尿劑才是促進Ca²⁺重吸收的藥物，兩者效果相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_020","year":2017,"roc_year":106,"session":"1","examNo":20,"q":"下列何者為digoxin增強心肌收縮力之主要原因？","opts":["A. 增加心肌蛋白收縮時可利用之Ca++濃度","B. 抑制Mg++對心肌蛋白收縮之影響","C. 關閉K +通道促進心肌纖維之去極化（depolarization）","D. 開啟Na+通道，增加心肌之興奮性"],"ans":0,"exp":"Digoxin藉由抑制心肌細胞膜上的Na⁺/K⁺-ATPase（鈉鉀泵），使細胞內Na⁺濃度升高。高Na⁺減少了Na⁺/Ca²⁺交換體（NCX）將Ca²⁺排出細胞的驅動力，致使細胞內Ca²⁺蓄積增加。增多的胞內Ca²⁺觸發肌漿網釋放更多Ca²⁺（calcium-induced calcium release），最終使收縮蛋白可利用的Ca²⁺增加，增強心肌收縮力（正性肌力作用）。","we":["","錯誤：Digoxin的正性肌力作用與Mg²⁺無關；Mg²⁺在心肌中主要作為Na⁺/K⁺-ATPase的輔助因子和穩定劑，抑制Mg²⁺對收縮蛋白的影響並非digoxin的作用機制。","錯誤：Digoxin不透過關閉K⁺通道增加收縮力；雖然抑制Na⁺/K⁺-ATPase會導致胞內K⁺略下降，但這是副效應，增強收縮力的核心機制是透過Ca²⁺蓄積，而非K⁺通道。","錯誤：Digoxin不開啟Na⁺通道；它是抑制Na⁺/K⁺-ATPase（泵），而非激活Na⁺通道；開啟Na⁺通道屬於抗心律不整藥（如某些毒素）的機制，與digoxin相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_021","year":2017,"roc_year":106,"session":"1","examNo":21,"q":"下列何者為prazosin血管擴張作用的機制？","opts":["A. 增加細胞內cGMP之含量","B. 競爭性阻斷α1 -adrenergic receptor","C. 抑制phosphodiesterase","D. 抑制angiotensin-converting enzyme"],"ans":1,"exp":"Prazosin為選擇性α1-腎上腺素受體競爭性拮抗劑，阻斷血管平滑肌上的α1受體後，交感神經無法驅動血管收縮，導致小動脈和靜脈擴張，降低周邊血管阻力，從而降低血壓。此機制有別於其他血管擴張藥物，如硝酸鹽類（增加cGMP）、PDE抑制劑（阻止cGMP降解）或ACEI（阻斷ACE）。","we":["錯誤：增加細胞內cGMP含量是有機硝酸鹽類（如nitroglycerin）和一氧化氮（NO）的血管擴張機制，透過活化guanylyl cyclase產生cGMP使血管平滑肌鬆弛，而非prazosin的作用方式。","","錯誤：抑制phosphodiesterase（PDE）可防止cGMP或cAMP降解，延長血管擴張效果，是sildenafil（PDE5抑制劑）或amrinone（PDE3抑制劑）的機制，與prazosin的受體拮抗機制不同。","錯誤：抑制血管張力素轉化酶（ACE）是ACEI類藥物（如enalapril、captopril）的降壓機制，透過減少血管張力素II的生成及增加緩激肽來擴張血管，與prazosin的α1受體阻斷機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_022","year":2017,"roc_year":106,"session":"1","examNo":22,"q":"利尿效果最強的藥物是：","opts":["A. furosemide","B. chlorothiazide","C. indapamide","D. acetazolamide"],"ans":0,"exp":"Furosemide為亨利氏環利尿劑（loop diuretic），作用於亨利氏環厚上升支，阻斷Na⁺-K⁺-2Cl⁻共同轉運體（NKCC2）。亨利氏環厚上升支負責重吸收大量（約25%）的濾出Na⁺，furosemide阻斷後利尿效果最強。相比之下，噻嗪類（如chlorothiazide、indapamide）僅影響遠端小管（約5-8%）；acetazolamide影響近端小管（約5%），利尿效果最弱。","we":["","錯誤：Chlorothiazide為噻嗪類利尿劑，作用於遠端曲小管，阻斷Na⁺-Cl⁻共同轉運體（NCC），利尿效果屬中等強度，遠不及furosemide作用的亨利氏環。","錯誤：Indapamide為噻嗪類似利尿劑，作用機制與chlorothiazide相似，作用於遠端小管，利尿效果同屬中等，不是最強的利尿劑。","錯誤：Acetazolamide為碳酸酐酶抑制劑，影響近端小管的Na⁺-H⁺交換，雖可增加Na⁺和HCO₃⁻排泄，但利尿效果在各類利尿劑中最弱，常作為輔助用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_023","year":2017,"roc_year":106,"session":"1","examNo":23,"q":"下列何者能降低交感神經對心肌的興奮作用，亦能作為抗心律不整藥？","opts":["A. atenolol","B. sotalol","C. procainamide","D. amiodarone"],"ans":0,"exp":"Atenolol為選擇性β1-腎上腺素受體阻斷劑，藉由阻斷心肌β1受體，降低交感神經對心肌的興奮性刺激（減慢心跳、降低心肌收縮力），同時具有抗心律不整效果（第II類抗心律不整藥），適用於竇性心跳過速及室上性心律不整。Sotalol雖也是β阻斷劑，但同時具有K⁺通道阻斷作用（兼具Class III），機制較複雜；procainamide為Na⁺通道阻斷劑（Class Ia）；amiodarone為多離子通道阻斷劑（主要Class III）。","we":["","錯誤：Sotalol雖具有β受體阻斷活性（可降低交感對心肌的刺激），但它同時阻斷延遲整流K⁺通道（IKr），使動作電位時間延長（Class III特性），因此機制比單純β阻斷劑atenolol更複雜，不符合題目「降低交感刺激」的單純描述。","錯誤：Procainamide為第Ia類抗心律不整藥，主要作用為阻斷心肌Na⁺離子通道，延緩去極化速率；它並不具有拮抗交感神經對心肌興奮作用的β受體阻斷機制。","錯誤：Amiodarone為多效抗心律不整藥（Class III為主），主要阻斷K⁺通道延長動作電位時間；雖也有β受體阻斷效果，但其主要分類和首要機制並非β受體阻斷，且其副作用多、不以「降低交感刺激」為最主要描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_024","year":2017,"roc_year":106,"session":"1","examNo":24,"q":"動物體內維持酸鹼平衡的緩衝系統中，以何者最重要？","opts":["A. 蛋白質系","B. 磷酸系","C. 血紅素系","D. 碳酸系"],"ans":3,"exp":"動物體內維持酸鹼平衡的緩衝系統以碳酸/碳酸氫鈉系（HCO₃⁻/H₂CO₃）最為重要，原因包括：（1）緩衝容量大，HCO₃⁻血漿濃度約24 mEq/L；（2）肺臟可快速調節CO₂（酸）的排放；（3）腎臟可精確調節HCO₃⁻的重吸收與排泄。臨床上血液氣體分析也以此系統為基礎評估酸鹼狀態。磷酸系、蛋白質系和血紅素系雖存在，但緩衝量及調節靈活性均不及碳酸系。","we":["錯誤：蛋白質緩衝系統（尤其是血漿蛋白）雖有一定緩衝容量，但其主要作用在細胞內，臨床上難以像碳酸系統那樣被快速調節，且緩衝量在細胞外液中不及碳酸系統。","錯誤：磷酸緩衝系統（HPO₄²⁻/H₂PO₄⁻）在細胞內和尿液中發揮重要作用，但在血漿中濃度較低（約1 mEq/L），緩衝容量遠不及碳酸系統，臨床重要性相對次要。","錯誤：血紅素緩衝系統對紅血球內CO₂運輸和酸鹼緩衝確實很重要，但限於紅血球內，無法代表全身體液的主要酸鹼緩衝系統；碳酸系統覆蓋全身細胞外液。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_025","year":2017,"roc_year":106,"session":"1","examNo":25,"q":"下列何者最適合用於治療青光眼？","opts":["A. acetazolamide","B. furosemide","C. amiloride","D. hydrochlorothiazide"],"ans":0,"exp":"Acetazolamide為碳酸酐酶抑制劑，在眼睛的睫狀體（ciliary body）中，碳酸酐酶催化房水（aqueous humor）中HCO₃⁻的生成，是房水形成的重要步驟。Acetazolamide抑制此酶後，房水生成減少，眼內壓（IOP）降低，可用於治療青光眼。此為其與利尿作用相同的酶抑制機制，但作用在眼睛而非腎臟。","we":["","錯誤：Furosemide為亨利氏環利尿劑，雖可增加尿液排出減少體液，但不能有效降低眼內壓；青光眼的治療需要針對房水的生成或排出機制，furosemide並不作用於睫狀體的房水生成。","錯誤：Amiloride為保鉀利尿劑，阻斷集尿管的Na⁺通道（ENaC），主要用於水腫及高血壓，對眼內壓沒有顯著作用，不適用於治療青光眼。","錯誤：Hydrochlorothiazide為噻嗪類利尿劑，作用於遠端小管，對眼內壓無直接影響；雖然全身脫水可能略降低IOP，但這不是其治療青光眼的適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_026","year":2017,"roc_year":106,"session":"1","examNo":26,"q":"可抑制phospholipase A2的生化反應而降低呼吸道炎症反應的藥物是：","opts":["A. fluticasone","B. zafirlukast","C. aspirin","D. chlorpheniramine"],"ans":0,"exp":"Fluticasone為吸入性糖皮質素（inhaled glucocorticoid），其抗炎機制包括抑制磷脂酶A2（phospholipase A2），阻斷花生四烯酸（arachidonic acid）從細胞膜磷脂中釋放。由於花生四烯酸是前列腺素（prostaglandins）和白三烯素（leukotrienes）的共同前驅物，此一上游阻斷可同時減少兩類炎性介質，全面抑制呼吸道炎症。","we":["","錯誤：Zafirlukast為白三烯素受體拮抗劑（leukotriene receptor antagonist，LTRA），阻斷CysLT1受體，僅針對已生成的白三烯素發揮抗炎效果，不影響磷脂酶A2或前列腺素的生成。","錯誤：Aspirin抑制的是環氧化酶（COX-1和COX-2），阻斷前列腺素和血栓素的合成，但不影響磷脂酶A2，因此白三烯素的生成路徑不受aspirin阻斷，甚至可能因花生四烯酸轉向脂氧化酶路徑而增加白三烯素生成。","錯誤：Chlorpheniramine為第一代H1組織胺受體拮抗劑，阻斷組織胺的效應，無法抑制磷脂酶A2，對前列腺素和白三烯素的生成無直接影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_027","year":2017,"roc_year":106,"session":"1","examNo":27,"q":"下列何者最適合用於治療犬貓因motion sickness引起的嘔吐？","opts":["A. diphenhydramine","B. cisapride","C. metoclopramide","D. acepromazine"],"ans":0,"exp":"動暈症（motion sickness）的嘔吐主要由前庭神經系統（vestibular system）誘發，透過H1組織胺受體和毒蕈素M1受體傳遞訊號至嘔吐中樞。Diphenhydramine為第一代H1抗組織胺藥，同時具有抗膽鹼（抗M受體）及前庭抑制效果，可有效預防及治療動暈症引起的嘔吐，是獸醫臨床治療犬貓動暈症的常用藥物。","we":["","錯誤：Cisapride為促腸動力藥（prokinetic），作用為5-HT4受體致效劑，可增強消化道蠕動，主要用於胃輕癱或便秘，對動暈症引起的前庭性嘔吐無效。","錯誤：Metoclopramide為D2受體拮抗劑兼弱5-HT4致效劑，主要作用於化學感受觸發區（CRTZ）和胃腸道，對化療、尿毒症等引起的嘔吐有效，但對前庭性（動暈症）嘔吐效果有限。","錯誤：Acepromazine為酚噻嗪類鎮靜劑，雖具有一些止吐效果（D2拮抗），但主要為鎮靜而非針對前庭性嘔吐的特異性治療；且acepromazine的強力鎮靜副作用使其不是動暈症的首選藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_028","year":2017,"roc_year":106,"session":"1","examNo":28,"q":"下列何者最有可能影響雄性動物的生殖能力？","opts":["A. cimetidine","B. famotidine","C. nizatidine","D. ranitidine"],"ans":0,"exp":"Cimetidine為H2受體拮抗劑，除了抑制胃酸分泌外，其特殊副作用是具有抗雄性素（anti-androgenic）效應——它能與雄性素受體（androgen receptor）結合，阻斷雄性素（testosterone、DHT）的作用，導致性慾減退、勃起功能障礙、精子活性下降甚至男性女乳症（gynecomastia）。其他H2拮抗劑（famotidine、nizatidine、ranitidine）則不具此抗雄性素特性。","we":["","錯誤：Famotidine為H2受體拮抗劑，抑制胃酸的效果強於cimetidine，但其分子結構不具與雄性素受體結合的能力，無抗雄性素副作用，不影響雄性動物生殖能力。","錯誤：Nizatidine同為H2拮抗劑，不具備cimetidine那種與雄性素受體結合的化學結構特性，無抗雄性素效應，對雄性生殖能力無明顯影響。","錯誤：Ranitidine雖含呋喃環結構（與cimetidine的咪唑環不同），臨床上未見明顯抗雄性素副作用，不會顯著影響雄性動物的生殖能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_029","year":2017,"roc_year":106,"session":"1","examNo":29,"q":"下列何者可經生物轉換產生5-aminosalicylic acid？","opts":["A. sulfasalazine","B. sulfaquinoxaline","C. sulfadimethoxine","D. sulfamethazine"],"ans":0,"exp":"Sulfasalazine（磺胺水楊酸）是一種前驅藥物（prodrug），口服後在腸道中被腸道細菌的偶氮還原酶（azoreductase）分解，裂解偶氮鍵（azo bond），產生5-氨基水楊酸（5-ASA，mesalamine，具有抗炎活性）和磺胺吡啶（sulfapyridine，抗菌）。5-ASA是其在大腸炎症部位發揮抗炎效果的活性成分，廣泛用於犬的大腸炎治療。","we":["","錯誤：Sulfaquinoxaline為磺胺類抗球蟲藥，主要用於禽類球蟲病的防治，其代謝途徑不會產生5-aminosalicylic acid，結構中無偶氮鍵供腸道菌裂解。","錯誤：Sulfadimethoxine為長效磺胺類抗菌藥，常用於多種細菌感染及球蟲感染，其化學結構不含偶氮鍵，代謝後不會生成5-ASA。","錯誤：Sulfamethazine（磺胺二甲嘧啶）為常用磺胺類抗菌藥，用於多種畜禽感染，其結構中無偶氮鍵，不能被腸道菌裂解為5-aminosalicylic acid。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_030","year":2017,"roc_year":106,"session":"1","examNo":30,"q":"動物長期經口投予抗生素導致維生素K缺乏的原因為何？","opts":["A. 抗生素影響腸道細胞吸收維生素K","B. 抗生素影響腸內細菌製造維生素K","C. 抗生素和維生素K結合，干擾其吸收","D. 抗藥性腸內菌大量增生，消耗大量的維生素K"],"ans":1,"exp":"動物腸道菌群（正常菌叢）能合成維生素K₂（menaquinone），為宿主維生素K的來源之一。長期口服抗生素大量殺滅腸道細菌後，維生素K₂的微生物合成量大減，若飲食中維生素K₁攝取不足，即可能導致維生素K缺乏。維生素K缺乏會影響凝血因子（II、VII、IX、X）的羧化活化，造成凝血功能障礙。","we":["錯誤：抗生素對腸道上皮細胞的吸收功能影響有限，且维生素K的吸收依賴脂溶性吸收途徑，並非腸道細菌直接負責吸收；缺乏的主要原因是細菌產生量減少，而非腸道吸收功能被抑制。","","錯誤：抗生素分子與維生素K並不直接發生化學結合反應；抗生素的主要目標是細菌細胞的特定靶點（如細胞壁合成、蛋白質合成），與維生素K分子無親和性。","錯誤：抗藥性菌株大量繁殖後並不會消耗宿主的維生素K；細菌本身的繁殖代謝不以宿主維生素K作為「燃料」或基質，此機制在藥理學上缺乏依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_031","year":2017,"roc_year":106,"session":"1","examNo":31,"q":"下列何者中毒時，可使用維生素K來解毒？","opts":["A. warfarin","B. nitrite","C. methylene blue","D. chlorate"],"ans":0,"exp":"Warfarin為維生素K拮抗劑，透過抑制維生素K環氧化物還原酶（VKOR），阻斷維生素K的循環利用，使維生素K依賴性凝血因子（II、VII、IX、X）無法γ-羧化活化，導致凝血障礙。治療warfarin中毒（或滅鼠藥中毒如brodifacoum）時，補充大量維生素K可競爭性恢復凝血因子的活化，為特異性解毒劑。","we":["","錯誤：Nitrite（亞硝酸鹽）中毒使血紅素中的Fe²⁺氧化為Fe³⁺，形成變性血色素（methemoglobin），治療應使用methylene blue（亞甲基藍）加sodium thiosulfate（硫代硫酸鈉），而非維生素K。","錯誤：Methylene blue本身是氧化劑，大量使用可能引起變性血色素血症；若因此中毒則需使用維生素C（ascorbic acid）或硫代硫酸鈉解毒，而非維生素K，概念方向相反。","錯誤：Chlorate（氯酸鹽）為強氧化劑，同樣可引起變性血色素血症及溶血，治療以維生素C和硫代硫酸鈉為主；維生素K對氧化性中毒無解毒效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_032","year":2017,"roc_year":106,"session":"1","examNo":32,"q":"下列有關止吐劑ondansetron的敘述，何者錯誤？","opts":["A. 對動暈症（motion sickness）的嘔吐有效","B. 作用於周邊和中樞的5-HT3受體","C. 對cisplatin引起的嘔吐有效","D. 對放射線治療引起的嘔吐有效"],"ans":0,"exp":"此題為「何者錯誤」題。Ondansetron為選擇性5-HT3受體拮抗劑，對化療（如cisplatin）和放射線治療引起的嘔吐（透過腸道及CRTZ的5-HT3受體）有效。但動暈症（motion sickness）的嘔吐主要由前庭系統的H1組織胺受體和毒蕈素M1受體介導，與5-HT3無關，因此ondansetron對動暈症引起的嘔吐無效，選項A的描述錯誤。","we":["","此為正確描述：Ondansetron確實同時作用於腸道（傳入神經末梢）及延腦化學感受觸發區（CRTZ）的5-HT3受體，阻斷兩個層次的嘔吐訊號傳遞，不符合題目問的「錯誤」描述。","此為正確描述：Ondansetron對cisplatin（鉑類化療藥）引起的嘔吐有顯著療效，是其主要臨床適應症之一；cisplatin刺激腸道嗜鉻細胞（enterochromaffin cells）大量釋放5-HT，ondansetron可阻斷此效應，不符合題目問的「錯誤」描述。","此為正確描述：Ondansetron對放射線治療引起的嘔吐有效，機制同樣是阻斷放射線誘導腸道5-HT釋放所引起的嘔吐反射，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_033","year":2017,"roc_year":106,"session":"1","examNo":33,"q":"下列經口投予的藥物中，何者會引起軟便的作用？","opts":["A. 碳酸氫鈉","B. 氫氧化鋁","C. 氧化鎂","D. 高嶺土（kaolin）"],"ans":2,"exp":"氧化鎂（MgO）口服後在胃中與鹽酸反應，進入腸道後形成難以吸收的鎂鹽（Mg²⁺），在腸腔中保留大量水分，產生滲透性（osmotic）作用，軟化糞便並刺激腸蠕動，屬於鹽性（滲透性）瀉藥。碳酸氫鈉（NaHCO₃）和氫氧化鋁（Al(OH)₃）為制酸劑；高嶺土（kaolin）為吸附性止瀉劑。","we":["錯誤：碳酸氫鈉（NaHCO₃）為制酸劑（antacid），口服後中和胃酸，不產生顯著的軟便或瀉下作用；過量使用反而可能因釋放CO₂引起腹脹，而非軟便作用。","錯誤：氫氧化鋁（Al(OH)₃）為制酸劑，能中和胃酸，但同時具有收斂和便秘效果（Al³⁺可結合腸道蛋白，延緩腸蠕動），不但不會軟便，反而可能加重便秘。","","錯誤：高嶺土（kaolin）為腸道吸附劑（adsorbent），能吸附腸道中的毒素和水分，具有止瀉（antidiarrheal）效果，與軟便作用相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_034","year":2017,"roc_year":106,"session":"1","examNo":34,"q":"下列何者可以作為生病或虛弱動物的食慾促進劑，但是其作用原理並不清楚？","opts":["A. apomorphine","B. metoclopramide","C. magnesium oxide","D. prednisolone"],"ans":3,"exp":"Prednisolone（糖皮質素）可作為生病或虛弱動物的食慾促進劑，在犬貓臨床上用於末期或慢性病患改善食慾和生活品質，但其確切促進食慾的機制尚不完全清楚，可能與中樞神經代謝效應、蛋白質合成代謝及情緒改善有關。Apomorphine為D2受體致效劑，用於催吐；metoclopramide為促腸動力藥；MgO為瀉劑。","we":["錯誤：Apomorphine為D2受體致效劑，主要作用為刺激CRTZ（化學感受觸發區）的D2受體引起嘔吐，是犬的催吐劑，而非食慾促進劑。","錯誤：Metoclopramide為D2受體拮抗劑兼促腸動力藥，能加速胃排空，雖然間接改善噁心感，但主要用途並非食慾促進，且並無直接促進食慾的明確機制。","錯誤：Magnesium oxide（氧化鎂）為滲透性瀉劑，用於便秘的治療，對食慾毫無促進作用，反而因其瀉下效果可能加重虛弱動物的腸道不適。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_035","year":2017,"roc_year":106,"session":"1","examNo":35,"q":"除了是精神安定劑，xylazine使用於貓的另一項用途是：","opts":["A. 催吐","B. 止吐","C. 止瀉","D. 抗發炎"],"ans":0,"exp":"Xylazine為α2-腎上腺素受體致效劑，是一種常用的鎮靜止痛藥。在貓（但非犬）中，xylazine能可靠地誘發嘔吐反應，機制為中樞α2受體的激活影響延腦嘔吐中樞（CTZ）觸發。此特性使xylazine成為貓的有效催吐劑，臨床上用於毒物攝入後的催吐處理。犬對xylazine催吐效果的敏感性遠低於貓。","we":["","錯誤：止吐（antiemetic）是指抑制嘔吐，與催吐相反；xylazine在貓的特殊用途正是引起嘔吐，若用於需要止吐的場合，概念完全相反。","錯誤：止瀉（antidiarrheal）是指減少腸蠕動、吸收腸道水分等以減緩腹瀉，xylazine雖可透過α2受體影響腸蠕動，但其在貓的特殊用途是催吐而非止瀉。","錯誤：抗發炎並非xylazine的適應症；xylazine為鎮靜止痛劑，不具有臨床意義的抗炎效果，抗炎需使用NSAIDs或糖皮質素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_036","year":2017,"roc_year":106,"session":"1","examNo":36,"q":"下列何者是經口投予硫酸鎂的作用？","opts":["A. 容積性（bulk）排便劑","B. 潤滑性（emollient）瀉藥","C. 高滲透壓性（hyperosmotic）瀉藥","D. 刺激性（irritant）瀉藥"],"ans":2,"exp":"硫酸鎂（MgSO₄）口服後在腸道中幾乎不被吸收，Mg²⁺和SO₄²⁻均為高滲透活性離子，能在腸腔中保留大量水分（滲透壓作用），使腸道液體增多、糞便軟化，並刺激腸蠕動，屬於高滲透壓性（hyperosmotic）瀉藥，又稱鹽性（saline）瀉藥。其效果快速（通常1-3小時），但可能引起電解質失衡。","we":["錯誤：容積性（bulk）瀉藥是指不可吸收的纖維或黏質（如車前子、甲基纖維素）在腸道中吸水膨脹，增加糞便體積刺激腸蠕動；硫酸鎂的機制是透過高滲透壓保留水分，而非膨脹增加體積。","錯誤：潤滑性（emollient/lubricant）瀉藥是指礦物油或二辛基硫琥珀酸鈉（DSS）等，透過包覆糞便表面或軟化糞便油脂成分達到潤滑效果；MgSO₄的作用完全不同，是滲透壓機制而非潤滑。","","錯誤：刺激性（irritant/stimulant）瀉藥是指番瀉葉、蓖麻油、雙乙酸鈉等，透過刺激腸黏膜或神經增加腸蠕動；硫酸鎂雖然也會加速腸蠕動，但主要機制是滲透壓而非化學刺激，因此不歸類為刺激性瀉藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_037","year":2017,"roc_year":106,"session":"1","examNo":37,"q":"下列何者選擇性的擴張支氣管平滑肌，但對心臟無明顯的興奮作用？","opts":["A. aminophylline","B. epinephrine","C. salbutamol","D. isoproterenol"],"ans":2,"exp":"Salbutamol（albuterol）為選擇性β2-腎上腺素受體致效劑，主要作用於支氣管平滑肌的β2受體，引起支氣管擴張，緩解呼吸道阻塞。由於其β2選擇性高，對心臟β1受體的作用較小，不會引起明顯的心跳加速等心臟副作用，是哮喘/支氣管痙攣的首選緩解劑。治療劑量下心臟副作用遠少於非選擇性擬交感神經藥。","we":["錯誤：Aminophylline為甲基黃嘌呤類（methylxanthine），透過非選擇性抑制PDE及腺苷受體拮抗產生支氣管擴張，但同時也有心跳加速、心律不整等心臟副作用，不具β2選擇性。","錯誤：Epinephrine（腎上腺素）同時激動α1、β1和β2受體，雖能強力擴張支氣管，但也會引起顯著的心跳加速（β1）和血壓升高（α1），心臟副作用明顯，不具選擇性。","","錯誤：Isoproterenol（異丙腎上腺素）為非選擇性β受體致效劑（β1+β2），能擴張支氣管，但同時強力激動心臟β1受體，引起心跳加速、心輸出量增加，心臟副作用顯著，不適合需要減少心臟副作用的病患。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_038","year":2017,"roc_year":106,"session":"1","examNo":38,"q":"犬的黑舌病是因缺乏下列何種維生素所致？","opts":["A. biotin","B. choline","C. thiamine","D. niacin"],"ans":3,"exp":"犬的黑舌病（black tongue disease）相當於人的糙皮病（pellagra），均由菸鹼酸（niacin，維生素B3）缺乏所致。菸鹼酸缺乏時，輔酶NAD⁺和NADP⁺合成不足，影響細胞能量代謝和氧化還原反應，臨床表現包括舌頭和口腔黏膜變黑（黑舌）、消化道炎症、皮膚病變及神經症狀。","we":["錯誤：Biotin（維生素B7，生物素）缺乏主要引起皮膚炎、脫毛和神經症狀；犬的biotin缺乏不會引起黑舌病，黑舌病的特徵性病因是菸鹼酸缺乏。","錯誤：Choline（膽鹼）雖常與B群維生素一起討論，但其缺乏主要引起脂肪肝和腎臟出血，而非黑舌病；膽鹼缺乏不影響NAD⁺合成路徑。","錯誤：Thiamine（維生素B1）缺乏主要引起多發性神經炎（beriberi）和韋尼克腦病，在貓可引起前庭共濟失調；不會引起黑舌病，且其缺乏特徵完全不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_039","year":2017,"roc_year":106,"session":"1","examNo":39,"q":"關於cyproheptadine的敘述，下列何者錯誤？","opts":["A. 屬於5-HT2 受體致效劑","B. 用於貓可作為食慾促進劑","C. 可用於處理貓科動物的搔癢症","D. 可用於處理蕁麻疹（hives）"],"ans":0,"exp":"此題為「何者錯誤」題。Cyproheptadine為5-HT2受體「拮抗劑」（antagonist），同時也是H1組織胺受體拮抗劑，並非致效劑（agonist）。選項A描述其為「5-HT2受體致效劑」，與實際藥理作用相反，故為錯誤敘述。Cyproheptadine在貓的臨床應用廣泛，包括食慾促進、止癢及抗組織胺，其機制均基於受體「阻斷」而非「激活」。","we":["","此為正確描述：Cyproheptadine確實可用於貓作為食慾促進劑，透過阻斷5-HT2C受體（可能抑制飽食訊號）和H1受體的效果改善食慾，臨床上廣泛使用，不符合題目問的「錯誤」描述。","此為正確描述：Cyproheptadine具有H1抗組織胺及5-HT拮抗效果，可用於處理貓科動物的搔癢症（pruritus），包括過敏性皮膚病引起的搔癢，不符合題目問的「錯誤」描述。","此為正確描述：作為H1受體拮抗劑，cyproheptadine能阻斷組織胺引起的血管擴張和毛細血管通透性增加，可用於處理蕁麻疹（urticaria/hives），不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_040","year":2017,"roc_year":106,"session":"1","examNo":40,"q":"關於montelukast的敘述，下列何者錯誤？","opts":["A. 可減少支氣管痙攣","B. 可用於犬遺傳性過敏症的輔助療法","C. 對急性和慢性氣喘發作皆有效","D. 口服後吸收快速"],"ans":2,"exp":"此題為「何者錯誤」題。Montelukast為白三烯素CysLT1受體拮抗劑，屬於預防性（controller）抗炎藥物，用於慢性氣喘的長期控制和預防；其起效緩慢（數天至數週），無支氣管擴張作用，不能作為急性氣喘發作的緩解（rescue）藥物使用。選項C描述「對急性和慢性氣喘發作皆有效」，急性部分錯誤，故C為錯誤描述。","we":["此為正確描述：Montelukast透過阻斷CysLT1受體，抑制白三烯素C4、D4、E4引起的支氣管平滑肌收縮，因此可減少支氣管痙攣（bronchospasm）的發生，不符合題目問的「錯誤」描述。","此為正確描述：Montelukast在獸醫臨床中確實可作為犬遺傳性過敏症（canine atopic dermatitis）的輔助療法，白三烯素在過敏性皮膚炎中扮演炎症角色，阻斷其受體可減輕症狀，不符合題目問的「錯誤」描述。","","此為正確描述：Montelukast口服後吸收良好，生體可利用率約64%（成人），可達穩定的血漿濃度，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_041","year":2017,"roc_year":106,"session":"1","examNo":41,"q":"關於礦性腎上腺皮質素（mineralocorticoids）的敘述，下列何者錯誤？","opts":["A. 增加鈉及碳酸氫根離子之重吸收","B. 增加腎小管鉀、氫及氯離子之排除","C. 引起高血鈉症（hypernatremia）而增加血壓","D. 引起高血鉀症（hyperkalemia）而增加神經、骨骼肌及平滑肌之興奮性"],"ans":3,"exp":"礦性腎上腺皮質素（如醛固酮）作用於腎小管，促進鈉（Na⁺）及碳酸氫根（HCO₃⁻）重吸收，同時促進鉀（K⁺）、氫（H⁺）及氯（Cl⁻）的排出，因此會導致低血鉀症（hypokalemia），而非高血鉀症（hyperkalemia）。低血鉀會降低神經、骨骼肌及平滑肌的興奮性，而非增加興奮性，故D選項的描述完全相反，是本題的錯誤選項。","we":["此為正確描述：礦性腎上腺皮質素確實會增加腎小管對鈉及碳酸氫根的重吸收，屬於其主要生理作用之一，不符合題目問的「錯誤」描述。","此為正確描述：礦性腎上腺皮質素確實會增加腎小管鉀、氫及氯離子的排出，以換取鈉的重吸收，屬於正確的藥理機制，不符合題目問的「錯誤」描述。","此為正確描述：礦性腎上腺皮質素促進鈉重吸收後會導致高血鈉症，進而使血漿滲透壓升高並增加血壓，此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_042","year":2017,"roc_year":106,"session":"1","examNo":42,"q":"犬長期使用aspirin治療關節疾病時，特別需要注意下列何者？","opts":["A. 抑制犬軟骨細胞前列腺素之合成","B. 氧化性磷酸化作用（oxidative phosphorylation）","C. 肺部水腫","D. 硫酸及磷酸之蓄積"],"ans":0,"exp":"犬長期使用阿斯匹靈（aspirin）治療關節疾病時，aspirin抑制環氧合酶（COX），使軟骨細胞無法合成前列腺素（prostaglandin），而前列腺素在軟骨基質維護和軟骨細胞代謝中扮演重要角色，長期缺乏恐加速關節軟骨的退化，此為最需注意的副作用。在犬，aspirin對軟骨細胞前列腺素合成的抑制已被認為是主要臨床顧慮，其他選項在一般治療劑量下並非主要問題。","we":["","錯誤：氧化性磷酸化解偶合（oxidative phosphorylation uncoupling）確實是阿斯匹靈毒性機制之一，但僅在中毒劑量下才出現，在治療關節疾病的一般劑量時並非首要顧慮。","錯誤：肺部水腫不是犬長期使用aspirin治療關節疾病的主要副作用，肺部水腫更常見於心臟疾病或液體過量，與aspirin的長期關節治療用途無直接關聯。","錯誤：硫酸及磷酸蓄積是阿斯匹靈代謝產物在高劑量中毒時的現象，與犬長期低劑量使用aspirin治療關節疾病的主要顧慮無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_043","year":2017,"roc_year":106,"session":"1","examNo":43,"q":"下列何者之主要作用為抑制血小板凝集？","opts":["A. PGI2","B. PGH2","C. PGA","D. TXA2"],"ans":0,"exp":"PGI2（前列環素，prostacyclin）主要由血管內皮細胞合成，具有強力抑制血小板聚集及擴張血管兩大作用，與血栓素A2（TXA2）的作用相拮抗，共同維持血管止血的動態平衡。PGI2透過促進血小板腺苷酸環化酶（adenylyl cyclase）活性、提升cAMP濃度，抑制血小板活化與聚集。","we":["","錯誤：PGH2（前列腺素H2）是花生四烯酸代謝的中間產物，為多種前列腺素及TXA2的前驅物，本身促進血小板聚集而非抑制，與PGI2作用相反。","錯誤：PGA（前列腺素A）具有一定程度的舒張血管作用，但抑制血小板聚集的能力較PGI2弱，不是「主要作用為抑制血小板聚集」的最佳選項。","錯誤：TXA2（血栓素A2）由血小板合成，作用為促進血小板聚集及收縮血管，與PGI2的作用完全相反，是促進血栓形成的介質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_044","year":2017,"roc_year":106,"session":"1","examNo":44,"q":"於臨床治療上，甚少使用somatostatin的原因，除半衰期短外，另因：","opts":["A. 無法口服投予","B. 蛋白結合率過高","C. 作用廣泛","D. 具致癌性"],"ans":2,"exp":"體制素（somatostatin）的臨床應用困難，除了半衰期極短（靜脈注射後半衰期僅約1–3分鐘）外，另一主要原因是其作用過於廣泛：somatostatin可抑制生長激素（GH）、胰島素、升糖素、胃泌素、胃酸分泌、腸道蠕動及胃排空等多種生理功能，導致臨床使用時難以達到選擇性治療效果而副作用繁多。","we":["錯誤：Somatostatin確實無法口服（因為口服後會被蛋白酶迅速分解），但題目已說明「除半衰期短外」另有其他原因，且臨床上使用的是靜脈或皮下注射的類似物（如octreotide），故「無法口服」並非除半衰期短以外的另一主因。","錯誤：蛋白結合率並非somatostatin臨床上甚少使用的主要原因，也不是已知影響其臨床應用的關鍵藥理因素。","","錯誤：Somatostatin並無已知的致癌性，其臨床應用受限的原因不包括致癌性，此選項為錯誤描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_045","year":2017,"roc_year":106,"session":"1","examNo":45,"q":"血清素（serotonin）主要存在於下列何處？","opts":["A. 副交感神經末梢","B. 腎上腺皮質","C. 腸嗜鉻細胞","D. 肺臟的巨噬細胞"],"ans":2,"exp":"血清素（serotonin，5-羥色胺，5-HT）約90%以上存在於胃腸道的腸嗜鉻細胞（enterochromaffin cells，EC cells）中，這些細胞分布於整個消化道黏膜，感受腸腔內的化學和機械刺激後釋放血清素，調節腸道蠕動及分泌。其餘少量血清素存在於血小板和中樞神經系統的血清素能神經元。","we":["錯誤：副交感神經末梢的主要神經傳遞物質是乙醯膽鹼（acetylcholine），而非血清素，血清素並非副交感神經系統的傳遞物質。","錯誤：腎上腺皮質分泌的是類固醇荷爾蒙（如皮質醇、醛固酮），而非血清素；血清素並不儲存於腎上腺皮質。","","錯誤：肺臟的巨噬細胞雖然可代謝血清素（透過單胺氧化酶），但並非血清素的主要儲存場所；肺臟主要是血清素代謝的部位，而非合成儲存的場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_046","year":2017,"roc_year":106,"session":"1","examNo":46,"q":"下列何者可用於治療腎上腺皮質功能亢進（hyperadrenocorticism）？","opts":["A. halothane","B. trilostane","C. enflurane","D. tryptophan"],"ans":1,"exp":"Trilostane為3β-羥基類固醇去氫酶（3β-hydroxysteroid dehydrogenase）抑制劑，可阻斷腎上腺皮質素的合成路徑，有效降低皮質醇及醛固酮的產生，臨床上用於治療犬腎上腺皮質功能亢進（庫欣氏症，Cushing's syndrome）。Trilostane目前是獸醫臨床中治療犬庫欣氏症的首選藥物之一。","we":["錯誤：Halothane（氟烷）為揮發性吸入麻醉藥，用於維持全身麻醉，與腎上腺皮質功能調節無關，不用於治療腎上腺皮質功能亢進。","","錯誤：Enflurane（安氟烷）同樣為揮發性吸入麻醉藥，用於全身麻醉的維持，與腎上腺皮質功能無關，不具有治療庫欣氏症的作用。","錯誤：Tryptophan為必需胺基酸，是血清素（serotonin）及褪黑激素（melatonin）的前驅物，不用於治療腎上腺皮質功能亢進。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_047","year":2017,"roc_year":106,"session":"1","examNo":47,"q":"下列有關amphenicols的敘述中，何者錯誤？","opts":["A. Chloramphenicol為本類中最早使用者","B. Thiamphenicol的水溶性較chloramphenicol為佳","C. Thiamphenicol專用於動物，從未使用在人類","D. Chloramphenicol曾用於治療中樞性的感染"],"ans":2,"exp":"Thiamphenicol（甲磺黴素）並非專用於動物，在許多國家（尤其是歐洲及亞洲）已廣泛用於人類的呼吸道感染及腸道感染治療，因此「從未使用在人類」的敘述是錯誤的。Chloramphenicol確為本類最早使用者，thiamphenicol水溶性較佳，chloramphenicol因良好的血腦屏障穿透性曾用於中樞性感染，上述三點均為正確描述。","we":["此為正確描述：Chloramphenicol確實是amphenicols類中最早被開發使用的藥物，於1940年代末期首次投入臨床，不符合題目問的「錯誤」描述。","此為正確描述：Thiamphenicol的水溶性確實優於chloramphenicol，因為thiamphenicol的結構中以甲磺基（methylsulfonyl）取代了硝基，使水溶性增加，不符合題目問的「錯誤」描述。","","此為正確描述：Chloramphenicol脂溶性高、血腦屏障穿透性佳，歷史上曾用於腦膜炎及其他中樞神經系統感染的治療，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_048","year":2017,"roc_year":106,"session":"1","examNo":48,"q":"下列何種抗腫瘤藥物會產生不可回復性的劑量相關性心肌病變？","opts":["A. actinomycin D","B. bleomycin","C. cisplatin","D. doxorubicin"],"ans":3,"exp":"Doxorubicin（阿黴素，anthracycline類）的主要毒性為累積劑量相關的不可逆性心肌病變（cardiomyopathy），其機制與自由基（free radical）的生成及鐵離子螯合有關，導致心肌細胞的氧化損傷。此心毒性具累積性，超過一定累積劑量閾值後心功能不全風險大幅上升，且為不可逆性，是臨床使用時最需監控的嚴重副作用。","we":["錯誤：Actinomycin D（放線菌素D）的主要毒性為胃腸道毒性（嚴重噁心嘔吐）及骨髓抑制，並非以不可逆性心肌病變為主要特徵。","錯誤：Bleomycin的特徵性毒性為肺毒性，可導致肺纖維化（pulmonary fibrosis），而非心肌病變，是使用bleomycin時須特別監測的器官毒性。","錯誤：Cisplatin（順鉑）的主要毒性為腎毒性（nephrotoxicity）及神經毒性（neurotoxicity），同時有顯著的噁心嘔吐及耳毒性，不以心肌病變為其特徵性毒性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_049","year":2017,"roc_year":106,"session":"1","examNo":49,"q":"下列有關nafcillin的敘述中，何者正確？","opts":["A. 在分類上屬於aminopenicillin","B. 抗綠膿桿菌（Pseudomonas aeruginosa）的活性佳","C. 具有抗葡萄球菌β-lactamase的能力","D. 治療腸內菌科感染的活性較amoxicillin為佳"],"ans":2,"exp":"Nafcillin屬於抗葡萄球菌青黴素（antistaphylococcal penicillin），其側鏈結構可空間性阻斷葡萄球菌產生的β-lactamase接近β-內醯胺環，因此能抵抗葡萄球菌β-lactamase的水解，用於治療產β-lactamase之葡萄球菌感染。Nafcillin在分類上屬於isoxazolyl penicillin或耐酶青黴素，而非aminopenicillin類。","we":["錯誤：Aminopenicillin類包括ampicillin及amoxicillin，具有廣效抗菌性，但容易被β-lactamase水解；nafcillin屬於抗葡萄球菌青黴素，在分類和抗菌特性上均不同於aminopenicillin。","錯誤：Nafcillin對綠膿桿菌（Pseudomonas aeruginosa）的抗菌活性差；抗綠膿桿菌的青黴素類藥物應為extended-spectrum penicillins（如ticarcillin、piperacillin），不是nafcillin。","","錯誤：Nafcillin對腸內菌科（Enterobacteriaceae）的抗菌活性不如amoxicillin；nafcillin主要針對葡萄球菌，對革蘭氏陰性腸內菌的活性很弱，而amoxicillin為廣效型青黴素，對腸內菌科有較好的活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_050","year":2017,"roc_year":106,"session":"1","examNo":50,"q":"用於治療貓免疫缺陷病毒的有效藥物是：","opts":["A. rimatadine","B. ranitidine","C. zidovudine","D. valacyclovir"],"ans":2,"exp":"Zidovudine（齊多夫定，AZT）為核苷類逆轉錄酶抑制劑（NRTI），可抑制反轉錄病毒的逆轉錄酶活性，臨床上已被應用於治療貓免疫缺陷病毒（FIV）感染，能延緩病程進展。FIV與人類HIV同屬反轉錄病毒，故作用機制類似的AZT對FIV有效。","we":["錯誤：Rimantadine（金剛乙胺）為M2離子通道阻斷劑，用於抗A型流感病毒，對反轉錄病毒（如FIV）無效，作用機制與逆轉錄酶完全無關。","錯誤：Ranitidine（雷尼替丁）為H2受體拮抗劑（組織胺H2 blocker），用於抑制胃酸分泌，屬於消化系統藥物，完全不具有抗病毒活性。","","錯誤：Valacyclovir為acyclovir的前驅藥（prodrug），用於治療疱疹病毒感染，但valacyclovir對貓具有明顯毒性，且對FIV（反轉錄病毒）無效，不適合用於貓的FIV治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_051","year":2017,"roc_year":106,"session":"1","examNo":51,"q":"下列有關含碘溶液的敘述中，何者正確？","opts":["A. 碘在純水和酒精中具有相同的溶解度","B. 碘溶解在水或酒精中具有相等的殺菌能力","C. Iodophors不會經由皮膚或黏膜吸收","D. Iodophors對皮膚的刺激性較碘酒為低"],"ans":3,"exp":"含碘溶液（iodophors，如povidone-iodine）是將碘與高分子載體結合的緩釋系統，緩慢釋放游離碘，使局部游離碘濃度較低，因此對皮膚的刺激性明顯低於傳統碘酒（tincture of iodine），是iodophors廣受歡迎的重要優點之一。","we":["錯誤：碘在酒精中的溶解度明顯高於純水；碘酒（含碘的酒精溶液）正是利用碘易溶於酒精的特性製成，兩者溶解度並不相同。","錯誤：碘溶解在酒精中的殺菌能力優於溶解在水中；酒精本身也有殺菌作用，加上碘在酒精中濃度較高、穿透性較好，使碘酒殺菌能力強於碘水溶液。","錯誤：Iodophors中的碘確實可以經由皮膚或黏膜吸收，特別是大面積使用時，吸收量可能達到影響甲狀腺功能的程度，所以「不會經由皮膚或黏膜吸收」的描述是錯誤的。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_052","year":2017,"roc_year":106,"session":"1","examNo":52,"q":"下列何者於臨床可單獨用於治療革蘭氏陰性菌的感染？","opts":["A. clavulanate","B. sulbactam","C. tazobactam","D. monobactam"],"ans":3,"exp":"Monobactam類（代表藥物為aztreonam）本身具有抗革蘭氏陰性菌的抗菌活性，可單獨用於治療革蘭氏陰性菌感染，是β-內醯胺類中唯一具有單環結構者。相對而言，clavulanate、sulbactam、tazobactam均為β-lactamase抑制劑，本身幾乎無實質抗菌活性（或活性極弱），必須與其他青黴素類抗生素合併使用才有臨床意義。","we":["錯誤：Clavulanate（克拉維酸）為β-lactamase抑制劑，本身幾乎沒有實質抗菌活性，臨床上須與amoxicillin或ticarcillin合併使用，不能單獨用於治療感染。","錯誤：Sulbactam（舒巴坦）同樣為β-lactamase抑制劑，雖對少數不動桿菌有一定活性，但整體上臨床意義有限，通常須與ampicillin合併（ampicillin-sulbactam）使用，不能單獨廣泛用於革蘭氏陰性菌感染。","錯誤：Tazobactam（他佐巴坦）亦為β-lactamase抑制劑，本身幾乎沒有抗菌活性，僅能與piperacillin合併（piperacillin-tazobactam）使用，無法單獨用於治療感染。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_053","year":2017,"roc_year":106,"session":"1","examNo":53,"q":"下列何者是以氣體的形式進行消毒作用？","opts":["A. chlorhexidine","B. glutaraldehyde","C. ethylene oxide","D. tricolsan"],"ans":2,"exp":"環氧乙烷（ethylene oxide，EO）是一種低溫氣體滅菌劑，透過烷化作用（alkylation）破壞微生物的核酸和蛋白質，適用於無法耐受高溫高壓的熱敏感器材（如電子設備、塑膠製品、光學器材）的滅菌。Chlorhexidine和glutaraldehyde為液態消毒劑，triclosan為外用抗菌劑，三者均非氣體。","we":["錯誤：Chlorhexidine（洗必泰）為雙胍類（biguanide）消毒劑，以水溶液形式使用，作用於細菌細胞膜，屬於液態消毒劑，不以氣體形式進行消毒。","錯誤：Glutaraldehyde（戊二醛）以2%水溶液形式用於器械的高層次消毒或滅菌，屬於液態滅菌劑，透過烷化核酸和蛋白質起效，不以氣體形式進行消毒。","","錯誤：Triclosan（三氯沙）為外用廣效抗菌劑，常用於外科洗手液及個人衛生用品，以液態或凝膠形式使用，不以氣體形式進行消毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_054","year":2017,"roc_year":106,"session":"1","examNo":54,"q":"有關tetracyclines的敘述中，何者錯誤？","opts":["A. 避免經口使用於成年反芻獸","B. 使用於家畜時須有停藥期","C. 長期使用可能會出現超級感染症（suprainfection）","D. 具有殺菌作用，故可用於重病且免疫力下降的動物"],"ans":3,"exp":"四環素類抗生素（tetracyclines）為抑菌型（bacteriostatic）抗生素，而非殺菌型（bactericidal），其作用機制為可逆性抑制細菌70S核糖體30S次單位，阻斷胺醯基-tRNA與核糖體A位結合，從而阻礙蛋白質合成。因此，在免疫力嚴重受損的動物，應優先選用殺菌型抗生素，不應依賴tetracyclines單獨治療，選項D的「具有殺菌作用」描述是錯誤的。","we":["此為正確描述：成年反芻動物（牛、羊等）的瘤胃菌群對四環素類藥物高度敏感，口服給藥會嚴重破壞瘤胃微生物平衡，故應避免成年反芻獸口服使用，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：四環素類用於食用動物（家畜）時確實須遵守停藥期規定，以防止藥物殘留超標影響食品安全，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：四環素類長期使用可抑制正常菌群，造成抗藥性菌或黴菌（如Candida）的過度增生，即超級感染症（suprainfection/superinfection），此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_055","year":2017,"roc_year":106,"session":"1","examNo":55,"q":"下列何者可經口、局部、靜脈投藥用於治療herpes simplex感染？","opts":["A. rimantadine","B. ganciclovir","C. acyclovir","D. amantadine"],"ans":2,"exp":"Acyclovir（阿昔洛韋）為核苷類抗疱疹病毒藥物，可以口服、靜脈注射及局部外用三種途徑給藥，用於治療單純疱疹病毒（herpes simplex virus，HSV）感染，包括唇疱疹、生殖器疱疹及疱疹性腦炎。其作用機制為在感染細胞內被病毒胸腺嘧啶激酶磷酸化為活性形式，特異性抑制病毒DNA多聚酶。","we":["錯誤：Rimantadine為M2離子通道阻斷劑，用於抗A型流感病毒，對疱疹病毒無效，且僅口服給藥，不具有靜脈及局部外用的多途徑給藥特性。","錯誤：Ganciclovir主要用於治療巨細胞病毒（CMV）感染，雖可靜脈及口服（valganciclovir為其前驅藥），但對HSV的適應症不如acyclovir廣泛，且局部使用不是其主要給藥途徑。","","錯誤：Amantadine（金剛烷胺）同樣為抗A型流感病毒藥物（M2離子通道阻斷劑），對疱疹病毒完全無效，且獸醫臨床更多用於神經性疼痛的治療，不用於HSV感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_056","year":2017,"roc_year":106,"session":"1","examNo":56,"q":"接受磺胺劑治療之動物須注意補充足夠水分的原因為何？","opts":["A. 預防脫水（dehydration）","B. 預防腎晶尿症（crystalluria）","C. 預防低血壓（hypotension）","D. 可加強尿道殺菌（bacteriocidal）效果"],"ans":1,"exp":"磺胺類藥物（sulfonamides）及其乙醯化代謝產物在酸性或濃縮的尿液中溶解度低，容易析出結晶沉積於腎小管及泌尿道，引起腎晶尿症（crystalluria），嚴重時可造成腎小管阻塞及腎臟損傷。給予充足水分可使尿液稀釋、增加磺胺類及代謝物的溶解度，有效預防結晶析出，是使用磺胺類時的重要注意事項。","we":["錯誤：預防脫水（dehydration）確實是補充水分的益處之一，但對於磺胺劑治療而言，補充水分的最主要、最特異的原因是預防腎晶尿症，而非單純防脫水。","","錯誤：磺胺類藥物不會直接引起低血壓，補充水分與預防低血壓無直接關聯，此選項與磺胺藥的特定藥理毒性無關。","錯誤：尿液稀釋實際上會降低尿道中藥物濃度，並不會加強泌尿道的殺菌效果；補充水分的目的是降低結晶析出風險，而非增強殺菌作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_057","year":2017,"roc_year":106,"session":"1","examNo":57,"q":"下列有關四環素類不良反應的敘述，何者錯誤？","opts":["A. 在年老的動物較可能出現牙齒永久著色現象","B. 長期投予可能出現黴菌或酵母菌之感染","C. 高劑量下抗同化作用（antianabolic）將顯而易見，如出現尿素氮（blood urea nitrogen）之上升等","D. 除了doxycycline和minocycline外，均具有潛在性腎毒性"],"ans":0,"exp":"四環素類藥物（tetracyclines）與鈣離子螯合後沉積於正在發育礦化的牙本質中，導致永久性牙齒著色（黃色至棕褐色），此作用只發生在牙齒發育期（年輕動物、乳齒或恆齒仍在礦化的階段）。對已完全礦化的老年動物牙齒，四環素不會引起著色；因此選項A的「在年老的動物較可能出現牙齒永久著色」是錯誤的，應為年幼動物風險較高。","we":["","此為正確描述：四環素類長期投予會抑制正常腸道菌群，使黴菌（Candida等）或酵母菌過度增生，引起念珠菌性口腔炎或陰道炎等二次感染，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：四環素類在高劑量下具有抗同化作用（antianabolic effect），抑制蛋白質合成導致氮質血症，血液尿素氮（BUN）上升，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：Doxycycline和minocycline由於代謝途徑不同（主要由膽汁排出，較少以原型由腎臟排泄），對腎臟的毒性確實低於舊型四環素類，此描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_058","year":2017,"roc_year":106,"session":"1","examNo":58,"q":"臨床上clavulanic acid常與amoxicillin合併投藥之主要原因為何？","opts":["A. 具有很強的抗菌作用","B. 可以增加amoxicillin之吸收","C. 可以抑制由抗penicillins細菌所產生的β-lactamase","D. 可以加速amoxicillin之代謝"],"ans":2,"exp":"Clavulanic acid（克拉維酸）為β-lactamase抑制劑，本身抗菌活性很弱，但可不可逆性地抑制細菌產生的β-lactamase，保護amoxicillin免受β-lactamase水解，從而擴大amoxicillin的抗菌譜，使其對原本具有抗藥性的產β-lactamase菌株（如金黃色葡萄球菌、大腸桿菌等）恢復抗菌活性。兩者合用（amoxicillin-clavulanate，Augmentin）是獸醫及人醫臨床廣泛使用的複方製劑。","we":["錯誤：Clavulanic acid本身的抗菌活性極弱，單獨使用無臨床治療意義；其主要價值在於抑制β-lactamase，而非自身具有很強的抗菌作用。","錯誤：Clavulanic acid並不能增加amoxicillin的口服吸收率；兩者合用的目的在於保護amoxicillin免受β-lactamase分解，與吸收機制無關。","","錯誤：Clavulanic acid不會加速amoxicillin的代謝；事實上，兩者合用的目的是延長amoxicillin的有效性（保護其不被β-lactamase分解），而非影響代謝速率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_059","year":2017,"roc_year":106,"session":"1","examNo":59,"q":"由太平洋紫杉（Taxus brevifolia）的樹皮中萃取得到的藥物是：","opts":["A. cisplatin","B. 5-fluorouracil","C. vincristine","D. paclitaxel"],"ans":3,"exp":"Paclitaxel（紫杉醇）是從太平洋紫杉（Pacific yew，Taxus brevifolia）樹皮中萃取分離得到的天然紫杉烷類（taxane）抗腫瘤藥物，其作用機制為穩定微管（microtubule），阻止有絲分裂紡錘體的解聚，從而使腫瘤細胞停滯於M期無法完成有絲分裂。Paclitaxel是重要的天然來源化療藥物。","we":["錯誤：Cisplatin（順鉑）為合成的鉑類化合物（platinum complex），不源自植物，透過與DNA形成交叉鏈結（cross-links）發揮抗腫瘤作用，與太平洋紫杉無關。","錯誤：5-Fluorouracil（5-FU）為合成的氟化嘧啶類（fluoropyrimidine）抗代謝物，化學合成而非植物萃取，透過抑制胸苷酸合成酶（thymidylate synthase）干擾DNA合成。","錯誤：Vincristine（長春新鹼）雖然也是植物來源（從長春花Vinca rosea萃取），但其來源為長春花而非太平洋紫杉，作用機制為抑制微管聚合，與paclitaxel的作用方向相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_060","year":2017,"roc_year":106,"session":"1","examNo":60,"q":"Tamoxifen的臨床應用主要為：","opts":["A. 促進排卵","B. 治療骨質疏鬆症","C. 治療乳腺腫瘤","D. 促進乳汁分泌"],"ans":2,"exp":"Tamoxifen（他莫昔芬）為選擇性雌激素受體調節劑（SERM），在乳腺組織中作為雌激素受體的競爭性拮抗劑，阻斷雌激素刺激，用於治療雌激素受體陽性（ER+）的乳腺/乳腺腫瘤。在犬及人醫臨床上，tamoxifen是治療荷爾蒙依賴性乳腺腫瘤的重要藥物。","we":["錯誤：促進排卵的藥物為促性腺素（GnRH、FSH/LH）或clomiphene（氯米芬，但對貓具毒性），tamoxifen雖然在某些物種子宮中呈現雌激素樣作用，但其主要臨床應用是抗乳腺腫瘤，而非促排卵。","錯誤：骨質疏鬆症的治療藥物包括bisphosphonates、雌激素、降鈣素等；tamoxifen雖可在骨骼中發揮部分雌激素樣保護作用，但治療骨質疏鬆並非其主要臨床適應症。","","錯誤：促進乳汁分泌的藥物為多巴胺拮抗劑（如metoclopramide、domperidone）及催乳素（prolactin）相關藥物；tamoxifen為雌激素受體拮抗劑，不具有促乳汁分泌的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_061","year":2017,"roc_year":106,"session":"1","examNo":61,"q":"下列何者為臨床最常用於治療犬隻傳染性花柳性腫瘤之化學治療劑？","opts":["A. chlorambucil","B. lomustine","C. melphalan","D. vincristine"],"ans":3,"exp":"傳染性花柳性腫瘤（transmissible venereal tumor，TVT）是犬特有的可傳染性腫瘤，對vincristine（長春新鹼）的治療反應極佳，完全緩解率可達90%以上，是目前獸醫臨床治療TVT的首選化療藥物。Vincristine屬於長春花鹼類（vinca alkaloids），透過抑制微管聚合阻斷有絲分裂，對TVT具有高度選擇性療效。","we":["錯誤：Chlorambucil（苯丁酸氮芥）為烷化劑（alkylating agent），主要用於治療慢性淋巴球性白血病及低惡性度淋巴瘤，不是TVT的首選治療藥物，對TVT的療效遠不如vincristine。","錯誤：Lomustine（CCNU）為亞硝脲類烷化劑，主要用於腦腫瘤及淋巴瘤的治療，對TVT並無特別的臨床指徵，不是TVT的首選藥物。","錯誤：Melphalan（美法侖）為烷化劑，用於多發性骨髓瘤及卵巢癌等，對TVT並無特定療效，不是TVT的臨床首選。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_062","year":2017,"roc_year":106,"session":"1","examNo":62,"q":"下列何種生物轉換（biotransformation）是磺胺劑在泌尿系統中產生結晶的主因？","opts":["A. carboxylation","B. hydroxylation","C. oxidation","D. acetylation"],"ans":3,"exp":"磺胺類藥物在肝臟中主要透過N-乙醯化作用（N-acetylation）進行生物轉換，形成乙醯化代謝物；乙醯化代謝物的水溶性低於母藥，在酸性和濃縮的尿液中容易達到溶解度極限，析出結晶沉積於腎小管及泌尿道，造成腎晶尿症（crystalluria）及腎臟損傷。此為磺胺類藥物的特徵性腎毒性機制。","we":["錯誤：Carboxylation（羧化）不是磺胺類藥物的主要代謝途徑，與磺胺類在泌尿系統中產生結晶的機制無關。","錯誤：Hydroxylation（羥化）雖是多種藥物的第一相（Phase I）代謝途徑，但不是導致磺胺類產生結晶的主要生物轉換方式，其代謝產物水溶性不若乙醯化代謝物那樣低。","錯誤：Oxidation（氧化）為藥物代謝常見的第一相反應，但磺胺類藥物形成結晶的主要原因是乙醯化代謝（acetylation），而非氧化代謝途徑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_063","year":2017,"roc_year":106,"session":"1","examNo":63,"q":"下列藥物中，何者用於治療局部性herpetic keratitis？","opts":["A. amantadine","B. idoxuridine","C. azidothymidine","D. ganciclovir"],"ans":1,"exp":"Idoxuridine（碘苷）為嘧啶核苷類似物，可競爭性抑制病毒胸腺嘧啶激酶及DNA多聚酶，阻斷疱疹病毒DNA的複製，局部外用（眼藥水或眼膏）用於治療疱疹性角膜炎（herpetic keratitis）。由於全身毒性大，idoxuridine僅限局部使用，是治療眼部疱疹感染的經典藥物。","we":["錯誤：Amantadine（金剛烷胺）為A型流感病毒M2離子通道阻斷劑，不用於治療疱疹性角膜炎；在獸醫臨床中，amantadine更常被用於慢性疼痛管理（NMDA受體拮抗）。","","錯誤：Azidothymidine（AZT，zidovudine）為逆轉錄酶抑制劑，用於抗反轉錄病毒（如FIV），不具有治療疱疹性角膜炎的適應症，其作用靶點與疱疹病毒DNA複製機制不同。","錯誤：Ganciclovir主要用於治療巨細胞病毒（CMV）感染（尤其是全身性感染），主要以靜脈注射或口服給藥；雖然亦有眼用ganciclovir製劑，但idoxuridine才是治療疱疹性角膜炎的傳統首選局部用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_064","year":2017,"roc_year":106,"session":"1","examNo":64,"q":"下列何者的抗菌作用機制與tylosin相似，可經由飼料或飲水投藥方式用於控制和治療豬的嗜血桿菌肺炎？","opts":["A. bacitracin","B. tiamulin","C. polymyxin B","D. imipenem"],"ans":1,"exp":"Tiamulin（泰妙靈）為截短側耳素類（pleuromutilin）抗生素，透過結合細菌50S核糖體次單位的23S rRNA肽轉移酶中心，抑制蛋白質合成，其作用機制與大環內酯類（macrolide，如tylosin）類似，均作用於50S次單位。Tiamulin可經由飼料或飲水投藥，臨床上用於控制豬的嗜血桿菌（Haemophilus/Actinobacillus）肺炎及豬痢疾（swine dysentery）。","we":["錯誤：Bacitracin（桿菌肽）為多肽類抗生素，作用機制為干擾細菌細胞壁脂質載體（undecaprenyl pyrophosphate）的再生，抑制細胞壁肽聚糖合成，與tylosin的作用機制（抑制蛋白質合成）完全不同。","","錯誤：Polymyxin B為多肽類抗生素，作用機制為直接破壞革蘭氏陰性菌的外膜（outer membrane），增加膜通透性，與tylosin的蛋白質合成抑制機制截然不同。","錯誤：Imipenem為碳青黴烯類（carbapenem）β-內醯胺抗生素，作用機制為抑制細菌細胞壁的肽聚糖合成（結合PBPs），而非抑制蛋白質合成，與tylosin機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_065","year":2017,"roc_year":106,"session":"1","examNo":65,"q":"Thiamphenicol抗菌劑的主要抗菌機制為抑制下列何者的合成？","opts":["A. RNA","B. DNA","C. 細胞壁","D. 蛋白質"],"ans":3,"exp":"Thiamphenicol（甲磺黴素）與chloramphenicol同屬amphenicols類抗生素，兩者均透過與細菌70S核糖體50S次單位結合，抑制肽轉移酶（peptidyltransferase）活性，阻斷肽鏈延長，從而抑制蛋白質合成。此為amphenicols類的共同作用機制，對革蘭氏陽性菌、革蘭氏陰性菌及部分非典型病原體均有抑菌作用。","we":["錯誤：抑制RNA合成的藥物包括rifamycin類（如rifampicin），其作用標的為細菌RNA聚酶，thiamphenicol不以RNA合成為作用靶點。","錯誤：抑制DNA合成的藥物包括喹諾酮類（quinolones，抑制DNA旋轉酶及拓樸異構酶IV）和磺胺類（間接抑制），thiamphenicol的作用機制與DNA合成無直接關係。","錯誤：抑制細胞壁合成的藥物包括β-內醯胺類（青黴素、頭孢菌素）及萬古黴素等；thiamphenicol作用於核糖體，不干擾細菌細胞壁的合成。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_066","year":2017,"roc_year":106,"session":"1","examNo":66,"q":"可做為產蛋中蛋雞球蟲症之預防性含藥物飼料添加物是：","opts":["A. amprolium","B. sulfadimethoxine-ormetoprim","C. diclazuril","D. decoquinate"],"ans":0,"exp":"Amprolium（安普羅林）為硫胺素（維生素B1）結構類似物，競爭性抑制球蟲對硫胺素的攝取（硫胺素拮抗劑），干擾球蟲的糖代謝。Amprolium在蛋雞體內的殘留性很低，且雞蛋中不易蓄積，是目前台灣及多個國家核准可用於產蛋中蛋雞的球蟲症預防飼料添加物，不需設定蛋品停藥期。","we":["","錯誤：Sulfadimethoxine-ormetoprim複方磺胺劑不適合用於產蛋中蛋雞，因其殘留可進入蛋中，需要設定蛋品停藥期，不符合產蛋中使用的規範。","錯誤：Diclazuril（地克珠利）為三嗪類（triazine）抗球蟲藥，雖效果良好，但目前在產蛋中蛋雞使用需要蛋品停藥期，不像amprolium那樣獲准在產蛋期無停藥期使用。","錯誤：Decoquinate（地可喹酯）為喹諾酮類抗球蟲藥，主要核准用於肉雞及犢牛，對產蛋中蛋雞的使用有限制，需蛋品停藥期，不符合題目條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_067","year":2017,"roc_year":106,"session":"1","examNo":67,"q":"下列何者可經口投予亦可靜脈注射，且為制黴菌性的藥物？","opts":["A. fluconazole","B. nystatin","C. flucytosine","D. griseofulvin"],"ans":0,"exp":"Fluconazole（氟康唑）為三唑類（triazole）抗真菌藥物，可以口服及靜脈注射兩種途徑給藥，口服生體可用率高（接近100%），對念珠菌（Candida）及隱球菌（Cryptococcus）具有良好的制黴菌性（fungistatic/fungicidal）活性，廣泛用於全身性真菌感染的治療。","we":["","錯誤：Nystatin（耐斯他汀）僅能口服（用於腸道念珠菌）或局部外用，因毒性大無法全身給藥；口服後幾乎不吸收，不具有靜脈注射給藥的可行性。","錯誤：Flucytosine（氟胞嘧啶）雖可口服及靜脈給藥，但單獨使用時容易快速產生抗藥性，通常須與兩性黴素B合併使用，且適應症相對有限；fluconazole才是更廣泛使用且可單獨用藥的口服及靜脈雙途徑抗真菌藥。","錯誤：Griseofulvin（灰黃黴素）僅能口服給藥，無法靜脈注射，且僅對皮膚癬菌（dermatophytes）有效，對全身性真菌感染（如Candida、Cryptococcus）無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_068","year":2017,"roc_year":106,"session":"1","examNo":68,"q":"下列何者為amphotericin B之最佳給藥途徑？","opts":["A. 靜脈注射","B. 皮下注射","C. 經口投予","D. 肌肉注射"],"ans":0,"exp":"Amphotericin B（兩性黴素B）口服幾乎不被吸收（不適用於全身性感染），皮下或肌肉注射會引起局部組織壞死，因此治療深部/全身性真菌感染（如球黴菌病、念珠菌血症、隱球菌性腦膜炎）時，靜脈注射是唯一有效的全身給藥途徑。靜脈注射時須以5%葡萄糖液緩慢滴注並注意腎毒性監測。","we":["","錯誤：皮下注射amphotericin B會在注射部位引起嚴重的局部組織壞死和刺激反應，因此不適合皮下給藥，此途徑在臨床上禁用。","錯誤：口服amphotericin B因幾乎不被腸道吸收，無法達到全身性抗真菌的血中有效濃度；口服製劑僅用於局部腸道真菌感染，不能用於全身性深部真菌感染的治療。","錯誤：肌肉注射amphotericin B同樣會引起嚴重局部組織壞死，不適合肌肉注射給藥，此途徑在臨床上禁用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_069","year":2017,"roc_year":106,"session":"1","examNo":69,"q":"下列何者最適合治療或防止貓排出Toxoplasma gondii卵囊？","opts":["A. toltrazuril","B. monensin","C. clindamycin","D. disopyramide"],"ans":2,"exp":"貓感染弓蟲（Toxoplasma gondii）後，在腸道上皮細胞進行有性生殖（球蟲期），糞便中排出卵囊（oocysts）是重要的傳播途徑。Clindamycin（克林黴素）可有效抑制貓腸道中弓蟲的複製，減少或防止卵囊的排出，是獸醫臨床治療貓弓蟲感染並防止其散播的首選藥物，對組織期弓蟲感染亦有療效。","we":["錯誤：Toltrazuril（托曲珠利）為三嗪酮類抗球蟲藥，對Eimeria（艾美球蟲）及Isospora（等孢球蟲）有效，但對Toxoplasma gondii（弓蟲）的卵囊排放抑制效果並非首選；clindamycin的臨床證據更為充分。","錯誤：Monensin（莫能菌素）為離子載體類（ionophore）抗球蟲藥，主要用於家禽和牛的Eimeria球蟲預防，對貓的弓蟲感染不是適合的治療藥物，且對貓具有毒性風險。","","錯誤：Disopyramide（丙吡胺）為Ic類心律不整藥物，用於心室性心律不整，完全與抗寄生蟲治療無關，不具有任何抗弓蟲活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_070","year":2017,"roc_year":106,"session":"1","examNo":70,"q":"下列何者不適合用於治療焦蟲症？","opts":["A. metronidazole","B. amicarbalide","C. phenamidine","D. diminazene"],"ans":0,"exp":"焦蟲症（babesiosis）由Babesia屬血液原蟲（梨形蟲）感染紅血球所致，治療須使用具有抗梨形蟲活性的藥物，包括amicarbalide（芳香脒類）、phenamidine（苯脒類）及diminazene（貝尼爾）等。Metronidazole（甲硝唑）主要用於治療厭氧菌感染及賈第鞭毛蟲（Giardia）、毛滴蟲（Trichomonas）等原蟲感染，對Babesia原蟲無效，不適合用於焦蟲症的治療。","we":["","此為正確描述：Amicarbalide（阿米卡巴胺）為芳香脒類（aromatic amidine）抗原蟲藥，具有抗Babesia活性，臨床上用於治療焦蟲症，不符合題目問的「不適合」描述。","此為正確描述：Phenamidine（苯脒）同屬脒類（amidine）抗原蟲藥，對Babesia有殺蟲活性，用於治療焦蟲症，不符合題目問的「不適合」描述。","此為正確描述：Diminazene（貝尼爾，berenil）為脒類抗原蟲藥，廣泛用於治療家畜的焦蟲症及錐蟲症，對Babesia具有明確療效，不符合題目問的「不適合」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_071","year":2017,"roc_year":106,"session":"1","examNo":71,"q":"下列何者為有機磷驅蟲藥？","opts":["A. trichlorfon","B. melarsomine","C. dimercaprol","D. chlorothiazide"],"ans":0,"exp":"Trichlorfon（敵百蟲，metrifonate）為有機磷（organophosphate）類化合物，可不可逆性抑制膽鹼酯酶（acetylcholinesterase），具有殺蟲及驅蟲活性，廣泛用於家畜體外寄生蟲及某些腸道寄生蟲的防治。Melarsomine為有機砷類（organoarsenic）藥物（用於犬心絲蟲），dimercaprol為重金屬解毒劑，chlorothiazide為噻嗪類利尿劑，三者均非有機磷驅蟲藥。","we":["","錯誤：Melarsomine（梅拉胂明）為有機砷類（organoarsenic）化合物，用於犬心絲蟲成蟲（Dirofilaria immitis）的滅殺治療，與有機磷類的作用機制完全不同。","錯誤：Dimercaprol（BAL，英國抗路易士劑）為二硫醇類螯合劑（chelating agent），用於砷、汞、鉛等重金屬中毒的解毒，不屬於驅蟲藥物類別。","錯誤：Chlorothiazide（氯噻嗪）為噻嗪類利尿劑（thiazide diuretic），作用於腎小管，促進鈉和水的排出，是心臟及腎臟疾病的輔助治療藥物，與驅蟲無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_072","year":2017,"roc_year":106,"session":"1","examNo":72,"q":"下列何者為dichlorophene的作用機制？","opts":["A. 造成蟲體氧化磷酸化之不偶合來耗盡絛蟲之ATP","B. 造成蟲體P-450之不偶合來耗盡絛蟲之ATP","C. 造成蟲體氧化磷酸化之不偶合來耗盡隱孢子蟲之ATP","D. 造成蟲體P-450之不偶合來耗盡隱孢子蟲之ATP"],"ans":0,"exp":"Dichlorophene（二氯酚）的驅絛蟲作用機制為破壞蟲體氧化磷酸化過程（uncoupling of oxidative phosphorylation），阻斷電子傳遞鏈與ATP合成的偶聯，使絛蟲（cestode）無法產生足夠的ATP維持生命活動而死亡。此機制與硝基咪唑類的部分驅蟲機制類似，但作用靶標為絛蟲（而非隱孢子蟲），且為氧化磷酸化去偶合而非P-450相關。","we":["","錯誤：P-450（細胞色素P450）去偶合並非dichlorophene的已知作用機制；dichlorophene的作用靶點是粒線體氧化磷酸化系統（線粒體呼吸鏈與ATP合酶的偶合），而非細胞色素P450酶系。","錯誤：Dichlorophene的作用靶標為絛蟲（cestodes，如犬絛蟲、貓絛蟲），而非隱孢子蟲（Cryptosporidium）；隱孢子蟲屬於球蟲類原蟲，需要不同類別的抗原蟲藥物。","錯誤：P-450去偶合作用於隱孢子蟲的描述既錯誤了作用機制（應為氧化磷酸化去偶合），也錯誤了作用靶標（應為絛蟲而非隱孢子蟲），雙重錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_073","year":2017,"roc_year":106,"session":"1","examNo":73,"q":"下列何者直接作用在黴菌細胞核，破壞有絲分裂？","opts":["A. amphotericin B","B. tonaftate","C. griseofulvin","D. ketoconazole"],"ans":2,"exp":"Griseofulvin（灰黃黴素）的作用靶點為真菌細胞核的有絲分裂機制，透過與微管蛋白（tubulin）結合，破壞有絲分裂紡錘體的形成，使真菌細胞無法正常進行有絲分裂（mitosis），從而抑制真菌生長（抑真菌性，fungistatic）。Griseofulvin在角蛋白組織（皮膚、毛髮、指爪）中積聚，適合口服治療皮膚癬菌（dermatophyte）感染。","we":["錯誤：Amphotericin B的作用機制為與真菌細胞膜中的麥角固醇（ergosterol）結合，破壞細胞膜通透性，使胞內重要物質外漏而殺菌，其作用在細胞膜而非細胞核或有絲分裂。","錯誤：Tolnaftate的作用機制為抑制角鯊烯環氧化酶（squalene epoxidase），干擾麥角固醇的早期合成步驟，屬於細胞膜脂質合成抑制，不作用於細胞核有絲分裂機制。","","錯誤：Ketoconazole（及其他唑類抗真菌藥）的作用機制為抑制真菌細胞色素P450酶（尤其是lanosterol 14α-demethylase），阻礙麥角固醇的合成，影響細胞膜完整性，作用靶點在膜固醇合成路徑而非細胞核有絲分裂。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_074","year":2017,"roc_year":106,"session":"1","examNo":74,"q":"下列何者為菸鹼性（nicotinic）驅線蟲藥？","opts":["A. piperazine","B. ivermectin","C. pyrantel","D. narasin"],"ans":2,"exp":"Pyrantel（噴他脲）為菸鹼性（nicotinic）膽鹼受體促效劑，作用於蟲體神經肌肉接合處的尼古丁型（nicotinic）乙醯膽鹼受體，引起去極化性肌肉麻痺（depolarizing neuromuscular blockade），使線蟲持續收縮痙攣而無法移動，最終被宿主排出。Pyrantel廣泛用於犬貓蛔蟲、鉤蟲及其他線蟲感染的治療。","we":["錯誤：Piperazine（哌嗪）的作用機制為GABA受體促效劑，使蟲體肌肉超極化（hyperpolarization）而鬆弛麻痺，與pyrantel的去極化麻痺機制相反，屬於GABAergic而非nicotinic機制。","錯誤：Ivermectin（艾維菌素）的作用機制為強化蟲體GABA調控的氯離子通道（Cl⁻ channel），或作用於麩胺酸調控的氯離子通道（GluCl），使氯離子內流增加造成細胞過極化（hyperpolarization），為GABAergic/glutamate-gated Cl⁻ channel機制，非nicotinic。","","錯誤：Narasin（那拉菌素）為聚醚類離子載體（ionophore）抗球蟲藥，主要用於家禽球蟲病的預防，干擾陽離子（Na⁺/K⁺）跨膜運輸，不屬於驅線蟲藥，也非nicotinic機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_075","year":2017,"roc_year":106,"session":"1","examNo":75,"q":"行政院衛生福利部公告sulfa drugs於乳汁中殘留量標準（容許量）為︰","opts":["A. 0.5 ppm","B. 0.1 ppm","C. 0.05 ppm","D. 0.01 ppm"],"ans":1,"exp":"台灣行政院衛生福利部（現衛生福利部食品藥物管理署）公告磺胺類藥物（sulfa drugs）在乳汁中的最高殘留容許量（MRL）為0.1 ppm（100 μg/kg），此為食品安全規範中保護人體健康的重要殘留標準，使用含磺胺類藥物治療泌乳牛後須嚴格遵守停藥期，確保乳品中殘留量不超標。","we":["錯誤：0.5 ppm高於台灣法規規定的標準值（0.1 ppm），選此值代表殘留容許量過寬鬆，與法規不符。","","錯誤：0.05 ppm低於台灣官方公告的殘留容許量（0.1 ppm），此值非法規規定標準。","錯誤：0.01 ppm明顯低於台灣官方公告的0.1 ppm標準，此值亦非法規規定的殘留容許量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_076","year":2017,"roc_year":106,"session":"1","examNo":76,"q":"家畜餵飼棉籽餅（cottonseed meal），可能導致下列何種物質中毒？","opts":["A. ammonia","B. gossypol","C. gallotannin","D. glycoside"],"ans":1,"exp":"棉籽餅（cottonseed meal）含有棉酚（gossypol），此為多酚性色素，存在於棉花腺體中。棉酚對單胃動物（豬、家禽）及未成熟反芻動物具有毒性，可引起心肌損傷（心臟毒性）、生殖毒性（精子損傷）及溶血等。在使用棉籽餅作為飼料原料時須注意棉酚含量，避免中毒。","we":["錯誤：氨（ammonia）中毒通常來自過量的非蛋白氮（non-protein nitrogen，NPN，如尿素urea）飼料，在反芻動物中瘤胃微生物將尿素分解過快時發生，與棉籽餅無關。","","錯誤：Gallotannin（沒食子鞣質）為橡樹（acorn/oak）的毒素成分，大量攝食橡果或橡樹葉後可引起鞣酸中毒，與棉籽餅的毒素（棉酚）完全不同。","錯誤：Glycoside（配糖體）是多種有毒植物（如氰苷植物、強心苷植物）的毒素形式，並非棉籽餅的主要毒素；棉籽餅的特徵性毒素是棉酚（gossypol），而非配糖體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_077","year":2017,"roc_year":106,"session":"1","examNo":77,"q":"下列何者最易殘留於脂肪組織？","opts":["A. cypermethrin","B. dichlorvos","C. methoxychlor","D. trichlorofon"],"ans":2,"exp":"Methoxychlor（甲氧氯）為有機氯類（organochlorine）殺蟲劑，與DDT結構相似，具有高度脂溶性（lipophilicity），使其易蓄積於動物脂肪組織中，造成長期殘留。有機氯農藥因高脂溶性及難以生物降解的特性，是已知最易在脂肪組織蓄積的殺蟲劑類別，並可沿食物鏈生物放大（biomagnification）。","we":["錯誤：Cypermethrin（氰戊菊酯）為合成除蟲菊酯類（pyrethroid）殺蟲劑，在哺乳動物體內代謝快速，不易在脂肪組織中蓄積，其脂溶性雖高但可被酯酶迅速水解，殘留性遠低於有機氯類。","錯誤：Dichlorvos（敵敵畏，DDVP）為有機磷（organophosphate）殺蟲劑，雖脂溶性中等，但在動物體內被膽鹼酯酶以外的酯酶快速水解代謝，不像有機氯類那樣在脂肪組織大量蓄積。","","錯誤：Trichlorfon（敵百蟲）為有機磷類殺蟲劑，在體內及環境中均可被水解代謝，脂溶性及殘留性遠低於有機氯類（如methoxychlor），不是最易殘留於脂肪組織的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_078","year":2017,"roc_year":106,"session":"1","examNo":78,"q":"Penicillamine於臨床治療上主要被用為：","opts":["A. 抗菌劑","B. 消毒劑","C. 解毒劑","D. 抗氧化劑"],"ans":2,"exp":"Penicillamine（青黴胺）為二甲基半胱胺酸的衍生物，含有巰基（-SH），可與重金屬（銅、鉛、汞、砷等）形成穩定的螯合物（chelates），促進重金屬從體內排出，臨床上用於銅中毒（Wilson氏病，犬肝銅蓄積症）、鉛中毒及其他重金屬中毒的解毒治療，屬於金屬螯合劑（chelating agent）。","we":["錯誤：Penicillamine雖然名稱含「penicillin」，但其本身無抗菌活性，不是抗菌劑；臨床上不用於感染性疾病的治療，其主要用途為重金屬解毒及類風濕性關節炎（人醫）。","錯誤：消毒劑（disinfectant）用於環境和器械的消毒滅菌，penicillamine無消毒作用，不屬於外用消毒劑類別。","","錯誤：抗氧化劑（antioxidant）雖然penicillamine的巰基（-SH）可理論上發揮部分抗氧化作用，但其主要臨床應用並非抗氧化用途，而是作為重金屬螯合解毒劑使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_079","year":2017,"roc_year":106,"session":"1","examNo":79,"q":"Cocaine對交感神經末梢分泌norepinephrine之主要影響為何？","opts":["A. 抑制重吸收","B. 促進分泌","C. 促進合成","D. 抑制分解"],"ans":0,"exp":"古柯鹼（cocaine）的主要作用機制為阻斷突觸前膜對正腎上腺素（norepinephrine，NE）的再攝取轉運蛋白（norepinephrine transporter，NET），使突觸間隙的NE濃度持續升高，強化並延長交感神經的效應（間接擬交感作用）。此機制也是cocaine及其他再攝取抑制劑（如三環抗憂鬱劑）產生交感擬似效果的主要原因。","we":["","錯誤：Cocaine不促進正腎上腺素的主動分泌（secretion）；cocaine是透過阻斷再攝取使NE在突觸間隙蓄積，而非刺激交感神經末梢釋放更多NE，兩者機制不同。","錯誤：Cocaine對正腎上腺素的合成（synthesis）無直接促進作用；影響NE合成的因素包括酪胺酸羥化酶的活性，但cocaine的作用靶點在再攝取轉運蛋白（NET），不是合成酶。","錯誤：抑制NE分解（inhibition of breakdown）是單胺氧化酶抑制劑（MAOIs）的作用機制，cocaine的主要機制是抑制再攝取（NET阻斷），而非抑制代謝分解酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1061_080","year":2017,"roc_year":106,"session":"1","examNo":80,"q":"活化尼古丁性受體後，所造成之離子移動，以何者為主？","opts":["A. K +","B. Ca++","C. Na+","D. Mg++"],"ans":2,"exp":"尼古丁性受體（nicotinic acetylcholine receptor，nAChR）為配位子調控的離子通道（ligand-gated ion channel），活化後主要使Na⁺大量流入（Na⁺ influx），引起突觸後膜去極化（depolarization），在神經肌肉接合處（NMJ）引起肌肉收縮，在自律神經節則傳遞神經衝動。K⁺雖然在去極化後有少量外流（repolarization），但Na⁺流入是活化的主要離子移動。","we":["錯誤：K⁺主要在去極化後的復極化（repolarization）階段流出細胞，而尼古丁性受體活化時的主要離子移動是Na⁺流入（內流），K⁺外流不是活化nAChR的主要後果。","錯誤：Ca²⁺雖然在nAChR活化時有少量流入，但其流量遠小於Na⁺，不是活化尼古丁性受體後離子移動的主要成分；Ca²⁺的主要內流是透過電壓依賴性Ca²⁺通道（VDCC），不是nAChR。","","錯誤：Mg²⁺在生理狀態下通道阻斷者（channel blocker）角色較常見於NMDA受體，並非尼古丁性受體活化後主要涉及的離子；nAChR活化時主要是Na⁺流入，而非Mg²⁺移動。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_001","year":2017,"roc_year":106,"session":"2","examNo":1,"q":"當藥物之hepatic extraction ratio接近於1時，其主要意義為何？","opts":["A. 藥物吸收後快速的分布至組織","B. 藥物經口投予後顯著的首渡效應","C. 藥物緊密結合於血漿蛋白","D. 藥物之清除不受肝臟血流量影響"],"ans":1,"exp":"Hepatic extraction ratio（肝臟萃取率）接近1，代表藥物幾乎在第一次通過肝臟時即被大量代謝，即顯著的首渡效應（first-pass effect）。此類藥物口服後生體可用率極低，因大部分藥物在到達全身循環前已在肝臟被代謝分解。Propranolol、lidocaine等均屬高萃取率藥物的典型例子。","we":["錯誤：快速分布至組織與肝臟萃取率無直接關係；分布速率取決於組織血流量和藥物的脂溶性，不由萃取率決定。","","錯誤：蛋白結合率高反而會降低游離藥物濃度，使肝臟可取用的游離藥物減少，可能降低萃取率，而非萃取率接近1的表徵。","錯誤：高萃取率藥物的清除恰好高度依賴肝臟血流量（flow-dependent clearance），血流增加則清除增加，血流減少則清除下降，描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_002","year":2017,"roc_year":106,"session":"2","examNo":2,"q":"多數酸性藥物主要和下列何種血漿蛋白結合？","opts":["A. 白蛋白（albumin）","B. 球蛋白（globulin）","C. α1 -酸性醣蛋白（α1 -acid glycoprotein）","D. 脂蛋白（lipoprotein）"],"ans":0,"exp":"多數酸性藥物（如NSAIDs、磺胺類、青黴素）主要與血漿白蛋白（albumin）結合，因為白蛋白帶有多個陰離子結合位點，可與酸性藥物的陰離子形式非共價結合。白蛋白是血漿中含量最豐富的蛋白質，是藥物血漿蛋白結合的主要載體。","we":["","錯誤：球蛋白（globulin）主要結合某些荷爾蒙（如甲狀腺素結合球蛋白、性荷爾蒙結合球蛋白），不是多數酸性藥物的主要結合蛋白。","錯誤：α1-酸性醣蛋白（α1-acid glycoprotein，AAG）主要與鹼性藥物（如利多卡因、普萘洛爾等鹼性藥物）結合，而非酸性藥物。","錯誤：脂蛋白（lipoprotein）主要結合高度脂溶性的藥物，不是酸性藥物的主要血漿蛋白結合對象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_003","year":2017,"roc_year":106,"session":"2","examNo":3,"q":"由公式0.693•藥物分布容積／廓清率可以得到何種參數？","opts":["A. 藥物之維持劑量","B. 藥物之清除速率","C. 藥物之半衰期","D. 藥物之血漿穩定濃度"],"ans":2,"exp":"公式 t½ = 0.693 × Vd / CL 即為藥物半衰期（half-life）的計算公式，其中Vd為分布容積、CL為廓清率。半衰期反映藥物血漿濃度降至原來一半所需的時間，是評估給藥間隔和藥物蓄積的重要參數。","we":["錯誤：維持劑量（maintenance dose）的計算公式為 CL × Css × 給藥間隔，而非 0.693 × Vd / CL。","錯誤：藥物清除速率（elimination rate）以 CL 或排除速率常數 ke（ke = CL/Vd = 0.693/t½）表示，0.693 × Vd / CL 求得的是半衰期，不是清除速率。","","錯誤：藥物血漿穩定濃度（steady-state concentration, Css）的計算為 Css = 投藥速率 / CL（或 F × 劑量 / CL × 給藥間隔），與此公式無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_004","year":2017,"roc_year":106,"session":"2","examNo":4,"q":"對於緩慢釋出之長效劑型而言，影響藥物效應之決定步驟主要為：","opts":["A. 藥物之分布速率","B. 藥物之吸收速率","C. 藥物之排除速率","D. 藥物之代謝速率"],"ans":1,"exp":"緩慢釋出長效劑型（sustained-release formulation）的設計原理是控制藥物的釋放速率，使藥物緩慢溶解後才被吸收。因此吸收速率（absorption rate）是限速步驟，決定藥物效應的持續時間和血中濃度的高低。分布、代謝和排除均發生在藥物被吸收之後，不是決定步驟。","we":["錯誤：分布速率決定藥物進入組織的快慢，發生在藥物被吸收後，不是長效劑型中決定藥物效應的限速步驟。","","錯誤：排除速率（elimination rate）影響藥物在體內的滯留時間，但對長效劑型而言，吸收速率才是主要的控速步驟。","錯誤：代謝速率影響藥物的生物轉化，但長效劑型的設計目標是控制釋放和吸收，代謝速率不是其決定步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_005","year":2017,"roc_year":106,"session":"2","examNo":5,"q":"當血漿之pH值為7.4而pKa值為4.4之酸性藥物，則血漿中離子化與非離子化藥物濃度之比為：","opts":["A. 1：1","B. 1：1000","C. 1000：1","D. 0.01：1"],"ans":2,"exp":"依照Henderson-Hasselbalch方程式：pH = pKa + log([A⁻]/[HA])，將數值代入：7.4 = 4.4 + log([A⁻]/[HA])，故 log([離子化]/[非離子化]) = 3，即 [離子化]/[非離子化] = 10³ = 1000，因此離子化與非離子化濃度之比為1000：1。在生理pH（7.4）下，pKa為4.4的弱酸性藥物幾乎完全以離子化形式存在。","we":["錯誤：1:1代表離子化與非離子化各半，僅在pH = pKa（即pH = 4.4）時成立，不是在pH 7.4的情況。","錯誤：1:1000表示非離子化遠多於離子化，僅在酸性環境（pH遠低於pKa）下才成立，在pH 7.4時弱酸應以離子化為主。","","錯誤：0.01:1表示離子化極少，計算結果不符；pH 7.4 與 pKa 4.4 相差3個單位，比值應為10³，不是0.01:1。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_006","year":2017,"roc_year":106,"session":"2","examNo":6,"q":"下列何者屬於藥效學之範圍？","opts":["A. 藥物之EC50","B. 藥物之Cmax","C. 藥物之半衰期","D. 藥物之廓清率"],"ans":0,"exp":"藥效學（pharmacodynamics）研究藥物對生物體的生理和生化效應及其作用機制，EC50（半數有效濃度）是劑量-效應關係的重要參數，屬於藥效學的範疇。相對而言，Cmax（最大血漿濃度）、半衰期（t½）和廓清率（clearance）均為描述藥物在體內吸收、分布、代謝、排除過程的藥物動力學（pharmacokinetics）參數。","we":["","錯誤：Cmax（峰值血漿濃度）是藥物動力學參數，描述口服後血漿濃度達到的最高值，反映吸收速率和程度，不屬於藥效學。","錯誤：半衰期（t½）描述血漿濃度降至一半所需時間，為藥物動力學的消除參數，不屬於藥效學。","錯誤：廓清率（clearance）是藥物動力學參數，表示單位時間內能被完全清除藥物的血漿體積，不是藥效學的範疇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_007","year":2017,"roc_year":106,"session":"2","examNo":7,"q":"貓因為缺乏glucuronyl transferase，因此藥物aspirin之排除主要遵循下列何種機制？","opts":["A. first-pass effect","B. first-order kinetics","C. zero-order kinetics","D. biphasic kinetics"],"ans":2,"exp":"貓缺乏葡萄糖醛酸轉移酶（glucuronyl transferase），使得aspirin的主要代謝途徑（葡萄糖醛酸結合）受到限制。由於代謝酶量有限，超過酶飽和量後，代謝不再隨濃度成比例增加，呈現零級動力學（zero-order kinetics），即藥物以固定速率代謝，半衰期隨劑量增加而延長，容易造成毒性蓄積。","we":["錯誤：首渡效應（first-pass effect）指口服藥物在進入全身循環前於肝臟被代謝，描述的是代謝部位和途徑，不是排除動力學模式。","錯誤：一級動力學（first-order kinetics）是指消除速率與藥物濃度成正比，酶未飽和時成立；貓缺乏glucuronyl transferase導致酶飽和，應為零級動力學。","","錯誤：雙相動力學（biphasic kinetics）描述藥物在體內呈現快速分布相和慢速消除相兩個階段，不是本題中酶飽和導致的動力學變化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_008","year":2017,"roc_year":106,"session":"2","examNo":8,"q":"關於doxapram的敘述，下列何者錯誤？","opts":["A. 於獸醫學上可做為呼吸興奮劑","B. 可活化主動脈和頸動脈的化學受體","C. 使用於麻醉劑過量之動物，會降低麻醉的深度，但作用可能很短暫","D. 對嚴重呼吸抑制之新生動物的甦醒有效"],"ans":3,"exp":"Doxapram是呼吸興奮劑，主要透過刺激頸動脈和主動脈化學受體（外周化學感受器）來興奮呼吸中樞。然而，對於嚴重呼吸抑制的新生動物（如深度麻醉或缺氧的新生仔），doxapram的效果非常有限甚至無效，因為嚴重抑制狀態下化學感受器的反應性極差。因此選項D（對嚴重呼吸抑制之新生動物有效）為錯誤描述。","we":["此為正確描述：Doxapram在獸醫臨床上確實用作呼吸興奮劑，用於麻醉後呼吸恢復、新生動物窒息等情況，不符合「錯誤」描述。","此為正確描述：Doxapram確實可活化主動脈弓和頸動脈竇的化學受體（外周化學感受器），反射性興奮呼吸中樞，不符合「錯誤」描述。","此為正確描述：Doxapram用於麻醉劑過量時可降低麻醉深度，但其效果短暫（約5-10分鐘），需反覆給藥，不符合「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_009","year":2017,"roc_year":106,"session":"2","examNo":9,"q":"關於benzodiazepines的描述，下列何者錯誤？","opts":["A. 可以使用為抗痙攣劑","B. 主要增加鈉離子通道開啟的活性而引起神經高度極化","C. 貓口服diazepam幾日後可能出現急性肝壞死","D. 犬靜脈注射可以控制癲癇重積狀態及密集發作"],"ans":1,"exp":"苯二氮平類（benzodiazepines，BZDs）透過增強GABA-A受體的氯離子（Cl⁻）通道開啟頻率（frequency）發揮作用，使細胞膜超極化（hyperpolarization），抑制神經元興奮性。選項B錯誤在於描述BZDs增加鈉離子通道活性並引起神經高度極化（depolarization），此與實際藥理機制相反。","we":["此為正確描述：Benzodiazepines確實可用作抗痙攣劑（anticonvulsants），如diazepam用於治療癲癇重積狀態，不符合「錯誤」描述。","","此為正確描述：貓口服diazepam數日後確實有急性肝壞死（fulminant hepatic necrosis）的案例報告，是貓使用benzodiazepines的重要安全顧慮，不符合「錯誤」描述。","此為正確描述：犬靜脈注射benzodiazepines（如diazepam）確實可控制癲癇重積狀態（status epilepticus）及密集發作，為臨床常用方法，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_010","year":2017,"roc_year":106,"session":"2","examNo":10,"q":"關於propofol的敘述，下列何者錯誤？","opts":["A. 臨床上以靜脈注射投予","B. 經由活化伽瑪-胺基丁酸A型受體引起麻醉","C. 藥效發揮快速且誘導平順，但是重覆投藥會發生蓄積","D. 和血漿蛋白高度結合"],"ans":2,"exp":"Propofol的一大優點是在肝臟和肝外（肺、腎臟等）均可快速代謝，體內清除率極高（超過肝血流量），因此重覆給藥後蓄積效應很小，恢復仍然迅速。選項C描述「重覆投藥會發生蓄積」為錯誤。其餘選項均正確：propofol以靜脈注射投予、透過活化GABA-A受體產生麻醉、且高度與血漿蛋白結合。","we":["此為正確描述：Propofol在臨床上確實以靜脈注射（IV）投予，通常製成乳劑，不符合「錯誤」描述。","此為正確描述：Propofol確實透過增強GABA-A受體的氯離子電流（超極化）來產生鎮靜麻醉作用，不符合「錯誤」描述。","","此為正確描述：Propofol與血漿蛋白（主要是白蛋白）的結合率極高（約97-98%），不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_011","year":2017,"roc_year":106,"session":"2","examNo":11,"q":"若用於惠比特犬（whippets）的誘導麻醉，下列何者恢復時間較短？","opts":["A. phenobarbital","B. pentobarbital","C. methohexital","D. etorphine"],"ans":2,"exp":"惠比特犬（Whippets）屬於視覺獵犬（sighthound），體脂肪極低，且肝臟CYP450酶活性與一般品種犬不同，對巴比妥類藥物的代謝較差。Methohexital（甲己炔巴比妥）為超短效巴比妥類藥物，其超短效性源於快速再分布，恢復時間顯著短於pentobarbital（短中效）或phenobarbital（長效）。Etorphine為鴉片類藥物，類別不同。","we":["錯誤：Phenobarbital（苯巴比妥）為長效巴比妥類，消除半衰期長達數十至上百小時，在Whippets中恢復時間非常長，不適合用於麻醉誘導。","錯誤：Pentobarbital（戊巴比妥）為短中效巴比妥類，在Whippets中因代謝緩慢而恢復時間較methohexital長很多，不是恢復時間最短的選項。","","錯誤：Etorphine為強效全效鴉片受體致效劑，屬於鴉片類（opioid），不是巴比妥類，不在比較麻醉恢復時間的範疇內，且在犬的使用受限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_012","year":2017,"roc_year":106,"session":"2","examNo":12,"q":"臨床上acepromazine不適合使用於下列何種目的？","opts":["A. 止吐作用","B. 預防心律不整","C. 鎮痛作用","D. 安神作用"],"ans":2,"exp":"Acepromazine為吩噻嗪類安神劑，其主要藥理作用包括：D2受體阻斷（止吐）、α1腎上腺素受體阻斷（預防心律不整中的腎上腺素敏化效應）和多巴胺受體阻斷（安神）。然而，acepromazine本身不具有鎮痛（analgesia）作用，不能用於止痛目的，這是其重要的臨床限制。","we":["錯誤：Acepromazine透過阻斷多巴胺D2受體（CTZ的嘔吐觸發帶），確實具有止吐（antiemetic）作用，是臨床上的適應症之一。","錯誤：Acepromazine透過α1腎上腺素受體阻斷，可減少腎上腺素對心肌的敏化效應，具有預防某些心律不整的功效，為適當用途。","","錯誤：Acepromazine的主要臨床適應症之一就是安神（sedation/tranquilization），透過阻斷多巴胺受體發揮鎮靜效果，用於術前給藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_013","year":2017,"roc_year":106,"session":"2","examNo":13,"q":"下列何者最方便、最適合用於小型囓齒類實驗動物之安樂死？","opts":["A. curare","B. T-61","C. CO2","D. hydrogen cyanide"],"ans":2,"exp":"對小型囓齒類實驗動物（如小鼠、大鼠）執行安樂死，CO2吸入法是最方便、最廣泛接受的方法。CO2濃度逐漸升高可先引起無意識（鎮靜/麻醉），再導致呼吸停止，過程相對人道，且操作簡便、低成本、不需注射。此方法為AVMA和多數實驗動物指導方針所認可。","we":["錯誤：Curare（箭毒）為神經肌肉阻斷劑，造成骨骼肌麻痺（包括呼吸肌），動物在意識清醒下窒息死亡，非常不人道，不符合安樂死的定義。","錯誤：T-61為三合一安樂死藥（含乳化劑、鎮靜劑和心臟毒劑），需要靜脈注射，對小型囓齒類操作困難，不是最方便的方法。","","錯誤：氫氰酸（hydrogen cyanide，HCN）為極度危險的劇毒氣體，對操作人員有嚴重生命危險，不適合用於實驗動物安樂死操作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_014","year":2017,"roc_year":106,"session":"2","examNo":14,"q":"具有抗心律不整的局部麻醉藥是：","opts":["A. lidocaine","B. etidocaine","C. mepivacaine","D. ropivacaine"],"ans":0,"exp":"Lidocaine（利多卡因）是唯一同時具有局部麻醉和抗心律不整雙重作用的藥物。作為局部麻醉劑，它阻斷神經的電壓依賴性鈉通道；作為抗心律不整藥（Class Ib），它縮短心室不應期、抑制心室異位搏動，常用於治療心室性心律不整（如心室纖維性顫動、心室快速心跳）。","we":["","錯誤：Etidocaine為長效局部麻醉劑（醯胺類），主要用於手術麻醉，不具有顯著的抗心律不整臨床應用。","錯誤：Mepivacaine為中效局部麻醉劑，主要用於局部和區域阻斷麻醉，不具抗心律不整的臨床用途。","錯誤：Ropivacaine為長效局部麻醉劑，對心臟毒性較低，但不具備抗心律不整的臨床作用，主要用於區域阻斷麻醉和硬膜外麻醉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_015","year":2017,"roc_year":106,"session":"2","examNo":15,"q":"Ketamine之作用係透過阻斷以下何種受體？","opts":["A. nicotine 受體","B. dopamine 受體","C. GABA 受體","D. NMDA 受體"],"ans":3,"exp":"Ketamine（氯胺酮）是非競爭性NMDA（N-甲基-D-天冬胺酸）受體拮抗劑，透過阻斷NMDA受體的離子通道（開放通道阻斷，open channel block）發揮解離性麻醉（dissociative anesthesia）效果。此機制可阻斷疼痛傳導、降低中樞敏化，並保留保護性反射（咽喉反射）。","we":["錯誤：菸鹼素受體（nicotinic receptor）為乙醯膽鹼受體的離子通道型亞型，位於神經肌肉接頭和自律神經節；ketamine的主要作用靶點為NMDA受體，不是菸鹼素受體。","錯誤：多巴胺受體為G蛋白偶聯受體，參與情緒和運動調控；ketamine對多巴胺受體的親和力遠低於NMDA受體，不是其主要作用機制。","錯誤：GABA-A受體為氯離子通道，增強其功能的藥物（如苯二氮平類、丙泊酚）引起過度鎮靜；ketamine不是GABA受體的主要作用藥物，其機制為NMDA受體阻斷。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_016","year":2017,"roc_year":106,"session":"2","examNo":16,"q":"下列有關methoxyflurane與isoflurane差異的敘述中，何者正確？","opts":["A. methoxyflurane具有較快的誘導","B. isoflurane的血／氣分配係數較小","C. methoxyflurane排出體外的速度較快","D. isoflurane的代謝百分率較高"],"ans":1,"exp":"Isoflurane的血/氣分配係數（blood/gas partition coefficient）約為1.4，遠低於methoxyflurane的約12，因此isoflurane在血液中溶解度較低，麻醉誘導和恢復均較methoxyflurane更快。Methoxyflurane因血中溶解度高（高血/氣分配係數），誘導慢且恢復慢，代謝率約50%，遠高於isoflurane的約0.2%。","we":["錯誤：Methoxyflurane的血/氣分配係數高（約12），血中溶解度大，麻醉誘導緩慢，恰與此選項相反；isoflurane才是誘導較快的。","","錯誤：Methoxyflurane血/氣分配係數高，在血液中大量溶解，排出體外的速度比isoflurane慢很多，而非較快。","錯誤：Isoflurane的代謝百分率極低（約0.2%），遠低於methoxyflurane（約50%）；描述相反，isoflurane不是代謝百分率較高的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_017","year":2017,"roc_year":106,"session":"2","examNo":17,"q":"臨床上使用spironolactone利尿後，所產生之不良反應主要為何？","opts":["A. 代謝性酸中毒","B. 高血糖症","C. 高血鈣症","D. 高血鉀症"],"ans":3,"exp":"Spironolactone（螺內酯）為醛固酮拮抗劑，屬於保鉀利尿劑（potassium-sparing diuretic）。它透過競爭性阻斷醛固酮受體，抑制遠曲小管和集合管的Na⁺再吸收及K⁺分泌，導致鉀離子滯留於體內，主要不良反應為高血鉀症（hyperkalemia）。腎功能不全或同時使用ACE抑制劑時風險更高。","we":["錯誤：代謝性酸中毒較常見於loop利尿劑或噻嗪類利尿劑大量使用導致的低鉀低氯性鹼中毒的對立情況；spironolactone保鉀，長期使用反而可能引起輕度代謝性酸中毒（高氯性），但主要不良反應是高血鉀，而非酸中毒。","錯誤：高血糖症（hyperglycemia）是噻嗪類利尿劑（如hydrochlorothiazide）的不良反應，與spironolactone阻斷醛固酮受體無直接關聯。","錯誤：高血鈣症（hypercalcemia）不是spironolactone的典型不良反應；噻嗪類利尿劑反而可增加鈣離子再吸收造成高血鈣，而spironolactone不影響鈣調節。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_018","year":2017,"roc_year":106,"session":"2","examNo":18,"q":"下列何者最適合優先使用於控制犬之高血壓？","opts":["A. digitalis","B. enalapril","C. dobutamine","D. yohimbine"],"ans":1,"exp":"Enalapril為ACE抑制劑（血管收縮素轉換酶抑制劑），可抑制angiotensin I轉化為angiotensin II，降低全身血管阻力，是犬高血壓及鬱血性心衰竭的第一線抗高血壓藥物。其同時具有腎臟保護作用，對蛋白尿的犬尤其適合。","we":["錯誤：Digitalis（洋地黃）為強心配糖體，抑制Na⁺/K⁺-ATPase增加心肌收縮力，用於心衰竭的正性肌力支持，不是第一線抗高血壓藥物。","","錯誤：Dobutamine為選擇性β1腎上腺素受體致效劑，增加心臟收縮力，用於急性心衰竭的緊急正性肌力支持，不適合用於控制高血壓。","錯誤：Yohimbine為α2腎上腺素受體拮抗劑，主要用於逆轉α2致效劑（如xylazine）的鎮靜效果，不是抗高血壓藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_019","year":2017,"roc_year":106,"session":"2","examNo":19,"q":"Acetazolamide作用在腎元的那一個部位？","opts":["A. 近端腎小管","B. 亨利氏環上行支","C. 遠端腎小管前端","D. 遠端腎小管後端"],"ans":0,"exp":"Acetazolamide（乙酰唑胺）為碳酸酐酶抑制劑（carbonic anhydrase inhibitor），其作用部位為近端腎小管（proximal tubule）。在近端腎小管上皮細胞，碳酸酐酶催化CO2和H2O轉化為HCO3⁻和H⁺，抑制此酶後HCO3⁻再吸收減少，大量NaHCO3隨尿液排出，產生鹼性尿。","we":["","錯誤：亨利氏環上行支（thick ascending limb）是loop利尿劑（furosemide、bumetanide）的作用部位，抑制NKCC2共同運輸體，不是acetazolamide的作用部位。","錯誤：遠端腎小管前端是噻嗪類利尿劑（如hydrochlorothiazide）的作用部位，抑制Na-Cl共同運輸體（NCC），不是acetazolamide的作用部位。","錯誤：遠端腎小管後端及集合管是保鉀利尿劑（spironolactone、amiloride）和ADH的作用部位，不是acetazolamide的主要作用位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_020","year":2017,"roc_year":106,"session":"2","examNo":20,"q":"Digitalis的強心作用機制是：","opts":["A. 抑制phosphodiesterase","B. 結合於β1 -adrenergic receptors","C. 促進Na+ -Ca++ATPase","D. 抑制Na+ , K+ -ATPase"],"ans":3,"exp":"Digitalis（洋地黃苷）的正性肌力作用機制是抑制心肌細胞膜上的Na⁺/K⁺-ATPase（鈉鉀幫浦）。幫浦受抑制後，細胞內Na⁺升高，進而減少Na⁺/Ca²⁺交換器（NCX）排出Ca²⁺，導致細胞內Ca²⁺增加，心肌收縮力增強。此為強心配糖體特有的正性肌力機制。","we":["錯誤：抑制磷酸二酯酶（phosphodiesterase）的機制屬於amrinone、milrinone等藥物，使cAMP升高→鈣離子增加，不是digitalis的機制。","錯誤：結合β1腎上腺素受體是dobutamine、epinephrine等擬交感神經藥的機制；digitalis不透過β受體發揮正性肌力作用。","錯誤：促進Na⁺-Ca²⁺ ATPase（NCX）與digitalis機制相反；digitalis是透過抑制Na⁺/K⁺-ATPase間接減少NCX對Ca²⁺的排出，並非直接促進Na⁺-Ca²⁺ ATPase。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_021","year":2017,"roc_year":106,"session":"2","examNo":21,"q":"下列血管擴張劑中，何者對小動脈平滑肌有顯著擴張作用，但對靜脈平滑肌的作用卻很弱？","opts":["A. hydralazine","B. nitroglycerine","C. sodium nitroprusside","D. isosorbide dinitrate"],"ans":0,"exp":"Hydralazine（肼苯噠嗪）為直接作用的血管擴張劑，選擇性鬆弛小動脈（arteriole）平滑肌，對靜脈平滑肌作用很弱，主要降低後負荷（afterload）。其機制可能涉及干擾鈣離子釋放或激活cGMP。常用於犬的高血壓和鬱血性心衰竭的後負荷降低。","we":["","錯誤：Nitroglycerine（硝化甘油）主要擴張靜脈（venous dilator），降低前負荷（preload），對小動脈作用相對弱，作用特性與hydralazine相反。","錯誤：Sodium nitroprusside（亞硝酸鈉）為NO供體，同時擴張動脈和靜脈（mixed dilator），同時降低前負荷和後負荷，不是選擇性動脈擴張劑。","錯誤：Isosorbide dinitrate（二硝酸異山梨酯）與nitroglycerine相似，主要作用於靜脈，降低前負荷，不是選擇性動脈擴張劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_022","year":2017,"roc_year":106,"session":"2","examNo":22,"q":"下列何者的作用機制是抑制phosphodiesterase導致細胞內cAMP增加，造成細胞內鈣離子亦增加而使心肌收\r 縮？","opts":["A. digoxin","B. dobutamine","C. amrinone","D. nitroprusside"],"ans":2,"exp":"Amrinone（氨力農）為雙吡啶類正性肌力藥，其作用機制是抑制心肌細胞的磷酸二酯酶III（PDE III），使cAMP分解減少、細胞內cAMP濃度升高，活化蛋白激酶A（PKA），磷酸化L型鈣通道使Ca²⁺內流增加，最終增強心肌收縮力。","we":["錯誤：Digoxin（地高辛）的正性肌力機制是抑制Na⁺/K⁺-ATPase，間接增加細胞內Ca²⁺，不是磷酸二酯酶抑制機制。","錯誤：Dobutamine為選擇性β1腎上腺素受體致效劑，透過活化腺苷酸環化酶（adenylyl cyclase）增加cAMP，而非直接抑制磷酸二酯酶。","","錯誤：Nitroprusside（亞硝酸鈉）為NO供體，促進平滑肌cGMP生成，引起血管擴張（降後負荷），不具正性肌力作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_023","year":2017,"roc_year":106,"session":"2","examNo":23,"q":"下列抗心律不整藥，何者可在竇房結和房室結拮抗迷走神經作用？","opts":["A. atropine","B. atenolol","C. amiodarone","D. diltiazem"],"ans":0,"exp":"Atropine（阿托品）為毒蕈鹼（muscarinic）受體拮抗劑，可競爭性拮抗副交感神經（迷走神經）在竇房結（SA node）和房室結（AV node）的作用，增加心跳速率和房室傳導速度，用於治療迷走神經過度興奮引起的心搏過緩和房室傳導阻滯。","we":["","錯誤：Atenolol為選擇性β1腎上腺素受體阻斷劑，阻斷交感神經對心臟的興奮作用，降低心率，不是拮抗迷走神經效應的藥物。","錯誤：Amiodarone為Class III抗心律不整藥，主要阻斷鉀離子通道延長動作電位時程，不透過拮抗迷走神經發揮作用。","錯誤：Diltiazem為非二氫吡啶類鈣離子阻斷劑，抑制L型鈣通道，減慢竇房結和房室結的傳導，作用與atropine相反（不拮抗迷走神經，而是進一步抑制傳導）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_024","year":2017,"roc_year":106,"session":"2","examNo":24,"q":"下列何者能抑制血小板凝集？","opts":["A. aminocaproic acid","B. tranexamic acid","C. clopidogrel","D. protamine sulfate"],"ans":2,"exp":"Clopidogrel（氯吡格雷）為P2Y12 ADP受體阻斷劑，屬於抗血小板藥物，透過不可逆地抑制ADP與血小板P2Y12受體結合，阻斷血小板活化和聚集。常用於犬貓的動脈血栓預防（如貓的主動脈血栓）。","we":["錯誤：Aminocaproic acid（胺基己酸）為抗纖維蛋白溶解藥（antifibrinolytic），抑制纖溶酶原活化，促進血凝（止血），與抑制血小板凝集的作用相反。","錯誤：Tranexamic acid（氨甲環酸）同為抗纖維蛋白溶解藥，用於手術止血，不具抑制血小板凝集的作用。","","錯誤：Protamine sulfate（硫酸魚精蛋白）為肝素的拮抗劑，透過帶正電荷的多肽與帶負電荷的肝素結合使之失活，不是血小板凝集抑制劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_025","year":2017,"roc_year":106,"session":"2","examNo":25,"q":"下列何者對巨母紅血球性貧血症無效？","opts":["A. cyanocobalamin","B. intrinsic factor of gastric mucosal cells","C. folic acid","D. ferrous sulfate"],"ans":3,"exp":"巨母紅血球性貧血（megaloblastic anemia）由維生素B12（氰鈷胺）或葉酸缺乏引起，需補充B12、內在因子（協助B12吸收）或葉酸治療。Ferrous sulfate（硫酸亞鐵）為鐵劑，用於治療缺鐵性貧血（小球性低色素性貧血），對巨母紅血球性貧血無效，因為巨母紅血球性貧血的病因是DNA合成障礙而非鐵缺乏。","we":["錯誤：Cyanocobalamin（維生素B12）為治療維生素B12缺乏引起的巨母紅血球性貧血的有效藥物，對此症有效。","錯誤：胃黏膜細胞的內在因子（intrinsic factor）與B12結合後促進其在迴腸的吸收，可有效治療惡性貧血（pernicious anemia，一種B12缺乏引起的巨母紅血球性貧血），對此症有效。","錯誤：Folic acid（葉酸）為治療葉酸缺乏引起的巨母紅血球性貧血的有效藥物，對此症有效。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_026","year":2017,"roc_year":106,"session":"2","examNo":26,"q":"下列何者為serotonin受體抑制劑？","opts":["A. cyproheptadine","B. hydroxyzine","C. dobutamine","D. phenylephrine"],"ans":0,"exp":"Cyproheptadine（賽庚啶）為第一代抗組織胺藥（H1受體拮抗劑），同時也是血清素（serotonin，5-HT2）受體拮抗劑，因此兼具H1和serotonin受體阻斷雙重活性。在獸醫上用於貓的食慾不振（透過5-HT2阻斷促食慾）、過敏性皮膚病及貓的哮喘。","we":["","錯誤：Hydroxyzine（羥嗪）為H1受體拮抗劑，具鎮靜和抗焦慮作用，不具有serotonin受體拮抗活性，不是serotonin受體抑制劑。","錯誤：Dobutamine為選擇性β1腎上腺素受體致效劑，用於增強心肌收縮力，完全不作用於血清素受體。","錯誤：Phenylephrine為選擇性α1腎上腺素受體致效劑，用於血管收縮和解除鼻充血，不作用於serotonin受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_027","year":2017,"roc_year":106,"session":"2","examNo":27,"q":"下列何種成分，可與維生素E共同作用降低脂肪的過氧化作用？","opts":["A. 鈣","B. 鎂","C. 磷","D. 硒"],"ans":3,"exp":"硒（selenium）是穀胱甘肽過氧化酶（glutathione peroxidase，GPx）的必需組成成分，此酶負責清除脂質過氧化物（lipid hydroperoxides），與維生素E的抗氧化作用協同，共同保護細胞膜免受脂質過氧化的損傷。缺硒動物（尤其牛羊）容易發生白肌病（white muscle disease）。","we":["錯誤：鈣（calcium）在脂質過氧化的防護中沒有直接協同作用；鈣主要參與骨骼形成、肌肉收縮和訊號傳遞，不是維生素E的協同抗氧化成分。","錯誤：鎂（magnesium）為多種酶的輔助因子，參與ATP代謝和肌肉功能，但不具備與維生素E協同降低脂質過氧化的特定機制。","錯誤：磷（phosphorus）主要構成骨骼、磷脂和ATP，不具備與維生素E協同抗脂質過氧化的特定功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2017_藥理_1062_028","year":2017,"roc_year":106,"session":
