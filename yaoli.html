<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>獸醫藥理學 歷屆國考題庫 v1</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:#2e3347;--border2:#3d4260;
  --text:#e8eaf6;--text2:#9096b8;--text3:#555d80;
  --accent:#5c6bc0;--accent2:#7986cb;
  --green:#43a867;--green-bg:#0d2318;--green-border:#1e4d32;
  --red:#e05252;--red-bg:#250f0f;--red-border:#4d1f1f;
  --yellow:#f0c060;--yellow-bg:rgba(240,192,96,.08);--yellow-border:rgba(240,192,96,.3);
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:740px;margin:0 auto}
.hdr{margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1.25rem}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.mono{font-family:"Courier New",Courier,monospace}
.lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
h1{font-size:21px;font-weight:700;line-height:1.3}
.sub{font-size:12px;color:var(--text3);margin-top:4px}
.stats{display:flex;gap:8px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;text-align:center;min-width:56px}
.st-n{font-size:18px;font-weight:700;font-family:"Courier New",monospace}
.st-l{font-size:10px;color:var(--text3);margin-top:2px}
.ctrl{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.csel{flex:1;min-width:180px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;cursor:pointer}
.csel:focus{outline:none;border-color:var(--accent)}
.modes{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px}
.mb{flex:1;padding:7px 10px;font-size:13px;border-radius:7px;border:none;background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s}
.mb:hover{color:var(--text)}
.mb.on{background:var(--bg3);color:var(--text);font-weight:500}
.pb{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1rem}
.meta{display:flex;align-items:center;gap:7px;margin-bottom:.9rem;flex-wrap:wrap}
.bdg{font-size:11px;padding:3px 9px;border-radius:20px;font-family:"Courier New",monospace}
.bdg-yr{background:rgba(92,107,192,.2);color:var(--accent2);border:1px solid rgba(92,107,192,.3)}
.bdg-src{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.bdg-rv{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.qn{font-size:12px;color:var(--text3);margin-left:auto;font-family:"Courier New",monospace}
.qt{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:14px;color:var(--text2);transition:.15s;display:flex;gap:9px;align-items:flex-start;line-height:1.6;background:var(--bg)}
.opt:hover:not(.dis){border-color:var(--border2);color:var(--text);background:var(--bg3)}
.opt.ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.opt.no{border-color:var(--red-border);background:var(--red-bg);color:#f08080;cursor:pointer}
.opt.dis{cursor:default}
.okey{font-weight:700;min-width:18px;flex-shrink:0;font-family:"Courier New",monospace;font-size:13px}
.exp{margin-top:.9rem;padding:13px 15px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.exp.show{display:block}
.exp-t{font-weight:700;color:var(--accent2);margin-bottom:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.wexp{margin-top:.6rem;padding:11px 14px;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.wexp.show{display:block}
.wexp-t{font-weight:700;color:#f08080;margin-bottom:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.act{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:8px}
.btn{padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);font-size:13px;color:var(--text2);cursor:pointer;transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:default}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btnp:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.res{text-align:center;padding:2.5rem 1rem}
.res-s{font-size:52px;font-weight:700;font-family:"Courier New",monospace}
.res-sub{font-size:13px;color:var(--text3);margin-top:5px}
.res-row{display:flex;gap:2rem;justify-content:center;margin:1.25rem 0}
.ri{text-align:center}
.rn{font-size:22px;font-weight:700;font-family:"Courier New",monospace}
.rl{font-size:12px;color:var(--text3);margin-top:3px}
.grn{color:var(--green)}.red{color:var(--red)}
.note-box{margin-top:.6rem;padding:10px 14px;background:var(--yellow-bg);border-left:3px solid var(--yellow-border);border-radius:0 var(--rs) var(--rs) 0;font-size:12px;color:var(--yellow);line-height:1.7}
.foot{text-align:center;margin-top:2.5rem;font-size:11px;color:var(--text3);font-family:"Courier New",monospace;border-top:1px solid var(--border);padding-top:1.25rem}
.q-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:.75rem 0 .25rem}
.q-imgs img{max-width:100%;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg3);cursor:pointer}
.q-imgs img:hover{border-color:var(--border2)}
.nav-wrap{margin-bottom:1rem}
.nav-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;user-select:none}
.nav-hdr:hover{border-color:var(--border2)}
.nav-title{font-size:12px;color:var(--text2);font-family:"Courier New",monospace;letter-spacing:.05em}
.nav-arrow{font-size:10px;color:var(--text3);transition:transform .2s}
.nav-arrow.open{transform:rotate(180deg)}
.nav-grid{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:160px;overflow-y:auto}
.nav-grid.hidden{display:none}
.qnb{width:34px;height:30px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text3);font-size:11px;font-family:"Courier New",monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.qnb:hover{border-color:var(--accent2);color:var(--text)}
.qnb.cur{border-color:var(--accent2);background:var(--accent);color:#fff;font-weight:700}
.qnb.ans-ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.qnb.ans-ok.cur{background:var(--green);color:#fff}
.qnb.ans-no{border-color:var(--red-border);background:var(--red-bg);color:#f08080}
.qnb.ans-no.cur{background:var(--red);color:#fff}
.opt.peek{cursor:pointer;border-color:var(--yellow-border);color:var(--text2)}
.opt.peek:hover{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.07);color:var(--text)}
.opt.peek-active{border-color:rgba(240,192,96,.6) !important;background:rgba(240,192,96,.1) !important;color:var(--text) !important}
@media(max-width:480px){
  h1{font-size:18px}
  .st{padding:6px 9px;min-width:48px}.st-n{font-size:16px}
  .mb{font-size:12px;padding:6px 6px}
  .qt{font-size:14px}
  .qnb{width:30px;height:28px;font-size:10px}
}
.btn-ai{background:rgba(121,134,203,.15);border-color:rgba(121,134,203,.3);color:var(--accent2)}
.btn-ai:hover{background:rgba(121,134,203,.25);color:var(--text);border-color:var(--accent)}
.ec-badge{background:rgba(240,96,96,.2);color:#f08080;border:1px solid rgba(240,96,96,.3)}
.btn-clr{padding:5px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;letter-spacing:.03em}
.btn-clr:hover{color:var(--red);border-color:var(--red-border)}
.btn-exam{padding:7px 14px;border-radius:var(--rs);border:1px solid rgba(92,107,192,.4);background:rgba(92,107,192,.15);font-size:13px;color:var(--accent2);cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn-exam:hover{background:rgba(92,107,192,.28);color:var(--text);border-color:var(--accent)}
.btn-unsure{background:rgba(240,192,96,.08);border-color:rgba(240,192,96,.25);color:var(--text3)}
.btn-unsure:hover{background:rgba(240,192,96,.18);color:var(--yellow);border-color:var(--yellow-border)}
.btn-unsure.active{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow);font-weight:500}
.qnb.ans-unsure{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.08);color:var(--yellow)}
.qnb.ans-unsure.cur{background:var(--yellow);color:#0f1117;font-weight:700}
.unsure-tag{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.wrong-tag{background:rgba(224,82,82,.15);color:#f08080;border:1px solid var(--red-border)}
.fc-container{margin-bottom:1.2rem}
.fc-container>.fc-wrap{margin-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fc-container>.fc-wrap .fc-front,.fc-container>.fc-wrap .fc-back{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.fc-note{border:1px solid var(--border);border-radius:0 0 var(--r) var(--r);padding:.85rem 1.1rem;background:var(--bg)}
.fc-note-hdr{display:flex;align-items:center;gap:8px;margin-bottom:.55rem;flex-wrap:wrap}
.fc-note-label{font-size:11px;color:var(--text3);font-family:"Courier New",monospace;flex:1}
.fc-note-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;line-height:1.7;padding:8px 10px;resize:vertical;min-height:56px;font-family:inherit}
.fc-note-ta::placeholder{color:var(--text3)}
.fc-note-ta:focus{outline:none;border-color:var(--accent)}
.btn-note-img{padding:3px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:"Courier New",monospace;transition:.15s;display:inline-block}
.btn-note-img:hover{border-color:var(--accent2);color:var(--text)}
.note-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:.55rem}
.note-img-wrap{position:relative}
.note-img-wrap img{width:72px;height:56px;object-fit:cover;border-radius:var(--rs);border:1px solid var(--border);cursor:zoom-in;display:block}
.note-img-wrap img:hover{border-color:var(--accent2)}
.note-img-del{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.us-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;z-index:1000;overflow-y:auto}
.us-box{width:100%;max-width:400px}
.us-title{font-size:20px;font-weight:700;margin:1rem 0 1.5rem;text-align:center}
.us-lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.75rem;font-family:"Courier New",monospace}
.us-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.55rem;cursor:pointer;transition:.15s}
.us-item:hover{border-color:var(--accent2);background:var(--bg3)}
.us-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;color:#fff}
.us-uname{font-size:14px;font-weight:600;flex:1}
.us-del{padding:4px 8px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;transition:.15s}
.us-del:hover{color:var(--red);border-color:var(--red-border)}
.us-new{display:flex;gap:8px;margin-top:1rem}
.us-input{flex:1;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px}
.us-input:focus{outline:none;border-color:var(--accent)}
.us-cur{font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:6px}
.us-cur-name{color:var(--accent2);font-weight:500}
.btn-sw{padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:10px;color:var(--text3);cursor:pointer;font-family:"Courier New",monospace;transition:.15s}
.btn-sw:hover{color:var(--accent2);border-color:var(--accent)}
.fc-wrap{cursor:pointer;margin-bottom:1rem}
.fc-front,.fc-back{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;transition:opacity .2s}
.fc-back{border-color:var(--green-border);background:var(--green-bg);display:none}
.fc-wrap.flipped .fc-front{display:none}
.fc-wrap.flipped .fc-back{display:block}
.fc-hint{font-size:11px;color:var(--text3);text-align:center;padding:.35rem 0 .1rem;font-family:"Courier New",monospace;letter-spacing:.04em}
.sp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;margin-bottom:.75rem}
.sp-q{font-size:14px;color:var(--text);margin-bottom:.6rem;line-height:1.7}
.sp-ans{font-size:13px;color:var(--green);margin-bottom:.5rem;font-weight:600}
.sp-exp{font-size:12px;color:var(--text2);line-height:1.75}
.sp-wrong{font-size:12px;color:#f08080;margin-top:.5rem;padding:.6rem .75rem;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;line-height:1.7}
</style>
</head>
<body>
<div id="us-screen" class="us-screen" style="display:none">
  <div class="us-box">
    <div class="lbl mono" style="text-align:center;margin-bottom:.5rem">獸醫師國考題庫 · 藥理學</div>
    <div class="us-title">登入</div>
    <input id="us-name" class="us-input" placeholder="姓名或暱稱" autocomplete="username"
           style="display:block;width:100%"
           onkeydown="if(event.key==='Enter')document.getElementById('us-pin').focus()">
    <input id="us-pin" type="password" class="us-input" placeholder="密碼" autocomplete="current-password"
           style="display:block;width:100%;margin-top:8px"
           onkeydown="if(event.key==='Enter')login()">
    <button class="btn btnp" style="width:100%;margin-top:12px;padding:11px;font-size:14px" onclick="login()">登入</button>
    <div id="us-msg" style="min-height:20px;font-size:12px;margin-top:8px;text-align:center;color:#f08080"></div>
    <div style="text-align:center;margin-top:1.25rem;font-size:13px;color:var(--text3)">
      第一次使用？ <button class="btn-sw" style="font-size:12px;padding:3px 12px" onclick="showRegisterScreen()">建立新帳號</button>
    </div>
  </div>
</div>
<div id="us-reg-screen" class="us-screen" style="display:none">
  <div class="us-box">
    <div class="lbl mono" style="text-align:center;margin-bottom:.5rem">獸醫師國考題庫 · 藥理學</div>
    <div class="us-title">建立帳號</div>
    <input id="reg-name" class="us-input" placeholder="姓名或暱稱（最多24字）" maxlength="24" autocomplete="username"
           style="display:block;width:100%"
           onkeydown="if(event.key==='Enter')document.getElementById('reg-pin').focus()">
    <input id="reg-pin" type="password" class="us-input" placeholder="設定密碼" autocomplete="new-password"
           style="display:block;width:100%;margin-top:8px"
           onkeydown="if(event.key==='Enter')document.getElementById('reg-pin2').focus()">
    <input id="reg-pin2" type="password" class="us-input" placeholder="再次輸入密碼" autocomplete="new-password"
           style="display:block;width:100%;margin-top:8px"
           onkeydown="if(event.key==='Enter')register()">
    <button class="btn btnp" style="width:100%;margin-top:12px;padding:11px;font-size:14px" onclick="register()">建立帳號</button>
    <div id="reg-msg" style="min-height:20px;font-size:12px;margin-top:8px;text-align:center;color:#f08080"></div>
    <div style="text-align:center;margin-top:1.25rem;font-size:13px;color:var(--text3)">
      已有帳號？ <button class="btn-sw" style="font-size:12px;padding:3px 12px" onclick="showLoginScreen()">返回登入</button>
    </div>
  </div>
</div>
<div id="main-app" style="display:none">
<div class="wrap">
<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="lbl mono">獸醫師國考 · 獸醫藥理學 · 官方歷屆題</div>
      <h1>藥理學 歷屆國考題庫</h1>
      <div class="sub">共 <span id="qtotal">0</span> 題 · v1 · <span class="us-cur"><span class="us-cur-name" id="cur-user-name"></span><button class="btn-sw" onclick="logout()">登出</button><button class="btn-sw" onclick="deleteOwnAccount()" style="color:var(--red);border-color:var(--red-border);margin-left:2px">刪除帳號</button></span></div>
    </div>
    <div class="stats">
      <div class="st"><div class="st-n mono" id="sd">0</div><div class="st-l">已答</div></div>
      <div class="st"><div class="st-n mono" id="sc">0</div><div class="st-l">答對</div></div>
      <div class="st"><div class="st-n mono" id="sa">&#x2014;</div><div class="st-l">正確率</div></div>
    </div>
  </div>
</div>
<div class="ctrl">
  <select class="csel" id="yrsel" onchange="setFilter(this.value)">
    <option value="all">全部年份</option>
  </select>
  <div class="modes">
    <button class="mb on" id="m0" onclick="setM(0)">選擇題</button>
    <button class="mb" id="m1" onclick="setM(1)">字卡</button>
    <button class="mb" id="m2" onclick="setM(2)">重點</button>
  </div>
  <button class="btn-exam" onclick="startExam()">▶ 開始測驗</button>
  <button class="btn-clr" onclick="clearProgress()" title="清除所有作答記錄與錯題歷史">↺ 清除進度</button>
</div>
<div class="pb"><div class="pf" id="pf" style="width:0%"></div></div>
<div class="nav-wrap">
  <div class="nav-hdr" onclick="toggleNav()">
    <span class="nav-title mono">&#9783; 題號快速跳題</span>
    <span class="nav-arrow" id="nav-arrow">&#9660;</span>
  </div>
  <div class="nav-grid hidden" id="nav-grid"></div>
</div>
<div id="area"></div>
<div class="foot mono">獸醫師專技高考 · 官方歷屆試題 (ROC 104–114) · 來源：阿摩線上測驗 (yamol.tw) · 共 1360 題</div>
</div>
</div>
<script>
const ALL_QS=[{"id":"AMO_2015_藥理_1041_001","year":2015,"roc_year":104,"session":"1","examNo":1,"q":"由所欲達到之血漿目標濃度 × 藥物之分布容積可以得到：","opts":["A. 藥物之排除速率","B. 藥物之半衰期","C. 藥物之維持劑量","D. 藥物之起始劑量"],"ans":3,"exp":"起始劑量（loading dose）的計算公式為：目標血漿濃度 × 分布容積（Vd）。分布容積反映藥物在體內的分布範圍，乘以目標血漿濃度即可推算出使藥物快速達到目標濃度所需的起始劑量。","we":["錯誤：排除速率（elimination rate）是由清除率（clearance）與血漿濃度決定，公式為 Rate = CL × C，與分布容積的乘積無關。","錯誤：半衰期（t½）的計算公式為 t½ = 0.693 × Vd / CL，需同時考慮清除率，並非單純以目標血漿濃度乘以 Vd 即可得出。","錯誤：維持劑量（maintenance dose）的計算是以清除率（CL）乘以目標血漿濃度，目的是補充每個給藥間隔內被清除的藥量，與分布容積無直接關係。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_002","year":2015,"roc_year":104,"session":"1","examNo":2,"q":"影響血液中藥物穿過微血管的主要因素為：","opts":["A. 血流量之分配","B. 血液之酸鹼值","C. 與血漿蛋白之結合","D. 對組織成分之選擇性"],"ans":2,"exp":"藥物與血漿蛋白（主要為白蛋白）結合後，形成大分子複合物，無法穿越微血管壁的小孔，因此只有游離（unbound）形式的藥物才能穿過微血管進行分布。血漿蛋白結合率愈高，藥物穿越微血管的能力愈受限，是影響藥物分布最主要的因素之一。","we":["錯誤：血流量分配影響藥物到達各組織的速度，但決定藥物能否穿越微血管壁本身的主要因素是藥物的游離程度，而非血流量多寡。","錯誤：血液酸鹼值影響弱酸或弱鹼性藥物的離子化程度，進而影響組織分布，但對於藥物能否穿越微血管壁的影響遠小於蛋白結合程度。","","錯誤：藥物對組織成分的選擇性（如脂溶性、主動運輸）影響藥物進入特定組織的程度，但就穿過微血管壁而言，血漿蛋白結合才是更直接的限制因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_003","year":2015,"roc_year":104,"session":"1","examNo":3,"q":"藥物製劑生物相等性（bioequivalence）試驗之目的主要為評估有效成分的：","opts":["A. 藥物親和性","B. 吸收速率及程度","C. 作用機制及藥效強度","D. 選擇性及安全性"],"ans":1,"exp":"生物相等性（bioequivalence）試驗旨在比較兩種製劑（通常為學名藥與原廠藥）在相同條件下，有效成分被吸收的速率（以 Cmax 評估）及吸收程度（以 AUC 評估）是否具有統計上的等效性，確保兩者在體內的藥物動力學行為相同。","we":["錯誤：藥物親和性（affinity）屬於藥效學（pharmacodynamics）範疇，描述藥物與受體的結合能力，與生物相等性試驗評估的藥物動力學吸收參數無關。","","錯誤：作用機制與藥效強度屬於藥效學的評估，生物相等性試驗並不直接測量這些藥效學指標，而是著重在吸收動力學的等效性。","錯誤：選擇性與安全性屬於毒理學及藥效學的評估範疇，並非生物相等性試驗的主要目的，後者專注在相同活性成分的吸收速率與程度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_004","year":2015,"roc_year":104,"session":"1","examNo":4,"q":"有些受體在沒有致效劑（agonist）的存在下，即具有基本的訊息傳導活性，若某藥物和此類\r 受體結合，會抑制受體的基本活性，此種藥物稱為：","opts":["A. 全致效劑（full agonist）","B. 部分致效劑（partial agonist）","C. 反致效劑（inverse agonist）","D. 拮抗劑（antagonist）"],"ans":2,"exp":"反致效劑（inverse agonist）與受體結合後，能抑制受體在無致效劑時本身具有的基本（組成性）活性，使訊息傳導低於正常基準線。這與拮抗劑（antagonist）不同：拮抗劑只是阻斷致效劑結合，本身不改變基礎活性；而反致效劑則主動降低基礎活性。","we":["錯誤：全致效劑（full agonist）與受體結合後會產生最大效應（Emax），使受體活性高於基準線，與題目描述「抑制基本活性」的方向相反。","錯誤：部分致效劑（partial agonist）雖然無法達到最大效應，但與受體結合後仍會激活受體（使活性高於基準線），而非抑制其基本活性。","","錯誤：拮抗劑（antagonist）與受體結合後不產生內在活性，僅阻斷致效劑的結合，但不會主動降低受體的基本組成性活性，因此與反致效劑有本質區別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_005","year":2015,"roc_year":104,"session":"1","examNo":5,"q":"依照Henderson-Hasselbalch方程式，可以推論弱鹼性藥物經由尿液排除的速率，下列何者最\r 快？","opts":["A. 尿液pH=5","B. 尿液pH=7","C. 尿液pH=9","D. 尿液pH=11"],"ans":0,"exp":"根據 Henderson-Hasselbalch 方程式，弱鹼性藥物在酸性環境（低 pH）中離子化程度最高，帶電的離子型態無法被腎小管重吸收，因此隨尿液排出的速率最快。尿液 pH=5 時酸性最強，弱鹼離子化比例最大，排除速率最快。","we":["","錯誤：尿液 pH=7 接近中性，弱鹼性藥物僅部分離子化，仍有相當比例以未離子化形式存在而可被腎小管重吸收，排除速率慢於 pH=5 的酸性環境。","錯誤：尿液 pH=9 為鹼性，弱鹼性藥物在鹼性環境中離子化程度低，未離子化的親脂形式容易被腎小管重吸收，排除速率反而最慢。","錯誤：尿液 pH=11 為強鹼性，弱鹼性藥物幾乎以非離子化形式存在，脂溶性高、腎小管重吸收量最大，排除速率最慢，與酸性環境下的結果相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_006","year":2015,"roc_year":104,"session":"1","examNo":6,"q":"甲藥物的治療指數（therapeutic index）高於乙藥物，則半致死劑量（LD50）和半有效劑量\r （ED50）的比值：","opts":["A. 甲大於乙","B. 甲等於乙","C. 甲小於乙","D. 證據不足以判定"],"ans":0,"exp":"治療指數（TI）定義為 LD50 / ED50；TI 愈高，藥物的安全範圍愈大。題目指出甲的 TI 高於乙，意即甲的 LD50/ED50 比值大於乙的比值，因此甲的 LD50/ED50 大於乙。","we":["","錯誤：若甲、乙的 LD50/ED50 相等，則兩者治療指數相同，與題意（甲的 TI 高於乙）矛盾。","錯誤：若甲的 LD50/ED50 小於乙，則甲的治療指數低於乙，與題目所述方向相反。","錯誤：治療指數就是 LD50/ED50 的比值，題目已明確指出甲的 TI 高於乙，因此可以判定甲的比值大於乙，並非證據不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_007","year":2015,"roc_year":104,"session":"1","examNo":7,"q":"已知藥物甲和乙是某一受體的全致效劑（full agonist），甲、乙的作用機制相同，甲的效價\r （potency）高於乙，則甲、乙的半有效劑量（ED50）之相關性為何？","opts":["A. 甲大於乙","B. 甲小於乙","C. 甲等於乙","D. 證據不足以判定"],"ans":1,"exp":"效價（potency）是指產生一定效應所需的劑量大小，效價愈高表示所需劑量愈小，即 ED50 愈低。題目指出甲的效價高於乙，故甲的 ED50（半有效劑量）小於乙的 ED50。","we":["錯誤：若甲的 ED50 大於乙，代表甲需要更大的劑量才能達到半數有效，即甲效價較低，與題意（甲效價高於乙）矛盾。","","錯誤：若甲乙的 ED50 相等，則兩者效價相同，與題目所述甲效價高於乙的條件不符。","錯誤：效價與 ED50 存在明確的反向關係（效價愈高 ED50 愈低），題目已給出充分條件，可以確定甲的 ED50 小於乙，而非證據不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_008","year":2015,"roc_year":104,"session":"1","examNo":8,"q":"關於phenobarbital的敘述，下列何者錯誤？","opts":["A. Phenobarbital是一個oxybarbiturate","B. 活化伽瑪-胺基丁酸調控的氯離子通道，增加鈉離子通道開啟，引起神經高度極化","C. Phenobarbital限制動作電位的傳導，並升高癲癇發作的閾值","D. Phenobarbital用於長期控制癲癇發作"],"ans":1,"exp":"Phenobarbital 的主要作用機制是活化 GABA-A 受體，延長氯離子（Cl⁻）通道的開放時間，使 Cl⁻ 內流增加，導致神經超極化（hyperpolarization），從而抑制神經興奮性。選項 B 錯誤地將機制描述為增加鈉離子通道開啟並引起「高度極化」，混淆了氯離子與鈉離子通道，且方向相反。","we":["此為正確描述：Phenobarbital 屬於 oxybarbiturate，其苯環上有氧取代基，此為正確的化學分類，不符合題目問的「錯誤」描述。","","此為正確描述：Phenobarbital 能限制動作電位在神經元的反覆傳導，並提高癲癇發作的閾值，是其抗癲癇作用的重要機制，不符合題目問的「錯誤」描述。","此為正確描述：Phenobarbital 因作用時間較長且可口服，常用於犬貓長期控制癲癇發作，此為臨床事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_009","year":2015,"roc_year":104,"session":"1","examNo":9,"q":"關於神經肌肉阻斷藥物之敘述，下列何者錯誤？","opts":["A. 乙醯膽鹼酯酶抑制劑會延長succinylcholine的作用時間","B. 肝臟疾病可能延長succinylcholine的作用時間","C. Aminoglycosides抗生素具有神經肌肉阻斷作用","D. Isoflurane不會增強非競爭性神經肌肉阻斷藥的作用"],"ans":3,"exp":"Isoflurane 等吸入性麻醉劑確實能增強非去極化（non-depolarizing）神經肌肉阻斷藥的作用，機制包括抑制突觸前乙醯膽鹼的釋放及增強突觸後膜的阻斷效果，可使非去極化肌肉鬆弛劑的所需劑量降低。選項 D 宣稱「不會增強」，此敘述錯誤。","we":["此為正確描述：乙醯膽鹼酯酶抑制劑（如 neostigmine）可減少 succinylcholine 的水解，因而延長其去極化阻斷作用的持續時間，此為正確臨床藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：Succinylcholine 主要由血漿假性膽鹼酯酶（pseudocholinesterase）水解，肝臟疾病可導致此酵素生成減少，進而延長 succinylcholine 的作用時間，此為正確描述，不符合題目問的「錯誤」描述。","此為正確描述：Aminoglycosides 類抗生素（如 gentamicin、neomycin）能抑制突觸前乙醯膽鹼的釋放並穩定突觸後膜，具有神經肌肉阻斷效果，此為正確事實，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_010","year":2015,"roc_year":104,"session":"1","examNo":10,"q":"關於succinylcholine的敘述，下列何者錯誤？","opts":["A. 在靜脈或肌肉注射之後，其起始作用快速","B. 作用的持續時間依動物種別和劑量而改變","C. 反芻動物血中偽膽鹼酯酶（pseudocholinesterase）的濃度比馬為高","D. 本藥為去極化（depolarizing）的神經肌肉阻斷性藥物"],"ans":2,"exp":"馬血漿中假性膽鹼酯酶（pseudocholinesterase）的濃度高於反芻動物，因此馬對 succinylcholine 的水解較快、作用持續時間較短。選項 C 錯誤地聲稱反芻動物的濃度較馬高，此與事實相反。","we":["此為正確描述：Succinylcholine 靜脈注射後因其類似乙醯膽鹼的結構可快速與 NMJ 受體結合，而肌肉注射後也因水溶性佳而吸收迅速，起始作用確實快速，此為正確事實，不符合題目問的「錯誤」描述。","此為正確描述：Succinylcholine 的作用持續時間確實因動物種別（假性膽鹼酯酶活性不同）及投予劑量而有所差異，此為正確描述，不符合題目問的「錯誤」描述。","","此為正確描述：Succinylcholine 屬於去極化型（depolarizing）神經肌肉阻斷劑，其機制為持續活化 NMJ 的 N2 受體，造成持續去極化，與非去極化型藥物（如 pancuronium）不同，此為正確分類，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_011","year":2015,"roc_year":104,"session":"1","examNo":11,"q":"臨床上使用xylazine後對消化道系統功能所造成之不良反應主要為：","opts":["A. 抑制腸胃之蠕動及分泌","B. 促進胰島素之合成及分泌","C. 刺激胃酸之分泌形成胃潰瘍","D. 刺激腸胃之過度蠕動造成腸絞痛"],"ans":0,"exp":"Xylazine 為 α2-腎上腺素受體致效劑，活化腸道的 α2 受體後，可抑制乙醯膽鹼的釋放，導致腸胃蠕動減弱及消化液分泌減少。臨床上大動物（尤其馬）使用 xylazine 後的主要消化道不良反應即為腸胃蠕動與分泌功能的抑制，嚴重時可引起腸絞痛。","we":["","錯誤：Xylazine 透過 α2 受體抑制胰島素的分泌（而非促進），臨床上可觀察到短暫的高血糖現象，此與「促進胰島素合成及分泌」相反。","錯誤：Xylazine 並不直接刺激胃酸分泌，其對消化道的主要不良反應是抑制蠕動，而非形成胃潰瘍；胃潰瘍屬於 NSAIDs 或 corticosteroids 的常見副作用。","錯誤：Xylazine 對腸道的作用是抑制而非刺激蠕動。雖然馬在使用後偶見腸絞痛，其原因在於腸蠕動抑制後氣體積聚，而非「過度蠕動」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_012","year":2015,"roc_year":104,"session":"1","examNo":12,"q":"下列藥物何者最適合使用於拮抗α2\r -腎上腺素性致效劑於反芻動物所引起之不良反應？","opts":["A. atropine","B. tolazoline","C. naloxone","D. diazepam"],"ans":1,"exp":"Tolazoline 為 α2-腎上腺素受體拮抗劑，能競爭性阻斷 α2 受體，有效逆轉 xylazine（α2 致效劑）所引起的鎮靜、心跳減慢、腸蠕動抑制等不良反應。在反芻動物（尤其牛）中，tolazoline 是最常用的 xylazine 拮抗劑。","we":["錯誤：Atropine 為抗膽鹼藥（muscarinic 受體拮抗劑），可對抗心跳過慢等副交感神經效應，但無法直接拮抗 α2 受體的作用，不能全面逆轉 xylazine 效果。","","錯誤：Naloxone 為純鴉片受體拮抗劑，用於逆轉鴉片類藥物（如 morphine、fentanyl）的作用，對 α2 受體的拮抗作用無效，不能用於逆轉 xylazine。","錯誤：Diazepam 為苯二氮平類藥物，作用於 GABA-A 受體，具有鎮靜、抗焦慮效果，無法拮抗 α2 受體，不能作為 xylazine 的拮抗劑使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_013","year":2015,"roc_year":104,"session":"1","examNo":13,"q":"以現有常用吸入性麻醉劑粗估，下列何者可加速誘導的速率？①較小的血／氣分配係數 ②\r 較大的MAC ③是否已先投予propofol","opts":["A. ①②","B. ②③","C. ①③","D. ①②③"],"ans":2,"exp":"①較小的血／氣分配係數（blood/gas partition coefficient）代表藥物在血液中溶解度低，能快速在肺泡與血液間達到平衡，使腦部濃度迅速上升，加快麻醉誘導。③先給予 propofol 可降低吸入麻醉劑所需的 MAC（最低肺泡濃度），減少吸入劑用量，因此也能加快誘導。②較大的 MAC 代表藥物效力較弱（需更高濃度才能達到麻醉效果），這會使誘導速率變慢，而非加快。故答案為①③。","we":["錯誤：選項①正確（血／氣分配係數小確實加快誘導），但選項②錯誤——較大 MAC 表示藥物效力弱，需更高吸入濃度才能誘導，反而使誘導變慢，因此①②組合不正確。","錯誤：選項③正確（propofol 降低 MAC 可加速誘導），但選項②錯誤——MAC 較大的藥物效力較弱，誘導速率較慢而非較快，因此②③組合不正確。","","錯誤：選項①③均正確，但選項②錯誤（MAC 愈大效力愈弱，誘導愈慢），故三者全選的①②③組合亦不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_014","year":2015,"roc_year":104,"session":"1","examNo":14,"q":"注射性麻醉劑pentobarbital之麻醉作用期間為：","opts":["A. 超短效性","B. 短效性","C. 中長效性","D. 長效性"],"ans":1,"exp":"Pentobarbital 為短效性注射巴比妥酸鹽麻醉劑，其麻醉持續時間約 1–2 小時，歸類為短效性。超短效性的代表為 thiopental（約 5–15 分鐘），中長效性代表為 phenobarbital，而長效性則更少用於麻醉。","we":["錯誤：超短效性巴比妥類（如 thiopental）作用時間僅約數分鐘，因其高脂溶性可快速再分布至脂肪組織而終止作用。Pentobarbital 作用時間長於 thiopental，屬於短效而非超短效。","","錯誤：中長效性巴比妥類（如 phenobarbital）作用持續數小時至更長，常用於長期抗癲癇治療。Pentobarbital 的麻醉時間遠短於此範疇，分類為短效性。","錯誤：長效性巴比妥類（如 phenobarbital 作為鎮靜鎮痙使用時）作用可延續超過 6 小時，甚至數日。Pentobarbital 的麻醉時間明顯短於長效定義，不屬此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_015","year":2015,"roc_year":104,"session":"1","examNo":15,"q":"以下各類鴉片藥物中其止痛效果最強者為：","opts":["A. tramadol","B. fentanyl","C. oxymorphone","D. morphine"],"ans":1,"exp":"Fentanyl 的止痛效果約為 morphine 的 100 倍，是常用鴉片類藥物中效力最強的。Oxymorphone 約為 morphine 的 10 倍，tramadol 僅約為 morphine 的 1/10 至 1/5，morphine 為參考基準（1×）。因此效力排序為 fentanyl > oxymorphone > morphine > tramadol。","we":["錯誤：Tramadol 的止痛效力相對較弱，約為 morphine 的 1/10 至 1/5，作用機制也包括正腎上腺素和血清素再回收抑制，與純鴉片受體激動機制不同，效力遠不及 fentanyl。","","錯誤：Oxymorphone 的止痛效力雖強於 morphine（約 10 倍），但仍遠低於 fentanyl（約 100 倍 morphine），因此在此四者中並非最強。","錯誤：Morphine 為鴉片類止痛的參考標準（效力定義為 1×），tramadol 效力低於 morphine，oxymorphone 和 fentanyl 均強於 morphine，故 morphine 非四者中最強。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_016","year":2015,"roc_year":104,"session":"1","examNo":16,"q":"使用合成局部麻醉藥時，為延長其作用時間，一般可併用何種藥物？","opts":["A. tolazoline","B. epinephrine","C. phentolamine","D. ergotamine"],"ans":1,"exp":"在局部麻醉藥溶液中添加腎上腺素（epinephrine），利用其強效的 α1 受體興奮作用引起局部血管收縮，減少局部麻醉藥被血液帶走的速率，使藥物得以在局部維持較高濃度更長時間，從而延長麻醉持續時間並減少全身毒性。","we":["錯誤：Tolazoline 為 α2 受體拮抗劑，具有血管擴張效果，若加入局部麻醉藥中會加速藥物吸收入血，縮短而非延長麻醉時間。","","錯誤：Phentolamine 為非選擇性 α 受體拮抗劑，會造成血管擴張，加速局部麻醉藥的吸收，反而縮短麻醉時間。臨床上反而用 phentolamine 來拮抗腎上腺素所致的過度血管收縮。","錯誤：Ergotamine 為麥角生物鹼，主要用於治療偏頭痛，雖有血管收縮作用，但不作為局部麻醉的輔助延長劑，且其作用機制及臨床應用與延長局部麻醉無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_017","year":2015,"roc_year":104,"session":"1","examNo":17,"q":"下列何者最適合用於改善腎上腺腫瘤所誘發之aldosterone過量分泌？","opts":["A. acetazolamide","B. furosemide","C. spironolactone","D. aminophylline"],"ans":2,"exp":"Spironolactone 為醛固酮（aldosterone）的競爭性拮抗劑，能阻斷腎臟遠端腎小管的醛固酮受體，抑制醛固酮過量時促進鈉滯留和鉀排出的效應。對於腎上腺腫瘤（如腎上腺皮質瘤）導致醛固酮分泌過多（原發性醛固酮增多症），spironolactone 最適合用於拮抗其過量分泌的效果。","we":["錯誤：Acetazolamide 為碳酸酐酶抑制劑，主要作用於近端腎小管，抑制 HCO₃⁻ 的重吸收，用於高眼壓或代謝性鹼中毒，不具有拮抗醛固酮的特異性作用。","錯誤：Furosemide 為 loop 利尿劑，作用於亨利氏環上升支，雖可促進鈉排出但同時也促進鉀流失（低鉀血症副作用），無法選擇性對抗醛固酮過多引起的電解質失衡。","","錯誤：Aminophylline 為甲基黃嘌呤類支氣管擴張劑（磷酸二酯酶抑制劑），主要用於支氣管痙攣的治療，對腎上腺醛固酮的拮抗作用沒有直接效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_018","year":2015,"roc_year":104,"session":"1","examNo":18,"q":"Amiloride對遠端彎曲腎小管及集尿管產生利尿之主要作用機制為何？","opts":["A. 抑制水分子之再吸收","B. 抑制Na+之主動再吸收","C. 促進K\r +之排泄","D. 促進H\r +之排泄"],"ans":1,"exp":"Amiloride 是保鉀利尿劑，其作用機制是直接阻斷遠端彎曲腎小管及集尿管管腔側上皮細胞的 ENaC（上皮鈉離子通道），抑制 Na⁺ 的主動再吸收。Na⁺ 再吸收減少後，管腔內負電位降低，K⁺ 從細胞內分泌至管腔的驅動力也隨之下降，因此具有保鉀效果，且作用不依賴醛固酮。","we":["錯誤：Amiloride 主要抑制的是 Na⁺ 的主動再吸收（透過阻斷 ENaC），而非直接抑制水分子的再吸收通道（aquaporin）；水分子的跟隨性減少是 Na⁺ 減少後的間接效果，並非主要機制。","","錯誤：Amiloride 的作用實際上是保留 K⁺（減少 K⁺ 排泄），而非促進 K⁺ 排泄。此選項描述與藥物保鉀效果相反，混淆了 amiloride 與 thiazide 或 loop 利尿劑的副作用。","錯誤：Amiloride 主要影響 Na⁺ 通道，對 H⁺ 排泄的直接促進作用並非其主要利尿機制，且保鉀利尿劑通常會輕微減少 H⁺ 的排泄（傾向代謝性酸中毒副作用），而非促進排泄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_019","year":2015,"roc_year":104,"session":"1","examNo":19,"q":"下列何者為amrinone增加心肌收縮力之主要作用機制？","opts":["A. 抑制Na+\r , K+\r -ATPase","B. 增加心肌收縮可利用之Ca++濃度","C. 開啟Na+通道增加心肌之興奮性","D. 抑制phosphodiesterase III而增加cAMP濃度"],"ans":3,"exp":"Amrinone（銨力農）屬於磷酸二酯酶 III（PDE3）抑制劑，透過抑制 PDE3 減少 cAMP 的降解，使細胞內 cAMP 濃度上升，進而活化蛋白激酶 A（PKA），磷酸化 L 型鈣離子通道及肌漿網（SR）鈣泵，增加心肌細胞內可用的 Ca²⁺ 濃度，產生正性肌力作用（增加心肌收縮力）。","we":["錯誤：抑制 Na⁺,K⁺-ATPase 是強心配醣體（如 digoxin）的作用機制，使細胞內 Na⁺ 積累，進而透過 Na⁺/Ca²⁺ 交換器增加 Ca²⁺。Amrinone 的機制是 PDE3 抑制，兩者不同。","錯誤：增加心肌細胞內 Ca²⁺ 是 amrinone 作用的下游效果，但此選項未說明增加 Ca²⁺ 的直接機制（PDE3 抑制 → cAMP 上升），單純描述「增加 Ca²⁺ 濃度」並未準確反映其原發作用機制。","錯誤：開啟 Na⁺ 通道並非 amrinone 的作用機制；此描述更接近某些抗心律不整藥物或局部麻醉藥的作用特性，與 PDE3 抑制劑的藥理完全不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_020","year":2015,"roc_year":104,"session":"1","examNo":20,"q":"下列何者是furosemide對亨利氏環（loop of Henle）上升支腎小管上皮細胞之主要影響？","opts":["A. 抑制Na+\r -K+\r -2Cl-之協同運輸","B. 抑制Na+\r -K+之反向運輸","C. 抑制Na+\r -H+之同向運輸","D. 抑制Na+\r -Cl-之同向運輸"],"ans":0,"exp":"Furosemide（速尿）作用於亨利氏環（loop of Henle）粗升支管腔側，專一性抑制 Na⁺-K⁺-2Cl⁻ 協同運輸蛋白（NKCC2），阻止這三種離子的共同再吸收，使大量 Na⁺、K⁺、Cl⁻ 及隨之的水分留在管腔而排出，產生強效利尿作用。","we":["","錯誤：Na⁺-K⁺ 反向運輸（antiporter）是指 Na⁺/K⁺ 交換，這是心肌細胞 Na⁺/K⁺-ATPase 等的描述，並非腎小管的主要轉運機制，也不是 furosemide 的作用靶點。","錯誤：Na⁺-H⁺ 同向運輸（antiporter/exchanger）抑制是碳酸酐酶抑制劑（如 acetazolamide）作用於近端腎小管的機制，並非 furosemide 在亨利氏環的作用。","錯誤：抑制 Na⁺-Cl⁻ 同向運輸（NCC）是噻嗪類利尿劑（thiazides，如 hydrochlorothiazide）作用於遠端彎曲腎小管的機制，與 furosemide 在亨利氏環粗升支的作用靶點不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_021","year":2015,"roc_year":104,"session":"1","examNo":21,"q":"下列何者是臨床上靜脈注射mannitol的主要效應？","opts":["A. 減少水之重吸收","B. 增加Na+之重吸收","C. 抑制Ca++之重吸收","D. 抑制K\r +之重吸收"],"ans":0,"exp":"Mannitol 為滲透性利尿劑，靜脈注射後可自由過濾至腎小管，但不被重吸收，在腎小管管腔內形成高滲透壓環境，阻止水分子的被動再吸收，使尿量增加。臨床上用於降低顱內壓或眼內壓。","we":["","錯誤：Mannitol 不會增加 Na⁺ 的重吸收；事實上，由於腎小管液體流量增加（稀釋效果），Na⁺ 等電解質的重吸收反而相對減少，整體排出量增加。","錯誤：Mannitol 對 Ca²⁺ 重吸收並無直接的抑制機制；抑制鈣重吸收的利尿劑代表為 furosemide（loop 利尿劑）而非滲透性利尿劑。","錯誤：Mannitol 對 K⁺ 重吸收並無直接抑制作用；其主要效應是透過滲透壓機制減少水的再吸收，而非針對特定離子轉運蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_022","year":2015,"roc_year":104,"session":"1","examNo":22,"q":"下列何者是nitroglycerin的臨床用途？","opts":["A. 加強心肌之收縮力量","B. 控制急性過敏性休克","C. 治療急性心因性肺水腫","D. 控制心跳過快之心律不整"],"ans":2,"exp":"Nitroglycerin 在體內釋出一氧化氮（NO），刺激鳥苷酸環化酶使 cGMP 上升，導致血管平滑肌（以靜脈為主）舒張。靜脈擴張後，靜脈回流（前負荷）減少，肺循環充血降低，有效緩解急性心因性肺水腫（acute cardiogenic pulmonary edema）時的肺淤血症狀。","we":["錯誤：Nitroglycerin 本身無正性肌力效果，不能直接加強心肌收縮力；增強心肌收縮力的藥物包括 digoxin、dobutamine 或 dopamine 等，屬於不同的治療類別。","錯誤：急性過敏性休克的治療首選為腎上腺素（epinephrine），而非 nitroglycerin。Nitroglycerin 的血管擴張特性在休克（低血壓）狀態下反而有害，禁忌使用。","","錯誤：控制心跳過快（如心房顫動、室上性心搏過速）的藥物通常為 β-blocker、calcium channel blocker 或 digoxin 等，而 nitroglycerin 主要作用為血管擴張，並無直接的心率控制效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_023","year":2015,"roc_year":104,"session":"1","examNo":23,"q":"下列何者具有抑制胰島素原（proinsulin）轉化為胰島素之作用，可能誘發高血糖症？","opts":["A. acetazolamide","B. furosemide","C. spironolactone","D. hydrochlorothiazide"],"ans":3,"exp":"Hydrochlorothiazide（噻嗪類利尿劑）可直接抑制胰臟 β 細胞的鉀離子通道，導致膜超極化，減少胰島素的釋放；另外也可能抑制胰島素原（proinsulin）轉化為胰島素的酵素活性。長期使用噻嗪類利尿劑可能誘發高血糖症，糖尿病患者使用時需監控血糖。","we":["錯誤：Acetazolamide 為碳酸酐酶抑制劑，主要抑制 HCO₃⁻ 在近端腎小管的重吸收，用於青光眼或代謝性鹼中毒，對胰島素原的轉化並無特異性抑制作用。","錯誤：Furosemide 為 loop 利尿劑，作用於亨利氏環 NKCC2，雖有輕微影響電解質平衡，但抑制胰島素原轉化並誘發高血糖不是其主要不良反應，此效應主要見於噻嗪類。","錯誤：Spironolactone 為醛固酮拮抗劑，對胰島素的合成與分泌無直接抑制效果，臨床上也不以誘發高血糖作為其主要副作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_024","year":2015,"roc_year":104,"session":"1","examNo":24,"q":"下列何者最適合於治療cardiac glycosides中毒所引起的心室心搏過速之心律不整？","opts":["A. atropine","B. quinidine","C. lidocaine","D. procainamide"],"ans":2,"exp":"Lidocaine 屬於 Class Ib 抗心律不整藥物，能快速阻斷鈉離子通道並縮短動作電位持續時間，對心室心肌細胞有選擇性，是治療 cardiac glycosides（強心配醣體，如 digoxin）中毒所引起心室心搏過速（ventricular tachycardia）的首選藥物，因其起效快且對心室自律性的抑制效果顯著。","we":["錯誤：Atropine 為抗膽鹼藥，用於治療心搏過慢（bradycardia），對心室心搏過速無效；cardiac glycoside 中毒引起的心律不整以心室性為主，atropine 並非適應症。","錯誤：Quinidine 屬於 Class Ia 抗心律不整藥物，雖可治療心室性心律不整，但 quinidine 本身也會抑制 Na⁺/K⁺-ATPase，可能加重 cardiac glycoside 中毒，且有延長 QT 間期的風險，不是首選。","","錯誤：Procainamide 屬於 Class Ia 抗心律不整藥物，可能加重 cardiac glycoside 中毒的毒性效應，且起效較 lidocaine 慢，不作為 glycoside 中毒心室心搏過速的首選藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_025","year":2015,"roc_year":104,"session":"1","examNo":25,"q":"下列何者不是鈣離子阻斷劑？","opts":["A. nifedipine","B. diltiazem","C. verapamil","D. nitroprusside"],"ans":3,"exp":"Nitroprusside（硝普鈉）為一氧化氮（NO）供體，直接釋出 NO 使血管平滑肌鬆弛，產生動靜脈擴張效果，屬於直接血管擴張劑，並非鈣離子阻斷劑（calcium channel blocker）。Nifedipine、diltiazem、verapamil 均為真正的鈣離子阻斷劑，分別屬於二氫吡啶類、苯硫氮平類、苯烷胺類。","we":["此為正確描述：Nifedipine 屬於二氫吡啶類（dihydropyridine）鈣離子阻斷劑，主要作用於血管平滑肌的 L 型鈣離子通道，用於降血壓及治療心絞痛，不符合題目問的「不是鈣離子阻斷劑」描述。","此為正確描述：Diltiazem 屬於苯硫氮平類（benzothiazepine）鈣離子阻斷劑，兼具血管擴張及心臟傳導抑制效果，用於心律不整及心絞痛治療，不符合題目問的「不是鈣離子阻斷劑」描述。","此為正確描述：Verapamil 屬於苯烷胺類（phenylalkylamine）鈣離子阻斷劑，對心臟傳導系統抑制效果強，常用於室上性心律不整，不符合題目問的「不是鈣離子阻斷劑」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_026","year":2015,"roc_year":104,"session":"1","examNo":26,"q":"下列何者添加於飼料可預防成長中的動物因甲狀腺素不足而引起甲狀腺腫大？","opts":["A. potassium iodide","B. sodium bicarbonate","C. ammonium chloride","D. copper sulfate"],"ans":0,"exp":"碘化鉀（potassium iodide）添加於飼料中可補充碘元素，預防因碘攝取不足導致甲狀腺素（T3、T4）合成減少，進而引起的代償性甲狀腺腫大（goiter）。此為常見的微量礦物質補充方式，尤其適用於土壤缺碘地區的畜牧業。","we":["","錯誤：碳酸氫鈉（sodium bicarbonate）為緩衝劑，常用於反芻動物飼料添加劑以維持瘤胃 pH，或用於代謝性酸中毒的治療，與甲狀腺素合成和碘補充無關。","錯誤：氯化銨（ammonium chloride）主要用於酸化尿液或治療氨中毒，在反芻動物飼料中有時用於預防尿路結石，但與甲狀腺腫大和碘缺乏無關。","錯誤：硫酸銅（copper sulfate）用於補充銅元素，防治銅缺乏症（如羔羊的地方性共濟失調），或作為抗寄生蟲添加劑，與碘缺乏性甲狀腺腫無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_027","year":2015,"roc_year":104,"session":"1","examNo":27,"q":"下列何者為容積性瀉藥（bulk laxatives），可吸收水分，增加糞便體積而刺激腸道蠕動？","opts":["A. docusate","B. sodium bicarbonate","C. methylcellulose","D. magnesium sulfate"],"ans":2,"exp":"Methylcellulose 為天然或半合成纖維素衍生物，屬於容積性瀉藥（bulk laxative），進入腸道後能吸收大量水分膨脹，增加糞便體積與黏性，透過機械性擴張刺激腸壁的牽張受體，反射性地促進腸蠕動，達到通便效果，且不被腸道吸收，安全性高。","we":["錯誤：Docusate 為表面活性劑型（stool softener）瀉藥，能降低水分子與糞便的表面張力，使水分滲入糞便軟化，而非吸水膨脹增加體積，屬不同類型的瀉藥。","錯誤：碳酸氫鈉（sodium bicarbonate）為制酸劑，雖在腸道可與胃酸反應產生氣體，但並非容積性瀉藥，無吸水膨脹刺激腸蠕動的機制。","","錯誤：硫酸鎂（magnesium sulfate）為滲透性瀉藥（osmotic laxative），在腸腔中形成高滲透壓環境，將水分保留在腸腔內，作用機制與容積性瀉藥（吸水膨脹）不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_028","year":2015,"roc_year":104,"session":"1","examNo":28,"q":"Codeine phosphate的臨床用途主要作為：","opts":["A. 鎮靜","B. 止痛","C. 肌肉鬆弛","D. 止咳"],"ans":3,"exp":"Codeine phosphate（磷酸可待因）雖具有鴉片受體激動活性，但其止咳效果遠優於止痛效果，臨床上主要作為中樞性止咳藥（antitussive），透過抑制延腦咳嗽中樞的敏感性來抑制咳嗽反射，是獸醫臨床常用的鎮咳成分。","we":["錯誤：Codeine 有輕微鎮靜效果，但鎮靜並非其主要臨床用途。專用鎮靜藥物（如 acepromazine、diazepam）的鎮靜效果遠強於 codeine，獸醫臨床不以 codeine 作為鎮靜首選。","錯誤：雖然 codeine 具有弱鴉片止痛活性，但與其他鴉片類藥物（如 morphine、fentanyl）相比，其止痛效力較弱，臨床止痛並非其主要用途。","錯誤：Codeine 不具有肌肉鬆弛效果；肌肉鬆弛劑分為中樞型（如 methocarbamol）和神經肌肉阻斷型（如 pancuronium），codeine 屬於鴉片受體激動劑，機制完全不同。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_029","year":2015,"roc_year":104,"session":"1","examNo":29,"q":"下列用於治療腸胃疾病的藥物中，何者必須在酸性條件下才具有活性？","opts":["A. loperamide","B. metoclopramide","C. omeprazole","D. ondansetron"],"ans":2,"exp":"Omeprazole 屬於質子泵抑制劑（PPI），本身為前驅藥（prodrug），需在壁細胞分泌小管（secretory canaliculi）的酸性環境（pH < 4）中轉化為具有活性的次磺醯胺（sulfenamide）形式，才能不可逆地結合並抑制 H⁺/K⁺-ATPase（質子泵），從而阻斷胃酸分泌。因此 omeprazole 必須在酸性條件下才能被活化。","we":["錯誤：Loperamide 為鴉片受體（主要 μ 受體）激動劑，作用於腸道平滑肌減少蠕動並增加括約肌張力，其活性不依賴酸性環境，在中性或鹼性環境下同樣有效。","錯誤：Metoclopramide 為多巴胺 D2 受體拮抗劑及 5-HT4 受體激動劑，具有促胃腸動力和止吐作用，其活性不需酸性環境激活，屬直接作用型藥物。","","錯誤：Ondansetron 為選擇性 5-HT3 受體拮抗劑，主要用於化療誘發的嘔吐，其受體結合活性不需要酸性條件，在生理 pH 下即可發揮作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_030","year":2015,"roc_year":104,"session":"1","examNo":30,"q":"下列何種維生素能抑制nitrates形成nitrosamines？","opts":["A. D","B. C","C. B","D. A"],"ans":1,"exp":"維生素 C（抗壞血酸，ascorbic acid）為強效還原劑，可在胃腸道中競爭性地將亞硝酸鹽（nitrite）還原為氮氧化物，阻止亞硝酸鹽與胺類結合形成亞硝胺（nitrosamines）。亞硝胺為已知的致癌物質，因此飲食中攝取足夠的維生素 C 能有效抑制其生成。本題選項排列為 [A=D, B=C, C=B, D=A]，答案為選項 B（即維生素 C）。","we":["錯誤：維生素 D（選項 A）為脂溶性維生素，主要功能為調節鈣磷代謝和骨骼健康，不具有抑制亞硝酸鹽形成亞硝胺的抗氧化還原能力。","","錯誤：維生素 B 群（選項 C）包括 B1、B2、B6、B12 等，主要作為酵素輔因子參與能量代謝，無法在胃腸道中作為還原劑阻止亞硝胺的生成。","錯誤：維生素 A（選項 D）為脂溶性維生素，主要參與視覺、上皮細胞分化及免疫功能，雖有抗氧化效果，但抑制亞硝胺生成的主要機制是維生素 C 的還原作用，維生素 A 並非此功能的主要角色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_031","year":2015,"roc_year":104,"session":"1","examNo":31,"q":"馬缺乏下列何種維生素會導致眼病變和視力異常？","opts":["A. A","B. B12","C. C","D. D"],"ans":0,"exp":"維生素 A（視黃醇）缺乏在馬匹中最典型的表現為眼部病變，包括夜盲症（rhodopsin 合成不足）、角膜乾燥與潰瘍、淚液分泌減少及球結膜角質化等症狀，嚴重時導致永久性視力喪失。維生素 A 對上皮細胞的分化與維持正常視覺功能至關重要。","we":["","錯誤：維生素 B12（鈷胺素）缺乏主要影響造血功能（大球性貧血）和神經系統（周邊神經病變），不會特異性造成馬匹的眼部病變和視力異常。","錯誤：馬能自行合成維生素 C（不同於靈長類），且維生素 C 缺乏的主要症狀為壞血病（膠原蛋白合成障礙），包括出血、傷口癒合不良等，並非眼部病變的主因。","錯誤：維生素 D 缺乏主要影響鈣磷吸收與骨骼代謝，在幼畜引起佝僂症（rickets），在成畜引起軟骨病（osteomalacia），並不以眼病變和視力異常為主要臨床症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_032","year":2015,"roc_year":104,"session":"1","examNo":32,"q":"下列何者使用於腎衰竭病患容易引起中樞神經系統的抑制？","opts":["A. castor oil","B. mineral oil","C. magnesium sulfate","D. methylcellulose"],"ans":2,"exp":"硫酸鎂（magnesium sulfate）在腎功能正常時，過量的 Mg²⁺ 可由腎臟排泄。但在腎衰竭患者中，Mg²⁺ 的排泄受阻，導致血漿 Mg²⁺ 濃度升高（高鎂血症），Mg²⁺ 能阻斷突觸前神經末梢的 Ca²⁺ 依賴性神經傳質釋放，抑制 CNS 和神經肌肉傳導，引起鎮靜、肌肉無力、反射消失，甚至呼吸抑制等中樞神經系統抑制症狀。","we":["錯誤：Castor oil（蓖麻油）為刺激性瀉藥，主要在腸道內作用，不會在腎衰竭患者體內累積，也無特殊的中樞神經系統毒性風險。","錯誤：Mineral oil（礦物油）為潤滑性瀉藥，不被腸道吸收，在腎衰竭時不會有全身性蓄積，對 CNS 的影響極小。","","錯誤：Methylcellulose 為容積性瀉藥，完全不被腸道吸收，在腎衰竭患者中不會產生全身性蓄積，對中樞神經系統無抑制風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_033","year":2015,"roc_year":104,"session":"1","examNo":33,"q":"Cyproheptadine刺激食慾的作用與下列那一個神經傳導物質的相關性最高？","opts":["A. acetylcholine","B. dopamine","C. norepinephrine","D. serotonin"],"ans":3,"exp":"Cyproheptadine 為第一代抗組織胺藥（H1 blocker），同時也具有血清素（5-HT）受體拮抗作用。血清素（serotonin）正常情況下作用於下視丘飽食中樞，抑制食慾；cyproheptadine 阻斷 5-HT 受體後，此抑制食慾的訊號被解除，食慾因而增加。臨床上用於貓的食慾促進治療。","we":["錯誤：乙醯膽鹼（acetylcholine）主要參與副交感神經調控、認知功能及神經肌肉傳導，其與食慾調控的直接關聯不如血清素顯著；cyproheptadine 的食慾增進效果主要歸因於 5-HT 受體拮抗，而非乙醯膽鹼相關機制。","錯誤：多巴胺（dopamine）在食慾調控中扮演獎賞回路的角色，但 cyproheptadine 促食慾的主要機制是血清素拮抗，而非多巴胺系統的直接影響。","錯誤：正腎上腺素（norepinephrine）雖參與飽食訊號調控，但 cyproheptadine 促進食慾的主要機制是拮抗血清素（5-HT）受體，抗組織胺及抗正腎上腺素效果並非促食慾的主因。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_034","year":2015,"roc_year":104,"session":"1","examNo":34,"q":"Butyrophenones的抗嘔吐作用機制為下列何者？","opts":["A. 抑制在嘔吐中樞的H1\r -組織胺受體","B. 刺激胃活動","C. 抑制在CRTZ（chemoreceptor trigger zone）的多巴胺受體","D. 增加acetylcholine對腸道平滑肌的刺激"],"ans":2,"exp":"Butyrophenones（丁酮苯類，如 haloperidol、droperidol）的止吐作用主要是透過阻斷位於嘔吐化學受器觸發區（CRTZ，chemoreceptor trigger zone）的多巴胺 D2 受體，抑制由化學物質或藥物毒素刺激 CRTZ 所觸發的嘔吐反射。CRTZ 位於第四腦室底部，血腦屏障較薄弱，易受藥物影響。","we":["錯誤：抑制嘔吐中樞 H1-組織胺受體是抗組織胺藥（如 diphenhydramine）的止吐機制，主要用於動暈病（motion sickness）的預防；butyrophenones 的主要靶點為 D2 受體，而非 H1 受體。","錯誤：直接刺激胃活動是促胃腸動力藥（如 metoclopramide）的作用之一，屬於促進胃排空以減少嘔吐的機制，並非 butyrophenones 的止吐機制。","","錯誤：增加乙醯膽鹼對腸道平滑肌的刺激是膽鹼激性藥物或乙醯膽鹼酯酶抑制劑的效果，可促進腸蠕動但與 CRTZ D2 受體的拮抗止吐機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_035","year":2015,"roc_year":104,"session":"1","examNo":35,"q":"下列何者為morphine的拮抗劑？","opts":["A. fentanyl","B. hydromorphone","C. ipratropium","D. naloxone"],"ans":3,"exp":"Naloxone 為純鴉片受體拮抗劑（pure opioid antagonist），對 μ、κ、δ 受體均具有高親和力且無內在活性，能競爭性拮抗 morphine 及其他鴉片類藥物，是 morphine 過量時的解毒劑（antidote）。靜脈注射後起效迅速（1–2 分鐘），可快速逆轉呼吸抑制等毒性效應。","we":["錯誤：Fentanyl 為強效 μ 受體激動劑（agonist），止痛效力約為 morphine 的 100 倍，是鴉片類藥物而非其拮抗劑；使用 fentanyl 會加重 morphine 的鴉片類毒性，而非逆轉。","錯誤：Hydromorphone 為 μ 受體激動劑（agonist），止痛效力約為 morphine 的 5–10 倍，同屬鴉片類藥物；給予 hydromorphone 無法拮抗 morphine，反而加強其效果。","錯誤：Ipratropium 為抗膽鹼藥（muscarinic antagonist），主要用於支氣管擴張，作用於 M 受體而非鴉片受體，無法逆轉 morphine 的鴉片受體介導效應，不是 morphine 的拮抗劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_036","year":2015,"roc_year":104,"session":"1","examNo":36,"q":"下列何者不是支氣管擴張劑？","opts":["A. epinephrine","B. salbutamol","C. isoproterenol","D. propranolol"],"ans":3,"exp":"Propranolol 為非選擇性 β-腎上腺素受體拮抗劑（β1 和 β2 blocker），阻斷 β2 受體後，可拮抗交感神經對支氣管的擴張效應，導致支氣管收縮（bronchoconstriction），因此 propranolol 是支氣管收縮劑而非支氣管擴張劑，氣喘患者禁用。","we":["此為正確描述：Epinephrine（腎上腺素）同時激動 α 和 β 受體，透過 β2 受體活化使支氣管平滑肌舒張，是急性過敏性氣管痙攣的急救支氣管擴張劑，不符合題目問的「不是支氣管擴張劑」描述。","此為正確描述：Salbutamol（沙丁胺醇）為選擇性 β2 受體致效劑，直接作用於支氣管平滑肌的 β2 受體，引起支氣管擴張，是常用的急性氣管痙攣治療藥物，不符合題目問的「不是支氣管擴張劑」描述。","此為正確描述：Isoproterenol（異丙腎上腺素）為非選擇性 β 受體致效劑（β1 + β2），透過 β2 受體激動引起支氣管擴張，雖因心臟副作用已漸少使用，但仍屬支氣管擴張劑，不符合題目問的「不是支氣管擴張劑」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_037","year":2015,"roc_year":104,"session":"1","examNo":37,"q":"下列何者是loperamide和diphenoxylate藥理特性的最大差異之處？","opts":["A. 前者是止瀉劑，後者是瀉劑","B. 前者是止吐劑，後者是催吐劑","C. 前者無中樞作用，後者有","D. 前者是鴉片受體致效劑（agonist），後者是拮抗劑 （antagonist）"],"ans":2,"exp":"Loperamide 和 diphenoxylate 均為鴉片受體激動劑，作用於腸道 μ 受體，減少腸蠕動和分泌，兩者均為止瀉劑。最大差異在於：loperamide 極性高、不易穿透血腦屏障（BBB），幾乎無中樞神經效應；diphenoxylate 可穿透 BBB 產生中樞效應（有濫用潛力），因此製劑中添加阿托品以防止濫用。","we":["錯誤：Loperamide 和 diphenoxylate 均為止瀉劑（antidiarrheal），而非一者止瀉一者通瀉的對立關係；此選項對兩藥的基本分類認知錯誤。","錯誤：兩者均不是止吐劑或催吐劑；loperamide 和 diphenoxylate 均作用於腸道鴉片受體，減少腸蠕動，止吐/催吐並非其主要效應，此選項描述不正確。","","錯誤：loperamide 和 diphenoxylate 均為鴉片受體激動劑（agonist），而非一者為 agonist 另一者為拮抗劑；此選項對兩者的受體作用機制描述完全相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_038","year":2015,"roc_year":104,"session":"1","examNo":38,"q":"可使麻醉甦醒的馬降低鼻充血及水腫的藥物是：","opts":["A. phenylephrine","B. ipratropium","C. terbutaline","D. theophylline"],"ans":0,"exp":"Phenylephrine 為選擇性 α1-腎上腺素受體致效劑，能引起鼻黏膜血管收縮，減少局部血流和液體滲出，從而降低鼻充血與水腫。在麻醉甦醒的馬匹中，鼻黏膜充血腫脹可嚴重阻礙呼吸，局部使用 phenylephrine 鼻噴劑可有效改善氣道通暢性。","we":["","錯誤：Ipratropium 為抗膽鹼藥（M 受體拮抗劑），主要用於抑制支氣管分泌物和支氣管痙攣，對鼻黏膜血管（α1 受體調控）的收縮作用微弱，不是治療鼻充血的首選藥物。","錯誤：Terbutaline 為選擇性 β2 受體致效劑，主要用於支氣管擴張（治療氣管痙攣），對鼻黏膜血管的收縮效果不如 α1 受體激動劑，在此臨床情境下效果不佳。","錯誤：Theophylline 為甲基黃嘌呤類磷酸二酯酶抑制劑，透過升高 cAMP 產生支氣管擴張和輕微利尿效果，對鼻黏膜血管收縮效果差，不適用於解決麻醉後鼻充血問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_039","year":2015,"roc_year":104,"session":"1","examNo":39,"q":"關於葡萄糖酸鈣（calcium gluconate）的敘述，下列何者錯誤？","opts":["A. 通常以緩慢之靜脈注射投予至藥效產生","B. 不可以腹腔注射投予","C. 很少使用口服方法投予","D. 長期治療可合併給與維生素D"],"ans":1,"exp":"葡萄糖酸鈣（calcium gluconate）在臨床實踐中確實可以腹腔注射（intraperitoneal, IP）方式投予，在某些大動物（如牛的生產癱瘓、低鈣血症）急救情況下是可接受的給藥途徑。選項 B 錯誤地聲稱「不可以腹腔注射投予」，此與臨床事實不符，為本題錯誤選項。","we":["此為正確描述：葡萄糖酸鈣的標準給藥方式為緩慢靜脈注射，因快速注射可能引起心律不整甚至心跳停止，臨床上必須緩慢投予並監測心率，此為正確的臨床給藥原則，不符合題目問的「錯誤」描述。","","此為正確描述：口服葡萄糖酸鈣吸收效率較靜脈注射低且起效慢，急性低鈣血症通常需要靜脈途徑快速補充，因此口服途徑在臨床上確實少用，此為正確描述，不符合題目問的「錯誤」描述。","此為正確描述：慢性低鈣血症的長期管理可合併維生素 D（尤其是活性型 1,25-(OH)₂D₃）以促進腸道鈣吸收，此為正確的臨床治療策略，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_040","year":2015,"roc_year":104,"session":"1","examNo":40,"q":"Acetaminophen過量時，最可能造成的病變為何？","opts":["A. 心肌細胞壞死","B. 橫紋肌溶解","C. 肝細胞壞死","D. 靜脈血栓"],"ans":2,"exp":"Acetaminophen（撲熱息痛）過量時，正常的葡萄糖醛酸化和硫酸化代謝途徑飽和，大量藥物經 CYP2E1 氧化為高活性中間代謝物 NAPQI（N-乙醯-對苯醌亞胺）。NAPQI 會耗盡肝臟內的麩胱甘肽（glutathione），並與肝細胞蛋白質共價結合，導致肝小葉中心（centrilobular）的肝細胞壞死，是 acetaminophen 中毒最主要且最嚴重的器官損傷。","we":["錯誤：心肌細胞壞死並非 acetaminophen 中毒的典型病變；心肌損傷更常見於兒茶酚胺類藥物過量或缺血再灌流損傷。Acetaminophen 的毒性靶器官主要是肝臟（透過 NAPQI 機制）。","錯誤：橫紋肌溶解（rhabdomyolysis）是肌肉組織損傷所致，常見於劇烈運動、中毒或特定藥物（如 statins）引起，並非 acetaminophen 中毒的特徵性病理改變。","","錯誤：靜脈血栓並非 acetaminophen 過量的典型病理結果；雖嚴重肝損傷後期可能影響凝血因子合成，但靜脈血栓形成不是此中毒的直接或典型病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_041","year":2015,"roc_year":104,"session":"1","examNo":41,"q":"Glucocorticoids常因存在何種特性，故應避免用於懷孕早期？","opts":["A. 會造成子宮收縮","B. 會造成胎盤剝落","C. 會使臍帶血管收縮","D. 具有致畸胎效應"],"ans":3,"exp":"糖皮質素（glucocorticoids）在齧齒類動物實驗中已確認具有致畸胎性，最典型的表現為顎裂（cleft palate），並可造成胎兒生長遲滯（fetal growth retardation）。因此，懷孕早期應避免使用糖皮質素，以免影響胎兒正常發育。此為選項 D 正確的主要原因。","we":["錯誤：糖皮質素並非子宮收縮藥（uterotonics）；引起子宮收縮的藥物包括前列腺素（prostaglandins）、催產素（oxytocin）及麥角生物鹼（ergot alkaloids）等，糖皮質素無此主要效應。","錯誤：糖皮質素不會直接造成胎盤剝落（placental abruption）；胎盤剝落通常與外傷、高血壓或凝血異常有關，而非糖皮質素的藥理作用。","錯誤：臍帶血管收縮並非糖皮質素的已知主要作用；糖皮質素對臍帶血管的直接收縮效應無充分證據支持為其避免用於早孕的核心理由。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_042","year":2015,"roc_year":104,"session":"1","examNo":42,"q":"下列何者為第二代H1\r -抗組織胺，較少引起鎮靜作用？","opts":["A. fexofenadine","B. diphenhydramine","C. pyrilamine","D. hydroxyzine"],"ans":0,"exp":"Fexofenadine 屬於第二代 H1 抗組織胺，其最大特點是不易穿越血腦障壁（blood-brain barrier），因此對中樞神經系統的抑制作用極少，幾乎不引起鎮靜副作用。相對地，diphenhydramine、pyrilamine 及 hydroxyzine 均屬第一代 H1 抗組織胺，親脂性較高，易進入中樞神經系統，普遍具有明顯的鎮靜效果。","we":["","錯誤：Diphenhydramine（苯海拉明）是典型的第一代 H1 抗組織胺，親脂性高、易穿越血腦障壁，具有明顯的中樞神經抑制及鎮靜作用，不符合「較少引起鎮靜作用」的描述。","錯誤：Pyrilamine（美吡拉明）同屬第一代 H1 抗組織胺，具有中樞神經鎮靜效果，臨床上常作為助眠成分，不符合「較少引起鎮靜作用」的描述。","錯誤：Hydroxyzine 是第一代 H1 抗組織胺，同時具有抗焦慮及鎮靜作用，臨床常用於術前鎮靜，鎮靜作用顯著，不符合「較少引起鎮靜作用」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_043","year":2015,"roc_year":104,"session":"1","examNo":43,"q":"下列何者是排除水楊酸（salicylic acid）最主要的生物轉換？","opts":["A. conjugation","B. deamination","C. hydrolysis","D. reduction"],"ans":0,"exp":"水楊酸（salicylic acid）在體內的排除主要透過結合型生物轉換（conjugation），包括與葡萄糖醛酸的結合（glucuronidation）以及與甘胺酸（glycine）的結合形成水楊尿酸（salicyluric acid）。這兩種結合反應是水楊酸代謝的主要途徑，使其轉化為更極性、更易由腎臟排除的形式。","we":["","錯誤：脫胺基反應（deamination）主要用於含胺基藥物（如胺基酸類藥物或某些抗菌劑）的代謝，水楊酸缺乏胺基結構，deamination 並非其主要代謝途徑。","錯誤：水解反應（hydrolysis）主要見於酯類（esters）或醯胺類（amides）結構藥物的代謝；水楊酸本身結構中無需水解的酯鍵，不屬於其排除的主要生物轉換方式。","錯誤：還原反應（reduction）用於羰基（C=O）或硝基（-NO₂）等基團的代謝，水楊酸的苯環羧酸結構並不以還原反應為主要代謝路徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_044","year":2015,"roc_year":104,"session":"1","examNo":44,"q":"關於cromolyn的特性，下列敘述何者錯誤？","opts":["A. 能抑制histamine及其他自泌素從肥大細胞的釋放","B. 不會抑制H1及H2受體","C. 主要用於處理肺部及鼻腔的過敏反應","D. 它於胃腸道吸收佳，故經口投予有效"],"ans":3,"exp":"Cromolyn（色甘酸）由腸道吸收極差（口服生體可利用率約僅 1%），無法經口投藥發揮全身作用；其臨床應用必須透過吸入（inhaler）或直接塗抹於黏膜（如鼻腔噴霧）才能有效發揮局部穩定肥大細胞的作用。選項 D 描述「於胃腸道吸收佳」為錯誤陳述，故為本題答案。","we":["此為正確描述：Cromolyn 能穩定肥大細胞膜，抑制 histamine 及其他自泌素（如白三烯素、前列腺素）從肥大細胞釋放，此為其核心藥理機制，不符合題目問的「錯誤」描述。","此為正確描述：Cromolyn 不與 H1 或 H2 受體結合，不具有直接的抗組織胺拮抗效果，其作用在於預防介質釋放而非拮抗受體，不符合題目問的「錯誤」描述。","此為正確描述：Cromolyn 主要用於預防和處理氣喘（肺部過敏反應）及過敏性鼻炎（鼻腔過敏反應），以吸入或鼻腔噴霧方式局部投予，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_045","year":2015,"roc_year":104,"session":"1","examNo":45,"q":"大部分β-細胞已被破壞的糖尿病動物，需要下列何種藥物的治療？","opts":["A. insulin","B. glipizide","C. glyburide","D. glimepiride"],"ans":0,"exp":"磺醯脲類藥物（sulfonylureas，如 glipizide、glyburide、glimepiride）的作用機制是刺激胰臟 β 細胞分泌更多胰島素，因此其前提是 β 細胞仍有殘存的分泌功能。當大部分 β 細胞已被破壞（例如 Type 1 糖尿病或晚期 Type 2），胰臟已無法分泌足夠胰島素，磺醯脲類藥物無法發揮作用，此時唯有給予外源性胰島素（insulin）才能有效控制血糖。","we":["","錯誤：Glipizide 屬磺醯脲類口服降血糖藥，需依賴功能性 β 細胞才能促胰島素分泌；當大部分 β 細胞已破壞，glipizide 將無法產生足夠的降血糖效果。","錯誤：Glyburide（glibenclamide）同屬磺醯脲類藥物，作用機制同上，在 β 細胞大量破壞後無法有效刺激胰島素分泌，不適用於此情境。","錯誤：Glimepiride 同樣是磺醯脲類藥物，作用於胰臟 β 細胞上的 ATP 敏感性鉀離子通道，需要功能性 β 細胞才能發揮作用；β 細胞大量破壞後此藥物失效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_046","year":2015,"roc_year":104,"session":"1","examNo":46,"q":"下列何者適合用於控制產後出血及子宮收縮？","opts":["A. epinephrine","B. cloprostenol","C. ergonovine","D. dexamethasone"],"ans":2,"exp":"Ergonovine（ergometrine）是麥角生物鹼（ergot alkaloid）的代表藥物，對子宮平滑肌具有強烈而持續的收縮作用（子宮收縮劑），可顯著減少產後子宮出血（postpartum uterine hemorrhage）。相較其他麥角衍生物，ergonovine 起效快且對子宮的選擇性高，是臨床控制產後出血的重要藥物。","we":["錯誤：Epinephrine（腎上腺素）主要作用於腎上腺素性受體（α 及 β），用於過敏性休克、心臟停搏等急救，並非用於產後出血或子宮收縮控制的首選藥物。","錯誤：Cloprostenol 是前列腺素 F₂α 類似物，主要用於誘發發情（溶解黃體）及終止妊娠，而非產後止血的主要用途。","","錯誤：Dexamethasone 是強效糖皮質素，主要用於抗炎、免疫抑制及促胎肺成熟，不具有直接的子宮收縮止血作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_047","year":2015,"roc_year":104,"session":"1","examNo":47,"q":"最常用於治療疱疹感染的藥物是：","opts":["A. zidovudine","B. acyclovir","C. fluorouracil","D. ribavirin"],"ans":1,"exp":"Acyclovir（阿昔洛韋）是治療疱疹病毒（herpesvirus，包括 HSV-1、HSV-2、EHV 等）感染最常用的抗病毒藥物。其作用機制為：先由病毒胸腺嘧啶激酶（viral thymidine kinase）磷酸化活化，再抑制病毒 DNA 聚合酶，選擇性阻斷病毒 DNA 複製，對宿主細胞毒性極低。","we":["錯誤：Zidovudine（AZT）是核苷類逆轉錄酶抑制劑（NRTI），主要用於抑制反轉錄病毒（retrovirus）如 HIV；對疱疹病毒無顯著抗病毒活性，不是治療疱疹感染的常用藥。","","錯誤：Fluorouracil（5-FU）是嘧啶類抗代謝藥，主要用於腫瘤化療；雖有一定的抗病毒活性，但毒性較大，並非治療疱疹感染的常用選擇。","錯誤：Ribavirin 是廣效抗病毒藥，主要用於呼吸道融合病毒（RSV）及某些 RNA 病毒感染；對疱疹病毒的療效遠不如 acyclovir，非臨床常用首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_048","year":2015,"roc_year":104,"session":"1","examNo":48,"q":"下列何者會和A型流行性感冒病毒的M2蛋白結合並阻斷它的離子通道活性？","opts":["A. amantadine","B. vidarabine","C. acyclovir","D. idoxuridine"],"ans":0,"exp":"Amantadine（金剛烷胺）透過與 A 型流感病毒的 M2 蛋白（M2 ion channel protein）結合，阻斷 M2 蛋白的質子（H⁺）通道活性。M2 通道在病毒顆粒進入宿主細胞內體（endosome）後負責酸化病毒內部，促進病毒外殼（viral coat）脫落（uncoating），從而釋放病毒核酸進行複製。Amantadine 封阻此通道後，病毒無法正常脫殼，複製循環被中斷。","we":["","錯誤：Vidarabine（腺嘌呤核苷）是腺嘌呤類似物，抑制病毒 DNA 聚合酶，主要用於疱疹病毒感染，不作用於流感病毒的 M2 蛋白離子通道。","錯誤：Acyclovir 是鳥嘌呤核苷類似物，選擇性抑制疱疹病毒 DNA 聚合酶，針對疱疹病毒（HSV、VZV 等），與 M2 蛋白的離子通道無關。","錯誤：Idoxuridine 是胸腺嘧啶類似物，可干擾病毒 DNA 合成，主要局部外用於疱疹性角膜炎，並非作用於流感病毒 M2 蛋白。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_049","year":2015,"roc_year":104,"session":"1","examNo":49,"q":"下列有關penicillin G和aminopenicillin的敘述中，何者錯誤？","opts":["A. Amoxicillin可經口或肌肉注射投予","B. Amoxicillin抗部分腸內菌科的活性較penicillin G佳","C. Penicillin G最常和sulbactam併用","D. Benzathine penicillin G為長效型製劑"],"ans":2,"exp":"Penicillin G 本身對 β-lactamase 不穩定，臨床上最常與長效基質（procaine penicillin G 或 benzathine penicillin G）配製成長效製劑，或與胺基醣苷類（aminoglycosides）聯合用於協同殺菌；sulbactam 是 β-lactamase 抑制劑，通常與 ampicillin 或 amoxicillin 配對（如 ampicillin/sulbactam），而非與 penicillin G 最常配對。選項 C 描述錯誤，故為本題答案。","we":["此為正確描述：Amoxicillin 因其口服生體可利用率高，可經口或肌肉注射投予，是廣效青黴素（aminopenicillin）的常見給藥途徑，不符合題目問的「錯誤」描述。","此為正確描述：Amoxicillin 對部分腸內菌科（如大腸桿菌、Proteus mirabilis）具有活性，而 penicillin G 主要針對革蘭氏陽性菌及特定革蘭氏陰性菌（如奈瑟菌），amoxicillin 抗腸內菌科的活性確實較 penicillin G 佳，不符合題目問的「錯誤」描述。","","此為正確描述：Benzathine penicillin G 為難溶性鹽類製劑，注射後在組織中緩慢水解釋放 penicillin G，可維持長達 3–4 週的低濃度血中藥物，屬長效型製劑，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_050","year":2015,"roc_year":104,"session":"1","examNo":50,"q":"若在飼料中添加過量的carbadox時，下列何者較容易發生？","opts":["A. hypoaldosteronism","B. hypothyroidism","C. hyperpituitarism","D. hyperparathyroidism"],"ans":0,"exp":"Carbadox（卡巴氧，quinoxaline-di-N-oxide 類）在飼料中過量添加時，其代謝產物會選擇性損傷腎上腺皮質的球狀帶（zona glomerulosa），導致醛固酮（aldosterone）分泌不足，造成低醛固酮血症（hypoaldosteronism）。醛固酮負責調節腎臟對 Na⁺ 的再吸收及 K⁺ 的排除，缺乏時會導致低血鈉和高血鉀。","we":["","錯誤：Carbadox 的毒性靶器官為腎上腺皮質而非甲狀腺，不會直接造成甲狀腺功能低下（hypothyroidism）。","錯誤：Carbadox 過量造成的是腎上腺皮質損傷，並非腦垂體功能亢進（hyperpituitarism）；兩者解剖位置及調控機制完全不同。","錯誤：甲狀旁腺功能亢進（hyperparathyroidism）涉及甲狀旁腺素（PTH）過度分泌，與 carbadox 對腎上腺皮質的選擇性毒性無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_051","year":2015,"roc_year":104,"session":"1","examNo":51,"q":"下列有關formaldehyde的敘述中，何者正確？","opts":["A. 一般的福馬林中約含有74%（w/v）的formaldehyde","B. Formaldehyde的殺菌速度和常用的乙醇相似","C. 給與足夠接觸時間，可達到抗細菌孢子的作用","D. 其約在100 ppm以上才有刺鼻味"],"ans":2,"exp":"Formaldehyde 在給予足夠的接觸時間（通常數小時）及足夠濃度下，能使細菌孢子的孢子蛋白及核酸發生烷化交聯，從而殺滅細菌孢子，屬於高效消毒（滅菌）劑。選項 C 為正確描述，為本題答案。","we":["錯誤：一般的福馬林（formalin）溶液中 formaldehyde 的含量約為 37%（w/v），而非 74%；74% 並非標準商品福馬林的規格，此描述錯誤。","錯誤：Formaldehyde 的殺菌速度遠較乙醇（ethanol）慢；乙醇（70–80%）因快速使蛋白質變性可在數秒至數分鐘內殺滅多數細菌，formaldehyde 則需較長接觸時間，兩者速度並不相似。","","錯誤：Formaldehyde 具有強烈刺激性氣味，人類嗅覺閾值約為 0.5–1 ppm 即可察覺；並非需達 100 ppm 才有刺鼻味，100 ppm 已屬危險濃度（對眼、鼻、呼吸道有嚴重刺激）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_052","year":2015,"roc_year":104,"session":"1","examNo":52,"q":"下列何種抗生素在大部分動物經口投藥後的吸收最佳？","opts":["A. polymyxin B","B. bacitracin","C. neomycin","D. enrofloxacin"],"ans":3,"exp":"Enrofloxacin 是氟喹諾酮類（fluoroquinolone）抗生素，口服生體可利用率高（大多數動物可達 80–100%），可被腸道黏膜快速且完整地吸收，進入全身循環。相對地，polymyxin B、bacitracin 及 neomycin 均屬多胜肽類或胺基醣苷類抗生素，分子量大、極性強，由腸道吸收極差，口服後幾乎只在腸道局部發揮作用。","we":["錯誤：Polymyxin B 是多胜肽類抗生素，分子量大且帶多個正電荷，口服後腸道吸收極少（< 1%），幾乎完全不被吸收入全身循環，不符合「吸收最佳」。","錯誤：Bacitracin 是多胜肽類抗生素，口服後因分子結構特性在腸道中無法有效被吸收，主要用於局部外用或腸道局部感染治療，不符合「吸收最佳」。","錯誤：Neomycin 是胺基醣苷類抗生素，高極性、高分子量，口服生體可利用率極低（< 3%），臨床口服主要用於腸道局部消毒（如術前腸道準備），不符合「吸收最佳」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_053","year":2015,"roc_year":104,"session":"1","examNo":53,"q":"Enrofloxacin可使theophylline的血中最高濃度（Cmax）增大，並使全身性廓清率（systemic\r clearance）減少，主要是因：","opts":["A. 減慢theophylline的吸收速率","B. 增加theophylline的分布體積","C. 抑制theophylline的代謝","D. 競爭theophylline的排除途徑"],"ans":2,"exp":"Enrofloxacin（及其活性代謝物 ciprofloxacin）是細胞色素 P450 同功酶 CYP1A2 的強效抑制劑。Theophylline 主要由肝臟 CYP1A2 代謝清除；當 enrofloxacin 抑制 CYP1A2 後，theophylline 的肝臟代謝速率顯著降低，導致其全身性廓清率（systemic clearance）下降，同時因代謝減少使藥物累積，血中最高濃度（Cmax）上升，增加 theophylline 中毒風險。","we":["錯誤：Enrofloxacin 並不影響 theophylline 的吸收速率（absorption rate）；此藥物交互作用發生在代謝（metabolism）層面，而非吸收階段，不會改變口服後的吸收動力學。","錯誤：Enrofloxacin 不會增加 theophylline 的分布體積（volume of distribution，Vd）；Vd 主要取決於藥物的組織親和力與血漿蛋白結合率，不受 CYP1A2 抑制影響。","","錯誤：Theophylline 主要經肝臟代謝（CYP1A2）排除，腎臟排除為次要途徑；enrofloxacin 的交互作用並非透過競爭腎臟排除途徑，而是透過抑制肝臟代謝酶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_054","year":2015,"roc_year":104,"session":"1","examNo":54,"q":"下列 tetracyclines中，何者應具有較佳的脂溶性？","opts":["A. chlortetracycline","B. oxytetracycline","C. tetracycline","D. doxycycline"],"ans":3,"exp":"在常用的四環黴素類藥物中，doxycycline（去氧羥四環素）的脂溶性（lipophilicity）最高。高脂溶性使 doxycycline 具有最佳的組織穿透力，能有效分布至中樞神經系統、眼睛、前列腺等難以到達的組織，並擁有較長的半衰期及較高的口服生體可利用率。相較之下，chlortetracycline、oxytetracycline 及 tetracycline 的脂溶性均較低。","we":["錯誤：Chlortetracycline（金黴素）是最早發現的四環黴素，但其脂溶性在四環黴素類中並非最高；口服吸收相對較差，組織分布能力不及 doxycycline。","錯誤：Oxytetracycline 含有額外的羥基（hydroxyl group），使其水溶性高於 doxycycline，脂溶性相對較低，組織穿透力較差。","錯誤：Tetracycline 的脂溶性在四環黴素類中屬中等偏低，口服吸收受鈣離子等二價陽離子影響較大，脂溶性不如 doxycycline。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_055","year":2015,"roc_year":104,"session":"1","examNo":55,"q":"下列有關penicillin類抗生素抗菌作用之敘述，何者錯誤？","opts":["A. 干擾細菌之transpeptidase","B. 對正在分裂繁殖的細菌無效","C. 破壞細胞壁之形成","D. 是殺菌性藥物"],"ans":1,"exp":"青黴素類（penicillins）屬於細胞壁合成抑制劑，其作用靶點是青黴素結合蛋白（penicillin-binding proteins，PBPs），特別是 transpeptidase，干擾肽聚醣（peptidoglycan）的交聯合成。這一抑制作用只有在細菌正在進行細胞壁合成（即細菌正處於分裂繁殖階段）時才能發揮最大效用；靜止期細菌（不分裂）因無細胞壁合成活動，青黴素影響較小。選項 B 描述「對正在分裂繁殖的細菌無效」顯然錯誤，故為本題答案。","we":["此為正確描述：青黴素透過抑制 transpeptidase（PBPs）干擾肽聚醣的最終交聯步驟，造成細菌無法形成完整細胞壁，此為其核心抗菌機制，不符合題目問的「錯誤」描述。","","此為正確描述：抑制 transpeptidase 後，肽聚醣無法正常交聯，新生細菌缺乏完整細胞壁支撐，在滲透壓下導致細胞破裂死亡，青黴素確實透過破壞細胞壁形成發揮殺菌作用，不符合題目問的「錯誤」描述。","此為正確描述：青黴素類藥物是殺菌性（bactericidal）藥物，而非僅抑菌；其透過干擾細胞壁合成最終導致細菌溶解死亡，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_056","year":2015,"roc_year":104,"session":"1","examNo":56,"q":"下列何者是同時投予動物數種不同磺胺劑的主要原因？","opts":["A. 延長藥物的半衰期","B. 預防藥物於尿液中結晶","C. 增廣抗菌範圍","D. 降低抗藥性發生的機率"],"ans":1,"exp":"同時投予數種不同磺胺劑（sulfonamide combination）的主要原因是預防磺胺結晶尿（crystalluria）。各磺胺劑在尿中的溶解度彼此獨立，混合使用時每種磺胺劑各自在尿中維持低於其結晶閾值的濃度，但總磺胺劑濃度則可達到有效的抗菌水準，從而在保持抗菌效果的同時降低任何單一磺胺劑在尿中結晶析出的風險。","we":["錯誤：同時使用多種磺胺劑並不會延長其半衰期；藥物半衰期由消除速率常數（分布容積與廓清率）決定，合併用藥不改變個別藥物的代謝動力學參數。","","錯誤：不同磺胺劑的抗菌譜（spectrum）基本相似，合併用藥並不能顯著擴大抗菌範圍；磺胺劑增廣抗菌範圍通常透過與甲氧苄啶（trimethoprim）合用（協同作用），而非多種磺胺劑合用。","錯誤：降低抗藥性發生率並非同時投予多種磺胺劑的主要理由；磺胺劑抗藥性主要涉及 PABA 過量產生或酶結構改變，非合用多種磺胺劑可解決的問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_057","year":2015,"roc_year":104,"session":"1","examNo":57,"q":"下列何者是磺胺劑的作用機制？","opts":["A. 抑制dihydrofolate reductase","B. 抑制dihydropteroate synthetase","C. 抑制β-lactamase","D. 抑制DNA gyrase"],"ans":1,"exp":"磺胺劑（sulfonamides）的作用機制是競爭性抑制二氫蝶酸合成酶（dihydropteroate synthetase，DHPS），阻斷對胺基苯甲酸（PABA）與蝶啶（pteridine）縮合形成二氫蝶酸（dihydropteroic acid）的步驟，進而阻斷二氫葉酸（dihydrofolate）及四氫葉酸（tetrahydrofolate）的合成，抑制細菌核酸前驅物的生成，達到制菌（bacteriostatic）效果。","we":["錯誤：抑制二氫葉酸還原酶（dihydrofolate reductase，DHFR）是甲氧苄啶（trimethoprim）的作用機制，而非磺胺劑；磺胺劑作用於葉酸合成路徑的前一步（DHPS），而 trimethoprim 作用於後一步（DHFR），兩者合用具有協同效果。","","錯誤：抑制 β-lactamase 是 β-lactamase 抑制劑（如 clavulanate、sulbactam）的作用，用於保護 β-lactam 抗生素不被細菌酶降解，與磺胺劑的葉酸合成抑制機制完全無關。","錯誤：抑制 DNA 促旋酶（DNA gyrase）是喹諾酮類（quinolones，如 enrofloxacin）的作用機制，針對細菌 DNA 複製過程，與磺胺劑抑制葉酸合成的機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_058","year":2015,"roc_year":104,"session":"1","examNo":58,"q":"Tetracycline易與陽離子形成不溶性螯合物（insoluble chelates），最易積聚於下列何處？","opts":["A. 腎臟","B. 肺臟","C. 骨骼","D. 心臟"],"ans":2,"exp":"四環黴素類（tetracyclines）能與二價及三價陽離子（Ca²⁺、Mg²⁺、Al³⁺、Fe²⁺等）形成不溶性螯合物（insoluble chelates）。骨骼（bone）含有大量且代謝活躍的羥磷灰石（hydroxyapatite）晶體，其中 Ca²⁺ 密度最高，且骨骼持續進行礦化（mineralization）及重塑（remodeling），因此四環黴素螯合物最易積聚於骨骼。在發育中動物（如幼犬、幼貓）尤其明顯，可造成牙齒及骨骼變色和抑制骨骼發育。","we":["錯誤：腎臟雖是四環黴素的主要排除器官，但其 Ca²⁺ 密度及礦化程度遠低於骨骼，不溶性螯合物不優先積聚於腎臟。","錯誤：肺臟以彈力纖維和上皮細胞為主，缺乏大量的鈣化礦物質沉積，四環黴素螯合物不會優先積聚於肺臟。","","錯誤：心臟主要由心肌細胞組成，雖含 Ca²⁺（用於收縮調節），但其 Ca²⁺ 主要存在於細胞內肌質網而非礦化基質，不是四環黴素螯合物的主要積聚部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_059","year":2015,"roc_year":104,"session":"1","examNo":59,"q":"下列四環黴素類何者又稱為金黴素？","opts":["A. oxytetracycline","B. doxycycline","C. tetracycline","D. chlortetracycline"],"ans":3,"exp":"Chlortetracycline（氯四環素）又名「金黴素」（aureomycin），因其最初由金黃色放線菌（Streptomyces aureofaciens，aureus = 金黃色）中分離而得，具有金黃色螢光，故得此名。Chlortetracycline 於 1948 年由 Benjamin Minge Duggar 首先發現，是最早被發現並應用的四環黴素類抗生素之一。","we":["錯誤：Oxytetracycline 的商品名為「土黴素」（terramycin），因最初從土壤中的龜裂鏈黴菌（Streptomyces rimosus）中分離，並非金黃色，不稱為「金黴素」。","錯誤：Doxycycline 是 oxytetracycline 的半合成衍生物，又稱「去氧羥四環素」或「強力黴素」，與「金黴素」之名無關。","錯誤：Tetracycline 的通俗名即「四環素」，並無「金黴素」之別稱，不具有金黃色螢光特性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_060","year":2015,"roc_year":104,"session":"1","examNo":60,"q":"Formalin在何種環境的水質下，毒性較高？","opts":["A. 酸性軟水、高水溫","B. 酸性硬水、低水溫","C. 鹼性軟水、低水溫","D. 鹼性硬水、高水溫"],"ans":0,"exp":"Formalin（福馬林）在水產使用時，其毒性在酸性軟水（soft water，礦物質含量低）且高水溫的環境下最強。原因：（1）高水溫加速 formaldehyde 的揮發與化學反應速率，同時使魚類代謝速率加快、藥物吸收增加；（2）酸性水中 formaldehyde 的殺生活性較強；（3）軟水（低硬度）中溶氧含量相對不穩定，魚類對藥物的耐受力下降，毒性表現更明顯。","we":["","錯誤：酸性硬水、低水溫時，低水溫減緩 formaldehyde 的化學活性及魚類的藥物吸收速率，毒性相對較低；硬水中的礦物質也可能部分結合 formaldehyde，降低其有效濃度。","錯誤：鹼性軟水、低水溫時，低水溫減緩毒性反應，且鹼性環境下 formaldehyde 活性降低；整體毒性低於酸性高溫軟水環境。","錯誤：鹼性硬水、高水溫時，雖然高水溫增加毒性，但鹼性硬水中的礦物質（如 Ca²⁺、Mg²⁺）及鹼性 pH 可部分緩衝 formaldehyde 活性，毒性不及酸性軟水高溫環境強。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_061","year":2015,"roc_year":104,"session":"1","examNo":61,"q":"下列何者為nitrofuran類藥物被禁用於產食動物的主要原因？","opts":["A. 引起過敏性休克","B. 致癌性","C. 抑制呼吸中樞","D. 嚴重腹瀉"],"ans":1,"exp":"硝基呋喃類藥物（nitrofurans，包括 nitrofurazone、furazolidone 等）被禁止用於產食動物（food-producing animals）的主要原因是其具有致癌性（carcinogenicity）及誘變性（mutagenicity）。研究顯示硝基呋喃及其代謝物可與 DNA 共價結合，造成 DNA 損傷，在動物試驗中表現出致腫瘤潛力；其組織殘留物亦具潛在基因毒性，因此在全球大多數國家均被禁用於產食動物。","we":["錯誤：硝基呋喃類藥物雖可能引起過敏反應，但過敏性休克（anaphylactic shock）並非被禁用於產食動物的主要原因；其他許多藥物也可能引起過敏，但並非因此被全面禁用於食用動物。","","錯誤：抑制呼吸中樞（respiratory center depression）並非硝基呋喃類藥物的主要毒性機制；此類藥物的毒性主要體現在遺傳毒性（genotoxicity）及致癌性，而非急性中樞神經毒性。","錯誤：嚴重腹瀉雖可能為使用硝基呋喃類藥物的副作用之一，但並非其被禁用的主要理由；致癌性及食品安全顧慮（殘留毒性）才是禁用的核心原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_062","year":2015,"roc_year":104,"session":"1","examNo":62,"q":"使用doxorubicin治療犬隻乳癌時，需特別注意該藥物可能藉由自由基，使得下列何種器官特\r 別容易產生慢性、不可回復性的病變？","opts":["A. 肺","B. 心","C. 腎","D. 肝"],"ans":1,"exp":"Doxorubicin（阿黴素，蒽環類抗癌藥）透過產生活性氧（reactive oxygen species，ROS）及自由基，對心肌細胞造成氧化損傷。心肌細胞缺乏足夠的抗氧化酶（如超氧化物歧化酶、過氧化氫酶），特別容易受 ROS 傷害。長期使用可導致劑量累積性、不可回復的心肌病變（dilated cardiomyopathy），是 doxorubicin 最重要的限制毒性，犬使用時需嚴格監測心臟功能。","we":["錯誤：肺臟雖含有一定量的抗氧化酶，但 doxorubicin 的限制毒性（dose-limiting toxicity）主要為心臟毒性而非肺毒性；肺纖維化更常見於博來黴素（bleomycin）使用後。","","錯誤：腎臟毒性（nephrotoxicity）是多種藥物的副作用（如 aminoglycosides、cisplatin），但並非 doxorubicin 的主要限制毒性；其心臟毒性更受臨床重視。","錯誤：Doxorubicin 可引起肝毒性，但慢性、不可回復性病變主要發生在心臟；肝臟因具有較強的再生能力，較不易發生不可回復性損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_063","year":2015,"roc_year":104,"session":"1","examNo":63,"q":"下列何者可被使用於治療腎上腺增生和腎上腺瘤？","opts":["A. mitotane","B. trimethoprim","C. pyridoxine","D. mifepristone"],"ans":0,"exp":"Mitotane（o,p'-DDD，米托坦）對腎上腺皮質具有選擇性細胞毒性，能破壞腎上腺皮質的束狀帶（zona fasciculata）及網狀帶（zona reticularis），減少皮質醇（cortisol）的合成與分泌。臨床上用於治療犬的腎上腺皮質機能亢進（庫欣氏症，Cushing's syndrome）及腎上腺皮質腫瘤（adrenocortical carcinoma），是獸醫臨床最重要的腎上腺特異性藥物之一。","we":["","錯誤：Trimethoprim 是二氫葉酸還原酶抑制劑，屬於抗菌藥物（通常與磺胺劑合用），與腎上腺疾病的治療完全無關。","錯誤：Pyridoxine 是維生素 B₆，用於補充維生素缺乏或治療某些代謝疾病（如異菸鹼酸引起的神經病變），並無腎上腺皮質選擇性毒性作用。","錯誤：Mifepristone（RU-486）是孕激素受體拮抗劑（progesterone receptor antagonist）及糖皮質素受體拮抗劑，可用於庫欣氏症的症狀緩解（阻斷皮質醇受體），但其作用機制為受體拮抗，而非直接破壞腎上腺組織，故不用於腎上腺增生或腫瘤的根本治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_064","year":2015,"roc_year":104,"session":"1","examNo":64,"q":"下列何者適用於陰道黴菌症之治療？","opts":["A. azithromycin","B. enalapril","C. clotrimazole","D. detomidine"],"ans":2,"exp":"Clotrimazole（咪唑類抗真菌藥）屬於唑類（azole）抗真菌藥物，可抑制真菌細胞膜麥角固醇（ergosterol）的合成，造成細胞膜通透性異常。Clotrimazole 常製成陰道錠劑或乳膏，廣泛用於治療陰道念珠菌症（vaginal candidiasis，陰道黴菌症），是此適應症的首選外用藥物之一。","we":["錯誤：Azithromycin 是大環內酯類（macrolide）抗生素，用於細菌感染（如呼吸道感染、披衣菌感染等），對真菌無抗菌活性，不適用於陰道黴菌症。","錯誤：Enalapril 是血管張力素轉化酶抑制劑（ACEI），用於高血壓及心臟衰竭的治療，與抗真菌作用完全無關。","","錯誤：Detomidine 是 α₂ 腎上腺素性受體促效劑，用於馬、牛等大動物的鎮靜及止痛，不具有抗真菌活性，與陰道黴菌症的治療無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_065","year":2015,"roc_year":104,"session":"1","examNo":65,"q":"用於點眼的藥物進入眼睛的主要路徑為何？","opts":["A. 水晶體","B. 鞏膜","C. 角膜","D. 虹膜"],"ans":2,"exp":"局部點眼藥物（topically applied ophthalmic drugs）進入眼睛的主要路徑是透過角膜（cornea）。角膜具有特殊的多層結構（上皮層、基質層、內皮層），藥物依序穿越親脂性上皮層、親水性基質層及親脂性內皮層，才能進入前房（anterior chamber）發揮藥效；角膜面積雖小但通透性最佳，是點眼藥物的主要吸收途徑。","we":["錯誤：水晶體（lens）位於眼球內部，有囊膜包覆，並非點眼藥物由外部進入眼睛的主要路徑；藥物在穿過角膜進入前房後才可能接觸水晶體，但水晶體本身不是主要吸收途徑。","錯誤：鞏膜（sclera）是眼球的外層白色纖維膜，雖具有一定通透性，但其面積雖大，通透性遠低於角膜；點眼藥物主要透過角膜而非鞏膜吸收進入眼球。","","錯誤：虹膜（iris）位於眼球內部（前房後方），是點眼藥物作用的靶組織之一（如散瞳劑），而非藥物由外部進入眼睛的吸收途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_066","year":2015,"roc_year":104,"session":"1","examNo":66,"q":"可與真菌細胞膜上的麥角固醇（ergosterol）結合而改變離子通透性之藥物是：","opts":["A. lufenuron","B. amphotericin B","C. griseofulvin","D. flucytosine"],"ans":1,"exp":"Amphotericin B（兩性黴素 B）是多烯類（polyene）抗真菌藥物，其作用機制是與真菌細胞膜上特有的麥角固醇（ergosterol）直接結合，在細胞膜上形成通透性孔道（membrane pores），導致細胞內 K⁺、Mg²⁺ 及其他重要離子大量外漏，破壞離子梯度及膜電位，最終導致真菌細胞死亡。哺乳動物細胞膜含膽固醇（cholesterol）而非 ergosterol，選擇性較高，但 amphotericin B 仍有腎毒性等副作用。","we":["錯誤：Lufenuron 是苯甲醯基脲類（benzoylphenyl urea）昆蟲生長調節劑，抑制昆蟲幾丁質（chitin）合成，用於跳蚤控制；它不與真菌 ergosterol 結合，也不用作抗真菌藥。","","錯誤：Griseofulvin 是另一種抗真菌藥，其作用機制是與真菌微管蛋白（tubulin）結合，干擾有絲分裂及細胞分裂，並非與 ergosterol 結合或形成膜孔道。","錯誤：Flucytosine（5-FC）是嘧啶類抗代謝藥，進入真菌細胞後被轉化為 5-氟尿嘧啶（5-FU），抑制 DNA 合成及 RNA 功能；不透過與 ergosterol 結合發揮作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_067","year":2015,"roc_year":104,"session":"1","examNo":67,"q":"下列何者不屬於benzimidazole類藥物？","opts":["A. albendazole","B. oxfendazole","C. febantel","D. metronidazole"],"ans":3,"exp":"Metronidazole（甲硝唑）屬於硝基咪唑類（nitroimidazole）藥物，不屬於苯並咪唑類（benzimidazole）。苯並咪唑類抗寄生蟲藥（benzimidazoles）的作用機制是與寄生蟲 β-tubulin 結合，抑制微管聚合，代表藥物包括 albendazole（A）、oxfendazole（B）及 febantel（C，為前驅藥，在體內轉化為 fenbendazole/oxfendazole）。Metronidazole 的作用是進入厭氧菌或原蟲細胞後，其硝基被還原為細胞毒性代謝物，破壞 DNA 結構，屬於完全不同的藥物類別。","we":["此為正確描述：Albendazole 是典型的苯並咪唑類廣效驅蟲藥，透過與寄生蟲 β-tubulin 結合抑制微管聚合，屬於 benzimidazole 類，不符合題目問的「不屬於 benzimidazole」描述。","此為正確描述：Oxfendazole 是苯並咪唑類驅蟲藥（fenbendazole 的氧化代謝物），同樣以 β-tubulin 為靶點，屬於 benzimidazole 類，不符合題目問的「不屬於 benzimidazole」描述。","此為正確描述：Febantel 是前驅藥（prodrug），在體內代謝後產生 fenbendazole 及 oxfendazole 等苯並咪唑活性代謝物，因此廣義上屬於 benzimidazole 類前驅藥，不符合題目問的「不屬於 benzimidazole」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_068","year":2015,"roc_year":104,"session":"1","examNo":68,"q":"下列何者可經口投藥控制犬之跳蚤？","opts":["A. lufenuron","B. diazinon","C. phosmet","D. coumaphos"],"ans":0,"exp":"Lufenuron 是苯甲醯基脲類（benzoylphenyl urea）昆蟲生長調節劑，可經口投藥給犬，透過血液循環轉移至犬的皮膚及組織中。當跳蚤吸食犬血後，將攝入含 lufenuron 的血液，藥物在跳蚤卵及幼蟲發育過程中抑制幾丁質（chitin）合成，使幼蟲無法形成正常外骨骼，孵化率降低、幼蟲不能正常發育，從而有效控制跳蚤族群。","we":["","錯誤：Diazinon 是有機磷殺蟲劑（organophosphate），外用噴灑或浸泡，透過抑制乙醯膽鹼酯酶殺滅跳蚤成蟲，不能經口投藥後轉移至血液中以幾丁質抑制機制控制跳蚤。","錯誤：Phosmet 是有機磷殺蟲劑，主要以外用（澆潑劑、浸泡）方式使用，同樣不透過口服後的血液轉移機制抑制跳蚤幾丁質合成。","錯誤：Coumaphos 是有機磷殺蟲劑，常用於牛、羊等畜牧動物的體外寄生蟲防治，以外用方式施用，不透過口服–血液–幾丁質抑制途徑控制跳蚤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_069","year":2015,"roc_year":104,"session":"1","examNo":69,"q":"下列何者為carbamates的作用機制？","opts":["A. 作用在菸鹼酸性受體","B. 藉由胺基甲醯化抑制膽鹼酶","C. 作用在γ-胺基丁酸閘門氯離子通道驅線蟲藥","D. 作用在麩胺酸（glutamate）閘門氯離子通道驅線蟲藥"],"ans":1,"exp":"胺基甲酸酯類殺蟲劑（carbamates）的作用機制是透過胺基甲醯化（carbamoylation）修飾乙醯膽鹼酯酶（acetylcholinesterase，AChE）的絲胺酸活性位點，使 AChE 暫時失去水解乙醯膽鹼（ACh）的能力。此結合為可逆性（reversible），胺基甲醯化的酶可自發水解再活化，與有機磷酸酯類的不可逆磷酸化形成對比。AChE 被抑制後，突觸中 ACh 累積，導致過度神經興奮。","we":["錯誤：作用於菸鹼酸性受體（nicotinic receptors）的是 levamisole 及 pyrantel 等驅蟲藥（菸鹼性促效劑），不是胺基甲酸酯類殺蟲劑的主要作用機制；carbamates 是 AChE 抑制劑，而非直接作用於受體。","","錯誤：作用於 γ-胺基丁酸（GABA）閘門氯離子通道的是 avermectins/milbemycins 類驅蟲藥（如 ivermectin），透過增強 GABA 介導的 Cl⁻ 內流使神經麻痺；這是驅線蟲藥而非胺基甲酸酯類殺蟲劑的機制。","錯誤：作用於麩胺酸（glutamate）閘門氯離子通道（GluCl channel）的是 avermectins 類藥物（如 ivermectin）的另一作用靶點，為無脊椎動物特有，亦非胺基甲酸酯類的作用機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_070","year":2015,"roc_year":104,"session":"1","examNo":70,"q":"下列何者可用於預防雞住血原蟲感染？","opts":["A. closantel","B. netobimin","C. clopidol","D. trichlorfon"],"ans":2,"exp":"Clopidol（氯吡多）是喹啉酮類（quinolone-based）抗球蟲及抗住血原蟲藥物，對雞住血原蟲（Leucocytozoon spp.）具有良好的預防效果，常添加於雞飼料中用於住血原蟲病（Leucocytozoonosis）的預防。住血原蟲感染主要由黑蚋（blackflies）傳播，造成雞隻貧血、死亡，clopidol 是針對此病的重要預防性藥物。","we":["錯誤：Closantel 是水楊酸苯胺類（salicylanilide）藥物，主要用於驅除肝片吸蟲（Fasciola hepatica）及線蟲，對住血原蟲無效，不用於預防雞住血原蟲感染。","錯誤：Netobimin 是前驅型苯並咪唑類（probenzimidazole）驅蟲藥，在體內轉化為 albendazole 代謝物，主要用於防治消化道線蟲及絛蟲，對住血原蟲無效。","","錯誤：Trichlorfon 是有機磷殺蟲劑，透過抑制乙醯膽鹼酯酶殺滅外寄生蟲（跳蚤、蝨子等）及某些消化道蠕蟲，對原蟲性住血原蟲感染無預防作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_071","year":2015,"roc_year":104,"session":"1","examNo":71,"q":"下列何者主要為levamisole之中毒症狀？","opts":["A. 光敏症","B. 呼吸肌麻痺","C. 腎衰竭","D. 中樞神經系統興奮"],"ans":1,"exp":"Levamisole（左旋咪唑）作為驅蟲藥的機制是作為線蟲神經肌肉接合部（neuromuscular junction，NMJ）菸鹼型乙醯膽鹼受體（nicotinic acetylcholine receptors）的促效劑（agonist），使肌肉持續去極化，導致線蟲弛緩性麻痺。過量使用時（中毒劑量），levamisole 的菸鹼性受體激動效應也作用於哺乳動物的 NMJ，導致呼吸肌（diaphragm 及肋間肌）持續收縮後麻痺，表現為呼吸肌麻痺（respiratory muscle paralysis），是 levamisole 中毒最主要且最危險的症狀。","we":["錯誤：光敏症（photosensitization）是某些藥物（如吩噻嗪類）或毒素造成的皮膚對光線過敏反應，並非 levamisole 中毒的主要症狀；levamisole 的毒性以神經肌肉效應為主。","","錯誤：腎衰竭雖可能在某些藥物過量時發生，但並非 levamisole 中毒最主要、最具特徵性的症狀；levamisole 中毒的致命性主要源於其神經肌肉毒性（呼吸麻痺）而非腎臟毒性。","錯誤：中樞神經系統興奮（如痙攣）更常見於有機磷中毒等情況；levamisole 的主要毒性靶點是周邊神經肌肉接合部的菸鹼性受體，引起呼吸肌麻痺，中樞興奮並非其最主要的中毒症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_072","year":2015,"roc_year":104,"session":"1","examNo":72,"q":"下列何者為抗酵母菌性皮膚炎之最佳洗毛劑？","opts":["A. ketoconazole與chlorhexidine","B. hydrocortisone與propylene glycol","C. hydrocortisone與gelatin","D. hydrocortisone與gentamicin"],"ans":0,"exp":"犬馬拉色菌（Malassezia）性皮膚炎（酵母菌性皮膚炎）的治療洗毛劑以 ketoconazole（唑類抗真菌藥，抑制 ergosterol 合成）與 chlorhexidine（廣效抗菌消毒劑，破壞細菌與真菌細胞膜）的組合最為有效。兩者協同作用，同時針對真菌（Malassezia）及可能合併的細菌感染，是獸醫皮膚科治療犬 Malassezia 皮炎的標準配方洗毛劑。","we":["","錯誤：Hydrocortisone 與 propylene glycol 的組合偏向保濕及輕微抗炎效果，propylene glycol 無特異性抗真菌作用，不足以有效治療 Malassezia 酵母菌性皮膚炎。","錯誤：Hydrocortisone 與 gelatin 的組合無抗真菌成分，gelatin 僅為賦形劑，不具殺菌活性，無法有效針對 Malassezia 感染。","錯誤：Hydrocortisone 與 gentamicin 的組合具有類固醇抗炎及胺基醣苷抗細菌效果，但 gentamicin 對真菌無效，不適合作為 Malassezia 酵母菌性皮膚炎的主要治療洗毛劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_073","year":2015,"roc_year":104,"session":"1","examNo":73,"q":"犬弓蟲症可用下列何者來治療？","opts":["A. mebendazole","B. trichlorfon","C. gentamicin","D. clindamycin"],"ans":3,"exp":"犬弓蟲症（canine toxoplasmosis，由 Toxoplasma gondii 引起）的首選治療藥物是 clindamycin（林可醯胺類，lincosamide）。Clindamycin 能有效抑制弓蟲的蛋白質合成（作用於 50S 核糖體），並且在組織（包括肌肉、眼睛及中樞神經系統）中分布良好，能到達弓蟲囊腫形成的部位，是獸醫臨床治療犬、貓弓蟲症的標準選擇。","we":["錯誤：Mebendazole 是苯並咪唑類驅蟲藥，用於驅除腸道線蟲（蛔蟲、鉤蟲、鞭蟲等），對細胞內原蟲（如 Toxoplasma gondii）無效，不用於弓蟲症治療。","錯誤：Trichlorfon 是有機磷殺蟲劑，用於外寄生蟲防治及某些腸道蠕蟲驅除，對弓蟲（原蟲）無抗原蟲活性，不適用於弓蟲症。","錯誤：Gentamicin 是胺基醣苷類抗生素，用於革蘭氏陰性菌感染，對真核生物（包括 Toxoplasma gondii 等原蟲）的活性極低，不用於弓蟲症的治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_074","year":2015,"roc_year":104,"session":"1","examNo":74,"q":"複選題\n74.Pyrantel可驅除下列何種寄生蟲？","opts":["A. 蛔蟲","B. 鞭蟲","C. 絛蟲","D. 原蟲"],"ans":0,"exp":"Pyrantel（四氫嘧啶類，tetrahydropyrimidine）是菸鹼型乙醯膽鹼受體的去極化神經肌肉阻斷劑，對蛔蟲（ascarids，如犬蛔蟲 Toxocara canis、貓蛔蟲 Toxocara cati）及鉤蟲（hookworms）有效。然而，pyrantel 對鞭蟲（whipworms，Trichuris spp.）、絛蟲（tapeworms，Cestoda）及原蟲（protozoa）無效；這些寄生蟲需要不同藥物治療（如鞭蟲需 fenbendazole，絛蟲需 praziquantel，原蟲需 metronidazole 等）。","we":["","錯誤：Pyrantel 對鞭蟲（鞭毛蟲，Trichuris spp.）的驅除效果不佳；鞭蟲的標準治療藥物是苯並咪唑類（如 fenbendazole、oxfendazole），pyrantel 不被推薦用於鞭蟲感染。","錯誤：絛蟲（tapeworms）屬於扁形動物（Platyhelminthes），其作用靶點與線蟲完全不同；pyrantel 對絛蟲無效，治療絛蟲應使用 praziquantel 或 epsiprantel。","錯誤：原蟲（protozoa，如 Giardia、Toxoplasma）是真核單細胞生物，pyrantel 的菸鹼性受體作用機制對其無效；原蟲感染需使用 metronidazole、clindamycin 等特異性抗原蟲藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_075","year":2015,"roc_year":104,"session":"1","examNo":75,"q":"行政院衛生福利部公告 doxycycline於魚肉中殘留量標準（容許量）為：","opts":["A. 0.2 ppm","B. 0.1 ppm","C. 0.02 ppm","D. 0.01 ppm"],"ans":3,"exp":"依據行政院衛生福利部（現稱衛生福利部）公告，doxycycline 在魚肉中的殘留容許量（MRL，maximum residue limit）為 0.01 ppm（即 10 μg/kg）。此標準用於確保食品安全，防止抗生素殘留對消費者健康造成影響，並符合國際食品安全規範。","we":["錯誤：0.2 ppm 不符合衛生福利部對 doxycycline 在魚肉中的殘留容許量規定；此值高出官方標準 20 倍，若以此為標準將無法有效保護食品安全。","錯誤：0.1 ppm 不符合官方公告；此值高出 doxycycline 魚肉殘留容許量（0.01 ppm）10 倍。","錯誤：0.02 ppm 不符合官方公告；此值高出正確標準 0.01 ppm 的 2 倍，仍不符合衛生福利部公告規範。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_076","year":2015,"roc_year":104,"session":"1","examNo":76,"q":"國內「含藥物飼料添加物使用規範」規定，carbadox用於豬防治疾病，停藥期為：","opts":["A. 7日","B. 14日","C. 28日","D. 35日"],"ans":2,"exp":"依據台灣「含藥物飼料添加物使用規範」，carbadox 用於豬防治疾病時，其規定停藥期（withdrawal period）為 28 日（28 days）。即豬隻在屠宰前 28 天必須停止使用含 carbadox 的飼料，確保屠宰後豬肉中 carbadox 殘留量符合安全標準，避免對消費者健康造成危害。","we":["錯誤：7 日停藥期對 carbadox 而言過短，無法確保藥物在豬體內充分代謝並降至安全殘留水準；官方規定為 28 日，而非 7 日。","錯誤：14 日停藥期亦不符合台灣「含藥物飼料添加物使用規範」對 carbadox 的規定；正確停藥期為 28 日。","","錯誤：35 日停藥期超過官方規定的 28 日，雖在食品安全上更保守，但並非台灣法規公告的正式規定停藥期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_077","year":2015,"roc_year":104,"session":"1","examNo":77,"q":"動物dichlorvos中毒的解毒劑為何？","opts":["A. atropine與2-PAM","B. physostigmine","C. pilocarpine","D. neostigmine"],"ans":0,"exp":"Dichlorvos（二氯松，DDVP）是有機磷酸酯類（organophosphate）殺蟲劑，中毒機制為不可逆地磷酸化並抑制乙醯膽鹼酯酶（AChE），導致乙醯膽鹼（ACh）在突觸大量積聚。解毒劑包括：（1）Atropine——阻斷毒蕈鹼型受體（muscarinic receptors），緩解副交感神經過度興奮症狀（流涎、縮瞳、心搏過緩等）；（2）2-PAM（pralidoxime）——在磷酸化的 AChE 發生「老化（aging）」前儘早使用，使磷酸基從 AChE 上解離，重新活化 AChE。兩者合用可對抗有機磷中毒的毒蕈鹼及菸鹼兩類症狀。","we":["","錯誤：Physostigmine 本身是 AChE 抑制劑（抗膽鹼酯酶藥），會加重有機磷中毒的 ACh 積聚效應，使症狀惡化，絕對禁止用於有機磷中毒的解毒。","錯誤：Pilocarpine 是毒蕈鹼型膽鹼受體直接促效劑，使用後會增強副交感神經效應，加重有機磷中毒的腺體分泌增加、支氣管收縮等症狀，為有機磷中毒的禁忌藥物。","錯誤：Neostigmine 同為 AChE 抑制劑，與有機磷競爭抑制 AChE，但其本身亦抑制 AChE，在有機磷中毒時使用將進一步加重 ACh 積聚，不適合作為解毒劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_078","year":2015,"roc_year":104,"session":"1","examNo":78,"q":"動物因一氧化碳中毒時其血液顏色為何？","opts":["A. 櫻紅色","B. 深褐色","C. 深綠色","D. 藍紫色"],"ans":0,"exp":"一氧化碳（CO）中毒時，CO 與血紅素（hemoglobin，Hb）中的 Fe²⁺ 結合形成羧基血紅素（carboxyhemoglobin，COHb），其結合親和力約為 O₂ 的 250 倍。COHb 呈現鮮豔的櫻紅色（cherry red color），是 CO 中毒的特徵性病理所見，可在血液、黏膜及屍體皮膚等部位觀察到此特殊顏色，有重要的臨床診斷及法醫意義。","we":["","錯誤：深褐色血液是高鐵血紅素血症（methemoglobinemia）的特徵，由 Fe²⁺ 氧化為 Fe³⁺ 形成高鐵血紅素（methemoglobin）所致，常見於亞硝酸鹽、苯佐卡因等藥物中毒，而非 CO 中毒。","錯誤：深綠色血液並非常見的病理表現；膽綠素血症（bile pigment accumulation）可使組織呈綠色，但這不是 CO 中毒的表現。","錯誤：藍紫色（發紺，cyanosis）是缺氧時還原型血紅素（deoxyhemoglobin）增多的表現，見於呼吸衰竭、窒息等情況；CO 中毒時由於 COHb 本身呈紅色，患者外觀反而呈現異常的「紅潤」，而非藍紫色發紺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_079","year":2015,"roc_year":104,"session":"1","examNo":79,"q":"下列何者為β2腎上腺素性受體活化後之主要藥理作用？","opts":["A. 抑制腸道酵素之分泌","B. 膀胱括約肌收縮","C. 抑制脂肪之分解","D. 氣管平滑肌鬆弛"],"ans":3,"exp":"β₂ 腎上腺素性受體（β₂ adrenergic receptors）主要分布於支氣管平滑肌、子宮平滑肌、血管平滑肌及骨骼肌等處。β₂ 受體活化後，透過 Gs 蛋白增加細胞內 cAMP，活化蛋白激酶 A（PKA），使肌凝蛋白輕鏈激酶（MLCK）磷酸化並失活，導致平滑肌鬆弛（relaxation）；在支氣管平滑肌即表現為支氣管擴張（bronchodilation），是 β₂ 促效劑（如 salbutamol、clenbuterol）用於治療氣喘的藥理基礎。","we":["錯誤：抑制腸道酵素分泌屬於副交感神經抑制（M 受體拮抗）或 α₂ 受體效應，並非 β₂ 受體活化的主要藥理作用；β₂ 受體對腸道分泌的影響並非其主要作用。","錯誤：膀胱括約肌收縮（urethral sphincter contraction）是 α₁ 腎上腺素性受體活化的效應，不是 β₂ 受體的主要作用；β₂ 受體對膀胱的效應主要是逼尿肌鬆弛（尿液滯留）而非括約肌收縮。","錯誤：抑制脂肪分解的描述相反；β₂ 受體活化（以及 β₃ 受體）實際上會促進脂肪分解（lipolysis），增加游離脂肪酸釋放，而非抑制脂肪分解。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1041_080","year":2015,"roc_year":104,"session":"1","examNo":80,"q":"下列何者最適合皮下注射使用於治療膀胱平滑肌無力之尿滯留？","opts":["A. atropine","B. bethanechol","C. edrophonium","D. carbachol"],"ans":1,"exp":"Bethanechol（氯化貝坦膽鹼）是選擇性毒蕈鹼型（muscarinic）膽鹼受體直接促效劑，特別作用於 M₃ 受體，且僅具毒蕈鹼活性而無菸鹼性活性，因此副作用（如神經肌肉效應）較 carbachol 少。Bethanechol 刺激膀胱逼尿肌（detrusor muscle）收縮，同時不影響膀胱括約肌（括約肌 α₁ 受體），有效促進排尿，適用於治療因膀胱平滑肌張力不足（atonic bladder）引起的尿滯留。皮下注射（SC）為首選給藥途徑，可避免口服首渡效應並使效果更迅速可靠。","we":["錯誤：Atropine 是毒蕈鹼型受體拮抗劑（antimuscarinic），會抑制膀胱逼尿肌收縮，使尿滯留惡化，是治療尿滯留的禁忌藥物，而非適合使用的藥物。","","錯誤：Edrophonium 是短效的乙醯膽鹼酯酶抑制劑，主要用於診斷重症肌無力（Myasthenia gravis）的腾喜龍測試（Tensilon test），並非治療膀胱無力性尿滯留的首選藥物。","錯誤：Carbachol 雖同為膽鹼受體促效劑，但它同時具有毒蕈鹼性及菸鹼性活性，副作用（如神經肌肉興奮、血壓波動）較 bethanechol 多，且臨床主要用於眼科（縮瞳）及消化道刺激，並非治療尿滯留的首選藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_001","year":2015,"roc_year":104,"session":"2","examNo":1,"q":"肝臟細胞中參與大多數藥物生物轉換（biotransformation）的酵素主要分布的部位為何？","opts":["A. 粒線體","B. 高基氏體","C. 內質網","D. 細胞核"],"ans":2,"exp":"肝臟細胞中參與大多數藥物生物轉換（biotransformation）的酵素，尤其是細胞色素P450（CYP）酵素系統，主要分布於光面內質網（smooth endoplasmic reticulum, SER）的膜上。當肝臟組織以差速離心法處理時，這些酵素會集中於「微粒體（microsomal）」分液中，故亦稱為「微粒體酵素」。粒線體雖含有少數代謝酵素（如MAO），但並非大多數生物轉換酵素的主要所在。","we":["錯誤：粒線體（mitochondria）含有單胺氧化酶（MAO）等少量藥物代謝酵素，但CYP450等主要生物轉換酵素不分布於此，故並非「大多數」藥物生物轉換酵素的所在部位。","錯誤：高基氏體（Golgi apparatus）主要負責蛋白質的修飾、分類與分泌，不是藥物生物轉換酵素的主要分布部位。","","錯誤：細胞核（nucleus）含有DNA及轉錄相關酵素，不是CYP450等藥物代謝酵素的所在地，與藥物生物轉換無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_002","year":2015,"roc_year":104,"session":"2","examNo":2,"q":"利用藥物之AUCoral／AUCiv計算所得之結果為：","opts":["A. 藥物之生體可用率","B. 藥物之代謝速率","C. 藥物之吸收速率","D. 藥物之清除速率"],"ans":0,"exp":"生體可用率（bioavailability, F）定義為藥物經非靜脈途徑給藥後，到達全身循環的藥物量佔靜脈給藥量的比例。計算公式為：F = (AUCoral / AUCiv) × 100%，其中AUC（area under the curve）為血中濃度-時間曲線下面積，代表藥物的系統性暴露總量。靜脈注射的生體可用率定義為100%，作為基準值進行比較。","we":["","錯誤：代謝速率（metabolic rate）反映藥物被酵素分解的快慢，通常以清除率（clearance）或半衰期表示，無法由AUCoral/AUCiv的比值計算得到。","錯誤：吸收速率（absorption rate）反映藥物進入體循環的速度，以吸收速率常數（ka）或達峰時間（Tmax）來描述，不是AUCoral/AUCiv的計算結果。","錯誤：清除速率（elimination rate）由廓清率（clearance, CL）描述，計算公式為CL = 劑量/AUC，不是AUCoral/AUCiv的比值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_003","year":2015,"roc_year":104,"session":"2","examNo":3,"q":"以公式「藥物廓清率 × 血漿藥物濃度」可以得到：","opts":["A. 藥物生體可用率","B. 藥物排除速率","C. 肝臟提出率","D. 腎臟濾過速率"],"ans":1,"exp":"藥物廓清率（clearance, CL）的定義是：單位時間內，血漿（或血液）中藥物被完全清除的體積量（單位：mL/min或L/h）。由此定義可推導出：藥物排除速率（elimination rate）= CL × 血漿藥物濃度（Cp）。此公式說明在任一時間點，藥物從體內被清除的速率等於廓清率乘以當時的血漿藥物濃度。","we":["錯誤：生體可用率（bioavailability）為AUCoral/AUCiv×100%，與廓清率×血漿濃度的乘積無關；它描述的是藥物到達體循環的比例，而非排除速率。","","錯誤：肝臟提出率（hepatic extraction ratio, ER）為肝臟從血液中移除藥物的比例，計算公式為(Cin−Cout)/Cin，與廓清率×血漿濃度的乘積不同。","錯誤：腎臟濾過速率（renal filtration rate）即GFR×游離藥物濃度，僅代表腎臟絲球體過濾這一條排除途徑，而廓清率×血漿濃度代表所有途徑加總的總排除速率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_004","year":2015,"roc_year":104,"session":"2","examNo":4,"q":"單次投藥，若藥物之半衰期為6小時，則經過1天之後有多少百分比之藥物仍然留於體內？","opts":["A. 3.125","B. 6.25","C. 12.5","D. 25"],"ans":1,"exp":"藥物半衰期（t½）為6小時，1天（24小時）共經過24÷6 = 4個半衰期。每過一個半衰期，體內藥量減少一半，因此4個半衰期後體內剩餘比例為：(1/2)⁴ = 1/16 = 0.0625 = 6.25%。計算過程：初始量100% → 6h後50% → 12h後25% → 18h後12.5% → 24h後6.25%。","we":["錯誤：3.125% 對應5個半衰期後的殘餘量，即(1/2)⁵ = 1/32 ≈ 3.125%，但24小時÷6小時 = 4個半衰期，而非5個，故此答案計算了過多的半衰期數。","","錯誤：12.5% 對應3個半衰期後的殘餘量，即(1/2)³ = 1/8 = 12.5%，相當於僅過了18小時（3×6h），而非24小時（4個半衰期）。","錯誤：25% 對應2個半衰期後的殘餘量，即(1/2)² = 1/4 = 25%，相當於僅過了12小時（2×6h），不是1天（24小時）的計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_005","year":2015,"roc_year":104,"session":"2","examNo":5,"q":"下列何者是直腸給藥的優點？","opts":["A. 吸收速率穩定","B. 可投予大量的藥物","C. 吸收速率類似靜脈注射","D. 首渡效應（first-pass effect）低"],"ans":3,"exp":"直腸給藥（rectal route）的主要優點是首渡效應（first-pass effect）低。直腸下段靜脈血液經由直腸下靜脈（inferior rectal veins）匯入陰部內靜脈，再至髂內靜脈→下腔大靜脈，直接進入全身循環，不需經過門脈→肝臟的代謝途徑，因此可顯著降低肝臟首渡代謝，提高部分藥物的生體可用率。直腸給藥的吸收速率並不穩定，也無法投予大量藥物，吸收速率亦不及靜脈注射。","we":["錯誤：直腸給藥的吸收速率因藥物性質、直腸內容物、蠕動等因素而不穩定，並非吸收穩定為其特點。","錯誤：直腸容積有限，無法大量給藥，且大量藥物會刺激腸壁引起排便反射，不是直腸給藥的優點。","錯誤：直腸給藥的吸收速率無法與靜脈注射（IV）相比，IV為直接入血，吸收率100%且即時；直腸給藥仍需穿越黏膜屏障，速率較慢且不穩定。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_006","year":2015,"roc_year":104,"session":"2","examNo":6,"q":"生物體選擇、控制藥物吸收進入特定組織之過程，主要依賴之機制為何？","opts":["A. 藥物之擴散作用","B. 藥物之脂溶性","C. 專一性之運輸蛋白","D. 細胞之胞飲作用"],"ans":2,"exp":"生物體選擇性地將藥物吸收至特定組織的過程，主要依賴專一性的運輸蛋白（specific transport proteins）。這些膜上的轉運蛋白（transporters），如有機陰離子轉運蛋白（OAT）、有機陽離子轉運蛋白（OCT）、P-糖蛋白（P-gp）、葡萄糖轉運蛋白（GLUT）等，能辨識特定分子結構並進行選擇性主動運輸或促進性擴散，確保藥物被定向輸送至特定組織或細胞中。","we":["錯誤：擴散作用（diffusion）是非選擇性的被動過程，藥物依濃度梯度通過膜，無法賦予對「特定組織」的選擇性，不能解釋組織特異性吸收。","錯誤：脂溶性（lipid solubility）影響藥物穿越脂質雙層的能力，高脂溶性藥物可廣泛分布至全身脂肪組織，這是廣泛分布而非選擇性吸收，無法解釋特定組織的選擇性攝取。","","錯誤：胞飲作用（pinocytosis）可使細胞攝取胞外液及其中的溶質，但此機制並非選擇特定組織吸收藥物的主要機制，且胞飲作用本身的選擇性較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_007","year":2015,"roc_year":104,"session":"2","examNo":7,"q":"當一個藥物與血漿蛋白之結合高達98%時，若發生10%之競爭性取代作用，則其血中游離藥\r 物濃度約是原來的幾倍？","opts":["A. 8","B. 6","C. 4","D. 2"],"ans":1,"exp":"初始狀態：98%藥物與血漿蛋白結合，2%為游離型。設總藥量為100單位，則結合型=98，游離型=2。發生10%競爭性取代：10%的結合型藥物被取代 → 釋放量= 98×10% = 9.8單位。新的游離型濃度= 2（原游離）+ 9.8（釋放）= 11.8單位。游離型濃度倍數 = 11.8 ÷ 2 = 5.9 ≈ 6倍。因此血中游離藥物濃度約上升至原來的6倍，臨床上可能導致藥效增強或毒性風險。","we":["錯誤：8倍對應釋放量為14單位（游離=2+14=16，16/2=8），但10%×98=9.8，游離=11.8，倍數約為5.9≈6，不是8倍。","","錯誤：4倍對應游離型=8單位，但計算10%×98=9.8釋放後游離型=11.8，11.8/2≈6，不是4倍。","錯誤：2倍僅代表游離型從2增加至4，即釋放了2單位結合型，但10%×98=9.8，釋放量遠大於2單位，故倍數遠超過2倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_008","year":2015,"roc_year":104,"session":"2","examNo":8,"q":"關於fluoxetine的敘述，下列何者錯誤？","opts":["A. 在犬使用於治療優勢型攻擊、同品種內攻擊行為","B. 在貓使用於治療不適當的排尿及心因性禿毛症等","C. 經口投藥後吸收良好","D. 投予患有糖尿病的病畜是安全的"],"ans":3,"exp":"Fluoxetine（百憂解）是選擇性血清素再攝取抑制劑（SSRI），在獸醫臨床廣泛用於犬貓的行為異常治療。然而，fluoxetine對血糖代謝具有影響，會增加胰島素敏感性並可能導致低血糖（hypoglycemia），因此對患有糖尿病的動物並非安全用藥；使用時需密切監控血糖。選項A（犬攻擊行為）、B（貓不適當排尿及心因性禿毛）、C（口服吸收良好）均為fluoxetine的正確描述。","we":["此為正確描述：fluoxetine在犬確實用於治療優勢型攻擊（dominance aggression）及同品種內攻擊行為（inter-dog aggression），不符合題目問的「錯誤」描述。","此為正確描述：fluoxetine在貓確實用於治療不適當排尿（inappropriate elimination）及心因性禿毛（psychogenic alopecia），不符合題目問的「錯誤」描述。","此為正確描述：fluoxetine經口投藥後在犬貓的生體可用率良好，吸收率高，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_104
