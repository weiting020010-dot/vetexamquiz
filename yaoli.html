2_009","year":2015,"roc_year":104,"session":"2","examNo":9,"q":"關於isoflurane的敘述，下列何者錯誤？","opts":["A. 具有一特定刺激性味道的無色液體，是一個穩定的化合物","B. 血液／氣體分配係數較methoxyflurane為高","C. 可快速地誘導麻醉、改變病畜的麻醉深度和恢復","D. 可使用於有肝、腎疾病之動物的麻醉"],"ans":1,"exp":"Isoflurane（異氟烷）的血液/氣體分配係數（blood/gas partition coefficient）約為1.4，屬於低溶解度吸入麻醉劑。Methoxyflurane（甲氧氟烷）的血液/氣體分配係數約為12～14，屬於高溶解度。因此isoflurane的血液/氣體分配係數遠低於（而非高於）methoxyflurane。正因為isoflurane溶解度低，血液中達到飽和所需的藥物量少，麻醉誘導和恢復都較methoxyflurane迅速快速，麻醉深度也更容易快速調控。","we":["此為正確描述：isoflurane確實具有輕微刺激性氣味，為無色液體且化學性質穩定（不需添加防腐劑），不符合題目問的「錯誤」描述。","","此為正確描述：isoflurane因血液溶解度低（係數1.4），可快速誘導麻醉、迅速改變麻醉深度並快速恢復，不符合題目問的「錯誤」描述。","此為正確描述：isoflurane主要以原型經肺臟排出，極少量（<0.2%）被肝臟代謝，對肝腎功能影響極小，故適用於有肝腎疾病的動物，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_010","year":2015,"roc_year":104,"session":"2","examNo":10,"q":"關於thiopental的敘述，下列何者錯誤？","opts":["A. 具高脂溶性且作用時間短","B. 主要以快速靜脈注射投予犬、貓","C. 可以和guaifenesin合併給藥","D. 不可用於剖腹產的麻醉誘導"],"ans":3,"exp":"Thiopental（硫噴妥鈉）為超短效巴比妥酸鹽類靜脈麻醉劑，具高脂溶性，可快速穿越胎盤屏障進入胎兒血液循環，可能對新生兒產生抑制作用。然而臨床上thiopental仍可用於剖腹產的麻醉誘導，只要劑量適當、術後立即供給新生兒呼吸輔助，其臨床應用是被允許的。「不可用於剖腹產麻醉誘導」的描述是錯誤的。選項A（高脂溶性、作用時間短）、B（快速靜脈注射）、C（可與guaifenesin合用）均為正確描述。","we":["此為正確描述：thiopental確實具有高脂溶性（高度脂溶性是其快速起效的原因），且因藥物快速再分布至肌肉和脂肪組織，作用時間短暫，不符合題目問的「錯誤」描述。","此為正確描述：thiopental在犬貓確實主要以快速靜脈注射（IV bolus）方式投予，以達到快速麻醉誘導，不符合題目問的「錯誤」描述。","此為正確描述：thiopental可與guaifenesin（肌肉鬆弛劑）合併使用，常用於大動物的麻醉誘導，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_011","year":2015,"roc_year":104,"session":"2","examNo":11,"q":"下列注射性麻醉劑中，何者對心臟血管系統的抑制作用最弱？","opts":["A. xylazine","B. thiopental","C. pentobarbital","D. etomidate"],"ans":3,"exp":"Etomidate（依托咪酯）是咪唑類靜脈麻醉劑，其最大特點是對心臟血管系統的抑制作用極弱，不會明顯降低心輸出量、心率或血壓，是對心血管功能影響最小的注射性麻醉劑。因此特別適用於心臟病動物的麻醉誘導。相較之下，xylazine會顯著抑制心臟並引起心搏徐緩，thiopental和pentobarbital均有明顯的心臟血管抑制作用。","we":["錯誤：xylazine為α2-腎上腺素受體促效劑，會引起明顯的心搏徐緩（bradycardia）、心輸出量下降及血壓改變，對心臟血管系統的抑制作用相當顯著，並非抑制作用最弱的麻醉劑。","錯誤：thiopental（硫噴妥鈉）為巴比妥酸鹽類，在麻醉誘導劑量下會抑制心肌收縮力、降低心輸出量和血壓，對心臟血管系統有明顯的抑制作用。","錯誤：pentobarbital為長效巴比妥酸鹽，對心臟血管系統及呼吸系統均有顯著的劑量依賴性抑制作用，並非抑制作用最弱的注射性麻醉劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_012","year":2015,"roc_year":104,"session":"2","examNo":12,"q":"吸入性麻醉劑快速改變麻醉深度的主要條件為何？","opts":["A. 生物轉換速率高","B. 血液中的溶解度低","C. 快速進行脂肪之重分布","D. 沸點需要低"],"ans":1,"exp":"吸入性麻醉劑快速改變麻醉深度的主要條件是血液中的溶解度低（低血液/氣體分配係數）。血液溶解度低的藥物，在血液中達到飽和所需的溶解量少，肺泡分壓能迅速反映吸入濃度的改變，大腦中的藥物濃度能迅速上升或下降，因此麻醉的誘導、調整與恢復均較快速。例如isoflurane（係數1.4）和sevoflurane（係數0.69）比halothane（係數2.4）和methoxyflurane（係數12~14）更快速調整麻醉深度。","we":["錯誤：生物轉換速率高意味著藥物在體內被代謝分解的比例較大，這影響藥物的消除途徑，但並非快速改變麻醉深度的關鍵因素；麻醉深度主要由吸入濃度和血液溶解度決定。","","錯誤：脂肪重分布速率影響的是藥物在脂肪組織中的蓄積與釋放，與長時間麻醉後的恢復有部分關係，但並非決定麻醉深度能否快速改變的主要條件。","錯誤：沸點低使麻醉劑在室溫下容易揮發，便於透過蒸發器給藥，但並非決定麻醉深度能否快速調控的關鍵；決定調控速度的是血液溶解度，而非沸點高低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_013","year":2015,"roc_year":104,"session":"2","examNo":13,"q":"下列藥物，何者臨床上可作為morphine之解毒劑？","opts":["A. butorphanol","B. naloxone","C. buprenorphine","D. nalbuphine"],"ans":1,"exp":"Naloxone（納洛酮）是純粹的阿片受體拮抗劑（pure opioid antagonist），對μ、κ、δ受體均無內在活性（intrinsic activity），能競爭性拮抗阿片類藥物的所有受體位點，可完全逆轉morphine引起的鎮靜、呼吸抑制、鎮痛等作用，因此是morphine及其他純阿片激動劑的標準解毒劑。Butorphanol和nalbuphine為混合型激動-拮抗劑，buprenorphine為部分激動劑，三者均無法完全拮抗morphine的效果，不能作為解毒劑。","we":["錯誤：butorphanol為混合型阿片激動-拮抗劑，對κ受體具有激動活性、對μ受體具有部分拮抗活性，並非純拮抗劑，無法完全逆轉morphine的所有作用，不能作為morphine的解毒劑。","","錯誤：buprenorphine為高親和力的μ受體部分激動劑，其與μ受體的結合牢固且難以被naloxone取代，不但無法作為morphine解毒劑，本身還難以被拮抗，不適合作為解毒用途。","錯誤：nalbuphine為混合型激動-拮抗劑，對κ受體有激動活性、對μ受體有拮抗活性，不是純受體拮抗劑，無法完全逆轉morphine（純μ激動劑）的所有藥理效應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_014","year":2015,"roc_year":104,"session":"2","examNo":14,"q":"臨床上azaperone主要做為下列何種動物之鎮靜安神及防止其攻擊互鬥行為之用？","opts":["A. 牛","B. 犬","C. 貓","D. 豬"],"ans":3,"exp":"Azaperone（氮哌酮）是丁酰苯類（butyrophenone）抗精神病藥，在獸醫臨床上主要用於豬（swine）的鎮靜安神，以及預防混群時豬隻之間的攻擊與互鬥行為。此藥可降低豬的攻擊性、緊張焦慮和應激反應，特別適用於運輸前鎮靜及混合豬群時使用。Azaperone也可用於大動物（馬），但防止豬攻擊互鬥是其最主要的臨床適應症。","we":["錯誤：azaperone雖偶用於牛的某些情況，但其最主要且最廣為人知的臨床用途是用於豬，用於牛並非此藥的主要適應症。","錯誤：犬的鎮靜安神有多種適合的藥物可選用（如acepromazine、medetomidine等），azaperone並非用於犬的常規鎮靜藥，不是其主要適應症。","錯誤：貓的鎮靜通常使用其他藥物（如medetomidine、ketamine組合），azaperone並非貓的適用鎮靜劑，其主要臨床對象為豬。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_015","year":2015,"roc_year":104,"session":"2","examNo":15,"q":"屬於持續性去極化的肌肉鬆弛劑是：","opts":["A. succinylcholine","B. d-tubocurarine","C. hemicholinium","D. tetrodotoxin"],"ans":0,"exp":"Succinylcholine（琥珀膽鹼，又稱suxamethonium）是唯一常用的去極化型（depolarizing）神經肌肉阻斷劑。其作用機制為模擬乙醯膽鹼（ACh）結合於神經肌肉接合處的菸鹼型受體（nAChR），引起持續性去極化（持續性肌肉收縮後鬆弛），且不被乙醯膽鹼酯酶（AChE）迅速分解。d-Tubocurarine（筒箭毒鹼）為競爭性（非去極化）阻斷劑；hemicholinium和tetrodotoxin機制各異，均非去極化型NMJ阻斷劑。","we":["","錯誤：d-tubocurarine（筒箭毒鹼）為競爭性非去極化型神經肌肉阻斷劑，它競爭性阻斷nAChR而不引起去極化，肌肉鬆弛前不會出現肌纖維顫動，與succinylcholine的去極化機制不同。","錯誤：hemicholinium（半膽鹼）的作用是抑制乙醯膽鹼的再合成（阻斷膽鹼的回收），使ACh逐漸耗竭而引起肌肉無力，並非直接的去極化型阻斷劑。","錯誤：tetrodotoxin（河豚毒素）是鈉離子通道阻斷劑，阻止神經動作電位的產生和傳導，造成神經傳導阻斷和肌肉癱瘓，機制上並非去極化型NMJ阻斷劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_016","year":2015,"roc_year":104,"session":"2","examNo":16,"q":"Yohimbine、atipamezole與detomidine，何者可用於拮抗xylazine的藥效？","opts":["A. yohimbine與atipamezole","B. yohimbine與detomidine","C. atipamezole與detomidine","D. 僅yohimbine具拮抗作用"],"ans":0,"exp":"Yohimbine（育亨賓）和atipamezole（阿替帕美唑）均為α2-腎上腺素受體拮抗劑（α2-adrenergic antagonists），可競爭性拮抗α2受體，從而逆轉xylazine（甲苯噻嗪，α2促效劑）的鎮靜、鎮痛和肌肉鬆弛效果。Detomidine（得托咪定）與xylazine同屬α2-腎上腺素受體促效劑（agonist），作用方向相同，無法用來拮抗xylazine，反而會加強其效果。","we":["","錯誤：yohimbine確為α2拮抗劑可拮抗xylazine，但detomidine為α2促效劑（與xylazine同類），不具有拮抗α2受體的作用，無法逆轉xylazine的效果，兩者不是正確的組合。","錯誤：atipamezole確為α2拮抗劑可拮抗xylazine，但detomidine為α2促效劑，與xylazine有相同的作用方向，不能拮抗xylazine，故此組合不正確。","錯誤：yohimbine確實具有拮抗xylazine的作用，但atipamezole同樣是α2拮抗劑，也可以有效拮抗xylazine；「僅yohimbine具拮抗作用」的敘述忽略了atipamezole，是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_017","year":2015,"roc_year":104,"session":"2","examNo":17,"q":"下列何者為diltiazem抗心律不整之主要作用機制？","opts":["A. 延長心肌動作電位","B. 阻斷Ca++離子通道","C. 阻斷Na+離子通道","D. 關閉K\r +離子通道"],"ans":1,"exp":"Diltiazem（地爾硫卓）是第四類抗心律不整藥（Class IV antiarrhythmic），屬於鈣離子通道阻斷劑（calcium channel blocker, CCB），其主要作用機制為阻斷心肌及血管平滑肌的L型鈣離子通道（L-type Ca²⁺ channels）。此作用可減慢竇房結（SA node）的自動去極化速率及房室結（AV node）的傳導，從而控制心房顫動、心房撲動及陣發性心室上速等心律不整。","we":["錯誤：「延長心肌動作電位」是第三類抗心律不整藥（Class III，如amiodarone、sotalol）的作用機制，主要透過阻斷鉀離子通道延長復極化，而非diltiazem的機制。","","錯誤：「阻斷Na⁺離子通道」是第一類抗心律不整藥（Class I，如lidocaine、procainamide、quinidine）的作用機制，可穩定心肌細胞膜電位，但這不是diltiazem的主要機制。","錯誤：「關閉K⁺離子通道」同樣是第三類抗心律不整藥的特徵，透過延遲整流性鉀電流（IKr）阻斷延長QT間期；diltiazem的靶點是Ca²⁺通道，而非K⁺通道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_018","year":2015,"roc_year":104,"session":"2","examNo":18,"q":"下列何者為作用於遠端彎曲腎小管之保鉀型利尿劑（K\r +\r sparing diuretics）？","opts":["A. acetazolamide","B. furosemide","C. hydrochlorothiazide","D. spironolactone"],"ans":3,"exp":"Spironolactone（螺內酯）是醛固酮（aldosterone）競爭性拮抗劑，作用於腎臟遠端彎曲小管（distal convoluted tubule）和集尿管（collecting duct）的礦物質皮質素受體，抑制醛固酮促進鈉重吸收和鉀排泌的作用，從而達到保鉀排鈉（K⁺-sparing）的利尿效果。其餘選項均非保鉀型利尿劑：acetazolamide作用於近端小管，furosemide作用於亨利氏環，hydrochlorothiazide作用於遠端小管前段。","we":["錯誤：acetazolamide（乙醯唑胺）是碳酸酐酶抑制劑，作用於近端腎小管，抑制HCO₃⁻的重吸收而利尿，同時會增加鉀的排泌，屬於排鉀型利尿劑，而非保鉀型。","錯誤：furosemide（速尿）是強效袢利尿劑，作用於亨利氏環（Henle's loop）升支粗段，阻斷Na⁺-K⁺-2Cl⁻共同轉運蛋白，同時也會增加鉀的排泌，為排鉀型利尿劑。","錯誤：hydrochlorothiazide（氫氯噻嗪）是噻嗪類利尿劑，作用於遠端彎曲小管前段，抑制Na⁺-Cl⁻共同轉運蛋白，也會增加鉀的排泌，屬於排鉀型利尿劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_019","year":2015,"roc_year":104,"session":"2","examNo":19,"q":"下列有關phenytoin的敘述，何者錯誤？","opts":["A. 具有抗癲癇作用","B. 對於digitalis所誘發的心律不整無療效","C. 具有肝臟酵素誘導作用","D. 經口投藥時生體可用率差"],"ans":1,"exp":"Phenytoin（苯妥英）在心臟藥理上具有類似第Ib類抗心律不整藥的作用，能穩定心肌細胞膜、縮短動作電位時期、改善傳導阻斷，臨床上對digitalis（洋地黃）所誘發的心律不整（特別是室性心搏過速）具有療效，是digitalis中毒所致心律不整的重要治療選擇之一。因此「對digitalis所誘發的心律不整無療效」是錯誤的描述。","we":["此為正確描述：phenytoin確實具有抗癲癇（anticonvulsant）作用，可穩定神經細胞膜、抑制癲癇放電的傳播，是常用抗癲癇藥物，不符合題目問的「錯誤」描述。","","此為正確描述：phenytoin確實具有誘導肝臟CYP450酵素（尤其是CYP2C和CYP3A）的作用，可加速多種藥物的代謝，是重要的藥物交互作用來源，不符合題目問的「錯誤」描述。","此為正確描述：phenytoin在犬貓經口投藥時，生體可用率確實較差（吸收不穩定、首渡代謝影響），這是其臨床使用的限制之一，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_020","year":2015,"roc_year":104,"session":"2","examNo":20,"q":"Dalteparin sodium要產生抗凝血作用必須先與下列何者結合？","opts":["A. prothrombin","B. antithrombin III","C. 凝血因子Xa","D. vitamin K"],"ans":1,"exp":"Dalteparin sodium（達肝素）是低分子量肝素（LMWH，low molecular weight heparin），其抗凝血機制必須先與抗凝血酶III（antithrombin III, ATIII）結合，形成肝素-ATIII複合物。此複合物能加速ATIII對凝血因子Xa（以及部分IIa/凝血酶）的抑制作用，從而發揮強效抗凝血效果。LMWH相比普通肝素（UFH），對Xa的抑制作用更為選擇性，對IIa的抑制較弱。","we":["錯誤：prothrombin（凝血酶原）是凝血因子II，被凝血酶原酶複合物活化為凝血酶（thrombin）；dalteparin並不直接與prothrombin結合，其作用是透過增強ATIII活性來間接抑制凝血因子，而非直接結合prothrombin。","","錯誤：dalteparin的作用目標是透過抗凝血酶III來抑制凝血因子Xa，而非直接與Xa結合；必須先與ATIII形成複合物，再由複合物去抑制Xa，所以「直接與凝血因子Xa結合」的敘述不正確。","錯誤：vitamin K（維生素K）是維生素K依賴性凝血因子（II、VII、IX、X）的合成所必需的輔酶；warfarin等抗凝血劑透過拮抗維生素K發揮作用，但dalteparin（LMWH）的機制是增強ATIII，與維生素K無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_021","year":2015,"roc_year":104,"session":"2","examNo":21,"q":"下列利尿劑中，何者最可能導致脫水的副作用？","opts":["A. acetazolamide","B. amiloride","C. mannitol","D. spironolactone"],"ans":2,"exp":"Mannitol（甘露醇）是滲透性利尿劑（osmotic diuretic），其特殊之處在於：靜脈注射後，mannitol本身不能被腎小管重吸收，會大量保留水分在腎小管管腔中，導致大量水分經尿液排出（強效利尿）。此外，mannitol在給藥初期會因為滲透壓升高而將組織間液中的水分吸入血管中，短暫增加循環血量，但隨後大量水分隨尿液排出，若未及時補充水分，最容易導致嚴重脫水的副作用。其他利尿劑（acetazolamide、amiloride、spironolactone）的利尿強度或機制均不如mannitol。","we":["錯誤：acetazolamide是碳酸酐酶抑制劑，利尿效果相對溫和，主要作用於近端腎小管，不會造成如mannitol那樣大量急劇的水分流失，引起脫水的風險較低。","錯誤：amiloride是保鉀型利尿劑，作用於集尿管的上皮鈉通道（ENaC），利尿效果較弱，保水效果反而因鈉排泌減少而相對適中，不是最容易導致脫水的利尿劑。","","錯誤：spironolactone為醛固酮拮抗劑，屬保鉀型利尿劑，利尿效果溫和且以保鉀保水為特點，導致嚴重脫水的風險在此選項中最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_022","year":2015,"roc_year":104,"session":"2","examNo":22,"q":"下列何者為 nitroglycerine 血管平滑肌擴張的主要機制？","opts":["A. 阻斷Ca++進入細胞內","B. 抑制phosphodiesterase","C. 抑制kinase II","D. 增加細胞內NO含量"],"ans":3,"exp":"Nitroglycerin（硝化甘油）屬於有機硝酸酯類血管擴張藥，其血管平滑肌擴張的主要機制為：nitroglycerin在體內（尤其在血管壁）自發性分解，釋放一氧化氮（NO，nitric oxide）。NO活化可溶性鳥苷酸環化酶（soluble guanylate cyclase, sGC），催化GTP轉化為環磷酸鳥苷（cGMP）。cGMP進一步活化蛋白激酶G（PKG），導致肌球蛋白輕鏈去磷酸化，血管平滑肌鬆弛擴張，從而降低前負荷和後負荷。","we":["錯誤：阻斷Ca²⁺進入細胞是鈣離子通道阻斷劑（CCB，如diltiazem、verapamil、nifedipine）的作用機制，這類藥物不釋放NO；nitroglycerin的擴血管機制是透過釋放NO增加cGMP，而非直接阻斷Ca²⁺通道。","錯誤：抑制磷酸二酯酶（PDE）是sildenafil（威而鋼）等PDE-5抑制劑的機制，可使cGMP不被分解而延長擴血管效果；nitroglycerin是促進cGMP生成（透過NO→鳥苷酸環化酶），而非抑制cGMP分解。","錯誤：「抑制kinase II」並非nitroglycerin的已知作用機制；angiotensin-converting enzyme（ACE，又稱kininase II）的抑制是ACEI類藥物的機制，與nitroglycerin的作用無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_023","year":2015,"roc_year":104,"session":"2","examNo":23,"q":"下列何者不是造成呼吸性酸中毒之原因？","opts":["A. 肺水腫","B. morphine中毒","C. barbiturate中毒","D. 換氣過度"],"ans":3,"exp":"呼吸性酸中毒（respiratory acidosis）是由於肺泡通氣不足，導致CO₂在體內蓄積（PaCO₂升高），進而使pH值下降。肺水腫（pulmonary edema）阻礙氣體交換、morphine中毒抑制呼吸中樞、barbiturate中毒抑制呼吸均會導致通氣不足→CO₂滯留→呼吸性酸中毒。相反，換氣過度（hyperventilation）會大量排出CO₂，使PaCO₂下降，pH值升高，造成呼吸性鹼中毒（respiratory alkalosis），而非酸中毒，因此換氣過度「不是」造成呼吸性酸中毒的原因。","we":["此為正確描述：肺水腫會使肺泡氣體交換受阻，O₂攝取減少且CO₂排出障礙，導致PaCO₂升高、pH下降，造成呼吸性酸中毒，不符合題目問的「不是呼吸性酸中毒原因」的描述。","此為正確描述：morphine中毒會抑制延髓呼吸中樞，引起呼吸速率和潮氣量下降（呼吸抑制），CO₂瀦留→PaCO₂升高→呼吸性酸中毒，不符合題目問的「不是」描述。","此為正確描述：barbiturate（巴比妥酸鹽）中毒同樣會強烈抑制呼吸中樞，引起通氣不足，使CO₂蓄積，導致呼吸性酸中毒，不符合題目問的「不是」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_024","year":2015,"roc_year":104,"session":"2","examNo":24,"q":"下列何者會惡化代謝性酸血症？","opts":["A. ammonium chloride","B. sodium bicarbonate","C. sodium lactate","D. potassium acetate"],"ans":0,"exp":"Ammonium chloride（氯化銨，NH₄Cl）在肝臟代謝後，NH₄⁺被轉化為尿素（urea）和H⁺，所釋放的H⁺使細胞外液氫離子濃度上升，pH值下降，從而惡化（加重）代謝性酸血症（metabolic acidosis）。此外，Cl⁻的存在也可造成高氯性酸中毒。Sodium bicarbonate（碳酸氫鈉）、sodium lactate（乳酸鈉，代謝後產生HCO₃⁻）、potassium acetate（醋酸鉀，代謝後產生HCO₃⁻）均為鹼化劑，用於治療代謝性酸血症，而非惡化。","we":["","錯誤：sodium bicarbonate（碳酸氫鈉，NaHCO₃）為鹼性液體，直接提供HCO₃⁻，是治療代謝性酸血症最常用的藥物，會提高pH值，改善而非惡化酸血症。","錯誤：sodium lactate（乳酸鈉）在肝臟代謝後生成碳酸氫根（HCO₃⁻），具有鹼化作用，常用於林格氏乳酸液（Lactated Ringer's solution）中，可改善代謝性酸血症。","錯誤：potassium acetate（醋酸鉀）中的醋酸根（CH₃COO⁻）在體內代謝後生成HCO₃⁻，具有鹼化效果，臨床上用於補充鉀離子同時提供鹼化作用，不會惡化酸血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_025","year":2015,"roc_year":104,"session":"2","examNo":25,"q":"何者為enalapril擴張血管的主要作用機制？","opts":["A. 抑制renin的生成","B. 競爭angiotensin II的受體","C. 降低bradykinin的生成","D. 抑制angiotensin-converting enzyme"],"ans":3,"exp":"Enalapril（依那普利）是血管緊張素轉化酶抑制劑（ACE inhibitor, ACEI），其擴張血管的主要作用機制為抑制血管緊張素轉化酶（ACE/kininase II），阻止血管緊張素I（Angiotensin I）轉化為血管緊張素II（Angiotensin II，強效血管收縮物質）。Ang II減少→血管舒張、醛固酮分泌減少→降低血壓。此外，ACE也降解緩激肽（bradykinin），ACEI抑制ACE後，bradykinin濃度升高，進一步促進血管擴張（但bradykinin增加是副作用如乾咳的原因，非主要擴血管機制）。","we":["錯誤：抑制renin（腎素）的生成是腎素抑制劑（如aliskiren）的作用機制；ACEI作用在renin-angiotensin系統的下游（ACE步驟），而非直接抑制renin的產生。","錯誤：競爭angiotensin II受體（AT₁受體）是血管緊張素受體拮抗劑（ARB，如losartan、valsartan）的機制；enalapril（ACEI）是阻止Ang II的生成，而非阻斷Ang II與其受體的結合。","錯誤：enalapril抑制ACE後，bradykinin的分解受阻，導致bradykinin濃度升高（而非降低）；bradykinin增加是ACEI引起乾咳副作用的原因，且bradykinin有擴血管作用，故「降低bradykinin生成」描述錯誤。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_026","year":2015,"roc_year":104,"session":"2","examNo":26,"q":"下列何者可改變瘤胃內氣泡的表面張力而緩解瘤胃臌脹？","opts":["A. neostigmine","B. cisapride","C. dimetridazole","D. poloxalene"],"ans":3,"exp":"Poloxalene（泊洛沙姆）是一種非離子型界面活性劑（surfactant/detergent），用於緩解牛的泡沫性瘤胃臌脹（frothy bloat）。其作用機制是降低瘤胃內泡沫性氣泡的表面張力（surface tension），使小氣泡融合成大氣泡，破壞穩定泡沫的結構，讓積聚的氣體能夠自由釋放（打嗝排出）。Poloxalene通常以預防性方式添加於飼料或飲水中使用，也可用於急性泡沫性臌脹的治療。","we":["錯誤：neostigmine為膽鹼酯酶抑制劑，可增強胃腸蠕動（促進腸道運動），臨床上用於治療非泡沫性（游離氣體型）瘤胃臌脹或腸弛緩，不能降低泡沫表面張力，不適用於泡沫性臌脹。","錯誤：cisapride為促胃腸蠕動藥（prokinetic），可增加胃排空及腸道蠕動，用於胃食道逆流等腸胃動力問題；它並非界面活性劑，對瘤胃泡沫的表面張力無直接作用。","錯誤：dimetridazole為硝基咪唑類抗原蟲藥，用於治療原蟲感染（如組織滴蟲病），與瘤胃臌脹的治療完全無關，不影響瘤胃氣泡的表面張力。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_027","year":2015,"roc_year":104,"session":"2","examNo":27,"q":"Maropitant的作用機制主要為拮抗下列何種受體？","opts":["A. histamine","B. dopamine","C. serotonin","D. neurokinin"],"ans":3,"exp":"Maropitant（馬羅皮坦，商品名Cerenia®）是NK1（neurokinin-1）受體拮抗劑，也稱為物質P（substance P）受體拮抗劑。其作用機制是阻斷物質P與嘔吐中樞（孤束核及延髓嘔吐反射弧）和腸道中NK1受體的結合，從而廣泛地抑制由多種刺激（包括化療、運動病、嘔吐誘導劑）所引起的嘔吐反射。Maropitant是目前獸醫臨床廣泛使用的廣效型止吐藥。","we":["錯誤：拮抗histamine（組織胺）受體是抗組織胺類止吐藥（H1拮抗劑，如diphenhydramine）的機制，主要用於動暈病（motion sickness）引起的嘔吐；maropitant的靶受體是NK1，而非histamine受體。","錯誤：拮抗dopamine（多巴胺）受體是典型抗精神病藥（如chlorpromazine）及胃腸促動力藥（如metoclopramide）的止吐機制，主要阻斷觸發區（CTZ）的D₂受體；maropitant的機制不同，靶點為NK1受體。","錯誤：拮抗serotonin（血清素，5-HT₃）受體是ondansetron等藥物的機制，主要用於化學治療引起的嘔吐；maropitant的主要靶受體是NK1（substance P受體），而非5-HT₃受體。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_028","year":2015,"roc_year":104,"session":"2","examNo":28,"q":"下列何者為抗組織胺，可控制因動暈病（motion sickness）而導致的嘔吐症狀？","opts":["A. ranitidine","B. diphenhydramine","C. chlorpromazine","D. scopolamine"],"ans":1,"exp":"Diphenhydramine（苯海拉明）是H1組織胺受體拮抗劑（H1 antihistamine），同時具有明顯的抗膽鹼性質（anticholinergic properties），能抑制前庭器官（vestibular apparatus）至嘔吐中樞的神經衝動傳遞，因此對動暈病（motion sickness，又稱暈車/暈船）引起的嘔吐具有良好控制效果。在四個選項中，diphenhydramine為抗組織胺藥且可控制動暈病嘔吐的正確組合。Ranitidine為H2拮抗劑（抑制胃酸），chlorpromazine為多巴胺拮抗劑，scopolamine為抗膽鹼藥（非抗組織胺）。","we":["錯誤：ranitidine（雷尼替丁）是H2受體拮抗劑，作用於胃壁細胞的H2受體以抑制胃酸分泌，用於消化性潰瘍和胃炎；它是抗H2而非H1藥物，無法控制動暈病引起的嘔吐。","","錯誤：chlorpromazine（氯丙嗪）為吩噻嗪類抗精神病藥，具有D₂多巴胺受體拮抗作用（抑制嘔吐觸發區），可止吐，但其並非抗組織胺藥，不是題目要求「抗組織胺且控制動暈病嘔吐」的正確選項。","錯誤：scopolamine（東莨菪鹼）雖然對動暈病引起的嘔吐有效（透過抗膽鹼機制抑制前庭刺激），但它是抗膽鹼藥（muscarinic antagonist），而非抗組織胺（antihistamine），不符合題目「抗組織胺」的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_029","year":2015,"roc_year":104,"session":"2","examNo":29,"q":"下列何者作用於胃壁細胞（parietal cell）的H\r +\r , K+\r -ATPase，抑制胃酸分泌？","opts":["A. famotidine","B. omeprazole","C. aminopentamide","D. nizatidine"],"ans":1,"exp":"Omeprazole（奧美拉唑）是質子泵抑制劑（PPI，proton pump inhibitor），作用於胃壁細胞（parietal cell）中的H⁺/K⁺-ATPase（質子泵）。Omeprazole為前驅藥物（prodrug），需在胃壁細胞的酸性分泌小管中被活化為亞磺醯胺（sulfenamide）活性代謝物，後者與H⁺/K⁺-ATPase的半胱胺酸（cysteine）殘基形成不可逆的共價結合，持久地抑制胃酸分泌，是目前最強效的抑酸藥物之一。","we":["錯誤：famotidine（法莫替丁）是H2受體拮抗劑（H2 blocker），作用於胃壁細胞上的組織胺H2受體，競爭性阻斷組織胺誘發的胃酸分泌；其靶點是H2受體，而非H⁺/K⁺-ATPase。","","錯誤：aminopentamide（氨基戊醯胺）是抗膽鹼藥（anticholinergic），阻斷M受體，主要用於止吐、減少腸胃蠕動和分泌，其靶點為蕈毒鹼受體，不作用於H⁺/K⁺-ATPase。","錯誤：nizatidine（尼扎替丁）與famotidine同屬H2受體拮抗劑，作用於H2受體抑制組織胺刺激的胃酸分泌，靶點為H2受體而非H⁺/K⁺-ATPase（質子泵）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_030","year":2015,"roc_year":104,"session":"2","examNo":30,"q":"下列維生素與缺乏症之配對，何者錯誤？","opts":["A. 維生素A－夜盲症","B. 維生素C－黑舌病","C. 維生素D－佝僂病","D. 維生素E－白肌病"],"ans":1,"exp":"各維生素缺乏症的對應關係：維生素A缺乏→夜盲症（night blindness）；維生素D缺乏→佝僂病（rickets）；維生素E缺乏→白肌病（white muscle disease）；維生素C缺乏→壞血病（scurvy，壞血症），而非黑舌病（blacktongue）。黑舌病是菸鹼酸（niacin，維生素B3）缺乏在犬身上的典型表現，特徵為口腔黏膜發黑、潰瘍。因此「維生素C－黑舌病」的配對是錯誤的。","we":["此為正確描述：維生素A（視黃醇，retinol）缺乏確實導致視紫質（rhodopsin）合成不足，引起夜間視力障礙（夜盲症），不符合題目問的「錯誤」描述。","","此為正確描述：維生素D缺乏使腸道鈣磷吸收不足，幼年動物發生骨骼軟化與變形，即佝僂病（rickets）；成年動物則發生軟骨病（osteomalacia），不符合題目問的「錯誤」描述。","此為正確描述：維生素E（生育酚，tocopherol）缺乏會導致肌肉氧化損傷，引起白肌病（white muscle disease，又稱營養性肌肉萎縮症），特別常見於牛羊等反芻動物，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_031","year":2015,"roc_year":104,"session":"2","examNo":31,"q":"下列何者會促進鈣與磷的再吸收？","opts":["A. calcitriol","B. calcitonin","C. vitamine C","D. vitamine A"],"ans":0,"exp":"Calcitriol（骨化三醇）即1,25-二羥基維生素D₃（1,25-dihydroxycholecalciferol），是維生素D的活化形式，由腎臟1α-羥化酶將25-OH-D₃轉化而來。Calcitriol是鈣磷代謝的主要調節激素之一，其作用包括：①促進小腸黏膜對鈣（Ca²⁺）和磷（PO₄³⁻）的吸收（增加腸道鈣結合蛋白calbindin的合成）；②促進腎小管對鈣和磷的重吸收；③與副甲狀腺素（PTH）協同作用，動員骨鈣釋放。兩者合計使血鈣和血磷濃度升高。","we":["","錯誤：calcitonin（降鈣素）是由甲狀腺C細胞分泌的激素，其作用是在血鈣過高時抑制骨骼的鈣釋放（抑制破骨細胞活性）並促進腎臟排泌鈣，起到降低血鈣的效果，與促進鈣磷再吸收的作用相反。","錯誤：vitamin C（抗壞血酸）主要參與膠原蛋白合成、免疫功能和抗氧化，對鈣磷的腸道吸收或腎臟重吸收無直接促進作用，與calcitriol的鈣磷代謝調節機制無關。","錯誤：vitamin A（視黃醇）主要參與視覺、細胞增殖分化和免疫功能，並非鈣磷代謝的主要調節因子，不能促進腸道和腎臟對鈣磷的再吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_032","year":2015,"roc_year":104,"session":"2","examNo":32,"q":"用於治療抗原所引起之支氣管炎，且能降低支氣管黏液的過度分泌與黏膜增厚，進而減輕支\r 氣管平滑肌收縮的藥物是：","opts":["A. dimenhydrinate","B. cyproheptadine","C. zafirlukast","D. prednisolone"],"ans":3,"exp":"Prednisolone（潑尼松龍）是糖皮質素（glucocorticoid），具有強效的抗炎作用。在抗原引起的支氣管炎（allergic bronchitis）治療上，prednisolone能：①抑制磷脂酶A₂，減少花生四烯酸代謝物（前列腺素、白三烯素）的生成，減輕炎症；②減少支氣管黏液的過度分泌及黏膜水腫；③抑制肥大細胞和嗜酸性粒細胞等炎症細胞的活化，減輕支氣管平滑肌的過度收縮。因此為過敏性支氣管炎的有效治療藥物。","we":["錯誤：dimenhydrinate（暈海寧）為H1抗組織胺藥加dimenhyd-rinate，主要用於防治動暈病和嘔吐，雖有輕微抗組織胺支氣管舒張效果，但對抗原誘發的支氣管炎的炎症反應無明顯療效，不能降低黏液過度分泌與黏膜增厚。","錯誤：cyproheptadine（賽庚啶）是具有抗血清素（antiserotonin）和抗組織胺作用的藥物，用於增加食欲及某些過敏反應；其抗炎作用有限，無法有效治療抗原誘發的支氣管炎的全部症狀（分泌過多、黏膜增厚、平滑肌收縮）。","錯誤：zafirlukast（茲芙魯卡）是白三烯素受體拮抗劑（leukotriene receptor antagonist, LTRA），可阻斷LTD₄和LTE₄，雖對過敏性哮喘有效，但在獸醫臨床其廣泛使用不如prednisolone，且對黏液過度分泌的控制效果不及糖皮質素全面。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_033","year":2015,"roc_year":104,"session":"2","examNo":33,"q":"作為鼻腔噴霧局部用藥，phenylephrine主要作用於下列何種受體？","opts":["A. α1","B. α2","C. β1","D. β2"],"ans":0,"exp":"Phenylephrine（苯腎上腺素）是選擇性α1-腎上腺素受體促效劑（α1-adrenergic agonist），作用於鼻腔黏膜血管壁上的α1受體，引起血管平滑肌收縮（vasoconstriction），減少鼻腔黏膜充血水腫，從而達到鼻腔去充血（decongestant）的效果。局部噴霧使用可減少全身性副作用。β受體激動（β1、β2）與鼻腔充血無關，α2受體則與突觸前回饋調控有關。","we":["","錯誤：α2受體存在於突觸前膜（presynaptic）和某些組織中，α2促效劑（如xylazine、clonidine）的主要效果為中樞鎮靜和抑制去甲腎上腺素釋放；phenylephrine的選擇性靶點是α1受體（突觸後），而非α2受體。","錯誤：β1受體主要分布於心臟，β1激動劑（如dobutamine）增加心率和收縮力；β1激動效果不會引起鼻腔血管收縮，不能作為去充血用途，phenylephrine也不作用於β1受體。","錯誤：β2受體主要分布於支氣管平滑肌，β2激動劑（如albuterol/salbutamol）用於支氣管擴張；β2激動效果反而會引起血管舒張，不適合作為鼻腔去充血劑，phenylephrine的靶點為α1而非β2。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_034","year":2015,"roc_year":104,"session":"2","examNo":34,"q":"下列藥物中，同時具有鴉片、血清素與α2\r -腎上腺素性活性，且亦是蕈毒鹼性拮抗劑，然臨床\r 上主用於鎮痛與鎮咳的是何者？","opts":["A. tramadol","B. butorphanol","C. nalbuphine","D. dextromethorphan"],"ans":0,"exp":"Tramadol（曲馬多）是多機制的中樞性鎮痛藥，具有：①μ阿片受體弱激動活性；②抑制血清素（serotonin）和正腎上腺素（norepinephrine）的再攝取（類似SNRI作用）；③抑制突觸前α2受體（增加正腎上腺素釋放）；④對蕈毒鹼受體（muscarinic receptor）有輕度拮抗作用。臨床上tramadol主要用於鎮痛（analgesia）和止咳（antitussive，鎮咳）。與其他純阿片藥相比，tramadol的濫用風險和呼吸抑制較低。","we":["","錯誤：butorphanol（布托啡諾）是混合型μ拮抗/κ激動的阿片藥，具有明顯的鎮咳和部分鎮痛作用，但其無SNRI機制，也無蕈毒鹼拮抗活性，不符合題目描述的「具有阿片、血清素、α2腎上腺素性活性及蕈毒鹼性拮抗」的多重機制藥物。","錯誤：nalbuphine（納布啡）是μ拮抗/κ激動的混合型阿片藥，具有鎮痛和輕度鎮靜作用，但無抑制血清素/正腎上腺素再攝取的SNRI特性，也無蕈毒鹼拮抗性，不符合題目的多重機制描述。","錯誤：dextromethorphan（右美沙芬）是sigma受體激動劑，有NMDA受體拮抗活性，主要作為鎮咳藥使用，鎮痛效果較弱；它並非tramadol所具備的「阿片+血清素+α2+蕈毒鹼拮抗」多機制組合的典型代表。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_035","year":2015,"roc_year":104,"session":"2","examNo":35,"q":"犬經口投予一次建議劑量的制酸劑，其中和胃酸的作用大約可維持多久？","opts":["A. 2小時","B. 6小時","C. 9小時","D. 12小時"],"ans":0,"exp":"在犬，單次口服建議劑量的制酸劑（antacids，如氫氧化鋁、碳酸鈣、氫氧化鎂等）能中和胃酸的作用時間約為2小時。這是因為胃排空後，制酸劑隨食物離開胃部，中和作用即告終止。加上胃部持續分泌胃酸，制酸劑的緩衝能力很快被耗盡。因此制酸劑需要頻繁給藥（通常餐後及睡前），才能有效維持胃酸控制。相比之下，H2拮抗劑（6～8小時）和PPI（12～24小時）的作用時間更長。","we":["","錯誤：6小時的中和作用時間是H2受體拮抗劑（如cimetidine、famotidine、ranitidine）的大致藥效維持時間，而非制酸劑；制酸劑在胃排空後中和作用即終止，通常僅約2小時。","錯誤：9小時的作用時間遠超出制酸劑的實際緩衝能力；制酸劑是直接化學中和，作用隨胃內藥物被排空而終止，無法維持9小時的抑酸效果。","錯誤：12小時的抑酸時間是質子泵抑制劑（PPI，如omeprazole）的作用時長；PPI與H⁺/K⁺-ATPase共價結合，抑酸作用持久，遠比制酸劑（僅約2小時）的效期長得多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_036","year":2015,"roc_year":104,"session":"2","examNo":36,"q":"下列何者為牛肺萃取的一種界面活性劑，可用於改善未成熟新生動物的呼吸窘迫症？","opts":["A. theophylline","B. beractant","C. fluticasone","D. terbutaline"],"ans":1,"exp":"Beractant（商品名Survanta®）是從牛肺（bovine lung）萃取製備的天然肺泡表面活性劑（pulmonary surfactant），含有磷脂質（主要為二棕櫚醯磷脂醯膽鹼，DPPC）、中性脂質和表面活性蛋白（SP-B、SP-C）。它能降低肺泡氣液界面的表面張力，防止肺泡在呼氣末萎陷，用於改善早產（premature）新生動物因內源性表面活性劑不足所導致的呼吸窘迫症候群（RDS，respiratory distress syndrome）。","we":["錯誤：theophylline（茶鹼）是磷酸二酯酶抑制劑和腺苷受體拮抗劑，用於支氣管擴張（治療氣喘、COPD），非肺泡表面活性劑；它不是從牛肺萃取的，也不用於治療新生動物RDS。","","錯誤：fluticasone（氟替卡松）是吸入性糖皮質素（inhaled corticosteroid, ICS），用於治療過敏性氣喘和慢性支氣管炎；它是化學合成藥，並非牛肺萃取的表面活性劑，不用於新生動物RDS。","錯誤：terbutaline（特布他林）是β2受體激動劑，用於支氣管擴張（舒喘）；它是化學合成的擬交感神經藥，非肺泡表面活性劑，不是治療新生動物呼吸窘迫症的表面活性劑製品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_037","year":2015,"roc_year":104,"session":"2","examNo":37,"q":"下列何者適宜用於治療胃潰瘍？","opts":["A. cimetidine","B. pyrilamine","C. cyclizine","D. promethazine"],"ans":0,"exp":"Cimetidine（西咪替丁）是第一代H2受體拮抗劑（H2 receptor antagonist），競爭性阻斷胃壁細胞（parietal cells）上的組織胺H2受體，抑制組織胺刺激的胃酸分泌，使胃酸量及酸度降低，有利於消化性潰瘍（peptic ulcer）的癒合。其他選項均為H1受體拮抗劑（抗過敏/抗組織胺藥），對胃酸分泌無直接抑制作用，不用於治療胃潰瘍：pyrilamine（H1拮抗劑）、cyclizine（H1拮抗劑，止吐）、promethazine（H1拮抗劑，吩噻嗪類）。","we":["","錯誤：pyrilamine（吡拉明）是第一代H1受體拮抗劑，用於過敏反應、蕁麻疹等，作用於H1受體而非H2受體，不能抑制胃酸分泌，不適用於治療胃潰瘍。","錯誤：cyclizine是H1受體拮抗劑，具有抗膽鹼性質，主要用於控制嘔吐和動暈病；它作用於H1受體及M受體，不作用於H2受體，對胃酸分泌無直接抑制，不用於胃潰瘍治療。","錯誤：promethazine（異丙嗪）是吩噻嗪類H1受體拮抗劑，具有鎮靜、抗過敏和止吐特性；它作用於H1受體和D₂受體，不能抑制胃酸分泌，不用於治療消化性潰瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_038","year":2015,"roc_year":104,"session":"2","examNo":38,"q":"下列何者可用於治療犬貓接受cisplatin化學治療所引起的嘔吐症狀？","opts":["A. ondansetron","B. omeprazole","C. methadone","D. methanechol"],"ans":0,"exp":"Ondansetron（昂丹司瓊）是5-HT₃（第3型血清素）受體拮抗劑，能阻斷胃腸道嗜鉻細胞（enterochromaffin cells）釋放的血清素與迷走神經傳入神經及嘔吐中樞觸發區（CTZ）的5-HT₃受體結合，從而有效控制化學治療（尤其是cisplatin等高致吐性化療藥物）所引起的嘔吐。Cisplatin大量釋放腸道血清素，ondansetron是此類嘔吐的首選止吐藥，在犬貓化療相關嘔吐的控制上效果卓越。","we":["","錯誤：omeprazole（奧美拉唑）是質子泵抑制劑（PPI），抑制胃壁細胞H⁺/K⁺-ATPase，用於治療消化性潰瘍和胃食道逆流，不能控制化學治療（cisplatin）刺激血清素釋放所誘發的嘔吐中樞反應。","錯誤：methadone（美沙冬）是長效阿片μ受體激動劑，用於鎮痛和戒癮治療，本身在高劑量時反而可能引起嘔吐，不是治療化療引起嘔吐的藥物。","錯誤：methacholine（氯化甲膽鹼）是直接作用型副交感神經擬似藥（毒蕈鹼受體激動劑），用於支氣管激發試驗，可引起噁心；它不是止吐藥，完全不用於化療相關嘔吐的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_039","year":2015,"roc_year":104,"session":"2","examNo":39,"q":"關於oxytocin的敘述，下列何者錯誤？","opts":["A. 促進子宮收縮","B. 使用於誘發分娩","C. 可能造成子宮難產（uterine dystocia）","D. 可作為促乳劑（galactopoietic agent）"],"ans":3,"exp":"Oxytocin（催產素）的主要藥理作用包括：①促進子宮肌層收縮（促進分娩）；②誘發分娩（labor induction）；③可能過度刺激子宮而導致強直性收縮（uterine tetany），造成子宮難產（uterine dystocia）；④促進乳汁噴乳（milk ejection/let-down reflex）——即讓乳腺泡中已合成的乳汁射出，但「促乳劑（galactopoietic agent）」的定義是促進「乳汁生產（milk production/synthesis）」的藥物，催乳素（prolactin）才是真正的galactopoietic agent。Oxytocin促進的是泌乳反射（ejection），而非乳汁的合成，因此「oxytocin可作為促乳劑」的描述是錯誤的。","we":["此為正確描述：oxytocin直接作用於子宮肌層（myometrium）的oxytocin受體，引起子宮平滑肌收縮，是促進子宮收縮最主要的激素，不符合題目問的「錯誤」描述。","此為正確描述：oxytocin在分娩期給予可誘發（induce）或加強宮縮、加速分娩進程，是獸醫臨床常用的催生藥物，不符合題目問的「錯誤」描述。","此為正確描述：oxytocin劑量過高或子宮對催產素過度敏感時，可引起強直性子宮收縮（tetanic contraction），阻礙胎兒娩出，造成難產，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_040","year":2015,"roc_year":104,"session":"2","examNo":40,"q":"關於黃體酮（progestins）藥理作用的敘述，下列何者錯誤？","opts":["A. 增加動情素作用後之腺體的生長","B. 延長黃體期間","C. 增加子宮肌層對催產素（oxytocin）之敏感性","D. 抑制懷孕時子宮之收縮"],"ans":2,"exp":"Progestins（黃體酮類，孕激素）在懷孕期間的重要作用是降低（而非增加）子宮肌層（myometrium）對催產素（oxytocin）的敏感性，維持子宮靜止狀態（uterine quiescence），防止在妊娠期間發生早期子宮收縮而導致早產或流產。選項C「增加子宮肌層對催產素之敏感性」與黃體酮的已知藥理相反，是錯誤的描述。分娩前黃體酮濃度下降，子宮對oxytocin的敏感性才隨之升高，啟動分娩。其他選項A（促進腺體生長）、B（延長黃體期）、D（抑制懷孕時子宮收縮）均為progestins的正確作用。","we":["此為正確描述：progestins在動情素（estrogen）啟動腺體發育後，進一步促進子宮腺體的增殖和分泌，為受精卵著床做準備，此為progestins的基本子宮作用，不符合題目問的「錯誤」描述。","此為正確描述：progestins（尤其是黃體期的progesterone）能維持黃體功能並延長黃體期（luteal phase），抑制下一個卵泡的發育和排卵，此為progestins在生殖週期中的正常作用，不符合題目問的「錯誤」描述。","","此為正確描述：progestins確實能抑制懷孕期間子宮平滑肌的收縮（降低肌電活動、減少縫隙連接形成），維持子宮靜止以保全妊娠，此為progestins維持妊娠的核心機制，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_041","year":2015,"roc_year":104,"session":"2","examNo":41,"q":"關於glipizide的敘述，下列何者錯誤？","opts":["A. 口服投藥後吸收緩慢","B. 與血漿蛋白高度結合","C. 主要為細胞色素P450酵素代謝","D. 對貓之胰島素分泌傾向於短效之作用"],"ans":0,"exp":"Glipizide 為第二代 sulfonylurea 類口服降血糖藥，用於貓的第二型糖尿病。正確藥理特性：口服後吸收「迅速」（non-food-dependent rapid absorption），約 1–2 小時達血中峰值，因此選項 A「吸收緩慢」的描述錯誤。其餘特性：與血漿蛋白（主要為白蛋白）高度結合（>98%）、主要經肝臟細胞色素 P450（CYP2C9）代謝、對貓的胰島素刺激效果傾向短效（作用持續時間有限，需每日兩次投藥）均為正確描述。","we":["","此為正確描述：Glipizide 與血漿蛋白（白蛋白）高度結合（結合率 > 98%），此特性會影響其藥物間交互作用，不符合題目問的「錯誤」描述。","此為正確描述：Glipizide 主要透過肝臟細胞色素 P450 酵素（尤其 CYP2C9）進行代謝，代謝產物活性較低，不符合題目問的「錯誤」描述。","此為正確描述：Glipizide 對貓的胰島素刺激作用傾向短效，臨床上需每日兩次投藥，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_042","year":2015,"roc_year":104,"session":"2","examNo":42,"q":"Adrenocorticotropic hormone（ACTH）於臨床上最重要的應用為：","opts":["A. 疾病預防","B. 疾病治療","C. 促進生長","D. 用於診斷"],"ans":3,"exp":"ACTH（促腎上腺皮質素）在臨床上最重要的應用並非治療或預防，而是作為「診斷工具」——即 ACTH 刺激試驗（ACTH stimulation test）。藉由注射合成 ACTH（tetracosactide/cosyntropin）後測量血清皮質醇濃度的反應，可評估腎上腺皮質的功能狀態，用於診斷腎上腺皮質功能不全（Addison's disease）或庫欣氏症候群（Cushing's syndrome）等疾病。","we":["錯誤：ACTH 本身不具預防疾病的功能，其臨床用途集中在診斷腎上腺皮質功能，非疾病預防。","錯誤：雖然理論上 ACTH 可刺激腎上腺皮質分泌皮質醇而達到某些治療目的，但實際臨床上直接給予糖質皮質素（如 prednisolone、dexamethasone）遠比使用 ACTH 更方便且可預測，ACTH 主要角色為診斷而非治療。","錯誤：ACTH 不用於促進生長，促進生長屬於生長激素（GH/STH）或類胰島素生長因子（IGF-1）的功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_043","year":2015,"roc_year":104,"session":"2","examNo":43,"q":"下列有關甲狀腺激素過量的敘述，何者錯誤？","opts":["A. 犬隻不易見中毒症狀，主要因自膽汁中排出甲狀腺激素的能力佳","B. 口服過量時，可以活性碳治療","C. 過量時，可能引起心搏過速","D. 若以體重計算投予含T3的產品時，小型犬較大型犬易中毒"],"ans":3,"exp":"題目詢問有關甲狀腺激素過量的「錯誤」敘述。選項 D 稱「以體重計算投予含 T3 的產品時，小型犬較大型犬易中毒」，此敘述錯誤。犬隻的基礎代謝率（BMR）與體重的 0.75 次方成比例（代謝體重），大型犬每單位體重的代謝率低於小型犬；然而，若以等體重劑量換算，小型犬因代謝率較高，理論上代謝外源性甲狀腺素較快，不必然表現出更高的中毒易感性。實際上，犬隻整體對外源性甲狀腺素過量的耐受性較好，易中毒的說法因動物種類及劑量計算方式不同而有差異，以體重單純換算不能推導出小型犬更易中毒的結論。A/B/C 選項均為正確的過量甲狀腺素藥理知識。","we":["此為正確描述：犬隻因膽汁中排出甲狀腺素的能力佳，對甲狀腺素過量有較好的耐受性，不符合題目問的「錯誤」描述。","此為正確描述：口服過量甲狀腺素可使用活性碳（activated charcoal）吸附以減少腸道吸收，不符合題目問的「錯誤」描述。","此為正確描述：甲狀腺素過量可促進心臟 β 受體的敏感性，導致心搏過速（tachycardia），不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_044","year":2015,"roc_year":104,"session":"2","examNo":44,"q":"關於misoprostol的敘述，下列何者錯誤？","opts":["A. 用於處理原發或aspirin引起的胃潰瘍","B. 直接經胃壁細胞抑制胃酸的分泌","C. 促進prostaglandin E調節的黏膜保護及復原","D. 其副作用為便秘"],"ans":3,"exp":"Misoprostol 為合成前列腺素 E1（PGE1）類似物，其副作用主要為「腹瀉」（diarrhea）和腸痙攣，而非便秘（constipation）。這是因為 PGE1 可促進腸道平滑肌收縮並增加腸道分泌，加速腸蠕動而導致腹瀉。選項 A（用於處理胃潰瘍）、B（直接抑制胃壁細胞胃酸分泌）、C（促進 PGE 調節的黏膜保護）均為 misoprostol 正確的藥理描述。","we":["此為正確描述：Misoprostol 可用於處理原發性或 aspirin 引起的胃潰瘍，提供黏膜保護，不符合題目問的「錯誤」描述。","此為正確描述：Misoprostol 直接作用於胃壁細胞（parietal cells）上的前列腺素受體，抑制 cAMP 生成，進而降低胃酸分泌，不符合題目問的「錯誤」描述。","此為正確描述：Misoprostol 可促進 PGE 介導的胃黏膜保護機制，包括增加黏液及碳酸氫鹽分泌，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_045","year":2015,"roc_year":104,"session":"2","examNo":45,"q":"下列何者減少葡萄糖從胃腸道吸收，並不刺激胰島素之分泌，因此不造成低血糖症？","opts":["A. metformin","B. glipizide","C. glyburide","D. glimepiride"],"ans":0,"exp":"Metformin 為雙胍類（biguanide）口服降血糖藥，其主要作用機制包括：抑制肝臟糖質新生（hepatic gluconeogenesis）、減少腸道葡萄糖吸收，以及提升周邊組織（肌肉）對胰島素的敏感性。關鍵特性：metformin 本身「不刺激胰臟 β 細胞分泌胰島素」，因此單獨使用時不會引起低血糖症（hypoglycemia）。相較之下，glipizide、glyburide、glimepiride 均屬 sulfonylurea 類，均透過刺激胰島素分泌而可能導致低血糖。","we":["","錯誤：Glipizide 為第二代 sulfonylurea，作用機制為關閉胰臟 β 細胞 K-ATP 通道，刺激胰島素分泌，具有造成低血糖的風險，不符合題意。","錯誤：Glyburide（glibenclamide）為 sulfonylurea 類，可強效刺激胰島素分泌，低血糖風險高，不符合題意。","錯誤：Glimepiride 為第三代 sulfonylurea，同樣以刺激胰島素分泌為主要機制，會造成低血糖，不符合題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_046","year":2015,"roc_year":104,"session":"2","examNo":46,"q":"在生殖季節，可先使用PGF2α造成黃體溶解（luteolysis）後，再使用何者增加排卵？","opts":["A. gonadotropin","B. 高劑量的PGF2α","C. oxytocin","D. prolactin"],"ans":0,"exp":"PGF2α（前列腺素 F2α）可促使黃體溶解（luteolysis），使血中孕酮（progesterone）急速下降，讓動物同期發情。黃體溶解後，卵巢上的卵泡可繼續發育，但要誘導卵泡排卵仍需使用「促性腺激素（gonadotropins）」，如 GnRH（促性腺激素釋放激素）、hCG（人絨毛膜促性腺激素）或 LH（黃體素化激素），透過促進 LH 峰值而誘發排卵，達到人工控制繁殖的目的。","we":["","錯誤：高劑量 PGF2α 僅能加速黃體溶解，不具直接誘導排卵的作用；黃體溶解後仍需促性腺激素誘發排卵。","錯誤：Oxytocin（催產素）主要作用為促進子宮收縮及乳汁釋放，不具誘發排卵的功能。","錯誤：Prolactin（泌乳素）主要調控泌乳及黃體維持（某些物種），不用於誘導排卵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_047","year":2015,"roc_year":104,"session":"2","examNo":47,"q":"下列關於antiseptics和disinfectants的敘述，何者正確？","opts":["A. 兩者在不同製劑中的成分與濃度相同時，必可交替使用","B. antiseptics的殺菌作用必定較任何disinfectants為強","C. antiseptics主要用於環境清潔與消毒","D. 部分藥品可同時具有antiseptics及disinfectants的特性"],"ans":3,"exp":"Antiseptics（防腐劑）用於活體組織表面（如皮膚、傷口），disinfectants（消毒劑）用於非生物表面（如器具、環境）。部分藥品（如 chlorhexidine、碘酒/iodine preparations）在不同濃度及製劑下，可同時作為 antiseptic 或 disinfectant 使用，因此選項 D「部分藥品可同時具有兩者特性」為正確描述。選項 A 錯（相同成分不代表可互換，因接觸組織不同）、B 錯（antiseptics 殺菌力不一定強於所有 disinfectants）、C 錯（antiseptics 主要用於活體表面，環境消毒才是 disinfectants 的用途）。","we":["錯誤：即使成分與濃度相同，antiseptic 與 disinfectant 也不一定可以交替使用，因為前者需對活體組織安全，後者則無此限制，使用目的與安全考量不同。","錯誤：Antiseptics 的殺菌力並不必然強於所有 disinfectants；事實上，disinfectants 通常濃度更高、毒性更強，殺菌力可能更廣泛，只是不適用於活體。","錯誤：Antiseptics 主要用於活體組織表面（皮膚、傷口、黏膜），環境清潔與消毒是 disinfectants 的應用範疇。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_048","year":2015,"roc_year":104,"session":"2","examNo":48,"q":"下列關於sulfadimethoxine與ormetoprim複方製劑的敘述中，何者正確？","opts":["A. 二者均可抑制p-aminobenzoic acid攝入細胞內","B. 兩者均為磺胺劑","C. 二者均可抑制dihydrofolate reductase","D. 兩者均為葉酸代謝拮抗劑"],"ans":3,"exp":"Sulfadimethoxine（磺胺劑）與 ormetoprim 複方的作用機制：sulfadimethoxine 抑制二氫蝶酸合成酶（dihydropteroate synthase），阻斷 p-aminobenzoic acid（PABA）併入葉酸的步驟；ormetoprim 為 diaminopyrimidine 類似物，抑制二氫葉酸還原酶（dihydrofolate reductase，DHFR）。兩者均屬「葉酸代謝拮抗劑（folate synthesis antagonists）」，只是作用於葉酸合成路徑的不同步驟，故選項 D 為正確描述。","we":["錯誤：抑制 PABA 攝入細胞是磺胺劑（sulfadimethoxine）的機制，ormetoprim 並不抑制 PABA 攝入，而是抑制 DHFR，兩者機制不同，非「均可」。","錯誤：Ormetoprim 屬 diaminopyrimidine 類似物（類似 trimethoprim），不屬於磺胺劑（sulfonamide）；兩者為不同化學類別，只有 sulfadimethoxine 是磺胺劑。","錯誤：抑制 DHFR 是 ormetoprim（及 trimethoprim）的機制，sulfadimethoxine 作用於更上游的 dihydropteroate synthase，並不直接抑制 DHFR，故非「二者均可」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_049","year":2015,"roc_year":104,"session":"2","examNo":49,"q":"下列何者能與tubulin結合，而抑制腫瘤細胞分裂？","opts":["A. vincristine","B. azathioprine","C. carboplatin","D. gemcitabine"],"ans":0,"exp":"Vincristine 為長春花生物鹼（vinca alkaloid），其抗腫瘤機制為與微管蛋白（tubulin）二聚體結合，抑制微管聚合（microtubule polymerization），使有絲分裂紡錘體無法形成，腫瘤細胞阻滯於 M 期而無法完成細胞分裂，導致細胞死亡。用於治療淋巴瘤、白血病等多種犬貓腫瘤。其他選項機制不同：azathioprine 為嘌呤類似物（purine analog）、carboplatin 為鉑類烷化劑、gemcitabine 為核苷類似物（pyrimidine antimetabolite）。","we":["","錯誤：Azathioprine 為嘌呤代謝拮抗劑（purine analog/antimetabolite），在體內轉化為 6-mercaptopurine，干擾 DNA 合成，機制與 tubulin 結合無關。","錯誤：Carboplatin 為第二代鉑類化合物，藉由與 DNA 形成交叉鍵結（crosslinks）而抑制 DNA 複製，不透過 tubulin 作用。","錯誤：Gemcitabine 為核苷類似物（嘧啶抗代謝劑），競爭性嵌入 DNA 鏈並抑制 DNA 聚合酶，不透過 tubulin 作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_050","year":2015,"roc_year":104,"session":"2","examNo":50,"q":"下列有關β-lactams抗菌劑特性的敘述中，何者正確？","opts":["A. 作用屬於濃度相關性（concentration-dependent）的藥品","B. 於治療期間，血中藥品的濃度必定都要高於最小抑制濃度","C. 水解β-lactam ring為最常產生抗藥性的原因之一","D. G（-）細菌常將β-lactamase分泌到菌體外"],"ans":2,"exp":"β-Lactam 抗菌劑的正確特性：（C）水解 β-lactam 環（由 β-lactamase 催化）是最常見的抗藥機制之一，為正確描述。其他選項分析：（A）β-lactams 屬「時間相關性（time-dependent）」而非濃度相關性抗菌劑，療效與藥物濃度超過 MIC 的時間長短有關；（B）治療期間血中濃度「未必」需持續高於 MIC，只需在用藥間隔中維持超過 MIC 一定比例的時間即可；（D）革蘭氏陰性菌的 β-lactamase 位於周質空間（periplasmic space），而非分泌到菌體外（與革蘭氏陽性菌的胞外分泌不同）。","we":["錯誤：β-Lactams 屬於時間相關性（time-dependent）抗菌劑，療效取決於血中濃度超過 MIC 的時間比例（%T > MIC），而非濃度依賴性（concentration-dependent）藥物。","錯誤：β-Lactams 的療效目標是讓用藥間隔中有足夠比例的時間（通常 > 40–50%）使血中濃度超過 MIC，並非「必定在整個治療期間都高於 MIC」。","","錯誤：革蘭氏陰性菌（G(-)）的 β-lactamase 存在於周質空間（periplasmic space），而非分泌到菌體外；革蘭氏陽性菌才將 β-lactamase 分泌到胞外環境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_051","year":2015,"roc_year":104,"session":"2","examNo":51,"q":"下列關於陽離子界面活性劑之敘述中，何者正確？","opts":["A. 一般洗手常用的肥皂均屬於本類","B. 環境中蛋白質的存在不會影響其作用","C. 在一般使用濃度下，不具殺孢子作用","D. 水質軟硬度不會影響其抗菌活性"],"ans":2,"exp":"陽離子界面活性劑（cationic surfactants，QAC，如 benzalkonium chloride 苯扎氯銨）的正確特性：（C）在一般使用濃度下，QAC 對芽孢（spores）無殺滅作用，屬「不具殺孢子活性」的消毒劑。其他錯誤：（A）一般肥皂屬陰離子界面活性劑（anionic surfactants），非 QAC；（B）環境中蛋白質（有機物）會與 QAC 結合，降低其有效濃度，影響殺菌效果；（D）硬水（含 Ca2+、Mg2+）中的礦物質離子會與 QAC 形成沉澱，降低抗菌活性，故水質硬度確實影響其效果。","we":["錯誤：一般洗手用肥皂屬陰離子界面活性劑（anionic surfactants），含有脂肪酸鈉鹽，帶負電荷；QAC 屬陽離子界面活性劑，兩者混用反而會互相中和失效。","錯誤：環境中的蛋白質（有機物）會與 QAC 結合，消耗有效濃度，顯著降低其殺菌效果，因此有機物的存在確實「會影響」QAC 的作用。","","錯誤：硬水中的鈣、鎂離子可與 QAC 中的活性陽離子競爭或形成不溶性複合物，降低其抗菌活性，因此水質軟硬度確實「會影響」QAC 的效力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_052","year":2015,"roc_year":104,"session":"2","examNo":52,"q":"長期使用下列何者會造成聽神經功能障礙？","opts":["A. chloramphenicol","B. streptomycin","C. ampicillin","D. cephalothin"],"ans":1,"exp":"Streptomycin 屬胺基醣苷類（aminoglycoside）抗生素，此類藥物長期或高劑量使用可導致耳毒性（ototoxicity），造成聽神經（第八對腦神經的耳蝸支）損傷，臨床上表現為聽力喪失或耳鳴。胺基醣苷類在內耳毛細胞（cochlear hair cells）中累積，干擾細胞功能導致不可逆損傷。其他選項：chloramphenicol 可抑制骨髓造血（再生不良性貧血）、ampicillin 為廣效青黴素（過敏反應為主要不良反應）、cephalothin 為第一代頭孢子菌素（腎毒性較低），均不以聽神經毒性為主要副作用。","we":["錯誤：Chloramphenicol 的主要毒性為骨髓抑制（aplastic anemia，再生不良性貧血），以及貓的可逆性骨髓毒性，不以聽神經損傷為特徵。","","錯誤：Ampicillin 為廣效青黴素，主要不良反應為過敏反應（allergic reactions），不具顯著的耳毒性。","錯誤：Cephalothin 為第一代頭孢子菌素，腎毒性較輕微，不以聽神經功能障礙為特徵性副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_053","year":2015,"roc_year":104,"session":"2","examNo":53,"q":"感染Cryptococcus neoformans引起腦膜炎需以下列何者注射治療最佳？","opts":["A. fluconazole","B. clotrimazole","C. ketoconazole","D. undecylenic acid"],"ans":0,"exp":"治療新型隱球菌（Cryptococcus neoformans）引起的腦膜炎，首選藥物為 fluconazole。原因：fluconazole 具高度水溶性及脂溶性平衡特性，能有效穿透血腦屏障（blood-brain barrier），在腦脊髓液（CSF）中達到治療濃度，對隱球菌有效。其他選項：clotrimazole 主要外用（全身吸收差）；ketoconazole 因 CSF 穿透力差，不適用於中樞神經系統感染；undecylenic acid 為外用抗黴菌藥（用於皮膚真菌症），無中樞作用。","we":["","錯誤：Clotrimazole 主要作為外用抗黴菌藥（皮膚、陰道等局部感染），全身吸收極差，無法達到 CSF 中的有效治療濃度，不適用於腦膜炎。","錯誤：Ketoconazole 雖可全身投藥，但穿透血腦屏障的能力差，CSF 中濃度不足，不適合作為隱球菌腦膜炎的治療首選。","錯誤：Undecylenic acid 為局部外用抗黴菌藥，主要用於皮膚真菌感染（如皮黴菌症），無法治療全身性或中樞神經系統真菌感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_054","year":2015,"roc_year":104,"session":"2","examNo":54,"q":"下列何者因為其腎毒性太強不能注射使用，臨床上常經口投予？","opts":["A. metronidazole","B. polymyxin B","C. tylosin","D. tilmicosin"],"ans":1,"exp":"Polymyxin B 為多胜肽類抗生素（polypeptide antibiotic），對革蘭氏陰性菌具有強效殺菌作用，但其靜脈注射的腎毒性（nephrotoxicity）及神經毒性（neurotoxicity）極為嚴重，無法安全用於全身性注射給藥。因此，臨床上 polymyxin B 常以口服途徑投予，由於其口服吸收極差（不易從腸道吸收），藥物停留在腸腔中發揮局部殺菌作用，用於腸道革蘭氏陰性菌感染。其他選項：metronidazole、tylosin、tilmicosin 均可注射使用（tilmicosin 注射有其他物種毒性限制，但非因腎毒性限制口服）。","we":["錯誤：Metronidazole 可用於注射（靜脈滴注），也可口服，其腎毒性不顯著，不因腎毒性限制為口服給藥。","","錯誤：Tylosin 為大環內酯類（macrolide）抗生素，可肌肉注射或口服使用，不因腎毒性而限制給藥途徑。","錯誤：Tilmicosin 雖具嚴重心臟毒性（對馬、人類及豬有致命性），但不以腎毒性作為限制注射使用的主要原因；其禁忌為對特定物種的心臟毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_055","year":2015,"roc_year":104,"session":"2","examNo":55,"q":"下列何者屬於diaminopyrimidine analogs？","opts":["A. methenamine","B. ormetoprim","C. miconazole","D. sulfadimethoxine"],"ans":1,"exp":"Diaminopyrimidine analogs（二胺嘧啶類似物）是一類結構上模擬二胺嘧啶的藥物，代表藥物包括 trimethoprim 及 ormetoprim。Ormetoprim 與 trimethoprim 結構類似，均透過競爭性抑制細菌的二氫葉酸還原酶（DHFR）而阻斷葉酸代謝，常與磺胺劑複方使用以產生協同抗菌效果。其他選項：methenamine 為六亞甲基四胺（在酸性尿液中釋放甲醛），非 diaminopyrimidine；miconazole 為咪唑類抗黴菌藥；sulfadimethoxine 為磺胺劑，不屬於 diaminopyrimidine。","we":["錯誤：Methenamine（烏洛托品）為尿道防腐劑，在酸性環境下水解釋放甲醛而殺菌，化學結構為六亞甲基四胺，不屬於 diaminopyrimidine 類似物。","","錯誤：Miconazole 為咪唑類抗黴菌藥，藉由抑制黴菌細胞膜麥角固醇合成發揮抗黴作用，不屬於 diaminopyrimidine analogs。","錯誤：Sulfadimethoxine 屬磺胺劑（sulfonamide），透過競爭性抑制 dihydropteroate synthase 而阻斷 PABA 利用，化學分類上不屬於 diaminopyrimidine 類似物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_056","year":2015,"roc_year":104,"session":"2","examNo":56,"q":"下列何種藥物於鮭魚產卵前注射，可以降低受精魚卵感染細菌性腎病？","opts":["A. amoxicillin","B. erythromycin","C. kanamycin","D. oxolinic acid"],"ans":1,"exp":"細菌性腎病（Bacterial Kidney Disease，BKD）為鮭魚的重要細菌性疾病，病原為 Renibacterium salmoninarum。在鮭魚產卵前注射 erythromycin（紅黴素，大環內酯類抗生素），可有效降低母魚卵巢內的細菌量，進而減少垂直傳播至受精魚卵（卵傳播）的風險，保護後代不受 BKD 感染。Erythromycin 在水產養殖中曾廣泛用於此目的（部分國家現已限制使用）。","we":["錯誤：Amoxicillin 為廣效青黴素，雖可對抗某些革蘭氏陽性菌，但對 Renibacterium salmoninarum 的臨床療效及在鮭魚 BKD 預防上的應用記錄不如 erythromycin。","","錯誤：Kanamycin 為胺基醣苷類抗生素，主要用於水產養殖中的革蘭氏陰性菌感染，對 BKD 病原（革蘭氏陽性菌）的療效及用於產前注射預防卵傳播的記錄不充分。","錯誤：Oxolinic acid 為喹諾酮類（quinolone）抗菌劑，主要用於水產養殖中的革蘭氏陰性菌感染（如弧菌症），不作為 BKD 的標準預防用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_057","year":2015,"roc_year":104,"session":"2","examNo":57,"q":"觀賞魚若出現亞硝酸中毒時，可以下列何種藥物藥浴來治療？","opts":["A. methylene blue","B. formalin","C. benzalkonium chloride","D. sodium thiosulfate"],"ans":0,"exp":"觀賞魚亞硝酸（nitrite）中毒的機制：水中亞硝酸鹽透過魚鰓進入血液，將血紅素（hemoglobin）中的亞鐵（Fe2+）氧化為三價鐵（Fe3+），形成高鐵血紅素（methemoglobin），使血液喪失攜氧能力（Brown Blood Disease）。治療方法：使用亞甲藍（methylene blue）藥浴，因 methylene blue 能活化 NADH-methemoglobin reductase，或直接作為電子傳遞媒介，將 Fe3+ 還原回 Fe2+，恢復血紅素的攜氧功能。","we":["","錯誤：Formalin 主要用於水產養殖中防治外寄生蟲（如鞭毛蟲、錨頭蚤等）及部分真菌感染，不用於亞硝酸中毒的解毒治療。","錯誤：Benzalkonium chloride 為陽離子界面活性劑，用於水體消毒及防治細菌性疾病，無法解除高鐵血紅素的毒性。","錯誤：Sodium thiosulfate 主要用於中和水中氯（chlorine）及治療氰化物中毒（CN-）或碘中毒，不用於亞硝酸/高鐵血紅素中毒的解毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_058","year":2015,"roc_year":104,"session":"2","examNo":58,"q":"含有下列何者之潤濕劑最適合用於治療犬隻全身性毛囊蟲症？","opts":["A. amitraz","B. benzoyl peroxide","C. chlorhexidine","D. ethyl lactate"],"ans":0,"exp":"全身性毛囊蟲症（generalized demodicosis）為犬隻由 Demodex canis 引起的嚴重皮膚寄生蟲病，治療首選為含有 amitraz 的藥浴（全身浸泡，dip）。Amitraz 為甲脒類（formamidine）殺蟲劑，作用機制包括抑制單胺氧化酶（MAO）及具有 α2-adrenoceptor 促效活性，對毛囊蟲具有有效的殺蟲作用。含 amitraz 的潤濕劑（dip/rinse）通常每 2 週全身浸泡一次，持續多個月。","we":["","錯誤：Benzoyl peroxide 具有殺菌、滲透毛囊的特性，可幫助沖洗毛囊中的蟲體及碎屑（flush），常作為輔助治療，但本身對活蟲的殺蟲效力不及 amitraz，不作為全身性毛囊蟲症的主要治療藥物。","錯誤：Chlorhexidine 為廣效消毒防腐劑，主要用於皮膚及傷口的細菌感染控制，對毛囊蟲不具直接殺蟲效力。","錯誤：Ethyl lactate 為角質分解劑及抗菌香皂成分，常用於犬隻膿皮症的輔助治療，無直接殺毛囊蟲的活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_059","year":2015,"roc_year":104,"session":"2","examNo":59,"q":"下列何者為lincomycin類藥物不用於天竺鼠的主要原因？","opts":["A. 產生嚴重休克過敏反應","B. 產生畸胚胎","C. 改變腸胃道菌叢，進而可產生致命腹瀉","D. 具有致命性的心臟毒性"],"ans":2,"exp":"Lincosamides 類藥物（lincomycin、clindamycin）不用於天竺鼠（guinea pigs）的主要原因，在於其會嚴重擾亂天竺鼠腸胃道的正常菌叢（intestinal flora）。天竺鼠為草食性動物，腸道中富含革蘭氏陽性厭氧菌；lincosamides 對此類菌具有強效抑制，導致腸道生態失衡，使梭菌屬（Clostridium spp.，如 C. difficile 或 C. spiroforme）大量繁殖並產生致命腸毒素，引發致死性梭菌性腸毒血症（clostridial enterotoxemia）及腹瀉。","we":["錯誤：嚴重過敏性休克（anaphylactic shock）並非 lincosamides 不用於天竺鼠的主要原因；其主要禁忌是腸道菌叢破壞引發的致死性腸毒血症。","錯誤：致畸胎性（teratogenicity）並非 lincosamides 在天竺鼠的主要限制用藥原因，目前無充分證據顯示 lincosamides 在天竺鼠中具顯著的致畸胎毒性。","","錯誤：致命性心臟毒性為 tilmicosin 等大環內酯類藥物對特定物種的毒性，並非 lincosamides 在天竺鼠的禁忌理由。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_060","year":2015,"roc_year":104,"session":"2","examNo":60,"q":"下列何者在中樞神經、眼睛和前列腺等組織中可達治療的有效濃度？","opts":["A. doxycycline","B. amoxicillin","C. cephalothin","D. gentamicin"],"ans":0,"exp":"Doxycycline（多西環素）為第二代四環素類抗生素，具有高度脂溶性（lipophilicity），能有效穿透血腦屏障（blood-brain barrier）、血眼屏障（blood-ocular barrier）及血液-前列腺屏障（blood-prostate barrier），在中樞神經、眼睛及前列腺組織中均可達到治療有效濃度。相較之下，amoxicillin、cephalothin 屬水溶性 β-lactam 抗生素，CSF/眼/前列腺穿透力差；gentamicin 為胺基醣苷類，極性高、脂溶性差，幾乎無法穿透上述屏障。","we":["","錯誤：Amoxicillin 為廣效青黴素（β-lactam 類），水溶性高、脂溶性差，穿透血腦屏障及前列腺屏障的能力有限，在腦脊髓液及前列腺中的濃度通常不足以達治療效果。","錯誤：Cephalothin 為第一代頭孢子菌素，水溶性高，無法有效穿透血腦屏障、血眼屏障及血液-前列腺屏障，不適用於上述特殊部位感染的治療。","錯誤：Gentamicin 為胺基醣苷類抗生素，極性強、親水性高，幾乎無法穿透血腦屏障、血眼屏障及前列腺屏障，主要用於全身性革蘭氏陰性菌感染，不適用於 CNS、眼睛或前列腺感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_061","year":2015,"roc_year":104,"session":"2","examNo":61,"q":"下列有關macrolides藥物之敘述，何者錯誤？","opts":["A. 主要抗菌範圍為革蘭氏陰性菌","B. Tilmicosin對於馬和人類可能具有致命性的心臟毒性","C. Clarithromycin可用於治療犬和貓的分枝桿菌感染症","D. Tylosin可用於治療家禽的慢性呼吸道疾病（CRD）"],"ans":0,"exp":"Macrolides（大環內酯類）抗生素的主要抗菌範圍為「革蘭氏陽性菌（Gram-positive bacteria）」，以及部分非典型病原體（Mycoplasma、Chlamydia）及某些革蘭氏陰性菌（如 Pasteurella、Campylobacter）。選項 A「主要抗菌範圍為革蘭氏陰性菌」為錯誤描述。其他選項均正確：tilmicosin 對馬和人類有致命性心臟毒性（禁止對馬注射）；clarithromycin 用於犬貓分枝桿菌感染症；tylosin 可治療家禽 CRD（由 Mycoplasma gallisepticum 引起）。","we":["","此為正確描述：Tilmicosin 對馬（equine）靜脈注射可引起致命性心臟毒性（正性肌力抑制），對人類意外注射亦有嚴重心臟毒性風險，不符合題目問的「錯誤」描述。","此為正確描述：Clarithromycin 為半合成大環內酯類，對 Mycobacterium spp.（分枝桿菌）具有療效，臨床上確實用於犬貓分枝桿菌感染症的治療，不符合題目問的「錯誤」描述。","此為正確描述：Tylosin 為大環內酯類抗生素，對 Mycoplasma gallisepticum 有效，可用於治療家禽慢性呼吸道疾病（CRD），不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_062","year":2015,"roc_year":104,"session":"2","examNo":62,"q":"下列何者易在尿道中形成結石？","opts":["A. aminoglycosides","B. quinolones","C. aminocyclitols","D. sulfonamides"],"ans":3,"exp":"磺胺劑（sulfonamides）的主要不良反應之一為在尿液中形成結晶（crystalluria），進而導致泌尿道結石（urolithiasis）。磺胺劑及其代謝產物（尤其是乙醯化代謝物）水溶性低，在酸性或濃縮尿液中容易析出結晶，沉積於腎小管及膀胱，損傷泌尿道。預防方法包括充分補充水分及鹼化尿液。其他選項：aminoglycosides 腎毒性為直接腎小管損傷（非結石）；quinolones 偶有結晶尿但遠不如磺胺劑常見；aminocyclitols 腎毒性類似胺基醣苷類。","we":["錯誤：Aminoglycosides（胺基醣苷類）的腎毒性機制為藥物在近曲小管細胞中積聚，導致細胞壞死（tubular cell necrosis），表現為急性腎衰竭，並非形成結石於尿道中。","錯誤：Quinolones（喹諾酮類）雖偶有結晶尿報告，但形成泌尿道結石的臨床問題遠少於磺胺劑，不是以此為代表性副作用。","錯誤：Aminocyclitols（胺基環醇類，如 spectinomycin）腎毒性與胺基醣苷類相似，屬直接腎小管毒性，不以尿道結石形成為主要特徵。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_063","year":2015,"roc_year":104,"session":"2","examNo":63,"q":"下列何者可用於治療可產生β-lactamase的葡萄球菌之感染症？","opts":["A. penicillin G","B. penicillin V","C. ampicillin","D. oxacillin"],"ans":3,"exp":"β-Lactamase（青黴素酶）能水解 β-lactam 環，使青黴素類失去抗菌活性。能抵抗 β-lactamase 的青黴素稱為「耐青黴素酶青黴素（penicillinase-resistant penicillins）」，代表藥物為 oxacillin（及 methicillin、cloxacillin、dicloxacillin）。這類藥物因 β-lactam 環旁有大型空間阻隔基團，使 β-lactamase 無法靠近水解，因此可有效治療 β-lactamase 陽性的葡萄球菌（Staphylococcus spp.）感染。選項中 penicillin G、penicillin V、ampicillin 均對 β-lactamase 敏感，會被水解失效。","we":["錯誤：Penicillin G 為天然青黴素，對 β-lactamase 不穩定，β-lactamase 陽性的葡萄球菌（如 MRSA 前身）可水解其 β-lactam 環而產生抗藥性。","錯誤：Penicillin V（phenoxymethylpenicillin）為口服天然青黴素，同樣對 β-lactamase 敏感，無法用於 β-lactamase 陽性葡萄球菌的感染。","錯誤：Ampicillin 為廣效半合成青黴素，雖抗菌譜廣，但對 β-lactamase 同樣不穩定，β-lactamase 陽性菌株可輕易使其失效（除非與 clavulanate 合用）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_064","year":2015,"roc_year":104,"session":"2","examNo":64,"q":"下列何者不是細菌產生抗藥性的機制？","opts":["A. 微生物可產生使藥物失去活性的酵素","B. 藥物滲入或被攝入微生物內之量減少","C. 藥物之受體或結合部位的改變","D. 微生物產生二次代謝產物"],"ans":3,"exp":"細菌產生抗藥性的三大主要機制為：（A）產生使藥物失活的酵素（如 β-lactamase 水解 β-lactam 環、胺基醣苷修飾酵素）；（B）藥物滲透性降低或外排幫浦（efflux pump）增加，減少藥物進入菌體；（C）藥物作用靶位（receptor/target site）的改變（如 PBP 突變導致 β-lactam 結合力下降）。「產生二次代謝產物」並非已知的細菌抗藥性機制，屬於不正確的描述。","we":["此為正確描述：細菌可產生使藥物失活的酵素（如 β-lactamase、acetyltransferase），此為最重要的抗藥機制之一，不符合題目問的「不是」描述。","此為正確描述：藥物滲入或被攝入微生物內之量減少（通透性降低或主動外排），為細菌第二大抗藥機制，不符合題目問的「不是」描述。","此為正確描述：藥物作用靶位（如 PBP、核糖體 30S/50S 亞基、DNA gyrase 等）的突變或修飾，使藥物親和力下降，為重要抗藥機制，不符合題目問的「不是」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_065","year":2015,"roc_year":104,"session":"2","examNo":65,"q":"下列何者可以治療犬貓的原蟲感染症及厭氧菌所引起的腦膿腫和骨盆腔感染症？","opts":["A. vancomycin","B. apramycin","C. metronidazole","D. kanamycin"],"ans":2,"exp":"Metronidazole（甲硝唑）為硝基咪唑類（nitroimidazole）藥物，具有雙重抗菌效果：（1）抗原蟲（antiprotozoal）：對梨形鞭毛蟲（Giardia）、毛滴蟲（Trichomonas）等原蟲有效；（2）抗厭氧菌（anti-anaerobic bacteria）：對厭氧菌引起的腦膿腫（brain abscess）及骨盆腔感染症有效。Metronidazole 脂溶性高，能良好穿透血腦屏障，是厭氧菌性腦膿腫的重要治療選擇。其他選項：vancomycin 主要抗革蘭氏陽性菌（腦膿腫穿透力差）；apramycin 為胺基醣苷類（用於動物腸道）；kanamycin 為胺基醣苷類（對厭氧菌無效）。","we":["錯誤：Vancomycin 為糖肽類抗生素，主要對革蘭氏陽性菌有效，對厭氧菌效果有限，且穿透血腦屏障的能力不佳，不適用於厭氧菌性腦膿腫及原蟲感染。","錯誤：Apramycin 為胺基醣苷類抗生素，主要用於豬隻大腸桿菌腸炎的口服治療，對厭氧菌無效，對原蟲亦無治療作用。","","錯誤：Kanamycin 為胺基醣苷類抗生素，僅對需氧革蘭氏陰性及陽性菌有效，對厭氧菌完全無效（因胺基醣苷類需氧化磷酸化主動轉運進入菌體），亦不具抗原蟲活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_066","year":2015,"roc_year":104,"session":"2","examNo":66,"q":"Benzimidazoles對下列何種犬貓之寄生蟲無效？","opts":["A. 鞭蟲","B. 鈎蟲","C. 蛔蟲","D. 絲狀蟲"],"ans":3,"exp":"Benzimidazoles（苯并咪唑類，如 fenbendazole、albendazole、oxfendazole）的作用機制為抑制線蟲的 β-tubulin 聚合，對多種線蟲（蛔蟲、鈎蟲、鞭蟲等）及絛蟲有效，但對「絲狀蟲（filariasis，Dirofilaria immitis，犬心絲蟲）」無效。心絲蟲屬絲蟲目（Filarioidea），其生活史及組織分布特殊，苯并咪唑類無法有效對抗。因此選項 D「絲狀蟲」是 benzimidazoles 無效的寄生蟲。","we":["此為正確描述：Benzimidazoles 對犬貓鞭蟲（Trichuris spp.）有效，fenbendazole 等是鞭蟲感染的標準治療藥物，不符合題目問的「無效」描述。","此為正確描述：Benzimidazoles 對犬貓鈎蟲（Ancylostoma、Uncinaria spp.）有效，屬其正常抗蟲範疇，不符合題目問的「無效」描述。","此為正確描述：Benzimidazoles 對犬貓蛔蟲（Toxocara、Toxascaris spp.）有效，是廣泛應用的驅蛔蟲藥，不符合題目問的「無效」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_067","year":2015,"roc_year":104,"session":"2","examNo":67,"q":"能結合於黴菌細胞微管而抑制其有絲分裂的藥物是：","opts":["A. fluconazole","B. amphotericin B","C. flucytosine","D. griseofulvin"],"ans":3,"exp":"Griseofulvin（灰黃黴素）為天然抗黴菌藥，從 Penicillium griseofulvum 分離而得，其獨特作用機制為與黴菌細胞的微管蛋白（fungal tubulin，紡錘體蛋白）結合，干擾有絲分裂（mitosis）時紡錘體的形成，使皮黴菌（dermatophytes，如 Microsporum、Trichophyton、Epidermophyton）無法正常進行細胞分裂。Griseofulvin 沉積於新生角質組織中，抑制皮黴菌的繁殖，用於治療犬貓皮黴菌症。","we":["錯誤：Fluconazole 屬三唑類（triazole）抗黴菌藥，作用機制為抑制黴菌 CYP51（羊毛固醇去甲基酶），干擾麥角固醇合成，非透過微管結合抑制有絲分裂。","錯誤：Amphotericin B 屬多烯類（polyene）抗黴菌藥，作用機制為與黴菌細胞膜麥角固醇結合，形成孔道使離子滲漏，導致細胞死亡，非微管抑制機制。","錯誤：Flucytosine（5-fluorocytosine）在黴菌體內轉化為 5-fluorouracil，干擾 RNA 合成及 DNA 合成，屬核酸合成抑制劑，非透過微管結合發揮抗黴作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_068","year":2015,"roc_year":104,"session":"2","examNo":68,"q":"下列有關ivermectin中毒的敘述中，何者錯誤？","opts":["A. 促進GABA釋放而導致中樞神經被抑制","B. 橫臥或運動失調","C. 牧羊犬較易中毒","D. 瞳孔收縮"],"ans":3,"exp":"Ivermectin 中毒的正確臨床表現（A/B/C 均正確）：（A）ivermectin 促進神經末梢 GABA 釋放並增強 GABA 受體活性，導致中樞神經抑制；（B）因中樞神經抑制，動物表現橫臥（recumbency）及運動失調（ataxia）；（C）牧羊犬（Collies 及相關品種）因 MDR1 基因突變（P-glycoprotein 缺失），血腦屏障對 ivermectin 的外排功能喪失，藥物在 CNS 積聚，較其他犬種更易中毒。選項 D「瞳孔收縮（miosis）」錯誤——ivermectin 中毒實際上造成「瞳孔散大（mydriasis）」，因 GABA 介導的抑制作用作用於瞳孔括約肌及睫狀肌，導致散瞳。","we":["此為正確描述：Ivermectin 可促進 GABA 釋放及開放 GABA-gated Cl- 通道，導致中樞神經系統被抑制（CNS depression），不符合題目問的「錯誤」描述。","此為正確描述：Ivermectin 中毒因中樞抑制，動物會出現橫臥（recumbency）及運動失調（ataxia）等神經症狀，不符合題目問的「錯誤」描述。","此為正確描述：Collie 及相關牧羊犬品種因 MDR1/ABCB1 基因突變，缺乏功能性 P-glycoprotein，ivermectin 無法被有效排出血腦屏障，較一般犬種明顯更易中毒，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_069","year":2015,"roc_year":104,"session":"2","examNo":69,"q":"作用機制為干擾β-tubulins的聚合作用而抑制線蟲細胞微管生成的藥物是：","opts":["A. levamizole","B. oxfendazole","C. pyrantel","D. ivermectin"],"ans":1,"exp":"Oxfendazole 屬苯并咪唑類（benzimidazole）驅蟲藥，其作用機制為選擇性結合線蟲的 β-tubulin 蛋白，抑制 β-tubulin 聚合成微管（microtubule polymerization），從而破壞線蟲細胞骨架及有絲分裂功能，影響葡萄糖攝取及能量代謝，最終導致線蟲麻痺死亡。此機制對宿主（哺乳動物）毒性低，因為哺乳動物 tubulin 與苯并咪唑的親和力遠低於線蟲 tubulin。","we":["錯誤：Levamisole（左旋咪唑）的作用機制為對線蟲膽鹼性神經肌肉接合點的菸鹼受體（nicotinic ACh receptor）具促效活性，造成持續去極化和肌肉麻痺，與 β-tubulin 抑制無關。","","錯誤：Pyrantel 為去極化神經肌肉阻斷劑（depolarizing neuromuscular blocking agent），作用於線蟲的菸鹼型乙醯膽鹼受體，造成蠕蟲痙攣性麻痺，不透過 β-tubulin 聚合抑制作用。","錯誤：Ivermectin 的作用機制為促進 GABA 釋放及開放 GABA-gated Cl- 通道（glut-1 受體），導致線蟲超極化（hyperpolarization）而麻痺，不透過 β-tubulin 作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_070","year":2015,"roc_year":104,"session":"2","examNo":70,"q":"用於治療爬蟲類腸道黴菌感染，下列何者最佳？","opts":["A. nystatin","B. cypermethrin","C. bromide","D. cyclosporine"],"ans":0,"exp":"Nystatin（制黴菌素）為多烯類（polyene）抗黴菌藥，口服後幾乎完全不吸收（non-absorbable），藥物停留在腸道腔中，可有效對抗腸道黴菌（如 Candida spp.）。爬蟲類（如蛇、蜥蜴）腸道黴菌感染（intestinal yeast infection）常以 nystatin 口服治療，因其局部腸道作用佳且全身毒性極低。其他選項：cypermethrin 為拟除蟲菊酯類殺蟲劑；bromide 為抗癲癇藥；cyclosporine 為免疫抑制劑，均非抗黴菌藥。","we":["","錯誤：Cypermethrin 為第二代拟除蟲菊酯類（pyrethroid）殺蟲劑，主要用於外寄生蟲防治（如蜱、蚤、蠅），不具抗黴菌（antifungal）活性，不用於腸道黴菌感染治療。","錯誤：Bromide（如 potassium bromide）為氯離子通道（GABA-A 受體）的輔助激活劑，具有抗癲癇作用，用於犬貓癲癇的控制，與黴菌感染治療無關。","錯誤：Cyclosporine 為鈣調磷酸酶抑制劑（calcineurin inhibitor），具強效免疫抑制及抗發炎作用，用於器官移植排斥反應或過敏性皮膚炎，不具抗黴菌活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_071","year":2015,"roc_year":104,"session":"2","examNo":71,"q":"下列何者可用於豬球蟲症？","opts":["A. sulfadiazine","B. rotenone","C. pyrantel","D. epsiprantel"],"ans":0,"exp":"豬球蟲症（porcine coccidiosis）主要由 Isospora suis（現更名 Cystoisospora suis）或 Eimeria spp. 引起。磺胺劑（sulfonamides）如 sulfadiazine 為傳統的抗球蟲用藥，藉由競爭性抑制二氫蝶酸合成酶（dihydropteroate synthase），阻斷球蟲葉酸的合成，抑制其繁殖。Sulfadiazine 可與 trimethoprim 複方使用以增強療效，是豬球蟲症及其他動物球蟲症的常用治療選擇。","we":["","錯誤：Rotenone 為魚藤酮，一種天然殺蟲劑（mitochondrial complex I inhibitor），用於外寄生蟲防治或魚類毒殺，不具抗球蟲（anticoccidial）活性。","錯誤：Pyrantel 為驅線蟲藥（菸鹼受體促效劑），對腸道線蟲（蛔蟲、鈎蟲等）有效，對球蟲（頂複合體原蟲）無治療活性。","錯誤：Epsiprantel 為絛蟲特效驅蟲藥（用於犬貓絛蟲），對球蟲無效，其作用機制為干擾絛蟲的鈣離子通透性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_072","year":2015,"roc_year":104,"session":"2","examNo":72,"q":"下列何者可以驅除羊擴張絛蟲？","opts":["A. niclosamide","B. clorsulon","C. dichlorvos","D. amicarbalide"],"ans":0,"exp":"Niclosamide（氯硝柳胺）為鹵代水楊醯苯胺類（halogenated salicylanilide）驅絛蟲藥，其作用機制為抑制絛蟲粒線體的氧化磷酸化（oxidative phosphorylation）及 ATP 合成，使絛蟲因能量耗竭而死亡。Niclosamide 口服後在腸道局部作用（吸收少），有效驅除羊擴張絛蟲（Moniezia expansa）及多種絛蟲感染。其他選項：clorsulon 為抗肝蛭藥、dichlorvos 為有機磷殺蟲劑（驅線蟲/外寄生蟲）、amicarbalide 為抗梨形蟲藥（antibabesial），均非絛蟲驅蟲藥。","we":["","錯誤：Clorsulon 為苯磺醯胺類（benzenesulfonamide）驅蟲藥，專門用於驅除肝臟吸蟲（Fasciola hepatica，肝蛭），不具驅絛蟲活性。","錯誤：Dichlorvos 為有機磷殺蟲劑，具膽鹼酯酶抑制活性，可驅除部分線蟲及外寄生蟲，不作為絛蟲的標準治療藥物。","錯誤：Amicarbalide 為二脒類（diamidine）抗原蟲藥，主要用於牛羊梨形蟲症（babesiosis）的治療，對絛蟲無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_073","year":2015,"roc_year":104,"session":"2","examNo":73,"q":"牛群中一頭檢出Echinococcus的中間包蟲（hydatid）囊體，其餘牛隻應選下列何者來治療？","opts":["A. dopamine","B. cimetidine","C. fenbendazole","D. phenylbutazone"],"ans":2,"exp":"Echinococcus（包蟲，棘球蚴）引起的包蟲病（hydatid disease/echinococcosis），其中間宿主（牛、羊、豬、人）組織中形成包囊（hydatid cysts）。治療選擇為 fenbendazole（苯并咪唑類），或其親緣藥物 albendazole，藉由抑制 β-tubulin 聚合及破壞包蟲的微管結構，干擾葡萄糖吸收，使包蟲原頭節（protoscoleces）死亡或退化，縮小囊體。Fenbendazole 為獸醫臨床中用於此目的的標準選擇。","we":["錯誤：Dopamine 為兒茶酚胺類神經傳遞物質，用於心臟及腎臟衰竭的支持性治療，不具任何抗寄生蟲活性，不用於包蟲病治療。","錯誤：Cimetidine 為 H2 受體拮抗劑，用於抑制胃酸分泌及治療消化性潰瘍，與寄生蟲治療無關。","","錯誤：Phenylbutazone 為吡唑酮類（pyrazolone）NSAIDs，用於犬、馬的消炎止痛，不具驅蟲活性，不用於包蟲病治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_074","year":2015,"roc_year":104,"session":"2","examNo":74,"q":"下列何者不是皮黴菌症之外用藥？","opts":["A. 硫磺石灰","B. chlorhexidine","C. meloxicam","D. sodium hypochlorite"],"ans":2,"exp":"皮黴菌症（dermatophytosis，俗稱「ringworm」，由 Microsporum 或 Trichophyton 引起）的外用抗黴菌治療藥物包括：硫磺石灰（sulfurated lime/lime sulfur dip，A）、chlorhexidine（氯己定，B，具廣效抗黴活性）、sodium hypochlorite（次氯酸鈉，D，稀釋後具抗黴作用）。選項 C「meloxicam」為 NSAIDs（非類固醇消炎藥），作用機制為抑制 COX-2，具抗發炎止痛作用，完全不具抗黴菌活性，不用於皮黴菌症的治療。","we":["此為正確描述：硫磺石灰（sulfurated lime，lime sulfur dip）為傳統的外用抗黴菌及抗寄生蟲藥，對皮黴菌症有效，確實是皮黴菌症的外用藥，不符合題目問的「不是」描述。","此為正確描述：Chlorhexidine 為雙胍類消毒防腐藥，對皮黴菌（dermatophytes）有一定抑制活性，常製成沐浴乳或噴劑用於皮黴菌症的輔助治療，不符合題目問的「不是」描述。","","此為正確描述：Sodium hypochlorite（次氯酸鈉）稀釋液（1:32 稀釋）對皮黴菌具殺黴活性，可用於環境消毒及動物局部外用，不符合題目問的「不是」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_075","year":2015,"roc_year":104,"session":"2","examNo":75,"q":"下列有關牛尿素中毒的敘述，何者錯誤？","opts":["A. 中毒病牛全身痙攣，瘤胃臌脹","B. 尿素中毒，易引發酮血症","C. 灌服醋酸溶液，可降低ammonia的吸收","D. 瘤胃的酸化，可降低urease的活性"],"ans":1,"exp":"牛尿素中毒的機制：飼料中過量尿素在瘤胃微生物（urease）作用下迅速分解產生大量氨（ammonia），氨快速吸收進入血液造成「高血氨症（hyperammonemia）」，引起全身痙攣、瘤胃臌脹、運動失調等神經症狀。選項 B「尿素中毒易引發酮血症（ketosis）」為錯誤描述——酮血症為能量負平衡時（如產後期或飢餓）脂肪動員過度，酮體（acetoacetate、β-hydroxybutyrate）積聚的代謝病，與尿素/氨中毒的機制完全不同。選項 A、C、D 均為正確的牛尿素中毒相關知識。","we":["此為正確描述：尿素中毒的牛確實表現全身性痙攣（convulsions）及瘤胃臌脹（rumen bloat），因大量氨吸收引發神經症狀及瘤胃發酵異常，不符合題目問的「錯誤」描述。","","此為正確描述：灌服醋酸溶液（acetic acid）可酸化瘤胃環境，降低 pH 值，抑制 urease 活性及氨的吸收（NH3 在酸性下轉化為 NH4+ 減少吸收），為牛尿素中毒的急救措施，不符合題目問的「錯誤」描述。","此為正確描述：瘤胃酸化（如灌服醋酸、稀鹽酸）可降低 urease 活性，進而減緩尿素分解為氨的速率，是預防及治療尿素中毒的重要原則，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_076","year":2015,"roc_year":104,"session":"2","examNo":76,"q":"下列何者可用於治療犬隻銅中毒？","opts":["A. penicillamine","B. glucagon","C. nicotinamide","D. thiosulfate"],"ans":0,"exp":"Penicillamine（青黴胺）為強效金屬螯合劑（chelating agent），能與銅（Cu2+）、鉛（Pb2+）、汞（Hg2+）、鐵等重金屬形成穩定水溶性螯合物，透過尿液排泄。治療犬隻銅中毒（copper toxicosis）首選 penicillamine，尤其用於遺傳性肝臟銅蓄積症（如 Bedlington Terrier 的遺傳性銅肝病、Labrador 的銅相關性肝炎），可有效螯合並排除肝臟中過量積聚的銅，延緩肝硬化的進展。","we":["","錯誤：Glucagon 為胰臟 α 細胞分泌的升糖激素，主要用於低血糖症急救或 β-blocker/calcium channel blocker 過量中毒的心臟支持治療，不具銅螯合作用。","錯誤：Nicotinamide（菸鹼醯胺，維生素 B3 的醯胺形式）為 NAD+ 前驅物，具代謝功能，不具金屬螯合活性，不用於銅中毒治療。","錯誤：Thiosulfate（硫代硫酸鈉）主要用於氰化物（cyanide）中毒的解毒（將氰基轉化為無毒的硫氰酸鹽），對銅中毒無直接螯合療效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_077","year":2015,"roc_year":104,"session":"2","examNo":77,"q":"有機氯殺蟲劑在動物體組織器官主要儲存於：","opts":["A. 脂肪","B. 肝臟","C. 骨骼","D. 肌肉"],"ans":0,"exp":"有機氯殺蟲劑（organochlorine insecticides，如 DDT、lindane、chlordane、dieldrin）具有高度脂溶性（highly lipophilic），口服或皮膚吸收後在體內分布，優先蓄積於脂肪組織（adipose tissue）中，形成生物累積（bioaccumulation）。由於有機氯在脂肪中半衰期極長，持久性有機污染物（POPs）的特性使其在食物鏈中逐級濃縮（biomagnification）。這也是有機氯農藥在許多國家被禁止使用的主要環境和毒理學原因。","we":["","錯誤：肝臟雖是有機氯代謝的主要器官（氧化脫氯、羥基化等），但有機氯的蓄積部位主要是脂肪組織，而非肝臟。肝臟中的代謝物通常水溶性較高，較易排除。","錯誤：骨骼是鉛（Pb）等重金屬的主要蓄積部位（以羥磷灰石形式），有機氯殺蟲劑並不優先蓄積於骨骼組織，因骨骼缺乏大量脂質。","錯誤：肌肉組織雖含有一定脂質，但比例遠低於脂肪組織（adipose tissue），有機氯殺蟲劑優先蓄積於富含脂質的白色脂肪組織，而非肌肉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_078","year":2015,"roc_year":104,"session":"2","examNo":78,"q":"犬、貓及犢牛的有機汞中毒症狀為：","opts":["A. 抑鬱","B. 興奮","C. 鎮靜","D. 沉睡"],"ans":1,"exp":"有機汞（organic mercury，如甲基汞 methylmercury）中毒在犬、貓及犢牛中的主要臨床症狀為「興奮（excitement）」相關的神經症狀，包括：震顫（tremors）、驚厥（convulsions）、感覺過敏（hyperexcitability）、共濟失調（ataxia）及視力障礙。有機汞進入 CNS 後，破壞神經元的氧化磷酸化及細胞膜功能，導致大腦皮質及小腦神經元興奮性增高。此與無機汞（inorganic mercury）中毒主要以腎毒性為主的表現不同。","we":["錯誤：抑鬱（depression）是無機汞或其他系統性毒物中毒的表現之一，有機汞（甲基汞）中毒的神經症狀以「興奮性」為主要特徵，而非抑鬱。","","錯誤：鎮靜（sedation）通常為 CNS 抑制劑（如鎮靜藥、有機磷農藥某些劑量）中毒的表現，有機汞中毒引起 CNS 興奮，與鎮靜相反。","錯誤：沉睡（somnolence）為 CNS 嚴重抑制的表現，有機汞中毒的主要神經症狀為興奮、震顫及痙攣，而非沉睡。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_079","year":2015,"roc_year":104,"session":"2","examNo":79,"q":"下列何者最適合使用於控制心跳過快之心律不整？","opts":["A. propranolol","B. yohimbine","C. doxapram","D. terbutaline"],"ans":0,"exp":"Propranolol 為非選擇性 β-腎上腺素受體拮抗劑（non-selective β-blocker），同時阻斷 β1 及 β2 受體。β1 受體位於心臟竇房結（SA node）及房室結（AV node），受阻後可降低心率（negative chronotropy）及傳導速度（negative dromotropy），有效減慢過快的心率，控制心搏過快的心律不整（如心房顫動、陣發性上心室性頻脈等）。其他選項：yohimbine 為 α2 拮抗劑（拮抗鎮靜）；doxapram 為呼吸興奮劑；terbutaline 為 β2 促效劑（支氣管擴張，反而加速心率）。","we":["","錯誤：Yohimbine 為 α2-腎上腺素受體拮抗劑，主要用於逆轉 α2-促效劑（如 xylazine）的鎮靜效果，不具控制心律不整的作用，且理論上拮抗 α2 後可能反射性增加心率。","錯誤：Doxapram 為呼吸興奮劑（respiratory stimulant），主要作用於頸動脈化學受體及延腦呼吸中樞，用於呼吸抑制的急救，不用於心律不整控制。","錯誤：Terbutaline 為選擇性 β2-腎上腺素受體促效劑，主要用於支氣管擴張（氣喘/支氣管痙攣），其 β1 效應可能導致心率加快（tachycardia），與控制心搏過快的目標相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_藥理_1042_080","year":2015,"roc_year":104,"session":"2","examNo":80,"q":"下列何者最適合使用於擴張氣管平滑肌以減輕氣管之痙攣？","opts":["A. neostigmine","B. yohimbine","C. epinephrine","D. doxapram"],"ans":2,"exp":"Epinephrine（腎上腺素）對支氣管平滑肌的主要作用：激活 β2-腎上腺素受體（β2-adrenoceptors），活化腺苷酸環化酶（adenylyl cyclase）→ 增加細胞內 cAMP → 活化 PKA → 使平滑肌細胞肌凝蛋白輕鏈激酶（MLCK）磷酸化失活，導致支氣管平滑肌鬆弛（bronchodilation），有效緩解支氣管痙攣（bronchospasm）及過敏反應（anaphylaxis）引起的氣道收縮。Epinephrine 同時具有 α1 及 β1 效應，但在氣管治療方面以 β2 擴張效果最重要。","we":["錯誤：Neostigmine 為可逆性膽鹼酯酶抑制劑（cholinesterase inhibitor），會增加乙醯膽鹼（ACh）濃度，ACh 作用於支氣管平滑肌的 M3 受體，導致支氣管「收縮」（bronchoconstriction），與治療支氣管痙攣的目標完全相反。","錯誤：Yohimbine 為 α2-腎上腺素受體拮抗劑，主要用於逆轉 α2-促效劑的鎮靜作用，不具直接的支氣管擴張活性，不作為支氣管痙攣的治療藥物。","","錯誤：Doxapram 為呼吸興奮劑，作用於頸動脈化學受體及延腦呼吸中樞，增加呼吸頻率及深度，不具直接的支氣管平滑肌擴張作用，不用於支氣管痙攣的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_001","year":2016,"roc_year":105,"session":"1","examNo":1,"q":"下列給藥方式中，何者開始產生作用（onset）時間最慢？","opts":["A. 靜脈注射","B. 肌肉注射","C. 腹腔注射","D. 皮下注射"],"ans":3,"exp":"各給藥途徑中，開始產生作用（onset）的速度由快到慢依序為：靜脈注射（IV）最快（直接入血）→ 腹腔注射（IP）次之（腹膜血管豐富，吸收快）→ 肌肉注射（IM）→ 皮下注射（SC）最慢。皮下組織血管分布較少，藥物需先由皮下擴散至微血管才能進入循環，吸收速率最低，因此 onset 時間最長。","we":["此為正確描述：靜脈注射直接將藥物送入血流，無需吸收步驟，onset 最快，不符合題目問的「onset 最慢」描述。","此為正確描述：肌肉注射部位血管豐富，吸收速率快於皮下注射，onset 較皮下注射快，不符合題目問的「最慢」描述。","此為正確描述：腹腔注射因腹膜面積大且血管豐富，吸收速率接近靜脈注射，onset 極快，不符合題目問的「最慢」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_002","year":2016,"roc_year":105,"session":"1","examNo":2,"q":"假設某藥物從血漿中排除的速率是一階次動力反應（first-order kinetics），該藥物以靜脈輸\r 注（intravenous infusion）投予，當輸注速率及輸注液中藥物濃度均加倍時，對該藥物之穩 定血中濃度（steady-state plasma concentration）的影響為何？","opts":["A. 約降低至原先一半","B. 約降低至原先四分之一","C. 約上升至原先的四倍","D. 無影響"],"ans":2,"exp":"以一階次動力學排除的藥物，穩定血中濃度（Css）的計算公式為：Css = 輸注速率（delivery rate）／廓清率（CL）。輸注速率 = 輸注速率（volume/time） × 藥物濃度（amount/volume）。當輸注速率（volume rate）加倍且濃度也加倍，delivery rate 變為原來的 4 倍（2 × 2 = 4）。在 CL 不變的前提下，Css 亦上升至原先的 4 倍。","we":["錯誤：若 delivery rate 增加 4 倍而 CL 不變，Css 應上升至 4 倍；Css 降低至一半代表 delivery rate 減半，與題目條件相反。","錯誤：Css 降低至四分之一代表 delivery rate 減少至四分之一，與同時加倍速率與濃度（共 4 倍增加）的條件矛盾。","","錯誤：Css 不受影響只有在 delivery rate 維持不變時才成立；本題 delivery rate 增加 4 倍，Css 必然改變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_003","year":2016,"roc_year":105,"session":"1","examNo":3,"q":"下列何種受體活化後會進入細胞核，影響基因的轉錄（transcription）？","opts":["A. 配位體驅動式離子通道型（ligand-gated ion channels）的受體","B. 改變GTP-接合蛋白（GTP-binding proteins）活性的受體","C. 激酶所連接的受體（kinase-linked receptors）","D. 細胞內的受體（intracellular receptors）"],"ans":3,"exp":"細胞內受體（intracellular receptors），又稱核受體（nuclear receptors），位於細胞質或細胞核內。脂溶性配體（如類固醇激素、甲狀腺素、維生素 D、維生素 A 衍生物）擴散穿過細胞膜後與之結合，形成受體—配體複合物，再進入（或留在）細胞核與特定 DNA 序列（hormone response elements）結合，直接調控目標基因的轉錄（transcription），影響蛋白質合成。此類受體的特點是反應較慢（數小時），但效果持久。","we":["錯誤：配體驅動式離子通道型受體（ligand-gated ion channels）活化後直接改變細胞膜對離子的通透性，使離子流入或流出，反應速度以毫秒計，不進入細胞核，與基因轉錄無直接關係。","錯誤：G蛋白偶合受體（GPCR）活化後透過第二傳訊者（cAMP、IP3 等）調節細胞功能，訊號傳遞在細胞質層次，雖可間接影響基因表現，但受體本身不進入細胞核。","錯誤：激酶連接受體（kinase-linked receptors，如受體型酪胺酸激酶 RTK）活化後磷酸化下游蛋白，可透過多步訊號轉導影響基因表現，但受體本身位於細胞膜，不直接進入細胞核調控轉錄。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_004","year":2016,"roc_year":105,"session":"1","examNo":4,"q":"藥物與組織之結合機制中，那一種結合可能造成組織殘留期間最長？","opts":["A. 共價鍵","B. 氫鍵","C. 離子鍵","D. 凡得瓦爾力"],"ans":0,"exp":"藥物與組織結合的化學鍵中，共價鍵（covalent bond）的鍵能最強（約 200–400 kJ/mol），幾乎為不可逆結合。藥物一旦以共價鍵與組織蛋白或 DNA 結合，須等目標分子（如酶蛋白）被重新合成後藥效才消失，因此殘留期間最長。例如不可逆性有機磷農藥抑制乙醯膽鹼酯酶，即屬共價鍵結合。相比之下，氫鍵、離子鍵及凡得瓦爾力均為弱鍵，可迅速解離。","we":["","錯誤：氫鍵的鍵能約為 10–40 kJ/mol，屬弱交互作用，易受溫度、競爭性分子或 pH 改變而斷裂，結合為可逆性，組織殘留期遠短於共價鍵。","錯誤：離子鍵（electrostatic interaction）可被高鹽環境或 pH 改變（影響解離程度）而破壞，結合亦屬可逆性，殘留期短於共價鍵。","錯誤：凡得瓦爾力（van der Waals force）是最弱的分子間作用力（<5 kJ/mol），只有在分子極度貼近時才顯現，極易解離，對組織殘留貢獻最小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_005","year":2016,"roc_year":105,"session":"1","examNo":5,"q":"當一個藥物與血漿蛋白高度結合且不易解離時，其意義最可能為：","opts":["A. 藥物具有很好之生體可利用率","B. 藥物之排除主要透過腎臟濾過","C. 藥物主要經過肝臟代謝排除","D. 藥物分布容積近似血漿容積"],"ans":3,"exp":"藥物分布容積（Vd）反映藥物在體內的分布程度。當藥物與血漿蛋白高度結合且不易解離時，大量藥物被「鎖定」在血管內（與白蛋白等結合），游離型藥物無法自由擴散至組織，導致藥物主要停留在血漿中。此時 Vd ≈ 血漿容積（約 0.04–0.05 L/kg），Vd 很小。反之，高度分布至組織的藥物 Vd 會遠超過體液總量。","we":["錯誤：高血漿蛋白結合率不等於良好的生體可利用率（bioavailability）；高蛋白結合反而會降低游離藥物濃度，可能減少進入組織的量；口服生體可利用率主要受腸道吸收及首渡效應影響。","錯誤：高度蛋白結合的藥物，游離型濃度低，腎臟濾過量少（腎臟只能濾過游離型藥物），反而不利於腎臟排除；主要排除途徑不能簡單歸因於蛋白結合率。","錯誤：藥物的主要排除途徑（肝臟代謝 vs. 腎臟排除）取決於藥物的極性、分子量及肝臟萃取率等因素，不能直接由血漿蛋白結合率推斷。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_006","year":2016,"roc_year":105,"session":"1","examNo":6,"q":"下列何者最易擴散通過生物細胞膜之脂質結構？","opts":["A. 解離態之弱鹼藥物","B. 非解離態之弱酸藥物","C. 四級銨類藥物","D. 胺基醣苷類抗生素"],"ans":1,"exp":"生物細胞膜由磷脂雙層組成，脂溶性高（非極性）的分子最易以被動擴散方式穿透。弱酸藥物在非解離態（protonated form）時呈電中性，親脂性高，最容易擴散通過脂質膜。根據 Henderson-Hasselbalch 方程式，弱酸在 pH 低於 pKa 的環境下非解離態比例增加，更利於跨膜擴散。","we":["錯誤：解離態弱鹼（帶正電荷）在水溶液中具親水性，脂溶性低，不易穿透細胞膜脂質雙層，擴散能力最差。","","錯誤：四級銨類藥物（如新斯的明、琥珀膽鹼）永遠帶正電荷（不受 pH 影響），極性強，幾乎不能穿透脂質膜，吸收差，且無法通過血腦屏障。","錯誤：胺基醣苷類抗生素（aminoglycosides，如慶大黴素）為極性大分子，帶多個正電荷，水溶性高、脂溶性極低，無法有效穿透細胞膜脂質雙層，需依賴主動轉運進入細菌細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_007","year":2016,"roc_year":105,"session":"1","examNo":7,"q":"當腎臟之廓清率為一定值時，則藥物之排除速率（elimination rate）與下列何者之變化成正\r 比？","opts":["A. 生體利用率","B. 藥物之半衰期","C. 血漿藥物濃度","D. 藥物之親脂性"],"ans":2,"exp":"一階次動力學（first-order kinetics）的核心定義是：在任一時間點，藥物排除速率與當時血漿藥物濃度成正比，即 elimination rate = CL × Cp。當腎臟廓清率（CL）為一定值時，排除速率直接隨血漿藥物濃度的變化而成正比變化——濃度愈高，排除速率愈快；濃度減半，排除速率亦減半。","we":["錯誤：生體可利用率（bioavailability）影響藥物進入體循環的總量，與排除速率的「即時」成正比關係無關；廓清率一定時，決定排除速率的是當下的血漿濃度。","錯誤：藥物半衰期（t½ = 0.693 × Vd / CL）在分布容積與廓清率不變時為常數，本身不隨時間改變，不是排除速率的比例因子。","","錯誤：藥物的親脂性（lipophilicity）影響分布容積及穿透細胞膜的能力，是藥物固有的理化性質，不隨血漿濃度動態變化，因此不是排除速率的比例因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_008","year":2016,"roc_year":105,"session":"1","examNo":8,"q":"有關tramadol的敘述，下列何者錯誤？","opts":["A. 是一個合成的µ受體致效劑","B. 會抑制血清素和正腎上腺素的再回收","C. 可做為止痛劑","D. 做為止咳劑時主要以靜脈注射投予"],"ans":3,"exp":"Tramadol 是合成的 µ 受體部分致效劑，同時抑制血清素與正腎上腺素的再回收，具有中樞性止痛及止咳作用。做為止咳藥使用時，tramadol 主要以「口服」途徑給藥，而非靜脈注射；靜脈注射 tramadol 主要用於急性疼痛或術後止痛的情境，並非止咳的標準給藥方式。","we":["此為正確描述：tramadol 確實是一個合成的 µ 受體（部分）致效劑，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：tramadol 確實透過抑制突觸前血清素（serotonin）及正腎上腺素（norepinephrine）再回收而增強下行抑制性疼痛調控，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：tramadol 具有止痛作用，臨床上廣泛用於中度疼痛的治療，此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_009","year":2016,"roc_year":105,"session":"1","examNo":9,"q":"以下藥物，何者因為其止痛活性效果最強而最適合肌肉注射使用於保定大型野生動物？","opts":["A. butorphanol","B. meperidine","C. hydromorphone","D. carfentanil"],"ans":3,"exp":"Carfentanil 是目前已知效力最強的阿片類藥物，其止痛效力約為嗎啡（morphine）的 10,000 倍，也是 fentanyl 的 100 倍。正因其超高效力，僅需極微量（微克級）即可達到強力保定效果，適合以肌肉注射（IM）方式遠距離飛鏢射擊大型野生動物（如大象、犀牛、麋鹿），故為大型野生動物保定的首選藥物。","we":["錯誤：butorphanol 為 κ 受體致效劑暨 µ 受體部分拮抗劑，止痛效力約為嗎啡的 3–5 倍，止痛活性遠低於 carfentanil，不適合用於需要極高效力的大型野生動物保定。","錯誤：meperidine（pethidine）止痛效力僅約嗎啡的 1/10，且作用時間短，不適合大型野生動物保定；大劑量注射亦可能造成興奮性毒性（癲癇）。","錯誤：hydromorphone 止痛效力約為嗎啡的 5–10 倍，雖強於嗎啡，但與 carfentanil 的 10,000 倍差距甚遠，不足以用於超大型野生動物的遠距飛鏢保定。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_010","year":2016,"roc_year":105,"session":"1","examNo":10,"q":"下列有關吸入性麻醉劑最小肺泡濃度（minimum alveolar concentration，MAC）的敘述，何\r 者錯誤？","opts":["A. 此係數與麻醉劑的potency有關","B. MAC愈大藥效強度愈強","C. 麻醉期長短對MAC無影響","D. 此係數與麻醉劑的理化性質有關"],"ans":1,"exp":"最小肺泡濃度（MAC）定義為：在 1 大氣壓下，50% 動物對標準外科刺激（切皮）不產生體動反應時，吸入性麻醉劑在肺泡中的濃度。MAC 與藥效強度（potency）呈「反比」關係——MAC 愈大，代表需要愈多劑量才能達到麻醉效果，即藥效愈弱（potency 愈低）。例如，異氟烷（isoflurane）MAC 約 1.3%，笑氣（N₂O）MAC > 100%，後者藥效遠弱於前者。","we":["此為正確描述：MAC 確實與麻醉劑的 potency（藥效強度）有關，兩者成反比；此描述本身正確，不符合題目問的「錯誤」描述。","","此為正確描述：MAC 反映麻醉劑的固有理化性質（主要是脂溶性，與 Meyer-Overton 假說相關），麻醉期長短不會改變 MAC 值；此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：MAC 確實與麻醉劑的理化性質（脂溶性、沸點等）高度相關，油/氣分配係數（oil:gas partition coefficient）愈高，MAC 愈低；此描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_011","year":2016,"roc_year":105,"session":"1","examNo":11,"q":"以下那一藥物最適用於長期控制癲癇之發作？","opts":["A. ketamine","B. xylazine","C. phenobarbital","D. pentobarbital"],"ans":2,"exp":"Phenobarbital 是巴比妥類藥物，透過加強 GABA-A 受體功能、增加氯離子通道開放時間，產生中樞抑制及抗癲癇效果。它口服生體可利用率高、半衰期長（犬約 40–90 小時）、可每日 1–2 次給藥，且費用低廉，是犬長期抗癲癇治療的首選藥物。臨床上常見犬服用 phenobarbital 多年控制特發性癲癇，但需定期監測血中濃度及肝功能。","we":["錯誤：ketamine 是 NMDA 受體拮抗劑，主要用於短效全身麻醉及誘導麻醉；它本身可能誘發或加重某些動物的癲癇活動，不適合用於長期癲癇控制。","錯誤：xylazine 是 α2 腎上腺素受體致效劑，用於鎮靜和肌肉鬆弛（保定），無有效的抗癲癇作用，不用於長期癲癇治療。","","錯誤：pentobarbital 是短效巴比妥類藥物，半衰期短，主要用於急性癲癇重積狀態（status epilepticus）的靜脈緊急處置或安樂死，不適合長期口服維持治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_012","year":2016,"roc_year":105,"session":"1","examNo":12,"q":"以下藥物，何者臨床上可用於逆轉先前給與morphine後之鎮靜及呼吸抑制，但仍然可維持一\r 些止痛作用？","opts":["A. butorphanol","B. naloxone","C. xylazine","D. methadone"],"ans":0,"exp":"Butorphanol 是 κ 受體完全致效劑（agonist）暨 µ 受體部分拮抗劑（partial antagonist）。給予 morphine 後再注射 butorphanol，butorphanol 競爭性排除 µ 受體上的 morphine，減少 µ 受體介導的深度鎮靜及呼吸抑制；同時 butorphanol 作用於 κ 受體，仍能維持一定程度的止痛效果。因此，它是唯一能「部分逆轉」opioid 副作用同時「保留部分鎮痛」的藥物。","we":["","錯誤：naloxone 是純 µ、κ、δ 受體拮抗劑，可完全逆轉 morphine 所有效應（鎮靜、呼吸抑制及止痛），但也會同時消除止痛作用，無法「維持止痛」。","錯誤：xylazine 是 α2 腎上腺素受體致效劑，本身具有鎮靜與肌肉鬆弛效果，無法逆轉 morphine 的 µ 受體作用，反而可能加重鎮靜，不適合此目的。","錯誤：methadone 是 µ 受體完全致效劑，與 morphine 作用相似，無法逆轉 morphine 的鎮靜或呼吸抑制，只會延續或加強效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_013","year":2016,"roc_year":105,"session":"1","examNo":13,"q":"下列何者不適合應用於全身性麻醉？","opts":["A. phenobarbital","B. thiopental","C. methohexital","D. pentobarbital"],"ans":0,"exp":"Phenobarbital 是長效型巴比妥類藥物，因其具有抗癲癇作用且效力較弱，臨床上用於長期口服控制癲癇，而不用於全身麻醉（general anesthesia）的誘導或維持。全身麻醉用巴比妥類藥物需具備快速起效、短效（便於調控麻醉深度）等特性，如 thiopental（超短效，靜脈注射誘導）、methohexital（超短效）及 pentobarbital（短效）。Phenobarbital 起效慢、半衰期長（犬達 40–90 小時），不適合麻醉用途。","we":["","此為正確描述：thiopental（硫噴妥鈉）是超短效巴比妥類靜脈麻醉藥，廣泛用於全身麻醉的靜脈誘導，適合全身麻醉，不符合題目問的「不適合」描述。","此為正確描述：methohexital 是超短效巴比妥類靜脈麻醉藥，作用時間極短，適合靜脈誘導麻醉，不符合題目問的「不適合」描述。","此為正確描述：pentobarbital 是短效巴比妥類藥物，可靜脈注射用於全身麻醉（尤其嚙齒類及鳥類研究動物），不符合題目問的「不適合」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_014","year":2016,"roc_year":105,"session":"1","examNo":14,"q":"麻醉犬靜脈注射少量acetylcholine（10 µg/kg）後之藥理反應為何？","opts":["A. 心跳加快","B. 血壓下降","C. 抑制胃腸蠕動","D. 興奮自主神經節"],"ans":1,"exp":"低劑量 acetylcholine（ACh）靜脈注射後，主要作用於血管內皮細胞的 M3 毒蕈鹼受體，促進一氧化氮（NO）及前列環素（prostacyclin）的釋放，導致血管平滑肌舒張（vasodilation）→ 外周血管阻力下降 → 血壓下降。此反應為 atropine 敏感性，高劑量 ACh 才會同時刺激菸鹼受體（N 受體）使心跳加快。麻醉狀態下 ACh 分解緩慢（麻醉藥抑制 AChE），效果更明顯。","we":["錯誤：心跳加快是 ACh 高劑量（或直接注入冠狀竇時）刺激 N 受體及節後交感神經的反應；低劑量靜脈注射 ACh 作用於 M2 受體可使心跳減慢（負向變時性），不會加快。","","錯誤：ACh 作用於腸道 M3 受體會「促進」胃腸蠕動，而非抑制；抑制腸蠕動是 atropine 等抗膽鹼藥的作用。","錯誤：興奮自主神經節屬於 N 受體（Nn 亞型）效應，發生於較高劑量 ACh 時；低劑量靜脈注射主要發揮 M 受體效應，不以節後興奮為主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_015","year":2016,"roc_year":105,"session":"1","examNo":15,"q":"在benzodiazepines的中樞抑制作用機制中，神經細胞內增加下列何種離子流入而導致興奮 性降低？","opts":["A. K+","B. Na+","C. Cl-","D. Ca++"],"ans":2,"exp":"苯二氮平類（benzodiazepines，BZD）藥物透過與 GABA-A 受體複合物上的 BZD 結合位點結合，增強 GABA（抑制性神經傳遞物質）與 GABA-A 受體的親和力，使氯離子通道（Cl⁻ channel）開放頻率增加。氯離子（Cl⁻）大量流入神經細胞，使細胞膜呈過極化（hyperpolarization）狀態，神經細胞興奮性降低，產生抗焦慮、鎮靜、肌肉鬆弛及抗癲癇效果。","we":["錯誤：K⁺ 內流增加（或 K⁺ 外流增加，通道不同）確實可使細胞過極化，但 GABA-A 受體是氯離子通道，BZD 的主要作用機制是增加 Cl⁻ 通透性，而非 K⁺ 通透性。","錯誤：Na⁺ 流入會使細胞去極化（depolarization），增加神經興奮性，與 BZD 的抑制效果方向相反；此選項描述錯誤。","","錯誤：Ca²⁺ 流入與 GABA-A 受體機制無關；Ca²⁺ 主要透過電壓閘控鈣通道或 NMDA 受體進入細胞，參與神經傳導物質釋放等作用，不是 BZD 抑制機制的核心。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_016","year":2016,"roc_year":105,"session":"1","examNo":16,"q":"血管內皮細胞衍生之鬆弛因子即為下列何種成分？","opts":["A. histamine","B. nitric oxide","C. serotonin","D. dopamine"],"ans":1,"exp":"血管內皮衍生鬆弛因子（endothelium-derived relaxing factor，EDRF）最初由 Furchgott 與 Zawadzki 於 1980 年發現，後來被確認為一氧化氮（nitric oxide，NO）。NO 由血管內皮細胞的 eNOS（endothelial nitric oxide synthase）以 L-精胺酸為受質合成，擴散至血管平滑肌細胞後，活化可溶性鳥苷酸環化酶（sGC），使 cGMP 升高，最終導致血管平滑肌舒張、血管擴張，是調控血管張力的重要物質。","we":["錯誤：histamine 由肥大細胞及嗜鹼性粒細胞釋放，透過 H1 受體可間接引發內皮 NO 釋放（血管擴張），但 histamine 本身不是 EDRF，也非血管內皮細胞的主要合成產物。","","錯誤：serotonin（5-HT）由血小板及腸嗜鉻細胞釋放，在不同情境下對血管有收縮（直接作用於 5-HT2A 受體）或舒張效果，但並非 EDRF 的化學本質。","錯誤：dopamine 是神經傳遞物質及腎上腺髓質分泌的兒茶酚胺，透過 D1 受體可使腎臟及內臟血管擴張，但其並非血管內皮衍生鬆弛因子（EDRF）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_017","year":2016,"roc_year":105,"session":"1","examNo":17,"q":"下列何者最適合使用於治療犬因為digitalis過量所造成之心室性心跳過快？","opts":["A. atropine","B. hydralazine","C. lidocaine","D. enalapril"],"ans":2,"exp":"Digitalis（毛地黃）過量引起的心室性心動過速（ventricular tachycardia）機制包括鈣超載觸發活動（triggered activity）及自律性增加。Lidocaine 屬 Class Ib 抗心律不整藥，選擇性抑制心室肌及蒲金氏纖維的快速鈉通道，縮短動作電位時程、降低自律性，且不影響心臟傳導速度，是治療 digitalis 毒性所致心室性心律不整的首選藥物。","we":["錯誤：atropine 阻斷 M2 受體，主要用於治療心搏過緩（bradycardia），對 digitalis 毒性引起的心室性心動過速（快速型）無效，且可能加重心跳過快。","錯誤：hydralazine 是動脈擴張劑，透過直接鬆弛小動脈平滑肌降低後負荷，用於高血壓及心臟衰竭，無抗心律不整作用，不適用於 digitalis 毒性。","","錯誤：enalapril 是 ACE 抑制劑，用於高血壓及充血性心臟衰竭，屬於血壓管理藥物，無直接抗心律不整效果，不適用於 digitalis 中毒所致心室性心動過速。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_018","year":2016,"roc_year":105,"session":"1","examNo":18,"q":"臨床上過量使用furosemide利尿之後所產生之不良反應主要為何?","opts":["A. 血糖濃度增加","B. 電解質流失","C. 胃腸擾亂","D. 心律不整"],"ans":1,"exp":"Furosemide 是強效袢利尿劑，抑制亨利氏環上行厚壁段（thick ascending limb of loop of Henle）的 Na⁺-K⁺-2Cl⁻ 共同轉運子（NKCC2），使大量 Na⁺、K⁺、Cl⁻、Mg²⁺ 及 Ca²⁺ 隨尿液排出。過量使用後最主要且臨床最顯著的不良反應為嚴重電解質流失，尤其是低鉀血症（hypokalemia）、低鈉血症（hyponatremia）及低鎂血症（hypomagnesemia），可進一步引發心律不整、肌肉無力及神經症狀。","we":["錯誤：血糖升高是噻嗪類利尿劑（thiazides）的較常見代謝副作用（抑制胰島素分泌）；furosemide 過量的最主要副作用是電解質流失，而非高血糖。","","錯誤：胃腸擾亂（噁心、嘔吐）雖是 furosemide 的可能副作用之一，但並非過量使用後的「主要」不良反應，電解質失衡所造成的危害遠更嚴重。","錯誤：心律不整可以是 furosemide 過量後電解質失衡（尤其低鉀血症）的「繼發性後果」，但直接、首要的不良反應是電解質流失本身，而非心律不整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_019","year":2016,"roc_year":105,"session":"1","examNo":19,"q":"下列何者具有鬆弛小動脈血管平滑肌、降低血管阻力及動脈壓，而減輕心室輸送血液後負荷\r （afterload）阻力之作用？","opts":["A. hydralazine","B. furosemide","C. epinephrine","D. phenylephrine"],"ans":0,"exp":"Hydralazine 直接作用於小動脈（arteriole）平滑肌，透過尚未完全闡明的機制（可能涉及細胞內 Ca²⁺ 釋放抑制及 K⁺ 通道開放）使其舒張，降低全身血管阻力（systemic vascular resistance，SVR）及動脈壓，進而減少心臟射血時的後負荷（afterload）。此為 hydralazine 在犬充血性心臟衰竭（尤其二尖瓣返流）中的主要應用機制。","we":["","錯誤：furosemide 是袢利尿劑，主要降低前負荷（preload）——透過減少循環血容量、降低靜脈回流，而非直接鬆弛動脈平滑肌降低後負荷。","錯誤：epinephrine 作用於 α1 受體使血管收縮（增加後負荷）、作用於 β1 受體使心跳加快，整體效果為升高血壓，與降低後負荷相反。","錯誤：phenylephrine 是選擇性 α1 受體致效劑，主要使動脈血管收縮、升高血壓，會增加後負荷，效果與 hydralazine 完全相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_020","year":2016,"roc_year":105,"session":"1","examNo":20,"q":"下列增強心肌收縮力的藥物中，何者有酏劑（elixir) 的口服劑型？","opts":["A. pimobendan","B. amrinone","C. digoxin","D. dobutamine"],"ans":2,"exp":"在增強心肌收縮力（正性肌力）的藥物中，digoxin 除了常見的錠劑（tablet）和注射劑型外，還有酏劑（elixir）口服液劑型，適合難以吞錠的幼齡或小型動物精確調整劑量使用。其他選項中，pimobendan 主要有膠囊/錠劑，amrinone 主要為注射劑，dobutamine 僅有靜脈注射劑型，均無酏劑製品。","we":["錯誤：pimobendan 是磷酸二酯酶抑制劑暨鈣增敏劑，主要劑型為口服膠囊或咀嚼錠，目前無酏劑製品。","錯誤：amrinone（inamrinone）是磷酸二酯酶 III 抑制劑，主要為靜脈注射劑型，無口服酏劑製品。","","錯誤：dobutamine 是選擇性 β1 受體致效劑，因半衰期極短（約 2 分鐘）且口服首渡效應強，僅有靜脈注射劑型，無口服或酏劑製品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_021","year":2016,"roc_year":105,"session":"1","examNo":21,"q":"下列何者可用於治療尿崩症（diabetes insipidus）？","opts":["A. hydrochlorothiazide","B. acetazolamide","C. bumetanide","D. ammonium chloride"],"ans":0,"exp":"Hydrochlorothiazide（HCTZ，噻嗪類利尿劑）用於治療腎性尿崩症（nephrogenic diabetes insipidus，NDI）是一個「悖論性」效果：HCTZ 抑制遠端腎小管的 Na⁺-Cl⁻ 共同轉運子，輕度的鈉利尿使體液容量減少 → 近端腎小管代償性增加鈉水重吸收 → 到達遠端腎小管（AVP 作用部位）的濾液量減少 → 總尿量減少。此機制在 AVP 受體功能缺陷的 NDI 患者仍有效，是 NDI 的重要治療選項。","we":["","錯誤：acetazolamide 是碳酸酐酶抑制劑，作用於近端腎小管，用於治療青光眼、高山症及某些癲癇；它不用於治療尿崩症，且其利尿效果反而會加重多尿。","錯誤：bumetanide 是袢利尿劑（作用於亨利氏環），強效利尿，會大幅增加尿量，加重尿崩症的多尿與脫水，禁用於尿崩症治療。","錯誤：ammonium chloride 是酸化劑，用於輕度代謝性鹼中毒的治療，對尿崩症無任何治療效果，且過量使用會造成代謝性酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_022","year":2016,"roc_year":105,"session":"1","examNo":22,"q":"Furosemide作用於腎元的何處？","opts":["A. 近端腎小管","B. 亨利氏環上行支","C. 遠端腎小管前端","D. 遠端腎小管後端"],"ans":1,"exp":"Furosemide 屬於袢利尿劑（loop diuretic），其作用位置為腎元中亨利氏環上行厚壁段（thick ascending limb of loop of Henle，TAL）的管腔面。Furosemide 競爭性抑制此處的 Na⁺-K⁺-2Cl⁻ 共同轉運子（NKCC2），阻止 Na⁺、K⁺、Cl⁻ 重吸收，破壞髓質高滲透壓梯度，導致大量等滲尿液排出，是效力最強的利尿劑之一。","we":["錯誤：近端腎小管是碳酸酐酶抑制劑（如 acetazolamide）的作用部位，此段負責約 65% 的 Na⁺ 重吸收，不是 furosemide 的主要作用位置。","","錯誤：遠端腎小管前端（早期遠端腎小管）是噻嗪類利尿劑（如 hydrochlorothiazide）抑制 NCC 轉運子的作用部位，非 furosemide 作用位置。","錯誤：遠端腎小管後端（集合管）是保鉀利尿劑（如 spironolactone、amiloride）的作用部位，負責 aldosterone 調控的 Na⁺/K⁺ 交換，不是 furosemide 的作用點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_023","year":2016,"roc_year":105,"session":"1","examNo":23,"q":"下列何者對於heparin過量所產生的出血症狀最有效？","opts":["A. protamine sulfate","B. aminocaproic acid","C. vitamin K","D. tranexamic acid"],"ans":0,"exp":"Protamine sulfate 是一種含大量正電荷的鹼性蛋白質，能與帶強負電荷的 heparin 透過靜電作用形成穩定的非活性複合物，迅速中和 heparin 的抗凝活性。臨床上靜脈注射 protamine sulfate 是治療 heparin 過量出血的「特異性拮抗劑」，每 100 U heparin 約需 1 mg protamine 中和，為外科術中意外過量或肝素化後逆轉的標準處置。","we":["","錯誤：aminocaproic acid 是抗纖溶劑，透過抑制纖溶酶（plasmin）及纖溶酶原活化劑，治療纖溶亢進性出血（如 DIC 纖溶期），對 heparin 過量引起的抗凝出血無直接拮抗作用。","錯誤：vitamin K 是維生素 K 依賴性凝血因子（II、VII、IX、X）的合成輔因子，用於拮抗 warfarin（維生素 K 拮抗劑）過量，對 heparin 作用機制（抗凝血酶 III 活化）無效，且 vitamin K 起效慢（口服需數小時，靜脈注射需 2–4 小時），不適合緊急逆轉 heparin。","錯誤：tranexamic acid 亦是抗纖溶劑，機制與 aminocaproic acid 相似，用於控制纖溶性出血，對 heparin 過量無拮抗效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_024","year":2016,"roc_year":105,"session":"1","examNo":24,"q":"可競爭性阻斷α1腎上腺素性受體而使血管擴張的藥物是：","opts":["A. clonidine","B. prazosin","C. hydralazine","D. α-methyldopa"],"ans":1,"exp":"Prazosin 是高選擇性 α1 腎上腺素受體競爭性拮抗劑。α1 受體活化後使血管平滑肌收縮，prazosin 阻斷此效應後，動脈及靜脈血管均發生擴張，降低周邊血管阻力（後負荷）及靜脈回流（前負荷），從而降低血壓。臨床上用於高血壓及充血性心臟衰竭（犬二尖瓣返流）的輔助治療。","we":["錯誤：clonidine 是 α2 腎上腺素受體致效劑，作用於中樞突觸前 α2 受體，抑制去甲腎上腺素釋放而降低血壓；其機制是「活化」α2 受體，而非「拮抗」α1 受體。","","錯誤：hydralazine 直接作用於小動脈平滑肌細胞內，與腎上腺素受體無關，其舒張血管機制不涉及 α1 受體的競爭性拮抗。","錯誤：α-methyldopa 在中樞神經被轉化為 α-methylnorepinephrine，作用於中樞 α2 受體降低交感神經輸出，屬於中樞性降壓藥，並非 α1 受體競爭性拮抗劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_025","year":2016,"roc_year":105,"session":"1","examNo":25,"q":"下列何者可用於治療青光眼？","opts":["A. acetazolamide","B. amiloride","C. hydrochlorothiazide","D. furosemide"],"ans":0,"exp":"Acetazolamide 是碳酸酐酶（carbonic anhydrase，CA）抑制劑。眼球睫狀體（ciliary body）上皮細胞依賴碳酸酐酶催化 CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻，為房水（aqueous humor）主動生成的驅動力。抑制 CA 後，房水生成速率下降 40–60%，使眼內壓（intraocular pressure，IOP）降低，是治療青光眼（glaucoma）的有效藥物，臨床上有口服錠劑及局部點眼劑（如 dorzolamide）兩種型式。","we":["","錯誤：amiloride 是保鉀利尿劑，阻斷集合管上皮細胞的 ENaC（上皮鈉通道），主要用於心臟衰竭或高血壓合併低鉀血症的治療，無直接降低眼內壓的作用，不用於青光眼治療。","錯誤：hydrochlorothiazide 是噻嗪類利尿劑，作用於遠端腎小管，用於高血壓、水腫及腎性尿崩症；無降低眼內壓效果，不用於青光眼治療。","錯誤：furosemide 是袢利尿劑，雖然短期靜脈注射可藉由降低血漿滲透壓及減少液體容積輕微降低眼壓，但效果短暫且非青光眼的標準治療藥物，不如 acetazolamide 有效且持久。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_026","year":2016,"roc_year":105,"session":"1","examNo":26,"q":"下列何者為中樞性的止咳藥物（antitussive drugs）？","opts":["A. dextromethorphan","B. aminophylline","C. metaproterenol","D. adrenaline"],"ans":0,"exp":"Dextromethorphan（DXM）是左旋甲啡烷（levomethorphan）的對映異構體，屬於中樞性止咳藥（centrally acting antitussive）。它作用於腦幹延髓的咳嗽中樞（cough center），抑制咳嗽反射，而不具有顯著的鎮痛或成癮性（鎮痛效力極弱，不作用於 µ 受體），是非成癮性止咳藥的代表，廣泛用於人醫及部分獸醫臨床。","we":["","錯誤：aminophylline 是茶鹼（theophylline）與乙二胺的複合物，主要作用為支氣管擴張劑（phosphodiesterase 抑制及腺苷受體拮抗），用於氣喘及支氣管痙攣，屬「周邊性」呼吸道鬆弛劑，非中樞性止咳藥。","錯誤：metaproterenol 是 β2 腎上腺素受體致效劑，使支氣管平滑肌舒張，為周邊性支氣管擴張劑，不具有中樞性止咳機制。","錯誤：adrenaline（epinephrine）是非選擇性腎上腺素受體致效劑，可使支氣管舒張（β2 效應），用於嚴重過敏反應或急性支氣管痙攣的緊急處理，不是中樞性止咳藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_027","year":2016,"roc_year":105,"session":"1","examNo":27,"q":"下列何者可以阻斷adenosine受體而增加細胞內cAMP的量？","opts":["A. theophylline","B. clenbuterol","C. ipratropium","D. guaiacolate"],"ans":0,"exp":"Theophylline 具有雙重作用機制：①競爭性阻斷腺苷（adenosine）受體——腺苷本身具有支氣管收縮效果，阻斷後使支氣管擴張；②抑制磷酸二酯酶（phosphodiesterase，PDE），減少 cAMP 的分解，使細胞內 cAMP 濃度升高，進一步促進支氣管平滑肌舒張及心肌正性肌力效應。兩種機制共同作用，使 theophylline 成為重要的支氣管擴張藥物。","we":["","錯誤：clenbuterol 是選擇性 β2 腎上腺素受體致效劑，透過活化 Gs 蛋白 → 腺苷酸環化酶（adenylyl cyclase）→ cAMP 升高使支氣管擴張，並非透過阻斷腺苷受體或抑制磷酸二酯酶作用。","錯誤：ipratropium 是 M3 毒蕈鹼受體拮抗劑，阻斷副交感神經介導的支氣管收縮，與腺苷受體及 cAMP 機制無關。","錯誤：guaiacolate（guaifenesin 類）是化痰劑（expectorant），透過刺激呼吸道黏液分泌、降低痰的黏度幫助排痰，與腺苷受體阻斷或 cAMP 升高完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_028","year":2016,"roc_year":105,"session":"1","examNo":28,"q":"下列何種維生素因天竺鼠飼料儲存環境溫溼度過高被破壞，需於飲水添加補充？","opts":["A. K","B. B","C. C","D. E"],"ans":2,"exp":"天竺鼠（guinea pig）和人類同為少數無法自行合成維生素 C（ascorbic acid，維生素 C）的動物，因其肝臟缺乏 L-葡萄糖酸內酯氧化酶（L-gulonolactone oxidase），無法催化 L-葡萄糖酸內酯 → 維生素 C 的最後步驟。維生素 C 對熱及潮濕環境極不穩定，高溫高溼的飼料儲存條件會使其迅速氧化分解；因此應透過飲水添加新鮮維生素 C 來確保天竺鼠的每日需求。","we":["錯誤：維生素 K 在天竺鼠腸道微生物可部分合成，且飼料中含量通常充足，高溫儲存條件並不會造成顯著的維生素 K 缺乏，也不需額外飲水補充。","錯誤：維生素 B 群（B 族）在一般飼料儲存條件下相對穩定（核黃素除外），且天竺鼠腸道菌可合成部分 B 族維生素；題目描述的情境（溫溼度過高破壞）指向維生素 C，而非 B 族。","","錯誤：維生素 E（α-tocopherol）為脂溶性維生素，在密封飼料中因缺氧而相對穩定；雖高溫可加速氧化，但天竺鼠可在肝臟利用飼料脂肪中的維生素 E，不是需要額外飲水補充的維生素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_029","year":2016,"roc_year":105,"session":"1","examNo":29,"q":"下列藥物中，何者對組織胺所引起之鼻炎無效？","opts":["A. cimetidine","B. hydroxyzine","C. chlorpheniramine","D. dimenhydrinate"],"ans":0,"exp":"組織胺（histamine）引起的鼻炎（過敏性鼻炎）主要由 H1 受體介導——H1 受體活化後引起血管擴張、通透性增加、黏液分泌增加及鼻黏膜水腫。Cimetidine 是 H2 受體拮抗劑（H2 blocker），作用於胃壁細胞的 H2 受體以減少胃酸分泌，對 H1 受體介導的過敏性鼻炎完全無效。","we":["","此為正確描述：hydroxyzine 是第一代 H1 抗組織胺藥，具有抗過敏及鎮靜效果，可有效治療組織胺引起的鼻炎；此藥有效，不符合題目問的「對…無效」描述。","此為正確描述：chlorpheniramine 是第一代 H1 抗組織胺藥，是獸醫臨床最常用的抗過敏藥之一，對 H1 介導的鼻炎有效，不符合題目問的「無效」描述。","此為正確描述：dimenhydrinate 是 diphenhydramine 的鹽，屬 H1 抗組織胺藥，同時具有抗膽鹼及止吐作用，對組織胺引起的過敏反應（含鼻炎）有效，不符合題目問的「無效」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_030","year":2016,"roc_year":105,"session":"1","examNo":30,"q":"下列何者的藥理活性透過H2-受體？","opts":["A. sucralfate","B. famotidine","C. misoprostol","D. omeprazole"],"ans":1,"exp":"Famotidine 是第二代 H2 受體拮抗劑（H2 blocker），競爭性拮抗組織胺作用於胃黏膜壁細胞（parietal cells）上的 H2 受體，阻斷組織胺誘導的腺苷酸環化酶活化 → cAMP 升高 → 胃酸分泌。Famotidine 的效力約為 cimetidine 的 20–50 倍，廣泛用於犬貓的胃酸過多、胃潰瘍及食道炎治療，其藥理活性透過 H2 受體而非 PGE1、氫離子幫浦或其他受體。","we":["錯誤：sucralfate 是胃黏膜保護劑，在酸性 pH 下聚合成黏稠物質覆蓋潰瘍面，並吸附膽汁酸及胃蛋白酶；其作用與 H2 受體無關，屬局部物理性保護機制。","","錯誤：misoprostol 是前列腺素 E1（PGE1）類似物，透過 EP3 受體抑制胃壁細胞腺苷酸環化酶活性（降低 cAMP）而減少胃酸，並促進黏液及碳酸氫鹽分泌；其藥理活性透過前列腺素受體，而非 H2 受體。","錯誤：omeprazole 是氫離子幫浦抑制劑（PPI），共價性不可逆地結合胃壁細胞 H⁺/K⁺-ATPase，阻斷最終胃酸分泌步驟；其作用不涉及 H2 受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_031","year":2016,"roc_year":105,"session":"1","examNo":31,"q":"缺乏下列何者會導致貧血並伴隨神經症狀？","opts":["A. ascorbic acid","B. cyanocobalamin","C. thiamine","D. α-tocopherol"],"ans":1,"exp":"Cyanocobalamin（氰鈷胺，維生素 B12）缺乏時，DNA 合成障礙導致紅血球前驅細胞無法正常分裂，形成巨幼紅血球性貧血（megaloblastic anemia）；同時，B12 是髓鞘維持所需甲基丙二醯輔酶 A 變位酶的輔因子，缺乏導致奇數碳脂肪酸及甲基丙二酸積聚，造成脊髓後側索（subacute combined degeneration）脫髓鞘，出現神經症狀（步態異常、本體感覺喪失、感覺異常）。此兩者（貧血 + 神經症狀）並存是 B12 缺乏的特徵。","we":["錯誤：ascorbic acid（維生素 C）缺乏引起壞血病（scurvy），表現為膠原蛋白合成障礙（牙齦出血、傷口不癒、出血傾向），不會引起巨幼紅血球性貧血或神經退化症狀。","","錯誤：thiamine（維生素 B1）缺乏引起腳氣病（beriberi，周邊神經炎）及 Wernicke 腦病，主要表現為多發性神經炎、心臟衰竭及腦病（眼球麻痹、共濟失調、意識障礙），不引起巨幼紅血球性貧血。","錯誤：α-tocopherol（維生素 E）缺乏可引起溶血性貧血（因紅血球膜脂質過氧化）及神經肌肉症狀（肌病、視網膜病變），但不引起巨幼紅血球性貧血，且神經症狀類型與 B12 缺乏不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_032","year":2016,"roc_year":105,"session":"1","examNo":32,"q":"下列何者具有止吐作用，且必須預先投藥才有藥效？","opts":["A. cisapride","B. diphenhydramine","C. metoclopramide","D. ondansetron"],"ans":1,"exp":"Diphenhydramine 是第一代 H1 抗組織胺藥，同時具有顯著的抗膽鹼（anti-muscarinic）及中樞鎮靜效果，其止吐作用透過阻斷前庭核（vestibular nucleus）及嘔吐中樞的 H1 及 M 受體實現。關鍵特性是：做為動暈症（motion sickness）預防藥，必須在搭乘交通工具之前預先投藥（pretreatment）才有效，藥物血中濃度需在嘔吐刺激出現前達到有效水平；若等噁心嘔吐已開始才給藥，效果很差。","we":["錯誤：cisapride 是促腸胃蠕動藥（prokinetic），透過 5-HT4 受體促進乙醯膽鹼釋放，加速胃排空，用於胃輕癱及食道返流；其止吐機制不涉及 H1 受體，且不需要預先給藥。","","錯誤：metoclopramide 是 D2 受體拮抗劑及 5-HT4 致效劑，止吐作用靶點為化學受體觸發區（CTZ）；其止吐效果不依賴預先給藥，用於嘔吐發作中或術後止吐均有效。","錯誤：ondansetron 是 5-HT3 受體拮抗劑，廣泛用於化療或手術後嘔吐，作用於腸道迷走神經末梢及 CTZ；其強效止吐作用不需要預先給藥，可在嘔吐發作時使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_033","year":2016,"roc_year":105,"session":"1","examNo":33,"q":"下列何者最適合使用於動暈症（motion sickness）的控制？","opts":["A. cisapride","B. droperidol","C. ondansetron","D. scopolamine"],"ans":3,"exp":"Scopolamine（東莨菪鹼）是毒蕈鹼（muscarinic）受體拮抗劑，對動暈症的療效優於其他抗嘔吐藥。動暈症的發生機制涉及前庭器官（vestibular apparatus）傳入至嘔吐中樞的膽鹼性通路，scopolamine 阻斷前庭核及嘔吐中樞的 M 受體，切斷此訊號傳遞，是目前最有效的動暈症控制藥物，在人醫常製成透皮貼片（TTS）使用。","we":["錯誤：cisapride 是促腸胃蠕動劑，促進胃排空，用於胃輕癱，其作用機制（5-HT4 受體）與動暈症的前庭膽鹼性通路無關，不適合動暈症治療。","錯誤：droperidol 是丁酮苯類（butyrophenone）D2 受體拮抗劑，具有強效止吐及抗精神病作用，主要作用於 CTZ；對動暈症的療效不如 scopolamine，且有錐體外症狀副作用風險。","錯誤：ondansetron 是 5-HT3 受體拮抗劑，對化療及術後嘔吐效果佳，但對動暈症（前庭膽鹼性機制）療效有限，不是動暈症的首選藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_034","year":2016,"roc_year":105,"session":"1","examNo":34,"q":"下列何者對貓具有刺激食慾的作用，但對犬無效？","opts":["A. apomorphine","B. cyproheptadine","C. scopolamine","D. xylazine"],"ans":1,"exp":"Cyproheptadine 是第一代 H1 抗組織胺藥，同時具有血清素（5-HT）受體拮抗活性。在貓，cyproheptadine 透過阻斷中樞 5-HT 受體，解除血清素對食慾的抑制作用，顯著刺激食慾，是貓厭食症的常用治療藥物；然而，此刺激食慾效果在犬尚未獲一致性確認，故臨床上認為對犬無效（或效果不確定）。","we":["錯誤：apomorphine 是 D2 受體致效劑，在犬可有效誘導嘔吐（用於中毒後催吐），在貓則效果不穩定；其藥理機制與刺激食慾無關，用途相反（催吐而非促進食慾）。","","錯誤：scopolamine 是 M 受體拮抗劑，主要用於動暈症及術前用藥（減少分泌），無刺激食慾的藥理機制。","錯誤：xylazine 是 α2 受體致效劑，在貓可引起嘔吐（α2 受體誘導的貓催吐效果），不是食慾刺激劑；在犬主要用於鎮靜與肌肉鬆弛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_035","year":2016,"roc_year":105,"session":"1","examNo":35,"q":"可直接破壞痰黏液分子的雙硫鍵而降低其黏度的化痰劑（mucolytic agents）是：","opts":["A. guaifenesin","B. ammonium chloride","C. potassium iodide","D. acetylcysteine"],"ans":3,"exp":"化痰劑（mucolytic agents）中，acetylcysteine（N-乙醯半胱胺酸，NAC）是唯一真正的「黏液溶解劑」：其游離巰基（-SH）直接切斷痰液黏液糖蛋白（mucin glycoprotein）鏈間的雙硫鍵（-S-S-），使大分子黏液網絡解聚，黏度降低，痰液變稀易於排出。此外，NAC 也是重要的解毒劑（乙醯胺酚中毒的解毒藥，補充 GSH）。","we":["錯誤：guaifenesin（愈創甘油醚）是化痰祛痰劑（expectorant），透過刺激胃腸迷走神經反射、增加呼吸道黏液和漿液性分泌，稀釋痰液幫助排痰，但不直接切斷雙硫鍵，非真正意義上的 mucolytic agent。","錯誤：ammonium chloride 是祛痰劑，刺激胃黏膜引發反射性呼吸道分泌增加，使痰液稀釋；不直接作用於黏蛋白雙硫鍵，不是黏液溶解劑。","錯誤：potassium iodide 是反射性祛痰劑，刺激胃腸道迷走神經增加呼吸道分泌，機制為增加分泌量而非破壞分子結構；不直接溶解痰液，不屬 mucolytic agent。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_036","year":2016,"roc_year":105,"session":"1","examNo":36,"q":"下列何者是刺激性瀉藥？","opts":["A. castor oil","B. mineral oil","C. magnesium sulfate","D. methylcellulose"],"ans":0,"exp":"刺激性瀉藥（stimulant laxatives）透過直接刺激腸道神經叢或腸黏膜，增加腸蠕動，縮短食物通過時間，促進排便。Castor oil（蓖麻油）在小腸被脂肪酶水解為蓖麻油酸（ricinoleic acid），後者活化腸黏膜的前列腺素 E3（EP3）受體，增加腸道運動及分泌，是典型的刺激性瀉藥（stimulant laxative）。","we":["","錯誤：mineral oil（礦物油）是軟化型/潤滑型瀉藥（lubricant laxative），覆蓋在糞便表面並滲入糞塊，使糞便滑潤易於排出；不刺激腸蠕動，與刺激性瀉藥機制不同。","錯誤：magnesium sulfate（硫酸鎂，瀉鹽）是滲透性瀉藥（osmotic laxative），在腸道不被吸收，保留水分於腸腔，增加腸腔滲透壓，使糞便變軟增量；不直接刺激腸道神經叢。","錯誤：methylcellulose 是容積型瀉藥（bulk-forming laxative），在腸腔吸水膨脹形成凝膠，增加糞便體積，刺激腸壁的機械性受體引發蠕動；機制為物理性容積增加，非化學刺激性機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_藥理_1051_037","year":2016,"roc_year":105,"session":"1","examNo":37,"q":"雞飼料中長期添加amprolium，易引起下列何種維生素缺乏？","opts":["A. B1","B. B2","C. B6","D. B12"],"ans":0,"exp":"Amprolium 是球蟲（coccidia）感染的常用預防和治療藥物，其化學結構與硫胺素（thiamine，維生素 B1）極為相似，透過競爭性拮抗硫胺素的吸收（阻斷球蟲的硫胺素利用）達到抗球蟲效果。然而，長期使用 amprolium 於雞飼料中，同樣會競爭性干擾雞隻本身的硫胺素（B1）吸收，造成維生素 B1 缺乏症（多發
