e（維生素 B1）缺乏引起腳氣病（beriberi）或 Wernicke 腦病，雖有神經系統症狀，但不伴有典型的巨球性貧血。","錯誤：riboflavin（維生素 B2）缺乏主要引起口腔炎、舌炎、脂漏性皮膚炎等黏膜皮膚症狀，不以貧血合併神經病變為典型表現。","錯誤：niacin（維生素 B3）缺乏引起糙皮病（pellagra），表現為皮膚炎、腹瀉、精神症狀（dementia），不以巨球性貧血合併神經病變為主。","此為正確答案。Cyanocobalamin（B12）缺乏同時造成巨球性貧血（DNA 合成障礙）及神經病變（脊髓後索脫髓鞘），是兩者並存的唯一常見 B 族維生素缺乏症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_055","year":2024,"roc_year":113,"session":"","examNo":55,"q":"Loop diuretics是獸醫臨床上最常被使用的利尿劑，其最常見的副作用為何？","opts":["A. 高鈣血症","B. 高鈣尿症","C. 低血鉀症","D. 高血鉀症"],"ans":2,"exp":"Loop diuretics（如 furosemide）作用於亨利氏環上行支的 Na+/K+/2Cl- 共同運輸體（NKCC2），抑制 Na+、K+、Cl- 的重吸收，造成大量電解質與水分排出。由於 K+ 排出增加（伴隨高流量到達遠端腎小管），最常見的電解質副作用是低血鉀症（hypokalemia）。Loop diuretics 還會增加 Ca2+ 排出（低鈣血症），與 thiazide 類（引起高鈣血症）相反；不會引起高血鉀症（保鉀利尿劑如 spironolactone 才會）。","we":["錯誤：高鈣血症（hypercalcemia）是 thiazide 類利尿劑的副作用，thiazide 會增加鈣的重吸收。Loop diuretics 反而促進鈣排出，可能引起低鈣血症。","錯誤：高鈣尿症（hypercalciuria）雖與 loop diuretics 有關（Ca2+ 排出增加），但此並非「最常見」副作用；臨床上低血鉀症出現頻率更高且臨床意義更大。","此為正確答案。低血鉀症（hypokalemia）是 loop diuretics 最常見且臨床最重要的電解質副作用，因 K+ 從亨利氏環及遠端腎小管大量排出，需常規監測血鉀並適當補充。","錯誤：高血鉀症（hyperkalemia）是保鉀利尿劑（如 spironolactone、amiloride）的副作用。Loop diuretics 的作用恰好相反，會導致低血鉀症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_056","year":2024,"roc_year":113,"session":"","examNo":56,"q":"下列何者對貓具有刺激食慾的作用，但在犬則無效？","opts":["A. cimetidine","B. cisapride","C. cyproheptadine","D. mirtazapine"],"ans":2,"exp":"Cyproheptadine 是第一代抗組織胺藥物，同時具有 5-HT2 血清素受體拮抗作用。在貓，血清素（serotonin）對食慾具有抑制效果；cyproheptadine 阻斷 5-HT2 受體後解除此抑制，因此能刺激食慾。在犬，此機制效果不顯著，臨床上無法有效刺激食慾，為犬貓之間的物種差異。Cimetidine 是 H2 阻斷劑（胃酸分泌抑制）；cisapride 是 5-HT4 致效劑（促胃腸蠕動）；mirtazapine 雖也可刺激貓食慾（α2 阻斷及 5-HT3 拮抗），但對犬也有一定效果，不符合「犬則無效」的條件。","we":["錯誤：cimetidine 是 H2 受體阻斷劑，用於抑制胃酸分泌（消化性潰瘍、胃食道逆流），不具有刺激食慾的作用。","錯誤：cisapride 是 5-HT4 受體致效劑，作用為促進胃腸蠕動（prokinetic），不具有刺激食慾的特性。","此為正確答案。Cyproheptadine 透過拮抗 5-HT2 受體，在貓身上能有效刺激食慾，但在犬身上此效果不顯著，是犬貓藥理反應差異的典型例子。","錯誤：mirtazapine（米氮平）可刺激貓食慾，但在犬也有一定程度的效果，不完全符合「犬則無效」的描述，故非本題最佳答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_057","year":2024,"roc_year":113,"session":"","examNo":57,"q":"複選題\n57.下列何者除了抑制胃酸分泌，也具有促進胃腸蠕動的作用？","opts":["A. cimetidine","B. famotidine","C. nizatidine","D. ranitidine"],"ans":0,"exp":"本題為複選題。在 H2 受體阻斷劑中，cimetidine（西咪替丁）除了抑制胃酸分泌外，同時具有促進胃腸蠕動的作用，其機制與抑制磷酸二酯酶（phosphodiesterase）及輕微擬膽鹼作用有關。注意：ranitidine 及 nizatidine 也因具有微弱的乙醯膽鹼酯酶（AChE）抑制特性而有輕度促動作用，但本題依據考選部公布答案，cimetidine（A）為正確答案。Famotidine 是最不具促動作用的 H2 阻斷劑。","we":["此為正確答案。Cimetidine 是 H2 受體阻斷劑，除抑制胃酸外，也具有促進胃腸蠕動的作用，此為本題選項中最符合題意者。","錯誤：famotidine 是效力強的 H2 阻斷劑，主要用於抑制胃酸，不具有促進胃腸蠕動的特性，為最不具促動效果的 H2 阻斷劑之一。","錯誤：nizatidine 雖因輕微 AChE 抑制作用而可能有微弱促動效果，但本題依官方答案，C 非正確選項，實際考試應選 A。","錯誤：ranitidine 雖也具微弱 AChE 抑制及輕度促動特性，但本題依官方答案，D 非正確選項，實際考試應選 A。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_058","year":2024,"roc_year":113,"session":"","examNo":58,"q":"下列opiate拮抗劑中，何者因會產生中樞反應，故不做為術後腸阻塞（postoperative ileus）的胃腸促動 劑？","opts":["A. alvimopan","B. naloxone","C. naloxegol","D. methylnaltrexone"],"ans":1,"exp":"術後腸阻塞（postoperative ileus）的胃腸促動劑需選擇「周邊選擇性」的 μ-opioid 拮抗劑，以逆轉 opioid 在腸道的抑制作用，同時不影響中樞的鎮痛效果。Naloxone 具高度脂溶性，能迅速穿越血腦屏障（BBB），產生中樞性 opioid 拮抗反應，逆轉術後鎮痛，因此不適合用作腸道促動劑。Alvimopan、naloxegol、methylnaltrexone 均為周邊選擇性 μ-opioid 拮抗劑，穿透 BBB 能力有限，能改善 opioid 引起的腸蠕動抑制而不影響鎮痛效果。","we":["錯誤：alvimopan 是口服周邊選擇性 μ-opioid 拮抗劑，分子量大且生物利用率低，BBB 穿透性差，故可用作術後腸阻塞的腸道促動劑，不會逆轉中樞鎮痛。","此為正確答案。Naloxone 的高脂溶性使其能迅速穿越 BBB，產生中樞性 opioid 拮抗效果，逆轉術後鎮痛，因此不能用作術後腸道促動劑。","錯誤：naloxegol 是 naloxone 的聚乙二醇化衍生物（PEGylated），增加分子量後限制其穿越 BBB，設計為周邊選擇性作用，可用於 opioid 引起的便秘，不會明顯影響中樞鎮痛。","錯誤：methylnaltrexone 是帶正電荷的四銨類衍生物，極性高，幾乎不穿透 BBB，為周邊選擇性 μ-opioid 拮抗劑，臨床用於逆轉 opioid 引起的腸道副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_059","year":2024,"roc_year":113,"session":"","examNo":59,"q":"Apomorphine主要刺激下列何處之多巴胺受體而誘導犬隻嘔吐？","opts":["A. vestibular apparatus","B. cerebrum","C. chemoreceptor trigger zone","D. gastrointestinal system"],"ans":2,"exp":"Apomorphine 是多巴胺（D2）受體致效劑，主要作用於化學感受器觸發區（chemoreceptor trigger zone, CTZ），又稱最後區（area postrema），此區位於第四腦室底部，缺乏完整的血腦屏障，因此血液中的藥物及毒素能直接刺激 CTZ 的 D2 受體，觸發嘔吐反射（vomiting center 的激活）。Apomorphine 是犬臨床誘導嘔吐最常用的藥物，但在貓效果差，貓常改用 xylazine 誘吐。","we":["錯誤：vestibular apparatus（前庭器）主要負責與運動相關的嘔吐（motion sickness），前庭傳入訊號通過 H1 和 M1 受體調控，apomorphine 不是透過此途徑誘導嘔吐。","錯誤：cerebrum（大腦皮質）可接受來自嗅覺、視覺、記憶等的輸入而引發嘔吐（如噁心感），但 apomorphine 的主要誘吐機制不在大腦皮質，而在 CTZ。","此為正確答案。Apomorphine 主要刺激 CTZ（area postrema）的 D2 多巴胺受體，因 CTZ 缺乏血腦屏障，藥物能直接由血液到達並激活此區，為犬的標準誘吐藥物。","錯誤：gastrointestinal system 中有周邊性嘔吐感受器（如 5-HT3 受體介導），但 apomorphine 誘導嘔吐的主要部位是 CTZ，而非周邊胃腸道感受器。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_060","year":2024,"roc_year":113,"session":"","examNo":60,"q":"下列止吐劑中，何者為NK1受體拮抗劑？","opts":["A. promethazine","B. metoclopramide","C. ondansetron","D. maropitant"],"ans":3,"exp":"Maropitant（Cerenia）是 NK1（neurokinin-1）受體拮抗劑，能阻斷 substance P 與嘔吐中樞（vomiting center）及 CTZ 的 NK1 受體結合，廣效抑制各種原因引起的嘔吐，為獸醫最常用的止吐劑之一。Promethazine：H1 受體阻斷劑＋抗膽鹼作用，用於運動病；metoclopramide：D2 受體拮抗劑＋5-HT4 致效劑，同時有促胃動力作用；ondansetron：5-HT3 受體拮抗劑，用於化療引起的嘔吐。","we":["錯誤：promethazine 是第一代 H1 受體阻斷劑，同時具有抗膽鹼作用，可用於運動病（motion sickness）的止吐，但其主要機制是抗組織胺，非 NK1 受體拮抗。","錯誤：metoclopramide 是 D2 受體拮抗劑（並有 5-HT4 受體致效作用），除止吐外也能促進胃腸蠕動，但其機制為多巴胺受體阻斷，非 NK1 拮抗。","錯誤：ondansetron 是 5-HT3（serotonin type 3）受體拮抗劑，阻斷外周和中樞的血清素受體，常用於化療誘發嘔吐，但不是 NK1 受體拮抗劑。","此為正確答案。Maropitant（Cerenia）是 NK1 受體拮抗劑，阻斷 substance P 在嘔吐中樞的作用，能廣效預防和治療多種原因引起的嘔吐，為獸醫臨床最重要的止吐劑之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_061","year":2024,"roc_year":113,"session":"","examNo":61,"q":"下列何種瀉劑（laxative）最快達到排便的作用？","opts":["A. lactulose","B. methylcellulose","C. docusate","D. castor oil"],"ans":0,"exp":"Lactulose 是不可吸收的合成雙醣，口服後在結腸被細菌發酵產生有機酸，降低結腸 pH 值並增加腸腔滲透壓，迅速將水分吸入腸腔，促進糞便軟化及腸蠕動。在滲透型瀉劑中，lactulose 作用起效相對快速。Methylcellulose 是膨脹型瀉劑（bulk-forming），需數天才有效；docusate 是糞便軟化劑（stool softener），起效慢；castor oil 是刺激型瀉劑，在腸道水解為蓖麻油酸後才發揮作用，起效較 lactulose 慢。","we":["此為正確答案。Lactulose 是滲透型瀉劑，透過增加腸腔滲透壓迅速將水分引入結腸，能快速軟化糞便並促進排便，在本題選項中起效最快。","錯誤：methylcellulose 是膨脹型（bulk-forming）瀉劑，需要大量水分吸收使纖維膨脹，通常需要 12-72 小時才能發揮效果，起效最慢。","錯誤：docusate 是糞便軟化劑（界面活性劑型），透過讓水分和脂質滲入糞便使其軟化，起效需要 12-72 小時，不是最快速的瀉劑。","錯誤：castor oil 是刺激型瀉劑，在小腸經脂肪酶水解為蓖麻油酸後刺激腸蠕動，雖起效也算較快（2-6 小時），但整體而言不如 lactulose 的滲透機制快速直接。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_062","year":2024,"roc_year":113,"session":"","examNo":62,"q":"下列何者作為噴霧劑使用時不會被呼吸道吸收，而具有局部atropine的功能？","opts":["A. theophylline","B. formoterol","C. cromoglycate","D. ipratropium"],"ans":3,"exp":"Ipratropium 是四銨類（quaternary ammonium）化合物，帶有永久正電荷，極性高，以噴霧吸入給藥時幾乎不被呼吸道黏膜吸收，僅在局部氣道發揮類似 atropine 的抗膽鹼（antimuscarinic）作用，阻斷支氣管平滑肌的 M3 受體，引起支氣管擴張，全身副作用極少。相比之下，theophylline（口服/靜脈）和 formoterol（吸入 β2 致效劑）均能被吸收並產生全身效應；cromoglycate 是肥大細胞穩定劑，不具 atropine 樣作用。","we":["錯誤：theophylline 是甲基黃嘌呤類藥物，口服或靜脈給藥後能被系統性吸收，產生全身性支氣管擴張效果（PDE 抑制），具有全身副作用（心跳加速、抽搐等），不符合「不被呼吸道吸收」的描述。","錯誤：formoterol 是長效 β2 腎上腺素性受體致效劑（LABA），以吸入方式給藥後部分被吸收，產生全身性 β2 效果，不是局部 atropine 功能的藥物。","錯誤：cromoglycate（色甘酸）是肥大細胞穩定劑，預防肥大細胞脫顆粒，其機制與 atropine 的毒蕈鹼性受體拮抗完全不同，不具有類 atropine 的功能。","此為正確答案。Ipratropium 的四銨結構使其無法穿透呼吸道黏膜，吸入後僅在局部氣道發揮類 atropine 的抗膽鹼作用，擴張支氣管且全身副作用少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_063","year":2024,"roc_year":113,"session":"","examNo":63,"q":"下列何者的主要作用部位不包括支氣管平滑肌細胞，必須預防性投予？","opts":["A. flunisolide","B. ipratropium","C. cromolyn","D. terbutaline"],"ans":2,"exp":"Cromolyn sodium（色甘酸鈉）是肥大細胞穩定劑，作用於氣道壁的肥大細胞，抑制其脫顆粒（degranulation）和炎症介質（組織胺、LT、PG）釋放，並不直接作用於支氣管平滑肌細胞，因此不能立即緩解急性支氣管痙攣。必須預防性規律投予，才能在過敏原暴露前穩定肥大細胞，預防氣喘發作。其他選項：flunisolide（吸入性皮質素）抗炎，對平滑肌間接有效；ipratropium 直接阻斷平滑肌 M3 受體；terbutaline 直接激活平滑肌 β2 受體，均直接作用於平滑肌或具即時效果。","we":["錯誤：flunisolide 是吸入性糖皮質激素，具抗炎作用，長期使用可降低氣道炎症反應，雖非直接作用於平滑肌受體，但通常也預防性使用，不是本題唯一答案。","錯誤：ipratropium 直接作用於支氣管平滑肌細胞的 M3 受體，阻斷 ACh 引起的收縮，能快速引起支氣管擴張，其主要作用部位包含支氣管平滑肌細胞。","此為正確答案。Cromolyn sodium 的主要標的是氣道壁的肥大細胞，而非支氣管平滑肌細胞本身，因此不能緩解急性氣喘，必須預防性規律投予以穩定肥大細胞。","錯誤：terbutaline 是 β2 腎上腺素性受體致效劑，直接作用於支氣管平滑肌細胞的 β2 受體，引起平滑肌鬆弛和支氣管擴張，能快速緩解急性支氣管痙攣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_064","year":2024,"roc_year":113,"session":"","examNo":64,"q":"下列何者不具有支氣管擴張作用？","opts":["A. methylxanthines","B. cholinergic antagonists","C. β-receptor agonists","D. α-receptor agonists"],"ans":3,"exp":"支氣管平滑肌主要含有 β2 腎上腺素性受體，β2 致效後引起平滑肌鬆弛（支氣管擴張）。α 受體致效劑（α-receptor agonists）主要引起血管收縮，支氣管平滑肌上 α 受體數量極少且功能有限，因此 α 受體致效劑不具有臨床上有意義的支氣管擴張作用。Methylxanthines（如 theophylline）透過抑制 PDE，增加 cAMP；cholinergic antagonists（如 ipratropium）阻斷 M3 受體的支氣管收縮；β-receptor agonists 直接激活 β2 受體，三者均具有支氣管擴張作用。","we":["此為正確描述：methylxanthines（如 theophylline）透過抑制磷酸二酯酶（PDE）增加細胞內 cAMP，引起支氣管平滑肌鬆弛，具有支氣管擴張作用，不符合題目問的「不具」支氣管擴張作用。","此為正確描述：cholinergic antagonists（抗膽鹼藥物，如 ipratropium）阻斷 M3 受體，防止 ACh 引起的支氣管收縮，具有支氣管擴張作用，不符合題目問的「不具」支氣管擴張作用。","此為正確描述：β-receptor agonists（如 albuterol、terbutaline）是最直接的支氣管擴張劑，激活平滑肌 β2 受體後透過 cAMP 增加引起支氣管擴張，不符合題目問的「不具」支氣管擴張作用。","錯誤：α-receptor agonists 主要引起血管收縮（如 phenylephrine 縮小鼻黏膜血管），支氣管平滑肌缺乏足夠的功能性 α 受體，因此 α 受體致效劑不能引起支氣管擴張，這是本題正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_065","year":2024,"roc_year":113,"session":"","examNo":65,"q":"下列何者阻斷第一型組織胺受體，可用於治療貓的氣喘？","opts":["A. zafirlukast","B. cyproheptadine","C. ketanserin","D. cisapride"],"ans":1,"exp":"Cyproheptadine 是第一代 H1 受體阻斷劑，同時也是 5-HT2 血清素受體拮抗劑。在貓，血清素（serotonin）透過 5-HT2 受體介導支氣管收縮，cyproheptadine 透過拮抗 H1 及 5-HT2 受體，能緩解貓氣喘時的支氣管痙攣，臨床用於貓氣喘的輔助治療。Zafirlukast 是白三烯素受體拮抗劑（LTRA），阻斷 CysLT1 受體；ketanserin 是選擇性 5-HT2 受體拮抗劑（主要用於高血壓），無 H1 阻斷作用；cisapride 是 5-HT4 受體致效劑（促胃腸蠕動），與氣喘治療無關。","we":["錯誤：zafirlukast 是白三烯素受體拮抗劑（LTRA），阻斷 CysLT1（leukotriene D4/E4）受體，雖用於氣喘，但其機制為拮抗白三烯素而非阻斷 H1 組織胺受體。","此為正確答案。Cyproheptadine 是 H1 受體阻斷劑，同時具 5-HT2 拮抗作用，能減輕貓氣喘中血清素及組織胺介導的支氣管痙攣，是貓氣喘輔助治療藥物。","錯誤：ketanserin 是選擇性 5-HT2（血清素）受體拮抗劑，主要用於高血壓，雖有一定 H1 阻斷作用，但臨床上不以氣喘治療為主要適應症。","錯誤：cisapride 是 5-HT4 受體致效劑，作用為促進胃腸蠕動，與 H1 受體拮抗或貓氣喘治療無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_066","year":2024,"roc_year":113,"session":"","examNo":66,"q":"下列何者以局部噴霧投予，用以減輕馬因麻醉引起之氣管充血與水腫？","opts":["A. guaifenesin","B. terbutaline","C. phenylephrine","D. ipratropium bromide"],"ans":2,"exp":"Phenylephrine 是選擇性 α1 腎上腺素性受體致效劑，局部噴霧投予後引起黏膜血管強力收縮，有效減輕馬在麻醉過程中氣管插管或鼻氣管造成的充血（hyperemia）與水腫（edema）。Guaifenesin 是祛痰劑兼肌肉鬆弛劑（甘油醚類），用於馬的麻醉誘導輔助，非減輕水腫；terbutaline 是 β2 致效劑（支氣管擴張），不具血管收縮作用；ipratropium bromide 是抗膽鹼支氣管擴張劑，不用於減輕黏膜充血。","we":["錯誤：guaifenesin（甘油醚）是祛痰劑，大劑量靜脈注射時在馬有中樞肌肉鬆弛效果，用於輔助麻醉誘導，但不具收縮黏膜血管以減輕充血水腫的作用。","錯誤：terbutaline 是 β2 腎上腺素性受體致效劑，主要引起支氣管平滑肌鬆弛（支氣管擴張），不作用於 α1 受體，不能收縮黏膜血管以減輕水腫。","此為正確答案。Phenylephrine 是 α1 受體致效劑，局部噴霧後強力收縮氣管黏膜血管，有效減輕馬麻醉後氣管插管引起的充血與水腫，為此適應症的標準用藥。","錯誤：ipratropium bromide 是四銨類抗膽鹼藥物，用於支氣管擴張（阻斷 M3 受體），對黏膜血管充血無直接收縮作用，不適用於減輕氣管水腫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_067","year":2024,"roc_year":113,"session":"","examNo":67,"q":"由氣管投予下列何者可協助改善新生小馬呼吸困難？","opts":["A. sildenafil","B. doxapram","C. glyceryl guaiacolate","D. poractant alfa"],"ans":3,"exp":"Poractant alfa（Curosurf）是豬源性肺表面張力素（surfactant），直接由氣管內灌注投予（intratracheal instillation），補充早產或新生小馬缺乏的肺表面張力素，降低肺泡表面張力，防止肺泡塌陷，改善呼吸困難（neonatal respiratory distress syndrome）。Sildenafil 是 PDE5 抑制劑（用於肺高壓）；doxapram 是呼吸中樞興奮劑（非肺表面張力素替代）；glyceryl guaiacolate 是肌肉鬆弛劑/祛痰劑，不適用於此情況。","we":["錯誤：sildenafil 是 PDE5 抑制劑，透過增加 cGMP 引起肺血管擴張，用於肺動脈高壓的治療，不是新生小馬呼吸困難的氣管內表面張力素替代療法。","錯誤：doxapram 是呼吸中樞興奮劑，可刺激呼吸驅動力，用於新生幼畜窒息的緊急處置，但不能補充肺表面張力素，不適合以氣管投予改善表面張力素缺乏性呼吸困難。","錯誤：glyceryl guaiacolate（甘油醚）是祛痰劑兼肌肉鬆弛劑，靜脈大劑量用於馬的麻醉誘導，不用於氣管內投予以治療新生小馬的呼吸困難。","此為正確答案。Poractant alfa（Curosurf）是豬源性肺表面張力素，由氣管內灌注補充新生小馬肺表面張力素的不足，降低肺泡表面張力，有效改善新生馬駒的呼吸困難。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_068","year":2024,"roc_year":113,"session":"","examNo":68,"q":"下列何者是cromolyn sodium發揮藥理作用的主要標的細胞？","opts":["A. eosinophil","B. neutrophil","C. lymphocyte","D. mast cell"],"ans":3,"exp":"Cromolyn sodium（色甘酸鈉）透過穩定肥大細胞（mast cell）的細胞膜，抑制其去極化及細胞內鈣離子濃度上升，從而阻斷肥大細胞脫顆粒（degranulation），防止組織胺、白三烯素、前列腺素等炎症介質釋放。肥大細胞是 cromolyn 發揮藥理作用的主要且直接標的細胞，嗜酸性球（eosinophil）雖參與過敏晚期反應，但非 cromolyn 的直接作用標的。","we":["錯誤：嗜酸性球（eosinophil）參與過敏反應的晚期階段（late-phase reaction），cromolyn 雖可間接減少嗜酸性球的浸潤（透過減少肥大細胞釋放的趨化因子），但並非其直接的主要標的細胞。","錯誤：嗜中性球（neutrophil）主要參與急性炎症反應，不是 cromolyn sodium 的主要藥理作用標的。","錯誤：淋巴球（lymphocyte）在適應性免疫中發揮作用，cromolyn 不直接作用於淋巴球，其機制與淋巴球活化無關。","此為正確答案。Mast cell（肥大細胞）是 cromolyn sodium 的主要標的細胞，cromolyn 穩定肥大細胞膜，抑制其脫顆粒和炎症介質釋放，是過敏性氣喘的預防用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_069","year":2024,"roc_year":113,"session":"","examNo":69,"q":"下列何者是抗組織胺藥物diphenhydramine最不可能引起的副作用？","opts":["A. 鎮靜嗜睡","B. 口腔黏膜乾燥","C. 尿滯留","D. 噁心嘔吐"],"ans":3,"exp":"Diphenhydramine 是第一代 H1 受體阻斷劑，具顯著抗膽鹼（antimuscarinic）活性，常見副作用包括：（1）鎮靜嗜睡（中樞 H1 阻斷）；（2）口腔黏膜乾燥（抗 M3 受體）；（3）尿滯留（抗 M2/M3 膀胱平滑肌）。噁心嘔吐（nausea/vomiting）並非 diphenhydramine 的預期副作用；事實上，diphenhydramine 本身常被用作止吐劑（如治療運動病），因此引起嘔吐是最不可能的副作用。","we":["此為正確描述：鎮靜嗜睡是 diphenhydramine 阻斷中樞 H1 受體的典型效果，這確實是 diphenhydramine 會引起的副作用，不符合題目問的「最不可能」。","此為正確描述：口腔黏膜乾燥（口乾）是 diphenhydramine 抗膽鹼（M3 受體阻斷）的典型副作用，確實會發生，不符合題目問的「最不可能」。","此為正確描述：尿滯留是 diphenhydramine 抗膽鹼作用使膀胱逼尿肌收縮受抑、膀胱括約肌張力增加的結果，確實會發生，不符合題目問的「最不可能」。","錯誤：噁心嘔吐並非 diphenhydramine 預期的副作用；diphenhydramine 反而具有止吐效果（阻斷前庭的 H1 受體），常用於預防運動病引起的嘔吐。因此噁心嘔吐是本題「最不可能引起」的副作用，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_070","year":2024,"roc_year":113,"session":"","examNo":70,"q":"下列何者是長期接受aspirin治療之動物於外科手術前7天應停止給藥的主要原因？","opts":["A. Aspirin容易引起消化道的不良反應，如嘔吐","B. Aspirin抑制血小板的作用時間長，提高手術出血的風險","C. Aspirin會誘發體內酸鹼不平衡，導致呼吸性酸中毒血症","D. Aspirin對手術的疼痛無效"],"ans":1,"exp":"Aspirin 透過不可逆性乙醯化（acetylation）環氧酶（COX-1 和 COX-2），永久抑制血小板的 TXA2 合成，阻斷血小板聚集功能。由於血小板無法合成新的 COX 酶（血小板無核），此抑制效果持續整個血小板壽命（約 7-10 天），需等待新血小板生成。因此手術前 7 天必須停藥，以降低術中及術後的出血風險。這是主要原因，而非 GI 不良反應（雖存在但非停藥主因）或酸鹼失衡。","we":["錯誤：雖然 aspirin 確實可能引起消化道不良反應（如嘔吐、GI 潰瘍），但這並非術前 7 天停藥的主要原因；手術前停藥的核心考量是不可逆性血小板功能抑制導致的出血風險。","此為正確答案。Aspirin 不可逆性乙醯化血小板 COX-1，使血小板失去合成 TXA2 的能力，此效果持續整個血小板壽命（7-10 天），術前 7 天停藥是為了讓足夠數量的新血小板生成，降低術中出血風險。","錯誤：aspirin 大劑量時可影響酸鹼平衡（水楊酸中毒引起呼吸性鹼中毒繼而代謝性酸中毒），但常規治療劑量下術前停藥的考量並非酸鹼問題，且選項描述的「呼吸性酸中毒」機制亦有誤。","錯誤：aspirin 具有鎮痛效果，對手術疼痛並非完全無效；術前停藥是基於抗血小板引起的出血風險，而非鎮痛無效的考量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_071","year":2024,"roc_year":113,"session":"","examNo":71,"q":"下列何者對犬可能會引起乾性角結膜炎（keratoconjunctivitis sicca）因而在投藥期間需要監測淚液的分\r 泌？","opts":["A. deracoxib","B. etodolac","C. flunixin","D. meloxicam"],"ans":1,"exp":"Etodolac 是 COX-2 偏選性 NSAID，在犬已有引起乾性角結膜炎（keratoconjunctivitis sicca, KCS，乾眼症）的病例報告。其確切機制尚不完全清楚，可能與淚腺功能受影響有關。臨床使用 etodolac 期間應定期監測淚液分泌量（Schirmer tear test），如出現 KCS 應立即停藥。Deracoxib、flunixin、meloxicam 在犬均不以 KCS 為已知的特異性不良反應。","we":["錯誤：deracoxib 是 COX-2 選擇性 NSAID，雖有 GI 副作用，但並非以犬的乾性角結膜炎（KCS）為已知特異性副作用。","此為正確答案。Etodolac 在犬已有引起乾性角結膜炎的病例報告，使用期間需監測 Schirmer 淚液試驗，若出現淚液分泌不足應停藥。","錯誤：flunixin meglumine 是 COX 抑制性 NSAID（對 COX-1 和 COX-2 均有抑制），常見副作用為 GI 損傷和腎毒性，不以 KCS 為犬的特異性副作用。","錯誤：meloxicam 是 COX-2 偏選性 NSAID，在犬貓廣泛使用，主要副作用為 GI 和腎臟，不以乾性角結膜炎為已知的特異性副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_072","year":2024,"roc_year":113,"session":"","examNo":72,"q":"下列何者抑制leukotriene B4（LB4）生成的作用最顯著？","opts":["A. meloxicam","B. montelukast","C. tepoxalin","D. trilostane"],"ans":2,"exp":"Leukotriene B4（LTB4）是花生四烯酸（arachidonic acid）經 5-脂氧合酶（5-LOX）代謝產生的強力炎症介質。Tepoxalin 是雙重 COX/5-LOX 抑制劑，同時抑制環氧酶（COX）和 5-脂氧合酶（5-LOX）途徑，因此能顯著抑制 LTB4 的生成（5-LOX 途徑的產物）。Meloxicam 僅抑制 COX（不抑制 LOX）；montelukast 是 LTD4 受體拮抗劑（不抑制 LTB4 合成）；trilostane 是 3β-HSD 抑制劑（用於腎上腺皮質醇過多症），與 LTB4 無關。","we":["錯誤：meloxicam 是選擇性 COX-2 抑制劑，僅作用於環氧酶途徑，不抑制 5-脂氧合酶（5-LOX），因此不能減少 LTB4（5-LOX 代謝產物）的生成。","錯誤：montelukast 是 CysLT1（leukotriene D4 和 E4）受體拮抗劑，它阻斷白三烯素與受體結合，但不抑制白三烯素的合成酶（5-LOX），無法直接抑制 LTB4 的生成。","此為正確答案。Tepoxalin 是雙重 COX/5-LOX 抑制劑，透過抑制 5-脂氧合酶直接減少 LTB4 的合成，對 LTB4 生成的抑制作用在本題選項中最為顯著。","錯誤：trilostane 是 3β-羥基類固醇去氫酶（3β-HSD）抑制劑，用於治療犬的庫欣氏症（hyperadrenocorticism），與花生四烯酸代謝途徑和 LTB4 生成無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_073","year":2024,"roc_year":113,"session":"","examNo":73,"q":"下列何者是腎素（renin）的抑制劑？","opts":["A. aliskiren","B. captopril","C. carprofen","D. valsartan"],"ans":0,"exp":"Aliskiren 是直接腎素抑制劑（direct renin inhibitor, DRI），結合腎素（renin）活性位置，阻斷腎素將血管緊張素原（angiotensinogen）轉化為血管緊張素 I（Ang I）的步驟，從源頭抑制腎素-血管緊張素-醛固酮系統（RAAS）。Captopril 是 ACE 抑制劑（阻斷 Ang I→Ang II）；carprofen 是 NSAID；valsartan 是 ARB（Ang II 受體阻斷劑）。Aliskiren 是唯一作用於腎素本身的藥物。","we":["此為正確答案。Aliskiren 是直接腎素抑制劑，結合並抑制腎素的蛋白水解活性，阻斷 RAAS 的第一步（angiotensinogen→Ang I），是降血壓藥物中唯一直接針對腎素的藥物。","錯誤：captopril 是 ACE 抑制劑（angiotensin-converting enzyme inhibitor），作用於 RAAS 的第二步（Ang I→Ang II），並非直接抑制腎素。","錯誤：carprofen 是非甾體抗炎藥（NSAID），透過抑制 COX 發揮鎮痛抗炎作用，與腎素-血管緊張素系統無關。","錯誤：valsartan 是血管緊張素 II 受體阻斷劑（ARB），作用於 AT1 受體，阻斷 Ang II 的效應，但不影響腎素本身的活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_074","year":2024,"roc_year":113,"session":"","examNo":74,"q":"下列何者為分泌ghrelin之最主要器官？","opts":["A. 肝臟","B. 腦下垂體","C. 胃","D. 腎臟"],"ans":2,"exp":"Ghrelin 是「飢餓激素」，主要由胃底（gastric fundus）的 X/A 型內分泌細胞分泌，餐前分泌增加，作用於下視丘的 GHSR（growth hormone secretagogue receptor）刺激食慾，同時也刺激生長激素（GH）的釋放。胃（胃底）是全身分泌 ghrelin 最主要的器官（占全身 ghrelin 約 60-70%）；少量也由腸道、腎臟、胰臟分泌，但量遠少於胃。","we":["錯誤：肝臟主要分泌 IGF-1（類胰島素生長因子）、白蛋白、凝血因子等，不是分泌 ghrelin 的主要器官。","錯誤：腦下垂體分泌生長激素（GH）、TSH、ACTH 等，Ghrelin 可刺激腦下垂體前葉釋放 GH，但腦下垂體本身不是分泌 ghrelin 的主要器官。","此為正確答案。胃（尤其是胃底）是分泌 ghrelin 的最主要器官，約占全身 ghrelin 分泌量的 60-70%，餐前血中 ghrelin 濃度升高以刺激食慾。","錯誤：腎臟不是分泌 ghrelin 的主要器官；腎臟的主要內分泌功能包括分泌腎素（renin）、促紅血球生成素（EPO）和活化維生素 D。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_075","year":2024,"roc_year":113,"session":"","examNo":75,"q":"下列藥物何者常用於治療犬隻甲狀腺功能低下症（hypothyroidism）？","opts":["A. thiouracil","B. levothyroxine","C. propylthiouracil","D. trilostane"],"ans":1,"exp":"犬甲狀腺功能低下症（hypothyroidism）是犬最常見的內分泌疾病，標準治療為口服 levothyroxine（L-thyroxine，合成 T4），通常每日或每日兩次給藥，根據臨床反應及血中 T4 濃度調整劑量。Thiouracil 和 propylthiouracil 是抗甲狀腺藥物（用於甲狀腺功能亢進，非低下）；trilostane 是 3β-HSD 抑制劑（用於庫欣氏症）。","we":["錯誤：thiouracil 是抗甲狀腺藥物，透過抑制甲狀腺素合成的過氧化酶步驟來降低甲狀腺素濃度，用於治療甲狀腺功能亢進（hyperthyroidism），而非低下症。","此為正確答案。Levothyroxine（合成 T4）是犬甲狀腺功能低下症的標準替代療法，口服補充缺乏的甲狀腺素，恢復正常代謝功能。","錯誤：propylthiouracil（PTU）是抗甲狀腺藥物，抑制甲狀腺素合成及 T4→T3 的周邊轉換，用於甲狀腺功能亢進，不適用於甲狀腺功能低下。","錯誤：trilostane 是 3β-HSD 抑制劑，抑制腎上腺皮質醇（cortisol）合成，用於治療犬的庫欣氏症（hyperadrenocorticism），與甲狀腺疾病無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_076","year":2024,"roc_year":113,"session":"","examNo":76,"q":"下列何者為藥物acarbose之主要副作用？","opts":["A. 泌尿道感染","B. 低血糖","C. 心血管副作用","D. 腸胃道紊亂"],"ans":3,"exp":"Acarbose 是 α-葡萄糖苷酶（α-glucosidase）抑制劑，阻斷腸道對多醣類和寡醣類的分解消化，使未消化的碳水化合物進入結腸，被腸道細菌發酵產生氣體（脹氣、排氣）和有機酸，導致腸胃道不適，包括：腹脹、排氣增多、腹瀉、腹部不適等。這是 acarbose 最主要的副作用，通常在治療初期最明顯，隨時間可能改善。Acarbose 不刺激胰島素分泌，單獨使用不引起低血糖，也不顯著增加心血管或泌尿道感染風險。","we":["錯誤：泌尿道感染是 SGLT2 抑制劑（如 empagliflozin）的特有副作用，因其機制是促進葡萄糖由尿液排出，提供細菌生長基質；acarbose 無此風險。","錯誤：低血糖是磺醯脲類（sulfonylgurea）或胰島素的副作用；acarbose 僅延緩碳水化合物吸收，不刺激胰島素分泌，單獨使用不引起低血糖。","錯誤：心血管副作用不是 acarbose 的主要安全顧慮；acarbose 的心臟安全性良好，無顯著心血管不良反應。","此為正確答案。Acarbose 最主要的副作用是腸胃道紊亂（如腹脹、排氣增多、腹瀉），源於未消化碳水化合物在結腸中被細菌發酵，通常在治療初期最明顯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_077","year":2024,"roc_year":113,"session":"","examNo":77,"q":"比較下列glucocorticoids，何者屬作用短效？","opts":["A. dexamethasone","B. prednisone","C. betamethasone","D. flumethasone"],"ans":1,"exp":"糖皮質激素依生物半衰期分類：短效（biological half-life 8-12 小時，作用持續 12-36 小時）：hydrocortisone、cortisone、prednisone、prednisolone；中效（作用持續 24-48 小時）：triamcinolone、methylprednisolone；長效（作用持續 >48 小時）：dexamethasone、betamethasone、flumethasone。本題選項中，dexamethasone（A）、betamethasone（C）、flumethasone（D）均為長效；prednisone（B）屬短效，作用時間最短，為本題答案。","we":["錯誤：dexamethasone 是長效糖皮質激素，生物半衰期長（>48 小時），抗炎效力強（相對於 hydrocortisone 約 25 倍），不屬於短效分類。","此為正確答案。Prednisone 屬於短效糖皮質激素，生物作用持續時間約 12-36 小時，在本題選項（dexamethasone、betamethasone、flumethasone 均為長效）中，prednisone 的作用時間最短。","錯誤：betamethasone 是長效糖皮質激素，作用持續時間 >48 小時，抗炎效力高，不屬於短效分類。","錯誤：flumethasone 是長效糖皮質激素，作用持續時間 >48 小時，常用於抗炎及皮膚科疾病，不屬於短效分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_078","year":2024,"roc_year":113,"session":"","examNo":78,"q":"下列藥物何者用於艾迪森氏病（Addison's disease）之治療？","opts":["A. fludrocortisone","B. trilostane","C. L-deprenyl","D. sitagliptine"],"ans":0,"exp":"Addison's disease（原發性腎上腺皮質功能低下，艾迪森氏病）的特徵是腎上腺皮質分泌不足，包括糖皮質激素（cortisol）和礦物皮質激素（aldosterone）均缺乏。Fludrocortisone 是合成礦物皮質激素，具強大的 aldosterone 樣活性，用於補充 Addison's disease 中缺乏的礦物皮質激素（維持 Na+/K+ 平衡、血壓及血量）。Trilostane 用於庫欣氏症（hyperadrenocorticism）；L-deprenyl（selegiline）用於 PDH 型庫欣氏症或犬認知功能障礙；sitagliptine 是 DPP-4 抑制劑（糖尿病用藥）。","we":["此為正確答案。Fludrocortisone 是合成礦物皮質激素，主要用於 Addison's disease 的礦物皮質激素替代治療，維持 Na+/K+ 平衡、血壓正常，是 Addison's disease 標準長期治療藥物之一。","錯誤：trilostane 是 3β-HSD 抑制劑，抑制腎上腺皮質醇合成，用於治療犬庫欣氏症（hypercortisolism），是 Addison's disease 的反向疾病（腎上腺功能亢進），不可用於 Addison's 治療。","錯誤：L-deprenyl（selegiline）是 MAO-B 抑制劑，用於 PDH 型庫欣氏症（腦下垂體依賴性）或犬認知功能障礙，不適用於 Addison's disease。","錯誤：sitagliptine 是 DPP-4（二肽基肽酶 4）抑制劑，用於糖尿病的血糖控制，與腎上腺皮質功能低下的治療無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_079","year":2024,"roc_year":113,"session":"","examNo":79,"q":"下列何者非糖皮質激素（glucocorticoids）的藥理作用？","opts":["A. 抗發炎","B. 抑制免疫系統","C. 抗過敏","D. 增加蛋白質合成"],"ans":3,"exp":"糖皮質激素（glucocorticoids）的主要藥理作用包括：抗發炎、抑制免疫系統、抗過敏、促進糖質新生（gluconeogenesis）、分解蛋白質（蛋白質異化作用，catabolic effect）。長期使用糖皮質激素會導致肌肉萎縮、傷口癒合不良，正是因為其蛋白質分解（抑制蛋白質合成）效應。「增加蛋白質合成」是雄性激素（anabolic steroids）的作用，非糖皮質激素的藥理作用，故為本題答案。","we":["此為正確描述：抗發炎是糖皮質激素最重要的藥理作用（抑制 PLA2、減少花生四烯酸代謝物），不符合題目問的「非」糖皮質激素作用。","此為正確描述：抑制免疫系統（如抑制 T 淋巴球活化、減少細胞激素生成）是糖皮質激素的典型藥理作用，不符合題目問的「非」藥理作用。","此為正確描述：抗過敏（減輕 IgE 介導的過敏反應、穩定肥大細胞）是糖皮質激素的藥理作用，不符合題目問的「非」藥理作用。","錯誤：增加蛋白質合成是雄性激素（anabolic androgenic steroids）的作用；糖皮質激素恰好相反，具有蛋白質分解（catabolic）效應，導致肌肉萎縮。因此增加蛋白質合成不是糖皮質激素的藥理作用，為本題正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_080","year":2024,"roc_year":113,"session":"","examNo":80,"q":"下列何者抑制催乳素（prolactin）的分泌？","opts":["A. dopamine","B. serotonin","C. histamine","D. oxytocin"],"ans":0,"exp":"多巴胺（dopamine）由下視丘弓狀核（arcuate nucleus）分泌，透過垂體門脈系統到達腦下垂體前葉，與腺垂體催乳素細胞的 D2 受體結合，強力抑制催乳素（prolactin）的分泌。多巴胺是最主要的催乳素抑制激素（prolactin-inhibiting hormone, PIH）。臨床上，多巴胺致效劑（如 cabergoline、bromocriptine）用於治療高催乳素血症或終止泌乳；血清素（serotonin）可促進 prolactin 釋放；histamine 效果不顯著；oxytocin 主要刺激子宮收縮和泌乳排乳，不直接抑制 prolactin 分泌。","we":["此為正確答案。Dopamine（多巴胺）是下視丘分泌的天然催乳素抑制激素（PIH），透過 D2 受體持續抑制腺垂體的催乳素分泌。臨床使用多巴胺致效劑（如 cabergoline）可有效降低過高的 prolactin 濃度。","錯誤：serotonin（血清素）對催乳素分泌有促進作用，可刺激腦下垂體前葉釋放 prolactin，與多巴胺的抑制效果相反。","錯誤：histamine 對催乳素分泌的調控作用不顯著，不是主要的催乳素調節物質，也非抑制 prolactin 的生理機制。","錯誤：oxytocin（催產素）由下視丘視上核和室旁核合成，儲存於腦下垂體後葉，主要功能是刺激子宮收縮和觸發泌乳噴出（milk ejection reflex），不直接抑制腦下垂體前葉的 prolactin 分泌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_001","year":2025,"roc_year":114,"session":"","examNo":1,"q":"有關胰島素（insulin）之訊息傳遞特徵，下列何者正確？","opts":["A. 其受體存在於細胞質","B. 與受體結合後啟動磷酸化","C. 其受體特徵為離子通道（ion channel）","D. 不需要消耗ATP"],"ans":1,"exp":"胰島素受體（insulin receptor）屬於跨膜酪胺酸激酶受體（transmembrane receptor tyrosine kinase），位於細胞表面而非細胞質。胰島素與受體結合後，受體發生自體磷酸化（autophosphorylation），啟動下游訊息傳遞，整個過程需要消耗ATP。","we":["錯誤：胰島素受體位於細胞表面（跨膜蛋白），而非細胞質中；位於細胞質的是核受體（如類固醇受體）。","","錯誤：胰島素受體的特徵是酪胺酸激酶（tyrosine kinase）受體，而非離子通道型受體（如菸鹼型乙醯膽鹼受體）。","錯誤：胰島素受體的磷酸化反應需要ATP作為磷酸基來源，不是不需要ATP。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_002","year":2025,"roc_year":114,"session":"","examNo":2,"q":"Metoclopramide與atropine併用，對於胃排空的影響屬於何種作用？","opts":["A. 受體拮抗（receptor antagonism）","B. 生理性拮抗（physiologic antagonism）","C. 相加作用（additive effect）","D. 相乘作用（synergistic effect）"],"ans":1,"exp":"生理性拮抗（physiologic antagonism）指兩種藥物透過不同受體或機制產生相反的生理效果，而非競爭同一受體。Metoclopramide促進胃排空（D2拮抗劑＋促動劑），atropine（毒蕈鹼受體拮抗劑）抑制胃排空，兩者作用位點不同，效果相互抵消，屬生理性拮抗。","we":["錯誤：受體拮抗（receptor antagonism）指兩藥競爭同一受體，metoclopramide與atropine並非競爭相同受體。","","錯誤：相加作用指兩藥藥效在同一方向疊加，但metoclopramide與atropine對胃排空效果相反，不是同向相加。","錯誤：相乘作用指兩藥合用效果超過各自之和，同樣是指同向協同，而非拮抗關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_003","year":2025,"roc_year":114,"session":"","examNo":3,"q":"有關種別差異，下列敘述何者錯誤？","opts":["A. 相對非草食動物，草食動物口服藥物之吸收較慢","B. 貓對opioids的敏感性較犬低","C. ivermectin容易堆積在烏龜腦中","D. 狗對於sulfonamides的N4-acetylation較差"],"ans":1,"exp":"貓缺乏UDP-葡萄醛酸轉移酶（UGT1A6）（glucuronosyltransferase），對opioids的代謝能力較差，因此貓對opioids的敏感性遠高於犬（易出現CNS興奮、散瞳等副作用），題目選項B說「較低」為錯誤描述，是本題答案。","we":["此為正確描述：相對非草食動物，草食動物（如馬）消化道較長、瘤胃微生物代謝作用強，口服藥物吸收確實較慢，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","","此為正確描述：ivermectin是P-gp（P-glycoprotein）受質，龜類的血腦屏障P-gp表達不足，導致ivermectin易蓄積在腦中造成神經毒性，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：犬缺乏N-乙醯轉移酶（N-acetyltransferase），對sulfonamides的N4-acetylation代謝能力較差，此陳述符合藥理事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_004","year":2025,"roc_year":114,"session":"","examNo":4,"q":"下列有關改變尿液酸鹼值的敘述，何者正確？","opts":["A. 鹼化尿液會增加sulfonamides的腎毒性","B. 酸化尿液可增加methenamine的治療效果","C. 只要改變尿液的酸鹼值，即可明顯改變藥品的再吸收","D. doxycycline可酸化尿液，故會增加furosemide的腎毒性"],"ans":1,"exp":"Methenamine（烏洛托品）在酸性尿液中（pH < 5.5）才能水解為具殺菌活性的甲醛（formaldehyde），因此酸化尿液可增強其療效。鹼化尿液反而使sulfonamides保持離子化狀態、溶解度提高，可降低腎小管結晶與腎毒性，並非增加毒性。","we":["錯誤：鹼化尿液使sulfonamides維持離子化、溶解度增加，反而可降低腎毒性（防止結晶），不是增加腎毒性。","","錯誤：pH改變必須超越藥物的pKa，才能顯著影響其離子化程度與腎小管再吸收，並非任何pH改變都有明顯效果。","錯誤：doxycycline與furosemide腎毒性的組合並未與尿液酸化有直接證據上的交互作用，此陳述不準確且與藥理機轉不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_005","year":2025,"roc_year":114,"session":"","examNo":5,"q":"下列有關腸肝循環（enterohepatic recycling）的敘述，何者正確？","opts":["A. 愈容易離子化的藥品愈容易發生","B. 能夠被再吸收的藥品必定是氧化物","C. 腸肝循環不會增加有毒物質的毒性","D. 可利用腸肝循環的現象治療膽囊感染"],"ans":3,"exp":"腸肝循環（enterohepatic circulation）中，藥物隨膽汁排入腸道後，腸道細菌可將結合型代謝物水解，釋出遊離藥物再被吸收。分泌入膽汁的藥物在膽道中濃度高，可用於治療膽囊或膽管感染（如某些抗生素）。","we":["錯誤：腸肝循環的藥物多為脂溶性、易結合型（葡萄醣醛酸結合物）後分泌入膽汁，不是越容易離子化越容易發生，反而離子化程度高者較難被再吸收。","錯誤：腸肝循環的再吸收物質不一定是氧化物，通常是被細菌去結合的藥物原型或活性代謝物。","錯誤：腸肝循環會使毒性物質反覆被吸收、在體內滯留更長時間，確實可能增加毒性，並非「不會增加毒性」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_006","year":2025,"roc_year":114,"session":"","examNo":6,"q":"以靜脈注射給予4 mg某藥物，此藥物分布體積為4 L，經過4小時後，此藥物之血漿濃度為500 &mu;g/L。則此藥物之半衰期為多少小時？","opts":["A. 1","B. 2","C. 4","D. 8"],"ans":2,"exp":"初始濃度C0 = 4 mg ÷ 4 L = 1 mg/L = 1000 μg/L。給藥後4小時濃度為500 μg/L，恰好是初始濃度的一半，因此一個半衰期 = 4小時。","we":["錯誤：若半衰期為1小時，4小時後濃度應為1000×(1/2)^4 = 62.5 μg/L，不符合題目500 μg/L。","錯誤：若半衰期為2小時，4小時後濃度應為1000×(1/2)^2 = 250 μg/L，不符合題目500 μg/L。","","錯誤：若半衰期為8小時，4小時後濃度應為1000×(1/2)^0.5 ≈ 707 μg/L，不符合題目500 μg/L。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_007","year":2025,"roc_year":114,"session":"","examNo":7,"q":"與健康動物相比，腎衰竭動物在藥物動力學上之敘述，下列何者錯誤？","opts":["A. 影響血漿蛋白結合","B. 到達穩態濃度時間縮短","C. 清除率下降","D. 給藥時間應延長"],"ans":1,"exp":"腎衰竭時清除率（CL）下降，半衰期（t1/2 = 0.693×Vd/CL）延長，而到達穩態濃度所需時間約為5個半衰期，因此到達穩態的時間應「延長」而非「縮短」，選項B「到達穩態濃度時間縮短」為錯誤描述，是本題答案。","we":["此為正確描述：腎衰竭時體液瀦留、低白蛋白血症，可影響血漿蛋白結合率，從而改變藥物分布，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","","此為正確描述：腎臟是許多藥物的主要排除途徑，腎衰竭導致清除率下降，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：腎衰竭時半衰期延長，給藥間隔應相應延長以避免蓄積中毒，此陳述符合藥理事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_008","year":2025,"roc_year":114,"session":"","examNo":8,"q":"Gabapentin止痛效果與下列何離子的改變，進而抑制麩胺酸的釋放有關？","opts":["A. 鈣離子降低","B. 鈉離子增加","C. 鉀離子降低","D. 氯離子增加"],"ans":0,"exp":"Gabapentin與電壓閘控鈣離子通道（VGCC）的α2δ次單元結合，抑制突觸前鈣離子（Ca2+）內流，從而減少麩胺酸等興奮性神經傳遞物質的釋放，達到鎮痛及抗癲癇效果。","we":["","錯誤：Gabapentin的鎮痛機制與鈉離子通道無關；鈉離子通道阻斷是局部麻醉劑或某些抗癲癇藥（如carbamazepine）的作用機制。","錯誤：Gabapentin並不影響鉀離子通道；調節鉀離子通道的藥物包含某些抗心律不整藥（如amiodarone）。","錯誤：Gabapentin與氯離子通道無關；氯離子通道調控與GABA-A受體相關（如苯二氮平類藥物）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_009","year":2025,"roc_year":114,"session":"","examNo":9,"q":"下列何者是morphine過量或急性中毒時的解毒劑？","opts":["A. methadone","B. tramadol","C. codeine","D. naloxone"],"ans":3,"exp":"Naloxone為純競爭性鴉片受體拮抗劑（μ、κ、δ受體），可迅速逆轉嗎啡過量造成的呼吸抑制、意識喪失及縮瞳等症狀。其半衰期短，嚴重過量時可能需要重複給予或持續輸注。","we":["錯誤：Methadone本身是長效型鴉片受體促效劑（agonist），用於戒毒替代療法，無法對抗嗎啡過量，反而會加重中毒。","錯誤：Tramadol是弱鴉片受體促效劑，並非拮抗劑，無法解救嗎啡過量。","錯誤：Codeine是嗎啡前驅藥（prodrug），同樣是鴉片受體促效劑，不能用於解毒。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_010","year":2025,"roc_year":114,"session":"","examNo":10,"q":"Benzodiazepine類藥通常無法產生下列何種治療作用？","opts":["A. 抑制癲癇","B. 誘導與幫助動物睡眠","C. 促進排尿","D. 鬆弛骨骼肌的強直"],"ans":2,"exp":"苯二氮平類藥物（benzodiazepines）增強GABA-A受體介導的氯離子內流，具有抗焦慮、鎮靜催眠、抗癲癇及骨骼肌鬆弛作用，但完全沒有利尿作用，不作用於腎臟或利尿相關機制。","we":["此為正確描述：苯二氮平類藥物（如diazepam、clonazepam）具有明確的抗癲癇效果，此陳述符合藥理事實，不符合題目問的「無法產生」描述。","此為正確描述：苯二氮平類藥物可誘導睡眠，廣泛用於失眠及術前鎮靜，此陳述符合藥理事實，不符合題目問的「無法產生」描述。","","此為正確描述：苯二氮平類藥物可鬆弛骨骼肌強直（如diazepam用於肌肉痙攣），此陳述符合藥理事實，不符合題目問的「無法產生」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_011","year":2025,"roc_year":114,"session":"","examNo":11,"q":"有關doxapram之敘述，下列何者錯誤？","opts":["A. 高劑量可能會引起癲癇發作","B. 臨床上用於使吸入過量麻醉劑的動物甦醒","C. 刺激呼吸作用可能經由開啟鉀離子通道而活化主動脈和頸動脈的化學受體而刺激呼吸中樞","D. 對嚴重呼吸抑制的新生動物甦醒無太大效果"],"ans":2,"exp":"Doxapram透過阻斷（blocking）頸動脈小體化學受體上的鉀離子通道，使細胞去極化而刺激化學受體，進而反射性興奮呼吸中樞。選項C說「經開啟鉀離子通道」是錯誤的，機制恰好相反（阻斷而非開啟）。","we":["此為正確描述：Doxapram高劑量會過度興奮CNS，可能引起癲癇發作，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：Doxapram可刺激呼吸中樞，用於輔助吸入麻醉劑過量的動物恢復呼吸，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","","此為正確描述：對於嚴重呼吸抑制的新生動物，其化學受體尚未發育成熟，doxapram效果有限，此陳述符合藥理事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_012","year":2025,"roc_year":114,"session":"","examNo":12,"q":"Alprazolam與下列何者併用，因會增加藥物代謝而導致毒性減少？","opts":["A. itraconazole","B. cimetidine","C. ketoconazole","D. rifampicin"],"ans":3,"exp":"Alprazolam主要由CYP3A4代謝。Rifampicin（利福平）是強效CYP3A4誘導劑，可大幅加速alprazolam的代謝，使血中濃度下降，因此併用時毒性反而減少（效果也同時降低）。","we":["錯誤：Itraconazole是強效CYP3A4抑制劑，會抑制alprazolam代謝，使其血中濃度上升，毒性增加而非減少。","錯誤：Cimetidine是CYP抑制劑（多種同工酶），同樣會抑制alprazolam代謝，使血中濃度升高，毒性增加。","錯誤：Ketoconazole是強效CYP3A4抑制劑，與alprazolam併用會增加後者暴露量，導致毒性增加。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_013","year":2025,"roc_year":114,"session":"","examNo":13,"q":"下列關於三環類抗憂鬱劑（tricyclic antidepressants）的使用，何者錯誤？","opts":["A. 能提高癲癇發作門檻，有緩解具有癲癇體質動物的癲癇發作效果","B. 使用本類藥物需避免突然停藥，以免發生戒斷症狀","C. 此藥物之改善症狀通常需要3週以上時間","D. 此類藥物常具有鎮定的作用"],"ans":0,"exp":"三環類抗憂鬱劑（TCAs）具有抗膽鹼、抗組織胺及部分鈉通道阻斷作用，這些特性會「降低」（而非提高）癲癇發作門檻，因此TCAs使用於有癲癇病史的動物時需特別謹慎，選項A為錯誤描述。","we":["","此為正確描述：突然停用TCAs可能引起停藥症候群（withdrawal syndrome），應逐漸減量，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：TCAs的行為改善效果通常需要3週以上才能充分顯現，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：TCAs的抗組織胺作用常帶來鎮定（sedation）副作用，此陳述符合藥理事實，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_014","year":2025,"roc_year":114,"session":"","examNo":14,"q":"下列關於抗憂鬱劑的敘述，何者錯誤？","opts":["A. doxepin同時具有抗焦慮與止癢效果","B. 使用本類藥物須避免突然停藥","C. amitriptyline具有抗焦慮與緩解不適當排尿行為的作用","D. clomipramine的抗焦慮效果佳，不適合與其他影響行為藥物併用"],"ans":3,"exp":"Clomipramine屬於TCA類行為修正藥物，雖然與其他影響血清素的藥物（如MAOIs）併用有風險，但並非完全不適合與所有其他行為藥物併用；說其「不適合與其他影響行為藥物併用」過於絕對，臨床上在監控下仍可謹慎合併使用，選項D敘述不正確。","we":["此為正確描述：Doxepin（TCA類）具有抗組織胺H1效果，可用於抗焦慮及緩解搔癢（止癢），此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：抗憂鬱劑突然停藥可能引起停藥反應，應逐漸減量停藥，此陳述符合藥理事實，不符合題目問的「錯誤」描述。","此為正確描述：Amitriptyline可用於緩解焦慮及不適當排尿行為（如貓的應激性排尿），此陳述符合藥理事實，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_015","year":2025,"roc_year":114,"session":"","examNo":15,"q":"下列何者為犬臨床上使用sevoflurane最主要的不良反應？","opts":["A. 肝毒性","B. 腎毒性","C. 心搏輸出量增加，動脈壓呈現劑量相關性的增加","D. 惡性體溫過高"],"ans":3,"exp":"惡性體溫過高（malignant hyperthermia）是揮發性麻醉劑（包括sevoflurane）最嚴重的不良反應，由骨骼肌細胞ryanodine受體（RYR1）缺陷引發，造成Ca2+大量釋放、肌肉強直、體溫急升，可危及生命。Sevoflurane相對於halothane，肝腎毒性已大幅降低。","we":["錯誤：嚴重肝毒性主要是halothane的問題（halothane hepatitis），sevoflurane的肝毒性極低，不是其最主要不良反應。","錯誤：腎毒性（fluoride ion釋放）在methoxyflurane較為顯著，sevoflurane代謝產物compound A在動物中腎毒性實際風險低，非最主要不良反應。","錯誤：Sevoflurane（及多數揮發性麻醉劑）實際上會降低心搏輸出量及動脈血壓，而非增加；ketamine才是升壓的麻醉劑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_016","year":2025,"roc_year":114,"session":"","examNo":16,"q":"下列何者以靜脈注射動物容易導致血壓上升？","opts":["A. etomidate","B. phenobarbital","C. thiopental","D. ketamine"],"ans":3,"exp":"Ketamine屬解離性麻醉劑，可刺激交感神經系統（抑制去甲腎上腺素再攝取），導致心跳加速、心搏輸出量增加及血壓上升，靜脈給予時尤為明顯。其他選項中的麻醉劑多具有心血管抑制作用。","we":["錯誤：Etomidate對心血管影響極小，常用於心臟病動物的誘導麻醉，靜脈給予並不導致血壓上升。","錯誤：Phenobarbital靜脈給予具有心血管抑制作用，不會顯著升壓，主要用於控制癲癇。","錯誤：Thiopental（硫喷妥鈉）靜脈給予會因心臟抑制和血管擴張導致血壓下降，非升壓藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2025_藥理_017","year":2025,"roc_year":114,"session":"","examNo":17,"q":"臨床上使用於麻醉犬貓之為tiletamine與下列何種藥物之複方製劑？","opts":["A. diazepam","B. midazolam","C. clonazepam","D. zolazepam"],"ans":3,"exp":"Tiletamine（解離性麻醉劑）與zolazepam（苯二氮平類）以1:1比例製成複方製劑Telazol®，zolazepam提供鎮靜、肌肉鬆弛及抗焦慮效果以補充tiletamine的不足，此複方廣泛用於野生動物及犬貓的短效麻醉。","we":["錯誤：Diazepam（diazepam）雖是苯二氮平類，但Telazol®的搭配成分為zolazepam，而非diazepam。","錯誤：Midazolam亦是苯二氮平類，但並非tiletamine的固定複方搭配成分。","錯誤：Clonazepam主要用於抗癲癇，不是tiletamine的複方成分。",""],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAgAFQDASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAUEBgECBwMI/8QALhAAAgICAgEDAwMCBwAAAAAAAQIDBAURABIhBjFRBxRBEyJhFRYjMjNxcoGR/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/8QAIxEAAgEBCAMBAAAAAAAAAAAAAAERIQIxQVFxocHRErHw4f/aAAwDAQACEQMRAD8A+qeHFGbObezRiwj0YIm7tZmtwNN1AA6qqq6eST771oHiD0Ll/U2ZqYjJZBsVJjrkchmSvVkikhcHSkM0rBgdHfgfjgF24ch1crj7dyapVv1J7UPmWGOZWdPOv3KDsefniq3k78HrzG4ztWONt0bE5H6bCVZI3iH+btoqRIfHXfj34VYQLDw5Fv5KjjwpyF2t
