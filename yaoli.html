降，抑制尿素酶活性、降低氨的生成及吸收，描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_079","year":2020,"roc_year":109,"session":"2","examNo":79,"q":"下列何者為臨床使用epinephrine後主要之不良反應?","opts":["A. 局部肌肉震顫","B. 產生鎮靜止痛","C. 惡性體溫上升","D. 心跳過快"],"ans":3,"exp":"臨床使用epinephrine（腎上腺素）後，主要的不良反應為心跳過快（tachycardia）。Epinephrine激動β1受體使心率加快，同時激動α1受體使血壓上升，導致心悸、心律不整，是最常見且最重要的不良反應。","we":["錯誤：局部肌肉震顫雖然在高劑量時可能發生，但並非epinephrine最主要的不良反應；心跳過快及血壓升高才是臨床上最受關注的主要副作用。","錯誤：Epinephrine為強效交感神經興奮劑，具有顯著的心臟及血管刺激作用，不會產生鎮靜或止痛效果；鎮靜止痛藥物為α2致效劑（如xylazine）或阿片類藥物。","錯誤：惡性高體溫（malignant hyperthermia）為遺傳性骨骼肌疾患，由吸入性麻醉劑（如halothane）或去極化肌肉鬆弛劑（succinylcholine）所觸發，與epinephrine使用無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_080","year":2020,"roc_year":109,"session":"2","examNo":80,"q":"下列何者為ethylene glycol的代謝產物,與中毒末期之腎衰竭有開?","opts":["A. hippuric acid","B. formic acid","C. glycolic acid","D. oxalic acid"],"ans":3,"exp":"乙二醇（ethylene glycol）在體內的代謝途徑：乙二醇 → 乙醇醛（glycolaldehyde）→ 乙醇酸（glycolate）→ 乙醛酸（glyoxylate）→ 草酸（oxalic acid）。草酸與鈣結合形成草酸鈣結晶，沉積於腎小管，造成急性腎衰竭，是中毒末期腎臟病變的關鍵代謝產物。","we":["錯誤：Hippuric acid（馬尿酸）是甲苯（toluene）的代謝產物（苯甲酸 + 甘胺酸），並非乙二醇的代謝產物，與乙二醇腎毒性無關。","錯誤：Formic acid（甲酸）是甲醇（methanol）的毒性代謝產物，造成代謝性酸中毒及視神經毒性，並非乙二醇的代謝終產物。","錯誤：Glycolic acid（乙醇酸）雖然是乙二醇的早期代謝中間產物，也會造成代謝性酸中毒，但並非引起腎小管草酸鈣結晶沉積（腎衰竭）的直接原因；最終造成腎衰竭的是草酸。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_001","year":2021,"roc_year":110,"session":"","examNo":1,"q":"一個pKa為3.4的酸性藥品，在胃部（pH 1.4）和血漿中（pH 7.4）非離子態（unionized form）的比例於平衡時\r 約為多少？","opts":["A. 10000：1","B. 1000：1","C. 100：1","D. 1：1"],"ans":3,"exp":"此題考pH環境中非離子態藥物的分布原理。pKa=3.4的酸性藥物，在胃（pH 1.4）和血漿（pH 7.4）之間，平衡時脂溶性的非離子態（unionized form）可自由穿越生物膜，因此兩側的非離子態濃度相同。Henderson-Hasselbalch方程式雖可計算各側離子態比例，但非離子態在兩側膜透過的平衡濃度相等，故比值為1:1（答案D）。","we":["錯誤：10000:1的比值是離子化比例在特定pH條件下的計算結果，不代表非離子態在胃與血漿間的比例。非離子態（unionized form）因可自由穿越膜而達到兩側等濃度平衡，故此選項不正確。","錯誤：1000:1的比值同樣是錯誤的。非離子態藥物可自由穿越脂質膜，平衡時兩側濃度相等，不存在濃度梯度差異，故此比值不成立。","錯誤：100:1的比值也不正確。雖然離子態在胃與血漿間的分布受pH影響而有差異，但非離子態（可穿越膜的形式）在兩側達到的平衡濃度相同，比值應為1:1而非100:1。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_002","year":2021,"roc_year":110,"session":"","examNo":2,"q":"下列有關消化道投藥的敘述，何者正確？","opts":["A. 動物完全無法使用舌下投藥","B. 誘導關閉牛隻的食道溝，會使藥品停留在食道上部","C. 首渡效應常使口服利用率增加","D. 直腸投藥可減少首渡效應的影響"],"ans":3,"exp":"腸胃道投藥方式中，直腸投藥（rectal administration）可減少首渡效應（first-pass effect）的影響，因為直腸靜脈部分血液回流至下腔靜脈而非門靜脈，可繞過肝臟，提高藥物生體可用率（答案D）。","we":["錯誤：動物並非完全無法使用舌下投藥，某些大型動物或特殊情況下仍可使用舌下途徑，此敘述過於絕對，為錯誤陳述。","錯誤：誘導犬的食道溝（esophageal groove）關閉，是為了讓液體直接進入瓣胃或皺胃（abomasum），並非使藥物停留在食道上部，此敘述描述的目標部位錯誤。","錯誤：首渡效應（first-pass effect）是指口服藥物在進入體循環前被腸壁和肝臟代謝，這會使口服生體可用率「降低」而非增加，此選項的敘述方向相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_003","year":2021,"roc_year":110,"session":"","examNo":3,"q":"偏鹼性藥品在乳汁中的濃度會較其在血中為高的原因為何？","opts":["A. 因脂溶性較高而使得吸收速率較快","B. 因多會被主動運輸（active transport）運送進入","C. 因可和乳汁中的兩價離子結合","D. 因會產生離子捕捉（ion-trapping）的現象"],"ans":3,"exp":"偏鹼性藥品在乳汁中濃度較血中高，主要原因是離子捕捉（ion-trapping）現象。乳汁pH約6.5-6.8，低於血漿pH 7.4。鹼性藥物進入酸性的乳汁後，會被質子化（ionized），帶電的離子態無法穿越脂質膜回到血液，因而被捕捉於乳汁中，造成乳汁濃度高於血漿（答案D）。","we":["錯誤：脂溶性高確實有助於藥物穿越乳腺的脂質膜，但這說明的是「穿越速率」，而非解釋為何乳汁中藥物濃度會高於血漿。乳汁濃度更高的根本原因是離子捕捉，而非脂溶性。","錯誤：大多數鹼性藥物並不會被主動運輸（active transport）進入乳汁。乳汁中藥物濃度較高的主要機制是被動的離子捕捉現象，而非主動運輸。","錯誤：與二價離子（divalent ions）結合的藥物主要是四環素類（tetracyclines）等酸性或螯合性藥物，不是解釋鹼性藥物在乳汁中蓄積的通用機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_004","year":2021,"roc_year":110,"session":"","examNo":4,"q":"下列有關血漿蛋白結合（plasma protein binding）的敘述，何者正確？","opts":["A. 所有sulfonamides的血漿蛋白結合率皆相似","B. 解離常數（dissociation constant）愈小者結合力愈弱","C. Phenylbutazone與warfarin可相互競爭血漿蛋白結合","D. Digitoxin主要和球蛋白結合"],"ans":2,"exp":"Phenylbutazone（保泰松）和warfarin（華法林）對血漿蛋白結合位點具有競爭關係：phenylbutazone可取代warfarin的白蛋白結合位點，使游離warfarin濃度升高，增加出血風險。此為血漿蛋白競爭結合最經典的臨床交互作用範例（答案C）。","we":["錯誤：不同sulfonamides的血漿蛋白結合率差異很大（從約20%到>90%不等），並非所有sulfonamides的結合率都相似，此陳述為錯誤。","錯誤：解離常數（dissociation constant, Kd）的值越小，代表藥物與蛋白質的結合親和力越「強」，而非越弱。此選項的描述方向相反，為錯誤陳述。","","錯誤：Digitoxin主要與白蛋白（albumin）結合，而非球蛋白（globulin）。此選項描述的結合蛋白種類錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_005","year":2021,"roc_year":110,"session":"","examNo":5,"q":"下列有關抑制「酶」與其作用的敘述，何者錯誤？","opts":["A. 抑制cyclooxygenase可抑制前列腺素的合成","B. 抑制phosphodiesterase可增加心臟收縮力","C. 抑制β-lactamase可增加抗黴菌劑的藥效","D. 抑制DNA gyrase可具有殺菌藥效"],"ans":2,"exp":"此題問何者錯誤。抑制β-lactamase的藥物（如clavulanic acid、sulbactam）是增強β-lactam類「抗菌劑」（antibacterials）的效果，而非抗黴菌劑（antifungals）。β-lactamase是細菌分泌的酵素，用於水解β-lactam環；黴菌並不產生此酵素，因此抑制β-lactamase對抗黴菌劑毫無增效作用。選項C的「抗黴菌劑」用詞錯誤（答案C）。","we":["此為正確描述：抑制cyclooxygenase（COX）可減少花生四烯酸轉化為前列腺素（prostaglandins），這是非類固醇抗炎藥（NSAIDs）的作用機制，敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：抑制phosphodiesterase（如milrinone、amrinone）可減少cAMP的分解，使細胞內cAMP升高，進而增強心肌收縮力，此敘述正確，不符合題目問的「錯誤」描述。","","此為正確描述：抑制DNA gyrase（如quinolones類抗生素）可阻止細菌DNA的解旋與複製，具有殺菌效果，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_006","year":2021,"roc_year":110,"session":"","examNo":6,"q":"下列何藥品對CYP-450的作用和其他三個藥品不同？","opts":["A. chloramphenicol","B. ketoconazole","C. primidone","D. cimetidine"],"ans":2,"exp":"Chloramphenicol（A）、ketoconazole（B）、cimetidine（D）均為CYP-450抑制劑，會減緩其他藥物的肝臟代謝，增加藥物濃度。而primidone（C）是苯巴比妥類前驅藥，在體內轉化為phenobarbital後，會誘導CYP-450酵素的表現，屬於CYP-450誘導劑（inducer），與其他三者作用相反（答案C）。","we":["錯誤：Chloramphenicol是CYP-450抑制劑，與其他三者（ketoconazole、cimetidine）同樣抑制肝臟代謝酵素，故它與primidone同屬「不同」組，而非本題所問的那個不同者。","錯誤：Ketoconazole是強效的CYP-450抑制劑（尤其是CYP3A4），與chloramphenicol和cimetidine同屬抑制劑，不是與其他三者不同的那個選項。","","錯誤：Cimetidine（H2受體拮抗劑）同時也是CYP-450抑制劑，與chloramphenicol和ketoconazole作用類似，均為抑制劑，不是與其他三者不同的那個選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_007","year":2021,"roc_year":110,"session":"","examNo":7,"q":"下列何者是造成犬隻經口投予lidocaine生體可用率（bioavailability）不佳的主因？","opts":["A. 因具有四級銨的結構而降低吸收","B. 因會和食物中的二價離子螯合","C. 因肝臟代謝速率快","D. 因無法經由腎臟再吸收"],"ans":2,"exp":"Lidocaine在犬隻經口投予後生體可用率極低（約10-35%），主要原因是肝臟的首渡效應（first-pass metabolism）：lidocaine具有高肝臟萃取率（hepatic extraction ratio約0.7-0.9），口服後幾乎在門靜脈循環通過肝臟時就被大量代謝，導致到達體循環的量極少（答案C）。","we":["錯誤：Lidocaine是叔胺結構（tertiary amine），不具四級銨（quaternary ammonium）結構。四級銨結構因帶永久正電荷而難以被吸收，但lidocaine並不屬於此類，故此理由不成立。","錯誤：Lidocaine並不會與食物中的二價離子（如Ca2+、Mg2+）螯合。螯合反應影響吸收是四環素類抗生素的特性，不適用於lidocaine。","","錯誤：腎臟再吸收（renal reabsorption）影響的是藥物的排泄效率，與口服生體可用率的高低無關。無法由腎臟再吸收並不會造成oral bioavailability降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_008","year":2021,"roc_year":110,"session":"","examNo":8,"q":"下列何種併用較不會產生藥品不良反應（adverse drug reaction）？","opts":["A. phenylbutazone與coumarins","B. furosemide與digitalis","C. clavulanic acid與amoxicillin","D. streptomycin與amphotericin B"],"ans":2,"exp":"Clavulanic acid（克拉維酸）是β-lactamase抑制劑，可保護amoxicillin（阿莫西林）不被細菌產生的β-lactamase水解，兩者合用（如augmentin）具有協同抗菌效果，不僅不會產生不良反應，反而是治療上有益的藥物組合（答案C）。","we":["錯誤：Phenylbutazone可取代warfarin的血漿蛋白結合位點，使游離warfarin濃度升高，顯著增加出血風險，是典型的蛋白競爭結合交互作用，會產生嚴重不良反應。","錯誤：Furosemide是強效利尿劑，可引起低血鉀症（hypokalemia）；低血鉀會增加digitalis（毛地黃）毒性（因Na+/K+-ATPase受抑制加劇），兩者合用容易引起心律不整等毒性反應。","","錯誤：Streptomycin和amphotericin B均具有腎毒性（nephrotoxicity），兩者合用會加成腎毒性，增加腎損傷風險，屬於加成性不良反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_009","year":2021,"roc_year":110,"session":"","examNo":9,"q":"下列何者可以由Henderson-Hasselbalch方程式運算得到？","opts":["A. 藥物於不同pH值水溶液中的解離比率","B. 藥物於不同pH值水溶液中的水解速率","C. 藥物於不同pH值水溶液中的代謝速率","D. 藥物於不同pH值水溶液中的溶解度"],"ans":0,"exp":"Henderson-Hasselbalch方程式（pH = pKa + log[A-]/[HA]）可用於計算藥物在特定pH值環境中的離子態與非離子態比值，進而推算藥物在不同pH環境（如胃液、血漿、尿液）中的解離程度與分布情況（答案A）。","we":["","錯誤：藥物的水解速率（hydrolysis rate）涉及化學反應動力學，受溫度、催化劑、pH等多因素影響，無法單純由Henderson-Hasselbalch方程式計算得到。","錯誤：藥物的代謝速率（metabolic rate）是由肝臟酵素（如CYP450）、血流量、蛋白質結合等因素決定，與H-H方程式無關，無法由此方程式計算。","錯誤：藥物溶解度（solubility）雖然受pH影響（離子化增加水溶性），但溶解度的計算需要其他參數，H-H方程式本身無法直接計算溶解度數值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_010","year":2021,"roc_year":110,"session":"","examNo":10,"q":"下列何者是犬隻使用thiopental麻醉作用時間短暫的主要原因？","opts":["A. 藥物很快被腎臟排除","B. 藥物於不同組織間的重分布","C. 藥物很快被肝臟代謝","D. 藥物與血漿蛋白結合比率極高"],"ans":1,"exp":"Thiopental（硫噴妥鈉）是超短效巴比妥酸鹽麻醉藥。其麻醉作用時間短暫的主因是藥物在體內不同組織間的重分布（redistribution）：thiopental脂溶性極高，靜注後迅速進入腦部（高血流器官）產生麻醉，但隨後快速重分布至肌肉與脂肪組織，使腦部濃度下降，動物甦醒。其肝臟代謝實際上較慢（半衰期長），短暫作用時間主要由重分布決定（答案B）。","we":["錯誤：Thiopental並不會快速由腎臟排除。腎臟清除率低，且thiopental需先由肝臟代謝，腎臟排除不是決定其短效作用的原因。","","錯誤：Thiopental的肝臟代謝速率相對緩慢，其生物半衰期實際上相當長（可達數小時）。因此，肝臟快速代謝並非造成短暫麻醉作用的主因，而是組織重分布。","錯誤：血漿蛋白結合率高通常會「延長」藥物的作用時間（減少游離型藥物的消除），而非縮短。高蛋白結合不是thiopental作用短暫的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_011","year":2021,"roc_year":110,"session":"","examNo":11,"q":"Epinephrine升高血壓的作用與propranolol降低血壓的作用屬於下列何種拮抗？","opts":["A. 受體拮抗（receptor antagonism）","B. 生理拮抗（physiologic antagonism）","C. 化學拮抗（chemical antagonism）","D. 酵素拮抗（enzymatic antagonism）"],"ans":0,"exp":"Propranolol（普萘洛爾）是β腎上腺素受體阻斷劑，與epinephrine（腎上腺素）競爭同一受體（β-adrenergic receptors）。兩者在相同受體系統上競爭，propranolol拮抗epinephrine的β受體活化作用（包括心輸出量增加、血壓升高），這屬於受體拮抗（receptor antagonism），即competitive receptor antagonism（答案A）。","we":["","錯誤：生理拮抗（physiologic antagonism）是指兩種藥物透過不同受體或生理系統產生相反效果（如histamine降壓 vs. epinephrine升壓），兩者作用於不同受體。本題propranolol和epinephrine作用於相同受體，因此不屬於生理拮抗。","錯誤：化學拮抗（chemical antagonism）是指兩種藥物直接在體內發生化學反應（如chelation螯合、中和），使一方失效。Propranolol與epinephrine並未直接化學結合，故不屬於化學拮抗。","錯誤：酵素拮抗（enzymatic antagonism）並非標準藥理學術語，不適用於描述受體水平的競爭關係。Propranolol的作用機制是受體競爭，而非酵素層面的拮抗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_012","year":2021,"roc_year":110,"session":"","examNo":12,"q":"藥物在豬的生物轉化（biotransformation），下列何者較容易被飽和？","opts":["A. acetylation","B. amino acid conjugation","C. sulfate conjugation","D. glucuronidation"],"ans":2,"exp":"豬的磺酸鹽結合（sulfate conjugation）代謝途徑容易被飽和，原因是豬體內合成PAPS（磷酸腺苷-5-磷酸硫酸鹽，sulfate的活化前驅物）的能力有限，當藥物量過多時，硫酸鹽供應不足，導致此代謝途徑迅速飽和（答案C）。","we":["錯誤：豬的乙醯化（acetylation）能力相對較強，不容易被飽和，且乙醯化所需的乙醯CoA供應充足，不是豬最容易飽和的代謝途徑。","錯誤：胺基酸結合（amino acid conjugation，如甘胺酸結合）通常不是代謝的速率限制步驟，一般不容易被飽和，不是本題的答案。","","錯誤：葡萄糖醛酸結合（glucuronidation）在大多數哺乳動物（包括豬）中具有較大的代謝容量，不容易飽和。貓因缺乏UGT1A6酵素而葡萄糖醛酸化能力差，但豬不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_013","year":2021,"roc_year":110,"session":"","examNo":13,"q":"下列何者是藥物動力學計算的參數？","opts":["A. 藥物與受體之親和力","B. 藥物之最大生理效應","C. 藥物之相對效價","D. 藥物吸收速率及程度"],"ans":3,"exp":"藥物動力學（pharmacokinetics，PK）研究藥物在體內的吸收（Absorption）、分布（Distribution）、代謝（Metabolism）和排泄（Excretion）過程，即ADME。藥物吸收速率（absorption rate）及吸收程度（extent of absorption，即bioavailability）均屬於藥物動力學的計算參數（答案D）。","we":["錯誤：藥物與受體的親和力（drug-receptor affinity）屬於藥效學（pharmacodynamics，PD）的參數，描述藥物與受體之間的結合強度，不屬於藥物動力學範疇。","錯誤：最大生理效應（Emax）是藥效學概念，描述藥物所能產生的最大效應，屬於量效關係（dose-response relationship）的參數，不屬於藥物動力學。","錯誤：相對效價（relative potency）是比較兩種藥物達到相同效應所需劑量比例的概念，屬於藥效學參數，不屬於藥物動力學計算範疇。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_014","year":2021,"roc_year":110,"session":"","examNo":14,"q":"臨床上，diprenorphine適合做為下列那一藥物之拮抗劑？","opts":["A. diazepam","B. etorphine","C. ketamine","D. xylazine"],"ans":1,"exp":"Diprenorphine（M50-50的對應拮抗劑）是強效阿片類藥物etorphine（M99）的特異性拮抗劑。Etorphine常用於野生動物（如大型象、犀牛）的化學固定，diprenorphine則用於迅速逆轉etorphine的麻醉效果，使動物甦醒（答案B）。","we":["錯誤：Diazepam屬於苯二氮平類（benzodiazepines），其拮抗劑是flumazenil（氟馬西尼），而非diprenorphine。Diprenorphine是阿片受體拮抗劑，不能逆轉benzodiazepines的效果。","","錯誤：Ketamine是NMDA受體拮抗劑，目前沒有特異性的解毒拮抗劑；在某些方案中使用yohimbine（α2拮抗劑）輔助甦醒，但diprenorphine不針對ketamine。","錯誤：Xylazine是α2腎上腺素受體致效劑（sedative/analgesic），其拮抗劑為atipamezole（阿替美唑）或yohimbine，而非diprenorphine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_015","year":2021,"roc_year":110,"session":"","examNo":15,"q":"下列有關競爭性神經肌肉阻斷藥物之敘述，何者錯誤？","opts":["A. Tubocurarine在狗和貓不會引起histamine釋放","B. Pancuronium引起心跳速率的輕微增加","C. Atracurium可誘發histamine釋放","D. Vecuronium具有競爭乙醯膽鹼受器的作用"],"ans":0,"exp":"此題問何者錯誤。Tubocurarine（d-tubocurarine，管箭毒）在狗和貓確實「會」引起histamine釋放，這是其重要的副作用之一（引起支氣管痙攣、低血壓等），而非「不會引起」。選項A的描述與事實相反，是錯誤陳述（答案A）。","we":["","此為正確描述：Pancuronium（潘庫溴銨）具有輕度抗迷走神經作用（vagolytic effect），可引起心跳速率的輕微增加（心搏過速），此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：Atracurium（阿曲庫銨）確可誘發histamine釋放（雖程度較tubocurarine輕），高劑量時可能引起皮膚潮紅、支氣管痙攣等，此敘述正確，不符合題目問的「錯誤」描述。","此為正確描述：Vecuronium（維庫溴銨）是競爭性神經肌肉阻斷劑，透過競爭性拮抗神經肌肉接合處（NMJ）的乙醯膽鹼受器（nicotinic receptors）而產生肌肉鬆弛作用，此敘述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_016","year":2021,"roc_year":110,"session":"","examNo":16,"q":"下列何者可作為競爭性神經肌肉阻斷劑中毒的解毒劑？","opts":["A. MAO inhibitors","B. acetylcholinesterase inhibitors","C. COMT inhibitors","D. COX inhibitors"],"ans":1,"exp":"競爭性神經肌肉阻斷劑（如tubocurarine、pancuronium、vecuronium等）透過競爭性阻斷NMJ的菸鹼型ACh受體（nicotinic receptors）。解毒治療是使用乙醯膽鹼酯酶抑制劑（acetylcholinesterase inhibitors，如neostigmine、edrophonium）：抑制AChE後，內源性ACh在突觸間隙蓄積，可競爭性取代阻斷劑，恢復NMJ傳遞（答案B）。","we":["錯誤：MAO抑制劑（monoamine oxidase inhibitors）抑制單胺氧化酶，影響兒茶酚胺的代謝，與神經肌肉阻斷的解毒完全無關，不能逆轉NMB藥物的效果。","","錯誤：COMT抑制劑（catechol-O-methyltransferase inhibitors）用於帕金森病的輔助治療，影響兒茶酚胺代謝，與神經肌肉阻斷的解毒無關。","錯誤：COX抑制劑（cyclooxygenase inhibitors，如NSAIDs）是抗炎藥，抑制前列腺素合成，與神經肌肉阻斷劑的解毒完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_017","year":2021,"roc_year":110,"session":"","examNo":17,"q":"下列何者最適合使用於患有肝、腎疾病動物之麻醉？","opts":["A. halothane","B. isoflurane","C. methoxyflurane","D. pentobarbital"],"ans":1,"exp":"Isoflurane（異氟烷）是目前肝腎疾病動物最安全的吸入麻醉藥，因其在體內的代謝率極低（僅約0.2%由肝臟代謝），大部分以原型經肺排出體外，不產生肝毒性或腎毒性代謝物，對肝腎功能的依賴程度最低（答案B）。","we":["錯誤：Halothane（氟烷）約有15-20%在肝臟代謝，可產生三氯乙酸等活性代謝物，具有潛在肝毒性（halothane hepatitis），不適合用於肝病動物。","","錯誤：Methoxyflurane（甲氧氟烷）在體內代謝率高（約50%），會釋放無機氟離子（inorganic fluoride），可造成腎毒性（fluoride nephropathy），不適合用於腎病動物。","錯誤：Pentobarbital（戊巴比妥）主要由肝臟代謝，肝功能不全時代謝減慢，藥物蓄積，可能引起延長或加深麻醉；腎臟疾病也影響藥物排除，故不適合肝腎疾病動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_018","year":2021,"roc_year":110,"session":"","examNo":18,"q":"下列何者是蕈毒鹼性致效劑，且投予後可直接與蕈毒鹼性受體結合產生作用？","opts":["A. neostigmine","B. echothiophate","C. hyoscyamine","D. bethanechol"],"ans":3,"exp":"Bethanechol（氯化烏拉坦膽鹼）是膽鹼酯類（choline ester），具有穩定的四級銨結構，可直接與蕈毒鹼性受體（muscarinic receptors，尤其是M3）結合並活化，不需透過乙醯膽鹼酯酶的中介，屬於直接型蕈毒鹼性致效劑，臨床上用於增加膀胱與腸胃道蠕動（答案D）。","we":["錯誤：Neostigmine是乙醯膽鹼酯酶（AChE）抑制劑，屬於間接型膽鹼能藥物，透過抑制ACh的分解使內源性ACh蓄積來產生效果，本身不直接與蕈毒鹼性受體結合。","錯誤：Echothiophate是有機磷酸酯類（organophosphate）AChE抑制劑（不可逆），同樣屬於間接型膽鹼能藥物，不直接與蕈毒鹼性受體結合。","錯誤：Hyoscyamine（莨菪鹼）是蕈毒鹼性受體「拮抗劑」（anticholinergic，即atropine的左旋異構體），而非致效劑，與題目要求的「蕈毒鹼性致效劑」完全相反。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_019","year":2021,"roc_year":110,"session":"","examNo":19,"q":"下列何者主要活化β2-腎上腺素性受體，藉此舒張支氣管？","opts":["A. dobutamine","B. hyoscyamine","C. salmeterol","D. atipamezole"],"ans":2,"exp":"Salmeterol（沙美特羅）是長效選擇性β2-腎上腺素受體致效劑（LABA），作用於支氣管平滑肌的β2受體，引起平滑肌鬆弛，使支氣管擴張，作用時間持續12小時以上，臨床上用於哮喘和COPD的維持治療（答案C）。","we":["錯誤：Dobutamine主要是β1腎上腺素受體致效劑（也有部分α1和β2活性），主要作用於心臟（正性肌力），而非主要活化β2受體舒張支氣管，不符合題目要求。","錯誤：Hyoscyamine（莨菪鹼）是抗膽鹼藥（M受體拮抗劑），可透過阻斷M3受體間接產生支氣管擴張，但作用機制是膽鹼能拮抗，而非活化β2-腎上腺素受體，不符合題目描述。","","錯誤：Atipamezole（阿替美唑）是選擇性α2腎上腺素受體拮抗劑，臨床上用於逆轉medetomidine或xylazine的鎮靜效果，與β2受體活化及支氣管擴張完全無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_020","year":2021,"roc_year":110,"session":"","examNo":20,"q":"下列何者為選擇性β1-腎上腺素性受體拮抗劑？","opts":["A. albuterol","B. metaraminol","C. atenolol","D. atipamezole"],"ans":2,"exp":"Atenolol（阿替洛爾）是心臟選擇性β1-腎上腺素受體拮抗劑（cardioselective β1 blocker），主要阻斷心臟β1受體，減慢心率和降低心肌收縮力，而對β2受體的阻斷作用較弱，較不易引起支氣管收縮，臨床用於高血壓、心律不整和心衰竭（答案C）。","we":["錯誤：Albuterol（沙丁胺醇）是選擇性β2腎上腺素受體「致效劑」（agonist），用於支氣管擴張，而非拮抗劑，且作用於β2而非β1，與題目完全相反。","錯誤：Metaraminol（間羥胺）是α1和β1腎上腺素受體致效劑（直接型），具有升壓作用，是血管收縮藥，而非選擇性β1拮抗劑。","","錯誤：Atipamezole（阿替美唑）是選擇性α2腎上腺素受體拮抗劑，而非β1拮抗劑，臨床上用於逆轉α2致效劑（如medetomidine、xylazine）的鎮靜效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_021","year":2021,"roc_year":110,"session":"","examNo":21,"q":"下列何者是選擇性的α1-腎上腺素性受體致效劑？","opts":["A. bretylium","B. phenoxybenzamine","C. phenylephrine","D. prazosin"],"ans":2,"exp":"Phenylephrine（苯腎上腺素）是純選擇性α1腎上腺素受體致效劑，透過活化血管平滑肌的α1受體引起血管收縮，升高血壓，常用作充血性鼻炎的去充血藥或術中低血壓的升壓藥（答案C）。","we":["錯誤：Bretylium是腎上腺素能神經阻斷劑（adrenergic neuron blocker），屬於第III類抗心律不整藥，不是α1受體致效劑，作用機制完全不同。","錯誤：Phenoxybenzamine（苯氧苄胺）是非選擇性、不可逆的α受體「拮抗劑」（α1+α2 blocker），與α1致效劑的作用完全相反，本身是阻斷劑而非致效劑。","","錯誤：Prazosin（哌唑嗪）是選擇性α1受體「拮抗劑」（blocker），透過阻斷α1受體降低外周血管阻力，與α1致效劑效果相反，不是致效劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_022","year":2021,"roc_year":110,"session":"","examNo":22,"q":"下列何者為臨床經口投予prazosin之主要目的？","opts":["A. 興奮中樞神經系統","B. 鎮靜及鬆弛肌肉","C. 增加心輸出量","D. 促進脂肪分解速率"],"ans":2,"exp":"Prazosin（哌唑嗪）是選擇性α1腎上腺素受體拮抗劑，阻斷α1受體使外周血管擴張（減少後負荷preload/afterload），降低心臟的做功負擔，從而增加心輸出量（cardiac output）。臨床上用於鬱血性心衰竭（CHF）的輔助治療（答案C）。","we":["錯誤：Prazosin是α1腎上腺素受體拮抗劑，透過血管擴張降低血壓，不具有中樞神經興奮作用，不會用於中樞刺激目的。","錯誤：Prazosin的藥理作用是血管擴張（抗高血壓），不具有鎮靜（sedation）或肌肉鬆弛作用，這是α2致效劑（如xylazine）的特性。","","錯誤：Prazosin的血管擴張機制與脂肪代謝無關，不具有促進脂肪分解（lipolysis）的作用，此描述不適用於prazosin。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_023","year":2021,"roc_year":110,"session":"","examNo":23,"q":"長期使用利尿劑後，常發生低血壓性反射作用而引起心律不整，可併用何種藥物改善？","opts":["A. α1 blocker","B. α2 blocker","C. β1 blocker","D. β2 blocker"],"ans":2,"exp":"長期使用利尿劑後，低血壓引起交感神經反射性興奮，可能導致心跳過速和心律不整。併用β1阻斷劑（如atenolol）可阻斷心臟β1受體，抑制交感神經引起的反射性心搏加速和心律不整，達到改善效果（答案C）。","we":["錯誤：α1阻斷劑（如prazosin）阻斷血管α1受體，進一步擴張血管降低血壓，會加重低血壓而非改善，反而可能使交感反射更嚴重，不是適當的選擇。","錯誤：α2阻斷劑（如yohimbine）阻斷突觸前α2受體，會增加交感神經末梢釋放去甲腎上腺素，提高交感張力，反而可能加重心律不整，不是本題答案。","","錯誤：β2阻斷劑選擇性阻斷β2受體，雖可減少血管擴張和支氣管張力，但心律不整的改善主要需要阻斷心臟的β1受體（而非β2），且β2阻斷有引起支氣管痙攣的風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_024","year":2021,"roc_year":110,"session":"","examNo":24,"q":"Enoxaparin對下列何種凝血因子的抑制作用最強？","opts":["A. II","B. XI","C. X","D. IX"],"ans":2,"exp":"Enoxaparin（依諾肝素）是低分子量肝素（LMWH），主要透過抗凝血酶III（antithrombin III）抑制凝血因子Xa（activated Factor X）。LMWH的抗Xa與抗IIa比例約為3:1至4:1，與普通肝素（UFH）的1:1比例不同，Xa是其最主要的抑制靶點（答案C）。","we":["錯誤：凝血因子II（prothrombin/thrombin，IIa）雖然也是肝素的作用靶點之一，但低分子量肝素（如enoxaparin）對Xa的抑制遠強於對IIa的抑制，IIa不是其最主要的抑制靶點。","錯誤：凝血因子XI並非肝素或低分子量肝素的主要抑制靶點，enoxaparin的作用主要針對Xa（及部分IIa），不針對因子XI。","","錯誤：凝血因子IX雖在凝血瀑布中重要（內源性途徑），但不是enoxaparin的主要抑制靶點，low molecular weight heparin主要作用是anti-Xa活性，不針對IX。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_025","year":2021,"roc_year":110,"session":"","examNo":25,"q":"下列何者最適合使用於加強鬱血性心衰竭心肌之收縮力量？","opts":["A. hydralazine","B. amrinone","C. nitroglycerin","D. doxapram"],"ans":1,"exp":"Amrinone（氨力農）是磷酸二酯酶（PDE）III抑制劑，透過增加心肌細胞內cAMP濃度，增強心肌收縮力（正性肌力，positive inotrope），同時也具有血管擴張效果（降低前後負荷），是鬱血性心衰竭（CHF）急性期加強心肌收縮的適當藥物（答案B）。","we":["錯誤：Hydralazine（肼屈嗪）是純血管擴張劑，作用於小動脈平滑肌，降低後負荷，但無直接正性肌力作用，不能直接增強心肌收縮力。","","錯誤：Nitroglycerin（硝酸甘油）主要是靜脈擴張劑（venodilator），透過釋放NO降低前負荷，雖可減輕心臟負擔，但不具有直接的正性肌力（inotropic）效果。","錯誤：Doxapram（多沙普侖）是呼吸興奮劑（respiratory stimulant），刺激頸動脈化學感受器和延髓呼吸中樞，不作用於心肌，無法增加心肌收縮力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_026","year":2021,"roc_year":110,"session":"","examNo":26,"q":"下列何者為使用lidocaine抗心律不整之主要作用機制？","opts":["A. 縮短心肌動作電位期間","B. 阻斷離子通道","C. 縮短動作電位之不反應期","D. 增加迷走神經之張力"],"ans":0,"exp":"Lidocaine（利多卡因）屬於Class IB抗心律不整藥，其主要抗心律不整機制是：阻斷心室肌及蒲金野纖維（Purkinje fibers）的快速Na+通道，縮短動作電位期間（action potential duration，APD），減少心室的異常放電，主要用於治療心室性心律不整（ventricular arrhythmia）（答案A）。","we":["","錯誤：雖然lidocaine確實阻斷Na+離子通道（ion channel blockade），但「阻斷離子通道」描述過於籠統，且不是lidocaine對抗心律不整的核心機制表述。其主要抗心律不整機制的精確描述是縮短動作電位期間，選項B表達不夠精確。","錯誤：Lidocaine實際上是「縮短」動作電位期間，但其有效不反應期（effective refractory period，ERP）相對於APD的比值增加，等效於相對延長不反應期。若單純「縮短不反應期」反而會增加心律不整風險，此選項描述會造成相反效果。","錯誤：增加迷走神經張力（vagal tone）是digoxin和adenosine的作用機制，用於控制心房顫動/撲動的心室率。Lidocaine主要作用於心室，不透過增加迷走張力發揮抗心律不整效果。"],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAhACcDASIAAhEBAxEB/8QAGwABAAICAwAAAAAAAAAAAAAAAAMGBAUCBwj/xAApEAABAwMDAwMFAQAAAAAAAAABAgMEAAURBhIhByIxExRxMkFCUYGx/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAIB/8QAGREBAQEAAwAAAAAAAAAAAAAAAAERAiFB/9oADAMBAAIRAxEAPwD1TStBc9URod5as0aNJuN4Uz664sTaS03nG9alqSlIJ4GTk/YGpbRf03C7S7a7b50GZFabeWmSlG1SVlQBSpKlBX0HODxxQvTdUrHnuSWo5VDjokPZGG1OemD/AHB/yqxpm5X12DKU5bGnSJckArnZPDygE/R4A4HxQW+lVbSU+7yH56ZsFCWRMeSXPd7yjHhIG0cf2lZbmHtindMWVW/q91DgzXXVyy3AUwuQrc48wlop35+/d5P7NXLqNMbh6Su7jdyYtsz221MpW4raClBIICO/JJwnH5YrOvul7RfJUaVcYqjMjAhmUw85HebB8gONqSoA/rOK4S9JWWbZJdpmw1SoUsAPh95xxxzByCXFKK8jAwd3GOKXvjJWzJy2Kf0uemxtaats8h26LisNQ5LKLk+HXW/UQsKHaSkA7AcDnJOa7KaabaSUtIShJUVEJGMknJPySSa0Vk0dYrJdHLlbYSm57rKWHH1vuOKcSnONxWo5Vye4844zirBVWpkRpbbZSsttpTuUVKCE43E+T80qSlRd8VMKUpVMKUpQKUpQf//Z"]},{"id":"AMO_2021_藥理_027","year":2021,"roc_year":110,"session":"","examNo":27,"q":"下列何者利尿劑因可增加前部遠曲小管鈣的吸收、降低尿鈣的排出，因而可用來治療草酸鈣尿路結石？","opts":["A. ethacrynic acid","B. spironolactone","C. triamterene","D. hydrochlorothiazide"],"ans":3,"exp":"Hydrochlorothiazide（HCTZ，氫氯噻嗪）屬於噻嗪類利尿劑（thiazide diuretics），作用於遠曲小管前段，除抑制Na+-Cl-共同轉運體（NCC）外，還可增加遠曲小管對鈣（Ca2+）的再吸收，降低尿鈣排出（低鈣尿症），臨床上可用於預防和治療草酸鈣尿路結石（答案D）。","we":["錯誤：Ethacrynic acid（依他尼酸）是環利尿劑（loop diuretic），作用於亨利氏環升支粗段，抑制Na+-K+-2Cl-轉運體，同時增加鈣的排泄（高鈣尿症），反而可能促進草酸鈣結石形成，不是正確答案。","錯誤：Spironolactone（螺內酯）是保鉀利尿劑（aldosterone antagonist），主要作用於集合管，對鈣的再吸收沒有顯著促進作用，不具有降低尿鈣排出的特性，不用於草酸鈣結石的治療。","錯誤：Triamterene（氨苯蝶啶）是保鉀利尿劑，阻斷集合管的鈉通道，對鈣代謝沒有顯著影響，不具有增加Ca2+再吸收的效果，不用於草酸鈣結石的治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_028","year":2021,"roc_year":110,"session":"","examNo":28,"q":"下列藥物何者不具有抗高血鉀症的特性？","opts":["A. spironolactone","B. insulin","C. furosemide","D. hydrochlorothiazide"],"ans":0,"exp":"本題問「不具有抗高血鉀症特性」的藥物。Spironolactone（螺內酯）是保鉀利尿劑，阻斷醛固酮（aldosterone）受體，減少鈉的再吸收同時保留鉀，因此反而會引起高血鉀（hyperkalemia），是高血鉀症的「禁忌」藥物，而非治療用藥（答案A）。","we":["","錯誤：Insulin（胰島素）可透過活化Na+/K+-ATPase，促使血液中的K+轉移進入細胞內，迅速降低血清鉀濃度，是治療急性高血鉀的重要藥物，具有抗高血鉀症的特性。","錯誤：Furosemide（呋塞米）是環利尿劑，可增加腎臟對鉀的排泄（hypokalemia為其副作用），臨床上可用於增加尿鉀排出，具有降低血鉀的效果，可用於治療高血鉀症。","錯誤：Hydrochlorothiazide（噻嗪類利尿劑）也可增加腎臟排鉀，長期使用常導致低血鉀，因此具有降低血鉀的效果，某些情況下可輔助處理高血鉀症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_029","year":2021,"roc_year":110,"session":"","examNo":29,"q":"複選題\n29.下列何者兼具利尿和矯正代謝性鹼中毒的作用？","opts":["A. furosemide","B. amiloride","C. acetazolamide","D. spironolactone"],"ans":0,"exp":"本題為複選題，考察兼具利尿和矯正代謝性鹼中毒作用的藥物。Furosemide（呋塞米）是強效環利尿劑，可增加Cl-的排泄（氯尿症），對於低氯性（chloride-responsive）代謝性鹼中毒，furosemide透過利尿同時促進電解質排泄，被考選部採納為此題的正答。（注：本題為複選題，acetazolamide也可矯正代謝性鹼中毒但利尿效果較弱，本題以考選部公告答案A為準）（答案A）。","we":["","錯誤：Amiloride（阿米洛利）是保鉀利尿劑（ENaC阻斷劑），利尿效果較弱，且主要影響鉀的代謝，對矯正代謝性鹼中毒的效果有限，不是本題最佳答案。","錯誤：Acetazolamide（乙酰唑胺）雖可抑制碳酸酐酶、促進HCO3-排泄而矯正代謝性鹼中毒，但其利尿作用極為有限（因近曲小管代償後利尿效果消失），不是「兼具」強利尿效果的選擇。","錯誤：Spironolactone（螺內酯）是保鉀利尿劑，阻斷醛固酮受體，利尿效果較弱，且可能引起代謝性酸中毒（因保留H+），不具有矯正代謝性鹼中毒的能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_030","year":2021,"roc_year":110,"session":"","examNo":30,"q":"下列有關ammonium chloride的作用，何者錯誤？","opts":["A. 酸化尿液","B. 利尿作用","C. 祛痰作用","D. 止吐作用"],"ans":3,"exp":"此題問何者錯誤。Ammonium chloride（氯化銨）的藥理作用包括：酸化尿液（在肝臟轉化為尿素和H+後由腎臟排泄，使尿液酸化）、輕度利尿作用（滲透性）、以及祛痰作用（反射性刺激呼吸道黏膜分泌）。止吐（antiemetic）不是ammonium chloride的作用，選項D的「止吐作用」是錯誤陳述（答案D）。","we":["此為正確描述：Ammonium chloride在肝臟中轉化為尿素（urea）並釋放H+和Cl-，這些酸性產物經腎臟排泄後使尿液酸化，是其重要的臨床用途（如促進鹼性藥物排泄），此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：Ammonium chloride具有輕度的滲透性利尿作用，是其已知的藥理效果之一，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：Ammonium chloride可刺激呼吸道黏膜，反射性增加支氣管腺體的黏液分泌，發揮祛痰（expectorant）作用，有助於稀釋並排出痰液，此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_031","year":2021,"roc_year":110,"session":"","examNo":31,"q":"下列影響腸胃功能的藥物中，何者最可能會干擾其他同時口服藥物的吸收？","opts":["A. cimetidine","B. misoprostol","C. omeprazole","D. sucralfate"],"ans":3,"exp":"Sucralfate（硫糖鋁）在酸性環境中聚合形成黏稠的膠狀物，可緊密附著在胃腸道潰瘍表面形成保護屏障，同時其聚合物可物理性吸附（adsorb）同時口服的其他藥物，阻礙這些藥物的吸收，與多種藥物（如fluoroquinolones、tetracyclines、某些抗真菌藥）有顯著的吸收交互作用（答案D）。","we":["錯誤：Cimetidine（西咪替丁）主要是H2受體拮抗劑，透過降低胃酸分泌保護胃黏膜，雖然也有CYP450抑制作用，但對其他藥物的物理性吸附能力遠不如sucralfate，不是干擾口服藥物吸收的最主要藥物。","錯誤：Misoprostol（米索前列醇）是前列腺素E1類似物，主要刺激黏膜分泌黏液和碳酸氫鈉，並抑制胃酸分泌，對其他藥物的物理吸附作用極小，不是干擾藥物吸收的主要藥物。","錯誤：Omeprazole（奧美拉唑）是質子幫浦抑制劑（PPI），升高胃pH值可影響某些pH依賴性藥物（如ketoconazole、itraconazole）的溶解和吸收，但其機制是改變pH，而非物理吸附，干擾程度不如sucralfate廣泛。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_032","year":2021,"roc_year":110,"session":"","examNo":32,"q":"下列何者具有促進胃黏膜分泌黏液質的作用？","opts":["A. meclizine","B. methadone","C. metoclopramide","D. misoprostol"],"ans":3,"exp":"Misoprostol（米索前列醇）是前列腺素E1（PGE1）的合成類似物，與胃黏膜上皮細胞的EP3受體結合後，可刺激黏液（mucus）和碳酸氫鹽（bicarbonate）的分泌，同時抑制胃酸的分泌，具有胃黏膜保護作用（cytoprotective），是NSAIDs引起胃炎的防護用藥（答案D）。","we":["錯誤：Meclizine（美克利嗪）是H1受體抗組胺藥，主要用於暈動病（motion sickness）和前庭性嘔吐的治療，沒有促進胃黏膜分泌黏液的作用。","錯誤：Methadone（美沙酮）是阿片類藥物（μ受體致效劑），主要用於鎮痛和阿片依賴的替代治療，也有輕微的抗腹瀉作用，但無促進胃黏膜分泌黏液的功能。","錯誤：Metoclopramide（滅吐靈）是多巴胺D2受體拮抗劑和5-HT4受體致效劑，主要具有促進腸胃蠕動（prokinetic）和止吐作用，不具有直接刺激胃黏膜分泌黏液的功能。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_033","year":2021,"roc_year":110,"session":"","examNo":33,"q":"下列腸胃道用藥中，何者在重複給藥後，會累積於胃壁細胞中？","opts":["A. misoprostol","B. omeprazole","C. ranitidine","D. sucralfate"],"ans":1,"exp":"Omeprazole（奧美拉唑）是質子幫浦抑制劑（PPI），屬於前驅藥（prodrug），在胃壁細胞小管（canaliculi）的酸性環境中被活化，形成活性磺醯胺（sulfenamide），不可逆地結合並抑制H+/K+-ATPase（質子幫浦）。因為與幫浦不可逆結合，重複給藥後在胃壁細胞中蓄積，需3-5天才能達到最大抑酸效果（答案B）。","we":["錯誤：Misoprostol（PGE1類似物）是直接作用型藥物，透過與受體可逆性結合發揮效果，無法在胃壁細胞中蓄積，每次給藥的效果相對獨立。","","錯誤：Ranitidine（雷尼替丁）是競爭性可逆的H2受體拮抗劑，與H2受體的結合是可逆的，不會在胃壁細胞中蓄積，給藥停止後效果迅速消退。","錯誤：Sucralfate（硫糖鋁）是黏膜保護劑，在胃腸道局部發揮作用（附著在潰瘍表面），幾乎不被吸收進入細胞，不會在胃壁細胞中蓄積。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_034","year":2021,"roc_year":110,"session":"","examNo":34,"q":"下列有關metoclopramide止吐作用的敘述，何者正確？","opts":["A. 僅作用於中樞","B. 僅為黏膜保護劑","C. 同時具中樞與周邊作用","D. 僅具制酸作用"],"ans":2,"exp":"Metoclopramide（滅吐靈）的止吐機制同時包含中樞和周邊作用：（1）中樞：阻斷腦幹化學感受器觸發區（CTZ）的多巴胺D2受體，抑制嘔吐衝動；（2）周邊：阻斷胃腸道D2受體同時激動5-HT4受體，促進胃蠕動和加速胃排空，減少嘔吐的觸發因素。因此具有雙重（中樞與周邊）止吐機制（答案C）。","we":["錯誤：Metoclopramide不僅作用於中樞神經系統，也具有重要的周邊作用（促進胃腸蠕動），「僅作用於中樞」的描述不完整，為錯誤陳述。","錯誤：Metoclopramide不是黏膜保護劑，其止吐作用是透過受體機制（D2拮抗和5-HT4激動），而非透過保護胃黏膜來達到止吐效果。","","錯誤：Metoclopramide不是制酸劑（antacid），不能中和胃酸，也不抑制胃酸分泌。制酸作用是碳酸鈣、氫氧化鋁等藥物的特性，不適用於metoclopramide。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_035","year":2021,"roc_year":110,"session":"","examNo":35,"q":"下列何者是臨床上使用的麻醉性鎮咳藥（narcotic antitussives）？","opts":["A. meperidine","B. hydrocodone","C. noscapine","D. dextromethorphan"],"ans":1,"exp":"Hydrocodone（氫可酮）是半合成阿片類（opioid）鎮咳藥，屬於麻醉性鎮咳藥（narcotic antitussive），作用於腦幹咳嗽中樞的阿片受體，具有成癮性，需依處方使用，在獸醫學中用於犬的鎮咳治療（答案B）。","we":["錯誤：Meperidine（pethidine，哌替啶）是阿片類止痛藥（μ受體激動劑），雖具麻醉性，但臨床上主要用於止痛，不是常規使用的鎮咳藥，其鎮咳用途遠不如hydrocodone常見。","","錯誤：Noscapine（那可汀）雖來自鴉片，但不具有阿片受體激動活性，不引起鎮靜或成癮，屬於非麻醉性（non-narcotic）鎮咳藥，不符合本題要求的「麻醉性鎮咳藥」。","錯誤：Dextromethorphan（右美沙芬）是NMDA受體拮抗劑和sigma受體配體，具有鎮咳效果但不引起成癮性，屬於非麻醉性（non-narcotic）鎮咳藥，與本題要求的「麻醉性鎮咳藥」相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_036","year":2021,"roc_year":110,"session":"","examNo":36,"q":"下列解充血劑（decongestants），何者不屬於histamine-receptor（H1）antagonists？","opts":["A. phenylephrine","B. dimenhydrinate","C. chlorpheniramine","D. hydroxyzine"],"ans":0,"exp":"本題問哪個藥物不屬於H1受體拮抗劑（antihistamines）。Phenylephrine（苯腎上腺素）是選擇性α1腎上腺素受體致效劑，作用於鼻黏膜血管使其收縮，發揮去充血（decongestant）效果，但其機制完全不涉及H1受體阻斷，不是抗組胺藥（答案A）。","we":["","錯誤：Dimenhydrinate（苯海拉明+氯茶鹼）是第一代H1受體拮抗劑，同時具有抗膽鹼和中樞鎮靜效果，臨床上用於暈動病和嘔吐，屬於H1 receptor antagonist，不是本題要找的選項。","錯誤：Chlorpheniramine（氯苯那敏）是第一代H1受體拮抗劑，具有抗組胺和輕度抗膽鹼效果，常用於過敏性鼻炎和皮膚過敏，屬於H1 receptor antagonist，不是本題要找的選項。","錯誤：Hydroxyzine（羥嗪）是第一代H1受體拮抗劑，同時具有抗焦慮和鎮靜效果，在獸醫學中用於過敏和焦慮的治療，屬於H1 receptor antagonist，不是本題要找的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_037","year":2021,"roc_year":110,"session":"","examNo":37,"q":"下列何者臨床上屬於鎮咳藥，但不會引起成癮性？","opts":["A. naloxone","B. dextromethorphan","C. meperidine","D. ipartropium"],"ans":4,"exp":"本題已刪除（考選部公告）。題目詢問哪種藥物臨床上屬於鎮咳藥但不引起成癮性。一般而言，非麻醉性鎮咳藥（non-narcotic antitussives）如dextromethorphan（NMDA受體拮抗劑，無成癮性）和noscapine等不引起成癮。naloxone為阿片受體拮抗劑（非鎮咳藥）；meperidine為麻醉性鎮痛藥（有成癮性）；ipartropium為抗膽鹼性支氣管擴張劑（非鎮咳藥）；dextromethorphan才符合「鎮咳但無成癮性」的描述。本題因命題疑義而遭考選部刪除，無正式公告答案。","we":["錯誤：Naloxone為純μ阿片受體拮抗劑，臨床上用於逆轉阿片類藥物過量，本身無鎮咳作用，不符合「屬於鎮咳藥」的條件。","錯誤（可能原意為正確）：Dextromethorphan確為非麻醉性鎮咳藥（作用於NMDA受體和sigma受體），不引起成癮性；但本題因命題疑義而遭考選部刪除。","錯誤：Meperidine（pethidine）為麻醉性鎮痛藥（μ阿片受體激動劑），具有成癮性，不符合「不會引起成癮性」的條件。","錯誤：Ipartropium（ipratropium）為M受體拮抗劑/抗膽鹼性支氣管擴張劑，臨床上用於哮喘或COPD的支氣管擴張，不具有鎮咳作用，不符合條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_038","year":2021,"roc_year":110,"session":"","examNo":38,"q":"下列藥物何者不具有氣管擴張作用？","opts":["A. theophylline","B. propranolol","C. atropine","D. isoproterenol"],"ans":1,"exp":"Propranolol（普萘洛爾）是非選擇性β腎上腺素受體拮抗劑（β1+β2 blocker），阻斷支氣管平滑肌的β2受體，引起支氣管收縮（bronchoconstriction），不具有氣管擴張作用，哮喘動物禁用（答案B）。","we":["錯誤：Theophylline（茶鹼）是磷酸二酯酶（PDE）抑制劑，可增加支氣管平滑肌細胞內cAMP濃度，引起支氣管擴張，也具有腺苷受體拮抗作用，是具有氣管擴張作用的藥物，不符合本題的「不具有」要求。","","錯誤：Atropine（阿托品）是M受體拮抗劑（muscarinic antagonist），阻斷支氣管的M3受體，減少乙醯膽鹼引起的支氣管收縮，具有支氣管擴張作用，是具有氣管擴張作用的藥物，不符合本題的「不具有」要求。","錯誤：Isoproterenol（異丙腎上腺素）是非選擇性β腎上腺素受體致效劑（β1+β2），活化支氣管β2受體引起強效支氣管擴張，是具有氣管擴張作用的藥物，不符合本題的「不具有」要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_039","year":2021,"roc_year":110,"session":"","examNo":39,"q":"下列何者在獸醫臨床上常被用於催產？","opts":["A. PGD2","B. PGE2","C. ","D. PGI2"],"ans":2,"exp":"本題選項C（圖示藥物）為PGF2α（前列腺素F2α，prostaglandin F2 alpha，dinoprost）。PGF2α具有強效的子宮收縮（uterotonic）和溶黃體（luteolytic）作用，在獸醫臨床上廣泛用於催產（parturition induction）、人工流產、發情同步化（estrus synchronization）和子宮蓄膿（pyometra）的治療（答案C）。","we":["錯誤：PGD2（前列腺素D2）主要具有血管擴張和抑制血小板聚集的作用，以及在過敏反應中扮演角色，不具有顯著的子宮收縮或溶黃體作用，臨床上不用於催產。","錯誤：PGE2（前列腺素E2）雖然也可促進子宮平滑肌收縮，但其在獸醫臨床的催產用途較PGF2α少見，且PGE2的作用偏向於軟化子宮頸（cervical ripening），PGF2α才是最常用的獸醫催產前列腺素。","","錯誤：PGI2（前列環素，prostacyclin）主要由血管內皮細胞合成，具有強效的血管擴張和抑制血小板聚集作用，不具有子宮收縮效果，不用於催產，功能與PGF2α完全相反。"],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAiADYDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6porzfxzd6pH8TvB2lWWtX1hYapHefaY4BEcmKNWUgujY5JzXL6b8Tdat9H1OyaSDVdTPiH+wdI1B4wsdxu/5aSBMKdgznbgEgDiha7f1rb8wen9eTf6HuFFcXrNrqekadFIfGTpfFlJ/tBbaOGYAguoARSuRkDBOMjOa5nW/ERtfi9LpmoeLn0zQZdFW/i3TQRp5pmK/K7qcjaM4yaOtv62uHS/9b2PWqKxvCHmNocM7apNqkFz/AKRb3MyqrmJ8MoO0AHAPXHStmm1YAooopAeZ+MdE1PW/iF4Iv7jw613plhFdfbt0kDxxtLGoA2u4LYYHJC/StT4j+Cm17QdMTw+bax1LRryPUNPBTbD5iH7jBRwrAkcDiu4oo6aev43D19DzH4i6fr3jbwlb6Qvhyeyu3u7aaWS4uLdoIxHIrMQyuWIwCB8mTnkCriaXq3/C7pdabSLj+xm0UaeLrzYdpkExf7u/ftwf7tehUULR/e/vVvyB6q3p+Ducp4x8P6XPoO2+nv7XTrGArFDY3UkBDYAUjyyCzDACqcjJ6E1laT4i1TRdO0PQ9Tt31LxBHpP2+/dpQhVE2q3ODukJOAOASDkit/xR4ak164spU17VtL+yksqWXkFWY/xMJYn5HbpjNU7vwNa3awPPqurNepaS2Mt55kfnXEMjBmVzswORwVCkdsUtbO39aO347+Q9NL/1t+n4mr4O1s+I/DGnaz9la1W9iEyRM24hD90k4HUYP40VN4d0eLQtJh062nuJreEbYvPYMUQcKgIA4UAAd+OSTkkqna+hKvbU0qKKKQwooooAKKKKACiiigD/2Q=="]},{"id":"AMO_2021_藥理_040","year":2021,"roc_year":110,"session":"","examNo":40,"q":"下列有關carprofen的敘述，何者錯誤？","opts":["A. 對COX-1之抑制能力比對COX-2之抑制強100倍","B. 可用於犬作為鎮痛及消除炎症之藥物","C. 很少發生胃腸道潰瘍及出血","D. 會增加肝臟及腎臟產生毒性之風險"],"ans":0,"exp":"此題問何者錯誤。Carprofen（卡洛芬）是獸醫常用的非類固醇抗炎藥（NSAID），屬於COX-2優先性抑制劑（COX-2 preferential inhibitor）或COX-2選擇性藥物，其對COX-2的抑制能力高於（或相當於）COX-1，而非「對COX-1之抑制能力比COX-2強100倍」。選項A的描述完全顛倒了carprofen的COX選擇性（答案A）。","we":["","此為正確描述：Carprofen是獸醫臨床上廣泛使用的犬隻術後及骨關節炎疼痛管理藥物，具有消炎（anti-inflammatory）和鎮痛（analgesic）雙重功效，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：由於carprofen具有COX-2選擇性/優先性，對保護胃黏膜的COX-1影響較小，相較於非選擇性NSAIDs（如aspirin、phenylbutazone），確實較少引起胃腸道潰瘍及出血，此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：Carprofen在犬隻有引起特異性肝毒性（idiosyncratic hepatotoxicity）的風險（尤其是Labrador retrievers），也可能影響腎臟血流導致腎毒性，需定期監測肝腎功能，此描述正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_041","year":2021,"roc_year":110,"session":"","examNo":41,"q":"下列何種NSAIDs對cyclooxygenase及lipoxygenase均有抑制作用？","opts":["A. deracoxib","B. carprofen","C. phenybutazone","D. tepoxalin"],"ans":3,"exp":"Tepoxalin是唯一同時抑制cyclooxygenase（COX-1和COX-2）以及5-lipoxygenase（5-LOX）的NSAID。COX抑制阻止花生四烯酸（arachidonic acid）轉化為前列腺素（prostaglandins）和血栓素（thromboxanes）；5-LOX抑制阻止花生四烯酸轉化為白三烯素（leukotrienes，LTs）。雙重抑制減少了炎症介質（包括LTB4等趨化因子）的生成，具有比單純COX抑制更廣泛的抗炎作用，且理論上可減少COX抑制導致的白三烯素代償性升高。","we":["錯誤：Deracoxib為高度選擇性COX-2抑制劑（選擇性指數遠高於COX-1），僅抑制COX，不抑制5-lipoxygenase，屬於coxib類NSAID。","錯誤：Carprofen為COX-2偏向性NSAID（相對COX-2選擇性），僅抑制cyclooxygenase而不抑制5-lipoxygenase；其抗炎機制未涉及白三烯素途徑。","錯誤：Phenylbutazone（保泰松）為傳統非選擇性COX抑制劑（COX-1和COX-2），不具有5-lipoxygenase抑制活性；臨床上用於馬的肌肉骨骼炎症。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_042","year":2021,"roc_year":110,"session":"","examNo":42,"q":"下列有關aspirin的敘述，何者錯誤？","opts":["A. 對血小板的抑制作用為可逆性","B. 為非選擇性的cyclooxygenase抑制劑","C. 對腹部絞痛之治療不具效應","D. 可被併用於治療敗血症及內毒素性休克重度感染的動物"],"ans":0,"exp":"Aspirin（乙醯水楊酸）對血小板的抑制作用是不可逆的（irreversible）。Aspirin透過共價乙醯化（covalent acetylation）血小板cyclooxygenase-1（COX-1）活性位點的絲胺酸殘基（Ser529/Ser530），永久性使其失活。由於成熟血小板缺乏細胞核，無法重新合成新的COX-1蛋白，因此血小板的血栓素A2（TXA2）生成能力在整個血小板生命週期（約7-10天）內均被抑制。新血小板從骨髓生成後才能恢復正常功能。","we":["","此為正確描述：Aspirin為非選擇性COX（COX-1和COX-2）抑制劑；抑制COX-1影響血小板功能，抑制COX-2減少炎症；不符合「錯誤」描述。","此為正確描述：Aspirin對腹部絞痛（colic）疼痛效果不佳；腹部內臟痛需要阿片類鎮痛劑效果更好，且aspirin對GI的刺激可能加重腹痛；不符合「錯誤」描述。","此為正確描述：Aspirin可用於敗血症和內毒素性休克（endotoxic shock）的輔助治療，通過抑制COX和前列腺素過度生成；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_043","year":2021,"roc_year":110,"session":"","examNo":43,"q":"胰島素的分泌會受到下列何者的抑制？","opts":["A. glucagon","B. gastrin","C. epinephrine","D. secretin"],"ans":2,"exp":"Epinephrine（腎上腺素）透過激活胰臟β細胞上的α2-腎上腺素性受體（α2 adrenergic receptors），抑制胰島素的分泌。α2受體的激活透過Gi蛋白降低腺苷酸環化酶（adenylate cyclase）活性，減少細胞內cAMP，進而抑制胰島素的胞吐釋放（exocytosis）。這是應激反應（fight-or-flight response）的一部分，目的是維持高血糖（hyperglycemia）供應組織能量。","we":["錯誤：Glucagon由胰臟α細胞分泌，其本身不直接抑制β細胞胰島素分泌（事實上，高血糖可刺激胰島素分泌）；glucagon升高血糖是通過肝糖原分解，而非直接抑制胰島素。","錯誤：Gastrin（促胃液素）由胃G細胞分泌，主要促進胃酸分泌；它實際上可輕微刺激（而非抑制）胰島素分泌，不屬於抑制因子。","","錯誤：Secretin由小腸S細胞分泌，主要促進胰液和膽汁分泌；對胰島素分泌的直接影響微小，不是主要的胰島素分泌抑制因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_044","year":2021,"roc_year":110,"session":"","examNo":44,"q":"下列何者主要透過活化α-腎上腺素性受體，造成平滑肌持久之收縮？","opts":["A. ergonovine","B. finasteride","C. bromocriptine","D. flumethasone"],"ans":0,"exp":"Ergonovine（麥角新鹼）為麥角生物鹼（ergot alkaloid），可活化平滑肌細胞上的α-腎上腺素性受體（α-adrenergic receptors），引起平滑肌強烈且持久的收縮（sustained contraction）。Ergonovine對子宮平滑肌有特別強烈的收縮作用，臨床上用於產後出血（postpartum hemorrhage）的控制。其α-腎上腺素性受體激活機制使血管和子宮平滑肌產生強力收縮。","we":["","錯誤：Finasteride為5α-還原酶抑制劑，抑制睪酮轉化為二氫睪酮（DHT），主要用於良性前列腺增生（BPH）和雄性激素性脫髮；不具有α-腎上腺素性受體激活作用。","錯誤：Bromocriptine為多巴胺D2受體激動劑（dopamine agonist），用於高泌乳素血症（hyperprolactinemia）的治療及泌乳抑制；雖然也是麥角衍生物，但主要透過多巴胺受體而非α-腎上腺素性受體作用。","錯誤：Flumethasone為合成糖皮質激素（synthetic glucocorticoid），具有抗炎和免疫抑制作用；不作用於α-腎上腺素性受體，不引起持久性平滑肌收縮。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_045","year":2021,"roc_year":110,"session":"","examNo":45,"q":"下列何者不屬於抗甲狀腺藥（antithyroid drugs）？","opts":["A. methimazole","B. carbimazole","C. albendazole","D. propylthiouracil"],"ans":2,"exp":"Albendazole（阿苯達唑）屬於苯并咪唑類（benzimidazole）廣效驅蟲藥，通過結合線蟲的β-微管蛋白（β-tubulin），抑制微管聚合（microtubule polymerization），阻礙細胞分裂和葡萄糖攝取，從而殺死寄生蟲。Albendazole完全沒有抗甲狀腺（antithyroid）活性，不屬於抗甲狀腺藥物。甲巰咪唑（methimazole）、卡比馬唑（carbimazole）和丙硫氧嘧啶（propylthiouracil）才是真正的抗甲狀腺藥。","we":["此為正確描述：Methimazole（甲巰咪唑）為抗甲狀腺藥，抑制甲狀腺過氧化酶（TPO），阻止碘化物氧化和甲狀腺激素（T3/T4）合成；為貓甲狀腺功能亢進的首選治療藥物；屬於抗甲狀腺藥。","此為正確描述：Carbimazole（卡比馬唑）為甲巰咪唑的前驅藥（prodrug），在體內轉化為甲巰咪唑發揮抗甲狀腺作用；屬於抗甲狀腺藥，不符合「不屬於」描述。","","此為正確描述：Propylthiouracil（PTU，丙硫氧嘧啶）為抗甲狀腺藥，抑制TPO並額外抑制外周T4轉化為T3（deiodinase抑制）；屬於抗甲狀腺藥，不符合「不屬於」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_046","year":2021,"roc_year":110,"session":"","examNo":46,"q":"牛產後麻痺與缺乏下列何者有關？","opts":["A. 維生素D","B. 銅","C. 維生素A","D. 生物素"],"ans":0,"exp":"牛產後麻痺（parturient paresis / milk fever）是由低血鈣症（hypocalcemia）引起，而鈣的吸收和動員需要活性型維生素D（1,25-dihydroxycholecalciferol = calcitriol）的參與。Calcitriol透過核受體促進小腸鈣吸收、腎小管鈣再吸收和骨鈣動員。分娩時對鈣需求急劇增加（泌乳啟動），若維生素D代謝或其受體上調反應不足，則無法及時動員鈣，導致低血鈣性麻痺。預防包括分娩前維生素D或其類似物的投予。","we":["","錯誤：銅（copper）缺乏主要引起貧血（銅是鐵代謝所需的酶的輔因子）、骨骼異常和神經系統症狀（如运动失调）；不是牛產後麻痺的主要病因。","錯誤：維生素A缺乏主要引起夜盲症、上皮組織角化、繁殖障礙（公牛精子異常、母牛繁殖失敗）和免疫抑制；不是牛產後麻痺的主要病因。","錯誤：生物素（biotin）缺乏主要影響蹄部角質（蹄底角質化不良、蹄葉炎）；不是牛產後麻痺的主要病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_047","year":2021,"roc_year":110,"session":"","examNo":47,"q":"當豬隻缺乏維生素A時，下列何種障礙最顯著？","opts":["A. 呼吸作用","B. 繁殖性能","C. 神經傳遞","D. 消化功能"],"ans":1,"exp":"豬隻維生素A缺乏時，最顯著的障礙為繁殖性能（reproductive performance）降低。維生素A（視黃醇，retinol）對維持上皮細胞正常分化至關重要。缺乏時，豬隻出現：母豬不規則發情、胚胎吸收增加、弱仔或死產增多；公豬精子生成障礙（角化的精細管上皮）；此外，維生素A也影響精子的鞭毛結構。豬隻對維生素A缺乏特別敏感，繁殖障礙往往先於其他症狀出現。","we":["錯誤：呼吸作用（respiration）對豬的維生素A缺乏的影響並非最顯著；呼吸道上皮雖可能角化，但在豬隻中不是最主要的臨床表現。","","錯誤：神經傳遞（neural transmission）並非豬隻維生素A缺乏的最顯著障礙；神經系統症狀（如共濟失調）在維生素A缺乏中存在但不是豬的最主要表現。","錯誤：消化功能（digestive function）不是豬隻維生素A缺乏的最顯著障礙；消化系統通常不是維生素A缺乏的主要靶器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_048","year":2021,"roc_year":110,"session":"","examNo":48,"q":"下列何藥物可用於治療末期腎臟疾病所導致之貧血？","opts":["A. ferric sulfate","B. vitamin K","C. erythropoietin","D. vitamin"],"ans":2,"exp":"末期腎臟疾病（end-stage renal disease, ESRD）引起的貧血主要原因是腎臟分泌促紅細胞生成素（erythropoietin, EPO）減少。EPO由腎臟近腎小球旁細胞（peritubular cells）在低氧時分泌，促進骨髓紅系前驅細胞增殖分化為成熟紅血球。ESRD時腎實質嚴重破壞，EPO分泌不足，導致正細胞正色素性貧血（normocytic normochromic anemia）。治療使用重組人EPO（recombinant EPO）或其長效類似物（darbepoetin）皮下注射。","we":["錯誤：Ferric sulfate（硫酸鐵）為鐵劑補充劑，用於缺鐵性貧血（iron deficiency anemia）；ESRD貧血的主因是EPO缺乏而非鐵缺乏，鐵劑無法解決根本問題（雖可能需要補充鐵以維持EPO療效）。","錯誤：Vitamin K（維生素K）用於出血性疾病（coagulopathy）的治療，如維生素K拮抗劑（warfarin）中毒或維生素K缺乏性出血；不用於ESRD貧血的治療。","","錯誤：題目選項D為圖片（image），但其餘選項不符合ESRD貧血治療。在末期腎臟疾病中，正確治療為補充重組EPO，因為腎臟無法產生足夠EPO來刺激紅血球生成。"],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAeACEDASIAAhEBAxEB/8QAGwAAAgIDAQAAAAAAAAAAAAAAAAQDBgIFBwj/xAAnEAACAgEDBAEEAwAAAAAAAAABAgMEBQAGEQcSITFBEyJRYRVxgv/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAhEQACAgAFBQAAAAAAAAAAAAAAAREhAjFRkfAiYaGxwf/aAAwDAQACEQMRAD8A9SyzxRECWWNCfQZgNZo6uoZGDKfRB5GuVde4K7jZE01FbjLuOqv0xGrM6lX5Qd3jzx6J40hhrMEfXivBQoS7ahkxkgmqTxiEZN+4FWjVCUYoAeW57uDxxxph6q7tbKRirZeXB2XRpOnlKF2xbgp3K881RglhI5AxiYjkBuPR4+DpPB7nwefnsw4XLUb81Y8TJXmVyn4JA+P360BuNGjRoCodQNp3d0vg2p5SvQ/i8hHkVEtNp/qOgYBTxInC/d/eojsy1kN64rce4crDblxMcqUq1Woa8aNIOHdi0jljx4HkAfjV00aKsuVHoO8yjbWijl391AilVWjeSorqfRBrgHnU2JrUMhvlc9XevHFFRbG1AjAGwveHdgPlF7QF/wBH0QTY0wmKSa7KmMorLeHbacV0DWBxxxIePuHHjzzpTC7S23g7ZtYTb+Ix1kqUM1SlHC5U+x3KoPHgeP1oqaei+QHajmpu9GjRoD//2Q=="]},{"id":"AMO_2021_藥理_049","year":2021,"roc_year":110,"session":"","examNo":49,"q":"Penciclovir以局部（topically）投藥，對下列何種病毒有效？","opts":["A. herpesvirus","B. cytomegalovirus","C. myxovirus","D. poxvirus"],"ans":0,"exp":"Penciclovir（喷昔洛韋）為非環式鳥嘌呤核苷類似物（acyclic guanosine nucleoside analog），局部投藥時主要對疱疹病毒（herpesvirus）有效，包括HSV-1、HSV-2和VZV。Penciclovir需先由病毒胸苷激酶（viral thymidine kinase, TK）磷酸化為活性形式penciclovir三磷酸，再競爭性抑制病毒DNA聚合酶（viral DNA polymerase），阻止病毒DNA合成。因依賴病毒TK的啟動，對人類細胞選擇性高而毒性低。","we":["","錯誤：Cytomegalovirus（CMV）對penciclovir的敏感性低；CMV缺乏TK（或TK不磷酸化penciclovir），penciclovir對CMV效果差；CMV感染需用ganciclovir或valganciclovir。","錯誤：Myxovirus（黏液病毒，如流感病毒）不含疱疹病毒TK，penciclovir無法被磷酸化為活性形式；流感病毒感染使用神經氨酸酶抑制劑（奧司他韋）或M2離子通道抑制劑（金剛烷胺）。","錯誤：Poxvirus（痘病毒，如牛痘病毒）不依賴宿主TK進行DNA合成，penciclovir無效；痘病毒感染使用cidofovir或tecovirimat。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_050","year":2021,"roc_year":110,"session":"","examNo":50,"q":"下列何者主要是抑制病毒的脫殼（uncoating）？","opts":["A. zidovudine","B. amantadine","C. acyclovir","D. idoxuridine"],"ans":1,"exp":"Amantadine（金剛烷胺）主要通過抑制A型流感病毒的M2離子通道（M2 protein ion channel），阻止病毒在宿主細胞內體（endosome）中的酸化過程。流感病毒進入內體後，M2通道允許H⁺進入病毒顆粒，降低病毒內部pH，觸發病毒RNA從膜蛋白中釋放（脫殼/uncoating）。Amantadine阻斷M2通道→阻止病毒脫殼→阻止病毒RNA進入細胞質→抑制病毒複製。","we":["錯誤：Zidovudine（AZT）為核苷類逆轉錄酶抑制劑（NRTI），抑制HIV逆轉錄酶（reverse transcriptase），阻止HIV RNA轉錄為DNA；不是通過阻止脫殼（uncoating），而是在逆轉錄步驟起作用。","","錯誤：Acyclovir為核苷類似物，由疱疹病毒TK磷酸化後抑制病毒DNA聚合酶；抑制的是DNA合成步驟（複製），而非脫殼（uncoating）過程。","錯誤：Idoxuridine（IDU）為碘化胸苷類似物，干擾病毒DNA合成（競爭性取代胸苷）；不是通過抑制脫殼，而是通過干擾DNA合成起作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_051","year":2021,"roc_year":110,"session":"","examNo":51,"q":"下列何者在犬隻消化道的吸收較其他三種藥品為佳？","opts":["A. neomycin","B. bacitracin","C. tubocurarine","D. enrofloxacin"],"ans":3,"exp":"Enrofloxacin（恩諾沙星）為氟喹諾酮類（fluoroquinolone）抗生素，口服後在犬隻消化道吸收良好（生體可用率達75-80%）。其高口服生體可用率源於良好的脂溶性和較低的分子量，可在腸道迅速吸收，且無顯著的首渡效應。其餘三種藥物口服吸收均差：neomycin、bacitracin為多肽/氨基糖苷類，分子量大、親水性高，腸道吸收極差；tubocurarine為季銨化合物，帶永久電荷，口服幾乎不吸收。","we":["錯誤：Neomycin（新黴素）屬氨基糖苷類（aminoglycoside），為多價陽離子化合物（含多個氨基），親水性高，口服後在腸道吸收極差（<1%）；主要用於局部抗感染或腸道去污染。","錯誤：Bacitracin（桿菌肽）為多肽類（polypeptide）抗生素，分子量大、親水性高，口服不吸收（<5%）；主要用於局部應用（外用抗菌）。","錯誤：Tubocurarine（筒箭毒鹼）為帶有兩個季銨基（quaternary ammonium）的苯甲基異喹啉化合物，具有永久性正電荷，極性強，口服後腸道吸收極差；臨床需靜脈注射才能起效。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_052","year":2021,"roc_year":110,"session":"","examNo":52,"q":"下列那一抗微生物藥物不可使用於乳牛之治療？","opts":["A. nitrofurazone","B. penicillin G","C. streptomycin","D. tetracycline"],"ans":0,"exp":"Nitrofurazone（硝基呋喃類化合物）屬於硝基呋喃類（nitrofuran）抗菌藥物，因其代謝產物具有潛在致癌性（carcinogenicity）及藥物殘留問題，已被許多國家禁止用於食品動物（尤其是泌乳乳牛）。硝基呋喃類藥物（包括nitrofurantoin、furazolidone等）在歐盟、美國及台灣均禁用於食品動物，乳牛尤其不得使用，以防止食品中殘留及潛在致癌性。","we":["","此為正確描述：Penicillin G為β-內醯胺類抗生素，可用於乳牛治療（有核准用法及殘留容許量/withdrawal period），不在禁用之列；不符合「不可使用」描述。","此為正確描述：Streptomycin為氨基糖苷類抗生素，某些國家/地區允許在乳牛有限使用（有殘留限量），不在絕對禁止範圍；不符合「不可使用」描述。","此為正確描述：Tetracycline（四環黴素）可用於乳牛治療（有核准用法及休藥期），不在禁用之列；不符合「不可使用」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_053","year":2021,"roc_year":110,"session":"","examNo":53,"q":"下列那一種磺胺劑可製成中性酸鹼值之鈉鹽製劑而適用於眼科？","opts":["A. sulfamethazine","B. sulfacetamide","C. sulfadimethoxine","D. sulfachlorpyridazine"],"ans":1,"exp":"Sulfacetamide（磺胺醋醯胺）可製成中性（pH接近7.0）的鈉鹽（sulfacetamide sodium）水溶液，適用於眼科（ophthalmic use）。其他磺胺劑的鈉鹽水溶液呈鹼性（pH > 9），會刺激眼部組織，無法耐受。Sulfacetamide sodium的pKa相對較低（約5.4），使其鈉鹽水溶液接近中性，不會引起明顯的眼部刺激，是臨床常用的眼科抗菌製劑，用於治療細菌性結膜炎、角膜炎等。","we":["錯誤：Sulfamethazine（磺胺二甲嘧啶）的鈉鹽水溶液呈強鹼性（pH約10-11），對眼部組織刺激性大，不適合用於眼科製劑。","","錯誤：Sulfadimethoxine（磺胺二甲氧嘧啶）的鈉鹽水溶液呈鹼性，對眼部組織有刺激性，不適合製成眼科用製劑。","錯誤：Sulfachlorpyridazine（磺胺氯噠嗪）的鈉鹽水溶液呈鹼性，不適合眼科使用；主要用於消化道感染的治療（因腸道吸收差，主要在腸道發揮作用）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_054","year":2021,"roc_year":110,"session":"","examNo":54,"q":"下列那一種抗微生物之併用組合比較不會誘發細菌抗藥性之形成？","opts":["A. sulfathiazole-sulfaquinoxaline","B. sulfadiazine-sulfamethoxazole","C. sulfadiazine-trimethoprim","D. sulafasalazine-sulfaguanindine"],"ans":2,"exp":"Sulfadiazine（磺胺嘧啶）與trimethoprim（甲氧苄啶）的聯合用藥（co-trimoxazole）是一種協同抑制（synergistic inhibition）策略，不易誘發細菌抗藥性。兩藥分別阻斷葉酸合成的不同步驟：sulfadiazine抑制dihydropteroate synthase（DHPS，PABA→二氫葉酸），trimethoprim抑制dihydrofolate reductase（DHFR，二氫葉酸→四氫葉酸）。序列性雙重阻斷使細菌難以通過單一突變獲得抗藥性（需要兩個靶點同時突變）。","we":["錯誤：Sulfathiazole與sulfaquinoxaline均為磺胺劑，作用機制相同（均抑制DHPS），屬同類藥物聯用，不能防止抗藥性（細菌對磺胺類的交叉耐藥性使兩者同時失效）。","錯誤：Sulfadiazine與sulfamethoxazole均為磺胺劑，作用機制相同（均抑制DHPS），同類聯用不能有效防止抗藥性的產生。","","錯誤：Sulfasalazine（柳氮磺吡啶）與sulfaguanidine（磺胺脒）均為磺胺劑，作用機制相同，同類聯用不能防止抗藥性；且此組合無已知的協同抑菌作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_055","year":2021,"roc_year":110,"session":"","examNo":55,"q":"高劑量給予低溶解度的磺胺劑sulfathiazole所產生之主要不良反應為何？","opts":["A. 結晶尿","B. 過敏性胃腸炎","C. 甲狀腺功能低下","D. 低凝血酶元血症"],"ans":0,"exp":"高劑量低溶解度磺胺劑（如sulfathiazole）在腎小管中濃度升高後可能超過其溶解度而沉澱，形成結晶尿（crystalluria）。腎小管中的磺胺藥物被濃縮，且尿液中正常的弱酸性pH（5-6）會使磺胺劑的溶解度進一步降低（大多數磺胺劑在酸性尿液中溶解度差）。磺胺結晶可堵塞腎小管和輸尿管，引起血尿、腰痛甚至腎功能損傷。預防措施包括充足飲水以稀釋尿液和鹼化尿液（提高磺胺溶解度）。","we":["","錯誤：過敏性胃腸炎雖然是磺胺劑的潛在不良反應，但不是低溶解度磺胺劑高劑量使用的主要不良反應；結晶尿和腎損傷才是最常見且最直接的劑量相關毒性。","錯誤：甲狀腺功能低下是磺胺劑長期使用的潛在副作用（部分磺胺劑可抑制甲狀腺碘有機化），但不是高劑量低溶解度磺胺劑的主要急性毒性。","錯誤：低凝血酶元血症（hypoprothrombinemia）是維生素K拮抗劑（如warfarin）或嚴重肝病的表現，不是磺胺劑的主要不良反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_056","year":2021,"roc_year":110,"session":"","examNo":56,"q":"青黴素類抗生素抗菌活性的破壞，通常發生於其化學構造上的那一個位置被裂解之後所造成？","opts":["A. 醯胺鍵","B. β-內醯胺環","C. 羰基連接","D. 羧基連接"],"ans":1,"exp":"青黴素類（penicillins）的抗菌活性依賴其β-內醯胺環（β-lactam ring）的完整性。β-內醯胺酶（β-lactamase）能水解β-內醯胺環的醯胺鍵（C-N bond in the β-lactam ring），打開環狀結構，生成無活性的青黴噻唑酸（penicilloic acid），使藥物失去與penicillin-binding proteins（PBPs）共價結合的能力，從而喪失抗菌活性。這是細菌對青黴素類最重要的耐藥機制。","we":["錯誤：醯胺鍵（amide bond）在β-內醯胺環中即為環中的N-C(=O)鍵，雖然β-內醯胺酶確實水解此醯胺鍵，但更精確的術語是「β-內醯胺環被開環」；β-內醯胺環的斷裂是破壞活性的關鍵，而非側鏈醯胺（acyl amino side chain）。","","錯誤：羰基連接（carbonyl linkage）的破壞不是β-內醯胺酶的主要作用位點；藥物失活的關鍵是β-內醯胺環開環，而非側鏈中的羰基。","錯誤：羧基連接（carboxyl linkage）的裂解不是青黴素失活的原因；β-內醯胺酶作用的是β-內醯胺環，而非其他化學結構位點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_057","year":2021,"roc_year":110,"session":"","examNo":57,"q":"青黴素類抗生素之作用機制主要為抑制細菌那一成分之功能？","opts":["A. DNA gyrase","B. RNA polymerase","C. thymidylate synthase","D. transpeptidase"],"ans":3,"exp":"青黴素類的作用機制主要為抑制細菌細胞壁合成的最後步驟：轉肽酶反應（transpeptidation）。青黴素類與青黴素結合蛋白（penicillin-binding proteins, PBPs）中的轉肽酶（transpeptidase）發生共價結合，抑制肽聚糖（peptidoglycan）鏈間的交叉連接（cross-linking）。沒有正確交叉連接的細胞壁結構強度不足，細菌在滲透壓差下溶菌死亡。這也是β-內醯胺類抗生素（包括頭孢菌素）共同的作用靶點。","we":["錯誤：DNA gyrase（DNA旋轉酶/解旋酶）是喹諾酮類（quinolones，如enrofloxacin）的作用靶點，抑制DNA複製；不是青黴素的作用靶點。","錯誤：RNA polymerase（RNA聚合酶）是rifampicin（利福平）的作用靶點，抑制細菌轉錄；不是青黴素的作用靶點。","錯誤：Thymidylate synthase是抗代謝類藥物（如5-fluorouracil）的靶點，影響DNA合成；不是青黴素的作用靶點。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_058","year":2021,"roc_year":110,"session":"","examNo":58,"q":"下列那一藥物屬於長效型青黴素類製劑，單一次肌肉注射後其吸收可以維持48~72小時？","opts":["A. benzathine penicillin G","B. procaine penicillin G","C. benzylpenicillin","D. ampicillin"],"ans":0,"exp":"Benzathine penicillin G（苄星青黴素G）是青黴素G與苄星（benzathine）形成的鹽，具有極低的水溶性，注射後形成貯庫（depot），緩慢水解釋放青黴素G。單次肌肉注射後，有效血藥濃度可維持48-72小時（牛、馬等大動物）甚至更長。這種長效製劑避免了頻繁注射的需要，特別適合在野外或農場條件下使用。","we":["","錯誤：Procaine penicillin G（普魯卡因青黴素G）為中效製劑，水溶性低於青黴素G鈉/鉀鹽，單次注射可維持約12-24小時（有效濃度），而非48-72小時；不如benzathine penicillin G長效。","錯誤：Benzylpenicillin（青黴素G鈉/鉀鹽）為水溶性製劑，注射後迅速吸收，血漿半衰期短（約30分鐘），需每4-6小時給藥一次；不是長效製劑。","錯誤：Ampicillin（氨苄青黴素）為廣效半合成青黴素，雖有苄星鹽製劑，但常規製劑不屬於長效型；口服製劑半衰期約1小時，注射製劑也需每6-8小時給藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_059","year":2021,"roc_year":110,"session":"","examNo":59,"q":"第一代頭孢菌素類（cephalosporins）藥物經吸收後，下列那一組織無法滲入？","opts":["A. 尿液","B. 乳液","C. 皮下組織","D. 腦脊髓液"],"ans":3,"exp":"第一代頭孢菌素類（1st generation cephalosporins，如cephalothin, cephalexin, cefazolin）的脂溶性較差，且分子量較大，無法有效穿越血腦屏障（blood-brain barrier, BBB）進入腦脊髓液（cerebrospinal fluid, CSF）。BBB由緊密連接的腦毛細血管內皮細胞、星形膠質細胞端足和基底膜組成，主要限制親水性和高分子量化合物進入。因此第一代頭孢菌素對中樞神經系統感染（腦膜炎等）無效，需使用能穿透BBB的第三代頭孢菌素（如cefotaxime, ceftriaxone）。","we":["此為正確描述：第一代頭孢菌素吸收後確可通過腎小球濾過及分泌進入尿液（如cephalexin尿液濃度高），適用於泌尿道感染；可滲入尿液，不符合「無法滲入」描述。","此為正確描述：部分頭孢菌素可分泌至乳汁（通過主動分泌機制），乳液中可檢測到藥物濃度；不符合「無法滲入」描述。","此為正確描述：頭孢菌素可滲入皮下組織（皮下液間液），組織分布廣泛，蛋白結合率適中；皮下組織可吸收藥物，不符合「無法滲入」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_060","year":2021,"roc_year":110,"session":"","examNo":60,"q":"長時間或高劑量使用頭孢菌素類（cephalosporins）藥物，對動物最可能產生之不良反應為何？","opts":["A. 腎結晶尿","B. 中樞神經性痙攣","C. 神經肌肉連接阻斷","D. 骨髓抑制"],"ans":3,"exp":"長時間或高劑量使用頭孢菌素類（cephalosporins）藥物對動物最可能產生的不良反應為骨髓抑制（bone marrow suppression）。長期頭孢菌素治療可導致中性粒細胞減少症（neutropenia）、血小板減少症（thrombocytopenia）等血液學毒性，類似其他β-內醯胺類（如penicillins）導致的免疫介導性骨髓抑制或直接細胞毒性。這是劑量相關和時間相關的副作用。","we":["錯誤：腎結晶尿是磺胺劑（尤其是低溶解度磺胺劑）高劑量使用的特徵性不良反應，而非頭孢菌素的主要毒性。","錯誤：中樞神經系統痙攣（CNS seizures）是青黴素類（尤其是高劑量靜脈給藥）的潛在不良反應，主要見於γ-氨基丁酸（GABA）拮抗所致；頭孢菌素也有類似但較少見的CNS毒性，但不是長期高劑量使用的主要毒性。","錯誤：神經肌肉連接阻斷（neuromuscular blockade）是氨基糖苷類（aminoglycosides，如gentamicin, neomycin）的特徵性毒性（阻斷突觸前Ca²⁺依賴的ACh釋放）；不是頭孢菌素的主要不良反應。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_061","year":2021,"roc_year":110,"session":"","examNo":61,"q":"下列那一藥物注射給藥後對腦脊髓液之穿透力最好？","opts":["A. cephalexin","B. aztreonem","C. gentamicin","D. azithromycin"],"ans":1,"exp":"靜脈注射後對腦脊髓液（CSF）穿透力最好的是aztreonem（aztreonam，氨曲南）。Aztreonam為單環β-內醯胺類（monobactam），僅對革蘭陰性菌（包括Pseudomonas）有效。其對血腦屏障的穿透力優於第一代頭孢菌素和氨基糖苷類。選項中：cephalexin（第一代頭孢菌素）CSF穿透差；gentamicin（氨基糖苷類）CSF穿透極差；azithromycin（大環內酯類）親脂性高但主要分布在組織而非CSF。","we":["錯誤：Cephalexin（頭孢拉定，第一代頭孢菌素）的脂溶性差，分子量相對較大，無法有效穿越血腦屏障（BBB）進入CSF；不適用於中樞神經系統感染。","","錯誤：Gentamicin（慶大黴素，氨基糖苷類）為多價陽離子化合物，極性強，親水性高，對血腦屏障穿透力極差；腦膜炎時即使腦膜充血，CSF穿透率也很低，不適用於CNS感染。","錯誤：Azithromycin（阿奇黴素，大環內酯類）雖具有高組織親和力（組織濃度高於血漿），但對CSF的穿透力仍然有限；大環內酯類的分布體積大，偏向組織積聚而非CSF。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_062","year":2021,"roc_year":110,"session":"","examNo":62,"q":"Aminoglycosides引起之神經肌肉阻斷不良反應，與抑制神經突觸下列何者的釋出較有關？","opts":["A. serotonin","B. catecholamine","C. epinephrine","D. acetylcholine"],"ans":3,"exp":"氨基糖苷類（aminoglycosides）引起的神經肌肉阻斷（neuromuscular blockade）不良反應主要與抑制神經末梢突觸前Ca²⁺依賴的乙醯膽鹼（acetylcholine, ACh）釋放有關。氨基糖苷類可：(1) 競爭性阻斷突觸前Ca²⁺通道（與Ca²⁺競爭），抑制神經末梢膜的Ca²⁺內流；Ca²⁺是觸發ACh囊泡胞吐（exocytosis）的必要信號。(2) 突觸後也可能阻斷nAChR，但預突觸抑制ACh釋放是更主要的機制。Ca²⁺補充（靜脈注射）可部分逆轉此毒性。","we":["錯誤：Serotonin（5-羥色胺）為CNS神經傳遞物質，與神經肌肉接頭（NMJ）的信號傳遞無關；氨基糖苷類的NMJ毒性不涉及血清素系統。","錯誤：Catecholamine（兒茶酚胺）（包括多巴胺、去甲腎上腺素等）為腎上腺素性神經傳遞物質；NMJ使用的神經傳遞物質是乙醯膽鹼而非兒茶酚胺，氨基糖苷類的NMJ毒性不涉及兒茶酚胺釋放。","錯誤：Epinephrine（腎上腺素）為腎上腺髓質分泌的兒茶酚胺，非NMJ的神經傳遞物質；NMJ的傳遞依賴ACh，氨基糖苷類阻斷的是ACh的Ca²⁺依賴性釋放，而非腎上腺素。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_063","year":2021,"roc_year":110,"session":"","examNo":63,"q":"Lincosamides易造成下列那一動物腹瀉，因而限制使用？","opts":["A. 牛","B. 馬","C. 貓","D. 豬"],"ans":1,"exp":"Lincosamide類抗生素（lincomycin和clindamycin）最容易在馬（horse）引起嚴重腹瀉，因而限制其在馬的使用。馬的盲腸和結腸中存在大量依賴革蘭陽性厭氧菌的微生物群落（microbiome）；lincosamides高度有效地破壞這些革蘭陽性菌→導致梭狀芽孢桿菌（Clostridium difficile或C. perfringens）過度增殖→產生毒素→嚴重出血性腸炎（colitis）甚至死亡。Lincosamides在馬屬於禁忌，尤其是口服途徑。","we":["錯誤：牛（cattle）雖然也可能因抗生素影響瘤胃微生物群，但lincosamide在牛引起嚴重腹瀉的風險遠低於馬；不是最受限制的動物。","","錯誤：貓（cat）對lincosamide耐受性較馬好；雖然可能引起消化道不適，但嚴重程度遠低於馬，不是最易受影響的動物。","錯誤：豬（pig）對lincosamide的耐受性也優於馬；豬的腸道微生物群受影響程度不及馬的盲腸厭氧菌群，不是lincosamide使用最受限的動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_064","year":2021,"roc_year":110,"session":"","examNo":64,"q":"由長春花（periwinkle）植物中萃取得到的抗腫瘤藥物是：","opts":["A. paclitaxel","B. etoposide","C. irinotecan","D. vinblastine"],"ans":3,"exp":"Vinblastine（長春鹼）和vincristine（長春新鹼）均從長春花植物（periwinkle，學名Catharanthus roseus，又稱Madagascar periwinkle）的葉片中提取的天然生物鹼。長春花生物鹼（vinca alkaloids）通過結合β-微管蛋白（β-tubulin）的特定位點（vinca binding site），抑制微管聚合，破壞紡錘體（mitotic spindle）形成，使細胞停止在有絲分裂中期（M期阻斷），從而抑制腫瘤細胞增殖。","we":["錯誤：Paclitaxel（紫杉醇）來源於太平洋紫杉樹（Taxus brevifolia）的樹皮，屬於紫杉烷類（taxane）；其機制為穩定微管（促進聚合）而非來自長春花，兩者植物來源完全不同。","錯誤：Etoposide（依托泊苷）為鬼臼毒素（podophyllotoxin）的半合成衍生物，來源於鬼臼草（Podophyllum peltatum）；作用機制為拓撲異構酶II（topoisomerase II）抑制劑，非來自長春花。","錯誤：Irinotecan（伊立替康）為喜樹鹼（camptothecin）的半合成衍生物，原型藥物來源於喜樹（Camptotheca acuminata）；作用靶點為DNA拓撲異構酶I（topoisomerase I），非來自長春花。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_065","year":2021,"roc_year":110,"session":"","examNo":65,"q":"下列何種抗腫瘤藥物結構類似葉酸？","opts":["A. mechlorethamine","B. methotrexate","C. mitoxantrone","D. mitotane"],"ans":1,"exp":"Methotrexate（甲胺蝶呤，MTX）為葉酸（folic acid）的結構類似物（structural analog），因其與葉酸高度相似，能以高親和力與二氫葉酸還原酶（dihydrofolate reductase, DHFR）結合，競爭性抑制二氫葉酸（DHF）還原為四氫葉酸（THF）。THF是胸苷酸（TMP）和嘌呤合成所需的一碳單位載體，缺乏THF→核苷酸合成受阻→DNA複製停止→抑制快速增殖細胞（包括腫瘤細胞）。","we":["錯誤：Mechlorethamine（氮芥）為烷化劑（alkylating agent），屬於氮芥類化合物；其結構與葉酸完全不同，通過與DNA鹼基形成共價鍵交叉連接（crosslink）來抑制腫瘤。","","錯誤：Mitoxantrone（米托蒽醌）為蒽環類似物（anthracenedione），結構類似蒽環素（anthracyclines），不像葉酸；其機制為插入DNA（intercalation）和抑制拓撲異構酶II。","錯誤：Mitotane（米托坦）為二氯二苯二氯乙烷（o,p'-DDD）的類似物，結構類似DDT；用於腎上腺皮質腺瘤/癌的治療，不是葉酸結構類似物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_066","year":2021,"roc_year":110,"session":"","examNo":66,"q":"下列何者不屬於aminoglycoside類抗生素？","opts":["A. apramycin","B. tobramycin","C. paromomycin","D. tulathromycin"],"ans":3,"exp":"Tulathromycin（替米拉黴素）屬於三酰胺醯大環內酯類（triamilide macrolide）抗生素，又稱「三元大環內酯」（semi-synthetic macrolide），其化學結構為15元和13元環的混合體，獨特的酮內酯結構使其不屬於傳統的氨基糖苷類（aminoglycoside）抗生素。氨基糖苷類包括：apramycin（阿普拉黴素）、tobramycin（妥布黴素）、paromomycin（巴龍黴素）等，均含有氨基環醇（aminocyclitol）核心與氨基糖連接的結構。","we":["此為正確描述：Apramycin（阿普拉黴素）為氨基糖苷類抗生素，含有氨基環醇核心，通過結合細菌核糖體30S亞基抑制蛋白質合成；屬於aminoglycoside，不符合「不屬於」描述。","此為正確描述：Tobramycin（妥布黴素）為氨基糖苷類抗生素，來源於鏈黴菌（Streptomyces tenebrarius），結構含有去氧鏈黴胺（deoxystreptamine）核心；屬於aminoglycoside，不符合「不屬於」描述。","此為正確描述：Paromomycin（巴龍黴素）為氨基糖苷類抗生素，也用於腸道原蟲（如隱孢子蟲、Giardia）感染；含有氨基糖結構，屬於aminoglycoside，不符合「不屬於」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_067","year":2021,"roc_year":110,"session":"","examNo":67,"q":"飼料中若葉酸添加劑量過高，則會降低下列何種藥物的抗菌效果？","opts":["A. aminoglycosides","B. sulfonamides","C. licosamides","D. tetracyclines"],"ans":1,"exp":"磺胺劑（sulfonamides）的抗菌機制為競爭性抑制細菌的二氫葉酸合成酶（dihydropteroate synthase, DHPS），阻止對胺基苯甲酸（PABA）轉化為二氫葉酸（DHF），使細菌無法合成葉酸。當飼料中葉酸（folic acid）添加過高時，若細菌能利用外源性葉酸（exogenous folate），即可繞過磺胺劑阻斷的合成步驟，直接利用現成葉酸用於核苷酸合成，從而降低磺胺劑的抗菌效果。","we":["錯誤：Aminoglycosides（氨基糖苷類）的抗菌機制是結合細菌核糖體30S亞基，導致mRNA密碼子錯讀，干擾蛋白質合成；與葉酸代謝無關，外源性葉酸不影響氨基糖苷類的抗菌效果。","","錯誤：Lincosamides（林可酰胺類）的作用靶點是細菌核糖體50S亞基，抑制肽基轉移酶（peptidyl transferase）活性；與葉酸代謝無關，外源性葉酸不影響lincosamides的抗菌效果。","錯誤：Tetracyclines（四環素類）通過與30S核糖體亞基結合，阻止氨酰-tRNA（aminoacyl-tRNA）與mRNA-核糖體複合物結合；與葉酸代謝無關，外源性葉酸不影響四環素的抗菌效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_068","year":2021,"roc_year":110,"session":"","examNo":68,"q":"下列何者可用於治療犬隻之G（+）所引起的牙周病及新孢子蟲病（neosporosis）？","opts":["A. clindamycin","B. erythromycin","C. methicillin","D. tylosin"],"ans":0,"exp":"Clindamycin（克林黴素）屬於林可酰胺類（lincosamide）抗生素，對革蘭陽性（G+）菌（如葡萄球菌、鏈球菌）和多數厭氧菌（包括Fusobacterium、Bacteroides）有效，特別適合用於犬的牙周病（periodontal disease）治療。Clindamycin還具有抗原蟲活性，對Toxoplasma gondii和Neospora caninum（新孢子蟲）有效，是犬貓新孢子蟲病（neosporosis）的主要治療藥物。","we":["","錯誤：Erythromycin（紅黴素）為大環內酯類（macrolide）抗生素，對G+菌有一定效果，但對Neospora caninum（新孢子蟲病）無明顯治療效果；且erythromycin對馬引起嚴重腹瀉（限制使用），不是犬牙周病+新孢子蟲病的首選。","錯誤：Methicillin（甲氧苯青黴素）為耐β-內醯胺酶的青黴素，對G+球菌（特別是金黃色葡萄球菌）有效；但對Neospora caninum無效，不適合用於新孢子蟲病治療，也非犬牙周病的常用藥。","錯誤：Tylosin（泰樂菌素）為獸醫大環內酯類抗生素，主要用於豬、禽類的呼吸道和腸道感染；對Neospora caninum無效，不適用於犬新孢子蟲病或牙周病的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_069","year":2021,"roc_year":110,"session":"","examNo":69,"q":"下列何者不是用於治療犬毛囊蟲症？","opts":["A. ivermectin","B. amitraz","C. famotidine","D. doramectin"],"ans":2,"exp":"犬毛囊蟲症（canine demodicosis / demodex mange）為蠕形蟎（Demodex canis）感染所致。標準治療藥物包括：ivermectin（伊維菌素，大環內酯類殺蟲驅蟲藥）、amitraz（阿米曲士，α2 agonist殺蟲劑，局部浸泡）和doramectin（多拉菌素，另一大環內酯類）。Famotidine（法莫替丁）為H2受體拮抗劑（H2-blocker），用於抑制胃酸分泌（消化性潰瘍、胃炎的治療），完全沒有抗蠕形蟎活性，不用於毛囊蟲症的治療。","we":["此為正確描述：Ivermectin（伊維菌素）通過激活蟲體的麩氨酸閘門氯離子通道（glutamate-gated Cl⁻ channels）導致蟲體麻痺，是犬毛囊蟲症的有效治療藥物；屬於治療用藥，不符合「不是」描述。","此為正確描述：Amitraz（阿米曲士）為甲脒類（formamidine）殺蟎藥，激活α2-腎上腺素性受體導致蟲體麻痺，用於犬全身性蠕形蟎病（全身浸泡）；屬於治療用藥，不符合「不是」描述。","","此為正確描述：Doramectin（多拉菌素）為大環內酯類殺蟲藥，作用機制類似ivermectin（激活GluCl通道），有效治療蠕形蟎病；屬於治療用藥，不符合「不是」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_070","year":2021,"roc_year":110,"session":"","examNo":70,"q":"臨床上，鸚鵡嗉囊分離出念珠菌，下列何者不是治療用藥？","opts":["A. flucytosine","B. nystatin","C. ketoconazole","D. gemcitabine"],"ans":3,"exp":"治療鸚鵡（psittacine）嗉囊念珠菌症（candidiasis）的抗黴菌藥包括：flucytosine（氟胞嘧啶，pyrimidine antimetabolite）、nystatin（制黴菌素，多烯類）和ketoconazole（酮康唑，azole類）。Gemcitabine（吉西他濱）為核苷類似物（nucleoside analog，gemcitabine = 2,2-difluorodeoxycytidine），屬於抗腫瘤化療藥物，用於胰腺癌、肺癌等惡性腫瘤治療，完全無抗黴菌活性，不用於念珠菌病治療。","we":["此為正確描述：Flucytosine（氟胞嘧啶）為抗真菌藥，進入真菌細胞後轉化為5-fluorouracil（5-FU），抑制胸苷酸合成酶（thymidylate synthase），干擾DNA合成；用於念珠菌症和隱球菌症治療；屬於治療用藥，不符合「不是」描述。","此為正確描述：Nystatin（制黴菌素）為多烯類抗真菌藥，結合真菌細胞膜的麥角固醇（ergosterol）形成孔洞，破壞膜通透性；常用於禽類鸚鵡嗉囊念珠菌症的治療；屬於治療用藥，不符合「不是」描述。","此為正確描述：Ketoconazole（酮康唑）為唑類（azole）抗真菌藥，通過抑制細胞色素P450酶（CYP51）阻斷麥角固醇合成；用於系統性和局部念珠菌感染治療；屬於治療用藥，不符合「不是」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_071","year":2021,"roc_year":110,"session":"","examNo":71,"q":"下列何者為azoles類抗黴菌機制？","opts":["A. 藉由結合真菌原生質體膜麥角固醇，因而改變細胞的滲透性","B. 藉由結合真菌微管防止主軸的形成而抑制有絲分裂","C. 藉由結合真菌的thymidylate synthase，抑制DNA合成","D. 藉由阻斷細胞素P450酵素抑制麥角固醇的合成，因而提高細胞的滲透性"],"ans":3,"exp":"Azoles類抗黴菌藥的作用機制為：阻斷細胞色素P450酵素（cytochrome P450 CYP51 = lanosterol 14α-demethylase），抑制羊毛脂醇（lanosterol）轉化為麥角固醇（ergosterol）的去甲基化步驟，導致麥角固醇合成受阻，使真菌細胞膜麥角固醇缺乏，細胞膜通透性增加→細胞功能障礙。Azoles選擇性較高是因為真菌的CYP51與哺乳動物的CYP酶親和力差異，但人類CYP也可能受影響（藥物相互作用）。","we":["錯誤：選項A描述的是多烯類（polyenes，如amphotericin B、nystatin）的機制：直接結合真菌細胞膜的麥角固醇，使膜形成孔洞，改變細胞滲透性；不是azoles的作用機制。","錯誤：選項B描述的是灰黃黴素（griseofulvin）的機制：結合微管蛋白（tubulin），防止紡錘體形成，抑制真菌有絲分裂（M期阻斷）；不是azoles的作用機制。","錯誤：選項C描述的是氟胞嘧啶（flucytosine/5-FC）的機制：在真菌細胞內轉化為5-FU，再轉化為活性代謝物，抑制胸苷酸合成酶（thymidylate synthase），阻礙DNA合成；不是azoles的作用機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_072","year":2021,"roc_year":110,"session":"","examNo":72,"q":"Azithromycin可用於治療下列何種疾病？","opts":["A. 耳疥癬","B. 隱孢子蟲症","C. 山羊蟯蟲症","D. 豬鉤頭蟲症"],"ans":1,"exp":"Azithromycin（阿奇黴素）為大環內酯類（macrolide）抗生素，除抗菌活性外，也具有抗原蟲（antiprotozoal）活性。臨床上azithromycin可用於治療隱孢子蟲症（cryptosporidiosis）—Cryptosporidium parvum感染，尤其在免疫功能低下動物中。Azithromycin通過抑制隱孢子蟲的蛋白質合成（50S核糖體結合）發揮效果，雖然療效有限但為少數可用藥物之一。","we":["錯誤：耳疥癬（ear mites, Otodectes cynotis）為外寄生蟲（蟎蟲）感染，需使用殺蟎藥（如ivermectin局部或selamectin），azithromycin對蟎蟲無效（抗原蟲活性不包括節肢動物）。","","錯誤：山羊蟯蟲症（caprine pinworm）為線蟲感染，需驅蟲藥（如苯并咪唑類、伊維菌素），azithromycin無驅線蟲活性，不用於此適應症。","錯誤：豬鉤頭蟲症（porcine hookworm，Globocephalus urosubulatus）為線蟲感染，需驅蟲藥（如苯并咪唑類）治療；azithromycin無驅線蟲活性，不用於此適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_073","year":2021,"roc_year":110,"session":"","examNo":73,"q":"糞便檢出馬蛔蟲（Parascaris sp.）蟲卵，可用下列何者驅除之？","opts":["A. glipizide","B. propantheline","C. metaflumizone","D. oxfendazole"],"ans":3,"exp":"馬蛔蟲（Parascaris equorum，現稱Parascaris sp.）為馬匹（尤其幼駒）的重要線蟲寄生蟲。Oxfendazole（草硫咪唑）為苯并咪唑類（benzimidazole）驅蟲藥，通過結合β-微管蛋白（β-tubulin）抑制微管聚合，破壞線蟲的細胞骨架和有絲分裂，從而殺死蛔蟲。苯并咪唑類對馬的大多數胃腸道線蟲（圓蟲、蛔蟲）均有效，oxfendazole是常用的選擇之一。","we":["錯誤：Glipizide為磺醯脲類（sulfonylurea）口服降血糖藥，用於治療貓的糖尿病（促進胰島素分泌）；完全無驅蟲活性，不用於寄生蟲感染。","錯誤：Propantheline為抗膽鹼藥（muscarinic antagonist），用於治療膀胱痙攣、消化道痙攣或尿道括約肌功能不全；無驅蟲活性。","錯誤：Metaflumizone為半托酰肼類（semicarbazone）驅蟲藥，通過阻斷昆蟲鈉通道（voltage-gated Na⁺ channel）殺滅跳蚤（外寄生蟲）；對馬蛔蟲（線蟲）無效。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_074","year":2021,"roc_year":110,"session":"","examNo":74,"q":"下列何者可激活麩氨酸閘門的氯離子通道（glutamate-gated chloride channels），因此抑制線蟲（及節肢動\r 物）的神經傳遞，誘導鬆弛性麻痺，也能夠活化γ-胺基丁酸（GABA）閘門的氯離子通道？","opts":["A. morantel","B. albendazole","C. levamisole","D. ivermectin"],"ans":3,"exp":"Ivermectin（伊維菌素）及其他阿維菌素類（avermectins）和米爾貝黴素類（milbemycins）通過激活麩氨酸閘門氯離子通道（glutamate-gated chloride channels, GluCl channels），這是線蟲和節肢動物咽部（pharynx）和神經肌肉的特有通道。GluCl通道開放→Cl⁻內流→神經和肌肉細胞超極化（hyperpolarization）→無法傳導衝動→麻痺→死亡。哺乳動物無GluCl通道，且ivermectin不穿透正常血腦屏障，故選擇毒性高。","we":["錯誤：Morantel（嗎啉咪）為四氫嘧啶類（tetrahydropyrimidine），與levamisole類似，作用於線蟲nAChR（煙鹼型乙醯膽鹼受體），引起痙攣性麻痺；不激活GluCl通道，機制與ivermectin不同。","錯誤：Albendazole（阿苯達唑）為苯并咪唑類，通過結合β-微管蛋白抑制微管聚合；不作用於GluCl通道，機制與ivermectin完全不同。","錯誤：Levamisole（左旋咪唑）作用於線蟲的煙鹼型乙醯膽鹼受體（nAChR），激活通道→痙攣性麻痺（spastic paralysis）；不激活GluCl通道。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_075","year":2021,"roc_year":110,"session":"","examNo":75,"q":"能活化線蟲乙醯膽鹼受體，造成痙攣而麻痺的藥物為：","opts":["A. piperazine","B. levamisole","C. ivermectin","D. milbemycin"],"ans":1,"exp":"Levamisole（左旋咪唑）通過激活線蟲神經肌肉接頭的煙鹼型乙醯膽鹼受體（nicotinic acetylcholine receptors, nAChRs），引起線蟲的痙攣性麻痺（spastic paralysis）；線蟲肌肉持續去極化收縮，最終因能量耗盡而死亡。與piperazine（哌嗪）引起的弛緩性麻痺（flaccid paralysis，GABA agonist）不同，levamisole引起的是痙攣性/去極化性麻痺。","we":["錯誤：Piperazine（哌嗪）通過模擬GABA激活線蟲的GABA門控氯通道（GABA-gated Cl⁻ channels），引起Cl⁻內流→肌肉超極化→弛緩性麻痺（flaccid paralysis）；不是通過nAChR，與levamisole作用相反。","","錯誤：Ivermectin通過激活麩氨酸閘門氯離子通道（GluCl channels），引起Cl⁻內流→超極化→迟缓性麻痺；不是通過煙鹼型ACh受體，機制與levamisole不同。","錯誤：Milbemycin（米爾貝黴素）作用機制類似ivermectin（激活GluCl通道），引起弛緩性麻痺；不是通過nAChR，與levamisole機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_076","year":2021,"roc_year":110,"session":"","examNo":76,"q":"Thiabendazole抗蟲的藥理作用機制主要為：","opts":["A. 促進fumarate reductase之效能","B. 打開GABA-gated-chloride channel","C. 結合線蟲的tubulin","D. 活化尼古丁型乙醯膽鹼受體"],"ans":2,"exp":"Thiabendazole（噻苯達唑）為最早的苯并咪唑類（benzimidazole）驅蟲藥，其抗蟲機制主要是與線蟲的β-微管蛋白（β-tubulin）的高親和力結合，抑制微管（microtubule）聚合，破壞線蟲細胞骨架（cytoskeleton）和有絲分裂紡錘體（mitotic spindle），同時也干擾蟲體的葡萄糖攝取和能量代謝（通過微管依賴的胞吞過程）。對哺乳動物微管蛋白的親和力遠低，故具有選擇性。","we":["錯誤：促進fumarate reductase效能描述的是苯并咪唑類的代謝毒性機制之一（干擾線蟲能量代謝），但並非「主要作用機制」；主要機制是微管蛋白結合。","錯誤：打開GABA閘門氯離子通道（GABA-gated Cl⁻ channel）是piperazine的機制；苯并咪唑類不作用於GABA-gated通道。","","錯誤：活化煙鹼型乙醯膽鹼受體（nicotinic ACh receptor）是levamisole和morantel的機制；thiabendazole不作用於nAChR。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_077","year":2021,"roc_year":110,"session":"","examNo":77,"q":"動物有機磷中毒，除需投予atropine外，還需補充下列何者以回復acetylcholine esterase活性？","opts":["A. dimercaprol","B. pralidoxime","C. calcium disodium EDTA","D. sodium thiosulfate"],"ans":1,"exp":"有機磷（organophosphate, OP）中毒時，OP藥物共價結合並不可逆地抑制乙醯膽鹼酯酶（acetylcholinesterase, AChE），使ACh在突觸積累，引起膽鹼能危象（muscarinic + nicotinic + CNS症狀）。治療需要：(1) Atropine（阿托品）：M受體拮抗劑，緩解毒蕈鹼樣症狀（流涎、支氣管痙攣、心動過緩等）；(2) Pralidoxime（2-PAM，碘解磷定）：AChE重活化劑（reactivator），在磷酸化的AChE與酶發生老化反應（aging）前，斷開OP-AChE的磷酸酯鍵，重新激活AChE，回復ACh水解功能。","we":["錯誤：Dimercaprol（BAL，二巰基丙醇）為重金屬螯合劑，用於砷、汞、鉛等重金屬中毒治療；不能重活化AChE，不用於有機磷中毒的AChE功能恢復。","","錯誤：Calcium disodium EDTA（依地酸鈣鈉）為重金屬螯合劑，主要用於鉛、鋅等重金屬中毒治療；不能重活化AChE，不用於有機磷中毒的AChE功能恢復。","錯誤：Sodium thiosulfate（硫代硫酸鈉）為氰化物（cyanide）中毒的解毒劑（提供硫供體，使氰化物轉化為毒性較低的硫氰酸鹽）；不能重活化AChE，不用於有機磷中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_078","year":2021,"roc_year":110,"session":"","examNo":78,"q":"畜舍中散發出「腐敗的雞蛋味」的氣體，對呼吸道黏膜具強烈刺激性，其成分為：","opts":["A. H2S","B. CH4","C. NH3","D. HCN"],"ans":0,"exp":"畜舍中散發出「腐敗的雞蛋味（rotten egg smell）」的氣體為硫化氫（hydrogen sulfide, H2S）。H2S是含硫有機物（如糞便、尿液中的含硫蛋白質）在厭氧環境中被細菌分解時產生的副產物。其特徵性的「臭雞蛋」氣味來自硫化物（S²⁻）的揮發性。H2S對呼吸道黏膜、眼部和神經系統有強烈毒性（抑制細胞色素氧化酶→細胞窒息）；高濃度可導致快速昏迷和死亡。","we":["","錯誤：甲烷（CH4，methane）為畜舍和沼氣坑（anaerobic digestion）中常見的氣體，無色無味（odorless），不具有「腐敗雞蛋」特徵氣味；CH4主要是爆炸性危害而非刺激性毒性。","錯誤：氨（NH3，ammonia）為蛋白質分解的含氮廢物，具有刺鼻的「氨臭」氣味（distinctly pungent, NOT rotten egg），而非腐敗雞蛋味；NH3主要引起上呼吸道和眼部黏膜刺激。","錯誤：氰化氫（HCN，hydrogen cyanide）具有「苦杏仁味（bitter almond smell）」而非腐敗雞蛋味；HCN為細胞毒素（抑制細胞色素氧化酶），常見於火災煙霧中或某些植物（如苦杏仁苷水解）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_079","year":2021,"roc_year":110,"session":"","examNo":79,"q":"下列有關動物用藥殘留之敘述，何者正確？","opts":["A. 殘留容許量係指該藥物原體（parent compound）之含量","B. 有登記證的動物用藥，都必須訂定動物用藥殘留標準","C. 不得檢出的動物用藥品目，食品中的藥物含量為零","D. 訂定動物用藥殘留標準，主要為行政裁量之管制標準"],"ans":3,"exp":"關於動物用藥殘留的敘述，何者正確：D=訂定動物用藥殘留標準（最高殘留限量，MRL），主要為行政裁量之管制標準（administrative regulation standard）。MRL是主管機關（如FDA、EFSA）在評估毒理學數據後設定的管理上限值，其目的是確保食品安全，具有法規管制性質，是政府行政裁量範疇。","we":["錯誤：殘留容許量（MRL）並非僅指藥物原體（parent compound）含量；MRL通常也包含藥物代謝物（metabolites），尤其是具有毒理活性的代謝物，由主管機關決定標誌殘留物（marker residue）。","錯誤：並非所有有登記證的動物用藥都必須訂定殘留標準；部分藥物在停藥足夠長時間後殘留量降至可忽略水平，或使用劑量甚低，主管機關可能不要求設定MRL（如某些疫苗成分）。","錯誤：不得檢出（zero tolerance）的動物用藥，食品中的含量並非必須為「零」；實際執行時依賴分析方法的最低偵測限（LOD），即「在現有檢測技術能偵測到的最低濃度以下」，而非絕對化學意義的零。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2021_藥理_080","year":2021,"roc_year":110,"session":"","examNo":80,"q":"下列何種成分對大多數動物具強烈肝毒性？","opts":["A. strychnine","B. pyrrolizidine","C. oxalate","D. nitrate"],"ans":1,"exp":"吡咯里西定生物鹼（pyrrolizidine alkaloids, PAs）對大多數動物具有強烈肝毒性（hepatotoxicity）。PAs存在於多種植物中（如千里光屬Senecio spp.、天芥菜屬Heliotropium spp.、紫草科植物等）。PAs在肝臟被細胞色素P450酶代謝為吡咯代謝物（pyrrole metabolites）→強烈烷化劑→與DNA、蛋白質發生共價結合（alkylation）→肝細胞壞死→靜脈閉塞性疾病（veno-occlusive disease, VOD）→肝纖維化→死亡。主要影響牛、馬，對豬和雞影響較小。","we":["錯誤：Strychnine（馬錢子鹼）主要為神經毒素，通過阻斷脊髓甘氨酸受體（glycine receptors）導致痙攣（clonic convulsions）；肝毒性不是strychnine的主要毒性作用。","","錯誤：草酸鹽（oxalate）中毒（如誤食馬齒莧Portulaca oleracea等）主要導致低血鈣症（hypocalcemia）、腎小管損傷（草酸鈣結晶沉積）；不是對「大多數動物」最顯著的肝毒性成分。","錯誤：硝酸鹽（nitrate）中毒（如飼料中亞硝酸鹽）主要導致高鐵血紅蛋白血症（methemoglobinemia）→組織缺氧；不是強烈肝毒素，肝毒性不是其主要毒性表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_001","year":2022,"roc_year":111,"session":"","examNo":1,"q":"下列何者最適合用來描述tobramycin 於治療 G (-) 好氧性細菌感染時之藥物動力學與藥效學（PK/PD）間的關 係？","opts":["A. T＞MIC","B. ","C. /MIC","D. "],"ans":2,"exp":"Tobramycin（妥布黴素）為胺基醣苷類抗生素，屬於「濃度依賴型」（concentration-dependent）抗菌藥物。其抗菌效能最相關的PK/PD參數為Cmax/MIC（最大血中濃度與最低抑菌濃度之比值）。當Cmax/MIC≥8-10時，對革蘭氏陰性好氧菌（如Pseudomonas、Klebsiella）的殺菌效果最佳，也可減少適應性耐藥性（adaptive resistance）的產生。一日一次給藥（once-daily dosing）的策略即基於此PK/PD關係。","we":["錯誤：T>MIC（Time above MIC，血中濃度超過MIC的時間百分比）是「時間依賴型」（time-dependent）抗生素的PK/PD指標，代表藥物必須持續超過MIC才有效；代表藥物包括β-lactams（penicillin、cephalosporin）和macrolides；胺基醣苷類為濃度依賴型，不適用T>MIC。","錯誤：此選項可能代表AUC/MIC（總藥物暴露量/MIC），適用於fluoroquinolones和部分aminoglycosides的暴露量評估；但tobramycin傳統教學和國考標準中，最常描述其PK/PD關係的參數為Cmax/MIC（峰值濃度依賴型殺菌），非AUC/MIC。","","錯誤：此選項可能代表EC50（半數效應濃度）或其他非標準PK/PD參數；對tobramycin此類胺基醣苷類抗生素而言，Cmax/MIC為描述其濃度依賴型殺菌特性的最適參數，不使用EC50等評估整體動物效應的指標。"],"needs_review":false,"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAAYAEcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6GvPEc8Hjqw8OpYxut1ZyXn2kzkbVjZFYbNpycuMc+tM8SeI7zS/EmiaPZ6dBdSar52ySW6MQQxruOcRt1HSsXUYdbPxG0PXR4evJbWLSJrecQ3FuTFNI8TbPmkXdjYwJHHSo9Yj17UPGHhLWP+EcvFt7B7zzoxPbl41ePYmf3uCSRn5ScAjvQtlfz/N/pYOr7afkv1Oi8OeKE1XV9S0e8tJ 菌二氫葉酸合成酶（dihydropteroate synthase），干擾葉酸合成；雖對多種細菌有廣效，但對專性厭氧菌（如Bacteroides fragilis）效果差；厭氧環境中存在大量外源性葉酸前驅物，可降低磺胺類的作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_003","year":2022,"roc_year":111,"session":"","examNo":3,"q":"下列何者可被同時使用於獸醫學與人類醫學的治療用途？","opts":["A. tiamulin","B. tilmicosin","C. tobramycin","D. tylosin"],"ans":2,"exp":"Tobramycin（妥布黴素）是同時在獸醫學和人類醫學中使用的胺基醣苷類抗生素。在人醫主要用於眼科（眼滴劑）、囊腫性纖維化（吸入製劑）和嚴重G(-)感染；在獸醫用於犬貓眼科感染、魚類疾病等。其他三個選項均為純獸醫用藥。","we":["錯誤：Tiamulin（截短側耳素類，pleuromutilin）為獸醫專用抗生素，主要用於豬和家禽的Mycoplasma感染（豬肺炎、豬痢疾）和Brachyspira；不用於人類醫療，且在人醫中pleuromutilin類尚未批准上市（retapamulin為外用）。","錯誤：Tilmicosin（泰利黴素）為大環內酯類，獸醫專用藥物，用於牛、豬、家禽呼吸道感染；對人具有心臟毒性（心搏過速、心肌收縮力降低），禁止在人醫使用，且人員誤注射可能致命（IC₅₀極低）。","","錯誤：Tylosin（泰樂菌素）為大環內酯類，主要用於豬、牛、禽類的Mycoplasma和部分G(+)菌感染；為純獸醫（和畜牧業）用藥，人類醫學不使用tylosin，其人體安全性數據不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_004","year":2022,"roc_year":111,"session":"","examNo":4,"q":"下列何者為兩性（amphoteric）的抗微生物製劑？","opts":["A. benzlypenicillin G","B. doxycycline","C. kanamycin","D. sulfadimethoxine"],"ans":1,"exp":"Doxycycline（去氧羥四環素）為兩性（amphoteric）抗微生物製劑，分子中同時含有弱酸性基團（β-diketone，pKa≈3.5和7.7）和弱鹼性基團（dimethylamino group，pKa≈9.7），在生理pH下呈兩性離子（zwitterion）形式存在。這種兩性特性使doxycycline能在廣泛pH範圍內保持部分溶解性，並影響其與金屬離子的螯合。","we":["錯誤：Benzylpenicillin G（青黴素G）分子中含β-lactam環和側鏈，主要含羧基（-COOH，酸性），pKa≈2.8，在生理pH下完全以陰離子形式存在；不含鹼性基團，為弱酸性藥物，非兩性藥物。","","錯誤：Kanamycin為胺基醣苷類，含多個游離胺基（-NH₂）在生理pH下帶正電荷，為鹼性藥物（cationic）；不含酸性基團，在生理pH下呈陽性電荷，非兩性藥物。","錯誤：Sulfadimethoxine（磺胺二甲嘧啶）含磺醯胺基（弱酸性，pKa≈6.1）；雖有芳香胺基（弱鹼性），但電離特性以弱酸性為主，不是教科書標準的「兩性」（amphoteric）抗微生物製劑，與doxycycline的明確兩性離子特性不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_005","year":2022,"roc_year":111,"session":"","examNo":5,"q":"下列何者是由細菌所產生的抗生素（antibiotic）？","opts":["A. amantadine","B. clindamycin","C. doxorubicin","D. polymyxin E"],"ans":3,"exp":"Polymyxin E（colistin，多黏菌素E）是由土壤細菌Bacillus polymyxa var. colistinus（現稱Paenibacillus polymyxa）產生的多肽類抗生素。多黏菌素類（polymyxins）為天然來源的細菌代謝產物，以細菌發酵製造，是真正意義上的「抗生素」（antibiotic = produced by microorganisms）。","we":["錯誤：Amantadine（金剛烷胺）為完全合成的抗病毒/止痛藥物（adamantane衍生物），非微生物產物；它是通過化學合成製造，不符合「由細菌產生的抗生素」定義。","錯誤：Clindamycin（克林黴素）是林可黴素（lincomycin，由Streptomyces lincolnensis產生）的半合成衍生物（7-deoxy-7-chloro修飾）；雖源自真菌/放線菌，但clindamycin本身是半合成物，且來源是放線菌（Streptomyces）而非一般細菌（bacteria）。","錯誤：Doxorubicin（阿黴素）為蒽環類（anthracycline）抗腫瘤抗生素，由放線菌Streptomyces peucetius var. caesius產生；雖然也由微生物產生，但其主要用途為抗癌藥物，非「治療細菌感染的抗生素」；且來源為放線菌，非一般「細菌（bacteria）」。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_006","year":2022,"roc_year":111,"session":"","examNo":6,"q":"已知犬隻的感染源為 methicillin-resistant Staphylococcus aureus時，下列何者具有最佳的療效？","opts":["A. amoxicillin","B. gentamicin","C. vancomycin","D. zidovudine"],"ans":2,"exp":"Methicillin-resistant Staphylococcus aureus（MRSA）的抗藥機制是mecA基因編碼的PBP2a（penicillin-binding protein 2a），對所有β-lactam類藥物均有抗藥性。Vancomycin（萬古黴素）為糖肽類抗生素，作用機制完全不同（結合D-Ala-D-Ala末端阻止細胞壁合成），PBP2a的變化不影響vancomycin的效力，為MRSA感染的首選治療藥物。","we":["錯誤：Amoxicillin為β-lactam類，MRSA的PBP2a對所有β-lactam均有抗藥性（包括amoxicillin、ampicillin、methicillin等）；即使加入clavulanic acid也無法克服PBP2a的抗藥性（PBP2a抗性非由β-lactamase引起），無法治療MRSA。","錯誤：MRSA菌株常同時對aminoglycosides產生抗藥性（通過aminoglycoside-modifying enzymes，如AAC、APH、ANT酶）；gentamicin單獨使用對MRSA可能無效，且aminoglycosides不是MRSA感染的標準首選治療藥物。","","錯誤：Zidovudine（AZT）為核苷類逆轉錄酶抑制劑（NRTI），是HIV抗病毒藥物；對細菌（包括MRSA）完全無效，作用靶點（逆轉錄酶）在細菌中不存在。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_007","year":2022,"roc_year":111,"session":"","examNo":7,"q":"Rosaramicin是一種：","opts":["A. aminoglycoside","B. lincosamide","C. macrolide","D. streptogramin"],"ans":2,"exp":"Rosaramicin（玫瑰黴素）為大環內酯類（macrolide）抗生素，由Micromonospora rosaria產生，含有14元大環內酯環（14-membered lactone ring）。其作用機制與其他大環內酯類相同，結合細菌核糖體50S亞基（23S rRNA）阻斷蛋白質合成；主要對G(+)菌和非典型病原菌（Mycoplasma、Chlamydia）有效。","we":["錯誤：Aminoglycosides（胺基醣苷類）含胺基糖（aminosugars）連接於氨基環醇核心（aminocyclitol）；作用於30S核糖體亞基，引起mRNA誤讀；代表藥物如gentamicin、tobramycin等；Rosaramicin的化學結構（大環內酯環）和作用靶點（50S）完全不同。","錯誤：Lincosamides（林可醯胺類，如lincomycin、clindamycin）含糖醇連接的丙基脯胺酸結構；雖也作用於50S核糖體亞基（但位置略異），化學結構與大環內酯類截然不同（無大環內酯環）；Rosaramicin具有典型大環內酯環，屬macrolide類。","","錯誤：Streptogramins（鏈陽菌素類，如pristinamycin、quinupristin/dalfopristin）為兩組分抗生素（A組和B組），化學結構複雜（大環肽/縮酚酸肽複合物）；Rosaramicin為單一組分大環內酯，化學結構和臨床分類不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_008","year":2022,"roc_year":111,"session":"","examNo":8,"q":"下列有關藥品併用與療效的敘述，何者錯誤？","opts":["A. Penicillin-novobiocin 具協同抗 Staphylococcus aureus所引起的牛乳房炎","B. Erythromycin-rifampin 具協同抗 Rhodococcus equi所引起的小馬肺炎","C. Lincomycin-spectinomycin具協同抗 Pseudomonas aeruginosa 所引起的貓泌尿道感染","D. Minocycline-streptomycin具協同抗 Brucella canis所引起的犬生殖道感染"],"ans":2,"exp":"Lincomycin-spectinomycin（LS合劑）組合的抗菌譜針對Mycoplasma（豬、禽）和部分G(+)菌，對Pseudomonas aeruginosa幾乎無效；lincomycin對G(-)菌活性很差，spectinomycin雖有廣效但對Pseudomonas也活性有限。Pseudomonas aeruginosa感染的首選藥物為fluoroquinolones（enrofloxacin）、carbapenems或antipseudomonal penicillins。","we":["此為正確描述：Penicillin（細胞壁合成抑制劑）與novobiocin（DNA旋轉酶抑制劑）的組合對Staphylococcus aureus引起的牛乳房炎確有協同作用；novobiocin增加細胞壁穿透性，使penicillin進入細菌更有效；不符合「錯誤」描述。","此為正確描述：Erythromycin+rifampin為治療馬駒Rhodococcus equi肺炎的標準組合方案；Rhodococcus equi為胞內寄生菌，rifampin穿透細胞和macrophage進入胞內，erythromycin提供廣效覆蓋，兩者協同有效；不符合「錯誤」描述。","","此為正確描述：Doxycycline/minocycline（tetracycline類）與aminoglycosides（streptomycin/gentamicin）的組合為治療布氏桿菌病（Brucella canis犬生殖道感染）的標準方案，兩者在細胞外和胞內協同殺菌；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_009","year":2022,"roc_year":111,"session":"","examNo":9,"q":"用來治療犬貓皮膚與軟組織感染，且僅需要7～14天投藥一次的藥品為何？","opts":["A. cefovecin","B. doxycycline","C. enrofloxacin","D. tulathromycine"],"ans":0,"exp":"Cefovecin（Convenia）為第三代頭孢菌素，具有獨特的長效藥物動力學特性：在犬中血漿半衰期約5.5天，在貓中約6.9天，單次皮下注射可維持有效血中濃度7-14天（犬）至14天（貓）。適合治療皮膚和軟組織感染，尤其適用於難以每日口服給藥的患畜。","we":["","錯誤：Doxycycline（去氧羥四環素）通常需要每12-24小時口服一次（犬每12h、貓每24h），或靜脈注射；半衰期約12-24小時，不具備7-14天單次給藥的特性；雖對皮膚感染有效（Staphylococcus等），但非長效注射劑型。","錯誤：Enrofloxacin（恩諾沙星）雖有注射劑型，但半衰期約3-6小時（犬），每日一次給藥方案不能延長至7-14天；且fluoroquinolones對皮膚MRSA等耐藥菌效果有限，不是長效7-14天單次注射的製劑。","錯誤：Tulathromycin（tulmycin）為大環內酯類，用於牛和豬的呼吸道感染，單次給藥可持效約10-14天（因大量分布至組織）；但主要適應症為呼吸道（BRD），不是犬貓皮膚和軟組織感染；且為食品動物專用藥，不用於犬貓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_010","year":2022,"roc_year":111,"session":"","examNo":10,"q":"下列那一種抗真菌藥物對中樞的穿透能力最佳？","opts":["A. amphotericin B","B. fluconazole","C. itraconazole","D. nystatin"],"ans":1,"exp":"Fluconazole（氟康唑）在所有azole類和多烯類抗真菌藥中具有最佳的腦脊髓液（CSF）穿透能力。蛋白結合率低（約12%）、分子量小（306 Da）、水溶性較高，腦脊液/血漿濃度比可達0.7-0.8（即高度穿越血腦障壁）。是治療真菌性腦膜炎（特別是隱球菌腦膜炎，Cryptococcus neoformans）的首選藥物。","we":["錯誤：Amphotericin B（兩性黴素B）血漿蛋白結合率高（>90%）、分子量大（924 Da）、水溶性低，腦脊液穿透率極差（CSF/plasma ratio < 0.05）；雖為真菌感染的廣效療法，但CNS穿透性是主要限制，需要鞘內注射才能達到CNS治療濃度。","","錯誤：Itraconazole蛋白結合率高（>99%）、親脂性強、分子量大（705 Da），幾乎不能穿越血腦障壁（CSF/plasma ratio ≈ 0）；主要分布於組織（肺、皮膚、指甲）而非CNS，不適合治療真菌性腦膜炎。","錯誤：Nystatin（制黴菌素）口服後幾乎不被吸收，只在腸道局部發揮抗真菌作用；靜脈注射毒性極大（腎毒性）；血中濃度極低，無任何CNS穿透能力；不用於全身性或CNS真菌感染的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_011","year":2022,"roc_year":111,"session":"","examNo":11,"q":"下列抗真菌藥物的作用機制，何者正確？","opts":["A. Amphotericin B 與 itraconazole 皆是抑制 ergosterol 的合成","B. Terbinafine 與 ketoconazole皆是抑制 squalene monooxygenase","C. Griseofulvin 與 nystatin 皆是與 microtubules 結合","D. Flucytosine 與 5-fluorouracil皆是抑制 tymidylate synthase"],"ans":3,"exp":"Flucytosine（5-FC）進入真菌後，先由胞嘧啶脫胺酶（cytosine deaminase）轉化為5-fluorouracil（5-FU），再由尿嘧啶磷酸核糖基轉移酶（UPRT）轉化為5-fluorodeoxyuridine monophosphate（5-FdUMP），抑制thymidylate synthase（TS），阻斷dTMP合成，抑制DNA合成。5-FU本身也以同樣機制抑制TS，故D選項兩者均抑制thymidylate synthase為正確配對。","we":["錯誤：Amphotericin B的機制是直接與真菌細胞膜的ergosterol結合（forming pores），而非抑制ergosterol合成；只有azoles（itraconazole等）才抑制ergosterol的生合成（CYP51酶）；兩者機制不同，A選項配對錯誤。","錯誤：Terbinafine確實抑制squalene epoxidase（squalene monooxygenase）；但ketoconazole是azole類，抑制CYP51（lanosterol 14α-demethylase），與squalene epoxidase無關；兩者作用於麥角固醇合成的不同步驟，B選項配對錯誤。","錯誤：Griseofulvin確與微管蛋白（tubulin）結合阻止紡錘體形成；但nystatin是多烯類，直接結合細胞膜的ergosterol形成孔洞，與微管無任何關係；C選項配對明顯錯誤。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_012","year":2022,"roc_year":111,"session":"","examNo":12,"q":"下列用於治療 Mycoplasma hyopneumoniae 感染的比較，何者錯誤？","opts":["A. Tylosin 比 erythromycin 為佳","B. Tiamulin 比 tylosin 為佳","C. Erythromycin 比 tiamulin 為佳","D. Tilmicosin 比 erythromycin 為佳"],"ans":2,"exp":"針對Mycoplasma hyopneumoniae（豬肺炎黴漿菌），抗菌效力排序為：Tiamulin >> Tilmicosin > Tylosin >> Erythromycin。Tiamulin（截短側耳素類）對Mycoplasma的MIC極低（高效），遠優於erythromycin；故「Erythromycin比tiamulin為佳」為錯誤陳述。","we":["此為正確描述：Tylosin（泰樂菌素）對豬肺炎黴漿菌的MIC低於erythromycin，臨床效果更佳，是豬的標準治療選項之一；不符合「錯誤」描述。","此為正確描述：Tiamulin的抗Mycoplasma活性優於tylosin，其MIC更低、組織分布更廣（特別是肺組織），是治療豬Mycoplasma感染的最有效選擇之一；不符合「錯誤」描述。","","此為正確描述：Tilmicosin（提爾米考星）對Mycoplasma hyopneumoniae的活性優於erythromycin，且在肺組織中濃度高（T/P ratio >100），作用時間長；豬呼吸道感染治療中常選tilmicosin而非erythromycin；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_013","year":2022,"roc_year":111,"session":"","examNo":13,"q":"下列何者不會影響半衰期？","opts":["A. 分布體積（volume of distribution）","B. 腸肝再循環（enterohepatic recirculation）","C. 給藥途徑","D. 清除率（clearance）"],"ans":2,"exp":"半衰期（t½）的計算公式為 t½ = 0.693 × Vd（分布體積）/ CL（清除率）。影響半衰期的因素只有Vd和CL，給藥途徑（口服、靜脈、肌肉注射等）不影響這兩個參數，因此不影響半衰期（t½）；給藥途徑會影響生體可用率（bioavailability）和Tmax，但不改變t½。","we":["錯誤：分布體積（Vd）直接出現在半衰期公式中（t½ = 0.693×Vd/CL）；Vd增大時（藥物廣泛分布於組織），從組織返回血液供清除的速度降低，t½延長；Vd是決定t½的兩個關鍵因素之一。","錯誤：腸肝再循環（enterohepatic recirculation）使已代謝的藥物通過膽汁排至腸道後再被吸收，重新進入循環，有效延長藥物在體內的持留時間，增加表觀半衰期（如etodolac在犬的t½因腸肝循環達10-14小時）；會影響半衰期。","","錯誤：清除率（CL）也直接出現在半衰期公式中（t½ = 0.693×Vd/CL）；CL降低時（如腎衰竭、肝功能不全），藥物清除速率降低，t½明顯延長；CL是決定t½的另一關鍵因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_014","year":2022,"roc_year":111,"session":"","examNo":14,"q":"下列那種藥物最可能與α1-酸性醣蛋白（α1-acid glycoprotein）結合？","opts":["A. cephalosporins","B. furosemide","C. atropine","D. aspirin"],"ans":2,"exp":"α1-酸性醣蛋白（AAG/α1-AGP）主要結合鹼性和親脂性藥物；atropine（阿托品）為叔胺類（tertiary amine），在生理pH下可帶正電荷，屬於鹼性藥物，且具有中等親脂性，是α1-AGP的典型結合藥物。AGP在炎症、感染、腫瘤時濃度升高，影響鹼性藥物（如局部麻醉劑、抗心律不整藥、部分鎮靜藥）的游離比例。","we":["錯誤：Cephalosporins為β-lactam類，含羧基（-COOH），在生理pH下帶負電荷（陰性），為酸性藥物；酸性藥物主要與白蛋白（albumin）結合（albumin有陽性結合位點），而非α1-AGP。","錯誤：Furosemide（呋塞米）含磺醯胺基和羧基，pKa≈3.9，在生理pH下高度解離（陰性），為強酸性藥物（蛋白結合率>95%與白蛋白結合）；不是α1-AGP的主要底物。","","錯誤：Aspirin（乙醯水楊酸）含羧基，pKa≈3.5，在生理pH下呈陰性，為酸性藥物，主要與白蛋白（albumin）的特異性結合位點（Sudlow sites）結合；酸性藥物不優先與α1-AGP結合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_015","year":2022,"roc_year":111,"session":"","examNo":15,"q":"依賴腎臟排泄之藥物在患有腎衰竭動物體內之藥物動力學變化，下列何者正確？","opts":["A. 清除率上升","B. 藥物在腎小管之再吸收增加","C. 為維持治療的有效血漿濃度，在同樣劑量下應延長給藥間隔","D. 為維持治療的有效血漿濃度，在同樣給藥間隔下應增加藥物劑量"],"ans":2,"exp":"腎臟排泄依賴性藥物在腎衰竭時，腎臟清除率（renal clearance）降低，導致藥物半衰期延長。為維持治療有效血漿濃度同時避免蓄積中毒，最常用的策略是「延長給藥間隔（extend dosing interval）」，保持每次劑量不變（以維持Cmax/Cmin比）；這樣峰值濃度相同，但兩次給藥間的濃度降至谷值所需時間延長，避免蓄積。","we":["錯誤：腎衰竭時腎小球濾過率（GFR）降低，腎臟清除率（renal clearance）下降而非上升；藥物消除速度減慢，半衰期延長，血漿濃度升高的風險增加，需要調整劑量方案。","錯誤：腎衰竭時腎小管功能受損，分泌和再吸收均可能下降；但藥物在腎小管的「再吸收增加」並非腎衰竭的主要藥動學變化；腎衰竭的主要影響是濾過率降低和腎臟清除率下降。","","錯誤：腎衰竭時藥物清除率降低、半衰期延長，若維持相同給藥間隔並增加劑量，血漿濃度會持續蓄積導致中毒；正確做法是降低劑量或延長給藥間隔（或兩者並用），而非增加劑量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_016","year":2022,"roc_year":111,"session":"","examNo":16,"q":"A藥物主要由肝臟代謝，B藥物可明顯誘導微粒體酶（microsomal enzyme），則兩藥併用時最可能對A藥產生\r 之藥物動力學變化為何？","opts":["A. 肝臟清除率降低","B. 首渡效應降低","C. 分布體積增加","D. 半衰期縮短"],"ans":3,"exp":"藥物B為微粒體酶誘導劑（如rifampin、phenobarbital），可上調CYP450酶的表達（通過PXR或CAR核受體），增加肝臟對藥物A的代謝速率；代謝加速→清除率增加→半衰期（t½ = 0.693×Vd/CL）縮短。藥物B的誘導作用通常需數天才能達到最大效果。","we":["錯誤：酶誘導劑增加CYP450活性，會增加（而非降低）藥物A的肝臟代謝清除率（hepatic clearance）；清除率升高是酶誘導導致的直接結果，因此半衰期縮短，血漿濃度降低（可能導致治療失效）。","錯誤：微粒體酶誘導劑增加肝臟代謝能力，會增加（而非降低）口服藥物的首渡效應（first-pass effect），使口服生體可用率（bioavailability）進一步降低；與選項敘述相反。","錯誤：酶誘導不直接改變藥物的組織分布特性（Vd取決於親脂性、蛋白結合等理化性質），而是通過改變CL（清除率）影響t½；分布體積不因酶誘導而顯著改變。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_017","year":2022,"roc_year":111,"session":"","examNo":17,"q":"下列何者非fluconazole取代 ketoconazole用於治療大多數全身性真菌症之原因？","opts":["A. 半衰期較長","B. 活性更強","C. 血中蛋白結合力較強","D. 副作用較少"],"ans":2,"exp":"Fluconazole（氟康唑）取代ketoconazole用於全身性真菌症的主要優點包括：(1)半衰期更長（犬約20-30h vs ketoconazole約2h），(2)活性更強（MIC更低），(3)副作用更少（無腎上腺毒性、無肝毒性、無CYP抑制副作用）。但fluconazole的血漿蛋白結合率僅約12%，反而低於ketoconazole（>99%），低蛋白結合雖有利於組織分布和CNS穿透，但「血中蛋白結合力較強」並非fluconazole的優點，而是ketoconazole的特性。","we":["此為正確描述（fluconazole取代ketoconazole的原因）：Fluconazole半衰期長（可每日一次給藥），而ketoconazole半衰期短需頻繁給藥；不符合「非原因」的條件。","此為正確描述（取代原因之一）：Fluconazole對多種真菌（特別是Candida和Cryptococcus）的MIC低於ketoconazole，活性更強；不符合「非原因」的條件。","","此為正確描述（主要取代原因）：Ketoconazole有顯著CYP450抑制（藥物交互作用多）、腎上腺皮質抑制和肝毒性等副作用；fluconazole副作用顯著較少；不符合「非原因」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_018","year":2022,"roc_year":111,"session":"","examNo":18,"q":"下列何者屬於imidazole類抗真菌藥物？","opts":["A. itraconazole","B. voriconazole","C. enilconazole","D. fluconazole"],"ans":2,"exp":"Azole類抗真菌藥分為imidazoles（2個氮原子環）和triazoles（3個氮原子環）。Enilconazole（克霉嗯）為imidazole類，含2個氮的五元環（1,3-diazole），主要用於外用（皮膚黴菌感染、鼻腔噴霧治療Aspergillus感染）。Itraconazole、voriconazole和fluconazole均為triazole類（含3個氮的五元環）。","we":["錯誤：Itraconazole含有三唑環（triazole，3個氮原子），屬triazole類而非imidazole類；三唑類對CYP51的選擇性更高，對哺乳動物CYP的影響較imidazoles小，是現代口服系統性抗真菌治療的主流。","錯誤：Voriconazole為第二代triazole類抗真菌藥（含三唑環），廣譜包括Aspergillus和耐氟康唑的Candida；不屬imidazole類；在馬匹中用於治療真菌性角膜炎等。","","錯誤：Fluconazole含bis-triazole（兩個triazole環），屬triazole類；其特點為水溶性高、蛋白結合率低、CNS穿透好；不屬imidazole類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_019","year":2022,"roc_year":111,"session":"","examNo":19,"q":"下列何種藥物因為會引起致死性的肺臟毒性，故不應以任何給藥方式投予貓？","opts":["A. carboplatin","B. carmustine","C. cisplatin","D. cyclophosphamide"],"ans":2,"exp":"Cisplatin（順鉑）在貓體內代謝特殊，以任何給藥途徑投予均會引起嚴重的肺水腫（pulmonary edema）和胸腔積液，導致呼吸衰竭死亡；致死率接近100%。其機制可能與貓對cisplatin代謝物（platinum-chloride complexes）的特殊敏感性有關。Cisplatin在犬中雖有腎毒性，但可安全使用（需生理食鹽水水化）；在貓則完全禁用。","we":["錯誤：Carboplatin（卡鉑）在貓相對較安全（雖主要副作用為骨髓抑制），不引起像cisplatin那樣的致命性肺毒性；貓可使用carboplatin治療某些腫瘤（如口腔鱗狀細胞癌），需監測血液學指標。","錯誤：Carmustine（BCNU，亞硝脲類）在貓中可能引起肺毒性（如人醫中的肺纖維化），但其在貓的使用限制不如cisplatin嚴格（不以「以任何給藥方式均致死」著稱）；cisplatin的貓肺毒性更為特殊且確定。","","錯誤：Cyclophosphamide在貓中可以安全使用（雖需監測出血性膀胱炎風險，可用mesna預防）；其在貓的主要副作用為骨髓抑制和出血性膀胱炎，不引起急性致命性肺毒性，不在貓中絕對禁用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_020","year":2022,"roc_year":111,"session":"","examNo":20,"q":"欲測定某一藥物經口投予的絕對生體可用率（absolute bioavailability），除了需要得到該藥物經口投予後的血\r 中藥物濃度曲線，還必須測定下列何種給藥方式的血中藥物濃度曲線？","opts":["A. 皮下注射","B. 肌肉注射","C. 腹腔注射","D. 靜脈注射"],"ans":3,"exp":"絕對生體可用率（absolute bioavailability）= AUC_extravascular / AUC_IV（需校正劑量差異）。必須同時測定非血管給藥（如口服）和靜脈注射的血中濃度-時間曲線下面積（AUC），因為只有靜脈注射的生體可用率才定義為100%（作為參考基準）。其他非靜脈途徑（皮下、肌肉、腹腔）的生體可用率小於100%且可變，不能作為絕對生體可用率的參考。","we":["錯誤：皮下注射的生體可用率通常高但非100%（可能因首渡效應、組織代謝而略低）；以皮下注射作參考只能計算「相對生體可用率（relative bioavailability）」，無法確定「絕對生體可用率」；必須靜脈注射才為唯一100%基準。","錯誤：肌肉注射的生體可用率通常高但變異較大（受局部血流、pH、製劑因素影響）；不能用肌肉注射作參考計算絕對生體可用率；只有靜脈注射確保藥物100%進入系統循環，才是唯一正確的參考標準。","錯誤：腹腔注射的藥物部分通過腸系膜靜脈吸收，可能出現部分首渡效應（portal drainage），生體可用率不確定；不符合絕對生體可用率計算的100%基準要求；靜脈注射才是唯一正確的給藥參考途徑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_021","year":2022,"roc_year":111,"session":"","examNo":21,"q":"犬隻口服propranolol後，造成其生體可用率（bioavailability）偏低的原因為何？","opts":["A. 藥品脂溶性低","B. 藥品首渡效應（first pass effects）快速","C. 藥品分布體積（volume of distribution）過大","D. 藥品排泄速率過快"],"ans":1,"exp":"Propranolol（普萘洛爾）為高度親脂性藥物，口服後在腸壁和肝臟被大量代謝（首渡效應顯著，first-pass metabolism via CYP1A2/CYP2D6），在犬中口服生體可用率僅約2-17%（遠低於靜脈注射）。雖然吸收良好（GI吸收快），但大部分在進入系統循環前即被代謝，故口服生體可用率偏低。","we":["錯誤：Propranolol脂溶性非常高（log P≈3.5），口服吸收良好，且高脂溶性使其廣泛分布至組織（Vd大）；脂溶性低不是propranolol口服生體可用率偏低的原因，反而高脂溶性導致強大的首渡代謝。","","錯誤：分布體積（Vd）大確實是propranolol的特性（約3-4 L/kg），但Vd是藥物進入系統循環後的分布特性，不影響口服生體可用率（bioavailability代表吸收進入循環的分率）；Vd大意味著組織結合多，影響半衰期而非生體可用率。","錯誤：排泄（renal/biliary excretion）的速率影響半衰期和AUC，但口服生體可用率主要取決於吸收和首渡效應；propranolol的生體可用率偏低是因為大量被肝臟代謝（首渡），而非因為腎臟排泄過快。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_藥理_022","year":2022,"roc_year":111,"session":"","examNo":22,"q":"下列關於polymyxin B的敘述，何者錯誤？","opts":["A. 抗菌機制與抑制細菌細胞壁形成有關","B. 對於革蘭氏陰性菌有殺菌作用","C. 可治療馬內毒素中毒症","D. 會引起腎毒性"],"ans":0,"exp":"Polymyxin B（多黏菌素B）的作用機制是與革蘭氏陰性菌外膜的脂多糖（LPS）結合，破壞細胞膜磷脂雙層的完整性（通透性改變，類似清潔劑作用），導致細胞內物質外漏；是細胞膜破壞藥物，而非細胞壁合成抑制劑（β-lactams才是）。","we":["","此為正確描述：Polymyxin B對革蘭氏陰性菌（特別是P. aeruginosa、E. coli、Klebsiella、Acinetobacter等）具有濃度依賴型殺菌作用，通過破壞外膜完整性快速殺菌；不符合「錯誤」描述。","此為正確描述：Polymyxin B能與LPS（內毒素，endotoxin）的lipid A部分結合中和，在臨床上用於馬的內毒素血症（endotoxemia）治療（如大腸炎、腸扭轉引起的內毒素釋放）；低劑量靜脈注射以結合游離LPS；不符合「錯誤」描述。","此為正確描述：Polymyxin B（和colistin）的主要副作用為腎毒性（nephrotoxicity）和神經毒性
