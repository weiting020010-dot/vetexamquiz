料補充鐵，且母牛乳汁鐵雖不高但犢牛一般不常規注射鐵劑；仔豬（suckling piglets）全靠豬乳（鐵含量極低）且被關在無法接觸土壤的欄舍內，必須補充鐵劑，過量易中毒。","錯誤：小羊羔雖偶有鐵中毒報告，但不如仔豬常見；豬的集約化飼養中，仔豬出生後2-3天常規給予鐵劑（iron dextran 200mg IM）以預防缺鐵性貧血，過量或誤算劑量時容易引起急性鐵中毒。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_032","year":2023,"roc_year":112,"session":"","examNo":32,"q":"「動物用藥殘留標準」是由政府何機構所訂定？","opts":["A. 行政院農業委員會動植物防疫檢疫局","B. 行政院農業委員會","C. 衛生福利部","D. 行政院環境保護署"],"ans":2,"exp":"依據台灣「動物用藥殘留標準」之法規架構：動物用藥殘留標準（Maximum Residue Limits, MRLs in food-producing animals）屬食品安全衛生範疇，依《食品安全衛生管理法》由衛生福利部（Ministry of Health and Welfare）及其下轄食品藥物管理署（TFDA）負責制定，而非農委會或環保署。","we":["錯誤：防疫檢疫局（APHIA）主要負責動植物疫病防治和進出口檢疫，而非設定食品中藥物殘留標準；其職責為疫情監控和防疫措施，不包括食品安全殘留標準制定。","錯誤：農業委員會（COA）主要負責農業政策、動物衛生和動物用藥查驗登記；動物用藥在動物體內的殘留安全標準（MRLs in food products）涉及食品安全，屬衛生福利部主管，非農委會。","","錯誤：環保署（EPA）負責環境污染、廢棄物管理和環境藥物殘留；食品中動物用藥殘留標準屬食品安全範疇，由衛生福利部（食品藥物管理署）依食品安全衛生管理法訂定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_033","year":2023,"roc_year":112,"session":"","examNo":33,"q":"下列因動物種別差異而影響藥品作用的敘述，何者錯誤？","opts":["A. Sulfasalazine較容易於杜賓犬（Dobermans）造成毒性","B. Xylazine對反芻獸作用較佳，是在藥物動力學的層次","C. Morphine於貓的藥效較犬隻為強","D. Ivermectin易造成鱷魚與烏龜的毒性"],"ans":1,"exp":"Xylazine對反芻動物（牛、羊）的鎮靜效果顯著強於馬和豬，差異約在10倍以上（牛的有效劑量約0.05-0.1 mg/kg，馬需1-2 mg/kg）。此種差異屬於藥效學（pharmacodynamic）層次——反芻動物腦內α2-腎上腺素受體數目較多或親和力較高，而非藥物動力學（pharmacokinetic）差異（xylazine的吸收、分布、代謝速率在各物種差異不大）。故選項B「是在藥物動力學的層次」為錯誤敘述。","we":["此為正確描述：杜賓犬（Doberman Pinscher）中特定個體對sulfasalazine（或其代謝物5-ASA）敏感性增加，更易發生角膜乾燥症（KCS, keratoconjunctivitis sicca）等毒性反應；不符合「錯誤」描述。","","此為正確描述：貓對嗎啡較敏感，低劑量即可引起興奮（paradoxical excitement）而非鎮靜；貓肝臟UGT酶活性較低（葡萄糖醛酸化能力差），morphine在貓體內清除較慢，效果較強；不符合「錯誤」描述。","此為正確描述：Ivermectin對部分爬行動物（chelonians如陸龜/海龜）和部分魚類具有毒性，其毒性機制與invertebrate的GluCl通道類似（爬行動物的GABA通道可能也受影響）；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_034","year":2023,"roc_year":112,"session":"","examNo":34,"q":"下列何種賦形劑（excipients）通常不會使用在液態劑型之藥物？","opts":["A. 螯合劑（chelating agent）","B. 抗氧化劑（antioxidant）","C. 助流劑（glidant）","D. 增溶劑（solubilizing agent）"],"ans":2,"exp":"助流劑（glidant）如二氧化矽（colloidal silicon dioxide/Aerosil）、talc（滑石粉）的功能是改善固體粉末的流動性，防止結塊，促進片劑和膠囊填充時的均勻分配。助流劑僅用於固態劑型（錠劑、膠囊）的製造，液態製劑（溶液、懸液劑、注射劑）中無需改善粉末流動性，因此助流劑不使用於液態劑型。","we":["錯誤：螯合劑（如EDTA二鈉）在液態製劑中常用作穩定劑，可螯合金屬離子防止氧化和微生物生長；液態眼藥水、注射劑、口服液均可添加螯合劑，不符合「不使用在液態劑型」的描述。","錯誤：抗氧化劑（如sodium metabisulfite、ascorbic acid、BHA、BHT）廣泛用於液態和固態製劑；注射液和口服溶液中常加入抗氧化劑以防止藥物氧化降解，液態劑型中使用極為普遍。","","錯誤：增溶劑（如polysorbate 80、PEG、cyclodextrin）在液態製劑中極為常見，用於提高難溶性藥物的溶解度；注射液、口服溶液和懸液劑均廣泛使用增溶劑，為液態製劑的重要輔料。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_035","year":2023,"roc_year":112,"session":"","examNo":35,"q":"中華藥典規定藥品儲存溫度所稱之「涼處」是指約攝氏幾度？","opts":["A. 2～7","B. 8～15","C. 16～24","D. 25～36"],"ans":1,"exp":"中華藥典（台灣）對藥品儲存溫度的定義：「涼處（cool place）」指8～15°C；「冷處（cold place）」指2～8°C（冰箱）；「室溫（room temperature）」指不超過25°C；「冷凍（freezing）」指-20°C以下。涼處介於冰箱與一般室溫之間，適用於溫敏但不需冷藏的藥品，如某些乳劑和生物製劑。","we":["錯誤：2-7°C為「冷處（cool place）」或冷藏的溫度範圍；中華藥典中「涼處」與「冷處」有區別，冷處接近冰箱溫度（通常4°C左右），而涼處（8-15°C）為室溫偏低環境。","","錯誤：16-24°C接近一般室溫（room temperature）的定義；中華藥典定義「室溫」約為25°C以下，而「涼處（cool place）」特指更低的8-15°C，以避免溫敏藥物在一般室溫下降解。","錯誤：25-36°C為偏高的室溫至體溫範圍，超過大多數藥物的推薦儲存溫度；「涼處」8-15°C要求低於一般室溫，以保護對溫度敏感的藥物製劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_036","year":2023,"roc_year":112,"session":"","examNo":36,"q":"下列何種鴉片類受體之活化與脊髓以上的止痛、輕微鎮靜、不愉快、利尿和縮瞳有關？","opts":["A. Alpha(α)","B. Mu(μ)","C. Kappa(κ)","D. Delta(δ)"],"ans":2,"exp":"κ（kappa）阿片受體活化的主要藥理效應包括：脊髓及脊髓以上的止痛（analgesia）、輕微鎮靜（mild sedation）、不愉快感/煩躁（dysphoria，與μ受體的欣快感相反）、利尿（diuresis，抑制ADH分泌）、縮瞳（miosis）。代表性κ致效劑包括butorphanol、pentazocine。κ受體的dysphoria是其與μ受體（欣快感）的重要臨床區別。","we":["錯誤：阿片受體的分類為μ（mu）、κ（kappa）、δ（delta），並無「α」型阿片受體；「α」在腎上腺素受體系統中指α1/α2，與阿片系統無關；此選項本身為錯誤命名。","錯誤：μ受體活化引起脊髓以上和脊髓的強效止痛、鎮靜、欣快感（euphoria）、呼吸抑制、縮瞳（miosis）、便秘；μ受體引起「欣快」而非「不愉快（dysphoria）」，此為與κ受體的重要區別。","","錯誤：δ受體主要調節情緒（抗抑鬱效果）、脊髓鎮痛，以及部分呼吸抑制；其激活不以「輕微鎮靜、不愉快、利尿、縮瞳」組合為主要特徵；κ受體的dysphoria（不愉快感）是區分μ和κ受體效應的重要特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_037","year":2023,"roc_year":112,"session":"","examNo":37,"q":"局部麻醉劑的脂溶性與麻醉作用有關，下列何者脂溶性最高？","opts":["A. procaine","B. lidocaine","C. bupivacaine","D. mepivacaine"],"ans":2,"exp":"局部麻醉藥的脂溶性（lipid solubility，以partition coefficient衡量）決定其麻醉效力和持續時間：脂溶性越高，穿透神經鞘膜能力越強，效力越大。常用局麻藥脂溶性排序（由低到高）：procaine（log P ≈1.0）< lidocaine（log P ≈2.4）≈ mepivacaine（log P ≈2.0）< bupivacaine（log P ≈3.4-4.0）。Bupivacaine脂溶性最高，麻醉效力最強（約procaine的8倍），作用時間最長（3-10小時）。","we":["錯誤：Procaine（普魯卡因）脂溶性最低（log P约1.0），麻醉效力弱（potency 1）、作用持續時間短；脂溶性高低決定局部麻醉效力，procaine為最弱，與bupivacaine（最強）相反。","錯誤：Lidocaine（利多卡因）脂溶性中等（log P约2.4），麻醉效力適中（potency 2）、作用時間中等；脂溶性高於procaine但遠低於bupivacaine，為臨床最常用的局部麻醉劑，非最高脂溶性。","","錯誤：Mepivacaine（甲哌卡因）脂溶性與lidocaine相近（log P约2.0），麻醉效力和時間介於lidocaine與bupivacaine之間；常用於牙科和神經阻斷麻醉，脂溶性低於bupivacaine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_038","year":2023,"roc_year":112,"session":"","examNo":38,"q":"下列何者與xylazine造成的反應較無關？","opts":["A. 腸胃停滯","B. 利尿作用","C. 體溫過低","D. 心搏過速"],"ans":3,"exp":"Xylazine為α2腎上腺素受體致效劑（α2-agonist），其主要心血管效應為心搏過緩（bradycardia）和心輸出量減少，而非心搏過速（tachycardia）。Xylazine已知的相關反應包括：腸胃停滯（GI stasis）、利尿（inhibit ADH）、體溫過低（hypothermia）、鎮靜、嘔吐（在貓犬）、高血糖（抑制胰島素分泌）、心搏過緩——但不包括心搏過速。故「心搏過速」與xylazine「較無關」。","we":["此為正確描述：Xylazine（α2腎上腺素受體致效劑）透過抑制腸神經系統確可引起腸胃停滯（GI stasis/ileus），在反芻動物（牛）尤其顯著，可引起嚴重的腹脹（bloat）；不符合「較無關」的描述。","此為正確描述：Xylazine具有利尿（diuretic）作用，機制包括抑制抗利尿激素（ADH/vasopressin）分泌，常見於犬、貓和反芻動物給藥後；不符合「較無關」的描述。","此為正確描述：Xylazine引起的鎮靜/麻醉狀態（體溫調節中樞抑制、肌肉活動減少、周邊血管擴張）可導致體溫過低（hypothermia）；在小動物麻醉中需注意保溫；不符合「較無關」的描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_039","year":2023,"roc_year":112,"session":"","examNo":39,"q":"下列何者並非diazepam的臨床用途？","opts":["A. 抗痙攣劑","B. 寧神劑","C. 食慾抑制劑","D. 肌肉鬆弛劑"],"ans":2,"exp":"Diazepam（地西泮）在貓的臨床上是食慾促進劑（appetite stimulant），因其鎮靜作用可降低飲食焦慮，常用於誘導厭食貓進食。然而，「食慾抑制劑（appetite suppressant）」完全不是diazepam的臨床用途。Diazepam的實際適應症包括：抗痙攣劑（anticonvulsant）、寧神劑（anxiolytic/sedative）、麻醉前給藥（premedication）、肌肉鬆弛劑（muscle relaxant）、食慾促進劑（appetite stimulant in cats）。","we":["錯誤：Diazepam為benzodiazepine類，增強GABA-A受體的Cl⁻內流，具有顯著的抗痙攣（anticonvulsant）作用，是小動物急性癲癇發作的常用急救藥；此為diazepam的實際臨床用途，不符合「並非」的條件。","錯誤：Diazepam具有抗焦慮（anxiolytic）和鎮靜效果，屬「寧神劑（tranquilizer/sedative）」範疇；在獸醫麻醉前給藥（premedication）中常用於減輕焦慮、降低麻醉藥需求量；此為有效的臨床用途。","","錯誤：Diazepam及其他benzodiazepines可透過增強脊髓GABA中間神經元功能，減少α運動神經元的激發，產生中樞性肌肉鬆弛（muscle relaxant）效果；在小動物中常作為ketamine的前給藥以改善肌肉鬆弛；此為有效的臨床用途。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_040","year":2023,"roc_year":112,"session":"","examNo":40,"q":"下列何種抗焦慮劑在犬懷孕3個月內投藥，容易產生畸胎的風險？","opts":["A. alprazolam","B. clorazepate","C. buspirone","D. lorazepam"],"ans":1,"exp":"Clorazepate（氯拉酸鹽）為benzodiazepine前驅藥（prodrug），在體內水解為活性代謝物nordazepam（去甲基地西泮）。Benzodiazepines具有致畸性（teratogenicity）風險，尤其在妊娠初期（第一孕期）。Clorazepate的致畸風險在犬的妊娠安全性研究中特別被標注，臨床上在犬懷孕初3個月應避免使用。其活性代謝物nordazepam在胎盤的滲透和累積是主要毒性風險。","we":["錯誤：Alprazolam雖為benzodiazepine類（具有潛在致畸性，尤其在人的初孕三個月），但題目問的是臨床上「容易產生畸胎風險」最高者；Clorazepate（鹽酸氯拉酸鹽）為前驅藥，轉化為nordazepam，在胎盤可達較高濃度，致畸性風險相對較受重視。","","錯誤：Buspirone為5-HT1A部分致效劑，非benzodiazepine類；動物研究中致畸性相對較低，且無明顯的鎮靜、戒斷症狀；其抗焦慮機制不同於BZD，致畸風險分級與BZD不同。","錯誤：Lorazepam雖為benzodiazepine，具有致畸潛力，但clorazepate（作為nordiazepam前驅藥）在犬胎盤藥物動力學研究中被特別標注為高風險；題目中clorazepate為最需特別注意的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_041","year":2023,"roc_year":112,"session":"","examNo":41,"q":"吸入性麻醉劑於肺泡的濃度（alveolar anesthetic concentration, FA）和吸入的濃度（inspired concentration, FI）\r 之比值會影響麻醉效果，下列何者於動物給藥後10分鐘FA和FI之比值最低？","opts":["A. desflurane","B. nitrous oxide","C. isoflurane","D. sevoflurane"],"ans":2,"exp":"FA/FI比值反映肺泡濃度與吸入濃度之間的平衡速度，受血液/氣體分布係數（blood/gas partition coefficient, B/G）影響：B/G越高，藥物溶入血液越多，肺泡濃度上升越慢（FA/FI比值低）。Isoflurane的B/G約1.4，在本題四個選項中最高（desflurane≈0.42、N₂O≈0.47、sevoflurane≈0.65），因此肺泡濃度平衡最慢，給藥後10分鐘FA/FI比值最低。","we":["錯誤：Desflurane的血液/氣體分布係數（blood/gas partition coefficient）約0.42，極低，故FA/FI比值上升極快（equilibration快），給藥10分鐘後FA/FI比值應為最高而非最低；低B/G係數 = 快速平衡 = 高FA/FI比值。","錯誤：Nitrous oxide（一氧化二氮）的血液/氣體分布係數約0.47，極低，FA/FI比值上升快；給藥後FA/FI接近1.0的速度比isoflurane快很多，故10分鐘後FA/FI比值應高於isoflurane。","","錯誤：Sevoflurane的血液/氣體分布係數約0.65，低於isoflurane（1.4），FA/FI比值上升較快；給藥10分鐘後，sevoflurane的FA/FI比值高於isoflurane，但低於desflurane/N₂O；isoflurane最慢平衡故FA/FI最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_042","year":2023,"roc_year":112,"session":"","examNo":42,"q":"Alphaxalone具快速和短效麻醉的藥理機制與下列何種離子在細胞膜上傳導有關？","opts":["A. 氯","B. 鉀","C. 鈉","D. 鈣"],"ans":0,"exp":"Alphaxalone為神經類固醇（neurosteroid），透過正向調節GABA-A受體（配體門控離子通道）發揮麻醉作用。GABA-A受體的離子通道選擇性傳導Cl⁻（氯離子）；alphaxalone與受體上的神經類固醇結合位點作用，增強Cl⁻內流，使神經元超極化（hyperpolarization），產生快速且短效的中樞抑制。","we":["","錯誤：鉀離子（K⁺）通道調節主要涉及Kir通道和K-ATP通道，與心臟節律和胰島素分泌有關；GABA-A受體（alphaxalone作用靶點）為配體門控Cl⁻通道，非K⁺通道，鉀與alphaxalone麻醉機制無關。","錯誤：鈉離子（Na⁺）通道阻斷是局部麻醉劑（lidocaine等）和Class I抗心律不整藥的作用機制；Alphaxalone（神經類固醇/neurosteroid）透過正向調節GABA-A受體的Cl⁻通道，而非影響Na⁺通道，機制完全不同。","錯誤：鈣離子（Ca²⁺）通道阻斷為Class IV抗心律不整藥（diltiazem、verapamil）的作用機制；Alphaxalone誘導麻醉靠增強GABA-A介導的Cl⁻內流，降低神經元興奮性，而非透過鈣通道阻斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_043","year":2023,"roc_year":112,"session":"","examNo":43,"q":"下列何種擬交感神經致效劑之強心作用最顯著？","opts":["A. ephedrine","B. naphazoline","C. metaproterenol","D. dobutamine"],"ans":3,"exp":"Dobutamine為合成的β1選擇性致效劑（β1 > β2，幾乎無α效應），對心臟的正性肌力（inotropic）效果最強；在四個選項中，dobutamine的心臟選擇性和強心效力最突出，是臨床治療急性心衰竭的靜脈用正性肌力藥物首選。","we":["錯誤：Ephedrine為間接交感神經致效劑（促進catecholamine釋放）兼直接α/β激動，強心作用弱於dobutamine；ephedrine常用於麻醉期間低血壓的處理，但β1選擇性和強心效力不如dobutamine。","錯誤：Naphazoline為高選擇性α1/α2致效劑（收縮鼻黏膜血管），無顯著β1強心作用；主要用作鼻充血解除劑（decongestant），對心臟正性肌力效果極弱。","錯誤：Metaproterenol（orciprenaline）為非選擇性β致效劑（β1+β2），雖有強心和支氣管擴張作用，但β1選擇性不如dobutamine；dobutamine幾乎純β1致效，強心作用更突出，副作用（心動過速）相對較少。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_044","year":2023,"roc_year":112,"session":"","examNo":44,"q":"下列何者非epinephrine的主要臨床用途？","opts":["A. 可用於心肺復甦","B. 可縮短局部麻醉藥的效果","C. 可治療過敏性休克","D. 可治療青光眼"],"ans":1,"exp":"Epinephrine（腎上腺素）與局部麻醉藥合用時，透過α1受體收縮血管，減少局部血流，從而延長（prolong）局部麻醉效果，而非縮短（shorten）。「縮短局部麻醉藥的效果」為錯誤描述，不符合其主要臨床用途。","we":["此為正確描述：Epinephrine（腎上腺素）為心肺復甦（CPR）的首選心臟復甦藥，通過α1受體增加冠脈灌注壓，β1受體促進心臟起搏，是ACLS/VECCS標準用藥；不符合「非主要臨床用途」的條件。","","此為正確描述：Epinephrine為過敏性休克（anaphylaxis/anaphylactic shock）的第一線急救藥，α1收縮血管（逆轉低血壓和angioedema）、β2擴張支氣管（改善呼吸困難）；是無可替代的唯一一線用藥，不符合條件。","此為正確描述：Epinephrine（或其前驅藥dipivefrin）可用於開角型青光眼，透過增加房水流出和減少房水生成降低眼壓；雖β-blocker（timolol）是更常用的青光眼眼藥，但epinephrine有效，不符合「非主要用途」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_045","year":2023,"roc_year":112,"session":"","examNo":45,"q":"有關propranolol的敘述，下列何者錯誤？","opts":["A. 是β腎上腺素性受體的反向致效劑","B. 是非選擇性的β腎上腺素性受體拮抗劑","C. 可降低呼吸道的阻力","D. 可治療動物的心律不整"],"ans":2,"exp":"Propranolol為非選擇性β受體拮抗劑，阻斷β2受體後導致支氣管平滑肌收縮，造成氣道阻力增加（increased airway resistance）而非降低。「可降低氣道阻力」為錯誤描述；其他選項（反向致效劑、非選擇性β阻斷、治療心律不整）均為正確的藥理知識。","we":["此為正確描述：Propranolol不只是「拮抗劑」，而是β受體的反向致效劑（inverse agonist），能在無激動劑情況下降低受體基礎活性（constitutive activity）；此為現代受體藥理學概念，不符合「錯誤」描述。","此為正確描述：Propranolol同時阻斷β1（心臟）和β2（支氣管、血管）受體，屬非選擇性β-blocker；與選擇性β1阻斷劑（atenolol、metoprolol）相比，它對呼吸道和外周血管的副作用更顯著；不符合「錯誤」描述。","","此為正確描述：Propranolol為Class II抗心律不整藥，透過阻斷β1受體降低心臟自動性（automaticity）和傳導速度，用於治療室上性心動過速、心房顫動等；為臨床獸醫心臟用藥，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_046","year":2023,"roc_year":112,"session":"","examNo":46,"q":"下列何者可同時作用於尼古丁受體及蕈毒鹼受體？","opts":["A. atropine","B. carbachol","C. physostigmine","D. bethanechol"],"ans":1,"exp":"Carbachol（氨甲醯膽鹼）為合成的膽鹼酯類，直接作用於毒蕈鹼（muscarinic）受體和尼古丁（nicotinic）受體，是四個選項中唯一同時具有M+N雙重直接致效活性的藥物。其不被膽鹼酯酶水解（酯鍵改造）的特性使作用時間較ACh長。","we":["錯誤：Atropine為競爭性毒蕈鹼（muscarinic）受體拮抗劑，選擇性阻斷M1-M5受體；它不作用於尼古丁（nicotinic）受體，故只影響副交感神經節後效應和部分CNS，不能「同時」作用於兩種受體。","","錯誤：Physostigmine為可逆性膽鹼酯酶抑制劑（cholinesterase inhibitor），通過抑制AChE增加突觸間隙的乙醯膽鹼濃度，間接增強尼古丁和毒蕈鹼受體的反應；但physostigmine本身不直接結合受體，是間接而非直接作用於兩種受體。","錯誤：Bethanechol為選擇性毒蕈鹼受體致效劑，對平滑肌（膀胱、腸道）的M3受體有較強選擇性；bethanechol不具有尼古丁受體活性，不能作用於骨骼肌（NMJ）或自主神經節（nicotinic），與carbachol不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_047","year":2023,"roc_year":112,"session":"","examNo":47,"q":"下列何者可有效地拮抗非去極化性骨骼肌鬆弛劑所引起的神經肌肉阻斷？","opts":["A. succinylcholine","B. neostigmine","C. bethanechol","D. atropine"],"ans":1,"exp":"Neostigmine（新斯的明）為可逆性AChE抑制劑，使突觸間隙ACh堆積，競爭性地將非去極化型神經肌肉阻斷劑（non-depolarizing NMB，如vecuronium、pancuronium）從NMJ的nAChR置換，從而逆轉其阻斷效果。Vecuronium（正確答案）為典型的非去極化NMB，neostigmine是其標準拮抗劑。","we":["錯誤：Succinylcholine為去極化型神經肌肉阻斷劑（depolarizing NMB，Phase I block），其作用不被新斯的明（neostigmine）拮抗；事實上，胺基醣苷類或AChE抑制劑可能延長succinylcholine效果（Phase II block增強），而非逆轉。","","錯誤：Bethanechol為選擇性毒蕈鹼受體直接致效劑，作用於平滑肌M3受體（膀胱、腸道收縮），無法增強NMJ的烟鹼型受體傳遞；不具有拮抗非去極化NMB的能力。","錯誤：Atropine為毒蕈鹼受體拮抗劑，用於防止新斯的明逆轉NMB時引起的心搏過緩和唾液分泌增加等毒蕈鹼副作用；atropine本身不能拮抗NMB，而是作為neostigmine使用時的輔助藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_048","year":2023,"roc_year":112,"session":"","examNo":48,"q":"當動物有肝腎疾病時，首選的肌肉鬆弛劑為何？","opts":["A. atracurium","B. tubocurarine","C. pancuronium","D. vecuronium"],"ans":0,"exp":"Atracurium（阿曲庫銨）透過Hofmann消除（pH和溫度依賴的非酶促降解）在血漿中自發分解，無需肝臟或腎臟代謝；因此對於嚴重肝腎疾病的患畜，atracurium的消除不受器官功能影響，是最安全的非去極化NMB選擇。","we":["","錯誤：Tubocurarine（d-tubocurarine）主要依賴腎臟排泄（~60%）和膽汁分泌消除；在腎衰竭時藥物積累、作用延長，有肝腎疾病的動物使用風險增加，非首選。","錯誤：Pancuronium主要依賴腎臟消除（~80%以原型由尿液排出），少量由肝臟代謝；腎衰竭時半衰期延長，作用持續時間不可預測，有嚴重肝腎疾病的患畜應避免使用。","錯誤：Vecuronium主要依賴肝臟（膽汁分泌）消除，10-25%由腎臟排泄；肝功能損傷時消除延遲，作用持續；雖優於pancuronium/tubocurarine，但仍不及atracurium（Hofmann消除不依賴器官）適合嚴重肝腎疾病患畜。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_049","year":2023,"roc_year":112,"session":"","examNo":49,"q":"當動物發生心肌性心衰竭併發急性寡尿性腎衰竭時，最佳治療藥物為何？","opts":["A. pimobendan","B. digoxin","C. amrinone","D. dopamine"],"ans":3,"exp":"心肌病合併急性少尿性腎衰竭的患畜，需要同時支持心臟功能和改善腎臟灌注。Dopamine低劑量（0.5-3 μg/kg/min）選擇性刺激D1受體，擴張腎動脈，增加腎小球濾過率（GFR）；中等劑量（3-10 μg/kg/min）同時啟動β1受體正性肌力作用，支持心臟功能。Dopamine為此情境的首選兼顧用藥。","we":["錯誤：Pimobendan（正性肌力+血管擴張劑）為犬慢性心衰竭治療藥物，主要用於慢性二尖瓣疾病和擴張型心肌病的長期管理；急性少尿性腎衰竭時需要促進腎臟灌注，pimobendan無此緊急腎臟保護作用。","錯誤：Digoxin為強心苷，有效但狹窄治療指數（narrow TI），急性腎衰竭時消除減少易中毒；且digoxin不具有多巴胺那樣的選擇性腎臟血管擴張作用，在急性腎衰竭合併心衰時風險高。","錯誤：Amrinone（milrinone的前驅藥類）為磷酸二酯酶III抑制劑，具有強心和血管擴張作用，但主要用於短期靜脈注射治療頑固性心衰竭；不具有dopamine的腎血管選擇性擴張效果，對急性腎灌注不足的改善不如dopamine。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_050","year":2023,"roc_year":112,"session":"","examNo":50,"q":"下列何者對於慢反應動作電位（slow response action potential），又稱節律性電位異常所引起的心律不整具有\r 最佳療效？","opts":["A. mexiletine","B. diltiazem","C. quinidine","D. amiodarone"],"ans":1,"exp":"慢反應動作電位（slow response AP）見於竇房結（SA node）和房室結（AV node），以Ca²⁺電流（L型鈣通道）為主驅動力；Ca²⁺通道阻斷劑（Class IV）diltiazem選擇性作用於SA/AV結，抑制慢反應電位，最適合治療源自節律性異常的心律不整。","we":["錯誤：Mexiletine為Class IB抗心律不整藥（Na⁺通道阻斷劑），主要用於心室性心律不整（快反應動作電位）；對SA/AV結的慢反應動作電位（Ca²⁺依賴性）無選擇性抑制，非治療節律性異常的首選。","","錯誤：Quinidine為Class IA抗心律不整藥（Na⁺通道阻斷劑+K⁺通道阻斷），主要作用於心房肌和心室肌的快反應電位；不選擇性作用於SA/AV結的慢反應電位，且QTc延長風險高。","錯誤：Amiodarone為Class III抗心律不整藥（K⁺通道阻斷為主），也兼有多重離子通道作用；雖可用於多種心律不整，但對慢反應節律性電位的標準治療首選為calcium channel blocker（diltiazem/verapamil），而非amiodarone。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_051","year":2023,"roc_year":112,"session":"","examNo":51,"q":"當貓繼發性高血壓歸因於甲狀腺功能亢進所致，在臨床上常選用的治療藥物為何？","opts":["A. amlodipine besylate","B. prazosin","C. hydrochlorothiazide","D. atenolol"],"ans":3,"exp":"貓甲狀腺功能亢進繼發高血壓以高心輸出量（high CO）和心搏過速為主要病機，甲狀腺素直接上調β受體敏感性；atenolol（β1選擇性阻斷劑）透過阻斷β1受體降低心率和心輸出量，直接對應病機，為此類繼發性高血壓的首選。","we":["錯誤：Amlodipine（鈣通道阻斷劑）確為貓原發性高血壓的首選降壓藥，但對繼發於甲狀腺功能亢進的高血壓（以心博過速和高心輸出量為主），atenolol（β-blocker）更針對心亢性高血壓的機制（β1阻斷降低心率和心輸出量）；amlodipine治療甲亢性高血壓不如atenolol直接。","錯誤：Prazosin為α1受體阻斷劑（vasodilator），用於貓的系統性高血壓較少見；貓甲亢合併高血壓的機制主要是甲狀腺素直接刺激β受體（交感神經激活增強），α1阻斷不如β1阻斷對此病態機制有效。","錯誤：Hydrochlorothiazide（噻嗪類利尿劑）用於輕度高血壓容量依賴型，在貓中使用效果有限且貓對利尿劑副作用（電解質失衡）較敏感；甲亢性高血壓（心輸出量增加型）用利尿劑並非最直接的病機導向治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_052","year":2023,"roc_year":112,"session":"","examNo":52,"q":"有關低劑量aspirin預防心肌梗塞之原理，下列敘述何者錯誤？","opts":["A. Aspirin作用於血小板COX具不可逆性","B. 血管內皮細胞COX受其抑制後，不具再生作用","C. 主要抑制血小板thromboxane A2之生成","D. 高劑量下會導致內皮細胞prostacyclin形成減少"],"ans":1,"exp":"血管內皮細胞有細胞核，能合成新的COX蛋白，故阿司匹林對內皮細胞COX的乙醯化（acetylation）抑制可在數小時內因新蛋白合成而「再生（regenerate）」；相對地，血小板無細胞核無法合成新蛋白，阿司匹林對血小板COX的抑制不可逆且持續整個血小板壽命。故「內皮細胞COX同樣不可逆，無法再生」為錯誤描述。","we":["此為正確描述：Aspirin透過乙醯化（acetylation）COX-1的絲胺酸殘基（Ser530），對血小板COX形成不可逆共價修飾；因血小板無細胞核、不能合成新蛋白，此抑制作用持續血小板整個壽命（7-10天），不符合「錯誤」描述。","","此為正確描述：低劑量阿司匹林選擇性抑制血小板的thromboxane A2（TXA2）生成（血小板聚集和血管收縮），同時保留內皮細胞的PGI2（prostacyclin，抗血小板和血管擴張）；這是低劑量aspirin預防血栓的機制基礎，不符合「錯誤」描述。","此為正確描述：高劑量aspirin也抑制血管內皮細胞COX，減少PGI2生成，平衡TXA2/PGI2比值反而偏向促血栓；這解釋為何高劑量aspirin不具低劑量的心血管保護效果，不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_053","year":2023,"roc_year":112,"session":"","examNo":53,"q":"當患有全身性水腫或急性肺水腫的動物，不可使用mannitol滲透壓型利尿劑的因素為何？","opts":["A. 引起細胞外液增加","B. 對於亨利氏環之過度利尿作用","C. 導致高血糖症","D. 引起滲透性下痢"],"ans":0,"exp":"Mannitol為高滲性利尿劑，靜脈注射後初期將細胞內液和組織間液的水分吸引至血管腔，增加細胞外液和循環血量；若患畜已有全身性水腫或肺水腫，血漿容積的初期擴張會加重肺水腫和心臟負荷，因此為禁忌。","we":["","錯誤：Mannitol的利尿作用在腎小管（主要是近端小管和亨利氏環降支），透過滲透壓阻止水再吸收；雖有利尿作用，但水腫患畜禁用的原因不是「過度利尿」，而是mannitol初期擴張細胞外液和血漿容積，加重肺水腫，是主要的禁忌原因。","錯誤：Mannitol為不被代謝的己糖醇，不影響血糖（glucose）代謝；甘露醇不代謝成葡萄糖，不升高血糖；此為無效的錯誤選項，非甘露醇禁用於水腫患者的原因。","錯誤：口服甘露醇確可因滲透性效應引起腸道水分積聚和腹瀉，但靜脈注射mannitol（治療腦水腫的劑型）不引起滲透性下痢；注射用甘露醇的禁忌症為水腫/無尿，而非腹瀉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_054","year":2023,"roc_year":112,"session":"","examNo":54,"q":"因腎上腺腫瘤使aldosterone分泌過多，因而導致患畜鈉滯留、鉀排出過多時，可使用下列何種利尿劑？","opts":["A. furosemide","B. chlorothiazide","C. acetazolamide","D. spironolactone"],"ans":3,"exp":"高醛固酮症（hyperaldosteronism）導致腎集合管Na⁺瀦留和K⁺排泄增加（低血鉀）；Spironolactone為醛固酮受體拮抗劑，阻斷醛固酮的作用，同時減少Na⁺再吸收和K⁺丟失（保鉀利尿），直接對應病機，為首選治療藥物。","we":["錯誤：Furosemide為髓袢利尿劑（loop diuretic），抑制Na⁺-K⁺-2Cl⁻共轉運體，雖可排鈉但同時促進K⁺排泄（造成低血鉀）；高醛固酮症本已引起低血鉀，使用furosemide會加重低血鉀，禁忌使用。","錯誤：Chlorothiazide為噻嗪類利尿劑，排鈉但也促進K⁺排泄（低血鉀副作用）；與furosemide相同，會加重高醛固酮症患畜的低血鉀問題，不適合作為針對aldosterone過多的治療藥物。","錯誤：Acetazolamide為碳酸酐酶抑制劑，主要作用於近端小管，抑制NaHCO₃再吸收，利尿效果弱且引起代謝性酸中毒；不針對醛固酮受體，對高醛固酮症的Na⁺瀦留/K⁺丟失問題無直接修正效果。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_055","year":2023,"roc_year":112,"session":"","examNo":55,"q":"反芻獸因穀物過飼導致乳酸血症之代謝性酸中毒，不可使用下列何者予以治療？","opts":["A. ammonium chloride","B. sodium lactate","C. sodium bicarbonate","D. sodium acetate"],"ans":1,"exp":"反芻獸乳酸血症（ruminant lactic acidosis）時血漿已有大量乳酸積累，sodium lactate（乳酸鈉）在肝臟代謝為NaHCO₃的前提是乳酸代謝正常；乳酸血症時肝臟乳酸代謝受損，注射sodium lactate反而增加血漿乳酸負擔，禁忌使用。","we":["錯誤：Ammonium chloride為酸化劑（acidifier），可降低pH；反芻獸乳酸血症已有代謝性酸中毒，使用ammonium chloride會加重酸中毒，同樣禁忌；但題目問「不可使用」的單一最佳答案，sodium lactate是最直接錯誤（「乳酸血症用乳酸鈉」矛盾最明顯）。","","錯誤：Sodium bicarbonate（碳酸氫鈉）為標準的代謝性酸中毒治療藥物，可直接中和血漿中的H⁺，提升血漿pH；反芻獸乳酸血症使用NaHCO₃是合理的，不在禁忌之列。","錯誤：Sodium acetate在體內被代謝為NaHCO₃（醋酸→CO₂+H₂O），具有間接鹼化效果，類似sodium lactate；雖理論上有問題，但乳酸血症的患畜使用sodium acetate的代謝途徑較sodium lactate（乳酸代謝已受損）更為可行，故不是「最不可使用」的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_056","year":2023,"roc_year":112,"session":"","examNo":56,"q":"下列何者不具有促進食慾的作用？","opts":["A. cyproheptadine","B. mirtazapine","C. prednisolone","D. apomorphine"],"ans":3,"exp":"Apomorphine為多巴胺（D2）受體致效劑，主要作用於化學受體觸發區（CTZ），引起強烈嘔吐（emesis），臨床用作催吐藥（emetic）；它不具食慾促進作用，與cyproheptadine、mirtazapine、prednisolone等食慾促進劑機制和作用相反。","we":["錯誤：Cyproheptadine為第一代抗組織胺藥（H1拮抗劑），同時具有抗5-HT作用；在貓中確有促進食慾的效果（機制可能涉及5-HT₂C阻斷），臨床用於貓的食慾不振；屬有效食慾促進劑，不符合「不具有」的條件。","錯誤：Mirtazapine為NaSSA（norepinephrine and specific serotonergic antidepressant），阻斷5-HT₂C和H1受體，在犬貓中是最常用的食慾促進劑之一；貓用transdermal mirtazapine（Mirataz）已被批准；屬強效食慾促進劑，不符合條件。","錯誤：Prednisolone（及其他糖皮質激素）通過增加血糖、減少惡病質信號分子（如TNF-α、IL-1）的效果，在腫瘤/炎症動物中常可短期促進食慾；「類固醇增強食慾」為臨床常見現象，不符合「不具有促進食慾作用」的條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_057","year":2023,"roc_year":112,"session":"","examNo":57,"q":"下列消化性潰瘍治療藥物，何者效價（potency）相對較高？","opts":["A. ranitidine","B. famotidine","C. nizatidine","D. cimetidine"],"ans":1,"exp":"H2拮抗劑效價（potency）由高至低：famotidine（~40×cimetidine）> nizatidine（~10×）≈ ranitidine（~5-10×）> cimetidine（1×基準）；Famotidine為四種常用H2阻斷劑中效價最高者，臨床所需劑量最低，且藥物交互作用（CYP450抑制）遠少於cimetidine。","we":["錯誤：Ranitidine效價約為cimetidine的5-10倍，在H2拮抗劑中屬中等效價；famotidine效價約為cimetidine的40倍（ranitidine的8倍），題目問「效價相對較高」者，famotidine明顯優於ranitidine。","","錯誤：Nizatidine效價約與ranitidine相近（5-10倍cimetidine），未達famotidine的40倍效價水準；且nizatidine兼具促腸道蠕動作用（AChE抑制），但就H2阻斷效價而言低於famotidine。","錯誤：Cimetidine為第一個商業化的H2拮抗劑（1977），效價最低，為後代H2阻斷劑的比較基準（1×）；cimetidine也是最強的CYP450抑制劑（藥物交互作用最多）、效價最低，是所有H2拮抗劑中「效價最低」而非「最高」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_058","year":2023,"roc_year":112,"session":"","examNo":58,"q":"下列作用於胃腸道的藥物中，何者不可用於懷孕的動物？","opts":["A. misoprostol","B. omeprazole","C. ranitidine","D. sucralfate"],"ans":0,"exp":"Misoprostol為PGE1類似物（前列腺素E1 analog），刺激子宮平滑肌收縮（oxytocic effect）並促進子宮頸軟化，可引起流產或早產；因此懷孕動物（或人）為絕對禁忌症，是四個選項中唯一有明確妊娠禁忌的胃腸道用藥。","we":["","錯誤：Omeprazole（PPI）抑制胃壁細胞H⁺/K⁺-ATPase；懷孕期間對胎兒影響相對較小（動物研究無明確致畸性），屬懷孕安全性分類B，通常不是妊娠動物的禁忌；胃食道逆流在妊娠期常見，PPI有時仍使用。","錯誤：Ranitidine為H2拮抗劑，對胎兒相對安全（FDA分類B），無子宮收縮作用；懷孕動物若需要抑制胃酸，ranitidine為可考慮的選擇，非禁忌。","錯誤：Sucralfate（硫糖鋁）幾乎不被吸收，局部覆蓋胃黏膜保護作用，全身副作用極少；對懷孕動物幾乎無風險（FDA分類B），不含子宮收縮活性，無妊娠禁忌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_059","year":2023,"roc_year":112,"session":"","examNo":59,"q":"下列胃腸促動劑，何者主要作用於motilin接受器？","opts":["A. cisapride","B. domperidone","C. metoclopramide","D. erythromycin"],"ans":3,"exp":"Erythromycin（紅黴素）除抗生素作用外，也是motilin受體（motilin receptor）的致效劑；motilin為調節胃腸道「移行性複合運動（MMC）」的腸道荷爾蒙，erythromycin模擬motilin作用，促進胃腸道蠕動（prokinetic effect），是四個選項中唯一透過motilin受體發揮促動力作用的藥物。","we":["錯誤：Cisapride主要透過5-HT₄受體促進乙醯膽鹼釋放，增強腸道蠕動；非motilin受體致效劑；cisapride因QTc延長風險（心律不整）在人醫已退市，但獸醫仍有使用。","錯誤：Domperidone為外周多巴胺（D2）受體拮抗劑（不易穿透血腦障壁），阻斷CTZ和胃腸道D2受體止吐和促進胃排空；非motilin受體機制，與erythromycin作用途徑不同。","錯誤：Metoclopramide為中央+外周D2受體拮抗劑，兼有輕度5-HT₄致效作用（促進腸蠕動）；非motilin受體機制；metoclopramide可穿越BBB（錐體外症副作用），是最常用的獸醫止吐/促動力藥之一。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_060","year":2023,"roc_year":112,"session":"","examNo":60,"q":"下列何者是apomorphine引起藥效的作用部位？","opts":["A. 大腦皮質","B. 下視丘","C. 化學受體觸發區","D. 腸胃黏膜"],"ans":2,"exp":"Apomorphine（阿朴嗎啡）為多巴胺D2受體致效劑，其催吐作用的靶點為化學受體觸發區（chemoreceptor trigger zone, CTZ），位於第四腦室底部的area postrema；CTZ缺乏完整血腦障壁，允許血液中的藥物（apomorphine）直接刺激D2受體引發嘔吐反射。","we":["錯誤：大腦皮質（cerebral cortex）為高級認知功能中心；嘔吐反射不由大腦皮質主控（皮質可通過精神因素影響嘔吐但非主要途徑）；Apomorphine直接刺激CTZ的D2受體觸發嘔吐反射，而非大腦皮質。","錯誤：下視丘（hypothalamus）調節溫度、食慾、水分平衡、自主神經功能；嘔吐中樞（vomiting center/NTS區域）位於腦幹延髓，非下視丘；CTZ位於第四腦室底部（area postrema），血腦障壁不完整，使apomorphine等藥物可直接作用。","","錯誤：腸胃黏膜的5-HT₃受體刺激可通過迷走神經傳入誘發嘔吐（如化療後的外周途徑），但apomorphine的主要作用部位為CTZ（中樞途徑），而非腸胃黏膜；CTZ-D2受體是apomorphine致嘔的主要靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_061","year":2023,"roc_year":112,"session":"","examNo":61,"q":"下列藥物何者為5-HT3受體拮抗劑，可用於止吐？","opts":["A. scopolamine","B. acepromazine","C. ondansetron","D. promethazine"],"ans":2,"exp":"5-HT₃受體拮抗劑（setron類）是化療誘發嘔吐和術後嘔吐的重要止吐藥；Ondansetron（昂丹司瓊）為最具代表性的5-HT₃拮抗劑，選擇性阻斷腸道迷走神經傳入和CTZ的5-HT₃受體，阻斷嘔吐反射的外周和中樞途徑。","we":["錯誤：Scopolamine為毒蕈鹼（muscarinic）受體拮抗劑，透過阻斷M1受體抑制前庭-嘔吐途徑，主要用於動暈症（motion sickness）；非5-HT₃受體拮抗劑，作用機制完全不同。","錯誤：Acepromazine為phenothiazine類，透過阻斷CTZ的D2受體和H1受體產生止吐效果；非5-HT₃受體拮抗劑（5-HT₃antagonists = ondansetron、granisetron等）；acepromazine也有α1阻斷和鎮靜效果。","","錯誤：Promethazine為phenothiazine類H1拮抗劑（也有D2阻斷效果），用於動暈症和嘔吐，但機制為H1/D2受體阻斷，而非5-HT₃受體拮抗；與ondansetron的作用靶點不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_062","year":2023,"roc_year":112,"session":"","examNo":62,"q":"下列止瀉劑何者亦具有治療幽門螺旋菌感染的作用？","opts":["A. loperamide","B. bismuth subsalicylate","C. propantheline","D. kaolin/pectin mixture"],"ans":1,"exp":"Bismuth subsalicylate（次水楊酸鉍）兼具止瀉和抗菌雙重作用：鉍離子干擾幽門螺旋菌（Helicobacter pylori）的細胞壁合成和酶功能；水楊酸鹽具有抗炎效果。因此bismuth subsalicylate同時用於止瀉和幽門螺旋菌感染的根除療法（與抗生素合用）。","we":["錯誤：Loperamide為外周μ阿片受體致效劑，抑制腸道蠕動和增加肛門括約肌張力，純粹止瀉作用；無抗幽門螺旋菌（Helicobacter pylori）活性，不能治療胃潰瘍/幽門螺旋菌感染。","","錯誤：Propantheline為抗膽鹼藥（muscarinic antagonist），抑制腸道平滑肌收縮（解痙），用於腹瀉伴腸痙攣；無抗菌活性，不能治療幽門螺旋菌感染。","錯誤：Kaolin/pectin為腸道吸附劑（adsorbent），吸附腸道毒素、水分和細菌，改善糞便稠度；無抗菌活性，不能殺滅幽門螺旋菌；bismuth的殺菌機制（干擾細菌細胞壁/酶功能）使其兼具止瀉和抗菌雙重作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_063","year":2023,"roc_year":112,"session":"","examNo":63,"q":"下列何者無法有效使犢牛食道溝關閉？","opts":["A. 10%碳酸氫鈉","B. 5%硫酸銅","C. 水","D. 牛奶"],"ans":2,"exp":"犢牛食道溝（esophageal/reticular groove）關閉需要化學或神經刺激（味覺/嗅覺受體激活）；有效的誘導劑包括：NaHCO₃溶液、CuSO₄溶液、牛奶及鹽水等；純水（water）不含足夠的化學刺激物，無法誘導食道溝反射性關閉，液體會直接流入瘤胃而非皺胃，不適合作為口服給藥的媒介。","we":["錯誤：10% NaHCO₃溶液可有效使犢牛食道溝（esophageal groove/reticular groove）關閉，是已知的化學刺激劑；食道溝關閉可使液體直接進入瘤皺胃而非經由前胃，用於口服藥物直達皺胃（abomasum）；不符合「無法」的條件。","錯誤：5% CuSO₄溶液可通過刺激口咽部或通過反射機制引起食道溝關閉，用於驅蟲藥（如copper sulfate驅除Haemonchus）直接進入皺胃；是有效的食道溝關閉誘導劑，不符合「無法」的條件。","","錯誤：牛奶（milk）是最生理性的食道溝關閉刺激物，初乳和牛乳透過味覺/化學受體和神經反射引起食道溝關閉（reflex closure），這是犢牛正常哺乳時確保牛奶直達皺胃的生理機制；不符合「無法」的條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_064","year":2023,"roc_year":112,"session":"","examNo":64,"q":"下列何者為噴霧投予，且具有超過12小時以上作用時間之選擇性β2-致效劑（β2-selective agonist）？","opts":["A. metaproterenol","B. salmeterol","C. isoproterenol","D. clenbuterol"],"ans":1,"exp":"長效吸入型β2致效劑（LABA，long-acting β2 agonist）的標準定義為作用時間>12小時；Salmeterol（沙美特羅）為高度脂溶性β2致效劑，與β2受體及細胞膜脂質的強力結合使其作用可持續12小時以上，適合慢性氣道阻塞的長期維持治療。","we":["錯誤：Metaproterenol（orciprenaline）為短效非選擇性β致效劑（β1+β2），作用時間約3-4小時；非長效（LABA）藥物，不能提供>12小時的支氣管擴張，不適合用於慢性氣道阻塞的長期管理。","","錯誤：Isoproterenol（isoprenaline）為非選擇性β致效劑，靜脈注射或吸入後作用時間很短（<2小時）；為短效急救用藥（如心搏停止、支氣管痙攣緊急處理），非長效吸入型支氣管擴張劑。","錯誤：Clenbuterol為選擇性β2致效劑，雖在馬中作用時間較長（8-12小時），但不達到>12小時的LABA標準；Salmeterol（>12小時）和formoterol（>12小時）為標準LABA藥物；clenbuterol在部分動物中更常用於子宮平滑肌鬆弛（tocolytic）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_065","year":2023,"roc_year":112,"session":"","examNo":65,"q":"有關對氣道阻塞的馬投予clenbuterol之相關敘述，下列何者錯誤？","opts":["A. 可能出現肌肉顫抖與出汗等反應","B. 可能出現心搏過速與蕁麻疹之副作用","C. 可能引起子宮收縮而增強前列腺素之作用","D. 於馬clenbuterol以口服給藥為主"],"ans":2,"exp":"Clenbuterol（β2致效劑）對子宮平滑肌的β2受體有鬆弛作用（tocolytic effect），抑制子宮收縮而非引起收縮；「clenbuterol引起子宮收縮」為錯誤描述。其他選項（肌肉顫抖/出汗、心搏過速/蕁麻疹、口服給藥）均為clenbuterol的已知藥理特性。","we":["此為正確描述：Clenbuterol（β2致效劑）的β2受體廣泛分布於骨骼肌，高劑量或長期使用可引起肌肉顫抖（muscle tremors）和出汗（sweating）等副作用，在馬中尤為常見；不符合「錯誤」描述。","此為正確描述：Clenbuterol的β1效應（心搏過速/tachycardia）和輕度β2介導的皮膚血管擴張可引起蕁麻疹；雖為選擇性β2，但大劑量時β1效應顯現，心搏過速為已知副作用；不符合「錯誤」描述。","","此為正確描述：在獸醫臨床（馬匹），clenbuterol通常以口服（syrup/granule形式）給藥，也可靜脈注射；馬的口服生物利用度（約87%）較高，口服確為常用給藥途徑；不符合「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_066","year":2023,"roc_year":112,"session":"","examNo":66,"q":"下列何者是使用於小動物氣喘症狀治療之白三烯素（leukotriene）受體拮抗劑？","opts":["A. nedocromil","B. zileuton","C. montelukast","D. flunisolide"],"ans":2,"exp":"Montelukast（孟魯司特）為CysLT1（半胱胺酸白三烯素受體1型）受體拮抗劑，阻斷LTD4和LTC4引起的支氣管收縮和炎症，用於小動物氣喘的預防性長期管理；是四個選項中唯一為白三烯素受體拮抗劑（leukotriene receptor antagonist, LTRA）的藥物。","we":["錯誤：Nedocromil（cromolyn類似物）為肥大細胞穩定劑（mast cell stabilizer），阻止組織胺和白三烯素的釋放，為預防性用藥；非白三烯素受體拮抗劑，作用在釋放前端（upstream），而montelukast作用在白三烯素受體（downstream）。","錯誤：Zileuton為5-脂氧合酶（5-LOX）抑制劑，阻斷白三烯素（LTs）的合成（包括LTB4、LTC4、LTD4、LTE4）；並非「受體拮抗劑」，而是合成抑制劑；montelukast和zafirlukast才是白三烯素受體（CysLT1）拮抗劑。","","錯誤：Flunisolide為吸入性糖皮質激素（ICS），透過廣效抑制炎症反應（包括白三烯素分泌減少）發揮抗哮喘作用；非白三烯素受體特異性拮抗劑，與montelukast作用機制不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_067","year":2023,"roc_year":112,"session":"","examNo":67,"q":"下列何者於呼吸系統用藥分類中並非屬於止咳劑（antitussives）？","opts":["A. butorphanol","B. tramadol","C. dextromethorphan","D. guaifenesin"],"ans":3,"exp":"Guaifenesin（愈創甘油醚）為祛痰劑（expectorant/mucolytic），透過稀釋氣道黏液、降低黏液黏度促進痰液排出；它不作用於咳嗽反射中樞，不具有中樞或外周止咳（antitussive）效果，是四個選項中唯一「並非止咳劑」的藥物。","we":["錯誤：Butorphanol為混合型阿片受體激動-拮抗劑（κ激動/μ部分拮抗），具有顯著的中樞性止咳作用，常用於犬貓的止咳治療；屬有效的antitussive，不符合「並非止咳劑」的條件。","錯誤：Tramadol除了弱μ受體致效作用外，還抑制去甲腎上腺素和5-HT再攝取；其中樞性止咳效果確有研究支持，部分國家（台灣）也將tramadol用於止咳適應症；屬antitussive，不符合條件。","錯誤：Dextromethorphan（右美沙芬）為最常見的非處方中樞性止咳藥，作用於延髓咳嗽中樞（NMDA受體拮抗和σ受體作用），無鎮痛和成癮性；為典型antitussive，不符合「並非止咳劑」的條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_068","year":2023,"roc_year":112,"session":"","examNo":68,"q":"Phenylephrine作為鼻充血解除劑時，以下列何項腎上腺素性的藥理作用最強？","opts":["A. α1-致效劑","B. α1-拮抗劑","C. α2-致效劑","D. β2-致效劑"],"ans":0,"exp":"Phenylephrine（去氧腎上腺素）為高選擇性α1受體直接致效劑，作用於鼻黏膜血管的α1受體引起血管收縮，減少鼻黏膜充血腫脹，是鼻充血解除劑（nasal decongestant）的主要藥理機制。","we":["","錯誤：α1受體拮抗劑（如prazosin、doxazosin）會引起血管擴張（鼻黏膜充血），不是鼻充血解除劑（decongestant）的作用機制；phenylephrine恰恰相反，是α1激動劑，收縮鼻黏膜血管，減少鼻塞。","錯誤：雖α2受體致效劑（如oxymetazoline）也可收縮血管用於鼻充血，但phenylephrine主要為α1選擇性致效劑（α2活性相對低）；此外α2致效劑的反彈性充血（rebound congestion）更明顯，兩者藥理側重點不同。","錯誤：β2受體致效劑（如salbutamol/albuterol）引起支氣管擴張（bronchodilation），作用於肺部氣道；鼻黏膜的充血解除靠α1受體介導的血管收縮，β2刺激不會收縮鼻黏膜血管，與充血解除機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_069","year":2023,"roc_year":112,"session":"","examNo":69,"q":"下列抗組織胺藥物中，何者在高劑量時最可能導致馬的中樞神經系統興奮？","opts":["A. cetirizine","B. chlorpheniramine","C. diphenhydramine","D. pyrilamine"],"ans":3,"exp":"Pyrilamine（mepyramine）為第一代H1拮抗劑，在馬靜脈注射時有明顯的CNS興奮（excitation）副作用，包括驚恐、掙扎和肌肉顫抖；此特殊反應在馬中有充分的臨床記載，使其在馬的靜脈使用需謹慎；其他第一代抗組織胺藥在馬通常以鎮靜為主要CNS作用。","we":["錯誤：Cetirizine為第二代H1拮抗劑（selective, low CNS penetration），鎮靜效果極低（non-sedating antihistamine）；在高劑量時也不以CNS興奮著稱，反而可能有輕微鎮靜，不是馬CNS興奮的代表藥。","錯誤：Chlorpheniramine為第一代H1拮抗劑，主要引起鎮靜（sedation），在馬的常用劑量下不以CNS興奮為主要副作用；可穿越BBB但通常引起鎮靜而非興奮，不是本題答案。","錯誤：Diphenhydramine為第一代H1拮抗劑（苯海拉明），主要副作用為鎮靜（drowsiness）；在某些物種（馬）高劑量可見興奮，但相比pyrilamine，diphenhydramine在馬中的CNS興奮報告較少見；pyrilamine（mepyramine）在馬靜脈注射時CNS興奮反應更為突出。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_070","year":2023,"roc_year":112,"session":"","examNo":70,"q":"下列何者是造成牛食入牛毛草（fescue grass）中毒的主要毒性成分？","opts":["A. eprinomectin","B. ergonovine","C. ergotamine","D. ergovaline"],"ans":3,"exp":"高羊茅草（tall fescue）毒性來自其共生的內生菌（endophyte）Neotyphodium coenophialum（原名Acremonium coenophialum）分泌的麥角生物鹼；其中ergovaline（麥角纈胺酸）為主要毒性成分，引起「牛毛草中毒症（fescue toxicosis）」，表現為vasoconstriction（肢端壞疽/fescue foot）、產乳量下降和泌乳期延遲等。","we":["錯誤：Eprinomectin為大環內酯類抗寄生蟲藥（avermectin類），與牧草無關；牛毛草（tall fescue）毒性來自其內寄生的真菌（endophyte）產生的麥角生物鹼（ergot alkaloids），非殺寄生蟲藥物。","錯誤：Ergonovine（麥角新鹼）為子宮收縮麥角生物鹼，主要用於產後止血；雖屬麥角生物鹼家族，但牛毛草中毒的主要成分為ergovaline（而非ergonovine）；ergovaline為牛毛草內生菌的主要分泌物。","錯誤：Ergotamine為麥角真菌（Claviceps purpurea）產生的麥角生物鹼，引起麥角中毒（ergotism），與黑麥草（rye）麥角病有關；牛毛草中毒（fescue toxicosis）的致病成分是tall fescue endophyte（Neotyphodium coenophialum）產生的ergovaline，而非Claviceps的ergotamine。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_071","year":2023,"roc_year":112,"session":"","examNo":71,"q":"下列何者並非白三烯素（leukotriene）拮抗劑montelukast的臨床用途？","opts":["A. 預防過敏性皮膚炎","B. 減少支氣管痙攣","C. 預防氣喘發作","D. 治療急性氣喘發作"],"ans":3,"exp":"Montelukast為預防性（prophylactic）長期控制藥物，起效較慢（數小時），不能迅速逆轉急性支氣管收縮；急性氣喘發作需要速效支氣管擴張劑（如SABA：salbutamol/albuterol）緊急處理，montelukast「治療急性氣喘發作」的描述不正確。","we":["此為正確描述：Montelukast（白三烯素CysLT1受體拮抗劑）可減少白三烯素介導的過敏性炎症，在小動物研究中有預防過敏性皮膚炎（atopic dermatitis）的作用，特別是減少嗜酸性球浸潤；不符合「並非」的條件。","此為正確描述：Montelukast阻斷CysLT1受體，抑制白三烯素引起的支氣管收縮（bronchoconstriction），可減少支氣管痙攣（bronchospasm）的發生率，尤其在運動誘發的氣喘；不符合「並非」的條件。","此為正確描述：Montelukast為預防性（prophylactic）長期控制藥物，規律使用可降低氣喘發作頻率；與ICS（吸入性類固醇）合用為人醫氣喘管理標準方案，小動物研究也支持其預防效果；不符合「並非」的條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_072","year":2023,"roc_year":112,"session":"","examNo":72,"q":"下列何者對COX-2的選擇性最高？","opts":["A. deracoxib","B. flunixin","C. naproxen","D. ketoprofen"],"ans":0,"exp":"COX-2選擇性（COX-2 selectivity ratio）由高至低常見順序：deracoxib（~1275）> celecoxib > meloxicam > etodolac；Deracoxib為犬專用的高選擇性COX-2抑制劑（coxib類），在本題四個NSAID中COX-2選擇性最高，消化道安全性也最優。","we":["","錯誤：Flunixin為非選擇性COX抑制劑（COX-1=COX-2），主要用於馬和牛的抗炎止痛；COX-2選擇性極低，對COX-1的抑制導致消化道副作用（潰瘍）風險高，非選擇性COX-2抑制劑。","錯誤：Naproxen為非選擇性NSAID（略偏COX-1），COX-2選擇性非常低；在動物中（特別是犬）毒性較大（消化道潰瘍），非選擇性COX-2藥物。","錯誤：Ketoprofen為非選擇性COX抑制劑（同時顯著抑制COX-1和COX-2），也具有5-LOX抑制活性；COX-2選擇性低，與deracoxib（高選擇性COX-2抑制）無法相比。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_073","year":2023,"roc_year":112,"session":"","examNo":73,"q":"下列何者可消除馬匹因肌肉創傷所引起的急性腫脹？","opts":["A. dimethyl sulfoxide","B. polysulfated glycosaminoglycan","C. hyaluronic acid","D. orgotein"],"ans":0,"exp":"DMSO（二甲亞碸，dimethyl sulfoxide）為強效的自由基清除劑和抗炎藥，局部或靜脈使用可減少急性軟組織水腫和炎症；在馬的肌肉創傷急性腫脹治療中，DMSO（靜脈或局部塗抹）為傳統常用藥物，具有迅速消腫和抗炎效果。","we":["","錯誤：Polysulfated glycosaminoglycan（PSGAG，如Adequan）為關節軟骨保護劑，用於退行性關節病（DJD）和關節炎的長期管理；非用於急性肌肉創傷腫脹的治療。","錯誤：Hyaluronic acid（玻尿酸）用於關節腔內注射治療關節炎，改善關節液品質；對急性軟組織腫脹（muscle trauma swelling）無明確療效，主要作用在關節滑膜。","錯誤：Orgotein（superoxide dismutase）曾用於馬和犬的抗炎治療，清除自由基；雖有抗炎效果，但不以「消除急性肌肉創傷腫脹」為主要適應症；且orgotein在多數市場已不再使用（蛋白製劑批准問題）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_074","year":2023,"roc_year":112,"session":"","examNo":74,"q":"下列何者是抗高血壓藥物losartan藥理作用的機轉？","opts":["A. 活化AT1受體","B. 拮抗AT1受體","C. 活化AT2受體","D. 拮抗AT2受體"],"ans":1,"exp":"Losartan（氯沙坦）為血管收縮素II受體拮抗劑（ARB，angiotensin II receptor blocker），選擇性阻斷AT1受體，阻止angiotensin II引起的血管收縮、醛固酮分泌和腎小管Na⁺再吸收，降低血壓和減少心臟/腎臟後負荷，為常用的抗高血壓和腎臟保護藥物。","we":["錯誤：AT1受體活化是angiotensin II的作用，引起血管收縮、醛固酮分泌和水鈉瀦留，升高血壓；Losartan作用完全相反——阻斷AT1受體以降低血壓，「活化AT1」描述的是angiotensin II的作用而非losartan。","","錯誤：AT2受體活化通常具有血管舒張和抗增殖等「保護性」作用（與AT1相對）；losartan選擇性拮抗AT1受體，不活化AT2；阻斷AT1後AT2的相對效應確實增強，但losartan本身對AT2無直接活化作用。","錯誤：Losartan選擇性針對AT1受體，對AT2受體的拮抗活性極低（選擇性AT1 >> AT2）；拮抗AT2受體的藥物尚未廣泛用於臨床，且與losartan的抗高血壓機制（阻斷AT1）相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_075","year":2023,"roc_year":112,"session":"","examNo":75,"q":"在牛常用somatribove的目的為何？","opts":["A. 增加排卵","B. 促進泌乳","C. 增加體脂肪","D. 改善肉質"],"ans":1,"exp":"Somatribove為重組牛生長激素（recombinant bovine somatotropin, rBST），透過刺激肝臟分泌IGF-1（insulin-like growth factor-1），促進乳腺組織的乳汁合成和分泌，增加乳牛產乳量（milk production）；是美國FDA核准的唯一乳牛泌乳促進製劑（Posilac®）。","we":["錯誤：促進排卵的藥物為GnRH（gonadorelin）、LH、hCG等；Somatribove（重組牛生長激素，rBST）直接作用於肝臟促進IGF-1分泌，刺激乳腺組織，增加產乳量，而非促排卵。","","錯誤：牛生長激素（bST/somatotropin）具有促進脂肪分解（lipolytic）的代謝效果，增加游離脂肪酸可用性以支持泌乳的能量需求；somatribove使用會減少體脂肪而非增加，與描述相反。","錯誤：改善肉質（marbeling等）相關的生長促進劑為β2受體致效劑（zilpaterol、ractopamine等）或類固醇（trenbolone acetate等）；somatribove專用於提高乳牛產乳量，非肉質改善用途。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_076","year":2023,"roc_year":112,"session":"","examNo":76,"q":"下列何者之作用機制為抑制T3與T4之合成？","opts":["A. methimazole","B. metformin","C. glimepiride","D. glipizide"],"ans":0,"exp":"Methimazole（甲巰咪唑）為硫醯脲類（thioureylene）抗甲狀腺藥，透過抑制甲狀腺過氧化酶（thyroid peroxidase, TPO），阻斷碘的氧化和有機化（organification），以及iodotyrosine的偶合（coupling）；最終減少T3和T4的合成，用於犬貓的甲狀腺功能亢進（hyperthyroidism）治療。","we":["","錯誤：Metformin為biguanide類口服降血糖藥，主要機制為抑制肝臟糖質新生（hepatic gluconeogenesis），活化AMPK；與甲狀腺功能完全無關，不影響T3/T4合成。","錯誤：Glimepiride為磺酰脲類（sulfonylurea）口服降血糖藥，刺激胰臟β細胞分泌胰島素（關閉K-ATP通道）；不涉及甲狀腺激素合成，與methimazole作用系統不同。","錯誤：Glipizide為磺酰脲類降血糖藥，機制同glimepiride（K-ATP通道阻斷→胰島素分泌）；對甲狀腺過氧化酶（TPO）無作用，不影響T3/T4合成，與甲狀腺系統無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_077","year":2023,"roc_year":112,"session":"","examNo":77,"q":"下列口服降血糖藥物，何者因產生嚴重肝臟副作用而遭停用？","opts":["A. glipizide","B. pioglitazone","C. glucophage","D. troglitazone"],"ans":3,"exp":"Troglitazone為第一個上市的噻唑烷二酮類（thiazolidinedione, TZD）口服降血糖藥，透過活化PPARγ改善胰島素抵抗；上市後發現嚴重肝毒性（肝細胞壞死，多例死亡）而於1997年撤市，是因藥物性肝損傷（DILI）撤市的典型案例。","we":["錯誤：Glipizide為磺酰脲類，目前仍在臨床使用，主要副作用為低血糖，無嚴重肝毒性而被撤市的報告；仍為有效的口服降血糖藥物。","錯誤：Pioglitazone（噻唑烷二酮類，thiazolidinedione）目前仍在臨床使用；早期同類藥troglitazone因肝毒性撤市後，pioglitazone和rosiglitazone取代其位置，pioglitazone的肝毒性風險遠低於troglitazone。","錯誤：Glucophage為metformin的品牌名，仍是第一線糖尿病治療藥物，主要禁忌症為腎衰竭（乳酸中毒風險），無嚴重肝毒性問題；是最常用、最安全的口服降血糖藥之一，未撤市。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_078","year":2023,"roc_year":112,"session":"","examNo":78,"q":"下列glucocorticoid何者不用於隔日療法（alternate-day therapy）？","opts":["A. cortisone","B. prednisone","C. methylprednisolone","D. dexamethasone"],"ans":3,"exp":"隔日療法（alternate-day therapy）利用短效/中效糖皮質激素在「休息日」HPA軸恢復，以減少腎上腺皮質抑制；dexamethasone生物半衰期長（36-54小時），隔日給藥後「休息日」仍有顯著的受體佔用和HPA抑制，無法讓HPA軸有效恢復，因此不適用於隔日療法，是長效糖皮質激素中的典型例子。","we":["錯誤：Cortisone為短效糖皮質激素（生物半衰期8-12小時），隔日療法（alternate-day therapy）設計用於短效製劑，讓HPA軸在「休息日」有機會恢復；cortisone符合隔日療法適用條件，不符合「不用於隔日療法」的描述。","錯誤：Prednisone為中短效糖皮質激素（生物半衰期12-36小時），是最常用的隔日療法藥物之一；隔日口服prednisone可維持療效同時減少HPA軸抑制和長期副作用，不符合「不用於」的條件。","錯誤：Methylprednisolone為中短效製劑（生物半衰期18-36小時），可用於隔日療法；比dexamethasone更適合隔日療法，因其半衰期允許HPA軸在用藥間隔期間恢復，不符合「不用於」的條件。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_079","year":2023,"roc_year":112,"session":"","examNo":79,"q":"下列何者為治療犬隻良性攝護腺肥大的首選藥物？","opts":["A. finasteride","B. dinoprost","C. stanazolol","D. altrenogest"],"ans":0,"exp":"Finasteride（非那雄胺）為5α-還原酶（5α-reductase）抑制劑，阻斷睾固酮（testosterone）轉化為更強效的二氫睾固酮（DHT）；DHT為犬良性前列腺肥大（BPH）的主要促進因子，finasteride可縮小前列腺體積，改善排尿困難，為犬BPH的標準藥物治療選項。","we":["","錯誤：Dinoprost（PGF2α）為前列腺素類，用於黃體溶解（luteolysis）、同步發情和子宮收縮；在犬常用於治療子宮蓄膿（pyometra）和終止妊娠，不是BPH治療藥物。","錯誤：Stanazolol（stanozolol）為蛋白同化類固醇（anabolic steroid），具有雄激素活性，用於肌肉萎縮、貧血等；雄激素類反而促進前列腺肥大，不是BPH的治療藥物，使用後會加重BPH。","錯誤：Altrenogest為合成黃體素（progestogen），主要用於馬匹（母馬同步發情、維持妊娠）和豬（同步發情）；非5α還原酶抑制劑，對犬BPH無治療效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_藥理_080","year":2023,"roc_year":112,"session":"","examNo":80,"q":"動物缺乏下列何種元素時，皮膚會出現過度角化現象？","opts":["A. 鋅","B. 銅","C. 硫","D. 鈷"],"ans":0,"exp":"鋅（zinc）為多種金屬酵素的輔因子，參與皮膚角化和表皮屏障的正常維持；缺鋅（zinc deficiency）導致角化細胞分化異常，引起皮膚角化過度（hyperkeratosis）、鱗屑形成和皮膚增厚，在犬（鋅反應性皮膚病，zinc-responsive dermatosis）和反芻獸（副角化症，parakeratosis）中均有記載。","we":["","錯誤：銅（copper）缺乏引起被毛色素喪失（去色素）、被毛粗糙、貧血（因銅是ceruloplasmin的必需因子，影響鐵代謝）和骨骼異常（骨質疏鬆）；銅缺乏不以皮膚角化過度為典型表現。","錯誤：硫（sulfur）為胺基酸（methionine、cysteine）的組成成分，影響蛋白質和毛髮品質；硫缺乏可能引起被毛生長不良，但不以「皮膚角化過度（hyperkeratosis）」為主要表現；且單純硫元素缺乏在臨床較罕見。","錯誤：鈷（cobalt）是維生素B12（cobalamin）的組成元素，反芻動物鈷缺乏導致B12缺乏，引起消瘦、貧血和神經症狀（cobalt deficiency = 'wasting disease'）；不引起皮膚角化過度，非皮膚疾病的主要病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_001","year":2024,"roc_year":113,"session":"","examNo":1,"q":"下列何者最適合用來描述 danofloxacin 於治療 Mannheimia haemolytica 感染時之藥物動力學和藥效學 （PK/PD）間的關係？","opts":["A. PAE＞MIC","B. LD1/ED99","C. AUC24 /MIC","D. EC50/MIC50"],"ans":2,"exp":"Danofloxacin 屬於 fluoroquinolone 類抗生素，為濃度依賴型殺菌劑（concentration-dependent），最適合的 PK/PD 預測指標為 AUC24/MIC（AUIC），當此比值足夠大時可預測臨床療效。此指標整合了藥物暴露量與病菌最低抑制濃度，是預測 fluoroquinolone 對 M. haemolytica 治療成功率的最佳依據。","we":["你可能將 PAE（post-antibiotic effect）與 PK/PD 優化指標混淆。PAE＞MIC 描述的是抗生素撤除後仍可抑制細菌生長的時間效應，而非 fluoroquinolone 的主要 PK/PD 預測指標。","你可能將毒理學比值 LD1/ED99 誤認為 PK/PD 參數。LD1/ED99 是毒性評估指標（接近治療指數概念），與預測抗菌療效的 PK/PD 指標無關。","此為正確答案。AUC24/MIC（AUIC）是 fluoroquinolone 濃度依賴型殺菌劑最佳的 PK/PD 指標，能整合藥物暴露量與 MIC 來預測療效。","你可能將藥效學的 EC50 概念套用到抗菌 PK/PD 分析上。EC50/MIC50 並非標準化 PK/PD 指標，不用於 fluoroquinolone 療效預測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_002","year":2024,"roc_year":113,"session":"","examNo":2,"q":"下列何種類的藥品現僅被核可使用於動物？","opts":["A. glycopeptides","B. ionophores","C. ketolides","D. lincosamides"],"ans":1,"exp":"Ionophores（離子載體類，如 monensin、lasalocid、salinomycin）因對人體具有心臟毒性，目前僅核可用於動物（主要為家禽與牛隻的球蟲預防及促進生長）。Glycopeptides（如 vancomycin）、ketolides（如 telithromycin）均有人用核可；lincosamides（如 clindamycin）在人與動物皆有使用。","we":["你可能不熟悉 glycopeptides（醣肽類，如 vancomycin）的使用範圍。Glycopeptides 在人醫中仍是重要的 MRSA 治療藥物，並非僅限動物使用。","此為正確答案。Ionophores 因對人類具嚴重心臟毒性，僅核可用於動物（球蟲預防、促生長），是六大抗生素類中唯一「動物專用」的類別。","你可能將 ketolides（酮內酯類）誤認為動物專用抗生素。Ketolides（如 telithromycin）主要核可用於人類呼吸道感染，非動物專用。","你可能將 lincosamides（如 clindamycin、lincomycin）誤認為動物專用。Lincosamides 在人醫與獸醫皆有使用，並非僅限動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_003","year":2024,"roc_year":113,"session":"","examNo":3,"q":"下列何者對綠膿桿菌（ Pseudomonas aeruginosa）的療效最差？","opts":["A. amikacin","B. bacitracin","C. ciprofloxacin","D. difloxacin"],"ans":1,"exp":"Bacitracin 為多肽類抗生素，主要抑制細菌細胞壁合成（抑制 peptidoglycan 的 bactoprenol 再生），僅對革蘭氏陽性菌有效，對革蘭氏陰性菌（包括 Pseudomonas aeruginosa）無療效。Amikacin、ciprofloxacin、difloxacin 均對綠膿桿菌具有活性。","we":["你可能對 amikacin 的抗菌譜存疑。Amikacin 屬 aminoglycoside 類，對包括 P. aeruginosa 在內的革蘭氏陰性桿菌有良好療效，並非療效最差者。","此為正確答案。Bacitracin 為革蘭氏陽性菌專用抗生素，對革蘭氏陰性菌如 P. aeruginosa 幾乎無效。","你可能將 ciprofloxacin 的抗菌覆蓋範圍低估。Ciprofloxacin 是對 P. aeruginosa 療效最強的 fluoroquinolone 之一，不是療效最差的選項。","你可能不熟悉 difloxacin 的抗菌範圍。Difloxacin 屬 fluoroquinolone 類，對革蘭氏陰性菌（含 P. aeruginosa）有效，療效不差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_004","year":2024,"roc_year":113,"session":"","examNo":4,"q":"下列對於四環黴素類（tetracyclines）藥物非抗菌作用的敘述中，何者錯誤？","opts":["A. chlortetracycline 可用來預防 ciprofloxacin 所引起的凝血異常（coagulopathy）","B. doxycycline 可被用於治療貓的漿細胞足底炎（plasmacytic pododermatitis）","C. minocycline 具有軟骨細胞保護作用（chondroprotective effects）","D. oxytetracycline可用於治療新生小馬的膝外／內翻變形（angular limb deformities）"],"ans":0,"exp":"本題問的是四環黴素類「非抗菌作用」中何者描述錯誤。Chlortetracycline 用來預防 ciprofloxacin 引起的凝血異常並無文獻支持，此為錯誤描述。其他三項均有實證：doxycycline 治療貓漿細胞足底炎（plasmacytic pododermatitis）、minocycline 具軟骨細胞保護（chondroprotection）、oxytetracycline 用於矯正新生小馬肢體變形，皆屬四環黴素類已知非抗菌應用。","we":["此為正確答案（即題目問的「錯誤描述」）。Chlortetracycline 預防 ciprofloxacin 引起凝血異常並無臨床依據，是本題唯一錯誤的陳述。","此描述正確，不符合題目問的「錯誤」描述。Doxycycline 對貓漿細胞足底炎確有療效，屬四環黴素類的非抗菌應用，不應選此選項。","此描述正確，不符合題目問的「錯誤」描述。Minocycline 確實具有軟骨細胞保護作用，是其非抗菌效果之一，不應選此選項。","此描述正確，不符合題目問的「錯誤」描述。Oxytetracycline 用於治療新生小馬屈腱攣縮或肢體成角變形已有臨床記載，不應選此選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_005","year":2024,"roc_year":113,"session":"","examNo":5,"q":"下列關於抗微生物藥物交互作用的敘述，何者錯誤？","opts":["A. cimetidine可增加 chloramphenicol 與劑量相關之 leukopenia 的風險","B. ketoconazole 可加快 cyclosporin生物轉換（biotransformation）的速率","C. enrofloxacin 可上升 theophylline 的血中濃度","D. furosemide 可增加 amikacin的腎毒性"],"ans":1,"exp":"本題問的是抗微生物藥物交互作用中何者描述錯誤。Ketoconazole 是 CYP3A4 的強力「抑制劑」（inhibitor），會抑制 cyclosporin 的代謝，使其血中濃度上升（而非加快生物轉換）。其他三項均為正確描述：cimetidine 抑制肝臟代謝可能增加 chloramphenicol 毒性風險；enrofloxacin 抑制 CYP1A2 → theophylline 濃度升高；furosemide 降低 GFR 可增加 amikacin 腎毒性。","we":["你可能對 cimetidine 與 chloramphenicol 的交互作用不確定。Cimetidine 抑制肝臟 CYP 酶，可能減慢 chloramphenicol 代謝，增加骨髓毒性（白血球減少）風險，此描述正確。","此為正確答案（即題目問的「錯誤描述」）。Ketoconazole 是 CYP3A4 抑制劑，會使 cyclosporin 代謝減慢、血中濃度升高，而非「加快生物轉換」，方向完全相反。","你可能對 enrofloxacin 與 theophylline 的交互作用不確定。Enrofloxacin 抑制 CYP1A2，使 theophylline 清除減慢、血中濃度升高，此描述正確，不應選。","你可能對 furosemide 增加 amikacin 腎毒性的機制不確定。Furosemide 降低腎臟血流與 GFR，使 aminoglycoside 在腎小管聚積，增加腎毒性，此描述正確，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_006","year":2024,"roc_year":113,"session":"","examNo":6,"q":"若依病毒生活史的順序（uncoating、transcription、translation 與 shedding）排列，下列藥品作用的先\r 後順序何者正確？","opts":["A. amantadine → famciclovir → idoxuridine","B. famciclovir → oseltamivir → idoxuridine","C. idoxuridine → amantadine → oseltamivir","D. oseltamivir → amantadine → acyclovir"],"ans":0,"exp":"依照病毒生活史順序排列：(1) Uncoating（脫殼）→ amantadine（阻斷流感病毒 M2 離子通道，抑制病毒脫殼）；(2) Transcription/Replication（轉錄/複製）→ famciclovir（前驅藥，轉換為 penciclovir，抑制病毒 DNA 聚合酶）；(3) DNA synthesis/Translation（DNA 合成）→ idoxuridine（核苷類似物，嵌入病毒 DNA 合成，干擾 DNA 轉譯與複製）。因此正確排列為 amantadine → famciclovir → idoxuridine。","we":["此為正確答案。Amantadine 抑制 uncoating、famciclovir 抑制 transcription（DNA pol）、idoxuridine 干擾 DNA synthesis/translation，符合病毒生活史順序。","你可能將 famciclovir 與 oseltamivir 的作用時機混淆。Oseltamivir 抑制 neuraminidase（影響 shedding/釋放），作用發生在病毒生活史後期，而非 transcription 前。","你可能不確定 idoxuridine 的作用時機。Idoxuridine 干擾 DNA 合成，發生在 transcription/translation 階段，而非 uncoating；amantadine 才是抑制 uncoating 的藥物。","你可能將 oseltamivir 誤放在 uncoating 階段。Oseltamivir 抑制 neuraminidase（shedding 步驟），發生在生活史末期；amantadine 才是抑制 uncoating（最早期）的藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_007","year":2024,"roc_year":113,"session":"","examNo":7,"q":"下列藥品與作用酶的配對中，何者錯誤？","opts":["A. acyclovir/DNA polymerase","B. terbinafine/squalene monooxygenase","C. cilastatin/imipenemase","D. doxorubicin/topoisomeraseⅡ"],"ans":2,"exp":"本題問藥品與作用酶配對何者錯誤。Cilastatin 是腎臟去氫肽酶-I（renal dehydropeptidase-I, DHP-I）的抑制劑，用來防止 imipenem 在腎臟被 DHP-I 分解，而非抑制 imipenemase（β-lactamase）。其他配對均正確：acyclovir 抑制病毒 DNA polymerase、terbinafine 抑制 squalene monooxygenase（角鯊烯單加氧酶）、doxorubicin 抑制 topoisomerase II。","we":["你可能對 acyclovir 的酶靶點不確定。Acyclovir 被病毒胸苷激酶磷酸化後，抑制病毒 DNA polymerase，配對正確，不應選。","你可能將 squalene monooxygenase 與 squalene epoxidase 混淆。兩者指同一酵素，terbinafine 確實抑制此酶（真菌麥角固醇合成路徑），配對正確，不應選。","此為正確答案（即題目問的「錯誤配對」）。Cilastatin 抑制的是腎臟 DHP-I（防止 imipenem 在腎臟降解），而非 imipenemase（細菌 β-lactamase），兩者完全不同。","你可能對 doxorubicin 的作用酶不熟悉。Doxorubicin（anthracycline 類抗癌藥）確實抑制 topoisomerase II，導致 DNA 雙股斷裂，配對正確，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_008","year":2024,"roc_year":113,"session":"","examNo":8,"q":"有關藥物影響腎臟排泄的作用，下列何者正確？","opts":["A. 併用同屬鹼性之藥物可增加清除率","B. 氯化銨（ammonium chloride）可增加酸性藥物排除","C. 利尿劑可增加藥物在腎小管再吸收","D. 併用酸性藥物可能延長penicillin在體內的作用時間"],"ans":3,"exp":"Penicillin 主要經腎小管主動分泌排除，由有機酸轉運體（OAT）介導。若併用其他酸性藥物（如 probenecid），兩者競爭同一轉運體，使 penicillin 的腎小管分泌受阻，t½ 延長、血中濃度維持較久。這是臨床上利用 probenecid 延長 penicillin 作用的經典藥理交互作用。","we":["你可能對「同屬鹼性藥物」的競爭機制有疑問。若兩藥均為鹼性，競爭有機鹼轉運體（OCT），理論上會降低其中一者的分泌速率（不一定增加清除），描述「增加清除率」有誤，此選項描述不正確。","你可能將 ammonium chloride 的作用方向記反。Ammonium chloride 酸化尿液，使酸性藥物在酸性環境中更多以非離子型存在，反而增加再吸收（清除減少），而非增加排除。","你可能對利尿劑的影響機制有疑問。利尿劑增加尿流量，通常會「稀釋」腎小管中的藥物濃度，降低濃度梯度，從而減少被動再吸收，而非增加再吸收。","此為正確答案。酸性藥物（如 probenecid）與 penicillin 競爭 OAT 轉運體，抑制 penicillin 腎小管分泌，延長其在體內的作用時間，是臨床常見的有益藥物交互作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_009","year":2024,"roc_year":113,"session":"","examNo":9,"q":"相較於成年動物，新生動物在藥物動力學的表現上，下列敘述何者錯誤？","opts":["A. 腎臟排除藥物之能力較差","B. 肝臟代謝藥物之能力較差","C. 藥物血漿蛋白結合率較高","D. 血腦障壁通透性較佳"],"ans":2,"exp":"本題問的是新生動物相較於成年動物，藥物動力學特性何者描述錯誤。新生動物血漿白蛋白濃度較低（低蛋白血症），藥物「血漿蛋白結合率較低」（而非較高），因此游離藥物濃度較高，更易分布至組織並產生藥理效應或毒性。其他描述均正確：新生兒腎排除能力差（GFR 低）、肝臟代謝能力差（CYP 酶未成熟）、血腦障壁通透性較佳（尚未完全發育）。","we":["你可能不確定新生動物的腎功能狀態。新生動物 GFR 明顯低於成年動物，腎排除能力確實較差，此描述正確，不應選。","你可能對新生動物肝臟代謝能力有疑問。新生動物 CYP450 等代謝酶尚未完全成熟，肝臟代謝能力確實較差，此描述正確，不應選。","此為正確答案（即題目問的「錯誤描述」）。新生動物血漿蛋白（尤其白蛋白）濃度低，蛋白結合率較低（不是較高），導致游離藥物增多，毒性風險上升。","你可能不確定新生動物血腦障壁的發育程度。新生動物血腦障壁尚未完全成熟，通透性確實較成年動物高，此描述正確，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_010","year":2024,"roc_year":113,"session":"","examNo":10,"q":"下列抗真菌藥物何者為治療馬真菌性角膜炎（keratomycosis）的首選藥物？","opts":["A. nystatin","B. clotrimazole","C. mefenoxam","D. natamycin"],"ans":3,"exp":"Natamycin（匹馬菌素/那他黴素）是多烯類（polyene）抗真菌藥，與麥角固醇結合破壞真菌細胞膜，是目前核可用於治療馬真菌性角膜炎（keratomycosis，常見病原如 Aspergillus、Fusarium）的首選局部眼用製劑。Nystatin 因全身毒性大、僅限局部；clotrimazole 為 azole 類；mefenoxam 為植物用殺真菌劑，不用於動物眼科。","we":["你可能將 nystatin 與 natamycin 混淆，兩者同為多烯類。Nystatin 毒性較大，主要用於皮膚與黏膜的念珠菌感染，並非馬眼科真菌感染首選，且目前無商業化眼用製劑。","你可能對 clotrimazole 的適應症有疑問。Clotrimazole 屬 azole 類抗真菌藥，主要用於皮膚及耳道感染，不是馬真菌性角膜炎的首選。","你可能不熟悉 mefenoxam 的用途。Mefenoxam 是植物用殺卵菌劑（屬苯基醯胺類），用於農業，無動物眼科用途，不應選。","此為正確答案。Natamycin 是唯一 FDA 核可用於眼科的抗真菌藥，對馬真菌性角膜炎（Aspergillus、Fusarium）療效最佳，為首選局部眼用製劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_011","year":2024,"roc_year":113,"session":"","examNo":11,"q":"下列有關藥品經皮膚吸收（transdermal absorption）的敘述，何者錯誤？","opts":["A. 開始產生藥理作用的時間常較皮下注射慢","B. Fentanyl可經由皮膚吸收","C. 藥品亦可經由汗腺與皮脂腺的出口吸收","D. Dimethyl sulfoxide無法增加藥物對皮膚的滲透性"],"ans":3,"exp":"本題問的是經皮膚吸收描述何者錯誤。DMSO（二甲基亞碸）是著名的「皮膚穿透促進劑」，能增加藥物對皮膚的滲透性，本身也能快速穿透皮膚，並攜帶其他藥物一同穿透，因此「DMSO 無法增加藥物對皮膚的滲透性」為錯誤描述。其他選項均正確：transdermal 給藥通常較皮下注射慢、fentanyl 有貼片劑型、汗腺與皮脂腺可作為藥物吸收途徑。","we":["你可能對 transdermal 與皮下注射的起效時間比較有疑問。Transdermal 需要藥物穿透多層皮膚屏障（角質層），起效確實比皮下注射慢，此描述正確，不應選。","你可能不確定 fentanyl 是否能經皮膚吸收。Fentanyl 貼片（patch）是臨床常見的 transdermal 製劑，親脂性高，可有效經皮吸收，此描述正確，不應選。","你可能不確定汗腺與皮脂腺是否為藥物吸收通路。汗腺管與皮脂腺出口確實可作為「旁路途徑」（shunt pathway）增加藥物進入，此描述正確，不應選。","此為正確答案（即題目問的「錯誤描述」）。DMSO 是強效皮膚滲透促進劑，能顯著增加多種藥物穿透皮膚的能力，在獸醫臨床也作為局部藥物載體使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_012","year":2024,"roc_year":113,"session":"","examNo":12,"q":"某藥物在動物體內的主要代謝方式是經由細胞色素P450（cytochrome P450s）氧化酶的氧化，則當動物肝臟\r 發生嚴重損傷時，對該藥物之作用時間的影響為何？","opts":["A. 作用時間延長","B. 作用時間縮短","C. 作用時間不變","D. 證據不足以判斷"],"ans":0,"exp":"若藥物主要由 CYP450 氧化酶進行肝臟首過代謝，嚴重肝損傷（如肝硬化、急性肝衰竭）會導致 CYP450 酶活性顯著下降，藥物代謝速率減慢，在體內的半衰期（t½）延長，作用時間隨之延長，並可能產生蓄積毒性。","we":["此為正確答案。嚴重肝損傷使 CYP450 酶活性下降 → 代謝減慢 → 藥物蓄積 → 作用時間延長，這是肝功能不全時調整劑量的重要依據。","你可能誤以為肝損傷會加速藥物消除。事實上，CYP450 功能受損時代謝能力下降，而非上升，因此作用時間延長而非縮短。","你可能認為肝臟有代償機制使代謝不受影響。嚴重肝損傷時，代謝功能顯著下降，藥物作用時間確實會延長，而非不變。","你可能認為肝損傷對 CYP450 代謝藥物的影響難以預測。雖然輕度肝病影響不一致，但「嚴重」肝損傷的結果相對明確：代謝減慢、作用延長，選「證據不足」並不恰當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_013","year":2024,"roc_year":113,"session":"","examNo":13,"q":"已知乳汁的pH值較血漿的pH值低，將某藥物投予母獸，當該藥物於母獸體內的分布達到平衡時，可於其乳汁\r 中測得該藥品，則下列敘述何者正確？","opts":["A. 藥物若為弱鹼性，則血漿中的藥物濃度大於乳汁中的藥物濃度","B. 藥物若為弱鹼性，則血漿中的藥物濃度小於乳汁中的藥物濃度","C. 藥物若為弱鹼性，則血漿中的藥物濃度等於乳汁中的藥物濃度","D. 乳汁中的藥物濃度與藥物的酸鹼性無關"],"ans":1,"exp":"乳汁 pH（約 6.5）低於血漿 pH（約 7.4）。弱鹼性藥物在血漿（高 pH）中主要以非離子型（脂溶性）存在，可自由擴散穿越乳腺上皮；進入乳汁（低 pH）後，弱鹼性藥物被質子化（ionized），離子型不易回滲入血漿，產生「離子捕獲（ion trapping）」效應，使藥物在乳汁中蓄積。因此弱鹼性藥物的乳汁濃度大於血漿濃度（血漿 < 乳汁）。","we":["你可能對弱鹼藥物在不同 pH 的分布方向記反。弱鹼性藥物在較低 pH 的乳汁中被離子化捕獲，乳汁濃度反而高於血漿，而非血漿高於乳汁。","此為正確答案。弱鹼性藥物因離子捕獲效應在低 pH 乳汁中蓄積，血漿濃度小於乳汁濃度，此為「milk trapping」的經典機制。","你可能認為藥物在兩側達到平衡時濃度應相等。但 ion trapping 效應使離子型藥物無法自由回滲，造成乳汁中藥物濃度高於血漿，並非兩側相等。","你可能認為藥物在乳汁中的分布與酸鹼性無關。事實上，weak acid/base 藥物的分布受 pH 影響顯著（Henderson-Hasselbalch 方程式），酸鹼性是決定乳汁濃度的關鍵因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_014","year":2024,"roc_year":113,"session":"","examNo":14,"q":"下列何者為神經胺酸酶抑制劑，可控制流行性感冒病毒，亦可對抗犬小病毒感染？","opts":["A. idoxuridine","B. zidovudine","C. oseltamivir","D. famciclovir"],"ans":2,"exp":"Oseltamivir 為神經胺酸酶（neuraminidase）抑制劑，除可控制流感病毒外，研究也顯示其對犬小病毒（Canine Parvovirus, CPV）感染有一定療效，因為 CPV 表面也具有類神經胺酸酶活性。Idoxuridine 為嘧啶核苷類似物（干擾 DNA 合成）；zidovudine（AZT）為反轉錄酶抑制劑；famciclovir 為疱疹病毒 DNA 聚合酶抑制劑，均與神經胺酸酶無關。","we":["你可能將 idoxuridine 誤認為神經胺酸酶抑制劑。Idoxuridine 是核苷類似物，干擾病毒 DNA 合成，主要用於局部疱疹感染，與神經胺酸酶抑制無關。","你可能將 zidovudine（AZT）誤認為神經胺酸酶抑制劑。Zidovudine 是反轉錄酶（reverse transcriptase）抑制劑，用於 HIV/FIV 治療，作用機制完全不同。","此為正確答案。Oseltamivir 為神經胺酸酶抑制劑，除抗流感外，也被用於輔助治療犬小病毒感染（CPV 具類似神經胺酸酶活性）。","你可能將 famciclovir 誤認為神經胺酸酶抑制劑。Famciclovir 為前驅藥，體內轉換為 penciclovir 後抑制疱疹病毒 DNA 聚合酶，與神經胺酸酶無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_015","year":2024,"roc_year":113,"session":"","examNo":15,"q":"下列那一種抗微生物藥物之作用屬於抑菌性之機制？","opts":["A. sulfamethazine","B. vancomycin","C. cephalexin","D. imipenem"],"ans":0,"exp":"Sulfamethazine 屬磺胺類（sulfonamide），藉由競爭性抑制二氫蝶酸合成酶（dihydropteroate synthase）阻斷葉酸合成，屬「抑菌性（bacteriostatic）」機制。Vancomycin 抑制細胞壁肽聚糖合成（殺菌）；cephalexin 為 β-lactam，抑制 PBP（殺菌）；imipenem 為 carbapenem（殺菌）。磺胺類是典型的抑菌劑，需依賴宿主免疫系統清除細菌。","we":["此為正確答案。Sulfamethazine 為磺胺類，透過競爭性抑制葉酸合成達到抑菌效果（bacteriostatic），是正確答案。","你可能不確定 vancomycin 的殺菌機制。Vancomycin 屬 glycopeptide，與 D-Ala-D-Ala 結合，抑制細胞壁合成，為殺菌性（bactericidal），不是抑菌性藥物。","你可能對 cephalexin 的殺菌/抑菌性質有疑問。Cephalexin 屬第一代 cephalosporin（β-lactam），抑制 PBP，導致細胞壁合成失敗，為殺菌性藥物。","你可能不確定 imipenem 的作用性質。Imipenem 屬 carbapenem（β-lactam），對 PBP 親和力強，廣效殺菌，並非抑菌劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_016","year":2024,"roc_year":113,"session":"","examNo":16,"q":"Fluoroquinolones之作用機制主要為抑制細菌那一成分之功能？","opts":["A. protein synthetase","B. DNA gyrase","C. aminoacyl tRNA synthetase","D. thymidylate synthase"],"ans":1,"exp":"Fluoroquinolones（氟喹諾酮類）的主要作用靶點是細菌 DNA gyrase（拓撲異構酶 II）及 topoisomerase IV。DNA gyrase 負責 DNA 超螺旋的放鬆，受抑制後 DNA 複製停止，進而造成細菌死亡。此機制也是 fluoroquinolone 耐藥性常見突變（gyrA/gyrB 基因突變）的基礎。","we":["你可能將 fluoroquinolone 誤認為作用於 protein synthetase（核醣體）。作用於核醣體的抗生素包括 aminoglycosides、tetracyclines、macrolides 等，fluoroquinolone 的靶點為 DNA 而非核醣體。","此為正確答案。Fluoroquinolones 抑制細菌 DNA gyrase（topoisomerase II）及 topoisomerase IV，阻止 DNA 解旋與複製，為殺菌性機制。","你可能將 fluoroquinolone 與 mupirocin 混淆。Mupirocin 抑制 isoleucyl-tRNA synthetase（aminoacyl-tRNA synthetase），作用於蛋白質合成，而非 fluoroquinolone 的靶點。","你可能將 fluoroquinolone 與 trimethoprim 的作用混淆。Trimethoprim 抑制 dihydrofolate reductase，進而影響 thymidylate 合成，而 thymidylate synthase 是不同的酶，也非 fluoroquinolone 靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_017","year":2024,"roc_year":113,"session":"","examNo":17,"q":"臨床上，抗微生物藥物enrofloxacin主要使用於治療犬、貓之皮膚、呼吸道及下列那一組織之感染症？","opts":["A. 泌尿道","B. 消化道","C. 眼睛結膜","D. 關節"],"ans":0,"exp":"Enrofloxacin 在犬貓的主要核可適應症包括皮膚感染、呼吸道感染及泌尿道感染。Enrofloxacin 在尿液中以活性代謝物（ciprofloxacin）排除，尿液濃度高，對泌尿道病原菌（如大腸桿菌）療效佳，是核可的三大適應症之一。消化道感染並非主要核可適應症；眼結膜感染需特殊眼用劑型；關節感染有軟骨毒性風險限制。","we":["此為正確答案。Enrofloxacin 在犬貓的核可適應症包括皮膚、呼吸道及泌尿道感染，泌尿道是重要適應症之一。","你可能認為消化道感染也是 enrofloxacin 的主要適應症。Enrofloxacin 雖對腸道病原菌有效，但消化道感染並非其主要核可用途，且腸道可能有菌叢影響及吸收問題。","你可能認為 enrofloxacin 主要用於眼結膜感染。眼科用 fluoroquinolone（如 ciprofloxacin 眼藥水）需要特定眼用劑型，全身性 enrofloxacin 並非眼結膜感染的主要適應症。","你可能認為關節感染是 enrofloxacin 的適應症。Fluoroquinolone 在幼年動物中有軟骨毒性風險（關節病變），且關節感染有更適合的用藥，不是 enrofloxacin 的主要核可用途。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_018","year":2024,"roc_year":113,"session":"","examNo":18,"q":"下列那一頭孢菌素類（cephalosporins）藥物可耐酸，因此可以經口給藥？","opts":["A. cephapirin","B. cephalexin","C. cephalothin","D. cefoxitin"],"ans":1,"exp":"口服頭孢菌素必須耐胃酸（acid-stable）才能維持口服生體可用率。Cephalexin 為第一代頭孢菌素，具酸穩定性，可口服給藥，是最常見的口服 cephalosporin。Cephapirin 與 cephalothin 為注射劑型（酸不穩定）；cefoxitin 為第二代注射劑型，酸敏感，不宜口服。","we":["你可能將 cephapirin 誤認為可口服。Cephapirin 主要用於注射（靜脈或乳房內），因為對胃酸不穩定，口服吸收差。","此為正確答案。Cephalexin 具有耐酸性（acid-stable），可口服後在消化道吸收，是最常用的口服第一代 cephalosporin。","你可能將 cephalothin 誤認為可口服。Cephalothin 對胃酸不穩定，僅供靜脈注射使用，口服吸收不佳。","你可能將 cefoxitin 誤認為可口服。Cefoxitin 為第二代 cephalosporin，主要供注射使用，對酸不穩定，不宜口服。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_019","year":2024,"roc_year":113,"session":"","examNo":19,"q":"下列那一藥物能有效的對抗革蘭氏陽性及陰性之好氧性及厭氧性細菌， 因而可使用於腸內容物溢出引起之\r 嚴重感染？","opts":["A. cephalexin","B. oxacillin","C. imipenem","D. gamithromycin"],"ans":2,"exp":"腸內容物溢出引起的嚴重腹膜炎為多重菌混合感染（革蘭氏陽性、革蘭氏陰性、好氧、厭氧菌皆有），需要廣效抗生素。Imipenem 屬 carbapenem 類，抗菌譜最廣（涵蓋 G+、G-、好氧、厭氧），是處理此類嚴重混合感染的適當選擇。Cephalexin 僅 G+、好氧；oxacillin 為抗葡萄球菌 penicillin，窄譜；gamithromycin 為大環內酯類（主要呼吸道用）。","we":["你可能認為 cephalexin 足以覆蓋腸溢出感染。Cephalexin 為第一代頭孢菌素，主要對革蘭氏陽性菌有效，無法覆蓋腸道厭氧菌與革蘭氏陰性菌，不適用。","你可能認為 oxacillin 適合治療混合感染。Oxacillin 為抗葡萄球菌（anti-staphylococcal）penicillin，僅對 G+ 球菌（尤其 MSSA）有效，抗菌譜過窄。","此為正確答案。Imipenem（carbapenem）具最廣抗菌譜，可覆蓋腸溢出後的多重混合感染（好氧/厭氧、G+/G-），是嚴重腹膜炎的適當選擇。","你可能認為 gamithromycin 適合治療腹腔感染。Gamithromycin 屬 macrolide 類，主要核可用於牛的呼吸道感染，對腸道混合感染的厭氧菌覆蓋不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_020","year":2024,"roc_year":113,"session":"","examNo":20,"q":"Florfenicol較不會引起下列何種不良反應？","opts":["A. 再生不良性貧血","B. 厭食","C. 腹瀉","D. 醫源性內毒素中毒症"],"ans":0,"exp":"Florfenicol 是 chloramphenicol 的含氟衍生物，結構上缺少造成再生不良性貧血（aplastic anemia）的 para-NO2 基團，因此幾乎不引起骨髓毒性所致的再生不良性貧血，這是 florfenicol 相較於 chloramphenicol 的主要安全性優勢。其他副作用如厭食、腹瀉、醫源性內毒素中毒症（大量細菌死亡釋放 LPS）則兩者均可能發生。","we":["此為正確答案。Florfenicol 因缺少 para-NO2 基團，不引起再生不良性貧血，這是其相對於 chloramphenicol 最重要的安全性差異。","你可能認為 florfenicol 不會引起厭食。Florfenicol 確實可能引起厭食（食慾下降）等消化道副作用，此選項描述不符合「較不會引起」的條件。","你可能認為 florfenicol 不會引起腹瀉。Florfenicol 可影響腸道菌叢，引起腹瀉，因此此副作用確實存在，不符合「較不會引起」的描述。","你可能認為 florfenicol 不會引起醫源性內毒素中毒症。大量細菌被殺死時可能釋放 LPS，進而引發內毒素中毒症，此副作用與 florfenicol 使用有關，不符合「較不會引起」的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_021","year":2024,"roc_year":113,"session":"","examNo":21,"q":"下列何者為 P-glycoprotein transporters的誘發劑，因而干擾口服 P-glycoprotein substrates的生體可用率（bioavailability）？","opts":["A. lincomycin","B. rifampin","C. tylosin","D. tiamulin"],"ans":1,"exp":"P-glycoprotein（P-gp）是腸道與組織中的外排轉運體，會將口服藥物泵回腸腔，降低生體可用率。Rifampin 是強力 P-gp 及 CYP3A4 誘發劑，能誘導腸道 P-gp 表現量增加，使 P-gp 受質（substrate）的口服吸收顯著降低。Lincomycin、tylosin、tiamulin 均無 P-gp 誘發作用。","we":["你可能認為 lincomycin 具有 P-gp 誘發作用。Lincomycin 屬 lincosamide 類，無 P-gp 或 CYP3A4 誘發效果，不影響 P-gp substrate 的生體可用率。","此為正確答案。Rifampin 是強力 P-gp 與 CYP3A4 誘發劑，增加 P-gp 表現 → P-gp substrate 腸道外排增加 → 口服生體可用率降低。","你可能認為 tylosin 具有 P-gp 誘發作用。Tylosin 屬大環內酯類，主要用於牛豬禽的呼吸道和消化道感染，無 P-gp 誘發特性。","你可能認為 tiamulin 具有 P-gp 誘發作用。Tiamulin 屬 pleuromutilin 類，抑制細菌核醣體，無 P-gp 誘發效果，甚至可能是 P-gp 抑制劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_022","year":2024,"roc_year":113,"session":"","examNo":22,"q":"下列何者可以增加methenamine在泌尿道的治療效果？","opts":["A. ammonium chloride","B. sodium bicarbonate","C. propranolol","D. potassium citrate"],"ans":0,"exp":"Methenamine（烏洛托品）在酸性環境（尿液 pH < 5.5）下水解產生甲醛（formaldehyde），甲醛為真正的抗菌物質，可殺死泌尿道細菌。Ammonium chloride 是尿液酸化劑，能降低尿液 pH，促進 methenamine 水解產甲醛，增強療效。Sodium bicarbonate 及 potassium citrate 會鹼化尿液（提高 pH），使 methenamine 無法水解，降低療效；propranolol 為 β 受體阻斷劑，與本題無關。","we":["此為正確答案。Ammonium chloride 酸化尿液（↓pH），使 methenamine 水解為甲醛，增強其在泌尿道的抗菌效果。","你可能認為 sodium bicarbonate 能增加 methenamine 療效。Sodium bicarbonate 鹼化尿液（↑pH），抑制 methenamine 水解，反而降低療效，不應選。","你可能認為 propranolol 與 methenamine 有協同作用。Propranolol 是 β 受體阻斷劑，用於心血管疾病，與 methenamine 的抗菌機制完全無關。","你可能認為 potassium citrate 能增加 methenamine 療效。Potassium citrate 鹼化尿液，與 sodium bicarbonate 類似，會降低 methenamine 療效，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_023","year":2024,"roc_year":113,"session":"","examNo":23,"q":"對於犬隻分離出犬小孢黴菌（ Microsporum canis）之皮膚癬菌感染症，下列何者的藥效最佳？","opts":["A. 局部塗抹mupirocin","B. 口服terbinafine","C. 局部塗抹zidovudine","D. 肌肉注射pramoxine"],"ans":1,"exp":"Microsporum canis 為犬貓最常見的皮膚癬菌（dermatophyte），Terbinafine 為 allylamine 類抗真菌藥，抑制 squalene monooxygenase（角鯊烯單加氧酶），對皮膚癬菌具殺菌活性（fungicidal），口服後在毛囊及角質層濃度高，療效最佳。Mupirocin 為抗細菌藥（對真菌無效）；zidovudine 為抗病毒藥；pramoxine 為局部麻醉劑，均非抗真菌藥。","we":["你可能認為局部 mupirocin 可治療皮膚癬菌感染。Mupirocin 是抗細菌藥物（抑制 isoleucyl-tRNA synthetase），對真菌無效，不能用於皮膚癬菌治療。","此為正確答案。口服 terbinafine 對 M. canis 皮膚癬菌具殺菌活性，組織穿透力強，是犬皮膚癬菌感染的最佳選擇。","你可能認為局部 zidovudine 可治療皮膚癬菌感染。Zidovudine（AZT）是核苷類反轉錄酶抑制劑（抗 HIV/FIV），無抗真菌活性，不能用於皮膚癬菌治療。","你可能認為肌肉注射 pramoxine 可治療皮膚癬菌感染。Pramoxine 是局部麻醉劑，用於止癢或止痛，無任何抗真菌活性，且不以肌注方式給藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_024","year":2024,"roc_year":113,"session":"","examNo":24,"q":"G蛋白偶聯受體（G-protein coupled receptor）訊息傳導的主要特徵為何？","opts":["A. 反應時間極短（毫秒內）","B. 訊息活化可持續數小時到數天","C. 放大訊息","D. 受體磷酸化"],"ans":2,"exp":"G 蛋白偶聯受體（GPCR）訊號傳導的主要特徵是「訊號放大（signal amplification）」：一個配體-受體複合物可活化多個 G 蛋白，每個 G 蛋白再活化多個效應酶（如 adenylyl cyclase），產生大量第二傳訊者（如 cAMP），形成瀑布式放大效應。反應時間屬秒至分鐘級（不是毫秒）；持續時間為分鐘至數小時（不是數天）；受體磷酸化是脫敏機制，非主要訊號特徵。","we":["你可能將 GPCR 反應時間與離子通道混淆。毫秒級反應時間屬於配體門控離子通道（如 nAChR、GABA-A），GPCR 透過第二傳訊者系統，反應時間較慢（秒至分鐘）。","你可能認為 GPCR 訊號可持續數小時到數天。持續數天的效應通常屬核受體（nuclear receptor）訊號（基因轉錄調控），GPCR 訊號持續時間較短（分鐘至數小時），不應選。","此為正確答案。GPCR 的核心特徵是訊號放大：一個受體 → 多個 G 蛋白 → 大量第二傳訊者（cAMP/IP3/DAG）→ 瀑布式效應放大。","你可能認為受體磷酸化是 GPCR 主要訊號傳導特徵。受體磷酸化（由 GRK 執行）是 GPCR 脫敏（desensitization）機制，與訊號放大的「主要特徵」不同，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_025","year":2024,"roc_year":113,"session":"","examNo":25,"q":"下列何者非預防心絲蟲幼蟲（L4）的殺滅劑？","opts":["A. melarsomine","B. milbemycin","C. moxidectin","D. ivermectin"],"ans":0,"exp":"本題問哪一個「不是」預防心絲蟲幼蟲（L4）殺滅劑。Melarsomine 是有機砷類化合物，為「成蟲殺滅劑（adulticide）」，用於殺滅成熟心絲蟲（adult Dirofilaria immitis），不用於預防 L4 幼蟲。Milbemycin、moxidectin、ivermectin 均屬 macrocyclic lactone 類，能殺滅 L3/L4 幼蟲，為預防性用藥。","we":["此為正確答案（即題目問的「不是」預防 L4 殺滅劑）。Melarsomine 是有機砷類成蟲殺滅劑，用於殺成蟲，而非預防幼蟲感染。","你可能認為 milbemycin 不能殺滅 L4 幼蟲。Milbemycin（大環內酯類）可有效殺滅心絲蟲 L3/L4 幼蟲，是常用的每月預防藥物，它確實是 L4 殺滅劑，不應選。","你可能認為 moxidectin 不能殺滅 L4 幼蟲。Moxidectin（大環內酯類）可殺滅 L3/L4 幼蟲，有 6 個月長效劑型（ProHeart），確實是 L4 殺滅劑，不應選。","你可能認為 ivermectin 不能殺滅 L4 幼蟲。Ivermectin（大環內酯類）為最早核可的心絲蟲預防藥物，可殺滅 L3/L4 幼蟲，確實是 L4 殺滅劑，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_026","year":2024,"roc_year":113,"session":"","examNo":26,"q":"下列有關抗寄生蟲藥物之敘述，何者最適當？","opts":["A. imidacloprid與permethrin併用於貓","B. imidacloprid與permethrin併用可殺滅犬外寄生蟲","C. nitenpyram於狗的使用方式為肌肉注射給予","D. 經口投予transcutol 4～6週可控制家禽排泄物中的蛆"],"ans":1,"exp":"Imidacloprid + permethrin 的複合外用製劑在犬身上可有效對抗多種外寄生蟲（跳蚤、蜱、蚊、沙蚤等）；但 permethrin 對貓具有嚴重毒性（可引起致命性顫抖與痙攣），絕對禁止用於貓。Nitenpyram 為口服錠劑（非肌肉注射）；transcutol 為穿透促進劑賦形劑，非獨立驅蟲用途。","we":["你可能不確定 imidacloprid+permethrin 是否可用於貓。Permethrin 對貓有嚴重神經毒性（因貓葡萄糖醛酸化代謝能力不足），本複合製劑明確禁止用於貓，此選項錯誤。","此為正確答案。Imidacloprid+permethrin 複合製劑在犬身上可殺滅多種外寄生蟲（跳蚤、蜱等），是犬的合法外用殺蟲劑。","你可能認為 nitenpyram 可以肌肉注射給藥。Nitenpyram 是口服錠劑（快速殺跳蚤，30 分鐘內起效），並無注射劑型，肌注描述有誤，不應選。","你可能不確定 transcutol 的用途。Transcutol（diethylene glycol monoethyl ether）是藥物賦形劑中的皮膚穿透促進劑，本身並無驅蟲活性，不用於控制蠅幼蟲（蛆），此描述有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_027","year":2024,"roc_year":113,"session":"","examNo":27,"q":"藥物之治療指數（therapeutic index）愈大，則其主要意義為：","opts":["A. 藥物對大多數之動物有效","B. 藥物之排除迅速","C. 藥物安全性較高","D. 藥物作用可達最大之藥效"],"ans":2,"exp":"治療指數（Therapeutic Index, TI）= TD50 / ED50，代表中毒劑量（50% 動物出現毒性）與有效劑量（50% 動物有效）之比值。TI 愈大，表示有效劑量與毒性劑量之間的「安全範圍」愈大，用藥安全性愈高。TI 大小與藥物的效力（efficacy）、排除速率、或對所有動物的有效性無直接關係。","we":["你可能認為 TI 大代表對大多數動物有效。TI 的大小反映安全範圍，而非藥物有效率（efficacy）；高 TI 不表示藥物對更多動物有效。","你可能認為 TI 大代表排除迅速。藥物的消除速率（clearance、t½）與 TI 是獨立的藥理學指標，TI 大並不意味著藥物排除快。","此為正確答案。TI = TD50/ED50，TI 愈大 → 有效劑量與毒性劑量間距愈大 → 用藥安全性愈高，過量風險愈低。","你可能認為 TI 大代表藥效可達最大值。最大藥效（Emax）是固有效能（intrinsic efficacy）的概念，與 TI 的安全性指標無關，TI 大不保證能達到最大藥效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_028","year":2024,"roc_year":113,"session":"","examNo":28,"q":"下列何者不會活化跳蚤菸鹼性受體，導致神經元及肌肉過度活化，伴隨發生麻痺？","opts":["A. spinosad","B. nitenpyram","C. imidacloprid","D. amitraz"],"ans":3,"exp":"本題問哪一個藥物「不會」活化跳蚤菸鹼性乙醯膽鹼受體（nAChR）導致神經肌肉過度活化麻痺。Amitraz 屬甲醯胺類（formamidine）殺蟲劑/殺蟎劑，其機制為 α2-腎上腺素受體致效劑及 MAO 抑制劑，並不活化 nAChR。Spinosad、nitenpyram、imidacloprid 均為 neonicotinoid 或 spinosyn 類，靶點為昆蟲 nAChR，可引起持續神經過度活化而麻痺。","we":["你可能認為 spinosad 不活化 nAChR。Spinosad 屬 spinosyn 類，作用於昆蟲 nAChR 及 GABA 受體，引起神經過度活化，它確實活化 nAChR，不應選。","你可能認為 nitenpyram 不活化 nAChR。Nitenpyram 屬 neonicotinoid 類，選擇性結合昆蟲 nAChR（agonist），引起持續去極化麻痺，它確實活化 nAChR，不應選。","你可能認為 imidacloprid 不活化 nAChR。Imidacloprid 是 neonicotinoid 類的代表藥物，選擇性結合昆蟲 nAChR，引起昆蟲神經過度興奮，它確實活化 nAChR，不應選。","此為正確答案（即題目問的「不會活化 nAChR」）。Amitraz 是 α2-adrenergic agonist 及 MAO 抑制劑，作用機制與 nAChR 無關，不引起菸鹼性受體介導的神經肌肉過度活化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_029","year":2024,"roc_year":113,"session":"","examNo":29,"q":"寵物鳥糞便檢出毛細線蟲屬（ Capillaria spp.）蟲卵，可用下列何者驅除之？","opts":["A. permethrin","B. promethazine","C. levamisole","D. misoprostol"],"ans":2,"exp":"Capillaria spp.（毛細線蟲）為鳥類常見腸道或呼吸道線蟲，Levamisole 屬 imidazothiazole 類驅蟲劑，作用機制為昆蟲/蠕蟲神經肌肉接點（NMJ）的 nAChR 致效劑，引起持續肌肉痙攣導致線蟲麻痺並排出。Permethrin 為殺蟲/殺蟎劑（非驅線蟲）；promethazine 為抗組織胺；misoprostol 為前列腺素類似物（胃腸道用藥）。","we":["你可能認為 permethrin 可驅除鳥類 Capillaria。Permethrin 是擬除蟲菊酯類殺蟲劑，用於外寄生蟲（蟲、蜱），對腸道線蟲（Capillaria）無效。","你可能認為 promethazine 可驅除鳥類 Capillaria。Promethazine 是第一代抗組織胺（H1 拮抗劑），用於過敏及止吐，無任何驅蟲活性，不應選。","此為正確答案。Levamisole 為 nAChR agonist，對線蟲具麻痺殺蟲效果，是治療鳥類 Capillaria spp. 感染的有效驅蟲劑。","你可能認為 misoprostol 可驅除鳥類 Capillaria。Misoprostol 是 PGE1 類似物，主要用於胃腸道黏膜保護及子宮收縮，無驅蟲活性，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_030","year":2024,"roc_year":113,"session":"","examNo":30,"q":"複選題\n30.下列何者可被活性炭（activated charcoal）所吸收？","opts":["A. cyanide","B. lithium","C. malathion","D. tetracycline"],"ans":0,"exp":"活性炭（activated charcoal）能有效吸附多種有機毒物。在本題選項中，cyanide（氰化物）可被活性炭吸附（雖效果有限，但在選項中為最佳選擇）。Lithium 為金屬離子，帶電荷，活性炭不能吸附金屬離子；malathion 為有機磷殺蟲劑，某些研究顯示活性炭對有機磷吸附效果不佳；tetracycline 具有螯合金屬的特性且活性炭對其吸附效果有限，且臨床上中毒情形少見。","we":["此為正確答案。Cyanide 可被活性炭吸附，是本題選項中活性炭最能有效處理的毒物；活性炭對有機毒物的吸附能力通常優於金屬離子。","你可能認為活性炭能吸附 lithium。Lithium 為帶電金屬離子（Li+），活性炭無法吸附離子型物質，是活性炭禁忌/無效的典型毒物，不應選。","你可能認為活性炭能有效吸附 malathion。雖然 malathion 是有機物，但有機磷類對活性炭的吸附效果普遍不佳，且活性炭無法逆轉已形成的膽鹼酯酶抑制，不應選。","你可能認為活性炭能有效吸附 tetracycline。Tetracycline 雖為有機物，但其螯合特性使吸附複雜；且在本題中 cyanide 是更明確的可被活性炭吸附的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_031","year":2024,"roc_year":113,"session":"","examNo":31,"q":"下列有關動物用藥品之停藥期的敘述，何者錯誤？","opts":["A. 牛乳棄乳期是以「小時」計算","B. 胺基醣苷類口服較注射的停藥期短","C. 屠體的停藥期是以「日」計算","D. 依法定濃度添加含藥物飼料添加物後，皆不需訂定停藥期"],"ans":3,"exp":"本題問停藥期規定何者錯誤。依規定，含藥物飼料添加物即使依法定濃度使用，若其成分會蓄積於動物組織中超過安全容許量，仍「需要」訂定停藥期（withdrawal period）；並非「皆不需訂定停藥期」。其他三項均正確：牛乳棄乳期以小時計算（如 antibiotic 用藥後需棄乳 48–96 小時）、胺基醣苷類口服因全身吸收少停藥期較注射短、屠體停藥期以日計算。","we":["你可能對牛乳棄乳期的計算單位不確定。牛乳棄乳期（milk withholding period）確實以小時計算（如 48 小時、96 小時），此描述正確，不應選。","你可能認為胺基醣苷類口服與注射停藥期相同。口服胺基醣苷類（如 neomycin）因系統性吸收極少，組織殘留量低，停藥期確實比注射給藥短，此描述正確，不應選。","你可能對屠體停藥期的計算單位不確定。屠體停藥期（meat withdrawal period）以「日（天）」計算（如 28 天），此描述正確，不應選。","此為正確答案（即題目問的「錯誤描述」）。依法定濃度使用的含藥飼料添加物若有組織殘留疑慮，仍需訂定停藥期；「皆不需停藥期」的說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_032","year":2024,"roc_year":113,"session":"","examNo":32,"q":"犬隻誤食sodium fluoroacetate，最主要抑制下列何種酵素活性導致中毒？","opts":["A. aconitase","B. citrate synthase","C. thiokinase","D. fumarase"],"ans":0,"exp":"Sodium fluoroacetate（compound 1080）在體內轉化為 fluoroacetyl-CoA，再與 oxaloacetate 縮合形成 fluorocitrate（自殺性受質）。Fluorocitrate 與 aconitase（烏頭酸酶）高度結合，使其不可逆失活，阻斷 TCA 循環（citrate 無法轉化為 isocitrate），導致 citrate 大量蓄積、ATP 合成停止，引起細胞能量耗竭、心臟及神經毒性死亡。","we":["此為正確答案。Sodium fluoroacetate → fluorocitrate → 不可逆抑制 aconitase → TCA 循環阻斷 → ATP 耗竭，是 compound 1080 的經典中毒機制。","你可能認為 citrate synthase 是主要抑制目標。Citrate synthase 催化 acetyl-CoA + oxaloacetate → citrate（TCA 循環第一步），fluorocitrate 不直接抑制此酶，而是抑制下游的 aconitase。","你可能認為 thiokinase（succinyl-CoA synthetase）是主要抑制目標。Thiokinase 位於 TCA 循環的 succinyl-CoA 步驟，並非 fluoroacetate 的主要作用靶點。","你可能認為 fumarase 是主要抑制目標。Fumarase 催化 fumarate → malate，位於 TCA 循環後段，並非 fluoroacetate 毒性機制的主要靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_033","year":2024,"roc_year":113,"session":"","examNo":33,"q":"下列何者不是使用賦形劑（excipients）的目的？","opts":["A. 增加藥物劑型的體積","B. 增加藥物劑型的重量","C. 防止藥物黏附於製造設備","D. 與活性成分產生作用以增加藥效"],"ans":3,"exp":"賦形劑（excipients）是藥物製劑中的「非活性成分」，其目的包括：增加劑型體積（diluent/bulking agent）、增加重量（filler）、防止藥物黏附於製造設備（lubricant）、幫助崩解（disintegrant）、改善穩定性等。賦形劑「不應」與活性成分產生交互作用增加藥效，如果賦形劑具有藥理活性或與主藥交互作用影響療效，則不符合賦形劑的定義與使用原則。","we":["你可能認為增加劑型體積不是賦形劑的用途。稀釋劑（diluent）正是賦形劑的主要類型之一，用於增加錠劑或膠囊的體積以方便製造與服用，此描述正確。","你可能認為增加劑型重量不是賦形劑的用途。充填劑（filler）用於增加製劑重量至適合的規格範圍，屬於賦形劑的正當用途，此描述正確。","你可能認為防止藥物黏附設備不是賦形劑的用途。潤滑劑（lubricant，如 magnesium stearate）正是為了防止藥物黏附於製造設備（如打錠機），是賦形劑的標準功能，此描述正確。","此為正確答案（即題目問的「不是」賦形劑用途）。賦形劑本身應為藥理非活性物質，若與活性成分產生交互作用以增加藥效，則違反賦形劑的定義原則，不是其正當用途。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_034","year":2024,"roc_year":113,"session":"","examNo":34,"q":"有關口服製劑之敘述，下列何者正確？","opts":["A. 所有口服藥品皆會受到胃酸破壞","B. 錠劑必在胃中開始崩解","C. 3號膠囊的容量大於2號膠囊的容量","D. 硬膠囊無法包覆具有強揮發性的藥品"],"ans":3,"exp":"硬明膠膠囊（hard gelatin capsule）雖為密閉外殼，但對高度揮發性藥品（如揮發油）的封閉效果不佳：揮發性物質會滲透膠囊殼或使明膠軟化，影響製劑穩定性，因此硬膠囊通常無法包覆強揮發性藥品（需改用軟膠囊或其他劑型）。膠囊號碼系統：數字愈大容量愈小（0 > 1 > 2 > 3 > 4 > 5），因此 3 號膠囊容量小於 2 號。","we":["你可能認為所有口服藥品都會受胃酸破壞。許多口服藥具有耐酸性（如 cephalexin）或有腸溶衣保護，並非所有口服藥都受胃酸破壞，此描述有誤，不應選。","你可能認為錠劑必在胃中開始崩解。腸溶衣錠（enteric-coated tablet）在胃中不崩解，而是進入小腸（pH > 6）後才溶解，此描述有誤，不應選。","你可能認為 3 號膠囊容量大於 2 號膠囊。膠囊號碼與容量成反比（號碼愈大容量愈小），3 號膠囊容量比 2 號小，此描述有誤，不應選。","此為正確答案。硬明膠膠囊無法有效密封強揮發性藥品，揮發物會穿透或破壞膠囊殼，強揮發性物質通常使用軟膠囊或其他特殊劑型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_035","year":2024,"roc_year":113,"session":"","examNo":35,"q":"下列有關止痛劑之敘述，何者錯誤？","opts":["A. Amantadine為適合經口投予犬貓的止痛劑","B. Amitriptyline為三環抗憂鬱劑，也具有止痛效果","C. Oxymorphone止痛效果低於morphine，使用於犬麻醉前給藥","D. Tramadol可做為止痛劑和止咳劑"],"ans":2,"exp":"本題問止痛劑描述何者錯誤。Oxymorphone 的止痛效力約為 morphine 的 10 倍（更強效），而非「低於 morphine」，此為錯誤描述。其他三項均正確：amantadine（NMDA 受體拮抗劑）確為可口服的犬貓輔助止痛劑；amitriptyline（三環抗憂鬱劑）也具有神經性疼痛的止痛效果；tramadol 兼具 opioid 受體活性與血清素/正腎上腺素再回收抑制，可作止痛兼止咳。","we":["你可能對 amantadine 的止痛用途不確定。Amantadine 是 NMDA 受體拮抗劑，在獸醫臨床用於慢性疼痛與阿片耐受（opioid tolerance）的輔助治療，口服給藥，此描述正確。","你可能對 amitriptyline 的止痛機制有疑問。Amitriptyline（TCA）除抗憂鬱外，也具有神經性疼痛的輔助止痛效果（抑制 NE/5-HT 再回收、鈉離子通道阻斷），此描述正確。","此為正確答案（即題目問的「錯誤描述」）。Oxymorphone 的止痛效力約為 morphine 的 10 倍，屬強效類鴉片，說其止痛效果「低於 morphine」是錯誤的。","你可能對 tramadol 的雙重機制不確定。Tramadol 同時具有弱 opioid 受體活性（μ 受體）與 NE/5-HT 再回收抑制，確實可作為止痛劑及止咳劑使用，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_036","year":2024,"roc_year":113,"session":"","examNo":36,"q":"下列何種麻醉前給藥（preanesthetic medication）常用於預防大量的唾液分泌和心搏舒緩？","opts":["A. acepromazine","B. meperidine","C. glycopyrrolate","D. romifidine"],"ans":2,"exp":"Glycopyrrolate 為四級銨抗膽鹼藥（quaternary ammonium anticholinergic），阻斷毒蕈鹼受體（muscarinic receptor），可有效減少術前大量唾液分泌（抗流涎）並預防麻醉誘導時迷走神經反射引起的心搏舒緩（vagal bradycardia）。因為是四級銨化合物，不穿透血腦障壁，副作用比 atropine 少。Acepromazine 為安定劑；meperidine 為 opioid；romifidine 為 α2-agonist 鎮靜劑。","we":["你可能認為 acepromazine 能預防大量唾液分泌。Acepromazine 為 phenothiazine 類鎮靜劑（D2/α1 拮抗劑），無抗膽鹼效果，不能顯著抑制唾液分泌或預防迷走性心搏舒緩，不應選。","你可能認為 meperidine 能預防大量唾液分泌。Meperidine（pethidine）為 opioid 止痛藥，用於麻醉前給藥以止痛，但無抗膽鹼效果，不能有效抑制唾液或心搏舒緩，不應選。","此為正確答案。Glycopyrrolate 是麻醉前常用抗膽鹼藥，可有效抑制唾液腺分泌並預防迷走性心搏舒緩，且因不過血腦障壁較 atropine 更為安全。","你可能認為 romifidine 能預防大量唾液分泌。Romifidine 屬 α2-adrenergic agonist（如 xylazine 類），用於鎮靜，可能引起血壓變化及心跳減緩，本身不具抗膽鹼唾液抑制效果，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_037","year":2024,"roc_year":113,"session":"","examNo":37,"q":"下列何者最可能經由活化氯離子通道造成神經之過極化（hyperpolarization）現象？","opts":["A. phenobarbital","B. ketamine","C. xylazine","D. acepromazine"],"ans":0,"exp":"Phenobarbital 屬 barbiturate 類，作用於 GABA-A 受體，延長氯離子（Cl-）通道的開放時間（barbiturate 延長開放時間 vs BZD 增加開放頻率），使 Cl- 內流增加，神經細胞發生過極化（hyperpolarization），抑制神經興奮性，產生抗痙攣及鎮靜效果。Ketamine 為 NMDA 拮抗劑；xylazine 為 α2 致效劑；acepromazine 為 D2/α1 拮抗劑。","we":["此為正確答案。Phenobarbital（barbiturate）延長 GABA-A 受體的 Cl- 通道開放時間 → Cl- 內流 → 膜電位超極化（hyperpolarization）→ 神經抑制。","你可能認為 ketamine 透過 Cl- 通道引起過極化。Ketamine 為 NMDA 受體非競爭性拮抗劑，阻斷 Ca2+ 及 Na+ 內流，產生解離性麻醉，與 Cl- 通道無關。","你可能認為 xylazine 透過 Cl- 通道引起過極化。Xylazine 為 α2-adrenergic agonist，作用於突觸前 α2 受體，減少 NE 釋放，產生鎮靜效果，機制與 GABA-A Cl- 通道無關。","你可能認為 acepromazine 透過 Cl- 通道引起過極化。Acepromazine 為 phenothiazine，主要阻斷多巴胺（D2）及 α1 腎上腺素受體，產生鎮靜效果，不作用於 Cl- 通道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_038","year":2024,"roc_year":113,"session":"","examNo":38,"q":"下列抗痙攣劑何者不會有活性代謝物的產生，最適合使用於肝功能低下犬隻？","opts":["A. lorazepam","B. diazepam","C. primidone","D. phenytoin"],"ans":0,"exp":"Lorazepam 屬 benzodiazepine（BZD）類，代謝方式為直接葡萄糖醛酸化（glucuronidation），不依賴肝臟 CYP450 氧化酶，不產生活性代謝物（無 desmethyl 代謝物等），因此在肝功能低下（如肝硬化、門脈分流）的犬隻中是相對安全的 BZD 選擇。Diazepam 產生多個活性代謝物（desmethyldiazepam、oxazepam）；primidone 在體內代謝為 phenobarbital（活性代謝物）；phenytoin 代謝複雜。","we":["此為正確答案。Lorazepam 透過直接葡萄糖醛酸化代謝，無需 CYP450，無活性代謝物，在肝功能低下的犬隻中最適合使用。","你可能認為 diazepam 在肝功能低下時安全。Diazepam 經 CYP2C19 氧化代謝，產生活性代謝物（desmethyldiazepam、oxazepam），肝功能低下時代謝物蓄積，t½ 大幅延長，不適合，不應選。","你可能認為 primidone 不會產生活性代謝物。Primidone 在體內代謝為 phenobarbital（主要活性代謝物）及 phenylethylmalonamide，肝功能不全時代謝物蓄積更嚴重，不應選。","你可能認為 phenytoin 在肝功能低下時安全。Phenytoin 高度依賴肝臟代謝（CYP2C9/2C19），且為飽和動力學（零級動力學），劑量稍增即可導致毒性，肝功能不全時更不安全，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_039","year":2024,"roc_year":113,"session":"","examNo":39,"q":"有關buspirone之敘述，下列何者錯誤？","opts":["A. 不具有鎮靜作用的抗焦慮劑","B. 相較benzodiazepine類藥物之成癮性較低","C. 作用機制與活化伽瑪-胺基丁酸調控氯離子通道（GABA-gated Cl- channels） 有關","D. 經口投予後，可從腸胃吸收"],"ans":2,"exp":"本題問 buspirone 描述何者錯誤。Buspirone 的作用機制是 5-HT1A 受體的部分致效劑（partial agonist）及 D2 受體的部分拮抗劑，與 GABA-gated Cl- 通道（GABA-A 受體）完全無關；GABA-A Cl- 通道是 BZD 及 barbiturate 的作用靶點。其他描述均正確：buspirone 不具鎮靜作用（non-sedating anxiolytic）、成癮性低於 BZD、口服可從胃腸道吸收。","we":["你可能對 buspirone 是否具鎮靜作用有疑問。Buspirone 是少數不具鎮靜作用的抗焦慮劑（non-sedating anxiolytic），這也是它相較於 BZD 的優點之一，此描述正確，不應選。","你可能認為 buspirone 的成癮性與 BZD 相當。Buspirone 因作用機制不同（不作用於 GABA-A/BZD 受體），成癮性與身體依賴性明顯低於 BZD，此描述正確，不應選。","此為正確答案（即題目問的「錯誤描述」）。Buspirone 作用機制為 5-HT1A partial agonist，與 GABA-gated Cl- 通道無關；GABA-A 受體調節是 BZD 及 barbiturate 的機制，不是 buspirone。","你可能對 buspirone 的口服吸收有疑問。Buspirone 口服後確實可從胃腸道吸收（雖有首過效應，生體可用率約 4%），此描述正確，不應選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_040","year":2024,"roc_year":113,"session":"","examNo":40,"q":"下列影響行為的藥物中，何者屬於單胺氧化酶抑制劑（monoamine oxidase inhibitors）？","opts":["A. amitriptyline","B. clomipramine","C. fluoxetine","D. selegiline"],"ans":3,"exp":"Selegiline 為選擇性單胺氧化酶-B（MAO-B）抑制劑，能減少多巴胺的降解，用於犬的認知功能障礙症候群（canine cognitive dysfunction syndrome）及庫欣病。其餘三種均為作用於不同靶點的行為藥物：amitriptyline 及 clomipramine 為三環抗憂鬱劑（TCA，NE/5-HT 再回收抑制劑）；fluoxetine 為選擇性血清素再回收抑制劑（SSRI）。四種藥物中只有 selegiline 屬 MAOI 類。","we":["你可能認為 amitriptyline 是 MAOI。Amitriptyline 是 TCA（三環抗憂鬱劑），透過抑制 NE 及 5-HT 再回收產生效果，並非 MAOI，不應選。","你可能認為 clomipramine 是 MAOI。Clomipramine 是 TCA，以抑制 5-HT 再回收為主，也用於犬分離焦慮等行為問題，並非 MAOI，不應選。","你可能認為 fluoxetine 是 MAOI。Fluoxetine 是 SSRI（選擇性血清素再回收抑制劑），用於多種動物的焦慮與強迫行為治療，並非 MAOI，不應選。","此為正確答案。Selegiline 是唯一的 MAO-B 抑制劑，用於犬的認知功能障礙症候群，透過減少 MAO-B 對多巴胺的降解來增加腦內多巴胺濃度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_041","year":2024,"roc_year":113,"session":"","examNo":41,"q":"有關desflurane之敘述，下列何者錯誤？","opts":["A. desflurane和isoflurane化學性狀相似，具有氟化的甲基、乙基醚類結構","B. 麻醉的誘導和恢復皆快","C. 具降低心搏輸出量之作用","D. 血液／氣體分配係數（blood/gas partition coefficient）高於sevoflurane"],"ans":3,"exp":"Desflurane 的血液／氣體分配係數（blood/gas partition coefficient）為 0.42，低於 sevoflurane 的 0.65。血液／氣體分配係數越低，麻醉誘導與恢復越快，因此 desflurane 是目前揮發性吸入麻醉劑中恢復最快者。選項 A（氟化甲基乙基醚類結構）、B（誘導恢復皆快）、C（降低心搏輸出量）均為正確描述；選項 D 稱其係數高於 sevoflurane，此為錯誤敘述，故為本題答案。","we":["此為正確描述：desflurane 確實與 isoflurane 化學結構相似，同屬氟化甲基乙基醚類，不符合題目問的「錯誤」描述。","此為正確描述：desflurane 因血液／氣體分配係數極低（0.42），麻醉誘導與恢復均快，不符合題目問的「錯誤」描述。","此為正確描述：desflurane 與其他揮發性麻醉劑相同，具有降低心搏輸出量的心臟抑制作用，不符合題目問的「錯誤」描述。","錯誤：desflurane 的血液／氣體分配係數為 0.42，低於 sevoflurane 的 0.65，並非高於。係數越低代表溶解度越低、平衡越快，故恢復更快速。此為本題錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_042","year":2024,"roc_year":113,"session":"","examNo":42,"q":"Propofol因會對貓紅血球造成何種傷害反應，所以貓紅血球可能會有Heinz body形成？","opts":["A. 還原反應","B. 乙醯化反應","C. 水解反應","D. 氧化反應"],"ans":3,"exp":"Propofol 含有苯酚環結構，在貓體內可被氧化產生活性氧化物質（reactive oxygen species），這些氧化性代謝物使血紅蛋白發生氧化性變性，形成 Heinz body（血紅蛋白變性小體）。貓對氧化性損傷特別敏感，因為貓的血紅蛋白含有較多的巰基（-SH），容易被氧化。長期或重複使用 propofol 於貓的風險包括 Heinz body 貧血，臨床應謹慎評估給藥頻率。","we":["錯誤：還原反應不會造成血紅蛋白氧化性變性。Heinz body 的形成是由氧化性傷害所導致，而非還原反應。","錯誤：乙醯化反應是部分藥物代謝的方式（如磺胺類），與 propofol 造成貓紅血球損傷的機制無關。","錯誤：水解反應是酯類或醯胺類藥物的代謝途徑，不是 propofol 引起紅血球氧化性損傷的機制。","此為正確答案。Propofol 的苯酚環可在貓體內產生氧化性代謝物，使血紅蛋白發生氧化性變性，導致 Heinz body 形成，這是貓對 propofol 特別敏感的原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_043","year":2024,"roc_year":113,"session":"","examNo":43,"q":"下列何者非擬交感神經藥（sympathomimetic drugs）的作用？","opts":["A. 促進肝醣分解","B. 鬆弛支氣管","C. 縮瞳","D. 心跳加速"],"ans":2,"exp":"擬交感神經藥（sympathomimetic drugs）透過活化腎上腺素性受體產生作用，包括：（1）促進肝醣分解（β2 受體介導）；（2）鬆弛支氣管（β2 受體介導）；（3）心跳加速（β1 受體介導）；（4）散瞳（α1 受體介導虹膜擴張肌收縮）。縮瞳（miosis）是副交感神經（膽鹼性）藥物的作用，不是擬交感神經藥的作用，故本題答案為縮瞳（C）。","we":["此為正確描述：促進肝醣分解是擬交感神經藥（β2 腎上腺素性受體）的作用，不符合題目問的「非」擬交感神經藥作用。","此為正確描述：鬆弛支氣管（支氣管擴張）是擬交感神經藥（β2 受體）的典型作用，不符合題目問的「非」擬交感神經藥作用。","錯誤：縮瞳（miosis）是副交感神經藥物（如 pilocarpine、毛果芸香鹼）的作用，由 M3 受體介導虹膜括約肌收縮。擬交感神經藥反而引起散瞳（α1 受體），因此縮瞳並非 sympathomimetic drugs 的作用，為本題正確答案。","此為正確描述：心跳加速是擬交感神經藥（β1 受體）的作用，不符合題目問的「非」擬交感神經藥作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_044","year":2024,"roc_year":113,"session":"","examNo":44,"q":"有關yohimbine的敘述，下列何者正確？","opts":["A. 可抑制交感神經活性","B. 可降低副交感神經釋放乙醯膽鹼","C. 為選擇性α1-腎上腺素性受體致效劑","D. 為選擇性α2-腎上腺素性受體拮抗劑"],"ans":3,"exp":"Yohimbine 是選擇性 α2-腎上腺素性受體拮抗劑（antagonist），常用來逆轉 xylazine 的鎮靜作用。其機制為阻斷突觸前 α2 受體，解除對正腎上腺素（norepinephrine）釋放的抑制，進而增加交感神經活性。選項 A（抑制交感神經活性）、B（降低 ACh 釋放）、C（α1 致效劑）均為錯誤描述。","we":["錯誤：yohimbine 是 α2 拮抗劑，阻斷突觸前 α2 自體受體後，反而增加正腎上腺素的釋放，使交感神經活性上升，而非抑制。","錯誤：yohimbine 作用於腎上腺素性 α2 受體，與副交感神經釋放乙醯膽鹼的機制無直接關聯，不會降低 ACh 釋放。","錯誤：yohimbine 對 α1 受體幾乎無作用，它是選擇性 α2 受體拮抗劑，而非 α1 致效劑（agonist）。","此為正確答案。Yohimbine 是選擇性 α2-腎上腺素性受體拮抗劑，臨床用於逆轉 xylazine 引起的鎮靜與心血管抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_045","year":2024,"roc_year":113,"session":"","examNo":45,"q":"下列何者可使瞳孔縮小，可用於動物的青光眼治療？","opts":["A. atropine","B. mecamylamine","C. pilocarpine","D. epinephrine"],"ans":2,"exp":"Pilocarpine 是直接作用型毒蕈鹼性（M3）受體致效劑，能刺激虹膜括約肌收縮，引起縮瞳（miosis）。縮瞳後可促進房水（aqueous humor）從前房角排出，降低眼內壓，因此用於治療青光眼。此外，pilocarpine 也刺激睫狀肌收縮，輔助增加房水排流。Atropine 引起散瞳，mecamylamine 為神經節阻斷劑，epinephrine 經 α1 受體引起散瞳，均無助於降低眼內壓。","we":["錯誤：atropine 是毒蕈鹼性受體拮抗劑，會阻斷 M3 受體，導致虹膜括約肌放鬆、散瞳（mydriasis），可能使青光眼惡化，不可用於青光眼治療。","錯誤：mecamylamine 是神經節阻斷劑，阻斷自律神經節的菸鹼性受體，不直接作用於虹膜，且不用於青光眼治療。","此為正確答案。Pilocarpine 是 M3 受體直接致效劑，刺激虹膜括約肌收縮使瞳孔縮小，並改善房水排流以降低眼內壓，是青光眼治療的重要藥物。","錯誤：epinephrine 作用於 α1 受體，刺激虹膜擴張肌使瞳孔散大（mydriasis），而非縮瞳，不適用於需要縮瞳的青光眼處置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_046","year":2024,"roc_year":113,"session":"","examNo":46,"q":"下列何者具有活化膽鹼酯酶作用 （cholinesterase reactivator）？","opts":["A. pralidoxime","B. carbachol","C. physostigmine","D. pyridostigmine"],"ans":0,"exp":"Pralidoxime（2-PAM）是膽鹼酯酶再活化劑（cholinesterase reactivator）。有機磷農藥（organophosphate）與乙醯膽鹼酯酶（AChE）共價結合，使其失去活性，造成 ACh 蓄積。Pralidoxime 在磷酸化不可逆老化（aging）發生前，能將 AChE 從有機磷-AChE 複合物中再生，恢復酶活性。必須儘早給藥，通常與 atropine 合併使用治療有機磷中毒。","we":["此為正確答案。Pralidoxime（2-PAM）是 AChE 再活化劑，能逆轉有機磷造成的 AChE 磷酸化抑制，恢復其水解 ACh 的功能，為有機磷中毒的解毒劑。","錯誤：carbachol 是膽鹼性受體致效劑（直接作用型），與 AChE 再活化無關，反而會加重 ACh 蓄積的症狀。","錯誤：physostigmine 是間接作用型膽鹼致效劑，屬於可逆性 AChE 抑制劑，並非再活化劑。它會抑制 AChE，增加 ACh 濃度。","錯誤：pyridostigmine 也是可逆性 AChE 抑制劑，用於重症肌無力的治療，其機制是抑制 AChE 而非再活化，與 pralidoxime 的作用截然不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_047","year":2024,"roc_year":113,"session":"","examNo":47,"q":"有關ipratropium之敘述，下列何者錯誤？","opts":["A. 臨床用途為治療氣喘與慢性阻塞性肺病","B. 副作用為口乾","C. 常用吸入方式給藥","D. 為β2 受體致效劑"],"ans":3,"exp":"Ipratropium 是第四銨類（quaternary ammonium）毒蕈鹼性受體拮抗劑（antimuscarinic），透過阻斷支氣管平滑肌的 M3 受體，防止 ACh 引起的支氣管收縮，達到支氣管擴張效果。它不是 β2 受體致效劑。吸入給藥後幾乎不被呼吸道黏膜吸收，因此全身副作用少，但仍可能出現口乾。臨床用於氣喘及慢性阻塞性肺病（COPD）治療。","we":["此為正確描述：ipratropium 確實用於治療氣喘與 COPD，不符合題目問的「錯誤」描述。","此為正確描述：口乾（dry mouth）是 ipratropium 的已知抗膽鹼副作用，不符合題目問的「錯誤」描述。","此為正確描述：ipratropium 常以吸入方式（MDI 或 nebulizer）給藥，不符合題目問的「錯誤」描述。","錯誤：ipratropium 的作用機制是阻斷毒蕈鹼性（M3）受體，屬於抗膽鹼藥物，並非 β2 腎上腺素性受體致效劑。β2 致效劑是另一類支氣管擴張劑（如 albuterol、terbutaline）。此為本題錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_048","year":2024,"roc_year":113,"session":"","examNo":48,"q":"下列何種藥物可阻斷鈣離子從肌肉細胞的肌漿網釋出？","opts":["A. atracurium","B. dantrolene","C. neostigmine","D. succinylcholine"],"ans":1,"exp":"Dantrolene 直接作用於骨骼肌肌漿網（sarcoplasmic reticulum, SR）上的 ryanodine 受體（RyR1），阻斷 Ca2+ 從 SR 釋出，進而抑制肌肉收縮，是治療惡性高熱（malignant hyperthermia）的特異性解毒劑。Atracurium 是非去極化型神經肌肉阻斷劑；neostigmine 是可逆性 AChE 抑制劑；succinylcholine 是去極化型神經肌肉阻斷劑，均不直接阻斷 SR 的 Ca2+ 釋出。","we":["錯誤：atracurium 是苯異喹啉類非去極化型神經肌肉阻斷劑，作用於神經肌肉接合處（NMJ）的菸鹼性受體，不直接影響肌漿網的鈣離子釋出。","此為正確答案。Dantrolene 透過阻斷肌漿網上的 ryanodine 受體（RyR1），防止 Ca2+ 釋出，從而抑制骨骼肌過度收縮，是惡性高熱與肌肉痙攣的重要治療藥物。","錯誤：neostigmine 是可逆性 AChE 抑制劑，用於逆轉非去極化型肌鬆劑的作用或治療重症肌無力，不影響 SR 的 Ca2+ 釋出。","錯誤：succinylcholine 是去極化型 NMJ 阻斷劑，與 NMJ 的菸鹼性受體結合使肌肉持續去極化，並不阻斷 SR 的鈣離子通道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_049","year":2024,"roc_year":113,"session":"","examNo":49,"q":"當貓心衰竭起因於心臟收縮功能異常且出現第一心雜音時，推薦用藥為何？","opts":["A. furosemide, esmolol","B. nitroglycerin, amlodipine","C. hydralazine, pimobendan","D. digoxin, aminophylline"],"ans":2,"exp":"貓的擴張型心肌病（dilated cardiomyopathy, DCM）或收縮功能異常的心衰竭，治療目標為：（1）增加心肌收縮力（positive inotrope）；（2）減少後負荷（afterload reduction）。Pimobendan 是正性肌力藥物（PDE3 抑制劑 + Ca2+ 增敏劑），可改善收縮功能；hydralazine 是動脈血管擴張劑，降低後負荷、減輕心臟負擔，兩者合用為貓收縮功能異常心衰竭的推薦組合。","we":["錯誤：esmolol 是短效 β 受體阻斷劑，負性肌力作用會進一步抑制已受損的心肌收縮功能，在收縮功能異常的心衰竭中屬禁忌。","錯誤：nitroglycerin 主要擴張靜脈（減少前負荷），amlodipine 是 CCB（主要用於貓高血壓），兩者均缺乏正性肌力作用，對收縮功能不足的情況改善有限。","此為正確答案。Hydralazine（後負荷減少）+ pimobendan（正性肌力）是貓收縮功能異常心衰竭的推薦組合，能同時改善心輸出量並降低心臟工作負擔。","錯誤：digoxin 雖有一定正性肌力作用，但效果有限且毒性窗口窄；aminophylline 主要是支氣管擴張劑（PDE 抑制劑），用於支氣管痙攣，並非心衰竭的推薦組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_050","year":2024,"roc_year":113,"session":"","examNo":50,"q":"下列何者長期使用於治療動物心律不整時，若突然中斷給藥會造成嚴重心律不整？","opts":["A. atenolol","B. amiodarone","C. verapamil","D. digoxin"],"ans":0,"exp":"Atenolol 是 β1 選擇性腎上腺素性受體阻斷劑，長期使用會導致 β 受體上調（upregulation）。突然停藥後，上調的 β 受體對內源性兒茶酚胺（catecholamines）高度敏感，引發反彈性心跳加速（rebound tachycardia）及嚴重心律不整，此稱為 β-blocker 停藥症候群。臨床上必須逐步減量停藥，不可驟然中斷。其他選項中，amiodarone 半衰期極長（數周），verapamil 及 digoxin 突然停藥不具此特殊反彈性心律不整風險。","we":["此為正確答案。長期使用 atenolol 等 β 受體阻斷劑會使 β 受體上調，突然停藥導致反彈性交感興奮，引發嚴重心律不整（β-blocker 停藥症候群），應逐步減量。","錯誤：amiodarone 的半衰期極長（數週至數個月），即使停藥，藥物效果仍會持續一段時間，不會因突然停藥立即引發嚴重反彈性心律不整。","錯誤：verapamil 是鈣離子通道阻斷劑（Class IV），突然停藥可能造成心率及血壓的輕微變化，但不具有 β 受體上調所引起的反彈性心律不整。","錯誤：digoxin 是心臟糖苷類藥物，突然停藥可能使原本控制的心律稍有變化，但其機制非 β 受體上調，不會引起典型的停藥症候群性嚴重心律不整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_051","year":2024,"roc_year":113,"session":"","examNo":51,"q":"傳統分類抗心律不整藥物，若其對心臟節律點（pacemaker）及心肌細胞動作電位之第2期均有作用者，屬\r 於：","opts":["A. Class I","B. Class II","C. Class III","D. Class IV"],"ans":3,"exp":"抗心律不整藥物的傳統 Vaughan Williams 分類中，Class IV 是鈣離子通道阻斷劑（calcium channel blockers, CCB）。心肌細胞動作電位的第 2 期（plateau phase）主要由 L 型鈣離子通道（ICaL）維持；心臟節律點（SA node、AV node）的自發性去極化（phase 4）也依賴鈣離子電流。Class IV 藥物（如 verapamil、diltiazem）同時作用於節律點的鈣離子電流與心肌細胞動作電位第 2 期，可降低自律性、延緩 AV 傳導，用於上心室性心律不整。","we":["錯誤：Class I 是鈉離子通道阻斷劑（Na+ channel blockers），主要影響動作電位第 0 期（快速去極化），不直接作用於動作電位第 2 期的鈣離子電流。","錯誤：Class II 是 β 受體阻斷劑，透過阻斷 β 腎上腺素性受體減少 cAMP 及 PKA 活性，降低自律性及傳導速度，但其主要標的不是鈣離子通道本身。","錯誤：Class III 是鉀離子通道阻斷劑（如 amiodarone、sotalol），延長動作電位第 3 期（repolarization），延長有效不應期，與鈣離子通道無直接關係。","此為正確答案。Class IV（鈣離子通道阻斷劑）同時對心臟節律點及心肌細胞動作電位第 2 期（由 ICaL 維持）有作用，臨床用於控制房室傳導及上心室性心律不整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_052","year":2024,"roc_year":113,"session":"","examNo":52,"q":"承上題，下列何種藥物歸類於該等級？","opts":["A. phenytoin","B. atenolol","C. diltiazem","D. digoxin"],"ans":2,"exp":"承接 Q51，Class IV 抗心律不整藥物為鈣離子通道阻斷劑。Diltiazem 是非二氫吡啶類（non-dihydropyridine）CCB，可抑制心臟 L 型鈣離子通道，減緩 AV 結傳導、降低心率，用於控制心房撲動或心房顫動的心室速率，屬 Class IV。Phenytoin 屬 Class IB（Na+ channel blocker）；atenolol 屬 Class II（β 受體阻斷劑）；digoxin 是心臟糖苷（cardiac glycoside），傳統分類不屬於 Class I-IV。","we":["錯誤：phenytoin 是 Class IB 鈉離子通道阻斷劑，對室性心律不整（尤其洋地黃中毒引起的心律不整）有效，不屬於 Class IV。","錯誤：atenolol 是選擇性 β1 受體阻斷劑，屬 Class II 抗心律不整藥物，作用機制為降低交感神經對心臟的影響，非鈣離子通道阻斷。","此為正確答案。Diltiazem 是非二氫吡啶類鈣離子通道阻斷劑，屬 Class IV 抗心律不整藥物，能減緩 AV 傳導，用於上心室性心律不整（如 SVT、AF 的心率控制）。","錯誤：digoxin（洋地黃）是心臟糖苷類，透過抑制 Na+/K+-ATPase 間接增加細胞內 Ca2+，Vaughan Williams 傳統分類中並不將 digoxin 歸入 Class I-IV 任何一類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_053","year":2024,"roc_year":113,"session":"","examNo":53,"q":"貓因深層靜脈栓塞以heparin注射後，發生靜脈出血現象，醫師緊急停止投予heparin再靜脈給予protamine\r sulfate來控制出血，protamine sulfate作用機制為何？","opts":["A. 分解heparin","B. 活化凝血機制","C. 結合heparin","D. 促進血小板聚集"],"ans":2,"exp":"Protamine sulfate 是一種帶大量正電荷的蛋白質，能與帶負電荷的 heparin（多陰離子聚合物）透過靜電吸引力形成穩定的非活性複合物，迅速中和 heparin 的抗凝血作用。其機制是「結合」（binding/ionic neutralization），而非分解或活化凝血機制。Protamine sulfate 是 heparin 過量或需緊急逆轉抗凝血效果的標準解毒劑。","we":["錯誤：protamine sulfate 不具有酶的活性，無法「分解」heparin 的化學結構；它是透過靜電結合將 heparin 包覆使其失去活性。","錯誤：protamine sulfate 本身不直接活化凝血機制（如凝血瀑布），它僅透過中和 heparin 來間接恢復正常凝血，並非主動啟動凝血因子。","此為正確答案。Protamine sulfate 帶有大量正電荷，能與帶負電荷的 heparin 結合形成無活性複合物，從而迅速逆轉 heparin 的抗凝血效果。","錯誤：促進血小板聚集不是 protamine sulfate 的作用機制；事實上，protamine sulfate 本身反而可能對血小板功能造成輕微抑制性影響，而非促進聚集。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_藥理_054","year":2024,"roc_year":113,"session":"","examNo":54,"q":"下列何種維生素缺乏時，除會造成貧血外，另常會伴隨神經病變？","opts":["A. thiamine","B. riboflavin","C. niacin","D. cyanocobalamin"],"ans":3,"exp":"Cyanocobalamin（維生素 B12）缺乏會導致：（1）巨球性貧血（megaloblastic anemia）——因 DNA 合成障礙，紅血球無法正常分裂，形成巨大不成熟的紅血球；（2）神經病變（neuropathy）——B12 是髓鞘（myelin sheath）合成所需，缺乏會引起脊髓後索及周邊神經脫髓鞘（subacute combined degeneration）。其他 B 族維生素：thiamine（B1）缺乏→腳氣病/Wernicke 腦病；riboflavin（B2）缺乏→口腔炎；niacin（B3）缺乏→糙皮病（pellagra），均不以神經病變合併貧血為特徵。","we":["錯誤：thiamin
