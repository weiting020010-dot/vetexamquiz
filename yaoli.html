diesterase V抑制劑，常用於治療狗的肺動脈高壓？","opts":["A. pirbuterol","B. metaproterenol","C. sildenafil","D. acetylcysteine"],"ans":2,"exp":"sildenafil為磷酸二酯酶第V型（PDE5）抑制劑，抑制PDE5後減少cGMP的分解，使肺血管平滑肌中cGMP濃度升高，導致血管舒張，降低肺動脈壓，用於治療犬隻的肺動脈高壓（pulmonary arterial hypertension, PAH）。pirbuterol和metaproterenol均為β2腎上腺素受體促效劑（支氣管擴張劑）；acetylcysteine為黏液溶解劑及抗氧化劑。","we":["錯誤：pirbuterol為選擇性β2腎上腺素受體促效劑，主要用於支氣管擴張（治療氣喘和阻塞性肺病），並非PDE5抑制劑，不用於治療肺動脈高壓。","錯誤：metaproterenol為β2腎上腺素受體促效劑，具支氣管擴張作用，並非PDE5抑制劑，不是治療肺動脈高壓的藥物。","","錯誤：acetylcysteine為N-乙醯半胱胺酸，主要作用為黏液溶解（斷裂黏液中的二硫鍵）及抗氧化（補充麩胱甘肽），並非PDE5抑制劑，不用於治療肺動脈高壓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_035","year":2020,"roc_year":109,"session":"1","examNo":35,"q":"有關aminophylline之敘述，下列何者錯誤？","opts":["A. 支氣管擴張劑","B. methylxanthines衍生物","C. 具鎮咳作用","D. 可治療氣喘"],"ans":2,"exp":"此題問「下列何者錯誤」，正確答案為C「具鎮咳作用」。aminophylline（氨茶鹼 = theophylline + ethylenediamine）為methylxanthine類支氣管擴張劑，可舒張支氣管平滑肌、促進呼吸道擴張、治療氣喘，但「不具有鎮咳（antitussive）作用」——鎮咳屬於另一藥理機制（如opioid類或non-opioid中樞性鎮咳劑），aminophylline並無此特性。A、B、D均為正確描述。","we":["此為正確描述：aminophylline確為支氣管擴張劑（bronchodilator），透過抑制磷酸二酯酶提高cAMP、拮抗腺苷受體，使支氣管平滑肌舒張；不符合題目問的「錯誤」描述。","此為正確描述：aminophylline為methylxanthine類衍生物（theophylline = methylxanthine，與ethylenediamine結合形成aminophylline以提高水溶性）；不符合題目問的「錯誤」描述。","","此為正確描述：aminophylline（茶鹼類）確可用於治療氣喘，能擴張支氣管、改善呼吸道阻塞，是傳統氣喘治療藥物之一；不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_036","year":2020,"roc_year":109,"session":"1","examNo":36,"q":"有關H1-antihistamine藥理作用的敘述，下列何者錯誤？","opts":["A. 收縮已鬆弛的支氣管平滑肌","B. 鬆弛已收縮的腸管平滑肌","C. 可抑制水腫及紅腫的發炎反應","D. 可抑制癢的感覺"],"ans":0,"exp":"此題問「下列何者錯誤」，正確答案為A「收縮已鬆弛的支氣管平滑肌」。H1-antihistamine（H1抗組織胺）可「預防」組織胺引起的支氣管收縮，但「不能收縮已鬆弛的（正常基礎狀態的）支氣管平滑肌」；換言之，它只對抗組織胺引發的效應，對正常或已鬆弛的支氣管無收縮作用。B、C、D均為H1-antihistamine的正確藥理作用。","we":["","此為正確描述：H1-antihistamine可阻斷組織胺對腸管平滑肌的收縮作用，使已收縮（組織胺引起）的腸管平滑肌鬆弛，此為正確的藥理作用；不符合題目問的「錯誤」描述。","此為正確描述：H1-antihistamine可抑制組織胺引起的血管通透性增加，減少水腫、紅腫等發炎反應，此為正確的抗過敏作用；不符合題目問的「錯誤」描述。","此為正確描述：H1-antihistamine可阻斷感覺神經末梢的H1受體，抑制組織胺引起的癢感，用於治療各種過敏性皮膚搔癢；不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_037","year":2020,"roc_year":109,"session":"1","examNo":37,"q":"有關zafirlukast的敘述，下列何者錯誤？","opts":["A. 為leukotriene受體的拮抗劑","B. 具抗發炎作用","C. 可抑制cytochrome P-450的活性","D. 可促進呼吸道黏液分泌"],"ans":3,"exp":"此題問「下列何者錯誤」，正確答案為D「可促進呼吸道黏液分泌」。zafirlukast為白三烯素（leukotriene）受體拮抗劑，透過阻斷CysLT1受體，抑制leukotrienes（LTC4、LTD4、LTE4）引起的支氣管收縮和炎症，具「抗分泌」作用（減少黏液過度分泌）；「促進呼吸道黏液分泌」的描述與其藥理作用相反，故為錯誤。A、B、C均為zafirlukast的正確描述。","we":["此為正確描述：zafirlukast確為leukotriene受體（CysLT1受體）的拮抗劑，可競爭性阻斷LTC4、LTD4等白三烯素的受體結合，用於氣喘治療；不符合題目問的「錯誤」描述。","此為正確描述：zafirlukast透過阻斷白三烯素的炎症效應，具有抗發炎作用，可減少氣道嗜酸性球浸潤和慢性炎症，此為正確描述；不符合題目問的「錯誤」描述。","此為正確描述：zafirlukast為cytochrome P-450 CYP2C9和CYP3A4的抑制劑，可使warfarin、theophylline等藥物的血中濃度升高，存在藥物交互作用；不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_038","year":2020,"roc_year":109,"session":"1","examNo":38,"q":"下列何者使用於犬隻的NSAIDs，且對COX-2之選擇性最佳？","opts":["A. etodolac","B. meloxicam","C. firocoxib","D. carprofen"],"ans":2,"exp":"在犬隻常用NSAIDs中，firocoxib（芬可昔）對COX-2的選擇性最高，其COX-2／COX-1選擇性比值遠優於其他犬用NSAIDs，屬於高度選擇性COX-2抑制劑（coxib類），胃腸道副作用最小。etodolac為中等COX-2選擇性；meloxicam為輕度COX-2偏向性；carprofen（卡洛芬）對COX-2僅有弱選擇性偏向。","we":["錯誤：etodolac對COX-2具有中等程度的選擇性，但其COX-2選擇性比值遠低於firocoxib，並非犬隻NSAIDs中COX-2選擇性最佳者。","錯誤：meloxicam對COX-2有輕度偏向性（preferentially inhibits COX-2），但選擇性不如firocoxib明顯，不是犬用NSAIDs中COX-2選擇性最佳者。","","錯誤：carprofen對COX-2僅有弱選擇性偏向，甚至在某些研究中被認為是非選擇性的，其COX-2選擇性遠低於firocoxib。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_039","year":2020,"roc_year":109,"session":"1","examNo":39,"q":"下列何者為angiotension converting enzyme的功能？","opts":["A. 將renin轉變為renin I","B. 將bradykinin轉變為非活化態的產物","C. 間接刺激aldosterone的合成","D. 將angiotensinogen轉變為angiotensin I"],"ans":1,"exp":"Angiotensin converting enzyme（ACE，血管收縮素轉化酶）的功能是將bradykinin（緩激肽）的C端雙胜肽切除，使其轉變為非活化態的代謝產物（ACE即kininase II，可降解bradykinin）。這也是為何ACE抑制劑使用後bradykinin蓄積，引起乾咳的副作用。ACE另一功能是將angiotensin I轉為angiotensin II（間接促進aldosterone）；renin的功能是切割angiotensinogen→angiotensin I。","we":["錯誤：「將renin轉變為renin I」並非ACE的功能；腎素（renin）本身即為蛋白酶，是腎素-血管收縮素系統的起始酶，ACE並不轉化renin，此敘述錯誤。","","錯誤：「間接刺激aldosterone合成」雖然是ACE活性（Ang I→Ang II→刺激腎上腺皮質分泌aldosterone）的下游效應，但題目問的是ACE的「直接功能」，且此選項描述的是ACE產生Ang II的間接後果，並非ACE本身直接催化的反應，故B選項更準確。","錯誤：「將angiotensinogen轉變為angiotensin I」是腎素（renin）的功能，而非ACE的功能；ACE作用於angiotensin I（將其轉為angiotensin II），不作用於angiotensinogen。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_040","year":2020,"roc_year":109,"session":"1","examNo":40,"q":"下列何種NSAIDs較無抑制血小板凝集之藥理作用？","opts":["A. piroxicam","B. naproxen","C. deracoxib","D. flunixin"],"ans":2,"exp":"deracoxib為高選擇性COX-2抑制劑（coxib類），對COX-1的抑制作用極弱。血小板凝集依賴COX-1產生的TXA2（thromboxane A2）；由於deracoxib幾乎不抑制COX-1，對血小板TXA2生成影響極小，因此「較無抑制血小板凝集之藥理作用」。piroxicam、naproxen、flunixin均為非選擇性NSAIDs（同時抑制COX-1和COX-2），會顯著抑制血小板功能。","we":["錯誤：piroxicam為非選擇性NSAIDs，同時抑制COX-1和COX-2；COX-1抑制導致TXA2合成減少，進而顯著抑制血小板聚集，具有明顯的抗血小板作用。","錯誤：naproxen為非選擇性NSAIDs，對COX-1和COX-2均有抑制；COX-1抑制影響血小板TXA2生成，具有顯著抑制血小板凝集的藥理作用。","","錯誤：flunixin（flunixin meglumine）為非選擇性NSAIDs，對COX-1有強力抑制，可顯著減少血小板TXA2合成，具有明顯的抑制血小板凝集作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_041","year":2020,"roc_year":109,"session":"1","examNo":41,"q":"有關前列腺素F2α（prostaglandin F2α）的敘述，下列何者錯誤？","opts":["A. 具有黃體崩解（luteolysis）之作用","B. 在母馬具有很強之催產作用","C. 有助於治療子宮蓄膿症（pyometra）","D. 無法治療卵巢囊腫（ovarian cysts）"],"ans":3,"exp":"PGF2α（前列腺素F2α）具有黃體崩解（luteolytic）作用，可治療黃體性卵巢囊腫（luteal/corpus luteum cysts）。選項D「無法治療卵巢囊腫」為錯誤敘述：PGF2α可透過黃體崩解使黃體囊腫退化，故可用於治療黃體性卵巢囊腫。A正確（具黃體崩解作用）；B正確（在母馬具有很強催產作用）；C正確（用於開口型子宮蓄膿症，透過子宮收縮協助排膿）。","we":["此為正確描述：PGF2α具有黃體崩解（luteolysis）作用，可促進黃體退化，不符合題目問的「錯誤」描述。","此為正確描述：PGF2α在母馬（mare）子宮具有很強的催產（oxytocic）作用，不符合題目問的「錯誤」描述。","此為正確描述：PGF2α可促進子宮收縮，用於治療開口型子宮蓄膿症（open-cervix pyometra），不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_042","year":2020,"roc_year":109,"session":"1","examNo":42,"q":"下列何者可延長黃體期？","opts":["A. estradiol","B. altrenogest","C. zeranol","D. ergonovine"],"ans":1,"exp":"Altrenogest是合成孕素（19-nor-testosterone衍生物），可抑制LH分泌、防止排卵，延長並維持黃體期（luteal phase）。A的estradiol屬雌激素，在某些情境下會誘發LH surge而非延長黃體期；C的zeranol為同化性雌激素促效劑；D的ergonovine為子宮收縮劑，與黃體期調控無關。","we":["錯誤：estradiol（雌二醇）屬雌激素，在某些情境下反而會誘發LH surge，不能延長黃體期。","","錯誤：zeranol為同化性雌激素促效劑，主要用作生長促進劑，無法延長黃體期。","錯誤：ergonovine（麥角新鹼）為子宮收縮劑，用於產後出血止血，與黃體期調控無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_043","year":2020,"roc_year":109,"session":"1","examNo":43,"q":"下列何者為短效型胰島素？","opts":["A. crystalline zinc insulin","B. isophane insulin","C. protamine zinc insulin","D. insulin glargine"],"ans":0,"exp":"Crystalline zinc insulin（普通胰島素／結晶鋅胰島素）為短效型胰島素，作用起始約30分鐘，峰值2-4小時，持續4-8小時。B的isophane insulin（NPH）為中效型；C的protamine zinc insulin為長效型（24-36小時）；D的insulin glargine為基礎型胰島素（持續約24小時）。","we":["","錯誤：isophane insulin（NPH insulin）為中效型胰島素，持續時間約12-18小時，非短效型。","錯誤：protamine zinc insulin為長效型胰島素，持續時間約24-36小時，非短效型。","錯誤：insulin glargine為長效基礎型胰島素，持續時間約24小時，非短效型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_044","year":2020,"roc_year":109,"session":"1","examNo":44,"q":"有關metformin的敘述，下列何者錯誤？","opts":["A. 經口投藥","B. 對貓可能的副作用為昏睡、厭食","C. 增加insulin receptor的敏感性","D. 會引起低血糖症"],"ans":3,"exp":"Metformin屬於雙胍類（biguanide）口服降血糖藥，作用機制是增加胰島素受體敏感性、抑制肝臟糖質新生，不刺激胰島素分泌，因此不會引起低血糖症（hypoglycemia）。選項D「會引起低血糖症」為錯誤敘述。A正確（經口投藥）；B正確（貓可能副作用為昏睡、厭食）；C正確（增加insulin receptor敏感性）。","we":["此為正確描述：metformin可經口投藥（口服給藥），不符合題目問的「錯誤」描述。","此為正確描述：metformin對貓可能引起昏睡（lethargy）、厭食（anorexia）等副作用，不符合題目問的「錯誤」描述。","此為正確描述：metformin的主要作用機制之一是增加胰島素受體（insulin receptor）的敏感性，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_045","year":2020,"roc_year":109,"session":"1","examNo":45,"q":"下列何種維生素是天竺鼠每日必需攝取的物質？","opts":["A. A","B. B","C. C","D. D"],"ans":2,"exp":"天竺鼠（guinea pig）缺乏L-古洛糖酸內酯氧化酶（L-gulonolactone oxidase），無法在體內合成維生素C（抗壞血酸），必須每日從食物中攝取，否則會引起壞血病（scurvy）。其他維生素A（可從β-胡蘿蔔素合成）、B（腸道細菌合成）、D（日光照射合成）大多數動物可自行合成或由腸道菌提供。","we":["錯誤：維生素A大多數動物可由β-胡蘿蔔素（carotene）轉換合成，不需每日強制自食物攝取。","錯誤：維生素B群可由腸道菌叢合成，不需每日強制自食物攝取。","","錯誤：維生素D可透過紫外線照射皮膚後在體內合成，雖天竺鼠亦需飲食補充，但最關鍵的每日必需維生素為維生素C而非D。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_046","year":2020,"roc_year":109,"session":"1","examNo":46,"q":"MgO可以預防下列何者？","opts":["A. 青草痙攣","B. 貧血","C. 低血糖","D. 脊髓脫鞘作用"],"ans":0,"exp":"MgO（氧化鎂）可補充鎂元素，用於預防青草痙攣（grass tetany／低鎂血症），此症因牧草中鎂含量不足或牛羊攝食過多嫩草時鎂吸收率下降所致。貧血需鐵/銅/維生素B12；低血糖需葡萄糖/升糖素；脊髓脫鞘作用需維生素B12/銅。","we":["","錯誤：貧血的預防與治療需鐵（iron）、銅（copper）或維生素B12，MgO無法預防貧血。","錯誤：低血糖的預防需補充葡萄糖或升糖素（glucagon），MgO無法預防低血糖。","錯誤：脊髓脫鞘作用（demyelination）與維生素B12或銅缺乏有關，MgO無法預防此症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_047","year":2020,"roc_year":109,"session":"1","examNo":47,"q":"下列何者不是缺乏維生素A所引起之症狀？","opts":["A. 上皮組織角化症","B. 乾眼症","C. 夜盲症","D. 口角炎"],"ans":3,"exp":"口角炎（angular cheilitis/stomatitis）是缺乏核黃素（riboflavin，維生素B2）的典型症狀，而非維生素A缺乏。維生素A缺乏的典型症狀為：A上皮組織角化症（keratosis of epithelial tissues）、B乾眼症（xerophthalmia）、C夜盲症（nyctalopia，因視紫素rhodopsin合成需要視黃醛retinal）。","we":["此為正確描述：上皮組織角化症（epithelial keratosis）確為缺乏維生素A的症狀，不符合題目問的「不是維生素A缺乏症狀」描述。","此為正確描述：乾眼症（xerophthalmia）確為缺乏維生素A的症狀，不符合題目問的「不是維生素A缺乏症狀」描述。","此為正確描述：夜盲症（nyctalopia）確為缺乏維生素A的症狀（視紫素合成需視黃醛），不符合題目問的「不是維生素A缺乏症狀」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_048","year":2020,"roc_year":109,"session":"1","examNo":48,"q":"下列何者為反芻動物瘤胃微生物合成維生素B12所需的元素？","opts":["A. 銅","B. 鉻","C. 鐵","D. 鈷"],"ans":3,"exp":"反芻動物瘤胃微生物合成維生素B12（cobalamin）所需的微量元素為鈷（cobalt，Co），鈷是cobalamin分子中心的金屬原子。飼料中補充鈷可促進瘤胃菌合成B12，預防缺乏症。銅（copper）用於血漿銅藍蛋白/鐵代謝；鉻（chromium）為葡萄糖耐受因子；鐵（iron）為血紅素合成所需。","we":["錯誤：銅（copper）是血漿銅藍蛋白（ceruloplasmin）和鐵代謝的必需元素，並非維生素B12合成所需的核心元素。","錯誤：鉻（chromium）為葡萄糖耐受因子（glucose tolerance factor）的成分，與維生素B12合成無直接關係。","錯誤：鐵（iron）為血紅素（hemoglobin）合成所需元素，並非維生素B12的核心金屬原子。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_049","year":2020,"roc_year":109,"session":"1","examNo":49,"q":"Acyclovir可用於治療下列何種病毒的感染？","opts":["A. 馬流感病毒","B. 貓第I型疱疹病毒","C. 貓免疫不全病毒","D. 貓白血病病毒"],"ans":1,"exp":"Acyclovir為抗疱疹病毒藥物，由病毒胸苷激酶（viral thymidine kinase）活化後，抑制病毒DNA聚合酶，有效治療貓第I型疱疹病毒（Feline herpesvirus type 1, FHV-1）感染。A馬流感病毒為正黏液病毒（orthomyxovirus），acyclovir無效；C貓免疫不全病毒（FIV）和D貓白血病病毒（FeLV）均為反轉錄病毒，acyclovir無效（可用zidovudine等抗反轉錄藥物）。","we":["錯誤：馬流感病毒（equine influenza virus）為正黏液病毒（orthomyxovirus），acyclovir對RNA病毒無效，應使用oseltamivir等。","","錯誤：貓免疫不全病毒（FIV）為反轉錄病毒（retrovirus），acyclovir無法抑制反轉錄酶，應考慮zidovudine等。","錯誤：貓白血病病毒（FeLV）為反轉錄病毒（retrovirus），acyclovir對其無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_050","year":2020,"roc_year":109,"session":"1","examNo":50,"q":"下列何種藥品在分類上不屬於有機鹼？","opts":["A. erythromycin","B. ivermectin","C. metronidazole","D. benzylpenicillin"],"ans":3,"exp":"Benzylpenicillin（青黴素G）在化學分類上屬於有機酸（organic acid），pKa約2.7，含有羧酸基（carboxylic acid），製劑上以鈉鹽或鉀鹽形式存在，故不屬於有機鹼。Erythromycin（pKa~8.8）、ivermectin（弱鹼性大環內酯）、metronidazole（咪唑環含弱鹼性氮）均可歸類為有機鹼或中性偏鹼化合物。","we":["錯誤：erythromycin（紅黴素）為有機鹼（pKa~8.8），在鹼性環境中活性較強，屬於有機鹼類。","錯誤：ivermectin（伊維菌素）為弱鹼性大環內酯類化合物，可歸類為有機鹼範疇。","錯誤：metronidazole（甲硝唑）咪唑環上含弱鹼性氮，pKa約2.6，可表現弱鹼性，屬有機鹼範疇。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_051","year":2020,"roc_year":109,"session":"1","examNo":51,"q":"Trimethoprim之作用機制主要為競爭性的抑制下列何種酵素之作用？","opts":["A. DNApolymerase","B. dihydropteroate synthetase","C. dihydrofolic acid reductase","D. protein synthetase"],"ans":2,"exp":"Trimethoprim的作用機制是競爭性抑制二氫葉酸還原酶（dihydrofolic acid reductase, DHFR），阻礙二氫葉酸（DHF）轉換為四氫葉酸（THF），進而干擾細菌核酸合成。A的DNA polymerase不是trimethoprim靶點；B的dihydropteroate synthetase（DHPS）是磺胺藥的靶點；D的protein synthetase也不是trimethoprim靶點。","we":["錯誤：DNA polymerase（DNA聚合酶）並非trimethoprim的作用靶點，quinolone類藥物才是針對DNA gyrase/topoisomerase。","錯誤：dihydropteroate synthetase（DHPS，二氫蝶酸合成酶）是磺胺類藥物（sulfonamides）的作用靶點，並非trimethoprim的靶點。","","錯誤：protein synthetase（蛋白質合成酶）是aminoglycoside、tetracycline、chloramphenicol等的作用靶點，並非trimethoprim的靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_052","year":2020,"roc_year":109,"session":"1","examNo":52,"q":"下列那一藥物對青黴素酶具有抗性，可使用於治療具有β-內醯胺酶之葡萄球菌感染症？","opts":["A. ampicillin","B. oxacillin","C. amoxicillin","D. penicillin G"],"ans":1,"exp":"Oxacillin為異噁唑青黴素類（isoxazolyl penicillin），側鏈體積龐大，可立體性阻礙β-內醯胺酶（β-lactamase）的攻擊，對葡萄球菌產生的青黴素酶具有抗性，適用於治療具β-內醯胺酶的葡萄球菌感染。Ampicillin、amoxicillin、penicillin G均對葡萄球菌β-lactamase敏感，易被水解。","we":["錯誤：ampicillin對葡萄球菌產生的β-lactamase（penicillinase）敏感，容易被水解失活，需與clavulanic acid合用才能克服。","","錯誤：amoxicillin對葡萄球菌β-lactamase敏感，必須與克拉維酸（clavulanic acid）合用（amoxicillin-clavulanate）才具抗性。","錯誤：penicillin G（benzylpenicillin）對葡萄球菌產生的β-lactamase非常敏感，極易被水解失效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_053","year":2020,"roc_year":109,"session":"1","examNo":53,"q":"下列何者為胺基醣苷類（aminoglycosides）中屬新一代抗菌劑，且其腎毒性和耳毒性的不良反應較少？","opts":["A. streptomycin","B. plazomicin","C. kanamycin","D. gentamicin"],"ans":1,"exp":"Plazomicin為新一代胺基醣苷類抗生素，設計上可抵抗多種胺基醣苷修飾酶（AMEs）的失活，且其腎毒性和耳毒性較傳統胺基醣苷類（如gentamicin、amikacin、streptomycin）明顯降低。Streptomycin（第一代）耳毒性高；kanamycin（第二代）腎毒性強；gentamicin為典型具腎毒性與耳毒性的藥物。","we":["錯誤：streptomycin為第一代胺基醣苷類抗生素，耳毒性（ototoxicity）高，並非新一代低毒性製劑。","","錯誤：kanamycin（卡那黴素）為第二代胺基醣苷類，腎毒性（nephrotoxicity）明顯，非新一代低毒性製劑。","錯誤：gentamicin（慶大黴素）為傳統胺基醣苷類，兼具腎毒性和耳毒性，非新一代低毒性製劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_054","year":2020,"roc_year":109,"session":"1","examNo":54,"q":"有關lincosamides的敘述，下列何者錯誤？","opts":["A. Lincomycin屬於抑菌性抗菌劑","B. 可有效對抗Neospora canis","C. Lincomycin針對厭氧菌的抗菌作用優於clindamycin","D. 在豬高劑量使用會有神經肌肉阻斷現象"],"ans":2,"exp":"Clindamycin對厭氧菌的抗菌活性優於lincomycin（clindamycin脂溶性更高，組織穿透力更強，對厭氧菌活性更佳），因此選項C「Lincomycin針對厭氧菌的抗菌作用優於clindamycin」為錯誤敘述。A正確（lincomycin屬抑菌性）；B正確（clindamycin可有效對抗Neospora caninum）；D正確（高劑量lincosamides在豬可造成神經肌肉阻斷）。","we":["此為正確描述：Lincomycin屬於抑菌性（bacteriostatic）抗菌劑，不符合題目問的「錯誤」描述。","此為正確描述：Clindamycin可有效對抗Neospora caninum（犬新孢子蟲），不符合題目問的「錯誤」描述。","","此為正確描述：在豬高劑量使用lincosamides會有神經肌肉阻斷（neuromuscular blockade）現象，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_055","year":2020,"roc_year":109,"session":"1","examNo":55,"q":"下列何者會引起Clostridiums spp.之pseudomembranous colitis，故應謹慎使用？","opts":["A. neomycin","B. trimethoprim","C. doxycycline","D. lincomycin"],"ans":3,"exp":"Lincomycin（林可黴素）在馬（horses）使用後，可破壞腸道正常菌叢，誘發梭菌（Clostridium spp.）過度增殖，引起假膜性結腸炎（pseudomembranous colitis），故在馬應謹慎或避免使用。Neomycin為胺基醣苷類；trimethoprim為磺胺增效劑；doxycycline為四環黴素類，三者均非假膜性結腸炎的主要相關藥物。","we":["錯誤：neomycin（新黴素）為胺基醣苷類抗生素，主要副作用為腎毒性和耳毒性，並非引起假膜性結腸炎的主要相關藥物。","錯誤：trimethoprim為葉酸代謝拮抗劑/磺胺增效劑，與假膜性結腸炎的關聯性低，非主要相關藥物。","錯誤：doxycycline（多西環素）為四環黴素類抗生素，雖可影響腸道菌叢，但引起馬假膜性結腸炎的主要相關藥物為lincomycin而非doxycycline。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_056","year":2020,"roc_year":109,"session":"1","examNo":56,"q":"有關macrolides藥物之敘述，下列何者錯誤？","opts":["A. 主要抗菌範圍為革蘭氏陽性好氧菌與厭氧菌","B. Azithromycin可用於替代erythromycin治療幼馬的紅球菌肺炎","C. Tulathromycin主要用於慢性結腸炎或炎症性腸病","D. Tylosin可添加於飼料中作為生長促進劑"],"ans":2,"exp":"Tulathromycin屬於三元大環內酯類（triamilide macrolide），主要適應症為牛和豬的呼吸道疾病（bovine/swine respiratory disease complex），而非慢性結腸炎或炎症性腸病（IBD）。選項C「Tulathromycin主要用於慢性結腸炎或炎症性腸病」為錯誤敘述。A正確（主要抗菌範圍為革蘭氏陽性好氧菌與厭氧菌）；B正確（Azithromycin可替代erythromycin治療幼馬紅球菌肺炎）；D正確（Tylosin可添加飼料作生長促進劑）。","we":["此為正確描述：macrolides主要抗菌範圍為革蘭氏陽性好氧菌與厭氧菌（及部分非典型菌），不符合題目問的「錯誤」描述。","此為正確描述：Azithromycin可用於替代erythromycin治療幼馬（foal）的紅球菌（Rhodococcus equi）肺炎，不符合題目問的「錯誤」描述。","","此為正確描述：Tylosin（泰黴素）可添加於飼料中作為生長促進劑（growth promoter），不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_057","year":2020,"roc_year":109,"session":"1","examNo":57,"q":"有關vancomycin之敘述，下列何者錯誤？","opts":["A. 主要抗菌範圍為革蘭氏陽性菌","B. 用於肉豬作為治療多重抗藥性腸道感染症","C. 口服多不吸收","D. 抗菌機制與抑制細菌細胞壁形成有關"],"ans":1,"exp":"Vancomycin為人類醫學的最後防線抗生素（last-resort antibiotic），用於MRSA/VRE感染。若將其用於食用動物（尤其是肉豬），會促使萬古黴素抗性腸球菌（VRE）的產生，構成嚴重公衛威脅，因此禁止用於食用動物。選項B「用於肉豬作為治療多重抗藥性腸道感染症」為錯誤敘述。A正確（主要抗革蘭氏陽性菌）；C正確（口服多不吸收）；D正確（抑制細菌細胞壁形成，與D-Ala-D-Ala結合）。","we":["此為正確描述：vancomycin主要抗菌範圍為革蘭氏陽性菌（Gram-positive bacteria），不符合題目問的「錯誤」描述。","","此為正確描述：vancomycin口服多不吸收（poor oral absorption），口服僅用於局部腸道治療（如C. diff），不符合題目問的「錯誤」描述。","此為正確描述：vancomycin的抗菌機制是與肽聚糖前體末端D-Ala-D-Ala結合，抑制細菌細胞壁形成，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_058","year":2020,"roc_year":109,"session":"1","examNo":58,"q":"有關bacitracin之敘述，下列何者錯誤？","opts":["A. 抗菌機制與抑制細菌細胞壁形成有關","B. 經常與neomycin合併外用","C. 曾經添加於飼料作為生長促進劑","D. 因腎毒性太強，因此僅能注射使用"],"ans":3,"exp":"Bacitracin因具有嚴重的腎毒性（nephrotoxicity），故禁止全身性注射使用，只能外用（topical）或口服（局部腸道用），選項D「因腎毒性太強，因此僅能注射使用」邏輯相反，為錯誤敘述。A正確（抑制undecaprenyl pyrophosphate再生，干擾細胞壁合成）；B正確（常與neomycin合併外用）；C正確（曾作為飼料添加物生長促進劑）。","we":["此為正確描述：bacitracin的抗菌機制確與抑制細菌細胞壁形成（undecaprenyl pyrophosphate循環）有關，不符合題目問的「錯誤」描述。","此為正確描述：bacitracin確實經常與neomycin合併製成外用製劑，不符合題目問的「錯誤」描述。","此為正確描述：bacitracin曾添加於飼料作為生長促進劑，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_059","year":2020,"roc_year":109,"session":"1","examNo":59,"q":"有關ionophores之敘述，下列何者錯誤？","opts":["A. 屬於鹼性","B. 以飼料添加投予控制球蟲感染","C. 使用於反芻動物易造成瘤胃菌相轉為革蘭氏陽性菌","D. 心臟毒性常與細胞內鈣離子濃度增加有關"],"ans":2,"exp":"Ionophores（如monensin、lasalocid）對革蘭氏陽性菌的殺菌效果強於革蘭氏陰性菌，因此在反芻動物使用後，瘤胃菌相會轉變為以革蘭氏「陰性」菌為主（而非陽性菌），選項C「易造成瘤胃菌相轉為革蘭氏陽性菌」為錯誤敘述。A正確（屬鹼性化合物）；B正確（以飼料添加方式控制球蟲）；D正確（心臟毒性與細胞內鈣離子濃度增加有關）。","we":["此為正確描述：ionophores屬鹼性（basic/alkaline）化合物，不符合題目問的「錯誤」描述。","此為正確描述：ionophores確以飼料添加方式投予，用於控制球蟲（coccidiosis）感染，不符合題目問的「錯誤」描述。","","此為正確描述：ionophores的心臟毒性確與細胞內鈣離子濃度過度增加（intracellular Ca2+ accumulation）有關，導致心肌損傷，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_060","year":2020,"roc_year":109,"session":"1","examNo":60,"q":"可與腫瘤細胞的DNA結合，使鹼基烷基化（alkylation），造成DNA的損傷並抑制其複製的藥物為何？","opts":["A. streptozocin","B. mercaptopurine","C. etopside","D. dactinomycin"],"ans":0,"exp":"Streptozocin（鏈脲黴素）為亞硝基脲類（nitrosourea）烷化劑（alkylating agent），可與DNA鹼基形成共價鍵，造成鹼基烷基化（alkylation），導致DNA損傷並抑制複製。特別對胰島β細胞具選擇性毒性（可誘發實驗動物糖尿病），也具抗腫瘤活性。B的mercaptopurine為嘌呤拮抗劑/抗代謝物；C的etoposide為拓樸異構酶II抑制劑；D的dactinomycin為嵌入劑（intercalating agent）。","we":["","錯誤：mercaptopurine（6-MP）為嘌呤類似物/抗代謝藥物（antimetabolite），干擾核酸合成，並非透過DNA烷基化發揮作用。","錯誤：etoposide（依托泊苷）為拓樸異構酶II（topoisomerase II）抑制劑，抑制DNA股重新接合，並非烷化劑。","錯誤：dactinomycin（放線菌素D）為DNA嵌入劑（intercalating agent），嵌入DNA雙螺旋中阻止RNA聚合酶，並非烷化劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_061","year":2020,"roc_year":109,"session":"1","examNo":61,"q":"Penicillin G一般不經口投藥的原因為何？","opts":["A. 受唾液分解","B. 受胃液分解","C. 受胃液還原","D. 受胃液氧化"],"ans":1,"exp":"Penicillin G一般不經口投藥的主要原因是在胃部酸性環境下，胃液（gastric acid）會水解β-內醯胺環（β-lactam ring），使藥物失去活性。唾液對penicillin G的破壞作用不顯著；胃液亦非透過還原或氧化作用破壞，而是酸水解。","we":["錯誤：唾液（saliva）並不會顯著分解penicillin G，唾液pH接近中性，不足以水解β-lactam環。","","錯誤：胃液破壞penicillin G的機制是酸水解（acid hydrolysis），並非還原（reduction）作用。","錯誤：胃液破壞penicillin G的機制是酸水解（acid hydrolysis），並非氧化（oxidation）作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_062","year":2020,"roc_year":109,"session":"1","examNo":62,"q":"下列何者最不容易被葡萄球菌所產生的β-lactamase分解？","opts":["A. penicillin G","B. amoxicillin","C. nafcillin","D. ticarcillin"],"ans":2,"exp":"Nafcillin（isoxazolyl penicillin）側鏈體積龐大，對葡萄球菌產生的β-lactamase具最強的立體阻礙效果，最不容易被β-lactamase分解。Penicillin G和amoxicillin對葡萄球菌β-lactamase極為敏感；ticarcillin為抗假單胞菌廣譜青黴素，對葡萄球菌β-lactamase的抗性不如nafcillin。","we":["錯誤：penicillin G（benzylpenicillin）對葡萄球菌產生的β-lactamase非常敏感，極容易被水解失效。","錯誤：amoxicillin對葡萄球菌β-lactamase敏感，需與克拉維酸（clavulanic acid）合用才具抗性。","","錯誤：ticarcillin為抗假單胞菌廣譜青黴素，對葡萄球菌β-lactamase的抗性遠不如nafcillin。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_063","year":2020,"roc_year":109,"session":"1","examNo":63,"q":"Bacitracin主要用於治療下列何種微生物的感染？","opts":["A. 革蘭氏陽性菌","B. 革蘭氏陰性菌","C. 立克次體與黴漿菌","D. 各種住血原蟲"],"ans":0,"exp":"Bacitracin的抗菌機制（抑制undecaprenyl pyrophosphate再生，干擾細胞壁合成）主要對革蘭氏陽性菌（Gram-positive bacteria）有效，包括葡萄球菌（Staphylococcus）、鏈球菌（Streptococcus）、梭菌（Clostridium）等。對革蘭氏陰性菌活性有限；對立克次體/黴漿菌及血液原蟲均無效。","we":["","錯誤：bacitracin對革蘭氏陰性菌（Gram-negative bacteria）的活性有限，外膜屏障阻礙藥物進入，非主要適應菌種。","錯誤：bacitracin對立克次體（Rickettsia）和黴漿菌（Mycoplasma）無活性，這類生物缺乏細胞壁或具特殊結構，治療需四環黴素類等藥物。","錯誤：bacitracin對住血原蟲（blood protozoa）完全無效，抗原蟲治療需使用專屬的抗原蟲藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_064","year":2020,"roc_year":109,"session":"1","examNo":64,"q":"造成procaine penicillin G之終末半衰期（terminal half-life）較長的主要原因為何？","opts":["A. 吸收較緩慢","B. 分布體積較大","C. 能抑制肝臟的代謝酶","D. 腎臟分泌作用被飽和"],"ans":0,"exp":"Procaine penicillin G肌肉注射後，procaine鹽形成油性儲庫（depot）於注射部位，緩慢溶解並釋放藥物進入血液，吸收速率為限速步驟（flip-flop pharmacokinetics），造成終末半衰期（terminal half-life）延長。分布體積大、抑制肝代謝酶、腎分泌飽和等均非主要原因。","we":["","錯誤：分布體積（volume of distribution）較大並非procaine penicillin G終末半衰期長的主要原因；青黴素類分布體積並不特別大。","錯誤：procaine penicillin G並不會抑制肝臟代謝酶（hepatic metabolizing enzymes），此非其半衰期延長的原因。","錯誤：腎臟分泌（renal secretion）飽和並非主要原因；penicillin G在到達循環後仍被快速腎臟分泌，半衰期延長主要來自緩慢吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_065","year":2020,"roc_year":109,"session":"1","examNo":65,"q":"下列何者不是人工合成的抗菌劑？","opts":["A. oxolinic acid","B. furazolidone","C. sulfamerazine","D. thiostrepton"],"ans":3,"exp":"Thiostrepton為天然來源的環肽類抗生素（cyclic peptide antibiotic），由Streptomyces azureus產生，屬天然抗菌劑而非人工合成。Oxolinic acid（喹諾酮類）、furazolidone（硝基呋喃類）、sulfamerazine（磺胺類）均為人工合成（synthetic）的抗菌劑。","we":["錯誤：oxolinic acid（草酸喹諾酮）為合成喹諾酮類（synthetic quinolone）抗菌劑，屬人工合成化合物。","錯誤：furazolidone為合成硝基呋喃類（synthetic nitrofuran）抗菌劑，屬人工合成化合物。","錯誤：sulfamerazine（磺胺甲嗪）為合成磺胺類（synthetic sulfonamide）抗菌劑，屬人工合成化合物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_066","year":2020,"roc_year":109,"session":"1","examNo":66,"q":"下列何種磺胺劑被製成軟膏使用於燒傷皮膚，以防止細菌感染？","opts":["A. sulfasalazine","B. mafenide","C. sulfacetamide","D. sulfaquinoxaline"],"ans":1,"exp":"Mafenide（para-aminomethylbenzenesulfonamide，甲磺胺嗪）製成軟膏（cream/ointment）用於燒傷皮膚，可穿透焦痂（eschar），高水溶性，且不受PABA干擾，能有效預防燒傷部位細菌感染。Sulfasalazine用於IBD/關節疾病；sulfacetamide用於眼科；sulfaquinoxaline用於禽類球蟲病。","we":["錯誤：sulfasalazine主要用於炎症性腸病（IBD）和關節炎治療，並非製成燒傷外用軟膏。","","錯誤：sulfacetamide（磺胺醋醯）主要製成眼用製劑（ophthalmic solution/ointment），用於眼部感染，並非燒傷皮膚用藥。","錯誤：sulfaquinoxaline主要用於禽類球蟲病（poultry coccidiosis）的防治，並非燒傷皮膚用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_067","year":2020,"roc_year":109,"session":"1","examNo":67,"q":"下列何者最適用於治療犬血巴東體屬之感染？","opts":["A. ceftiofur","B. doxycycline","C. streptomycin","D. tiamulin"],"ans":1,"exp":"Doxycycline（多西環素）為治療犬血巴東體（Babesia）感染的首選藥物之一，對紅血球內寄生的原蟲具有效抑制作用，常與其他藥物（如atovaquone）合用。Ceftiofur為頭孢菌素類，無抗原蟲活性；streptomycin為胺基醣苷類，對Babesia無效；tiamulin為截短側耳素類，用於豬支原體/螺旋體感染。","we":["錯誤：ceftiofur（頭孢噻呋）為第三代頭孢菌素，對細菌有效，對Babesia等血液原蟲無抗原蟲活性。","","錯誤：streptomycin（鏈黴素）為胺基醣苷類抗生素，主要作用於細菌核糖體，對Babesia（原蟲）無效。","錯誤：tiamulin（截短側耳素）主要用於豬隻黴漿菌（Mycoplasma）和豬痢短螺旋體（Brachyspira）感染，對Babesia無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_068","year":2020,"roc_year":109,"session":"1","examNo":68,"q":"下列何者用於治療犬分枝桿菌感染（mycobacterial infections）之效果最佳？","opts":["A. clarithromycin","B. oxacillin","C. streptomycin","D. tetracycline"],"ans":0,"exp":"Clarithromycin（克拉黴素）為大環內酯類抗生素，對細胞內病原體（包括Mycobacterium spp.）具有優良穿透力和活性，是治療犬貓分枝桿菌感染的首選藥物之一，常與rifampicin等合用。Oxacillin對Mycobacterium無效；streptomycin雖有部分活性但毒性較大；tetracycline對分枝桿菌活性有限。","we":["","錯誤：oxacillin（苯唑青黴素）為耐青黴素酶的β-lactam類抗生素，主要用於MSSA感染，對分枝桿菌（Mycobacterium）完全無效。","錯誤：streptomycin（鏈黴素）雖對部分分枝桿菌有效（如M. tuberculosis），但耳毒性高，且對犬分枝桿菌感染的療效不如clarithromycin的組合治療。","錯誤：tetracycline（四環黴素）對分枝桿菌的活性有限，並非治療犬分枝桿菌感染的最佳選擇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_069","year":2020,"roc_year":109,"session":"1","examNo":69,"q":"下列何者不是rotenone的藥物特性？","opts":["A. 為植物根部的生物鹼","B. 可殺滅蝨子","C. 可用來殺滅池塘中魚類","D. 可使用於爬蟲類"],"ans":3,"exp":"Rotenone對爬蟲類（reptiles）具毒性，不適合使用於爬蟲類動物，選項D「可使用於爬蟲類」為錯誤敘述。A正確（rotenone為植物根部生物鹼，來自Derris/Lonchocarpus屬植物根部）；B正確（可殺滅蝨子等外寄生蟲）；C正確（可作為殺魚劑，用於池塘管理殺滅魚類）。","we":["此為正確描述：rotenone確為植物根部的生物鹼（來自魚藤屬Derris/Lonchocarpus根部），不符合題目問的「不是rotenone藥物特性」描述。","此為正確描述：rotenone確可殺滅蝨子（lice）等外寄生蟲，不符合題目問的「不是rotenone藥物特性」描述。","此為正確描述：rotenone確可用來殺滅池塘中的魚類（作為piscicide，用於漁業管理），不符合題目問的「不是rotenone藥物特性」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_070","year":2020,"roc_year":109,"session":"1","examNo":70,"q":"臨床上，貓分離出Blastomyces spp. 的黴菌症，下列何者為最佳醫療方案？","opts":["A. 口服titanium dioxide","B. 口服fluconazole","C. 有腎損傷時，肌肉注射amphotericin B","D. 有腎損傷時，口服benzoyl peroxide"],"ans":1,"exp":"對貓的芽生菌（Blastomyces）黴菌症，口服fluconazole為最佳方案：fluconazole口服生物利用率高，組織（含CNS）穿透性佳，副作用相對少。Titanium dioxide為防曬成分，非抗真菌藥；有腎損傷時不應肌肉注射amphotericin B（應以IV且需減量，腎損傷時更需謹慎）；benzoyl peroxide（過氧化苯甲醯）為皮膚外用抗痘藥物，非抗真菌藥。","we":["錯誤：titanium dioxide（二氧化鈦）為防曬劑成分，並非抗真菌藥物，無法治療芽生菌黴菌症。","","錯誤：amphotericin B應以靜脈注射（IV）給藥而非肌肉注射（IM）；且有腎損傷時，amphotericin B本身具腎毒性，使用上需特別謹慎或選擇替代藥物（如fluconazole）。","錯誤：benzoyl peroxide（過氧化苯甲醯）為外用抗菌/抗痘藥物，對Blastomyces等真菌感染無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_071","year":2020,"roc_year":109,"session":"1","examNo":71,"q":"下列何種口服用藥，被許可使用於犬隻（含牧羊犬），能有效對付心絲蟲、鉤蟲、鞭蟲及蛔蟲的感染性幼蟲？","opts":["A. milbemycin","B. epinephrine","C. diclofenac","D. ivermectin"],"ans":0,"exp":"Milbemycin oxime（美貝黴素肟）為口服大環內酯類抗寄生蟲藥，已獲許可用於犬（含牧羊犬collie）——在核准的心絲蟲預防劑量下，即使具有MDR1/ABCB1突變的牧羊犬也相對安全；可有效對抗心絲蟲（Dirofilaria immitis）微絲蟲、鉤蟲、鞭蟲及蛔蟲幼蟲。Ivermectin（伊維菌素）在具MDR1突變的牧羊犬有神經毒性風險，不適用。","we":["","錯誤：epinephrine（腎上腺素）為擬交感神經藥物，用於過敏性休克/心跳停止等緊急治療，並非抗寄生蟲藥物。","錯誤：diclofenac（雙氯芬酸）為非類固醇抗炎藥（NSAID），用於止痛消炎，並非抗寄生蟲藥物。","錯誤：ivermectin（伊維菌素）對具有MDR1/ABCB1基因突變的牧羊犬（collie）可能引起嚴重神經毒性，不適合用於牧羊犬品種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_072","year":2020,"roc_year":109,"session":"1","examNo":72,"q":"有關trichlorfon用於觀賞魚類的疾病治療，下列何者錯誤？","opts":["A. 多用於治療細菌性疾病","B. 對皮膚及鰓的吸蟲殺除非常有效","C. 不安定，不易儲存","D. 屬有機磷類，毒性高"],"ans":0,"exp":"Trichlorfon（敵百蟲）為有機磷類殺蟲劑，在觀賞魚疾病治療中主要用於清除外寄生蟲（monogenean flukes皮膚/鰓吸蟲、Lernaea錨蟲、Argulus魚蝨等），而非用於細菌性疾病。選項A「多用於治療細菌性疾病」為錯誤敘述。B正確（對皮膚及鰓的吸蟲非常有效）；C正確（不安定，不易儲存）；D正確（有機磷類，毒性高）。","we":["","此為正確描述：trichlorfon對觀賞魚皮膚及鰓的吸蟲（monogenean flukes）殺除非常有效，不符合題目問的「錯誤」描述。","此為正確描述：trichlorfon在溶液中不安定，容易分解，不易儲存，不符合題目問的「錯誤」描述。","此為正確描述：trichlorfon屬有機磷類（organophosphate），毒性高，使用時需謹慎，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_073","year":2020,"roc_year":109,"session":"1","examNo":73,"q":"下列何種抗黴菌藥，於治療期間須每週監控血液尿素氮？","opts":["A. amphotericin B","B. miconazole","C. flucytocine","D. griseofulvin"],"ans":0,"exp":"Amphotericin B（兩性黴素B）為多烯類抗真菌藥，具有明顯腎毒性（nephrotoxicity），治療期間必須每週監控血液尿素氮（BUN, blood urea nitrogen）和肌酸酐（creatinine）以評估腎功能。Miconazole主要外用，全身毒性低；flucytosine主要監控CBC和肝功能；griseofulvin亦主要監控CBC和肝功能。","we":["","錯誤：miconazole（咪康唑）主要為外用抗真菌藥，全身性毒性低，通常無需每週監控BUN。","錯誤：flucytosine（氟胞嘧啶）治療期間主要監控全血細胞計數（CBC）和肝功能（LFTs），而非專門監控BUN。","錯誤：griseofulvin治療期間主要監控CBC和肝功能，而非專門監控BUN。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_074","year":2020,"roc_year":109,"session":"1","examNo":74,"q":"下列何者屬於多烯類抗生素的抗黴菌劑？","opts":["A. itraconazole","B. flucytosine","C. griseofulvin","D. nystatin"],"ans":3,"exp":"Nystatin（制黴菌素）為多烯類（polyene）抗真菌抗生素，與另一多烯類amphotericin B同屬polyene macrolide，作用機制為與真菌細胞膜上的麥角固醇（ergosterol）結合，破壞細胞膜完整性。Itraconazole為azole類；flucytosine為氟化嘧啶類（fluorinated pyrimidine）；griseofulvin為苯并呋喃/grisane類，均不屬於多烯類。","we":["錯誤：itraconazole（伊曲康唑）屬於azole類抗真菌劑，作用機制是抑制麥角固醇合成（14α-demethylase抑制），並非多烯類抗生素。","錯誤：flucytosine（氟胞嘧啶）屬於氟化嘧啶類抗真菌藥，抑制RNA和DNA合成，並非多烯類抗生素。","錯誤：griseofulvin屬於benzofuran/grisane類抗真菌藥，透過干擾微管蛋白聚合（tubulin）抑制真菌有絲分裂，並非多烯類抗生素。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_075","year":2020,"roc_year":109,"session":"1","examNo":75,"q":"下列何者可用高劑量來治療腎上腺皮質亢進症？","opts":["A. griseofulvin","B. ketoconazole","C. amphotericin B","D. nystatin"],"ans":1,"exp":"Ketoconazole（酮康唑）高劑量時可抑制腎上腺皮質類固醇合成（抑制CYP17、CYP11A1等酵素），減少可體醇（cortisol）和雄激素的產生，因此高劑量可用於治療腎上腺皮質亢進症（hyperadrenocorticism, Cushing's syndrome）。Griseofulvin透過tubulin干擾抗真菌；amphotericin B和nystatin均為多烯類，無全身性類固醇合成抑制作用。","we":["錯誤：griseofulvin屬于苯并呋喃類抗真菌藥，透過干擾微管蛋白（tubulin）抑制真菌有絲分裂，不具抑制腎上腺皮質類固醇合成的作用。","","錯誤：amphotericin B為多烯類（polyene）抗真菌藥，作用於真菌細胞膜ergosterol，不具全身性抑制腎上腺皮質固醇合成的作用。","錯誤：nystatin為多烯類（polyene）外用抗真菌藥，幾乎不被全身吸收，無法抑制腎上腺皮質類固醇合成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_076","year":2020,"roc_year":109,"session":"1","examNo":76,"q":"Metronidazole對下列何種原蟲無效？","opts":["A. Giardia","B. Trichomonas","C. Histomonas","D. Coccidia"],"ans":3,"exp":"Metronidazole（甲硝唑）對球蟲（Coccidia，包括Eimeria、Isospora等，屬頂複門Apicomplexa原蟲）無效，治療球蟲需使用磺胺類藥物、托曲珠利（toltrazuril）或安普羅利（amprolium）。Metronidazole對梨形鞭毛蟲（Giardia）和毛滴蟲（Trichomonas）為首選治療藥物；對Histomonas（禽類黑頭病病原）亦有效。","we":["錯誤：metronidazole是治療梨形鞭毛蟲（Giardia）感染的首選藥物，對其有效，故Giardia並非metronidazole無效的原蟲。","錯誤：metronidazole是治療毛滴蟲（Trichomonas）感染的標準用藥，對其有效，故Trichomonas並非metronidazole無效的原蟲。","錯誤：metronidazole可用於治療禽類Histomonas meleagridis（黑頭病/histomoniasis），對其有效，故Histomonas並非metronidazole完全無效的原蟲。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_077","year":2020,"roc_year":109,"session":"1","examNo":77,"q":"有關綿羊銅中毒的敘述，下列何者錯誤？","opts":["A. 攝食牧草中天然來源的銅過量，不會引起銅中毒","B. 銅會蓄積於肝臟，遭遇緊迫肝臟會釋放大量銅於血液中","C. 血液中過量的銅離子會導致變性血紅素（methemoglobin）","D. 飼料中添加ammonium molybdate可預防銅中毒"],"ans":0,"exp":"綿羊對銅（copper）的耐受性非常低，即使攝食牧草中天然來源的銅，長期積累也可能引起銅中毒（copper toxicosis），選項A「攝食牧草中天然來源的銅過量，不會引起銅中毒」為錯誤敘述。B正確（銅蓄積於肝臟，遭遇緊迫時大量釋放入血引起溶血危機）；C正確（血液中過量銅離子導致methemoglobin形成）；D正確（飼料添加ammonium molybdate可預防銅中毒）。","we":["","此為正確描述：銅確實蓄積於肝臟，當動物遭遇緊迫（stress）時，肝臟會釋放大量銅至血液中引起溶血危機（hemolytic crisis），不符合題目問的「錯誤」描述。","此為正確描述：血液中過量銅離子確實可氧化血紅素，導致變性血紅素（methemoglobin）形成，造成溶血性貧血，不符合題目問的「錯誤」描述。","此為正確描述：飼料中添加ammonium molybdate（鉬酸銨）和硫酸鹽（sulfate）可降低銅的吸收率，用於預防銅中毒，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_078","year":2020,"roc_year":109,"session":"1","examNo":78,"q":"犬隻誤食ethylene glycol中毒後，下列何者為導致腎衰竭的代謝物？","opts":["A. oxalate","B. nitrite","C. carbonate","D. ethanol"],"ans":0,"exp":"犬隻誤食乙二醇（ethylene glycol）後，在體內經乙醇脫氫酶（alcohol dehydrogenase）代謝，最終產生草酸鹽（oxalate），與鈣離子結合形成草酸鈣（calcium oxalate）晶體沉積於腎小管，導致急性腎衰竭。亞硝酸鹽（nitrite）與乙二醇代謝無關；碳酸鹽（carbonate）非乙二醇代謝物；乙醇（ethanol）是解毒劑（競爭乙醇脫氫酶），並非乙二醇的毒性代謝物。","we":["","錯誤：nitrite（亞硝酸鹽）會導致methemoglobin形成，與乙二醇（ethylene glycol）代謝途徑無關，並非其腎毒性代謝物。","錯誤：carbonate（碳酸鹽）並非乙二醇的代謝產物，與乙二醇中毒的腎衰竭機制無關。","錯誤：ethanol（乙醇）是乙二醇中毒的解毒劑（競爭乙醇脫氫酶，減少oxalate生成），並非導致腎衰竭的毒性代謝物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_079","year":2020,"roc_year":109,"session":"1","examNo":79,"q":"硒（selenium）急性中毒，使得穀胱苷肽耗盡（glutathione depletion），首選投予下列何者替代？","opts":["A. acetylcysteine","B. methionine","C. ascorbic acid","D. dimercaprol"],"ans":0,"exp":"硒（selenium）急性中毒造成穀胱苷肽（glutathione）耗盡，首選解毒藥為乙醯半胱氨酸（N-acetylcysteine, NAC），因其可提供穀胱苷肽合成的前驅物半胱氨酸（cysteine），並直接清除活性氧（ROS）。甲硫胺酸（methionine）雖為甲基供體，直接補充GSH不如NAC有效；抗壞血酸（ascorbic acid）為抗氧化劑但特異性不足；二巰基丙醇（dimercaprol）為重金屬螯合劑（砷/汞用），不適用於硒中毒。","we":["","錯誤：methionine（甲硫胺酸）為甲基供體，雖可間接支持穀胱苷肽合成，但直接補充GSH前驅物的效果不如N-acetylcysteine（NAC）顯著。","錯誤：ascorbic acid（維生素C/抗壞血酸）具抗氧化作用，但對硒中毒的穀胱苷肽耗盡的特異性補充效果不如NAC，非首選藥物。","錯誤：dimercaprol（二巰基丙醇，BAL）為重金屬螯合劑，主要用於砷（arsenic）、汞（mercury）、鉛（lead）中毒，對硒（selenium）中毒的處理效果有限且不建議使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1091_080","year":2020,"roc_year":109,"session":"1","examNo":80,"q":"有關動物有機磷殺蟲劑急性中毒所引起的症狀，下列何者錯誤？","opts":["A. 大量流涎","B. 支氣管擴張","C. 縮瞳","D. 腸道蠕動性增加"],"ans":1,"exp":"有機磷殺蟲劑急性中毒抑制膽鹼酯酶（cholinesterase），導致乙醯膽鹼（acetylcholine, ACh）積聚，活化毒蕈鹼受體（muscarinic receptor）：M3受體激活引起支氣管「收縮」（bronchoconstriction）而非擴張；大量流涎（M3）、縮瞳（M3，虹膜括約肌）、腸道蠕動增加（M2/M3）均為正確的中毒症狀。選項B「支氣管擴張」為錯誤敘述。","we":["此為正確描述：有機磷中毒確可引起大量流涎（hypersalivation，由M3受體活化所致），不符合題目問的「錯誤」描述。","","此為正確描述：有機磷中毒確可引起縮瞳（miosis，由M3受體活化虹膜括約肌所致），不符合題目問的「錯誤」描述。","此為正確描述：有機磷中毒確可引起腸道蠕動性增加（increased GI motility，由M2/M3受體活化所致），不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_001","year":2020,"roc_year":109,"session":"2","examNo":1,"q":"先投予xylazine後再投予tolazoline時,會産生下列何種作用?","opts":["A. 相加作用(addition)","B. 相乘作用(synergism)","C. 受體拮抗 (receptor antagonism)","D. 化學拮抗 (chemical antagonism)"],"ans":2,"exp":"Xylazine 為 α2 受體促效劑（agonist），投予後會產生鎮靜、止痛、肌肉鬆弛等效果。Tolazoline 為 α2 受體拮抗劑（antagonist），可競爭性地與 α2 受體結合，阻斷 xylazine 的作用，屬於「受體拮抗（receptor antagonism）」。兩者不產生加成或相乘效果，也非透過化學方式中和。","we":["錯誤：相加作用是指兩藥合用效果等於各自效果之總和。xylazine 與 tolazoline 作用相反（一為促效劑、一為拮抗劑），不會產生相加作用。","錯誤：相乘作用（synergism）是指兩藥合用效果大於各自效果之總和。xylazine 與 tolazoline 在同一受體上競爭，作用相互抵消，無法產生相乘效果。","","錯誤：化學拮抗是指兩物質在體外或體內直接發生化學反應，互相中和（如 protamine 中和 heparin）。Tolazoline 並非透過化學反應中和 xylazine，而是競爭 α2 受體，屬受體拮抗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_002","year":2020,"roc_year":109,"session":"2","examNo":2,"q":"下列何藥品在分類上不屬於生物鹼 (alkaloids)?","opts":["A. morphine","B. atropine","C. quinine","D. digoxin"],"ans":3,"exp":"Digoxin（地高辛）來源於毛地黃植物（Digitalis），化學結構屬於強心配醣體（cardiac glycoside），骨架為固醇類（steroid），並非生物鹼（alkaloid）。Morphine、atropine、quinine 皆含有氮原子環狀結構，均屬生物鹼。","we":["錯誤：Morphine（嗎啡）含有哌啶（piperidine）環及氮原子，屬於典型生物鹼，確實歸類為 alkaloid。","錯誤：Atropine（阿托品）含有托烷（tropane）環及氮原子，屬於托烷類生物鹼，確實歸類為 alkaloid。","錯誤：Quinine（奎寧）含有喹啉（quinoline）環及氮原子，源自金雞納樹皮，屬於喹啉類生物鹼，確實歸類為 alkaloid。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_003","year":2020,"roc_year":109,"session":"2","examNo":3,"q":"下列何藥品對中樞的影響最顯著?","opts":["A. bethanechol","B. pyridostigmine","C. pancuronium","D. physostigmine"],"ans":3,"exp":"Physostigmine（毒扁豆鹼）為三級胺（tertiary amine），具有脂溶性，可跨越血腦障壁（BBB），對中樞神經系統影響最顯著。Bethanechol 為四級胺直接副交感促效劑、pyridostigmine 為四級胺膽鹼酯酶抑制劑、pancuronium 為四級胺神經肌肉阻斷劑，三者均帶永久正電荷，無法通過 BBB，故中樞作用極小。","we":["錯誤：Bethanechol 為四級胺（quaternary amine）膽鹼促效劑，帶永久正電荷，高度水溶性，無法跨越血腦障壁，對中樞的影響極微。","錯誤：Pyridostigmine 為四級胺膽鹼酯酶抑制劑，帶永久正電荷，不易通過血腦障壁，中樞作用遠不如三級胺類藥物。","錯誤：Pancuronium 為四級胺非去極化神經肌肉阻斷劑，帶永久正電荷，完全無法通過血腦障壁，不具中樞作用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_004","year":2020,"roc_year":109,"session":"2","examNo":4,"q":"下列何藥品可通過血腦障壁(BBB)?","opts":["A. succinylcholine","B. edrophonium","C. carbachol","D. doxycycline"],"ans":3,"exp":"Doxycycline（去氧羥四環素）為高脂溶性的四環素類抗生素（tetracycline），因其脂溶性高，可通過血腦障壁（BBB）。相較之下，succinylcholine（四級胺去極化肌鬆藥）、edrophonium（四級胺膽鹼酯酶抑制劑）、carbachol（四級胺膽鹼促效劑）均帶永久正電荷，不能穿越 BBB。","we":["錯誤：Succinylcholine 為四級胺去極化神經肌肉阻斷劑，帶永久正電荷，無法通過血腦障壁，不具中樞作用。","錯誤：Edrophonium 為四級胺膽鹼酯酶抑制劑，帶永久正電荷，極性高，無法通過血腦障壁。","錯誤：Carbachol 為四級胺膽鹼促效劑，帶永久正電荷，高度水溶性，無法通過血腦障壁。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_005","year":2020,"roc_year":109,"session":"2","examNo":5,"q":"下列有關標準安全界限(standard safety margin)之敘述,何者正確?","opts":["A. 標準安全界限是指到達半致死劑量(LD50)前,最少能夠達到99%的有效劑量(ED99)","B. 傳統之治療指數therapeuticindex)較標準安全界限更為保守","C. 標準安全界限最常被用於估算藥品在標的器官的穿透百分率","D. 當標準安全界限計算公式的分子愈大,表示愈安全"],"ans":3,"exp":"標準安全界限（standard safety margin, SSM）定義為：SSM = (LD1/ED99 - 1) × 100%，即最低 1% 致死劑量（LD1）除以 99% 有效劑量（ED99）。公式的分子（LD1）越大，代表在接近 100% 有效劑量時，動物中毒機率越低，藥物越安全。SSM 比傳統治療指數（TI = LD50/ED50）更保守、更嚴格。","we":["錯誤：標準安全界限使用的是 LD1（最低 1% 致死劑量）而非 LD50；分母是 ED99（99% 有效劑量），而非 ED50，故此選項描述有誤。","錯誤：傳統治療指數（TI = LD50/ED50）比標準安全界限（SSM = LD1/ED99）更寬鬆，而非更保守。SSM 才是更嚴格、更保守的安全評估方法。","錯誤：標準安全界限是評估藥物安全性（毒性相對於療效的差距），並非用於估算藥物在標的器官的穿透百分率。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_006","year":2020,"roc_year":109,"session":"2","examNo":6,"q":"下列有關藥品排泄之敘述,何者正確?","opts":["A. Probenicid可增加peicillin G的再吸收","B. Cilastatin可減少imipenem的主動分泌","C. Sodium bicarbonate可增 加phenobarbital的排泄","D. Ammonium chloride可增加salicylic acid的排泄"],"ans":2,"exp":"Phenobarbital（苯巴比妥）為弱酸性藥物（pKa ≈ 7.4）。投予 sodium bicarbonate（碳酸氫鈉）後，尿液鹼化，弱酸性藥物在鹼性環境中離子化程度增加，不易被腎小管再吸收，因此排泄增加。這是離子捕捉（ion trapping）原理的應用。","we":["錯誤：Probenecid 會抑制腎小管對 penicillin G 的主動分泌（而非增加再吸收），其結果是延長 penicillin 的作用時間，而非增加再吸收，描述方向有誤。","錯誤：Cilastatin 抑制腎臟去氫肽酶（dehydropeptidase），防止 imipenem 在腎臟被水解代謝，並非減少其主動分泌，此選項描述機轉有誤。","","錯誤：Ammonium chloride 為尿液酸化劑，酸性尿液有利於鹼性藥物（而非酸性藥物如 salicylic acid）的離子化與排泄。Salicylic acid 為弱酸，在酸性尿中離子化程度反而降低，再吸收增加，排泄減少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_007","year":2020,"roc_year":109,"session":"2","examNo":7,"q":"下列何藥品的代謝產物不具有活性?","opts":["A. phenylbutazone→oxyphenbutazone","B. aspirin→salicylic acid","C. diazepam→N-desmethyldiazepam","D. procaine→p-aminobenzoic acid"],"ans":3,"exp":"Procaine（普魯卡因）為酯類局部麻醉劑，在體內被血漿膽鹼酯酶水解後生成 p-aminobenzoic acid（PABA，對胺苯甲酸）與 diethylaminoethanol，PABA 本身無麻醉活性，為非活性代謝產物。相較之下，其他選項的代謝物均具有藥理活性。","we":["錯誤：Phenylbutazone 代謝後產生 oxyphenbutazone，後者仍具有 NSAID 消炎止痛活性，屬於活性代謝物。","錯誤：Aspirin 水解後產生 salicylic acid，後者仍具消炎、止痛、退熱活性，屬於活性代謝物。","錯誤：Diazepam（苯二氮平類）去甲基後代謝為 N-desmethyldiazepam（nordazepam），後者仍具有苯二氮平類的鎮靜安眠活性，屬於活性代謝物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_008","year":2020,"roc_year":109,"session":"2","examNo":8,"q":"當肝臟血流不受限制且肝臟内在清除能力(intrinsic clearance)大於0.8時,較容易見到下列何種現象?","opts":["A. 肝臟微粒體酶誘導作用","B. 肝臟微粒體酶抑制作用","C. 首渡效應(first-pass effect)","D. 腸肝再循環(enterohepticrecycling)"],"ans":2,"exp":"肝臟內在清除能力（intrinsic clearance）大於 0.8 代表高肝萃取率（high hepatic extraction ratio）。對於此類藥物，口服後幾乎全部在首次通過肝臟時被代謝，生體可用率（bioavailability）極低，此現象稱為首渡效應（first-pass effect）。肝臟血流不受限制使藥物可充分接觸肝臟，進一步放大首渡效應。","we":["錯誤：肝臟微粒體酶誘導作用是指長期使用某些藥物（如 phenobarbital）導致 CYP450 酶表現增加，與高肝萃取率及首渡效應無直接因果關係。","錯誤：肝臟微粒體酶抑制作用是指某些藥物（如 ketoconazole）抑制 CYP450 酶活性，與題目所述的高 intrinsic clearance 情境相反。","","錯誤：腸肝再循環（enterohepatic recycling）是指藥物隨膽汁排入腸道後再被吸收的循環現象，與高肝萃取率的首渡效應為不同機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_009","year":2020,"roc_year":109,"session":"2","examNo":9,"q":"改變肝臟血流較不會影響下列何藥品在肝臟的清除?","opts":["A. diazepam(在犬隻)","B. lidocaine","C. pethidine","D. phenylbutazone"],"ans":3,"exp":"Phenylbutazone 具有低肝萃取率（low hepatic extraction ratio），其清除屬於容量限制型（capacity-limited clearance）。此類藥物的清除率主要由肝臟酶的代謝容量決定，而非取決於肝臟血流量；因此改變肝臟血流對其清除影響很小。反之，高萃取率藥物（如 lidocaine、pethidine、diazepam in dogs）的清除率對血流變化非常敏感。","we":["錯誤：Diazepam 在犬隻具有高肝萃取率，其清除屬於血流依賴型（flow-dependent），改變肝臟血流會顯著影響其清除速率。","錯誤：Lidocaine 具有高肝萃取率（接近 0.7-0.8），屬於血流依賴型清除藥物，肝臟血流改變會明顯影響其清除。","錯誤：Pethidine（meperidine）具有高肝萃取率，屬於血流依賴型清除藥物，肝臟血流改變會影響其清除速率。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_010","year":2020,"roc_year":109,"session":"2","examNo":10,"q":"下列何藥品經口服投予犬隻後,於胃中的非離子態(unionizedform)比例最多?","opts":["A. albuterol","B. terbutaline","C. isoxsuprine","D. aspirin"],"ans":3,"exp":"Aspirin（乙醯水楊酸）為弱酸性藥物（pKa ≈ 3.5）。在胃液（pH ≈ 1-2）中，依據 Henderson-Hasselbalch 方程式，弱酸性藥物在酸性環境中幾乎完全以非離子態（unionized form）存在（可高達 99% 以上）。Albuterol、terbutaline、isoxsuprine 為弱鹼性藥物，在酸性胃液中離子化程度高，非離子態比例極低。","we":["錯誤：Albuterol（沙丁胺醇）為弱鹼性 β2 促效劑，在酸性胃液（pH 1-2）中高度離子化，非離子態比例極低，不易被胃黏膜吸收。","錯誤：Terbutaline 為弱鹼性 β2 促效劑，在酸性胃液中高度離子化，非離子態比例遠低於弱酸性藥物如 aspirin。","錯誤：Isoxsuprine 為弱鹼性 β2 促效劑（兼具 α 阻斷特性），在酸性胃液中高度離子化，非離子態比例低。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_011","year":2020,"roc_year":109,"session":"2","examNo":11,"q":"位於血腦障壁(blood-brain barrier)中P-醣蛋白(P-glycoprotein)的功能為何?","opts":["A. 透過主動運輸(active tansport)的方式將藥物自中樞神經系統中排出","B. 透過吞噬(phagocytosis)的方式將藥物自中樞神經系統中排出","C. 透過促進性擴散(facilitateddiffusio)的方式將藥物自血液中送入中樞神經系統中","D. 透過吞噬phagocytosis的方式將藥物自血液中送人中樞神經系統中"],"ans":0,"exp":"P-醣蛋白（P-glycoprotein, P-gp）位於血腦障壁（BBB）的腦側毛細血管內皮細胞上，屬於 ABC 轉運蛋白超家族成員。其功能為利用 ATP 水解的能量，透過主動運輸（active transport）將進入腦部的藥物或外來物質泵回血液，是 CNS 的重要保護機制。","we":["","錯誤：吞噬（phagocytosis）是細胞攝入大分子顆粒的過程（如白血球吞噬細菌），並非 P-醣蛋白的作用機制。P-gp 是膜上的轉運蛋白，透過 ATP 驅動的主動外排發揮作用。","錯誤：促進性擴散（facilitated diffusion）是順濃度梯度的被動轉運，不需耗能，且方向為從高濃度往低濃度。P-gp 是逆濃度梯度、耗能的主動外排幫浦，機制不同。","錯誤：P-醣蛋白的方向是將藥物從 CNS 排出至血液，而非從血液送入 CNS。吞噬作用也並非 P-gp 的作用方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_012","year":2020,"roc_year":109,"session":"2","examNo":12,"q":"下列有關經口投藥的敘越,何者錯誤?","opts":["A. 動物種別會明顯影響吸收效率","B. 瘤胃常會延遲吸收","C. 胺基醣苷類經口投藥後吸收良好","D. 為群體治療最常使用的投藥方式"],"ans":2,"exp":"胺基醣苷類抗生素（aminoglycosides，如 gentamicin、amikacin）為多陽離子極性分子，在腸道 pH 下高度離子化，口服後吸收極差（生體可用率 < 5%）。若需全身抗菌效果，必須採腸道外（parenteral）注射給藥。口服給藥僅用於腸道局部感染（如術前腸道準備）。","we":["此為正確描述：動物種別（如反芻動物、單胃動物、禽類）會因消化道構造、pH、菌叢等差異，明顯影響口服藥物的吸收效率，不符合題目問的「錯誤」描述。","此為正確描述：反芻動物的瘤胃（rumen）容積大且 pH 特殊，口服藥物須先通過瘤胃再進入真胃與小腸吸收，因此常會延遲藥物吸收，不符合題目問的「錯誤」描述。","","此為正確描述：經口投藥（飲水或飼料中混藥）為群體治療（mass medication）中最常採用、操作最簡便的給藥方式，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_013","year":2020,"roc_year":109,"session":"2","examNo":13,"q":"若欲以固定速率靜脈輸注藥物達到血漿中穩定之藥物濃度,則給藥速率應該等於下列何種參數?","opts":["A. 藥物之半衰期","B. 藥物排除速率","C. 藥物之分布速率","D. 肝臟之代謝速率"],"ans":1,"exp":"以固定速率靜脈輸注達到穩態（steady state）濃度時，血漿藥物濃度維持恆定，意即「輸注速率 = 排除速率」（rate in = rate out）。穩態時的藥物濃度（Css）= 輸注速率（R0）÷ 總清除率（CL），此時給藥速率必須等於藥物排除速率，才能維持恆定濃度。","we":["錯誤：半衰期（t½）是描述藥物濃度減少一半所需的時間，是時間單位，並非速率（rate）參數，不能直接等於給藥速率。","","錯誤：藥物分布速率描述藥物在體內各組織間的分配過程，與穩態下維持恆定血漿濃度所需的「輸注速率 = 排除速率」無直接等量關係。","錯誤：肝臟代謝速率僅是整體排除的一部分（排除途徑包括肝代謝及腎排泄等），以肝臟代謝速率代替整體排除速率並不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_014","year":2020,"roc_year":109,"session":"2","examNo":14,"q":"下列何者為誤注射etorphine-acepromazine後最嚴重之毒性反應?","opts":["A. 中樞神經興奮","B. 尿腎結晶","C. 呼吸抑制","D. 抑制造血機能"],"ans":2,"exp":"Etorphine（埃托啡）為極強效的 μ 阿片受體促效劑，效力約為嗎啡的 1,000-3,000 倍。誤注射 etorphine-acepromazine（M99 配方）至人體後，最嚴重且危及生命的毒性反應為呼吸抑制（respiratory depression），可迅速導致呼吸衰竭及死亡。解毒劑為 diprenorphine（M50-50）或 naloxone。","we":["錯誤：中樞神經興奮並非 etorphine 的主要毒性，etorphine 為 μ 受體促效劑，作用為中樞神經抑制（鎮靜、呼吸抑制），而非興奮。","錯誤：尿腎結晶為磺胺類藥物的腎毒性表現，與 etorphine 的毒性無關。誤注射 etorphine-acepromazine 的主要危險為急性呼吸衰竭，而非腎結晶。","","錯誤：抑制造血機能（如顆粒球缺乏症）為氯黴素（chloramphenicol）等藥物的毒性，etorphine 的急性毒性以呼吸抑制為最嚴重且立即危及生命的反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_015","year":2020,"roc_year":109,"session":"2","examNo":15,"q":"臨床上使用高劑量之doxapram所造成之不良反應主要為:","opts":["A. 發生癲癇","B. 肌肉松弛","C. 腸道絞痛","D. 呼吸抑制"],"ans":0,"exp":"Doxapram 為呼吸興奮劑，低劑量時主要刺激頸動脈竇化學受體（carotid body chemoreceptors），增加呼吸頻率與深度。高劑量時則直接刺激延腦呼吸中樞及更廣泛的 CNS，過度興奮可引發癲癇（seizures）。這是劑量依賴性的 CNS 毒性：治療劑量 → 呼吸興奮；高劑量 → 癲癇發作。","we":["","錯誤：肌肉鬆弛與 doxapram 的藥理作用相反。Doxapram 為 CNS 興奮劑，高劑量造成 CNS 過度興奮（如癲癇），而非肌肉鬆弛。","錯誤：腸道絞痛並非 doxapram 高劑量的主要不良反應。Doxapram 的毒性以神經系統過度興奮（如癲癇、高血壓）為主，而非腸道平滑肌痙攣。","錯誤：呼吸抑制與 doxapram 的作用完全相反；doxapram 本身用於對抗呼吸抑制，高劑量造成呼吸過度興奮甚至癲癇，而非呼吸抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_016","year":2020,"roc_year":109,"session":"2","examNo":16,"q":"下列何者為benzodiazepin類衍生物受體之特異性拮抗劑?","opts":["A. flumazenil","B. doxapram","C. yohimbine","D. adrenaline"],"ans":0,"exp":"Flumazenil（氟馬西尼）為苯二氮平類（benzodiazepine, BZD）受體的特異性競爭性拮抗劑，與 GABA-A 受體複合體上的苯二氮平結合位點競爭，可逆轉苯二氮平類藥物（如 diazepam、midazolam）引起的鎮靜與呼吸抑制，廣泛用於 BZD 過量的解毒治療。","we":["","錯誤：Doxapram 為呼吸興奮劑，作用機轉是刺激頸動脈體化學受體及延腦呼吸中樞，並非苯二氮平受體的特異性拮抗劑。","錯誤：Yohimbine 為 α2 腎上腺素受體拮抗劑，主要用於逆轉 α2 促效劑（如 xylazine）的鎮靜效果，與苯二氮平受體無關。","錯誤：Adrenaline（腎上腺素）為 α 與 β 腎上腺素受體促效劑，用於急救（如心跳停止、過敏性休克），並非苯二氮平受體拮抗劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_017","year":2020,"roc_year":109,"session":"2","examNo":17,"q":"Fentanyl citrate的臨床用途主要為:","opts":["A. 肌肉鬆弛","B. 祛痰止咳","C. 止痛作用","D. 安神鎮靜"],"ans":2,"exp":"Fentanyl citrate（芬太尼檸檬酸鹽）為強效合成型 μ 阿片受體促效劑，效力約為嗎啡的 80-100 倍。其臨床主要用途為止痛（analgesia），包括術前、術中及術後的鎮痛，以及慢性疼痛管理（如貼片劑型）。","we":["錯誤：肌肉鬆弛（neuromuscular blockade）屬於神經肌肉阻斷劑（如 pancuronium、vecuronium）的作用範疇；fentanyl 為阿片類鎮痛藥，雖可降低肌肉張力，但主要用途並非肌肉鬆弛。","錯誤：祛痰止咳作用屬於 codeine、butorphanol 等藥物的臨床適應症；fentanyl 雖為阿片類但臨床上主要用途為強效止痛，而非祛痰止咳。","","錯誤：安神鎮靜（sedation）雖為阿片類藥物的副作用之一，但 fentanyl 的主要臨床用途為強效止痛；若以鎮靜為主要目的，通常選用 acepromazine、medetomidine 等藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_018","year":2020,"roc_year":109,"session":"2","examNo":18,"q":"下列何者投予動物後,最可能造成呼吸道阻力增加?","opts":["A. phenoxybenzamine","B. terbutaline","C. propranolol","D. prazosin"],"ans":2,"exp":"Propranolol 為非選擇性 β 受體阻斷劑（β1 + β2 blocker）。阻斷支氣管平滑肌上的 β2 受體後，交感神經的支氣管擴張作用被消除，副交感神經（M3 受體）的支氣管收縮作用相對佔優，導致支氣管收縮、氣道阻力增加，對氣喘或有支氣管痙攣傾向的動物尤為危險。","we":["錯誤：Phenoxybenzamine 為非選擇性 α 受體阻斷劑；支氣管平滑肌主要受 β2 受體調控（擴張）和 M3 受體調控（收縮），α 受體對支氣管作用影響甚微，阻斷 α 受體不會導致明顯的氣道阻力增加。","錯誤：Terbutaline 為選擇性 β2 受體促效劑，可使支氣管平滑肌鬆弛擴張，降低氣道阻力，臨床上用於治療支氣管痙攣，效果與題目要求相反。","","錯誤：Prazosin 為選擇性 α1 受體阻斷劑，主要用於降血壓（擴張血管），對支氣管平滑肌的 α 受體作用微弱，不會明顯造成支氣管痙攣或氣道阻力增加。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_019","year":2020,"roc_year":109,"session":"2","examNo":19,"q":"下列何者可將突觸前之交感神經終端(突觸球)所回收(reuptak)的兒茶酚胺代謝成非活化體?","opts":["A. 乙醯膽鹼酯酶 (acetylcholine esterase ; AChE )","B. 偽膽鹼酯酶 (pseudocholinesterase; PChE)","C. 單胺氧化酶(monoamine oxidase; MAO )","D. 兒茶酚-O-甲基轉移酶 (catechol-0-methyltransferase; COMT) ."],"ans":2,"exp":"交感神經末梢（突觸球）釋放的正腎上腺素（NE）在作用後，大部分由突觸前回收（reuptake-1）進入神經終末，由線粒體外膜上的單胺氧化酶（monoamine oxidase, MAO）分解代謝為非活化代謝物（如 DHMA、DOMA），防止 NE 再次進入囊泡。這是突觸間隙 NE 失活的主要途徑之一。","we":["錯誤：乙醯膽鹼酯酶（AChE）專門水解乙醯膽鹼（ACh），不負責代謝兒茶酚胺類（如 NE）。正腎上腺素由 MAO 和 COMT 代謝，而非 AChE。","錯誤：偽膽鹼酯酶（PChE，又稱血漿膽鹼酯酶）水解血漿中的乙醯膽鹼及酯類藥物（如 succinylcholine、procaine），不負責代謝突觸前回收的兒茶酚胺。","","錯誤：兒茶酚-O-甲基轉移酶（COMT）主要在突觸間隙及肝腎組織中將兒茶酚胺甲基化（如將 NE 轉換為 normetanephrine），並非在突觸前神經末梢內代謝回收的 NE；突觸前的代謝主要靠 MAO。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_020","year":2020,"roc_year":109,"session":"2","examNo":20,"q":"下列何者作用在中樞與周邊的腎上腺素性神經末梢,阻斷正腎上腺素的回收作用(reuptake)?","opts":["A. bretylium","B. cocaine","C. reserpine","D. guanethidine"],"ans":1,"exp":"Cocaine（古柯鹼）透過阻斷突觸前的正腎上腺素及多巴胺回收轉運體（NE transporter, DAT），使突觸間隙中的 NE 及 DA 濃度升高，產生交感神經興奮樣作用（sympathomimetic effect）及 CNS 興奮作用。這是其成癮性及心血管毒性的主要機制。","we":["錯誤：Bretylium 為腎上腺素神經元阻斷劑（adrenergic neuron blocker），會阻斷 NE 從神經末梢的釋放（抑制突觸囊泡釋放），機制完全不同於 cocaine 的回收阻斷。","","錯誤：Reserpine 會阻斷囊泡單胺轉運體（VMAT），使 NE、DA 無法儲存於囊泡中，導致兒茶酚胺耗竭，效果與 cocaine 的回收阻斷（使 NE 增加）相反。","錯誤：Guanethidine 為腎上腺素神經元阻斷劑，進入神經末梢後取代 NE 儲存於囊泡，阻止 NE 釋放，最終耗竭 NE，效果與 cocaine 相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_021","year":2020,"roc_year":109,"session":"2","examNo":21,"q":"投予carbachol產生蕈毒鹼性受體的作用,不包括下列何者?","opts":["A. 心搏徐緩","B. 骨骼肌鬆弛","C. 排尿","D. 支氣管腺體分泌增加"],"ans":1,"exp":"Carbachol 作用於蕈毒鹼性受體（muscarinic receptors, M1-M3）產生的效應包括：心搏徐緩（M2，心臟）、排尿（M3，膀胱逼尿肌收縮）、支氣管腺體分泌增加（M3，腺體）、縮瞳、腸胃蠕動增加等。骨骼肌鬆弛（skeletal muscle relaxation）不是蕈毒鹼性受體的作用，骨骼肌神經肌肉接合處（NMJ）使用的是菸鹼性受體（nicotinic receptors），而非蕈毒鹼性受體。","we":["此為正確描述：心搏徐緩（bradycardia）是 carbachol 作用於心臟 M2 受體的典型蕈毒鹼性效應，確實屬於 muscarinic 作用，不符合題目問的「不包括」描述。","","此為正確描述：排尿（urination）是 carbachol 作用於膀胱 M3 受體，使逼尿肌收縮、括約肌鬆弛，促進排尿，確實屬於 muscarinic 作用，不符合題目問的「不包括」描述。","此為正確描述：支氣管腺體分泌增加是 carbachol 作用於支氣管腺體 M3 受體的效應，確實屬於 muscarinic 作用，不符合題目問的「不包括」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_022","year":2020,"roc_year":109,"session":"2","examNo":22,"q":"應用於犬及貓高血壓之優先選擇藥物分別為:","opts":["A. amlodipine、hydralazine","B. ACE inhibitors 、amlodipine","C. propranolol、benazepril","D. atenolol、sodium nitroprusside"],"ans":1,"exp":"犬隻高血壓的優先治療藥物為 ACE 抑制劑（如 enalapril、benazepril），可阻斷腎素-血管收縮素系統，減少血管收縮素 II 生成，降低血壓並具有腎臟保護作用。貓咪高血壓的優先治療藥物為氨氯地平（amlodipine），為二氫吡啶類鈣離子通道阻斷劑，療效確切且耐受性佳。","we":["錯誤：Amlodipine 為貓咪高血壓的優先用藥，而非犬隻；hydralazine 雖可用於高血壓但非優先選擇。犬貓的優先選擇應分別為 ACE 抑制劑與 amlodipine，選項順序及對應動物均有誤。","","錯誤：Propranolol（非選擇性 β 阻斷劑）用於犬隻高血壓非首選，且可能引起支氣管痙攣；benazepril 雖為 ACE 抑制劑可用於犬隻，但搭配 propranolol 並非標準一線組合，且此選項未正確對應貓咪的優先選擇。","錯誤：Atenolol（選擇性 β1 阻斷劑）並非犬隻高血壓的優先選擇；sodium nitroprusside 為靜脈急救用血管擴張劑（高血壓危象），非常規口服一線治療，此組合不符合臨床一線建議。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_023","year":2020,"roc_year":109,"session":"2","examNo":23,"q":"下列何種藥物對於控制digitalis中毒所引起之心室心搏過速的效果最佳?","opts":["A. quinidine","B. amiodarone","C. phenytoin","D. nifedipine"],"ans":2,"exp":"Phenytoin（苯妥英）為 Class IB 抗心律不整藥，可抑制心室的異常自律性（automaticity），是治療 digitalis（毛地黃）中毒所引起心室心搏過速的首選藥物。其特點是在抑制心室異常放電的同時，不會進一步抑制 AV 結傳導（甚至可改善 digitalis 造成的 AV 傳導抑制），且能競爭性阻斷 digitalis 的受體結合。","we":["錯誤：Quinidine 為 Class IA 抗心律不整藥，本身也具有 digitalis 樣的毒性潛力，且可增加 digoxin 血中濃度（抑制 P-gp 及腎排泄），用於 digitalis 中毒時會加重毒性，不適合作首選。","錯誤：Amiodarone 為 Class III 抗心律不整藥，雖可用於多種心律不整，但並非 digitalis 中毒性心室心搏過速的首選藥物；且 amiodarone 可抑制 AV 傳導，可能加重 digitalis 的 AV 傳導阻滯。","","錯誤：Nifedipine 為二氫吡啶類鈣離子通道阻斷劑，主要作用為血管擴張降壓，對心室心律不整的療效有限，不適合用於 digitalis 中毒所致心室心搏過速的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_024","year":2020,"roc_year":109,"session":"2","examNo":24,"q":"下列何者不會增加心收縮力?","opts":["A. atenolol","B. dobutamine","C. pimobendan","D. amrinone"],"ans":0,"exp":"Atenolol 為選擇性 β1 受體阻斷劑，阻斷心肌細胞 β1 受體後會降低心肌收縮力（負性肌力作用，negative inotropic effect），而非增加心收縮力。其他三個選項均為正性肌力藥：dobutamine（β1 促效劑）、pimobendan（PDE 抑制劑 + 鈣離子增敏劑）、amrinone（PDE3 抑制劑）均可增加心肌收縮力。","we":["","錯誤：Dobutamine 為選擇性 β1 受體促效劑，可顯著增加心肌收縮力（正性肌力作用），常用於急性心臟衰竭的短期治療，確實會增加心收縮力，不符合題目問的「不會增加」。","錯誤：Pimobendan 為 PDE III 抑制劑同時具有鈣離子增敏（calcium sensitizer）作用，可增加心肌收縮力，是犬隻充血性心臟衰竭的重要治療藥物，確實會增加心收縮力，不符合題目問的「不會增加」。","錯誤：Amrinone 為 PDE3 抑制劑，抑制 cAMP 分解 → 胞內 cAMP 增加 → 鈣離子流入增加 → 心肌收縮力增加，確實會增加心收縮力，不符合題目問的「不會增加」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_025","year":2020,"roc_year":109,"session":"2","examNo":25,"q":"Propranolol對運動中動物生理反應之主要影響為:","opts":["A. 血壓上升","B. 心跳減慢","C. 氣管擴張","D. 心肌收縮增強"],"ans":1,"exp":"Propranolol 為非選擇性 β 受體阻斷劑（β1 + β2）。在運動時，交感神經活性增加，心跳加速（β1 效應）；投予 propranolol 後，β1 受體被阻斷，心臟對交感神經的變時性（chronotropic）反應受抑制，心跳速率顯著降低，是運動時最主要的生理影響。","we":["錯誤：Propranolol 阻斷 β1 受體後，心輸出量下降，血壓傾向降低而非上升；且阻斷 β2 受體可引起輕度血管收縮，但整體上運動時血壓上升並非 propranolol 的主要藥理效果。","","錯誤：Propranolol 阻斷 β2 受體後，支氣管平滑肌失去 β2 擴張效應，反而引起支氣管收縮（bronchospasm），氣管會收縮而非擴張，是使用 propranolol 需注意的不良反應。","錯誤：Propranolol 阻斷心肌 β1 受體，產生負性肌力作用（negative inotropic effect），心肌收縮力下降而非增強，與題目描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_026","year":2020,"roc_year":109,"session":"2","examNo":26,"q":"利尿劑可以改善下列何種心臟功能,所以用於治療心臟衰喝?","opts":["A. 前負荷(preload)","B. 後負荷(afterload)","C. 心臟收縮力","D. 心跳速率"],"ans":0,"exp":"利尿劑（diuretics）藉由增加腎臟水分與鈉排泄，減少血容量（blood volume），進而降低靜脈回流量（venous return）與心臟充填壓，即降低前負荷（preload）。在心臟衰竭中，降低前負荷可減輕心臟充血與肺水腫，改善症狀。利尿劑本身不直接改善後負荷（由 ACE 抑制劑、血管擴張劑達成）、收縮力（由強心劑達成）或心跳速率（由 β 阻斷劑或 digoxin 達成）。","we":["","錯誤：後負荷（afterload）的改善主要靠血管擴張劑（如 ACE 抑制劑、amlodipine、hydralazine），利尿劑本身主要作用為降低前負荷（減少血容量），對後負荷影響有限。","錯誤：心臟收縮力（contractility）的改善屬於正性肌力藥物的作用範疇（如 digoxin、dobutamine、pimobendan），利尿劑本身不具有直接增加心肌收縮力的作用。","錯誤：心跳速率（heart rate）的調控屬於β阻斷劑（減慢）或抗心律不整藥（如 digoxin 可減慢）的作用，利尿劑本身不直接影響心跳速率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_027","year":2020,"roc_year":109,"session":"2","examNo":27,"q":"下列何者為直接鹼化劑,可用於矯正代謝性酸中毒?","opts":["A. sodium acetate","B. sodium bicarbonate","C. sodium chloride","D. sodium citrate"],"ans":1,"exp":"Sodium bicarbonate（碳酸氫鈉，NaHCO3）為直接鹼化劑，靜脈注射後直接提供 HCO3- 離子，立即中和血液中過多的 H+，迅速矯正代謝性酸中毒。其他含鈉的鹽類（如 sodium acetate、sodium citrate）需先在肝臟代謝才能轉化為碳酸氫鹽，屬間接鹼化劑；sodium chloride 無鹼化作用。","we":["錯誤：Sodium acetate 需在肝臟代謝，乙酸根（acetate）氧化為 CO2 和 H2O，相當於消耗 H+，間接產生鹼化效果，屬間接鹼化劑，而非直接鹼化劑。","","錯誤：Sodium chloride（生理食鹽水）不含鹼化成分，注射大量 NaCl 反而可能因 Cl- 過多而引起高氯性酸中毒，完全不具矯正代謝性酸中毒的作用。","錯誤：Sodium citrate 需在肝臟代謝，檸檬酸根被三羧酸循環（Krebs cycle）氧化後，相當於消耗 H+，間接產生鹼化效果，屬間接鹼化劑，而非直接鹼化劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_028","year":2020,"roc_year":109,"session":"2","examNo":28,"q":"Spironolactone抑制下列何種物質的生理作用?","opts":["A. estrogen","B. mineralocorticoid","C. progesterone","D. testosterone"],"ans":1,"exp":"Spironolactone（螺內酯）為鉀離子保留性利尿劑，其作用機轉是在腎臟集尿管（collecting duct）與遠曲小管競爭性阻斷礦皮質素（mineralocorticoid，即醛固酮 aldosterone）受體，抑制醛固酮促進鈉重吸收與鉀排泄的作用，進而產生保鉀排鈉的利尿效果。","we":["錯誤：Spironolactone 對雌激素（estrogen）受體有微弱的親和力，可作為抗雄激素（anti-androgen）副作用，但主要臨床用途並非抑制 estrogen 作用；其主要藥理機轉是拮抗 mineralocorticoid（醛固酮）受體。","","錯誤：Spironolactone 雖具有微弱的抗孕激素（anti-progestogenic）活性，但主要機轉並非抑制 progesterone 作用；其核心作用為拮抗腎臟集尿管的醛固酮（mineralocorticoid）受體。","錯誤：Spironolactone 雖可作為抗雄激素（anti-androgen，用於多毛症、痤瘡等），具有阻斷 testosterone 受體的輕微作用，但這並非其利尿作用的主要機轉；利尿作用源自拮抗 mineralocorticoid 受體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_029","year":2020,"roc_year":109,"session":"2","examNo":29,"q":"投予尿液酸化劑氯化銨(ammonium chloride)會增加鹼性藥物從尿液排除的機制為何?","opts":["A. 減少藥物在腎小管的主動分泌","B. 增加藥物的絲球體過濾","C. 減少藥物吸附於腎小管","D. 減少藥物於腎小管的再吸收"],"ans":3,"exp":"氯化銨（NH4Cl）為尿液酸化劑，使尿液 pH 降低。鹼性藥物（弱鹼，如苯丙胺類）在酸性尿液中依據 Henderson-Hasselbalch 方程式，大量離子化（BH+ 形式），離子化藥物的脂溶性低、不易穿透腎小管細胞膜，因此再吸收減少，滯留於尿液中排出（ion trapping）。","we":["錯誤：酸化尿液的目的是改變藥物的離子化程度以減少再吸收，而非減少主動分泌。腎小管的主動分泌是獨立的轉運蛋白機制，不受 pH 直接影響。","錯誤：尿液 pH 改變不會影響腎小球過濾率（GFR）。GFR 取決於腎小球濾過壓及腎血流量，與尿液酸化無關。增加藥物排除的機制是減少再吸收，而非增加過濾。","錯誤：藥物不是被「吸附」在腎小管表面，而是透過被動擴散（非離子態）穿越腎小管上皮細胞被再吸收。酸化尿液後鹼性藥物離子化增加，無法透過被動擴散再吸收，此處「減少吸附」描述機制不正確。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_030","year":2020,"roc_year":109,"session":"2","examNo":30,"q":"下列何者是omeprazole抑制胃酸分泌的機轉?","opts":["A. 阻断histamine receptor","B. 阻斷serotonin receptor","C. 抑制proton pump","D. 抑制sodium pump"],"ans":2,"exp":"Omeprazole（奧美拉唑）為質子幫浦抑制劑（Proton Pump Inhibitor, PPI），其作用機轉是不可逆地抑制胃壁細胞（parietal cells）分泌小管上的 H+/K+-ATPase（質子幫浦），阻斷胃酸分泌的最終共同通路，是目前抑制胃酸分泌效果最強的藥物。","we":["錯誤：阻斷 histamine receptor（H2）是 H2 拮抗劑（如 famotidine、ranitidine、cimetidine）的作用機轉，並非 omeprazole 的機轉。Omeprazole 直接作用於更下游的質子幫浦，抑制效果比 H2 拮抗劑更強。","錯誤：阻斷 serotonin receptor 與胃酸抑制無關；serotonin 受體拮抗劑（如 ondansetron）用於止吐，而非抑酸。Omeprazole 的機轉與 serotonin 受體完全無關。","","錯誤：Sodium pump（Na+/K+-ATPase）廣泛存在於體細胞膜上，負責維持細胞膜電位，與胃酸分泌無直接關係。Omeprazole 特異性抑制胃壁細胞的 H+/K+-ATPase（質子幫浦），而非 sodium pump。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_031","year":2020,"roc_year":109,"session":"2","examNo":31,"q":"下列何者具有胃黏膜保護作用,但不影響胃酸的分泌?","opts":["A. famotidine","B. misoprostol","C. omeprazole","D. sucralfate"],"ans":3,"exp":"Sucralfate（硫糖鋁）為胃黏膜保護劑，在酸性環境（pH < 4）下聚合為黏稠的糊狀物，選擇性附著於潰瘍部位（特別是帶負電的壞死組織表面），形成保護屏障，防止胃酸、胃蛋白酶及膽汁的侵蝕，促進潰瘍癒合。重要的是，sucralfate 本身不影響胃酸的分泌（不抑制 H+ 分泌），屬於純粹的物理保護機制。","we":["錯誤：Famotidine 為 H2 受體拮抗劑，可阻斷胃壁細胞的 H2 受體，明顯降低胃酸分泌，並無物理性黏膜保護作用；其確實會影響胃酸分泌。","錯誤：Misoprostol 為合成的前列腺素 E1（PGE1）類似物，可刺激胃黏液與碳酸氫鹽分泌、減少胃酸分泌（抑制腺苷酸環化酶），同時保護胃黏膜；其確實會影響胃酸分泌。","錯誤：Omeprazole 為質子幫浦抑制劑（PPI），不可逆地抑制 H+/K+-ATPase，是抑制胃酸分泌效果最強的藥物；其確實會影響胃酸分泌。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_032","year":2020,"roc_year":109,"session":"2","examNo":32,"q":"於制酸劑配方中,混合aluminum hydroxide與magnesium hydroxide之主要目的為何?","opts":["A. 增加局部吸收率","B. 具協同作用","C. 延長作用時間","D. 減少副作用"],"ans":3,"exp":"Aluminum hydroxide（氫氧化鋁）單用時會引起便秘（Al3+ 抑制腸道平滑肌蠕動）；magnesium hydroxide（氫氧化鎂）單用時會引起腹瀉（Mg2+ 有滲透性瀉下作用）。兩者混合後，鋁的便秘效果與鎂的腹瀉效果相互抵消，減少各自的胃腸道副作用（而非為了協同抑酸或延長作用時間）。","we":["錯誤：混合 Al(OH)3 與 Mg(OH)2 並不是為了增加局部吸收率。制酸劑的作用位置在胃腔（直接中和胃酸），兩者局部作用機制相同，混合不影響吸收率。","錯誤：Al(OH)3 與 Mg(OH)2 均為弱鹼性制酸劑，作用機制相同（直接中和胃酸），混合後並無協同作用（synergism）；兩者相加作用相似，但主要目的是互補副作用，而非增強療效。","錯誤：混合 Al(OH)3 與 Mg(OH)2 並不是為了延長作用時間；鋁鹽反應較慢、鎂鹽反應較快，但兩者混合的主要目的是為了抵消各自副作用（便秘 vs. 腹瀉），而非延長作用持續時間。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_033","year":2020,"roc_year":109,"session":"2","examNo":33,"q":"下列何者為H2-受體拮抗劑的臨床用途?","opts":["A. 降低血壓","B. 治療過敏反應","C. 抑制胃酸分泌","D. 預防癩癇發作"],"ans":2,"exp":"H2 受體拮抗劑（如 famotidine、ranitidine、cimetidine）透過阻斷胃壁細胞（parietal cells）上的 H2 受體，減少組織胺誘導的 cAMP 生成，進而抑制 H+/K+-ATPase 的活化，降低胃酸分泌。臨床上用於治療消化性潰瘍、胃食道逆流（GERD）、胃炎等酸相關疾病。","we":["錯誤：降低血壓是 α 阻斷劑、β 阻斷劑、ACE 抑制劑、鈣離子通道阻斷劑等心血管藥物的用途；H2 受體拮抗劑作用於消化道壁細胞，不具有降血壓的臨床適應症。","錯誤：治療過敏反應（如蕁麻疹、過敏性鼻炎）使用的是 H1 受體拮抗劑（如 diphenhydramine、cetirizine）；H2 受體拮抗劑針對的是胃壁細胞的 H2 受體，用於抑制胃酸，而非治療過敏症狀。","","錯誤：預防癲癇發作屬於抗癲癇藥物（如 phenobarbital、phenytoin、levetiracetam）的適應症；H2 受體拮抗劑完全不具有抗癲癇作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_034","year":2020,"roc_year":109,"session":"2","examNo":34,"q":"下列鎮咳藥(antitussives)何者鎮咳作用的效價(potency)最強?","opts":["A. morphine","B. codeine","C. butorphanol","D. dextromethorphan"],"ans":2,"exp":"在獸醫臨床上，butorphanol（布托啡諾）為 κ 阿片受體促效劑兼 μ 受體部分拮抗劑，其鎮咳效價（potency）在臨床常用鎮咳藥中最強，尤其在犬貓等小動物中效果顯著。Morphine 雖有鎮咳作用但濫用潛力高；codeine 效價較弱；dextromethorphan 為非麻醉性鎮咳藥，效價最低。","we":["錯誤：Morphine 雖具有鎮咳作用（作用於延腦咳嗽中樞的 μ 受體），但其鎮咳效價在獸醫臨床上不如 butorphanol，且 morphine 的濫用潛力與副作用（如嘔吐、便秘）使其非首選鎮咳藥。","錯誤：Codeine 為輕度 μ 阿片受體促效劑，鎮咳效果存在但效價較 butorphanol 低，且在某些動物（如貓）代謝能力差，使用受限。","","錯誤：Dextromethorphan 為非麻醉性（non-narcotic）鎮咳藥，作用於 NMDA 受體及 σ 受體，鎮咳效價在上述四藥中最低，且在貓等某些動物中效果不佳甚至有毒性疑慮。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_035","year":2020,"roc_year":109,"session":"2","examNo":35,"q":"下列何者主要是透過抑制lipoxygenase之之作用來降低白三烯(leukotienes)產生,而達到抗發炎之作用?","opts":["A. cromogylate","B. zafirlukast","C. aspirin","D. theophylline"],"ans":1,"exp":"Zafirlukast（扎魯司特）為半胱胺酸白三烯受體拮抗劑（cysteinyl leukotriene receptor antagonist, CysLT1 antagonist），透過阻斷 LTC4、LTD4、LTE4 與其受體結合，抑制白三烯介導的支氣管收縮與發炎反應。注意：題目所述「透過抑制 lipoxygenase 降低白三烯產生」描述的是 LOX 抑制劑機轉；zafirlukast 本身是受體拮抗劑，不是 LOX 抑制劑，但在此題選項中為最符合白三烯相關抗發炎機轉的選項。","we":["錯誤：Cromoglycate（色甘酸鈉）為肥大細胞穩定劑（mast cell stabilizer），透過穩定肥大細胞膜阻止介質（組織胺、白三烯等）的釋放，並非透過抑制 lipoxygenase 來降低白三烯的合成。","","錯誤：Aspirin 為非選擇性 COX（環氧合酶）抑制劑，主要減少前列腺素（prostaglandins）和血栓素（thromboxane）的合成，並非透過抑制 lipoxygenase 降低白三烯；高劑量 aspirin 甚至可能因 arachidonic acid 轉向 LOX 途徑而加重白三烯生成。","錯誤：Theophylline 為磷酸二酯酶（PDE）抑制劑，可升高胞內 cAMP，同時具有輕度腺苷受體拮抗及支氣管擴張作用，其機轉與 lipoxygenase 抑制或白三烯受體阻斷無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_036","year":2020,"roc_year":109,"session":"2","examNo":36,"q":"下列有關cromolyn sodium之敘述，何者錯誤?","opts":["A. 抑制肥大細胞釋放histamine","B. 不會抑制H1及H2受體","C. 會打開氯離子通道，使細胞過極化","D. 胃腸道吸收良好"],"ans":3,"exp":"Cromolyn sodium（色甘酸鈉）口服後吸收極差（生體可用率 < 1%），因為其高極性、高水溶性使其無法有效穿越腸道上皮細胞，必須以吸入劑型（nebulization）給藥才能在肺部發揮局部穩定肥大細胞的作用。選項 D 聲稱其「胃腸道吸收良好」是錯誤的描述。","we":["此為正確描述：Cromolyn sodium 確實可抑制肥大細胞（mast cells）釋放組織胺（histamine）及其他過敏介質，透過穩定肥大細胞膜發揮作用，不符合題目問的「錯誤」描述。","此為正確描述：Cromolyn sodium 本身不直接阻斷 H1 或 H2 受體（它是肥大細胞穩定劑，而非組織胺受體拮抗劑），此描述正確，不符合題目問的「錯誤」描述。","此為正確描述：Cromolyn sodium 的作用機制之一為打開肥大細胞上的氯離子通道，使細胞過極化（hyperpolarization），抑制肥大細胞活化及去顆粒（degranulation），此描述正確，不符合題目問的「錯誤」描述。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_037","year":2020,"roc_year":109,"session":"2","examNo":37,"q":"可刺激呼吸道增加支氣管的分泌,而被作為祛痰劑(expectorants)的是:","opts":["A. acetylcysteine","B. ammonium chloride","C. potassium iodide","D. guaifenesin"],"ans":2,"exp":"Potassium iodide（碘化鉀）為強效祛痰劑（expectorant），透過刺激胃黏膜引起迷走神經反射（gastropulmonary reflex），促使支氣管腺體增加黏液分泌，稀釋痰液使之易於排出。Acetylcysteine 為黏液溶解劑（mucolytic）而非祛痰劑；ammonium chloride 和 guaifenesin 雖也是祛痰劑，但刺激支氣管分泌的效力不如 potassium iodide 顯著。","we":["錯誤：Acetylcysteine（乙醯半胱胺酸）為黏液溶解劑（mucolytic），透過其游離硫氫基（-SH）打斷痰液中醣蛋白的二硫鍵，直接降低痰液黏稠度，並非刺激支氣管腺體分泌的祛痰劑（expectorant）。","錯誤：Ammonium chloride 雖為祛痰劑，透過刺激胃部引起輕微的迷走神經反射促進呼吸道分泌，但其效力較 potassium iodide 弱，且在臨床上較少作為首選祛痰劑。","","錯誤：Guaifenesin 為祛痰劑，可降低痰液黏稠度並促進支氣管分泌，但其主要作用機轉為增加支氣管分泌量，與 potassium iodide 透過胃腸-肺反射刺激支氣管腺體分泌的機制不同，且整體效力不如 KI 顯著。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_038","year":2020,"roc_year":109,"session":"2","examNo":38,"q":"下列何者為可長期使用於馬關節炎或蹄葉炎之止痛劑?","opts":["A. phenylbutazone","B. aspirin","C. carprofen","D. naproxen"],"ans":0,"exp":"Phenylbutazone（保泰松）為非選擇性 COX（cyclooxygenase）抑制劑，在獸醫臨床上廣泛且長期用於馬的關節炎（arthritis）、蹄葉炎（laminitis）及其他骨骼肌肉疼痛的長期疼痛管理，是馬匹最常用的 NSAID 之一。其他選項（aspirin、carprofen、naproxen）雖也為 NSAID，但在馬的長期慢性疼痛管理上使用不如 phenylbutazone 普遍。","we":["","錯誤：Aspirin 雖可用於馬，但馬對 aspirin 的代謝半衰期較長（約 1 小時，需頻繁給藥），且腸道副作用風險較高；長期作為馬關節炎或蹄葉炎止痛劑的首選藥物不如 phenylbutazone 普遍。","錯誤：Carprofen 為選擇性 COX-2 抑制劑，主要用於犬隻（如術後止痛、骨關節炎），而非作為馬的長期關節炎或蹄葉炎的首選止痛劑。","錯誤：Naproxen（萘普生）雖為 NSAID，在馬可使用，但其在馬的長期關節炎及蹄葉炎止痛管理上的臨床地位不如 phenylbutazone，且相關研究和臨床應用較少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_039","year":2020,"roc_year":109,"session":"2","examNo":39,"q":"下列何者屬於血清素受體拮抗劑,能作為貓食慾促進的藥物?","opts":["A. ergonovine","B. cisapride","C. metoclopramide","D. cyproheptadine"],"ans":3,"exp":"Cyproheptadine（賽庚啶）為第一代 H1 受體拮抗劑，同時也是血清素（5-HT2）受體拮抗劑。在貓咪中，阻斷下視丘飽足中樞的 5-HT2 受體，可抑制血清素介導的食慾抑制訊號，進而促進食慾，臨床上用於治療食慾不振的貓咪。","we":["錯誤：Ergonovine 為麥角胺衍生物，主要作用為 α 腎上腺素受體促效劑及部分血清素受體拮抗劑，臨床主要用途為促進子宮收縮（產後止血），並非貓食慾促進藥物。","錯誤：Cisapride 為 5-HT4 受體促效劑（腸胃促動藥），可增加腸胃蠕動，臨床用於胃排空遲緩及胃食道逆流，並非透過血清素受體拮抗來促進食慾。","錯誤：Metoclopramide 為多巴胺（D2）受體拮抗劑及輕度 5-HT4 促效劑，主要用途為止吐及促進腸胃蠕動，並非血清素受體拮抗型的食慾促進藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_040","year":2020,"roc_year":109,"session":"2","examNo":40,"q":"Aspirin在下列何種動物體內的生物轉換最慢?","opts":["A. 人","B. 馬","C. 犬","D. 貓"],"ans":3,"exp":"貓（cat）對 aspirin（乙醯水楊酸）的生物轉換速率最慢，半衰期約 48 小時（人 ≈ 2-3 小時；犬 ≈ 8 小時；馬 ≈ 1-2 小時）。原因是貓的肝臟缺乏足夠的葡萄糖醛酸轉移酶（glucuronyl transferase），無法有效進行葡萄糖醛酸結合反應（glucuronidation）代謝 aspirin 及其代謝物 salicylate，導致藥物在體內蓄積，容易引起水楊酸毒性。","we":["錯誤：人的 aspirin 半衰期約 2-3 小時，具有正常的葡萄糖醛酸化代謝能力，生物轉換速率遠快於貓。","錯誤：馬的 aspirin 半衰期約 1-2 小時，代謝速率很快；馬主要透過腎臟排除水楊酸，葡萄糖醛酸化能力正常，生物轉換速率遠快於貓。","錯誤：犬的 aspirin 半衰期約 8 小時（比人慢但比貓快），犬雖然葡萄糖醛酸化能力稍弱，但仍具有足夠的代謝能力，生物轉換速率仍快於貓（48 小時）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_041","year":2020,"roc_year":109,"session":"2","examNo":41,"q":"下列有關抗組織胺不良反應的敘述,何者正確?","opts":["A. 經口投藥吸收均佳,故不會造成任何消化道副作用","B. 長期使用H1-抗組織胺,可能會產生藥品耐受性","C. Cimetidine不具有antiandrogenic的作用","D. Cetirizine常會誘導馬匹氣喘的發生"],"ans":1,"exp":"長期使用H1-抗組織胺（如diphenhydramine），可能因受體下調而產生藥品耐受性（tachyphylaxis），需增加劑量才能維持原有療效。","we":["錯誤：口服抗組織胺吸收雖佳，但仍可能刺激胃腸道黏膜，造成噁心、嘔吐等消化道副作用，並非完全無副作用。","","錯誤：Cimetidine（H2-拮抗劑）確實具有antiandrogenic作用，可競爭性結合雄激素受體，長期使用可能導致男性乳房發育等不良反應。","錯誤：Cetirizine為第二代抗組織胺，較不具鎮靜性，且並無證據顯示其常會誘導馬匹氣喘發生；第二代抗組織胺反而較少引起呼吸道副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_042","year":2020,"roc_year":109,"session":"2","examNo":42,"q":"Hydrocortisone應避免經由下列何種途徑給藥?","opts":["A. 口服","B. 靜脈","C. 肌肉","D. 皮下"],"ans":0,"exp":"Hydrocortisone應避免口服給藥，因其在動物體內經口服後有顯著的首過代謝（first-pass metabolism），生物利用率極低，且在緊急情況下口服吸收不可靠；全身性效果需靠靜脈、肌肉或皮下注射給藥。","we":["","錯誤：靜脈注射（IV）是hydrocortisone的標準給藥途徑之一，適用於過敏性休克、腎上腺危象等緊急情況，安全且有效。","錯誤：肌肉注射（IM）hydrocortisone是可接受的給藥途徑，吸收穩定，臨床上常用。","錯誤：皮下注射（SC）在臨床上亦可使用，吸收較慢但仍有效，為可接受的給藥途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_043","year":2020,"roc_year":109,"session":"2","examNo":43,"q":"下列何者可使用於庫興氏症候群的治療?","opts":["A. mitotane","B. prednisone","C. fludrocortisone","D. isotlupredone"],"ans":0,"exp":"Mitotane（o,p'-DDD）為腎上腺皮質溶解劑，選擇性破壞腎上腺皮質的束狀帶與網狀帶，減少皮質醇分泌，是治療犬隻庫興氏症候群（高腎上腺皮質素症）的主要藥物。","we":["","錯誤：Prednisone為合成糖皮質素，長期或過量使用反而是引起醫源性庫興氏症候群的原因，不能用於治療庫興氏症候群。","錯誤：Fludrocortisone為強效礦物皮質素（mineralocorticoid），用於治療腎上腺皮質功能不足（Addison's disease），而非庫興氏症候群。","錯誤：Isofluoredone（isoflupredone）為合成糖皮質素，用於抗炎治療，與庫興氏症候群的治療無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_044","year":2020,"roc_year":109,"session":"2","examNo":44,"q":"下列何者不應使用acetaminophen?","opts":["A. 犬","B. 貓","C. 馬","D. 人"],"ans":1,"exp":"貓不應使用acetaminophen（乙醯胺酚）。貓缺乏葡萄糖醛酸轉移酶（glucuronyl transferase），無法有效代謝acetaminophen，導致毒性代謝產物NAPQI蓄積，造成高鐵血紅蛋白血症及肝毒性，可能致命。","we":["錯誤：犬雖然代謝acetaminophen的能力較貓強，在低劑量下可謹慎使用，並非絕對禁忌（但仍需注意劑量）。","","錯誤：馬雖非典型使用對象，但並無如貓般的絕對代謝缺陷禁忌；臨床上不常規使用，但並非最危險的物種。","錯誤：Acetaminophen在人類為廣泛使用的解熱鎮痛藥，在正常治療劑量下安全有效，為標準用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_045","year":2020,"roc_year":109,"session":"2","examNo":45,"q":"動物缺乏下列何種維生素會發生角膜角化及夜盲症?","opts":["A. A","B. B","C. C","D. E ."],"ans":0,"exp":"維生素A（視黃醇）缺乏會導致角膜上皮角化（corneal keratinization）及夜盲症（nyctalopia），因為視黃醇是合成視紫（rhodopsin）的必要成分，而rhodopsin是桿狀細胞（暗視覺）的光感受色素。","we":["","錯誤：維生素B群缺乏主要引起神經炎、皮膚炎及代謝性疾病（如犬的維生素B1缺乏導致腦病），並不會造成角膜角化或夜盲症。","錯誤：維生素C缺乏會導致壞血病（scurvy），表現為出血、骨骼異常及傷口癒合不良，與角膜角化及夜盲症無關。","錯誤：維生素E缺乏會導致肌肉病變（白肌病）、生殖障礙及溶血性貧血，並不會引起角膜角化或夜盲症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_046","year":2020,"roc_year":109,"session":"2","examNo":46,"q":"維生素D在肝臟中會被轉變成下列何者?","opts":["A. 25-hydroxycholecalciferol","B. 1,25-dihydroxycholecalciferol","C. ergocalciferol","D. ergosterol"],"ans":0,"exp":"維生素D（D3/D2）在肝臟中由25-hydroxylase（CYP2R1）進行C-25羥化，轉變為25-hydroxycholecalciferol（calcifediol，25-OH-D3），這是維生素D在血液中的主要循環形式，也是測量體內維生素D狀態的指標。","we":["","錯誤：1,25-dihydroxycholecalciferol（calcitriol）是維生素D的最終活性形式，但其生成是在腎臟由1α-hydroxylase完成的第二步羥化，不在肝臟生成。","錯誤：Ergocalciferol（維生素D2）是植物性來源的維生素D前驅物，並非維生素D在肝臟的代謝產物。","錯誤：Ergosterol是植物及真菌中的麥角固醇，為維生素D2的前驅物（前維生素D），並非維生素D在肝臟的轉化產物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_047","year":2020,"roc_year":109,"session":"2","examNo":47,"q":"動物發生血液凝固時間延長時,可能為下列何種維生素缺乏?","opts":["A. A","B. B","C. E","D. K"],"ans":3,"exp":"維生素K缺乏會導致血液凝固時間延長。維生素K是凝血因子II（凝血酶原）、VII、IX、X進行γ-羧化的必要輔因子；缺乏時這些凝血因子無法活化，導致凝血障礙（PT及APTT延長）。","we":["錯誤：維生素A缺乏主要造成角膜角化、夜盲症及免疫功能下降，與血液凝固功能無直接關係。","錯誤：維生素B群缺乏主要影響神經系統、皮膚及能量代謝，並不會直接造成凝血時間延長。","錯誤：維生素E缺乏會造成肌肉病變、生殖障礙及溶血性貧血，雖有輕微影響血小板聚集，但不是造成凝血時間延長的主要原因。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_048","year":2020,"roc_year":109,"session":"2","examNo":48,"q":"乳牛發生青草痙攣時,是因下列何者缺乏所致?","opts":["A. 鐵","B. 錳","C. 鎂","D. 銅"],"ans":2,"exp":"乳牛青草痙攣（grass tetany）是由鎂（Mg）缺乏所致。早春青翠牧草中鎂含量低、鉀含量高（抑制鎂吸收），乳牛大量攝食後發生低鎂血症，導致神經肌肉興奮性增加，出現肌肉痙攣、抽搐等症狀。","we":["錯誤：鐵缺乏會導致缺鐵性貧血，表現為黏膜蒼白、虛弱，不會引起肌肉痙攣（青草痙攣）。","錯誤：錳缺乏會造成生殖障礙、骨骼發育不良及關節腫大，並不引起肌肉痙攣。","","錯誤：銅缺乏會造成貧血、免疫功能下降、共濟失調（如羔羊搖擺病）等，並不是青草痙攣的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_049","year":2020,"roc_year":109,"session":"2","examNo":49,"q":"Zidovudine在貓之半衰期較長,是因為貓之下列何者較少?","opts":["A. protein kinase A","B. thymidine kinase","C. adenylyl cyclase","D. glucuronyl transferase"],"ans":3,"exp":"Zidovudine（AZT）在貓體內的半衰期較長，是因為貓缺乏葡萄糖醛酸轉移酶（glucuronyl transferase，UGT酵素），無法有效進行AZT的葡萄糖醛酸化代謝，導致藥物清除減慢、蓄積，半衰期延長。","we":["錯誤：Protein kinase A參與細胞內信號傳導，與AZT的代謝消除無關，不影響AZT的半衰期。","錯誤：Thymidine kinase負責將AZT磷酸化為活性型（AZT-MP），其活性降低會減少AZT的活化，使療效下降，但不會延長AZT的半衰期。","錯誤：Adenylyl cyclase（腺苷酸環化酶）是cAMP信號路徑的酵素，與AZT的代謝和消除完全無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_050","year":2020,"roc_year":109,"session":"2","examNo":50,"q":"下列何種藥物較常以氣霧化(acrosolized)方式給藥,以治療呼吸道病毒(influcnza AandB)的感染?","opts":["A. ribavirin","B. zidovudine","C. oseltamivir","D. famciclovir"],"ans":0,"exp":"Ribavirin為廣效性核苷類似物抗病毒藥，常以氣霧化（aerosolized）方式吸入給藥，用於治療流感病毒A型及B型等呼吸道病毒感染，可直接作用於呼吸道黏膜，提高局部藥物濃度。","we":["","錯誤：Zidovudine（AZT）為抗反轉錄病毒藥物，主要用於HIV/FIV感染的口服治療，並非以氣霧化方式治療流感。","錯誤：Oseltamivir（克流感）為口服的神經氨酸酶抑制劑，用於治療流感，給藥途徑為口服，而非氣霧化吸入。","錯誤：Famciclovir為口服抗疱疹病毒藥物（herpesvirus），用於貓疱疹病毒感染，並非以氣霧化方式給藥，也非針對流感病毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_051","year":2020,"roc_year":109,"session":"2","examNo":51,"q":"化學性狀上磺胺劑為下列那一化合物之衍生物?","opts":["A. p-aminobenoic acid","B. p-aminobezene sulfonic acid","C. tetrahydrofolic acid","D. 5-aminosalicylic acid"],"ans":1,"exp":"磺胺劑（sulfonamides）在化學結構上是p-胺基苯磺酸（p-aminobenzene sulfonic acid，磺胺酸）的衍生物，其基本骨架為sulfanilamide（磺胺），可競爭性抑制細菌二氫蝶酸合成酶，阻斷葉酸合成。","we":["錯誤：p-aminobenzoic acid（PABA，對胺基苯甲酸）是磺胺劑所競爭的細菌葉酸合成底物，並非磺胺劑的化學結構來源；磺胺劑是PABA的結構類似物，而非其衍生物。","","錯誤：Tetrahydrofolic acid（四氫葉酸）是葉酸合成途徑的最終產物，是磺胺劑阻斷的目標，而非磺胺劑的結構衍生來源。","錯誤：5-aminosalicylic acid（美沙拉嗪）是另一類化合物，用於炎症性腸病的治療，與磺胺劑的化學結構來源無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_052","year":2020,"roc_year":109,"session":"2","examNo":52,"q":"下列那一種抗微生物之併用組台具有最廣之抗菌範圍,且殺菌能力大於抑菌作用?","opts":["A. sulfadiazine-sulfamethoxazole","B. sulafasalazine-sulfaguanindine","C. sulfathiazole-sulfaquinoxaline","D. sulfamethoxazole-trimethoprim"],"ans":3,"exp":"Sulfamethoxazole與trimethoprim的組合（SMZ-TMP）具有最廣的抗菌範圍，且發揮殺菌作用：兩藥分別阻斷細菌葉酸合成的不同步驟（SMZ抑制二氫蝶酸合成酶，TMP抑制二氫葉酸還原酶），產生序列性阻斷，協同增效，且對革蘭氏陽性及陰性菌均有效。","we":["錯誤：Sulfadiazine與sulfamethoxazole同為磺胺類藥物，兩者作用機制相同（均阻斷同一步驟），併用並不產生協同效應，也不擴大抗菌範圍。","錯誤：Sulfasalazine與sulfaguanidine均為磺胺類藥物，作用於相同靶位，併用不具協同殺菌效果，抗菌範圍亦無明顯擴大。","錯誤：Sulfathiazole與sulfaquinoxaline同屬磺胺類，機制重疊，併用無增效作用，與TMP的配伍相比抗菌效果和範圍均不足。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_053","year":2020,"roc_year":109,"session":"2","examNo":53,"q":"下列那一動物因容易對procaine過敏,故不可使用procaine penicllinG?","opts":["A. 犬","B. 豬","C. 鳥","D. 牛"],"ans":2,"exp":"鳥類（禽鳥）對procaine（普魯卡因）高度敏感，procaine penicillin G中含有procaine成分，在鳥類體內可引起嚴重的中樞神經毒性反應（興奮、驚厥、死亡），因此禁止用於鳥類。","we":["錯誤：犬對procaine的耐受性較好，procaine penicillin G在犬中可謹慎使用，並非絕對禁忌。","錯誤：豬可使用procaine penicillin G，是臨床上常用的豬隻抗菌用藥，無鳥類般的嚴重過敏問題。","","錯誤：牛是procaine penicillin G的常見給藥對象，廣泛用於牛隻的細菌性感染治療，安全性良好。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_054","year":2020,"roc_year":109,"session":"2","examNo":54,"q":"下列那一頭孢菌素類cephalosporins)藥物對革蘭氏陰性菌具廣泛之療效?","opts":["A. cefadroxil","B. cephapirin","C. ceftiofur","D. cephalothin"],"ans":2,"exp":"Ceftiofur為第三代頭孢菌素，對革蘭氏陰性菌具廣泛療效（包括Pasteurella multocida、Mannheimia haemolytica、E. coli等），常用於牛、豬的呼吸道感染，是唯一通過FDA批准的第三代頭孢用於食用動物的藥物。","we":["錯誤：Cefadroxil為第一代頭孢菌素，主要對革蘭氏陽性菌有效，對革蘭氏陰性菌的覆蓋範圍有限。","錯誤：Cephapirin為第一代頭孢菌素，抗菌譜以革蘭氏陽性菌為主，對革蘭氏陰性菌的效果較弱。","","錯誤：Cephalothin為第一代頭孢菌素，主要針對革蘭氏陽性菌，對革蘭氏陰性菌（尤其是腸桿菌科）的活性較弱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_055","year":2020,"roc_year":109,"session":"2","examNo":55,"q":"下列何者較不會造成耳毒性?","opts":["A. gentamicin","B. streptomycin","C. cisplatin","D. ampicillin"],"ans":3,"exp":"Ampicillin為青黴素類（penicillin-type）抗生素，無耳毒性；耳毒性是胺基糖苷類（aminoglycosides）及某些鉑類化療藥物的特有副作用，ampicillin的毒性主要是過敏反應及消化道症狀。","we":["錯誤：Gentamicin屬胺基糖苷類抗生素，其耳毒性（聽覺及前庭毒性）與腎毒性是主要的劑量限制毒性，為明確的耳毒性藥物。","錯誤：Streptomycin屬胺基糖苷類抗生素，以前庭耳毒性（vestibular ototoxicity）最為顯著，是已知的耳毒性藥物。","錯誤：Cisplatin為鉑類抗腫瘤藥物，可造成不可逆的感音神經性聽力喪失（sensorineural hearing loss）及腎毒性，為明確的耳毒性藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_056","year":2020,"roc_year":109,"session":"2","examNo":56,"q":"下列何者與chloramphenicol造成的傷害而產生再生不良性貧血有關?","opts":["A. 粒線體","B. 内質網","C. 高基氏體","D. 核糖體"],"ans":0,"exp":"Chloramphenicol引起的再生不良性貧血（aplastic anemia）與粒線體（mitochondria）損傷有關。Chloramphenicol抑制粒線體70S核糖體的蛋白質合成，損害骨髓造血前驅細胞（紅血球系前驅細胞）的粒線體功能，導致特異質性不可逆再生不良性貧血。","we":["","錯誤：內質網（endoplasmic reticulum）負責蛋白質合成（粗面ER）及脂質合成（滑面ER），並非chloramphenicol再生不良性貧血的作用靶點。","錯誤：高基氏體（Golgi apparatus）負責蛋白質的修飾、分類及分泌，與chloramphenicol引起再生不良性貧血的機制無關。","錯誤：雖然chloramphenicol確實抑制細菌70S核糖體，但造成再生不良性貧血的機制是透過損傷哺乳類細胞粒線體（而非細胞質80S核糖體）；細胞質核糖體並非此毒性的關鍵靶點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_057","year":2020,"roc_year":109,"session":"2","examNo":57,"q":"下列何者之抗菌作用機制為破壞細胞膜,相似界面活性劑?","opts":["A. bacitracin","B. doxycycline","C. metronidazole","D. polymyxin B"],"ans":3,"exp":"Polymyxin B的抗菌機制為破壞細菌細胞膜，作用類似陽離子清潔劑（surfactant）：其帶正電的環狀多肽與革蘭氏陰性菌外膜脂多醣（LPS）的磷酸根結合，插入細胞膜磷脂雙層，增加膜通透性，導致細胞內容物外漏而死亡。","we":["錯誤：Bacitracin的抗菌機制為抑制細胞壁合成，具體是阻斷細菌undecaprenyl pyrophosphate（bactoprenol）的去磷酸化，妨礙peptidoglycan前驅物的轉運，而非破壞細胞膜。","錯誤：Doxycycline為四環素類抗生素，其機制為結合細菌30S核糖體小次單位，抑制aminoacyl-tRNA與核糖體結合，阻斷蛋白質合成，並非破壞細胞膜。","錯誤：Metronidazole為硝基咪唑類藥物，在厭氧菌及原蟲細胞內被還原成活性代謝物，造成DNA鏈斷裂，並非以破壞細胞膜為機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_058","year":2020,"roc_year":109,"session":"2","examNo":58,"q":"下列何者,不建議doxycycline以靜脈注射方式給藥?","opts":["A. 犬","B. 貓","C. 猴","D. 馬"],"ans":3,"exp":"馬不建議以靜脈注射方式給予doxycycline，因為doxycycline IV在馬匹中可引起嚴重的心血管毒性，包括嚴重低血壓、心律不整甚至心臟停止，可能與螯合二價離子（Ca2+）及直接心臟毒性有關。","we":["錯誤：犬可接受靜脈注射doxycycline，臨床上以緩慢靜脈滴注給藥是安全且常用的方式。","錯誤：貓在謹慎控制輸注速率的情況下可接受靜脈注射doxycycline，並非絕對禁忌。","錯誤：猴子（靈長類）對靜脈注射doxycycline的耐受性與人類相近，為可接受的給藥途徑。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_059","year":2020,"roc_year":109,"session":"2","examNo":59,"q":"下列tetracyclines中,何者最易進入中樞神經系統達到治療濃度?","opts":["A. minocycline","B. chlortetracycline","C. oxytetracycline","D. tetracycline"],"ans":0,"exp":"Minocycline在四環素類藥物中脂溶性最高，能有效穿越血腦屏障（BBB），在中樞神經系統（腦脊液/CNS）中達到治療濃度，是四環素類中最易進入CNS的藥物，可用於治療某些CNS感染。","we":["","錯誤：Chlortetracycline（金黴素）脂溶性中等，CNS穿透性不及minocycline，較少用於CNS感染。","錯誤：Oxytetracycline（土黴素）脂溶性低，穿越血腦屏障的能力差，通常無法在CNS中達到治療濃度。","錯誤：Tetracycline（四環素）脂溶性低，血腦屏障穿透性弱，不適合用於中樞神經系統感染的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_060","year":2020,"roc_year":109,"session":"2","examNo":60,"q":"Erythromycin對於下列何種感染之治療效果較差?","opts":["A. Campylobacter jejuni","B. Rhodococcus equi","C. Pasteurella spp","D. Rickettsia rickettsii"],"ans":3,"exp":"Erythromycin對Rickettsia rickettsii（落磯山斑疹熱）的治療效果差。立克次體為絕對胞內寄生菌，治療首選為四環素類（doxycycline）；erythromycin對胞內立克次體穿透性不足且療效不佳，不適合用於此感染。","we":["錯誤：Erythromycin是治療Campylobacter jejuni腸炎的首選藥物之一，具有良好療效。","錯誤：Erythromycin（或azithromycin）是治療馬匹Rhodococcus equi感染的重要用藥，常與rifampin合併使用。","錯誤：Pasteurella spp.對erythromycin有一定敏感性，erythromycin可作為部分Pasteurella感染的備選治療藥物。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_061","year":2020,"roc_year":109,"session":"2","examNo":61,"q":"下列用於犬隻抗腫瘤藥物與毒性的配對,何者錯誤?","opts":["A. bleomycin-心臟毒性","B. vincristine-周邊神經毒性","C. cytarabine-骨髓抑制","D. cisplatin-腎臓毒性"],"ans":0,"exp":"本題問何者配對錯誤。Bleomycin的特徵性毒性為肺毒性（肺炎/肺纖維化），而非心臟毒性；因此「bleomycin-心臟毒性」的配對是錯誤的。其他選項：vincristine確實引起周邊神經毒性，cytarabine引起骨髓抑制，cisplatin引起腎臟毒性，均為正確配對。","we":["","此為正確描述：vincristine（長春新鹼）確實會引起周邊神經毒性（peripheral neuropathy），包括感覺異常、肌肉無力等，是其主要劑量限制毒性，配對正確，不符合題目問的「錯誤」描述。","此為正確描述：cytarabine（阿糖胞苷）確實會引起骨髓抑制（myelosuppression），導致白血球減少、血小板減少等，是其主要毒性，配對正確，不符合題目問的「錯誤」描述。","此為正確描述：cisplatin（順鉑）確實會引起腎臟毒性（nephrotoxicity），是其最主要的劑量限制毒性，配對正確，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_062","year":2020,"roc_year":109,"session":"2","examNo":62,"q":"下列何者為腫瘤細胞對doxorubicin、vincristine及dacinomycin產生多重抗藥性的機制?","opts":["A. 增加藥物從細胞內被排出","B. 增加分解藥物酵素的生合成","C. 增加修復藥物標靶的能力","D. 減少藥物與其受體結合 ."],"ans":0,"exp":"腫瘤細胞對doxorubicin、vincristine及dactinomycin產生多重抗藥性（MDR）的主要機制是增加P-糖蛋白（P-glycoprotein，MDR1/P-gp）的表現，導致細胞對藥物的排出增加，使胞內藥物濃度降低而失去療效。","we":["","錯誤：增加分解藥物酵素的生合成雖是部分藥物抗藥性的機制，但並非doxorubicin/vincristine/dactinomycin多重抗藥性的主要機制；這三種藥物的MDR主要由P-gp介導。","錯誤：增加修復藥物標靶的能力是某些抗腫瘤藥物（如鉑類）抗藥性的機制，並非此三種藥物多重抗藥性的主要機制。","錯誤：減少藥物與受體結合可能是某些靶向藥物的抗藥機制，但並非doxorubicin/vincristine/dactinomycin MDR的主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_063","year":2020,"roc_year":109,"session":"2","examNo":63,"q":"下列何種抗腫瘤藥物不可採口服投藥?","opts":["A. 5-fluorouracil","B. cyclophosphamide","C. melphalan","D. procarbazine"],"ans":0,"exp":"5-fluorouracil（5-FU）不可採口服給藥，尤其在貓中，口服5-FU會引起嚴重神經毒性（包括癲癇發作、小腦共濟失調），甚至致死；貓對5-FU特別敏感，任何接觸途徑均應避免。","we":["","錯誤：Cyclophosphamide可口服或靜脈注射給藥，口服生體利用率良好，是臨床上常用的口服抗腫瘤烷化劑。","錯誤：Melphalan為口服烷化劑，在動物腫瘤學中常以口服形式給藥（尤其用於多發性骨髓瘤的治療）。","錯誤：Procarbazine的口服劑型廣泛應用於臨床腫瘤治療，口服生體利用率佳，為常規口服抗腫瘤藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_064","year":2020,"roc_year":109,"session":"2","examNo":64,"q":"抗腫瘤藥物methotrexate屬於:","opts":["A. 葉酸拮抗劑","B. 嘧碇拮抗劑","C. 嘌呤拮抗劑","D. 雌激素拮抗劑"],"ans":0,"exp":"Methotrexate（甲胺蝶呤）屬於葉酸拮抗劑（antifolate），透過競爭性抑制二氫葉酸還原酶（DHFR），阻斷二氫葉酸（DHF）轉化為四氫葉酸（THF），進而抑制嘌呤及胸腺嘧啶核苷酸的合成，阻礙DNA複製。","we":["","錯誤：嘧啶拮抗劑包括5-FU（氟尿嘧啶）、cytarabine（阿糖胞苷）等，其機制為干擾嘧啶核苷酸合成或摻入DNA/RNA，與methotrexate的葉酸拮抗機制不同。","錯誤：嘌呤拮抗劑包括mercaptopurine（6-MP）、azathioprine等，干擾嘌呤核苷酸合成，雖然methotrexate間接影響嘌呤合成，但其直接機制是拮抗葉酸（抑制DHFR），而非直接作為嘌呤拮抗劑。","錯誤：雌激素拮抗劑如tamoxifen用於荷爾蒙依賴性腫瘤的治療，與methotrexate的抗代謝機制完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_065","year":2020,"roc_year":109,"session":"2","examNo":65,"q":"因在豬、牛肺臟中的半衰期可達140小時以上,故對呼吸道感染之治療,常僅需注射一次的抗菌劑為何?","opts":["A. florfenicol","B. amikacin","C. enrofloxacin","D. tulathromycin"],"ans":3,"exp":"Tulathromycin為三烯大環內酯類（triamilide macrolide）抗生素，在豬、牛的肺臟組織中半衰期可達140小時以上，因高度組織分佈及緩慢釋放特性，對呼吸道感染（如巴氏桿菌、放線桿菌）通常只需單次注射即可達到治療效果。","we":["錯誤：Florfenicol為苯丙醇類（amphenicol）廣效抗菌劑，雖常用於牛、豬呼吸道感染，但其組織半衰期遠不及tulathromycin，通常需要多次給藥。","錯誤：Amikacin為胺基糖苷類抗生素，半衰期短，主要用於嚴重革蘭氏陰性菌感染，不以單次注射治療呼吸道感染著稱。","錯誤：Enrofloxacin為氟奎諾酮類抗菌劑，雖對呼吸道病原有效，但其組織半衰期不如tulathromycin，一般需要多日治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_066","year":2020,"roc_year":109,"session":"2","examNo":66,"q":"下列何者為天然抗生素(atibiotics)?","opts":["A. clarithromycin","B. florfenicol","C. chlortetracycline","D. enrofloxacin"],"ans":2,"exp":"Chlortetracycline（金黴素）是由鏈黴菌（Streptomyces aureofaciens）天然發酵產生的抗生素，屬於天然抗生素（natural antibiotic），是最早發現的四環素類抗生素之一。","we":["錯誤：Clarithromycin（克拉黴素）是erythromycin的半合成衍生物，在erythromycin的化學結構上進行修飾而來，並非天然抗生素。","錯誤：Florfenicol為合成的苯丙醇類抗菌劑，是chloramphenicol的合成衍生物，屬於全合成或半合成藥物，非天然抗生素。","","錯誤：Enrofloxacin為完全合成的氟奎諾酮類抗菌劑，並非從微生物中提取的天然抗生素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_067","year":2020,"roc_year":109,"session":"2","examNo":67,"q":"下列何者具有抑制細菌合成葉酸的作用?","opts":["A. imidazoles","B. nitrofurans","C. methenamine","D. sulfonamides"],"ans":3,"exp":"磺胺劑（sulfonamides）具有抑制細菌合成葉酸的作用，其機制為競爭性抑制二氫蝶酸合成酶（dihydropteroate synthase），阻斷對胺基苯甲酸（PABA）摻入二氫蝶酸，從而阻斷細菌葉酸的合成。","we":["錯誤：Imidazoles（咪唑類，如ketoconazole）為抗黴菌藥物，其機制是抑制真菌的麥角固醇（ergosterol）合成，與細菌葉酸合成無關。","錯誤：Nitrofurans（硝基呋喃類）為抗菌藥，其機制是在細菌細胞內被還原為活性自由基，損傷DNA及多種細菌代謝酵素，並非專門抑制葉酸合成。","錯誤：Methenamine（烏洛托品）在酸性尿液中水解釋放甲醛，發揮尿路抗菌作用，其作用機制與葉酸合成抑制完全無關。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_068","year":2020,"roc_year":109,"session":"2","examNo":68,"q":"能有效治療鳥類鸚鵡熱病的抗菌劑為:","opts":["A. cephalexin","B. doxycycline","C. clindamycin","D. penicillin"],"ans":1,"exp":"Doxycycline（去氧羥四環素）是治療鳥類鸚鵡熱（Chlamydophila psittaci感染）的最有效藥物。Chlamydophila為絕對胞內寄生菌，四環素類藥物對胞內病原體有良好的穿透性和殺菌活性，doxycycline為治療首選。","we":["錯誤：Cephalexin（第一代頭孢菌素）對胞外細菌有效，但缺乏胞內穿透能力，對胞內病原體Chlamydophila psittaci無效。","","錯誤：Clindamycin對Chlamydophila的活性差，不適合用於治療鸚鵡熱。","錯誤：Penicillin類抗生素對Chlamydophila無效，因Chlamydophila缺乏傳統的肽聚糖細胞壁，且為胞內寄生菌，penicillin無法穿透到胞內發揮作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_069","year":2020,"roc_year":109,"session":"2","examNo":69,"q":"下列有關氨基甲酸詣(carbamates)之敘述何者錯誤?","opts":["A. 藉由抑制GABA氯離子通道殺死外寄生蟲","B. 有效解毒藥為atropine sulfate","C. 與膽鹼酶的結合為可逆的","D. 中毒症狀與有機磷中毒類似"],"ans":0,"exp":"本題問何者錯誤。氨基甲酸酯類（carbamates）的作用機制是可逆性抑制乙醯膽鹼酯酶（acetylcholinesterase，AChE），而非抑制GABA氯離子通道；抑制GABA氯離子通道是有機氯類（如dieldrin）或fipronil的機制，因此選項A的描述錯誤。","we":["","此為正確描述：氨基甲酸酯類中毒的有效解毒藥確實為atropine sulfate（阿托品），可拮抗AChE受抑制後蓄積的乙醯膽鹼於蕈毒鹼受體（muscarinic receptor）的過度刺激，不符合題目問的「錯誤」描述。","此為正確描述：氨基甲酸酯類與膽鹼酶（AChE）的結合確實為可逆性的（不同於有機磷的不可逆結合），因此中毒症狀可自行緩解或較易治療，不符合題目問的「錯誤」描述。","此為正確描述：氨基甲酸酯類中毒症狀（膽鹼激性毒症：流涎、縮瞳、肌肉震顫等）確實與有機磷中毒類似，因兩者均透過AChE抑制導致乙醯膽鹼蓄積，不符合題目問的「錯誤」描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_070","year":2020,"roc_year":109,"session":"2","examNo":70,"q":"由於對中樞神經系統的不良反應,下列何種藥劑不應使用於貓?","opts":["A. fipronil","B. permethrin","C. nitenpyram","D. metaflumizone"],"ans":1,"exp":"Permethrin（苄氯菊酯）為合成除蟲菊酯類殺蟲劑，對貓有嚴重的中樞神經毒性。貓缺乏葡萄糖醛酸轉移酶，無法有效代謝pyrethroids，導致藥物蓄積，引起神經系統興奮（震顫、癲癇、死亡），不應用於貓。","we":["錯誤：Fipronil（苯丙吡唑類）在貓的外用劑型（spot-on）為核准安全的外寄生蟲藥，對貓的CNS毒性風險遠低於permethrin，在正確劑量下為貓的安全選擇。","","錯誤：Nitenpyram（新菸鹼類，如Capstar）為口服跳蚤速殺藥，已核准用於貓，對貓安全，無顯著CNS毒性。","錯誤：Metaflumizone為氨基腙類（semicarbazone）殺蟲劑，作用於神經鈉離子通道，相關產品已核准用於貓，安全性可接受。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_071","year":2020,"roc_year":109,"session":"2","examNo":71,"q":"Clindamycin可用於治療下列何種疾病?","opts":["A. 牛尾蝨","B. 貓肝吸蟲症","C. 犬包蟲症","D. 弓蟲症"],"ans":3,"exp":"Clindamycin（克林黴素）除具有抗菌活性外，對某些原蟲亦有效，可用於治療貓的弓蟲症（toxoplasmosis，Toxoplasma gondii感染），是貓弓蟲症的重要治療用藥。","we":["錯誤：牛尾蝨（牛蝨）為外寄生蟲，需使用除蟲菊酯類、有機磷類或大環內酯類（ivermectin）等殺蟲劑治療，clindamycin為抗菌/抗原蟲藥，對外寄生蟲無效。","錯誤：貓肝吸蟲症（Opisthorchis/Clonorchis感染）為吸蟲感染，應使用praziquantel治療，clindamycin對吸蟲無效。","錯誤：犬包蟲症（Echinococcus granulosus感染）為絛蟲感染，應使用albendazole或praziquantel治療，clindamycin對絛蟲無效。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_072","year":2020,"roc_year":109,"session":"2","examNo":72,"q":"寵物鼠糞便檢出短小包膜絛蟲卵,可用下列何者驅除之?","opts":["A. clindamycin","B. cisapride","C. rifampin","D. praziquantel"],"ans":3,"exp":"短小包膜絛蟲（Hymenolepis diminuta）為鼠類常見絛蟲，應使用praziquantel（吡喹酮）驅除。Praziquantel透過干擾絛蟲Ca2+通道，破壞蟲體外皮（tegument），引起肌肉痙攣性麻痺，使蟲體脫落排出。","we":["錯誤：Clindamycin為抗菌兼抗原蟲藥（用於弓蟲症等），對絛蟲感染無治療效果。","錯誤：Cisapride為腸道促動力藥，增加胃腸蠕動，屬於消化道功能調節藥，並非驅蟲藥，對絛蟲無效。","錯誤：Rifampin（利福平）為抗結核及抗菌藥物，透過抑制細菌RNA聚合酶發揮作用，對絛蟲等寄生蟲無驅蟲活性。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_073","year":2020,"roc_year":109,"session":"2","examNo":73,"q":"下列何者中毒時可被pralidoxime所緩解?","opts":["A. amitraz","B. dichlorvos","C. pyrantel","D. guanethidine"],"ans":1,"exp":"Pralidoxime（2-PAM）可解除有機磷中毒，透過再活化被有機磷抑制的乙醯膽鹼酯酶（AChE）。Dichlorvos（敵敵畏）為有機磷類殺蟲劑，中毒時pralidoxime可有效解毒（需在AChE老化前及早給藥）。","we":["錯誤：Amitraz為甲脒類（formamidine）殺蟲劑，透過激動α2腎上腺素受體發揮作用，其中毒的解毒藥為atipamezole（α2拮抗劑），pralidoxime對amitraz中毒無效。","","錯誤：Pyrantel為四氫嘧啶類驅腸蟲藥，作用為神經肌肉接頭的nAChR激動劑，並非AChE抑制劑，pralidoxime對pyrantel無解毒作用。","錯誤：Guanethidine為腎上腺素神經末梢阻斷劑，透過阻止去甲腎上腺素的儲存與釋放發揮降壓作用，與膽鹼酯酶抑制無關，pralidoxime無法解除其毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_074","year":2020,"roc_year":109,"session":"2","examNo":74,"q":"下列有關ketoconazole的敘述,何者正確?","opts":["A. 常被用於治療厭氧菌的感染","B. 併用制酸劑(antacids)時,可增加口服吸收率","C. 可用於治療hypoadrenocorticism","D. 不可用於懷孕的動物"],"ans":3,"exp":"Ketoconazole不可用於懷孕動物，因其具有致畸胎性，並可抑制腎上腺皮質及性腺類固醇的合成（透過阻斷多種CYP450酵素），可能干擾胎兒正常的性激素及腎上腺激素發育。","we":["錯誤：Ketoconazole用於治療黴菌感染（如皮癬菌、念珠菌），並非用於厭氧菌感染（厭氧菌感染應使用metronidazole等）。","錯誤：制酸劑（antacids）會升高胃部pH值，反而減少ketoconazole的口服吸收（ketoconazole溶解需要酸性環境），因此制酸劑與ketoconazole併用會降低、而非增加口服吸收率。","錯誤：Ketoconazole用於治療高腎上腺皮質素症（hyperadrenocorticism，庫興氏症候群），透過抑制皮質醇合成來降低過高的皮質醇濃度，而非用於治療低腎上腺皮質素症（hypoadrenocorticism，Addison's disease）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_075","year":2020,"roc_year":109,"session":"2","examNo":75,"q":"下列何種抗黴菌劑會抑制腎上腺皮質與性腺類固醇之製造?","opts":["A. flucytosine","B. griscofulvin","C. ketoconazole","D. amphotericin B"],"ans":2,"exp":"Ketoconazole（克多黴素）會抑制腎上腺皮質及性腺的類固醇合成。其機制為阻斷多種細胞色素P450酵素（CYP11A1、CYP17、CYP21B2等），抑制皮質醇、醛固酮、睪固酮及雌激素等類固醇的生成，可用於治療犬庫興氏症候群。","we":["錯誤：Flucytosine（5-FC）為抗代謝型抗黴菌藥，在真菌細胞內轉化為5-FU干擾核酸合成，對類固醇合成無直接抑制作用。","錯誤：Griseofulvin（灰黃黴素）透過結合微管蛋白（tubulin）干擾真菌有絲分裂，用於皮膚癬菌治療，對類固醇合成無直接抑制作用。","","錯誤：Amphotericin B（兩性黴素B）為多烯類抗黴菌藥，透過結合麥角固醇破壞真菌細胞膜，對哺乳動物類固醇合成沒有直接抑制作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_076","year":2020,"roc_year":109,"session":"2","examNo":76,"q":"下列何種藥物無法用於驅犬鞭蟲?","opts":["A. clorsulon","B. febantel","C. mebendazole","D. ivermectin"],"ans":0,"exp":"Clorsulon（氯蘇隆）為肝片吸蟲驅除藥（fasciolicide），專門用於牛羊的肝吸蟲（Fasciola hepatica）感染，對犬鞭蟲（Trichuris vulpis）無效，因其作用靶點（PEPCK/PGK抑制）僅針對吸蟲的葡萄糖代謝。","we":["","錯誤：Febantel為苯並咪唑類前體藥（prodrug），在體內代謝為fenbendazole及oxfendazole，對鞭蟲（Trichuris）有驅除效果，可有效治療犬鞭蟲感染。","錯誤：Mebendazole（甲苯咪唑）為苯並咪唑類驅蟲藥，對鞭蟲（Trichuris）有效，可用於治療犬鞭蟲感染。","錯誤：Ivermectin（伊維菌素）對多種線蟲有效，雖對Trichuris的療效有爭議，但廣效型抗寄生蟲複方產品常將其納入對鞭蟲的覆蓋範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_077","year":2020,"roc_year":109,"session":"2","examNo":77,"q":"若見器官充血與血液呈褐色,最可能是下列何者中毒?","opts":["A. 氰化物","B. 硫化氫","C. 亞硝酸鹽","D. 一氧化碳"],"ans":2,"exp":"器官充血且血液呈褐色（巧克力色），為亞硝酸鹽（nitrite，NO2-）中毒的特徵。亞硝酸鹽將血紅素中的Fe2+氧化為Fe3+，形成高鐵血紅素（methemoglobin），無法攜氧，血液呈現褐色，動物因組織缺氧而死亡。","we":["錯誤：氰化物中毒的特徵為血液及組織呈現鮮紅色（cherry-red），因氰化物阻斷細胞色素氧化酶，使組織無法利用O2，靜脈血仍富含氧合血紅素，而非褐色。","錯誤：硫化氫（H2S）中毒的特徵為腐蛋氣味及黏膜損傷，並不會造成血液變為褐色；H2S主要抑制細胞呼吸鏈，病變表現與氰化物類似但顏色不同。","","錯誤：一氧化碳（CO）中毒的特徵為血液及組織呈現鮮豔的櫻桃紅色，因CO與血紅素結合形成碳氧血紅素（carboxyhemoglobin），顏色鮮紅，而非褐色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_藥理_1092_078","year":2020,"roc_year":109,"session":"2","examNo":78,"q":"下列有關尿素中毒之敘述,何者錯誤?","opts":["A. 尿素可釋出氨氣","B. 鹼性環境可促使尿素水解","C. 反芻獸較不易見尿素中毒病例","D. 可用冷水一醋酸療法治療"],"ans":2,"exp":"本題問何者錯誤。選項C「反芻獸較不易見尿素中毒病例」為錯誤敘述。反芻獸（牛、羊）的瘤胃中含有大量尿素酶產生菌，可將尿素快速分解為氨，大量氨被吸收後超越肝臟解毒能力，導致血氨升高，因此反芻獸反而是較容易發生尿素中毒的動物。","we":["此為正確描述：尿素確實可在細菌尿素酶作用下釋出氨氣（NH3），這是尿素中毒機制的第一步，描述正確，不符合題目問的「錯誤」描述。","此為正確描述：鹼性環境（高pH）確實可促進尿素的水解，使瘤胃內氨的生成加速，因此飼料含有過多緩衝物質或鹼性添加劑時可能加重尿素中毒，描述正確，不符合題目問的「錯誤」描述。","","此為正確描述：以冷水稀釋後加醋酸（cold water-acetic acid）灌胃療法確實用於治療反芻獸尿素中毒，醋酸可使瘤胃pH下
