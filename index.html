<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="獸醫國考">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>獸醫師國考題庫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh}

/* 登入畫面 */
.auth-screen{position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;z-index:100}
.auth-screen.hidden{display:none}
.auth-logo{font-size:2.8rem;margin-bottom:8px}
.auth-title{font-size:1.4rem;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.auth-sub{font-size:.8rem;color:#64748b;margin-bottom:2rem}
.auth-box{width:100%;max-width:340px;background:#1e2330;border:1px solid #2d3548;border-radius:16px;padding:1.6rem 1.4rem}
.auth-box h2{font-size:1rem;font-weight:600;color:#f1f5f9;margin-bottom:1.2rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:.78rem;color:#94a3b8;margin-bottom:5px}
.field input{width:100%;background:#0f1117;border:1px solid #2d3548;border-radius:9px;padding:10px 12px;color:#e2e8f0;font-size:.95rem;outline:none}
.field input:focus{border-color:#4f8ef7}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px}
.btn-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#475569;cursor:pointer;padding:4px;line-height:0;border-radius:6px;transition:color .15s}
.btn-eye:hover,.btn-eye:active{color:#94a3b8}
.btn-eye.active{color:#4f8ef7}
.btn-auth{width:100%;background:#4f8ef7;color:#fff;border:none;border-radius:9px;padding:11px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:4px}
.btn-auth:active{background:#3a7ae0}
.btn-auth:disabled{opacity:.5;cursor:not-allowed}
.auth-switch{text-align:center;margin-top:1rem;font-size:.78rem;color:#64748b}
.auth-switch button{background:none;border:none;color:#4f8ef7;cursor:pointer;font-size:.78rem;padding:0 4px}
.auth-msg{min-height:18px;font-size:.78rem;margin-top:.6rem;text-align:center;color:#f08080}

/* 主畫面 */
#main-app{display:none;min-height:100vh;padding:24px 16px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto 0;padding:0 2px 20px}
.topbar-user{font-size:.82rem;color:#94a3b8}
.topbar-user span{color:#4f8ef7;font-weight:600}
.btn-logout{background:none;border:1px solid #2d3548;border-radius:8px;padding:5px 12px;font-size:.75rem;color:#64748b;cursor:pointer}
.btn-logout:active{color:#f08080;border-color:#f08080}
header{text-align:center;padding:12px 0 28px}
header h1{font-size:1.6rem;font-weight:700;letter-spacing:.04em;color:#f1f5f9}
header p{margin-top:8px;font-size:.85rem;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:480px;margin:0 auto}
.card{background:#1e2330;border:1px solid #2d3548;border-radius:14px;padding:20px 16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card.active{border-color:#4f8ef7;cursor:pointer}
.card.active:hover{transform:translateY(-2px);border-color:#6ba3ff}
.card.inactive{opacity:.45;cursor:default;pointer-events:none}
.card-icon{font-size:2rem;margin-bottom:10px}
.card-name{font-size:1rem;font-weight:600;color:#f1f5f9;margin-bottom:4px}
.card-count{font-size:.78rem;color:#64748b}
.card.active .card-count{color:#4f8ef7}
.badge{position:absolute;top:12px;right:12px;font-size:.65rem;padding:3px 7px;border-radius:20px;font-weight:600}
.badge-ready{background:#1a3a5c;color:#4f8ef7}
.badge-soon{background:#1e2330;color:#475569;border:1px solid #2d3548}
footer{text-align:center;margin-top:36px;font-size:.75rem;color:#334155}
#auth-loading{position:fixed;inset:0;background:#0f1117;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.spin{width:36px;height:36px;border:3px solid #2d3548;border-top-color:#4f8ef7;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
#auth-loading p{color:#475569;font-size:.85rem}
</style>
</head>
<body>

<!-- 載入中遮蓋（等待 Firebase 確認登入狀態） -->
<div id="auth-loading">
  <div class="spin"></div>
  <p>驗證登入狀態…</p>
</div>

<!-- 登入畫面 -->
<div id="login-screen" class="auth-screen hidden">
  <div class="auth-logo">🐾</div>
  <div class="auth-title">獸醫師國考題庫</div>
  <div class="auth-sub">請登入以繼續</div>
  <div class="auth-box">
    <h2>登入</h2>
    <div class="field">
      <label>電子郵件</label>
      <input id="l-email" type="email" placeholder="輸入 Email" autocomplete="email"
             onkeydown="if(event.key==='Enter')document.getElementById('l-pin').focus()">
    </div>
    <div class="field">
      <label>密碼</label>
      <div class="pwd-wrap">
        <input id="l-pin" type="password" placeholder="輸入密碼" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')login()">
        <button class="btn-eye" type="button" onclick="togglePwd('l-pin',this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button class="btn-auth" id="l-btn" onclick="login()">登入</button>
    <div class="auth-msg" id="l-msg"></div>
    <div style="text-align:center;margin-top:.6rem"><button style="background:none;border:none;color:#475569;cursor:pointer;font-size:.75rem" onclick="resetPwd()">忘記密碼？</button></div>
  </div>
  <div class="auth-switch">還沒有帳號？<button onclick="showReg()">註冊</button></div>
</div>

<!-- 註冊畫面 -->
<div id="reg-screen" class="auth-screen hidden">
  <div class="auth-logo">🐾</div>
  <div class="auth-title">獸醫師國考題庫</div>
  <div class="auth-sub">建立新帳號</div>
  <div class="auth-box">
    <h2>註冊</h2>
    <div class="field">
      <label>暱稱（2–16字，顯示用）</label>
      <input id="r-name" type="text" placeholder="輸入暱稱" autocomplete="nickname"
             onkeydown="if(event.key==='Enter')document.getElementById('r-email').focus()">
    </div>
    <div class="field">
      <label>電子郵件</label>
      <input id="r-email" type="email" placeholder="輸入 Email" autocomplete="email"
             onkeydown="if(event.key==='Enter')document.getElementById('r-pin').focus()">
    </div>
    <div class="field">
      <label>密碼（至少6位）</label>
      <div class="pwd-wrap">
        <input id="r-pin" type="password" placeholder="設定密碼" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')document.getElementById('r-pin2').focus()">
        <button class="btn-eye" type="button" onclick="togglePwdGroup(this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label>確認密碼</label>
      <div class="pwd-wrap">
        <input id="r-pin2" type="password" placeholder="再輸入一次" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')register()">
        <button class="btn-eye" type="button" onclick="togglePwd('r-pin2',this)" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <button class="btn-auth" id="r-btn" onclick="register()">建立帳號</button>
    <div class="auth-msg" id="r-msg"></div>
  </div>
  <div class="auth-switch">已有帳號？<button onclick="showLogin()">返回登入</button></div>
</div>

<!-- 主畫面 -->
<div id="main-app">
  <div class="topbar">
    <div class="topbar-user">你好，<span id="user-name-display"></span></div>
    <button class="btn-logout" onclick="logout()">登出</button>
  </div>
  <header>
    <h1>獸醫師國考題庫</h1>
    <p>六大科目 · 歷屆官方試題</p>
  </header>

  <div class="grid">
    <a class="card active" href="./putongbing.html">
      <div class="card-icon">🐾</div>
      <div class="card-name">普通病學</div>
      <div class="card-count">1115 題 · 105-2–114年</div>
      <span class="badge badge-ready">可使用</span>
    </a>

    <a class="card active" href="./yaoli.html">
      <div class="card-icon">💊</div>
      <div class="card-name">藥理學</div>
      <div class="card-count">1360 題 · 104–114年</div>
      <span class="badge badge-ready">可使用</span>
    </a>

    <a class="card active" href="./pathology.html">
      <div class="card-icon">🔬</div>
      <div class="card-name">病理學</div>
      <div class="card-count">1360 題 · 104–114年</div>
      <span class="badge badge-ready">可使用</span>
    </a>

    <a class="card active" href="./chuanran.html">
      <div class="card-icon">🦠</div>
      <div class="card-name">傳染病學</div>
      <div class="card-count">1360 題 · 104–114年</div>
      <span class="badge badge-ready">可使用</span>
    </a>

    <a class="card inactive" href="#">
      <div class="card-icon">🏥</div>
      <div class="card-name">公共衛生學</div>
      <div class="card-count">題庫建置中</div>
      <span class="badge badge-soon">即將上線</span>
    </a>

    <a class="card inactive" href="#">
      <div class="card-icon">🩺</div>
      <div class="card-name">實習診斷學</div>
      <div class="card-count">題庫建置中</div>
      <span class="badge badge-soon">即將上線</span>
    </a>
  </div>

  <footer>v23 · 僅供個人複習使用</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

const EYE_OPEN=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYE_SHUT=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
function togglePwd(id,btn){const el=document.getElementById(id);const show=el.type==='password';el.type=show?'text':'password';btn.innerHTML=show?EYE_SHUT:EYE_OPEN;btn.classList.toggle('active',show);}
function togglePwdGroup(btn){const show=document.getElementById('r-pin').type==='password';['r-pin','r-pin2'].forEach(id=>{document.getElementById(id).type=show?'text':'password';});btn.innerHTML=show?EYE_SHUT:EYE_OPEN;btn.classList.toggle('active',show);}

// ── Firebase ──────────────────────────────────────────────────────────────
const firebaseConfig={apiKey:"AIzaSyDVJP8axRrToasJcIbIiI7VZW17gJUPVcU",authDomain:"vetexamquiz.firebaseapp.com",projectId:"vetexamquiz",storageBucket:"vetexamquiz.firebasestorage.app",messagingSenderId:"129603368021",appId:"1:129603368021:web:df5597998f3e07469110dc"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
// ─────────────────────────────────────────────────────────────────────────

function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('reg-screen').classList.add('hidden');
  setTimeout(()=>{document.getElementById('l-email').focus();},80);
}
function showReg(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('reg-screen').classList.remove('hidden');
  setTimeout(()=>{document.getElementById('r-name').focus();},80);
}
function enterApp(user){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('reg-screen').classList.add('hidden');
  document.getElementById('main-app').style.display='block';
  document.getElementById('user-name-display').textContent=user.displayName||user.email;
}
function logout(){
  auth.signOut().then(()=>{
    document.getElementById('main-app').style.display='none';
    document.getElementById('l-msg').textContent='';
    document.getElementById('l-pin').value='';
    showLogin();
  }).catch(()=>{showLogin();});
}

function setLoginLoading(loading){
  const btn=document.getElementById('l-btn');
  btn.disabled=loading;btn.textContent=loading?'登入中…':'登入';
}
function setRegLoading(loading){
  const btn=document.getElementById('r-btn');
  btn.disabled=loading;btn.textContent=loading?'建立中…':'建立帳號';
}

async function resetPwd(){
  const email=document.getElementById('l-email').value.trim();
  const msg=document.getElementById('l-msg');
  if(!email){msg.textContent='請先填寫 Email';msg.style.color='#f08080';return;}
  try{
    await auth.sendPasswordResetEmail(email);
    msg.style.color='#4ade80';msg.textContent='重設密碼信已寄出，請檢查信箱';
  }catch(err){
    msg.style.color='#f08080';
    msg.textContent=err.code==='auth/user-not-found'?'此 Email 尚未註冊':'發送失敗，請確認 Email 是否正確';
  }
}
async function login(){
  const email=document.getElementById('l-email').value.trim();
  const pin=document.getElementById('l-pin').value;
  const msg=document.getElementById('l-msg');
  if(!email||!pin){msg.textContent='請填寫 Email 與密碼';return;}
  setLoginLoading(true);msg.textContent='';
  try{
    await auth.signInWithEmailAndPassword(email,pin);
    // onAuthStateChanged will call enterApp
  }catch(err){
    const codes={'auth/user-not-found':'此 Email 尚未註冊','auth/wrong-password':'密碼錯誤','auth/invalid-email':'Email 格式不正確','auth/too-many-requests':'嘗試次數過多，請稍後再試','auth/invalid-credential':'Email 或密碼不正確'};
    msg.textContent=codes[err.code]||('登入失敗：'+err.message);
    setLoginLoading(false);
  }
}

async function register(){
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pin=document.getElementById('r-pin').value;
  const pin2=document.getElementById('r-pin2').value;
  const msg=document.getElementById('r-msg');
  if(name.length<2||name.length>16){msg.textContent='暱稱需 2–16 字';return;}
  if(!email){msg.textContent='請填寫 Email';return;}
  if(pin.length<6){msg.textContent='密碼至少 6 位';return;}
  if(pin!==pin2){msg.textContent='兩次密碼不一致';return;}
  setRegLoading(true);msg.textContent='';
  try{
    const cred=await auth.createUserWithEmailAndPassword(email,pin);
    await cred.user.updateProfile({displayName:name});
    msg.style.color='#4ade80';msg.textContent='註冊成功！';
    // onAuthStateChanged will call enterApp
  }catch(err){
    const codes={'auth/email-already-in-use':'此 Email 已被使用','auth/invalid-email':'Email 格式不正確','auth/weak-password':'密碼強度不足（至少 6 位）'};
    msg.style.color='#f08080';msg.textContent=codes[err.code]||('註冊失敗：'+err.message);
    setRegLoading(false);
  }
}

// 此裝置永久記住登入狀態（LOCAL persistence 為 Firebase 預設值）
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

// 初始化：等 Firebase 確認登入狀態後才顯示 UI
auth.onAuthStateChanged(user=>{
  document.getElementById('auth-loading').style.display='none';
  setLoginLoading(false);setRegLoading(false);
  if(user){enterApp(user);}
  else{showLogin();}
});
</script>
</body>
</html>
