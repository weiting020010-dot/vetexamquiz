<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="獸醫國考">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>獸醫師國考題庫</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e2e8f0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px 16px 48px}
header{text-align:center;padding:32px 0 28px}
header h1{font-size:1.6rem;font-weight:700;letter-spacing:.04em;color:#f1f5f9}
header p{margin-top:8px;font-size:.85rem;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:480px;margin:0 auto}
.card{background:#1e2330;border:1px solid #2d3548;border-radius:14px;padding:20px 16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card.active{border-color:#4f8ef7;cursor:pointer}
.card.active:hover{transform:translateY(-2px);border-color:#6ba3ff}
.card.inactive{opacity:.45;cursor:default}
.card-icon{font-size:2rem;margin-bottom:10px}
.card-name{font-size:1rem;font-weight:600;color:#f1f5f9;margin-bottom:4px}
.card-count{font-size:.78rem;color:#64748b}
.card.active .card-count{color:#4f8ef7}
.badge{position:absolute;top:12px;right:12px;font-size:.65rem;padding:3px 7px;border-radius:20px;font-weight:600}
.badge-ready{background:#1a3a5c;color:#4f8ef7}
.badge-soon{background:#1e2330;color:#475569;border:1px solid #2d3548}
footer{text-align:center;margin-top:36px;font-size:.75rem;color:#334155}
</style>
</head>
<body>
<header>
  <h1>獸醫師國考題庫</h1>
  <p>六大科目 · 歷屆官方試題</p>
</header>

<div class="grid">
  <a class="card inactive" href="#">
    <div class="card-icon">🐾</div>
    <div class="card-name">普通病學</div>
    <div class="card-count">題庫建置中</div>
    <span class="badge badge-soon">即將上線</span>
  </a>

  <a class="card inactive" href="#">
    <div class="card-icon">💊</div>
    <div class="card-name">藥理學</div>
    <div class="card-count">題庫建置中</div>
    <span class="badge badge-soon">即將上線</span>
  </a>

  <a class="card active" href="./pathology.html">
    <div class="card-icon">🔬</div>
    <div class="card-name">病理學</div>
    <div class="card-count">1360 題 · 104–114年</div>
    <span class="badge badge-ready">可使用</span>
  </a>

  <a class="card active" href="./chuanran.html">
    <div class="card-icon">🦠</div>
    <div class="card-name">傳染病學</div>
    <div class="card-count">1360 題 · 104–114年</div>
    <span class="badge badge-ready">可使用</span>
  </a>

  <a class="card inactive" href="#">
    <div class="card-icon">🏥</div>
    <div class="card-name">公共衛生學</div>
    <div class="card-count">題庫建置中</div>
    <span class="badge badge-soon">即將上線</span>
  </a>

  <a class="card inactive" href="#">
    <div class="card-icon">🩺</div>
    <div class="card-name">實習診斷學</div>
    <div class="card-count">題庫建置中</div>
    <span class="badge badge-soon">即將上線</span>
  </a>
</div>

<footer>v16 · 僅供個人複習使用</footer>

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
