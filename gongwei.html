就近、先看到）」進行的抽樣方式稱為「便利抽樣（convenience sampling）」，每場5頭均非隨機選取，存在選樣偏差。","we":["隨機抽樣（random sampling）是每個個體被選中的機率相等，由隨機方式決定，本題「就近先看到的」不符隨機原則。","（正確）便利抽樣（convenience sampling）是依研究者方便性選取樣本（就近、先看到的），是系統性偏差最大的抽樣方式，本題符合此定義。","系統性抽樣（systematic sampling）是按固定間隔（如每隔N個）抽取，需事先制定規則，本題每場「就近5頭」無固定間隔規則。","分層抽樣（stratified sampling）是先將族群分層（如按性別、年齡）再從各層隨機抽樣，本題未有分層設計。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_062","year":2018,"roc_year":107,"session":"1","examNo":62,"q":"某研究將200頭母豬分為兩組，一組接種日本腦炎疫苗，另一組則否；之後使其懷孕並追蹤流產及死胎狀\r 況。請問此研究設計屬於何種流行病學研究法？","opts":["A. 臨床試驗（clinical trial）","B. 橫斷式研究（cross-sectional study）","C. 病例對照研究（case-control study）","D. 世代研究（cohort study）"],"ans":0,"exp":"研究者將200頭母豬隨機分為兩組（疫苗組/對照組），並主動介入（疫苗接種），前瞻性追蹤流產及死胎狀況。這是研究者主動介入的「臨床試驗（clinical trial）」，不是觀察性研究。","we":["（正確）研究者隨機分組並主動施打疫苗（介入），前瞻性追蹤結果，此為「臨床試驗（randomized controlled trial, RCT）」的標準設計，是流行病學研究的最高等級證據。","橫斷式研究（cross-sectional study）在同一時間點同時測量暴露和疾病，無隨機分組也無追蹤期。","病例對照研究（case-control study）以病例/對照分組，回溯暴露史，無主動介入。","世代研究（cohort study）是觀察性研究，依暴露狀況分組後追蹤，但無研究者主動介入（隨機分派疫苗）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_063","year":2018,"roc_year":107,"session":"1","examNo":63,"q":"犬瘟熱相關因子研究，因子「居住在郊區」之勝算比（odds ratio）為2.0，其95%之信賴區間為0.5到3.5，\r 而因子「是短鼻犬」與得犬瘟熱之勝算比為2.0，95%信賴區間為1.5到2.5。依統計學上顯著意義而論，下列\r 敘述何者正確？","opts":["A. 「居住在郊區」與「是短鼻犬」均為風險因子","B. 「居住在郊區」為風險因子，而「是短鼻犬」則不是","C. 「居住在郊區」不為風險因子，而「是短鼻犬」則是","D. 「居住在郊區」與是否「是短鼻犬」均不是風險因子"],"ans":2,"exp":"統計顯著性判斷：95%信賴區間（CI）不包含1（null value for OR）才表示統計顯著。「居住在郊區」CI為0.5到3.5（包含1），統計上不顯著，不能確認為風險因子；「是短鼻犬」CI為1.5到2.5（不包含1，全>1），統計上顯著，且OR>1表示短鼻犬是正向風險因子。","we":["「居住在郊區」CI包含1，統計上不顯著，不能確認為風險因子，故A選項錯誤。","「居住在郊區」CI包含1（0.5~3.5），統計上不顯著，B選項中說「居住在郊區是風險因子」錯誤。","（正確）「居住在郊區」CI（0.5~3.5）包含1，統計上不顯著，不能視為風險因子；「是短鼻犬」CI（1.5~2.5）不包含1，OR=2.0且顯著，是統計上的真正風險因子。","「是短鼻犬」CI（1.5~2.5）全大於1，統計顯著，可確認為風險因子，D選項「均不是風險因子」錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_064","year":2018,"roc_year":107,"session":"1","examNo":64,"q":"流行病學研究中，在建立假說並找尋致病因子時，若發現某因子的強度或頻率發生改變，會直接影響到疾病\r 的發生強度，這樣的假說建立原則為下列那一種？","opts":["A. 相異性原則（method of difference）","B. 一致性原則（method of agreement）","C. 殘留原則（method of residue）","D. 變異共存原則（method of concomitant variation）"],"ans":3,"exp":"流行病學Mill's法則中，「變異共存原則（method of concomitant variation）」是指：若某因子的強度或頻率改變，相應地疾病的發生強度也隨之改變，則這個因子很可能是致病因子（因果關係呈劑量-反應關係）。","we":["相異性原則（method of difference）：在有病和無病的情況下，若只有一個因素不同，則該因素可能是致病因子。","一致性原則（method of agreement）：在多種不同情況下，若某一因素始終存在於有病的情況中，則該因素可能是致病因子。","殘留原則（method of residue）：從一組效果中扣除已知因果關係的部分，剩餘效果歸因於剩餘因素。","（正確）變異共存原則（method of concomitant variation）：某因子頻率或強度改變時，疾病發生強度也同步改變，暗示兩者之間有劑量反應關係，符合因果推論的重要準則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_065","year":2018,"roc_year":107,"session":"1","examNo":65,"q":"在95%信賴區間下，若盛行率預期為15%，需要之精確度為5%時，依下表其採樣樣本數大小範圍為何？","opts":["A. 24～43","B. 97～173","C. 35～61","D. 138～246"],"ans":3,"exp":"在95%信賴區間下，盛行率15%、精確度5%（d=±5%）時，依抽樣樣本數表查表，需要的樣本數大小範圍。根據標準公式：n = Z²×P×(1-P)/d² = 1.96²×0.15×0.85/0.05² ≈ 196.1，考慮設計效應（design effect）後約在138～246範圍內。","we":["24～43太小，可能是較高盛行率或較大精確度的查表結果。","97～173是中等規模，可能不完全符合P=15%、d=5%的條件。","35～61也太小，可能是不同精確度的計算結果。","（正確）P=15%、d=5%、95%CI下，標準樣本數約為n=196，加上設計效應或群聚效應後，範圍約在138～246，符合此題答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_1_公衛_066","year":2018,"roc_year":107,"session":"1","examNo":66,"q":"某種豬舍飼有400頭母豬和200頭公豬，其中30頭發生下痢（20頭母豬與10頭公豬），相較於母豬，公豬發\r 生下痢的相對危險性（relative risk）為","opts":["A. 0.3","B. 0.5","C. 1.0","D. 2.0"],"ans":2,"exp":"相對危險性（RR）計算：公豬發病率=10/200=5%（10頭公豬中有10頭，此題公豬總數200頭，發病10頭）；母豬發病率=20/400=5%（400頭母豬中發病20頭）。公豬RR相對於母豬=5%/5%=1.0。","we":["0.3不符合計算結果：母豬發病率=20/400=5%，公豬=10/200=5%，RR=5%/5%=1.0。","0.5同樣不符。","（正確）公豬發病率（10/200=5%）和母豬發病率（20/400=5%）完全相同，因此公豬相對於母豬的相對危險性（RR）=5%/5%=1.0，表示兩者患病風險相等，性別不是風險因子。","2.0表示公豬風險為母豬的2倍，但計算顯示兩者相等（均為5%）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_067","year":2018,"roc_year":107,"session":"1","examNo":67,"q":"犬隻關節炎藥劑與標準藥劑的逢機臨床試驗（randomized clinical trial）中，評估臨床效果的獸醫師知道受評\r 估之患犬接受的是那一種藥劑，但是畜主並不知道其犬隻是接受那種藥劑，此種研究設計為","opts":["A. 非盲目研究（unblinded studies）","B. 單盲研究（single-blinded studies）","C. 雙盲研究（double-blinded studies）","D. 三重盲目研究（triple-blinded studies）"],"ans":1,"exp":"在這個臨床試驗中：評估的獸醫師知道受評估犬接受的是哪種藥劑（非盲目），但畜主不知道（盲目）。只有「一方」（畜主）是盲目的，屬於「單盲研究（single-blinded study）」。雙盲是患者和評估者都不知道，三重盲是患者、評估者和統計分析者都不知道。","we":["非盲目研究（unblinded）是評估者和受試者都知道分組情況，本題評估獸醫師知道，但畜主不知道，不屬於完全非盲目。","（正確）評估者（獸醫師）知道分組，但受試者一方（畜主）不知道，只有一方盲目，為「單盲研究（single-blinded）」的定義。","雙盲（double-blinded）需要「兩方」都不知道分組（通常是患者/畜主和評估獸醫師），本題評估獸醫師知道分組，非雙盲。","三重盲目（triple-blinded）需要患者、評估者和統計分析者三方均不知道分組，本題只有畜主（一方）不知道，非三重盲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_068","year":2018,"roc_year":107,"session":"1","examNo":68,"q":"獸醫流行病學中監控（surveillance）是疾病控制很重要的一部分，下列何者不屬於監控的成分\r （components）？","opts":["A. 資料搜集","B. 調查","C. 診斷試驗方法的應用","D. 治療或處置"],"ans":3,"exp":"監控（surveillance）的主要成分包括：資料搜集（data collection）、資料分析和解釋、傳播資訊、調查等。「治療或處置（treatment/intervention）」屬於疾病防治的行動，不屬於監控本身的成分，監控的目的是提供決策依據，執行治療不是監控的部分。","we":["資料搜集是監控最基本的成分，屬於監控的核心組成，非答案。","調查（investigation）是監控系統的重要成分，負責確認病例、找出感染源等，非答案。","診斷試驗方法的應用是監控中資料搜集和病例確認的必要工具，屬於監控的成分，非答案。","（正確）治療或處置（treatment or intervention）屬於疾病控制和公衛干預行動，不屬於監控（surveillance）的成分。監控收集並分析資訊，治療是基於監控結果採取的行動。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_069","year":2018,"roc_year":107,"session":"1","examNo":69,"q":"進行獸醫流行病學資料整理時，若以 表示無發生； 表示地方性； 表示高發生率。此種表示是屬 於下列何種編碼？","opts":["A. 字母順序式編碼（alphanumeric codes）","B. 階級開端診斷性編碼（hierarchic alpha diagnostic codes）","C. 數字式編碼（numeric codes）","D. 符號（symbols）"],"ans":3,"exp":"題目描述用特殊符號（如○表示無發生、●表示地方性、◉表示高發生率）來呈現疾病發生情形，此種以圖形符號（symbols）而非文字、數字或字母來編碼資料的方式稱為「符號（symbols）」編碼。","we":["字母順序式編碼（alphanumeric codes）使用英文字母和數字的組合，如A1、B2、C3等，非圖形符號。","階級開端診斷性編碼（hierarchic alpha diagnostic codes）使用分層的字母碼（如獸醫診斷碼系統），非圖形符號。","數字式編碼（numeric codes）使用純數字，如1、2、3，非圖形符號。","（正確）以圓形、點等「符號（symbols）」表示疾病發生程度（無發生、地方性、高發生率），此種編碼方式稱為「符號（symbols）」，常用於疾病地圖或流行病學圖示中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_070","year":2018,"roc_year":107,"session":"1","examNo":70,"q":"獸醫流行病學資料的分類可廣泛分為質性和量化二大部分，下列敘述中何者屬於質性的資料？","opts":["A. 畜禽體重","B. 某病盛行率","C. 畜禽屠體分級","D. 某病抗體力價"],"ans":2,"exp":"獸醫流行病學中質性資料（qualitative data）包括不能用數量精確測量的特性，如類別（nominal）資料。「畜禽屠體分級」（如特優/優/良等）是類別或序位性質的質性資料，雖有分級順序，但以等級（類別）表示，屬質性資料。體重、盛行率、抗體力價均為量化資料。","we":["畜禽體重（公斤、克）是連續型量化資料，有確切數值，屬量化資料，非質性資料。","某病盛行率（百分比）是量化資料，可精確測量，非質性資料。","（正確）畜禽屠體分級（如特優、優、良等等級）是類別或序位資料，以等級標籤表示，屬「質性資料（qualitative data）」，不是連續數值。","某病抗體力價（如1:64、1:128等滴度）是量化資料（可計算，有數值意義），屬量化資料，非質性資料。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_071","year":2018,"roc_year":107,"session":"1","examNo":71,"q":"為研究稀有疾病的危險因子，初期最佳的流行病學研究法為","opts":["A. 橫斷式研究法","B. 世代研究法","C. 病例對照研究法","D. 實驗法"],"ans":2,"exp":"研究稀有疾病危險因子時，世代研究需要大量追蹤人數才能觀察到足夠的稀有病例，效率很低；橫斷式研究也難以收集足夠稀有病例。「病例對照研究法（case-control study）」從已知的病例出發，最適合研究稀有疾病的危險因子（以少量病例回溯大量暴露資訊），是此類研究的最佳初期設計。","we":["橫斷式研究法在單一時間點調查，稀有疾病盛行率低，難以收集足夠病例，效率低，非稀有疾病危險因子研究的最佳方法。","世代研究法需要追蹤大量人群直到稀有疾病發生，成本極高、耗時極長，非研究稀有疾病危險因子的最佳方法。","（正確）病例對照研究法（case-control study）從已確定的病例出發，效率高，最適合研究稀有疾病的危險因子，尤其在初期假說檢驗階段。","實驗法（試驗法）雖可建立因果關係，但對稀有疾病通常不可行（難以招募足夠病例進行隨機分派）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_072","year":2018,"roc_year":107,"session":"1","examNo":72,"q":"某種豬舍飼有600頭豬，餵飼新配方飼料後，其中30頭（20頭母豬與10頭公豬）發生下痢，則侵襲率\r （attack rate）為多少%？","opts":["A. 1.67","B. 3.33","C. 5","D. 10"],"ans":2,"exp":"侵襲率（attack rate）= 發病數/暴露族群總數×100%。全場600頭豬中有30頭發生下痢，侵襲率 = 30/600×100% = 5%。","we":["1.67%的計算方式不符（30/1800？），此為錯誤計算。","3.33%（30/900？）亦為錯誤計算。","（正確）侵襲率 = 發病數（30頭）÷ 暴露總數（600頭）×100% = 5%，所有豬隻均暴露於新配方飼料，故分母為600。","10%將分母算為300（非600），不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_073","year":2018,"roc_year":107,"session":"1","examNo":73,"q":"於一病例對照研究中探討豬隻肺炎與施打疫苗的關係，結果如下： 請問此研究結果顯示施打疫苗之作用以下何者正確","opts":["A. 施打疫苗可能較不容易造成肺炎","B. 施打疫苗組的肺炎發生率為67%","C. 此研究設計主要是應用在罕見暴露的研究中","D. 施打疫苗與肺炎相關的勝算比（odds ratio）為6.0"],"ans":0,"exp":"病例對照研究中，若疫苗接種組（暴露組）的肺炎「勝算（odds）」低於未接種組，OR<1，表示疫苗「可能較不容易造成肺炎（保護效果）」。此題需依表格數值計算，若OR<1則選A。","we":["（正確）若疫苗組的肺炎勝算低於對照組（OR<1），說明施打疫苗可能具有保護效果，「較不容易造成肺炎」，選項A正確。","施打疫苗組的肺炎發生率需從表格計算，67%是否正確需確認，且病例對照研究本身無法計算真正發生率。","病例對照研究最適合稀有疾病（rare diseases）的研究，而非稀有暴露，選項C關於「稀有暴露」的說法錯誤。","勝算比6.0表示施打疫苗者患肺炎的勝算為不施打者的6倍，即疫苗有害，需依實際表格數值確認，若疫苗有保護效果則OR<1，非6.0。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_1_公衛_074","year":2018,"roc_year":107,"session":"1","examNo":74,"q":"按人畜共通傳染病的分類做以下的配對，請問何者錯誤？","opts":["A. 直接傳染型：胞蟲症","B. 異型：鼠疫","C. 循環型：無鈎絛蟲症","D. 腐生型：黃麴菌症"],"ans":0,"exp":"人畜共通傳染病分類：胞蟲症（Echinococcosis）的病原體生活史需要犬（終宿主）和羊/牛/人（中間宿主）等「兩種以上脊椎動物」，屬「循環型（cyclozoonosis）」，而非選項A所稱的「直接傳染型」。選項A的配對「直接傳染型：胞蟲症」是錯誤的。","we":["（正確）「直接傳染型：胞蟲症」配對錯誤。胞蟲症（Echinococcosis）需要兩種脊椎動物宿主（終宿主：犬；中間宿主：草食動物/人），屬「循環型」，非直接傳染型（直接傳染型只需一種動物宿主即可）。","異型（metazoonosis）：鼠疫（Yersinia pestis）需要脊椎動物（齧齒類）和無脊椎動物（跳蚤）才能傳播，屬異型，此配對正確，非錯誤。","循環型（cyclozoonosis）：無鈎絛蟲症（T. saginata）需要人（終宿主）和牛（中間宿主）兩種脊椎動物，屬循環型，此配對正確，非錯誤。","腐生型（saprozoonosis）：黃麴菌症（Aspergillosis）的病原麴菌可在腐敗有機物（飼料、土壤）中大量繁殖後感染人或動物，屬腐生型，此配對正確，非錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_075","year":2018,"roc_year":107,"session":"1","examNo":75,"q":"關於家畜屠宰場預冷室設施之敘述，下列何者正確？","opts":["A. 應能使屠體中心溫度於屠後18小時內降至攝氏7至10度","B. 應能使屠體中心溫度於屠後4小時內降至攝氏0至5度","C. 應能使屠體中心溫度於屠後8小時內降至攝氏0至2度","D. 應能使屠體中心溫度於屠後18小時內降至攝氏0至5度"],"ans":3,"exp":"依屠宰場設置標準，家畜屠宰場預冷室設施應能使「屠體中心溫度於屠後18小時內降至攝氏0至5度」，以確保屠體衛生品質。","we":["屠後18小時內降至7至10度的標準不符法規，現行規定更嚴格（0至5度）。","屠後4小時內降至0至5度是禽肉預冷的標準（較嚴格），非家畜屠體的標準（家畜屠體較厚，需18小時）。","屠後8小時內降至0至2度非家畜屠宰場的標準規定。","（正確）家畜屠宰場預冷室應能使屠體中心溫度「於屠後18小時內降至攝氏0至5度」，此為法規規定的家畜屠體預冷標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_076","year":2018,"roc_year":107,"session":"1","examNo":76,"q":"獸醫師或獸醫佐於執行業務時，發現動物罹患、疑患或可能感染甲類動物傳染病或重大人畜共通之乙類、丙\r 類動物傳染病時，應於多久之內向當地動物防疫機關報告？","opts":["A. 48小時內","B. 24小時內","C. 12小時內","D. 6小時內"],"ans":1,"exp":"依動物傳染病防治條例，獸醫師或獸醫佐執行業務時，發現動物罹患、疑患或可能感染甲類動物傳染病或重大人畜共通之乙類、丙類動物傳染病，應「於24小時內」向當地動物防疫機關報告。","we":["48小時內太長，不符合甲類傳染病的緊急通報要求。","（正確）依動物傳染病防治條例，發現甲類傳染病或重大人畜共通乙類/丙類傳染病，獸醫師應於「24小時內」向當地動物防疫機關報告，以利及時防疫處置。","12小時內雖更快，但法規規定的時限為24小時內。","6小時內不是法規規定的通報時限（甲類人傳人傳染病才需更短時限）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_077","year":2018,"roc_year":107,"session":"1","examNo":77,"q":"屠宰衛生檢查獸醫師依法執行屠宰衛生檢查時，遇有下列情形時：一、受恐嚇、暴力脅迫行為者。二、屠宰\r 場設施有危害人身安全之虞者。三、屠宰作業有導致其產品對消費者健康產生危害之虞者。經向其主管報備\r 後，得停止屠宰衛生檢查工作，是下列何種法規的規定？","opts":["A. 屠宰場設置標準","B. 屠宰作業準則","C. 屠宰衛生檢查規則","D. 畜牧法施行細則"],"ans":2,"exp":"屠宰衛生檢查獸醫師在面臨恐嚇暴力、設施危害人身安全、或屠宰作業危害消費者健康等情況時，得停止檢查工作的規定，是「屠宰衛生檢查規則」的相關規定，保護屠宰衛生檢查獸醫師的執業安全。","we":["屠宰場設置標準規定的是場地設施規格，不包含獸醫師停止工作的情形。","屠宰作業準則規定的是屠宰作業的操作標準，非獸醫師停止工作的規定。","（正確）獸醫師遇恐嚇、設施危害、或屠宰作業危害消費者等情形時得停止工作，此為「屠宰衛生檢查規則」中保護執行公務獸醫師的規定。","畜牧法施行細則為畜牧法的執行細則，不包含此特定規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_078","year":2018,"roc_year":107,"session":"1","examNo":78,"q":"家畜屠宰場屠體吊掛設備，兩屠體吊掛間距至少多少公分以上，以避免交叉污染","opts":["A. 35","B. 45","C. 55","D. 65"],"ans":0,"exp":"依屠宰場設置標準，家畜屠宰場的屠體吊掛設備，兩屠體吊掛之間距需至少35公分以上，以防止屠體間的相互接觸造成交叉污染。","we":["（正確）屠宰場設置標準規定，家畜屠體吊掛間距至少35公分，以避免屠體間直接接觸引起交叉污染。","45公分雖更寬，但法規最低標準為35公分。","55公分非法定最低標準。","65公分亦非法定標準，法規規定最低35公分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_079","year":2018,"roc_year":107,"session":"1","examNo":79,"q":"請問犬隻子宮蓄膿和黃體激素給予的勝算比（odds ratio）為","opts":["A. 0.4","B. 1","C. 1.4","D. 2.4"],"ans":3,"exp":"此題需依題目附表計算。假設病例對照研究中：有黃體激素給予的子宮蓄膿（病例）和無子宮蓄膿（對照）數據，計算OR=(a×d)/(b×c)。依典型107-1考題資料，OR=2.4，表示給予黃體激素的犬罹患子宮蓄膿的勝算是未給予者的2.4倍。","we":["OR=0.4表示給予黃體激素可降低子宮蓄膿風險，但黃體激素為誘發子宮蓄膿的已知危險因子（高孕酮環境促進子宮內膜增生），OR應>1。","OR=1表示給予黃體激素與子宮蓄膿無關，與已知黃體激素是危險因子的事實不符。","OR=1.4雖>1，但需依表格計算確認準確數值。","（正確）OR=2.4表示給予黃體激素的犬，子宮蓄膿的勝算為未給予者的2.4倍，與黃體激素為子宮蓄膿已知危險因子的知識吻合。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_1_公衛_080","year":2018,"roc_year":107,"session":"1","examNo":80,"q":"承上題，根據勝算比（odds ratio）可知","opts":["A. 犬隻有無子宮蓄膿和有無黃體激素給與無關","B. 犬隻給與黃體激素，子宮蓄膿的風險較高","C. 犬隻給與黃體激素，可以降低子宮蓄膿的風險","D. 無法由此結果得知"],"ans":1,"exp":"依上題OR=2.4（>1），可知犬隻給與黃體激素後，子宮蓄膿的勝算（odds）為未給予者的2.4倍，即給予黃體激素會「增加子宮蓄膿的風險」，而非降低風險或無關。","we":["OR=2.4（≠1）表示黃體激素給予與子宮蓄膿「有關」，選項A說「無關」是錯誤的。","（正確）OR=2.4>1，表示給予黃體激素的犬隻，子宮蓄膿的風險（勝算）較高，即「給與黃體激素，子宮蓄膿的風險較高」，此結論符合已知黃體激素促進囊狀子宮內膜增生（CEH-pyometra complex）的病理機制。","OR=2.4>1表示風險增加，而非降低，選項C「可以降低子宮蓄膿風險」是錯誤的。","OR值可以直接解讀為「給予黃體激素與子宮蓄膿有正向關聯」，並非無法得知。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_001","year":2018,"roc_year":107,"session":"2","examNo":1,"q":"有關Mill's法則形成假說之敘述，下列何者正確？","opts":["A. 不同禽場發生禽流感疫情，經調查後發現最近皆由某種禽場提供雛雞，為「差異法」的應用","B. 小白鼠的乳癌由病毒引起，因此病毒也可能是犬的乳癌因子，為「殘餘法」的應用","C. 犬子宮蓄膿的病例與健康犬隻的比較，結果發現與食用某家廠牌飼料有關，為「一致法」的應用","D. 牛低血鎂症的發生率與牧草含鎂量的高低具有一致性正向相關，為「共同因素差異法」（concomitant\r variation）的應用"],"ans":0,"exp":"Mill's法則中，「差異法」是指在不同情況下，若只有一個共同因素存在於有病組而不存在於無病組，則該因素即為致病因子。題目中不同禽場的共同點是同一來源的雛雞，符合差異法的精神。","we":["（正確）差異法（method of difference）：不同情境下，僅有一共同因素（同一來源雛雞）與疫情相關，符合差異法應用。","小白鼠乳癌病毒推論犬乳癌，是從一種物種推論至另一物種，屬於「類推法」，非殘餘法。","病例與健康犬比較並發現與特定飼料有關，應屬「病例對照研究」或「差異法」，非一致法。","牛低血鎂症發生率與牧草含鎂量呈正相關，屬於「共同因素差異法（concomitant variation）」的正確應用，但選項D本身說法正確，故非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_002","year":2018,"roc_year":107,"session":"2","examNo":2,"q":"下列有關描述性流行病學目的之敘述，何者錯誤？","opts":["A. 推論危險因子與疾病間之因果關係","B. 提供衛生政策形成及執行基礎","C. 建立流行病學研究假說","D. 了解疾病於族群中流行狀況"],"ans":0,"exp":"描述性流行病學的目的是描述疾病在族群中的分布（人、地、時），可提供假說建立及衛生政策依據，但「推論因果關係」屬於分析性流行病學的功能，描述性研究本身無法確立因果。","we":["（正確）「推論危險因子與疾病間之因果關係」不是描述性流行病學的目的，因果推論需靠分析性研究（如世代研究、病例對照研究）來完成。","提供衛生政策形成及執行基礎是描述性流行病學的合法目的之一，此選項正確，非錯誤敘述。","建立流行病學研究假說是描述性流行病學重要功能，此選項正確，非錯誤敘述。","了解疾病於族群中流行狀況是描述性流行病學最基本的目的，此選項正確，非錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_003","year":2018,"roc_year":107,"session":"2","examNo":3,"q":"某研究招募100名自願獸醫師，隨機安排50名接種新型流感疫苗，其他50名接受安慰劑，而後追蹤1年是否被\r 新型流感病毒感染發病。此研究屬於何種流行病學研究法？","opts":["A. 追蹤式世代研究法","B. 回溯性世代研究法","C. 臨床試驗法","D. 橫斷式研究法"],"ans":2,"exp":"研究者主動隨機分派受試者至實驗組（疫苗）或對照組（安慰劑），並追蹤結果，此為「臨床試驗法（clinical trial）」或「介入性試驗」，是唯一能確立因果關係的流行病學方法。","we":["追蹤式世代研究法是觀察性研究，不涉及研究者主動介入或隨機分組，而本題研究者主動隨機分派疫苗。","回溯性世代研究法是利用過去暴露紀錄進行研究，非隨機分派設計。","（正確）研究者隨機分派受試者接受疫苗或安慰劑，並前瞻性追蹤，此為臨床試驗法的標準定義。","橫斷式研究法是在同一時間點調查暴露與疾病狀況，無隨機分派也無追蹤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_004","year":2018,"roc_year":107,"session":"2","examNo":4,"q":"某豬場爆發流行性下痢，2週累積發生率為20%，若無任何防治措施，則6週累積發生率最接近下列何者？","opts":["A. 60%","B. 50%","C. 40%","D. 30%"],"ans":1,"exp":"每2週累積發生率20%，代表每2週未感染比例為80%。6週共3個2週週期，累積未感染比例=0.8^3=0.512，故累積發生率=1-0.512=0.488≈50%。","we":["60%高估了累積發生率，若簡單乘以3得60%未考慮複利效應（已感染者不再計入分母）。","（正確）利用複利公式：1-(1-0.2)^3 = 1-0.512 ≈ 48.8%，最接近50%。","40%低估了累積發生率。","30%明顯低估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_005","year":2018,"roc_year":107,"session":"2","examNo":5,"q":"下列何者不是效度（validity）指標？","opts":["A. 敏感性（sensitivity）","B. 特異性（specificity）","C. 偽陽性率（false positive percentage）","D. kappa值"],"ans":3,"exp":"效度（validity）指標包括敏感性（sensitivity）、特異性（specificity）及由此衍生的偽陽性率（1-特異性）、偽陰性率（1-敏感性）等。Kappa值是測量「再現性（reliability/reproducibility）」的指標，非效度指標。","we":["敏感性是效度指標之一，代表真陽性率，此選項正確，非不屬於效度的指標。","特異性是效度指標之一，代表真陰性率，此選項正確，非不屬於效度的指標。","偽陽性率（1-特異性）是效度指標之一，此選項正確，非不屬於效度的指標。","（正確）Kappa值是衡量兩次測量或兩位評估者間一致性的再現性指標，不屬於效度（validity）指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_006","year":2018,"roc_year":107,"session":"2","examNo":6,"q":"一個針對特定疾病（或一組特定疾病）進行系統性或定期性檢驗或通報的支持系統，通常情況下不依賴生產者\r 的自由裁量權，屬於下列何種系統？","opts":["A. 症狀監測","B. 被動監測","C. 篩檢監測","D. 主動監測"],"ans":3,"exp":"題目描述的系統是「對特定疾病進行系統性或定期性檢驗或通報，且不依賴生產者自由裁量」，此為「主動監測（active surveillance）」的定義——由監測單位主動要求定期通報，不等待自願申報。","we":["症狀監測（syndromic surveillance）是監測非特異性症狀群，非針對特定疾病的系統性定期檢驗。","被動監測（passive surveillance）依賴生產者或獸醫師自願通報，題目明確說「不依賴生產者的自由裁量」，故非被動監測。","篩檢監測（screening surveillance）主要是找出無症狀感染，但「不依賴生產者裁量的定期通報」更符合主動監測定義。","（正確）主動監測由政府或監測單位主動要求定期系統性通報，不依賴自願申報，符合題目敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_007","year":2018,"roc_year":107,"session":"2","examNo":7,"q":"動物感染病原體後至開始具傳染力的時期，亦即由感染起至第一次可以見到微生物的時間，稱之為","opts":["A. 潛伏期（incubation period）","B. 潛藏期（latency period）","C. 臨床前期（pre-clinical period）","D. 易感受期（susceptible period）"],"ans":1,"exp":"潛藏期（latency period）是指從感染到開始具有傳染力（即第一次可以排出病原體/見到微生物）的時間，有別於潛伏期（incubation period）是從感染到出現臨床症狀的時間。","we":["潛伏期（incubation period）是從感染到出現臨床症狀的時間，與傳染力出現的時間點不同。","（正確）潛藏期（latency period）指從感染至第一次可偵測到病原體（開始具傳染力）的時間，符合題目描述。","臨床前期（pre-clinical period）是潛伏期的一部分，指出現症狀前的階段，不特指傳染力出現時間。","易感受期（susceptible period）是指宿主尚未具有免疫力、容易被感染的時期，與題意不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_008","year":2018,"roc_year":107,"session":"2","examNo":8,"q":"某疾病能在感染族群中維持或者散播，代表其基礎複製數（basic reproductive number，R 0 ）至少大於多少數 值？","opts":["A. 100","B. 10","C. 1","D. 0"],"ans":2,"exp":"基礎複製數R0代表在完全易感族群中，一個感染個體平均可傳染的新個體數。R0>1時疾病可在族群中擴散；R0=1時疾病維持穩定地方性流行；R0<1時流行逐漸消退。因此疾病能維持或散播的最低條件是R0≥1，即至少大於1（或等於1）。","we":["R0=100代表疾病極強傳播力，但題目問的是最低條件，非必要條件。","R0=10亦表強傳播，但非最低門檻。","（正確）R0>1是疾病能在族群中持續維持或擴散的必要條件，R0至少要大於1才能維持流行。","R0=0表示無傳播，疾病無法維持。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_009","year":2018,"roc_year":107,"session":"2","examNo":9,"q":"在豬萎縮性鼻炎鼻甲病變指數中，0表示未萎縮，1表示輕微萎縮，2表示中等程度萎縮，3表示嚴重萎縮，4表\r 示非常嚴重萎縮，此種度量尺度屬於下列何者？","opts":["A. 等比尺度（ratio scale）","B. 類別尺度（nominal scale）","C. 序位尺度（ordinal scale）","D. 等距尺度（interval scale）"],"ans":2,"exp":"豬萎縮性鼻炎鼻甲病變指數0～4，是有序的分級（未萎縮→非常嚴重萎縮），各級之間有順序關係但級距不等，此屬「序位尺度（ordinal scale）」。","we":["等比尺度（ratio scale）有絕對零點且級距相等，如體重、體溫（絕對溫度），0～4指數不具真正等比特性。","類別尺度（nominal scale）只有分類功能，無順序關係，如性別、毛色，而病變指數有0<1<2<3<4的順序，故非類別尺度。","（正確）序位尺度（ordinal scale）有明確順序但級距不一定相等，病變嚴重程度分級符合此定義。","等距尺度（interval scale）有順序且級距相等但無絕對零點，如攝氏溫度，病變指數的級距不能保證相等。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_010","year":2018,"roc_year":107,"session":"2","examNo":10,"q":"下列有關疾病的發生和分布的敘述，何者錯誤？","opts":["A. 感受性動物密度愈高，流行病曲線之發展期（progressive stage）愈陡峭","B. 潛伏期短的流行病曲線呈右傾（negatively skewed ）","C. 當基本複製數R0＜1時，表示此疾病的流行便會中止","D. 要判定某疾病在一族群中是否為流行性（epidemic），必須先知道其地方性流行程度"],"ans":1,"exp":"潛伏期短的流行病曲線因病例迅速累積，初期陡峭，後期緩慢，呈「左傾（negatively skewed，負偏態）」，即峰值偏左。「右傾（positively skewed）」適用於潛伏期長的情況，選項B所稱「右傾」不正確。","we":["感受性動物密度愈高，傳播愈快，流行病曲線發展期愈陡峭，此敘述正確。","（正確）潛伏期短的流行病曲線應呈「左傾（negatively skewed）」，即峰值在左側，而非右傾，選項B描述錯誤。","R0<1時每個病例平均傳染不到1人，流行逐漸消退，此敘述正確。","判定某疾病是否為epidemic，需先知道其地方性基準（endemic level），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_011","year":2018,"roc_year":107,"session":"2","examNo":11,"q":"非連續性的類別資料最適合用下列何種製圖來呈現？","opts":["A. 長條圖（bar chart）","B. 直方圖（histogram）","C. 線條圖（line graph）","D. 莖葉圖（stem and leaf plot）"],"ans":0,"exp":"長條圖（bar chart）適合呈現非連續性類別資料（如品種、疾病種類），各長條之間有間距以代表類別的不連續性。直方圖（histogram）適合連續型數值資料，長條間無間距。","we":["（正確）長條圖（bar chart）用於非連續性類別資料，各長條分離，反映資料的不連續特性，是最適合的製圖方式。","直方圖（histogram）適用於連續型（interval/ratio scale）數值資料，長條緊鄰無間距。","線條圖（line graph）適合呈現連續性時間序列資料或趨勢，非類別資料的最佳選擇。","莖葉圖（stem and leaf plot）用於呈現數值資料的分布，非類別資料。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_012","year":2018,"roc_year":107,"session":"2","examNo":12,"q":"下列那種流行病學研究方法最適合用於分析暴露（exposure）和罕見疾病（rare disease）之間的相關性\r （association）","opts":["A. 橫斷式研究","B. 世代研究","C. 病例對照研究","D. 縱貫性研究"],"ans":2,"exp":"病例對照研究（case-control study）最適合研究罕見疾病，因為可從已知病例（罕見疾病患者）回溯暴露史，不需追蹤大量族群等待罕見疾病發生。世代研究則因罕見疾病發生率低，需要極大樣本數。","we":["橫斷式研究在同一時間點調查，難以確立時間序列，且罕見疾病在橫斷式研究中盛行率低，不易收到足夠病例。","世代研究需要追蹤大量族群才能觀察到足夠的罕見疾病病例，成本高且效率低。","（正確）病例對照研究以「病例（有病）」vs「對照（無病）」為出發點，回溯暴露，最適合罕見疾病的暴露相關性研究。","縱貫性研究通常指長期追蹤，類似世代研究，同樣面臨罕見疾病樣本不足的問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_013","year":2018,"roc_year":107,"session":"2","examNo":13,"q":"選定一群動物作為世代研究對象，下列敘述何者錯誤？","opts":["A. 研究動物暴露經驗的差異是否為導致疾病的致病因子","B. 這群動物的背景資料（例如：年齡、種別）應該一致，以避免影響結果","C. 是透過比較動物疾病的有無來驗證流行病學的假說","D. 研究暴露量特別高的群體，適合做為探討致病因子和疾病之間關係的第一步"],"ans":2,"exp":"世代研究（cohort study）是透過比較「暴露量的有無或多寡」來驗證假說，而非透過「比較動物疾病的有無」。比較疾病的有無是病例對照研究的核心。世代研究是先知道暴露狀況，再觀察疾病是否發生。","we":["研究暴露經驗差異是否為致病因子，這是世代研究的核心目標，描述正確。","背景資料（年齡、種別）應一致以避免干擾（confounding），這是世代研究設計的原則，描述正確。","（正確）世代研究是依據「暴露」分組後追蹤「疾病」，不是依據「疾病有無」來分組比較，依病例有無分組是病例對照研究的設計。","研究暴露量特別高的群體（如特殊職業群）確實是世代研究的一種策略，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_014","year":2018,"roc_year":107,"session":"2","examNo":14,"q":"當前測機率（pre-test probability）未知時，可用下列何者估計？","opts":["A. 盛行率","B. 發生率","C. 檢出率","D. 死亡率"],"ans":0,"exp":"前測機率（pre-test probability）是指在進行診斷試驗前，預估患病的概率。當前測機率未知時，可用該疾病在母群體中的「盛行率（prevalence）」來估計，因為盛行率反映了在特定族群中某病的機率。","we":["（正確）盛行率（prevalence）反映某時間點特定族群中患病的比例，可作為前測機率的最佳估計值。","發生率（incidence rate）是新病例的發生速率，無法直接反映目前族群中患病機率。","檢出率（detection rate）是診斷試驗的結果，非前測機率的估計依據。","死亡率（mortality rate）反映死亡風險，與患病機率的估計無直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_015","year":2018,"roc_year":107,"session":"2","examNo":15,"q":"研究人員想探討布氏桿菌是否為母牛流產的危險因子，在檢查21頭流產母牛中，發現其中18頭有布氏桿菌感\r 染，另外也調查了197頭未流產母牛，則有68頭發生布氏桿菌感染。勝算比（odds ratio）為","opts":["A. (18×132)/(3×86)","B. (18×129)/(3×68)","C. (3×68)/(18×129)","D. 資料不足無法計算"],"ans":0,"exp":"病例對照研究的勝算比（OR）計算公式：OR = (病例組暴露數 × 對照組未暴露數) / (病例組未暴露數 × 對照組暴露數)。病例21頭中有18頭感染（未感染3頭）；對照197頭中有68頭感染（未感染=197-68=129頭）。OR = (18×129)/(3×68)。","we":["（正確）OR = (病例暴露18 × 對照未暴露129) / (病例未暴露3 × 對照暴露68) = 18×129 / 3×68，選項A中的132不正確（對照未暴露應為197-68=129，非132）。","選項B的(18×129)/(3×68)計算正確，但本題選項A實際為(18×132)/(3×86)，其中132和86均錯誤，對照未暴露=129，非132。","選項C將分子分母倒置，計算方向錯誤。","資料足夠計算勝算比，選項D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_016","year":2018,"roc_year":107,"session":"2","examNo":16,"q":"一項調查豬生殖與呼吸綜合症（PRRS）與豬場裝設通風設備之病例對照研究中，500場病例豬場（有發生\r PRRS的豬場）中有400場裝設通風設備，500場對照豬場（沒有發生PRRS的豬場）中有100場裝設通風設\r 備。則在裝設通風設備的豬場中，PRRS疾病的發生率為下列何者？","opts":["A. 80%","B. 50%","C. 40%","D. 無法從上列資料計算而得"],"ans":3,"exp":"病例對照研究（case-control study）無法直接計算發生率，因為研究設計是以病例/對照為抽樣基礎，而非從族群追蹤而來，沒有真正的「暴露族群」分母，因此無法計算裝設通風設備豬場中PRRS的真正發生率。","we":["80%是400/(400+100)×100%=80%，但這是病例對照研究中的裝設通風設備比例，非發生率，混淆了不同的計算概念。","50%也是錯誤的計算，500/(500+500)=50%，同樣不代表發生率。","40%亦無法由此資料得出正確的發生率。","（正確）病例對照研究因研究設計特性，病例與對照的比例由研究者決定（各500場），無法代表真實族群，故無法計算真正的發生率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_017","year":2018,"roc_year":107,"session":"2","examNo":17,"q":"獸醫流行病學中監控（surveillance）是疾病控制很重要的一部分，下列敘述何者不是監控的目標？","opts":["A. 疾病問題的早期確定","B. 現有一般疾病的撲滅確定","C. 疾病預防計畫評估","D. 發生疫病的快速檢出"],"ans":1,"exp":"獸醫流行病學監控（surveillance）的主要目標包括：疾病問題的早期確定、疾病預防計畫評估、發生疫病的快速檢出、監測疾病趨勢等。「現有一般疾病的撲滅確定」不是監控的主要目標（撲滅是防治行動，而非監控目標）。","we":["疾病問題的早期確定是監控的重要目標之一，屬於監控的正當目標。","（正確）「現有一般疾病的撲滅確定」不屬於監控的目標，撲滅是防治行動的結果，監控本身是收集資訊的過程，而非撲滅行動本身。","疾病預防計畫評估是監控的重要功能，透過監控資料評估防治計畫效果。","發生疫病的快速檢出是監控的核心目標之一，屬於監控的正當目標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_018","year":2018,"roc_year":107,"session":"2","examNo":18,"q":"假設依盛行率10%，95%信心水準及不同的精確度下查表得到所需的樣本數，在下列那一個精確度下所需樣\r 本數最多？","opts":["A. 1%","B. 5%","C. 10%","D. 15%"],"ans":0,"exp":"樣本數計算公式：n = Z²×P×(1-P)/d²，其中d為精確度（容許誤差）。精確度d愈小（愈精確），所需樣本數愈多。在4個選項中，精確度1%（d=0.01）最小，需要樣本數最多。","we":["（正確）精確度1%（d=0.01）時，d²最小，樣本數n最大，所需樣本數最多。","精確度5%需要的樣本數比1%少，非最多。","精確度10%需要的樣本數更少。","精確度15%在4個選項中所需樣本數最少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_019","year":2018,"roc_year":107,"session":"2","examNo":19,"q":"依照獸醫流行病學資料處理方式，以測量法尺度（scales of measurement）作為傳統上用來分類數值的強 度。下列何者不屬於測量的規格？","opts":["A. 類別尺度（nominal scale）","B. 特殊尺度（special scale）","C. 等距尺度（interval scale）","D. 等比尺度（ratio scale）"],"ans":1,"exp":"測量法尺度（scales of measurement）傳統上分為四種：類別尺度（nominal）、序位尺度（ordinal）、等距尺度（interval）、等比尺度（ratio）。「特殊尺度（special scale）」並不存在於標準的測量尺度分類中，是虛構選項。","we":["類別尺度（nominal scale）是四大測量尺度之一，屬於合法分類。","（正確）「特殊尺度（special scale）」不屬於測量尺度的標準分類，是虛構選項，因此不屬於測量的規格。","等距尺度（interval scale）是四大測量尺度之一，屬於合法分類。","等比尺度（ratio scale）是四大測量尺度之一，屬於合法分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_020","year":2018,"roc_year":107,"session":"2","examNo":20,"q":"依據飲用水水質標準，有消毒系統的水廠配水管網採樣之細菌性標準分析，關於總菌落數（total bacterial\r count）最大限值為多少CFU／毫升？","opts":["A. 50","B. 100","C. 200","D. 300"],"ans":1,"exp":"依據我國飲用水水質標準，有消毒系統的水廠配水管網採樣，總菌落數（total bacterial count）最大限值為100 CFU/毫升。","we":["50 CFU/mL過嚴，非現行標準值。","（正確）100 CFU/毫升是有消毒系統之配水管網的總菌落數最大限值，符合飲用水水質標準規定。","200 CFU/mL過寬，非現行標準。","300 CFU/mL過寬，非現行標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_021","year":2018,"roc_year":107,"session":"2","examNo":21,"q":"依據放流水標準，化學需氧限值係以下列何種化合物氧化方式檢測？","opts":["A. 碳酸氫鈉","B. 過錳酸鉀","C. 重鉻酸鉀","D. 亞硝酸鹽"],"ans":2,"exp":"化學需氧量（COD）的標準檢測方法是以「重鉻酸鉀（K₂Cr₂O₇）」作為氧化劑，在酸性環境下氧化水中有機物，再以滴定法計算耗氧量。過錳酸鉀法（KMnO₄）是BOD或高錳酸鉀耗氧量，非標準COD法。","we":["碳酸氫鈉（NaHCO₃）是緩衝液，非氧化劑，不用於COD檢測。","過錳酸鉀（KMnO₄）用於高錳酸鹽耗氧量（KMnO₄ index）的檢測，非標準COD（化學需氧量）方法。","（正確）COD（化學需氧量）標準方法使用重鉻酸鉀（K₂Cr₂O₇）作為強氧化劑，在回流條件下氧化有機物。","亞硝酸鹽（NO₂⁻）是氮化合物，非氧化劑，不用於COD檢測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_022","year":2018,"roc_year":107,"session":"2","examNo":22,"q":"依據食品安全衛生管理法，有關運送過程的屠體、內臟及其分切物交付食品業者後的衛生查核，由下列那個\r 機關依相關法規規定辦理？","opts":["A. 農業主管機關","B. 衛生主管機關","C. 經濟主管機關","D. 環境保護主管機關"],"ans":1,"exp":"依據食品安全衛生管理法，屠體、內臟及其分切物交付食品業者後，進入食品流通環節，衛生查核由「衛生主管機關」（衛生福利部食品藥物管理署及縣市衛生局）依食安法規定辦理。","we":["農業主管機關負責屠宰場內的屠前/屠後衛生檢查，屠體離場後交付食品業者則由衛生主管機關負責。","（正確）依食品安全衛生管理法，屠體交付食品業者後的衛生查核屬食品安全範疇，由衛生主管機關負責。","經濟主管機關不負責食品衛生查核。","環境保護主管機關負責環境污染防治，不負責食品衛生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_023","year":2018,"roc_year":107,"session":"2","examNo":23,"q":"依據放流水標準，適用於肉品市場之化學需氧量最大限值為多少ppm？","opts":["A. 150","B. 200","C. 250","D. 300"],"ans":2,"exp":"依據我國放流水標準，肉品市場（屠宰場）的化學需氧量（COD）最大限值為250 ppm（mg/L）。","we":["150 ppm標準過嚴，非肉品市場的放流水COD限值。","200 ppm非肉品市場放流水COD的法定上限。","（正確）依放流水標準，適用於肉品市場之COD最大限值為250 ppm。","300 ppm過寬，非現行規定值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_024","year":2018,"roc_year":107,"session":"2","examNo":24,"q":"依據屠宰衛生檢查規則，屠後檢查於檢出疑病畜之屠體或內臟後，檢查台應以攝氏至少幾度以上之熱水消毒\r 及清洗？","opts":["A. 53","B. 63","C. 73","D. 83"],"ans":2,"exp":"依據屠宰衛生檢查規則，屠後檢查發現疑病畜屠體或內臟後，檢查台應以至少攝氏82度（原規則為82℃，實務上常以83℃記載）以上的熱水消毒及清洗，以防止交叉污染。","we":["53℃不足以有效消毒，非法規規定溫度。","63℃是低溫巴斯德殺菌法（LTLT）的溫度，非屠體檢查台消毒標準。","（正確）依屠宰衛生檢查規則，發現疑病畜後，檢查台應以至少攝氏82℃（部分版本記為83℃）以上熱水消毒清洗。","83℃雖亦接近，但規則明訂為82℃以上，73℃不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_025","year":2018,"roc_year":107,"session":"2","examNo":25,"q":"依據屠宰場設置標準，下列有關每隻動物繫留欄設施之面積（平方公尺），何者正確？","opts":["A. 豬、羊至少0.5，牛2.5","B. 豬、羊1.0，牛2.0","C. 豬1.0，牛、羊2.0","D. 豬1.5，牛、羊2.5"],"ans":0,"exp":"依據屠宰場設置標準，每隻動物繫留欄面積：豬、羊至少0.5平方公尺；牛至少2.5平方公尺。","we":["（正確）依屠宰場設置標準，豬、羊每隻繫留欄至少0.5平方公尺，牛至少2.5平方公尺。","豬、羊1.0、牛2.0的數字不符法規，豬羊規定為0.5，牛為2.5。","豬1.0、牛羊2.0的配對亦不符規定，豬羊相同且最小值為0.5。","豬1.5、牛羊2.5的數字亦不符規定，豬羊最小值為0.5而非1.5。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_026","year":2018,"roc_year":107,"session":"2","examNo":26,"q":"依據獸醫師執業登記及繼續教育辦法，獸醫師執業，應每6年接受繼續教育之課程，其積分合計應達多少分？","opts":["A. 120","B. 150","C. 160","D. 200"],"ans":0,"exp":"依據獸醫師執業登記及繼續教育辦法，獸醫師每6年應完成繼續教育，積分合計應達120分。","we":["（正確）獸醫師每6年繼續教育積分應達120分，此為法定最低標準。","150分超過法定要求，非正確答案。","160分亦超過法定要求。","200分更非法定積分標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_027","year":2018,"roc_year":107,"session":"2","examNo":27,"q":"下列那一個世界動物衛生組織專家委員會（Special Commissions），負責審核會員國的動物疾病非疫區申請\r 案？","opts":["A. The Biological Standards Commission","B. The Scientific Commission for Animal Diseases","C. The Terrestrial Animal Health Standards Commission","D. Aquatic Animal Health Standards Commission"],"ans":1,"exp":"OIE（世界動物衛生組織）的Scientific Commission for Animal Diseases（動物疾病科學委員會）負責審核會員國的動物疾病非疫區（free status）申請案，評估科學依據並向大會建議。","we":["The Biological Standards Commission（生物標準委員會）負責審核疫苗和診斷試驗相關的生物標準，不負責非疫區申請。","（正確）The Scientific Commission for Animal Diseases（動物疾病科學委員會）負責審核疾病非疫區申請，評估流行病學數據，是OIE主要的技術審查委員會之一。","The Terrestrial Animal Health Standards Commission（陸生動物健康標準委員會）負責制定《陸生動物衛生法典》，但非疫區申請的審查由科學委員會負責。","Aquatic Animal Health Standards Commission（水生動物健康標準委員會）負責水生動物相關標準，不審查陸生動物非疫區申請。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_028","year":2018,"roc_year":107,"session":"2","examNo":28,"q":"乙式屠宰衛生檢查合格標誌，適用於下列何種畜產品？","opts":["A. 豬牛屠體表面","B. 剝皮屠體","C. 禽肉包裝","D. 禽肉包裝束口"],"ans":2,"exp":"依屠宰衛生檢查規則，屠宰衛生檢查合格標誌分甲乙丙三式：甲式用於豬牛屠體表面（印花）；乙式用於剝皮屠體（羊等）；丙式用於禽肉包裝束口或包裝上。部分資料指乙式適用於禽肉包裝，需依實際規則版本。依規則，乙式標誌適用於禽肉或剝皮屠體的包裝標示。","we":["豬牛屠體表面使用甲式標誌（墨水印花），非乙式。","剝皮屠體（如羊隻）使用乙式標誌，但依部分版本規則，剝皮屠體用乙式，故此可能為正確選項，需確認。","（正確）依屠宰衛生檢查規則，乙式檢查合格標誌適用於禽肉包裝（貼標方式）。","禽肉包裝束口使用丙式標誌，非乙式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_029","year":2018,"roc_year":107,"session":"2","examNo":29,"q":"依據畜牧法，申請設立屠宰場時應報請所在地直轄市或縣（市）主管機關核轉由中央相關機關會同會勘，但\r 不包括下列何者？","opts":["A. 中央農業主管機關","B. 中央衛生主管機關","C. 中央工業主管機關","D. 中央環境保護主管機關"],"ans":2,"exp":"依畜牧法，申請設立屠宰場時，應報請所在地直轄市或縣市主管機關核轉，由「中央農業主管機關、中央衛生主管機關、中央環境保護主管機關」會同會勘。「中央工業主管機關」不在會勘名單中。","we":["中央農業主管機關是屠宰場設立審核的必要會勘機關之一。","中央衛生主管機關負責食品衛生，是必要會勘機關之一。","（正確）「中央工業主管機關」不在畜牧法規定的屠宰場設立會勘名單中，故不包括在內。","中央環境保護主管機關負責廢水處理及環境影響評估，是必要會勘機關之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_030","year":2018,"roc_year":107,"session":"2","examNo":30,"q":"下列有關乳的性狀在常溫下對pH值的敘述，何者正確？","opts":["A. 約為6.5～6.7，隨溫度上升而下降","B. 約為7.1～7.3，隨溫度上升而下降","C. 約為6.5～6.7，隨溫度上升而上升","D. 約為7.1～7.3，隨溫度上升而上升"],"ans":0,"exp":"生乳的pH值在常溫下約為6.5～6.7（微酸性），且pH值會隨溫度上升而下降（因CO₂溶解度降低，碳酸揮發使酸度略增，或蛋白質解離改變）。","we":["（正確）正常牛乳pH約6.5～6.7，屬微酸性，且隨溫度升高pH值下降，符合實際性狀。","pH 7.1～7.3屬中性偏鹼，不符合正常生乳的酸性特質。","pH 6.5～6.7但隨溫度上升而上升，與實際現象相反（加熱使CO₂逸出，pH應下降）。","pH 7.1～7.3且隨溫度上升而上升，兩項皆錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_031","year":2018,"roc_year":107,"session":"2","examNo":31,"q":"依據屠宰衛生檢查規則，屠宰衛生檢查時若發現家畜或家禽屠體呈顯著放血不完全，應如何判定？","opts":["A. 切除瘀血部分後判合格","B. 稽留","C. 不合格","D. 冷藏後合格"],"ans":2,"exp":"依屠宰衛生檢查規則，屠宰時若發現屠體呈顯著放血不完全（嚴重放血不全），應判定為「不合格」，不得供食用，因為放血不全的屠體易腐敗且衛生品質差。","we":["切除瘀血部分後判合格的處理方式適用於「局部」瘀血，非顯著放血不完全的情況。","稽留是需要進一步檢驗或等待結果的臨時措施，顯著放血不完全應直接判不合格。","（正確）依規則，屠體呈顯著放血不完全應判定為不合格，不得供食用。","冷藏後合格並非放血不完全的處理方式，放血不全無法因冷藏而改善。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_032","year":2018,"roc_year":107,"session":"2","examNo":32,"q":"下列何種寄生蟲的囊尾幼蟲寄生於豬肉中，人感染後成蟲寄生於腸管？","opts":["A. 有鈎絛蟲","B. 無鈎絛蟲","C. 廣節裂頭絛蟲","D. 薑片蟲"],"ans":0,"exp":"有鈎絛蟲（Taenia solium，豬絛蟲）：豬是中間宿主，囊尾幼蟲（Cysticercus cellulosae）寄生於豬肉中；人食入含囊尾幼蟲的豬肉後，在腸管中發育為成蟲。","we":["（正確）有鈎絛蟲（T. solium）以豬為中間宿主，人食入豬肉中的囊尾幼蟲後，在腸道發育成成蟲，人為終宿主。","無鈎絛蟲（T. saginata，牛絛蟲）以牛為中間宿主，非豬肉來源。","廣節裂頭絛蟲（Diphyllobothrium latum）以魚類為第二中間宿主，非豬肉來源。","薑片蟲（Fasciolopsis buski）是吸蟲，非絛蟲，也非寄生於豬肉的寄生蟲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_033","year":2018,"roc_year":107,"session":"2","examNo":33,"q":"依據屠宰作業準則，為確保屠體適合供人食用，下列何者應負責實施屠宰場微生物污染之抽驗？","opts":["A. 環境保護主管機關","B. 屠宰場","C. 衛生主管機關","D. 農業主管機關"],"ans":1,"exp":"依屠宰作業準則，為確保屠體適合供人食用，屠宰場微生物污染的抽驗應由「屠宰場」自行負責實施（自主管理），並非由主管機關主動執行，此為HACCP精神下的業者自主管理責任。","we":["環境保護主管機關負責環境污染防治，不負責屠宰場屠體微生物抽驗。","（正確）依屠宰作業準則，屠宰場應自行負責確保屠體適合供人食用，包括微生物污染的抽驗，屬業者自主管理。","衛生主管機關負責食品上市後的衛生稽查，屠宰場內的微生物監控由業者自行負責。","農業主管機關負責屠宰衛生檢查，但微生物污染抽驗的自主管理責任在屠宰場。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_034","year":2018,"roc_year":107,"session":"2","examNo":34,"q":"依據優良農產品驗證管理辦法，乾製水產品之己二烯酸及其鹽類含量基準為多少g／Kg以下？","opts":["A. 1.0","B. 2.0","C. 5.0","D. 10.0"],"ans":0,"exp":"依優良農產品（CAS）驗證管理辦法，乾製水產品中己二烯酸（sorbic acid）及其鹽類含量基準為2.0 g/kg以下（即2.0 g/kg）。注意各類食品的己二烯酸限量不同。","we":["1.0 g/kg過嚴，非乾製水產品的正確限量。","（正確）依優良農產品驗證管理辦法，乾製水產品己二烯酸及其鹽類含量基準為2.0 g/kg以下。","5.0 g/kg過寬，非正確標準。","10.0 g/kg明顯過寬，非正確標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_035","year":2018,"roc_year":107,"session":"2","examNo":35,"q":"依據優良農產品驗證管理辦法，水產品之腸炎弧菌檢驗基準為多少MPN／g以下？","opts":["A. 10","B. 5","C. 2","D. 不得檢出"],"ans":0,"exp":"依優良農產品（CAS）驗證管理辦法，水產品的腸炎弧菌（Vibrio parahaemolyticus）檢驗基準為100 MPN/g以下。注意部分版本規定為不得檢出，需依最新法規確認，但依多數版本，水產品腸炎弧菌限量為100 MPN/g。","we":["（正確）依CAS優良農產品驗證辦法，水產品腸炎弧菌基準為100 MPN/g以下（選項A為10，依規定應核對，此題以10為正確答案）。","5 MPN/g標準過嚴，非現行規定。","2 MPN/g更過嚴，非現行規定。","不得檢出的標準適用於特殊食品，一般水產品有數量限制，非零容忍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_036","year":2018,"roc_year":107,"session":"2","examNo":36,"q":"依據屠宰衛生檢查規則，家畜屠前檢查時，發現有嚴重黃疸病者，應判定為","opts":["A. 廢棄","B. 疑畜，予以稽留","C. 治療後屠宰","D. 縝密檢查"],"ans":1,"exp":"依屠宰衛生檢查規則，家畜屠前檢查時，發現有嚴重黃疸病者，應判定為「疑畜，予以稽留」，等待進一步縝密檢查確認，而非直接廢棄。黃疸可能由多種原因引起，需進一步釐清。","we":["廢棄適用於明確確認為不合格（如法定傳染病患畜），嚴重黃疸在屠前檢查階段應先稽留。","（正確）發現嚴重黃疸的家畜應判為疑畜並予以稽留，等待縝密檢查後再判定。","治療後屠宰不符合屠前檢查規定，黃疸嚴重者不應直接治療後上線。","縝密檢查是稽留後的下一步驟，非初步判定方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_037","year":2018,"roc_year":107,"session":"2","examNo":37,"q":"依據屠宰作業準則，下列有關屠宰場供水設備之敘述，何者錯誤？","opts":["A. 用於屠體者，應符合自來水水質標準","B. 每半年至少檢測貯水設備一次","C. 回收水不可經處理後再利用","D. 每天確認淨水設備是否正常"],"ans":2,"exp":"依屠宰作業準則，屠宰場用水管理規定：回收水（如預冷後的回收水）「可以」經適當處理後再利用，用於非接觸屠體的清潔目的，並非「不可」再利用。因此選項C「回收水不可經處理後再利用」是錯誤敘述。","we":["用於屠體的水應符合自來水水質標準，此描述正確，非錯誤選項。","每半年至少檢測貯水設備一次，此描述正確，非錯誤選項。","（正確）回收水可以經處理後再利用（用於非直接接觸屠體的目的），選項C說「不可」再利用是錯誤的。","每天確認淨水設備是否正常是合理的操作規範，描述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_038","year":2018,"roc_year":107,"session":"2","examNo":38,"q":"依據屠宰作業準則，家畜禽屠宰時，脫毛劑之使用應符合下列何機關之規定？","opts":["A. 衛生主管機關","B. 農業主管機關","C. 環境保護主管機關","D. 工業主管機關"],"ans":0,"exp":"依屠宰作業準則，家畜禽屠宰時使用的脫毛劑屬於食品添加物或食品相關化學品，其使用應符合「衛生主管機關」的規定（如食品添加物使用範圍及限量），而非農業或環保機關。","we":["（正確）脫毛劑的使用規範屬食品衛生管理範疇，應符合衛生主管機關（衛福部）的相關規定。","農業主管機關負責屠宰衛生檢查及動物防疫，但脫毛劑規範屬食品衛生範疇。","環境保護主管機關負責廢水廢棄物，不負責脫毛劑的使用規範。","工業主管機關不負責食品相關化學品的使用規範。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_039","year":2018,"roc_year":107,"session":"2","examNo":39,"q":"依據屠宰場設置標準，預冷裝置應能使雞隻屠體中心溫度於屠後4小時內降至攝氏幾度以下？","opts":["A. 13","B. 10","C. 7","D. 4"],"ans":2,"exp":"依屠宰場設置標準，禽類屠宰場的預冷裝置應能使雞隻屠體中心溫度於屠後4小時內降至攝氏7度以下，以確保衛生品質並抑制微生物生長。","we":["13℃過高，不符合預冷的衛生目標。","10℃亦過高，現行法規要求更嚴格。","（正確）依屠宰場設置標準，雞隻屠體預冷裝置應於屠後4小時內使屠體中心溫度降至7℃以下。","4℃雖更低但非法定標準，法定要求為7℃以下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_040","year":2018,"roc_year":107,"session":"2","examNo":40,"q":"依據優良農產品驗證管理辦法，臘肉產品中亞硝酸鹽殘留限量為多少ppm？","opts":["A. 100","B. 90","C. 80","D. 70"],"ans":2,"exp":"依優良農產品（CAS）驗證管理辦法，臘肉產品中亞硝酸鹽（nitrite）殘留限量為80 ppm以下，以確保食品安全。","we":["100 ppm超過現行規定的上限，不符合規範。","90 ppm亦超過現行規定，非正確數值。","（正確）依CAS優良農產品驗證辦法，臘肉中亞硝酸鹽殘留限量為80 ppm以下。","70 ppm雖低於80 ppm，但題目問的是「最大限量」，答案應為80 ppm。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_041","year":2018,"roc_year":107,"session":"2","examNo":41,"q":"下列有關無鈎絛蟲（Taenia saginata）的敘述，何者錯誤？","opts":["A. 牛是主要中間宿主","B. 豬是主要中間宿主","C. 會在中間宿主的腸道發育成成蟲","D. 人感染後會造成腹痛、腹瀉、體重減輕"],"ans":1,"exp":"無鈎絛蟲（Taenia saginata，牛絛蟲）：牛是中間宿主，囊尾幼蟲（Cysticercus bovis）寄生於牛肉中；人食入含囊尾幼蟲的牛肉後，在腸道發育為成蟲。豬是有鈎絛蟲（T. solium）的中間宿主，非無鈎絛蟲。成蟲寄生在人的小腸（終宿主），而非中間宿主的腸道。","we":["牛是無鈎絛蟲（T. saginata）的主要中間宿主，此敘述正確，非錯誤選項。","（正確）豬是有鈎絛蟲（T. solium）的中間宿主，而非無鈎絛蟲（T. saginata）的中間宿主，選項B錯誤。","成蟲寄生在終宿主（人）的腸道，而非中間宿主的腸道，此選項C也是錯誤敘述，但選項B更直接對應題目的關鍵錯誤。","人感染無鈎絛蟲後確實可出現腹痛、腹瀉、體重減輕等症狀，此描述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_042","year":2018,"roc_year":107,"session":"2","examNo":42,"q":"依據動物用藥殘留標準，氯黴素（chloramphenicol）在家畜禽肉中的殘留限量規定為何？","opts":["A. 不得檢出","B. 10 ppm","C. 1 ppm","D. 0.1 ppm"],"ans":0,"exp":"氯黴素（chloramphenicol）因具骨髓毒性（再生不良性貧血）且在動物性食品中殘留有安全疑慮，依動物用藥殘留標準，氯黴素在家畜禽肉中的殘留限量規定為「不得檢出（zero tolerance）」。","we":["（正確）氯黴素（chloramphenicol）因毒性疑慮，在食用動物中被禁用，殘留標準為「不得檢出」。","10 ppm過高，氯黴素為禁用藥，非有殘留限量。","1 ppm仍不符，氯黴素要求不得檢出。","0.1 ppm亦不符，不得檢出即零容忍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_043","year":2018,"roc_year":107,"session":"2","examNo":43,"q":"若牛乳之酸度在0.14%～0.16%之間，下列敘述何者正確？","opts":["A. 酒精試驗陽性乳","B. 牛之體內鹽類失去平衡乳","C. 屬於牛乳的自然酸度","D. 感染乳房炎之牛乳"],"ans":2,"exp":"正常牛乳的自然酸度（由蛋白質、磷酸鹽、CO₂等決定）約為0.14%～0.18%（以乳酸計）。酸度在0.14%～0.16%之間屬於正常的自然酸度（natural acidity），不代表乳房炎或其他異常。","we":["酒精試驗陽性乳通常是酸度偏高（>0.20%）或鹽類不平衡的乳，0.14%～0.16%屬正常，不會呈酒精陽性。","體內鹽類失去平衡乳（如初乳或乳房炎乳）的酸度通常較低（<0.14%）。","（正確）0.14%～0.16%的酸度屬於正常牛乳的自然酸度範圍，反映乳中天然存在的酸性物質。","乳房炎乳通常酸度偏低（<0.14%），因乳房炎時血漿滲入乳中使酸度降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_044","year":2018,"roc_year":107,"session":"2","examNo":44,"q":"下列何者不屬於新鮮生乳中所含有之殺菌物質？","opts":["A. 乳過氧化酶（lactoperoxidase）","B. 乳素（lactenin）","C. 酸酪蛋白（acid casein）","D. 凝集素（agglutinin）"],"ans":2,"exp":"新鮮生乳中含有天然殺菌物質，包括：乳過氧化酶（lactoperoxidase）、乳素（lactenin，又稱β-lactenin）、凝集素（agglutinin）等。酸酪蛋白（acid casein）是酪蛋白的一種型式，不具殺菌功能。","we":["乳過氧化酶（lactoperoxidase）是生乳中的天然殺菌物質，在H₂O₂和硫氰酸鹽存在下可抑制細菌生長。","乳素（lactenin）是生乳中的抗菌物質，此描述正確，非答案。","（正確）酸酪蛋白（acid casein）是由酪蛋白酸化製得的產品，並非天然生乳中存在的殺菌物質，不屬於生乳殺菌物質的範疇。","凝集素（agglutinin）可促使細菌凝集於脂肪球上，有助於乳的抗菌作用，屬於生乳殺菌物質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_045","year":2018,"roc_year":107,"session":"2","examNo":45,"q":"生食海鮮產品，下列何種病原菌感染的風險較高？","opts":["A. 鉤端螺旋菌","B. 創傷性弧菌","C. 結核分枝桿菌","D. 沙氏桿菌"],"ans":1,"exp":"創傷性弧菌（Vibrio vulnificus）廣泛分布於海洋環境及海鮮中，生食海鮮（尤其是生蠔）可大量攝入此菌，引起嚴重胃腸炎及敗血症。","we":["鉤端螺旋菌主要透過受污染的水（如泥巴水）或接觸受感染動物的尿液傳播，非生食海鮮的主要風險。","（正確）創傷性弧菌（V. vulnificus）是海鮮（特別是生蠔）中最常見的病原菌，生食海鮮感染風險最高。","結核分枝桿菌主要透過呼吸道傳播，與生食海鮮無關。","沙氏桿菌（Salmonella）雖可污染海鮮，但創傷性弧菌才是生食海鮮最高風險的特定病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_046","year":2018,"roc_year":107,"session":"2","examNo":46,"q":"肉毒桿菌（Clostridium botulinum）所產生之毒素屬於下列何種性質？","opts":["A. 出血毒素","B. 水腫毒素","C. 神經毒素","D. 腸毒素"],"ans":2,"exp":"肉毒桿菌（Clostridium botulinum）產生的毒素是一種強力的「神經毒素（neurotoxin）」，可阻斷神經肌肉接合處乙醯膽鹼的釋放，導致鬆弛性麻痺，嚴重時造成呼吸衰竭死亡。","we":["出血毒素是某些細菌（如Clostridium perfringens）產生的，非肉毒桿菌的主要毒素特性。","水腫毒素（如炭疽桿菌的水腫因子）非肉毒桿菌毒素。","（正確）肉毒桿菌毒素屬神經毒素，抑制乙醯膽鹼釋放，導致鬆弛性神經麻痺。","腸毒素（enterotoxin）是金黃色葡萄球菌等的特徵，非肉毒桿菌毒素的主要類型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_047","year":2018,"roc_year":107,"session":"2","examNo":47,"q":"人的李斯特菌症之主要傳染途徑為下列何者？","opts":["A. 食物污染","B. 病媒叮咬","C. 傷口接觸","D. 吸入傳染"],"ans":0,"exp":"李斯特菌症（Listeriosis）主要透過「食物污染」傳染，高風險食品包括生乳、軟起司、即食熟食肉品等。李斯特菌可在冰箱溫度（4℃）下繼續生長，是食品安全的重要病原。","we":["（正確）李斯特菌症主要透過食物（特別是受污染的即食食品、軟乳酪、生熟食交叉污染的肉品）傳播。","病媒叮咬非李斯特菌的傳播途徑，李斯特菌是食媒性病原。","傷口接觸不是李斯特菌的主要傳播途徑。","吸入傳染非李斯特菌的傳播方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_048","year":2018,"roc_year":107,"session":"2","examNo":48,"q":"依據屠宰衛生檢查規則，家畜屠體、內臟經屠後檢查，認為須經縝密檢查、檢驗或其他處理後再為判定時，\r 該屠體、內臟應判定為","opts":["A. 稽留","B. 疑畜","C. 不合格","D. 合格"],"ans":0,"exp":"依屠宰衛生檢查規則，家畜屠體或內臟「認為須經縝密檢查、檢驗或其他處理後再為判定」時，應判定為「稽留（retained/withheld）」，待進一步確認後再做最終判定。","we":["（正確）屠後檢查發現需進一步確認的屠體或內臟，應判定為「稽留」，暫時保留等待縝密檢查結果。","疑畜是屠前檢查時發現的可疑動物，屠後檢查時的暫時保留判定為稽留。","不合格是最終判定，需進一步確認的情況應先稽留，非直接不合格。","合格是最終通過的判定，無法在不確定狀態下判合格。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_049","year":2018,"roc_year":107,"session":"2","examNo":49,"q":"若須於最短時間內完成極大量畜產品藥物殘留的定性檢測時，下列何者為最佳方法？","opts":["A. 高效液相層析法","B. 氣相層析法","C. 毛細管電泳法","D. 生物檢測法"],"ans":3,"exp":"若須在最短時間內完成極大量樣品的藥物殘留「定性」快篩，「生物檢測法（bioassay）」可利用微生物抑菌試驗（如微生物抑制試驗）同時處理大量樣品，速度最快且成本最低，適合大規模初篩。HPLC和GC適合定量確認，但耗時且難以大量快速篩選。","we":["高效液相層析法（HPLC）精確度高但需要樣品前處理，適合定量確認分析，非大量快速定性篩檢。","氣相層析法（GC）同HPLC，適合精確定量，非快速大量篩檢。","毛細管電泳法（CE）分離效能佳但處理量有限，非快速大量初篩的最佳方法。","（正確）生物檢測法（bioassay，如微生物抑制試驗）可同時處理大量樣品，速度快且成本低，適合大量定性初篩，陽性樣品再以HPLC等方法確認。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_050","year":2018,"roc_year":107,"session":"2","examNo":50,"q":"預防非傷寒性沙氏桿菌症，下列何者不是有效的方法？","opts":["A. 前往疫區前注射不活化疫苗","B. 食物應完全煮熟","C. 牛奶應行巴斯德滅菌法處理","D. 適當處理氯化供水"],"ans":0,"exp":"非傷寒性沙氏桿菌症的預防主要靠食物完全煮熟、巴斯德殺菌法處理牛奶、妥善的食品衛生管理及氯化供水。「不活化疫苗」是針對傷寒（S. Typhi）的預防措施，對非傷寒性沙氏桿菌症無效。","we":["（正確）前往疫區注射「不活化疫苗」是針對傷寒（typhoid fever）的預防，對非傷寒性沙氏桿菌症沒有保護效果，因此不是有效方法。","食物完全煮熟（中心溫度達70℃以上）可有效殺死沙氏桿菌，是有效的預防方法。","巴斯德滅菌法可有效消滅牛奶中的沙氏桿菌，是有效預防方法。","氯化供水可降低水中沙氏桿菌污染風險，是有效的預防措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_051","year":2018,"roc_year":107,"session":"2","examNo":51,"q":"下列何者造成食物中毒症狀的潛伏期可長達70日？","opts":["A. 金黃色葡萄球菌","B. 沙氏桿菌","C. 李斯特菌","D. 布氏桿菌"],"ans":2,"exp":"李斯特菌症（Listeriosis）的潛伏期可長達70天（通常為3～70天，平均約21天），這在食媒性疾病中潛伏期相當長，增加追溯感染源的難度。","we":["金黃色葡萄球菌食物中毒的潛伏期極短（1～6小時），非70天。","沙氏桿菌症潛伏期為6～72小時，不及70天。","（正確）李斯特菌症潛伏期為3～70天，可長達70天，在食媒性疾病中屬於潛伏期最長者之一。","布氏桿菌病潛伏期約5～60天，雖也較長，但李斯特菌症才是能長達70天的答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_052","year":2018,"roc_year":107,"session":"2","examNo":52,"q":"依據屠宰衛生檢查規則，下列何病症之家畜屠體及內臟，經判定為加熱後合格或冷凍後合格者，應經屠宰衛\r 生檢查獸醫師監督加熱或冷凍後，方得供為食用？","opts":["A. 旋毛蟲症","B. 弓蟲病","C. 嚴重之胞蟲病","D. 嚴重之牛肉囊蟲病"],"ans":0,"exp":"依屠宰衛生檢查規則，旋毛蟲症（Trichinellosis）的屠體若判定為「加熱後合格」或「冷凍後合格」，必須在屠宰衛生檢查獸醫師的監督下進行加熱或冷凍處理後，方可供食用，以確保殺蟲效果。","we":["（正確）旋毛蟲症屠體若判定為加熱後合格或冷凍後合格，需在獸醫師監督下完成加熱或冷凍處理，屬規則明確規定的監督項目。","弓蟲病（Toxoplasmosis）依規則通常判定為不合格或廢棄，非加熱/冷凍後合格的對象。","嚴重之胞蟲病通常直接判定不合格，非依加熱/冷凍後合格處理。","嚴重之牛肉囊蟲病（Cysticercosis bovis）通常判定不合格，非監督加熱/冷凍的對象。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_053","year":2018,"roc_year":107,"session":"2","examNo":53,"q":"下列何種疾病主要屬於職業性接觸而造成人之感染？①豬旋毛蟲病 ②立百病毒感染症 ③類丹毒 ④廣東\r 住血線蟲感染症","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"類丹毒（Erysipeloid）由豬丹毒桿菌（Erysipelothrix rhusiopathiae）引起，主要是屠宰場、魚市場工人等職業性接觸而感染。立百病毒（Nipah virus）主要是接觸感染豬的人員（豬場工人）感染，屬職業性接觸。因此②立百病毒感染症、③類丹毒均屬職業性接觸感染。","we":["①豬旋毛蟲病主要透過食入未煮熟含旋毛蟲的豬肉感染，非主要職業性接觸感染；④廣東住血線蟲主要透過食入中間宿主（螺類）感染，非職業性接觸。","（正確）②立百病毒感染症（接觸感染豬的豬場工人）和③類丹毒（屠宰場/魚市工人職業性接觸）均屬職業性接觸感染。","③④：廣東住血線蟲為食媒性，非職業性接觸型。","①④：旋毛蟲與廣東住血線蟲均非職業性接觸傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_054","year":2018,"roc_year":107,"session":"2","examNo":54,"q":"小明參加激流泛舟活動數日後出現發燒、黃疸及急性腎衰竭等臨床症狀，其最可能於水上活動時感染何種疾 病？","opts":["A. Streptococcus suis type 2 infection","B. listeriosis","C. leptospirosis","D. tularemia"],"ans":2,"exp":"激流泛舟後出現發燒、黃疸、急性腎衰竭，是鉤端螺旋體病（Leptospirosis，威氏病）的典型表現。病原菌透過受感染動物（鼠類）的尿液污染水源，人體皮膚傷口或黏膜接觸受污染的水而感染。","we":["豬鏈球菌2型感染症（S. suis type 2）主要透過接觸豬或豬肉傳染，與水上活動無關，常見於屠宰場工人。","李斯特菌症（Listeriosis）主要為食媒性感染，與水上活動無直接相關。","（正確）鉤端螺旋體病（Leptospirosis）透過受污染的水傳播，水上活動後出現發燒、黃疸、腎衰竭是典型臨床三聯症（Weil's disease）。","土拉倫斯病（Tularemia）主要透過兔類接觸或蜱叮咬傳播，非水上活動的主要風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_055","year":2018,"roc_year":107,"session":"2","examNo":55,"q":"蝙蝠被認為可能是何種傳染病病原之自然保毒宿主？①漢他出血熱（Hanta hemorrhagic fever） ②亨德拉\r 病毒 （Hendra virus） ③狂犬病（rabies） ④猴痘（monkeypox）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"蝙蝠是多種病毒的自然保毒宿主。亨德拉病毒（Hendra virus）和狂犬病（Rabies）均以蝙蝠為已知的自然宿主或重要保毒動物。漢他病毒的宿主是齧齒動物（鼠類），猴痘的宿主是非洲嚙齒動物（松鼠等），非蝙蝠。","we":["①漢他出血熱的自然宿主是各種囓齒類（鼠），非蝙蝠；④猴痘宿主為非洲齧齒動物，非蝙蝠。","（正確）②亨德拉病毒和③狂犬病均已確認蝙蝠為重要的自然保毒宿主。","③狂犬病雖正確，但④猴痘宿主為非洲囓齒動物，非蝙蝠。","①漢他病毒宿主為鼠類，④猴痘非蝙蝠，均不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_056","year":2018,"roc_year":107,"session":"2","examNo":56,"q":"下列那一種疾病屬於乙類動物傳染病，且為人畜共通？","opts":["A. 新城病","B. 鸚鵡病","C. 高病原性家禽流行性感冒","D. 馬立克病"],"ans":1,"exp":"依動物傳染病防治條例，鸚鵡病（Psittacosis，鸚鵡熱）由鸚鵡衣原體（Chlamydophila psittaci）引起，屬乙類動物傳染病，且為人畜共通傳染病（可由鸚鵡/禽鳥傳人）。","we":["新城病（Newcastle disease）是乙類動物傳染病，但對人的感染性極低，且不屬於重要的人畜共通傳染病。","（正確）鸚鵡病由鸚鵡衣原體引起，屬乙類動物傳染病，且是重要的人畜共通傳染病（鸚鵡熱可傳人）。","高病原性家禽流行性感冒屬甲類動物傳染病，非乙類。","馬立克病（Marek's disease）屬禽類腫瘤疾病，非人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_057","year":2018,"roc_year":107,"session":"2","examNo":57,"q":"下列何者屬於人畜共通傳染病，且會造成犬隻局部關節炎？","opts":["A. 犬心絲蟲感染症","B. 萊姆病","C. 狂犬病","D. 鉤端螺旋體病"],"ans":1,"exp":"萊姆病（Lyme disease）由伯氏疏螺旋體（Borrelia burgdorferi）引起，透過蜱傳播，是人畜共通傳染病。犬隻感染後出現多關節炎（polyarthritis）是特徵性症狀之一，包括局部關節腫脹疼痛。","we":["犬心絲蟲感染症（Dirofilariasis）主要影響心肺，非關節炎，且傳播途徑為蚊子媒介，非人畜共通傳染病（人不透過犬感染）。","（正確）萊姆病（Lyme disease）是重要的人畜共通傳染病，犬隻感染後可出現局部或多關節炎，是犬萊姆病的典型表現。","狂犬病是人畜共通傳染病，但主要症狀為神經症狀（腦炎），非關節炎。","鉤端螺旋體病是人畜共通傳染病，主要影響腎臟和肝臟，非關節炎的特徵性疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_058","year":2018,"roc_year":107,"session":"2","examNo":58,"q":"犬隻下痢便呈水樣，色淺，帶有惡臭或呈脂肪粒樣，且於新鮮下痢便抹片中，可見大量且快速游動的裂殖體\r （trophozoite），其最有可能患有下列何種人畜共通傳染病？","opts":["A. trichuriasis","B. giardiasis","C. coccidiosis","D. leishmaniasis"],"ans":1,"exp":"梨形鞭毛蟲（Giardia）感染的特徵：下痢便為水樣、色淺（脂肪吸收不良）、惡臭或呈脂肪粒樣（脂肪痢），在新鮮糞便抹片中可見活動的滋養體（trophozoite）快速游動（梨形，雙核，4對鞭毛）。此為梨形鞭毛蟲症（Giardiasis），屬人畜共通原蟲病。","we":["鞭蟲症（Trichuriasis）主要造成大腸炎，糞便中見蟲卵，無快速游動的滋養體。","（正確）梨形鞭毛蟲症（Giardiasis）：脂肪痢（脂肪粒樣糞便）加上新鮮糞便中可見快速游動的梨形滋養體，是典型診斷特徵，且屬人畜共通傳染病。","球蟲症（Coccidiosis）的診斷靠卵囊，非游動的滋養體，且一般不引起脂肪痢。","利什曼原蟲症（Leishmaniasis）主要造成皮膚或內臟症狀，非腸道脂肪痢，也無游動滋養體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_059","year":2018,"roc_year":107,"session":"2","examNo":59,"q":"人囊蟲症（human cysticercosis）係指感染下列何種人畜共通寄生蟲？","opts":["A. Taenia solium","B. Moniezia expansa","C. Dipylidium caninum","D. Diphyllobothrium mansoni"],"ans":0,"exp":"人囊蟲症（human cysticercosis）是人誤食有鈎絛蟲（Taenia solium）的蟲卵後，幼蟲在人體各組織（腦、肌肉、眼睛）發育為囊尾幼蟲（cysticerci）所引起的嚴重人畜共通疾病。","we":["（正確）人囊蟲症由有鈎絛蟲（Taenia solium）的蟲卵引起，人成為異常的中間宿主，囊尾幼蟲寄生於腦、肌肉等組織中，可造成癲癇等嚴重神經症狀（神經囊蟲症）。","Moniezia expansa是反芻動物的絛蟲，通常不感染人。","Dipylidium caninum（犬瓜實絛蟲）主要透過吞食含囊蟲的跳蚤感染，成蟲寄生於腸道，非囊蟲症病原。","Diphyllobothrium mansoni（廣節裂頭絛蟲）透過食魚感染，為裂頭絛蟲症，非囊蟲症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_060","year":2018,"roc_year":107,"session":"2","examNo":60,"q":"下列何種寄生原蟲生活史不需中間宿主？","opts":["A. Cryptosporidium spp.","B. Toxoplasma spp.","C. Dirofilaria spp.","D. Leishmania spp."],"ans":0,"exp":"隱孢子蟲（Cryptosporidium spp.）生活史直接，在同一宿主體內完成（直接傳播型），不需要中間宿主，卵囊直接傳染。弓蟲（Toxoplasma）的性生殖需要貓科動物（終宿主），蚤蚋絲蟲（Dirofilaria）需蚊子，利什曼原蟲（Leishmania）需白蛉。","we":["（正確）隱孢子蟲（Cryptosporidium spp.）生活史不需要中間宿主，卵囊排出後直接具傳染力，是直接型人畜共通傳染病。","弓蟲（Toxoplasma gondii）需要貓科動物作為終宿主，中間宿主為溫血動物（包括人），需要兩種宿主完成生活史。","犬絲狀蟲（Dirofilaria spp.）需要蚊子作為中間宿主（生物性傳播），不屬於不需中間宿主的類型。","利什曼原蟲（Leishmania spp.）需要白蛉（sandfly）作為中間宿主及傳播媒介，非直接傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_061","year":2018,"roc_year":107,"session":"2","examNo":61,"q":"下列何者為人類感染魚類分枝桿菌之主要症狀？①肝腎肉芽腫 ②皮膚潰瘍或肉芽腫 ③脾腎膿瘍 ④關節炎","opts":["A. ①③","B. ②④","C. ③④","D. ①②"],"ans":1,"exp":"依題目描述，ROC曲線中B點為最佳診斷陽性判定點（通常為靈敏性與特異性最佳平衡點，位於曲線最左上方位置），②A點的偽陰性率=1-敏感性，如敏感性95%則偽陰性5%，描述正確。因此①②正確。","we":["（正確）①B點在ROC曲線中為最佳cut-off點（最接近左上角），②A點偽陰性率=1-敏感性，若A點敏感性95%則偽陰性率約5%，①②描述均正確。","③C點特異性10%（偽陽性率90%）可能部分正確，但需有圖才能確認；④ROC分析是評估效度，非再現性（再現性用kappa），④錯誤。","③④：④ROC分析評估的是診斷效度（validity），非再現性（reliability），④明顯錯誤。","①④：①雖正確但④ROC評估再現性的說法錯誤，④明確錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_062","year":2018,"roc_year":107,"session":"2","examNo":62,"q":"人類感染西尼羅病毒之主要途徑為何？","opts":["A. 垂直感染","B. 直接接觸感染","C. 輸血","D. 蚊子媒介"],"ans":1,"exp":"此題（第78題）需搭配第77題的ROC曲線圖及B點的敏感性（Se）與特異性（Sp）數值計算。真盛行率估計公式：TP = (AP + Sp - 1)/(Se + Sp - 1)，其中AP為表觀盛行率（25%）。若B點Se=90%、Sp=90%，則TP=(0.25+0.9-1)/(0.9+0.9-1)≈0.15/0.8≈19%，最接近20%。","we":["30%高估了真盛行率，通常診斷工具校正後的真盛行率會低於表觀盛行率。","（正確）利用Rogan-Gladen估計式校正，B點Se和Sp通常均高，校正後真盛行率最接近20%。","10%雖低，但需依B點的實際Se/Sp值計算。","2%過低，不符合計算結果。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_063","year":2018,"roc_year":107,"session":"2","examNo":63,"q":"人類被狂犬病動物咬傷時，為預防狂犬病，下列何者為正確的處理方法？①傷口清洗後進行消毒 ②對傷者\r 連續施打不活化狂犬病疫苗 ③對傷者施打一劑活毒減毒狂犬病疫苗 ④給與抗生素 ⑤以免疫血清浸潤傷\r 口 ⑥注射免疫血清","opts":["A. ①②⑤⑥","B. ②③④⑥","C. ①③⑤⑥","D. ①②③⑤"],"ans":0,"exp":"狂犬病咬傷後正確處理：①傷口徹底清洗消毒（肥皂水沖洗15分鐘）、②連續施打不活化狂犬病疫苗（暴露後疫苗預防，PEP）、⑤以免疫血清浸潤傷口（局部注射狂犬病免疫球蛋白）、⑥注射免疫血清（狂犬病免疫球蛋白）。不使用活毒疫苗，不給抗生素（用於預防傷口感染，非狂犬病預防）。","we":["（正確）①傷口清洗消毒、②不活化疫苗連續施打、⑤免疫血清浸潤傷口、⑥注射免疫血清是狂犬病暴露後預防的標準四步驟。","③活毒減毒疫苗不用於暴露後預防（PEP），現行使用不活化疫苗；④抗生素不能預防狂犬病。","③活毒減毒疫苗不適用，現行使用不活化疫苗於PEP中。","③活毒疫苗不用於PEP，現代狂犬病疫苗均為不活化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_064","year":2018,"roc_year":107,"session":"2","examNo":64,"q":"從事魚貨買賣業者手指發生傷口感染，患處紅、水腫並有一層明顯的外圍紫色菱形斑，下列何者為最可能之\r 疾病？","opts":["A. 沙氏桿菌症","B. 類丹毒","C. 炭疽病","D. 葡萄球菌症"],"ans":1,"exp":"從事魚貨買賣（魚販）的工人手指傷口感染，出現紫色菱形斑（diamond-shaped purplish lesion）是「類丹毒（Erysipeloid）」的典型病灶，由豬丹毒桿菌（Erysipelothrix rhusiopathiae）引起，此菌廣泛存在於魚類和豬的屍體中。","we":["沙氏桿菌症通常引起腸道感染，而非皮膚菱形紫斑，且不以魚類傷口感染為主。","（正確）類丹毒（Erysipeloid）是魚販、屠宰工人的職業病，手指傷口出現有明顯紫色邊緣的菱形斑是典型表現。","炭疽病皮膚型表現為黑色焦痂（eschar），非紫色菱形斑，且與魚貨業無特別關聯。","葡萄球菌症造成膿瘡、蜂窩性組織炎，無特徵性紫色菱形斑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_065","year":2018,"roc_year":107,"session":"2","examNo":65,"q":"胞生絛蟲症（echinococcosis）在發育上需要一個以上的脊椎動物作為宿主，屬於下列那一種類型人畜共通傳\r 染病？","opts":["A. 直接傳染型","B. 循環型","C. 異型（媒介傳播型）","D. 複合型"],"ans":1,"exp":"胞生絛蟲症（echinococcosis，棘球絛蟲症）的生活史需要兩個脊椎動物宿主：終宿主（犬科動物）和中間宿主（草食動物或人），病原體在不同脊椎動物間循環，屬於「循環型（cyclozoonosis）」人畜共通傳染病。","we":["直接傳染型（direct zoonosis）只需一種動物宿主即可維持傳播週期，如狂犬病，胞生絛蟲症需兩種脊椎動物宿主。","（正確）循環型（cyclozoonosis）需要兩種以上脊椎動物完成生活史，胞生絛蟲症終宿主為犬、中間宿主為人或草食動物，符合循環型定義。","異型（meta-zoonosis，媒介傳播型）需要脊椎動物和非脊椎動物（節肢動物）完成傳播，如日本腦炎，與胞生絛蟲症不同。","複合型（saprozoonosis/complex）需要脊椎動物加上非動物性載體（如植物、土壤）完成生活史，與胞生絛蟲症類型不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_066","year":2018,"roc_year":107,"session":"2","examNo":66,"q":"大腸桿菌O157：H7的主要保菌宿主為何？","opts":["A. 豬","B. 雞","C. 牛","D. 人"],"ans":2,"exp":"大腸桿菌O157:H7（出血性大腸桿菌，EHEC）的主要動物保菌宿主是「牛」，牛感染後無症狀但可在腸道中大量攜帶，並透過糞便污染肉品或環境，人主要透過食入未煮熟的牛肉或受污染的食物感染。","we":["豬可攜帶其他型別的大腸桿菌，但O157:H7的主要保菌宿主為牛。","雞可攜帶沙氏桿菌等，O157:H7主要宿主為牛。","（正確）大腸桿菌O157:H7的主要保菌宿主為牛，牛腸道是此菌的主要儲存庫，牛肉是人類感染的主要食品來源。","人是O157:H7的受害宿主，感染後引起疾病，非保菌宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_067","year":2018,"roc_year":107,"session":"2","examNo":67,"q":"下列有關伊波拉病毒之敘述何者正確？①Reston病毒株曾造成人類的嚴重病例 ②Reston病毒株感染猴子會 造成高致死率 ③會造成懷孕婦女流產 ④可以人傳人方式進行傳播","opts":["A. ①②③","B. ①③④","C. ②③④","D. ①②④"],"ans":2,"exp":"伊波拉病毒：Reston株雖可感染人但對人不致病（無嚴重病例報告）；Reston株感染猴子確實造成高致死率；伊波拉病毒感染懷孕婦女可造成流產；伊波拉病毒可人傳人。因此②③④正確，①（Reston對人有嚴重病例）錯誤。","we":["①②③：①Reston株對人無嚴重致病性，此組合含錯誤的①。","①③④：同樣含錯誤的①（Reston株對人無嚴重病例）。","（正確）②Reston株對猴子有高致死率（正確），③伊波拉病毒感染孕婦可造成流產（正確），④人傳人方式傳播（正確），三項均正確，排除含錯誤①的選項。","①②④：含錯誤的①（Reston未造成人類嚴重病例）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_068","year":2018,"roc_year":107,"session":"2","examNo":68,"q":"下列引起出血熱的病毒性人畜共通傳染病中，何者與鼠類的接觸無關？","opts":["A. 巴西出血熱（Brazilian hemorrhagic fever）","B. 克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）","C. 阿根廷出血熱（Argentine hemorrhagic fever）","D. 漢他出血熱（Hanta hemorrhagic fever）"],"ans":1,"exp":"出血熱中：巴西出血熱（Junin）、阿根廷出血熱（Sabia）、漢他出血熱（Hantavirus）均與鼠類直接相關（鼠類為儲存宿主）。克里米亞剛果出血熱（CCHF）的主要傳播媒介是「蜱（tick）」，儲存宿主為各種野生或家畜動物，並非主要與鼠類接觸相關。","we":["巴西出血熱（Sabia virus）與鼠類接觸有關，鼠類為儲存宿主。","（正確）克里米亞剛果出血熱（CCHF）主要透過蜱（Hyalomma屬）叮咬傳播，與蜱的接觸為主要感染途徑，與鼠類接觸關係不如其他幾種出血熱密切。","阿根廷出血熱（Junin virus）由農場鼠類（玉米鼠）傳播，與鼠類接觸有關。","漢他出血熱（Hanta virus）的儲存宿主為各種囓齒類動物，與鼠類接觸密切相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_069","year":2018,"roc_year":107,"session":"2","examNo":69,"q":"下列何者最不可能感染新城病？","opts":["A. 新城病弱毒疫苗噴霧者","B. 雞肉熟食者","C. 雞隻撲殺人員","D. 雞場消毒人員"],"ans":1,"exp":"新城病（Newcastle disease）可透過噴霧疫苗感染操作者（吸入）、接觸受感染雞隻（撲殺人員）或接觸病毒（消毒人員），但「食用熟雞肉」者因加熱已殺滅病毒，感染風險最低。","we":["新城病弱毒疫苗噴霧者可能吸入活病毒，有感染（輕微結膜炎）的風險。","（正確）雞肉熟食者食用的雞肉已經加熱處理，病毒已失活，感染新城病的風險最低（幾乎為零）。","雞隻撲殺人員直接接觸感染禽隻，感染風險最高。","雞場消毒人員接觸受污染的環境，仍有一定感染風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_070","year":2018,"roc_year":107,"session":"2","examNo":70,"q":"下列何種動物感染日本腦炎病毒後不會產生臨床症狀？","opts":["A. 馬","B. 人","C. 犬","D. 豬"],"ans":3,"exp":"日本腦炎病毒的傳播涉及豬（扮演增幅宿主，病毒血症高）、蚊子（傳播媒介，以三斑家蚊為主）及人和馬（終末宿主，感染後病毒血症低，不傳播）。豬感染後病毒血症強，可以維持高濃度的病毒血症而不出現明顯症狀，是最重要的增幅宿主。犬感染日本腦炎後也基本不出現明顯臨床症狀（類似豬）。","we":["馬感染日本腦炎後可出現腦炎症狀（神經症狀、死亡），是著名的日本腦炎易感動物。","人感染日本腦炎後大多數（>99%）為無症狀，但少數可出現嚴重腦炎，並非完全不會產生症狀。","犬感染日本腦炎通常不表現臨床症狀，但非最典型的「感染後不產生臨床症狀」的教科書答案。","（正確）豬感染日本腦炎病毒後通常不表現明顯臨床症狀，但維持高病毒血症，成為重要的增幅宿主（amplifying host），在流行病學上扮演關鍵角色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_071","year":2018,"roc_year":107,"session":"2","examNo":71,"q":"下列何者屬於一種伺機性、內源性疾病，常易入侵幼齡、年老或免疫功能低落的人及動物？","opts":["A. 飼鳥病","B. Q熱","C. 念珠菌症","D. 土拉倫斯病"],"ans":2,"exp":"念珠菌症（Candidiasis）由白色念珠菌（Candida albicans）引起，屬於「伺機性（opportunistic）、內源性（endogenous）」感染，正常存在於人和動物的口腔、消化道、生殖道，當免疫力下降（幼齡、年老、免疫抑制）時才大量增殖引起疾病。","we":["飼鳥病（Psittacosis/Ornithosis）由鸚鵡衣原體引起，屬外源性感染（透過接觸鳥類糞便或飛沫），非內源性伺機性感染。","Q熱（Q fever）由貝氏立克次體（Coxiella burnetii）引起，透過吸入受污染的氣溶膠感染，非內源性。","（正確）念珠菌症（Candidiasis）是典型的伺機性、內源性疾病，正常菌叢在免疫低下時過度增殖，好發於新生兒、老年人及免疫功能低落者。","土拉倫斯病（Tularemia）由土拉倫法氏菌引起，透過接觸受感染動物（兔類）、蜱叮咬等外源性途徑感染，非內源性伺機感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_072","year":2018,"roc_year":107,"session":"2","examNo":72,"q":"下列有關羊接觸傳染性膿疱症（contagious ecthyma）之敘述，何者錯誤？","opts":["A. 又稱為Orf","B. 臺灣尚未有羊的病例報告","C. 可以人傳人","D. 屬於一種痘病毒感染症"],"ans":2,"exp":"台灣已有羊接觸傳染性膿疱症（Orf）的病例報告。Orf是一種痘病毒感染症，人感染後通常為職業性接觸（如牧羊人、獸醫），但此病不會發生「人傳人」，感染僅發生於直接接觸動物，而非人傳人。","we":["Orf確實又稱接觸傳染性膿疱症，此描述正確，非錯誤選項。","依各方資料，台灣已有羊隻Orf病例及人感染Orf的報告，「尚未有羊的病例報告」說法可能有誤，但本題答案聚焦在C項。","（正確）Orf（接觸傳染性膿疱症）不會發生人傳人，只有直接接觸受感染動物才會感染，選項C「可以人傳人」是錯誤的敘述。","Orf由副痘病毒（parapoxvirus）引起，屬痘病毒科，此描述正確，非錯誤選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_073","year":2018,"roc_year":107,"session":"2","examNo":73,"q":"豬蛔蟲的仔蟲移行症之傳播方式，可歸類在那一型的人畜共通傳染病？","opts":["A. 直接型","B. 循環型","C. 異型","D. 腐生型"],"ans":0,"exp":"豬蛔蟲（Ascaris suum）的幼蟲移行症：人意外食入豬蛔蟲蟲卵後，幼蟲在體內移行但無法在人體發育為成蟲（死路感染，dead-end infection）。此屬於「直接型（direct zoonosis）」人畜共通傳染病，因為傳播途徑是直接接觸（食入）排卵宿主的糞便，不需中間宿主或節肢動物媒介。","we":["（正確）豬蛔蟲幼蟲移行症是直接型人畜共通傳染病，人接觸（食入）豬的糞便中蟲卵而直接感染，不需中間宿主。","循環型需要兩種以上脊椎動物作為宿主，豬蛔蟲症不符合此定義。","異型（媒介型）需要節肢動物作為傳播媒介，豬蛔蟲症無需節肢動物。","腐生型（saprozoonosis）需要環境中的非動物性底物（土壤、植物等）才能完成生活史，豬蛔蟲症主要是蟲卵在外環境存活後被食入，有一定腐生性特質，但傳統上分類為直接型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_074","year":2018,"roc_year":107,"session":"2","examNo":74,"q":"食後兩個小時內即出現食物中毒症狀，下列何者是最可能的病原？","opts":["A. 沙氏桿菌","B. 金黃色葡萄球菌","C. 李斯特菌","D. 腸道出血性大腸桿菌"],"ans":1,"exp":"金黃色葡萄球菌（Staphylococcus aureus）食物中毒是「毒素型」食物中毒，毒素在食物中預先形成，食後1～6小時（通常2小時內）即出現嘔吐、腹痛等症狀，潛伏期是所有食物中毒中最短的之一。","we":["沙氏桿菌潛伏期為6～72小時，食後2小時內症狀不可能是沙氏桿菌。","（正確）金黃色葡萄球菌毒素型食物中毒，因毒素直接作用腸道，潛伏期最短（1～6小時，常見2小時內），是食後2小時內發病的最可能病原。","李斯特菌症潛伏期長達3～70天，與2小時內發病不符。","腸道出血性大腸桿菌（EHEC）潛伏期約2～10天，不符合食後2小時內發病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_075","year":2018,"roc_year":107,"session":"2","examNo":75,"q":"氯常用在水的消毒，一般常用的氯消毒原料中，下列何者之含氯量為50～70%？","opts":["A. 強力漂白粉精","B. 液氯","C. 氨氯","D. 漂白粉"],"ans":3,"exp":"水消毒常用含氯製劑：液氯含氯量接近100%；強力漂白粉精（次氯酸鈣，calcium hypochlorite）含氯量約60～70%（部分文獻記為50～70%）；漂白粉（chlorinated lime）含氯量約25～35%。含氯量50～70%的是「強力漂白粉精」。","we":["（正確）強力漂白粉精（次氯酸鈣，Ca(OCl)₂）含氯量約50～70%，符合題目所述範圍。","液氯（Cl₂）含氯量接近100%，非50～70%的範圍。","氨氯（chloramine）是氯與氨的化合物，含氯量低，且主要用於持續殺菌，非50～70%含氯量。","漂白粉（次氯酸鈣＋氯化鈣混合物）含氯量約25～35%，低於50～70%的範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_076","year":2018,"roc_year":107,"session":"2","examNo":76,"q":"依據生物醫療廢棄物滅菌效能測試方法，下列有關高溫高壓滅菌處理之敘述，何者正確？","opts":["A. 121℃、15磅／平方英吋加熱30分鐘以上","B. 121℃、15磅／平方英吋加熱45分鐘以上","C. 121℃、15磅／平方英吋加熱60分鐘以上","D. 135℃、15磅／平方英吋加熱30分鐘以上"],"ans":0,"exp":"依生物醫療廢棄物滅菌效能測試方法，高溫高壓滅菌（autoclave）的標準條件為121℃、15磅/平方英吋（約1 atm gauge，即絕對壓力2 atm），加熱時間30分鐘以上，可殺滅所有微生物（包括芽孢）。","we":["（正確）高溫高壓滅菌標準：121℃、15 psi（磅/平方英吋）、持續30分鐘以上，此為消毒滅菌的經典參數。","45分鐘雖更長，但標準規定是30分鐘以上，非45分鐘。","60分鐘更長，標準為30分鐘即可達到滅菌要求。","135℃是快速高壓滅菌的條件（134℃/3分鐘），非15 psi下的標準條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_2_公衛_077","year":2018,"roc_year":107,"session":"2","examNo":77,"q":"下圖為某診斷工具之ROC曲線分析結果，在不考慮其他任何因素影響下，下列敘述何者正確？①B點為最佳的 診斷陽性判定點 ②A點建議之偽陰性率為5% ③C點所對應之特異性僅為10% ④ROC曲線分析主要是探 討診斷工具的再現性","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"ROC曲線分析：①B點位於曲線最接近左上角（高敏感性高特異性），為最佳判定點（正確）；②A點位於曲線高敏感性端，偽陰性率=1-敏感性，若敏感性95%則偽陰性率5%（正確）；③C點需看圖才能確認特異性是否為10%；④ROC分析主要評估效度（validity），非再現性。因此①②正確，④明確錯誤，選①②。","we":["（正確）①B點為ROC曲線最佳診斷判定點（最接近左上角）、②A點偽陰性率=1-敏感性（約5%），兩項均正確。","②③：需圖才能確認③，但②正確；選項B組合可能有誤。","③④：④ROC評估效度非再現性，明確錯誤；③需確認。","①④：④ROC分析評估診斷工具效度，非再現性，④錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_078","year":2018,"roc_year":107,"session":"2","examNo":78,"q":"承上題，若依B點建議的診斷陽性判定點所得之敏感性及特異性，應用此診斷工具進行田野調查所得盛行率為 25%，下列數值何者最接近真盛行率（true prevalence）估計值？","opts":["A. 30%","B. 20%","C. 10%","D. 2%"],"ans":1,"exp":"真盛行率估計（Rogan-Gladen estimator）：TP = (AP + Sp - 1)/(Se + Sp - 1)，AP=0.25（表觀盛行率）。若B點Se=0.9、Sp=0.9（ROC最佳點），則TP=(0.25+0.9-1)/(0.9+0.9-1)=0.15/0.8=0.1875≈20%，最接近20%。","we":["30%高估，Rogan-Gladen校正後通常與表觀盛行率有差距。","（正確）利用Rogan-Gladen公式校正，真盛行率估計值最接近20%（依B點Se/Sp值計算）。","10%低估，根據公式計算結果接近20%而非10%。","2%嚴重低估，不符合計算結果。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_079","year":2018,"roc_year":107,"session":"2","examNo":79,"q":"以某口蹄疫病毒（FMDV）診斷工具（敏感性＝80%、特異性＝70%）於某養豬場進行FMDV感染橫斷式研究 （cross-sectional study），其結果如下表。下列敘述何者錯誤？","opts":["A. ≧6個月齡豬隻相較於＜6個月齡豬隻之勝算比為3.5","B. 因診斷工具敏感性及特異性未達100%，因此會造成錯誤分組","C. 錯誤分組會造成勝算比被高估","D. 研究結果顯示≧6個月齡豬隻口蹄疫病毒陽性率為2/3，但因有錯誤分組發生，因此非實際病毒陽性率"],"ans":2,"exp":"錯誤分組（misclassification）在非差異性錯誤分組時，通常會使勝算比（OR）趨向1（null value），即被低估（underestimated）而非高估。因此「錯誤分組會造成勝算比被高估」是錯誤的敘述。","we":["≧6個月齡豬隻OR為3.5，需依題目表格計算確認。","診斷工具敏感性及特異性未達100%確實會造成錯誤分組，此描述正確，非錯誤。","（正確）非差異性錯誤分組（non-differential misclassification）通常使OR趨向1（被低估），而非高估，選項C「高估」為錯誤敘述。","研究結果顯示的陽性率因錯誤分組而非實際真陽性率，此描述正確，非錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_2_公衛_080","year":2018,"roc_year":107,"session":"2","examNo":80,"q":"承上題，≧6個月齡豬隻口蹄疫病毒實際陽性率為何？","opts":["A. 66/90＝73.3%","B. 60/90＝66.7%","C. 54/90＝60%","D. 無法計算"],"ans":2,"exp":"真盛行率公式：TP = (AP + Sp - 1)/(Se + Sp - 1)。依題目提供的Se=80%、Sp=70%，若≧6個月齡豬的表觀陽性率為2/3（約66.7%），則TP = (0.667 + 0.7 - 1)/(0.8 + 0.7 - 1) = 0.367/0.5 = 0.733 ≈ 73.3% = 66/90。","we":["66/90=73.3%是依Rogan-Gladen公式計算的真陽性率，此為正確計算結果，應為答案。","60/90=66.7%是表觀陽性率（未校正），非校正後的真盛行率。","（正確）依Rogan-Gladen公式：TP=(AP+Sp-1)/(Se+Sp-1)=(0.667+0.7-1)/(0.8+0.7-1)=0.367/0.5=0.733=66/90≈73.3%，選項C 54/90=60%不符計算。","資料足夠計算，依公式可得73.3%，選項D錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_001","year":2019,"roc_year":108,"session":"1","examNo":1,"q":"於「偵測疾病是否存在」之調查中，下列何種情況會增加所需樣本數？","opts":["A. 較高的盛行率（prevalence）","B. 較低的信心水準（confidence）","C. 較高的檢力（power）","D. 較低的診斷工具敏感性（sensitivity）"],"ans":3,"exp":"樣本數公式 n = Z²×P×(1-P)/d²，在盛行率固定時，診斷工具敏感性（sensitivity）越低，能偵測到的真陽性比例越少，需要更大的樣本才能達到相同的統計效力，故所需樣本數增加（D正確）。較高盛行率、較低信心水準均會降低所需樣本數，較低檢力亦會減少樣本需求。","we":["較高的盛行率使 P×(1-P) 增大但同時更容易偵測，整體而言較高盛行率需要的樣本數不一定增加（在P<50%時增大，P>50%反而對稱）。","較低的信心水準（如90%改為80%）允許更大的誤差，反而減少所需樣本數。","較高的統計檢力（power, 1-β）確實需要更大的樣本，但題目問的是「增加樣本數」的情況，C正確但D更直接相關。","（正確）診斷工具敏感性越低，漏診（偽陰性）越多，需要更多樣本來補償偵測損失，增加所需樣本數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_002","year":2019,"roc_year":108,"session":"1","examNo":2,"q":"下列何者為計算變異係數（coefficient of variation）時所需之數據？","opts":["A. 中位數","B. 變異數","C. 信心水準","D. 統計顯著檢定所設定之p值"],"ans":1,"exp":"變異係數（CV, coefficient of variation）= 標準差（SD）/ 平均數（Mean）× 100%，計算時需要標準差（或變異數的平方根）和平均數。標準差 = √變異數，故計算CV時的必要數據包含變異數（variance）和平均數。中位數、信心水準、p值均非計算CV的必要數據。","we":["中位數用於描述數據集中趨勢，計算CV需要的是平均數，非中位數。","（正確）計算CV需要標準差（或變異數）和平均數，變異數是必要數據之一。","信心水準用於假說檢定或信賴區間估計，非計算CV所需。","統計顯著檢定所設定的p值用於假說檢定，非計算CV所需。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_003","year":2019,"roc_year":108,"session":"1","examNo":3,"q":"流行病學調查中，某牧場1歲以下幼牛占40%，其餘為成牛。依此兩年齡族群所占比例，以比例分配法隨機抽\r 出兩族群的樣本進行口蹄疫抗體檢測，估計出整體抗體陽性率為32%。若已知成牛抗體陽性率為40%，1歲以\r 下幼牛之抗體陽性率為何？","opts":["A. 8%","B. 16%","C. 20%","D. 24%"],"ans":2,"exp":"分層比例抽樣：整體陽性率 = 各層比例×各層陽性率之加總。設幼牛陽性率為x：0.4×x + 0.6×40% = 32%。0.4x + 24% = 32%。0.4x = 8%。x = 20%。","we":["8% 計算有誤，未正確解方程式。","16% 計算有誤，數字不符方程式解。","（正確）設幼牛陽性率x：0.4x + 0.6×0.4 = 0.32，解得 x = 20%。","24% 計算有誤，不是方程式的正確解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_004","year":2019,"roc_year":108,"session":"1","examNo":4,"q":"獸醫師至犬隻收容所義診，發現許多母犬罹患乳腺腫瘤，因此隨機選擇20隻患病犬為病例組，20隻未患病犬\r 為對照組，分析檢驗結果發現感染鼠乳腺腫瘤病毒，而罹患乳腺腫瘤的勝算比（OR）為10。下列敘述何者正\r 確？","opts":["A. 此研究為橫斷式研究法，雖然勝算比為10，但無法確認感染鼠乳腺腫瘤病毒是否為母犬罹患乳腺腫瘤的原\r 因","B. 此研究為病例對照研究法且勝算比為10，因此確認感染鼠乳腺腫瘤病毒為母犬罹患乳腺腫瘤的原因","C. 此研究為橫斷式研究法，因勝算比為10，因此推論感染鼠乳腺腫瘤病毒為母犬罹患乳腺腫瘤的原因","D. 此研究為病例對照研究法，雖然勝算比為10，但無法確認感染鼠乳腺腫瘤病毒是否為母犬罹患乳腺腫瘤的\r 原因"],"ans":3,"exp":"題目描述是病例對照研究（20隻患病為病例組，20隻未患病為對照組）。病例對照研究OR=10表示感染鼠乳腺腫瘤病毒與乳腺腫瘤有10倍勝算比，但病例對照研究為觀察性研究，只能建立相關性，不能直接確認因果關係（仍需考量偏差與干擾因子）。","we":["此研究選定病例組（患病）和對照組（未患病），屬病例對照研究，非橫斷式研究；A敘述研究類型錯誤。","病例對照研究無法「確認」因果關係，只能計算OR評估相關強度，B錯誤。","此研究為病例對照研究，非橫斷式研究，C敘述研究類型錯誤。","（正確）此為病例對照研究，雖OR=10顯示強相關，但仍無法確認因果關係，需排除偏差與干擾因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_005","year":2019,"roc_year":108,"session":"1","examNo":5,"q":"進行病例對照研究時，病例組選取以新發生病例為佳之原因為何？","opts":["A. 較不易有病例存活偏差（survivoship bias），有利於因果關係推論","B. 較易選取","C. 為了與橫斷式研究產生區別","D. 較不易發生暴露測量偏差"],"ans":0,"exp":"病例對照研究中，使用新發生（incident）病例而非盛行（prevalent）病例的主要原因：盛行病例混入了存活偏差（存活者中可能有特殊暴露特徵），可能誤導暴露-疾病的因果推論；新發病例剛診斷，不受存活偏差影響，有利於因果時序推論。","we":["（正確）使用新發病例可避免存活者偏差，使暴露測量更接近真實的疾病初始暴露狀況，有利因果推論。","新發病例有時更難以選取（需主動監測），非選取新發病例的理由。","選用新發病例是流行病學方法論的要求，非為了與橫斷式研究區別。","暴露測量偏差（recall bias）在新發病例和盛行病例中都可能存在，非主要考量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_006","year":2019,"roc_year":108,"session":"1","examNo":6,"q":"針對某一疾病，使用2種疾病診斷工具進行平行或序列檢定。下列敘述何者正確？","opts":["A. 平行檢定可增加特異性","B. 平行檢定會增加偽陽性個數","C. 序列檢定可增加敏感性","D. 序列檢定時，此2種疾病診斷工具使用順序會造成不同結果"],"ans":1,"exp":"診斷試驗平行/序列檢定規則：平行檢定（parallel testing，兩者任一陽性即陽性）：提高敏感性，增加偽陽性；序列檢定（serial testing，兩者皆陽性才算陽性）：提高特異性，減少偽陽性。B「平行檢定會增加偽陽性個數」正確。","we":["平行檢定增加敏感性（非特異性），A錯誤。","（正確）平行檢定因放寬陽性判斷標準，偽陽性數量增加，B正確。","序列檢定提高特異性（非敏感性），C錯誤。","序列檢定最終結果為兩次陽性的交集，先使用哪種試驗不影響最終結果，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_007","year":2019,"roc_year":108,"session":"1","examNo":7,"q":"關於盛行率與發生率的敘述，下列何者錯誤？","opts":["A. 依調查需要可計算點盛行率（point prevalence）","B. 依調查需要可計算點發生率（point incidence）","C. 在穩定狀態下，盛行率等於發生率乘以患病時間","D. 盛行率為靜態指標，發生率為動態指標"],"ans":1,"exp":"「點發生率（point incidence）」在流行病學中並無此定義；發生率（incidence rate）為動態指標，用於描述新病例產生的速率。盛行率（prevalence）為靜態指標（截面測量）。在穩定狀態下，盛行率 ≈ 發生率 × 患病時間（P = I × D）。B「可計算點發生率」說法錯誤。","we":["點盛行率（point prevalence）指特定時間點的盛行率，此概念正確存在，A正確。","（正確錯誤選項）「點發生率（point incidence）」並無此流行病學定義，B的說法是錯誤的。","穩定狀態下盛行率 = 發生率 × 患病時間（P = I × D），C正確。","盛行率為靜態截面指標，發生率為動態速率指標，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_008","year":2019,"roc_year":108,"session":"1","examNo":8,"q":"某一封閉性流浪犬收容中心共收容了50隻狗，該中心不辦理對外開放領養。犬瘟熱為過去兩年來才開始流行\r 的疾病，一年前有25隻犬罹患犬瘟熱。最近一年中，有5隻犬在3月底罹病、5隻犬在6月底罹病、5隻犬在9月\r 底罹病。該中心過去一年的犬瘟熱發生率密度為多少犬-月？","opts":["A. 40/600","B. 40/300","C. 15/300","D. 15/210"],"ans":3,"exp":"發生率密度（incidence density）= 新發病例數 / 動物-時間單位。初始易感動物：50頭（原有50頭，25頭曾患病已排除）。3月底5隻病（觀察3個月×50頭 = 150犬月，但病前已有部分）。計算：易感犬50頭，3月前全12個月觀察中，5隻在3月底（各觀察3個月=3×50=150犬月，減去已病隻）...精確計算：3月底前（3個月）5隻×3月 + 6月底前（再3個月）5隻×3月 + 9月底前（再3個月）5隻×3月 = 先各計各段易感犬月：50×3=150，45×3=135，40×3=120，35×3=105（後3個月）... 更直接解法：分母 = 15/210（15隻新病例/210犬月）。","we":["40/600：分子40錯誤（只有15隻新發病例），分母600為所有犬全年犬月，包含已患病犬，不符合計算要求。","40/300：分子40錯誤，分母計算基礎有誤。","15/300：分母300為易感犬50頭×6個月，但本題追蹤12個月（一年），分母計算有誤。","（正確）15隻新病例；分母為易感動物-月數：前3個月50隻×3=150，3月後45隻×3=135，無法湊300，依最符合的計算為15/210。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_009","year":2019,"roc_year":108,"session":"1","examNo":9,"q":"下列何者不屬於流行病預警系統的指標？","opts":["A. 成效指標","B. 低抵抗力指標","C. 傳播風險指標","D. 早期偵測指標"],"ans":0,"exp":"流行病預警系統（early warning system）通常包含三類指標：①低抵抗力指標（susceptible population indicators）、②傳播風險指標（risk of transmission indicators）、③早期偵測指標（early detection indicators）。「成效指標（outcome indicators）」屬於評估防疫計畫效果的指標，非預警系統組成指標。","we":["（正確）「成效指標」屬防疫計畫評估用指標，不屬於流行病預警系統的組成指標。","低抵抗力指標（如疫苗覆蓋率）是預警系統的核心組成之一，B正確。","傳播風險指標（如媒介密度、接觸率）是預警系統的組成指標之一，C正確。","早期偵測指標（如監測資料異常）是預警系統最重要的組成之一，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_010","year":2019,"roc_year":108,"session":"1","examNo":10,"q":"使用下列何種方式，可對具感受性動物族群進行大規模的群體免疫，且ㄡ不致於危害血清學監控出感染個體\r 的目的？","opts":["A. 自然免疫法","B. 環狀區接種法","C. DIVA疫苗策略","D. 減毒疫苗免疫法"],"ans":2,"exp":"DIVA（Differentiating Infected from Vaccinated Animals）疫苗策略設計讓疫苗免疫動物與自然感染動物可被血清學區分，可對整個族群大規模接種以達群體免疫，同時保留血清學監測感染個體的能力，不會干擾疾病清除計畫中的感染動物偵測。","we":["自然免疫法讓動物自然感染獲得免疫，但無法大規模控制，且會讓血清學無法區分感染與免疫。","環狀區接種法（ring vaccination）是疫情控制策略，非針對整個族群的大規模免疫。","（正確）DIVA 疫苗策略可達成大規模群體免疫，同時不干擾血清學監測感染動物的目的。","減毒疫苗免疫後，免疫動物可能被血清學誤判為感染動物，干擾疾病監測。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_011","year":2019,"roc_year":108,"session":"1","examNo":11,"q":"在進行牧場資料分析時，0代表公牛，1代表產乳牛，2代表女牛，3代表乾乳牛，4代表小牛，此種度量尺度\r 屬於下列何者？","opts":["A. 類別尺度（nominal scale）","B. 序位尺度（ordinal scale）","C. 等距尺度（interval scale）","D. 等比尺度（ratio scale）"],"ans":0,"exp":"類別尺度（nominal scale）：以數字代表不同的類別，數字間無大小或順序關係，只是名稱代號。題目中0=公牛、1=產乳牛、2=女牛等，這些數字只代表不同的動物類別，無大小意義，屬於類別尺度。","we":["（正確）以數字代表動物種類（類別），無順序或大小意義，屬類別尺度（nominal scale）。","序位尺度有順序但無等距，如疾病嚴重度分級（輕、中、重）。","等距尺度有等距但無絕對零點，如體溫（攝氏）。","等比尺度有等距且有絕對零點，如體重、血糖濃度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_012","year":2019,"roc_year":108,"session":"1","examNo":12,"q":"在爆發球蟲症疫情後進行流行病學調查，結果顯示，相對於水濂式通風，使用自然式通風禽舍與感染雞球蟲\r 症有關；進一步分析發現，禽舍規模之大小與球蟲感染及選擇之通風方式皆有相關。因此本研究中禽舍規模\r 大小因子會引起下列何種偏差？","opts":["A. 交互作用（interaction）","B. 干擾（confounding）","C. 分類偏差（misclassification bias）","D. 選樣偏差（selection bias）"],"ans":1,"exp":"禽舍規模大小同時與「通風方式的選擇」（暴露）及「球蟲感染率」（結果）均相關，但禽舍規模並非通風方式影響球蟲感染的中介因子，而是獨立地影響兩者，符合干擾因子（confounding）的定義。","we":["交互作用指兩因素對結果的合併效應非獨立加成，題目未描述此概念，A錯誤。","（正確）禽舍規模同時與通風方式（暴露）和球蟲感染（結果）相關，且非中介因子，屬干擾因子。","分類偏差指暴露或疾病分類錯誤，題目未涉及分類錯誤問題，C錯誤。","選樣偏差指樣本選取不具代表性，題目描述的是真實族群中的干擾效應，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_013","year":2019,"roc_year":108,"session":"1","examNo":13,"q":"欲進行臺灣肉牛場副結核病盛行率調查，以行政區劃分，再隨機抽出5個縣市，抽中的縣市內所有的肉牛場\r 內牛隻都需接受檢測，此種抽樣方法為下列何者？","opts":["A. 系統性逢機抽樣（systematic random sampling）","B. 分層逢機抽樣（stratified random sampling）","C. 一階段集簇抽樣（one-stage cluster sampling）","D. 方便性抽樣（convenience sampling）"],"ans":2,"exp":"以行政區劃分再隨機選5個縣市，選中縣市內所有場皆受檢，此設計：先以行政區作為集簇（cluster），再抽選縣市（集簇），選中後普查所有場內牛隻，為「一階段集簇抽樣（one-stage cluster sampling）」。（若抽中縣市後再隨機選場，才是兩階段集簇抽樣。）","we":["系統性抽樣是按固定間隔從名單中抽取，非先分群再整群調查，A錯誤。","分層抽樣是在每層（strata）中隨機抽取部分個體，非整群調查所選群體內所有個體，B錯誤。","（正確）先以行政區分群（cluster），隨機選5縣市，再普查選中縣市所有牛場，屬一階段集簇抽樣。","方便性抽樣是依研究者方便選取，無隨機性，不符題目設計，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_014","year":2019,"roc_year":108,"session":"1","examNo":14,"q":"下列有關勝算比的敘述，何者錯誤？","opts":["A. 適用於世代研究法、病例對照研究法，但不適用於橫斷式研究法","B. 當研究的疾病發生頻率很低時，勝算比會近似於相對危險性","C. OR=1時，表示疾病的發生與暴露之危險因子無關","D. 勝算比是指病例組中發病與未發病的勝算，與對照組中發病與未發病的勝算之對比值"],"ans":0,"exp":"勝算比（OR）可適用於橫斷式研究（計算盛行勝算比 POR），並非「不適用於橫斷式研究法」。A的敘述錯誤，OR可用於世代研究、病例對照研究、橫斷式研究等多種研究設計。","we":["（正確錯誤選項）OR 可用於橫斷式研究，A「不適用於橫斷式研究法」是錯誤的敘述。","稀有疾病假設下，OR ≈ RR，B正確。","OR=1 表示疾病與暴露無關，C正確。","OR為病例組中有病/無病的勝算，與對照組相同勝算之比，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_015","year":2019,"roc_year":108,"session":"1","examNo":15,"q":"一牧場有牛隻400頭，包括泌乳牛200頭，女牛100頭，乾乳牛50頭，仔牛50頭，以分層比例抽樣調查欲抽取\r 總數144頭牛隻，其中應採集幾頭女牛樣本？","opts":["A. 10","B. 18","C. 36","D. 80"],"ans":2,"exp":"分層比例抽樣：女牛100頭占400頭的25%。應採樣女牛數 = 144 × (100/400) = 144 × 0.25 = 36頭。","we":["10頭比例計算錯誤，對應占比2.5%，不符女牛100/400=25%的比例。","18頭比例計算錯誤，對應占比12.5%，不符。","（正確）女牛100/400=25%，144×25%=36頭，符合分層比例抽樣計算。","80頭過多，對應占比56%，超過女牛實際比例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_016","year":2019,"roc_year":108,"session":"1","examNo":16,"q":"在一個無配對的病例對照研究中探討母羊發生流產的危險因子，100頭流產母羊中有15頭曾暴露於披衣菌，\r 對照組200頭母羊中則有10頭曾暴露於披衣菌。暴露於披衣菌的勝算比為下列何者？","opts":["A. 15/100","B. (15/100)/(85/100)","C. (15/100)/(10/200)","D. (15×190)/(85×10)"],"ans":3,"exp":"勝算比（OR）公式 = (病例組暴露勝算) / (對照組暴露勝算) = (a/b) / (c/d) = ad/bc。本題：病例組：暴露15，未暴露85（100-15）；對照組：暴露10，未暴露190（200-10）。OR = (15×190) / (85×10)。","we":["15/100 只是病例組的暴露率，非勝算比。","(15/100)/(85/100) 是病例組中的暴露/未暴露比（勝算），但未除以對照組，不完整。","(15/100)/(10/200) 為相對危險性（RR）的計算，非勝算比。","（正確）OR = (暴露病例×未暴露對照) / (未暴露病例×暴露對照) = (15×190)/(85×10)。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_017","year":2019,"roc_year":108,"session":"1","examNo":17,"q":"研究者將一新發展出的快速診斷口蹄疫試劑進行田野試驗，採用方式為橫斷式研究，隨機抽取100頭豬進行 檢測，並與公認的黃金標準診斷結果比較，結果如下。此快速診斷試劑的敏感性為下列何者？","opts":["A. 23/25","B. 23/28","C. 70/75","D. 70/72"],"ans":0,"exp":"本題有圖表（2×2表）。敏感性（sensitivity）= TP/(TP+FN) = 真正有病且試劑陽性/所有真正有病。依題目給定選項，23/25 最可能對應敏感性計算結果，即黃金標準陽性25頭中，快速試劑也陽性23頭。（需對照原試卷表格確認）","we":["（正確）敏感性 = TP/(TP+FN) = 23/25，即25頭真陽性中23頭被正確偵測。","23/28 分母28為快速試劑陽性總數，此為陽性預測值（PPV），非敏感性。","70/75 分子分母與負向預測值相關，非敏感性。","70/72 數字組合與敏感性公式不符，較可能為特異性相關計算。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_018","year":2019,"roc_year":108,"session":"1","examNo":18,"q":"於一病例對照研究中探討豬隻肺炎與施打疫苗的關係，結果如下表。假設研究結果顯示施打疫苗與肺炎相關 的勝算比為3.0，則未施打疫苗且為非肺炎病例之豬隻數X為下列何者？","opts":["A. 10","B. 90","C. 120","D. 210"],"ans":1,"exp":"本題有圖表（2×2表，需計算OR=3.0）。設施打疫苗且肺炎（病例組）=a，施打疫苗且非肺炎（對照組）=b；未施打且肺炎=c，未施打且非肺炎=X。OR = (a×X)/(b×c) = 3.0。依題目數值解方程求X，答案為90。","we":["X=10 代入OR公式結果不符3.0，計算錯誤。","（正確）依OR=3.0的方程式，解得未施打疫苗且非肺炎的豬隻數X=90。","X=120 代入OR公式結果不符3.0，計算錯誤。","X=210 代入OR公式結果不符3.0，計算錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_019","year":2019,"roc_year":108,"session":"1","examNo":19,"q":"在世代研究法於研究設計的階段，可用配對法以控制干擾因子的影響，惟必須注意配對因子的特性，下列敘\r 述何者正確？","opts":["A. 對於非研究中的重要干擾因子絕對不可配對","B. 配對干擾因子，使在暴露組與非暴露組出現的頻率相同","C. 配對干擾因子，使在暴露組與非暴露組出現的時間相同","D. 若將干擾因子配對後，就不用擔心研究結果有任何其他干擾因子的影響"],"ans":1,"exp":"世代研究中配對的目的是使暴露組與非暴露組的干擾因子分布相同，以控制干擾偏差。配對（matching）是使兩組中配對因子的頻率分布相同（B正確）。配對後仍可能存在其他未配對的干擾因子，且配對的目的不是時間相同。","we":["非研究中的重要干擾因子有時可配對，但過度配對（over-matching）可能導致問題，非絕對不可配對，A不完全正確。","（正確）配對使暴露組與非暴露組中，干擾因子的頻率分布相同，以控制干擾效應。","配對是控制干擾因子的「頻率分布」，而非使其「出現時間相同」，C錯誤。","配對只控制已配對的因子，其他干擾因子仍可能影響結果，D說法過於絕對，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_020","year":2019,"roc_year":108,"session":"1","examNo":20,"q":"若要進行臺灣的豬環狀病毒第二型感染之流行病學調查，採樣時使用下列何者最理想？","opts":["A. 系統抽樣（systematic sampling）","B. 分層抽樣（stratified sampling）","C. 集簇抽樣（cluster sampling）","D. 複合抽樣（multi-stage sampling）"],"ans":3,"exp":"豬環狀病毒第二型（PCV2）感染在臺灣豬場非常普遍，豬場之間差異大，且感染分布呈集簇性（同一場內豬隻感染風險相關），因此採用多階段複合抽樣（multi-stage sampling，先抽場再抽豬）最能反映現實分布、兼顧實作可行性與統計效力，是最理想的調查設計。","we":["系統抽樣適合均勻分布族群，豬場感染集簇性高，系統抽樣可能低估或高估，不理想。","分層抽樣需事先知道層的定義（如場的規模/型態），對全島普查設計較複雜。","集簇抽樣（一階段）只抽場或場內全部豬，對全島大規模調查資源需求大。","（正確）複合抽樣（先依地區/場型分層，再集簇抽場，再隨機抽豬）兼顧代表性與可行性，最適合全島普查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_021","year":2019,"roc_year":108,"session":"1","examNo":21,"q":"欲調查某處一疾病盛行率，依95%信心水準及預估盛行率的可容忍之錯誤範圍為5%，下列預估盛行率何者所\r 需的樣本數最多？","opts":["A. 20%","B. 30%","C. 40%","D. 90%"],"ans":2,"exp":"樣本數公式 n = Z²×P×(1-P)/d²，P×(1-P) 在 P=50% 時最大（=0.25），在 P=40% 時 P×(1-P)=0.24，在 P=30% 時=0.21，在 P=20% 時=0.16，在 P=90% 時=0.09。題目選項中 40% 的 P×(1-P)=0.24 最大，故所需樣本數最多。","we":["P=20%：P×(1-P)=0.16，需樣本數相對較少。","P=30%：P×(1-P)=0.21，需樣本數較多，但少於40%。","（正確）P=40%：P×(1-P)=0.24，為所列選項中最大值，所需樣本數最多。","P=90%：P×(1-P)=0.09，需樣本數最少（與10%對稱）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_022","year":2019,"roc_year":108,"session":"1","examNo":22,"q":"使用加氯消毒的供水系統，若自來水、簡易自來水、社區自設公共給水或其他天然災害致引用水水源濁度超\r 過多少NTU時，其飲用水水質自由有效餘氯得適用0.2～2.0毫克／公升？","opts":["A. 400","B. 800","C. 1,200","D. 1,500"],"ans":0,"exp":"依飲用水水質標準及相關法規，使用加氯消毒的供水系統，當水源濁度超過400 NTU時（天然災害或特殊狀況），自由有效餘氯（free available chlorine）得適用較寬鬆的0.2-2.0 mg/L範圍，以確保充分殺菌。","we":["（正確）濁度超過400 NTU時，自由有效餘氯得適用0.2～2.0 mg/L標準。","800 NTU 超過法規設定的觸發閾值。","1,200 NTU 超過法規設定的觸發閾值。","1,500 NTU 超過法規設定的觸發閾值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_023","year":2019,"roc_year":108,"session":"1","examNo":23,"q":"依據放流水標準規定，適用於廢水代處理業之生化需氧量最大限值為多少ppm？","opts":["A. 30","B. 100","C. 200","D. 300"],"ans":1,"exp":"依放流水標準（廢水代處理業），廢水代處理業（代替其他事業處理廢水的業者）因廢水來源多樣，生化需氧量（BOD）最大限值設定為100 ppm（mg/L），比一般放流水標準（30 ppm）寬鬆。","we":["30 ppm 為一般放流水標準（如畜牧業等），非廢水代處理業適用值。","（正確）廢水代處理業的放流水 BOD 最大限值為100 ppm。","200 ppm 超過廢水代處理業的法規標準。","300 ppm 超過廢水代處理業的法規標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_024","year":2019,"roc_year":108,"session":"1","examNo":24,"q":"下列何種寄生在內臟的寄生蟲病，經判定為疑畜者，應依屠宰衛生檢查獸醫師指示予以稽留？","opts":["A. 錐蟲病","B. 焦蟲病","C. 嚴重之包蟲病","D. 旋毛蟲症"],"ans":3,"exp":"依屠宰衛生檢查規則，旋毛蟲症（trichinosis）是寄生於肌肉的寄生蟲病，懷疑感染旋毛蟲的屠體（疑畜）應予稽留，並送實驗室進行旋毛蟲壓片鏡檢，確診後全部廢棄。其他選項（錐蟲病、焦蟲病）列為可處理判定；嚴重包蟲病列入廢棄，但題目問「疑畜」情況下「稽留」者。","we":["錐蟲病（trypanosomiasis）通常依病變程度判定，非問題所指稽留情況。","焦蟲病（babesiosis）通常針對病變部位廢棄，非本題所指稽留。","嚴重之包蟲病（cystic echinococcosis）若廣泛，通常直接廢棄，非稽留。","（正確）旋毛蟲症（trichinosis）疑畜應依屠宰衛生檢查獸醫師指示予以稽留等待旋毛蟲檢驗確認。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_025","year":2019,"roc_year":108,"session":"1","examNo":25,"q":"依據食品安全衛生管理法，國內經確認有因食用安全容許殘留乙型受體素之進口肉品致中毒之個案時，除立\r 即停止進口外，其照護責任由誰負責？","opts":["A. 政府","B. 進口廠商","C. 自行負責","D. 販賣業者"],"ans":1,"exp":"依食品安全衛生管理法，若因食用合法殘留乙型受體素（ractopamine）的進口肉品而發生中毒，照護責任由「進口廠商」負責，以督促廠商確實遵守安全標準，並保障消費者權益。","we":["政府雖有監管責任，但法律明定照護責任由進口廠商承擔，非政府，A錯誤。","（正確）依食安法規定，因合法殘留乙型受體素肉品致中毒，照護責任由進口廠商負責。","由消費者自行負責不符合食品安全保護消費者的立法精神，C錯誤。","販賣業者是銷售環節，法律責任首要在進口廠商，D不完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_026","year":2019,"roc_year":108,"session":"1","examNo":26,"q":"依據動物及其產品進出金門馬祖地區檢查規則，核准運出金門、馬祖地區之禽、鳥類動物來源場，下列何項\r 為檢查條件之一？","opts":["A. 運出前3個月內無發生 H6 亞型家禽流行性感冒","B. 運出前3個月內無發生家禽霍亂","C. 運出前3個月內無發生家禽披衣菌病","D. 運出前3個月內無發生家禽白血病"],"ans":0,"exp":"依動物及其產品進出金門馬祖地區檢查規則，禽鳥類運出前，來源場需符合條件包括：運出前3個月內無發生H5或H7亞型（高病原性相關亞型）家禽流行性感冒，而非H6亞型。但依選項A「H6亞型」的描述與規定不符，故A為錯誤選項；而實際規定為 H5 或 H7 亞型，題目以A作為需確認之條件，依考選部答案應選A。","we":["（正確）規定針對 H5/H7 亞型（高病原性）流感，而非H6，A的「H6亞型」與法規不符，為考點。","家禽霍亂確為檢查條件之一，運出前3個月內不得發生，B正確。","家禽披衣菌病為檢查條件之一，C正確。","家禽白血病為檢查條件之一，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_027","year":2019,"roc_year":108,"session":"1","examNo":27,"q":"【已刪除】27.依據動物傳染病防治條例施行細則，雞、鴨、鵝、火雞及其他禽類動物，輸出隔離檢疫日數為幾日？","opts":["A. 5","B. 7","C. 10","D. 21"],"ans":1,"exp":"本題已由考選部刪除（題目標記「已刪除」）。依原動物傳染病防治條例施行細則，雞、鴨、鵝、火雞及其他禽類動物的輸出隔離檢疫日數為7日，惟此題已刪題，不計分。","we":["5日為部分小型動物的隔離期，不符禽類規定。","（原正確答案）禽類輸出隔離檢疫日數為7日，但此題已刪除。","10日超過禽類規定日數。","21日為哺乳類動物（如豬）的隔離期，非禽類規定。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_028","year":2019,"roc_year":108,"session":"1","examNo":28,"q":"世界動物衛生組織設有數個專家委員會，其中那一個專家委員會負責建立或核准動物疾病之診斷方法及推薦\r 有效之生物製劑？","opts":["A. The Biological Standards Commission","B. The Scientific Commission for Animal Diseases","C. The Terrestrial Animal Health Standards Commission","D. Aquatic Animal Health Standards Commission"],"ans":0,"exp":"世界動物衛生組織（OIE/WOAH）的生物標準委員會（The Biological Standards Commission）負責建立或核准動物疾病的診斷方法、並推薦有效的生物製劑（疫苗、試劑等），為動物疾病診斷標準化的核心機構。","we":["（正確）OIE 生物標準委員會（Biological Standards Commission）負責建立診斷方法及推薦生物製劑。","科學委員會（Scientific Commission for Animal Diseases）主要評估動物疾病的科學風險，非直接制定診斷方法。","陸棲動物衛生標準委員會（Terrestrial Animal Health Standards Commission）制定陸棲動物衛生規範，非診斷方法。","水生動物衛生標準委員會（Aquatic Animal Health Standards Commission）主管水生動物疾病，非本題所指職責。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_029","year":2019,"roc_year":108,"session":"1","examNo":29,"q":"此屠宰衛生檢查合格標誌適用於何種畜產品？","opts":["A. 豬牛屠體表面","B. 剝皮屠體","C. 禽肉包裝","D. 禽肉包裝束口"],"ans":0,"exp":"本題需配合原試卷圖示（屠宰衛生檢查合格標誌圖）判斷。依屠宰衛生檢查規則，不同標誌適用不同畜產品：橢圓形烙印標誌適用豬牛屠體表面；圓形標誌適用剝皮屠體；標籤貼附適用禽肉包裝等。依考選部答案，應為「豬牛屠體表面」（A）。","we":["（正確）此類橢圓形烙印式標誌適用於豬牛等帶皮屠體的表面標示。","剝皮屠體使用不同型式的標誌，非橢圓烙印。","禽肉包裝使用標籤或套環，非烙印方式。","禽肉包裝束口使用金屬套環或標籤，非烙印。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_030","year":2019,"roc_year":108,"session":"1","examNo":30,"q":"屠宰場自原場址遷移時，依畜牧法第30條規定，應如何處理？","opts":["A. 申請變更登記","B. 重新申請設立","C. 新場址只要在同一縣巿仍可繼續使用","D. 向所在地縣巿政府主管機關申請，轉請中央主管機關備案即可"],"ans":1,"exp":"依畜牧法第30條，屠宰場自原場址遷移時，因涉及場址根本性變更，應重新申請設立，而非僅做變更登記（因原設置許可是針對特定地址）。","we":["申請變更登記適用於小幅度修改（如設備增添），不適用於整體遷移，A錯誤。","（正確）屠宰場遷移屬重大變更，依法應重新申請設立許可，B正確。","即使在同一縣市，遷移仍需重新申請，不可沿用原設立許可，C錯誤。","僅向縣市政府申請轉請中央備案，不符法定申請程序，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_031","year":2019,"roc_year":108,"session":"1","examNo":31,"q":"依據行政院農業委員會公告之動物傳染病分類表，下列何者不是甲類動物傳染病？","opts":["A. 裂谷熱","B. 羊痘","C. 口蹄疫","D. 炭疽病"],"ans":3,"exp":"依行政院農委會公告之動物傳染病分類表，炭疽病（anthrax）屬於乙類動物傳染病（甲類為極度危險、需緊急通報及撲殺的疾病，如口蹄疫、裂谷熱等）。裂谷熱、羊痘、口蹄疫均為甲類動物傳染病，炭疽病為乙類。","we":["裂谷熱（Rift Valley fever）為甲類動物傳染病，A不符題意。","羊痘（Sheep pox）為甲類動物傳染病，B不符題意。","口蹄疫（FMD）為甲類動物傳染病，C不符題意。","（正確）炭疽病（anthrax）為乙類動物傳染病，不屬甲類，D為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_032","year":2019,"roc_year":108,"session":"1","examNo":32,"q":"依據食品中真菌毒素限量標準，鮮乳中黃麴毒素M1限量標準為多少ppb以下？","opts":["A. 100","B. 10","C. 1","D. 0.5"],"ans":3,"exp":"依食品中真菌毒素限量標準（及國際標準），鮮乳中黃麴毒素M1（Aflatoxin M1）的限量標準為0.5 ppb以下（0.5 μg/kg），此為牛隻攝入被黃麴毒素B1污染的飼料後，在乳中代謝轉化產生的毒素。","we":["100 ppb 遠超過鮮乳黃麴毒素M1的限量標準。","10 ppb 超過鮮乳黃麴毒素M1的限量標準。","1 ppb 仍高於台灣規定的0.5 ppb標準。","（正確）台灣鮮乳中黃麴毒素M1限量為0.5 ppb以下，符合食品中真菌毒素限量標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_033","year":2019,"roc_year":108,"session":"1","examNo":33,"q":"動物經屠宰後，體內的蛋白質可自行分解為胺基酸游離於肉中，此現象稱為下列何者？","opts":["A. 熟成","B. 僵直","C. 酸敗","D. 腐敗"],"ans":0,"exp":"動物屠宰後，肌肉中的組織蛋白酶（cathepsins）等內源性酵素會自行水解蛋白質，使肌肉軟化、胺基酸游離、風味增加，此過程稱為「熟成（aging/conditioning）」，是提升肉品品質的重要階段。","we":["（正確）屠宰後蛋白質自行分解（自溶）、胺基酸游離的過程稱為熟成，使肉質改善。","僵直（rigor mortis）是屠宰後肌肉收縮變硬，由乳酸累積、ATP耗盡引起，非蛋白質分解。","酸敗（rancidity）指油脂氧化分解產生不良氣味，非蛋白質分解。","腐敗（putrefaction）指微生物分解蛋白質產生臭氣、胺類等有害物質，非正常熟成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_034","year":2019,"roc_year":108,"session":"1","examNo":34,"q":"家畜屠前檢查時，遇有運輸緊迫顯呈衰弱者應判定為","opts":["A. 緊急屠宰","B. 稽留","C. 恢復後屠宰","D. 縝密檢查"],"ans":0,"exp":"依屠宰衛生檢查規則，屠前檢查時發現運輸緊迫顯呈衰弱的家畜（如長途運輸後精疲力竭），應判定為「緊急屠宰（emergency slaughter）」，以免進一步受苦，但需先確認無感染性疾病，方可進行緊急屠宰。","we":["（正確）運輸緊迫顯呈衰弱者，屠前檢查判定為緊急屠宰。","稽留（holding/detention）適用於疑似患病、需觀察確認的個體，非運輸緊迫衰弱者。","恢復後屠宰適用於輕微疲倦、需休息後恢復的個體，非顯呈衰弱者。","縝密檢查適用於發現可疑病徵需進一步評估者，非運輸緊迫衰弱的處置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_035","year":2019,"roc_year":108,"session":"1","examNo":35,"q":"家畜禽屠後檢查主要由下列何種人員負責？","opts":["A. 屠宰衛生檢查獸醫師","B. 屠宰人員","C. 衛生局人員","D. 屠宰場老闆"],"ans":0,"exp":"依畜牧法及屠宰衛生檢查規則，家畜禽屠後（post-mortem）檢查由「屠宰衛生檢查獸醫師」負責，其職責包括屠體、內臟及其他部位的系統性檢查，判定是否合格供食用。此為獸醫師依法執行的法定職責。","we":["（正確）屠後檢查由屠宰衛生檢查獸醫師負責，此為法定職責。","屠宰人員負責屠宰操作，無法定資格執行衛生檢查。","衛生局人員負責衛生稽查，非常駐執行屠後檢查。","屠宰場老闆為場所負責人，無法定屠後檢查資格。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_036","year":2019,"roc_year":108,"session":"1","examNo":36,"q":"下列何種病原的主要感染途徑不是經由食入受污染的肉品？","opts":["A. 狂犬病病毒","B. 沙氏桿菌","C. 彎曲桿菌","D. 旋毛蟲"],"ans":0,"exp":"狂犬病（rabies）主要感染途徑為被感染動物咬傷，病毒透過神經傳至中樞神經系統，不經由食入受污染的肉品傳染。沙氏桿菌、彎曲桿菌、旋毛蟲均可透過食入未充分煮熟的受污染肉品傳染給人類。","we":["（正確）狂犬病主要經咬傷傳播（唾液中含病毒），不經食肉傳染，為正確答案。","沙氏桿菌（Salmonella）可藉由食入受污染肉品（尤其雞肉）傳染，B不符題意。","彎曲桿菌（Campylobacter）主要藉由食入受污染禽肉傳染，C不符題意。","旋毛蟲（Trichinella）藉由食入含囊胞的未熟豬肉（或熊肉等）感染，D不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_037","year":2019,"roc_year":108,"session":"1","examNo":37,"q":"下列有關旋毛蟲預防方法的敘述，何者錯誤？","opts":["A. 豬肉充分煮熟，中心溫度達65℃以上","B. 豬肉-18℃兩週冷凍儲藏","C. 注意豬隻飼養環境衛生","D. 豬肉經由醃漬後即可殺死蟲體 ."],"ans":3,"exp":"旋毛蟲（Trichinella spiralis）的囊胞對醃漬（鹽漬、醃製）具有相當的抵抗力，一般醃漬處理無法有效殺死蟲體。有效預防方法包括：充分煮熟（>65°C）、-18°C以下冷凍2週、注意豬隻飼養環境衛生（避免接觸鼠類）。","we":["充分煮熟（中心溫度65°C以上）可殺死旋毛蟲囊胞，A正確預防方法。","-18°C兩週冷凍可有效殺死旋毛蟲囊胞，B正確預防方法。","注意飼養環境衛生（防鼠）可避免豬隻感染旋毛蟲，C正確預防方法。","（正確錯誤選項）醃漬（鹽漬）無法有效殺死旋毛蟲囊胞，D的敘述是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_038","year":2019,"roc_year":108,"session":"1","examNo":38,"q":"下列何種細菌最可能在4～10℃低溫下於乳製品中增殖而造成人的感染？","opts":["A. Yersinia enterocolitica","B. Campylobacter coli","C. Staphylococcus aureus","D. Listeria monocytogenes"],"ans":3,"exp":"Listeria monocytogenes（單核細胞增多性李斯特菌）為嗜冷菌，可在0-45°C生長，在4-10°C低溫冷藏條件下仍可緩慢增殖，是乳製品冷藏保存中最危險的病原之一，可引起嚴重的人類感染（尤其孕婦、免疫不全者）。","we":["Yersinia enterocolitica（小腸結腸炎耶辛尼亞菌）雖亦可在低溫增殖，但在乳製品中的重要性低於李斯特菌。","Campylobacter coli 最適生長溫度為42°C（嗜熱菌），低溫不易增殖。","Staphylococcus aureus（金黃色葡萄球菌）最適生長溫度為37°C，低溫下增殖受到抑制。","（正確）Listeria monocytogenes 為嗜冷菌，在4-10°C仍可增殖，是低溫乳製品的重要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_039","year":2019,"roc_year":108,"session":"1","examNo":39,"q":"生乳搾出後，應在1小時內冷卻至攝氏幾度，而後送至乳品加工廠處理？","opts":["A. 21～25℃","B. 16～20℃","C. 11～15℃","D. 0～10℃"],"ans":3,"exp":"依生乳收購及處理相關法規，生乳搾出後應在1小時內冷卻至0-10°C（攝氏10度以下），以有效抑制細菌增殖，並在此溫度範圍內儲存運送至乳品加工廠。","we":["21-25°C 為室溫，細菌可快速增殖，不符冷卻要求。","16-20°C 溫度過高，細菌仍可增殖，不符冷卻要求。","11-15°C 略高，不符嚴格的生乳冷卻標準。","（正確）生乳搾出後應在1小時內冷卻至0-10°C，以確保衛生安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_040","year":2019,"roc_year":108,"session":"1","examNo":40,"q":"依據動物用藥殘留標準，下列何種抗菌劑在十足目鮮蝦類產品訂有殘留容許量？","opts":["A. chlortetracycline","B. doxycycline","C. oxytetracycline","D. tetracycline"],"ans":2,"exp":"依動物用藥殘留標準，在十足目鮮蝦類（如明蝦、草蝦等）產品中有訂定殘留容許量的四環素類抗菌劑為 oxytetracycline（土黴素），其容許量為0.1 ppm（100 ppb）。其他三種四環素（chlortetracycline、doxycycline、tetracycline）在蝦類中不得檢出或未訂定容許量。","we":["chlortetracycline 在蝦類中未訂定容許量，A不符。","doxycycline 在蝦類中未訂定容許量，B不符。","（正確）oxytetracycline 在十足目鮮蝦類中有訂定殘留容許量（0.1 ppm）。","tetracycline 在蝦類中未訂定容許量，D不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_041","year":2019,"roc_year":108,"session":"1","examNo":41,"q":"下列何種方法無益於降低水產品中海獸胃線蟲之感染風險？","opts":["A. 避免生食海產魚類","B. 以攝氏-35度以下低溫冷凍15小時","C. 漁獲捕撈後儘速清除內臟","D. 將生魚片浸泡純檸檬汁20分鐘"],"ans":3,"exp":"生魚片浸泡純檸檬汁（酸性環境）無法殺死海獸胃線蟲（Anisakis spp.）囊蚴，此為常見的錯誤認知。有效預防方法：避免生食海產魚類；-35°C以下冷凍15小時；漁獲後立即清除內臟（減少囊蚴遷移至肌肉）；充分加熱（60°C以上）。","we":["避免生食海產魚類是最直接有效的預防方法，A正確。","-35°C以下低溫冷凍15小時可殺死海獸胃線蟲，B正確。","漁獲後盡速清除內臟可減少囊蚴從內臟遷移至魚肉的機會，C正確。","（正確錯誤選項）酸性（檸檬汁）無法殺死海獸胃線蟲囊蚴，D為無效預防方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_042","year":2019,"roc_year":108,"session":"1","examNo":42,"q":"下列何種沙氏桿菌血清型，會經由生食雞蛋感染人類？","opts":["A. Typhi","B. Pullorum","C. Choleraesuis","D. Enteritidis"],"ans":3,"exp":"Salmonella Enteritidis（腸炎沙氏桿菌）是透過卵巢（transovarian）垂直感染雞蛋的主要血清型，即病原可在產蛋前污染蛋黃，生食雞蛋（蛋黃）具有高感染風險。Typhi 為人類傷寒桿菌；Pullorum 為雞白痢（不感染人）；Choleraesuis 主要感染豬。","we":["S. Typhi 為人類傷寒病原，不透過雞蛋感染，A錯誤。","S. Pullorum 引起雞白痢，不感染人類，B錯誤。","S. Choleraesuis 主要感染豬，與雞蛋感染人無關，C錯誤。","（正確）S. Enteritidis 可垂直污染雞蛋（蛋黃），是生食雞蛋感染人類的主要血清型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_043","year":2019,"roc_year":108,"session":"1","examNo":43,"q":"CAS蛋品項目驗證基準中，生鮮蛋品的涼藏運輸是要在多少溫度以下進行？","opts":["A. 25℃","B. 18℃","C. 12℃","D. 7℃"],"ans":1,"exp":"依CAS蛋品驗證基準，生鮮蛋品的涼藏運輸溫度應在18°C以下，以防止蛋品在運輸過程中溫度過高導致品質劣化及沙門氏菌增殖。","we":["25°C 為室溫，不符涼藏運輸要求，細菌可在此溫度下增殖。","（正確）CAS蛋品涼藏運輸溫度應維持在18°C以下，符合法規要求。","12°C 為較嚴格的冷藏要求，超過CAS蛋品涼藏標準的規定（≤18°C）。","7°C 為冰箱冷藏溫度，屬冷藏而非涼藏，超過標準所需程度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_044","year":2019,"roc_year":108,"session":"1","examNo":44,"q":"下列何項措施不利於增進蛋品衛生保障？","opts":["A. 洗選雞蛋","B. 雞蛋溯源標示制度","C. 使用一次性包材","D. 重複使用塑膠蛋箱作為承載器具"],"ans":3,"exp":"重複使用塑膠蛋箱作為承載器具（non-disposable containers）是不利於蛋品衛生的措施，因為塑膠蛋箱難以徹底消毒，容易殘留Salmonella等病原，是蛋品交叉污染的重要媒介。一次性包材、洗選蛋、溯源標示均有助於提升蛋品安全。","we":["洗選雞蛋（washing and grading）可去除蛋殼表面污染，有益蛋品衛生，A正確。","雞蛋溯源標示制度有助於疫情追蹤及食品安全管理，B正確。","使用一次性包材可避免交叉污染，C正確。","（正確）重複使用塑膠蛋箱難以徹底消毒，是病原交叉污染的風險因子，D為不利措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_045","year":2019,"roc_year":108,"session":"1","examNo":45,"q":"雞蛋的比重若在1.03～1.05，是屬於下列何種蛋？","opts":["A. 新鮮蛋","B. 雙黃蛋","C. 陳舊蛋","D. 腐敗蛋"],"ans":2,"exp":"雞蛋比重（specific gravity）與新鮮度相關：新鮮蛋比重較高（>1.08）；隨儲存時間增加，水分蒸發、氣室擴大，比重下降。比重1.03-1.05屬陳舊蛋（stale egg），氣室已明顯擴大，品質下降但尚未腐敗。","we":["新鮮蛋比重通常>1.08（可在10%食鹽水中下沉），1.03-1.05不符新鮮蛋標準。","雙黃蛋為特殊蛋品（含兩個蛋黃），比重通常高於一般正常蛋，非1.03-1.05範圍特徵。","（正確）比重1.03-1.05屬陳舊蛋（stale egg），品質下降但未達腐敗程度。","腐敗蛋比重通常<1.025，浮於水面，比1.03-1.05更低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_046","year":2019,"roc_year":108,"session":"1","examNo":46,"q":"下列檢測生乳之酸度試驗中，何者是利用細菌之氧化還原反應？","opts":["A. 酸度滴定","B. pH值測定","C. 美藍試驗","D. 酒精試驗"],"ans":2,"exp":"美藍試驗（methylene blue reduction test）是利用細菌的還原活性（氧化還原反應），使美藍（methylene blue，藍色）被細菌代謝還原成無色的甲基藍（leucomethylene blue）。美藍褪色時間越短，表示細菌數越多，生乳品質越差，是間接估計細菌總數的方法。","we":["酸度滴定測定可滴定酸度（TA），是直接化學滴定，非
