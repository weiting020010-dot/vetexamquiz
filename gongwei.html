期間盛行率。A錯（盛行率與發生率不同）；B錯（流行病學曲線顯示發生率，非盛行率）；C錯（點盛行率=某一時間點，期間盛行率=某時段，通常不同）。","we":["A. 盛行率（prevalence）不是發生率（incidence）的一種，兩者概念不同：盛行率=現有病例/族群，發生率=新病例/風險族群。","B. 流行病學曲線（epidemic curve）顯示新病例隨時間的分布（發生率概念），不直接得出盛行率。","C. 點盛行率（point prevalence）在特定時間點測量；期間盛行率（period prevalence）跨越一段時間，兩者通常不同。","D. 正確：期間盛行率考慮觀察期間內所有病例（期初既有+期間新增），此為其定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_009","year":2025,"roc_year":114,"session":"","examNo":9,"q":"關於危險因子與疾病發生之相關（association）與因果關係（causation）敘述，下列何者正確？","opts":["A. 有相關就代表有因果關係","B. 統計上有顯著相關則代表有因果關係","C. 因果關係表示兩者有真正的機制存在","D. 危險因子即為病因"],"ans":2,"exp":"相關（association）不等於因果關係（causation）。判斷因果關係需符合Bradford Hill準則（時序性、相關強度、一致性、生物合理性等）。因果關係意味著兩變數間存在真正的生物機制（biological mechanism），而統計相關只表示兩者有統計上的關聯。","we":["A. 有相關不代表有因果：第三變數（confounding）、偶然性、偏差均可造成假性相關。","B. 統計顯著相關僅表示關聯不太可能由機會造成，不代表有真正的因果機制。","C. 正確：因果關係暗示存在真正的生物機制——暴露導致疾病的路徑是可解釋的。","D. 危險因子（risk factor）僅表示與疾病發生相關的因素，可能只是替代指標而非真正病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_010","year":2025,"roc_year":114,"session":"","examNo":10,"q":"下列何種情況下會以費雪精確檢定（Fisher's exact test）取代卡方檢定（Chi-square test）？","opts":["A. 觀察值的總數少於20，或任何一個預期值小於5","B. 觀察值的總數少於10，或任何一個預期值大於5","C. 觀察值的總數大於20，或任何一個預期值小於10","D. 觀察值的總數大於10，或任何一個預期值小於10"],"ans":0,"exp":"費雪精確檢定（Fisher's exact test）在樣本量過小時取代卡方檢定。標準適用條件：總樣本數<20，或任何一個儲格（cell）的期望值（expected value）<5。此時卡方分配近似不精確，費雪精確檢定可提供精確的p值。","we":["A. 正確：觀察值總數<20，或任何預期值<5時，應改用Fisher's exact test。","B. 條件數字錯誤（「少於10」、「大於5」均不正確），且邏輯相反。","C. 條件方向相反（觀察值>20不符合使用Fisher's的情境）。","D. 「大於10」方向錯誤，且預期值<10比<5標準更寬鬆，不夠精確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_011","year":2025,"roc_year":114,"session":"","examNo":11,"q":"下列何者不屬於因果關係的條件？","opts":["A. 正確的時序性","B. 生物學上的合理性","C. 相關強度的大小","D. 研究樣本數的大小"],"ans":3,"exp":"Bradford Hill因果關係準則（9項）：時序性、相關強度、劑量反應關係、一致性（可重複性）、特異性、生物合理性、實驗驗證、相干性、類比性。「研究樣本數的大小」不是因果關係的判斷準則，樣本大小影響統計檢定力，但不判斷因果。","we":["A. 正確的時序性（temporality）是因果關係必要條件：原因必須在結果之前發生。","B. 生物學上的合理性（biological plausibility）是Hill準則之一，支持因果推論。","C. 相關強度（strength of association）越大，因果關係越可能；RR或OR越高，混淆因素的可能性越低。","D. 正確：樣本數大小影響統計功效（power），不是判斷因果關係的標準，不在Hill準則中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_012","year":2025,"roc_year":114,"session":"","examNo":12,"q":"一項調查豬瘟與豬場裝設通風設備之病例對照研究中，500場病例場中有400場裝設通風設備，500 場陰性場中有100場裝設通風設備。則有裝設通風設備與豬場發生豬瘟的勝算比（odds ratio）為 何？","opts":["A. 1","B. 4","C. 16","D. 無法從上列資料計算而得"],"ans":2,"exp":"病例對照研究的勝算比（OR）計算：a=病例有暴露=400，b=病例無暴露=100，c=對照有暴露=100，d=對照無暴露=400。OR = (a×d)/(b×c) = (400×400)/(100×100) = 160000/10000 = 16。","we":["A. OR=1代表暴露與疾病無關聯（零效應），計算結果不為1。","B. OR=4，計算錯誤；可能誤用了單方向的比值（400/100=4）而非完整公式。","C. 正確：OR = (400×400)/(100×100) = 16，通風設備顯著增加豬瘟的勝算。","D. 從上列資料可以計算，2×2列聯表資料完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_013","year":2025,"roc_year":114,"session":"","examNo":13,"q":"在探討暴露與疾病之關係，其粗勝算比（crude odds ratio）為1.2，經過性別分層後之勝算比分 別均為5.7，則性別在此研究是否為干擾因子，且其分析時應如何進行調整？","opts":["A. 不是干擾因子，但必須用Mantel-Haenszel procedure調整","B. 是干擾因子，且必須用Mantel-Haenszel procedure調整","C. 不是干擾因子，也不必調整","D. 是干擾因子，且必須用Wilcoxon rank sum test調整"],"ans":1,"exp":"干擾因子（confounder）的判斷：若粗勝算比（crude OR=1.2）與分層後勝算比（stratified ORs均=5.7）差異顯著，表示性別改變了暴露與疾病間的關聯強度，故性別是干擾因子。當存在干擾因子時，需以Mantel-Haenszel procedure進行加權調整，得到校正後的OR。","we":["A. 若crude OR≠stratified ORs，表示性別確實是干擾因子，非「不是干擾因子」。","B. 正確：crude OR(1.2)與stratified ORs(5.7)差異大→性別是干擾因子；應使用Mantel-Haenszel調整。","C. 差異顯著表示有干擾，且必須調整。「不是干擾因子也不必調整」兩者均錯誤。","D. 雖然性別是干擾因子正確，但調整方法應為Mantel-Haenszel procedure，而非Wilcoxon rank sum test（後者用於比較兩組中位數）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_014","year":2025,"roc_year":114,"session":"","examNo":14,"q":"為顯示某一特定動物疾病是否存在，假設族群個體數為10,000，預期盛行率為30％，信心水準設為 99％，查表得樣本數為13。下列有關抽樣與統計之敘述，何者錯誤？","opts":["A. 若所有樣本檢查結果皆為陰性，則有99％的信心認為該疾病之盛行率低於30％","B. 在這13個樣本中必含有一個檢出結果為陽性","C. 若診斷試驗之敏感性不足，則樣本數需要增加","D. 同樣的信心水準下，預期盛行率若越高，需要的樣本數就越少"],"ans":1,"exp":"「至少有一個陽性」的抽樣設計是基於機率：若預期盛行率30%，採集13個樣本，若全部陰性則有99%信心認為盛行率低於30%。但這13個樣本「不保證必定包含一個陽性」——設計目的是若疾病真的存在(盛行率≥30%)，以99%機率能偵測到，而非保證每次都找到陽性。","we":["A. 正確：若13個樣本全陰性，則有99%信心認為該疾病盛行率低於30%，這是此抽樣設計的正確解讀。","B. 錯誤：抽樣設計提供的是「偵測機率」，而非保證一定能找到陽性個體，若疾病盛行率恰好低於預設值，全陰性是可能的。","C. 正確：診斷敏感性不足會漏掉真陽性，需增加樣本數補償，以維持同樣的偵測機率。","D. 正確：在相同信心水準下，預期盛行率越高，需要的樣本數越少（族群中陽性個體越多，越容易找到）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_015","year":2025,"roc_year":114,"session":"","examNo":15,"q":"下列何者不適用於世代研究中控制干擾因子偏差（confounding bias）？","opts":["A. 限制研究對象","B. 匹配（matching）","C. 分層分析","D. 去除資料的離散值（outlier）"],"ans":3,"exp":"控制世代研究（cohort study）中干擾因子偏差的方法包括：限制研究對象（restriction）、匹配（matching）、分層分析（stratification）、多變量分析等。去除資料的離散值（outlier removal）是資料清理的統計步驟，不是控制干擾因子偏差的流行病學方法，且去除離散值可能引入新的偏差。","we":["A. 限制研究對象：只納入具特定特徵的個體（如年齡限制），可排除干擾因子的影響，有效控制confounding。","B. 匹配（matching）：讓暴露組與非暴露組在已知干擾因子上相似，可在設計階段控制confounding。","C. 分層分析（stratification）：在各干擾因子層級內分別分析，再合併（如Mantel-Haenszel），有效控制confounding。","D. 正確：去除離散值是資料品質處理，目的是減少異常值對統計的影響，不是控制confounding bias的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_016","year":2025,"roc_year":114,"session":"","examNo":16,"q":"研究者想瞭解全國獸醫師心理健康情形，在某伴侶動物繼續教育研討會中，經與會者同意後填寫評 估問卷，直至所需樣本數額滿為止，此為何種抽樣方法？","opts":["A. 方便性抽樣","B. 簡單逢機抽樣","C. 系統性逢機抽樣","D. 集簇抽樣"],"ans":0,"exp":"在研討會中招募願意填寫問卷的與會者，直至樣本數額滿，屬於「方便性抽樣（convenience sampling）」——從最容易取得的個體中取樣，非隨機程序。此法有嚴重選擇偏差，難以代表全體獸醫師族群。","we":["A. 正確：從研討會與會者中方便取樣，屬方便性抽樣（非機率抽樣），有選擇偏差。","B. 簡單逢機抽樣需從完整名冊以亂數方式選取，此情境未使用亂數，非簡單逢機。","C. 系統性逢機抽樣需在名冊中每隔固定間隔選取（如每第k個），此情境無此設計。","D. 集簇抽樣先隨機選取群（如縣市），再對群內所有個體調查，此情境未使用群體概念。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_017","year":2025,"roc_year":114,"session":"","examNo":17,"q":"欲抽樣瞭解一牧場之荷仕登牛和娟姍牛的牛乳產量，依品種比例計算各品種所需的樣本數後利用亂 數表進行抽樣，此為何種抽樣方法？","opts":["A. 系統性逢機抽樣","B. 簡單逢機抽樣","C. 分層逢機抽樣","D. 集簇抽樣"],"ans":2,"exp":"依品種（荷仕登牛、娟姍牛）比例計算各品種所需樣本數，再在各品種中用亂數表隨機抽樣，此為「分層逢機抽樣（stratified random sampling）」：先按特定標準（品種）分層（strata），再在各層內隨機抽樣，可確保各層代表性。","we":["A. 系統性逢機抽樣需在排列好的名冊中每隔k個抽一個，此情境無此設計。","B. 簡單逢機抽樣從整體名冊不分層隨機選取，不考慮品種比例。","C. 正確：依品種比例分配樣本數→在各品種內隨機抽取，為分層逢機抽樣的完整描述。","D. 集簇抽樣先隨機選群（如牧場）再全數調查群內個體，此情境是個體層級的抽樣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_018","year":2025,"roc_year":114,"session":"","examNo":18,"q":"在一有300頭牛隻的牧場，預期有結核病的牛隻比率為2％，於信心水準95％時，依下表結果在牧場中至少檢出1頭結核病陽性牛隻需採集多少樣本數？","opts":["A. 97","B. 117","C. 189","D. 287"],"ans":0,"exp":"在有限族群（N=300）中，預期盛行率p=2%，信心水準95%（α=0.05），以超幾何分布或二項式近似公式計算至少偵測到1頭結核病所需樣本數約為97頭（查表得值）。公式：n = log(α)/log(1-p)用於無限族群≈148，有限族群校正後n_adj≈99，接近選項A的97。","we":["A. 正確：查表在盛行率2%、95%信心、N=300條件下，樣本數約97頭。","B. 117：高估所需樣本數，不符合有限族群校正後的計算結果。","C. 189：過高，此數值接近50%信心水準的需求量。","D. 287：接近全群（300頭），明顯過高，適用於極低盛行率（<0.5%）情境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_019","year":2025,"roc_year":114,"session":"","examNo":19,"q":"由客觀來源及多重來源獲取研究個案資料，可避免何種偏差？","opts":["A. 干擾因子偏差","B. 志願者偏差","C. 記憶偏差","D. 就診率偏差"],"ans":2,"exp":"由客觀來源（如檢驗報告、病歷）及多重來源（而非依賴受訪者自我回憶）獲取資料，可避免「記憶偏差（recall bias）」——病例和對照因記憶準確性不同而造成暴露資訊的差異性誤差。干擾因子偏差靠設計控制；志願者偏差靠抽樣控制；就診率偏差靠研究設計選擇。","we":["A. 干擾因子偏差（confounding bias）靠研究設計（匹配、分層、限制）或統計分析控制，非靠客觀多重來源資料。","B. 志願者偏差（volunteer bias）發生在研究招募階段，與資料來源客觀性無直接關係。","C. 正確：記憶偏差（recall bias）源於受訪者對過去暴露的記憶不準確；改用客觀記錄和多重來源可避免此偏差。","D. 就診率偏差（Berkson's bias）因從醫院選取病例而產生，非資料獲取方式所能避免。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_020","year":2025,"roc_year":114,"session":"","examNo":20,"q":"下表為兩種不同診斷試劑的檢驗結果，有關一致性及其統計分析之敘述何者錯誤？","opts":["A. 診斷結果一致性（observed agreement）為 (55+138)/212","B. 機率性一致性（agreement by chance）為 [(59×70)/212+(153×142)/212]/212","C. Kappa值越大代表兩診斷試劑結果一致性越高","D. 一致性的統計檢定可依卡方檢定（Chi-square test）方式進行"],"ans":3,"exp":"Kappa統計量的假設檢定應使用「z檢定（z-test）」，而非卡方檢定（Chi-square test）——因Kappa值的標準誤已有公式計算，直接轉換為z值進行檢定。卡方檢定可用於測試兩變數的關聯性，但不是Kappa一致性的標準檢定方法。","we":["A. (55+138)/212為對角線合計/總數，即觀察一致性（observed agreement）的正確計算，無誤。","B. 機率性一致性（expected agreement）= [(列合計×行合計)/n²]的加總，公式[(59×70)/212+(153×142)/212]/212等同此計算，正確。","C. Kappa值越接近1代表一致性越高（0=機遇水準，1=完全一致），敘述正確。","D. 錯誤：Kappa的統計檢定應採z-test（以Kappa值除以其標準誤），而非卡方檢定；卡方檢定測試的是關聯性而非一致性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_021","year":2025,"roc_year":114,"session":"","examNo":21,"q":"檢測某疾病時，若將敏感性80％、特異性80％的檢測方法改為使用敏感性80％、特異性90％的檢測 方法時，下列敘述何者正確？","opts":["A. 偽陽性增加","B. 偽陰性降低","C. 陽性反應預測值增加","D. 陰性反應預測值降低"],"ans":2,"exp":"特異性從80%提升至90%（敏感性不變=80%）：特異性提高→偽陽性（FP）減少→陽性預測值（PPV = TP/(TP+FP)）分母縮小→PPV增加。偽陰性（FN）由敏感性決定（不變），故FN不變；陰性預測值（NPV）變化微小。","we":["A. 特異性提高→偽陽性「減少」，非增加；偽陽性率=1-特異性，特異性↑則FP↓。","B. 偽陰性由敏感性決定（FN率=1-敏感性），敏感性未改變（仍80%），故FN不變。","C. 正確：特異性提高→FP減少→PPV增加（分母TP+FP縮小，分子TP不變）。","D. 陰性預測值（NPV = TN/(TN+FN)）：特異性提高→TN增加，但FN不變，NPV反而略增而非降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_022","year":2025,"roc_year":114,"session":"","examNo":22,"q":"一健康犬隻經採血檢測15項血清生化值，每項檢測值的正常參考值範圍包括正常犬隻族群中95％個 體的數值，其結果中至少有一項不在正常參考值範圍內的機率為何？","opts":["A. 5％","B. (95％) 15","C. 1-(95％) 15","D. 1-(5％) 15"],"ans":2,"exp":"若每項檢測有95%機率在正常範圍（5%機率異常），15項相互獨立時，「至少一項異常」的機率：P = 1 - P(全部正常) = 1 - (0.95)^15。這說明即使健康動物，同時做多項檢測時也很可能有至少一項超出正常範圍（約54%機率）。","we":["A. 5%只是單一項目超出範圍的機率，非15項都測時的綜合機率。","B. (95%)^15是「15項全在正常範圍內」的機率，而非「至少一項異常」。","C. 正確：至少一項異常=1-(全部正常的機率)=1-(0.95)^15≈0.537，即約54%機率。","D. 1-(5%)^15≈1，此為15項全部異常的機率極端情況，與問題意義不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_023","year":2025,"roc_year":114,"session":"","examNo":23,"q":"在疾病控制計畫初期和後期，應分別利用具何種特性的試驗方法進行疾病檢測最適當？","opts":["A. 初期：高敏感性；後期：高特異性","B. 初期：低敏感性；後期：高特異性","C. 初期：高特異性；後期：低敏感性","D. 初期：低特異性；後期：高敏感性"],"ans":0,"exp":"疾病控制計畫初期：族群中疾病盛行率高，需「高敏感性」試驗廣泛偵測所有病例（避免漏診，盡快找出患病個體）。後期：疾病盛行率已降低，需「高特異性」試驗確認剩餘病例（避免偽陽性，減少無謂的撲殺）。","we":["A. 正確：初期高敏感性（不漏掉病例）→後期高特異性（確認真正陽性，減少誤判）。","B. 初期應高敏感性而非低敏感性；低敏感性會漏掉大量病例，無法有效控制疫情。","C. 初期高特異性會漏掉大量病例；後期低敏感性無法有效確認殘存病例，兩者相反。","D. 後期應高特異性而非高敏感性；此時疫情趨緩，需準確確認少數剩餘病例，高特異性更重要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_024","year":2025,"roc_year":114,"session":"","examNo":24,"q":"某單位欲從國外進口5隻犬隻，並希望供應者提供犬隻未受犬心絲蟲感染的證明，此時對所提供的檢測報告最不希望有下列何種情形？","opts":["A. 高的陽性預測值","B. 高的陰性預測值","C. 偽陽性","D. 偽陰性"],"ans":3,"exp":"要證明犬隻未受犬心絲蟲感染，最不希望發生的是「偽陰性（false negative）」——即犬隻實際上已感染，但檢測結果為陰性，使帶原犬入境。偽陰性=高危險：允許感染犬以「陰性」身分通關。","we":["A. 高陽性預測值代表陽性結果是真陽性，對此情境（要找出感染犬）有利，不是最不希望的。","B. 高陰性預測值代表陰性結果是真陰性（確實未感染），正是所需，不是最不希望的。","C. 偽陽性（false positive）：未感染犬被判為陽性，需多做確認試驗，造成困擾但不危害公衛。","D. 正確：偽陰性（false negative）最危險——感染犬被誤判為未感染，使其入境傳播犬心絲蟲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_025","year":2025,"roc_year":114,"session":"","examNo":25,"q":"承上題，若國內單位欲再對此批犬隻進行犬心絲蟲感染的檢測，此時應優先選擇具下列何種檢測特性的檢測方法？","opts":["A. 高敏感性","B. 高特異性","C. 高的陽性預測值","D. 高的陰性預測值"],"ans":0,"exp":"國內單位對已「通過」進口的犬隻再次檢測，需要最大程度找出被漏掉的感染犬，應優先選擇「高敏感性」的試驗——減少偽陰性，確保真正感染的犬不被遺漏。在此情境下，避免偽陰性（漏失感染個體）最重要。","we":["A. 正確：高敏感性→偽陰性少→不漏掉感染犬；在篩選感染（尤其已清除一批「陰性」犬後複查）時，敏感性最關鍵。","B. 高特異性減少偽陽性，但此情境主要擔心偽陰性（漏失感染犬），特異性非首要考量。","C. 高陽性預測值受盛行率影響，在低盛行率族群中不一定高；且非針對「不漏失感染」的最直接指標。","D. 高陰性預測值是目標結果，但要達到高NPV，需要高敏感性的試驗方法，D是結果而非選擇依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_026","year":2025,"roc_year":114,"session":"","examNo":26,"q":"根據世界動物衛生組織《陸生動物衛生法典》，下列有關撲滅政策（stamping-out policy）的敘述，何者錯誤？","opts":["A. 撲滅政策並非適用於所有經濟動物傳染病的控制","B. 撲滅進行時，應將受影響區域中所有易感性物種撲殺","C. 撲滅計畫通常包含對受感染動物的撲殺、受感染場所的清潔消毒等措施","D. 撲滅計畫的實施需考量經濟成本、動物福利等因素"],"ans":1,"exp":"根據世界動物衛生組織（WOAH/OIE）《陸生動物衛生法典》，撲滅政策（stamping-out）針對的是受感染場所（infected premises）內的動物，而非「受影響區域（affected zone）中所有易感性物種」。選項B混淆了「affected premises」（受感染場所）與「affected zone」（疫區），後者範圍更廣，不一定需全部撲殺。","we":["A. 撲滅政策確實非適用所有疾病；對某些傳播緩慢或疫苗可有效控制的疾病，可採其他策略，此選項正確。","B. 錯誤：撲滅針對受感染場所（premises），不是整個受影響區域（zone）的所有易感性物種；混淆了場所與區域的概念。","C. 撲滅計畫確實包含撲殺受感染動物、清潔消毒（cleaning and disinfection），正確。","D. 撲滅計畫需評估經濟成本、動物福利、公眾接受度等因素，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_027","year":2025,"roc_year":114,"session":"","examNo":27,"q":"動物感染病原體之後，到開始排毒、具有傳染力之前，稱為什麼時期？","opts":["A. 繫留期（holding period）","B. 檢疫期（quarantine period）","C. 潛伏期（incubation period）","D. 潛藏期（latent period）"],"ans":3,"exp":"潛藏期（latent period）：從感染到個體開始排出病原體、具有傳染力的期間。潛伏期（incubation period）：從感染到出現臨床症狀的期間。兩者不同：潛藏期結束=開始具傳染力；潛伏期結束=出現症狀。有些疾病在出現症狀前就具傳染力（如流感），即潛藏期<潛伏期。","we":["A. 繫留期（holding period）：動物在入境或移動前的暫時扣留期，非疾病生物學概念。","B. 檢疫期（quarantine period）：為防止疾病傳播，對可能暴露的動物進行隔離觀察的期間。","C. 潛伏期（incubation period）：從感染到出現臨床症狀的時間，非到開始排毒的時間。","D. 正確：潛藏期（latent period）指感染後到開始具傳染力（排毒）之前的時期；此期間個體已感染但尚未成為傳染源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_028","year":2025,"roc_year":114,"session":"","examNo":28,"q":"在流行病學的病因模式中，下列那一種圖表適合用來表示疾病危險因子間為單獨作用或具有交互作用？","opts":["A. 圓餅圖（pie chart）","B. 列聯表（contingency table）","C. 范氏圖（Venn diagram）","D. 盒鬚圖（box plot）"],"ans":2,"exp":"范氏圖（Venn diagram）以重疊的圓圈表示不同集合（危險因子）的單獨作用與交互作用：圓圈重疊區域代表危險因子間的交互作用（interaction），非重疊區域代表單獨效應。這是流行病學病因模式中表示多因子獨立或交互作用最直觀的工具。","we":["A. 圓餅圖（pie chart）顯示各部分佔整體的比例，不適合表示危險因子間的交互關係。","B. 列聯表（contingency table）顯示兩分類變數的聯合頻率分布，可計算關聯性，但不直觀表示危險因子的單獨vs交互作用。","C. 正確：范氏圖（Venn diagram）透過圓圈重疊視覺化呈現危險因子間的單獨效應與交互作用，是病因模式的標準圖示。","D. 盒鬚圖（box plot）顯示連續變數的分布（中位數、四分位距、離群值），不適用於因子關係表示。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_029","year":2025,"roc_year":114,"session":"","examNo":29,"q":"於動物檢體發現人畜共通傳染病的疑似案例，由下列何者進行檢診確認？","opts":["A. 農業部獸醫研究所","B. 農業部動植物防疫檢疫署","C. 財團法人農業科技研究院動物科技研究所","D. 衛生福利部疾病管制署"],"ans":0,"exp":"農業部獸醫研究所（VRI）是台灣動物疾病（含人畜共通傳染病）的國家級參考診斷實驗室，負責從動物檢體確認重要疾病。防疫檢疫署負責防疫政策執行；疾管署負責人的疾病確認；農科院動科所屬研究機構，非官方疾病確認機關。","we":["A. 正確：農業部獸醫研究所為動物疾病國家參考實驗室，從動物檢體進行人畜共通傳染病的確認診斷。","B. 農業部動植物防疫檢疫署（防檢署）負責動物防疫政策、疫情管理及邊境檢疫，非主要執行確認診斷的單位。","C. 財團法人農業科技研究院動物科技研究所屬半官方研究機構，非動物疾病官方確認診斷機關。","D. 衛生福利部疾管署（CDC）負責人類傳染病確認，非動物檢體的確認機關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_030","year":2025,"roc_year":114,"session":"","examNo":30,"q":"動物屠體、內臟及其分切物自屠宰場運出交付食品業者生產供人食用之產物，依法由下列何者進行 衛生查核？","opts":["A. 農業主管機關","B. 衛生主管機關","C. 環保主管機關","D. 農業主管機關會同衛生主管機關"],"ans":1,"exp":"依食品安全衛生管理法（食安法），動物屠體離開屠宰場進入食品業者生產供人食用後，即屬食品原料，其衛生查核由「衛生主管機關」（衛生福利部及地方衛生局）負責。農業主管機關負責屠宰場內的屠宰衛生檢查。","we":["A. 農業主管機關負責屠宰場「場內」的衛生檢查（ante-mortem/post-mortem inspection），產品「運出後」交食品業者即轉由衛生主管機關。","B. 正確：屠體交付食品業者生產供人食用，屬食品衛生範疇，由衛生主管機關（食藥署/地方衛生局）查核。","C. 環保主管機關管廢棄物、環境污染，與食品衛生查核無關。","D. 農業會同衛生查核的情形（如緊急疫情）有之，但一般情況下進入食品流通後由衛生主管機關單獨負責。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_031","year":2025,"roc_year":114,"session":"","examNo":31,"q":"廢止或撤銷許可證之動物用藥品有影響動物或人體健康之虞時，下列何者得命動物用藥品製造業者 或販賣業者限期回收或銷毀該藥品？","opts":["A. 中央衛生主管機關","B. 中央農業主管機關","C. 當地衛生主管機關","D. 當地動物防疫主管機關"],"ans":1,"exp":"依動物用藥品管理法，廢止或撤銷動物用藥品許可證後有危害健康之虞，命令回收或銷毀的主管機關為「中央農業主管機關」（農業部）。動物用藥品管理屬農業部主管，非衛生主管機關。","we":["A. 中央衛生主管機關（衛生福利部）管理人用藥品（藥事法），動物用藥品由農業主管機關管轄。","B. 正確：動物用藥品管理法主管機關為中央農業主管機關（農業部），命令回收由其執行。","C. 當地衛生主管機關執行一般食品衛生稽查，不負責動物用藥品回收命令。","D. 當地動物防疫主管機關負責地方動物防疫事務，中央層級的動物用藥品回收命令由中央農業主管機關發出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_032","year":2025,"roc_year":114,"session":"","examNo":32,"q":"獸醫師（佐）執行業務時，發現重大人畜共通之動物傳染病應向誰通報？","opts":["A. 中央衛生主管機關","B. 中央動物防疫主管機關","C. 當地衛生主管機關","D. 當地動物防疫主管機關"],"ans":3,"exp":"依動物傳染病防治條例，獸醫師（佐）執行業務時發現重大動物傳染病（包括重大人畜共通傳染病），應向「當地動物防疫主管機關」通報。當地動物防疫主管機關（縣市政府動保防疫單位）為第一線動物疾病通報受理機關。","we":["A. 中央衛生主管機關（衛生福利部）為人類傳染病的中央主管機關，非獸醫師通報對象。","B. 中央動物防疫主管機關（農業部防檢署）接受逐級通報，但獸醫師應先向「當地（地方）」機關通報。","C. 當地衛生主管機關負責人類傳染病防制，非動物疾病通報對象。","D. 正確：獸醫師發現重大人畜共通動物傳染病應向「當地動物防疫主管機關」（縣市政府）通報，由其依程序逐級上報。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_033","year":2025,"roc_year":114,"session":"","examNo":33,"q":"動物用藥品的使用應遵守下列何項規範，以避免藥物殘留的發生？","opts":["A. 動物用藥品檢驗登記審查準則","B. 動物用藥品查驗辦法","C. 動物用藥品優良製造準則","D. 動物用藥品使用準則"],"ans":3,"exp":"「動物用藥品使用準則」規範動物用藥品的正確使用方式（劑量、途徑、停藥期等），是避免藥物殘留的直接法規依據。其他選項：檢驗登記審查準則管理藥品上市前審查；查驗辦法管理查驗程序；優良製造準則（GMP）管理製造過程。","we":["A. 動物用藥品檢驗登記審查準則：規範藥品上市前的審查程序，非使用階段的規範。","B. 動物用藥品查驗辦法：規範查驗登記的申請與審查，非使用規範。","C. 動物用藥品優良製造準則（GMP）：規範藥品製造過程的品質管制，非使用規範。","D. 正確：動物用藥品使用準則直接規範使用者（飼主、獸醫師）的正確用藥方式，包括停藥期遵守，是避免藥物殘留的核心法規。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_034","year":2025,"roc_year":114,"session":"","examNo":34,"q":"於超市牛肉中檢出出血性大腸桿菌後，應依據下列何項法令進行後續下架處置？","opts":["A. 食品中污染物質及毒素衛生標準","B. 動物用藥品管理法","C. 屠宰衛生檢查規則","D. 食品安全衛生管理法"],"ans":3,"exp":"在超市牛肉中檢出出血性大腸桿菌（如O157:H7）屬於食品安全事件，應依「食品安全衛生管理法（食安法）」進行下架、回收等處置。食安法授予衛生主管機關命令食品業者下架、回收、銷毀不安全食品的職權。","we":["A. 食品中污染物質及毒素衛生標準：設定污染物限量標準，是法規基礎，但「後續處置」授權在食安法。","B. 動物用藥品管理法：管理動物用藥品，不適用於食品中細菌污染事件的下架處置。","C. 屠宰衛生檢查規則：規範屠宰場內的屠宰衛生，已離開屠宰場進入市場的食品適用食安法。","D. 正確：食品安全衛生管理法授權衛生主管機關對市售不安全食品（含細菌污染）採取下架、回收處分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_035","year":2025,"roc_year":114,"session":"","examNo":35,"q":"為執行畜牧法查緝違法屠宰行為，各直轄市及縣（市）政府應組成「違法屠宰聯合查緝小組」，其 召集人建議由何人擔任？","opts":["A. 由直轄市、縣（市）政府秘書長（主任秘書）以上層級者擔任","B. 由直轄市、縣（市）政府首長指派適當人員擔任","C. 由直轄市、縣（市）政府畜牧法執行單位承辦科（課）長擔任","D. 由直轄市、縣（市）政府議會首長擔任"],"ans":0,"exp":"依農業部函示，各直轄市及縣（市）政府組成「違法屠宰聯合查緝小組」，其召集人建議由「秘書長（主任秘書）以上層級者」擔任，以確保跨局處協調的行政層級與執法權威。","we":["A. 正確：秘書長（主任秘書）以上層級具備跨機關協調能力，建議擔任召集人。","B. 首長指派雖有彈性，但法規建議具體層級，非「適當人員」的模糊指派。","C. 科（課）長層級偏低，跨局處協調能力不足，不符建議標準。","D. 議會首長屬立法機關，非行政執行機關的編制，不適合擔任行政執法召集人。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_036","year":2025,"roc_year":114,"session":"","examNo":36,"q":"化製場及化製原料運輸車消毒與查核的中央主管機關為何？","opts":["A. 農業部","B. 衛生福利部","C. 環境部","D. 經濟部"],"ans":0,"exp":"化製場及化製原料運輸車的消毒與查核，依廢棄物清理法及動物傳染病防治條例，中央主管機關為「農業部」。化製（rendering）涉及動物屍體及廢棄物處理，屬農業部主管範疇。","we":["A. 正確：農業部為化製場及運輸車消毒查核的中央主管機關。","B. 衛生福利部管人的食品、藥品及醫療衛生，不管動物化製作業。","C. 環境部管一般廢棄物與環境污染，動物化製屬農業主管。","D. 經濟部管產業、商業，非動物化製業務主管機關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_037","year":2025,"roc_year":114,"session":"","examNo":37,"q":"依據屠宰衛生檢查規則，家畜屠宰後檢查時，屠體呈顯著腥臭或特殊異味者應如何判定？","opts":["A. 合格","B. 稽留","C. 不合格","D. 隔離檢查"],"ans":2,"exp":"依屠宰衛生檢查規則，家畜屠宰後檢查時，屠體呈現「顯著腥臭或特殊異味」者，應判定為「不合格」（廢棄），不得供人食用。異常氣味代表腐敗或病變，對食品安全有直接威脅。","we":["A. 合格：顯著腥臭或異味屠體絕對不符合食品衛生標準，不得判合格。","B. 稽留（detained）：用於尚需進一步確認的可疑屠體，腥臭異味已達不合格標準，無需稽留。","C. 正確：依規定屠體呈顯著腥臭或特殊異味應判定「不合格」（廢棄），不得流入食品供應鏈。","D. 隔離檢查：用於待確認疾病的活畜禽（屠前）或需進一步確診的屠體，腥臭已達不合格，無需另行隔離。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_038","year":2025,"roc_year":114,"session":"","examNo":38,"q":"依據屠宰場設置標準，家禽屠宰場利用吊掛軌道時，其屠體應離開地面至少多少公分以上？","opts":["A. 90","B. 60","C. 40","D. 30"],"ans":3,"exp":"依屠宰場設置標準，家禽屠宰場利用吊掛軌道時，屠體應離開地面至少「30公分」以上，以避免接觸地面造成污染。家禽體型較小，30公分足以防止地面污染。（家畜規定較高，如牛隻需90公分以上。）","we":["A. 90公分：此高度適用於較大型家畜（如牛），非家禽吊掛軌道高度規定。","B. 60公分：非家禽場吊掛軌道的法規數字。","C. 40公分：非標準規定數字。","D. 正確：家禽屠宰場吊掛軌道屠體離地面至少30公分，防止地面污染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_039","year":2025,"roc_year":114,"session":"","examNo":39,"q":"依據屠宰衛生檢查合格標誌及標明方法，下圖屠宰衛生檢查合格標誌屬於何種樣式？","opts":["A. 甲式標誌","B. 乙式標誌","C. 丙式標誌","D. 丁式標誌"],"ans":0,"exp":"（此題含圖片，需參照原始試卷圖示作答。依屠宰衛生檢查合格標誌規定：甲式標誌為橢圓形、乙式為圓形、丙式為菱形、丁式為矩形。答案需對應題目所示圖片樣式。）","we":["A. 甲式標誌為橢圓形，含「合格」文字及場號等資訊。","B. 乙式標誌為圓形印章樣式。","C. 丙式標誌為菱形樣式。","D. 丁式標誌為矩形樣式。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_公衛_040","year":2025,"roc_year":114,"session":"","examNo":40,"q":"依據屠宰作業準則，屠宰過程，每處理一頭（隻）疑病畜禽之刀具及鋸子等工具應立即清洗，並用 攝氏幾度以上之熱水消毒？","opts":["A. 83","B. 72","C. 65","D. 56"],"ans":0,"exp":"依屠宰作業準則，屠宰過程每處理一頭（隻）疑病畜禽之刀具及鋸子等器具，應立即清洗並以攝氏「82度（≥82°C）以上」之熱水消毒至少10秒，選項中最接近且符合規定的是83°C。高溫熱水消毒可有效殺滅附著在器具上的病原菌，防止交叉污染。","we":["A. 正確：82-83°C以上熱水消毒器具，可有效殺滅大多數病原體，符合屠宰作業準則規定。","B. 72°C：為低溫殺菌（巴斯德殺菌）的標準溫度，尚不足以達到屠宰器具的消毒要求。","C. 65°C：溫度過低，無法有效消毒屠宰器具上的耐熱病原體。","D. 56°C：溫度不足，多數病原體在此溫度下仍可存活。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_041","year":2025,"roc_year":114,"session":"","examNo":41,"q":"依據屠宰作業準則，設施檢查維護紀錄與病媒及其他昆蟲之防治紀錄應保存至少多久時間？","opts":["A. 1個月","B. 6個月","C. 1年","D. 3年"],"ans":2,"exp":"依屠宰作業準則，設施檢查維護紀錄與病媒及其他昆蟲之防治紀錄應保存至少「1年」。此規定確保在突發疫情或稽查時，可追溯設施維護及病媒防治的歷史記錄。","we":["A. 1個月：保存期限過短，無法有效追溯設施維護及病媒防治情形。","B. 6個月：不符合屠宰作業準則的保存規定，時間不足。","C. 正確：設施維護紀錄與病媒防治紀錄應保存至少1年。","D. 3年：保存期限過長，超過屠宰作業準則的最低要求（3年的要求通常適用於其他類型的衛生記錄）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_042","year":2025,"roc_year":114,"session":"","examNo":42,"q":"依屠宰場設置標準，預冷設施應使屠體中心溫度於屠後18小時內降至攝氏多少度，以達到出場的標 準？","opts":["A. 15～20","B. 6～10","C. 0～5","D. -20以下"],"ans":2,"exp":"依屠宰場設置標準，預冷設施（chilling facility）應使屠體中心溫度於屠後18小時內降至「0～5°C」，以達到出場標準。0-5°C是冷藏肉品的標準溫度，可有效抑制微生物生長，延長肉品保存期限。","we":["A. 15～20°C：此溫度範圍仍在微生物（包括病原體）快速增殖的危險溫度帶，不符合食品安全要求。","B. 6～10°C：溫度偏高，食品衛生標準要求肉品冷藏溫度為7°C以下（或更低），6-10°C僅為上限。","C. 正確：0～5°C為肉品冷藏標準溫度，可有效控制微生物增殖，符合屠宰場設置標準規定。","D. -20以下：此為冷凍溫度，不是預冷（chilling）的目標溫度；預冷至0-5°C後若需冷凍再降至-18°C以下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_043","year":2025,"roc_year":114,"session":"","examNo":43,"q":"依據屠宰場設置標準，屠前檢查時隔離繫留欄距離地板上90公分處之照明光度至少為多少米燭光？","opts":["A. 100","B. 200","C. 300","D. 500"],"ans":1,"exp":"依屠宰場設置標準，屠前檢查時隔離繫留欄距離地板90公分處的照明光度至少為「200米燭光（lux）」，確保獸醫師可清楚觀察動物臨床狀況進行屠前健康檢查（ante-mortem inspection）。","we":["A. 100米燭光：光度不足，無法確保屠前檢查的視覺品質。","B. 正確：隔離繫留欄照明至少200米燭光（lux），符合屠前檢查需求。","C. 300米燭光：屠宰作業區域（宰殺線、內臟檢查）可能需要更高照度，隔離繫留欄規定為200。","D. 500米燭光：此高照度通常用於精密屠宰後檢查（post-mortem inspection）或分切作業區域。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_044","year":2025,"roc_year":114,"session":"","examNo":44,"q":"根據優良農產品水產品項目驗證基準規定及動物用藥殘留標準，有關四環黴素類在魚的肌肉殘留容 許量，下列何者正確？","opts":["A. oxytetracycline 0.2 ppm","B. tetracycline 0.2 ppm","C. chlortetracycline 0.2 ppm","D. 不得檢出"],"ans":0,"exp":"依台灣「動物用藥殘留標準」，oxytetracycline（土黴素）在魚的肌肉中殘留容許量（MRL）為0.2 mg/kg（ppm）。Oxytetracycline是台灣水產養殖中最常使用的四環黴素類藥物，其MRL已明確訂定。","we":["A. 正確：oxytetracycline在魚肌肉的MRL為0.2 ppm（mg/kg），為台灣動物用藥殘留標準規定值。","B. Tetracycline在台灣魚類MRL規定需查證，且此題測驗對OTC的認識；OTC是水產最常用四環黴素。","C. Chlortetracycline（氯四環黴素）較少用於台灣水產養殖，其MRL規定需另查。","D. 台灣對oxytetracycline等四環黴素在魚類已設定MRL（0.2 ppm），並非不得檢出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_045","year":2025,"roc_year":114,"session":"","examNo":45,"q":"依據優良農產品水產品項目驗證基準，有關生食用魚介類水產品需抽驗的微生物檢驗項目，下列何 者正確？","opts":["A. 腸炎弧菌（Vibrio parahaemolyticus）","B. 金黃色葡萄球菌（Staphylococcus aureus）","C. 單核球增多性李斯特菌（Listeria monocytogenes）","D. 創傷弧菌（Vibrio vulnificus）"],"ans":0,"exp":"依優良農產品（CAS）水產品驗證基準，生食用魚介類水產品需抽驗「腸炎弧菌（Vibrio parahaemolyticus）」。腸炎弧菌是台灣食品中毒最常見的病原菌之一，尤其與生食海鮮密切相關，是生食魚介類的關鍵衛生指標菌。","we":["A. 正確：腸炎弧菌（V. parahaemolyticus）是生食魚介類必驗項目，為台灣海鮮食品中毒主要病原。","B. 金黃色葡萄球菌（S. aureus）是加工食品的重要指標菌，但非生食魚介類的必驗項目（更常用於熟食加工品）。","C. 單核球增多性李斯特菌主要是乳製品和即食食品的指標菌，非水產品CAS驗證的主要項目。","D. 創傷弧菌（V. vulnificus）雖是重要海洋病原（致死率高），但CAS基準規定的抽驗項目以腸炎弧菌為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_046","year":2025,"roc_year":114,"session":"","examNo":46,"q":"依據優良農產品水產品項目驗證基準，冷凍水產品的中心溫度必須達到攝氏多少度以下？","opts":["A. -18","B. -7","C. -25","D. -50"],"ans":0,"exp":"依優良農產品（CAS）水產品驗證基準及食品安全衛生管理法，冷凍水產品的中心溫度必須達到「-18°C以下」。-18°C是國際公認的冷凍食品標準，可有效抑制微生物活動並維持食品品質。","we":["A. 正確：冷凍水產品中心溫度需維持-18°C以下，為國際通行冷凍食品標準。","B. -7°C：溫度不夠低，無法確保冷凍食品的安全性與品質（-7°C仍在微生物可緩慢生長的溫度範圍）。","C. -25°C：此溫度適用於生食用水產品（如生食鮪魚需-35°C以下）的超低溫保存，一般冷凍標準為-18°C。","D. -50°C：此為超低溫保存（如精液、生物樣本），遠超一般冷凍食品需求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_047","year":2025,"roc_year":114,"session":"","examNo":47,"q":"依據食品中微生物衛生標準，鮮乳產品中測得微生物菌量或其毒素的含量，下列何者符合規定？","opts":["A. 單核球增多性李斯特菌（Listeria monocytogenes）菌量為1 CFU/mL","B. 沙門氏桿菌（Salmonella）菌量為1 CFU/mL","C. 腸桿菌科（Enterobacteriaceae）菌量為1 CFU/mL","D. 金黃色葡萄球菌腸毒素（Staphylococcus aureus enterotoxin）含量為1 ng/mL"],"ans":2,"exp":"依食品中微生物衛生標準，鮮乳中：Listeria monocytogenes=不得檢出；Salmonella=不得檢出；腸桿菌科（Enterobacteriaceae）=有容許限量（如≤10 CFU/mL）；S. aureus腸毒素=0.5 ng/g以下。因此只有腸桿菌科1 CFU/mL可能符合規定，其餘三者均要求不得檢出（1 CFU/mL即超標）。","we":["A. Listeria monocytogenes在鮮乳中要求「不得檢出」，1 CFU/mL即超標，不符規定。","B. Salmonella在鮮乳中要求「不得檢出」，1 CFU/mL即超標，不符規定。","C. 正確：腸桿菌科在鮮乳中有容許限量，1 CFU/mL可能在規定範圍內，符合規定。","D. 金黃色葡萄球菌腸毒素限量為0.5 ng/g（約0.5 ng/mL），1 ng/mL已超標，不符規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_048","year":2025,"roc_year":114,"session":"","examNo":48,"q":"依據食品中污染物質及毒素衛生標準，牛乳中下列那一種真菌毒素能容許限量（0.5 μg/kg）檢 出？","opts":["A. 黃麴毒素M 1","B. 赭麴毒素A","C. 伏馬毒素B 1 +B 2","D. 棒麴毒素"],"ans":0,"exp":"依台灣食品中污染物質及毒素衛生標準，牛乳中「黃麴毒素M1（Aflatoxin M1）」的容許量為0.5 μg/kg（即0.5 ppb）。黃麴毒素M1是黃麴毒素B1在動物體內的代謝產物，可分泌至乳汁中，為乳品中最重要的真菌毒素污染物。","we":["A. 正確：黃麴毒素M1（AFM1）在牛乳中的容許限量為0.5 μg/kg，這是台灣與Codex的規定。","B. 赭麴毒素A（OTA）主要污染穀物、咖啡，牛乳中的污染較少，其限量規定與AFM1不同。","C. 伏馬毒素B1+B2主要污染玉米，對乳品影響有限，規定限量與0.5 μg/kg不符。","D. 棒麴毒素（Patulin）主要污染蘋果汁等果汁類，非乳品中主要真菌毒素，限量標準不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_049","year":2025,"roc_year":114,"session":"","examNo":49,"q":"依據中華民國國家標準CNS 3055生乳標準，加工製程前生乳貯乳槽（桶）中生牛乳生菌數須在多少單位（CFU/mL）以下？","opts":["A. 1×10 3","B. 1×10 4","C. 1×10 5","D. 1×10 6"],"ans":2,"exp":"依中華民國國家標準CNS 3055，加工製程前生乳貯乳槽中生牛乳的生菌數標準：Grade A生乳應在1×10^5 CFU/mL（100,000 CFU/mL）以下。此標準確保原料乳的微生物品質，是乳品加工的重要前提條件。","we":["A. 1×10^3 CFU/mL：此標準過嚴，一般原料生乳難以達到此水準。","B. 1×10^4 CFU/mL：此為優級生乳的較嚴格標準，一般Grade A的要求為10^5以下。","C. 正確：CNS 3055 Grade A生乳生菌數≤1×10^5 CFU/mL（100,000 CFU/mL）。","D. 1×10^6 CFU/mL：標準過低，此微生物量表示生乳品質不佳，超出加工前應有的衛生要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_050","year":2025,"roc_year":114,"session":"","examNo":50,"q":"依據優良農產品乳品項目驗證基準，下列敘述何者正確？","opts":["A. 進行酒精試驗是評估生乳中微生物含量的方法","B. 進行美藍還原試驗是測定生乳中蛋白質的安定性","C. 生乳當被製成鮮乳後，戴奧辛不得檢出","D. 生乳當被製成鮮乳後，酸度應在0.18％以下"],"ans":3,"exp":"依優良農產品（CAS）乳品驗證基準，鮮乳（pasteurized milk）的酸度應在0.18%以下（以乳酸計）。酒精試驗評估牛乳的熱穩定性（蛋白質穩定性），而非微生物含量；美藍還原試驗評估微生物代謝活性（間接反映菌量）。","we":["A. 酒精試驗（alcohol test）評估生乳中蛋白質的「熱穩定性」，非直接評估微生物含量；酸度高或礦物質不平衡的牛乳酒精試驗呈陽性（凝固）。","B. 美藍還原試驗（methylene blue reduction test）評估細菌還原酶活性（間接反映微生物量），非測定「蛋白質安定性」。","C. 台灣對鮮乳中戴奧辛（dioxins）設有容許量標準（而非不得檢出），此選項錯誤。","D. 正確：鮮乳酸度（titratable acidity）應在0.18%以下（以乳酸計），此為CAS乳品基準規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_051","year":2025,"roc_year":114,"session":"","examNo":51,"q":"依據優良農產品蛋品項目驗證基準，皮蛋微生物檢驗項目不包括下列何者？","opts":["A. 黴菌及酵母菌","B. 生菌數","C. 沙門氏桿菌","D. 金黃色葡萄球菌"],"ans":0,"exp":"依優良農產品（CAS）蛋品驗證基準，皮蛋（preserved eggs/century eggs）微生物檢驗項目包括：生菌數、沙門氏桿菌、金黃色葡萄球菌。皮蛋製程為強鹼環境（pH>12），可有效抑制黴菌及酵母菌，因此「黴菌及酵母菌」不在皮蛋必驗項目中。","we":["A. 正確：黴菌及酵母菌在皮蛋的強鹼製程中受到抑制，不在CAS皮蛋微生物必驗項目中。","B. 生菌數（total plate count）是皮蛋必驗微生物項目之一，故不是「不包括」的選項。","C. 沙門氏桿菌是皮蛋必驗項目（因禽蛋常見沙門氏菌污染），故不是「不包括」的選項。","D. 金黃色葡萄球菌是皮蛋必驗項目之一，故不是「不包括」的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_052","year":2025,"roc_year":114,"session":"","examNo":52,"q":"依據優良農產品蛋品項目驗證基準，下列液蛋產品的微生物檢驗何者必須為陰性？","opts":["A. 大腸桿菌群","B. 沙門氏桿菌","C. 生菌數","D. 黴菌與酵母菌"],"ans":1,"exp":"依優良農產品（CAS）蛋品驗證基準，液蛋產品中「沙門氏桿菌（Salmonella）」必須為陰性（不得檢出）。沙門氏桿菌是禽蛋相關食品中毒最重要的病原，液蛋加工需確保絕對無沙門氏菌。其他指標菌（大腸桿菌群、生菌數、黴菌酵母菌）有數值限量。","we":["A. 大腸桿菌群（coliforms）有容許限量（如≤10 CFU/g），非必須陰性。","B. 正確：沙門氏桿菌在液蛋產品中必須「陰性（不得檢出）」，為食品安全絕對要求。","C. 生菌數有容許限量，非必須陰性。","D. 黴菌與酵母菌有容許限量，非必須陰性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_053","year":2025,"roc_year":114,"session":"","examNo":53,"q":"根據食品中戴奧辛及多氯聯苯處理規範，雞蛋中戴奧辛與戴奧辛類多氯聯苯含量總和的限值為下列何者？","opts":["A. 1.0 pg/g fat","B. 2.5 pg/g fat","C. 5.0 pg/g fat","D. 7.5 pg/g fat"],"ans":2,"exp":"依台灣「食品中戴奧辛及多氯聯苯處理規範」，雞蛋中戴奧辛（dioxins）與戴奧辛類多氯聯苯（dioxin-like PCBs）含量「總和」的限值為「5.0 pg TEQ/g fat」，與歐盟規定相近。","we":["A. 1.0 pg/g fat：低於台灣規定限值，可能為某些特殊高敏感族群的建議值，非法規限值。","B. 2.5 pg/g fat：此為雞蛋中「單獨戴奧辛」（不含DL-PCBs）的限值，非總和限值。","C. 正確：雞蛋中戴奧辛+戴奧辛類多氯聯苯總和限值為5.0 pg TEQ/g fat。","D. 7.5 pg/g fat：超過台灣規定的限值，此數值可能適用於其他動物性產品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_054","year":2025,"roc_year":114,"session":"","examNo":54,"q":"依據優良農產品蛋品項目驗證基準，蛋個體重量若為50公克，其分級代號應為下列何者？","opts":["A. S","B. M","C. L","D. LL"],"ans":1,"exp":"依優良農產品（CAS）蛋品驗證基準，蛋的重量分級：S級（小）=40-49g；M級（中）=50-59g；L級（大）=60-69g；LL級（超大）=70g以上。50公克的蛋屬於M級。","we":["A. S級（小）：重量範圍40-49g，50g不在此範圍。","B. 正確：M級（中）：重量範圍50-59g，50g符合M級標準。","C. L級（大）：重量範圍60-69g，50g不在此範圍。","D. LL級（超大）：重量≥70g，50g不在此範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_055","year":2025,"roc_year":114,"session":"","examNo":55,"q":"依動物用藥品管理法之定義，下列何者屬於動物用藥品？①供預防動物疾病之抗生素原料藥 ②牧場病媒防治用之殺蟲劑 ③經中央主管機關公告專供診斷動物疾病之診斷劑 ④用於畜舍禽舍內環境表面之消毒劑","opts":["A. ①③④","B. ①②③","C. ①②④","D. ②③④"],"ans":0,"exp":"依動物用藥品管理法第3條定義，動物用藥品包含：①抗生素原料藥（預防/治療動物疾病）、③中央主管機關公告的診斷劑、④畜舍環境消毒劑（用於動物飼養環境）均屬動物用藥品。②牧場病媒防治用殺蟲劑屬農藥或環境用藥管理範疇，非動物用藥品。故①③④正確。","we":["A. 正確：①抗生素原料藥、③公告診斷劑、④畜舍消毒劑均屬動物用藥品管理法定義範圍。","B. ①②③：②牧場病媒用殺蟲劑屬農藥或環境用藥（非動物用藥品），故B錯誤。","C. ①②④：②病媒殺蟲劑非動物用藥品，故C錯誤。","D. ②③④：②病媒殺蟲劑非動物用藥品，故D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_056","year":2025,"roc_year":114,"session":"","examNo":56,"q":"下列有關動物用藥品停藥期的觀念，何者最適當？","opts":["A. 建立停藥期時所採用的標的殘留物應以代謝產物為主","B. 藥物停藥期之訂定需考慮殘留容許量","C. 二種以上動物用藥品合併投予動物時，其停藥期為兩藥個別停藥期之平均","D. 停藥期是指最後一次給藥後可食組織皆完全測不到藥物所需的時間"],"ans":1,"exp":"停藥期（withdrawal period）的訂定必須考慮殘留容許量（MRL）：停藥期的長短確保在此時間後，動物可食組織中的藥物殘留量降至MRL以下。停藥期不是「測不到任何藥物」的時間，而是「低於MRL」的時間。","we":["A. 標的殘留物（marker residue）可能是母體藥物或代謝物，依各藥物的殘留動力學特性決定，並非一定以代謝物為主。","B. 正確：停藥期訂定需考慮MRL（殘留容許量）——確保屠宰時殘留量低於MRL，保護消費者。","C. 兩種以上藥品合用時，應採「較長」的停藥期（取最大值），而非兩者平均，以確保安全。","D. 停藥期是殘留量降至MRL以下所需時間，不是「完全測不到」所需時間（零殘留是不切實際的概念）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_057","year":2025,"roc_year":114,"session":"","examNo":57,"q":"有關動物用藥殘留容許量的敘述，下列何者最適當？","opts":["A. 由農業部依動物試驗數據計算並交衛生福利部公告","B. 其訂定與該藥物在組織的殘留時間長短有關","C. 雖然其訂定的主要考量是藥物毒性，但各國殘留容許量標準不一定一致","D. 為考量肝腎為藥物代謝主要器官，應設更低的容許量以維安全"],"ans":2,"exp":"動物用藥殘留容許量（MRL）雖以毒性（ADI=每日可接受攝入量）為主要訂定依據，但各國因食物消費模式、安全係數、評估方法不同，MRL值可能有所差異，各國標準不一定一致。台灣MRL由農業部公告，非衛生福利部。","we":["A. MRL由農業部依動物藥品試驗數據訂定並公告，非「交衛生福利部公告」；程序描述錯誤。","B. 停藥期訂定與殘留時間有關，但MRL（容許量）訂定主要依據毒理學（ADI），非殘留時間長短。","C. 正確：各國MRL以毒性評估為主要考量，但因食物攝取量假設、安全係數等因素不同，各國標準可能不一致。","D. 肝、腎為藥物代謝主要器官，殘留量通常較肌肉「高」，因此其MRL值通常「高於」肌肉，而非「更低的容許量」（更嚴格）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_058","year":2025,"roc_year":114,"session":"","examNo":58,"q":"下列何者不屬於直接傳播型人畜共通傳染病（orthozoonosis）？","opts":["A. 馬爾堡病（Marburg disease）","B. M痘（Mpox）","C. 黃熱病（yellow fever）","D. 羊接觸傳染性化膿性口炎（contagious pustular dermatitis）"],"ans":2,"exp":"直接傳播型人畜共通傳染病（orthozoonosis）是指病原體直接從脊椎動物傳播給人，不需中間宿主或無生命媒介。黃熱病（yellow fever）由蚊子（Aedes aegypti）傳播，屬媒介傳播型（cyclozoonosis/metazoonosis），不是直接傳播型。","we":["A. 馬爾堡病（Marburg disease）：接觸感染動物（蝙蝠、非人靈長類）的血液/分泌物直接傳播，屬orthozoonosis。","B. M痘（Mpox）：直接接觸感染動物（齧齒類）的皮膚病變或體液傳播，屬orthozoonosis。","C. 正確：黃熱病由埃及斑蚊（Aedes aegypti）等蚊子傳播，需要媒介（vector），屬cyclozoonosis，非直接傳播型orthozoonosis。","D. 羊接觸傳染性化膿性口炎（orf/contagious ecthyma）：直接接觸感染羊的皮膚病變傳播，屬orthozoonosis。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_059","year":2025,"roc_year":114,"session":"","examNo":59,"q":"下列何種人畜共通病原主要以小型齧齒類動物為保毒儲主？①壁蝨媒介性腦炎（tick-borne encephalitis, TBE） ②亨德拉病毒（Hendra virus） ③M痘病毒（Mpox virus） ④伊波拉病 毒（Ebola virus） ⑤馬爾堡病毒（Marburg virus）","opts":["A. ①②","B. ①③","C. ②③","D. ④⑤"],"ans":1,"exp":"以小型齧齒類動物為主要保毒儲主（reservoir）：①壁蝨媒介性腦炎（TBE）：田鼠、松鼠等小型齧齒類是主要儲主；③Mpox病毒：非洲松鼠、岡比亞巨鼠等小型囓齒類是自然儲主。②亨德拉病毒儲主=果蝠；④伊波拉病毒儲主=蝙蝠；⑤馬爾堡病毒儲主=埃及果蝠。故①③=B。","we":["A. ①②：①正確（齧齒類），②亨德拉病毒儲主為果蝠（flying foxes），非齧齒類，組合錯誤。","B. 正確：①TBE儲主=小型齧齒類（田鼠等）；③Mpox儲主=非洲小型齧齒類（松鼠、岡比亞鼠等）。","C. ②③：②亨德拉病毒儲主非齧齒類，組合錯誤。","D. ④⑤：伊波拉（蝙蝠）和馬爾堡（埃及果蝠）儲主均為蝙蝠，非小型齧齒類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_060","year":2025,"roc_year":114,"session":"","examNo":60,"q":"下列有關立百病毒（Nipah virus）感染症之敘述，何者正確？","opts":["A. 首發於澳大利亞，爾後傳至馬來西亞","B. 除了感染豬，也可感染人、狗、貓以及馬","C. 感染豬隻呈現症狀為急性腦炎，為高傳染率、高致死性的疾病","D. 齧齒類動物為主要傳播媒介"],"ans":1,"exp":"立百病毒（Nipah virus）最初於1998-99年在馬來西亞豬場工人中爆發（非澳大利亞）。除豬外，Nipah可感染人、狗（blood seropositive）、貓，以及馬（部分報告顯示可感染）。儲主為果蝠（Pteropus屬）。豬感染呈呼吸道症狀（barking pig syndrome），並非單純腦炎。","we":["A. 首發於馬來西亞（Sungai Nipah村莊，1998-99年），非澳大利亞；亨德拉病毒（Hendra virus）首發於澳大利亞。","B. 正確：Nipah除豬外可感染人、狗、貓及馬，感染範圍廣泛（多種哺乳動物均可感染）。","C. 豬感染Nipah主要呈「呼吸道症狀」（barking cough=吠咳）而非「急性腦炎」；腦炎主要見於人類感染；且豬的致死率不高。","D. 立百病毒的主要保毒儲主（natural reservoir）為「果蝠（Pteropus屬，flying foxes）」，非齧齒類動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_061","year":2025,"roc_year":114,"session":"","examNo":61,"q":"下列有關牛痘（cowpox）之敘述，何者錯誤？","opts":["A. 病毒之基因體為DNA，歸類為Orthopoxvirus屬","B. 病毒感染潛伏期長達數星期","C. 除了感染牛，此病毒有可能藉由貓傳播而感染人","D. 主要發生在英國以及歐洲"],"ans":1,"exp":"牛痘病毒（cowpox virus）的潛伏期約為9-10天（約1.5週），而非「數星期」（數星期通常指2-3週以上）。牛痘確為Orthopoxvirus屬DNA病毒；貓確為英國牛痘病毒的重要傳播媒介；主要流行於英國及歐洲西部。","we":["A. 牛痘病毒基因體為雙股DNA（dsDNA），歸類為Orthopoxvirus屬，正確。","B. 錯誤：牛痘潛伏期約9-10天（不到2週），選項稱「數星期」明顯過長；痘病毒感染潛伏期通常1-2週。","C. 貓是英國牛痘病毒傳播給人的重要媒介（貓捕獵感染的嚙齒類後再傳給人），正確。","D. 牛痘主要見於英國及歐洲，尤其在西北歐，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_062","year":2025,"roc_year":114,"session":"","examNo":62,"q":"下列關於西尼羅熱之敘述，何者錯誤？","opts":["A. 1999年傳入美國","B. 壁蝨是主要的傳染媒介","C. 感染美國烏鴉及馬，造成高致死率","D. 大部分人的病例並無明顯症狀"],"ans":1,"exp":"西尼羅熱（West Nile fever）的主要傳染媒介是「蚊子（Culex屬）」，而非壁蝨。西尼羅病毒屬黃病毒科，以鳥類為主要儲主，蚊子（尤其Culex pipiens）叮咬鳥類後再叮人或馬，造成傳播。壁蝨傳播的腦炎是TBE（壁蝨媒介性腦炎）。","we":["A. 西尼羅病毒於1999年首次傳入美國（紐約），後迅速擴散至全美，正確。","B. 錯誤：西尼羅熱的主要傳播媒介是「蚊子（Culex屬）」，壁蝨不是WNV的傳播媒介。","C. 西尼羅病毒感染美國烏鴉（American crow）造成高致死率，馬也有高致死率，正確。","D. 約80%的人感染者無明顯症狀，約20%出現輕症，<1%出現嚴重神經症狀，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_063","year":2025,"roc_year":114,"session":"","examNo":63,"q":"下列有關伊波拉病毒感染症的敘述，何者錯誤？","opts":["A. 可透過接觸病毒污染之血液、分泌物、排泄物或唾液感染","B. 主要藉由空氣傳染","C. 人感染時，初期呈現類嚴重感冒症狀，胸腹部疼痛及吐血","D. 目前認為蝙蝠為此病原之自然界主要保毒儲主"],"ans":1,"exp":"伊波拉病毒（Ebola virus）主要透過「直接接觸感染者的血液、體液、分泌物、排泄物」傳播，並非藉由空氣（airborne）傳染。伊波拉不會在普通空氣中傳播，這與流感或麻疹不同；需要密切接觸才會感染。","we":["A. 伊波拉透過接觸感染者血液、分泌物、排泄物（包括唾液）傳播，正確。","B. 錯誤：伊波拉不是空氣傳播（non-airborne）；傳播需要直接接觸受污染的體液，非懸浮微粒傳播。","C. 伊波拉初期症狀類似嚴重感冒（發燒、頭痛、肌痛），後出現胸腹疼痛、出血（包括吐血），正確。","D. 目前認為蝙蝠（尤其果蝠Pteropus屬）為伊波拉病毒的自然儲主，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_064","year":2025,"roc_year":114,"session":"","examNo":64,"q":"下列何者為傳播俄羅斯及中歐春夏腦炎（Russian and central European spring-summer encephalitis）的主要病媒？","opts":["A. 蚤","B. 蝨","C. 蜱","D. 蚊"],"ans":2,"exp":"俄羅斯及中歐春夏腦炎（tick-borne encephalitis, TBE）是由TBE病毒（黃病毒科）引起，主要傳播媒介是「蜱（壁蝨，ticks）」——歐洲為蓖麻硬蜱（Ixodes ricinus），俄羅斯/亞洲為全溝硬蜱（Ixodes persulcatus）。名稱中的「spring-summer」反映蜱活躍的季節。","we":["A. 蚤（flea）傳播的疾病包括鼠疫（Yersinia pestis）、地方性斑疹傷寒等，非TBE。","B. 蝨（louse）傳播流行性斑疹傷寒（Rickettsia prowazekii）、戰壕熱等，非TBE。","C. 正確：蜱（tick）是TBE的傳播媒介，Ixodes屬硬蜱為主；「春夏腦炎」名稱即反映蜱活躍的春夏季節。","D. 蚊（mosquito）傳播西尼羅熱、日本腦炎、黃熱病、登革熱等黃病毒，但TBE由蜱傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_065","year":2025,"roc_year":114,"session":"","examNo":65,"q":"由罹患結核病之乳牛場工作人員分離出多重抗藥性（multi-drug resistance, MDR）牛型結核分枝 桿菌，此病應屬於衛生福利部公告之第幾類傳染病？","opts":["A. 第一類","B. 第二類","C. 第三類","D. 第四類"],"ans":2,"exp":"台灣衛生福利部依傳染病防治法，「結核病（tuberculosis）」被列為「第三類傳染病」，包括牛型結核分枝桿菌（M. bovis）感染人的病例（zoonotic TB）。多重抗藥性（MDR）TB仍屬結核病，應依第三類規定通報。","we":["A. 第一類傳染病（如鼠疫、伊波拉、SARS）為致命性高、需立即通報且緊急處置的疾病，結核病非第一類。","B. 第二類傳染病（如SARS後、禽流感、狂犬病）為重要公衛威脅，需24小時內通報，結核病非第二類。","C. 正確：結核病（含MDR-TB、牛型結核等）為第三類傳染病，確診後應於24小時內通報衛生主管機關。","D. 第四類傳染病（如退伍軍人病、梅毒、愛滋病）通報時限較寬，結核病不屬第四類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_066","year":2025,"roc_year":114,"session":"","examNo":66,"q":"主要藉由食入污染乳製品而感染之人畜共通疾病，下列何者正確？","opts":["A. Vibrio vulnificus infection","B. ehrlichiosis","C. listeriosis","D. tularemia"],"ans":2,"exp":"李斯特菌症（listeriosis）的病原Listeria monocytogenes廣泛存在於環境和食物中，尤其是「未殺菌乳製品（raw milk、soft cheese）」、即食食品等，主要藉由食入污染乳製品傳播。李斯特菌可在冰箱低溫下生長，對免疫低下者（孕婦、老人）危險性高。","we":["A. Vibrio vulnificus infection（創傷弧菌）：主要透過食入生牡蠣等海鮮，或傷口接觸海水傳播，與乳製品無關。","B. Ehrlichiosis：由蜱傳播的立克次體病（Ehrlichia屬），非食物傳播。","C. 正確：Listeriosis（李斯特菌症）主要藉由食入污染的乳製品（尤其未殺菌soft cheese、raw milk）傳播。","D. Tularemia（土拉倫斯病）：主要透過接觸感染兔子/齧齒類、節肢動物叮咬或吸入傳播，非乳製品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_067","year":2025,"roc_year":114,"session":"","examNo":67,"q":"下列何者為主要好發於羊之分娩生產季節的人畜共通疾病？","opts":["A. Q fever","B. plague","C. leptospirosis","D. epidemic typhus fever"],"ans":0,"exp":"Q fever（貝氏立克次體病，Coxiella burnetii）好發於羊（及山羊、牛）的分娩/生產季節，因為分娩時會大量排出Coxiella（胎盤、羊水、陰道分泌物含高濃度病原），造成周遭工作人員的季節性感染高峰。","we":["A. 正確：Q fever（Q熱）在羊、山羊分娩季節（春季）大爆發，分娩時病原大量釋出，造成牧場工人季節性感染。","B. Plague（鼠疫）：由鼠蚤傳播，與羊的生產季節無關。","C. Leptospirosis（鉤端螺旋體病）：主要透過接觸受污染的水和土壤，與特定繁殖季節無強烈關聯。","D. Epidemic typhus（流行性斑疹傷寒）：由人體蝨（Pediculus humanus）傳播，與動物生產季節無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_068","year":2025,"roc_year":114,"session":"","examNo":68,"q":"人畜共通土拉倫斯病之病原具有下列何種特性？","opts":["A. 具高度運動性","B. 能產生芽孢污染環境","C. 兔子主要被Francisella novicida亞種感染","D. 可經由節肢動物叮咬而傳播"],"ans":3,"exp":"Francisella tularensis（土拉倫斯病病原）的特性：無運動性（non-motile）、不形成芽孢、是革蘭陰性小球桿菌，但可透過節肢動物（蜱、鹿蠅）叮咬傳播。F. tularensis有兩個主要亞種（tularensis和holarctica），F. novicida對人類毒力較低。","we":["A. Francisella tularensis為非運動性（non-motile），不具鞭毛，無高度運動性。","B. Francisella不形成芽孢（non-spore-forming），但對環境有一定抵抗力，可在土壤和水中存活。","C. 兔子主要被F. tularensis tularensis（Type A）或F. tularensis holarctica（Type B）感染，而非F. novicida（後者對人毒力低）。","D. 正確：土拉倫斯病可藉由蜱（Dermacentor、Amblyomma屬）及鹿蠅叮咬傳播，節肢動物是重要的傳播媒介之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_069","year":2025,"roc_year":114,"session":"","examNo":69,"q":"傳染萊姆病的病媒壁蝨屬於下列何者？","opts":["A. 單宿主性壁蝨","B. 二宿主性壁蝨","C. 三宿主性壁蝨","D. 多宿主性壁蝨"],"ans":2,"exp":"萊姆病（Lyme disease）的傳播媒介為Ixodes屬硬蜱（deer tick/black-legged tick）。Ixodes屬蜱為「三宿主性（three-host ticks）」蜱——幼蟲、若蟲、成蟲各需在不同宿主上吸血，共需三個不同宿主完成生活史，因此有助於病原在多種動物間傳播。","we":["A. 單宿主性壁蝨（如牛蜱Boophilus屬）：整個生活史（幼蟲→若蟲→成蟲）在同一宿主身上完成，傳播能力有限。","B. 二宿主性壁蝨（如馬蜱Hyalomma屬部分種）：幼蟲+若蟲在同一宿主，成蟲換宿主，需兩個宿主。","C. 正確：萊姆病媒Ixodes屬蜱為三宿主性——幼蟲（小型哺乳類）→若蟲（小型哺乳類/人）→成蟲（鹿/大型動物），三個生活期各換宿主。","D. 多宿主性壁蝨並非標準分類，壁蝨通常分為單、二、三宿主性三類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_070","year":2025,"roc_year":114,"session":"","examNo":70,"q":"下列有關血吸蟲症（schistosomiasis）之敘述，何者正確？","opts":["A. 人類可藉由食入海洋甲殼類而感染","B. 移除釘螺可為控制日本血吸蟲之傳播","C. 血吸蟲生活史需要第二中間宿主","D. 無法藉由尿液檢測出埃及血吸蟲蟲卵"],"ans":1,"exp":"日本血吸蟲（Schistosoma japonicum）的中間宿主是釘螺（Oncomelania屬），移除釘螺（透過藥物、環境改造）是控制日本血吸蟲傳播的有效策略之一，在中國的血吸蟲防治計畫中廣泛應用。血吸蟲生活史只有一個中間宿主（螺）；埃及血吸蟲（S. haematobium）蟲卵可從尿液中檢出。","we":["A. 血吸蟲感染途徑是皮膚接觸含尾蚴的淡水，而非食入海洋甲殼類；海洋甲殼類是其他寄生蟲（如後睾吸蟲）的中間宿主。","B. 正確：移除釘螺（Oncomelania hupensis）是控制日本血吸蟲（S. japonicum）的重要策略，可打斷其生活史。","C. 血吸蟲只有「一個」中間宿主（淡水螺），不像肝吸蟲需要第二中間宿主（魚類）。","D. 埃及血吸蟲（S. haematobium）的蟲卵可從尿液（urinary schistosomiasis）中檢出，這是此病的診斷特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_071","year":2025,"roc_year":114,"session":"","examNo":71,"q":"有關人畜共通病原芽囊原蟲屬（Blastocystis spp.）原蟲之敘述，下列何者正確？","opts":["A. 主要寄生於紅血球中","B. 人類有疫苗可預防此疾病感染","C. 健康者身上不會被檢出","D. 從嚙齒類糞便可檢出"],"ans":3,"exp":"芽囊原蟲（Blastocystis spp.）是腸道寄生的人畜共通原蟲，可在多種哺乳動物和鳥類的腸道中發現，包括嚙齒類（rodents），從其糞便可檢出。健康人也常常是Blastocystis的無症狀攜帶者；無疫苗；主要寄生在腸道，非紅血球。","we":["A. Blastocystis主要寄生於腸道（大腸）中，非紅血球；寄生紅血球的是瘧原蟲（Plasmodium）或巴貝西原蟲（Babesia）。","B. 目前無Blastocystis的人用疫苗；此疾病的控制主要靠環境衛生和食水安全。","C. Blastocystis在健康人中的攜帶率相當高（部分地區達50%以上），健康者也常被檢出，通常無症狀。","D. 正確：從嚙齒類（大鼠、小鼠）的糞便可檢出Blastocystis，顯示其人畜共通的特性；嚙齒類是其重要動物宿主之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_072","year":2025,"roc_year":114,"session":"","examNo":72,"q":"下列有關有鈎絛蟲（Taenia solium）的敘述，何者錯誤？","opts":["A. 牛是主要中間宿主","B. 豬是主要中間宿主","C. 人感染後成蟲會鉤附在小腸上","D. 人感染後主要的症狀為腹痛、腹瀉、食慾不振"],"ans":0,"exp":"有鈎絛蟲（Taenia solium，豬肉絛蟲）的中間宿主是「豬」（豬囊尾蚴/豬肉囊蟲），不是牛。無鈎絛蟲（T. saginata，牛肉絛蟲）才是以「牛」為中間宿主。人食入含豬囊蟲的生豬肉後，成蟲在小腸發育；症狀包括腹痛、腹瀉、食慾不振；若誤食蟲卵可形成囊蟲症（cysticercosis）。","we":["A. 錯誤：有鈎絛蟲（T. solium）的中間宿主是「豬」，不是牛。牛是無鈎絛蟲（T. saginata）的中間宿主。","B. 正確：豬（pig）才是有鈎絛蟲的中間宿主，豬食入蟲卵後形成豬囊蟲（cysticercus cellulosae）。","C. 人感染有鈎絛蟲後，成蟲以其頭節（scolex）上的鉤和吸盤鉤附在小腸黏膜，正確。","D. 有鈎絛蟲感染的主要症狀包括腹痛、腹瀉、食慾改變等輕微腸道症狀（成蟲感染），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_073","year":2025,"roc_year":114,"session":"","examNo":73,"q":"下列何種人畜共通病原不是藉由水源及污染食物傳播？","opts":["A. 梨形鞭毛蟲","B. 痢疾阿米巴原蟲","C. 隱孢子蟲","D. 錐蟲"],"ans":3,"exp":"錐蟲（Trypanosoma）感染不是藉由水源或污染食物傳播：非洲錐蟲（T. brucei）由采采蠅（tsetse fly）傳播；美洲錐蟲（T. cruzi/Chagas disease）由錐蝽（triatomine bug）傳播，或極少數經輸血、垂直傳播。梨形鞭毛蟲、痢疾阿米巴、隱孢子蟲均可藉由污染水/食物（fecal-oral route）傳播。","we":["A. 梨形鞭毛蟲（Giardia lamblia）：主要透過飲用污染水或食物的糞口傳播，是典型的水媒傳染病原。","B. 痢疾阿米巴原蟲（Entamoeba histolytica）：糞口傳播，可透過污染的水、食物或接觸傳播。","C. 隱孢子蟲（Cryptosporidium）：最重要的水媒傳染原蟲之一，對一般氯消毒有抵抗力，廣泛存在於飲用水。","D. 正確：錐蟲（Trypanosoma）由節肢動物（采采蠅、錐蝽）傳播，不是水源或食物傳播的病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_074","year":2025,"roc_year":114,"session":"","examNo":74,"q":"依飲用水水質標準，飲用水自由有效餘氯（free residual chlorine）最低限值為每公升多少毫 克？","opts":["A. 0.1","B. 0.2","C. 1.0","D. 2.0"],"ans":1,"exp":"依台灣飲用水水質標準，飲用水中「自由有效餘氯（free residual chlorine）」的最低限值為每公升0.2毫克（0.2 mg/L）。此標準確保自來水在配送過程中維持消毒效果，防止微生物再度污染。","we":["A. 0.1 mg/L：低於台灣飲用水水質標準規定的最低值（0.2 mg/L），不符規定。","B. 正確：台灣飲用水水質標準規定自由有效餘氯最低限值為0.2 mg/L，最高不得超過1.0 mg/L。","C. 1.0 mg/L：此為台灣飲用水水質標準規定的「上限」（最高限值），非最低限值。","D. 2.0 mg/L：超過台灣規定上限（1.0 mg/L），殘氯過高會影響飲用水口感及安全性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_075","year":2025,"roc_year":114,"session":"","examNo":75,"q":"世界衛生組織所屬的國際癌症研究所（IARC）將引發惡性間皮細胞瘤（malignant mesothelioma） 的石綿列為那一群（group）致癌物？","opts":["A. 1","B. 2A","C. 2B","D. 3"],"ans":0,"exp":"IARC（國際癌症研究所）將石綿（asbestos）列為「Group 1（第一群）致癌物」——即已確認對人類有致癌性（sufficient evidence in humans）。石綿引發的惡性間皮細胞瘤（malignant mesothelioma）有充分流行病學證據，是Group 1的代表性案例。","we":["A. 正確：石綿為IARC Group 1致癌物（carcinogenic to humans），有充分人類致癌證據，可引發惡性間皮細胞瘤、肺癌等。","B. Group 2A：「對人類可能致癌（probably carcinogenic）」，有有限人類證據，石綿的證據更強，不在此群。","C. Group 2B：「對人類可能致癌（possibly carcinogenic）」，證據更有限，石綿不在此群。","D. Group 3：「目前無法分類（unclassifiable as to carcinogenicity）」，石綿證據充分，不在此群。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_076","year":2025,"roc_year":114,"session":"","examNo":76,"q":"下列有關化製場運作之敘述，何者錯誤？","opts":["A. 化製原料運輸車清洗消毒區應設置高壓清洗消毒設備","B. 化製原料區及成品區應提供共用之消毒設備","C. 化製時應使用足以消滅動物傳染病病原體之方法","D. 化製原料儲存室應於化製原料運出後立即消毒"],"ans":1,"exp":"化製場作業中，化製原料區（raw material area）與成品區（finished product area）應各自設置「獨立」的消毒設備，嚴格區隔防止交叉污染——原料區有大量病原體（未消毒廢棄物），若與成品區共用消毒設備，可能導致成品受到污染，違反化製場衛生原則。","we":["A. 化製原料運輸車的清洗消毒區設置高壓清洗消毒設備，確保運輸車回場後徹底消毒，正確。","B. 錯誤：原料區與成品區應設「獨立」消毒設備，共用消毒設備會造成交叉污染，違反衛生原則。","C. 化製過程應採用足以消滅動物傳染病病原體的方法（如高溫處理），正確。","D. 化製原料儲存室在原料運出後應立即進行清潔消毒，防止病原體殘留，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_077","year":2025,"roc_year":114,"session":"","examNo":77,"q":"下列何種動物之糞便含有較高之纖維素與木質素，因此會增加其糞尿廢水處理的困難度？","opts":["A. 豬","B. 牛","C. 雞","D. 鴨"],"ans":1,"exp":"牛（cattle）的主食為牧草、乾草、秸稈等高纖維飼料，其糞便中含有大量「纖維素（cellulose）」與「木質素（lignin）」——這些難以生物降解的有機物會大幅增加廢水的BOD、COD及懸浮固體，使廢水處理更困難。豬和雞的糞便主要為高氮磷廢棄物，纖維含量較低。","we":["A. 豬糞尿含高濃度氮、磷和有機物，但纖維素/木質素含量較低（豬食精料）。","B. 正確：牛以粗料（乾草、牧草）為主食，其糞便富含纖維素與木質素，這些難降解有機物增加廢水處理複雜度。","C. 雞糞含高氨氮和磷，但纖維含量不高（雞食穀類及濃縮飼料）。","D. 鴨糞性質與雞糞相近，主食為穀物，纖維素/木質素含量有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_078","year":2025,"roc_year":114,"session":"","examNo":78,"q":"位於自來水水質水量保護區的豬場，飼養豬隻頭數達多少頭以上，其排放之廢水必須符合水污染防 治法的放流水標準？","opts":["A. 10","B. 20","C. 100","D. 200"],"ans":1,"exp":"依水污染防治法及其相關規定，位於自來水水質水量保護區的豬場，飼養豬隻達「20頭以上」，其排放廢水必須符合放流水標準。保護區的規定較一般地區更嚴格，以保護水源水質。","we":["A. 10頭：門檻設定過低，非法規規定數值。","B. 正確：自來水水質水量保護區內，養豬達20頭以上須符合放流水標準，此為台灣水污染防治法規定。","C. 100頭：此數值為一般非保護區地帶的門檻參考，保護區內規定更嚴格（20頭）。","D. 200頭：數值過高，不符合保護區內應有的嚴格規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_079","year":2025,"roc_year":114,"session":"","examNo":79,"q":"根據水污染防治法所訂定的放流水標準，養雞畜牧業排放廢水中所含之生化需氧量（biochemical oxygen demand, BOD）之限值為多少mg/L？","opts":["A. 80","B. 200","C. 300","D. 500"],"ans":2,"exp":"依水污染防治法所訂定的放流水標準，養雞畜牧業（家禽業）排放廢水的BOD（生化需氧量）限值為「300 mg/L」。此標準規範家禽業廢水排放，以保護水體環境品質。","we":["A. 80 mg/L：此數值過嚴，接近工業廢水或特定敏感水體的標準，非一般養雞業的BOD放流標準。","B. 200 mg/L：非台灣養雞業放流水BOD標準規定值。","C. 正確：依台灣放流水標準，養雞畜牧業廢水BOD限值為300 mg/L。","D. 500 mg/L：此為養豬業（較高有機負荷）的BOD放流標準，非養雞業標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_080","year":2025,"roc_year":114,"session":"","examNo":80,"q":"生物醫療廢棄物熱處理，是屬於下述何種程序？","opts":["A. 貯存","B. 清除","C. 中間處理","D. 最終處置"],"ans":2,"exp":"依廢棄物清理法，廢棄物處理程序分為：貯存（storage）→清除（collection and transport）→中間處理（intermediate treatment，如焚燒、滅菌、熱處理）→最終處置（final disposal，如掩埋）。生物醫療廢棄物的熱處理（滅菌/焚燒）屬於「中間處理」程序，將廢棄物無害化後再進行最終處置。","we":["A. 貯存（storage）：廢棄物產生後暫時儲放的階段，熱處理非貯存。","B. 清除（collection/removal）：廢棄物的收集和運輸階段，熱處理非清除。","C. 正確：中間處理（intermediate treatment）包括熱處理（滅菌、焚燒）、化學處理等，將廢棄物減量化、無害化，為最終處置做準備。","D. 最終處置（final disposal）：中間處理後的殘餘物進行掩埋、海拋等，熱處理是最終處置前的中間步驟。"],"needs_review":false,"imgs":[]}];

function compressImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=720;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    </div>
    <div class="qt">${q.q}</div>
    ${q.imgs&&q.imgs.length?`<div class="q-imgs">${q.imgs.map(s=>`<img src="${s}" alt="題目圖片" onclick="this.style.maxWidth=this.style.maxWidth?'':'none'">`).join('')}</div>`:''}
    <div class="opts">${optsHtml}</div>
    <div class="exp ${expShow}" id="exp"><div class="exp-t mono">解析</div>${q.exp}${noteHtml}${ecHint}</div>
    <div class="wexp ${wexpShow}" id="wexp"><div class="wexp-t mono" id="wexp-t">${wexpTitle}</div><span id="wexp-body">${wexpBody}</span></div>
    <div id="ai-wrap">${aiBtnHtml}</div>
  </div>`;
}
function pick(i,ans){
  const qs=getQs();const q=qs[state.qi];
  if(!q||qStates[q.id])return;
  const correct=q.ma?q.ma.includes(i):(i===ans);
  state.done++;if(correct)state.cor++;
  qStates[q.id]=correct?'ok':'no-'+i;
  if(!correct)errorCounts[q.id]=(errorCounts[q.id]||0)+1;
  saveProgress();
  for(let j=0;j<q.opts.length;j++){
    const d=document.getElementById('o'+j);if(!d)continue;
    const isAns=q.ma?q.ma.includes(j):(j===ans);if(isAns){d.classList.add('dis','ok');d.removeAttribute('onclick');}
    else if(j===i&&!correct){d.classList.add('no');d.setAttribute('onclick','peekWexp('+j+')');}
    else{d.classList.add('peek');d.setAttribute('onclick','peekWexp('+j+')');}
  }
  document.getElementById('exp').classList.add('show');
  if(!correct&&q.we&&q.we[i]&&q.we[i]!==''){
    const we=document.getElementById('wexp');const t=document.getElementById('wexp-t');
    if(we){document.getElementById('wexp-body').textContent=q.we[i];if(t)t.innerHTML='你可能選這個，是因為&#x2026;&#x2026;';we.classList.add('show');}
  }
  const nb=document.getElementById('nb');if(nb)nb.style.display='';
  const ubtn=document.getElementById('unsure-btn');
  if(ubtn)ubtn.classList.remove('invis');
  const aiWrap=document.getElementById('ai-wrap');
  if(aiWrap&&!aiWrap.querySelector('.btn-ai')){
    const btn=document.createElement('button');
    btn.className='btn btn-ai';btn.style.cssText='width:100%;margin-top:.6rem';
    btn.textContent='🤖 問 AI 獲取詳細解析';
    btn.onclick=()=>showAIModal(state.qi);
    aiWrap.appendChild(btn);
  }
  const ec=errorCounts[q.id]||0;
  if(!correct&&ec>=2){
    const expEl=document.getElementById('exp');
    if(expEl&&!expEl.querySelector('.ec-hint')){
      const hint=document.createElement('div');
      hint.className='note-box ec-hint';hint.style.marginTop='.5rem';
      hint.innerHTML=`⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。`;
      expEl.appendChild(hint);
    }
  }
  updStats();renderNav();
}
function peekWexp(i){
  const qs=getQs();const q=qs[state.qi];
  document.querySelectorAll('.opt.peek').forEach(el=>el.classList.remove('peek-active'));
  const el=document.getElementById('o'+i);if(el)el.classList.add('peek-active');
  const we=document.getElementById('wexp');const weBody=document.getElementById('wexp-body');const weT=document.getElementById('wexp-t');
  if(!we||!weBody)return;
  const letter=String.fromCharCode(65+i);
  const isPicked=el&&el.classList.contains('no');
  if(weT)weT.textContent=isPicked?'你選了 ('+letter+')，為什麼不對？':'選項 ('+letter+') 為什麼不對？';
  const txt=(q.we&&q.we[i]&&q.we[i]!=='')?q.we[i]:'（解析待補充）';
  weBody.textContent=txt;we.classList.add('show');
}
function toggleUnsure(){
  const qs=getQs();const q=qs[state.qi];if(!q)return;
  if(unsureSet[q.id])delete unsureSet[q.id];
  else unsureSet[q.id]=true;
  saveProgress();
  const btn=document.getElementById('unsure-btn');
  if(btn){
    const active=!!unsureSet[q.id];
    btn.classList.toggle('active',active);
    btn.title='★';
  }
  const meta=document.querySelector('.meta');
  if(meta){
    const old=meta.querySelector('.unsure-tag');if(old)old.remove();
    if(unsureSet[q.id]){
      const tag=document.createElement('span');
      tag.className='bdg unsure-tag';tag.textContent='★';
      const qn=meta.querySelector('.qn');if(qn)meta.insertBefore(tag,qn);else meta.appendChild(tag);
    }
  }
  renderNav();
}
function restartQuiz(){
  const qs=getQs();
  qs.forEach(q=>{delete qStates[q.id];});
  state={qi:0,done:0,cor:0};saveProgress();render();
}
function showAIModal(qIdx){
  const qs=getQs();const q=qs[qIdx];if(!q)return;
  const ec=errorCounts[q.id]||0;
  const sessionLabel=q.session?` 第${q.session}次`:'';
  const lines=['【獸醫病理 國考題目】',`民國${q.roc_year}年${sessionLabel} 第${q.examNo}題`,'',q.q,''];
  q.opts.forEach(o=>lines.push(o));
  lines.push('',`【正確答案】${String.fromCharCode(65+q.ans)}`,'',`【現有解析】${q.exp}`,'');
  if(ec>0)lines.push(`備注：此題你已答錯 ${ec} 次。`,'');
  lines.push('請針對此題提供更詳細的普通疾病學解析，說明病變機制、組織特徵及常見混淆點。');
  const text=lines.join('\n');
  const existing=document.getElementById('ai-modal');if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='ai-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem';
  modal.innerHTML=`<div style="background:#1a1d27;border:1px solid #3d4260;border-radius:12px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-size:14px;font-weight:700;color:#7986cb">🤖 問 AI 獲取更詳細解析</div>
      <button onclick="document.getElementById('ai-modal').remove()" style="background:none;border:none;color:#9096b8;cursor:pointer;font-size:20px;line-height:1">✕</button>
    </div>
    <div style="font-size:11px;color:#9096b8;margin-bottom:.5rem">以下文字將傳給 AI。點 AI 按鈕時自動複製，開啟網站後貼上（Ctrl+V）：</div>
    <div id="ai-preview" style="font-size:11px;color:#9096b8;background:#0f1117;border:1px solid #2e3347;border-radius:6px;padding:10px;max-height:130px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-bottom:.75rem"></div>
    <button onclick="copyAIText()" style="width:100%;padding:9px;background:#22263a;border:1px solid #3d4260;border-radius:8px;color:#e8eaf6;cursor:pointer;margin-bottom:6px;font-size:13px">📋 複製題目文字</button>
    <div id="copy-ok" style="text-align:center;color:#43a867;font-size:12px;min-height:18px;margin-bottom:6px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem">
      <a href="https://chat.openai.com/" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#10a37f15;border:1px solid #10a37f40;border-radius:8px;color:#10a37f;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">🤖<span>ChatGPT</span></a>
      <a href="https://claude.ai/new" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#d97a2015;border:1px solid #d97a2040;border-radius:8px;color:#d97a20;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">⚡<span>Claude</span></a>
      <a href="https://gemini.google.com/app" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#4285f415;border:1px solid #4285f440;border-radius:8px;color:#4285f4;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">✨<span>Gemini</span></a>
    </div>
    <div style="font-size:11px;color:#555d80;text-align:center">點 AI 按鈕後在新分頁貼上即可</div>
  </div>`;
  modal.querySelector('#ai-preview').textContent=text;
  modal._aiText=text;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
}
function copyAIText(){
  const modal=document.getElementById('ai-modal');if(!modal||!modal._aiText)return;
  const ok=document.getElementById('copy-ok');
  const show=msg=>{if(ok){ok.textContent=msg;setTimeout(()=>ok.textContent='',2500);}};
  navigator.clipboard.writeText(modal._aiText).then(()=>show('✓ 已複製到剪貼簿！開啟 AI 後貼上')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=modal._aiText;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
    show('✓ 已複製！');
  });
}
document.getElementById('qtotal').textContent=ALL_QS.length;
(function(){
  const sel=document.getElementById('yrsel');
  const seen=new Set();const opts=[];
  ALL_QS.forEach(q=>{
    const key=q.session?String(q.year)+'-'+q.session:String(q.year);
    if(!seen.has(key)){seen.add(key);opts.push({key,year:q.year,roc:q.roc_year,session:q.session||''});}
  });
  opts.sort((a,b)=>b.year-a.year||(b.session<a.session?-1:1));
  opts.forEach(o=>{
    const op=document.createElement('option');op.value=o.key;
    op.textContent=o.session?'民國'+o.roc+'年 第'+o.session+'次':'民國'+o.roc+'年';
    sel.appendChild(op);
  });
  if(curFilter!=='all')sel.value=curFilter;
})();
auth.onAuthStateChanged(user=>{if(user){enterApp(user);}else{location.href='./index.html';}});

</script>
