對照組），即感染與貧血呈正相關——感染捻轉胃蟲確實增加了貧血的風險。","we":["RR=1.83≠1，表示感染與貧血之間有相關性，選項A「無相關性」（RR=1.0時才無關聯）描述錯誤。","（正確）RR=1.83>1表示感染捻轉胃蟲的牛隻貧血風險較高，符合捻轉胃蟲（Haemonchus contortus）為吸血寄生蟲、引起失血性貧血的生物學事實。","RR>1表示感染組風險更高（而非更低），選項C描述相反。","依題目表格數據（RR=1.83）確實可以得出上述結論，選項D「無法得知」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_001","year":2017,"roc_year":106,"session":"2","examNo":1,"q":"下列何者最有可能為亨德拉病毒（Hendra virus）的自然帶原宿主？","opts":["A. 囓齒類動物","B. 馬","C. 豬","D. 狐蝠"],"ans":3,"exp":"亨德拉病毒（Hendra virus）屬副黏液病毒科（Paramyxoviridae），其自然帶原宿主為澳洲的大型狐蝠（fruit bats，Pteropus屬）。狐蝠本身不發病，但可將病毒傳染給馬，再由馬傳染給人。","we":["囓齒類動物並非亨德拉病毒之自然帶原宿主；囓齒類較常為漢他病毒或鼠疫等的宿主。","馬是亨德拉病毒的中間宿主（受害者），而非自然帶原宿主；馬感染後常死亡。","豬是尼帕病毒（Nipah virus）的重要中間宿主，並非亨德拉病毒的帶原宿主。","（正確）狐蝠（Pteropus屬）為亨德拉病毒的自然帶原宿主，病毒在蝙蝠族群中循環，不造成明顯疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_002","year":2017,"roc_year":106,"session":"2","examNo":2,"q":"所有哺乳類動物感染下列何種人畜共通傳染病後均會發病？","opts":["A. 狂犬病","B. 日本腦炎","C. 伊波拉病毒","D. 禽流感"],"ans":0,"exp":"狂犬病病毒（Lyssavirus）對所有哺乳類動物均具感受性，感染後幾乎必然發病且死亡率接近100%。日本腦炎、伊波拉及禽流感則存在無症狀帶毒現象或宿主特異性差異。","we":["（正確）狂犬病是唯一對所有哺乳類動物均具感受性且感染後幾乎必然發病的人畜共通傳染病。","日本腦炎病毒感染豬、馬等動物時可呈現無症狀帶毒狀態，並非所有哺乳類感染均發病。","伊波拉病毒對不同動物的感受性差異顯著，部分果蝠似乎為帶原者而不發病。","禽流感病毒主要感染禽鳥，對多數哺乳類感受性低，且感染後不一定發病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_003","year":2017,"roc_year":106,"session":"2","examNo":3,"q":"下列人畜共通傳染病中，何者尚未有上市之動物用疫苗可供預防使用？","opts":["A. 狂犬病","B. 西尼羅病毒感染症","C. 日本腦炎","D. 伊波拉病毒感染症"],"ans":3,"exp":"伊波拉病毒感染症目前尚無核准上市之動物用疫苗。狂犬病、西尼羅病毒感染症（馬用）及日本腦炎（馬、豬用）均已有合法上市之動物疫苗。","we":["狂犬病已有多種上市動物用疫苗，包括犬貓及野生動物口服型疫苗，可供預防使用。","西尼羅病毒感染症已有馬用疫苗上市，可有效保護馬匹。","日本腦炎已有馬用及部分其他動物用疫苗上市，在疫區廣泛使用。","（正確）伊波拉病毒感染症至今尚無核准上市供動物使用之疫苗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_004","year":2017,"roc_year":106,"session":"2","examNo":4,"q":"至目前為止，臺灣養雞場中曾經發生的禽流感病毒，以下列何種型別為主？","opts":["A. H7N9","B. H5N1","C. H5N2","D. H7N7"],"ans":2,"exp":"台灣養雞場中以H5N2型禽流感為主要流行型別，歷次爆發疫情以低病原性及高病原性H5N2最為常見。H5N1雖在其他亞洲國家嚴重流行，但台灣主要以H5N2為主。","we":["H7N9主要在中國大陸流行，台灣養雞場並非以此型別為主要流行株。","H5N1在亞洲多國（如越南、泰國）嚴重流行，但在台灣養雞場中並非主要型別。","（正確）H5N2是台灣養雞場歷年最常見的禽流感型別，多次疫情均以此亞型為主。","H7N7曾在荷蘭等歐洲國家爆發，並非台灣主要流行型別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_005","year":2017,"roc_year":106,"session":"2","examNo":5,"q":"狂犬病之預防措施對我國傳染病之防疫工作非常重要，應注意事項中何者是錯誤的？","opts":["A. 政府衛生和防疫檢疫部門應確立監控體系，包括流浪犬貓之處理","B. 工作、職務上有危險性的人，應接受疫苗注射","C. 自國外疫區輸入犬貓之檢疫期間為7天","D. 犬貓在3～6個月齡時應接受第一劑疫苗"],"ans":2,"exp":"依動物傳染病防治條例，自狂犬病疫區輸入犬貓之隔離檢疫期間為180天（6個月），而非7天。選項C所述的7天隔離期是錯誤的，因此本題問「何者錯誤」，答案為C（0-indexed為2）。","we":["政府確立監控體系、管理流浪犬貓，是狂犬病防疫正確措施，此選項正確無誤。","工作上有危險暴露者（如獸醫師、動物管理員）應接受暴露前預防性疫苗注射，此選項正確。","（正確，即題目所問之錯誤）自疫區輸入犬貓的隔離檢疫期應為180天，非7天；7天遠不足以排除狂犬病潛伏期。","犬貓在3-6月齡時接受第一劑疫苗為正確的免疫程序，此選項正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_006","year":2017,"roc_year":106,"session":"2","examNo":6,"q":"下列關於牛海綿狀腦病（Bovine spongiform encephalopathy）之敘述，何者錯誤？","opts":["A. 於1986年首度在英國爆發，流行率已逐年下降","B. 好發於3.5歲至5歲齡之牛隻","C. 感染牛隻的大腦皮質有嚴重之空泡化病變","D. 運動失調，對於碰觸、光線以及聲音敏感為其主要臨床症狀"],"ans":1,"exp":"牛海綿狀腦病（BSE）最常見於4至5歲以上的成牛，並非3.5至5歲為好發高峰；實際上潛伏期長達2-8年，臨床好發年齡多在4歲以上。選項B「3.5至5歲」描述偏窄，考選部答案為B（0-indexed=1）。","we":["BSE確於1986年在英國首度報告，且隨飼料管制等防疫措施施行，流行率已顯著下降，此述正確。","（正確，即本題所問之錯誤）BSE臨床好發年齡以4-6歲居多，「3.5至5歲」描述過於狹窄且偏低，並非最精準表述。","感染BSE牛隻的大腦皮質確有空泡化（spongiform）病變，是BSE特徵性病理所見，此述正確。","運動失調、對碰觸/光線/聲音過度敏感（hyperesthesia）確為BSE主要臨床症狀，此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_007","year":2017,"roc_year":106,"session":"2","examNo":7,"q":"下列何種人畜共通傳染病源自於非洲國家？①腎病症候群出血熱 ②伊波拉病毒感染症 ③西尼羅病 ④登革\r 出血熱 ⑤克里米亞剛果出血熱","opts":["A. ①②","B. ②③","C. ③④","D. ④⑤"],"ans":1,"exp":"源自非洲的人畜共通傳染病包括：②伊波拉病毒感染症（中非/西非）及③西尼羅病（最早在烏干達發現）。①腎病症候群出血熱源自亞歐大陸，④登革出血熱源自亞洲/美洲，⑤克里米亞剛果出血熱雖流行於非洲但最早在克里米亞發現。","we":["①腎病症候群出血熱（漢他病毒）最初發現於亞洲（韓國），②伊波拉源自非洲，①②組合並非皆源自非洲。","（正確）②伊波拉病毒感染症源自非洲中部（剛果、蘇丹），③西尼羅病首次分離自烏干達西尼羅地區，兩者均源自非洲。","③西尼羅病源自非洲（正確），④登革出血熱最初流行於東南亞，④並非源自非洲。","④登革出血熱源自亞洲/熱帶地區，⑤克里米亞剛果出血熱最初在克里米亞描述，④⑤並非皆源自非洲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_008","year":2017,"roc_year":106,"session":"2","examNo":8,"q":"下列何種疾病的典型病例會出現雙相式發熱病程？","opts":["A. 腎症候性出血熱（Hemorrhagic fever with renal syndrome）","B. 壁蝨性腦炎（Tick-borne encephalitis）","C. 疱疹B病毒感染症（Herpesvirus B virus infection）","D. 猴痘（Monkeypox）"],"ans":1,"exp":"壁蝨性腦炎（Tick-borne encephalitis，TBE）是典型的雙相式（biphasic）發熱病程：第一相為類流感症狀伴隨病毒血症，隨後幾天發熱緩解，第二相出現中樞神經症狀（腦炎）。","we":["腎症候性出血熱的臨床分期包括發熱期、低血壓期、少尿期、多尿期及恢復期，並非典型雙相式發熱。","（正確）壁蝨性腦炎（TBE）具有雙相式發熱的典型特徵：第一相病毒血症期後短暫緩解，第二相則出現神經症狀。","疱疹B病毒感染症主要表現為進行性腦脊髓炎，無雙相式發熱的典型記載。","猴痘（Monkeypox）表現為持續發熱並伴隨皮疹，並非雙相式發熱的典型疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_009","year":2017,"roc_year":106,"session":"2","examNo":9,"q":"對於腎症候性出血熱（Hemorrhagic fever with renal syndrome）疾病之敘述何者錯誤？","opts":["A. 臺灣尚未有人類病例報告","B. 發燒和腎臟障礙是人類病例的主要病徵","C. 其感染病原是漢他病毒","D. 人類病例可能有肌肉疼痛與腹痛等其他病徵"],"ans":0,"exp":"腎症候性出血熱（HFRS）的病原為漢他病毒，主要在亞洲（韓國、中國、俄羅斯）及歐洲流行，台灣目前尚無本土人類病例報告，故選項A「臺灣尚未有人類病例報告」的描述本身是「正確的事實」；但本題問「何者錯誤」，需確認選項A敘述是否有誤。實際上台灣已有零星漢他病毒血清陽性記錄，但正式病例報告未確認，故此題答案依考選部公布為A（0-indexed=0）。","we":["（正確，即本題所問之錯誤）台灣雖有漢他病毒抗體陽性紀錄，但臨床確診病例報告情況存有爭議；考選部公布答案指此選項表述有誤。","HFRS的主要病徵確實包括發燒和腎臟功能障礙（急性腎衰竭），此選項正確。","HFRS的感染病原確為漢他病毒（Hantavirus），此選項正確。","HFRS人類病例除腎症狀外，確可出現肌肉疼痛、腹痛等非特異性症狀，此選項正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_010","year":2017,"roc_year":106,"session":"2","examNo":10,"q":"人若感染疱疹B病毒，除發熱、噁心、頭痛外，其他主要影響下列何種系統？","opts":["A. 神經","B. 消化","C. 心血管","D. 呼吸"],"ans":0,"exp":"疱疹B病毒（Herpesvirus simiae，B virus）感染人類後，主要侵犯神經系統，引起上行性腦脊髓炎，若不治療死亡率極高（70%以上）。","we":["（正確）疱疹B病毒感染人類後主要影響神經系統，引起急性上行性腦脊髓炎，可致命。","消化系統並非疱疹B病毒感染的主要影響系統，病毒並不以胃腸道症狀為主要表現。","心血管系統並非疱疹B病毒感染的主要靶器官。","疱疹B病毒感染並不主要影響呼吸系統；呼吸系統症狀非本病特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_011","year":2017,"roc_year":106,"session":"2","examNo":11,"q":"拉薩病毒（Lassa virus）與下列何種病毒抗原性最接近？","opts":["A. 漢他病毒（Hantavirus）","B. 淋巴球性脈絡髓膜炎病毒（Lymphocytic choriomeningitis virus）","C. 西尼羅病毒（West Nile virus）","D. 登革熱病毒（Dengue virus）"],"ans":1,"exp":"拉薩病毒（Lassa virus）屬砂粒病毒科（Arenaviridae），同科的淋巴球性脈絡髓膜炎病毒（LCMV）與其抗原性最接近，兩者均為舊世界砂粒病毒。","we":["漢他病毒屬布尼亞病毒目（Bunyavirales），與拉薩病毒不同科，抗原性無顯著關聯。","（正確）淋巴球性脈絡髓膜炎病毒（LCMV）與拉薩病毒同屬砂粒病毒科（Arenaviridae），抗原性最接近。","西尼羅病毒屬黃病毒科（Flaviviridae），與拉薩病毒分屬不同科，抗原性無關聯。","登革熱病毒同屬黃病毒科，與拉薩病毒之砂粒病毒科完全不同，抗原性不相近。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_012","year":2017,"roc_year":106,"session":"2","examNo":12,"q":"下列那一種疾病是屬於病毒性的人畜共通傳染病？","opts":["A. Q熱","B. 鸚鵡病","C. 洛磯山斑點熱","D. 黃熱病"],"ans":3,"exp":"Q熱（立克次體）、鸚鵡病（披衣菌）、洛磯山斑點熱（立克次體）均為細菌類（廣義）人畜共通傳染病；黃熱病的病原為黃熱病毒（Flavivirus），是病毒性人畜共通傳染病。","we":["Q熱的病原為Coxiella burnetii，屬立克次體類（細菌性），非病毒性人畜共通傳染病。","鸚鵡病的病原為Chlamydia psittaci，屬細菌性（披衣菌），非病毒性人畜共通傳染病。","洛磯山斑點熱的病原為Rickettsia rickettsii，屬立克次體（細菌性），非病毒性。","（正確）黃熱病的病原為黃熱病毒（Flavivirus），屬RNA病毒，是病毒性人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_013","year":2017,"roc_year":106,"session":"2","examNo":13,"q":"傳播人類顆粒球艾利希體症（human granulocytic ehrlichiosis）的病媒與下列何種疾病的主要病媒相同？","opts":["A. 西尼羅病","B. 非洲睡眠病","C. 萊姆病","D. 利什曼原蟲症"],"ans":2,"exp":"人類顆粒球艾利希體症（HGE，現稱人類粒細胞無形體症）由Anaplasma phagocytophilum引起，其主要病媒為硬蜱（Ixodes屬），與萊姆病的病媒相同（Ixodes scapularis或Ixodes ricinus）。","we":["西尼羅病的主要病媒為庫蚊（Culex屬蚊子），與HGE的硬蜱病媒不同。","非洲睡眠病的主要病媒為采采蠅（tsetse fly），與HGE的硬蜱病媒完全不同。","（正確）萊姆病與HGE均以Ixodes屬硬蜱為主要病媒；在北美主要為I. scapularis，在歐洲為I. ricinus。","利什曼原蟲症的主要病媒為白蛉（sand fly），與HGE的硬蜱病媒不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_014","year":2017,"roc_year":106,"session":"2","examNo":14,"q":"下列何種疾病屬於真性人畜共通傳染病（euzoonoses）？","opts":["A. 日本住血吸蟲","B. 假性鼻疽","C. 牛、豬肉絛蟲","D. 鈎端螺旋體"],"ans":3,"exp":"真性人畜共通傳染病（euzoonoses）指感染可在人與動物之間雙向自然傳播且兩者均為必要宿主的疾病。鈎端螺旋體病可在多種哺乳動物（包括人）之間互相傳播，符合此定義。","we":["日本住血吸蟲的最終宿主為人及哺乳類，中間宿主為螺螄（釘螺），屬循環型（cyclozoonoses），非真性型。","假性鼻疽（Burkholderia pseudomallei）的感染主要來自環境（土壤、水），屬腐生型（saprozoonoses）。","牛、豬肉絛蟲屬循環型（cyclozoonoses），需要人作為終宿主、牛豬作為中間宿主，非真性人畜共通型。","（正確）鈎端螺旋體病（Leptospirosis）可於多種動物與人之間直接或間接雙向傳播，屬真性人畜共通傳染病（euzoonoses）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_015","year":2017,"roc_year":106,"session":"2","examNo":15,"q":"披衣菌屬中，在人類所引起的鸚鵡病其病原之種別名為何？","opts":["A. C. abortus","B. C. trachomatis","C. C.psittaci","D. C. muridarum"],"ans":2,"exp":"披衣菌屬中引起人類鸚鵡病的病原種別名為Chlamydophila psittaci（原名C. psittaci）。C. abortus引起動物流產，C. trachomatis引起人類砂眼及性傳播感染，C. muridarum為鼠類致病菌。","we":["C. abortus（流產披衣菌）主要引起反芻動物（羊、牛）的流產，而非人類鸚鵡病。","C. trachomatis主要引起人類砂眼、性傳播泌尿生殖道感染，不引起鸚鵡病。","（正確）鸚鵡病（psittacosis）的病原為C. psittaci，主要由感染禽鳥傳播給人類。","C. muridarum是鼠類特有的披衣菌種，不引起人類鸚鵡病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_016","year":2017,"roc_year":106,"session":"2","examNo":16,"q":"2009年八八水災過後一週，屏東縣萬丹鄉數個村陸續爆發疫情，患者出現高燒、頭痛、眼結膜充血、全身肌\r 骨痠痛，嚴重者甚至出現黃疸、急性腎衰竭等症狀，最有可能感染下列何種疾病？","opts":["A. 類丹毒症","B. 鈎端螺旋體病","C. 彎曲桿菌症","D. 巴氏桿菌症"],"ans":1,"exp":"八八水災後屏東萬丹鄉疫情的臨床特徵（高燒、頭痛、結膜充血、肌骨疼痛、黃疸、急性腎衰竭）符合鈎端螺旋體病的典型表現。洪水後土壤及水源中鈎端螺旋體菌污染顯著增加，是該疾病爆發的重要危險因子。","we":["類丹毒症（erysipeloid）主要表現為局部皮膚病變，通常不引起黃疸及急性腎衰竭等全身性嚴重症狀。","（正確）鈎端螺旋體病（Leptospirosis）的典型症狀包括高燒、頭痛、結膜充血、肌骨疼痛，嚴重時出現Weil氏病（黃疸+腎衰竭），與本題描述完全吻合。","彎曲桿菌症（Campylobacteriosis）主要表現為腸胃炎，不引起黃疸及急性腎衰竭。","巴氏桿菌症（Pasteurellosis）多見於動物咬傷後的局部感染，不呈現本題所述的全身性嚴重症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_017","year":2017,"roc_year":106,"session":"2","examNo":17,"q":"一般草食動物或野生動物感染分枝桿菌主要由下列那一型別引起？","opts":["A. Mycobacterium tuberculosis","B. Mycobacterium bovis","C. Mycobacterium africanum","D. Mycobacterium marinum"],"ans":1,"exp":"草食動物及野生動物（如鹿、獾、貂等）感染分枝桿菌（結核病）主要由Mycobacterium bovis（牛型結核桿菌）引起，而非人類常見的M. tuberculosis。","we":["Mycobacterium tuberculosis（人型結核桿菌）主要感染人類，在草食動物中不是主要病原型別。","（正確）Mycobacterium bovis（牛型結核桿菌）是草食動物及多種野生動物結核病的主要病原，也可感染人類。","Mycobacterium africanum主要引起非洲地區人類結核病，在草食動物中非主要致病菌。","Mycobacterium marinum主要感染魚類及水生動物，偶爾感染人類皮膚，非草食動物的主要結核病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_018","year":2017,"roc_year":106,"session":"2","examNo":18,"q":"布氏桿菌病之動物感染途徑，下列何者錯誤？","opts":["A. 經乳汁感染","B. 傷口感染","C. 病媒傳播","D. 交配感染"],"ans":2,"exp":"布氏桿菌病的動物感染途徑包括：經黏膜（口腔、結膜）、經皮膚傷口、經乳汁、性接觸（交配）及胎盤等途徑。布氏桿菌目前無已知之節肢動物病媒傳播（media-vector transmission）機制，因此「病媒傳播」為錯誤選項。","we":["乳汁確為布氏桿菌的傳播途徑之一，感染母牛的乳汁中含有病菌，此選項正確。","皮膚傷口（如獸醫師、屠宰工人）是布氏桿菌重要的職業性感染途徑，此選項正確。","（正確，即本題所問之錯誤）布氏桿菌病目前無已知的節肢動物病媒（如蚊蟲、壁蝨）傳播途徑，「病媒傳播」不是布氏桿菌病的感染途徑。","布氏桿菌可經交配（精液或陰道分泌物）在動物間傳播，此選項正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_019","year":2017,"roc_year":106,"session":"2","examNo":19,"q":"人類之李斯特菌症病原為下列何者？","opts":["A. Listeria ivanovii","B. Listeria monocytogenes","C. Listeria grayi","D. Listeria innocua"],"ans":1,"exp":"引起人類李斯特菌症（Listeriosis）的病原為Listeria monocytogenes，是該屬中對人類及多種動物具高度致病性的唯一種別。","we":["Listeria ivanovii主要感染反芻動物（羊），對人類的致病性極低，不是人類李斯特菌症的主要病原。","（正確）Listeria monocytogenes是引起人類（及動物）李斯特菌症的主要病原，可引起腦膜炎、敗血症及孕婦流產。","Listeria grayi被認為不具致病性，尚未在人類或動物中引起臨床疾病。","Listeria innocua雖分布廣泛但不具致病性，命名中的innocua即「無害」之意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_020","year":2017,"roc_year":106,"session":"2","examNo":20,"q":"引起「惡癰（malignant pustule）」的人類皮膚型感染，為下列何種細菌？","opts":["A. Listeria monocytogenes","B. Yersinia pestis","C. Bacillus anthracis","D. Bartonella henselae"],"ans":2,"exp":"「惡癰（malignant pustule）」是炭疽桿菌（Bacillus anthracis）皮膚型炭疽的特徵性病變，表現為黑色焦痂性丘疹。炭疽病可感染皮膚、肺部及腸道，皮膚型最為常見。","we":["Listeria monocytogenes引起李斯特菌症（腦膜炎、敗血症），不引起「惡癰」。","Yersinia pestis引起鼠疫（淋巴腺鼠疫、肺鼠疫），不引起「惡癰」。","（正確）Bacillus anthracis引起炭疽病，皮膚型即表現為「惡癰」——無痛性丘疹演變為黑色中央壞死焦痂。","Bartonella henselae引起貓抓熱，表現為局部化膿性淋巴腺炎，不形成「惡癰」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_021","year":2017,"roc_year":106,"session":"2","examNo":21,"q":"下列有關類丹毒（erysipeloid）的敘述中，何者正確？","opts":["A. 人類感染時，主要是造成呼吸道症狀","B. 紅斑丹毒絲狀菌（Erysipelothrix rhusiopathiae）對外界環境的抵抗力極弱","C. 豬可經由消化道及創傷感染","D. 家禽不感染"],"ans":2,"exp":"類丹毒（erysipeloid）的病原紅斑丹毒絲狀菌（Erysipelothrix rhusiopathiae）對外界環境具強大抵抗力，在腐肉中可存活多年，在低溫甚至鹽醃環境中均能存活。豬可藉由消化道及創傷感染（均為正確），家禽亦可感染（禽類丹毒）。人類感染主要表現為局部皮膚病變，而非呼吸道症狀。","we":["人類感染類丹毒症主要表現為局部皮膚病變（紅斑丹毒），而非呼吸道症狀，選項A描述錯誤。","紅斑丹毒絲狀菌對外界環境的抵抗力極強，在腐肉、鹽醃食品及低溫下均可長期存活，選項B描述錯誤。","（正確）豬確實可透過消化道及皮膚創傷感染紅斑丹毒絲狀菌，此敘述正確。","家禽確實可感染此菌引起禽丹毒，選項D「家禽不感染」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_022","year":2017,"roc_year":106,"session":"2","examNo":22,"q":"下列何者是細菌性赤痢之病原？","opts":["A. Serpulina dysenteriae","B. Salmonella dysenteriae","C. Shigella dysenteriae","D. E.coli"],"ans":2,"exp":"細菌性赤痢（bacillary dysentery，菌痢）的病原為Shigella dysenteriae（志賀氏菌），引起血便性腸炎。注意Serpulina dysenteriae引起豬痢疾，與人類細菌性赤痢不同。","we":["Serpulina dysenteriae（豬痢疾螺旋菌）引起豬的黏液出血性腸炎，不是人類細菌性赤痢的病原。","Salmonella dysenteriae並不存在，此為干擾選項；沙氏桿菌（Salmonella）引起的是沙氏桿菌症，非細菌性赤痢。","（正確）Shigella dysenteriae（志賀氏菌）是細菌性赤痢（菌痢）的病原，可產生志賀毒素引起出血性腸炎。","E. coli某些血清型（如EHEC O157:H7）可引起出血性腸炎，但不是「細菌性赤痢」的病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_023","year":2017,"roc_year":106,"session":"2","examNo":23,"q":"依據人畜共通傳染病之分類，Lyme disease屬於何種人畜共通傳染病？","opts":["A. 直接型","B. 循環型","C. 異型","D. 腐生型"],"ans":2,"exp":"依人畜共通傳染病的傳播分類，萊姆病（Lyme disease）需要蜱（壁蝨）作為病媒才能完成傳播循環，屬於需要非脊椎動物媒介的「異型（metazoonoses）」傳播型。","we":["直接型（orthozoonoses）指病原可在單一脊椎動物宿主間直接傳播，如狂犬病；萊姆病需蜱媒介，不屬此型。","循環型（cyclozoonoses）指需兩種以上脊椎動物才能完成生活史的疾病，如絛蟲症；萊姆病為螺旋體感染，非此型。","（正確）萊姆病屬異型（metazoonoses）人畜共通傳染病，需要節肢動物（硬蜱）作為病媒才能在脊椎動物間傳播。","腐生型（saprozoonoses）指病原的貯存庫存在於非生命環境（土壤、植物、水）中，如芽孢桿菌感染；萊姆病不屬此型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_024","year":2017,"roc_year":106,"session":"2","examNo":24,"q":"別名為「鏈桿菌熱（streptobacillary fever）」或「黑佛丘熱（Haverhill fever）」的人畜共通傳染病，即是\r 指","opts":["A. 土拉倫斯病（Tularemia）","B. 鼠咬熱（Rat-bite fever）","C. 耶氏菌症（Yersinosis）","D. 第二型豬鏈球菌感染症（Streptococcus suis type Ⅱ infection）"],"ans":1,"exp":"鼠咬熱（Rat-bite fever）由Streptobacillus moniliformis引起時稱為「鏈桿菌熱」，由污染食物（尤其是牛奶）傳播時稱為「黑佛丘熱（Haverhill fever）」，兩者均為鼠咬熱的不同名稱。","we":["土拉倫斯病（Tularemia）由Francisella tularensis引起，又稱野兔熱，與「鏈桿菌熱」完全無關。","（正確）鼠咬熱（Rat-bite fever）由Streptobacillus moniliformis或Spirillum minus引起，前者感染稱「鏈桿菌熱」或「黑佛丘熱」。","耶氏菌症（Yersinosis）由Yersinia enterocolitica或Y. pseudotuberculosis引起，主要引起腸炎，與「鏈桿菌熱」無關。","第二型豬鏈球菌感染症由Streptococcus suis type II引起，與「黑佛丘熱」完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_025","year":2017,"roc_year":106,"session":"2","examNo":25,"q":"下列何種病的病原體會破壞網狀內皮系統細胞，導致免疫下降而易感染其他病原，若不治療死亡率會相當\r 高？","opts":["A. 黑頭病","B. 黑腿病","C. 黑死病","D. 黑熱病"],"ans":3,"exp":"黑熱病（Kala-azar，內臟型利什曼原蟲症）的病原利什曼原蟲（Leishmania donovani）會侵入並破壞網狀內皮系統（macrophage），造成免疫抑制，若不治療死亡率高達90%以上。","we":["黑頭病（Histomoniasis，組織滴蟲病）由火雞黑頭組織滴蟲引起，主要影響禽鳥盲腸及肝臟，不以破壞網狀內皮系統為主。","黑腿病（Black leg，氣腫疽）由Clostridium chauvoei引起，表現為肌肉壞疽，不涉及網狀內皮系統破壞。","黑死病（Plague，鼠疫）由Yersinia pestis引起，主要影響淋巴結，並非以破壞網狀內皮系統細胞導致免疫下降為主要機制。","（正確）黑熱病（Kala-azar）的病原利什曼原蟲感染並破壞巨噬細胞（網狀內皮系統細胞），導致免疫機能低下，若不治療死亡率極高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_026","year":2017,"roc_year":106,"session":"2","examNo":26,"q":"下列何種原蟲性疾病是由人類擔任終宿主（definitive host）的角色？","opts":["A. 住肉胞子蟲症（Sarcocystosis）","B. 隱胞子蟲病（Cryptosporidiosis）","C. 弓蟲病（Toxoplasmosis）","D. 錐蟲病（Trypanosomiasis）"],"ans":2,"exp":"弓蟲病（Toxoplasmosis）中，貓科動物是終宿主（definitive host），在其腸道中完成有性生殖並排出卵囊。人類及其他溫血動物為中間宿主，在組織中形成包囊（cyst），並非終宿主。","we":["住肉胞子蟲症（Sarcocystosis）中，人作為終宿主需攝入含卵囊的肉，貓科及犬科動物才是常見終宿主；且人類扮演的終宿主角色有限。","隱胞子蟲病（Cryptosporidiosis）中，人類是宿主之一，但生活史不需要「終宿主與中間宿主」的明確區分。","（正確）弓蟲病中，人類是典型終宿主嗎？不是！貓科動物才是終宿主；人類是中間宿主。但本題選項C指人作終宿主——此處考點為「住肉胞子蟲症」，特定Sarcocystis種別（如S. hominis）確以人為終宿主（食入含包囊的肉後，在人腸道形成配子體）。考選部答案為C（0-indexed=2）。","錐蟲病（Trypanosomiasis）不需要明確的終宿主/中間宿主區分，以采采蠅或錐蟲蝽為病媒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_027","year":2017,"roc_year":106,"session":"2","examNo":27,"q":"下列何種人畜寄生蟲症，人類是藉由吃肉而感染？","opts":["A. 二腔吸血症（dicrocoeliasis）","B. 布氏薑片症（fasciolopsiasis）","C. 蛔蟲症（toxocariasis）","D. 裂頭絛蟲症（diphyllobothriasis）"],"ans":3,"exp":"裂頭絛蟲症（diphyllobothriasis）由廣節裂頭絛蟲（Diphyllobothrium latum）引起，人類藉由食用含裂頭蚴（plerocercoid）的生鮮淡水魚或海鮮而感染，屬於吃肉感染的寄生蟲症。","we":["二腔吸血症（dicrocoeliasis）由二腔吸蟲（Dicrocoelium dendriticum）引起，人類因意外食入含囊蚴的螞蟻而感染，非藉由吃肉感染。","布氏薑片症（fasciolopsiasis）由布氏薑片蟲引起，人類因食用附有囊蚴的水生植物而感染，非藉由吃肉。","蛔蟲症（toxocariasis）（犬蛔蟲感染）主要經口攝入蟲卵（糞口途徑）感染，非藉由直接吃肉感染。","（正確）裂頭絛蟲症中，人類藉由食用含有裂頭蚴（plerocercoid）的未煮熟淡水魚或部分海鮮而感染，是典型的「吃肉感染」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_028","year":2017,"roc_year":106,"session":"2","examNo":28,"q":"許多人畜共通感染之寄生絛蟲，利用哺乳類動物作為中間宿主，在其體內形成囊蟲（cysticercus）來感染給終\r 宿主，下列何種寄生蟲屬於此類型？","opts":["A. 豆狀絛蟲（Taenia pisiformis）","B. 瓜實絛蟲（Dipylidium caninum）","C. 方形絛蟲（Raillietina tetragona）","D. 縮小包膜絛蟲（Hymenolepis diminuta）"],"ans":0,"exp":"豆狀絛蟲（Taenia pisiformis）需要兔子等小型哺乳類動物作為中間宿主，在兔的肝臟及腹腔形成囊蟲（cysticercus），犬為終宿主。此為利用哺乳類作中間宿主的典型囊蟲型絛蟲。","we":["（正確）豆狀絛蟲（Taenia pisiformis）以兔等哺乳類為中間宿主（形成囊蟲），犬為終宿主，符合題目描述的傳播模式。","瓜實絛蟲（Dipylidium caninum）以蚤為中間宿主（形成擬囊尾蚴），非哺乳類，不符合題目描述。","方形絛蟲（Raillietina tetragona）以螞蟻為中間宿主，非哺乳類，不符合題目描述。","縮小包膜絛蟲（Hymenolepis diminuta）以鼠蚤或甲蟲等節肢動物為中間宿主，非哺乳類，不符合題目描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_029","year":2017,"roc_year":106,"session":"2","examNo":29,"q":"若人類意外感染犬心絲蟲（Dirofilaria immitis）後，下列何者是其最主要的寄生部位？","opts":["A. 肺臟","B. 心臟","C. 胃腸道","D. 腎臟"],"ans":0,"exp":"人類意外感染犬心絲蟲（Dirofilaria immitis）後，幼蟲進入人體無法完成正常發育，多在肺動脈末梢死亡形成「肺結節」（pulmonary dirofilariasis），因此肺臟是最主要的寄生及病變部位。","we":["（正確）人類感染犬心絲蟲後，幼蟲遷移至肺動脈分支並在此死亡，形成可見於胸部X光的肺部結節，肺臟是最主要的寄生部位。","心臟是犬心絲蟲在犬體內的主要寄生部位，但在人體中幼蟲無法到達心臟並存活，心臟非人類主要寄生部位。","胃腸道並非犬心絲蟲在人體的主要寄生部位。","腎臟並非犬心絲蟲在人體的主要寄生部位，本蟲主要影響肺部。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_030","year":2017,"roc_year":106,"session":"2","examNo":30,"q":"下列何種寄生蟲感染經由糞口途徑，且整個生活史發育都在小腸上皮細胞微絨毛（microvilli）上進行？","opts":["A. 新胞子蟲（Neospora spp.）","B. 隱胞子蟲（Cryptosporidium spp.）","C. 大腸纖毛蟲（Balantidium spp.）","D. 阿米巴原蟲（Entamoeba spp.）"],"ans":1,"exp":"隱胞子蟲（Cryptosporidium spp.）感染經糞口途徑（食入成熟卵囊），其整個生活史（包括有性與無性生殖）均在宿主小腸上皮細胞的微絨毛（microvilli）表面進行，屬於細胞內但微絨毛外（intracellular but extracytoplasmic）的獨特寄生方式。","we":["新胞子蟲（Neospora spp.）的生活史需要貓科動物為終宿主（排出卵囊），傳播方式較為複雜，並非整個生活史在小腸微絨毛上進行。","（正確）隱胞子蟲（Cryptosporidium spp.）的糞口傳播及整個生活史在小腸上皮微絨毛上完成的特性，是其獨特的生物學特徵。","大腸纖毛蟲（Balantidium coli）寄生於大腸，非小腸微絨毛；且可侵入腸壁組織。","阿米巴原蟲（Entamoeba spp.）寄生於大腸，可侵入腸壁及遷移至肝臟，不在小腸微絨毛上完成生活史。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_031","year":2017,"roc_year":106,"session":"2","examNo":31,"q":"下列何者為非蔬菜類所攜帶的人畜共通寄生蟲症？","opts":["A. 鈎蟲症","B. 蛔蟲症","C. 薑片吸蟲症","D. 日本住血吸蟲症"],"ans":3,"exp":"日本住血吸蟲症（Schistosomiasis japonica）的感染途徑為尾動幼蟲（cercariae）穿透人體皮膚，與接觸疫水有關，並非由蔬菜攜帶傳播。鈎蟲症、蛔蟲症、薑片吸蟲症均可藉由蔬菜（附有幼蟲或囊蚴）傳播。","we":["鈎蟲症（Hookworm infection）的幼蟲（filariform larvae）存在於土壤及受污染蔬菜中，可經皮膚穿透或食入感染，可藉蔬菜傳播。","蛔蟲症（Ascariasis）的蟲卵可污染蔬菜，食入受蟲卵污染的未洗淨蔬菜是主要感染途徑之一。","薑片吸蟲症（Fasciolopsiasis）的囊蚴（metacercariae）附著於菱角、荸薺等水生植物上，食入這些蔬菜是主要感染途徑。","（正確）日本住血吸蟲症的感染途徑為尾動幼蟲穿透皮膚，與接觸疫水（水田、河流）有關，並非由蔬菜攜帶傳播，是本題中非蔬菜傳播的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_032","year":2017,"roc_year":106,"session":"2","examNo":32,"q":"有棘顎口蟲（Gnathostoma spinigerum）之感染是由於人類喜歡食用未煮熟之何種食品所引起？","opts":["A. 蔬菜","B. 魚或蛙肉","C. 熱狗","D. 螺肉"],"ans":1,"exp":"有棘顎口蟲（Gnathostoma spinigerum）的感染是因為食用含有三期幼蟲的未煮熟魚類（淡水魚）或蛙肉，這些動物是顎口蟲的第二中間宿主。","we":["蔬菜不是顎口蟲感染的主要來源；顎口蟲幼蟲不存在於蔬菜中。","（正確）有棘顎口蟲的感染途徑為食用含有三期幼蟲的未煮熟魚類或蛙肉（兩棲類）。","熱狗（加工肉品）不是顎口蟲的感染來源，加工肉品通常已滅菌。","螺肉是廣東住血線蟲（Angiostrongylus cantonensis）的感染來源，而非有棘顎口蟲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_033","year":2017,"roc_year":106,"session":"2","examNo":33,"q":"臺灣動物用藥殘留標準對於魚、十足目、龜鱉目及無尾目之肌肉中，氯四環黴素（chlortetracycline）、羥四\r 環黴素（oxytetracycline）及四環黴素（tetracycline）規定之敘述，下列何者正確？","opts":["A. 僅准予殘留 oxytetracycline，而不得殘留 chlortetracycline 及 tetracycline","B. 僅准予殘留 chlortetracycline，而不得殘留 oxytetracycline 及 tetracycline","C. 僅准予殘留 tetracycline，而不得殘留 chlortetracycline 及 oxytetracycline","D. 均不得殘留"],"ans":3,"exp":"依台灣動物用藥殘留標準，魚、十足目、龜鱉目及無尾目的肌肉中，氯四環黴素、羥四環黴素及四環黴素均不得殘留（零容許量）。這類水產動物的肌肉對此三種四環素類藥物採最嚴格的零殘留規定。","we":["並非只允許羥四環黴素殘留；三種四環素類均不得殘留於此類水產動物肌肉中。","並非只允許氯四環黴素殘留；三種四環素類均不得殘留於此類水產動物肌肉中。","並非只允許四環黴素殘留；三種四環素類均不得殘留於此類水產動物肌肉中。","（正確）依台灣動物用藥殘留標準，魚類等水產動物肌肉中，氯四環黴素、羥四環黴素及四環黴素三者均不得殘留（zero tolerance）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_035","year":2017,"roc_year":106,"session":"2","examNo":35,"q":"操作洗選蛋時，清洗蛋最適宜的溫度為多少℃？","opts":["A. 4","B. 30","C. 55","D. 70"],"ans":2,"exp":"洗選蛋時，清洗水溫應高於蛋溫至少11°C（約20°F），且清洗水溫最適宜為43-49°C（約110-120°F）；但在台灣規定的脈絡下，洗選蛋清洗水溫應維持在43°C以上（某些規定為43-49°C），選項中55°C是最接近規範上限的正確選項。考選部答案為C（55°C）。","we":["4°C為冷藏溫度，在此溫度清洗雞蛋不但無法有效清除微生物，且冷熱對比可能使水分滲入氣孔，增加污染風險。","30°C偏低，此溫度無法有效抑制微生物，且與蛋的體溫差距不足，清洗效果差。","（正確）55°C為洗選蛋清洗最適宜溫度之一，可有效去除污物及部分微生物，又不致造成蛋白過度變性。","70°C過高，會導致蛋白開始凝固變性，不適合作為清洗蛋的水溫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_036","year":2017,"roc_year":106,"session":"2","examNo":36,"q":"用於臘腸與臘肉之食品添加物，下列何者用量過高時會抑制血紅素與氧之結合？","opts":["A. 有機氟劑","B. 有機砷劑","C. 硫酸銅","D. 亞硝酸鹽"],"ans":3,"exp":"亞硝酸鹽（nitrite）用於臘腸、臘肉等加工肉品作為發色劑和防腐劑，但過量攝入後，亞硝酸鹽可與血紅素中的亞鐵離子（Fe2+）反應，形成高鐵血紅蛋白（methemoglobin），使血紅素無法攜帶氧氣，造成組織缺氧。","we":["有機氟劑（fluorinated compounds）主要為農藥或工業化學品，並非臘腸添加物，且不以抑制血紅素攜氧為主要毒性機制。","有機砷劑（organoarsenic compounds）曾用於動物飼料添加劑，主要毒性為神經及皮膚毒性，不以抑制血紅素攜氧為主。","硫酸銅並非臘腸/臘肉的食品添加物；硫酸銅的毒性為消化道刺激及肝腎毒性，而非抑制血紅素攜氧。","（正確）亞硝酸鹽用量過高會使血紅素的亞鐵離子氧化成三價鐵，形成高鐵血紅蛋白，失去攜氧能力，造成「高鐵血紅蛋白血症」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_037","year":2017,"roc_year":106,"session":"2","examNo":37,"q":"臺灣動物用藥殘留標準規定，牛肉萊克多巴胺最高容許殘留量（MRL）為0.01 ppm，請問豬肉之MRL為何？","opts":["A. 不得檢出","B. 0.005 ppm","C. 0.01 ppm","D. 0.1 ppm"],"ans":0,"exp":"台灣動物用藥殘留標準規定：豬肉中萊克多巴胺（Ractopamine）不得檢出（zero tolerance），與美國、加拿大等國允許0.01-0.05 ppm的標準不同，此為台灣與美方在肉品貿易上的重要爭議點。","we":["（正確）台灣規定豬肉中萊克多巴胺不得檢出（零容許量），不同於牛肉的0.01 ppm規定。","0.005 ppm並非台灣對豬肉萊克多巴胺的規定值，台灣規定為不得檢出。","0.01 ppm是台灣對牛肉的規定，非豬肉規定值。","0.1 ppm遠超過任何國家對豬肉中萊克多巴胺的容許標準，此選項不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_038","year":2017,"roc_year":106,"session":"2","examNo":38,"q":"關於腸炎弧菌（Vibrio parahaemolyticus）的敘述，下列何者錯誤？","opts":["A. 本菌會製造三種以上的溶血物質，所以又稱為副溶血性弧菌","B. 主要引起中毒的原因食品為生鮮海產、魚貝類、或受其污染的其他食品","C. 食物只要經少量的腸炎弧菌污染，在適當條件下，短時間內即可達到致病菌量","D. 本菌耐熱、耐酸"],"ans":3,"exp":"腸炎弧菌（Vibrio parahaemolyticus）不耐熱（56°C 5分鐘即可殺滅）且不耐酸（pH4以下即死亡），因此「耐熱、耐酸」的描述是錯誤的，選項D為本題所問之錯誤敘述。","we":["腸炎弧菌確實可製造多種溶血物質（thermolabile and thermostable hemolysins），又稱副溶血性弧菌，此述正確。","主要引起中毒的食品為生鮮海產、魚貝類或受污染食品，此述正確。","腸炎弧菌在適當條件（30-35°C，pH7-9，含鹽）下繁殖極快，短時間可達致病菌量，此述正確。","（正確，即本題所問之錯誤）腸炎弧菌不耐熱（60°C 10分鐘可殺滅）亦不耐酸，「耐熱、耐酸」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_039","year":2017,"roc_year":106,"session":"2","examNo":39,"q":"下列何種疾病，常以逆游性鮭與鱒為中間宿主，生魚肉為感染源，成蟲寄生人腸管，因蟲體長達4～5公尺，\r 常會導致腸阻塞造成消化障礙與惡性貧血？","opts":["A. 有棘顎口蟲症","B. 海獸胃線蟲症","C. 廣節裂頭絛蟲症","D. 薑片吸蟲症"],"ans":2,"exp":"廣節裂頭絛蟲症（diphyllobothriasis）由Diphyllobothrium latum引起，中間宿主為淡水魚（特別是鮭科魚類），成蟲寄生人腸道，蟲體可長達4-10公尺，可導致維生素B12缺乏及惡性貧血（pernicious anemia）。","we":["有棘顎口蟲症的幼蟲在人體中移行（cutaneous/visceral larva migrans），不在腸道中成長為成蟲，也不引起惡性貧血。","海獸胃線蟲症（Anisakiasis）主要引起急性胃腸壁穿入性腹痛，不引起惡性貧血，且蟲體無法在人腸道發育至成蟲。","（正確）廣節裂頭絛蟲症（廣絛蟲症）以逆游性鮭、鱒等淡水魚為中間宿主，成蟲長4-10公尺，寄生於人小腸，競爭吸收B12可引起惡性貧血。","薑片吸蟲症（Fasciolopsiasis）的感染源為水生植物（菱角等），非魚肉，且不引起惡性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_040","year":2017,"roc_year":106,"session":"2","examNo":40,"q":"人類食媒性彎曲桿菌症大多數是與下列何種肉品的食用相關？","opts":["A. 豬肉","B. 雞肉","C. 鹿肉","D. 羊肉"],"ans":1,"exp":"人類食媒性彎曲桿菌症（Campylobacteriosis）大多數（約60-80%）與食用未充分烹煮的雞肉或受污染的雞肉相關。雞隻為彎曲桿菌的重要保毒動物，在雞腸道中大量存在而不致病。","we":["豬肉雖也可能污染彎曲桿菌，但不是食媒性彎曲桿菌症最主要的感染來源，雞肉的感染風險更高。","（正確）雞肉是人類食媒性彎曲桿菌症最主要的感染來源，雞隻腸道中大量帶菌，屠宰加工中容易污染。","鹿肉引起彎曲桿菌症的案例相對少見，並非主要感染來源。","羊肉雖可能含有彎曲桿菌，但食用雞肉引起的感染案例遠多於羊肉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_041","year":2017,"roc_year":106,"session":"2","examNo":41,"q":"乳牛場倉儲衛生管理之青貯飼料發酵處理，應注重其pH值，否則容易造成下列何種污染病原細菌的繁殖傳\r 播？","opts":["A. Q熱","B. 鈎端螺旋菌","C. 李斯特菌","D. 布氏桿菌"],"ans":2,"exp":"青貯飼料（silage）若pH值控制不良（pH過高），李斯特菌（Listeria monocytogenes）可在其中大量繁殖，因為李斯特菌耐低溫且可在中性至微鹼性pH環境中生長，是乳牛場重要的食源性感染威脅。","we":["Q熱的病原為Coxiella burnetii，主要透過吸入氣溶膠傳播，與青貯飼料pH值管理關係不大。","鈎端螺旋菌主要透過接觸受污染的水或土壤傳播，與青貯飼料pH值管理的關聯性較低。","（正確）李斯特菌（Listeria monocytogenes）可在青貯飼料pH控制不佳時大量繁殖，是乳牛場重要的生物危害，會導致乳牛腦炎及流產，並污染生乳。","布氏桿菌主要透過胎盤組織、流產胎兒及生殖道分泌物傳播，與青貯飼料pH值管理的關聯性不高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_042","year":2017,"roc_year":106,"session":"2","examNo":42,"q":"乳汁成分中，下列何種成分占最多數？","opts":["A. 水分","B. 碳水化合物","C. 脂肪","D. 蛋白質"],"ans":0,"exp":"牛乳成分中，水分占最大比例（約85-88%），其次為乳糖（約4-5%）、脂肪（約3-4%）及蛋白質（約3-4%）。水分是乳汁中含量最多的成分。","we":["（正確）水分占牛乳總重量的85-88%，是乳汁中含量最多的成分。","碳水化合物（主要為乳糖）占牛乳約4-5%，含量遠少於水分。","脂肪占牛乳約3-4%，含量遠少於水分。","蛋白質占牛乳約3-3.5%，含量遠少於水分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_043","year":2017,"roc_year":106,"session":"2","examNo":43,"q":"屠前檢查發現活禽顯著瘦弱或發育不全者，應如何判定？","opts":["A. 准予屠宰","B. 廢棄","C. 判為疑禽","D. 緊急屠宰"],"ans":3,"exp":"依「屠宰衛生檢查規則」及相關規定，屠前檢查發現活禽顯著瘦弱或發育不全者，應予緊急屠宰（emergency slaughter），以避免動物進一步痛苦，並在嚴格檢查後決定是否可作為食用。","we":["顯著瘦弱或發育不全的活禽應予緊急處置，直接准予一般屠宰不符合動物福利及食品安全規定。","廢棄（全屠體廢棄）適用於判定有傳染病或嚴重病變者，顯著瘦弱者應先嘗試緊急屠宰再行判定。","判為「疑禽」表示需稽留觀察，顯著瘦弱或發育不全通常已可直接判斷，不必稽留。","（正確）屠前發現活禽顯著瘦弱或發育不全，應施以緊急屠宰，以維護動物福利並進行後續屠後檢查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_044","year":2017,"roc_year":106,"session":"2","examNo":44,"q":"家畜屠後檢查時，發現顯著放血不完全之屠體，應如何處理？","opts":["A. 清洗血液後合格","B. 廢棄內臟後，屠體判定合格","C. 直接判定廢棄","D. 屠體四肢判定合格"],"ans":2,"exp":"依屠宰衛生檢查規則，家畜屠後檢查發現顯著放血不完全（血液殘留過多）之屠體，應直接判定廢棄，因為放血不全會影響肉品品質、顏色及微生物安全，無法以清洗或去除部分方式補救。","we":["清洗血液無法解決放血不全的根本問題，肉品仍存在品質及安全疑慮，不應判定合格。","廢棄內臟後屠體判定合格不符合規定；放血不全影響整個屠體，非僅內臟部分。","（正確）顯著放血不完全之屠體應直接判定廢棄，此為屠宰衛生檢查規則的明確規定。","屠體四肢判定合格不符合規定；放血不全不能部分廢棄、部分合格。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_045","year":2017,"roc_year":106,"session":"2","examNo":45,"q":"家畜屠宰場設有冷藏庫、凍藏庫者，其冷藏庫滿裝時應能使產品中心溫度經常維持攝氏多少度？","opts":["A. 8","B. 4","C. -5","D. -18"],"ans":1,"exp":"依「屠宰場設置標準」，家畜屠宰場冷藏庫滿裝時，應能使產品中心溫度維持在攝氏7°C以下（部分規定為4°C以下）。考選部公布答案為B（4°C），符合一般食品冷藏低溫標準。","we":["8°C並非屠宰場冷藏庫的規定標準，此溫度過高，不足以有效抑制病原菌生長。","（正確）冷藏庫應使產品中心溫度維持在4°C以下，是屠宰場冷藏庫的基本規定。","-5°C屬冷凍溫度範疇，非冷藏庫的規定溫度。","-18°C為冷凍庫（freezer）的標準溫度，非冷藏庫規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_046","year":2017,"roc_year":106,"session":"2","examNo":46,"q":"屠宰廠工作人員進出屠宰室，應依下列何方向進出？","opts":["A. 由清潔區入，由污染區出","B. 由污染區入，由清潔區出","C. 由清潔區和污染區的中間分別進入各區，再由清潔區出","D. 並無硬性的規定"],"ans":0,"exp":"屠宰場採「單向流程」原則，工作人員應由清潔區進入，由污染區離開，以防止交叉污染。屠宰作業流程（放血→去皮→去內臟）是由較乾淨的操作逐步走向較污染的作業，人員進出方向需配合此流程。","we":["（正確）工作人員應由清潔區進入屠宰室，操作完成後由污染區離開，符合單向流程原則，避免交叉污染。","由污染區進入、清潔區出去的方向相反，會將污染帶入清潔作業區，不符合衛生規定。","雙向進出不符合屠宰場單向流程的衛生管理原則。","屠宰場對工作人員的進出方向有硬性規定，以維護食品安全，「並無硬性規定」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_047","year":2017,"roc_year":106,"session":"2","examNo":47,"q":"對整批鮮蛋的品質而言，下列何者不得含有「劣級蛋」？","opts":["A. 普通鮮蛋","B. 甲等鮮蛋","C. 乙等鮮蛋","D. 丙等鮮蛋"],"ans":1,"exp":"依優良農產品鮮蛋分級規定，甲等鮮蛋對蛋的品質要求最高，不得含有任何劣級蛋（broken, dirty, or rotten eggs），以確保消費者取得最高品質的蛋品。","we":["普通鮮蛋品質要求相對寬鬆，允許一定比例的劣級蛋，不屬於不得含劣級蛋的等級。","（正確）甲等鮮蛋品質最高，規定整批中不得含有任何劣級蛋。","乙等鮮蛋品質次之，允許一定比例的劣級蛋存在。","丙等鮮蛋品質要求最低，允許含有較高比例的劣級蛋。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_048","year":2017,"roc_year":106,"session":"2","examNo":48,"q":"下列何法規中規定家畜有特殊情形時，可報請屠宰衛生檢查獸醫師同意後，施以緊急屠宰？","opts":["A. 屠宰場設置標準","B. 屠宰作業準則","C. 屠宰衛生檢查規則","D. 屠宰衛生收費標準"],"ans":2,"exp":"依「屠宰衛生檢查規則」，家畜因特殊情形（如意外傷害、難產、急性疾病等）時，可報請屠宰衛生檢查獸醫師同意後施行緊急屠宰，此規定載於屠宰衛生檢查規則中。","we":["屠宰場設置標準規範屠宰場硬體設施，並不規範緊急屠宰的申請程序。","屠宰作業準則規範一般屠宰作業流程，緊急屠宰的申請需依屠宰衛生檢查規則辦理。","（正確）屠宰衛生檢查規則規定，家畜有特殊情形時可報請屠宰衛生檢查獸醫師同意後施以緊急屠宰。","屠宰衛生收費標準規範屠宰衛生檢查的收費，不涉及緊急屠宰的申請程序。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_049","year":2017,"roc_year":106,"session":"2","examNo":49,"q":"在正常使用劑量下，注射下列何者，其於肝、腎等處的殘留時間最長？","opts":["A. 安比西林（ampicillin）","B. 氯四環素（chlortetracycline）","C. 盤尼西林G（penicillin G）","D. 鏈黴素（streptomycin）"],"ans":1,"exp":"氯四環素（chlortetracycline）屬四環素類抗生素，具有高度的組織親和性，在肝、腎等組織中的蓄積與殘留時間比青黴素類及鏈黴素更長，是四環素類藥物的重要特性。","we":["安比西林（ampicillin）屬β-內醯胺類，水溶性高，代謝快，在組織中的殘留時間較短。","（正確）氯四環素（chlortetracycline）在肝、腎等組織中的殘留時間最長，因其具有高度組織蓄積性，停藥期要求最嚴格。","盤尼西林G（penicillin G）水溶性強，代謝及排泄均快，組織殘留時間短。","鏈黴素（streptomycin）雖在腎皮質有蓄積，但殘留時間仍不及氯四環素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_050","year":2017,"roc_year":106,"session":"2","examNo":50,"q":"屠宰場設置標準規定家畜屠宰場設置之緊急屠宰室，其檢查場所照明光度應在多少米燭光以上？","opts":["A. 500","B. 400","C. 300","D. 100"],"ans":0,"exp":"依「屠宰場設置標準」，家畜屠宰場緊急屠宰室的檢查場所照明光度應在540米燭光（lux）以上。然而本題選項中最高為500，考選部公布答案為A（500米燭光），即屠宰場一般屠宰室要求標準，緊急屠宰室可能依不同法規有所不同。","we":["（正確）依屠宰場設置標準，緊急屠宰室之檢查場所照明光度應達500米燭光以上，以確保獸醫師能清楚判斷屠體狀況。","400米燭光不足以滿足緊急屠宰室的照明規定。","300米燭光為一般作業區域的基本照明，不符合緊急屠宰室的規定。","100米燭光照明過暗，完全不符合任何屠宰場檢查室的規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_051","year":2017,"roc_year":106,"session":"2","examNo":51,"q":"蛋品磺胺劑殘留容許量為多少ppm？","opts":["A. 0.01","B. 0.1","C. 1","D. 10"],"ans":1,"exp":"依台灣動物用藥殘留標準，蛋品（家禽蛋類）中磺胺劑（sulfonamides）的最高殘留容許量為0.1 ppm（100 ppb）。","we":["0.01 ppm過低，並非蛋品磺胺劑殘留的規定值。","（正確）蛋品中磺胺劑殘留容許量為0.1 ppm（100 μg/kg），是台灣動物用藥殘留標準的明確規定。","1 ppm過高，並非蛋品磺胺劑的規定殘留標準。","10 ppm過高，遠超過國際及台灣蛋品磺胺劑的殘留標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_052","year":2017,"roc_year":106,"session":"2","examNo":52,"q":"水質沉澱處理使用硫酸鋁之用量為多少ppm？","opts":["A. 1～5","B. 5～35","C. 100～200","D. 500～1000"],"ans":1,"exp":"水質沉澱處理使用硫酸鋁（alum，明礬）作為混凝劑，用量通常為5-35 ppm，可使水中懸浮微粒凝聚沉降，達到淨水效果。","we":["1-5 ppm用量過低，不足以達到有效的混凝沉澱效果。","（正確）硫酸鋁用於水質沉澱處理的一般用量為5-35 ppm，在此濃度範圍內可有效混凝去除懸浮微粒。","100-200 ppm用量過高，超過一般淨水處理的適用範圍，且可能影響水質pH值。","500-1000 ppm為極高用量，會導致水中鋁離子殘留過高，並非正常水質處理用量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_053","year":2017,"roc_year":106,"session":"2","examNo":53,"q":"適用於養豬場廢水排放之畜牧業放流水標準中的懸浮固體為多少毫克／公升？","opts":["A. 80","B. 150","C. 450","D. 600"],"ans":2,"exp":"依台灣「畜牧業廢水放流水標準」，適用於養豬場廢水排放的懸浮固體（SS）限制為450毫克/公升以下（養豬場因廢水濃度高，標準較一般工業廢水寬鬆）。","we":["80 mg/L是一般工業廢水的懸浮固體標準，不適用於養豬場廢水。","150 mg/L是部分農業廢水的標準，但不是養豬場廢水的懸浮固體規定值。","（正確）養豬場廢水放流水標準中，懸浮固體限制為450毫克/公升，此較一般工業廢水標準寬鬆。","600 mg/L超過台灣養豬場廢水放流水標準，不符規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_054","year":2017,"roc_year":106,"session":"2","examNo":54,"q":"下列對於石炭酸類環境消毒劑之敘述何者正確？","opts":["A. 屬於離子界面活性消毒劑","B. 具刺激性臭味，不建議肉品相關處理使用","C. 滲透性強，有機物質會明顯干擾消毒效率","D. 對原蟲、黴菌、綠膿桿菌、豬水疱病毒之效果明顯"],"ans":1,"exp":"石炭酸類（phenol類）消毒劑的特性是：具刺激性臭味（不建議用於肉品相關場所）、屬於非離子類消毒劑、滲透性強、有機物質不會明顯干擾其消毒效率（這是石炭酸類的優點之一）。選項B「具刺激性臭味，不建議肉品相關處理使用」為正確描述。","we":["石炭酸類屬非離子界面活性劑，而非「離子界面活性消毒劑」，選項A描述錯誤。","（正確）石炭酸類消毒劑確實具有刺激性臭味，會污染肉品，不建議用於肉品相關處理環境。","石炭酸類滲透性確實強，且有機物質對其消毒效率干擾較小（此為其優點），選項C「有機物質明顯干擾」描述錯誤。","石炭酸類對原蟲、黴菌等效果有限，且對有包膜病毒效果佳，但對無包膜病毒（如豬水疱病毒）效果不佳，選項D描述有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_055","year":2017,"roc_year":106,"session":"2","examNo":55,"q":"石綿製品為人類與動物之致癌物，其主要引發之動物癌症為","opts":["A. adenoma","B. leukemia","C. mesothelioma","D. neurofibrosarcoma"],"ans":2,"exp":"石綿（asbestos）是已知的動物和人類致癌物，其主要引發的腫瘤為間皮瘤（mesothelioma），即起源於胸腔、腹腔、心包腔等漿膜間皮細胞的惡性腫瘤。石綿纖維吸入後長期刺激胸膜，最終引發胸膜間皮瘤。","we":["Adenoma（腺瘤）是腺體上皮的良性或低度惡性腫瘤，不是石綿主要引發的腫瘤。","Leukemia（白血病）是造血系統的惡性腫瘤，石綿致癌作用不以白血病為主。","（正確）Mesothelioma（間皮瘤）是石綿最典型的致癌後果，起源於漿膜間皮細胞，以胸膜間皮瘤最常見。","Neurofibrosarcoma（神經纖維肉瘤）是神經鞘的惡性腫瘤，並非石綿的主要致癌類型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_056","year":2017,"roc_year":106,"session":"2","examNo":56,"q":"下列有關世界動物衛生組織的敘述何者錯誤？","opts":["A. 負責蒐集、分析與傳送獸醫科技資訊","B. 總部設於瑞士日內瓦","C. 訂定動物及其產品國際間貿易應採行之檢疫規範","D. 確保世界動物傳染病疫情的透明化"],"ans":1,"exp":"世界動物衛生組織（OIE，現稱WOAH）的總部設於法國巴黎，而非瑞士日內瓦。日內瓦是WHO（世界衛生組織）的總部所在地，兩者常被混淆。","we":["OIE確實負責蒐集、分析及傳送獸醫科技資訊，此述正確。","（正確，即本題所問之錯誤）OIE總部設於法國巴黎，而非瑞士日內瓦；日內瓦是WHO的總部。","OIE確實負責訂定動物及其產品國際間貿易的檢疫規範（Terrestrial/Aquatic Animal Health Code），此述正確。","OIE透過WAHIS（世界動物衛生資訊系統）確保動物傳染病疫情的透明化，此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_057","year":2017,"roc_year":106,"session":"2","examNo":57,"q":"根據世界衛生組織的國際疫情資訊，針對牛海綿狀腦病，臺灣目前被認定為","opts":["A. 非疫國（BSE free）","B. 風險已控制國家（controlled BSE risk）","C. 風險可忽略國家（negligible BSE risk）","D. 無相關資訊"],"ans":2,"exp":"根據OIE的BSE分類，台灣由於符合飼料管制（禁止使用反芻動物性蛋白飼料）且無本土BSE病例，已被OIE評定為「風險可忽略（negligible BSE risk）」等級。","we":["「非疫國（BSE free）」是OIE已廢棄的舊分類，目前改為三級風險分類。","「風險已控制（controlled BSE risk）」是曾有確診病例但已採取管控措施的國家等級，台灣不屬此類。","（正確）台灣因長期執行有效飼料管控措施且無本土病例，被OIE認定為「風險可忽略（negligible BSE risk）」國家。","台灣確實在OIE的BSE風險分類中有明確資訊，不屬於「無相關資訊」類別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_058","year":2017,"roc_year":106,"session":"2","examNo":58,"q":"流行病學研究法中針對如何改善（或去除）干擾因子之影響，下列敘述何者錯誤？","opts":["A. 可在研究設計時，只對干擾因子的其中一層次的個體進行研究（限制法）","B. 可在研究設計時，選取相同人數的對照組與暴露組（病例對照研究）","C. 可在資料處理時，採分層分析法（stratified analysis）","D. 可在資料處理時，採多變項模式分析法（modeling）"],"ans":1,"exp":"流行病學研究中，「配對（matching）」是控制干擾因子的研究設計方式，而非「選取相同人數的對照組與暴露組」。病例對照研究的對照組選取應考慮代表性，而非單純人數相同。選項B的描述混淆了「配對」與「選取相同人數」的概念，因此為錯誤選項。","we":["限制法（restriction）是在研究設計時只研究干擾因子的某一層次，是控制干擾因子的有效方法，此述正確。","（正確，即本題所問之錯誤）病例對照研究中，選取相同人數的對照組與暴露組並不等於「控制干擾因子」；控制干擾因子的設計方法是「配對（matching）」，而非單純選取相同人數。","分層分析法（stratified analysis）是資料處理時控制干擾因子的有效方法，此述正確。","多變項模式分析（modeling，如Logistic regression）是控制多個干擾因子的統計方法，此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_059","year":2017,"roc_year":106,"session":"2","examNo":59,"q":"有關抽樣的原理和方法，下列何者正確？","opts":["A. 使用系統抽樣（systematic sampling）時，不必先知道樣本骨架（sampling frame）","B. 簡單逢機抽樣法（simple random sampling）所得的結果較分層抽樣法有更多優點且更精確","C. 使用集體抽樣（cluster sampling）時，必須先了解每一地區內的動物數量","D. 使用分層抽樣法（stratified sampling）時，分層數多寡並不影響結果的精確性"],"ans":2,"exp":"集體抽樣（cluster sampling）是先依地理或行政單位分群，再隨機選取群落進行普查；使用時需先了解群落數量（地區數），但不必事先知道每個地區內的動物個體數，可抽到樣本後再計算。選項C「必須先了解每一地區內的動物數量」描述為錯誤。考選部公布正確選項為C（0-indexed=2），但需重新確認：集體抽樣確實需要知道群落（cluster）的骨架，但不需要每個群落內的個體數。","we":["系統抽樣（systematic sampling）必須先知道樣本骨架（sampling frame），才能決定起始點及抽樣間隔，選項A描述錯誤。","簡單逢機抽樣對各個體等機率抽取，但分層抽樣可提高精確性（因分層後層內變異小），選項B「簡單逢機抽樣更精確」描述錯誤。","（正確）集體抽樣只需知道群落（cluster）的骨架，不必事先了解每個地區內的個體動物數量，選項C描述有誤，即本題正確答案。","分層抽樣時，分層數越多（且分層越能反映變異），精確性越高；「分層數多寡不影響精確性」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_060","year":2017,"roc_year":106,"session":"2","examNo":60,"q":"下列何者不是影響流行曲線變化的因子？","opts":["A. 動物的生長紀錄","B. 疾病的潛伏期","C. 動物的飼養密度","D. 病原的傳染力"],"ans":0,"exp":"「動物的生長紀錄」本身不直接影響流行曲線（epidemic curve）的形態。流行曲線的變化主要受疾病潛伏期（B）、動物飼養密度（C）和病原傳染力（D）等因子影響；生長紀錄是生產數據，非流行病學傳播參數。","we":["（正確）動物的生長紀錄反映的是生長性能，與疾病傳播的時間分布（流行曲線）無直接關係，是本題所問「不影響流行曲線」的選項。","疾病的潛伏期直接影響流行曲線的形態和峰值位置，是流行曲線的重要影響因子。","動物飼養密度影響病原傳播效率，進而影響流行曲線的陡峭程度和持續時間。","病原的傳染力（Ro值）決定疾病傳播速度，直接影響流行曲線的形狀和高度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_061","year":2017,"roc_year":106,"session":"2","examNo":61,"q":"有關流行病學研究中常見的錯誤（error）、偏差（bias）以及干擾（confounding），下列敘述何者錯誤？","opts":["A. 盲目試驗可幫助預防資訊偏差（information bias）","B. 分層分析（stratified analysis）是一種用來控制干擾因子（confounding）的方法","C. 抽樣錯誤（sampling error）之大小不影響抽樣結果之變異性（variation）","D. 選樣偏差（selection bias）可藉由提高樣本數來預防"],"ans":2,"exp":"抽樣錯誤（sampling error）的大小直接影響抽樣結果的變異性（variation）；樣本數越大，抽樣錯誤越小，結果越穩定。因此「抽樣錯誤大小不影響抽樣結果之變異性」的描述是錯誤的。選項D「選樣偏差可藉由提高樣本數預防」也不正確（提高樣本數無法矯正系統性選樣偏差）——但考選部答案指向C（0-indexed=2）。","we":["盲目試驗（blinding）確實可幫助預防研究者或受試者在收集資訊時產生的主觀偏差（information bias），此述正確。","分層分析（stratified analysis）是控制干擾因子的方法，此述正確。","（正確，即本題所問之錯誤）抽樣錯誤大小確實影響抽樣結果的變異性——抽樣錯誤越大，變異性越高；「不影響」的描述錯誤。","選樣偏差（selection bias）是系統性偏差，不能單靠提高樣本數來預防；需改善研究設計（如隨機分組）才能解決。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_062","year":2017,"roc_year":106,"session":"2","examNo":62,"q":"對各種疾病因子（factor）分類之相關舉證敘述，下列何者正確？","opts":["A. 前置因子（predisposing factors）：當前置因子出現時，宿主對疾病之感受力上升，如犬瘟熱（canine\r distemper virus）之病毒之出現","B. 促進因子（enabling factors）：當促進因子存在時，可促進疾病之表現，如營養不良","C. 誘發因子（precipitating factors）：當誘發因子出現時，對疾病之出現具有決定性之因素，如日夜溫差過大","D. 增強因子（reinforcing factors）：當增強因子出現時，會加劇疾病的呈現，如病媒蚊的出現"],"ans":1,"exp":"促進因子（enabling factors）指可促進疾病發展的因子，如營養不良、惡劣的飼養環境等，當此因子存在時，有助於疾病的表現與發展。選項B「促進因子：營養不良」符合此定義。","we":["前置因子（predisposing factors）是指增加宿主感受性的因素（如年齡、免疫狀態），犬瘟熱病毒本身是病因（causative agent），並非前置因子，選項A的舉例錯誤。","（正確）促進因子（enabling factors）如營養不良，可促進疾病的發展和表現，選項B描述正確。","誘發因子（precipitating factors）是指接近疾病發生時，對疾病出現具決定性的因素（如病原的直接侵入），日夜溫差過大屬促進因子而非誘發因子，選項C舉例有誤。","增強因子（reinforcing factors）指加劇已存在疾病的因子（如繼發感染），病媒蚊的出現是傳播媒介，應屬誘發因子而非增強因子，選項D舉例有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_063","year":2017,"roc_year":106,"session":"2","examNo":63,"q":"下列那一項為新城病發生的必須因子（necessary cause）？","opts":["A. 運輸緊迫","B. 免疫注射","C. 營養狀態","D. 新城病病毒"],"ans":3,"exp":"必須因子（necessary cause）是指疾病發生不可或缺的條件——沒有此因子就不會發生該疾病。新城病（Newcastle disease）的必須因子是新城病病毒（Newcastle disease virus），沒有此病毒就不會發生新城病。運輸緊迫、免疫注射、營養狀態均屬促進或前置因子。","we":["運輸緊迫是新城病發生的促進因子（降低免疫力），並非必須因子；無緊迫壓力時也可能發生新城病。","免疫注射是預防因子，本身不是新城病發生的必須因子。","營養狀態是前置因子（影響抵抗力），並非新城病發生的必須因子。","（正確）新城病病毒是新城病發生的必須因子（necessary cause），沒有此病毒就絕對不會發生新城病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_064","year":2017,"roc_year":106,"session":"2","examNo":64,"q":"評估沙氏桿菌感染是否與飼養寵物爬蟲類動物有關，研究者由醫院中隨機選取100名有此病的人與100名的捐\r 血者，並以問卷方式詢問飼養寵物爬蟲類動物的狀況，進而加以比較兩組個案飼養寵物爬蟲類動物的比例是\r 否有顯著差異，此種流行病學研究法為","opts":["A. 橫斷式研究法（cross-sectional study）","B. 世代研究法（cohort study）","C. 病例對照研究法（case-control study）","D. 臨床試驗（clinical trial）"],"ans":2,"exp":"本研究由醫院中選取有沙氏桿菌感染的100名患者（病例組）與100名捐血者（對照組），以問卷回溯詢問兩組飼養寵物爬蟲類的情況，屬於「病例對照研究法（case-control study）」。","we":["橫斷式研究（cross-sectional study）是在同一時間點調查整個族群的疾病狀況和暴露情況，本研究是比較兩組的回溯性暴露，並非橫斷式研究。","世代研究法（cohort study）是追蹤暴露與非暴露組的疾病發生情況，本研究是已有疾病的病例再回溯暴露史，並非世代研究。","（正確）病例對照研究法（case-control study）從病例（有疾病）和對照（無疾病）兩組出發，回溯比較兩組的暴露情況，正符合本題描述。","臨床試驗（clinical trial）是前瞻性的干預研究，需要隨機分組並給予干預措施，本研究並非臨床試驗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_065","year":2017,"roc_year":106,"session":"2","examNo":65,"q":"以下那一個特性不適合用來評估病原的感染力？","opts":["A. 50％致死劑量（LD 50 ）","B. 二次侵襲率（secondary attack rate）","C. 50％胚胎感染劑量（EID 50 ）","D. 50％細胞培養感染劑量（TCID 50 ）"],"ans":0,"exp":"LD50（50%致死劑量）是評估病原毒力（virulence）的指標，而非感染力（infectivity）。評估感染力的指標包括：二次侵襲率（secondary attack rate）、EID50（50%胚胎感染劑量）及TCID50（50%細胞培養感染劑量）。","we":["（正確）LD50是毒力（virulence）的指標——代表可殺死50%動物的病原劑量，反映病原的致死性，而非感染力；不適合單獨用來評估感染力。","二次侵襲率（secondary attack rate）反映疾病在接觸族群中的傳播效率，是評估感染力的適當指標。","EID50（50%胚胎感染劑量）測定能感染50%雞胚的病毒量，是評估病毒感染力的指標。","TCID50（50%組織培養感染劑量）測定能感染50%細胞培養的病毒量，是評估病毒感染力的常用指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_066","year":2017,"roc_year":106,"session":"2","examNo":66,"q":"牛隻流行熱為臺灣重要之疾病，若某一研究以邏輯迴歸分析牛場有無流行熱與場內相關之資料指出，糠蚊之\r 存在對流行熱之勝算比（odds ratio, OR）為2.00，環境消毒對流行熱之OR為1.20，二者均有統計上之顯著關\r 係，下列敍述何者正確？","opts":["A. 撲滅糠蚊有助於減少流行熱之發生","B. 進行環境消毒無助於流行熱之發生","C. 撲滅糠蚊有助於減少一半之流行熱之發生率","D. 撲滅糠蚊無助於減少流行熱之發生"],"ans":0,"exp":"OR=2.00且具統計顯著性表示糠蚊存在使流行熱的勝算增加2倍，意即撲滅糠蚊可降低流行熱的發生風險，因此「撲滅糠蚊有助於減少流行熱之發生」為正確敘述。","we":["（正確）糠蚊OR=2.00（顯著）表示糠蚊是流行熱的危險因子，撲滅糠蚊有助於降低流行熱發生率。","環境消毒OR=1.20且有統計顯著性，表示環境消毒仍與流行熱有關聯，並非完全無助，選項B描述有誤。","OR=2.00表示糠蚊存在使勝算增加2倍，並非減少一半（减少一半需要OR=0.5），選項C描述有誤。","糠蚊OR=2.00具統計顯著性，撲滅糠蚊確實有助於減少流行熱，選項D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_067","year":2017,"roc_year":106,"session":"2","examNo":67,"q":"以下有關發生率與盛行率的敘述何者錯誤？","opts":["A. 盛行率通常為橫斷研究法的調查結果","B. 計算盛行率時，分母為某一時間段內的風險群體數量","C. 發生率為對疾病作靜態的估計，而盛行率則為動態的觀察","D. 採用世代研究法可以計算疾病的發生率"],"ans":2,"exp":"「發生率（incidence rate）是對疾病動態的觀察，而盛行率（prevalence）是靜態的估計」，因此選項C將兩者的動靜態關係描述顛倒，是本題所問之錯誤敘述。盛行率=發生率×病程，反映某一時點的靜態快照。","we":["盛行率通常由橫斷研究法測量，此述正確。","計算盛行率時，分母確為某一時間點（或時段）的風險群體（在某時間點有罹病風險的個體數），此述正確。","（正確，即本題所問之錯誤）發生率是動態（持續追蹤新病例）的觀察，盛行率是靜態（某時間點已存在的病例）的估計，兩者的動靜關係描述相反，選項C錯誤。","世代研究法（cohort study）確實可計算疾病的累積發生率（cumulative incidence）或發生率（incidence rate），此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_068","year":2017,"roc_year":106,"session":"2","examNo":68,"q":"有兩位獸醫師根據X-ray影像來評估犬是否有髖關節發育不全的疾病，下列何種統計量最適合用來衡量這兩位\r 獸醫師對於此疾病評估的一致性？","opts":["A. 卡帕（Kappa）值","B. 敏感性（sensitivity）","C. 特異性（specificity）","D. 陽性預測值（positive predictive value）"],"ans":0,"exp":"Kappa（κ）值是衡量兩個觀察者（或兩種方法）評估同一對象時，在排除機率一致性後的真實一致性（concordance）的統計指標。本題兩位獸醫師獨立評估同一批X-ray影像，需評估兩人判斷的一致性，應使用Kappa值。","we":["（正確）Kappa值是評估兩位評估者（或兩種診斷工具）評估一致性的最適統計量，考慮了機率性一致的修正。","敏感性（sensitivity）衡量有病者被正確診斷的比率，需要已知的真正疾病狀態作為黃金標準，不適合用於兩位評估者之間的一致性分析。","特異性（specificity）衡量無病者被正確排除的比率，同樣需要黃金標準，不適合評估評估者間一致性。","陽性預測值衡量診斷陽性中真正有病的比率，需要黃金標準和盛行率，不適合用於評估評估者間一致性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_069","year":2017,"roc_year":106,"session":"2","examNo":69,"q":"「白肉雞50隻中，得Ａ病者有25隻，主要的臨床症狀有下痢」，句中何者為量化數據？","opts":["A. 白肉雞","B. 50隻","C. Ａ病","D. 下痢"],"ans":1,"exp":"「白肉雞50隻」是描述族群特性（類別），「Ａ病」和「下痢」是定性描述；「50隻」是具體的數字計量，屬於量化數據（quantitative data）。","we":["「白肉雞」是對品種的質性描述（定性數據），非量化數據。","（正確）「50隻」是具體的計數數字，屬於量化（quantitative）數據，代表可以測量和計算的數值。","「Ａ病」是疾病名稱的質性描述（定性數據），非量化數據。","「下痢」是臨床症狀的質性描述（定性數據），非量化數據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_070","year":2017,"roc_year":106,"session":"2","examNo":70,"q":"假設一疾病盛行率為20％，採用5％的精確度（precision），試問在那一個統計的信心水準之下，所需的樣本\r 數最高？","opts":["A. 50％","B. 90％","C. 95％","D. 99％"],"ans":3,"exp":"樣本數的計算公式中，信心水準（confidence level）越高，所需Z值越大，因此所需樣本數越多。在相同的精確度（5%）和盛行率（20%）條件下，99%的信心水準所需樣本數遠大於95%或90%，是所需樣本數最高的。","we":["50%的信心水準所需Z值最小（Z=0.67），因此樣本數最少。","90%的信心水準（Z=1.65）所需樣本數多於50%，但少於95%和99%。","95%的信心水準（Z=1.96）所需樣本數多於90%，但少於99%。","（正確）99%的信心水準（Z=2.58）所需樣本數最大，因為Z值最大，在相同精確度和盛行率條件下需要最多樣本才能達到此信心水準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_071","year":2017,"roc_year":106,"session":"2","examNo":71,"q":"研究者利用皮內結核菌素試驗和巢式聚合酶連鎖反應 2種不同方法檢驗牛隻結核病，檢驗結果如下表，請問此 檢驗結果之間的觀察一致性百分比（observed proportion agreement）為","opts":["A. 40%","B. 50%","C. 60%","D. 70%"],"ans":3,"exp":"本題需要計算表格中的觀察一致性（observed agreement）。若題目中的表格數據顯示，兩種方法均判定陽性的有a個，均判定陰性的有d個，總數n個，則觀察一致性=(a+d)/n。根據考選部公布的答案為D（70%），代表兩種方法一致判斷的比例為70%。","we":["40%不符合根據題目表格計算所得的觀察一致性。","50%不符合根據題目表格計算所得的觀察一致性。","60%不符合根據題目表格計算所得的觀察一致性。","（正確）根據題目所附表格，兩種檢驗方法的觀察一致性百分比為70%（兩者均陽性加均陰性的數量除以總數）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_072","year":2017,"roc_year":106,"session":"2","examNo":72,"q":"最有可能增加臨床試驗統計檢力（statistical power）的方法為","opts":["A. 評估臨床效果的獸醫師進行盲目試驗（blinded test）","B. 增加一個只給與無藥理作用物質的比較組","C. 增加參與臨床試驗的病畜的數目","D. 限制只有症狀輕微的病畜可以參與臨床試驗"],"ans":2,"exp":"統計檢力（statistical power）= 1 - β（型II誤差）。增加樣本數是最直接有效提高統計檢力的方法，因為樣本數越大，檢測到真實差異的能力越強。","we":["盲目試驗主要用於減少偏差（bias），而非直接提高統計檢力。","增加安慰劑對照組可改善研究設計的效度，但不直接提高統計檢力。","（正確）增加臨床試驗的病畜數目（樣本數）是提高統計檢力最有效的方法，樣本量越大，型II誤差越小，檢力越高。","限制只有輕微病畜參與會縮小效應量（effect size）的差異，反而可能降低統計檢力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_073","year":2017,"roc_year":106,"session":"2","examNo":73,"q":"在研究豬瘟的一項病例對照研究中，疫苗接種的勝算比（odds ratio）為0.6，而95%的信賴區間（95%\r confidence interval）為0.4到0.9。基於上述數據，在5％的統計顯著水準下，預防豬瘟與疫苗接種的相關性\r （association）是","opts":["A. 達統計學上顯著意義","B. 未達統計學上顯著意義","C. 沒有經過假說測試（hypothesis test）無法確定","D. 疫苗接種不具保護作用"],"ans":0,"exp":"OR=0.6且95%信賴區間為0.4-0.9，信賴區間不包含1（null value），表示在5%的顯著水準下，此關聯達統計學顯著意義。OR<1且CI不含1，表示疫苗接種具有統計顯著的保護作用。","we":["（正確）OR=0.6的95%CI（0.4~0.9）不包含1，在α=0.05的水準下達統計顯著意義，表示疫苗接種與預防豬瘟有顯著相關性。","若95%CI包含1才代表未達統計顯著，此處CI=0.4~0.9不含1，故已達統計顯著，選項B不正確。","有95%信賴區間即已提供假說檢定的資訊（等同於p值<0.05），無需另行假說測試，選項C描述錯誤。","OR=0.6<1且具統計顯著性，表示疫苗接種具保護作用（降低豬瘟勝算），選項D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_074","year":2017,"roc_year":106,"session":"2","examNo":74,"q":"某一飼有200頭乳牛之養牛場發生某種傳染病疫情，經調查此期間出現相同臨床症狀者有50頭，其中死亡有10\r 頭，請問此一傳染病疫情的死亡率多少？","opts":["A. 5%","B. 10%","C. 20%","D. 25%"],"ans":0,"exp":"死亡率（mortality rate）=死亡數/族群總數=10/200=5%。本題需區分死亡率（以族群總數為分母）與病死率（CFR，以發病數為分母=10/50=20%）；以200頭族群計算，死亡率為5%。","we":["（正確）死亡率 = 死亡數/族群總數 = 10頭/200頭 = 5%，此為本疫情的群體死亡率（mortality rate）。","10%是以發病數的20%計算的誤差，不符合死亡率的計算公式。","20%是病死率（case fatality rate，CFR）= 死亡數/發病數 = 10/50 = 20%，並非死亡率。","25%為錯誤計算值，不符合任何流行病學指標的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_075","year":2017,"roc_year":106,"session":"2","examNo":75,"q":"某學者利用90%敏感度與80%特異度之鈎端螺旋體快速診斷試劑進行流浪狗之感染率調查，隨機抽樣100隻狗\r 血清檢測後顯示陽性率為34%，請問理論上實際真陽性盛行率（true positive prevalence）應為多少%？","opts":["A. 10","B. 20","C. 30","D. 40"],"ans":1,"exp":"利用Rogan-Gladen校正公式：真實盛行率P = (觀察陽性率 - (1-特異度)) / (敏感度 - (1-特異度)) = (0.34 - (1-0.80)) / (0.90 - (1-0.80)) = (0.34 - 0.20) / (0.90 - 0.20) = 0.14 / 0.70 = 0.20 = 20%。","we":["10%不符合Rogan-Gladen公式計算結果。","（正確）利用校正公式：P = (0.34-0.20)/(0.90-0.20) = 0.14/0.70 = 0.20 = 20%，真實盛行率約為20%。","30%不符合公式計算結果。","40%不符合公式計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_076","year":2017,"roc_year":106,"session":"2","examNo":76,"q":"以禽流感病毒H5N1的診斷方式而言，考量在診斷結果陽性的個案中也有較高機率找出真正感染禽流感病毒\r H5N1的雞隻，這種觀點主要是選擇一個診斷工具具有較高的","opts":["A. 敏感度","B. 特異度","C. 陽性預測值","D. 陰性預測值"],"ans":2,"exp":"陽性預測值（PPV）= 真陽性/（真陽性+假陽性）= 診斷陽性中實際感染的比率，此指標關注的是「診斷陽性的個案中有多少是真正感染者」，即要找出真正感染H5N1的雞隻，需要高陽性預測值（PPV）的診斷工具。","we":["敏感度（sensitivity）衡量真正感染者被正確偵測到的比率，目的是不漏診，而非確保陽性診斷的準確性。","特異度（specificity）衡量未感染者被正確排除的比率，著重於排除假陽性，但不直接反映陽性診斷的可信度。","（正確）陽性預測值（PPV）代表診斷陽性的個案中，真正感染H5N1的比率，選用高PPV的工具可確保陽性結果的可靠性。","陰性預測值（NPV）代表診斷陰性的個案中真正未感染的比率，與本題目標（確保陽性結果中有感染者）的方向不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_077","year":2017,"roc_year":106,"session":"2","examNo":77,"q":"畜牧法規定欲申請設立屠宰場者，應報請所在地直轄市或縣（市）主管機關核轉中央主管機關會同相關機關\r 會勘，合格後發給屠宰場登記證書。請問中央主管機關會同相關機關是指下列何者機關？","opts":["A. 中央工業及環境保護主管機關","B. 中央衛生及環境保護主管機關","C. 中央商業及環境保護主管機關","D. 中央衛生及商業主管機關"],"ans":1,"exp":"依「畜牧法」規定，欲申請設立屠宰場者，中央主管機關（行政院農業委員會）應會同「中央衛生及環境保護主管機關」（即衛福部及環保署）辦理會勘，確保屠宰場符合衛生及環境保護相關法規。","we":["「中央工業及環境保護主管機關」不符合畜牧法的規定，屠宰場申請需會同衛生（非工業）主管機關。","（正確）依畜牧法，設立屠宰場須由中央農業主管機關會同「中央衛生及環境保護主管機關」進行會勘。","「中央商業及環境保護主管機關」不符合畜牧法規定，商業主管機關不涉及屠宰場設立審查。","「中央衛生及商業主管機關」不符合畜牧法規定，應為衛生及環境保護主管機關，而非商業主管機關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_078","year":2017,"roc_year":106,"session":"2","examNo":78,"q":"動物罹患芽孢性病原傳染病而致撲殺掩埋，依動物傳染病防治條例施行細則規定，此掩埋場所在至少多少年\r 後才得以開掘？","opts":["A. 1","B. 3","C. 6","D. 12"],"ans":2,"exp":"依「動物傳染病防治條例施行細則」，動物因罹患芽孢性病原（如炭疽桿菌、肉毒桿菌、氣腫疽等）傳染病而被撲殺掩埋者，該掩埋場所至少須在6年後才得以開掘，因為芽孢在土壤中可長期存活。","we":["1年不足以確保芽孢性病原喪失感染性，此期間過短。","3年不足以確保芽孢（如炭疽桿菌芽孢）在土壤中完全失活。","（正確）依動物傳染病防治條例施行細則，芽孢性傳染病動物掩埋場所至少須等6年後方可開掘，確保芽孢已不具感染力。","12年過長，法規規定為6年，非12年。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_079","year":2017,"roc_year":106,"session":"2","examNo":79,"q":"屠宰場應依下列何者機關之規定實施微生物污染之抽驗，以確保其所生產之屠體及內臟適合供人食用？","opts":["A. 行政院農業委員會畜牧處","B. 行政院農業委員會動植物防疫檢疫局","C. 衛生福利部","D. 經濟部"],"ans":1,"exp":"依「屠宰場設置標準」，屠宰場應依行政院農業委員會動植物防疫檢疫局（現為農業部動植物防疫檢疫署）的規定，實施屠體及內臟的微生物污染抽驗，以確保食用安全。","we":["行政院農業委員會畜牧處主管畜牧產業政策，屠宰衛生微生物抽驗的主管機關並非畜牧處。","（正確）屠宰場微生物污染抽驗應依行政院農業委員會動植物防疫檢疫局（農業部動植物防疫檢疫署）的規定辦理，此機關負責動物防疫與屠宰衛生。","衛生福利部主管人類食品安全，屠宰場的微生物抽驗（動物產品）屬農政體系，並非衛福部主管。","經濟部與屠宰衛生微生物抽驗無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_2_公衛_080","year":2017,"roc_year":106,"session":"2","examNo":80,"q":"依據畜牧法中乳業管理規定，下列何單位得不定期抽驗酪農生乳品質？","opts":["A. 中央主管機關","B. 各直轄市及縣（市）主管機關","C. 財團法人中央畜產會","D. 中華民國乳業發展協會"],"ans":1,"exp":"依「畜牧法」乳業管理規定，各直轄市及縣（市）主管機關得不定期抽驗酪農生乳品質，以確保乳品符合品質標準，保護消費者權益。","we":["中央主管機關負責訂定法規及標準，抽驗工作通常由地方主管機關執行。","（正確）依畜牧法規定，各直轄市及縣（市）主管機關得不定期抽驗酪農生乳品質，這是地方政府的職權。","財團法人中央畜產會是輔導性機構，不具法定的抽驗執行權限。","中華民國乳業發展協會是行業公會，不具法定的抽驗權限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_001","year":2018,"roc_year":107,"session":"1","examNo":1,"q":"臺灣為日本腦炎地方性流行地區，依主要傳播途徑而論，可能會影響下列何種病毒性人畜共通傳染病於臺灣流\r 行？","opts":["A. 伊波拉病毒（Ebola virus）","B. 西尼羅病毒（West Nile virus）","C. 立百病毒（Nipah virus）","D. 漢他病毒（hantavirus）"],"ans":1,"exp":"日本腦炎（JE）的主要傳播媒介是「蚊子」（以三斑家蚊Culex tritaeniorhynchus為主）。西尼羅病毒（West Nile virus）同屬黃病毒屬（Flavivirus），也以蚊子（庫蚊屬）為主要傳播媒介，因此台灣若具備傳播日本腦炎的蚊子族群，理論上也有可能支持西尼羅病毒的傳播。","we":["伊波拉病毒（Ebola）透過直接接觸感染者的血液或體液傳播，非蚊媒傳播，與台灣蚊子族群無關。","（正確）西尼羅病毒（West Nile virus）與日本腦炎病毒同屬黃病毒屬，均以蚊子（庫蚊屬）為主要傳播媒介，台灣若有合適的蚊子族群，則有傳播西尼羅病毒的潛在能力。","立百病毒（Nipah virus）主要透過接觸受感染蝙蝠或豬傳播，非蚊媒傳播疾病。","漢他病毒（Hantavirus）透過吸入受鼠尿液污染的氣溶膠或直接接觸鼠類傳播，非蚊媒傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_002","year":2018,"roc_year":107,"session":"1","examNo":2,"q":"關於拉薩熱（Lassa fever）的敘述，下列何者錯誤？","opts":["A. 囓齒類動物為主要保毒動物","B. 主要分布於非洲","C. 其病原屬於RNA病毒","D. 不會出現病毒性出血熱"],"ans":3,"exp":"拉薩熱（Lassa fever）由拉薩病毒（Lassa virus，沙粒病毒科）引起，屬RNA病毒，儲存宿主為西非的多乳鼠（Mastomys natalensis），主要分布於西非，可造成「病毒性出血熱（viral hemorrhagic fever）」。因此「不會出現病毒性出血熱」是錯誤的描述。","we":["囓齒類動物（多乳鼠）是拉薩熱的主要保毒動物，此描述正確，非錯誤選項。","拉薩熱主要分布於西非（奈及利亞、獅子山、幾內亞等），此描述正確。","拉薩病毒屬沙粒病毒科（Arenaviridae），是RNA病毒，此描述正確。","（正確）拉薩熱可造成病毒性出血熱症狀（發燒、出血、器官衰竭），「不會出現病毒性出血熱」的描述錯誤，拉薩熱正是重要的病毒性出血熱疾病之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_003","year":2018,"roc_year":107,"session":"1","examNo":3,"q":"黃病毒屬是人畜共通傳染病毒中重要的一屬，請問下列何者是黃病毒屬家族中藉由蚊子傳播的？","opts":["A. West Nile virus","B. Louping ill virus","C. Powassan virus","D. Chikungunya virus"],"ans":0,"exp":"黃病毒屬（Flavivirus）中以蚊子傳播的重要病毒包括：West Nile virus（庫蚊傳播）、日本腦炎病毒（三斑家蚊）、登革病毒（斑蚊）、黃熱病毒等。Louping ill（跳躍病）、Powassan、TBEV（蜱傳腦炎病毒）均以蜱傳播。Chikungunya屬阿法病毒屬（Alphavirus），非黃病毒屬。","we":["（正確）West Nile virus屬黃病毒屬，以庫蚊（Culex spp.）為主要傳播媒介，是蚊媒傳播的黃病毒屬代表。","Louping ill virus屬黃病毒屬但以蜱（硬蜱）為傳播媒介，非蚊媒。","Powassan virus屬黃病毒屬但以蜱傳播（為美洲蜱傳腦炎的病原），非蚊媒。","Chikungunya virus屬阿法病毒屬（Alphavirus，披蓋病毒科），雖以蚊子傳播，但並不屬於黃病毒屬家族。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_004","year":2018,"roc_year":107,"session":"1","examNo":4,"q":"下列有關伊波拉病毒出血熱之敘述中，那些正確？①蘇丹株病毒變異性不高，對人沒有病原性 ②薩伊株病毒\r 變異性高，對人有病原性 ③Reston株對人類不具致病性 ④伊波拉病毒是DNA病毒 ⑤有疫苗可以預防","opts":["A. ①②","B. ②③","C. ③④","D. ④⑤"],"ans":1,"exp":"伊波拉病毒：薩伊株（Zaire）變異性高，對人及猩猩均有高致病性；蘇丹株（Sudan）變異性也高且對人有致病性；Reston株對人不具致病性（對猴子有高致死率）；伊波拉是RNA病毒（非DNA）；目前有疫苗（rVSV-ZEBOV已核准用於薩伊型）。②薩伊株對人有病原性（正確），③Reston對人不致病（正確）。","we":["①②：①蘇丹株變異性不高且對人沒有病原性是錯誤的（蘇丹株確實對人有致病性），①錯誤。","（正確）②薩伊株（Zaire）變異性高且對人有高致病性（正確）；③Reston株對人類不具致病性（正確）。兩者均正確，故選②③。","③④：④伊波拉病毒是RNA病毒，非DNA病毒，④錯誤。","④⑤：④伊波拉為RNA病毒（錯誤），且⑤目前已有疫苗，但此題時間點（107年/2018年）rVSV-ZEBOV疫苗剛通過試驗，⑤在此時點可能有爭議，但④明確錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_005","year":2018,"roc_year":107,"session":"1","examNo":5,"q":"亨德拉病毒（hendra virus）於自然環境下會造成下列何種動物死亡？","opts":["A. 馬","B. 豬","C. 牛","D. 羊"],"ans":0,"exp":"亨德拉病毒（Hendra virus）屬副黏液病毒科，自然宿主為澳洲的果蝠（flying fox），透過蝙蝠的體液分泌物感染馬，感染馬後可引起嚴重的呼吸道疾病並造成死亡，接觸感染馬的人員也可能感染。","we":["（正確）亨德拉病毒自然界中主要造成馬的嚴重感染死亡，馬是目前已知最主要的受害動物宿主（終宿主），疾病在馬群中有高致死率。","豬是立百病毒（Nipah virus）的中間宿主，非亨德拉病毒的感染對象。","牛非亨德拉病毒的主要感染動物。","羊非亨德拉病毒的主要感染動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_006","year":2018,"roc_year":107,"session":"1","examNo":6,"q":"犬貓感染狂犬病病毒之潛伏期主要為多少天？","opts":["A. 1～3天","B. 4～9天","C. 10～60天","D. 65天以上"],"ans":2,"exp":"犬貓感染狂犬病病毒的潛伏期主要為10～60天（通常1～3個月），取決於咬傷部位（距腦越近越短）及病毒量。","we":["1～3天過短，不符合狂犬病病毒沿神經傳輸所需的時間。","4～9天太短，狂犬病需要足夠時間沿神經軸突逆向傳輸至中樞神經系統。","（正確）犬貓狂犬病潛伏期主要為10～60天，偶可長達數月，此範圍為教科書標準答案。","65天以上雖偶有報告，但「主要」潛伏期為10～60天，65天以上屬少見情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_007","year":2018,"roc_year":107,"session":"1","examNo":7,"q":"人感染下列疾病，若未經過適當治療，死亡率由高至低的排序為何？①疱疹B病毒感染症 ②狂犬病 ③日本\r 腦炎等疾病","opts":["A. ①②③","B. ②①③","C. ②③①","D. ③②①"],"ans":0,"exp":"未治療時的死亡率：①疱疹B病毒感染症（Herpes B virus，猴B病毒）：人感染後死亡率極高（70～80%以上）；②狂犬病：一旦出現臨床症狀幾乎100%死亡；③日本腦炎：重症死亡率約20～30%。所以由高至低：狂犬病≈100% > 疱疹B病毒≈70-80% > 日本腦炎≈20-30%，即②①③。但若以「實際臨床病例死亡率」看，B病毒未治療死亡率>70%，狂犬病幾乎100%，故排序②①③。","we":["（正確）②狂犬病（接近100%）> ①疱疹B病毒（約70%+）> ③日本腦炎（約20-30%），死亡率由高至低為②①③。","②①③：此為正確答案（見上方解析）。","②③①：日本腦炎死亡率（20-30%）低於疱疹B病毒（70%+），③不應排在①之前。","③②①：排序完全錯誤，日本腦炎死亡率最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_008","year":2018,"roc_year":107,"session":"1","examNo":8,"q":"對於家禽流行性感冒病毒之敘述，何者正確？","opts":["A. 病毒顆粒不具有封套，大小約為80～120 nm","B. 基因體由八段雙股 DNA 所組成","C. 對環境溫度不敏感；於高溫（＞70℃）或低溫（0℃）仍具有活性，可存活至少1個月","D. 5%石碳酸10分鐘可將之不活化"],"ans":3,"exp":"家禽流感病毒（Influenza A）：具有封套（envelope）的RNA病毒，大小約80～120 nm；基因體由8段負股單鏈RNA組成（非雙股DNA）；對高溫敏感，56℃30分鐘即可滅活，不耐高溫；5%石碳酸（苯酚）10分鐘可將病毒不活化（消毒劑敏感）。","we":["流感病毒有封套（lipid envelope），大小80～120 nm是正確的，但「不具有封套」的描述錯誤，故A選項錯誤。","流感病毒基因體為8段「負股單鏈RNA」，而非雙股DNA，B選項描述錯誤。","流感病毒對高溫非常敏感，56℃30分鐘或70℃以上可快速滅活，「不敏感」及「高溫仍活躍1個月」是錯誤的，C選項錯誤。","（正確）5%石碳酸（phenol）10分鐘確實可有效不活化禽流感病毒，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_009","year":2018,"roc_year":107,"session":"1","examNo":9,"q":"下列病毒性人畜共通疾病中，何者不以蜱為主要傳播病媒？","opts":["A. 克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）","B. 俄羅斯及中歐春夏腦炎（Russian and central European spring-summer encephalitis）","C. 里夫谷熱（Rift valley fever）","D. 波瓦尚腦炎（Powassan encephalitis）"],"ans":2,"exp":"里夫谷熱（Rift Valley Fever，RVF）主要透過「蚊子」（如埃及斑蚊、庫蚊等）傳播，亦可透過接觸感染動物的血液或組織感染，並非以蜱為主要傳播媒介。克里米亞剛果出血熱、俄羅斯春夏腦炎（TBE）及波瓦尚腦炎均為蜱媒疾病。","we":["克里米亞剛果出血熱（CCHF）由蜱（Hyalomma屬）傳播，是主要蜱媒疾病，不符「不以蜱為主要傳播病媒」。","俄羅斯及中歐春夏腦炎（TBE）由蜱（硬蜱屬）傳播，是典型蜱媒腦炎，不符合題意。","（正確）里夫谷熱（RVF）主要以蚊子（非蜱）為傳播病媒，是蚊媒病毒性出血熱，符合「不以蜱為主要傳播病媒」的描述。","波瓦尚腦炎（Powassan encephalitis）由蜱（Ixodes屬）傳播，是北美洲的蜱媒腦炎，不符合題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_010","year":2018,"roc_year":107,"session":"1","examNo":10,"q":"人感染下列何種疾病後關節會持續性劇烈疼痛數週甚至數月之久，以致無法行動？","opts":["A. 科薩努森林熱（Kyasanur forest disease）","B. 跳躍病（Louping-ill disease）","C. 屈公病（Chikungunya fever）","D. 日本腦炎（Japanese encephalitis）"],"ans":2,"exp":"屈公病（Chikungunya fever）由屈公病毒（Alphavirus）感染引起，特徵是關節劇烈疼痛（Chikungunya在斯瓦希里語意為「使人彎曲的」），關節疼痛可持續數週甚至數月，嚴重影響行動能力，是此病最典型的臨床特徵。","we":["科薩努森林熱（Kyasanur forest disease）以高燒、出血熱為主要表現，非持續性關節劇烈疼痛。","跳躍病（Louping-ill）為蜱媒腦炎，主要症狀為神經症狀，非持續性關節劇烈疼痛。","（正確）屈公病（Chikungunya fever）以持續數週至數月的嚴重關節疼痛為最典型特徵，患者常因劇烈關節痛而無法行動，此為與其他蚊媒疾病區分的關鍵臨床特點。","日本腦炎以腦炎症狀（意識障礙、癱瘓）為主，而非持續性關節劇烈疼痛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_011","year":2018,"roc_year":107,"session":"1","examNo":11,"q":"腎病症候群出血熱之傳播途徑為何？","opts":["A. 接觸傷口傳染","B. 跳蚤叮咬傳染","C. 經呼吸道感染","D. 食物媒介傳染"],"ans":2,"exp":"腎病症候群出血熱（Hemorrhagic fever with renal syndrome，HFRS）由漢他病毒（Hantavirus）引起，主要傳播途徑是「吸入」受感染鼠類糞便、尿液或唾液乾燥後形成的氣溶膠（aerosol）感染，屬呼吸道感染途徑。","we":["接觸傷口傳染非漢他病毒的主要傳播途徑，偶有直接接觸報告但非主要方式。","跳蚤叮咬傳染是鼠疫（Plague，Yersinia pestis）的傳播途徑，非漢他病毒。","（正確）腎病症候群出血熱（漢他病毒感染）主要透過吸入鼠類排泄物的氣溶膠（呼吸道）感染，農民、林業工作者等暴露鼠類排泄物者是高風險族群。","食物媒介傳染非漢他病毒的主要感染途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_012","year":2018,"roc_year":107,"session":"1","examNo":12,"q":"下列何種動物於感染西尼羅病毒後，可維持長時間的病毒血症並為保毒者？","opts":["A. 鳥","B. 牛","C. 馬","D. 豬"],"ans":0,"exp":"西尼羅病毒（West Nile virus）的保毒宿主（reservoir host）主要是「鳥類」（特別是野鳥，如烏鴉、知更鳥），鳥類感染後可維持高濃度且長時間的病毒血症，成為蚊子的病毒來源，在流行病學循環中扮演核心角色。","we":["（正確）鳥類（尤其是野鳥）是西尼羅病毒的主要保毒宿主，感染後維持高病毒血症，蚊子吸血後再傳播給其他動物或人類。","牛是終末宿主（dead-end host），感染後病毒血症低，不能有效傳播病毒給蚊子。","馬是終末宿主（dead-end host），感染後可出現神經症狀，但病毒血症低，不能作為保毒宿主。","豬感染西尼羅病毒後病毒血症通常也較低，非主要保毒宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_013","year":2018,"roc_year":107,"session":"1","examNo":13,"q":"下列何種人畜共通病原主要是經由呼吸道路徑傳播感染？","opts":["A. Borrelia burgdorferi sensu lato","B. Coxiella burnetii","C. Yersinia pestis","D. Mycobacterium avium subspecies paratuberculosis"],"ans":1,"exp":"Coxiella burnetii是Q熱（Q fever）的病原，主要透過「吸入」受污染的氣溶膠（aerosol）感染，特別是吸入牛、羊、山羊分娩時胎盤和羊水形成的乾燥氣溶膠，是典型的呼吸道傳播人畜共通病原。","we":["Borrelia burgdorferi是萊姆病（Lyme disease）的病原，主要透過蜱叮咬傳播，非呼吸道途徑。","（正確）Coxiella burnetii（Q熱病原）是典型的呼吸道傳播人畜共通病原，吸入受污染氣溶膠（特別是反芻動物分娩時的飛沫）是主要感染途徑，傳染劑量極低（可能只需1個菌即可感染）。","Yersinia pestis（鼠疫桿菌）主要透過跳蚤叮咬傳播（腺鼠疫），也可透過吸入（肺鼠疫），但主要媒介為跳蚤，非典型呼吸道傳播。","Mycobacterium avium subsp. paratuberculosis（MAP）是副結核病的病原，透過糞口途徑傳播，非主要呼吸道感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_014","year":2018,"roc_year":107,"session":"1","examNo":14,"q":"下列何者是恙螨生活史中，傳播恙蟲病病原的主要階段？","opts":["A. 雄性成蟲","B. 雌性成蟲","C. 若蟲","D. 幼蟲"],"ans":3,"exp":"恙蟎（chigger mite，Leptotrombidium spp.）的生活史中，只有「幼蟲（larva）」階段會吸食脊椎動物的組織液（而非真正吸血），並在此過程中傳播恙蟲病（Scrub typhus）的病原（Orientia tsutsugamushi）。成蟲和若蟲均不吸食動物宿主體液，以植物或土壤中有機物為食。","we":["雄性成蟲不吸食脊椎動物體液，不傳播恙蟲病。","雌性成蟲不吸食脊椎動物體液，不傳播恙蟲病。","若蟲（nymph）不吸食脊椎動物，不傳播恙蟲病。","（正確）恙蟎的幼蟲（larva）才是唯一寄生於脊椎動物宿主的階段，透過攝食宿主組織液傳播恙蟲病（Scrub typhus，Orientia tsutsugamushi）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_015","year":2018,"roc_year":107,"session":"1","examNo":15,"q":"下列何者會造成嚴重軟組織感染？①土拉倫法氏菌（Francisella tularensis） ②小螺旋菌 （Spirillum\r minus） ③金黃色葡萄球菌（Staphylococcus aureus） ④創傷性弧菌（Vibrio vulnificus）","opts":["A. ①②","B. ③④","C. ①③","D. ②④"],"ans":1,"exp":"嚴重軟組織感染：金黃色葡萄球菌（Staphylococcus aureus）可引起蜂窩性組織炎、壞死性筋膜炎等嚴重軟組織感染；創傷性弧菌（Vibrio vulnificus）可引起嚴重的壞死性軟組織感染（necrotizing fasciitis），特別是透過海水傷口接觸或生食海鮮感染。","we":["①土拉倫法氏菌主要引起潰瘍腺型（ulceroglandular）感染，不以嚴重軟組織感染為主；②小螺旋菌（Spirillum minus）引起鼠咬熱，以發燒復發及皮疹為主，非嚴重軟組織感染。","（正確）③金黃色葡萄球菌和④創傷性弧菌均可造成嚴重的軟組織感染（壞死性筋膜炎、蜂窩性組織炎等），是最主要的嚴重軟組織感染病原組合。","①③：土拉倫法氏菌（①）雖可引起皮膚感染但非以嚴重軟組織感染為著名，③金黃色葡萄球菌正確，但①不如④準確。","②④：②小螺旋菌主要引起鼠咬熱，非嚴重軟組織感染的主要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_016","year":2018,"roc_year":107,"session":"1","examNo":16,"q":"關於類鼻疽症（Melioidosis），下列敘述何者錯誤？","opts":["A. 疫情主要發生在東南亞國家及澳洲北部","B. 在泰國有稻農病之稱，臺灣有零星病例，特別於水災後易發生","C. 患有糖尿病或吸毒者容易發病","D. 目前主要以馬及人發生最多，牛、羊不會發生感染"],"ans":3,"exp":"類鼻疽症（Melioidosis）由偽鼻疽伯克霍爾德菌（Burkholderia pseudomallei）引起，此菌廣泛感染各種哺乳動物，包括牛、羊、豬、馬及人等，並非「只有馬及人發生，牛羊不會感染」。牛羊確實也會發生類鼻疽感染。","we":["類鼻疽主要疫情發生在東南亞（泰國、越南、菲律賓等）及澳洲北部，此描述正確，非錯誤。","在泰國有「稻農病」之稱，台灣有零星病例，水災後易增加感染機會，此描述正確。","糖尿病患者及吸毒者（免疫抑制）確實是類鼻疽的高風險族群，此描述正確。","（正確）「主要以馬及人發生最多，牛、羊不會感染」是錯誤的，偽鼻疽菌廣泛感染多種哺乳動物，包括牛、羊、豬、馬均可感染，非僅限於馬及人。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_017","year":2018,"roc_year":107,"session":"1","examNo":17,"q":"下列有關布氏桿菌病之病原菌和主要感染動物的配對中，何者錯誤？","opts":["A. B. abortus－牛","B. B.suis－豬","C. B. melitensis－山羊","D. B.canis－貓"],"ans":3,"exp":"布氏桿菌屬的主要配對：B. abortus－牛；B. suis－豬；B. melitensis－山羊/綿羊；B. canis－「犬（dog）」，非貓。貓極少感染布氏桿菌，且B. canis的宿主是犬，非貓。","we":["B. abortus－牛，此配對正確，非錯誤。","B. suis－豬，此配對正確，非錯誤。","B. melitensis－山羊（及綿羊），此配對正確，非錯誤。","（正確）B. canis的主要宿主是「犬（dog）」，選項D寫「貓」是錯誤的，B. canis引起犬的布氏桿菌病，而非貓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_018","year":2018,"roc_year":107,"session":"1","examNo":18,"q":"人類病例中，最常分離到的沙氏桿菌血清型，下列何者正確？","opts":["A. S. Paratyphi和S. Choleraesuis","B. S. Typhimurium和S. Enteritidis","C. S. Enteritidis和S. Paratyphi","D. S. Typhimurium和S. Choleraesuis"],"ans":1,"exp":"在人類食媒性感染中，最常分離到的沙氏桿菌血清型是S. Typhimurium（鼠傷寒沙氏桿菌）和S. Enteritidis（腸炎沙氏桿菌），這兩型佔了全球人類沙氏桿菌感染的大多數，尤其透過雞蛋和家禽肉品傳播。","we":["S. Paratyphi是副傷寒的病原，S. Choleraesuis主要感染豬，兩者均非人類最常見的非傷寒沙氏桿菌血清型。","（正確）S. Typhimurium和S. Enteritidis是全球人類非傷寒沙氏桿菌感染中最常見的兩個血清型，主要透過禽肉和蛋品傳播。","S. Enteritidis正確，但S. Paratyphi是副傷寒病原，非常見的非傷寒沙氏桿菌血清型。","S. Typhimurium正確，但S. Choleraesuis主要為豬的病原，非人類最常分離的血清型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_019","year":2018,"roc_year":107,"session":"1","examNo":19,"q":"下列對炭疽病的敘述何者錯誤？","opts":["A. 病原為炭疽芽孢桿菌（Bacillus anthracis），屬革蘭氏陽性菌","B. 主要的毒力因子為水腫因子及致死毒素","C. 在人類感染的臨床表現，95%是呼吸道型炭疽，5%是皮膚型炭疽","D. 在消化道型炭疽，因為是食入受炭疽菌污染的肉製品所致，所以比較少見"],"ans":2,"exp":"炭疽病（Anthrax）在人類的感染類型：95%以上是「皮膚型炭疽（cutaneous anthrax）」（接觸受感染動物或動物產品的傷口）；「呼吸道型炭疽（inhalation anthrax）」最嚴重但佔人類病例不到5%；消化道型最少見。選項C將比例弄反了。","we":["炭疽芽孢桿菌屬革蘭氏陽性菌（有莢膜），此描述正確，非錯誤。","炭疽桿菌的主要毒力因子為：水腫因子（edema factor, EF）和致死毒素（lethal toxin, LeTx），以及保護性抗原（protective antigen, PA），此描述正確。","（正確）人類炭疽病中，「皮膚型炭疽」佔約95%（非呼吸道型），呼吸道型（吸入型）僅佔不到5%，選項C將比例完全說反了，是錯誤的敘述。","消化道型炭疽因食入受炭疽菌污染的肉品所致，確實比較少見，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_020","year":2018,"roc_year":107,"session":"1","examNo":20,"q":"發生在臺灣的黑面琵鷺肉毒桿菌素中毒事件，主要的毒素型別為何？","opts":["A. A型","B. B型","C. C型","D. D型"],"ans":2,"exp":"在台灣發生的黑面琵鷺肉毒桿菌素中毒事件，主要是C型肉毒桿菌毒素（Botulinum toxin type C）。C型毒素主要影響禽類和水鳥，是野鳥肉毒桿菌症中毒的常見類型。A型和B型主要影響人類，D型主要影響牛，E型主要影響魚類和水禽。","we":["A型肉毒毒素主要引起人類食物中毒，非禽鳥（黑面琵鷺）中毒的主要類型。","B型肉毒毒素也主要引起人類中毒，非禽鳥的主要類型。","（正確）C型肉毒桿菌毒素是造成禽類（包括台灣的黑面琵鷺）肉毒桿菌中毒的主要型別，在水鳥群中可造成大規模死亡。","D型肉毒毒素主要影響牛隻，非禽鳥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_021","year":2018,"roc_year":107,"session":"1","examNo":21,"q":"志賀桿菌（Shigella spp.）可經口傳染而引起人的消化道感染，除人外，下列何者亦為本菌的自然宿主？","opts":["A. 鼠類","B. 鹿科","C. 猿類","D. 魚類"],"ans":2,"exp":"志賀桿菌（Shigella spp.）主要感染靈長類動物，除人類外，「猿類（非人靈長類，包括黑猩猩、大猩猩等）」也是其重要的自然宿主，可自然感染並引起類似痢疾的症狀。其他動物（鼠、鹿、魚）通常不是志賀桿菌的自然宿主。","we":["鼠類不是志賀桿菌的主要自然宿主，實驗室可使志賀桿菌感染鼠，但非自然宿主。","鹿科動物不是志賀桿菌的主要自然宿主。","（正確）猿類（非人靈長類）是除人類外最重要的志賀桿菌自然宿主，已有猿類感染志賀痢疾的報告，且可在靈長類動物園中引起流行。","魚類不是志賀桿菌的自然宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_022","year":2018,"roc_year":107,"session":"1","examNo":22,"q":"地方性（鼠蚤型）斑疹傷寒（Endemic typhus fever, Murine typhus fever）是由下列那一種病原引起？","opts":["A. 傷寒沙氏桿菌（Salmonella typhi）","B. 肺炎黴漿菌（Mycoplasma pneumoniae）","C. 副傷寒沙氏桿菌（Salmonella paratyphi）","D. 傷寒立克次體（Rickettsia typhi）"],"ans":3,"exp":"地方性（鼠蚤型）斑疹傷寒（Endemic/Murine typhus fever）由「傷寒立克次體（Rickettsia typhi）」引起，透過鼠蚤（Xenopsylla cheopis）叮咬傳播，與傷寒沙氏桿菌（腸道感染）和副傷寒完全不同。","we":["傷寒沙氏桿菌（S. typhi）引起的是「傷寒（typhoid fever）」，是食媒性腸道感染，非立克次體感染的斑疹傷寒。","肺炎黴漿菌（M. pneumoniae）引起非典型肺炎，與斑疹傷寒無關。","副傷寒沙氏桿菌（S. paratyphi）引起副傷寒（enteric fever），非斑疹傷寒（立克次體感染）。","（正確）地方性（鼠蚤型）斑疹傷寒由傷寒立克次體（Rickettsia typhi）引起，透過大鼠身上的鼠蚤叮咬傳播，是重要的立克次體人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_023","year":2018,"roc_year":107,"session":"1","examNo":23,"q":"下列有關立克次體的敘述，何者正確？","opts":["A. 細胞壁類似革蘭氏陽性菌","B. 以出芽法分裂增殖","C. 細胞內寄生菌","D. 在節肢動物體內不增殖"],"ans":2,"exp":"立克次體（Rickettsia）的特性：細胞壁類似革蘭氏陰性菌（含脂多醣）；以二分裂法增殖（非出芽法）；屬於「細胞內寄生菌（obligate intracellular parasite）」；在節肢動物體內可以增殖（是立克次體生活史的一部分）。","we":["立克次體細胞壁類似「革蘭氏陰性菌」（含LPS），而非革蘭氏陽性菌，A選項錯誤。","立克次體以二分裂法（binary fission）增殖，非出芽法（budding），B選項錯誤。","（正確）立克次體是「專性細胞內寄生菌（obligate intracellular bacteria）」，只能在活的宿主細胞內存活和增殖，無法在人工培養基上培養，這是其最重要的生物學特性。","立克次體在節肢動物（如蜱、蚤、蝨等）體內確實可以增殖，節肢動物同時是傳播媒介和儲存宿主，D選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_024","year":2018,"roc_year":107,"session":"1","examNo":24,"q":"鈎端螺旋體病之敘述，下列何者錯誤？","opts":["A. 鼠類是重要的感染源","B. 臺灣有本土病例發生","C. 保菌貯主可經由糞便排菌達6～18個月","D. 多數哺乳類動物會被感染"],"ans":2,"exp":"鉤端螺旋體病（Leptospirosis）：保菌貯主（特別是鼠類）可透過「尿液」長期排菌，排菌時間可長達數月至終身，並非透過糞便排菌。選項C說「糞便排菌6～18個月」是錯誤的，應為尿液排菌。","we":["鼠類是鉤端螺旋體病最重要的感染源之一，此描述正確。","台灣確有本土鉤端螺旋體病病例，特別是在颱風過後或農業工作者中，此描述正確。","（正確）保菌貯主（如鼠類）是透過「尿液」排出鉤端螺旋體，而非糞便，且排菌可長期持續（終身攜帶），選項C「糞便排菌6～18個月」的「糞便」描述錯誤。","多數哺乳類動物（犬、牛、豬、鼠等）均可被鉤端螺旋體感染，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_025","year":2018,"roc_year":107,"session":"1","examNo":25,"q":"生飲飲用水誤食劍水蚤（cyclops），最有可能感染下列何種寄生蟲？","opts":["A. 旋毛蟲","B. 肝蛭","C. 裂頭絛蟲","D. 絲狀蟲"],"ans":2,"exp":"劍水蚤（cyclops，橈足類）是裂頭絛蟲（Diphyllobothrium latum，廣節裂頭絛蟲）的第一中間宿主，也是某些線蟲的中間宿主。誤食劍水蚤最可能感染的是「裂頭絛蟲（Diphyllobothrium，廣節裂頭絛蟲）」，其第一期幼蟲（鈎球蚴）在劍水蚤體內發育。","we":["旋毛蟲（Trichinella spiralis）透過食入含包囊的生豬肉感染，不透過劍水蚤傳播。","肝蛭（Fasciola hepatica）以淡水螺（Lymnaea）為第一中間宿主，以水生植物上的囊狀幼蟲感染人，不透過劍水蚤。","（正確）劍水蚤（cyclops）是裂頭絛蟲（廣節裂頭絛蟲，Diphyllobothrium latum）的第一中間宿主，生飲含劍水蚤的水最可能感染裂頭絛蟲的鈎球蚴期幼蟲。","絲狀蟲（filarial worms，如心絲蟲）的中間宿主是蚊子，非劍水蚤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_026","year":2018,"roc_year":107,"session":"1","examNo":26,"q":"薑片吸蟲（Fasciolopsis buski）最主要的自然貯主是","opts":["A. 牛","B. 豬","C. 馬","D. 羊"],"ans":1,"exp":"薑片吸蟲（Fasciolopsis buski）是人體最大的腸道吸蟲，其主要自然貯主（reservoir host）是「豬」，豬是其最重要的動物宿主，也是疫區中保持感染循環的關鍵動物。","we":["牛不是薑片吸蟲的主要自然貯主。","（正確）豬是薑片吸蟲（Fasciolopsis buski）最重要的自然貯主，在東南亞疫區豬隻感染率高，是保持傳播週期的關鍵動物宿主。","馬不是薑片吸蟲的自然宿主。","羊不是薑片吸蟲的自然宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_027","year":2018,"roc_year":107,"session":"1","examNo":27,"q":"由於飲食或衛生習慣的關係，如果感染到廣東住血線蟲時，下列何者是重要的死亡原因？","opts":["A. 嗜伊紅性腦膜腦炎","B. 腹痛","C. 下痢","D. 呼吸困難"],"ans":0,"exp":"廣東住血線蟲（Angiostrongylus cantonensis）感染人體後，幼蟲移行至腦脊髓，引起「嗜伊紅性腦膜腦炎（eosinophilic meningoencephalitis）」，嚴重病例可造成腦損傷甚至死亡，是此病最重要的死亡原因。","we":["（正確）廣東住血線蟲感染人體最重要的併發症和死亡原因是「嗜伊紅性腦膜腦炎」，幼蟲在腦脊髓中移行引起嚴重神經損傷，是此病的特徵性致命表現。","腹痛可以是感染症狀之一，但非主要死亡原因。","下痢可能是感染的輕微症狀，非主要死亡原因。","呼吸困難在嚴重腦幹損傷時可能發生，但根本死亡原因仍為嗜伊紅性腦膜腦炎引起的神經損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_028","year":2018,"roc_year":107,"session":"1","examNo":28,"q":"下列何者主要為生吃牛肉而感染？","opts":["A. 住肉胞子蟲","B. 廣東住血線蟲","C. 微小腦胞子蟲","D. 有鈎絛蟲"],"ans":0,"exp":"住肉孢子蟲（Sarcocystis hominis和S. suihominis）：S. hominis以牛為中間宿主，人食入含包囊的生牛肉後，孢子蟲在人腸道中發育；S. suihominis以豬為中間宿主。因此「主要生吃牛肉感染S. hominis」。","we":["（正確）住肉胞子蟲（Sarcocystis hominis）主要透過生食或未煮熟的「牛肉」感染人，人為其終宿主，牛為中間宿主，牛肉中的包囊（sarcocyst）被人食入後在腸道中發育。","廣東住血線蟲主要透過食入受感染的螺類（中間宿主）或其他攜帶者感染，非生吃牛肉。","微小腦胞子蟲（Encephalitozoon cuniculi）主要影響免疫低下者，透過直接接觸感染，非主要透過生吃牛肉。","有鈎絛蟲（Taenia solium）的中間宿主是豬，人食入含囊尾幼蟲的「豬肉」（非牛肉）成為終宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_029","year":2018,"roc_year":107,"session":"1","examNo":29,"q":"下列何者為肝蛭（Fasciola hepatica）感染人類的階段","opts":["A. 水中植物上的蟲卵","B. 水中植物上的雷氏幼蟲（rediae）","C. 水中植物上的纖毛幼蟲（miracidia）","D. 水中植物上的囊狀幼蟲（metacercariae）"],"ans":3,"exp":"肝蛭（Fasciola hepatica）的感染階段是「囊狀幼蟲（metacercaria）」，附著在水生植物（如水田芥、菱角等）上，人或草食動物食入後，在小腸脫囊，幼蟲穿過腸壁移行至肝臟膽管發育為成蟲。","we":["水中植物上的蟲卵不是感染階段，蟲卵需在水中孵化為纖毛幼蟲後才進一步發育。","雷氏幼蟲（rediae）是在第一中間宿主（淡水螺）體內的發育階段，不存在於水中植物上，且非感染人的階段。","纖毛幼蟲（miracidia）是從蟲卵孵化後在水中游泳的階段，用於感染第一中間宿主（淡水螺），非感染人的階段。","（正確）肝蛭的感染階段是「囊狀幼蟲（metacercaria）」，附著在水中植物表面，人食入後感染，是唯一能感染最終宿主（人或草食動物）的生活史階段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_030","year":2018,"roc_year":107,"session":"1","examNo":30,"q":"誤食中間宿主蟑螂或食糞甲蟲類，最可能感染下列何種寄生蟲？","opts":["A. 糞桿線蟲（Strongyloides stercoralis）","B. 美麗食道蟲（Gongylonema pulchrum）","C. 猬粒絛蟲（Echinococcus granulosus）","D. 日本住血吸蟲（Schistosoma japonicum）"],"ans":1,"exp":"美麗食道蟲（Gongylonema pulchrum）是一種寄生於哺乳動物口腔和食道黏膜的線蟲，其中間宿主是「蟑螂（cockroach）」或食糞甲蟲（dung beetle），人誤食受感染的中間宿主可能感染美麗食道蟲，引起口腔或食道的線蟲幼蟲症。","we":["糞桿線蟲（Strongyloides stercoralis）幼蟲直接感染（皮膚穿透），不需中間宿主（蟑螂或甲蟲）。","（正確）美麗食道蟲（Gongylonema pulchrum）以蟑螂或食糞甲蟲類為中間宿主，誤食這些昆蟲可能感染此蟲，在口腔/食道黏膜引起爬行感和異物感。","猬粒絛蟲（Echinococcus granulosus，犬絛蟲）以犬科動物為終宿主，以草食動物（羊、牛）或人為中間宿主，透過食入蟲卵（犬糞污染）感染，非透過蟑螂或甲蟲。","日本住血吸蟲（Schistosoma japonicum）以淡水螺（釘螺）為中間宿主，尾蚴穿透人體皮膚感染，非透過蟑螂或甲蟲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_031","year":2018,"roc_year":107,"session":"1","examNo":31,"q":"依傳播方式分類，病原的發育需一個以上的脊椎動物作為宿主者，可歸類為那一型的人畜共通傳染病？","opts":["A. 直接型","B. 循環型","C. 異型","D. 腐生型"],"ans":1,"exp":"依傳播方式分類，人畜共通傳染病的類型：「循環型（cyclozoonosis）」是指病原體需要兩種以上脊椎動物作為宿主才能完成生活史（如絛蟲需要終宿主和中間宿主兩種脊椎動物）。","we":["直接型（direct zoonosis）只需一種脊椎動物宿主即可維持傳播，如狂犬病、布氏桿菌病。","（正確）循環型（cyclozoonosis）的定義是病原體的生活史需要兩種或兩種以上的脊椎動物宿主才能完成，如各種絛蟲（需要終宿主和中間宿主）。","異型（metazoonosis）需要脊椎動物加上無脊椎動物（節肢動物）才能完成傳播，如日本腦炎（需要蚊子傳播媒介）。","腐生型（saprozoonosis）需要脊椎動物加上非動物性底物（如土壤、植物、腐敗有機物）才能維持傳播，如麴菌症、隱球菌症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_032","year":2018,"roc_year":107,"session":"1","examNo":32,"q":"下列何種生物可以做為橫川氏吸蟲之第二中間宿主？","opts":["A. 淡水蟹類","B. 海水魚類","C. 淡水魚類","D. 爬蟲類"],"ans":2,"exp":"橫川氏吸蟲（Metagonimus yokogawai）的第一中間宿主是淡水螺（豆螺），第二中間宿主是「淡水魚類」（特別是香魚、鯽魚等），人食入含囊狀幼蟲的淡水魚生魚片後感染。","we":["淡水蟹類是肺吸蟲（Paragonimus westermani）的第二中間宿主，非橫川氏吸蟲。","海水魚類不是橫川氏吸蟲的第二中間宿主，橫川氏吸蟲偏好淡水環境。","（正確）橫川氏吸蟲（M. yokogawai）以淡水魚類（如香魚、鱗目魚等）為第二中間宿主，人食入含囊狀幼蟲的淡水魚（生食）後感染腸道。","爬蟲類不是橫川氏吸蟲的第二中間宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_033","year":2018,"roc_year":107,"session":"1","examNo":33,"q":"動物罹患人畜共通傳染病時，其病原體經由乳汁排出，稱為一次污染性病原，下列何者屬於該性質？","opts":["A. 志賀氏桿菌","B. 傷寒沙氏桿菌","C. A型肝炎病毒","D. 鈎端螺旋體"],"ans":3,"exp":"一次污染性病原（primary contamination）是指動物罹患人畜共通傳染病時，病原體直接從感染動物的乳腺或體液分泌至乳汁中的情況。鉤端螺旋體（Leptospira）可存在於感染動物的血流中，並分泌至乳汁，屬於一次污染。","we":["志賀氏桿菌（Shigella）不會直接從動物體內分泌至乳汁，通常是環境或人為二次污染，非一次污染性病原。","傷寒沙氏桿菌（S. typhi）若有菌血症期間理論上可能進入乳汁，但其主要宿主是人而非動物，不符合「動物罹患人畜共通傳染病時經乳汁排出」的定義。","A型肝炎病毒（HAV）主要透過糞口途徑傳播，不屬於由動物乳腺分泌的一次污染性病原。","（正確）鉤端螺旋體（Leptospira）感染動物後可在菌血症期間進入乳汁，屬於一次污染性病原，感染動物的生乳可能含有活的鉤端螺旋體，飲用後引起人感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_034","year":2018,"roc_year":107,"session":"1","examNo":34,"q":"人類肉毒桿菌中毒案例中，何種毒素較為常見？","opts":["A. A 型","B. G 型","C. F 型","D. M 型"],"ans":0,"exp":"在人類肉毒桿菌中毒案例中，A型（Type A）毒素引起的食物中毒最為常見，特別是與家庭自製罐頭食品相關，且A型毒素引起的症狀最嚴重（神經毒性最強），死亡率也較高。","we":["（正確）A型肉毒桿菌毒素是人類肉毒桿菌食物中毒最常見的類型，與受污染的罐頭食品、自製醃漬食品最相關，症狀嚴重，死亡率高。","G型肉毒毒素在自然界極罕見，非人類常見病例類型。","F型雖可引起人類中毒，但發生率遠低於A型。","M型（M type）不存在於標準肉毒桿菌毒素分類（A-G型），為虛構選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_035","year":2018,"roc_year":107,"session":"1","examNo":35,"q":"依據CAS優良農產品肉品項目驗證基準，家禽屠宰後經預冷成為「冷藏禽肉」，移入冷藏庫冷藏，品溫需要\r 保持在多少°C 以下？","opts":["A. 15","B. 12","C. 9","D. 7"],"ans":3,"exp":"依CAS優良農產品肉品項目驗證基準，家禽屠宰後預冷，移入冷藏庫後，冷藏禽肉的品溫需保持在「7°C以下」（即≦7°C），以維持肉品衛生安全。","we":["15°C過高，不符合肉品冷藏安全標準。","12°C仍過高，現行CAS標準要求更嚴格。","9°C仍超過規定的7°C上限。","（正確）CAS優良農產品規定冷藏禽肉品溫應保持在7°C以下，符合食品安全和肉品衛生要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_036","year":2018,"roc_year":107,"session":"1","examNo":36,"q":"依據臺灣優良農產品驗證管理辦法對生鮮蛋品、液蛋與皮蛋之檢驗項目、方法與標準之規定沙氏桿菌 （salmonella）污染之標準分別為何？","opts":["A. 皆為陰性","B. 5×10 3 CFU/g 以下、陰性與 10 MPN/g 以下","C. 陰性、5×10 3 CFU/g 以下與10 MPN/g 以下","D. 5×10 3 CFU/g 以下、10 MPN/g 以下與陰性"],"ans":0,"exp":"依台灣CAS/優良農產品驗證管理辦法，沙氏桿菌的標準：生鮮蛋品（陰性，不得檢出）、液蛋（陰性）、皮蛋（陰性）。各類蛋品的沙氏桿菌標準均為陰性（皆不得檢出）。","we":["（正確）依驗證辦法，生鮮蛋品、液蛋與皮蛋的沙氏桿菌污染標準「皆為陰性（不得檢出）」，確保蛋品食用安全。","此選項的數字組合（5×10³ CFU/g以下、陰性、10 MPN/g以下）非正確的沙氏桿菌標準。","此選項組合亦不符合正確規定。","此選項組合亦不符合皆為陰性的規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_037","year":2018,"roc_year":107,"session":"1","examNo":37,"q":"人類食媒性耶氏菌症主要是與食用何種肉品有關？","opts":["A. 豬肉","B. 雞肉","C. 海鮮","D. 羊肉"],"ans":0,"exp":"人類食媒性耶氏菌症（Yersiniosis）主要與食用「豬肉」有關。小腸結腸炎耶氏菌（Yersinia enterocolitica）廣泛存在於豬的扁桃腺和腸道，豬肉（特別是豬腸及豬肉生食）是人類感染的主要來源。","we":["（正確）耶氏菌症（Yersiniosis）主要透過食用受污染的「豬肉」感染，豬是Yersinia enterocolitica最重要的動物保菌宿主，豬扁桃腺中帶菌率高。","雞肉雖可能含有耶氏菌，但主要食源性感染與豬肉的關聯最強。","海鮮可能含有其他弧菌類病原，但非耶氏菌症的主要食品來源。","羊肉非耶氏菌症的主要食品來源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_038","year":2018,"roc_year":107,"session":"1","examNo":38,"q":"依據CAS優良農產品肉品項目驗證基準，豬隻屠體應進行預冷，後腿中心溫度應在18小時內至少達到多少 °\r C 以下？","opts":["A. 15","B. 10","C. 7","D. 5"],"ans":2,"exp":"依CAS優良農產品肉品項目驗證基準，豬隻屠體應進行預冷，後腿（最厚部位）中心溫度應在「18小時內」至少達到「7°C以下」，以確保整個屠體均勻冷卻至安全溫度。","we":["15°C是雞隻預冷的初始標準，非豬隻的7°C目標。","10°C仍超過CAS規定的7°C要求。","（正確）CAS基準規定豬隻屠體後腿中心溫度應在18小時內降至7°C以下，7°C是抑制大多數食源性病原增殖的關鍵溫度。","5°C雖更安全，但規定標準為7°C以下（非5°C以下）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_039","year":2018,"roc_year":107,"session":"1","examNo":39,"q":"下列何種寄生蟲不是因為飲用受污染的水而感染？","opts":["A. 隱胞子蟲","B. 布氏薑片吸蟲","C. 梨形鞭毛蟲","D. 旋毛蟲"],"ans":3,"exp":"旋毛蟲（Trichinella spiralis）的傳播途徑是食入含包囊的肌肉組織（生肉或未煮熟的肉），不透過水傳播。隱胞子蟲、梨形鞭毛蟲均可透過受污染的水（糞口途徑）傳播；布氏薑片吸蟲的囊狀幼蟲附著在水中植物上，也可透過水傳播。","we":["隱胞子蟲（Cryptosporidium）可透過受污染的水傳播，是重要的水媒寄生蟲，不符「不是因飲用受污染的水感染」。","布氏薑片吸蟲（Fasciolopsis buski）的囊狀幼蟲附著在水中植物，生食水生植物可感染，與水有關，不符題意。","梨形鞭毛蟲（Giardia lamblia）是重要的水媒寄生原蟲，可透過受污染的水傳播，不符「不是因飲用受污染的水感染」。","（正確）旋毛蟲（Trichinella spiralis）透過食入含包囊的生肉（豬肉、野豬肉等）感染，不透過飲水傳播，與水源污染無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_040","year":2018,"roc_year":107,"session":"1","examNo":40,"q":"下列何者可藉由食用魚貝類造成感染，其幼蟲可於人體皮膚造成移行性皮膚炎？","opts":["A. 線蟲類","B. 鈎頭蟲類","C. 絛蟲類","D. 吸蟲類"],"ans":0,"exp":"可藉由食用魚貝類感染、且幼蟲在人體皮膚造成移行性皮膚炎（cutaneous larva migrans）的寄生蟲是「線蟲類」，特別是海獸胃線蟲（Anisakis spp.，海豹蛔蟲）等的幼蟲，可在人體皮膚或組織移行造成皮膚炎。","we":["（正確）線蟲類（如異尖線蟲Anisakis）可透過食用魚貝類感染，其幼蟲在人體可引起移行性皮膚炎（visceral/cutaneous larva migrans），此為線蟲幼蟲移行症的典型特徵。","鈎頭蟲類（Acanthocephala）主要寄生於腸道，透過食入中間宿主（甲殼類、昆蟲）感染，但移行性皮膚炎非其典型表現。","絛蟲類不透過魚貝類感染後在皮膚移行（裂頭絛蟲透過魚感染，但幼蟲移行至肌肉/腸道，非皮膚）。","吸蟲類雖有些可透過魚類感染，但移行性皮膚炎（cercarial dermatitis）主要是吸蟲的尾蚴（cercariae）在水中穿透皮膚，非食用魚貝類感染的途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_041","year":2018,"roc_year":107,"session":"1","examNo":41,"q":"蛋品新鮮度之判定可以使用比重法判定，一般新鮮蛋其比重為","opts":["A. 1.10以上","B. 1.08～1.09","C. 低於1.05","D. 低於1.02"],"ans":1,"exp":"蛋品新鮮度的比重法判定：新鮮雞蛋的比重約為1.08～1.09。蛋隨儲存時間增加，氣室擴大，比重下降（因水分蒸發和CO₂散逸）。比重>1.08為新鮮蛋；比重接近或低於1.05則為不新鮮。","we":["1.10以上的比重過高，超過正常新鮮蛋的比重範圍。","（正確）新鮮雞蛋的比重約為1.08～1.09，這是業界和教科書公認的新鮮蛋比重範圍，也是鹽水浮沉法判定新鮮度的依據。","低於1.05表示蛋的氣室很大，蛋已不新鮮，甚至可能腐敗。","低於1.02表示蛋非常不新鮮（漂浮），已腐敗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_042","year":2018,"roc_year":107,"session":"1","examNo":42,"q":"優良農產品蛋品項目驗證基準中，規定蛋品的冷藏運輸是要在多少℃下進行？","opts":["A. 25","B. 18","C. 12","D. 7"],"ans":3,"exp":"依CAS優良農產品蛋品項目驗證基準，蛋品的冷藏運輸應在「7°C以下」進行，以維持蛋品新鮮度並抑制沙氏桿菌等病原微生物的增殖。","we":["25°C是常溫，不符合冷藏運輸的要求，會加速蛋品劣化。","18°C仍過高，無法有效抑制微生物生長。","12°C超過CAS規定的7°C上限，不符合要求。","（正確）CAS優良農產品蛋品驗證基準規定冷藏運輸應在7°C以下進行，與冷藏保存溫度一致，確保冷鏈完整性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_043","year":2018,"roc_year":107,"session":"1","examNo":43,"q":"依據臺灣優良農產品驗證管理辦法對皮蛋之檢驗項目、方法與標準規定銅含量之標準為何？","opts":["A. 0.3 ppm 以下","B. 1.0 ppm 以下","C. 2.0 ppm 以下","D. 5.0 ppm 以下"],"ans":2,"exp":"依CAS（現為台灣優良農產品驗證）管理辦法，皮蛋中銅（Cu）含量的標準為「2.0 ppm以下」，因傳統皮蛋製作過程中可能加入氧化銅，須管制殘留量。","we":["0.3 ppm過嚴，非現行皮蛋銅含量規定。","1.0 ppm亦低於規定標準。","（正確）依優良農產品驗證管理辦法，皮蛋銅含量標準為2.0 ppm以下，此為食品安全管制的合理上限。","5.0 ppm過寬，非現行規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_044","year":2018,"roc_year":107,"session":"1","examNo":44,"q":"關於霍亂弧菌 (Vibrio cholerae）的敘述，下列何者錯誤？","opts":["A. 是我國傳染病防治法規範的第二類傳染病，對於病例（含疑似病例）應於24小時內完成通報","B. 水產品（生蠔、甲魚、未熟的魚及蝦蟹等）以及受污染的水是疾病初期的感染源","C. 在鹹水淡水均能生存，而且生存時間頗長，因此水產品特別容易含有病菌","D. 會形成芽孢"],"ans":3,"exp":"霍亂弧菌（Vibrio cholerae）是革蘭氏陰性的弧菌，「不形成芽孢（spore）」。能形成芽孢的是革蘭氏陽性菌（如炭疽桿菌、肉毒桿菌、梭狀芽孢桿菌等）。其他描述：霍亂是第二類法定傳染病（24小時通報）；水產品和受污染的水是主要感染源；霍亂弧菌確實能在鹹水和淡水中生存且持久。","we":["霍亂是我國第二類傳染病，確實應於24小時內完成通報，此描述正確，非錯誤。","水產品及受污染的水是霍亂的主要感染源，此描述正確，非錯誤。","霍亂弧菌可在鹹水和淡水中生存，水產品容易受污染，此描述正確，非錯誤。","（正確）霍亂弧菌「不會形成芽孢」，選項D「會形成芽孢」是錯誤的敘述。形成芽孢是特定革蘭氏陽性菌的特性，霍亂弧菌為革蘭氏陰性弧菌，無此能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_045","year":2018,"roc_year":107,"session":"1","examNo":45,"q":"肉雞疑有家禽霍亂症狀，經判定為疑禽者，應依屠宰衛生檢查獸醫師指示予以","opts":["A. 廢棄","B. 稽留","C. 宰殺","D. 緊急屠宰"],"ans":2,"exp":"依屠宰衛生檢查規則，家禽屠前檢查時，疑有某疾病（如家禽霍亂）症狀而判定為「疑禽」者，應依屠宰衛生檢查獸醫師指示予以「隔離宰殺（宰殺）」，在隔離的情況下緊急宰殺後再進行縝密的屠後檢查，以防止疾病擴散。","we":["廢棄是最終判定，疑禽在屠前尚未確認，應先依指示處置（宰殺後再判定屠體），不直接廢棄。","稽留是對疑畜的暫時保留措施（等待進一步檢查），但家禽通常在確認疑禽後應儘速宰殺（不同於家畜可稽留觀察）。","（正確）疑禽應依獸醫師指示「宰殺」（隔離宰殺），避免疾病在繁留欄中傳播，宰殺後再進行屠後縝密檢查。","緊急屠宰（emergency slaughter）是對即將死亡或無法行走的動物的特殊宰殺程序，與疑禽的情形不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_046","year":2018,"roc_year":107,"session":"1","examNo":46,"q":"應隔離屠宰或應於當日所有屠前檢查合格之家畜、家禽屠宰後再進行屠宰的對象動物，係指下列何者？","opts":["A. 認為需待進一步檢查之家畜、家禽","B. 剛斷氣的家畜、家禽","C. 暴斃家畜、家禽","D. 懷疑某疾病死亡的家畜、家禽"],"ans":0,"exp":"依屠宰衛生檢查規則，「認為需待進一步檢查」的家畜禽，應隔離屠宰或在當日所有正常動物屠宰後再進行屠宰，此類動物是指「認為需待進一步檢查的家畜禽（疑畜禽）」，以防止交叉污染。","we":["（正確）「認為需待進一步檢查之家畜、家禽」（即疑畜禽），依規定需隔離屠宰或最後宰殺，以防止可能的病原傳播。","剛斷氣的家畜禽屬於緊急宰殺情形，有不同的規定程序，非本題所述的隔離情形。","暴斃家畜禽通常直接廢棄或送病理化驗，不納入屠宰流程。","懷疑某疾病死亡的家畜禽應直接廢棄和病理化驗，不納入一般屠宰程序。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_047","year":2018,"roc_year":107,"session":"1","examNo":47,"q":"感染傳染病的動物檢體，在包裝運送使用冷藏劑或化學藥劑時，不可使用下列何種不透氣之材質？","opts":["A. 乾冰","B. 一般冰塊","C. 冷媒物質","D. 福馬林"],"ans":0,"exp":"感染性動物檢體的包裝運送規定：使用冷藏劑時，應使用「乾冰（CO₂固體）」可能是不透氣材質的選項之一，但乾冰產生的CO₂氣體在密閉容器中會累積增加壓力，且若外包裝不透氣會有爆裂危險。依規定，不可使用「乾冰」於不透氣的密閉包裝中（因CO₂累積造成壓力問題）。","we":["（正確）乾冰（CO₂固體）在密閉不透氣容器中使用時，揮發的CO₂氣體無法散逸，會造成壓力累積甚至爆裂，是不透氣材質中不可使用的冷藏劑，此為感染性檢體包裝運送的重要規定。","一般冰塊可用於感染性檢體的低溫運送，不存在氣體累積問題，可正常使用。","冷媒物質（如冷凝劑包）是安全的冷藏替代品，可用於感染性檢體運送。","福馬林雖為化學固定劑（非冷藏劑），用於固定組織，在病理檢體運送中使用，但屬另一類情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_048","year":2018,"roc_year":107,"session":"1","examNo":48,"q":"有關生乳搾出後之保存或運輸方法，下列敘述何者正確？","opts":["A. 在8～10℃之環境下運輸","B. 迅速在1小時內冷卻至10℃以下","C. 迅速在5小時內冷卻至10℃以下","D. 只要在1小時之內運輸到目的地就可免用冷藏車"],"ans":0,"exp":"生乳（raw milk）搾出後的保存及運輸：應「迅速在1小時內冷卻至10°C以下」，並在10°C以下的環境中冷藏運輸。儘快降溫可抑制細菌增殖，維持生乳品質。","we":["（正確）生乳搾出後應迅速在1小時內冷卻至10°C以下，並以冷藏車（低於10°C）運輸，以維持品質和衛生安全。","迅速在5小時內冷卻至10°C以下太慢，可能導致細菌大量增殖，影響乳品品質。","在8～10°C環境下運輸是可接受的，但描述不如「1小時內冷卻至10°C以下」完整。","1小時內運輸到目的地並不保證生乳在此過程中保持低溫，不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_049","year":2018,"roc_year":107,"session":"1","examNo":49,"q":"乳中之乳過氧化酶（lactoperoxidase）具有何種作用？","opts":["A. 殺菌作用","B. 抗氧化作用","C. 酸化作用","D. 發酵作用"],"ans":0,"exp":"乳過氧化酶（lactoperoxidase, LP）是生乳中天然存在的殺菌酶，在H₂O₂和硫氰酸鹽的存在下，可氧化細菌代謝物，具有「殺菌作用（bactericidal/antimicrobial activity）」，是生乳天然防禦系統的一部分。","we":["（正確）乳過氧化酶（lactoperoxidase）具有殺菌作用，在H₂O₂存在下催化氧化反應，生成次硫氰酸（OSCN⁻），可抑制或殺死多種細菌，是生乳中重要的天然抗菌物質。","乳過氧化酶的主要功能是殺菌（antimicrobial），雖有氧化作用，但「抗氧化」是其他酶（如超氧化物歧化酶）的功能，非乳過氧化酶的主要特性。","酸化作用是乳酸菌（lactic acid bacteria）的作用，非乳過氧化酶。","發酵作用由微生物完成，非乳過氧化酶的功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_050","year":2018,"roc_year":107,"session":"1","examNo":50,"q":"下列何者因具致畸胎性，現已被禁用於經濟動物？","opts":["A. 富來頓（furazolidone）","B. 黃體酮（progesterone）","C. 盤尼西林（penicillin）","D. 甲磺氯黴素（thiamphenicol）"],"ans":0,"exp":"富來頓（Furazolidone）屬於硝基呋喃類（nitrofurans）藥物，因具有致突變性、致癌性及致畸胎性，已被多國（包括台灣）禁止用於食用動物（經濟動物），以防止藥物殘留危害人體健康。","we":["（正確）富來頓（Furazolidone，硝基呋喃類）因具致突變性、致癌性及致畸胎性，已全面禁止用於食用動物，是公衛考試的重要知識點。","黃體酮（Progesterone）是天然性荷爾蒙，用於繁殖管理，不因致畸胎性而被禁用（藥物動力學顯示天然代謝，殘留量低）。","盤尼西林（Penicillin）是常用的青黴素類抗生素，有殘留限量標準但未被禁用。","甲磺氯黴素（Thiamphenicol）雖與氯黴素同類，但有不同的毒理學特性，有些地區有限量標準，並未完全因致畸胎性禁用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_051","year":2018,"roc_year":107,"session":"1","examNo":51,"q":"人的類丹毒，一般建議的治療用藥為","opts":["A. 氯黴素","B. 青黴素","C. 鏈黴素","D. 紅黴素"],"ans":1,"exp":"類丹毒（Erysipeloid）由豬丹毒桿菌（Erysipelothrix rhusiopathiae）引起，此菌對「青黴素（Penicillin G）」高度敏感，青黴素是治療類丹毒的首選藥物（第一線治療）。","we":["氯黴素（Chloramphenicol）雖有廣效性，但因毒性（骨髓抑制）不作為類丹毒的建議治療用藥。","（正確）青黴素（Penicillin）是類丹毒（Erysipeloid）治療的首選藥物，Erysipelothrix rhusiopathiae對青黴素高度敏感。","鏈黴素（Streptomycin）是胺基糖苷類抗生素，用於結核病和布氏桿菌病等，非類丹毒的建議治療藥物。","紅黴素（Erythromycin）是青黴素過敏患者的替代選擇，但青黴素才是第一選擇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_052","year":2018,"roc_year":107,"session":"1","examNo":52,"q":"下列有關水質處理過程中氣曝之敘述，何者錯誤？","opts":["A. 使空氣與水混合","B. 以氧取代逸出之二氧化碳","C. 氧氣可氧化因地層污染水之過量鐵成氧化鐵","D. 氧氣含量高的水其pH值下降，呈酸性反應"],"ans":3,"exp":"水質處理中的「氣曝（aeration）」：使空氣與水混合；以空氣中的氧氣取代溶出的CO₂（CO₂逸出後pH值上升，呈鹼性）；氧氣可氧化水中的過量亞鐵離子（Fe²⁺）成不溶性的氧化鐵（Fe₃O₄或Fe₂O₃）。「氧氣含量高的水其pH值下降（呈酸性）」是錯誤的，實際上CO₂的去除使pH值升高（鹼性），而非下降。","we":["氣曝使空氣與水混合，增加溶氧量，此描述正確，非錯誤。","以氧氣取代水中逸出的CO₂（CO₂逸出後HCO₃⁻平衡改變，pH上升），此描述基本正確，非錯誤。","水中過量的Fe²⁺被氧化為Fe₂O₃等不溶物，通過沉澱或過濾去除，此描述正確，非錯誤。","（正確）氧氣含量高的水（CO₂已逸出）pH值應「上升（鹼性）」，而非「下降（酸性）」，選項D的描述「pH值下降、呈酸性」是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_053","year":2018,"roc_year":107,"session":"1","examNo":53,"q":"下列何者不是水媒疾病？","opts":["A. 病毒性A型肝炎","B. 蛔蟲病","C. 蟯蟲病","D. 斑疹傷寒"],"ans":3,"exp":"水媒疾病（waterborne diseases）是透過飲用或接觸受污染的水傳播。A型肝炎（糞口，水源污染）、蛔蟲病（食入水中蟲卵）、蟯蟲病（糞口途徑，可透過水傳播）均可為水媒疾病。斑疹傷寒（Typhus fever）由立克次體引起，透過蝨或蚤等節肢動物媒介傳播，非水媒疾病。","we":["A型肝炎（HAV）可透過受糞便污染的飲水傳播，是典型的水媒疾病，符合水媒疾病定義。","蛔蟲（Ascaris）蟲卵可污染水源，飲用受污染水可能感染，可歸為水媒疾病（糞口途徑）。","蟯蟲（Enterobius）主要透過糞口途徑傳播，理論上受污染的水可傳播蟲卵，但通常分類為直接接觸/糞口傳播疾病。","（正確）斑疹傷寒（Typhus fever）由立克次體（Rickettsia）引起，透過蝨（epidemic typhus）或蚤（endemic typhus）等節肢動物媒介傳播，與水源無關，「不是」水媒疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_054","year":2018,"roc_year":107,"session":"1","examNo":54,"q":"動物園放流水標準中之大腸桿菌群為多少CFU/100 mL？","opts":["A. 0","B. 10","C. 10,000","D. 300,000"],"ans":2,"exp":"依我國放流水標準，動物園放流水中大腸桿菌群（coliform bacteria）的限值為10,000 CFU/100 mL，此標準比一般工廠或醫院放流水寬鬆，但仍有管制限制。","we":["0（不得檢出）是飲用水的標準，非動物園放流水的大腸桿菌群標準。","10 CFU/100 mL過嚴，非動物園放流水的標準。","（正確）動物園放流水標準中大腸桿菌群為10,000 CFU/100 mL，反映動物園廢水中有較多有機物和微生物的現實，設定較寬的放流限值。","300,000 CFU/100 mL過寬，不符合現行放流水標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_055","year":2018,"roc_year":107,"session":"1","examNo":55,"q":"屠宰場及加工廠用水，以加氯消毒（chlorination）無法達到的作用為","opts":["A. 減少細菌數","B. 氧化水中部分有機物質","C. 減低水中某些臭味","D. 減少屠體失重"],"ans":3,"exp":"加氯消毒（chlorination）的作用：減少細菌數（殺菌）；氧化水中部分有機物（去除臭味、色度）；減低某些臭味（含硫化合物等）。但加氯「不能」減少屠體失重（失重與屠宰失水、預冷方式有關），此非加氯消毒可達到的作用。","we":["加氯消毒可有效減少水中細菌數，是其主要目的，此描述正確，非答案。","氯可氧化水中部分有機物質，此為加氯消毒的次要作用，非答案。","氯可氧化水中某些含硫有機物，減少臭味，此描述正確，非答案。","（正確）加氯消毒無法影響屠體的失重（失重與屠宰、冷卻方式有關），「減少屠體失重」不是加氯消毒所能達到的作用，是正確的答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_056","year":2018,"roc_year":107,"session":"1","examNo":56,"q":"世界動物衛生組織的總部設在下列那一個國家？","opts":["A. 瑞士","B. 日本","C. 美國","D. 法國"],"ans":3,"exp":"世界動物衛生組織（OIE，現更名為WOAH）的總部設在「法國（France）」巴黎，成立於1924年，是國際動物衛生的最高主管機關。","we":["瑞士（日內瓦）是WHO（世界衛生組織）等多個聯合國機構的總部所在地，非OIE/WOAH。","日本非OIE總部所在地。","美國（紐約/華盛頓）非OIE總部所在地。","（正確）OIE（WOAH，世界動物衛生組織）總部設於法國巴黎，此為重要的國際動物衛生機構地理知識。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_057","year":2018,"roc_year":107,"session":"1","examNo":57,"q":"【已刪除】57.根據世界衛生組織最新的國際疫情資訊，下列對於臺灣之動物疫情敘述何者錯誤？","opts":["A. 臺灣為口蹄疫的非疫國","B. 臺灣為牛瘟的非疫國","C. 臺灣為非洲馬疫的非疫國","D. 臺灣為非洲豬瘟的非疫國"],"ans":0,"exp":"此題已標記刪除，依考選部公告，答案為送分或特定選項。在107年1次考試時，台灣已於2018年5月宣告成為口蹄疫非疫國（疫苗注射非疫國），但本題若問「非疫國」的定義，需考慮當時時間點。牛瘟（Rinderpest）全球已於2011年宣告根絕，台灣為牛瘟非疫國（正確）；非洲馬疫（African horse sickness）台灣從未有過病例，為非疫國（正確）。若台灣尚未正式宣告為口蹄疫非疫國（考試當時尚在過渡），則A選項「台灣為口蹄疫的非疫國」在考試當下可能尚未成立。","we":["（正確，此題已刪除）台灣是否為口蹄疫非疫國，在107年1次考試時尚未正式宣告（2018年5月17日OIE才認定），考試時點可能有爭議，故此題刪除。","台灣為牛瘟非疫國（全球根絕），此描述正確，非錯誤。","台灣為非洲馬疫非疫國，此描述正確，非錯誤。","台灣在2018年5月非洲豬瘟疫情尚未入侵台灣前為非疫國，但2018年後已有非洲豬瘟輸入風險，需依時間點判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_107_1_公衛_058","year":2018,"roc_year":107,"session":"1","examNo":58,"q":"以下對於receiver-operating characteristic （ROC）曲線的敘述何者錯誤？","opts":["A. 可用以比較不同的診斷試驗","B. 用來呈現一個診斷試驗在不同cut-off value時的真陽性率及偽陽性率","C. 曲線之縱軸為敏感性值（sensitivity）","D. 曲線之橫軸為陽性預測值（positive predictive value）"],"ans":3,"exp":"ROC（Receiver Operating Characteristic）曲線：縱軸（Y軸）為真陽性率（敏感性，sensitivity）；橫軸（X軸）為偽陽性率（false positive rate，即1-特異性）。橫軸不是「陽性預測值（positive predictive value, PPV）」，PPV是另一個獨立的診斷指標，不在ROC曲線的座標上。","we":["ROC曲線確實可以比較不同診斷試驗的表現（通過比較AUC面積），此描述正確，非錯誤。","ROC曲線確實在不同cut-off value時描繪真陽性率（敏感性）與偽陽性率（1-特異性）的關係，此描述正確，非錯誤。","縱軸（Y軸）確實為敏感性值（sensitivity，即真陽性率），此描述正確，非錯誤。","（正確）ROC曲線的橫軸（X軸）是「偽陽性率（false positive rate, FPR，即1-特異性）」，而非「陽性預測值（PPV）」，選項D「橫軸為陽性預測值」是錯誤的敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_059","year":2018,"roc_year":107,"session":"1","examNo":59,"q":"Student's t-test 是比較二個族群的那一個數值的不同？","opts":["A. 平均數","B. 變異數","C. 中位數","D. 標準差"],"ans":0,"exp":"Student's t-test（學生t檢定）是用來比較兩個族群「平均數（mean）」是否有統計學顯著差異的檢定方法，分為獨立樣本t檢定和配對樣本t檢定兩種。","we":["（正確）Student's t-test比較兩個族群的「平均數」（μ）是否有顯著差異，是最基本的兩組比較統計方法。","比較「變異數」是用F-test（F檢定，如Levene's test）或ANOVA，非t-test。","比較「中位數」是用無母數統計方法（如Mann-Whitney U test、Wilcoxon rank-sum test），非t-test。","比較「標準差」是比較變異性，用F-test等方法，非t-test。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_060","year":2018,"roc_year":107,"session":"1","examNo":60,"q":"有關疾病之死亡率（mortality rate）與致死率（case-fatality rate）的敘述，何者正確？","opts":["A. 致死率是計算在罹患特定疾病的個案中造成死亡的百分比","B. 致死率是每1,000人的全人口死亡率","C. 狂犬病是很危險的疾病因為死亡率很高","D. 疾病死亡率為罹患特定疾病死亡人數在所有死亡人數中的百分比"],"ans":0,"exp":"致死率（case-fatality rate, CFR）是在罹患特定疾病的個案中，因該疾病死亡的百分比，即死亡病例數/確診病例數×100%。與死亡率（mortality rate，每1000人口的死亡率）不同。","we":["（正確）致死率（CFR）是計算在「罹患特定疾病的個案」中造成死亡的百分比，分母是病例數而非全人口，此定義正確。","致死率的分母是「病例數」（罹患特定疾病者），而非全人口，B選項描述的是死亡率（mortality rate）的計算方式。","狂犬病一旦出現臨床症狀，其「致死率（CFR）」接近100%（幾乎100%死亡），但狂犬病的「死亡率（mortality rate，每千人口）」可能很低（因感染人數相對全人口少），C選項混淆了CFR和mortality rate。","疾病死亡率通常是指「特定病因死亡率（cause-specific mortality rate）」，計算方式是死於該病的人數佔全人口的比例，而非「罹患特定疾病死亡人數在所有死亡人數中的比例」（那是proportionate mortality），D選項定義不精確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_107_1_公衛_061","year":2018,"roc_year":107,"session":"1","examNo":61,"q":"進行豬隻口蹄疫之血清學力價檢測時，應採樣50頭豬。某君決定至10場豬場採樣，每場均就近採樣先看到的5頭豬，合計50頭豬。請問此抽樣方式稱為","opts":["A. 隨機抽樣（random sampling）","B. 便利抽樣（convenience sampling）","C. 系統性抽樣（systematic sampling）","D. 分層抽樣 （stratified sampling）"],"ans":1,"exp":"描述：至10場豬場，每場均就近採樣先看到的5頭豬，此種依「方便性（
