蟲症。","C 錯誤：犬心絲蟲（Dirofilaria immitis）寄生於心臟及肺動脈，偶感染人肺部，非蛇行線蟲症。","D 錯誤：馬來亞絲蟲同樣寄生於淋巴管，引起淋巴水腫，非蛇行線蟲症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_033","year":2015,"roc_year":104,"session":"2","examNo":33,"q":"安尼線蟲 （Anisakis spp.）主要經由食用下列何種未熟肉類感染？","opts":["A. 豬肉","B. 牛肉","C. 羊肉","D. 魚貝類"],"ans":3,"exp":"安尼線蟲（Anisakis spp.）為海洋魚類及頭足類（魷魚、章魚）的寄生蟲，人類主要因食用未熟或生鮮的海水魚貝類（如生魚片、壽司）而感染，幼蟲可穿入胃腸壁引起安尼線蟲症（anisakiasis）。","we":["A 錯誤：豬肉中的寄生蟲主要為旋毛蟲（Trichinella）及有鈎絛蟲囊蟲，非安尼線蟲。","B 錯誤：牛肉中的寄生蟲主要為無鈎絛蟲囊蟲及弓蟲，非安尼線蟲。","C 錯誤：羊肉中的寄生蟲主要為旋毛蟲及弓蟲，非安尼線蟲。","（正確）D 正確：安尼線蟲主要寄生於海水魚貝類，食用未熟魚貝類為主要感染途徑，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_034","year":2015,"roc_year":104,"session":"2","examNo":34,"q":"預防腸道出血型大腸桿菌感染症，在烹製漢堡肉時，中心溫度至少須達到多少°C ？","opts":["A. 70","B. 60","C. 50","D. 40"],"ans":0,"exp":"預防腸道出血型大腸桿菌（EHEC，如 O157:H7）感染，烹製漢堡肉時中心溫度至少須達到 70°C（美國 USDA 規定為 160°F 即 71.1°C），此溫度可有效殺死 EHEC 及其他食源性病原菌。","we":["（正確）A 正確：70°C 為殺滅漢堡肉中 EHEC 的最低安全中心溫度，為正確答案。","B 錯誤：60°C 無法有效殺死 EHEC，需達到至少 70°C。","C 錯誤：50°C 完全不足以殺死致病菌，甚至為部分細菌的最適生長溫度。","D 錯誤：40°C 為許多致病菌的適宜生長溫度範圍，無法達到殺菌效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_035","year":2015,"roc_year":104,"session":"2","examNo":35,"q":"關於肉毒桿菌（Clostridium botulinum）的敘述，下列何者錯誤？","opts":["A. 所產生的毒素分為A、B、C、D、E、F及G七型","B. 常使人中毒的菌型以A、B及E型菌為主","C. C與D型常發生在家畜","D. 不易被硝酸鹽／亞硝酸鹽抑制"],"ans":3,"exp":"肉毒桿菌（Clostridium botulinum）毒素可被亞硝酸鹽（硝酸鹽／亞硝酸鹽）抑制，亞硝酸鹽是肉品加工中重要的防腐劑，可抑制肉毒桿菌孢子萌發及毒素產生。故「不易被硝酸鹽／亞硝酸鹽抑制」為錯誤敘述，答案選 D。","we":["A 正確：肉毒桿菌毒素分為 A～G 七型，敘述無誤。","B 正確：使人中毒的主要菌型以 A、B 及 E 型為主，敘述無誤。","C 正確：C 與 D 型毒素常見於家畜肉毒桿菌中毒，敘述無誤。","（正確）D 錯誤敘述：亞硝酸鹽確可抑制肉毒桿菌孢子萌發與毒素產生，「不易被抑制」說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_036","year":2015,"roc_year":104,"session":"2","examNo":36,"q":"動物性的自然毒以魚類體內存在最多，而河豚為最，其毒素儲存於體內的特定器官，如卵\r 巢、精巢、肝臟、皮膚、腸等，此生物毒稱之為","opts":["A. Amanitatoxin","B. Tetrodotoxin","C. Helvellic acid","D. Saxitoxin"],"ans":1,"exp":"河豚毒素（Tetrodotoxin，TTX）是存在於河豚卵巢、精巢、肝臟、皮膚、腸等器官的神經毒素，為熱穩定性強的非蛋白質毒素，是最危險的海洋生物毒素之一。","we":["A 錯誤：Amanitatoxin（毒鵝膏毒素）為毒蘑菇中的毒素，非魚類毒素。","（正確）B 正確：Tetrodotoxin（河豚毒素）為河豚特有的生物毒，為正確答案。","C 錯誤：Helvellic acid 為馬鞍菌（蕈類）中的毒素，非魚類毒素。","D 錯誤：Saxitoxin（石房蛤毒素）為雙殼貝類藻毒（貝毒），非河豚毒素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_037","year":2015,"roc_year":104,"session":"2","examNo":37,"q":"下列何種細菌產生毒素速度最快，只要5至6小時，就有足夠的毒素使人中毒，在 120℃加熱20分鐘也無法完全破壞其毒素？","opts":["A. 金黃色葡萄球菌（Staphylococcus aureus）","B. 肉毒桿菌（Clostridium botulinum）","C. 魏氏桿菌（Clostridium perfrigens）","D. 仙人掌菌（Bacillus cereus）"],"ans":0,"exp":"金黃色葡萄球菌（Staphylococcus aureus）在適宜條件下 5~6 小時即可產生足夠毒素，其腸毒素（enterotoxin）為蛋白質但具高度熱穩定性，120°C 加熱 20 分鐘無法完全破壞，為食物中毒中最具熱穩定毒素的細菌。","we":["（正確）A 正確：金黃色葡萄球菌毒素產生快（5-6小時），且 120°C/20 分鐘無法破壞，為正確答案。","B 錯誤：肉毒桿菌毒素為熱不穩定蛋白質，80°C 加熱 10 分鐘可破壞，與題目敘述不符。","C 錯誤：魏氏桿菌（產氣莢膜梭菌）毒素通常可被加熱破壞，不符合 120°C 無法破壞的描述。","D 錯誤：仙人掌菌（蠟樣芽孢桿菌）毒素雖有耐熱型，但產毒速度及熱穩定性不如金黃色葡萄球菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_038","year":2015,"roc_year":104,"session":"2","examNo":38,"q":"蛋的品質分級標準中，有關氣室的照明檢查敘述：「可移動，深度不超過9公釐，無氣泡」\r 是屬於下列何種蛋的性質？","opts":["A. 特級蛋","B. 甲級蛋","C. 乙級蛋","D. 丙級蛋"],"ans":1,"exp":"依台灣蛋品品質分級標準，甲級蛋（Grade A）的氣室深度不超過 9 公釐（9mm），且氣室可移動、無氣泡。特級蛋氣室深度更小（≦3.2mm），乙、丙級蛋允許更深氣室。","we":["A 錯誤：特級蛋（AA 級）氣室深度更嚴格，須在 3.2mm 以下，不超過 9mm 的描述適用於甲級蛋。","（正確）B 正確：甲級蛋氣室可移動、深度不超過 9 公釐、無氣泡，符合題目描述，為正確答案。","C 錯誤：乙級蛋允許氣室深度超過 9mm，不符合題目描述。","D 錯誤：丙級蛋為最低等級，氣室深度無限制，不符合題目描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_039","year":2015,"roc_year":104,"session":"2","examNo":39,"q":"複選題 39.蛋殼是在下列那個部分形成？","opts":["A. 峽部","B. 輸卵管","C. 子宮","D. 漏斗部"],"ans":2,"exp":"蛋殼（卵殼）在輸卵管的子宮部（uterus，又稱殼腺/shell gland）形成，蛋在子宮部停留約 20 小時，鈣質沉積形成蛋殼。峽部形成蛋殼膜，漏斗部為受精部位，輸卵管各段各有不同功能。","we":["A 錯誤：峽部（isthmus）主要形成蛋殼膜（內外殼膜），非蛋殼本身。","B 錯誤：「輸卵管」為整個管道的統稱，不能作為特定蛋殼形成部位的答案。","（正確）C 正確：子宮部（殼腺）為蛋殼形成的場所，蛋在此停留約 20 小時形成鈣質蛋殼。","D 錯誤：漏斗部（infundibulum）為受精及蛋白最外層形成的部位，非蛋殼形成場所。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_040","year":2015,"roc_year":104,"session":"2","examNo":40,"q":"我國生乳標準中，特級乳之細菌數（1 mL／直接法）應屬下列何種範圍？","opts":["A. 10萬以下","B. 30萬以下","C. 50萬以下","D. 100萬以下"],"ans":0,"exp":"依我國生乳標準，特級生乳（Grade A raw milk）的細菌數（直接法，1 mL）應在 10 萬（100,000）以下，甲級為 30 萬以下，乙級為 50 萬以下，丙級為 100 萬以下。","we":["（正確）A 正確：特級乳細菌數（直接法）應在 10 萬以下，為正確答案。","B 錯誤：30 萬以下為甲級生乳的標準，非特級。","C 錯誤：50 萬以下為乙級生乳的標準，非特級。","D 錯誤：100 萬以下為丙級生乳的標準，非特級。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_041","year":2015,"roc_year":104,"session":"2","examNo":41,"q":"關於屠體極易敗壞之原因，下列何者最有可能？","opts":["A. 放血不全","B. 屠前沒有充分休息","C. 屠畜有敗血症","D. 骨折"],"ans":2,"exp":"屠畜患有敗血症時，細菌已進入血液並散播至全身組織，屠宰後細菌從組織內部增殖，導致屠體極易敗壞，這是造成屠體內源性腐敗的最主要原因。","we":["A 錯誤：放血不全雖會影響屠體品質，但不是造成屠體極易敗壞的最主要原因。","B 錯誤：屠前沒有充分休息會導致肌肉酸度不足，影響保存，但影響程度不如敗血症嚴重。","（正確）C 正確：屠畜有敗血症時全身組織已受細菌感染，屠後最易腐敗，為正確答案。","D 錯誤：骨折為局部傷害，不會導致全身性屠體極易敗壞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_042","year":2015,"roc_year":104,"session":"2","examNo":42,"q":"家畜因病而致器官有實質病變，屠後檢查時發現有明顯黃疸，此屠體應如何判定？","opts":["A. 移至自然光線處覆驗屠體再判定","B. 判定不合格","C. 切除病變部後判定合格","D. 判定經冷藏後合格"],"ans":1,"exp":"依屠宰衛生檢查規則，家畜因病致器官有實質病變並出現明顯黃疸（病理性黃疸）時，代表有全身性疾病，此屠體應判定不合格，全體廢棄，不可切除病變部分後判定合格（病理性黃疸不同於生理性黃疸，不能復驗通過）。","we":["A 錯誤：移至自然光線下覆驗適用於可疑的生理性或輕微黃疸，明顯病理性黃疸不適用。","（正確）B 正確：明顯黃疸伴隨器官實質病變，代表系統性疾病，應判定整體不合格廢棄。","C 錯誤：切除病變部不能解決全身性黃疸的問題，黃疸屠體不可如此處理。","D 錯誤：冷藏無法改善病理性黃疸問題，此判定方式錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_043","year":2015,"roc_year":104,"session":"2","examNo":43,"q":"屠宰衛生檢查獸醫師依屠宰衛生檢查規則執行屠宰衛生檢查時，對判定應予以稽留時，其屠\r 體或內臟應如何處置？","opts":["A. 由獸醫師助理撤至稽留線（區）","B. 由獸醫師本人撤至稽留線（區）","C. 由屠宰作業人員撤至稽留線（區）","D. 由獸醫師主任撤至稽留線（區）"],"ans":2,"exp":"依屠宰衛生檢查規則，判定應稽留之屠體或內臟，應由屠宰作業人員撤至稽留線（區），獸醫師本人負責判定及標記，作業執行由屠宰場作業人員負責。","we":["A 錯誤：獸醫師助理並無此規定之職責，且助理非主要執行人員。","B 錯誤：獸醫師本人負責判定，但實際移動工作由屠宰作業人員執行。","（正確）C 正確：屠宰衛生檢查規則規定應由屠宰作業人員將稽留屠體撤至稽留線（區），為正確答案。","D 錯誤：獸醫師主任負責監督管理，不親自搬移稽留屠體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_044","year":2015,"roc_year":104,"session":"2","examNo":44,"q":"屠宰衛生檢查規則第15條規定家畜屠體、內臟具有下列情形之一時，應切除該患部，其餘正\r 常部分始得供食用，惟何者不包括在內？","opts":["A. 感染弓蟲病之頭部","B. 局部性豬丹毒","C. 局部壞死病灶","D. 中度或輕度之牛肉囊蟲"],"ans":0,"exp":"依屠宰衛生檢查規則第 15 條，弓蟲病感染的頭部不能僅切除後判定其餘部分合格，因弓蟲病為全身性感染，感染弓蟲病之頭部屬於應全體廢棄的情況。局部性豬丹毒、局部壞死病灶及中度或輕度牛肉囊蟲才屬可切除患部後合格。","we":["（正確）A 正確（不包含）：感染弓蟲病之頭部不屬於切除患部後可供食用的情形，為本題答案。","B 錯誤（包含在內）：局部性豬丹毒切除患部後，其餘正常部分可供食用，確實包含在規則中。","C 錯誤（包含在內）：局部壞死病灶切除後，其餘部分可供食用，確實包含在規則中。","D 錯誤（包含在內）：中度或輕度牛肉囊蟲可切除囊蟲部位後，其餘部分在凍結處理後供食用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_045","year":2015,"roc_year":104,"session":"2","examNo":45,"q":"民國89年4月19日由行政院農業委員會與行政院衛生署會銜訂定發布的畜牧法子法為何？","opts":["A. 屠宰場設置標準","B. 屠宰作業準則","C. 屠宰衛生檢查規則","D. 屠宰衛生收費標準"],"ans":2,"exp":"民國 89 年 4 月 19 日由行政院農業委員會與行政院衛生署（現衛生福利部）會銜訂定發布的畜牧法子法為「屠宰衛生檢查規則」，該規則規範屠宰衛生檢查的執行程序與標準。","we":["A 錯誤：屠宰場設置標準規範屠宰場硬體設施，並非由兩部會會銜訂定的主要子法。","B 錯誤：屠宰作業準則規範屠宰操作程序，並非民國 89 年農委會與衛生署會銜訂定的法規。","（正確）C 正確：屠宰衛生檢查規則為農委會與衛生署於民國 89 年 4 月 19 日會銜訂定，為正確答案。","D 錯誤：屠宰衛生收費標準不是農委會與衛生署會銜訂定的主要子法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_046","year":2015,"roc_year":104,"session":"2","examNo":46,"q":"關於家畜屠宰場設施中之分切包裝室（適用於預冷後分切之作業方式），下列敘述何者錯\r 誤？","opts":["A. 應設於預冷室及凍結設施鄰近，並須與屠宰室隔離","B. 屠體與內臟之分切包裝作業應作有效隔離","C. 室溫應能達到攝氏0至5度，並設有空氣調節設備","D. 設置適當之作業台及輸送裝置，工作檯面照明光度在200米燭光以上"],"ans":3,"exp":"依屠宰場設置標準，分切包裝室之工作檯面照明光度應在 500 米燭光以上（非 200 米燭光），以確保檢查品質。200 米燭光適用於一般工作區，分切包裝需要更高照明標準。","we":["A 正確：分切包裝室應設於預冷室及凍結設施鄰近，並須與屠宰室隔離，敘述無誤。","B 正確：屠體與內臟之分切包裝應作有效隔離，防止交叉污染，敘述無誤。","C 正確：分切包裝室室溫應維持在攝氏 0 至 5 度，並設有空調設備，敘述無誤。","（正確）D 錯誤：工作檯面照明光度應在 500 米燭光以上，而非 200 米燭光，此為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_047","year":2015,"roc_year":104,"session":"2","examNo":47,"q":"在肉品加工廠中，最常被使用的環境化學消毒劑為下列何者？","opts":["A. 次氯酸鹽／四級銨","B. 乙醛／陰性肥皂","C. 碘液／EDTA","D. 石炭酸／乙醛"],"ans":0,"exp":"肉品加工廠最常使用的環境化學消毒劑為次氯酸鹽（hypochlorite，如漂白水）及四級銨鹽（quaternary ammonium compounds，QAC），兩者均廣泛用於食品工廠地板、設備及器具消毒，效果廣泛且成本低廉。","we":["（正確）A 正確：次氯酸鹽及四級銨為肉品加工廠最常用的環境消毒劑組合，為正確答案。","B 錯誤：乙醛（aldehyde）毒性高，主要用於特殊消毒場合；陰性肥皂效力弱，非標準消毒劑組合。","C 錯誤：碘液（iodophor）雖可用於食品工廠，但 EDTA 為螯合劑非消毒劑，此組合不適當。","D 錯誤：石炭酸（phenol）毒性大，不適用於食品加工環境；乙醛（乙醇混淆）不是標準肉品廠消毒劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_048","year":2015,"roc_year":104,"session":"2","examNo":48,"q":"下列藥物殘留的檢驗方法中，何者需要的儀器設備最簡單？","opts":["A. 氣相層析／質譜法","B. 毛細管電泳法","C. 高效液相層析法","D. 生物檢測法"],"ans":3,"exp":"生物檢測法（bioassay）是最簡單的藥物殘留篩檢方法，無需複雜儀器，利用微生物抑菌原理（如杯碟法）或生物指示劑來偵測抗生素等殘留，設備簡單、成本低，適合快速初步篩選。GC/MS、HPLC 及毛細管電泳法均需昂貴精密儀器。","we":["A 錯誤：氣相層析/質譜法（GC/MS）需要高度精密昂貴的質譜儀器，設備最複雜。","B 錯誤：毛細管電泳法需要專業電泳儀器，設備較複雜。","C 錯誤：高效液相層析法（HPLC）需要液相層析儀及偵測器，設備較昂貴複雜。","（正確）D 正確：生物檢測法設備最簡單（僅需培養基與培養箱），適合現場快速篩查，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_049","year":2015,"roc_year":104,"session":"2","examNo":49,"q":"請問在牛乳的加熱殺菌法中，用於高溫短時間殺菌法的溫度是多少℃？","opts":["A. 70","B. 90","C. 130","D. 150"],"ans":0,"exp":"高溫短時間殺菌法（HTST, High Temperature Short Time）的條件為72°C（71.7°C）加熱 15 秒，但題目選項中最接近的為 70°C（選項 A），此為 HTST 的參考溫度。超高溫殺菌（UHT）為 130-150°C。","we":["（正確）A 正確：HTST 殺菌溫度約為 72°C（選項最接近值為 70°C），為正確答案。","B 錯誤：90°C 接近超高短時間殺菌（高溫殺菌法），非標準 HTST 溫度。","C 錯誤：130°C 為 UHT 超高溫殺菌的低端溫度，非 HTST。","D 錯誤：150°C 為 UHT 超高溫殺菌的高端溫度，非 HTST。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_050","year":2015,"roc_year":104,"session":"2","examNo":50,"q":"正常牛乳在15℃時之比重？","opts":["A. 1.302","B. 1.320","C. 1.203","D. 1.032"],"ans":3,"exp":"正常牛乳在 15°C 時的比重為 1.028 至 1.034，通常以 1.032 作為標準值，比重計測定牛乳比重是判斷是否摻水的重要指標（摻水則比重下降）。","we":["A 錯誤：1.302 遠超過牛乳正常比重範圍，不合理。","B 錯誤：1.320 同樣遠超正常範圍，不合理。","C 錯誤：1.203 遠超正常牛乳比重，不合理。","（正確）D 正確：1.032 為正常牛乳在 15°C 時的標準比重值，在正常範圍（1.028-1.034）內，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_051","year":2015,"roc_year":104,"session":"2","examNo":51,"q":"國內對畜禽屠宰的管理係規範在下列何種法令中？","opts":["A. 食品安全衛生管理法","B. 畜牧法","C. 獸醫師法","D. 動物傳染病防治條例"],"ans":1,"exp":"台灣國內對畜禽屠宰的管理規範在「畜牧法」中，畜牧法第 27 條以下規定屠宰場的設立、管理及屠宰衛生檢查等事項，相關子法包括屠宰衛生檢查規則等均依畜牧法授權訂定。","we":["A 錯誤：食品安全衛生管理法（食安法）規範食品製造、販售，不直接管理屠宰行為。","（正確）B 正確：畜牧法為畜禽屠宰管理的主要法律依據，為正確答案。","C 錯誤：獸醫師法規範獸醫師執業，不直接管理屠宰業務。","D 錯誤：動物傳染病防治條例規範動物傳染病防治，非主要屠宰管理法令。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_052","year":2015,"roc_year":104,"session":"2","examNo":52,"q":"「屠宰作業準則」中關於屠宰場環境衛生的規定，下列敘述何者錯誤？","opts":["A. 屠宰場區應禁止飼養動物，包括警戒用犬在內","B. 屠宰作業場應實施有效之病媒及其他昆蟲防制作業","C. 清潔用具應保管於固定場所","D. 屠宰場使用之清潔劑及消毒劑應由專人保管於專用儲存設施內"],"ans":0,"exp":"屠宰作業準則中，屠宰場區雖應禁止飼養無關動物，但警戒用犬（guard dogs）作為安全防衛用途通常有例外規定，不在完全禁止之列。故「包括警戒用犬在內」之全面禁止說法為錯誤。","we":["（正確）A 錯誤敘述：屠宰場禁止飼養動物的規定通常對警戒用犬有例外，「包括警戒用犬在內」為錯誤描述。","B 正確：屠宰作業場應實施病媒及昆蟲防制作業，敘述無誤。","C 正確：清潔用具應保管於固定場所，敘述無誤。","D 正確：清潔劑及消毒劑應由專人保管於專用儲存設施，敘述無誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_053","year":2015,"roc_year":104,"session":"2","examNo":53,"q":"水質消毒處理之石灰消毒法，水的pH值在10.0以上的時間須至少維持多久？","opts":["A. 30分鐘","B. 1小時","C. 3小時","D. 6小時"],"ans":1,"exp":"水質消毒的石灰消毒法（lime disinfection）要求水的 pH 值達到 10.0 以上，並維持至少 1 小時，才能達到有效滅菌效果（殺死大腸桿菌及其他致病菌）。","we":["A 錯誤：30 分鐘不足以達到石灰消毒法的有效滅菌時間要求。","（正確）B 正確：石灰消毒法要求 pH 10.0 以上維持至少 1 小時，為正確答案。","C 錯誤：3 小時雖可達到消毒效果，但並非最低要求標準，過長且不必要。","D 錯誤：6 小時遠超標準要求，不是法規規定的最低維持時間。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_054","year":2015,"roc_year":104,"session":"2","examNo":54,"q":"動物暴露戴奧辛的主要來源為何？","opts":["A. 吸入帶毒的懸浮微粒","B. 帶毒排遺經皮膚吸收","C. 飲用水污染","D. 食用污染的草料或飼料"],"ans":3,"exp":"動物（特別是農場動物）暴露戴奧辛的主要來源為食用被戴奧辛污染的草料或飼料，戴奧辛具高度脂溶性，易於食物鏈中累積（生物累積），飼料污染是農場動物戴奧辛暴露的最主要途徑。","we":["A 錯誤：吸入帶毒懸浮微粒為人類暴露戴奧辛的途徑之一，但對農場動物並非主要暴露來源。","B 錯誤：帶毒排遺經皮膚吸收並非戴奧辛的主要暴露途徑。","C 錯誤：飲用水污染為戴奧辛的次要來源，因水中戴奧辛濃度通常極低。","（正確）D 正確：食用污染草料或飼料為農場動物戴奧辛暴露的最主要來源，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_055","year":2015,"roc_year":104,"session":"2","examNo":55,"q":"畜牧場廢水活性污泥處理調整「食微比」濃度，食微比所指為何？","opts":["A. 有機含量與污泥量之比","B. 添加養分與微生物需求之比","C. 氧氣濃度與微生物耗氧比值","D. 活性污泥與廢棄污泥濃度比"],"ans":0,"exp":"食微比（F/M ratio，Food to Microorganism ratio）在活性污泥處理中指有機含量（Food，通常以 BOD 或 COD 表示）與污泥量（Microorganism，MLSS 或 MLVSS）之比，用於控制活性污泥系統的運作效率。","we":["（正確）A 正確：食微比指有機含量（食物）與污泥量（微生物）之比，為正確答案。","B 錯誤：添加養分與微生物需求之比為營養比的概念，非食微比定義。","C 錯誤：氧氣濃度與微生物耗氧比值為另一廢水處理參數（DO/耗氧），非食微比。","D 錯誤：活性污泥與廢棄污泥濃度比為污泥齡相關概念，非食微比。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_056","year":2015,"roc_year":104,"session":"2","examNo":56,"q":"下列那一個是撲滅（eradication）或控制（control）疾病的最好策略？","opts":["A. 疑似病例快速進市場販售","B. 不做任何事","C. 進行預防性投藥","D. 禁止移動高風險動物"],"ans":3,"exp":"撲滅或控制傳染病的最佳策略為禁止移動高風險動物（movement restriction），防止疾病藉由動物移動擴散至其他地區或族群，這是動物疫病爆發時最重要的即時防控措施。","we":["A 錯誤：疑似病例快速進市場販售是最危險的行為，會加速疾病擴散，為最差選擇。","B 錯誤：不做任何事只會讓疾病持續蔓延，完全無助於控制。","C 錯誤：預防性投藥可作為輔助措施，但不是撲滅或控制疾病的「最好」單一策略。","（正確）D 正確：禁止移動高風險動物為疾病控制最有效的首要策略，防止疫情擴散，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_057","year":2015,"roc_year":104,"session":"2","examNo":57,"q":"下列何者是我國目前畜禽屠宰衛生檢查之中央主管機關？","opts":["A. 經濟部標準檢驗局","B. 行 政院農業委員會動植物防疫檢疫局","C. 行 政院衛生福利部","D. 行政院環境保護署 ."],"ans":1,"exp":"依畜牧法規定，我國畜禽屠宰衛生檢查的中央主管機關為行政院農業委員會動植物防疫檢疫局（現改制為農業部動植物防疫檢疫署），負責全國屠宰衛生檢查制度的制定與監督。","we":["A 錯誤：經濟部標準檢驗局負責商品檢驗，非畜禽屠宰衛生的主管機關。","（正確）B 正確：行政院農業委員會動植物防疫檢疫局為畜禽屠宰衛生檢查中央主管機關，為正確答案。","C 錯誤：衛生福利部主管人用食品衛生，但屠宰衛生管理屬農業主管機關職責。","D 錯誤：環境保護署負責環境污染防治，不管理畜禽屠宰衛生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_058","year":2015,"roc_year":104,"session":"2","examNo":58,"q":"現今流行病學觀點認為監控（monitoring）和監測 （surveillance）定義之不同點在於有無","opts":["A. 分析及收集資料","B. 公布相關資料給相關人士參考","C. 採取行動，進行處理，以控制疾病","D. 二者並無實質上之不同點"],"ans":2,"exp":"現今流行病學中，監測（surveillance）與監控（monitoring）的差異在於：監測不只是收集與分析資料，更重要的是根據資料「採取行動」進行疾病控制；而監控僅是持續收集和分析資料。","we":["A 錯誤：分析及收集資料兩者皆有，並非兩者的差異所在。","B 錯誤：公布資料兩者均可進行，並非監控與監測的本質差異。","（正確）C 正確：surveillance（監測）的核心差異在於需採取行動控制疾病，而 monitoring（監控）不包含此步驟，為正確答案。","D 錯誤：兩者確有實質差異，「並無實質不同」說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_059","year":2015,"roc_year":104,"session":"2","examNo":59,"q":"下列何項不是疾病的內在致病因子？","opts":["A. 動物的品種","B. 病原的毒力","C. 自然界中的保毒者","D. 氣候環境"],"ans":3,"exp":"流行病學三角（epidemiological triad）中，「氣候環境」屬於外在環境因子（environment），而非內在致病因子（intrinsic factors）。內在因子包括動物的品種（宿主因子）、病原的毒力（病原因子）、自然界中的保毒者（病原因子）等。","we":["A 錯誤：動物的品種屬宿主內在因子（影響感受性），為內在致病因子。","B 錯誤：病原的毒力為病原體的特性，屬於內在致病因子。","C 錯誤：自然界中的保毒者（reservoir）與病原存續相關，屬於病原面的致病因子。","（正確）D 正確：氣候環境為外在環境因子，不屬於疾病的「內在致病因子」，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_060","year":2015,"roc_year":104,"session":"2","examNo":60,"q":"下列那一項不屬於Hill's criteria用來建立疾病發生的因果關係？","opts":["A. 事件發生的時序性（time sequence of the events）","B. 相關的強度（strength of the association）","C. 再現性（reproducibility）","D. 一致性（consistency）"],"ans":2,"exp":"Hill's criteria（Hill 因果關係準則）包含：強度（strength）、一致性（consistency）、特異性（specificity）、時序性（temporality）、劑量反應（biological gradient）、合理性（plausibility）、一貫性（coherence）、實驗性（experiment）、類比性（analogy）。「再現性（reproducibility）」並非 Hill's criteria 的獨立項目（一致性包含類似概念），故答案選 C。","we":["A 錯誤：事件發生的時序性（temporality）是 Hill's criteria 的核心準則之一，應包含在內。","B 錯誤：相關的強度（strength of association）是 Hill's criteria 的第一項準則，應包含在內。","（正確）C 正確：再現性（reproducibility）並非 Hill's criteria 的獨立條件，不屬於其準則，為正確答案。","D 錯誤：一致性（consistency）是 Hill's criteria 的準則之一，應包含在內。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_061","year":2015,"roc_year":104,"session":"2","examNo":61,"q":"欲調查臺北市犬隻感染心絲蟲之盛行率，決定從動物醫院門診病例中隨機抽樣犬隻進行研\r 究。有關此抽樣調查，下列敘述何者正確？","opts":["A. 本調查之研究族群（study population）為全臺北市的犬隻","B. 本調查之目標族群（target population）為到動物醫院就診的犬隻","C. 選定的動物醫院名冊為本調查的抽樣單位（sampling unit）","D. 外在效度（external validity）意指本調查中，自動物醫院調查而得的犬隻盛行率結果能夠\r 推及至全臺北市犬隻盛行率結果的程度"],"ans":3,"exp":"外在效度（external validity）指研究結果能推廣至研究族群以外的程度，即從動物醫院樣本得到的盛行率結果能否代表全台北市犬隻的程度，此為外在效度的定義。目標族群為全台北市犬隻，研究族群為就診犬隻，抽樣單位為個別犬隻。","we":["A 錯誤：研究族群（study population）應為到動物醫院就診的犬隻，非全台北市犬隻（後者為目標族群）。","B 錯誤：目標族群（target population）應為全台北市的犬隻，非就診犬隻（後者為研究族群）。","C 錯誤：抽樣單位（sampling unit）為個別犬隻，動物醫院名冊為抽樣框（sampling frame）。","（正確）D 正確：外在效度指從醫院調查結果能推及至全台北市犬隻的程度，定義正確，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_062","year":2015,"roc_year":104,"session":"2","examNo":62,"q":"已知鈎端螺旋體感染會導致溶血，而溶血會導致血紅素尿，請問下列敘述何者正確？","opts":["A. 鈎端螺旋體感染為血紅素尿之直接相關因子","B. 溶血為血紅素尿之直接相關因子","C. 鈎端螺旋體感染不是血紅素尿之相關因子","D. 溶血為血紅素尿之間接相關因子"],"ans":1,"exp":"在因果路徑中，溶血是血紅素尿的「直接相關因子」（proximate cause），因為溶血直接導致血紅素釋出並從尿液排出。鈎端螺旋體感染是溶血的原因，對血紅素尿而言是「間接相關因子」（distal cause）。","we":["A 錯誤：鈎端螺旋體感染→溶血→血紅素尿，鈎端螺旋體為血紅素尿的間接因子，非直接因子。","（正確）B 正確：溶血直接導致血紅素尿，為血紅素尿的直接相關因子，為正確答案。","C 錯誤：鈎端螺旋體感染確實與血紅素尿相關（透過溶血），不能說「不是相關因子」。","D 錯誤：溶血是血紅素尿的直接相關因子，而非間接因子（間接因子為鈎端螺旋體感染）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_063","year":2015,"roc_year":104,"session":"2","examNo":63,"q":"如果已知真胃之黏膜增生（abomasal mucosal hyperplasia）及捻轉血矛線蟲\r （Haemonchus contortus）為牛貧血的風險因子，下列敘述何者最正確？","opts":["A. 於適當設計之病例對照研究法中，出現不正常之黏膜增生與貧血之勝算比（odds ratio; \r OR）應為顯著相關（p < 0.05），且其 OR < 1","B. 於適當設計之病例對照研究法中，捻轉血矛線蟲之出現與貧血之勝算比應為顯著相關（p <0.05），且其 OR > 1","C. 真胃之黏膜增生一定會導致貧血","D. 真胃之黏膜增生必與捻轉血矛線蟲之出現相關"],"ans":1,"exp":"若真胃黏膜增生及捻轉血矛線蟲為牛貧血的風險因子，在病例對照研究中，病例組（貧血牛）中捻轉血矛線蟲的出現比例應高於對照組，因此其 OR 值應>1，且 p<0.05 為顯著相關。OR>1 表示暴露組（有捻轉血矛線蟲）發生貧血的勝算高於未暴露組。","we":["A 錯誤：黏膜增生為風險因子，OR 應>1，不應<1；OR<1 代表保護因子。","（正確）B 正確：捻轉血矛線蟲為風險因子，病例對照研究中 OR 應>1 且顯著（p<0.05），為正確答案。","C 錯誤：風險因子增加貧血風險，但不代表「必然導致」，只是統計上相關。","D 錯誤：黏膜增生與捻轉血矛線蟲均為獨立風險因子，兩者不一定互相關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_064","year":2015,"roc_year":104,"session":"2","examNo":64,"q":"下列有關基本傳染數（R0）之敘述何者正確？","opts":["A. 當疾病爆發時，其R0小於0","B. 其與每一單位時間可以接觸到的個體數有關","C. 通常R0可以直接算出","D. R0於疾病傳播末期小於0"],"ans":1,"exp":"基本傳染數（R0）代表在完全易感族群中，一個感染個體平均可傳染的新感染個體數，與每單位時間內能接觸到的易感個體數量有關。R0 通常無法直接計算，需透過模型估算；R0>1 時疾病流行，R0<1 時疾病消退。","we":["A 錯誤：疾病爆發時 R0 大於 1（非小於 0），R0<1 表示疾病無法持續流行。","（正確）B 正確：R0 與每單位時間可接觸的個體數、傳播概率及感染期長度有關，此敘述正確。","C 錯誤：R0 通常不能直接算出，需透過流行病學模型估算，「可直接算出」為錯誤。","D 錯誤：R0 為基本傳染數，不會隨疾病傳播末期而改變為負數；有效傳染數（Re）在疾病末期<1，但非<0。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_065","year":2015,"roc_year":104,"session":"2","examNo":65,"q":"如果在問卷中使用「不喜歡、普通喜歡、很喜歡」，這種資料為下列那種數據型態？","opts":["A. 等距數據","B. 等比數據","C. 序位數據","D. 類別數據"],"ans":2,"exp":"「不喜歡、普通喜歡、很喜歡」為具有順序的類別資料，類別之間有排列順序但間距不等，屬於序位數據（ordinal data），又稱次序尺度資料。等距數據需要等間距，等比數據需有絕對零點。","we":["A 錯誤：等距數據（interval data）需要類別間距相等（如溫度），此種喜好評分間距不等。","B 錯誤：等比數據（ratio data）需有絕對零點（如體重、身高），此處無絕對零點。","（正確）C 正確：序位數據（ordinal data）具有排列順序但間距不固定，符合此喜好量表特性，為正確答案。","D 錯誤：類別數據（nominal data）無順序之分（如血型），而「不喜歡/普通/很喜歡」具有順序。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_066","year":2015,"roc_year":104,"session":"2","examNo":66,"q":"在進行某疾病的盛行率調查時，依預估盛行率計算所需的樣本數以下列何者最大？","opts":["A. 10%","B. 50%","C. 90%","D. 99%"],"ans":1,"exp":"樣本數計算公式中，變異數最大值出現在盛行率 p=0.5（50%）時，因為 p(1-p) 在 p=0.5 時達到最大值（0.25），故預估盛行率為 50% 時所需樣本數最大。","we":["A 錯誤：p=10% 時，p(1-p)=0.09，樣本數較 50% 時小。","（正確）B 正確：p=50% 時，p(1-p)=0.25 為最大值，所需樣本數最大，為正確答案。","C 錯誤：p=90% 時，p(1-p)=0.09，與 10% 相同，樣本數較 50% 時小。","D 錯誤：p=99% 時，p(1-p)=0.0099，樣本數最小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_067","year":2015,"roc_year":104,"session":"2","examNo":67,"q":"某研究針對供應不同飲用水之三個鄉鎮的豬場，比較此三個鄉鎮豬場豬隻其沙氏桿菌盛行率\r 是否不同，此為何種流行病學研究方法？","opts":["A. 橫斷性研究","B. 病例對照研究","C. 世代追蹤研究","D. 實驗性研究"],"ans":0,"exp":"此研究在特定時間點比較三個鄉鎮豬場豬隻的沙氏桿菌盛行率，未追蹤動物一段時間，也未從疾病狀態選取病例，屬於在某時間點橫斷調查疾病分布的「橫斷性研究（cross-sectional study）」。","we":["（正確）A 正確：此研究在特定時間點比較不同地區的盛行率，為橫斷性研究，為正確答案。","B 錯誤：病例對照研究需先選定病例與對照組，再回溯暴露因子，不符合此研究描述。","C 錯誤：世代追蹤研究需追蹤一段時間觀察新病例的發生，此研究無追蹤要素。","D 錯誤：實驗性研究需有干預措施（如投藥、疫苗），此研究為觀察性研究。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_068","year":2015,"roc_year":104,"session":"2","examNo":68,"q":"單獨暴露於A病因（cause）無法產生X疾病，但是缺乏A病因，則X疾病無法發生，因此A病\r 因是必要但非充分病因。按照此邏輯，巴斯德桿菌是引起家禽霍亂的","opts":["A. 充分且必要病因","B. 充分病因","C. 必要病因","D. 非充分且非必要病因"],"ans":2,"exp":"依題目定義：「缺乏 A 病因則 X 疾病無法發生」表示 A 為必要病因（necessary cause）；「單獨暴露 A 無法產生 X」表示 A 非充分病因（not sufficient）。巴斯德桿菌（Pasteurella multocida）為家禽霍亂（fowl cholera）的必要病因—沒有此菌則家禽霍亂不會發生，但單有此菌可能因個體免疫力等因素不一定發病。","we":["A 錯誤：充分且必要病因需「單獨暴露即可產生疾病」，題目指出單獨暴露無法產生疾病，故不符。","B 錯誤：充分病因指「單獨即可引起疾病」，但題目明確指出單獨暴露無法產生 X 疾病。","（正確）C 正確：題目定義符合「必要但非充分病因」的特徵，巴斯德桿菌為家禽霍亂的必要病因。","D 錯誤：題目明確說「缺乏 A，X 疾病無法發生」，表示 A 確為必要病因，非「非必要」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_069","year":2015,"roc_year":104,"session":"2","examNo":69,"q":"某動物園研究不同種動物感染弓蟲之勝算比（odds ratio）與95%信賴區間如下表，請問那種動物的勝算比在統計學上不具顯著性（p＜0.05）？","opts":["A. 老虎","B. 駱駝","C. 大象","D. 袋鼠"],"ans":2,"exp":"若 95% 信賴區間包含 1（即 CI 跨越 1.0），則 OR 在統計學上不具顯著性（p>0.05）。本題依據表格資料，大象的 OR 其 95% 信賴區間應包含 1，故大象的勝算比在統計學上不具顯著性。","we":["A 老虎：若 95% CI 不含 1（如 CI=1.5-3.2），則 OR 具統計顯著性。","B 駱駝：若 95% CI 不含 1，則 OR 具統計顯著性。","（正確）C 大象：若 95% CI 包含 1（如 CI=0.8-2.5），則 OR 不具統計顯著性，為本題答案（依題目表格）。","D 袋鼠：若 95% CI 不含 1，則 OR 具統計顯著性。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_104_2_公衛_070","year":2015,"roc_year":104,"session":"2","examNo":70,"q":"某一定點時間內疾病在已知有危險性群體中發生的情形稱為","opts":["A. 盛行率","B. 發生率","C. 攻擊率","D. 發病率"],"ans":2,"exp":"攻擊率（attack rate）是指在特定暴露事件或時間點，在已知有危險性（暴露）群體中疾病發生的比例，通常用於食物中毒或傳染病爆發調查中，計算特定時期內疾病的罹患率。","we":["A 錯誤：盛行率（prevalence）為某時間點現有病例數除以族群總數，不限於「危險性群體」。","B 錯誤：發生率（incidence rate）為一段時間內新病例數除以危險人年，非特定時間點定義。","（正確）C 正確：攻擊率描述特定時間點在已知危險性群體中的疾病發生情況，符合題目定義，為正確答案。","D 錯誤：發病率（morbidity rate）為廣義發病頻率，不特指「已知危險性群體」的特定時間點計算。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_071","year":2015,"roc_year":104,"session":"2","examNo":71,"q":"關於描述性流行病學與分析性流行病學間的差異，下列敘述何者正確？","opts":["A. 前者較易控制有關疾病診斷的正確性","B. 前者的資料只可用盛行率表示","C. 後者較易有合適的對照組進行比較","D. 後者易有生態謬誤的問題產生"],"ans":2,"exp":"分析性流行病學（如世代研究、病例對照研究）有設計好的對照組，可以與暴露組進行比較，故「後者較易有合適的對照組進行比較」為正確敘述。描述性流行病學易有生態謬誤（ecological fallacy）問題，非分析性流行病學。","we":["A 錯誤：分析性流行病學（有明確病例定義與對照組選擇）較描述性研究更易控制診斷正確性。","B 錯誤：描述性流行病學的資料可用盛行率、發生率等多種指標表示，非只能用盛行率。","（正確）C 正確：分析性流行病學（世代、病例對照研究）設計有對照組，較易進行比較，為正確答案。","D 錯誤：生態謬誤（ecological fallacy）是描述性流行病學（尤其生態學研究）的問題，非分析性流行病學。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_072","year":2015,"roc_year":104,"session":"2","examNo":72,"q":"某一禽場1,000隻雞中，發現罹患禽流感者有500隻，因禽流感而死亡者有100隻，請問其致\r 死率為多少？","opts":["A. 10%","B. 20%","C. 40%","D. 50%"],"ans":1,"exp":"致死率（case fatality rate，CFR）= 因某病死亡數 / 該病罹患數 × 100%。本題：罹患禽流感者 500 隻，因禽流感死亡 100 隻，CFR = 100/500 × 100% = 20%。","we":["A 錯誤：10% = 100/1000，此為死亡率（mortality rate），非致死率（以罹患數為分母）。","（正確）B 正確：致死率 = 100（死亡）/ 500（罹患）× 100% = 20%，為正確答案。","C 錯誤：40% 計算無依據，不符合任何標準公式。","D 錯誤：50% = 500/1000，此為罹病率（morbidity rate），非致死率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_073","year":2015,"roc_year":104,"session":"2","examNo":73,"q":"某豬場有1,000頭豬隻，本月共有100頭發病，其中罹患豬瘟者有80頭，發病豬隻中共有50頭\r 死亡，其中因罹患豬瘟死亡者有20頭，請問該豬場本月豬隻豬瘟致死率為何？","opts":["A. 50%","B. 25%","C. 10%","D. 5%"],"ans":1,"exp":"豬瘟致死率（CFR for CSF）= 因豬瘟死亡數 / 豬瘟罹患數 × 100%。本題：豬瘟罹患 80 頭，因豬瘟死亡 20 頭，CFR = 20/80 × 100% = 25%。","we":["A 錯誤：50% = 20/40，分母不正確，無法推算出此數值。","（正確）B 正確：豬瘟致死率 = 20（豬瘟死亡）/ 80（豬瘟罹患）× 100% = 25%，為正確答案。","C 錯誤：10% = 20/200，分母不符合題目數據。","D 錯誤：5% = 20/400，分母不符合題目數據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_074","year":2015,"roc_year":104,"session":"2","examNo":74,"q":"一年內發生之新病例數除以該年內之具感受性總平均動物數為","opts":["A. 點盛行率","B. 期盛行率","C. 年盛行率","D. 發生率"],"ans":3,"exp":"一年內新病例數除以該年內具感受性總平均動物數，為「發生率（incidence rate）」，又稱累積發生率（cumulative incidence）或年發病率。點盛行率為某時間點之病例比例，期盛行率為某時期之病例比例，兩者均包含舊病例，非只計新病例。","we":["A 錯誤：點盛行率（point prevalence）為某特定時間點的現患病例比例，包含新舊病例。","B 錯誤：期盛行率（period prevalence）為某時期內的所有病例比例，包含新舊病例。","C 錯誤：年盛行率指某年的盛行率，仍包含舊病例，與只計新病例的「發生率」不同。","（正確）D 正確：一年內新病例數除以具感受性平均動物數為發生率的定義，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_075","year":2015,"roc_year":104,"session":"2","examNo":75,"q":"研究者想要提高對豬隻新型流感病毒診斷的特異度，因此結合兩診斷工具A（敏感度：90%；特異度：85%）及B（敏感度：85%；特異度：80%），以序列檢測（tests in\r series）方式進行，請問此種檢測方式的整體特異度（%）為","opts":["A. 82.5","B. 90.0","C. 97.0","D. 98.5"],"ans":2,"exp":"序列檢測（tests in series）以提高特異度為目的，整體特異度計算：需兩個測試均為陰性才判為真陰性（序列中任一陽性即為陽性）。整體特異度 = Sp_A + (1-Sp_A) × Sp_B = 0.85 + 0.15 × 0.80 = 0.85 + 0.12 = 0.97 = 97%。","we":["A 錯誤：82.5% 為兩個特異度的平均，非序列檢測的正確計算方式。","B 錯誤：90.0% 接近 A 的特異度，非序列計算結果。","（正確）C 正確：序列特異度 = 0.85 + (1-0.85) × 0.80 = 0.85 + 0.12 = 0.97 = 97%，為正確答案。","D 錯誤：98.5% 並非序列檢測特異度的正確計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_076","year":2015,"roc_year":104,"session":"2","examNo":76,"q":"若已知某豬場沙氏桿菌感染之實際盛行率（true prevalence）為20%，利用90%敏感度與80%特異度之快速診斷試劑進行隨機抽樣100隻豬血清檢測，請問理論上有幾個樣本為偽陰\r 性？","opts":["A. 2","B. 8","C. 10","D. 20"],"ans":0,"exp":"真實陽性數 = 100 × 20% = 20 隻；偽陰性（FN）= 真陽性 × (1 - 敏感度) = 20 × (1 - 0.90) = 20 × 0.10 = 2 隻。故理論上有 2 個樣本為偽陰性（感染但被診斷為陰性）。","we":["（正確）A 正確：FN = 20（真陽性）× 10%（1-敏感度）= 2，為正確答案。","B 錯誤：8 = 80（真陰性）× 10%，這是偽陽性（FP）的計算，非偽陰性。","C 錯誤：10 為 100 × 10%，混淆了計算基礎，未正確區分真陽性數目。","D 錯誤：20 為總真陽性數目（盛行率 20%），非偽陰性數目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_077","year":2015,"roc_year":104,"session":"2","examNo":77,"q":"我國飲用水水質標準規定大腸桿菌群（coliform group）最大限值（濾膜法）為下列何者\r （CFU/100 mL）？","opts":["A. 6","B. 10","C. 100","D. 160"],"ans":0,"exp":"依我國飲用水水質標準，大腸桿菌群（coliform group）以濾膜法（membrane filter method）檢測的最大限值為 6 CFU/100 mL。（注：總大腸桿菌群限值為 6 CFU/100 mL，糞大腸桿菌群及大腸桿菌均不得檢出）","we":["（正確）A 正確：我國飲用水大腸桿菌群（濾膜法）最大限值為 6 CFU/100 mL，為正確答案。","B 錯誤：10 CFU/100 mL 超過我國法定標準，不符合飲用水規範。","C 錯誤：100 CFU/100 mL 遠超標準，屬嚴重污染範圍。","D 錯誤：160 CFU/100 mL 遠超標準，不符合任何飲用水標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_078","year":2015,"roc_year":104,"session":"2","examNo":78,"q":"屠宰場之凍結設施，其溫度應能達到攝氏多少℃以下？","opts":["A. -40","B. -20","C. -18","D. -7"],"ans":2,"exp":"依屠宰場設置標準，凍結設施（freezing facility）的溫度應能達到攝氏 -18°C 以下，此溫度為國際食品標準（Codex）規定的冷凍肉品儲存溫度下限，可有效抑制微生物生長並延長保存期限。","we":["A 錯誤：-40°C 雖更低，但屠宰場設置標準所規定的最低溫度為 -18°C，非 -40°C。","B 錯誤：-20°C 雖符合一般消費者冰箱標準，但台灣屠宰場規定為 -18°C 以下。","（正確）C 正確：屠宰場凍結設施應達到 -18°C 以下，符合法規及國際標準，為正確答案。","D 錯誤：-7°C 為冷藏溫度範圍，遠不足以達到冷凍標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_104_2_公衛_079","year":2015,"roc_year":104,"session":"2","examNo":79,"q":"丙式及丁式屠宰衛生合格標誌及其標明如下圖。請問，年碼、月碼、日碼之排列組合為何？","opts":["A. a, b, c","B. b, d, e","C. a, d, e","D. c, d, e"],"ans":0,"exp":"本題需要參考丙式及丁式屠宰衛生合格標誌圖示，依屠宰衛生合格標誌規定，標誌上年碼、月碼、日碼的排列方式需對應圖中 a、b、c、d、e 位置。本題依需要視覺資料判斷，設為需複查。依一般記憶，通常年碼在上方，月碼次之，日碼在下。","we":["（正確依圖判斷）A 選項：a, b, c 為年、月、日排列，需對照原始標誌圖確認。","B 選項：b, d, e 組合，需圖示確認是否符合標誌設計。","C 選項：a, d, e 組合，需圖示確認是否符合標誌設計。","D 選項：c, d, e 組合，需圖示確認是否符合標誌設計。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_104_2_公衛_080","year":2015,"roc_year":104,"session":"2","examNo":80,"q":"下列何者為我國甲類動物傳染病且亦屬於人畜共通傳染病？","opts":["A. 狂犬病","B. 豬瘟","C. 口蹄疫","D. 高病原性家禽流行性感冒"],"ans":0,"exp":"狂犬病（Rabies）在台灣動物傳染病防治條例中為甲類動物傳染病，同時也是人畜共通傳染病，由狂犬病毒感染犬、貓、野生動物及人類。豬瘟（Classical Swine Fever）及口蹄疫（FMD）非人畜共通傳染病；高病原性禽流感雖可感染人，但在台灣法定分類中狂犬病才同時符合兩個條件。","we":["（正確）A 正確：狂犬病為台灣甲類動物傳染病且為人畜共通傳染病，同時符合兩個條件，為正確答案。","B 錯誤：豬瘟（CSF）不感染人類，非人畜共通傳染病。","C 錯誤：口蹄疫病毒雖極少報告感染人類，但官方不列為主要人畜共通傳染病。","D 錯誤：高病原性家禽流行性感冒（HPAI）雖可感染人，但在台灣法定動物傳染病分類中，狂犬病為更典型同時符合兩者的答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_001","year":2016,"roc_year":105,"session":"1","examNo":1,"q":"小明清理羊舍幾天後，發現手指有丘疹化膿性病灶，小明最有可能感染何種人畜共通傳染\r   病？","opts":["A. Q熱","B. 羊接觸傳染性化膿性口炎","C. 里夫谷熱","D. 立百病毒感染症"],"ans":1,"exp":"羊接觸傳染性化膿性口炎（contagious ecthyma，orf）是由orf病毒（Parapoxvirus）引起的人畜共通傳染病，接觸受感染羊隻或其分泌物後，病毒可透過皮膚傷口感染，在手指或手部皮膚形成丘疹、膿疱等病灶，是畜牧從業人員常見的職業性皮膚病。","we":["Q熱（Coxiella burnetii）以吸入性傳播為主，引起肺炎等，不是清理羊舍後手指局部病灶的典型表現。","（正確）清理羊舍後手指出現丘疹化膿性病灶，最符合orf（羊接觸傳染性化膿性口炎）的典型皮膚感染表現。","里夫谷熱（Rift valley fever）主要表現為發燒及出血熱症狀，不是局部皮膚丘疹病灶。","立百病毒（Nipah）感染主要表現為腦炎症狀，不是手指局部丘疹病灶。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_002","year":2016,"roc_year":105,"session":"1","examNo":2,"q":"下列何者不是流行性感冒病毒在全世界造成大流行的主要原因？","opts":["A. 來自不同動物的流感病毒基因發生基因重組","B. 病毒發生抗原移形（antigenic shift）","C. 病毒對於不同物種細胞表面受體的結合能力增加","D. 病毒發生抗原飄移（antigenic drift）"],"ans":3,"exp":"流感病毒大流行（pandemic）主要原因是抗原移形（antigenic shift）——不同種來源的流感病毒基因發生重組（reassortment），產生一種全新的HA或NA亞型，使全球人群幾乎無免疫力。抗原飄移（antigenic drift）是點突變引起的小幅抗原變化，只能引起季節性流行，不是大流行的主要原因。","we":["來自不同動物的流感病毒基因發生基因重組是抗原移形的基礎，是大流行的主要原因，A正確。","病毒發生抗原移形（antigenic shift）是大流行最重要的原因，B正確。","病毒對不同物種細胞表面受體的結合能力增加（跨宿主傳播能力），是大流行的必要條件，C正確。","（正確）抗原飄移（antigenic drift）是點突變引起的小幅抗原變化，導致季節性流行但不是大流行的主要原因，D是例外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_003","year":2016,"roc_year":105,"session":"1","examNo":3,"q":"黃病毒屬是人畜共通傳染病毒中重要的一屬，下列何者是黃病毒屬家族中主要藉由壁蝨\r   （tick）傳播的？","opts":["A. 日本腦炎病毒","B. 跳躍病病毒","C. 肌痛症病毒","D. 西尼羅病毒"],"ans":1,"exp":"黃病毒科（Flaviviridae）中主要藉由壁蝨傳播的成員是跳躍病病毒（louping ill virus）及蜱媒腦炎病毒（TBE virus）等。日本腦炎病毒（JEV）、西尼羅病毒（WNV）由蚊子傳播；肌痛症病毒不屬黃病毒科。跳躍病（louping ill）以壁蝨Ixodes ricinus為主要媒介。","we":["日本腦炎病毒（JEV）由三斑家蚊（Culex tritaeniorhynchus）等蚊子傳播，不是壁蝨。","（正確）黃病毒科中跳躍病病毒（louping ill virus）以壁蝨（Ixodes ricinus）為主要傳播媒介。","肌痛症（myalgia）不是由壁蝨傳播的黃病毒，且此名稱不是標準的黃病毒科成員名稱。","西尼羅病毒（WNV）由蚊子（Culex屬）傳播，不是壁蝨媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_004","year":2016,"roc_year":105,"session":"1","examNo":4,"q":"有關猴痘病毒的敘述，下列何者正確？","opts":["A. 屬於poxviridae，parapox genus","B. 只會感染猴子等靈長類","C. 與牛痘病毒間具有交叉抗原保護力","D. 主要出現在亞馬遜叢林中"],"ans":2,"exp":"猴痘病毒（Monkeypox virus）屬Orthopoxvirus屬，與牛痘病毒（vaccinia virus）及天花病毒屬同一屬，因此具有交叉抗原保護力（cross-reactive immunity）。天花疫苗（牛痘接種）可提供對猴痘的部分保護。猴痘病毒感染多種動物（非只靈長類），主要分布在非洲（非亞馬遜），屬Orthopoxvirus非Parapoxvirus。","we":["猴痘病毒屬Poxviridae，但屬Orthopoxvirus屬，不是Parapox genus；A是錯誤的。","猴痘病毒可感染多種哺乳動物（囓齒類、靈長類等），不只是猴子，B是錯誤的。","（正確）猴痘病毒與牛痘病毒同屬Orthopoxvirus，具有交叉抗原，牛痘疫苗可提供對猴痘的保護力，C是正確的。","猴痘主要分布在非洲的赤道雨林，不是亞馬遜叢林，D是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_005","year":2016,"roc_year":105,"session":"1","examNo":5,"q":"小明爬山時曾餵食獼猴，數日後出現神經症狀，請問小明最有可能感染下列何種人畜共通傳\r  染病病原？","opts":["A. 疱疹B病毒","B. 日本腦炎病毒","C. 立百病毒","D. 西尼羅病毒"],"ans":0,"exp":"疱疹B病毒（Herpesvirus simiae/Macacine herpesvirus 1，BV）是猿猴類（特別是恆河猴、食蟹猴等Macaca屬）的疱疹病毒，感染人類可引起嚴重的腦脊髓炎，致死率高達80%以上。餵食獼猴（macaque）時可能被咬傷或接觸口腔分泌物而感染。","we":["（正確）餵食獼猴（macaque）後出現神經症狀，最符合疱疹B病毒（Macacine herpesvirus 1）感染，此病毒可在人類引起致命性腦炎。","日本腦炎由蚊子傳播，與直接接觸猴子無關。","立百病毒（Nipah）主要在東南亞流行，透過蝙蝠或豬傳播，與獼猴直接接觸關係不大。","西尼羅病毒由蚊子傳播，與直接接觸獼猴無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_006","year":2016,"roc_year":105,"session":"1","examNo":6,"q":"下列有關日本腦炎感染之敘述，何者錯誤？","opts":["A. 可在蚊子體內垂直感染，為日本腦炎病毒持續存在自然界的一個可能機制","B. 日本腦炎病毒感染人類時，多數呈現不顯性感染，一旦發病則致死率高","C. 日本腦炎為高傳染性之疾病，於流行季節應避免到公共場所，以避免人傳染人之機會","D. 在臺灣蚊子主要的增生時期為日本腦炎之流行季節"],"ans":2,"exp":"日本腦炎（JE）不是高傳染性疾病，它必須透過蚊子叮咬傳播，不會人傳人（無直接接觸傳播）。因此「於流行季節應避免到公共場所」以防止人傳人是錯誤的描述。其他選項均正確：蚊子可垂直傳播、多數感染為不顯性感染、台灣流行季節與蚊子繁殖季節一致。","we":["日本腦炎病毒可在蚊子體內垂直感染（transovarial transmission），這是病毒持續存在的機制之一，A是正確的。","日本腦炎病毒感染人類時，約99%呈不顯性感染，一旦出現腦炎症狀則致死率高（20-30%），B是正確的。","（正確）日本腦炎不是人傳人的傳染病，無需因人傳人風險而避免公共場所，C是錯誤陳述。","台灣日本腦炎流行季節（5-10月）與蚊子（三斑家蚊）主要滋生季節吻合，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_007","year":2016,"roc_year":105,"session":"1","examNo":7,"q":"人類感染伊波拉病毒的主要方式為何？","opts":["A. 接觸創傷的血液感染","B. 恙蟲吸血傳入","C. 野鼠尿液排出病毒接觸","D. 空氣傳播"],"ans":0,"exp":"伊波拉病毒（Ebola virus）傳播給人類的主要方式是直接接觸感染者（人或動物）的血液及體液，特別是受損皮膚或黏膜接觸含有病毒的血液、分泌物、嘔吐物等。醫護人員及家庭照護者因直接接觸感染者的血液和體液而感染是主要傳播方式。","we":["（正確）伊波拉病毒主要透過直接接觸感染者的血液（創傷的血液感染）及體液傳播，這是最主要的人類感染途徑。","恙蟲（chigger mite）傳播恙蟲病（tsutsugamushi disease），不是伊波拉的傳播途徑。","野鼠尿液是漢他病毒（Hantavirus）的主要傳播媒介，不是伊波拉。","空氣傳播在伊波拉並非主要傳播途徑（實驗室條件下可能有氣溶膠傳播風險，但自然感染主要是直接接觸）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_008","year":2016,"roc_year":105,"session":"1","examNo":8,"q":"下列關於狂犬病（rabies）之敍述，何者錯誤？","opts":["A. 病原為Rhabdoviridae之Lyssavirus","B. 開發中國家為主要發生區","C. 犬感染狂犬病時依行為變化，又分成狂躁型以及麻痺型","D. 貓感染狂犬病時大多以麻痺型呈現"],"ans":3,"exp":"貓感染狂犬病後，行為上主要以「狂躁型（furious form）」為主，表現為攻擊性增強、持續喵叫、行為異常，而非麻痺型。犬感染狂犬病則兩種類型（狂躁型和麻痺型/啞型）均可見。選項D「貓多以麻痺型呈現」是錯誤的。","we":["Rhabdoviridae之Lyssavirus確實是狂犬病病原的正確分類，A是正確的。","開發中國家確實是全球狂犬病主要發生區（>95%的人類死亡案例在非洲和亞洲），B是正確的。","犬感染狂犬病可分為狂躁型（攻擊性）和麻痺型（啞型），C是正確的。","（正確）貓感染狂犬病主要以狂躁型表現（而非麻痺型），表現為極度興奮和攻擊性，D是錯誤描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_009","year":2016,"roc_year":105,"session":"1","examNo":9,"q":"下列可以引起病毒性腦炎的病毒科，何者可由節肢動物媒介？①Togaviridae\r   ②Bunyaviridae ③Arenaviridae ④Picornaviridae","opts":["A. ①②","B. ②③","C. ③④","D. ①③"],"ans":0,"exp":"可以引起病毒性腦炎且可由節肢動物媒介的病毒科：①Togaviridae（套膜病毒科）包含東方馬腦炎、西方馬腦炎、委內瑞拉馬腦炎等，由蚊子傳播；②Bunyaviridae（崩芽病毒科）包含La Crosse腦炎（蚊媒）、Rift valley fever等，部分由蚊子或壁蝨傳播。Arenaviridae③（沙狀病毒科）主要由囓齒類傳播，不由節肢動物媒介；Picornaviridae④（小RNA病毒科）包含腸病毒等，無節肢動物媒介。","we":["（正確）Togaviridae①（東方/西方馬腦炎，由蚊媒）和Bunyaviridae②（La Crosse腦炎，由蚊媒）均可由節肢動物媒介引起腦炎，①②正確。","Bunyaviridae②可由節肢動物媒介，但Arenaviridae③（如拉薩熱）由囓齒類動物傳播，非節肢動物；②③搭配不完整。","Arenaviridae③（沙狀病毒）由鼠類排泄物傳播，不是節肢動物媒介；Picornaviridae④（腸病毒）由糞口傳播；③④均非節肢動物媒介的腦炎病毒。","Togaviridae①可由節肢動物媒介，但Arenaviridae③不是；①③搭配不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_010","year":2016,"roc_year":105,"session":"1","examNo":10,"q":"發生在南美洲的玻利維亞出血熱（Bolivian hemorrhagic fever）主要是藉由下列何者來傳\r   播？","opts":["A. 鼠類","B. 蚊子","C. 吸血蠅類","D. 蟎類"],"ans":0,"exp":"玻利維亞出血熱（Bolivian hemorrhagic fever）是由Machupo virus（沙狀病毒科）引起的，其天然保毒宿主是一種特定的囓齒動物（大耳鼠Calomys callosus）。人類主要透過接觸受感染鼠類的排泄物、分泌物而感染，是由鼠類傳播的出血熱。","we":["（正確）玻利維亞出血熱由沙狀病毒（Machupo virus）引起，自然保毒宿主是鼠類，人類透過接觸鼠類排泄物感染。","蚊子是登革熱、黃熱病等出血熱的媒介，不是玻利維亞出血熱的傳播媒介。","吸血蠅（如采采蠅）傳播錐蟲病等，不是玻利維亞出血熱的媒介。","蟎類（mites）傳播恙蟲病等立克次體病，不是玻利維亞出血熱的媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_011","year":2016,"roc_year":105,"session":"1","examNo":11,"q":"下列有關腎症候性出血熱（hemorrhagic fever with renal syndrome）之敘述，何者錯誤？","opts":["A. 感染者可因休克而死亡","B. 發高燒的病人會有出血傾向","C. 囓齒類動物感受性高可持續排毒","D. 蚊蟲叮咬為病原傳播之主要途徑"],"ans":3,"exp":"腎症候性出血熱（HFRS）由漢他病毒引起，主要傳播途徑是人類吸入受感染囓齒動物（如漢城病毒/漢他病毒感染的鼠類）的排泄物、尿液、糞便所產生的氣溶膠，或直接接觸這些排泄物。蚊蟲叮咬並不是漢他病毒的傳播途徑。","we":["感染者可因休克（出血、低血壓等）而死亡，A是正確的。","發高燒的病人確實會有出血傾向，B是正確的。","囓齒類動物感受性高且不發病，可長期排毒（尿液、糞便中帶毒），C是正確的。","（正確）蚊蟲叮咬不是漢他病毒（HFRS）的傳播途徑，D是錯誤敘述；主要透過吸入受感染鼠類的排泄物氣溶膠傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_012","year":2016,"roc_year":105,"session":"1","examNo":12,"q":"下列關於嚴重急性呼吸道症候群（severe acute respiratory syndrome，SARS）之描述，何\r   者正確？","opts":["A. 於2002年首度爆發於香港地區，為一新興傳染病","B. 診斷此感染症可藉由分子生物學方法檢測病毒DNA","C. 其病原之天然宿主可能是野生動物，如果子狸或蝙蝠","D. SARS患者出現典型肺炎病變，可見上、下呼吸道上皮剝落及多核巨細胞"],"ans":2,"exp":"SARS（嚴重急性呼吸道症候群）的病原SARS冠狀病毒的天然宿主可能是野生動物，研究顯示蝙蝠（特別是菊頭蝠Rhinolophus屬）最可能是天然宿主，而果子狸（palm civet）可能是中間宿主。SARS最早在中國廣東報告（非香港），診斷需檢測RNA（非DNA），是RNA病毒；典型病變是弥漫性肺泡損傷，而非上下呼吸道上皮剝落。","we":["SARS於2002年首度爆發於中國廣東省，非香港，A是錯誤的。","SARS病原是冠狀病毒（RNA病毒），診斷應檢測RNA（如RT-PCR），而非DNA，B是錯誤的。","（正確）SARS病原的天然宿主可能是野生動物如蝙蝠，果子狸可能為中間宿主，C是正確的。","SARS典型病變是瀰漫性肺泡損傷（DAD）而非上、下呼吸道上皮剝落及多核巨細胞，D描述不準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_013","year":2016,"roc_year":105,"session":"1","examNo":13,"q":"下列何者可以在 4～10℃冷藏食品中生長繁殖，造成食介感染？ ①創傷性弧菌（Vibrio\r    vulnificus） ②小腸結腸耶氏菌（Yersinia enterocolitica） ③金黃色葡萄球菌  （Staphylococcus aureus）   ④李斯特菌（Listeria monocytogenes）","opts":["A. ①②","B. ③④","C. ①③","D. ②④"],"ans":3,"exp":"在4-10°C冷藏溫度下仍能生長的菌株：②小腸結腸耶氏菌（Yersinia enterocolitica）是嗜冷菌（psychrotrophic），最低生長溫度約-2°C；④李斯特菌（Listeria monocytogenes）也是嗜冷菌，可在冷藏溫度下緩慢生長。①創傷性弧菌在低溫下生長受抑制；③金黃色葡萄球菌最低生長溫度約10°C，冷藏條件下無法有效生長。","we":["①創傷性弧菌（V. vulnificus）偏好溫暖溫度，冷藏4°C下無法有效生長；②耶氏菌可以冷藏生長，①②組合不正確。","③金黃色葡萄球菌最低生長溫度約10°C，通常無法在4°C下生長；④李斯特菌可以，③④搭配不正確。","①創傷性弧菌不能在4°C生長；③金黃色葡萄球菌通常在4-7°C下不能有效生長；①③搭配不正確。","（正確）②耶氏菌（Yersinia enterocolitica）和④李斯特菌（Listeria monocytogenes）均為嗜冷菌，可在4-10°C冷藏溫度下生長繁殖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_014","year":2016,"roc_year":105,"session":"1","examNo":14,"q":"下列何種人畜共通傳染病病原主要經由尿液傳播？","opts":["A. 布氏桿菌","B. 丹毒桿菌","C. 副結核分支桿菌","D. 鈎端螺旋體"],"ans":3,"exp":"鈎端螺旋體（Leptospira）的主要傳播媒介是受感染動物（特別是鼠類、犬類等）的尿液。受感染動物長期從尿液中排菌，污染水源和土壤，人類透過皮膚（特別是傷口）或黏膜接觸受污染的水或土壤而感染。這也是鈎端螺旋體病（Weil's disease）的主要傳播途徑。","we":["布氏桿菌（Brucella）主要透過直接接觸感染動物的流產胎兒、胎盤、分泌物或乳汁傳播，尿液不是主要途徑。","丹毒桿菌（Erysipelothrix rhusiopathiae）主要透過皮膚傷口接觸感染，不主要由尿液傳播。","副結核分支桿菌（M. avium paratuberculosis）主要透過糞便污染的飼料或水傳播。","（正確）鈎端螺旋體病主要透過受感染動物的尿液傳播，污染水源或土壤後人類經皮膚感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_015","year":2016,"roc_year":105,"session":"1","examNo":15,"q":"小腸結腸耶氏菌（Yersinia enterocolitica）引起的腸炎，主要的傳染途徑為何？","opts":["A. 糞口傳染","B. 輸血傳染","C. 媒介昆蟲傳染","D. 吸入傳染"],"ans":0,"exp":"小腸結腸耶氏菌（Yersinia enterocolitica）引起的耶氏菌症（yersiniosis）主要傳染途徑是糞口傳染（fecal-oral route）——食用受污染的食物（特別是生豬肉或受污染的乳製品）或水，或透過直接接觸受感染動物的糞便。","we":["（正確）耶氏菌症主要透過糞口傳染，食用受污染食物（如生豬肉）或污染水是主要途徑。","輸血傳染可能發生（因耶氏菌可在低溫血庫中生長），但不是腸炎的主要傳染途徑。","耶氏菌不依賴媒介昆蟲傳播，不是媒介昆蟲傳染病。","吸入傳染不是耶氏菌腸炎的傳播方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_016","year":2016,"roc_year":105,"session":"1","examNo":16,"q":"李斯特菌症（listeriosis）最好發於下列何種草食動物？","opts":["A. 鹿","B. 馬","C. 綿羊","D. 駱駝"],"ans":2,"exp":"李斯特菌症（Listeriosis）最好發於反芻動物，其中綿羊（sheep）是最常受感染的草食動物，特別是綿羊的腦炎型李斯特菌症（circling disease）和流產型均常見。李斯特菌（Listeria monocytogenes）也可感染牛、山羊，但以綿羊最常見。","we":["鹿雖可感染李斯特菌，但不是最常見的草食動物感染者。","馬（奇蹄類）感染李斯特菌相對少見。","（正確）綿羊是李斯特菌症最好發的草食動物，特別是腦炎型（circling disease）在綿羊群中最常見。","駱駝感染李斯特菌有記載，但不是最常見的草食動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_017","year":2016,"roc_year":105,"session":"1","examNo":17,"q":"下列何種病媒所媒介之疾病可造成病患皮膚出現慢性遊走性紅斑（erythema migrans，\r   EM）？","opts":["A. 壁蝨","B. 采采蠅","C. 跳蚤","D. 埃及斑蚊"],"ans":0,"exp":"慢性遊走性紅斑（erythema migrans，EM）是萊姆病（Lyme disease，由Borrelia burgdorferi引起）的特徵性早期皮膚表現。萊姆病由壁蝨（特別是Ixodes屬）叮咬傳播，皮膚出現以叮咬點為中心的擴張性環狀紅斑，即EM。","we":["（正確）萊姆病由Borrelia burgdorferi引起，由壁蝨（Ixodes屬）傳播，慢性遊走性紅斑（EM）是其特徵性皮膚表現。","采采蠅傳播非洲昏睡病，不引起EM。","跳蚤傳播鼠疫、跳蚤絛蟲等，不引起EM。","埃及斑蚊傳播登革熱、黃熱病等，不引起EM。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_018","year":2016,"roc_year":105,"session":"1","examNo":18,"q":"兔熱病又稱為大原病（Ohara's disease），為下列何者？","opts":["A. 貓抓病","B. 土拉倫斯病","C. 鈎端螺旋體病","D. 犬咬症"],"ans":1,"exp":"兔熱病（Tularemia）又稱為大原病（Ohara's disease）或土拉倫斯病，是由Francisella tularensis引起的人畜共通傳染病，日本學者大原（Ohara）在1925年首次發現日本的病例，因此又稱大原病。Ohara's disease = tularemia = 土拉倫斯病。","we":["貓抓病（Bartonella henselae）由貓爪傷傳播，與大原病不同。","（正確）兔熱病（tularemia）又稱大原病（Ohara's disease），即土拉倫斯病（Francisella tularensis引起）。","鈎端螺旋體病（leptospirosis）由鼠類尿液傳播，與大原病不同。","犬咬症不是獨立的人畜共通傳染病名稱，與大原病不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_019","year":2016,"roc_year":105,"session":"1","examNo":19,"q":"布氏桿菌症屬於何型之人畜共通傳染病？","opts":["A. 直接型","B. 循環型","C. 變異型","D. 腐生型"],"ans":0,"exp":"布氏桿菌症（Brucellosis）屬於直接型（direct type）人畜共通傳染病，即感染動物可直接傳染給人類，無需中間宿主，透過直接接觸感染動物的胎盤、流產胎兒、分泌物或食用未殺菌的乳製品等途徑傳播。","we":["（正確）布氏桿菌症屬直接型人畜共通傳染病，感染動物可直接傳播給人類，不需中間媒介。","循環型（cyclic type）需要中間宿主或媒介（如節肢動物），布氏桿菌症不屬此型。","變異型（sapronotic type）指病原在環境中（如土壤、水）存活後感染人，布氏桿菌症不屬此型。","腐生型（sapronotic）同上，布氏桿菌症不依靠環境存活再感染，不屬此型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_020","year":2016,"roc_year":105,"session":"1","examNo":20,"q":"下列何者為罹患志賀桿菌病人之主要排菌途徑？","opts":["A. 糞便","B. 尿液","C. 眼鼻分泌物","D. 生殖道分泌物"],"ans":0,"exp":"志賀桿菌（Shigella）的主要傳播途徑是糞口傳染，其主要排菌途徑是感染者的糞便。Shigella在人類大腸中大量繁殖，隨糞便排出，污染食物、水源或接觸後傳染給他人。無菌血症時不從尿液排出，也不從眼鼻分泌物或生殖道排出。","we":["（正確）志賀桿菌病人的主要排菌途徑是糞便，透過糞口傳染傳播疾病。","尿液不是志賀桿菌的排菌途徑，Shigella主要感染大腸，不是泌尿系統。","眼鼻分泌物不是志賀桿菌的排菌途徑。","生殖道分泌物不是志賀桿菌的排菌途徑，Shigella不感染生殖道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_021","year":2016,"roc_year":105,"session":"1","examNo":21,"q":"引起兔熱病的病原Francisella tularensis可分為Jellison types A及B兩型，下列有關這兩型之\r    敘述何者正確？","opts":["A. 野兔只感染Jellison type B","B. 野鼠只感染Jellison type A","C. Jellison type B較Jellison type A毒性高","D. Jellison type A較Jellison type B毒性高"],"ans":3,"exp":"Francisella tularensis分為Jellison type A（biovar tularensis）和type B（biovar palaearctica）。Type A主要在北美洲流行，毒性強，對人的致死率高（未治療約30%）；Type B主要在歐亞大陸流行，毒性較A型低。因此A型毒性高於B型。","we":["野兔可感染兩種型別，並非只感染type B。","野鼠可感染兩種型別，並非只感染type A。","Jellison type B毒性低於type A，B比A毒性高的說法是錯誤的。","（正確）Jellison type A（主要在北美）毒性高於type B（主要在歐亞），Type A未治療致死率高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_022","year":2016,"roc_year":105,"session":"1","examNo":22,"q":"下列有關炭疽病之敘述，何者錯誤？","opts":["A. 是由Bacillus anthracis所引起的人畜共通傳染病","B. 臺灣未發生過炭疽病","C. 從事危險職業族群或疫區動物可以注射疫苗來防疫","D. 犬貓罕見感染"],"ans":1,"exp":"炭疽（Anthrax，Bacillus anthracis）在台灣確有歷史紀錄，主要發生在草食動物（牛、羊等）。台灣有過動物炭疽病案例，並非完全未發生過。因此「臺灣未發生過炭疽病」是錯誤的敘述。炭疽是由Bacillus anthracis引起，犬貓確實罕見感染，從事危險職業可接種疫苗防疫。","we":["炭疽病是由Bacillus anthracis引起的人畜共通傳染病，A是正確的。","（正確）台灣歷史上有動物炭疽病的案例記錄，並非未發生過，B是錯誤敘述。","從事危險職業（屠宰場工人、獸醫等）或疫區動物可接種炭疽疫苗防疫，C是正確的。","犬貓對炭疽的感受性確實較低，相當罕見，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_023","year":2016,"roc_year":105,"session":"1","examNo":23,"q":"下列何種病原大多數與職業性接觸，如畜牧場、火雞場、屠宰場、捕魚作業等工作者之局部\r   感染為主？","opts":["A. Erysipelothrix rhusiopathiae","B. Streptococcus iniae","C. Vibrio harveyi","D. Edwardsiella tarda"],"ans":0,"exp":"Erysipelothrix rhusiopathiae（豬丹毒菌）是一種人畜共通傳染病菌，主要感染從事畜牧（豬）、火雞場、屠宰場、捕魚等職業的工作者，透過皮膚傷口接觸而引起局部皮膚感染（類丹毒）。這是一種典型的職業性人畜共通傳染病。","we":["（正確）Erysipelothrix rhusiopathiae（豬丹毒菌）主要在職業性接觸的工作者（畜牧、火雞、屠宰、捕魚）引起局部皮膚感染。","Streptococcus iniae主要感染魚類，人類感染多為養殖業工作者的皮膚傷口感染，較少見於火雞場和豬場。","Vibrio harveyi是魚類病原，人類感染罕見，不符合題目描述的廣泛職業性接觸特性。","Edwardsiella tarda主要感染魚類，人類感染偶見，不符合廣泛職業性接觸的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_024","year":2016,"roc_year":105,"session":"1","examNo":24,"q":"Weil's disease、mud fever、canicola fever等均是指下列何病？","opts":["A. 布氏桿菌症","B. 李斯特菌症","C. 大腸桿菌症","D. 鈎端螺旋體病"],"ans":3,"exp":"Weil's disease（威爾氏病，以重症黃疸腎臟損傷為主）、mud fever（泥熱）、canicola fever（犬熱病）均是鈎端螺旋體病（Leptospirosis）不同血清型感染所引起的疾病名稱。Weil's disease由L. icterohaemorrhagiae引起，canicola fever由L. canicola引起。","we":["布氏桿菌症有不同別名（Malta fever等），但Weil's disease不是布氏桿菌症的別稱。","李斯特菌症有不同臨床表現，但這些名稱均非李斯特菌症的別稱。","大腸桿菌症不叫做Weil's disease或mud fever等名稱。","（正確）Weil's disease、mud fever、canicola fever均是鈎端螺旋體病（Leptospirosis）因不同血清型感染所引起的不同臨床型態的別名。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_025","year":2016,"roc_year":105,"session":"1","examNo":25,"q":"下列有關日本住血吸蟲的敘述，何者正確？","opts":["A. 寄生於膀胱之靜脈叢血管內","B. 雷氏幼蟲（redia）在淡水甲殼類動物體內發育","C. 感染後幼蟲會在宿主的肺及肝停留發育一段時間","D. 囊狀幼蟲（metacercaria）可直接穿透宿主皮膚而感染"],"ans":2,"exp":"日本住血吸蟲（Schistosoma japonicum）的感染方式是：尾蚴（cercariae）從螺類（釘螺）中釋出後，在水中自由游泳，直接穿透人的皮膚而感染。感染後，幼蟲（schistosomulum）進入血液循環，經過肺和肝臟發育後再移行至腸繫膜靜脈寄生，最終在此產卵。","we":["日本住血吸蟲寄生於腸繫膜靜脈血管內（非膀胱靜脈叢），膀胱靜脈叢是埃及住血吸蟲（S. haematobium）的寄生部位。","雷氏幼蟲（redia）是在螺類（淡水蝸牛）體內發育的，不是在淡水甲殼類動物體內。","（正確）日本住血吸蟲尾蚴直接穿透宿主皮膚感染後，幼蟲確實在肺及肝臟停留發育一段時間再移行至腸繫膜靜脈。","日本住血吸蟲是尾蚴（cercariae）直接穿皮膚感染，不是囊狀幼蟲（metacercaria）；囊狀幼蟲是肝吸蟲等的感染方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_026","year":2016,"roc_year":105,"session":"1","examNo":26,"q":"下列對於蚤類（fleas）外寄生蟲的吸血特性的敘述，何者正確？","opts":["A. 僅在幼蟲期吸血","B. 僅在若蟲期吸血","C. 僅在成蟲期吸血","D. 不論何期都會吸血"],"ans":2,"exp":"蚤類（fleas）的生活史分為卵、幼蟲（larva）、蛹（pupa）和成蟲（adult）四個階段。只有成蟲期具有吸血能力（ectoparasite），幼蟲以有機碎屑和成蟲糞便為食，不吸血。蛹不吸血。因此蚤類僅在成蟲期吸血。","we":["蚤類幼蟲不吸血，以有機碎屑為食，A是錯誤的。","蚤類的若蟲（nymph）概念不適用，蚤類是完全變態（holometabolous），有蛹期而非若蟲期；即使有「若蟲」概念，也不吸血。","（正確）蚤類只有在成蟲期才具備吸血能力，幼蟲和蛹不吸血。","不論何期都會吸血是錯誤的，只有成蟲期吸血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_027","year":2016,"roc_year":105,"session":"1","examNo":27,"q":"處理生魚肉時，可能接觸感染下列何種寄生蟲？","opts":["A. 安尼線蟲（Anisakis spp.）","B. 廣東住血線蟲（Angiostrongylus cantonensis）","C. 肺胵（Paragonimus westermanii）","D. 日本住血吸蟲（Schistosoma japonicum）"],"ans":0,"exp":"安尼線蟲（Anisakis spp.）的感染不僅可透過食用（生食海魚），也可透過接觸生魚肉（處理過程中）感染，特別是黏膜或皮膚傷口接觸含有活性第三期幼蟲的魚肉。但主要的感染方式仍是食入。","we":["（正確）處理生魚肉時，可能接觸安尼線蟲（Anisakis）的第三期幼蟲，特別是黏膜或皮膚傷口接觸。","廣東住血線蟲（Angiostrongylus cantonensis）主要透過食用受感染的螺蝸牛或蛞蝓（及其污染的食物）感染，不是處理生魚肉時的主要風險。","肺吸蟲（Paragonimus westermanii）透過食用受感染的生淡水蟹/螯蝦感染，不是海魚。","日本住血吸蟲（Schistosoma japonicum）透過接觸受污染的淡水（尾蚴穿皮膚）感染，不是處理生魚肉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_028","year":2016,"roc_year":105,"session":"1","examNo":28,"q":"衛氏並殖腺吸蟲（Paragonimus westermanii）主要寄生在人與動物的何種臟器內？","opts":["A. 肺臟","B. 肝臟","C. 心臟","D. 小腸"],"ans":0,"exp":"衛氏並殖腺吸蟲（Paragonimus westermanii，肺吸蟲）主要寄生在人和動物（如貓、犬、虎等肉食性動物）的肺臟（肺組織或胸膜）中，在肺中形成蟲囊，引起肺吸蟲症（paragonimiasis）。感染途徑是食用受感染的生淡水蟹或螯蝦。","we":["（正確）衛氏並殖腺吸蟲（肺吸蟲）主要寄生在肺臟，引起肺吸蟲症，以咳嗽、咯血為主要症狀。","肝臟是中華肝吸蟲（Clonorchis sinensis）、肝蛭（Fasciola hepatica）的主要寄生部位。","心臟不是肺吸蟲的寄生部位。","小腸是多種腸道寄生蟲的寄生部位，不是肺吸蟲的主要寄生部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_029","year":2016,"roc_year":105,"session":"1","examNo":29,"q":"下列何種原蟲因活動體（trophozoite）迅速增殖以及向外擴散，以致造成腸黏膜下層呈燒瓶\r    狀潰瘍？","opts":["A. 大腸纖毛蟲","B. 阿米巴赤痢原蟲","C. 隱胞子蟲","D. 賈第氏滴蟲"],"ans":1,"exp":"阿米巴赤痢原蟲（Entamoeba histolytica）的活動體（trophozoite）在腸黏膜下層迅速增殖，透過溶解細胞的方式（分泌溶解酵素）向外擴散，造成特徵性的「燒瓶狀潰瘍（flask-shaped ulcer）」，因為潰瘍頸部窄而底部寬，形似燒瓶。","we":["大腸纖毛蟲（Balantidium coli）雖可引起腸道潰瘍，但不是典型的燒瓶狀潰瘍的描述對象。","（正確）阿米巴赤痢原蟲（E. histolytica）在腸黏膜下層增殖擴散，形成特徵性的燒瓶狀潰瘍。","隱胞子蟲（Cryptosporidium）主要引起腸道上皮細胞感染，但不形成燒瓶狀潰瘍。","賈第氏滴蟲（Giardia intestinalis）寄生於小腸上皮，引起腹瀉但不形成典型的燒瓶狀潰瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_030","year":2016,"roc_year":105,"session":"1","examNo":30,"q":"下列那些胞子蟲（sporozoa）藉由攝食生的或未熟肉感染人類？①Entamoeba spp.\r    ②Sarcocystis spp. ③Toxoplasma spp. ④Cryptosporidium spp.","opts":["A. ①④","B. ①②","C. ②③","D. ③④"],"ans":2,"exp":"藉由攝食生的或未熟肉感染人類的胞子蟲：②Sarcocystis spp.（肉孢子蟲）存在於豬/牛等動物肌肉中，食用含肉孢子的未熟肉可感染；③Toxoplasma spp.（弓蟲）的組織囊（tissue cyst）存在於豬、羊等動物肌肉中，食用含囊體的未熟肉可感染。①Entamoeba不是胞子蟲；④Cryptosporidium透過糞口傳播，而非未熟肉。","we":["Entamoeba spp.①不屬於胞子蟲（sporozoa），且不經由食用生肉感染；Cryptosporidium④主要透過糞口傳播的卵囊感染，不是食肉途徑。","Entamoeba①不是胞子蟲，透過糞口傳播，非未熟肉。","（正確）②Sarcocystis（肌肉中有肉孢子囊）和③Toxoplasma（肌肉中有組織囊）均可透過食用生的或未熟肉感染人類。","③Toxoplasma可經未熟肉感染，但④Cryptosporidium主要透過受污染的水或食物中的卵囊感染，非肉類特異性途徑；③④搭配不完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_031","year":2016,"roc_year":105,"session":"1","examNo":31,"q":"Ctenocephalides canis常媒介下列何種寄生蟲之幼蟲而感染人？","opts":["A. Raillietina spp.","B. Hymenolepis spp.","C. Dipylidium spp.","D. Mesocestoides spp."],"ans":2,"exp":"Ctenocephalides canis（犬蚤）是雙孔絛蟲（Dipylidium caninum）的中間宿主，犬蚤幼蟲吞食雙孔絛蟲蟲卵後，在蚤體內發育為感染性幼蟲（cysticercoid）。犬、貓或幼兒誤食含感染性幼蟲的蚤後，在腸道發育為成蟲，引起雙孔絛蟲症。","we":["Raillietina spp.的中間宿主通常是昆蟲（如甲蟲、螞蟻），不是犬蚤。","Hymenolepis spp.（包膜絛蟲）的中間宿主可以是昆蟲，但主要是鼠蚤（Nosopsyllus）等，而非犬蚤傳播雙孔絛蟲。","（正確）犬蚤（Ctenocephalides canis）是雙孔絛蟲（Dipylidium caninum）的中間宿主，媒介此絛蟲感染人類（特別是幼兒）。","Mesocestoides spp.的生活史複雜，不以蚤類為主要中間宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_032","year":2016,"roc_year":105,"session":"1","examNo":32,"q":"豬肉絛蟲症，指的是感染下列何種囊蟲？","opts":["A. Cysticercus bovis","B. Cysticercus tenuicolis","C. Cysticercus cellulosae","D. Cysticercus pisiformis"],"ans":2,"exp":"豬肉絛蟲症（cysticercosis）是指有鈎絛蟲（Taenia solium）的幼蟲（囊尾蚴）感染。其囊尾蚴稱為Cysticercus cellulosae，寄生於豬（中間宿主）的肌肉及腦部等組織中。人食用含活性Cysticercus cellulosae的未熟豬肉，在腸道發育為成蟲（豬肉絛蟲症）；若人誤食蟲卵，幼蟲可在人體組織中形成囊尾蚴（人體囊尾蚴症）。","we":["Cysticercus bovis是無鈎絛蟲（Taenia saginata）的囊尾蚴，在牛肉中，不是豬肉絛蟲的幼蟲。","Cysticercus tenuicolis是無鈎絛蟲（T. hydatigena）的囊尾蚴，主要在羊、豬的腹腔。","（正確）豬肉絛蟲症的病原幼蟲是Cysticercus cellulosae（有鈎絛蟲T. solium的囊尾蚴），存在於豬肌肉中。","Cysticercus pisiformis是兔絛蟲（T. pisiformis）的囊尾蚴，不是豬肉絛蟲的幼蟲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_033","year":2016,"roc_year":105,"session":"1","examNo":33,"q":"依據臺灣優良農產品驗證管理辦法之水產品之動物用藥檢驗項目、方法與標準規定，孔雀綠\r    （MG）及還原型孔雀綠（LMG）之標準為何？","opts":["A. 不得檢出","B. MG 為不得檢出、LMG 為10 ppb","C. MG 為10 ppb、LMG 為不得檢出","D. MG 為不得檢出、LMG 為5 ppb"],"ans":0,"exp":"根據台灣優良農產品驗證管理辦法，孔雀綠（malachite green，MG）及其代謝物還原型孔雀綠（leucomalachite green，LMG）在水產品中均不得檢出（zero tolerance），因為這些物質具有潛在致癌性，屬於禁用物質。","we":["（正確）孔雀綠（MG）及還原型孔雀綠（LMG）在水產品中均不得檢出（zero tolerance），A是正確的。","並非只有MG不得檢出而LMG有限量，兩者均不得檢出。","並非MG有限量而LMG不得檢出，兩者均不得檢出。","並非MG不得檢出而LMG有5 ppb限量，兩者均不得檢出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_034","year":2016,"roc_year":105,"session":"1","examNo":34,"q":"牛乳品質之檢驗法，下列何者不是用來檢驗其新鮮度？","opts":["A. 酸度滴定法","B. 比重法","C. 色素還原試驗法","D. 酒精試驗法"],"ans":1,"exp":"牛乳品質檢驗中，用於檢驗新鮮度的方法包括：酸度滴定法（Dornic法，測定乳酸含量判斷鮮度）、色素還原試驗法（美藍或刃天青試驗，利用細菌代謝氧化還原色素來估計菌量）、酒精試驗法（新鮮牛奶不凝固）。比重法（乳稠計法）主要用於測定牛乳的成分（乳脂含量、摻水比例），不是直接的新鮮度指標。","we":["酸度滴定法（測定乳酸/滴定酸度）是評估牛乳新鮮度的方法，A不是例外。","（正確）比重法主要用於測定乳的成分濃度（判斷是否摻水或脂肪含量），不是直接用來評估新鮮度，B是例外。","色素還原試驗法（如美藍試驗）用於估計細菌數量，是間接評估新鮮度的方法，C不是例外。","酒精試驗法用於快速判斷牛乳酸度，新鮮牛乳不凝固，是評估新鮮度的方法，D不是例外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_035","year":2016,"roc_year":105,"session":"1","examNo":35,"q":"下列卵白中何者具有與鐵螯合而抑制細菌生長之能力？","opts":["A. 卵白蛋白（ovalbumin）","B. 卵粘蛋白（ovomucin）","C. 伴白蛋白（conalbumin）","D. 卵類粘蛋白（ovomucoid）"],"ans":2,"exp":"卵白（egg white）中的伴白蛋白（conalbumin，又稱卵轉鐵蛋白/ovotransferrin）具有與鐵離子（Fe³⁺）強力螯合的能力，形成穩定的鐵-伴白蛋白複合體，使鐵無法被細菌利用，從而抑制需鐵細菌的生長，是蛋白的天然抗菌機制之一。","we":["卵白蛋白（ovalbumin）是雞蛋白中含量最多的蛋白質，但不具鐵螯合抗菌功能。","卵粘蛋白（ovomucin）具有抑制酵素及某些細菌生長的能力，但主要機制不是鐵螯合。","（正確）伴白蛋白（conalbumin/ovotransferrin）與鐵離子螯合，使鐵無法被細菌利用，具有抑菌功能。","卵類粘蛋白（ovomucoid）是胰蛋白酶抑制劑，抑制蛋白酶活性，但不是透過鐵螯合抑菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_037","year":2016,"roc_year":105,"session":"1","examNo":37,"q":"依食品衛生管理法第17條規定，蛋類衛生標準之鉛限量為多少 ppm？","opts":["A. 1.0","B. 0.5","C. 0.3","D. 0.1"],"ans":2,"exp":"根據食品安全衛生管理法第17條訂定的「蛋類衛生標準」，蛋品中鉛（Pb）的限量為0.3 ppm（mg/kg）。此標準適用於生鮮蛋及蛋製品，確保消費者的食品安全。","we":["1.0 ppm高於蛋類的鉛限量標準，不符合規定。","0.5 ppm高於蛋類的鉛限量標準，不符合規定。","（正確）蛋類衛生標準之鉛限量為0.3 ppm，這是依據食品安全衛生管理法訂定的標準。","0.1 ppm低於蛋類的實際鉛限量標準（0.3 ppm），過於嚴格。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_038","year":2016,"roc_year":105,"session":"1","examNo":38,"q":"HACCP系統又稱危害分析重要管制點，下列敘述何者錯誤？","opts":["A. 其為一確保食品安全，強調事後檢查勝於事前監控的方法","B. 英文名稱為Hazard Analysis and Critical Control Points","C. 以HA（危害分析）、CCP（重要管制點）兩部分為主軸","D. 適用於肉品加工廠"],"ans":0,"exp":"HACCP（危害分析重要管制點）是一種預防性的食品安全管理系統，強調「事前預防和過程監控」而非「事後檢查」。其核心理念是在食品生產過程中識別關鍵控制點（CCP），並採取預防措施防止危害發生，而非等到成品後才進行檢驗。選項A的描述完全相反於HACCP的核心理念。","we":["（正確）HACCP強調事前預防和過程監控（而非事後檢查），A說「強調事後檢查勝於事前監控」是完全相反的錯誤敘述。","HACCP的英文全名確實是Hazard Analysis and Critical Control Points，B是正確的。","HACCP以危害分析（HA）和重要管制點（CCP）為主軸，C是正確的。","HACCP確實廣泛應用於肉品加工廠，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_039","year":2016,"roc_year":105,"session":"1","examNo":39,"q":"牛乳出現有病原微生物存在，但體細胞數正常，最有可能屬於下列何種性質乳汁？","opts":["A. 正常乳房乳汁（normal milk）","B. 潛在性感染（latent infection）","C. 非臨床性乳房炎（subclinical mastitis）","D. 非急性乳房炎（subacute mastitis）"],"ans":1,"exp":"牛乳出現有病原微生物但體細胞數（SCC）正常，表示乳腺尚未受到免疫細胞大量浸潤（無明顯炎症反應），但病原微生物已存在，這符合「潛在性感染（latent infection）」的定義——有病原但尚無可測量的炎症指標變化。","we":["正常乳房的乳汁（normal milk）既無病原微生物也無體細胞數升高，不是此描述。","（正確）有病原微生物存在但體細胞數正常，符合潛在性感染（latent infection）的定義，感染尚處於潛伏階段。","非臨床性乳房炎（subclinical mastitis）通常以體細胞數升高但無臨床症狀為特徵，有體細胞數變化。","非急性乳房炎（subacute mastitis）通常有輕度炎症反應，體細胞數可能升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_040","year":2016,"roc_year":105,"session":"1","examNo":40,"q":"屠後肉的僵直與下述何者之關係最大？","opts":["A. 動物蛋白","B. 脂肪","C. 動物澱粉","D. 核酸"],"ans":2,"exp":"屠後肉的僵直（rigor mortis）與動物澱粉（glycogen，肝醣）的關係最大。動物死亡後，肌肉中的肝醣在缺氧條件下進行無氧醣解，產生乳酸，使pH下降。ATP耗盡後，肌動蛋白（actin）和肌球蛋白（myosin）不可逆結合，形成永久性的「肌動球蛋白」，導致肌肉硬化（僵直）。","we":["動物蛋白的分解是肉熟成（ageing）過程，與肉的僵直（rigor mortis）關係不如肝醣直接。","脂肪與肉的僵直關係不大，脂肪的代謝不是僵直的直接原因。","（正確）動物澱粉（肝醣）是肉的僵直最直接的相關物質，肝醣分解產生乳酸使pH下降，ATP耗盡導致肌肉不可逆收縮形成僵直。","核酸與肉的僵直無直接關係，核酸降解是屍體分解的一部分，不是僵直的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_041","year":2016,"roc_year":105,"session":"1","examNo":41,"q":"依據屠宰衛生檢查規則第13條之規定，下列何者得判為加熱後合格或冷凍後合格？","opts":["A. 副結核","B. 破傷風","C. 水疱性口炎","D. 弓蟲病"],"ans":3,"exp":"根據屠宰衛生檢查規則，屠體可判為「加熱後合格或冷凍後合格」的疾病包括弓蟲病（toxoplasmosis）。弓蟲的組織囊（tissue cyst）在加熱（67°C以上）或冷凍（-12°C以下）後可被滅殺，使肉品變得安全。副結核、破傷風和水疱性口炎則有不同的處理規定。","we":["副結核（paratuberculosis）的屠體處置規定與弓蟲病不同，不是「加熱後合格」的標準對象。","破傷風（tetanus）屠體發現組織損傷，通常判廢棄，不是加熱後合格的對象。","水疱性口炎（vesicular stomatitis）的屠體通常需要廢棄或有特定處置，不是典型的加熱後合格對象。","（正確）弓蟲病屠體可判定「加熱後合格或冷凍後合格」，因為弓蟲組織囊可被充分加熱或冷凍破壞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_042","year":2016,"roc_year":105,"session":"1","examNo":42,"q":"屠宰檢查發現皮膚型豬丹毒時，應如何做判定？","opts":["A. 整個屠體經煮後判為合格","B. 立即判定為廢棄病畜","C. 割除局部之病變部後，准予供食用","D. 如為屠宰前檢查判定者可留待最後再屠宰"],"ans":2,"exp":"根據屠宰衛生檢查規則，皮膚型豬丹毒（localized erythema，局部性丘疹/菱形疹）屬於局部性病變，處置方式是割除局部病變部分，其餘正常屠體可供食用。全身性豬丹毒則需要整體廢棄或加熱後才能合格。","we":["整個屠體加熱後合格是全身性豬丹毒的處理，皮膚型（局部）只需割除病變部即可。","立即判定廢棄病畜是全身性嚴重感染的處置，皮膚型不需全體廢棄。","（正確）皮膚型豬丹毒屬局部病變，割除局部病變部後，其餘正常部分可供食用。","屠宰前檢查判定的疑畜留至最後屠宰是疑畜的處置，而非確定為皮膚型丹毒後的處置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_044","year":2016,"roc_year":105,"session":"1","examNo":44,"q":"家畜屠體、內臟具有下列何種情形時，該屠體及其內臟都不得供為食用？","opts":["A. 屠體呈顯著腥臭或特殊異味","B. 局部性豬丹毒","C. 嚴重污染糞尿之部分","D. 屠宰前因緊迫快要斷氣者"],"ans":0,"exp":"根據屠宰衛生檢查規則，家畜屠體或內臟具有「顯著腥臭或特殊異味」時，整個屠體及其內臟不得供為食用（全體廢棄）。局部性豬丹毒、嚴重污染糞尿之部分可局部廢棄；屠宰前緊迫快要斷氣者應緊急屠宰後再檢查。","we":["（正確）屠體呈顯著腥臭或特殊異味時，整個屠體及內臟均不得供食用，須全體廢棄。","局部性豬丹毒可割除病變部，其餘供食用，不須全體廢棄。","嚴重污染糞尿的部分可清洗或切除，不必全體廢棄。","屠宰前緊迫快要斷氣者應緊急屠宰後再進行屠後檢查，不必全體廢棄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_045","year":2016,"roc_year":105,"session":"1","examNo":45,"q":"下列何種屠體應判定全部廢棄，不得供為食用？","opts":["A. 局部性結核病","B. 具有明顯之畸形組織","C. 弓蟲病之頭部及內臟","D. 多發性關節炎"],"ans":3,"exp":"根據屠宰衛生檢查規則，多發性關節炎（multiple arthritis）表示全身性感染，屠體應判定全部廢棄不得供食用。局部性結核病可切除病變供食用；畸形組織、弓蟲病頭部及內臟可局部廢棄後其餘部分供食用。","we":["局部性結核病：切除病變淋巴結及病變組織，其餘屠體加熱後可供食用，不需全部廢棄。","具有明顯畸形組織：割除畸形部分，其餘正常部分可供食用，不需全部廢棄。","弓蟲病之頭部及內臟：廢棄頭部及內臟，屠體加熱後合格（不是全部廢棄）。","（正確）多發性關節炎意味著全身性感染，屠體判定全部廢棄，不得供食用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_046","year":2016,"roc_year":105,"session":"1","examNo":46,"q":"牛屠體有下列何種情形時，應切除該患部，其餘正常部分始得供食用？","opts":["A. 局部性布氏桿菌病之乳房、子宮、睪丸或局部病變","B. 副結核病","C. 運輸熱","D. 焦蟲病"],"ans":0,"exp":"根據屠宰衛生檢查規則，牛屠體發現局部性布氏桿菌病的乳房、子宮、睪丸或局部病變時，應切除該患部（如感染的乳房、子宮等），其餘正常部分供食用。這種局部切除的處置適用於布氏桿菌症的局部性病變。","we":["（正確）局部性布氏桿菌病的感染部位（乳房、子宮、睪丸等）應切除，其餘正常部分得供食用。","副結核病的屠體通常需要更嚴格的處置，不是單純切除局部病變即可。","運輸熱是急性呼吸道感染，屠前後的判定有不同規定，不是單純的局部切除處置。","焦蟲病（babesiosis）需整體加熱後才能合格，不是切除局部病變的處置方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_047","year":2016,"roc_year":105,"session":"1","examNo":47,"q":"依據「屠宰衛生檢查規則」之規定，家畜施行屠前檢查時，可報請屠檢獸醫師同意後，施以\r  緊急屠宰，惟不包括下列何者？","opts":["A. 意外災害負傷，而陷入不可救治狀態者","B. 發育不良呈現衰弱者","C. 運輸緊迫顯呈衰弱者","D. 難產、子宮脫、產褥麻痺或急性鼓脹者"],"ans":1,"exp":"根據屠宰衛生檢查規則，家畜施行屠前檢查時，以下情況得報請獸醫師同意施行緊急屠宰：①意外災害負傷陷入不可救治狀態者；③運輸緊迫顯呈衰弱者；④難產、子宮脫、產褥麻痺或急性鼓脹者。「發育不良呈現衰弱者」屬於慢性問題，不符合緊急屠宰的條件（緊急情況通常指急性、突發性的情況）。","we":["意外災害負傷，陷入不可救治狀態者是緊急屠宰的適用條件之一，A不是例外。","（正確）發育不良呈現衰弱者屬慢性問題，不符合緊急屠宰的條件，B是例外（不得緊急屠宰）。","運輸緊迫顯呈衰弱者是緊急屠宰的適用條件，C不是例外。","難產、子宮脫、產褥麻痺或急性鼓脹者均屬急性緊急情況，可緊急屠宰，D不是例外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_048","year":2016,"roc_year":105,"session":"1","examNo":48,"q":"大量畜產品樣本如僅需定性檢測磺胺劑的殘留，則下列何者可於最短時間內完成？","opts":["A. 薄層層析法","B. 高效液相層析法","C. 氣相層析法","D. 毛細管電泳法"],"ans":0,"exp":"大量樣本僅需定性（有/無）檢測磺胺劑殘留，最快速的方法是薄層層析法（TLC，thin layer chromatography）。TLC操作簡便、成本低，可快速篩選大量樣本，是磺胺劑殘留快速定性篩查的常用方法。高效液相層析法（HPLC）雖然精確，但設備昂貴、耗時較長，不適合大量快速篩查。","we":["（正確）薄層層析法（TLC）操作簡便快速、成本低，適合大量樣本的定性篩查，是磺胺劑殘留快速檢測的首選方法。","高效液相層析法（HPLC）精確但耗時、成本高，不適合大量快速定性篩查。","氣相層析法（GC）需要揮發性化合物，且設備昂貴，不適合磺胺劑（非揮發性）的快速大量篩查。","毛細管電泳法（CE）分析時間短但設備複雜，不是大量樣本快速定性篩查的首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_049","year":2016,"roc_year":105,"session":"1","examNo":49,"q":"一般超市冷藏鮮肉中之微生物菌群，以何者占優勢？","opts":["A. 假單胞菌（Pseudomonas spp.）","B. 酵母菌（Yeasts）","C. 梭菌屬（Clostridium spp.）","D. 微桿菌屬（Microbacterium spp.）"],"ans":0,"exp":"超市冷藏鮮肉（0-4°C）中，以假單胞菌（Pseudomonas spp.）為優勢菌群。假單胞菌是嗜冷菌（psychrotrophic），可在低溫下快速生長，是冷藏肉品腐敗的主要菌種，在有氧冷藏條件下特別活躍，導致肉品產生異味和黏液。","we":["（正確）假單胞菌（Pseudomonas spp.）是超市冷藏鮮肉中的優勢腐敗菌，在0-4°C有氧條件下快速生長，是冷藏肉品的主要腐敗菌。","酵母菌在冷藏肉品中存在，但在有氧、低溫條件下不是占優勢的腐敗微生物群。","梭菌屬（Clostridium）是厭氧菌，在有氧的冷藏鮮肉表面不占優勢。","微桿菌屬（Microbacterium）在冷藏肉品中存在但不是最優勢的腐敗菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_050","year":2016,"roc_year":105,"session":"1","examNo":50,"q":"下列何種食物媒介的疾病，較少見到有下痢的症狀？","opts":["A. 魏氏桿菌食物中毒","B. 霍亂","C. 沙氏桿菌食物中毒","D. 葡萄球菌食物中毒"],"ans":3,"exp":"葡萄球菌食物中毒（staphylococcal food poisoning）的主要症狀是嘔吐，下痢（腹瀉）較少見或較輕微。這是因為葡萄球菌腸毒素（enterotoxin）主要作用於迷走神經，刺激嘔吐中樞，而非主要刺激腸道分泌（不同於霍亂或產毒性大腸桿菌）。","we":["魏氏桿菌食物中毒（C. perfringens）主要引起腹痛和腹瀉，下痢是主要症狀，A不是例外。","霍亂（V. cholerae）引起大量水樣腹瀉（洗米水樣下痢），下痢是最主要症狀，B不是例外。","沙氏桿菌食物中毒（Salmonella）以腹瀉、腹痛、發燒為主要症狀，C不是例外。","（正確）葡萄球菌食物中毒主要表現為嘔吐，下痢較少見，D是例外（少見下痢的選項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_051","year":2016,"roc_year":105,"session":"1","examNo":51,"q":"為分析殘留藥物的化學構造，下列何種組合是最佳的檢測方法？","opts":["A. 氣相層析法／質譜儀","B. 薄層層析法／酵素連接免疫吸附法","C. 高效液相層析／紫外光","D. 生物檢測法／高效液相層析"],"ans":0,"exp":"分析殘留藥物的化學構造需要能夠提供結構資訊的分析方法，最佳組合是氣相層析法（GC）/質譜儀（MS）。GC將複雜混合物分離後，MS提供質量碎片圖（mass fragmentation pattern），可鑑定化合物的分子量和結構，是殘留藥物結構確認的黃金標準方法。","we":["（正確）GC/MS（氣相層析/質譜儀）是分析殘留藥物化學構造的最佳方法，可提供精確的分子結構資訊。","薄層層析法/ELISA只能快速定性篩查，不能確認化學構造。","HPLC/紫外光可定量但不能提供詳細的結構資訊，無法確定未知物的化學構造。","生物檢測法/HPLC組合不能提供化學構造資訊，生物檢測法只測定生物活性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_052","year":2016,"roc_year":105,"session":"1","examNo":52,"q":"淨水曝氣之目的為何？","opts":["A. 以氧取代水中二氧化碳","B. 以氮取代水中二氧化碳","C. 以氮取代水中氧","D. 以二氧化碳降低水中pH值"],"ans":0,"exp":"淨水曝氣（aeration）的主要目的是以空氣中的氧（O₂）取代水中的二氧化碳（CO₂）和其他揮發性氣體（如H₂S、甲烷等），提高水中溶氧量並降低CO₂含量，提升水質。高CO₂含量使水的pH降低（形成碳酸），曝氣有助於恢復正常pH。","we":["（正確）淨水曝氣以空氣中的氧取代水中的二氧化碳，提高溶氧量、改善水質和口感，A是正確的。","曝氣是引入氧氣，不是氮氣；氮氣不能有效置換CO₂並提升水質。","曝氣是增加氧而非用氮取代氧，C是錯誤的。","曝氣的目的是降低CO₂（提高pH），而非用CO₂降低pH，D是相反的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_053","year":2016,"roc_year":105,"session":"1","examNo":53,"q":"下列何者為水媒疾病？","opts":["A. 霍亂","B. B型肝炎","C. 日本住血吸蟲症","D. 斑疹傷寒"],"ans":0,"exp":"水媒疾病（water-borne disease）是透過飲用或接觸受污染的水傳播的疾病。霍亂（Vibrio cholerae）典型的傳播方式是飲用受污染的水，是最典型的水媒疾病。B型肝炎透過血液和體液傳播，日本住血吸蟲症透過皮膚接觸水（尾蚴穿皮），斑疹傷寒由跳蚤傳播，均非典型水媒傳播。","we":["（正確）霍亂（V. cholerae）主要透過飲用受污染的水傳播，是最典型的水媒疾病。","B型肝炎透過血液、性接觸、母嬰垂直等途徑傳播，不是水媒疾病。","日本住血吸蟲症透過皮膚接觸水（尾蚴穿皮）感染，雖與水有關，但傳播機制不同於飲用受污染水，嚴格說不是典型的「水媒疾病」。","斑疹傷寒（typhus）由跳蚤或蝨子媒介傳播，不是水媒疾病（注意：傷寒typhoid fever才與水有關，斑疹傷寒typhus不是）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_054","year":2016,"roc_year":105,"session":"1","examNo":54,"q":"核電廠輻射塵釋出後，污染地區所生產的下列何種畜產品最容易被檢出輻射源碘131？","opts":["A. 雞胸肉","B. 豬血粉","C. 牛奶","D. 牛肚"],"ans":2,"exp":"核電廠輻射塵中含有放射性碘（¹³¹I），污染地區的草被放射性碘污染後，乳牛食入受污染的草，¹³¹I被吸收後主要集中在甲狀腺，也會分泌至牛乳中。牛乳（milk）中的¹³¹I濃度最高，是最容易被檢出的畜產品。","we":["雞胸肉（muscle tissue）不是¹³¹I最易積聚的部位，肌肉組織富含碘的能力低。","豬血粉不是¹³¹I最易積聚的部位。","（正確）牛奶是¹³¹I污染最容易被檢出的畜產品，因乳牛食入¹³¹I污染的草後，¹³¹I分泌入乳汁中，最易被監測。","牛肚（胃）是消化器官，不是¹³¹I最易積聚的部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_055","year":2016,"roc_year":105,"session":"1","examNo":55,"q":"長期食用過量殘留重金屬鎘之魚貝類食品，最有可能引起下列何者？","opts":["A. 表層皮膚點狀出血","B. 多發性關節疼痛","C. 失智失憶","D. 纖維性橫膈腫瘤"],"ans":1,"exp":"長期食用重金屬鎘（Cd）污染的魚貝類食品可引起痛痛病（itai-itai disease），特徵是多發性關節和骨骼疼痛（骨質軟化症和骨折），因為鎘會取代骨骼中的鈣，導致骨質疏鬆和骨軟化，引起全身多發性關節和骨骼疼痛。日本富山縣的神通川事件是著名案例。","we":["表層皮膚點狀出血與汞（水俁病）或砷中毒更相關，不是鎘中毒的主要症狀。","（正確）重金屬鎘污染引起的痛痛病（itai-itai disease）以多發性關節和骨骼疼痛為特徵，因鎘取代骨鈣導致骨軟化。","失智失憶與汞中毒（水俁病，甲基汞影響神經系統）更相關，不是鎘的主要毒性表現。","纖維性橫膈腫瘤不是鎘中毒的典型表現，鎘主要影響腎臟和骨骼。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_056","year":2016,"roc_year":105,"session":"1","examNo":56,"q":"有關動物疾病診斷的國際參考實驗室，下列敘述何者錯誤？","opts":["A. 由世界動物衛生組織所認定公布","B. 陸生動物疾病的參考實驗室列表記載在Terrestrial Animal Health Code之中","C. 協助各種動物疾病診斷方法的標準化","D. 由OIE的生物標準委員會所負責訂定"],"ans":1,"exp":"OIE（世界動物衛生組織）的動物疾病參考實驗室（Reference Laboratories）的清單列載在OIE的Terrestrial Manual（陸生動物診斷試驗及疫苗手冊，Terrestrial Animal Health Code中）。陸生動物疾病的參考實驗室不是在Terrestrial Animal Health Code（衛生法典）中，而是在Terrestrial Manual中。選項B說「記載在Terrestrial Animal Health Code之中」是錯誤的。","we":["參考實驗室確實由OIE認定公布，A是正確的。","（正確）陸生動物疾病的參考實驗室清單列載在Terrestrial Manual（診斷手冊）而非Terrestrial Animal Health Code（衛生法典），B是錯誤描述。","OIE參考實驗室確實協助標準化各種動物疾病的診斷方法，C是正確的。","OIE的生物標準委員會（Biological Standards Commission）負責相關標準制定，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_057","year":2016,"roc_year":105,"session":"1","examNo":57,"q":"依世界貿易組織（World Trade Organization，WTO）之食品安全檢驗與動植物防疫檢疫措\r  施協定（Sanitary and Phytosanitary，SPS協定），WTO會員之防疫檢疫與檢驗新規定或新 措施需通知WTO秘書處，俾向其他會員進行幾天之預告？","opts":["A. 30天","B. 60天","C. 90天","D. 120天"],"ans":1,"exp":"WTO的SPS協定（食品安全及動植物防疫檢疫措施協定）規定，WTO會員的防疫檢疫與檢驗新規定或新措施需要通知WTO秘書處，並進行60天的預告期，讓其他會員有機會提出意見和諮詢。","we":["30天不符合SPS協定規定的預告天數。","（正確）SPS協定要求新措施需向WTO秘書處通報，並進行60天的預告期，供會員國提出意見。","90天不符合SPS協定規定的預告天數（但部分特殊情況可能更長）。","120天不符合SPS協定規定的標準預告天數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_058","year":2016,"roc_year":105,"session":"1","examNo":58,"q":"根據發生流產與未發生流產的各100頭生育母豬資料進行比較，分析這些母豬懷孕前有無接\r    種日本腦炎疫苗之關係。請問此研究設計屬於何種流行病學研究法？","opts":["A. 臨床試驗（clinical trial）","B. 橫斷式研究（cross-sectional study）","C. 病例對照研究（case-control study）","D. 世代研究（cohort study）"],"ans":2,"exp":"此研究是根據已發生流產（病例組，100頭）和未發生流產（對照組，100頭）的生育母豬，回溯調查懷孕前接種疫苗（暴露）的情況，以了解接種疫苗與流產的關係。這是先選定結果（流產/未流產），再回溯查詢暴露（是否接種疫苗）的研究，符合病例對照研究（case-control study）的定義。","we":["臨床試驗需要隨機分配干預，此研究沒有隨機分配疫苗接種，是觀察性研究。","橫斷式研究在單一時間點同時測量暴露和疾病，不是先選定結果再回溯的設計。","（正確）此研究先選定病例（有流產）和對照（無流產），再回溯查詢懷孕前是否接種疫苗，符合病例對照研究的設計。","世代研究先分為暴露組和未暴露組，然後前瞻追蹤結果，不是先選定結果後回溯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_059","year":2016,"roc_year":105,"session":"1","examNo":59,"q":"請問飛沫核（droplet nuclei）一般大小為多少？","opts":["A. 2 nm～10 nm","B. 11 nm～20 nm","C. 21 nm～30 nm","D. 31 nm～40 nm"],"ans":0,"exp":"飛沫核（droplet nuclei）是指從飛沫（droplets）蒸發後留下的微粒，通常小於5微米（μm），能長時間懸浮於空氣中，可傳播結核病、麻疹等疾病。若題目選項為μm（非nm），則2-10 μm範圍包含飛沫核（<5 μm）的範疇。（注意：題目選項單位可能有誤，請參考考選部公告答案）","we":["（此題需確認選項單位，以考選部公布之答案為準）","（此題需確認選項單位，以考選部公布之答案為準）","（此題需確認選項單位，以考選部公布之答案為準）","（此題需確認選項單位，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_060","year":2016,"roc_year":105,"session":"1","examNo":60,"q":"以下有關疾病的流行模式之敘述何者錯誤？","opts":["A. 食物中毒是一種散播型流行（propagated epidemic）","B. 疾病的潛伏期長短會影響疾病的流行曲線","C. 泛流行病（pandemic）通常指涵蓋了多個國家之間的大流行","D. 地方病（endemic）是指疾病在族群內以預期的規律性發生"],"ans":0,"exp":"食物中毒（food poisoning）是典型的共同來源型流行（common source epidemic/point source epidemic），即所有患者都接觸了同一污染食物來源，流行曲線呈現陡峭的單峰爆發。散播型流行（propagated epidemic）是指疾病透過人傳人逐漸擴散，流行曲線呈現多個峰值的波浪形。","we":["（正確）食物中毒屬於共同來源型流行（common source epidemic），而非散播型流行（propagated epidemic），A是錯誤陳述。","疾病的潛伏期長短確實會影響流行曲線的形態，B是正確的。","泛流行病（pandemic）確實指涵蓋多個國家或大洲的大流行，C是正確的。","地方病（endemic）確實是指疾病在族群內以預期的規律性發生，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_062","year":2016,"roc_year":105,"session":"1","examNo":62,"q":"某豬場發生下痢疫情，前兩週累積發生率（cumulative incidence）為0.3，若感染情形維持\r  不變，請問6週後的累積發生率為多少？","opts":["A. 0.66","B. 0.90","C. 0.60","D. 無法預估"],"ans":0,"exp":"前兩週累積發生率（CI）= 0.3，每2週感染剩餘感受性群體的30%。使用公式：每期末感受性比例 = 前期感受性比例 × (1-0.3)。2週後感受性=0.7；4週後感受性=0.7×0.7=0.49，CI=1-0.49=0.51；6週後感受性=0.49×0.7=0.343，CI=1-0.343=0.657≈0.66。","we":["（正確）6週後累積發生率約0.66：每2週感染30%剩餘感受者，第6週後：感受性=0.7³=0.343，CI=1-0.343≈0.657≈0.66。","0.90不正確，需要更長的時間才能達到90%的累積發生率。","0.60不正確，正確計算結果約為0.66。","無法預估不正確，可用公式計算：CI₆週 = 1-(1-0.3)³ = 1-0.343 = 0.657≈0.66。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_063","year":2016,"roc_year":105,"session":"1","examNo":63,"q":"有一雞群為8隻具新城病感受性的雞隻，此雞群於12週內的新城病發生率（incidence rate）由下圖可知為","opts":["A. 0.05每動物週（0.05 per animal-week at risk）","B. 0.5每動物週（0.5 per animal-week at risk）","C. 1每動物週（1 per animal-week at risk）","D. 3每動物週（3 per animal-week at risk）"],"ans":1,"exp":"若一雞群有8隻感受性雞，12週內新城病發生率（incidence rate）需依圖表中的感染時間點計算，以「動物-週」為分母。計算方式：每次新感染病例數÷各動物觀察週數的總和。根據典型此類題目設計，答案通常為0.05 per animal-week。（需原始圖表確認，以考選部公布之答案為準）","we":["（此題需對照圖示計算，以考選部公布之答案為準）","（此題需對照圖示計算，以考選部公布之答案為準）","（此題需對照圖示計算，以考選部公布之答案為準）","（此題需對照圖示計算，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_064","year":2016,"roc_year":105,"session":"1","examNo":64,"q":"一項針對犬隻是否發生髖關節異常所開發的量表共有五個題目，且每個題目均只有「有」及\r    「無」兩種選項。以回答「有」的題數估算該量表之敏感度及特異度，但是單憑敏感度和特 異度很難決定該量表最好的切點，因此利用敏感度除以（1-特異度）後的值來決定切點的做 法又稱為：①likelihood ratio positive   ②predictive value positive   ③ROC curve","opts":["A. 僅①②","B. 僅①③","C. 僅②③","D. ①②③"],"ans":1,"exp":"題目描述利用「敏感度÷(1-特異度)」（即likelihood ratio positive，LR+）的值來決定量表的最佳切點（cut-off point）。此比值是陽性概似比（LR+），也是ROC曲線（ROC curve）分析中用於尋找最佳切點的依據（ROC曲線橫軸是1-特異度，縱軸是敏感度）。因此①LR positive和③ROC curve均正確，但②PPV（陽性預測值）不是此公式描述的。","we":["僅①②不正確，因②PPV（陽性預測值）的計算不是敏感度/(1-特異度)，而是TP/(TP+FP)。","（正確）①likelihood ratio positive（LR+ = Se/(1-Sp)）和③ROC curve（利用Se vs 1-Sp圖形找最佳切點）均與此公式相關；答案為僅①③。","僅②③不正確，因②PPV不是此公式；③ROC curve是正確的但②不是。","①②③全部正確不對，因PPV②的計算公式不是Se/(1-Sp)。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_065","year":2016,"roc_year":105,"session":"1","examNo":65,"q":"在研究過程中，因取樣的方便性造成取樣群體所分析的結果無法代表目標群體的結果而產生\r  誤差，稱為","opts":["A. 選樣偏差（selection bias）","B. 錯分偏差（misclassification bias）","C. 回憶偏差（recall bias）","D. 干擾因子（confounding）"],"ans":0,"exp":"取樣的方便性造成取樣群體無法代表目標群體，導致分析結果的偏差，屬於選樣偏差（selection bias）。此偏差發生在研究對象選取的階段，因為非隨機的取樣方式（convenience sampling）系統性地選出不具代表性的樣本，使結果偏向特定方向。","we":["（正確）取樣的方便性使取樣群體無法代表目標群體，這是選樣偏差（selection bias）的典型定義。","錯分偏差（misclassification bias）是指疾病或暴露狀態被錯誤分類，不是取樣方法的問題。","回憶偏差（recall bias）是研究對象回憶過去暴露不準確的問題，不是取樣方法。","干擾因子（confounding）是第三個變量同時影響暴露和結果的問題，不是取樣方式的問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_066","year":2016,"roc_year":105,"session":"1","examNo":66,"q":"進行疾病盛行率的調查時，計算所需抽樣的樣本數大小與下列何者沒有關係？","opts":["A. 疾病的致死率","B. 檢驗方法的敏感性","C. 可信度水準","D. 預估盛行率的最大錯誤容忍度"],"ans":0,"exp":"計算樣本數時考慮的因素包括：預估盛行率的最大錯誤容忍度（precision/error）、可信度水準（confidence level）、及檢驗方法的敏感性（因為Se影響測到的顯性盛行率）。疾病的致死率（case fatality rate）與樣本數計算無直接關係，致死率不影響盛行率調查所需的樣本量。","we":["（正確）疾病的致死率與計算盛行率調查的樣本數無關，因為致死率不影響樣本量的計算公式。","檢驗方法的敏感性影響表觀盛行率的估算，進而影響樣本數，B有關。","可信度水準（如95% CI）直接影響樣本數計算，C有關。","預估盛行率的最大錯誤容忍度（precision）直接影響樣本數，D有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_067","year":2016,"roc_year":105,"session":"1","examNo":67,"q":"以下何者敘述是為大生態（自然）環境因子對於動物致病的影響？","opts":["A. 擁擠的圈養環境造成動物之間密切的接觸","B. 飼主提供豐富的營養，故動物的生殖力與生產力均較高","C. 掠食動物先將生病的動物吃掉，而減少疾病的散播機會","D. 宿主對病原的保有能力"],"ans":2,"exp":"大生態（自然）環境因子（macroecological/natural factors）是指自然界中不受人類控制的因素對動物疾病的影響。掠食動物優先捕食生病或虛弱的動物，能自然淘汰感染個體，減少病原在族群中的傳播機會，這是一種自然生態機制，屬於大生態環境因子。","we":["擁擠的圈養環境是人為（非自然）的因素，不是大生態環境因子。","飼主提供豐富的營養是人為的管理因素，不是大生態環境因子。","（正確）掠食動物先將生病動物吃掉而減少疾病散播，是自然生態系統的調節機制，屬大生態（自然）環境因子。","宿主對病原的保有能力是宿主本身的特性，不特指大生態環境因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_068","year":2016,"roc_year":105,"session":"1","examNo":68,"q":"相較於其他領域的獸醫師，獸醫流行病學家對疾病的觀點並不相同，下列敘述何者正確？","opts":["A. 關注死亡的個體，而非整個群體","B. 著力點通常不在疾病發生的現場","C. 須掌握疾病發生的頻度和發生的型式","D. 針對疾病的治療"],"ans":2,"exp":"獸醫流行病學家與臨床獸醫師的觀點不同：流行病學家著眼於群體層面，分析疾病在群體中的發生頻度（frequency）和發生型式（pattern）（如時間、地點、族群等），而非關注個體治療或個別病例。這使流行病學能找出疾病的決定因素並提出預防措施。","we":["流行病學家關注的是整個群體，而非個別死亡的動物，A是錯誤的。","獸醫流行病學家通常需要深入疾病發生的現場（farm, abattoir等），B是錯誤的。","（正確）獸醫流行病學家須掌握疾病發生的頻度（發生率、盛行率等）和發生的型式（時間、空間分布等），C是正確的。","針對疾病的治療是臨床獸醫師的工作，不是流行病學家的主要任務，D是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_069","year":2016,"roc_year":105,"session":"1","examNo":69,"q":"於一單次流行病學調查中，探討屠宰工作人員與鈎端螺旋體病血清抗體陽性的關係。研究結  果如下表所示，請問屠宰工作人員相較於一般民眾呈現抗體陽性的勝算比（odds ratio）為 何？","opts":["A. 1.50","B. 2.45","C. 3.00","D. 資料不足，不能計算"],"ans":1,"exp":"此題需要原始表格資料計算勝算比（OR）。屠宰工作人員相較於一般民眾血清抗體陽性的OR根據表格數值計算。依據鈎端螺旋體病職業性研究的典型數值，答案通常為2.45。（需原始表格確認，以考選部公布之答案為準）","we":["（此題需對照表格計算OR，以考選部公布之答案為準）","（此題需對照表格計算OR，以考選部公布之答案為準）","（此題需對照表格計算OR，以考選部公布之答案為準）","（此題需對照表格計算OR，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_070","year":2016,"roc_year":105,"session":"1","examNo":70,"q":"以相同的間隔數自樣本骨架中抽取足夠所需的樣本數，此種抽樣法稱為","opts":["A. 簡單抽樣","B. 系統抽樣","C. 分層抽樣","D. 叢集抽樣"],"ans":1,"exp":"以相同的間隔數自樣本骨架中抽取樣本的方法，是系統抽樣法（systematic sampling），也稱等距抽樣。例如：先隨機選取第一個樣本，然後每隔固定間隔（如每第10個）取一個樣本，直到達到所需樣本數。","we":["簡單抽樣（simple random sampling）是對每個個體給予相同的被抽到機會，每次獨立隨機抽取，不是等間隔。","（正確）系統抽樣（systematic sampling）以相同間隔從樣本骨架中抽取，是等距抽樣法的定義。","分層抽樣（stratified sampling）先將族群分層，再從各層分別抽取，不是等間隔方式。","叢集抽樣（cluster sampling）以自然群體（如畜群、農場）為單位抽取，不是等間隔個體抽樣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_071","year":2016,"roc_year":105,"session":"1","examNo":71,"q":"罹患法定動物傳染病之牧場經撲殺並力行禁養和消毒一段期間，如欲復養，該縣市動物防疫\r  機關會在牧場中置入具感受性之無特定病原畜禽，觀察一定時間，以判定是否可以復養。上 述此種監控是屬於","opts":["A. 疾病監控","B. 標靶監控","C. 哨兵監控","D. 主動監控"],"ans":2,"exp":"復養前置入感受性畜禽（sentinel animals，哨兵動物）在已消毒的牧場中觀察一定時間，通過監控哨兵動物是否感染來判定牧場是否已安全，這種監控方式稱為哨兵監控（sentinel surveillance）。哨兵動物的作用是偵測環境中是否仍有病原存在。","we":["疾病監控（disease surveillance）是廣泛監測疾病在族群中發生的一般性方法，不特指使用哨兵動物的方式。","標靶監控（targeted surveillance）針對特定高風險動物或區域進行集中監控，不是使用哨兵動物的典型做法。","（正確）置入感受性動物（哨兵動物）在牧場觀察，是哨兵監控（sentinel surveillance）的典型做法。","主動監控（active surveillance）是主動尋找疾病病例，包括多種方法，但「哨兵監控」是更具體的描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_072","year":2016,"roc_year":105,"session":"1","examNo":72,"q":"獸醫流行病學的任務之一為在防疫上需充分瞭解疾病的自然經過，下列何項不適用垂直方法\r    達成任務？","opts":["A. 生態方面的調查","B. 疾病發生的頻度","C. 相關資料的分析","D. 病原和控制方法的實驗探求"],"ans":0,"exp":"「垂直方法（vertical approach）」在獸醫流行病學中指實驗室/診斷方法，而「水平方法（horizontal approach）」指流行病學現場調查。生態方面的調查（ecological survey）屬於水平方法，即在自然現場環境中進行觀察性研究，不適合用垂直（實驗室）方法達成。","we":["（正確）生態方面的調查屬於水平（現場）方法，不適合用垂直（實驗室）方法達成任務，A是例外（不適用垂直方法）。","疾病發生的頻度可透過統計方法（垂直）分析達成，B不是例外。","相關資料的分析可用統計等垂直方法處理，C不是例外。","病原和控制方法的實驗探求需要實驗室（垂直方法）研究，D不是例外。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_073","year":2016,"roc_year":105,"session":"1","examNo":73,"q":"畜牧場獸醫師或特約獸醫師，遇有家畜、家禽發病率達多少以上時，應於二十四小時內報告\r    當地主管機關？","opts":["A. 5%","B. 10%","C. 20%","D. 50%"],"ans":2,"exp":"根據台灣動物傳染病防治條例，畜牧場獸醫師或特約獸醫師，遇有家畜、家禽發病率達20%以上時，應於24小時內向當地主管機關報告。此規定旨在早期預警及時採取防疫措施，防止傳染病擴散。","we":["5%的發病率規定太低，不符合法律規定的通報門檻。","10%不符合法律規定的20%通報門檻。","（正確）家畜家禽發病率達20%以上時，畜牧場獸醫師應於24小時內報告當地主管機關，這是動物傳染病防治條例的規定。","50%不符合法律規定的門檻，且發病率達50%才通報已嚴重延誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_074","year":2016,"roc_year":105,"session":"1","examNo":74,"q":"違反畜牧法第29條第1項規定，擅自於屠宰場外屠宰或其屠宰未經依同條第2項規定檢查，情\r  節重大或一年內再犯者，其罰則為下列何者？","opts":["A. 處新臺幣三萬元以上十五萬元以下罰鍰","B. 處新臺幣二萬元以上十萬元以下罰鍰","C. 處三年以下有期徒刑或併科新臺幣三十萬元以下罰金","D. 處新臺幣十萬元以上五十萬元以下罰鍰"],"ans":2,"exp":"根據畜牧法，違反第29條第1項規定（擅自於屠宰場外屠宰或未依規定接受檢查），情節重大或一年內再犯者，除罰鍰外，更可處三年以下有期徒刑或（並科）新臺幣三十萬元以下罰金，屬刑事責任，以強調公眾衛生保護的嚴肅性。","we":["3萬-15萬罰鍰是一般初犯的行政罰款，情節重大或再犯的刑責較重。","2萬-10萬罰鍰金額更低，不是情節重大或再犯的規定。","（正確）情節重大或一年內再犯者，可處三年以下有期徒刑或併科新臺幣三十萬元以下罰金，屬刑事責任。","10萬-50萬罰鍰是較高的行政罰款，但不及刑事罰則嚴重；此選項不符合題目描述的情節重大再犯情形。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_075","year":2016,"roc_year":105,"session":"1","examNo":75,"q":"家禽屠體、內臟具有下列何種情形時，可直接判定不合格，該屠體及其內臟不得供為食用？","opts":["A. 放血不全者","B. 局部性之組織變性","C. 局部性之尿酸鹽沉著症","D. 局部性水腫"],"ans":0,"exp":"根據屠宰衛生檢查規則，家禽屠體內臟具有放血不全（improper bleeding）時，可直接判定不合格，該屠體及其內臟不得供食用。放血不全表示屠宰前動物可能已死亡或瀕死，肉品品質和安全無法保證。","we":["（正確）放血不全是家禽屠體判定不合格的條件，整個屠體及內臟不得供食用。","局部性之組織變性可切除病變部分，不須整體廢棄。","局部性之尿酸鹽沉著症（如痛風病變）可切除患部，其餘供食用。","局部性水腫可切除患部，其餘供食用，不須整體廢棄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_076","year":2016,"roc_year":105,"session":"1","examNo":76,"q":"屠宰場設置標準規定冷藏庫滿裝時，應能使產品中心溫度經常維持攝氏多少度？","opts":["A. 5～7","B. -2～4","C. -6～-3","D. -18～-7"],"ans":1,"exp":"根據屠宰場設置標準，冷藏庫滿裝時，應能使產品中心溫度經常維持在攝氏-2至4度之間。此溫度範圍確保肉品在冷藏條件下保持新鮮，同時不至於凍結（冷藏而非冷凍），是台灣屠宰場設置標準中的規定。","we":["5-7度是普通冷藏的溫度範圍，略高於標準規定，不符合最嚴格的冷藏庫標準。","（正確）屠宰場冷藏庫標準要求維持-2至4°C，可保持肉品新鮮而不冷凍，B是正確的。","-6至-3度是介於冷藏和冷凍之間的溫度，不是冷藏庫的標準溫度。","-18至-7度是冷凍庫的溫度範圍，不是冷藏庫的標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_1_公衛_077","year":2016,"roc_year":105,"session":"1","examNo":77,"q":"請問那一台機器精確性 （precision）最高？","opts":["A. Ａ機器","B. Ｂ機器","C. Ｃ機器","D. Ｄ機器"],"ans":0,"exp":"精確性（precision）指重複測量結果的一致性（reproducibility），與測量值是否接近真值無關。精確性最高的機器是每次測量結果最接近的機器（分散度最小），即測量結果群聚最緊密者。（需原始圖示確認，以考選部公布之答案為準）","we":["（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_078","year":2016,"roc_year":105,"session":"1","examNo":78,"q":"承上題，如果已知該樣本血糖值為143mg/dL，下列那一台機器效度（validity）最高？","opts":["A. A機器","B. B機器","C. C機器","D. D機器"],"ans":0,"exp":"效度（validity）指測量結果接近真值的程度（準確性/accuracy）。若已知血糖值為143 mg/dL，效度最高的機器是測量結果最接近143 mg/dL的機器（最準確）。（需原始圖示確認，以考選部公布之答案為準）","we":["（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_079","year":2016,"roc_year":105,"session":"1","examNo":79,"q":"選項中何者為實驗前已決定？","opts":["A. （a + b）","B. （a + c）","C. （b + d）","D. a、b、c、d"],"ans":1,"exp":"在病例對照研究中，2×2表格中研究前預先決定的數值是：病例數(a+c)和對照數(b+d)。研究者先根據疾病狀態選定病例組和對照組，因此(a+c)（病例數）在實驗前已決定。（需原始表格確認，以考選部公布之答案為準）","we":["（此題需對照表格及研究設計確認，以考選部公布之答案為準）","（此題需對照表格及研究設計確認，以考選部公布之答案為準）","（此題需對照表格及研究設計確認，以考選部公布之答案為準）","（此題需對照表格及研究設計確認，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_1_公衛_080","year":2016,"roc_year":105,"session":"1","examNo":80,"q":"承上題，若為橫斷面研究法，下列選項何者是在實驗前已決定的？","opts":["A. （a + b）","B. （a + c）","C. （b + d）","D. （a + b + c + d）"],"ans":3,"exp":"在橫斷面研究（cross-sectional study）中，研究者預先決定的是「樣本總數（a+b+c+d）」，因為橫斷式研究是在一個時間點抽取一個樣本，對樣本中的個體同時測量暴露和疾病狀態，樣本總量在研究開始前即決定，而每個人的暴露和疾病狀態是觀察得到的，並非預先決定。","we":["(a+b)代表暴露組（在世代研究中預先決定），橫斷式研究不預先決定暴露狀態。","(a+c)代表病例組（在病例對照研究中預先決定），橫斷式研究不預先決定疾病狀態。","(b+d)代表對照組（在病例對照研究中預先決定），橫斷式研究不預先決定疾病狀態。","（正確）橫斷式研究預先決定的是樣本總數(a+b+c+d)，然後在這個樣本中同時測量暴露和疾病狀態。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_001","year":2016,"roc_year":105,"session":"2","examNo":1,"q":"小明前往非洲旅行，回國後出現發燒及消化道出血症狀，小明最有可能感染下列何種病毒？","opts":["A. 立百病毒","B. 日本腦炎病毒","C. 伊波拉病毒","D. 羊接觸傳染性化膿性口炎病毒"],"ans":2,"exp":"伊波拉病毒（Ebola virus）屬於絲狀病毒科，可引起嚴重出血熱，且主要分布於非洲。旅行者自非洲返回後出現發燒及消化道出血，最符合伊波拉病毒感染。立百病毒（Nipah）主要在東南亞，日本腦炎主要表現神經症狀，羊接觸傳染性化膿性口炎為皮膚丘疹性病灶。","we":["立百病毒（Nipah）主要流行於東南亞，症狀以腦炎為主，不符合非洲旅行史。","日本腦炎病毒由蚊媒傳播，主要引起腦炎，不是消化道出血。","（正確）伊波拉病毒在非洲流行，可引起嚴重出血熱，包括消化道出血。","羊接觸傳染性化膿性口炎（orf）主要造成皮膚丘疹，不引起消化道出血熱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_002","year":2016,"roc_year":105,"session":"2","examNo":2,"q":"沙狀病毒（arenavirus）是一種重要的人畜共通傳染病毒，會造成嚴重的出血熱症狀，下列何者為其常見的動物宿主？","opts":["A. 蝙蝠","B. 老鼠","C. 候鳥","D. 雪貂"],"ans":1,"exp":"沙狀病毒（Arenavirus）包括拉薩熱（Lassa fever）、南美出血熱等，其自然界保毒宿主為囓齒目（老鼠類）。人類主要透過接觸受感染囓齒動物的排泄物或分泌物而感染。","we":["蝙蝠是伊波拉病毒與立百病毒等的主要保毒宿主，而非沙狀病毒。","（正確）老鼠是沙狀病毒最常見的動物宿主，人類透過接觸鼠類排泄物感染。","候鳥不是沙狀病毒的宿主，候鳥與流感、西尼羅等病毒相關。","雪貂不是沙狀病毒的天然宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_003","year":2016,"roc_year":105,"session":"2","examNo":3,"q":"下列那一種人畜共通病毒同時擁有動物與昆蟲為其自然保毒宿主？","opts":["A. 家禽流行性感冒（avian influenza）病毒","B. 狂犬病（rabies）病毒","C. 拉克羅斯腦炎（La Crosse encephalitis）病毒","D. 猴痘（monkey pox）病毒"],"ans":2,"exp":"拉克羅斯腦炎病毒（La Crosse encephalitis virus，屬Bunyaviridae）是一種蟲媒病毒，以小動物（松鼠、花栗鼠等）為自然保毒宿主，並藉由蚊子（三帶喙庫蚊等）傳播，同時擁有動物與昆蟲的自然保毒系統。","we":["家禽流行性感冒病毒以禽鳥為主要宿主，傳播不依賴昆蟲媒介。","狂犬病病毒以溫血動物（犬、蝙蝠等）為宿主，無昆蟲保毒宿主。","（正確）拉克羅斯腦炎病毒以小型囓齒動物為動物宿主，以蚊子為節肢動物媒介，同時擁有兩類保毒宿主。","猴痘病毒以囓齒動物和靈長類為宿主，無昆蟲保毒宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_004","year":2016,"roc_year":105,"session":"2","examNo":4,"q":"下列那一種出血熱病毒主要是由壁蝨（tick）所傳播？","opts":["A. Hantaan hemorrhagic fever virus","B. Crimean-Congo hemorrhagic fever virus","C. Ebola hemorrhagic fever virus","D. Dengue hemorrhagic fever virus"],"ans":1,"exp":"Crimean-Congo hemorrhagic fever（克里米亞-剛果出血熱）病毒屬於Nairovirus（崩芽病毒科），主要由硬壁蝨（特別是Hyalomma屬）傳播，是最重要的壁蝨媒介出血熱。漢他病毒由囓齒動物糞便傳播，伊波拉及登革病毒各有不同媒介。","we":["Hantaan hemorrhagic fever virus由囓齒動物排泄物吸入傳播，不由壁蝨傳播。","（正確）Crimean-Congo hemorrhagic fever virus主要由Hyalomma屬硬壁蝨傳播。","Ebola hemorrhagic fever virus經直接接觸感染動物血液/分泌物傳播，無節肢動物媒介。","Dengue hemorrhagic fever virus由埃及斑蚊傳播，是蚊媒病毒，不是壁蝨媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_005","year":2016,"roc_year":105,"session":"2","examNo":5,"q":"下列何種動物為黃熱病病毒的主要自然貯主（natural reservoir）？","opts":["A. 老鼠","B. 鳥類","C. 猴子","D. 蝙蝠"],"ans":2,"exp":"黃熱病病毒（Yellow fever virus）屬黃病毒科，其自然保毒宿主主要是非洲和南美洲的猴子（靈長類），人與野生動物循環（jungle cycle）中猴子是主要宿主，由蚊子傳播給人類。","we":["老鼠不是黃熱病病毒的主要自然貯主。","鳥類是西尼羅病毒及日本腦炎病毒的主要貯主，非黃熱病。","（正確）猴子（靈長類）是黃熱病病毒在自然界的主要貯主，維持叢林型傳播循環。","蝙蝠是立百病毒、亨德拉病毒、伊波拉病毒等的主要貯主，非黃熱病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_006","year":2016,"roc_year":105,"session":"2","examNo":6,"q":"下列有關日本腦炎之敘述，何者正確？","opts":["A. 首度爆發於日本，目前此傳染病只侷限於亞洲地區","B. 在日本以及中國大陸，主要藉由斑蚊（Aedes spp.）傳播","C. 感染水鳥及豬並造成病毒血症","D. 人是日本腦炎病毒之增幅宿主（amplifier）"],"ans":2,"exp":"日本腦炎病毒以水鳥（如蒼鷺）及豬為增幅宿主（amplifier host），病毒在其體內繁殖並產生高效病毒血症，再由蚊子叮咬傳播。人類和馬是終宿主（dead-end host），不是增幅宿主，人傳人不是主要傳播方式。","we":["日本腦炎已擴散至亞洲多個國家，並非只侷限於亞洲地區，但確實在亞洲流行；主要說法正確但並非最佳選項。","台灣主要傳播媒介是三斑家蚊（Culex tritaeniorhynchus），而非斑蚊（Aedes）。","（正確）日本腦炎病毒感染水鳥及豬，使其產生高效病毒血症（病毒血症），成為增幅宿主。","人是日本腦炎病毒的終宿主（dead-end host），不是增幅宿主，病毒血症低，無法傳給蚊子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_007","year":2016,"roc_year":105,"session":"2","examNo":7,"q":"家禽流行性感冒病毒屬於","opts":["A. 正黏液病毒科（Orthomyxoviridae）","B. 副黏液病毒科（Paramyxoviridae）","C. 痘病毒科（Poxviridae）","D. 崩芽病毒科（Bunyaviridae）"],"ans":0,"exp":"家禽流行性感冒（Avian influenza）的病原為A型流感病毒，屬於正黏液病毒科（Orthomyxoviridae）。其特徵為分節段的單股負鏈RNA基因組，包含HA（血球凝集素）和NA（神經胺酸酶）兩種主要表面蛋白。","we":["（正確）家禽流感病毒屬正黏液病毒科（Orthomyxoviridae），即A型流感病毒。","副黏液病毒科（Paramyxoviridae）包括新城病病毒、麻疹病毒等，不包括流感病毒。","痘病毒科（Poxviridae）包括天花、痘苗等痘類病毒，為雙股DNA病毒。","崩芽病毒科（Bunyaviridae）包括漢他病毒、克里米亞-剛果出血熱等。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_008","year":2016,"roc_year":105,"session":"2","examNo":8,"q":"下列對里夫谷熱（Rift valley fever）的敘述，何者正確？","opts":["A. 主要造成動物如牛、水牛、豬和人的發燒","B. 主要是和吸血蠅的滋生有關","C. 病原有多種血清型","D. 病原屬於沙蠅病毒屬（Phlebovirus）"],"ans":3,"exp":"里夫谷熱（Rift valley fever）病原屬Phlebovirus屬（沙蠅病毒屬），歸於Phenuiviridae科。病毒感染多種動物，主要是牛、綿羊、山羊和駱駝，造成大量流產及新生動物死亡；豬不是主要受感對象。傳播主要由蚊子（Aedes、Culex等）媒介，不是吸血蠅。病原只有一種血清型。","we":["里夫谷熱主要造成牛、綿羊、山羊和駱駝感染，豬不是主要動物。","傳播主要是蚊子（Aedes、Culex等），不是吸血蠅（采采蠅）。","里夫谷熱病原只有一種血清型，不是多種血清型。","（正確）里夫谷熱病原屬Phlebovirus屬（沙蠅病毒屬），這是正確的分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_009","year":2016,"roc_year":105,"session":"2","examNo":9,"q":"猴痘病毒在自然界中主要分布地理區域為","opts":["A. 美洲","B. 歐洲","C. 非洲","D. 亞洲"],"ans":2,"exp":"猴痘病毒（Monkeypox virus）屬痘病毒科（Poxviridae）中的Orthopoxvirus屬，主要分布在非洲的赤道雨林地區，特別是中非和西非。1958年在實驗室猴群中首次發現，但自然界中囓齒類動物才是真正的保毒宿主。","we":["猴痘病毒並非主要分布在美洲，2022年的傳播是人傳人，非自然流行。","歐洲不是猴痘病毒的自然分布地理區域。","（正確）猴痘病毒主要分布在非洲的中西部赤道雨林地區。","亞洲不是猴痘病毒的主要自然分布區域。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_010","year":2016,"roc_year":105,"session":"2","examNo":10,"q":"羊接觸傳染性膿疱症（contagious ecthyma）為一種人畜共通傳染病，與下列何種疾病在病原分類上相似度最大？","opts":["A. 水疱性口炎","B. 口蹄疫","C. 豬水疱病","D. 牛丘疹性口炎"],"ans":3,"exp":"羊接觸傳染性膿疱症（contagious ecthyma，又稱orf）的病原為orf病毒，屬於痘病毒科Parapoxvirus屬（類痘病毒屬）。牛丘疹性口炎（bovine papular stomatitis）的病原Bovine papular stomatitis virus也屬Parapoxvirus屬，兩者在病原分類上最相似。","we":["水疱性口炎（VSV）屬彈狀病毒科，與羊接觸傳染性膿疱症分類不同。","口蹄疫（FMDV）屬小RNA病毒科，與orf病毒分類相差甚遠。","豬水疱病（SVDV）屬小RNA病毒科，非痘病毒類。","（正確）牛丘疹性口炎的病原與orf病毒同屬Parapoxvirus屬，分類相似度最大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_011","year":2016,"roc_year":105,"session":"2","examNo":11,"q":"科羅拉多蜱熱（Colorado tick fever）的病原屬於","opts":["A. 病毒","B. 細菌","C. 原蟲","D. 立克次體"],"ans":0,"exp":"科羅拉多蜱熱（Colorado tick fever）的病原為Colorado tick fever virus（CTFV），屬Reoviridae科Coltivirus屬，為雙股RNA病毒，是病毒性疾病。由Dermacentor andersoni壁蝨傳播，分布於美國西部及加拿大。","we":["（正確）科羅拉多蜱熱的病原為Colorado tick fever virus，是一種病毒（Coltivirus）。","其病原不是細菌，而是病毒。","其病原不是原蟲，原蟲如瘧原蟲、焦蟲等。","其病原不是立克次體，立克次體為革蘭氏陰性胞內寄生菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_012","year":2016,"roc_year":105,"session":"2","examNo":12,"q":"下列疾病中，那些可能因候鳥遷移，而入侵臺灣？①西尼羅病毒感染症 ②家禽流行性感冒 ③里夫谷熱 ④淋巴球性脈絡叢腦\r 膜炎","opts":["A. ①②","B. ①③","C. ②③","D. ②④"],"ans":0,"exp":"西尼羅病毒感染症①和家禽流行性感冒②均可藉由候鳥遷移傳入台灣。西尼羅病毒以候鳥為貯主，可傳播至新地區；H5N1高病原性禽流感也因候鳥遷移廣泛傳播。里夫谷熱③主要流行於非洲，台灣無蚊媒；淋巴球性脈絡叢腦膜炎④由鼠類傳播，不由候鳥攜帶。","we":["（正確）①西尼羅病毒和②家禽流行性感冒均可藉由候鳥遷移傳入台灣。","③里夫谷熱主要在非洲及中東流行，且需特定蚊媒，候鳥遷移傳入台灣風險低。","③里夫谷熱的蚊媒在台灣不常見，傳入風險較低。","④淋巴球性脈絡叢腦膜炎由囓齒動物（鼠類）傳播，與候鳥遷移無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_013","year":2016,"roc_year":105,"session":"2","examNo":13,"q":"下列何種細菌性人畜共通疾病的病程最長、傳播速率最慢？","opts":["A. 志賀菌症","B. 彎曲桿菌症","C. 兔熱病","D. 分枝桿菌症"],"ans":3,"exp":"分枝桿菌症（如結核病，Mycobacterium bovis/tuberculosis）病程最長（可長達數年至數十年的潛伏感染），傳播速率也最慢（需密切長期接觸）。相比之下，志賀菌症、彎曲桿菌症、兔熱病均較急性且傳播較快。","we":["志賀菌症（shigellosis）急性傳染性腸炎，傳播快、病程短。","彎曲桿菌症（campylobacteriosis）急性腸胃炎，傳播較快，病程短。","兔熱病（tularemia）病程約1-4週，不及分枝桿菌症長。","（正確）分枝桿菌症（結核病）病程最長，傳播速率最慢，需長期密切接觸才能傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_014","year":2016,"roc_year":105,"session":"2","examNo":14,"q":"下列何者並非感染海洋弧菌症（Vibrio vulnificus infection）後出現的主要特徵？","opts":["A. 菌血症","B. 軟組織感染","C. 胃腸炎","D. 腦脊髓炎"],"ans":3,"exp":"海洋弧菌症（Vibrio vulnificus infection）主要表現為：①菌血症（septicemia）、②軟組織感染（壞死性筋膜炎）、③胃腸炎。腦脊髓炎不是其主要特徵，V. vulnificus主要侵犯消化系統、血液循環和皮膚軟組織，而非中樞神經系統。","we":["菌血症是V. vulnificus感染後重要表現，特別在免疫力低下患者（如肝硬化）可造成致命菌血症。","軟組織感染（壞死性筋膜炎）是V. vulnificus傷口感染的典型表現。","胃腸炎可由食用受污染的海鮮引起。","（正確）腦脊髓炎不是V. vulnificus感染的主要特徵，V. vulnificus主要影響消化、循環及皮膚系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_015","year":2016,"roc_year":105,"session":"2","examNo":15,"q":"屠檢獸醫師在屠宰場線上執勤時較不必擔心會感染到下列何種疾病？","opts":["A. 豬丹毒","B. 彎曲桿菌症","C. Q熱","D. 地方性斑疹傷寒"],"ans":3,"exp":"地方性斑疹傷寒（murine typhus）由立克次體（Rickettsia typhi）引起，主要傳播媒介為鼠蚤。屠宰場環境中鼠蚤不是主要問題，所以屠檢獸醫師在屠宰場執勤時相對較不必擔心感染此病。相較之下，豬丹毒（皮膚接觸）、彎曲桿菌症（腸道污染）、Q熱（吸入性）在屠宰場環境中風險較高。","we":["豬丹毒（Erysipelothrix rhusiopathiae）可透過皮膚傷口感染，在屠宰場處理豬隻時風險高。","彎曲桿菌症可透過接觸受污染的腸道內容物感染，在屠宰場中風險高。","Q熱（Coxiella burnetii）可由吸入帶菌的氣溶膠感染，屠宰場是主要高風險場所。","（正確）地方性斑疹傷寒主要由鼠蚤傳播，屠宰場並不是此病的高風險環境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_016","year":2016,"roc_year":105,"session":"2","examNo":16,"q":"下列何種疾病是因感染小螺旋菌（Spirillum minus）所致？","opts":["A. 鼠咬熱","B. 萊姆病","C. 鈎端螺旋體病","D. 土拉倫斯病"],"ans":0,"exp":"鼠咬熱（rat-bite fever）有兩種病原：Streptobacillus moniliformis（連鎖球桿菌）和Spirillum minus（小螺旋菌）。由S. minus引起的稱為Sodoku或Spirillary rat-bite fever，主要見於亞洲，特別是日本。","we":["（正確）鼠咬熱（Spirillary form/Sodoku）由Spirillum minus（小螺旋菌）所致。","萊姆病由疏螺旋體（Borrelia burgdorferi）引起，由壁蝨傳播。","鈎端螺旋體病由Leptospira引起，主要透過尿液污染環境傳播。","土拉倫斯病（兔熱病）由Francisella tularensis引起，非螺旋菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_017","year":2016,"roc_year":105,"session":"2","examNo":17,"q":"下列何者主要藉由節肢動物糞便傳播？①貓抓病 ②里夫谷熱 ③鼠疫 ④南美錐蟲病","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":2,"exp":"主要藉由節肢動物糞便傳播的疾病：③鼠疫（由跳蚤咬傷後糞便污染傷口傳播）和④南美錐蟲病（Chagas disease，由獵蝽蟲〔Triatomine bugs〕叮咬後糞便污染傷口傳播）。貓抓病（①）由Bartonella henselae透過貓抓傷傳播；里夫谷熱（②）由蚊媒傳播，不是節肢動物糞便。","we":["貓抓病（①）由受感染跳蚤的糞便作為媒介，貓帶病原，但主要是抓傷非糞便直接傳播。里夫谷熱（②）由蚊子叮咬傳播，非糞便。","里夫谷熱（②）由蚊子傳播，不是節肢動物糞便傳播；鼠疫（③）確實可由跳蚤糞便傳播。","（正確）鼠疫（③）由跳蚤糞便污染傷口或鼠疫桿菌反流入傷口傳播；南美錐蟲病（④）由獵蝽糞便污染叮咬傷口傳播。","貓抓病（①）與南美錐蟲病（④）搭配不對，貓抓病主要是貓抓傷傳播，非節肢動物糞便。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_018","year":2016,"roc_year":105,"session":"2","examNo":18,"q":"Q熱的傳染途徑以何種方式最常見？","opts":["A. 吸入性","B. 食入性","C. 傷口傳染","D. 血液傳染"],"ans":0,"exp":"Q熱（Coxiella burnetii）最常見的傳染途徑是吸入性傳播，即吸入被感染動物（牛、羊等）分娩時產生的氣溶膠、灰塵或受污染的乾草等。C. burnetii能在環境中長期存活，並可隨風傳播至遠處，是職業性肺炎的重要原因。","we":["（正確）Q熱最常見的傳染途徑是吸入被感染動物分娩時釋出的氣溶膠或受污染灰塵。","食入性傳播（飲用未殺菌奶）也可發生，但不是最常見途徑。","傷口傳染（直接接觸）可發生，但非最主要途徑。","血液傳染雖然偶有報告，但極為罕見，不是常見途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_019","year":2016,"roc_year":105,"session":"2","examNo":19,"q":"下列有關E coli O157：H7之敘述，何者為錯誤？","opts":["A. 可引起溶血性尿毒症候群","B. 感染途徑主要為肉類飲食污染","C. 生食蔬菜亦可感染","D. 行政院衛生署將其列為第一類重大傳染病，需於24小時內通報"],"ans":3,"exp":"大腸桿菌O157:H7（EHEC）在台灣被列為第三類法定傳染病（腸道出血性大腸桿菌感染症），需於1週內通報，而非第一類且24小時通報。其他選項：可引起溶
