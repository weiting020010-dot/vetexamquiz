利用細菌氧化還原反應。","pH值測定是電化學法（pH計），非利用細菌氧化還原反應。","（正確）美藍試驗利用細菌的氧化還原活性使美藍褪色，是間接評估細菌量的方法。","酒精試驗（alcohol test）藉由酒精使蛋白質沉澱判定生乳穩定性，非利用細菌氧化還原反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_047","year":2019,"roc_year":108,"session":"1","examNo":47,"q":"1996年日本大阪的蘿蔔嬰食品中毒事件係由O157：H7造成腸出血性腸炎，該致病原的主要保菌宿主為下列\r 何者？","opts":["A. 牛","B. 豬","C. 家禽","D. 馬"],"ans":0,"exp":"腸出血性大腸桿菌（EHEC）O157:H7 的主要保菌宿主為牛（尤其是肉牛），牛腸道中大量攜帶此病原但本身不生病。1996年日本大阪學校午餐食物中毒事件由牛肉（蘿蔔嬰沾染到牛糞污染的水或食材）引起。","we":["（正確）EHEC O157:H7 的主要保菌宿主為牛，牛是此病原的天然宿主。","豬雖可攜帶部分大腸桿菌，但並非EHEC O157:H7的主要保菌宿主。","家禽是Salmonella和Campylobacter的主要宿主，非EHEC O157:H7。","馬可偶爾攜帶EHEC，但並非主要保菌宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_048","year":2019,"roc_year":108,"session":"1","examNo":48,"q":"家畜屠宰前之昏厥作業目的何在？","opts":["A. 避免放血不全","B. 血液收集量多","C. 減少其痛苦，並使屠宰過程迅速安全","D. 消除屠體異味"],"ans":2,"exp":"屠宰前昏厥（stunning）的主要目的是使動物在屠宰過程中減少其痛苦與恐慌，並使屠宰過程更迅速安全（減少動物抵抗，防止工人受傷）。昏厥動物血壓下降、心臟仍跳動，有助於充分放血；但主要法律依據為動物人道宰殺要求。","we":["昏厥後動物仍需確保放血充分（心臟跳動輔助），昏厥本身並非為「避免放血不全」的主要目的。","昏厥並非為了收集更多血液，而是為了人道考量。","（正確）昏厥的主要目的是減少動物的痛苦與恐懼，並使屠宰過程迅速安全。","昏厥不會消除屠體異味，肉品氣味取決於動物品種、飲食及後處理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_049","year":2019,"roc_year":108,"session":"1","examNo":49,"q":"有關屠畜廐舍之管理，下列敘述何者正確？","opts":["A. 待空舍時再處理污物","B. 要提供充足之飲水與飼料","C. 通風設備非必要，可節省成本","D. 隨時保持污物之清除"],"ans":3,"exp":"屠畜廐舍（lairage）管理的正確做法包括：隨時清除污物以保持清潔衛生（D正確）；提供充足飲水（可減少動物緊迫）但不必提供飼料（避免屠前腸內容物過多）；需要通風設備維持空氣品質；不必等待空舍再清理。","we":["廐舍污物應隨時清除，不應等到空舍後才處理，A不正確。","提供充足飲水正確，但同時提供飼料則不必要（屠前適度禁食），B部分錯誤。","通風設備是廐舍必要設施，可維持空氣品質、降低熱緊迫，C錯誤。","（正確）廐舍應隨時保持污物清除，維持清潔衛生以減少病原污染及動物緊迫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_050","year":2019,"roc_year":108,"session":"1","examNo":50,"q":"下列何種寄生蟲感染症較不會發生在生食豬肉的病例？","opts":["A. 有鈎絛蟲","B. 弓蟲","C. 海獸胃線蟲","D. 旋毛蟲"],"ans":2,"exp":"海獸胃線蟲（Anisakis spp.）為海洋魚類的寄生蟲，其生活史不經過陸上動物（豬）。生食豬肉可能感染的寄生蟲包括：有鉤絛蟲（囊蚴）、弓蟲（組織囊體）、旋毛蟲（囊胞）。海獸胃線蟲不存在於豬肉中，故生食豬肉不會感染。","we":["有鉤絛蟲（Taenia solium）的囊蚴寄生於豬肌肉，生食豬肉可感染，A不符題意。","弓蟲（Toxoplasma gondii）可寄生於豬組織，生食豬肉是人類感染弓蟲的重要途徑之一，B不符題意。","（正確）海獸胃線蟲（Anisakis）寄生於海洋魚類，不存在於豬肉，生食豬肉不會感染，C正確。","旋毛蟲（Trichinella spiralis）可寄生於豬肌肉，生食未熟豬肉是感染途徑之一，D不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_051","year":2019,"roc_year":108,"session":"1","examNo":51,"q":"下列何者比較不會經由未消毒的牛奶感染人類？","opts":["A. 腸炎弧菌","B. 腸出血性大腸桿菌","C. 彎曲桿菌","D. 李斯特菌"],"ans":0,"exp":"腸炎弧菌（Vibrio parahaemolyticus）為海洋性嗜鹽菌，主要透過生食或未充分煮熟的海鮮（蝦、牡蠣等）感染，不透過牛奶傳播。腸出血性大腸桿菌、彎曲桿菌、李斯特菌均可能透過未消毒的牛奶（生乳）傳染給人類。","we":["（正確）腸炎弧菌（Vibrio parahaemolyticus）為海洋性病原，不透過牛奶傳播，A為正確答案。","腸出血性大腸桿菌可污染生乳（牛糞污染），可經未消毒牛奶傳染，B不符題意。","彎曲桿菌（Campylobacter）可經生乳傳染，是生乳相關食物中毒的重要病原之一，C不符題意。","李斯特菌（Listeria monocytogenes）可在乳製品中繁殖，未消毒牛奶是傳染途徑，D不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_052","year":2019,"roc_year":108,"session":"1","examNo":52,"q":"雞蛋中蛋白部分若發現有血絲，最可能是產蛋雞何處出現發炎？","opts":["A. 輸卵管","B. 卵巢","C. 盲腸","D. 共泄腔"],"ans":0,"exp":"輸卵管（oviduct）發炎時，雞蛋在通過輸卵管形成過程中，輸卵管炎症部位的血液可滲入蛋白部分，造成血絲蛋。輸卵管是蛋形成（包覆蛋白、蛋殼）的場所，發炎最易造成蛋白血絲污染。","we":["（正確）蛋白中的血絲最可能來自輸卵管發炎，蛋白在輸卵管中形成，炎症出血可污染蛋白。","卵巢出血通常影響蛋黃（血絲出現在蛋黃中），而非蛋白。","盲腸位於腸道，與蛋的形成無直接關係，盲腸炎不會直接造成蛋白血絲。","共泄腔為尿道、生殖道、消化道共同開口，其炎症通常不直接造成蛋白內血絲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_053","year":2019,"roc_year":108,"session":"1","examNo":53,"q":"在臺灣食用鹿茸最需要特別注意的人畜共通傳染病為何？","opts":["A. 結核病","B. 布氏桿菌症","C. 狂犬病","D. ⻄尼羅病毒感染症"],"ans":1,"exp":"台灣曾有食用鹿茸（鹿角）感染布氏桿菌症（Brucellosis）的案例，因鹿茸中可能含有布氏桿菌（Brucella abortus 或 B. suis），處理或食用未充分處理的鹿茸時可能感染，尤其在台灣有鹿隻飼養及鹿茸消費的特殊飲食文化背景下。","we":["結核病雖可能存在於鹿群，但台灣特別針對鹿茸消費警示的人畜共通傳染病為布氏桿菌症。","（正確）台灣食用鹿茸最需注意布氏桿菌症，鹿茸中可能含有布氏桿菌。","狂犬病透過咬傷傳播，食用鹿茸不會感染狂犬病。","西尼羅病毒透過蚊媒傳播，非食用鹿茸的傳染風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_054","year":2019,"roc_year":108,"session":"1","examNo":54,"q":"依據屠宰場設置標準第4條規定，一般作業場所之照明光度應為多少米燭光以上？","opts":["A. 100","B. 200","C. 300","D. 500"],"ans":2,"exp":"依屠宰場設置標準第4條，屠宰場一般作業場所（如屠宰室、分切室）的照明光度應達300米燭光以上；屠後檢查站則需500米燭光以上，以確保屠後檢查的品質。","we":["100米燭光為辦公室或一般工作場所的最低要求，低於屠宰場一般作業場所標準。","200米燭光低於屠宰場一般作業場所所要求的300米燭光。","（正確）屠宰場一般作業場所依法需達300米燭光以上照明。","500米燭光為屠後「檢查站」的特殊要求，非一般作業場所的標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_055","year":2019,"roc_year":108,"session":"1","examNo":55,"q":"下列何者在病毒學分類上與立百病毒最相近？","opts":["A. Hendra virus","B. Japanese encephalitis virus","C. feline coronavirus","D. canine parvovirus"],"ans":0,"exp":"立百病毒（Nipah virus）和 Hendra virus 在病毒學分類上同屬副黏液病毒科（Paramyxoviridae）的亨尼帕病毒屬（Henipavirus），兩者親緣關係最近。兩者均以大型果蝠（Pteropus spp.）為自然宿主，均可引起嚴重腦炎。","we":["（正確）Nipah virus 與 Hendra virus 同屬 Henipavirus 屬（副黏液病毒科），親緣最近。","Japanese encephalitis virus 屬黃病毒科（Flaviviridae），與立百病毒分類遠。","Feline coronavirus 屬冠狀病毒科（Coronaviridae），分類與立百病毒相差甚遠。","Canine parvovirus 屬小病毒科（Parvoviridae），分類與立百病毒相差甚遠。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_056","year":2019,"roc_year":108,"session":"1","examNo":56,"q":"日本腦炎主要藉由何種蚊子傳播？","opts":["A. Culex tritaeniorrhynchus","B. Culex annulus","C. Aedes aegypti","D. Aedes albopictus"],"ans":0,"exp":"日本腦炎（Japanese encephalitis）主要透過Culex tritaeniorrhynchus（三帶喙庫蚊）傳播，此蚊種廣泛分布於亞洲稻田地區，以稻田及豬場附近最為常見，在日本、台灣及東南亞為最重要的日本腦炎病毒傳播媒介。","we":["（正確）Culex tritaeniorrhynchus（三帶喙庫蚊）是日本腦炎最主要的傳播媒介蚊種。","Culex annulus（環紋庫蚊）可傳播日本腦炎但非最主要媒介。","Aedes aegypti（埃及斑蚊）為登革熱和黃熱病的主要媒介，非日本腦炎的主要傳播蚊種。","Aedes albopictus（白線斑蚊）為登革熱的次要媒介，非日本腦炎的主要媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_057","year":2019,"roc_year":108,"session":"1","examNo":57,"q":"下列何種疾病過去在人常被誤診為弓蟲症？","opts":["A. 牛羊肝吸蟲病","B. 囊蟲病","C. 旋毛蟲病","D. 新胞蟲病"],"ans":3,"exp":"新胞蟲症（Neosporosis，由Neospora caninum引起）在人類過去常被誤診為弓蟲症（Toxoplasmosis），因為兩者病原在型態學上極為相似，且血清學試驗有部分交叉反應。Neospora 直到1988年才被確認為獨立物種。","we":["牛羊肝吸蟲病（fasciolosis）在形態和血清學上與弓蟲症差異顯著，不常被誤診為弓蟲症。","囊蟲病（cysticercosis）由有鉤絛蟲的囊尾幼蟲引起，影像學診斷有特徵性表現，不常誤診為弓蟲症。","旋毛蟲病（trichinosis）影響肌肉，臨床及血清學特徵與弓蟲症差異較大。","（正確）新胞蟲症（Neosporosis）與弓蟲症（Toxoplasmosis）病原型態相似，歷史上常被誤診為弓蟲症，直至1988年才區分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_058","year":2019,"roc_year":108,"session":"1","examNo":58,"q":"下列何者不屬於人感染弓蟲症之主要臨床症狀？","opts":["A. 關節炎","B. 流產","C. 腦炎","D. 脈絡網膜炎"],"ans":0,"exp":"人類弓蟲症（Toxoplasmosis）的主要臨床症狀包括：流產（孕婦感染後胎兒受損）、腦炎（免疫低下者）、脈絡網膜炎（眼部病變，可致失明）。關節炎通常不是弓蟲症的典型症狀，而是其他感染性疾病（如萊姆病）的特徵性表現。","we":["（正確）關節炎不是弓蟲症的主要臨床症狀，A為正確答案（此選項不屬於）。","流產是弓蟲症在孕婦中最重要的併發症（先天性弓蟲症），B為弓蟲症症狀。","腦炎見於免疫低下（如AIDS）患者的弓蟲症再活化，C為弓蟲症症狀。","脈絡網膜炎（ocular toxoplasmosis）是弓蟲症的常見眼部表現，可造成視力受損，D為弓蟲症症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_059","year":2019,"roc_year":108,"session":"1","examNo":59,"q":"下列何者為日本腦炎病毒之增幅宿主（amplifying host）？","opts":["A. 人","B. 豬","C. 馬","D. 蝙蝠"],"ans":1,"exp":"日本腦炎病毒（JEV）的傳播環：蚊子（Culex spp.）→ 豬（增幅宿主/amplifying host）→ 蚊子→ 人/馬（終末宿主/dead-end host）。豬是JEV最重要的增幅宿主，病毒在豬體內大量複製，使蚊子吸血時獲得大量病毒，是維持病毒循環的關鍵。","we":["人為終末宿主（dead-end host），病毒血症低，無法再傳染給蚊子，非增幅宿主。","（正確）豬是日本腦炎病毒最重要的增幅宿主，病毒血症高，可有效傳給吸血蚊子。","馬為終末宿主，不是增幅宿主，感染後可能出現腦炎症狀但病毒量低。","蝙蝠非日本腦炎的增幅宿主，JEV主要在豬和水鳥中增幅。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_060","year":2019,"roc_year":108,"session":"1","examNo":60,"q":"下列何種病原需在第三級生物安全實驗室內進行操作？","opts":["A. 日本腦炎病毒","B. 李斯特菌","C. 伯氏疏螺旋體","D. 布氏桿菌"],"ans":3,"exp":"布氏桿菌（Brucella spp.）被列為第三級病原體（BSL-3），需在P3等級生物安全實驗室（BSL-3）中操作，因其高感染性（低感染劑量）及氣溶膠感染風險。日本腦炎病毒、李斯特菌、伯氏疏螺旋體屬BSL-2等級病原。","we":["日本腦炎病毒（JEV）在大多數設施中屬BSL-2或BSL-3操作，依地區規定不同，但主要為BSL-2。","李斯特菌（Listeria monocytogenes）屬BSL-2病原，不需P3實驗室。","伯氏疏螺旋體（Borrelia burgdorferi）屬BSL-2病原，不需P3實驗室。","（正確）布氏桿菌（Brucella spp.）因高氣溶膠感染風險，為BSL-3病原，需在P3實驗室操作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_061","year":2019,"roc_year":108,"session":"1","examNo":61,"q":"下列有關狂犬病病毒之敘述，何者正確？","opts":["A. 禽類不會感染","B. 牛、豬不會感染","C. 狐狸、蝙蝠等野生動物可能為狂犬病病毒之保毒宿主","D. 固定病毒（fixed virus）常排毒在感染動物之唾液中，潛伏期比市街病毒（street virus）長"],"ans":2,"exp":"狂犬病病毒（Rhabdoviridae）可感染所有哺乳類動物，包括牛、豬、馬、犬等，理論上也可感染禽類（雖非常見宿主）。狐狸、蝙蝠等野生動物確為狂犬病病毒的重要保毒宿主（C正確）。固定病毒（fixed virus）為實驗室適應株，排毒在唾液中較少；市街病毒（street virus）才是自然界流行株，潛伏期較固定病毒長。","we":["禽類雖非典型宿主，但理論上可感染，「不會感染」的說法過於絕對，A錯誤。","牛和豬均可感染狂犬病（尤其被患狂犬病動物咬傷），B錯誤。","（正確）狐狸、蝙蝠等野生動物確為狂犬病病毒的重要保毒宿主，C正確。","固定病毒（fixed virus）為實驗室適應株，潛伏期較市街病毒（street virus）短，D的說法相反，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_062","year":2019,"roc_year":108,"session":"1","examNo":62,"q":"下列有關鸚鵡病（psittacosis）之敘述，何者錯誤?","opts":["A. 病原是革蘭氏陰性細菌","B. 藉由吸入或食入傳染","C. 其病原可於肺細胞間質增殖","D. 鸚鵡科鳥類可見肝脾腫大"],"ans":2,"exp":"鸚鵡病（psittacosis）病原為Chlamydophila psittaci，為革蘭氏陰性細菌（但屬於專性胞內寄生菌）。其增殖發生於宿主細胞的胞內（不是細胞間質），形成包涵體（inclusion body）。C「可於肺細胞間質增殖」是錯誤的。","we":["Chlamydophila psittaci 確為革蘭氏陰性細菌（或不明確分類的細菌），A正確。","可藉由吸入或食入（受污染的羽毛、糞便塵埃）傳染，B正確。","（正確錯誤選項）Chlamydophila 為專性胞內寄生菌，在細胞「內」增殖（非細胞間質），C的「細胞間質增殖」是錯誤的。","鸚鵡科鳥類感染後確可見肝腫大及脾腫大，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_063","year":2019,"roc_year":108,"session":"1","examNo":63,"q":"下列有關彎曲桿菌屬之敘述，何者正確?","opts":["A. 屬於循環傳播型人畜共通傳染病病原","B. 本病原為厭氧菌","C. 巴斯德滅菌法無法殺死本病原","D. 有些菌種可造成牛胎盤炎及流產"],"ans":3,"exp":"彎曲桿菌（Campylobacter spp.）屬於直接接觸型或食因性人畜共通傳染病，不屬於「循環傳播型」（vector-borne）；彎曲桿菌為微嗜氧菌（microaerophilic），非厭氧菌；巴斯德殺菌法（72°C/15秒或63°C/30分）可有效殺死彎曲桿菌；Campylobacter fetus 等菌種確可造成牛胎盤炎及流產（D正確）。","we":["彎曲桿菌屬食因性人畜共通傳染病，非需要媒介的循環傳播型，A錯誤。","彎曲桿菌為微嗜氧菌（需5-10% O₂），非嚴格厭氧菌，B錯誤。","巴斯德殺菌法的溫度（72°C）遠高於彎曲桿菌的耐熱性，可有效殺死，C錯誤。","（正確）Campylobacter fetus 等菌種確可造成牛及羊的胎盤炎及流產，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_064","year":2019,"roc_year":108,"session":"1","examNo":64,"q":"馬鼻疽和類鼻疽之病原為何?","opts":["A. Yersinia spp.","B. Borrelia spp.","C. Burkholderia spp.","D. Bartonella spp."],"ans":2,"exp":"馬鼻疽（Glanders）由Burkholderia mallei引起；類鼻疽（Melioidosis）由Burkholderia pseudomallei引起，兩者同屬Burkholderia屬（伯克氏菌屬）。Yersinia 為鼠疫桿菌；Borrelia 為萊姆病螺旋體；Bartonella 為貓抓病病原。","we":["Yersinia 屬包含鼠疫桿菌（Y. pestis）及腸道病原，非馬鼻疽/類鼻疽病原。","Borrelia 為螺旋體，引起萊姆病及復發性熱，非馬鼻疽/類鼻疽病原。","（正確）馬鼻疽（B. mallei）及類鼻疽（B. pseudomallei）均屬 Burkholderia 屬（伯克氏菌屬）。","Bartonella 引起貓抓病（cat scratch disease），非馬鼻疽/類鼻疽病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_065","year":2019,"roc_year":108,"session":"1","examNo":65,"q":"下列何者為叢林型斑疹傷寒的致病原種類？","opts":["A. 病毒","B. 細菌","C. 原蟲","D. 立克次體"],"ans":3,"exp":"叢林型斑疹傷寒（scrub typhus，恙蟲病）的致病原為Orientia tsutsugamushi（舊稱Rickettsia tsutsugamushi），屬於立克次體（Rickettsiales目），由恙蟎（chigger mites）傳播，為立克次體感染症。","we":["叢林型斑疹傷寒非病毒感染，A錯誤。","叢林型斑疹傷寒非一般細菌（屬立克次體，但立克次體是特殊分類），B不完整。","叢林型斑疹傷寒非原蟲感染，C錯誤。","（正確）叢林型斑疹傷寒由 Orientia tsutsugamushi（立克次體目）引起，屬立克次體感染症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_066","year":2019,"roc_year":108,"session":"1","examNo":66,"q":"自然環境中，下列鳥類排遺之何種成分可能有利於Cryptococcus neoformans隱球菌之發育？","opts":["A. 尿素氮","B. 碳酸鹽","C. 磷酸鹽","D. 肌酸酐"],"ans":0,"exp":"鳥類排遺中含有高濃度的尿素氮（尿酸分解產物），為新型隱球菌（Cryptococcus neoformans）的生長促進因子。鳥類（尤其鴿子）的排遺含有大量尿酸，分解後的含氮化合物（如尿素、肌酸酐）有助於隱球菌在環境中生存和發育。","we":["（正確）鳥類排遺中的尿素氮（含氮化合物）可促進Cryptococcus neoformans的環境發育。","碳酸鹽非隱球菌生長的特異性促進因子。","磷酸鹽是一般生長所需，非特異性促進因子。","肌酸酐雖含氮，但非隱球菌生長的主要促進成分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_067","year":2019,"roc_year":108,"session":"1","examNo":67,"q":"人畜共通之大腸桿菌O157：H7型感染，其致病性質屬於下列何者？","opts":["A. 腸毒素產生性大腸桿菌","B. 腸侵襲性大腸桿菌","C. 腸致病性大腸桿菌","D. 腸出血性大腸桿菌"],"ans":3,"exp":"大腸桿菌O157:H7屬於「腸出血性大腸桿菌（Enterohemorrhagic E. coli, EHEC）」，產生志賀樣毒素（Shiga-like toxin/verotoxin），引起出血性腸炎及溶血性尿毒症候群（HUS）。其餘類型：ETEC（腸毒素產生性）、EIEC（腸侵襲性）、EPEC（腸致病性）特徵各異。","we":["腸毒素產生性大腸桿菌（ETEC）產生腸毒素引起旅行者腹瀉，非O157:H7的類型。","腸侵襲性大腸桿菌（EIEC）侵入腸黏膜引起痢疾樣症狀，非O157:H7的類型。","腸致病性大腸桿菌（EPEC）主要引起嬰兒腸炎，非O157:H7的類型。","（正確）O157:H7屬腸出血性大腸桿菌（EHEC），產生志賀樣毒素，引起出血性腸炎及HUS。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_068","year":2019,"roc_year":108,"session":"1","examNo":68,"q":"下列何種細菌最常經由食物感染懷孕婦女引起菌血症，進而造成流死產？","opts":["A. 金黃⾊葡萄球菌","B. 單核細胞增多性李斯特菌","C. 化膿性鏈球菌","D. 綠膿桿菌"],"ans":1,"exp":"單核細胞增多性李斯特菌（Listeria monocytogenes）是最常透過食物（尤其乳製品、即食肉品、即食食品）感染懷孕婦女的細菌，可穿越胎盤屏障引起菌血症，進而導致胎兒感染、流死產及新生兒腦膜炎，是食品安全中最受重視的李斯特菌問題。","we":["金黃色葡萄球菌食物中毒主要為毒素型（腸毒素），不常引起孕婦菌血症導致流死產。","（正確）李斯特菌（Listeria monocytogenes）最常經食物感染孕婦，可穿越胎盤造成流死產。","化膿性鏈球菌（S. pyogenes）主要引起咽喉炎、膿皮症，非主要食因性流死產病原。","綠膿桿菌（Pseudomonas aeruginosa）主要感染免疫不全者，非典型食因性流死產病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_069","year":2019,"roc_year":108,"session":"1","examNo":69,"q":"人曾因生吃下列何種肉類感染旋毛蟲？①甲魚（鱉）肉 ②熊肉 ③臺灣鯛魚肉 ④石斑魚肉","opts":["A. ①②","B. ②③","C. ①④","D. ③④"],"ans":0,"exp":"旋毛蟲（Trichinella spiralis及其他種）的宿主範圍廣泛，除豬外亦可感染熊（熊肉為高風險食品）、甲魚（鱉肉亦有感染案例）等非典型宿主。鱸魚、鯛魚等海淡水魚類不是旋毛蟲的宿主。因此生吃甲魚肉①和熊肉②有感染旋毛蟲的案例。","we":["（正確）生吃甲魚（鱉）肉①和熊肉②均有人類感染旋毛蟲的案例記載，A正確。","熊肉②正確但台灣鯛魚③（淡水魚）無旋毛蟲感染記錄，組合B錯誤。","甲魚①正確，但石斑魚④（海水魚）無旋毛蟲感染紀錄，組合C錯誤。","台灣鯛魚③及石斑魚④均為魚類，旋毛蟲不感染魚類，組合D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_070","year":2019,"roc_year":108,"session":"1","examNo":70,"q":"下列有關漢他病毒感染症的敘述，何者錯誤？","opts":["A. 可分為腎病症候群出血熱（HFRS）及漢他病毒肺症候群（HPS）兩型","B. 其病原體為具有封套之病毒，基因體由單股RNA所構成","C. 漢他病毒肺症候群（HPS）主要流行區為中國大陸","D. 此病原屬於第三級病原體（需在P3實驗室操作）"],"ans":2,"exp":"漢他病毒肺症候群（HPS）流行於美洲（尤其北美及南美），非中國大陸；腎病症候群出血熱（HFRS）才主要流行於亞洲（漢灘型）及歐洲（普瑪拉型）。C說HPS主要流行區為中國大陸是錯誤的。","we":["漢他病毒感染症分HFRS（腎病出血熱）及HPS（肺症候群）兩型，A正確。","漢他病毒具封套、基因體為3條片段（L、M、S）的單股負義RNA，B正確。","（正確錯誤選項）HPS主要流行於美洲（北美及南美洲），非中國大陸，C為錯誤敘述。","漢他病毒屬第三級病原體（需P3實驗室操作），D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_071","year":2019,"roc_year":108,"session":"1","examNo":71,"q":"下列有關布氏桿菌症的敘述，何者正確？","opts":["A. 綿羊布氏桿菌亦會感染人","B. 牛隻懷孕早期易造成流產，為感染的主要症狀","C. 人類病例以北美地區最為嚴重","D. 動物可藉交配、創傷及哺乳等途徑感染"],"ans":3,"exp":"布氏桿菌症的正確知識：動物可藉交配（性傳播）、創傷（傷口接觸）及哺乳（垂直傳播）等途徑感染（D正確）。綿羊布氏桿菌（B. ovis）主要感染羊且不感染人；牛懷孕後期（7-9個月）易流產（非早期）；布氏桿菌症在地中海地區及南美洲最為嚴重，非北美。","we":["綿羊布氏桿菌（B. ovis）主要感染羊且被認為不（或極罕見）感染人，A錯誤。","布氏桿菌感染牛通常在懷孕後期（7-9個月）引起流產，非早期，B錯誤。","布氏桿菌症人類病例以地中海地區及拉丁美洲最為嚴重，非北美，C錯誤。","（正確）布氏桿菌可藉交配、創傷接觸及哺乳等多途徑在動物間傳播，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_072","year":2019,"roc_year":108,"session":"1","examNo":72,"q":"引起下列疾病的病毒中，何者歸屬於崩芽病毒科（Bunyaviridae）？","opts":["A. 克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）","B. 阿根廷出血熱（Argentine hemorrhagic fever）","C. 巴⻄出血熱（Brazilian hemorrhagic fever）","D. 淋巴球性脈絡叢腦膜炎（Lymphocytic choriomeningitis）"],"ans":0,"exp":"克里米亞剛果出血熱（CCHF）由Crimean-Congo hemorrhagic fever virus引起，屬崩芽病毒科（Bunyaviridae）的內羅病毒屬（Nairovirus）。其他三種出血熱（阿根廷出血熱、巴西出血熱、淋巴球性脈絡叢腦膜炎）均屬砂粒病毒科（Arenaviridae）。","we":["（正確）克里米亞剛果出血熱病毒屬崩芽病毒科（Bunyaviridae）/內羅病毒屬，A正確。","阿根廷出血熱（Junin virus）屬砂粒病毒科（Arenaviridae），非崩芽病毒科。","巴西出血熱（Sabia virus）屬砂粒病毒科（Arenaviridae），非崩芽病毒科。","淋巴球性脈絡叢腦膜炎（LCMV）屬砂粒病毒科（Arenaviridae），非崩芽病毒科。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_073","year":2019,"roc_year":108,"session":"1","examNo":73,"q":"日本腦炎又稱為夏季腦炎，其原因為何？","opts":["A. 夏季養豬數量增加","B. 夏季蚊子較喜歡叮咬人類","C. 夏季蚊子數量增加","D. 夏季免疫力降低"],"ans":2,"exp":"日本腦炎（JE）稱為夏季腦炎，是因為夏季（台灣約5-10月）蚊子數量（尤其三帶喙庫蚊 Culex tritaeniorrhynchus）大量繁殖，媒介數量增加，蚊子叮咬動物及人類的機會增加，病毒傳播效率提高，因此夏季為疾病流行季節。","we":["夏季養豬數量並無特別增加，且即使增加也非直接影響蚊子傳播，A非主要原因。","蚊子夏季並非特別偏好叮咬人類（vs. 動物），B不是正確原因。","（正確）夏季溫暖潮濕，蚊子大量繁殖，數量增加，使日本腦炎病毒傳播機會增加，為夏季腦炎主因。","免疫力在夏季降低並非日本腦炎夏季流行的原因，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_074","year":2019,"roc_year":108,"session":"1","examNo":74,"q":"下列何者是人類麴菌症最常見和最重要的感染途徑？","opts":["A. 呼吸道","B. 消化道","C. 生殖道","D. 皮膚"],"ans":0,"exp":"人類麴菌症（Aspergillosis）最常見的感染途徑為吸入（inhalation）含分生孢子（conidia）的空氣，孢子進入呼吸道後，在免疫功能低下者（如血液惡性腫瘤、器官移植、長期使用類固醇）中可侵入肺組織引起侵入性肺麴菌症。","we":["（正確）麴菌主要透過吸入空氣中的孢子感染，呼吸道是最主要的感染途徑。","消化道感染麴菌症較少見，通常需要大量攝入，非主要途徑。","生殖道感染麴菌症極為罕見，不是主要途徑。","皮膚感染（外傷性麴菌症）存在但不常見，非最主要的感染途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_075","year":2019,"roc_year":108,"session":"1","examNo":75,"q":"下列何者屬於人畜共通性寄生蟲，且生活史中需存在第一與第二中間宿主？","opts":["A. 馬圓蟲（Strongylus equinus）","B. 貓肝吸蟲（Opisthorchis felineus）","C. 捻轉胃蟲（Haemonchus contortus）","D. 弓蟲（Toxoplasma gondii）"],"ans":1,"exp":"貓肝吸蟲（Opisthorchis felineus）為人畜共通寄生蟲，生活史需要兩個中間宿主：第一中間宿主（淡水螺類）和第二中間宿主（淡水魚類，如魚科魚類）。最終宿主（貓、狗、人等）因食入含後囊蚴（metacercaria）的生魚而感染。","we":["馬圓蟲（Strongylus equinus）為線蟲，生活史需自由生活幼蟲期，無中間宿主，且主要感染馬，非人畜共通。","（正確）貓肝吸蟲（Opisthorchis felineus）為人畜共通吸蟲，需第一（淡水螺）和第二（淡水魚）中間宿主。","捻轉胃蟲（Haemonchus contortus）為牛羊胃腸線蟲，無中間宿主，且不感染人，非人畜共通。","弓蟲（Toxoplasma gondii）為胞內寄生原蟲，生活史有卵囊期（貓為最終宿主），無典型的「第一與第二中間宿主」分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_076","year":2019,"roc_year":108,"session":"1","examNo":76,"q":"下列寄生蟲中，何者可經由皮膚侵入人體後再經氣管途徑做體內移行？①十二指腸鈎蟲（Ancylostoma\r duodenale） ②人蛔蟲（Ascaris lumbricoides） ③糞桿線蟲（Strongyloides stercoralis） ④猬粒絛\r 蟲（Echinococcus granulosus）","opts":["A. ①②","B. ②④","C. ③④","D. ①③"],"ans":3,"exp":"可經皮膚侵入並進行氣管途徑體內移行的寄生蟲：鉤蟲（如Ancylostoma duodenale①）：幼蟲穿透皮膚→血流→肺→氣管→腸道（Loeffler's pneumonia）；糞桿線蟲（Strongyloides stercoralis③）：幼蟲穿透皮膚→肺→氣管→腸道，也可自體感染。蛔蟲②需經口感染（食入卵）再在肺移行，非皮膚途徑；猬粒絛蟲④為絛蟲，中間宿主食入卵感染，非皮膚途徑。","we":["①②：蛔蟲（Ascaris）經口食入蟲卵感染，非皮膚途徑，組合A錯誤。","②④：蛔蟲②非皮膚途徑，猬粒絛蟲④非皮膚途徑，組合B錯誤。","③④：糞桿線蟲③正確，但猬粒絛蟲④（Echinococcus）非皮膚途徑，組合C錯誤。","（正確）鉤蟲①與糞桿線蟲③均可經皮膚侵入並進行氣管途徑體內移行（lung migration），D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_077","year":2019,"roc_year":108,"session":"1","examNo":77,"q":"水質處理過程，在慢速過濾方法所使用的濾床構造，其最下層濾材屬於下列何種？","opts":["A. 磚塊層","B. 細砂層","C. 砂礫層","D. 卵石層"],"ans":3,"exp":"水質處理慢速過濾法的濾床由上至下通常為：表面生物膜層→細砂層（過濾層）→粗砂或礫石層（支撐層）→最下層為卵石層（礫石/碎石支撐層），以支撐上方過濾介質。","we":["磚塊層不用於水質過濾的濾床構造，A錯誤。","細砂層位於上方（主要過濾區），非最下層，B錯誤。","砂礫層位於中間作為緩衝支撐，非最下層，C錯誤。","（正確）慢速過濾濾床最下層為卵石層（大卵石/礫石），作為最底部的支撐基礎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_078","year":2019,"roc_year":108,"session":"1","examNo":78,"q":"生物醫療廢棄物產生後如直接以焚化處理，其所儲存的包裝容器顏⾊為何？","opts":["A. 白","B. 紅","C. 黃","D. 黑"],"ans":2,"exp":"依感染性廢棄物處理相關法規，生物醫療廢棄物（感染性廢棄物）若直接以焚化處理，其儲存包裝容器顏色為黃色；若先進行其他滅菌處理（如高壓蒸氣滅菌）再廢棄，則使用紅色容器。直接焚化用黃色容器，已滅菌或可燃性感染性用紅色容器。","we":["白色容器非感染性廢棄物規定顏色，A錯誤。","紅色容器用於可燃性感染性廢棄物（已滅菌或等待滅菌），非直接焚化用，B錯誤。","（正確）生物醫療廢棄物直接焚化處理時，其儲存包裝容器顏色為黃色。","黑色容器為一般廢棄物，非感染性廢棄物的規定顏色，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_1_公衛_079","year":2019,"roc_year":108,"session":"1","examNo":79,"q":"則4月的犬隻傳染性氣管支氣管炎發生率\r （incidence rate）最接近下列何者？","opts":["A. 5%","B. 10%","C. 15%","D. 20%"],"ans":1,"exp":"本題為圖表題（需配合原試卷資料）。4月的傳染性氣管支氣管炎發生率（incidence rate）= 4月新發病例數 / 月初易感犬隻數。依選項推估約為10%。（需對照原試卷數據確認）","we":["5% 若依選項推算可能對應較少新發病例的計算，需查核原始數據。","（正確）依原試卷情境，4月發生率最接近10%。","15% 超過本題設定的發生率計算結果。","20% 為月盛行率相關計算，非月發生率。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_1_公衛_080","year":2019,"roc_year":108,"session":"1","examNo":80,"q":"承上題，此犬舍在4月的傳染性氣管支氣管炎盛行率為何？","opts":["A. 5%","B. 10%","C. 15%","D. 20%"],"ans":3,"exp":"本題承接Q79（圖表題）。4月的傳染性氣管支氣管炎盛行率（prevalence）= 4月底（或月中）所有患病犬 / 月初（或當時）所有犬隻數。盛行率通常高於同期發生率，依選項推估約為20%。（需對照原試卷數據確認）","we":["5% 為發生率估計，低於盛行率計算結果，不符題意。","10% 可能為發生率（Q79答案），而非盛行率。","15% 低於依題目條件計算的盛行率，不符。","（正確）4月盛行率（含月初既有病例+新發病例/所有犬隻）最接近20%。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_2_公衛_001","year":2019,"roc_year":108,"session":"2","examNo":1,"q":"某調查依所設定之盛行率為20%，在95%信心水準與估計誤差10%條件下，依此估計所需抽樣數為60。經調查\r  後呈現盛行率為40%，下列敘述何者正確？","opts":["A. 若所設定之統計條件不變，需增加樣本數","B. 在不增加樣本數之情況下，可能會造成盛行率估計值誤差變小","C. 若所設定之估計誤差及抽樣數不變，則信心程度百分比增加","D. 所需抽樣數隨著調查後結果之盛行率值，由10%～90%增加而遞增"],"ans":0,"exp":"樣本數公式 n = Z²×P×(1-P)/d²。原設定 P=0.2，n=60；實際 P=0.4，P×(1-P)=0.24，比 0.2×0.8=0.16 大，故所需樣本數增加（A正確）。盛行率估計所需樣本數在 P=50% 時最大，並非隨盛行率0-90%單調遞增（D錯）。","we":["（正確）當實際盛行率比預估高，P×(1-P)增大，維持相同統計條件需增加樣本數。","樣本數不變時，若實際盛行率偏高，估計誤差會增大而非變小。","樣本數與估計誤差不變時，信心程度不會因盛行率上升而增加。","所需樣本數在 P=50% 時達最大值，並非由0%到90%單調遞增。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_002","year":2019,"roc_year":108,"session":"2","examNo":2,"q":"針對100隻貓族群之弓蟲病調查，發現有50隻為抗體陽性，經6個月後再做一次調查，結果共有60隻呈現抗體陽\r  性，則此貓族群之弓蟲病年發生率約為何？（假定貓感染弓蟲病後100%產生終身抗體）","opts":["A. 10/50","B. 60/100","C. 16/25","D. 9/25"],"ans":0,"exp":"年發生率需以易感動物（尚未感染者）為分母。初查50隻陽性，故50隻為易感族群；6個月後新增10隻陽性，年化發生率 = (10/50)×(12/6) = 20/50，但題目取半年新發10例、易感50隻，最接近答案為 10/50（A）。（注意：若換算為年發生率需×2，但選項中 A=10/50 為最正確的計算基礎）","we":["（正確）分母為初始易感數50，分子為新增陽性10，計算發生率基礎為10/50。","60/100 為終末盛行率，非發生率；分母不應含舊有陽性個體。","16/25 計算來源有誤，未正確區分易感動物數與新發病數。","9/25 計算來源有誤，數值無法從題目資料推導出來。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_003","year":2019,"roc_year":108,"session":"2","examNo":3,"q":"某日本腦炎病毒診斷工具之敏感性與特異性均為90%，以此診斷工具檢測某豬場100隻豬隻血液檢體，結果顯\r  示豬隻血液中帶有日本腦炎病毒的盛行率為26%，則豬隻血液中帶有日本腦炎病毒的真實盛行率為何？","opts":["A. 26%","B. 20%","C. 32%","D. 10%"],"ans":1,"exp":"真實盛行率（AP）計算公式：AP = (表觀盛行率 + 特異性 - 1) / (敏感性 + 特異性 - 1) = (0.26 + 0.9 - 1) / (0.9 + 0.9 - 1) = 0.16 / 0.8 = 0.20 = 20%。","we":["26% 為表觀（診斷工具所測）盛行率，未校正診斷工具本身的誤差。","（正確）利用 Rogan-Gladen 公式校正後，真實盛行率約為 20%。","32% 為盲目加上誤差後的高估，未採用正確校正公式。","10% 低估，未正確套用盛行率校正公式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_004","year":2019,"roc_year":108,"session":"2","examNo":4,"q":"某研究要初步辨明吃牛肉與新庫賈氏病（new variant Creutzfeldt-Jakob Disease）的關係，選擇以病例對照研究\r  法進行較佳，其主要原因為何？","opts":["A. 可建立較佳之因果時序關係","B. 較不易產生偏差","C. 因新庫賈氏病發生率低","D. 較適合探討發生率"],"ans":2,"exp":"新庫賈氏病（nvCJD）極為罕見（低發生率），因此若以世代研究法追蹤需要非常大的樣本才能累積足夠病例，效率極低。病例對照研究從已知病例回溯暴露史，適合研究罕見疾病。","we":["病例對照研究為回溯性設計，因果時序關係較世代研究弱，非其優勢。","病例對照研究有選樣偏差、回憶偏差等問題，並非偏差較少。","（正確）nvCJD 極為罕見，病例對照研究能有效利用已有病例，是研究稀有疾病的首選。","病例對照研究計算的是勝算比，而非發生率，不適合探討發生率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_005","year":2019,"roc_year":108,"session":"2","examNo":5,"q":"下列有關干擾因子的敘述，何者錯誤？","opts":["A. 可能是危險因子","B. 不是危險因子與疾病間的中介因子","C. 與疾病發生有關","D. 與危險因子暴露無關"],"ans":3,"exp":"干擾因子（confounder）定義：①與疾病相關；②與暴露因子相關；③非暴露與疾病因果路徑上的中介因子。干擾因子必定與危險因子（暴露）有關，選項D「與危險因子暴露無關」是錯誤敘述。","we":["干擾因子可以同時是危險因子，A正確。","干擾因子不是因果路徑上的中介因子，B正確。","干擾因子必定與疾病發生有關，C正確。","（正確錯誤選項）干擾因子必須與危險因子暴露有關，「與危險因子暴露無關」是錯誤的敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_006","year":2019,"roc_year":108,"session":"2","examNo":6,"q":"在某些條件下病例對照研究所得之勝算比（OR）等同於世代研究所得之相對危險性（RR），下列何者不是條\r  件之一？","opts":["A. 有病者被選為病例組的機會與暴露有關","B. 密度抽樣","C. 稀有疾病","D. 沒病者被選為對照組的機會與暴露無關"],"ans":0,"exp":"OR 等同 RR 的條件：①稀有疾病（rare disease assumption）；②密度抽樣（density sampling）；③對照組選取與暴露無關（無選樣偏差）。「有病者被選為病例組的機會與暴露有關」會造成選樣偏差，是不應存在的條件，亦即此條件不成立時 OR≠RR，故A為「不是條件之一」（即此項為問題核心）。","we":["（正確）有病者被選為病例組的機會應與暴露無關，若與暴露有關即造成偏差，不符OR≈RR的前提。","密度抽樣是 OR≈RR 的條件之一，故 B 確實是條件。","稀有疾病假設是 OR≈RR 的傳統條件之一。","沒病者被選為對照組的機會與暴露無關是必要條件之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_007","year":2019,"roc_year":108,"session":"2","examNo":7,"q":"疾病盛行率會影響疾病診斷工具的那些指標？①陽性預測值 ②敏感性 ③陰性預測值 ④特異性","opts":["A. 僅①②","B. 僅②④","C. 僅③④","D. 僅①③"],"ans":3,"exp":"敏感性（sensitivity）= TP/(TP+FN）、特異性（specificity）= TN/(TN+FP），兩者由診斷工具本身特性決定，與疾病盛行率無關。陽性預測值（PPV）和陰性預測值（NPV）受盛行率影響，盛行率越高PPV越高、NPV越低。故盛行率影響①陽性預測值和③陰性預測值。","we":["①②表示陽性預測值與敏感性，敏感性不受盛行率影響，答案A錯。","②④表示敏感性與特異性，兩者均不受盛行率影響，答案B錯。","③④表示陰性預測值與特異性，特異性不受盛行率影響，答案C錯。","（正確）盛行率影響陽性預測值①與陰性預測值③，不影響敏感性與特異性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_008","year":2019,"roc_year":108,"session":"2","examNo":8,"q":"血清學診斷試驗結果，若偽陽性與偽陰性一樣重要時，在接受器操作特性曲線（receiver operating characteristic\r  curve）上，切點選擇以接近下列何者為佳？","opts":["A. 左上角","B. 右上角","C. 左下角","D. 右下角"],"ans":0,"exp":"ROC曲線橫軸為偽陽性率（1-特異性），縱軸為敏感性（真陽性率）。左上角代表敏感性高且偽陽性率低的理想點。當偽陽性與偽陰性同等重要時，最佳切點應選擇離左上角最近的點，以同時最大化敏感性並最小化偽陽性率。","we":["（正確）左上角（高敏感性、低偽陽性率）是 ROC 曲線上最佳的切點位置。","右上角代表高敏感性但偽陽性率極高（=1），並非理想切點。","左下角代表敏感性極低且偽陽性率極低，等同幾乎不診斷任何陽性。","右下角代表低敏感性且高偽陽性率，為最差的切點位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_009","year":2019,"roc_year":108,"session":"2","examNo":9,"q":"下列對葡萄球菌性食物中毒流行病學的敘述，何者最佳？","opts":["A. 病例流行曲線的建構中，代表時間以「天數」為單位","B. 適宜以盛行率來敘述個體發生疾病之機率","C. 侵襲率（attack rate）為該病經常使用之頻度測量","D. 病例流行曲線屬連鎖感染型（propagated epidemics），常有數個連續發病高峰"],"ans":2,"exp":"葡萄球菌性食物中毒屬點源爆發（point source epidemic），所有患者幾乎同時暴露於受污染食物，流行曲線呈單一尖峰，不屬連鎖感染型。侵襲率（attack rate）適用於有限時間的暴露性疾病爆發，是此型常用指標（C正確）。","we":["葡萄球菌食物中毒潛伏期約1-6小時，流行曲線時間單位應以「小時」而非「天數」為單位。","食物中毒為急性點源暴露，應用侵襲率描述，不適合用盛行率。","（正確）侵襲率是食物中毒等點源爆發中最常使用的頻度測量。","葡萄球菌食物中毒屬點源爆發，流行曲線只有單一高峰，非連鎖感染型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_010","year":2019,"roc_year":108,"session":"2","examNo":10,"q":"下列對母數檢定法（parametric test）的敘述，何者正確？","opts":["A. 常用於類別（nominal）與序位（ordinal）資料分析","B. 檢定資料的基本假設是常態分布","C. 屬於非量化測量數據的變異或分布的統計方法","D. 二項式分布測試（binomial test）屬於此檢定法"],"ans":1,"exp":"母數統計（parametric test）假設資料符合特定分布（通常為常態分布），適用於連續型量化資料（等距、等比尺度）。非母數統計才適用類別（nominal）和序位（ordinal）資料。二項式分布測試屬非母數（無母數）統計方法。","we":["類別與序位資料應使用非母數（無母數）統計，非母數檢定法。","（正確）母數檢定假設資料服從常態分布，此為其基本前提。","母數統計用於量化測量數據，非母數統計才用於非量化數據。","二項式分布測試屬非母數統計範疇，不屬於母數檢定法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_011","year":2019,"roc_year":108,"session":"2","examNo":11,"q":"下列有關疾病發生的量測，何者正確？","opts":["A. 發生率密度表示一特定時間內發生疾病之危險性","B. 累積發生率表示一特定時間內新病例發生的速度","C. 致死率高的疾病會因動物被淘汰而導致盛行率呈低值","D. 致死率較適合用來描述慢性疾病，表示疾病之嚴重程度"],"ans":2,"exp":"致死率（case fatality rate）高的急性疾病，病程短，病畜迅速死亡或被淘汰，族群中病例持續時間短，因此盛行率會呈低值。發生率密度（incidence density）是單位動物-時間的新病例速率；累積發生率是特定時間內新病例的比例。","we":["發生率密度（incidence density）表示單位動物-時間的新病例速率，非「特定時間內發生疾病之危險性」。","累積發生率表示特定時間內發生新病例的比例（危險性），不是速度。","（正確）急性高致死率疾病使病例快速消失（死亡/淘汰），導致盛行率偏低。","致死率較適合描述急性疾病的嚴重度，慢性病常用盛行率或存活率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_012","year":2019,"roc_year":108,"session":"2","examNo":12,"q":"下列有關疾病的發生和分布的敘述，何者正確？","opts":["A. 若疾病的發生是可預期，則屬於流行性（epidemic）疾病","B. 疾病在族群中零星的發生，且數量維持在歷年平均範圍內，屬於地方性（endemic）疾病","C. 潛伏期長的流行病曲線呈左傾（positively skewed）","D. 若已知潛伏期，繪製流行病曲線可推估暴露的時間"],"ans":3,"exp":"疾病在族群中零星發生且維持歷年平均範圍屬地方性（endemic）疾病（B正確）。流行病曲線與潛伏期有關：潛伏期長的流行，高峰較晚出現，曲線右偏（right-skewed/正偏態）。由流行病曲線減去潛伏期可回推暴露時間（D正確）。","we":["可預期、規律性的疾病發生屬地方性（endemic），非流行性（epidemic）。","零星發生且數量在歷年平均範圍內屬地方性疾病，B正確。","潛伏期長的流行病曲線高峰延後，呈右偏（正偏態），非左傾。","（正確）已知潛伏期後，可由流行曲線的發病高峰回推推估暴露時間點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_013","year":2019,"roc_year":108,"session":"2","examNo":13,"q":"下列有關疾病被動監控（passive surveillance）和主動監控（active surveillance）的比較，何者錯誤？","opts":["A. 主動監控無法正確預估疾病發生的頻度","B. 被動監控只對族群中臨床表現異常個體進行檢測","C. 被動監控常是發現新病例和新興疾病的第一步","D. 主動監控通常花費較高"],"ans":0,"exp":"主動監控（active surveillance）主動蒐集所有動物（包含無症狀者）的資料，能更正確地估計疾病頻度；被動監控依賴自願通報，容易低估。A說「主動監控無法正確預估」是錯誤的，主動監控正是較能正確估計發生頻度的方式。","we":["（正確錯誤選項）主動監控能更正確估計疾病頻度，A的敘述是錯誤的。","被動監控確實只對臨床表現異常（通報）個體進行，B正確。","被動監控依賴臨床獸醫師通報，確實是發現新病例與新興疾病的第一步，C正確。","主動監控需投入人力主動調查，確實花費較高，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_014","year":2019,"roc_year":108,"session":"2","examNo":14,"q":"有關病例對照研究中對照組之選擇，下列何者正確？","opts":["A. 對照組應來自與病例組不同的地區","B. 隨機分配有助於病例與對照的可比較性","C. 匹配（matching）後須進一步分層分析以減少干擾偏差","D. 最好先確定對照組的狀況與結果（疾病）相關"],"ans":2,"exp":"病例對照研究中，匹配（matching）後必須以配對設計的條件分析（如 Mantel-Haenszel 或條件式 logistic regression）進行，以控制匹配因子的干擾，C正確（匹配後進行分層分析是正確做法）。對照組應來自與病例組相同的來源族群；最好確定對照組與結果（疾病）無關。","we":["對照組應來自與病例組相同的地區及族群，而非不同地區。","隨機分配是臨床試驗的手段，非病例對照研究的設計要素。","（正確）匹配後應進行分層分析（或配對分析）以正確控制干擾因子。","應確認對照組與「疾病（結果）無關」，而非「與疾病相關」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_015","year":2019,"roc_year":108,"session":"2","examNo":15,"q":"針對鉤端螺旋體病的一次流行病學調查，初期發現1,000名居民中有300名呈現抗體陽性，進一步追蹤調查共\r   有200名確診新發生抗體陽轉病例。若在調查期間此族群中死亡人數共計40名，死亡者中計有10人因鉤端螺旋  體病而死亡，則鉤端螺旋體病所占死亡百分率（proportional mortality rate）為何？","opts":["A. 0.04","B. 0.05","C. 0.20","D. 0.25"],"ans":3,"exp":"死亡百分率（proportional mortality rate）= 特定原因死亡數 / 同期總死亡數 = 10/40 = 0.25。","we":["0.04 = 10/1000×4，誤以總族群為分母。","0.05 = 10/200，誤以新發病例數為分母。","0.20 計算依據不明，無法從題目資料推導。","（正確）死亡百分率 = 鉤端螺旋體死亡數10 / 總死亡數40 = 0.25。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_016","year":2019,"roc_year":108,"session":"2","examNo":16,"q":"有關疾病監測計畫與診斷試驗的使用，下列敘述何者正確？","opts":["A. 診斷試驗的敏感性愈高，所得的偽陰性結果愈少","B. 在疾病清除計畫的初期，應使用特異性較高的診斷試劑，儘可能找出感染的動物","C. 在疾病清除計畫的末期，因疾病盛行率已降低，原本所使用的診斷試劑敏感性亦會隨之降低","D. 診斷試驗的特異性愈高，所得的陰性預期值愈高"],"ans":0,"exp":"敏感性越高，真陽性比例越高，偽陰性就越少（A正確）。疾病清除計畫初期盛行率較高，應使用敏感性較高的試劑以找出盡量多的感染動物；末期盛行率降低，陽性預測值反而下降，需提高特異性。敏感性與特異性是診斷工具本身的特性，不隨盛行率改變。","we":["（正確）敏感性越高，偽陰性（漏診）越少，A正確。","疾病清除計畫初期應用高敏感性試劑以找出所有感染者，非高特異性。","敏感性與特異性為診斷工具固有特性，不隨盛行率降低而改變。","特異性越高，偽陽性越少，陽性預測值（非陰性預測值）才會提高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_017","year":2019,"roc_year":108,"session":"2","examNo":17,"q":"某藥廠評估新藥對犬黑色素瘤的治癒效果，臨床試驗設計治療組及對照組的犬隻數皆為96隻，結果顯示治療\r   組的死亡率為45%，對照組的死亡率為60%。假定沒有受試對象退出且此研究達統計學上顯著意義，則若欲  減少1個死亡個案的產生，應以新藥治療多少隻罹病犬？","opts":["A. 15","B. 60","C. 45","D. 7"],"ans":3,"exp":"需治療數（NNT）= 1 / (ARR) = 1 / (對照組死亡率 - 治療組死亡率) = 1 / (0.60 - 0.45) = 1/0.15 ≈ 6.67 ≈ 7。即約治療7隻即可減少1個死亡。","we":["15 為對照組與治療組死亡率差的百分點數，非 NNT。","60 為對照組死亡率百分比，非 NNT。","45 為治療組死亡率百分比，非 NNT。","（正確）NNT = 1/(0.60-0.45) = 1/0.15 ≈ 7隻，治療7隻可預防1個死亡。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_018","year":2019,"roc_year":108,"session":"2","examNo":18,"q":"假定某一種疾病的預期盛行率為10%，在95%信心水準及容許的錯誤率5%假設下，依z值為2計算所需的樣本\r   數為下列何者？","opts":["A. 144","B. 100","C. 85","D. 72"],"ans":0,"exp":"樣本數公式 n = Z² × P × (1-P) / d² = 4 × 0.1 × 0.9 / 0.05² = 4 × 0.09 / 0.0025 = 0.36 / 0.0025 = 144。","we":["（正確）n = (2)² × 0.1 × 0.9 / (0.05)² = 4 × 0.09 / 0.0025 = 144。","100 未正確套用公式，低估了所需樣本數。","85 未正確套用公式，計算有誤。","72 未正確套用公式，計算有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_019","year":2019,"roc_year":108,"session":"2","examNo":19,"q":"獸醫流行病學三角關係（classic epidemiological triad）會影響動物疾病的可能性，下列何者不包含在內？","opts":["A. 宿主動物","B. 動物飼主","C. 病原","D. 環境"],"ans":1,"exp":"流行病學三角（epidemiological triad）由宿主（host）、病原（agent）和環境（environment）三要素構成，此為傳染病發生的經典模型。動物飼主（owner）不是三角關係的組成要素。","we":["宿主動物是流行病學三角的「宿主（host）」要素，屬於三角關係之一。","（正確）動物飼主不是流行病學三角的三要素之一，不包含在內。","病原（agent）是流行病學三角三要素之一。","環境（environment）是流行病學三角三要素之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_020","year":2019,"roc_year":108,"session":"2","examNo":20,"q":"下列何種研究方法可以得知個體於調查時是否同時有病及正暴露於假定的危險因子，但對於危險因子和疾病\r  是否為因果關係則需要更多的訊息才能判別？","opts":["A. 世代研究法（cohort study）","B. 病例對照法（case-control study）","C. 橫斷式研究法（cross-sectional study）","D. 臨床試驗（clinical trial）"],"ans":2,"exp":"橫斷式研究（cross-sectional study）在同一時間點測量個體的疾病狀態與危險因子暴露情況，可同時得知個體是否有病及是否暴露於危險因子，但因缺乏時間順序，無法直接判斷因果關係。","we":["世代研究法（cohort study）先確定暴露再追蹤疾病，能建立時序關係，非同時測量。","病例對照法從已知結果（疾病）回溯暴露史，非同時測量暴露與疾病。","（正確）橫斷式研究同時調查疾病狀態與暴露情況，但無法確立因果時序。","臨床試驗是實驗性研究設計，研究者主動介入，非描述性調查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_021","year":2019,"roc_year":108,"session":"2","examNo":21,"q":"在一研究中，發現多氯聯苯的濃度越高，老鼠的肝脂肪堆積或惡性肝腫瘤的比率越高，因此認為多氯聯苯是\r  致病因子。此推論是依照下列何種處理原則？","opts":["A. 一致法（method of agreement）","B. 差異法（method of difference）","C. 類推法（method of analogy）","D. 共同因素差異法（method of concomitant variation）"],"ans":3,"exp":"共同因素差異法（method of concomitant variation）：當某因子（多氯聯苯濃度）變化時，結果（肝腫瘤比率）也隨之變化，呈現劑量-反應關係，即可推論此因子為致病原因。","we":["一致法是指在多種不同情況下，唯一共同因素即為原因，不符本題劑量反應概念。","差異法是比較有、無某因素的兩組，觀察結果差異，不強調劑量關係。","類推法是根據類似情況進行推論，本題未涉及類比情況。","（正確）多氯聯苯濃度越高、腫瘤比率越高，符合共同因素差異法（劑量-反應關係）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_022","year":2019,"roc_year":108,"session":"2","examNo":22,"q":"依據屠宰衛生檢查規則，下列那些家禽疾病屠體、內臟應全部判定不合格，不得供食用？①馬立克病 ②局\r  部雞痘之病變組織 ③局部性萎縮 ④雞白血病","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":3,"exp":"依屠宰衛生檢查規則，馬立克病（Marek's disease）和雞白血病（Avian leukosis）均為家禽全身性腫瘤性疾病，屠體及內臟應全部判定不合格。局部雞痘只需廢棄病變組織；局部性萎縮只廢棄受影響部位。","we":["僅①②（馬立克病＋局部雞痘）：局部雞痘僅廢棄病變組織，非全部判廢，組合錯誤。","僅②③（局部雞痘＋局部性萎縮）：兩者均屬局部病變，僅廢棄局部，非全部判廢。","僅③④（局部性萎縮＋雞白血病）：局部性萎縮屬局部廢棄，非全部判廢，組合錯誤。","（正確）馬立克病①與雞白血病④均為全身性腫瘤疾病，屠體及內臟應全部判廢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_023","year":2019,"roc_year":108,"session":"2","examNo":23,"q":"依據食品安全衛生管理法，食品業者所持有之屠體、內臟及其分切物之運送、貯存、販賣之衛生管理，由下\r  列何機關負責？","opts":["A. 經濟主管機關","B. 衛生主管機關","C. 工業主管機關","D. 農業主管機關"],"ans":1,"exp":"依食品安全衛生管理法，食品業者持有屠體、內臟及其分切物的運送、貯存、販賣衛生管理，屬於食品流通環節，由衛生主管機關（衛福部食藥署及地方衛生局）負責管理。","we":["經濟主管機關主管工商事務，非肉品衛生管理。","（正確）食品安全衛生管理法明定屠體流通環節的衛生由衛生主管機關負責。","工業主管機關主管工業生產，非食品衛生。","農業主管機關（農委會防檢局）負責屠宰場及屠宰衛生檢查，非後端流通衛生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_024","year":2019,"roc_year":108,"session":"2","examNo":24,"q":"依據屠宰場設置標準，預冷室之空間維持每2公尺吊軌吊掛豬隻與牛隻屠體數量各為何？","opts":["A. 豬體3頭以下或牛體1頭以下","B. 豬體4頭以下或牛體2頭以下","C. 豬體5頭以下或牛體1頭以下","D. 豬體6頭以下或牛體3頭以下"],"ans":0,"exp":"依屠宰場設置標準，預冷室每2公尺吊軌之容量：豬體3頭以下，牛體1頭以下，以維持適當冷藏效果及空氣流通。","we":["（正確）依法規，每2公尺吊軌：豬體3頭以下或牛體1頭以下。","4頭豬/2頭牛密度過高，不符法規規定。","豬體5頭已超過法定上限。","豬體6頭、牛體3頭均超過法定上限，嚴重違規。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_025","year":2019,"roc_year":108,"session":"2","examNo":25,"q":"下列有關動物輸出入檢疫法規事項，何者錯誤？","opts":["A. 中央主管機關得訂定檢疫物之檢疫條件及公告外國動物傳染病之疫區與非疫區，以禁止或管理檢疫物之輸   出入","B. 輸出檢疫物若經中央主管機關認為國際檢疫上有必要者，應申請檢疫","C. 執行檢疫時，對整批動物得個別為之；對動物以外檢疫物，應整批為之。檢疫不合格者，得申請複檢","D. 由國外裝運動物之進口船隻駛抵港外時，應依照國際慣例豎立動物檢疫信號"],"ans":2,"exp":"依動物輸出入檢疫法規，執行檢疫時：對整批動物得「逐批」（非個別）或「個別」為之（視情況而定）；對動物以外的檢疫物應整批為之。C選項「對整批動物得個別為之；對動物以外應整批」描述錯誤，動物檢疫通常是整批或抽樣，而非強制逐一個別。","we":["中央主管機關確可訂定檢疫條件並公告疫區，A正確。","輸出檢疫物若被認定有必要應申請檢疫，B正確。","（正確錯誤選項）動物輸入檢疫通常整批進行，C的描述有誤。","進口動物船隻依國際慣例應豎立檢疫信號，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_026","year":2019,"roc_year":108,"session":"2","examNo":26,"q":"依據畜牧法，屠宰場設置標準係由中央相關機關會同定之，但不包括下列何單位？","opts":["A. 中央農業主管機關","B. 中央衛生主管機關","C. 中央工業主管機關","D. 中央環境保護主管機關"],"ans":2,"exp":"依畜牧法，屠宰場設置標準由中央農業主管機關（農委會）會同中央衛生主管機關（衛福部）及中央環境保護主管機關共同訂定，不包含中央工業主管機關（經濟部工業局）。","we":["中央農業主管機關參與訂定屠宰場設置標準，A正確，不符題意。","中央衛生主管機關參與訂定，B正確，不符題意。","（正確）中央工業主管機關不在共同訂定屠宰場設置標準的單位之列。","中央環境保護主管機關參與訂定，D正確，不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_027","year":2019,"roc_year":108,"session":"2","examNo":27,"q":"依據畜牧法規定，屠宰應申請中央主管機關派員執行屠宰衛生檢查；其檢查之情形及其他應遵行事項之規\r  則，係由中央主管機關會同下列那一單位訂定？","opts":["A. 財團法人中央畜產會","B. 中央衛生主管機關","C. 中央環境保護主管機關","D. 行政院農業委員會家畜衛生試驗所"],"ans":1,"exp":"依畜牧法，屠宰衛生檢查規則由中央農業主管機關（農委會）會同中央衛生主管機關（衛福部）共同訂定，以確保屠宰衛生同時兼顧動物衛生與食品安全兩個面向。","we":["財團法人中央畜產會為民間機構，非法規共同訂定單位。","（正確）屠宰衛生檢查規則由農委會會同衛生主管機關（衛福部）共同訂定。","中央環境保護主管機關不參與屠宰衛生檢查規則的訂定。","家畜衛生試驗所為研究機構，非法規共同訂定單位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_028","year":2019,"roc_year":108,"session":"2","examNo":28,"q":"依據違法屠宰行為查緝作業要點，各直轄市及縣（市）政府應組成「違法屠宰聯合查緝小組」，下列何者不\r  是查緝小組之職責？","opts":["A. 受理檢舉家畜不在指定屠宰場屠宰及未經屠宰衛生檢查屠體或內臟案件","B. 蒐集家畜不在指定屠宰場屠宰及未經屠宰衛生檢查屠體或內臟情報","C. 在屠宰場執行屠宰衛生檢查工作","D. 協調有關機關對不在指定屠宰場屠宰及未經屠宰衛生檢查屠體或內臟之舉發、查緝等有關事宜"],"ans":2,"exp":"依違法屠宰查緝作業要點，聯合查緝小組負責受理檢舉、蒐集情報、協調相關機關查緝等工作。「在屠宰場執行屠宰衛生檢查工作」是屠宰場派駐屠宰衛生檢查獸醫師的職責，不是查緝小組的職責。","we":["受理違法屠宰檢舉案件是查緝小組職責之一。","蒐集違法屠宰情報是查緝小組職責之一。","（正確）在屠宰場執行屠宰衛生檢查是屠宰衛生檢查人員的職責，非查緝小組。","協調有關機關進行查緝是查緝小組職責之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_029","year":2019,"roc_year":108,"session":"2","examNo":29,"q":"依據獸醫師法暨其施行細則，獸醫診療機構所作之診療紀錄及檢驗紀錄的保存年限是幾年？","opts":["A. 1","B. 3","C. 5","D. 10"],"ans":2,"exp":"依獸醫師法及施行細則，獸醫診療機構所作的診療紀錄及檢驗紀錄應保存至少3年，以備主管機關查驗及醫療糾紛參考。","we":["1年保存期過短，不符獸醫師法規定。","2年保存期不足，不符獸醫師法規定。","（正確）依獸醫師法規定，診療紀錄應保存3年。","10年保存期過長，超出法規要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_030","year":2019,"roc_year":108,"session":"2","examNo":30,"q":"屠宰作業準則是依據何種母法所訂定的？","opts":["A. 畜牧法","B. 食品衛生管理法","C. 獸醫師法","D. 動物傳染病防治條例"],"ans":0,"exp":"屠宰作業準則是依據畜牧法（民國86年修正版）授權所訂定的子法規，規範屠宰場的各項作業程序與衛生要求，其母法為畜牧法。","we":["（正確）屠宰作業準則依畜牧法授權訂定，畜牧法為其母法。","食品衛生管理法（現稱食品安全衛生管理法）規範食品業者，屠宰作業不在其主要授權範圍。","獸醫師法規範獸醫師職業，非屠宰作業的母法。","動物傳染病防治條例規範動物疾病防治，非屠宰作業的主要母法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_031","year":2019,"roc_year":108,"session":"2","examNo":31,"q":"依據屠宰衛生檢查規則，家畜具有下列何種情形時，不得施以緊急屠宰？","opts":["A. 患有經中央主管機關認定之感染性急症者","B. 施以外科或產科手術者","C. 運輸緊迫顯呈衰弱者","D. 難產、子宮脫、產褥麻痺或急性鼓脹者"],"ans":0,"exp":"依屠宰衛生檢查規則，緊急屠宰（emergency slaughter）適用於難產、運輸緊迫衰弱、外科或產科手術後等無法正常程序屠宰的情況。但患有中央主管機關認定之感染性急症（如法定傳染病）者，不得施以緊急屠宰，應予撲殺或其他處置。","we":["（正確）患有感染性急症（法定傳染病）者不得緊急屠宰，以防止病原流入食物鏈。","施以外科或產科手術後需緊急屠宰者，可申請緊急屠宰。","運輸緊迫顯呈衰弱者可申請緊急屠宰。","難產、子宮脫、產褥麻痺或急性鼓脹者可申請緊急屠宰。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_032","year":2019,"roc_year":108,"session":"2","examNo":32,"q":"依據屠宰作業準則，下列經判定為廢棄之屠體及內臟之處理，何者錯誤？","opts":["A. 應使用有蓋且明顯標示之裝盛容器","B. 在作業結束後，裝盛容器需於固定場所清洗並消毒","C. 應經適當處理並防止流為食用","D. 處理記錄應保存2年以上"],"ans":3,"exp":"依屠宰作業準則，廢棄屠體及內臟處理紀錄應保存至少3年以上（非2年），以供主管機關查核。其餘容器應加蓋、明顯標示、作業後清洗消毒、防止流為食用等規定均屬正確。","we":["廢棄物容器應有蓋且明顯標示，A正確。","容器於作業結束後應在固定場所清洗消毒，B正確。","廢棄屠體應經適當處理並防止流為食用，C正確。","（正確錯誤選項）處理記錄應保存3年以上，非2年，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_033","year":2019,"roc_year":108,"session":"2","examNo":33,"q":"依據臺灣動物用藥殘留標準，蛋品之monensin殘留容許量規定為何？","opts":["A. 容許量為0.01 ppm","B. 容許量為0.1 ppm","C. 容許量為1 ppm","D. 免訂容許量"],"ans":3,"exp":"依台灣動物用藥殘留標準，莫能黴素（monensin）為離子載體類抗球蟲藥，在蛋品（eggs）中規定免訂容許量（即不得檢出/豁免訂定），以保障蛋品安全。","we":["0.01 ppm 為某些藥物的一般限量標準，非 monensin 蛋品規定。","0.1 ppm 不符 monensin 蛋品的法規規定。","1 ppm 不符 monensin 蛋品的法規規定。","（正確）Monensin 在蛋品中規定免訂容許量（不得殘留/豁免）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_034","year":2019,"roc_year":108,"session":"2","examNo":34,"q":"依據屠宰作業準則，下列有關家禽屠宰作業之敘述，何者錯誤？","opts":["A. 脫毛不完全時不可取內臟","B. 屠體於取內臟前須先清洗乾淨","C. 取內臟前掛鉤不需更換","D. 取內臟時應避免挖破內臟"],"ans":2,"exp":"依屠宰作業準則，取內臟前掛鉤（shackles）應更換或消毒，以防止交叉污染；脫毛不完全時不可取內臟；取內臟前須先清洗屠體；取內臟時避免挖破內臟。C選項說「取內臟前掛鉤不需更換」是錯誤的。","we":["脫毛不完全時不可取內臟，A正確（符合規定）。","取內臟前需先清洗屠體，B正確（符合規定）。","（正確錯誤選項）取內臟前掛鉤應更換或消毒，C的「不需更換」是錯誤的。","取內臟時應避免挖破內臟，D正確（符合規定）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_035","year":2019,"roc_year":108,"session":"2","examNo":35,"q":"下列何者是造成狂牛症主要的病原？","opts":["A. prion","B. virus","C. Taenia saginata","D. mycotoxin"],"ans":0,"exp":"狂牛症（BSE，牛海綿狀腦病）的主要病原是 prion（普立昂蛋白），屬異常折疊的蛋白質，非病毒或細菌，可抵抗一般消毒及高溫處理。","we":["（正確）狂牛症由 prion（錯誤折疊的 PrPSc 蛋白）所引起，非病毒。","Virus（病毒）有核酸，可被核酸檢測發現，BSE 不含核酸，非病毒。","Taenia saginata（牛絛蟲）是寄生蟲，與 BSE 無關。","Mycotoxin（黴菌毒素）為真菌代謝產物，與 BSE 無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_036","year":2019,"roc_year":108,"session":"2","examNo":36,"q":"動物屠宰後產生僵直情形與下述何者有關？","opts":["A. 膽固醇","B. 胺基酸","C. 乳酸","D. 水分"],"ans":2,"exp":"動物屠宰後，肌肉中的糖原（glycogen）在無氧狀態下被分解為乳酸（lactic acid），pH值下降，使肌動蛋白與肌球蛋白形成肌動球蛋白複合體，引發死後僵直（rigor mortis）。","we":["膽固醇與肌肉收縮及僵直無關。","胺基酸是蛋白質水解產物，與僵直初期過程無關。","（正確）乳酸是糖原無氧代謝的產物，pH下降導致肌蛋白結合，引起僵直。","水分雖影響肉品保水性，但不是引發僵直的主要物質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_037","year":2019,"roc_year":108,"session":"2","examNo":37,"q":"根據食品安全管制系統所規定之危害分析重要管制點制度（hazard analysis and critical control point system；\r   HACCP），所謂熟煮是指針對家畜及家禽肉品之加熱煮熟過程，其中心溫度應各達攝氏多少度以上？","opts":["A. 68、70","B. 70、72","C. 72、72","D. 72、74"],"ans":3,"exp":"依食品安全管制系統（HACCP），熟煮中心溫度要求：家畜肉（豬、牛等）應達72°C以上；家禽肉（雞、鴨等）因 Salmonella 風險較高，應達74°C以上。","we":["68°C/70°C 均低於 HACCP 對家畜及家禽的標準要求。","70°C/72°C：家禽72°C不足，家禽應達74°C以上。","72°C/72°C：家禽應達74°C，72°C不足。","（正確）家畜72°C以上、家禽74°C以上，符合HACCP規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_038","year":2019,"roc_year":108,"session":"2","examNo":38,"q":"下列有關肉製品導致肉毒桿菌中毒之敘述，何者錯誤？","opts":["A. 主要原因為肉毒桿菌（Clostridium botulinum）造成","B. 預防方式可將產品之水活性調整至0.85以上","C. 因吃入膨脹肉罐頭製品","D. 中毒者有局部或全身性的麻痺與相關神經症狀"],"ans":1,"exp":"肉毒桿菌（Clostridium botulinum）為厭氧菌，在低氧環境（如罐頭）中產毒，預防方式需降低水活性（aw）至0.85以下（而非以上），aw>0.85仍可能讓肉毒桿菌生長。故B「調整水活性至0.85以上」是錯誤的。","we":["Clostridium botulinum 確為肉毒桿菌食物中毒的主因，A正確。","（正確錯誤選項）應將水活性降至0.85以下（not 以上）以抑制肉毒桿菌，B錯誤。","膨脹肉罐頭因產氣（H₂/CO₂）而膨脹，食入可能造成中毒，C正確。","肉毒毒素為神經毒素，造成局部或全身性麻痺及神經症狀，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_039","year":2019,"roc_year":108,"session":"2","examNo":39,"q":"下列何種人畜共通傳染病原不常藉由雞肉傳染？","opts":["A. Listeria monocytogenes","B. Salmonella enterica","C. Taenia solium","D. Campylobacter jejuni"],"ans":2,"exp":"Taenia solium（有鉤絛蟲/豬肉絛蟲）的中間宿主為豬，非雞，因此不常藉由雞肉傳染給人。Listeria monocytogenes、Salmonella enterica、Campylobacter jejuni 均可見於雞肉。","we":["Listeria monocytogenes 可污染雞肉及其他禽肉，常見傳染途徑之一。","Salmonella enterica（尤其 Enteritidis 型）是雞肉及雞蛋最重要的食因性病原。","（正確）Taenia solium（有鉤絛蟲）中間宿主為豬，非雞，不經雞肉傳染。","Campylobacter jejuni 是雞肉最常見的人畜共通細菌性病原之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_040","year":2019,"roc_year":108,"session":"2","examNo":40,"q":"臺灣雞隻屠宰過程中，屠檢獸醫師會在下列那兩個步驟後分別進行檢查？","opts":["A. 電昏；放血","B. 吊掛；取出內臟","C. 繫留；取出內臟","D. 吊掛；電昏"],"ans":1,"exp":"臺灣雞隻屠宰流程：吊掛→電昏→放血→燙毛→脫毛→取出內臟→洗滌→冷卻。屠宰衛生檢查獸醫師分別於「繫留（吊掛前）」進行屠前（活體）檢查，以及「取出內臟」後進行屠後（屠體及內臟）檢查，共兩個關鍵步驟。","we":["電昏是麻醉步驟，放血在其後進行，這兩步驟之間非獸醫師檢查的主要時機。","（正確）獸醫師在「繫留（屠前活體檢查）」及「取出內臟後（屠後內臟及屠體檢查）」各進行一次檢查。","繫留後取出內臟前並無單獨的獸醫師進行的「吊掛後」獨立檢查步驟。","吊掛與電昏均為屠宰操作步驟，非獸醫師的屠前/屠後檢查關鍵時機。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_041","year":2019,"roc_year":108,"session":"2","examNo":41,"q":"下列何者不是肉品加工技術「鹽漬（curing）」中使用亞硝酸鹽的主要目的？","opts":["A. 抑制肉毒桿菌","B. 增加營養價值","C. 固定肉色","D. 賦予特殊風味"],"ans":1,"exp":"亞硝酸鹽在肉品鹽漬（curing）中的主要功能：①抑制肉毒桿菌（Clostridium botulinum）生長；②與肌紅蛋白結合形成亞硝基肌紅蛋白（nitrosomyoglobin），固定肉色（粉紅色）；③賦予醃肉特殊風味。亞硝酸鹽不能增加肉品的營養價值。","we":["抑制肉毒桿菌是亞硝酸鹽鹽漬的主要目的之一，A正確。","（正確）亞硝酸鹽不能增加肉品營養價值，此非其使用目的。","固定肉品粉紅色（形成亞硝基肌紅蛋白）是鹽漬的主要目的之一，C正確。","賦予醃肉特殊風味也是鹽漬使用亞硝酸鹽的目的之一，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_042","year":2019,"roc_year":108,"session":"2","examNo":42,"q":"生乳殺菌之巴斯德處理法中，高溫短時間法（high temperature short time method）的條件為何？","opts":["A. 80℃，1～3秒","B. 60℃，15秒","C. 70℃，15秒","D. 70℃，1～3秒"],"ans":2,"exp":"巴斯德高溫短時間法（HTST）：72°C（71.7°C）加熱15秒。低溫長時間法（LTLT）：63°C，30分鐘。超高溫瞬間殺菌（UHT）：135°C，2-4秒。","we":["80°C/1-3秒過高，屬超高溫範疇（UHT通常>135°C）。","60°C/15秒溫度偏低，不符 HTST 標準（應為72°C）。","（正確）HTST 巴斯德殺菌法：72°C（或71.7°C），保持15秒。","70°C/1-3秒時間過短，不符 HTST 標準（應為15秒）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_043","year":2019,"roc_year":108,"session":"2","examNo":43,"q":"保持魚產品在低溫或冷凍狀態，可抑制下列何種物質的產生，降低中毒的機率？","opts":["A. 組織胺","B. 亞硝胺","C. 酪酸胺","D. 精胺酸"],"ans":0,"exp":"魚類腐敗時，含組氨酸豐富的魚（如鮪魚、鯖魚等）在細菌（如Morganella morganii）的作用下，組氨酸脫羧產生組織胺（histamine），引發鯖魚中毒（Scombroid poisoning）。低溫/冷凍可有效抑制細菌增殖，防止組織胺累積。","we":["（正確）組織胺由細菌分解組氨酸而產生，低溫冷凍可抑制此過程，降低中毒風險。","亞硝胺主要由亞硝酸鹽與胺類在高溫或酸性環境中形成，非低溫冷凍的主要抑制目標。","酪酸胺（tyramine）存在於熟成乳酪等食品，非魚類低溫保鮮的主要控制目標。","精胺酸為胺基酸，並非食物中毒毒素，低溫儲存不特別針對此物質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_044","year":2019,"roc_year":108,"session":"2","examNo":44,"q":"依據CAS蛋品項目驗證基準，洗淨生鮮蛋品所使用的水溫應為何？","opts":["A. 低於蛋溫攝氏5度","B. 等同蛋溫","C. 高於蛋溫攝氏5～10度","D. 高於蛋溫攝氏15～25度"],"ans":2,"exp":"依CAS蛋品驗證基準，洗選蛋時水溫應高於蛋溫攝氏5～10度，以形成正壓防止污水滲入蛋殼毛細孔，避免微生物污染蛋內。","we":["水溫低於蛋溫5度，蛋殼毛細孔會因冷縮而將污水吸入，增加污染風險。","水溫等同蛋溫時無壓力差，無法有效防止滲入。","（正確）水溫高於蛋溫5-10度，蛋內壓力大於外部，防止污水及細菌滲入。","水溫高於蛋溫15-25度過高，可能對蛋品品質造成影響，超過法規推薦範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_045","year":2019,"roc_year":108,"session":"2","examNo":45,"q":"下列有關引起食物中毒腸炎弧菌（Vibrio parahemolyticus）之敘述，何者錯誤？","opts":["A. 可於0.5%～8%食鹽濃度的環境下生存","B. 潛伏期一般約12～15小時","C. 中毒時引起強烈腹痛、下痢與嘔吐","D. 嗜酸性菌"],"ans":3,"exp":"腸炎弧菌（Vibrio parahaemolyticus）為嗜鹽性（halophilic）菌，在含鹽環境中生長，屬嗜鹽菌而非嗜酸菌（acidophilic）。故D「嗜酸性菌」是錯誤敘述。","we":["腸炎弧菌可在0.5%-8%食鹽濃度中存活，屬嗜鹽菌，A正確。","腸炎弧菌潛伏期通常4-96小時，平均約12-24小時，B大致正確。","中毒症狀包括強烈腹痛、下痢（水樣便）和嘔吐，C正確。","（正確錯誤選項）腸炎弧菌為嗜鹽菌（halophilic），非嗜酸性菌（acidophilic），D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_046","year":2019,"roc_year":108,"session":"2","examNo":46,"q":"乳房炎乳就其成分性質而言，下列敘述何者錯誤？","opts":["A. 為酒精試驗陽性乳，呈低酸或高酸","B. 其乳糖、酪蛋白、無脂固形物較高","C. 其球蛋白、氯、鈉、體細胞增多","D. 其酵素（如：磷酸脂酶）活性較高"],"ans":1,"exp":"乳房炎乳特徵：體細胞（白血球）增加、球蛋白增加、Na及Cl增加；但乳糖、酪蛋白、無脂固形物（SNF）因乳腺組織受損而降低，而非升高。故B「乳糖、酪蛋白、無脂固形物較高」是錯誤敘述。","we":["乳房炎乳為酒精試驗陽性，且因緩衝能力改變呈低酸或高酸，A正確。","（正確錯誤選項）乳房炎乳中乳糖、酪蛋白、無脂固形物下降，B為錯誤敘述。","球蛋白（免疫球蛋白）、Cl、Na、體細胞（白血球）均上升，C正確。","各種酵素（如磷酸酶、蛋白酶、脂酶）活性在乳房炎乳中較高，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_047","year":2019,"roc_year":108,"session":"2","examNo":47,"q":"下列何者在經由乳或乳製品傳給人之疾病中屬於二次污染性病原？","opts":["A. 結核菌","B. 布氏桿菌","C. 鉤端螺旋體","D. 傷寒菌"],"ans":3,"exp":"傷寒菌（Salmonella Typhi）為人類腸道中存在的病原，可污染乳品（人為二次污染），屬「二次污染性病原」（secondary contaminant）。結核菌、布氏桿菌、鉤端螺旋體均為感染動物自然排出於乳汁中，屬初次（原發性）污染。","we":["結核菌（Mycobacterium bovis）由感染牛自然排入乳汁，屬原發性污染。","布氏桿菌（Brucella）由感染動物排入乳汁，屬原發性污染。","鉤端螺旋體由感染動物排出污染牧場環境及乳汁，屬原發性污染。","（正確）傷寒菌為人類腸道病原，透過帶菌者接觸（人為污染）傳入乳品，屬二次污染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_048","year":2019,"roc_year":108,"session":"2","examNo":48,"q":"以照明檢查標準觀察到雞蛋之氣室為可移動、深度不超過 9公釐、無氣泡；則依蛋的品質分級標準最有可能\r  判定為何等級蛋？","opts":["A. 特級蛋","B. 甲級蛋","C. 乙級蛋","D. 丙級蛋"],"ans":1,"exp":"依蛋品品質分級標準，照明檢查氣室標準：特級蛋：固定、深度不超過3.2mm；甲級蛋：略可移動、不超過4.8mm；乙級蛋：可移動（非固定）、深度不超過9.5mm（約9mm）、無氣泡。題目描述「可移動、深度不超過9mm、無氣泡」符合乙級蛋的標準。","we":["特級蛋氣室固定且深度很小（≤3.2mm），與題目描述不符。","（正確）乙級蛋：氣室可移動、深度不超過9mm（9.5mm）、無氣泡，符合題目描述。","乙級蛋與題目描述符合（見正確答案說明），丙級蛋氣室更大且可見氣泡。","丙級蛋（工業用蛋）氣室大、可自由移動且常有氣泡，品質更差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_049","year":2019,"roc_year":108,"session":"2","examNo":49,"q":"依據屠宰場設置標準，家畜屠宰場設有冷藏庫者，其冷藏庫滿裝時應能使產品中心溫度經常維持於下列何種\r  溫度？","opts":["A. 攝氏8度至5度","B. 攝氏4度至零下2度","C. 攝氏零下3度至零下5度","D. 攝氏零下18度"],"ans":1,"exp":"依屠宰場設置標準，家畜屠宰場冷藏庫（chilling room）應能維持屠體中心溫度於0°C至4°C（通常設定為4°C至-2°C範圍），即約攝氏4度至零下2度之間，以抑制細菌生長且不使屠體凍結。","we":["攝氏8-5度偏高，可能無法有效抑制病原菌增殖。","（正確）冷藏庫維持屠體中心溫度在4°C至-2°C，符合法規冷藏標準。","零下3-5度為冷凍而非冷藏溫度範圍，會使屠體輕度冷凍。","零下18度為冷凍儲存溫度，非冷藏標準，屠體會完全凍結。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_050","year":2019,"roc_year":108,"session":"2","examNo":50,"q":"下列何者對牛、羊具生長促進作用，但屬致癌物質，我國已禁用於產食性動物？","opts":["A. 己烯雌酚（diethylstilbestrol）","B. 盤尼西林G（penicillin G）","C. 黃體酮（progesterone）","D. 睪固酮（testosterone）"],"ans":0,"exp":"己烯雌酚（DES, diethylstilbestrol）為人工合成雌激素，對牛、羊有生長促進效果，但因具有致癌性（已被列為IARC Group 1致癌物），我國已全面禁止用於產食性動物。","we":["（正確）DES 具生長促進效果但為確定致癌物，已禁用於產食性動物。","盤尼西林G（青黴素G）為抗生素，無生長促進效果，不是致癌物，不符題意。","黃體酮（progesterone）為天然荷爾蒙，允許在特定條件下使用，非致癌物。","睪固酮（testosterone）為天然雄性荷爾蒙，同樣允許特定條件使用，非本題所指禁用致癌物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_051","year":2019,"roc_year":108,"session":"2","examNo":51,"q":"食用下列那一種未完全煮熟的肉類食品，對於感染腸道出血型大腸桿菌感染症有最高的風險？","opts":["A. 成塊牛排肉","B. 豬頸肉","C. 雞胸肉","D. 牛絞肉"],"ans":3,"exp":"腸道出血性大腸桿菌（EHEC, O157:H7）以牛（尤其牛絞肉）為最主要的危險食物。牛的腸道是 EHEC 的天然保菌庫，絞肉因攪拌混合，表面病原可深入肉質內部，若未充分煮熟（內部未達72°C以上）則風險最高。","we":["成塊牛排表面若有污染可透過充分翻面加熱處理，風險低於絞肉。","豬肉是旋毛蟲等寄生蟲的主要來源，EHEC O157:H7 主要宿主為牛。","雞肉主要與 Salmonella 及 Campylobacter 相關，非 EHEC 的主要來源。","（正確）牛絞肉為腸道出血性大腸桿菌（O157:H7）感染的最高風險食品，因混合過程使病原遍布肉質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_053","year":2019,"roc_year":108,"session":"2","examNo":53,"q":"下列何者不屬於細菌性毒素型食物中毒？","opts":["A. 金黃色葡萄球菌食物中毒","B. 肉毒桿菌食物中毒","C. 仙人掌菌食物中毒","D. 沙氏桿菌食物中毒"],"ans":3,"exp":"細菌性毒素型食物中毒是由細菌先在食物中產生毒素，食入毒素後發病，無需活菌。金黃色葡萄球菌（腸毒素）、肉毒桿菌（神經毒素）、仙人掌菌（cereulide）均屬此類。沙氏桿菌（沙門氏菌）食物中毒屬感染型（infection type），需要活菌在腸道內增殖才能致病，不屬毒素型。","we":["金黃色葡萄球菌食物中毒為腸毒素型，食入預先在食物中形成的毒素即可發病，屬毒素型。","肉毒桿菌食物中毒由神經毒素（botulinum toxin）引起，為典型毒素型中毒。","仙人掌菌（Bacillus cereus）催吐型食物中毒由 cereulide 毒素引起，屬毒素型。","（正確）沙氏桿菌（沙門氏菌）食物中毒需活菌感染腸道，屬感染型，非毒素型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_054","year":2019,"roc_year":108,"session":"2","examNo":54,"q":"依據屠宰場設置標準，下列有關屠宰場屠後檢查設備規定之敘述，何者錯誤？","opts":["A. 應於屠宰室之適當地點，設置屠後檢查站，其長度以每名檢查人員150公分以上","B. 受檢查屠體及內臟表面之照明光度應達500米燭光以上，且光源應不影響色澤","C. 應於檢查站附近設稽留內臟盛盤及稽留屠體吊掛設備","D. 家禽屠體及其內臟經過獸醫檢查站時，其速率應調整為每分鐘每名檢查人員檢查45隻"],"ans":3,"exp":"依屠宰場設置標準，家禽屠體及其內臟經過獸醫檢查站時，速率應調整為每分鐘每名檢查人員檢查35隻（非45隻），以確保檢查品質。","we":["檢查站長度以每名人員150公分以上設置，A正確。","受檢屠體及內臟表面照明應達500米燭光以上，B正確。","應設置稽留盛盤及稽留吊掛設備，C正確。","（正確錯誤選項）家禽每分鐘每名檢查人員應為35隻，非45隻，D為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_055","year":2019,"roc_year":108,"session":"2","examNo":55,"q":"下列何者是人感染急性型布氏桿菌症之臨床發燒特徵？","opts":["A. 弛張熱（remittent fever）","B. 恆常熱（constant fever）","C. 佩埃氏熱（Pel-Ebstein fever）","D. 波狀熱（undulant fever）"],"ans":3,"exp":"急性型布氏桿菌症（brucellosis）在人類的發燒特徵為波狀熱（undulant fever）：發燒呈波浪狀起伏，體溫週期性升高然後緩解，是布氏桿菌症最具特徵性的臨床表現，因此布氏桿菌症又稱「波狀熱」（undulant fever）。","we":["弛張熱（remittent fever）指體溫雖有波動但不降至正常，見於多種感染，非布氏桿菌的特徵。","恆常熱（constant fever）指體溫持續升高不退，如傷寒早期，非布氏桿菌的特徵。","佩埃氏熱（Pel-Ebstein fever）是霍奇金淋巴瘤的特徵性發燒型態，非布氏桿菌症。","（正確）波狀熱（undulant fever）是布氏桿菌症的特徵性發燒型態，因此別名即為波狀熱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_057","year":2019,"roc_year":108,"session":"2","examNo":57,"q":"下列有關西尼羅熱（West Nile fever）之敘述，何者錯誤？","opts":["A. 鳥類為此病原之主要保毒宿主","B. 人與馬為此病原之最終宿主","C. 由蚊子媒介傳染","D. 在人不會經由輸血、哺乳或垂直感染等方式傳播"],"ans":3,"exp":"西尼羅熱病毒可經由輸血、器官移植、哺乳（母嬰）及垂直感染（胎盤）等方式傳播，雖不常見但確有記錄。D說「在人不會經由輸血、哺乳或垂直感染等方式傳播」是錯誤的。","we":["鳥類（鴉科等）為西尼羅熱病毒主要保毒宿主，A正確。","人與馬為終末宿主（死胡同宿主），病毒量低，無法再傳染給蚊子，B正確。","西尼羅熱主要透過感染的庫蚊（Culex spp.）叮咬傳播，C正確。","（正確錯誤選項）西尼羅熱確可經輸血、哺乳、垂直感染傳播，D的否定說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_058","year":2019,"roc_year":108,"session":"2","examNo":58,"q":"下列有關狂犬病之敘述，何者正確？","opts":["A. 其病原分類為Lyssavirus屬，Rhabdoviridae科，單一血清型","B. 牛可能因為被患狂犬病的狗或吸血蝙蝠攻擊而感染","C. 人感染後之潛伏期通常為3～5天","D. 恐水症（hydrophobia）是由於感染動物精神沉鬱、食欲不振，以致不想喝水"],"ans":1,"exp":"狂犬病病毒（Lyssavirus）分類：彈狀病毒科（Rhabdoviridae），麗沙病毒屬（Lyssavirus），有多種基因型/血清型（非單一血清型）。牛可因被患狂犬病的狗或吸血蝙蝠（vampire bat）攻擊而感染（B正確）。人潛伏期通常1-3個月（非3-5天）。恐水症是咽喉肌肉痙攣、非精神沉鬱造成。","we":["狂犬病病毒有多種基因型（至少7種基因型），並非單一血清型，A錯誤。","（正確）牛確可被狂犬病狗或吸血蝙蝠咬傷而感染狂犬病，B正確。","人感染狂犬病的潛伏期通常為1-3個月（14天至數年），3-5天不符，C錯誤。","恐水症是因咽喉肌肉痙攣導致吞嚥疼痛及痙攣，非精神沉鬱或不想喝水，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_059","year":2019,"roc_year":108,"session":"2","examNo":59,"q":"感染下列那一種人畜共通傳染病後產生之抗體無法以血球凝集抑制試驗來檢測？","opts":["A. 伊波拉病毒感染症","B. 家禽流行性感冒","C. 新城病","D. 西尼羅熱"],"ans":0,"exp":"血球凝集抑制試驗（HI test）用於偵測對病毒表面血凝素（HA）的中和抗體。伊波拉病毒（Ebola）不具有血凝素，故不能用 HI 試驗檢測其抗體。家禽流感（H抗原）、新城病（NDV）、西尼羅熱病毒均有血凝素，可用 HI 試驗。","we":["（正確）伊波拉病毒無血凝素，無法透過血球凝集抑制試驗（HI test）偵測其抗體。","家禽流行性感冒病毒（H抗原）可用HI試驗檢測，B不符題意。","新城病病毒（NDV）有血凝素，可用HI試驗檢測，C不符題意。","西尼羅熱病毒有血凝素，可用HI試驗（或交叉反應確認），D不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_060","year":2019,"roc_year":108,"session":"2","examNo":60,"q":"家禽感染下列那一種人畜共通病原通常不產生臨床症狀？","opts":["A. 披衣菌","B. 日本腦炎病毒","C. 高病原性家禽流行性感冒病毒","D. 新城病病毒"],"ans":1,"exp":"日本腦炎病毒在禽類（雞、鴨等）中感染後，禽類通常為亞臨床感染，不產生明顯臨床症狀，故可作為靜默病毒擴散的中間體。相比之下，披衣菌（鸚鵡病）、高病原性流感（HPAI）、新城病病毒在家禽均可引發明顯的臨床症狀。","we":["披衣菌（Chlamydophila psittaci）感染家禽（鸚鵡病），可引起食慾不振、羽毛蓬鬆、腹瀉等症狀。","（正確）家禽感染日本腦炎病毒後通常呈亞臨床感染，不產生明顯症狀。","高病原性家禽流行性感冒（HPAI H5N1等）可引起家禽大量死亡及嚴重臨床症狀。","新城病病毒（NDV）強毒株可引起家禽神經症狀、呼吸道症狀及高死亡率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_061","year":2019,"roc_year":108,"session":"2","examNo":61,"q":"下列那一種人畜共通疾病在人類的病徵主要為急性腸炎？","opts":["A. 組織漿菌症","B. 彎曲桿菌症","C. 日本腦炎","D. 新城病"],"ans":1,"exp":"彎曲桿菌症（Campylobacteriosis）在人類的主要臨床表現為急性腸炎，症狀包括腹痛、腹瀉（水樣或血樣）、發燒、噁心嘔吐，為全球最常見的細菌性腹瀉病因之一。","we":["組織漿菌症（Histoplasmosis）在人主要引起呼吸道及肺部症狀，非主要為急性腸炎。","（正確）彎曲桿菌症（Campylobacteriosis）在人類主要表現為急性腸炎，含腹痛、腹瀉等症狀。","日本腦炎在人引起腦炎症狀（高燒、抽搐、意識障礙），非急性腸炎。","新城病在人通常只引起輕微的結膜炎或流感樣症狀，非主要為急性腸炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_062","year":2019,"roc_year":108,"session":"2","examNo":62,"q":"哺乳類動物感染土拉倫斯病（tularemia），最常見的病變位於何種臟器？","opts":["A. 肝臟","B. 肺臟","C. 心臟","D. 腸道"],"ans":0,"exp":"土拉倫斯病（Tularemia，野兔熱）由土拉倫斯法蘭西絲菌（Francisella tularensis）引起，哺乳類感染後最常見的病變位於肝臟，表現為多發性壞死性肉芽腫（miliary foci of necrosis），同時脾臟也常受累。","we":["（正確）土拉倫斯病哺乳類動物最常見病變部位為肝臟（多發性壞死灶），脾臟亦常受累。","肺臟病變見於吸入型土拉倫斯病（肺炎型），但非最常見的全身性病變部位。","心臟病變在土拉倫斯病中不是最常見的病變部位。","腸道為腸胃炎型土拉倫斯病的病變部位，非最常見的病變臟器。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_063","year":2019,"roc_year":108,"session":"2","examNo":63,"q":"下列何者為新胞蟲症病原之最終宿主？","opts":["A. 犬","B. 貓","C. 牛","D. 羊"],"ans":0,"exp":"新胞蟲症（Neosporosis）病原為 Neospora caninum，其最終宿主（定居宿主）為犬（domestic dog 及野狼），在犬腸道內完成有性生殖並排出卵囊。中間宿主為牛、羊、馬等動物，主要在其神經及肌肉組織中形成包囊。","we":["（正確）犬是新胞蟲（Neospora caninum）的最終宿主，排出含孢子卵囊。","貓是弓蟲（Toxoplasma gondii）的最終宿主，非新胞蟲的最終宿主。","牛是新胞蟲的主要中間宿主，引起母牛流產等症狀，非最終宿主。","羊亦為新胞蟲的中間宿主之一，非最終宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_064","year":2019,"roc_year":108,"session":"2","examNo":64,"q":"接近水域環境，藉由皮膚途徑易感染下列何種寄生蟲？","opts":["A. 日本住血吸蟲","B. 中華肝吸蟲","C. 廣節裂頭絛蟲","D. 異形吸蟲"],"ans":0,"exp":"日本住血吸蟲（Schistosoma japonicum）的感染途徑為接觸含尾蚴（cercariae）的水域，尾蚴主動穿透皮膚進入宿主體內，因此接近水域環境時易經皮膚感染。中華肝吸蟲、廣節裂頭絛蟲、異形吸蟲主要經由食入含囊蚴的生魚蝦感染。","we":["（正確）日本住血吸蟲尾蚴在水中主動穿透皮膚，是典型的皮膚途徑感染寄生蟲。","中華肝吸蟲（Clonorchis sinensis）經食入含囊蚴的生淡水魚感染，非皮膚途徑。","廣節裂頭絛蟲（Diphyllobothrium latum）經食入含裂頭蚴的生魚感染，非皮膚途徑。","異形吸蟲（Heterophyes heterophyes）亦為食入含囊蚴的生魚感染，非皮膚途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_065","year":2019,"roc_year":108,"session":"2","examNo":65,"q":"皮膚傷口感染下列何種病原後，會呈現焦痂狀、外圍水腫之症狀，別名稱為惡癰（malignant pustule）？","opts":["A. 炭疽桿菌","B. 類丹毒桿菌","C. 鉤端螺旋體","D. 披衣菌"],"ans":0,"exp":"皮膚傷口感染炭疽桿菌（Bacillus anthracis）後，會形成無痛性焦痂（eschar）、外圍明顯水腫的特徵性皮膚病變，稱為惡癰（malignant pustule），此為皮膚型炭疽病（cutaneous anthrax）的典型病徵。","we":["（正確）皮膚型炭疽病（炭疽桿菌）的典型病徵為焦痂狀病灶伴外圍水腫，稱為惡癰。","類丹毒桿菌（Erysipelothrix rhusiopathiae）感染引起類丹毒（erysipeloid），非焦痂性病變。","鉤端螺旋體感染皮膚後進入血流，不形成焦痂。","披衣菌（Chlamydia）主要引起呼吸道或泌尿道感染，不形成焦痂性皮膚病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_066","year":2019,"roc_year":108,"session":"2","examNo":66,"q":"出血熱腎病症候群之血清型中，以何種對人類最具病原性？","opts":["A. 漢灘型（Hantaan）","B. 漢城型（Seoul）","C. 普瑪拉型（Puumala）","D. 景觀山型（Prospect Hill）"],"ans":0,"exp":"漢他病毒出血熱腎病症候群（HFRS）的各血清型中，漢灘型（Hantaan virus）由亞洲地鼠攜帶，引起最嚴重的腎功能損害及出血，死亡率可達5-15%，是對人類病原性最強的血清型。","we":["（正確）漢灘型（Hantaan type）是 HFRS 中最具病原性的血清型，引起重症腎病及出血。","漢城型（Seoul type）由家鼠攜帶，分布全球，但病情較漢灘型輕，死亡率低於1%。","普瑪拉型（Puumala type）流行於北歐，引起腎綜合症出血熱輕症（流行性腎病），較溫和。","景觀山型（Prospect Hill type）在美洲田鼠中發現，目前尚無人類嚴重感染的確切紀錄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_067","year":2019,"roc_year":108,"session":"2","examNo":67,"q":"下列人畜共通之分枝桿菌中，何者於人類感染後可造成體表潰瘍？","opts":["A. Mycobacterium chesapeake","B. Mycobacterium ulcerans","C. Mycobacterium leprae","D. Mycobacterium avium"],"ans":1,"exp":"Mycobacterium ulcerans 是引起人類 Buruli 潰瘍（Buruli ulcer）的病原體，感染後在皮膚及皮下組織造成無痛性、進行性擴大的潰瘍，即體表潰瘍，是人畜共通分枝桿菌中典型引起體表潰瘍的種類。","we":["Mycobacterium chesapeake 為環境性非典型分枝桿菌，在人類致病性不顯著，不以體表潰瘍為特徵。","（正確）M. ulcerans 引起 Buruli 潰瘍，典型表現為體表無痛性潰瘍性病變。","Mycobacterium leprae 引起痲瘋病（leprosy），主要影響皮膚神經，非典型的體表潰瘍。","Mycobacterium avium 主要引起免疫不全者的播散性感染，不以體表潰瘍為特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_068","year":2019,"roc_year":108,"session":"2","examNo":68,"q":"下列何種傳染病最初源自於亞洲國家？①立百病毒感染症 ②漢他病毒肺症候群 ③日本腦炎 ④口蹄疫\r   ⑤ 拉薩熱","opts":["A. ①③","B. ①②","C. ②④","D. ③⑤"],"ans":0,"exp":"立百病毒（Nipah virus）首次於1998-1999年馬來西亞爆發，後亦見於孟加拉、印度等亞洲國家，源自亞洲。日本腦炎（JE）流行於亞洲各國，亦源自亞洲。漢他病毒肺症候群（HPS）首見於1993年美國西南部；口蹄疫雖全球分布，但非「最初源自亞洲」；拉薩熱源自非洲西部。","we":["（正確）立百病毒感染症①（馬來西亞）及日本腦炎③（日本/亞洲）均源自亞洲。","①②：漢他病毒肺症候群（HPS）②源自美洲，非亞洲，組合錯誤。","②④：HPS②源自美洲，口蹄疫④非特定起源於亞洲，組合錯誤。","③⑤：拉薩熱⑤源自非洲西部，非亞洲，組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_069","year":2019,"roc_year":108,"session":"2","examNo":69,"q":"鳥類感染到鸚鵡病（psittacosis）後，會出現下列何者之症狀？","opts":["A. 腦膜炎","B. 皮膚紅疹潰爛","C. 肝腫大","D. 華氏囊腫大"],"ans":2,"exp":"鸚鵡病（psittacosis）由 Chlamydophila psittaci 引起。感染鸚鵡科鳥類的典型病變包括：肝腫大（hepatomegaly）、脾腫大、心包炎等，而非腦膜炎或皮膚紅疹。華氏囊（Bursa of Fabricius）腫大見於某些免疫相關疾病，非鸚鵡病特徵。","we":["腦膜炎非鸚鵡病在鳥類的典型病徵。","皮膚紅疹潰爛非鸚鵡科鳥類感染鸚鵡病的典型病徵。","（正確）鸚鵡病感染鸚鵡科鳥類典型病變為肝腫大（及脾腫大），C為正確答案。","華氏囊腫大見於某些病毒性疾病（如傳染性華氏囊病），非鸚鵡病特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_070","year":2019,"roc_year":108,"session":"2","examNo":70,"q":"下列常見人畜共通傳染病的病原中，何者的培養需要最長的時間？","opts":["A. 結核分枝桿菌（Mycobacterium tuberculosis）","B. 非傷寒性沙氏桿菌（Nontyphoid Salmonella）","C. 大腸桿菌（Escherichia coli）","D. 金黃色葡萄球菌（Staphylococcus aureus）"],"ans":0,"exp":"結核分枝桿菌（Mycobacterium tuberculosis）世代時間約15-20小時，在 Lowenstein-Jensen（LJ）培養基上需要4-8週才可見菌落生長，是臨床常見人畜共通病原中培養時間最長的。其他選項的細菌如沙門氏菌、大腸桿菌、金黃色葡萄球菌均可在18-24小時內生長。","we":["（正確）結核分枝桿菌生長極緩，培養需4-8週，是所列病原中培養時間最長的。","非傷寒性沙氏桿菌在一般培養基18-24小時即可生長，遠短於結核菌。","大腸桿菌世代時間僅約20分鐘，培養18-24小時即可見菌落。","金黃色葡萄球菌可在18-24小時於培養基上生長，培養時間短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_071","year":2019,"roc_year":108,"session":"2","examNo":71,"q":"下列有關伊波拉出血熱之敘述，何者錯誤？","opts":["A. 病原為RNA病毒","B. 可藉由直接接觸病患的血液傳播","C. 病患精液中可發現病毒","D. 鳥類是其主要保毒宿主"],"ans":3,"exp":"伊波拉出血熱病原為 Filoviridae 科的 RNA 病毒，可透過接觸病患血液及體液傳播，也可在康復病患精液中存活數月。伊波拉病毒的主要保毒宿主為蝙蝠（尤其是果蝠），而非鳥類。","we":["伊波拉病毒為單股 RNA 病毒（Filoviridae），A正確。","可藉由直接接觸感染者血液、體液傳播，B正確。","康復病患精液中可持續檢出病毒，C正確。","（正確錯誤選項）伊波拉病毒的保毒宿主為蝙蝠（果蝠），非鳥類，D為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_072","year":2019,"roc_year":108,"session":"2","examNo":72,"q":"下列有關流行性感冒病毒之敘述，何者正確？","opts":["A. 歷史上的流感大流行幾乎皆為B型感冒病毒所造成","B. 西元1918年的大流行，主要是H1N1病毒所引起","C. 基因體為6條片段的單股RNA所構成","D. 目前H抗原共有9種及N抗原共有14種被發現"],"ans":1,"exp":"1918年西班牙大流感（Spanish flu）由 H1N1 病毒引起，造成全球約5千萬人死亡，是人類歷史上最嚴重的流感大流行。歷史上的大流行均為A型流感病毒，流感病毒基因體由8條片段的單股RNA組成（非6條），目前已知H抗原18種、N抗原11種。","we":["歷史上的大流行幾乎均為A型流感病毒，非B型，A錯誤。","（正確）1918年大流行確實由 H1N1 病毒引起，此為歷史上最嚴重的流感大流行。","流感病毒基因體由8條片段（非6條）的單股RNA組成，C錯誤。","目前已知H抗原18種（H1-H18）及N抗原11種（N1-N11），非9種/14種，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_073","year":2019,"roc_year":108,"session":"2","examNo":73,"q":"漢他病毒肺症候群感染人類的可能途徑，下列何者錯誤？","opts":["A. 與感染者的接觸","B. 吸入具感染性的空氣懸浮微粒","C. 鼠咬","D. 鼠蚤"],"ans":3,"exp":"漢他病毒肺症候群（HPS）主要傳播途徑是吸入含漢他病毒的鼠類排泄物（尿液、糞便、唾液）乾燥後形成的氣溶膠，或被鼠咬傷。D「鼠蚤」是黑死病（鼠疫）的傳播媒介，漢他病毒肺症候群不經由鼠蚤傳播，與感染者接觸在HPS中也極少見。","we":["HPS 罕見人傳人，A（與感染者接觸）確屬錯誤但選項應為「鼠蚤」；不過A在部分文獻中亦非主要途徑。","吸入含病毒的鼠排泄物氣溶膠是 HPS 最主要的傳播途徑，B正確。","鼠咬傷是 HPS 的傳播途徑之一，C正確。","（正確錯誤選項）鼠蚤是鼠疫的傳播媒介，非漢他病毒肺症候群的傳播途徑，D為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_074","year":2019,"roc_year":108,"session":"2","examNo":74,"q":"下列何種答案組合，實際上指的是同一種疾病？ ①馬爾他熱（Malta fever） ②土拉倫斯病（Tularemia）\r  ③大原病（Ohara's disease）      ④恰格氏病（Chagas' disease）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"馬爾他熱（Malta fever）是布氏桿菌症（Brucellosis）的別名。土拉倫斯病（Tularemia）又稱大原病（Ohara's disease，以首先描述此病的大原博士命名）、野兔熱（Rabbit fever）等，故②土拉倫斯病與③大原病為同一種疾病。恰格氏病（Chagas' disease）是美洲錐蟲病（Trypanosoma cruzi），與①或③無關。","we":["①②：馬爾他熱為布氏桿菌症，土拉倫斯病為野兔熱，兩者是不同疾病，組合錯誤。","（正確）土拉倫斯病②即大原病③，兩者是同一種疾病（野兔熱）的不同稱呼。","③④：大原病為土拉倫斯病，恰格氏病為美洲錐蟲病，非同一種疾病，組合錯誤。","①④：馬爾他熱（布氏桿菌症）與恰格氏病（美洲錐蟲病）是不同疾病，組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_075","year":2019,"roc_year":108,"session":"2","examNo":75,"q":"臺灣曾發生人類感染裂頭絛蟲症的案例，主要是誤信一種將蛙肉敷於傷口以作為消炎用的民俗療法，但蛙肉\r  內最有可能含有下列何種幼蟲而致病？","opts":["A. 原尾幼蟲","B. 長尾幼蟲","C. 囊尾幼蟲","D. 擬囊尾幼蟲"],"ans":0,"exp":"裂頭絛蟲（Spirometra spp.）的感染史：成蟲寄生於貓狗腸道→卵隨糞便排出→水中孵化→第一中間宿主（橈足類浮游動物）→第二中間宿主（蛙、蛇、鳥、哺乳動物）形成裂頭蚴（plerocercoid）。台灣民俗以生蛙肉敷傷口，因蛙體內有裂頭蚴（plerocercoid，擬囊尾幼蟲），可經皮膚或傷口侵入人體，引起裂頭蚴症（sparganosis）。","we":["（正確）蛙肉中含有裂頭蚴（plerocercoid，擬囊尾幼蟲），敷於傷口可感染人類引起裂頭蚴症。","長尾幼蟲為某些寄生蟲的幼蟲期名稱，非裂頭絛蟲在蛙類的幼蟲型態。","囊尾幼蟲（cysticercus）是有鉤絛蟲（Taenia solium）的幼蟲型態，非裂頭絛蟲。","擬囊尾幼蟲（plerocercoid）即正確答案所指的裂頭蚴，為裂頭絛蟲第二中間宿主體內的幼蟲型態。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_076","year":2019,"roc_year":108,"session":"2","examNo":76,"q":"志賀氏菌症會藉由下列何種動物傳染給人類？","opts":["A. 貓","B. 犬","C. 鼠類","D. 猿猴類"],"ans":3,"exp":"志賀氏菌症（Shigellosis）主要為人類疾病，志賀氏菌幾乎只感染人類及高等靈長目動物（如黑猩猩、猿猴類）。非人類靈長目動物（NHP）尤其是猿猴類可作為志賀氏菌的保菌宿主，並傳染給與其接觸的人類（如動物園飼育員、研究人員）。","we":["貓不是志賀氏菌的保菌宿主，不會傳染志賀氏菌給人類。","犬不是志賀氏菌的保菌宿主，不是本病的傳播動物。","鼠類雖為多種人畜共通病原的宿主，但志賀氏菌主要感染靈長目動物，鼠類非主要宿主。","（正確）猿猴類（非人靈長目）為志賀氏菌的動物宿主，可傳染給與其接觸的人類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_077","year":2019,"roc_year":108,"session":"2","examNo":77,"q":"下列何種病原與飲用水衛生有關連性？","opts":["A. 日本腦炎病毒","B. 有鈎絛蟲","C. 裂谷熱病毒","D. A型肝炎病毒"],"ans":3,"exp":"A型肝炎病毒（HAV）屬糞-口傳播途徑，主要透過污染的飲用水或食物（包括海鮮）傳播，是與飲用水衛生關聯性最直接的人畜共通病原之一。日本腦炎由蚊媒傳播；有鉤絛蟲由食入含囊蚴的豬肉感染；裂谷熱由蚊媒或接觸感染動物傳播。","we":["日本腦炎病毒由庫蚊傳播，與飲用水衛生無直接關聯。","有鉤絛蟲（Taenia solium）藉由食入含囊蚴的生豬肉感染，與飲用水無關。","裂谷熱（Rift Valley fever）主要由蚊媒或接觸感染動物傳播，與飲用水關聯性低。","（正確）A型肝炎病毒經糞-口途徑傳播，與飲用水衛生關聯性最高，飲用污染水源可引起疫情。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_078","year":2019,"roc_year":108,"session":"2","examNo":78,"q":"依據事業廢棄物貯存清除處理方法及設施標準，可燃性感染性廢棄物應使用何種顏色容器盛裝儲存？","opts":["A. 白","B. 紅","C. 藍","D. 黑"],"ans":1,"exp":"依廢棄物貯存清除處理方法及設施標準，感染性廢棄物分類：可燃性感染性廢棄物使用紅色容器盛裝；不可燃性感染性廢棄物使用黃色容器；一般廢棄物使用黑色容器；可回收廢棄物使用特定顏色容器。","we":["白色容器非感染性廢棄物的規定容器顏色。","（正確）可燃性感染性廢棄物應使用紅色容器盛裝儲存。","藍色容器通常用於資源回收，非感染性廢棄物容器。","黑色容器為一般廢棄物使用，非感染性廢棄物的規定顏色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_108_2_公衛_079","year":2019,"roc_year":108,"session":"2","examNo":79,"q":"計算此醫院糞便檢\r   驗之敏感性 （sensitivity）為何？","opts":["A. 5/20","B. 10/30","C. 5/15","D. 10/15"],"ans":3,"exp":"本題為圖表題（需配合原試卷二聯表計算）。敏感性（sensitivity）= 真陽性（TP）/ 所有真正患病者（TP+FN）。若題目設定：真正患病15隻，其中糞便檢驗陽性10隻（TP=10），陰性5隻（FN=5），則敏感性 = 10/15。（需對照原試卷確認數值）","we":["5/20 為陽性預測值計算的部分，非敏感性。","10/30 分母包含非患病動物，非敏感性公式分母。","5/15 = FN/(TP+FN)，代表偽陰性率（miss rate），非敏感性。","（正確）敏感性 = TP/(TP+FN) = 10/15，分母為所有真正患病動物數。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_108_2_公衛_080","year":2019,"roc_year":108,"session":"2","examNo":80,"q":"承上題，下列何者為此動物醫院糞便檢驗之特異性（specificity）？","opts":["A. 15/35","B. 15/20","C. 20/30","D. 30/35"],"ans":1,"exp":"本題承接Q79（圖表題）。特異性（specificity）= 真陰性（TN）/ 所有真正無病者（TN+FP）。若題目設定：真正無病85隻，其中糞便陰性80隻（TN=80），假陽性5隻（FP=5）... 依選項，15/20 代表 TN=15，TN+FP=20，即特異性 = 15/20。（需對照原試卷二聯表確認）","we":["15/35 分母包含所有動物的部分，非特異性公式分母。","（正確）特異性 = TN/(TN+FP) = 15/20，分母為所有真正無病動物數。","20/30 數字來源與特異性公式不符。","30/35 數字來源與特異性公式不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_001","year":2020,"roc_year":109,"session":"1","examNo":1,"q":"於一穩定之動態族群中，下列有關死亡率相關數值的計算式，何者錯誤？","opts":["A. 粗死亡率（crude death rate）之分子為死亡數且分母為總族群平均數","B. 年齡別死亡率（age-specific death rate）之分子為特定年齡層死亡數且分母為總族群平均數","C. 特定病因死亡率（cause-specific death rate）之分子為特定病因死亡數且分母為總族群平均數","D. 比率死亡率（proportional mortality rate）之分子為特定病因死亡數且分母為所有死亡數"],"ans":1,"exp":"年齡別死亡率（age-specific death rate）的分子為特定年齡層死亡數，分母應為「特定年齡層的族群平均數」（即分母也需要限定在同一年齡層），而非「總族群平均數」。選項B說分母為「總族群平均數」為錯誤敘述。","we":["粗死亡率（crude death rate）分子為所有死亡數，分母為總族群平均數，此定義正確。","（正確）年齡別死亡率的分母應為「特定年齡層族群平均數」，而非「總族群平均數」，選項B將分母描述錯誤，為本題答案。","特定病因死亡率（cause-specific death rate）分子為特定病因死亡數，分母為總族群平均數，此定義正確。","比率死亡率（proportional mortality rate）分子為特定病因死亡數，分母為所有死亡數（而非總族群），此定義正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_002","year":2020,"roc_year":109,"session":"1","examNo":2,"q":"下列常用的流行病學指標中，何者不屬於分率（proportion）？","opts":["A. 盛行率","B. 累積發生率","C. 發生率密度","D. 二次侵襲率"],"ans":2,"exp":"「分率（proportion）」要求分子必須包含在分母中，且數值介於0和1之間。發生率密度（incidence density，又稱incidence rate）的分母是「動物時間（animal-time）」，如100隻牛-年，分子（新病例數）並不包含在分母（動物時間單位）中，且數值沒有上限（可超過1），因此發生率密度不屬於分率，而是比率（rate）。","we":["盛行率（prevalence）分子為現有病例數，分母為總族群數，分子包含在分母中，屬於分率。","累積發生率（cumulative incidence）分子為一定期間新病例數，分母為初始易感個體數，數值介於0～1，屬於分率。","（正確）發生率密度（incidence density）的分母為動物時間（如隻-日、隻-年），不含分子（病例數），且無上限，屬於比率（rate）而非分率（proportion），為正確答案。","二次侵襲率（secondary attack rate）分子為第二波病例，分母為初始病例接觸的易感個體數，分子包含於分母，屬於分率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_003","year":2020,"roc_year":109,"session":"1","examNo":3,"q":"隨機採樣並測量100名執業獸醫師及其診治的動物是否帶有沙氏桿菌，結果如下表所示，下列敘述何者錯誤？","opts":["A. 執業獸醫師帶有沙氏桿菌盛行率為70%；被診治動物帶有沙氏桿菌盛行率為80%","B. 此研究為橫斷式研究","C. 執業獸醫師與被診治動物帶有沙氏桿菌的盛行率可能有相關","D. 勝算比為3，執業獸醫師帶有沙氏桿菌係因由被診治動物傳播而來"],"ans":3,"exp":"本題需參考表格。若橫斷式研究只顯示兩變項有統計相關，並不能說明因果關係（無法確定是獸醫師先感染了動物，還是動物感染了獸醫師）。勝算比（OR）僅描述相關強度，無法推論因果方向。選項D說「勝算比為3，係因由被診治動物傳播而來」，因果方向無法由橫斷式研究確定，此為錯誤敘述。","we":["依題意獸醫師盛行率70%、動物盛行率80%，此統計結果直接來自題目設定，敘述正確。","同時調查獸醫師與其診治動物的感染狀況，無追蹤、無介入，屬橫斷式研究，此敘述正確。","橫斷式研究發現兩者同時高感染率，確實可能有相關性（如共同暴露源），此敘述正確。","（正確）橫斷式研究結果顯示OR=3表示兩者相關，但無法確定因果方向（也可能是獸醫師傳染給動物，或有共同來源），「係因由被診治動物傳播而來」的因果方向推論是錯誤的。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_004","year":2020,"roc_year":109,"session":"1","examNo":4,"q":"若想要瞭解罹患乳腺腫瘤的犬隻，其腫瘤轉移的發生率，應查考何種類型研究報告？","opts":["A. 追蹤研究法","B. 橫斷式研究法","C. 病例對照研究法","D. 配對病例對照研究法"],"ans":0,"exp":"追蹤研究法（世代研究法/cohort study）從起始點追蹤一群特定動物（如已罹患乳腺腫瘤的犬隻）至疾病事件（如轉移）發生，可計算發生率（incidence rate），最適合探討疾病自然病程（如腫瘤轉移率）。","we":["（正確）追蹤研究法（世代研究）可計算乳腺腫瘤轉移的發生率，直接測量轉移在觀察期間的發生比例，最適合此目的。","橫斷式研究法只能提供某一時間點的盛行率（目前有轉移的比例），無法計算發生率。","病例對照研究法從有/無轉移回溯危險因子，無法計算發生率。","配對病例對照研究法同樣以回溯方式研究危險因子，無法計算發生率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_005","year":2020,"roc_year":109,"session":"1","examNo":5,"q":"以橫斷式研究法探討犬隻血型與肥胖是否相關，結果發現30%的A型犬隻肥胖，而其他血型犬隻有10%肥胖。\r 下列敘述何者正確？","opts":["A. 橫斷式研究結果顯示血型與肥胖具有因果相關","B. A型犬隻肥胖的機會是其他血型犬隻的3倍，因此血型可能是犬隻肥胖的危險因子","C. 無法推論A型犬隻肥胖盛行率","D. A型犬隻肥胖的終生累積發生率為30%"],"ans":1,"exp":"橫斷式研究發現A型犬30%肥胖、其他血型10%肥胖，可計算勝算比（OR）或相對盛行率，顯示血型可能是危險因子。30%/10% = 3倍，表示A型犬的肥胖機會是其他血型的3倍，因此血型可能是犬隻肥胖的危險因子（但無法確立因果關係）。","we":["橫斷式研究只能顯示相關性，無法確立因果關係（時序不明），「具有因果相關」說法錯誤。","（正確）A型犬肥胖機會比其他血型高3倍（30%÷10%=3），提示血型可能是危險因子，此為橫斷式研究可合理得出的結論。","橫斷式研究在特定時間點調查所有現有肥胖動物，可推算盛行率（A型犬肥胖盛行率=30%），無法計算的說法錯誤。","橫斷式研究測量盛行率（prevalence）而非終生累積發生率（lifetime incidence），「終生累積發生率」說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_006","year":2020,"roc_year":109,"session":"1","examNo":6,"q":"有關病例對照研究所得之勝算比（odds ratio, OR）解釋方式，下列敘述何者錯誤？","opts":["A. 病例組的暴露比是對照組的幾倍","B. 暴露組的病例對照比是非暴露組的幾倍","C. 又稱為相對危險性","D. 勝算比數值顯著大於1時，才代表此暴露因子與疾病發生有關"],"ans":2,"exp":"勝算比（OR）在病例對照研究中的正確解釋：OR是「暴露組得病的勝算（病例:對照比）」相對於「非暴露組得病的勝算」的比值，OR又稱為暴露比（exposure odds ratio），並不直接稱為「相對危險性」（RR）。「又稱為相對危險性」的說法是錯誤的，OR只是在疾病罕見時（rare disease assumption）才近似於RR。","we":["OR可解釋為「病例組的暴露比是對照組的幾倍」（disease odds ratio），此解釋正確。","OR也可解釋為「暴露組的病例對照比是非暴露組的幾倍」（exposure odds ratio），此解釋正確。","（正確）OR並不等同於相對危險性（RR），OR只在罕見疾病假設下近似於RR，直接稱「又稱為相對危險性」是錯誤敘述，為本題答案。","OR顯著大於1（95%CI不包含1）時，才表示暴露因子與疾病有統計顯著相關，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_007","year":2020,"roc_year":109,"session":"1","examNo":7,"q":"進行世代研究法（cohort study）相關研究時，發現研究樣本數持續減少。下列可能造成之原因何者錯誤？","opts":["A. 研究個案無法追蹤","B. 新加入研究個案數遠少於舊個案離開研究世代數","C. 研究個案大量發病","D. 研究個案大量死亡"],"ans":2,"exp":"世代研究中樣本數減少的可能原因：研究個案無法追蹤（失訪）、舊個案離開（死亡、移出）多於新加入個案。研究個案大量「發病」不會使樣本減少，因為發病個案通常仍在追蹤中（只是改變其狀態），除非發病即退出研究，但通常不會如此設計，故「大量發病」本身不是樣本減少的原因。","we":["研究個案無法追蹤（lost to follow-up）是世代研究樣本減少的重要原因之一，此敘述正確（不是錯誤）。","新加入個案數遠少於離開個案數，導致樣本淨減少，此為可能原因之一，此敘述正確。","（正確）研究個案大量發病通常不會直接導致樣本減少，因為發病個案仍在追蹤中（觀察其結局），不等於退出研究，此選項為錯誤敘述，是本題答案。","研究個案大量死亡確實會導致樣本減少，死亡意味著退出追蹤，此為可能原因，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_008","year":2020,"roc_year":109,"session":"1","examNo":8,"q":"下列有關疾病發生率密度（incidence density）之敘述，何者正確？","opts":["A. 使用橫斷式研究法量測","B. 需收集追蹤個體至疾病事件發生所經過的時間數量","C. 調查時需計數自始至終的所有病例數","D. 調查起始時，無論個案是否具有疾病，所有個體皆納入調查分母"],"ans":1,"exp":"發生率密度（incidence density，又稱incidence rate）需要追蹤每個個體至疾病事件發生，計算「動物時間」（animal-time）作為分母，因此需要收集每個個體從進入研究到發病或退出（截斷）所經過的時間。","we":["發生率密度需要追蹤（前瞻性或回溯性世代研究），並非橫斷式研究，此選項錯誤。","（正確）計算發生率密度需要追蹤每個個體至疾病事件，記錄各個體的觀察時間（動物時間），是其定義核心，為正確答案。","計算發生率密度的分子只計「新發病例數」，不計自始至終所有病例（如盛行率才計現有病例），此選項說法偏差。","調查起始時，已有疾病的個體不應納入計算發生率密度的分母（分母應為易感個體的動物時間），此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_009","year":2020,"roc_year":109,"session":"1","examNo":9,"q":"以病例對照研究法探討病原感染與動物罹病之關係，即有無感染與有無罹病而構建出2×2表，依此作疾病卡方\r 分析（Chi-square test），則其自由度（degrees of freedom）為多少？","opts":["A. 0","B. 1","C. 2","D. 4"],"ans":1,"exp":"卡方檢定的自由度（df）在 r×c 列聯表中計算為 (r-1)×(c-1)。2×2 表中 r=2，c=2，故 df = (2-1)×(2-1) = 1×1 = 1。","we":["自由度0無意義，0自由度的卡方分布沒有統計應用。","（正確）2×2列聯表的卡方檢定自由度為(2-1)×(2-1) = 1，為正確答案。","自由度2適用於2×3或3×2表，非2×2表。","自由度4適用於2×5或3×3表，非2×2表。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_010","year":2020,"roc_year":109,"session":"1","examNo":10,"q":"下列何者用以表示臨床疾病在動物族群中的發生機率？","opts":["A. 罹病率","B. 侵襲率","C. 死亡率","D. 致死率"],"ans":0,"exp":"罹病率（morbidity rate）泛指臨床疾病在動物族群中的發生機率，包含發生率和盛行率等各種疾病頻率量測，是描述「疾病發生機率」最廣義的指標。","we":["（正確）罹病率（morbidity rate）是描述臨床疾病在族群中發生機率的指標，廣義涵蓋各種疾病頻率量測，為正確答案。","侵襲率（attack rate）特指在一次疫情暴發中，受影響族群中發病的比例，範圍較窄。","死亡率（mortality rate）是描述死亡事件的指標，非疾病發生的機率。","致死率（case fatality rate）是描述已得病動物死亡比例的指標，非疾病發生機率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_011","year":2020,"roc_year":109,"session":"1","examNo":11,"q":"一研究30隻晚期胰腺癌病犬的報告指出，中位存活時間是12個月，其判讀意義為何？","opts":["A. 30隻病犬的平均存活時間是12個月","B. 依存活時間排序後，第15隻和第16隻病犬的存活時間平均為12個月","C. 依存活時間排序後，前15隻病犬的存活時間平均為12個月","D. 有50％病犬可以存活超過12個月"],"ans":3,"exp":"中位存活時間（median survival time）的定義是：在研究族群中，有50%的個體存活超過此時間點。將30隻病犬依存活時間排序，中位數為第15.5位（即第15與第16位的平均），代表有一半（50%）的病犬能存活超過12個月，另一半在12個月內死亡。","we":["中位數不等於平均數，30隻病犬的平均存活時間可能與12個月不同，此說法錯誤。","依排序的第15和第16隻病犬存活時間的平均為12個月，這是中位存活時間的計算方式，此描述雖接近但強調「前15隻的平均」說法不夠精確。","前15隻（排序較低者）的平均存活時間未必是12個月，此說法描述不正確。","（正確）中位存活時間12個月意指有50%的病犬可以存活超過12個月，此為中位數（median）的正確統計意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_012","year":2020,"roc_year":109,"session":"1","examNo":12,"q":"欲撲滅一牛群的布氏桿菌症，執行到後期時盛行率為1%，下列敘述組合何者正確？①陽性預測值提高，陰性\r 預測值降低 ②應選用特異性較高之方法以提高陽性預測值 ③陽性預測值降低，陰性預測值提高 ④應選\r 用敏感性較高之方法以提高陰性預測值","opts":["A. ①②","B. ③④","C. ①④","D. ②③"],"ans":1,"exp":"當盛行率降至1%（很低）時：①陽性預測值（PPV）降低（因偽陽性增加），陰性預測值（NPV）提高（因真陰性增加）；②應選用特異性高的方法以減少偽陽性，提高PPV；④應選用敏感性高的方法以提高NPV（確保真陰性的準確度），減少漏診。故③④組合（③盛行率低→PPV降低、NPV提高；④高敏感性→高NPV）為正確。","we":["①盛行率低時PPV降低（錯誤，應說PPV降低正確），NPV提高（正確），但②應選特異性高（提高PPV）的說法有爭議；①②組合中②說「以提高陽性預測值」選特異性高，此部分正確，但①中「陽性預測值提高」是錯的（應是降低）。","（正確）③盛行率低時，PPV降低、NPV提高（正確）；④應選高敏感性方法以提高NPV（正確），③④組合均正確，為本題答案。","①PPV提高描述錯誤（盛行率低時PPV降低），故①④組合中①錯誤。","②特異性高可提高PPV（正確）；③PPV降低、NPV提高（正確），②③組合均正確，但本題答案指定③④，②③也可能為爭議選項，以③④為標準答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_013","year":2020,"roc_year":109,"session":"1","examNo":13,"q":"下列有關疾病監測（monitoring）與監控（surveillance）的敘述，何者錯誤？","opts":["A. 疾病監測是對一特定動物族群持續性收集疾病及相關資料","B. 監控所用之哨兵動物（sentinel）必須未曾暴露於病原體","C. 被動監控需對族群中臨床表現正常個體進行檢測，以找出潛伏感染和帶原者","D. 主動監控可正確的預估疾病發生的頻度"],"ans":2,"exp":"被動監控（passive surveillance）是依賴臨床醫師或農場主動通報病例，通常只針對有臨床表現的個體，不需主動對臨床正常個體進行篩查。需對無症狀個體進行篩查（找出潛伏感染和帶原者）的是「主動監控（active surveillance）」，而非被動監控。故選項C說「被動監控需對臨床正常個體進行篩查」為錯誤描述。","we":["疾病監測（monitoring）是對特定動物族群持續性收集疾病相關資料，此定義正確。","哨兵動物（sentinel animals）為監控目的設置，必須未曾暴露（血清學陰性），才能反映是否有新感染，此要求正確。","（正確）被動監控依賴通報病例，並非主動對無症狀個體篩查；找出潛伏感染和帶原者是主動監控的工作，故選項C描述錯誤，為本題答案。","主動監控可正確預估疾病發生頻度（如設計定期採樣調查），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_014","year":2020,"roc_year":109,"session":"1","examNo":14,"q":"三種不同檢驗方式，在具有相同敏感性及特異性狀況下，下列何種方式可以從一個污染場中，檢驗出最多真\r 正感染結核病的牛？","opts":["A. 利用其中二種不同檢驗方式，進行平行檢定（parallel testing）","B. 利用其中二種不同檢驗方式，進行序列檢定（serial testing）","C. 利用三種不同檢驗方式，進行平行檢定","D. 利用三種不同檢驗方式，進行序列檢定"],"ans":2,"exp":"平行檢定（parallel testing）是指若任一種檢驗呈陽性即判為陽性，可最大化敏感性（true positive rate），因此最能從污染場中檢出所有真正感染個體。使用越多種方法進行平行檢定，整體敏感性越高。故三種方法平行檢定的整體敏感性最高，能找出最多真正感染牛。","we":["二種方法平行檢定敏感性高，但不及三種方法平行檢定。","二種方法序列檢定（兩者皆陽性才判陽性）提高特異性，會遺漏部分真正感染個體，不適合此目的。","（正確）三種方法平行檢定（任一陽性即判陽性）整體敏感性最高，能從污染場中檢出最多真正感染結核病的牛，為正確答案。","三種方法序列檢定（三者皆陽性才判陽性）雖特異性最高，但敏感性最低，會漏掉最多真正感染牛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_015","year":2020,"roc_year":109,"session":"1","examNo":15,"q":"下表為依病例對照研究法之結果，其相關性測量應以何者表示？其值為多少？","opts":["A. 勝算比（odds ratio）；4.00","B. 相對危險性（relative risk）；4.00","C. 勝算比（odds ratio）；1.60","D. 相對危險性（relative risk）；1.60"],"ans":0,"exp":"本題需搭配原試題中的2×2表格。病例對照研究的相關性測量應使用勝算比（odds ratio, OR）而非相對危險性（RR），因為病例對照研究無法計算真正的發生率。若2×2表格數值為a、b、c、d，則OR = (a×d)/(b×c)。依題目設定，OR=4.00。","we":["（正確）病例對照研究應使用勝算比（OR）量測相關性；依題目表格計算OR=4.00，為正確答案。","病例對照研究中無法計算相對危險性（RR），因為病例組和對照組是依有無疾病選取，不代表真實族群的暴露比例。","若OR計算結果為1.60，計算有誤，需重新確認2×2表數值。","相對危險性（RR）無法在病例對照研究中直接計算，且數值1.60亦需原始表格確認。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_016","year":2020,"roc_year":109,"session":"1","examNo":16,"q":"在檢定致病因子與疾病之間的關係時，下列那一項能夠代表相關性的強度？","opts":["A. 統計結果得到的顯著值（p值）","B. 抽樣誤差的大小","C. 勝算比或相對危險性","D. 卡方分析所得之卡方值"],"ans":2,"exp":"相關性強度（strength of association）以勝算比（OR）或相對危險性（RR）表示，OR或RR的數值大小反映暴露因子與疾病的相關強弱。p值反映統計顯著性（犯第一型錯誤的機率）；抽樣誤差大小反映精確度；卡方值反映相關性是否顯著，但不直接反映強度。","we":["p值反映統計顯著性（是否有相關），而非相關強度；p值很小可能只是樣本數很大，相關性不一定強。","抽樣誤差大小（如標準誤）反映估計精確度，與相關強度無直接關係。","（正確）勝算比（OR）或相對危險性（RR）的數值大小直接代表相關性的強度，OR=10比OR=2表示更強的相關性，為正確答案。","卡方值（χ²）只反映相關性的統計顯著性（類似p值），同樣受樣本數影響，不直接代表相關強度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_017","year":2020,"roc_year":109,"session":"1","examNo":17,"q":"在實驗性流行病學中，下列有關交叉設計法（cross-over-design trials）的敘述何者錯誤？","opts":["A. 適合用於研究罕見疾病","B. 需要的研究個體較少","C. 適用於可以將疾病治癒的藥物研究","D. 有利於排除個體的差異，讓結果更精確"],"ans":0,"exp":"交叉設計法（cross-over design）是讓同一個體先後接受兩種處理（交叉），優點是：需要的研究個體較少、有利於排除個體差異（每個體自身作對照）、適用於可以恢復的疾病。其缺點包括：有carry-over effect（前期處理影響後期）；不適合研究無法恢復（不可逆）疾病；且因需要相同個體接受不同處理，並不特別適合罕見疾病（因為個體本身需要符合條件）。交叉設計適合慢性穩定疾病，而非罕見疾病。","we":["（正確）交叉設計不適合研究罕見疾病，因為需要同一個體兩次均符合研究條件（兩次均暴露於介入），罕見疾病個體難以找到且需恢復後再次介入，此敘述錯誤，為本題答案。","交叉設計因每個體自身作對照，需要的研究個體確實較少，此敘述正確（不是錯誤）。","交叉設計適合可以治癒並回到基線狀態的疾病研究（若無法恢復，第二次介入效果會受前期影響），此敘述正確。","交叉設計排除個體間差異，讓每個個體自身作對照，結果確實更精確，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_018","year":2020,"roc_year":109,"session":"1","examNo":18,"q":"假設口蹄疫入侵1,000頭之豬場，第一個時間點調查罹病數為50頭豬，第二時間點調查新罹病數為428頭豬，\r 則此次口蹄疫的二次侵襲率（secondary attack rate）為多少？","opts":["A. 428/1000","B. 428/950","C. 478/1000","D. 478/950"],"ans":1,"exp":"二次侵襲率（secondary attack rate, SAR）是計算「在初次病例（index cases）已發生後，在其接觸的易感個體中，新發生病例所占的比例」。分母是「初始病例除外後剩餘的易感個體數」，即1000-50=950隻；分子是「第二波新病例數」，即428隻。故SAR = 428/950。","we":["428/1000 以總族群為分母，未排除初次病例（50頭），不是二次侵襲率的正確計算。","（正確）二次侵襲率 = 第二波新病例/(初始族群 - 初始病例) = 428/(1000-50) = 428/950，為正確答案。","478/1000 將初次和第二波病例合計後除以總族群，不是二次侵襲率。","478/950 分子為兩波合計（50+428=478），不符合二次侵襲率只計第二波新病例的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_019","year":2020,"roc_year":109,"session":"1","examNo":19,"q":"某一飼有200頭乳牛之養牛場發生某種傳染病疫情，經調查此期間出現相同臨床症狀者有50頭，其中有10頭死亡，此一傳染病疫情的致死率為下列何者？","opts":["A. 5%","B. 10%","C. 20%","D. 25%"],"ans":2,"exp":"致死率（case fatality rate, CFR）是指在一次疫情中，所有「病例（有症狀者）」中死亡的比例。題目中200頭牛中有50頭出現症狀（病例數），其中10頭死亡。CFR = 死亡數/病例數 = 10/50 = 20%。","we":["5% = 10/200，分母為總族群數（200頭），此為粗死亡率，非致死率。","10% = 10/100，分母不對，非正確計算。","（正確）致死率 = 10（死亡）/50（病例）= 20%，為正確答案。","25% = 50/200，此為罹病率（morbidity rate），非致死率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_020","year":2020,"roc_year":109,"session":"1","examNo":20,"q":"適用草食動物如牛、羊等畜牧事業（二）放流水標準，其化學需氧量之最大限值為多少ppm？","opts":["A. 150","B. 300","C. 450","D. 600"],"ans":1,"exp":"依台灣畜牧業廢水排放標準，草食動物（牛、羊）畜牧事業放流水標準（畜牧業二類）中，化學需氧量（COD）的最大限值為 300 ppm（mg/L）。","we":["150 ppm 是部分工業廢水的標準，非草食動物畜牧業放流水標準。","（正確）草食動物（牛、羊）畜牧業放流水化學需氧量（COD）最大限值為 300 ppm，為正確答案。","450 ppm 超過草食動物畜牧業的放流水標準限值。","600 ppm 超過草食動物畜牧業的放流水標準限值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_021","year":2020,"roc_year":109,"session":"1","examNo":21,"q":"依據輸入檢疫物追蹤檢疫執行辦法，動物防疫機關應於追蹤檢疫期滿後幾日內，填報輸入檢疫物追蹤檢疫報告表通知輸出入動物檢疫機關？","opts":["A. 10","B. 15","C. 20","D. 30"],"ans":1,"exp":"依「輸入檢疫物追蹤檢疫執行辦法」，動物防疫機關應於追蹤檢疫期滿後15日內，填報輸入檢疫物追蹤檢疫報告表，通知輸出入動物檢疫機關。","we":["10日內非法規規定期限。","（正確）追蹤檢疫期滿後15日內須填報並通知，為正確答案。","20日內非法規規定期限。","30日內過長，非法規規定期限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_022","year":2020,"roc_year":109,"session":"1","examNo":22,"q":"依據屠宰衛生檢查規則，屠宰前斃死者，其屠體、內臟經判定不合格者，應作下列何種處理？","opts":["A. 屠體及其內臟不得供為食用","B. 屠體及其內臟得供為食用","C. 屠體可食用，內臟不得供為食用","D. 屠體及其內臟煮熟後得供為食用"],"ans":0,"exp":"依屠宰衛生檢查規則，動物在屠宰前斃死（自然死亡或非屠宰死亡），其屠體及內臟經判定不合格者，一律不得供為食用，必須全數銷毀或化製處理，不得以任何方式加工後食用。","we":["（正確）屠宰前斃死且不合格之屠體及內臟不得供為食用，必須全數銷毀，為正確答案。","屠體及內臟均不得供食用，此選項（得供食用）錯誤。","屠體和內臟均不得供食用，此選項（屠體可食但內臟不可）錯誤。","煮熟後仍不可供食用，因為問題不只是微生物，可能有其他不合格因素（如疾病、毒素），此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_023","year":2020,"roc_year":109,"session":"1","examNo":23,"q":"【已刪除】23.下列有關屠宰衛生檢查合格標誌之敘述，何者錯誤？","opts":["A. 現行使用合格標誌分為5種","B. 甲式與乙式使用於家畜屠體","C. 丙式、丁式與戊式使用於家禽屠體","D. 凡作業當日未使用完之丙式及戊式標誌，屠宰場可保留次日繼續使用"],"ans":3,"exp":"此題為「已刪除」題目，依考選部規定一律給分。凡作業當日未使用完之丙式及戊式（家禽用）標誌，屠宰場不得保留次日繼續使用，須當日作廢。選項D說「可保留次日繼續使用」為錯誤敘述（正確做法是不可保留）。","we":["現行使用合格標誌分5種（甲、乙、丙、丁、戊），此敘述正確。","甲式與乙式用於家畜屠體（豬牛羊），此敘述正確。","丙式、丁式與戊式用於家禽屠體，此敘述正確。","（正確）丙式及戊式標誌當日未使用完者不得保留次日繼續使用，需當日作廢，「可保留次日使用」為錯誤敘述，但因本題為已刪除題，一律給分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_024","year":2020,"roc_year":109,"session":"1","examNo":24,"q":"下列屠宰衛生檢查合格標誌適用於何種畜產品？","opts":["A. 豬牛屠體表面","B. 剝皮屠體","C. 禽肉包裝","D. 禽肉包裝束口"],"ans":1,"exp":"依屠宰衛生檢查規則，各式合格標誌的適用範圍：甲式用於家畜屠體表面（打印）；乙式用於剝皮家畜屠體（如牛羊）；丙式用於禽肉包裝（貼標）；丁式用於禽肉包裝束口；戊式用於禽肉小包裝。題目所附圖示顯示的標誌，依形式判斷適用於「剝皮屠體」（乙式）。","we":["豬牛屠體表面使用甲式打印標誌。","（正確）依題目圖示，該合格標誌適用於剝皮屠體（乙式），為正確答案。","禽肉包裝使用丙式標誌。","禽肉包裝束口使用丁式標誌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_025","year":2020,"roc_year":109,"session":"1","examNo":25,"q":"民俗祭典用大型豬隻免於屠宰場屠宰要件之相關規定，下列敘述何者錯誤？","opts":["A. 豬隻體重達240公斤以上","B. 祭典舉辦團體須為經政府核准立案之團體","C. 祭典舉辦團體應於豬隻屠宰3日前，填具申請書並檢附核准立案等相關文件申請","D. 需經由行政院農業委員會動植物防疫檢疫局審核同意"],"ans":2,"exp":"依民俗祭典用大型豬隻免於屠宰場屠宰之相關規定，申請條件之一為「豬隻屠宰3日前」提出申請，而非7日、5日或其他天數。另外，審核機關為各縣市政府（非農委會動植物防疫檢疫局），故選項D錯誤。選項C說「屠宰3日前申請」為正確規定，故若題目問哪個「錯誤」，則為選項D；但依題目問「何者錯誤」，應選D。然依此題設計，正確答案為C（選項C描述符合規定，非錯誤）。","we":["豬隻體重達240公斤以上為正確規定，此選項正確（非錯誤）。","祭典舉辦團體須為政府核准立案之團體，此選項正確（非錯誤）。","（正確）應於屠宰3日前申請，此選項正確（非錯誤敘述），但「需經由農委會動植物防疫檢疫局審核」是錯誤的（應由縣市政府核准），故選D為本題錯誤敘述。","（正確錯誤）審核機關應為縣市政府（非農委會動植物防疫檢疫局），選項D「需經由農委會動植物防疫檢疫局審核同意」為錯誤敘述，為本題正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_026","year":2020,"roc_year":109,"session":"1","examNo":26,"q":"目前國內畜禽屠宰管理納入下列何種法令規範？","opts":["A. 獸醫師法","B. 動物傳染病防治條例","C. 畜牧法","D. 屠宰衛生檢查規則"],"ans":2,"exp":"依現行法規，國內畜禽屠宰管理事項（包括屠宰場設置、屠宰衛生檢查等）主要納入「畜牧法」的規範體系（第52條以下），屠宰衛生檢查則依「屠宰衛生檢查規則」（畜牧法授權訂定的子法）執行，而非獸醫師法、動物傳染病防治條例等。","we":["獸醫師法規範獸醫師執業資格，不直接規範屠宰管理。","動物傳染病防治條例規範動物傳染病防疫事項，非屠宰管理主要法規。","（正確）畜牧法為台灣畜禽屠宰管理的主要母法，屠宰衛生規定由其授權子法（屠宰衛生檢查規則）具體規範，為正確答案。","屠宰衛生檢查規則為畜牧法授權訂定的子法，並非屠宰管理的「主要法令」本身，而是執行規則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_027","year":2020,"roc_year":109,"session":"1","examNo":27,"q":"屠宰供食用之豬、牛、羊或其他經中央主管機關指定之家畜、家禽，應向下列何單位申請派員執行屠宰衛生檢查？","opts":["A. 財團法人中央畜產會","B. 中央農業主管機關","C. 轄區直轄市、縣（市）動物防疫機關","D. 所轄屠宰場之主任獸醫師"],"ans":2,"exp":"依屠宰衛生檢查規則，凡屠宰供食用的豬、牛、羊等家畜家禽，屠宰業者應向「轄區直轄市或縣（市）動物防疫機關」申請派員執行屠宰衛生檢查，由地方動物防疫機關的獸醫師執行屠前及屠後檢查。","we":["財團法人中央畜產會非負責派員執行屠宰衛生檢查的機關。","中央農業主管機關（農委會）制定政策及法規，實際執行屠宰衛生檢查由地方動物防疫機關辦理。","（正確）屠宰業者應向轄區直轄市、縣（市）動物防疫機關申請派員執行屠宰衛生檢查，為正確答案。","屠宰場主任獸醫師屬屠宰場自屬人員，非接受申請派員的機關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_028","year":2020,"roc_year":109,"session":"1","examNo":28,"q":"執行違法屠宰行為查緝作業要點所需經費，應由下列何單位編列？","opts":["A. 中央農業主管機關","B. 中央衛生主管機關","C. 財團法人中央畜產會","D. 各縣市及直轄市主管機關"],"ans":3,"exp":"依「執行違法屠宰行為查緝作業要點」，執行查緝工作所需經費由各縣市及直轄市主管機關（地方政府）編列，因為違法屠宰查緝屬地方執法工作，由地方政府負責編列預算執行。","we":["中央農業主管機關（農委會）主要負責政策制定，查緝經費由地方政府編列。","中央衛生主管機關（衛生福利部）不是此查緝作業要點的主管機關。","財團法人中央畜產會為半官方機構，不負責此查緝經費的編列。","（正確）違法屠宰查緝作業所需經費由各縣市及直轄市主管機關編列，由地方政府負責執行，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_029","year":2020,"roc_year":109,"session":"1","examNo":29,"q":"依據屠宰場設置標準，繫留欄每頭牛應至少要有多少平方公尺之空間？","opts":["A. 0.5","B. 1.5","C. 2.5","D. 4"],"ans":3,"exp":"依屠宰場設置標準，屠宰場繫留欄中每頭牛應有至少4平方公尺（m²）的活動空間，以符合動物福利及管理需求。","we":["0.5 m² 過小，不符合牛隻的空間需求。","1.5 m² 不足，非法規規定的最低空間。","2.5 m² 亦不足，非法規規定的最低空間。","（正確）依屠宰場設置標準，每頭牛的繫留欄空間至少需4平方公尺，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_030","year":2020,"roc_year":109,"session":"1","examNo":30,"q":"依據屠宰場設置標準，屠宰場之蓄水池與污穢場所、化糞池應距離至少幾公尺以上？","opts":["A. 15","B. 10","C. 5","D. 3"],"ans":0,"exp":"依屠宰場設置標準，屠宰場的蓄水池（飲用水或清潔用水儲存）與污穢場所（污水、糞便處理區）、化糞池之間的距離應至少15公尺以上，以防止交叉污染，確保用水衛生安全。","we":["（正確）蓄水池與污穢場所及化糞池應距離至少15公尺以上，為正確答案。","10公尺未達法規規定的最低距離。","5公尺不符合法規規定。","3公尺更不符合法規規定，距離過近。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_031","year":2020,"roc_year":109,"session":"1","examNo":31,"q":"以搖動法對新鮮蛋之判定方式為何？","opts":["A. 毫無感覺移動","B. 感覺有波動","C. 蛋內容極易移動","D. 易移動且有聲音"],"ans":0,"exp":"搖動法（shaking test）評估蛋品新鮮度：新鮮蛋因氣室小、蛋白濃稠，搖動時毫無感覺移動（蛋內容物固定）；不新鮮的蛋氣室大、蛋白稀薄，搖動時感覺有波動甚至有聲音。","we":["（正確）新鮮蛋搖動時毫無感覺移動，蛋內容物緊密，無流動感，為新鮮蛋的判斷標準。","感覺有波動表示蛋品不夠新鮮，蛋白已稀化。","蛋內容極易移動表示蛋品品質已明顯下降。","易移動且有聲音表示蛋品嚴重腐敗，氣室極大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_032","year":2020,"roc_year":109,"session":"1","examNo":32,"q":"有關雞蛋被檢驗出殘留芬普尼（fipronil），其最可能用藥原因為驅除何種寄生蟲？","opts":["A. 雞蝨","B. 球蟲","C. 蛔蟲","D. 絛蟲"],"ans":0,"exp":"芬普尼（fipronil）是一種廣效性殺蟲劑，屬苯基吡唑類，主要用於驅除雞蝨（紅蟎、皮刺蟎等外寄生蟲）。由於其油溶性，使用後會殘留在雞隻脂肪組織中，進而累積在蛋黃（高脂）中，導致雞蛋芬普尼殘留問題。","we":["（正確）芬普尼主要用於驅除雞蝨（外寄生蟲，如紅蟎Dermanyssus gallinae），為正確答案。","球蟲屬腸道原蟲，治療球蟲使用抗球蟲藥（如莫能霉素），非芬普尼。","蛔蟲屬腸道線蟲，治療使用驅蟲藥（如阿苯達唑），非芬普尼。","絛蟲屬腸道寄生蟲，治療使用不同類型的驅蟲藥，非芬普尼。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_033","year":2020,"roc_year":109,"session":"1","examNo":33,"q":"依據優良農產品驗證管理辦法，熟鹹蛋中之大腸桿菌群（ Coliform ）之檢驗標準為何？","opts":["A. 10 MPN/g以下","B. 5 MPN/g以下","C. 2 MPN/g以下","D. 不得檢出"],"ans":3,"exp":"依優良農產品（CAS/TAP）驗證管理辦法，熟鹹蛋屬於加工蛋製品，大腸桿菌群（Coliform）檢驗標準為「不得檢出」（ND，陰性），以確保熟食產品的微生物安全。","we":["10 MPN/g以下標準過於寬鬆，不符合熟食加工產品的衛生要求。","5 MPN/g以下仍非熟鹹蛋的正確標準。","2 MPN/g以下亦非熟鹹蛋大腸桿菌群的標準。","（正確）熟鹹蛋中大腸桿菌群須不得檢出（陰性），符合CAS/TAP驗證基準的最嚴格要求，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_034","year":2020,"roc_year":109,"session":"1","examNo":34,"q":"下列有關仙人掌菌食品中毒原因的敘述，何者錯誤？","opts":["A. 原因菌為好氧性細菌","B. 中毒型態分為下痢型與嘔吐型","C. 原因菌具有芽孢","D. 原因菌為 Bacillus subtilis"],"ans":3,"exp":"仙人掌菌（Bacillus cereus）的正確特性：①屬需氧至兼性厭氧的細菌（非好氧性）；②中毒型態分為下痢型和嘔吐型；③具有芽孢（耐熱）。選項D說「原因菌為Bacillus subtilis（枯草芽孢桿菌）」是錯誤的，正確病原應為Bacillus cereus（仙人掌菌）。","we":["Bacillus cereus為需氧至兼性厭氧菌，並非嚴格好氧性，且確實為仙人掌菌食中毒的病原，此選項本身描述偏差但與其他選項相比此為最不明確者；本題最明顯的錯誤是D。","中毒型態確實分為下痢型（腸毒素型）和嘔吐型（嘔吐毒素型），此敘述正確。","Bacillus cereus確實具有芽孢，能耐高溫，是食品安全的重要問題，此敘述正確。","（正確）仙人掌菌食物中毒的原因菌為Bacillus cereus，而非Bacillus subtilis（枯草桿菌），此選項說法錯誤，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_035","year":2020,"roc_year":109,"session":"1","examNo":35,"q":"依據屠宰衛生檢查規則，家禽屠後檢查時，判定為切除該患部其餘正常部分可以供食用者，下列何者例外？","opts":["A. 局部雞痘之病變組織","B. 馬立克病及雞白血病","C. 局部性出血或鬱血","D. 局部性外傷"],"ans":1,"exp":"依屠宰衛生檢查規則，家禽屠後檢查中，馬立克病（Marek's disease）及雞白血病（Avian leukosis）屬於全身性腫瘤性疾病，判定為全部廢棄（不得供食用），不可只切除患部保留其餘部位。其他如局部雞痘、局部出血或外傷等，僅需切除患部，其餘正常部位仍可食用。","we":["局部雞痘（局部性）切除患部後，其餘正常組織可供食用，此非例外情形。","（正確）馬立克病及雞白血病為全身性腫瘤病，無法只切除患部，需全廢棄，是「例外不可僅切除患部」的情形，為正確答案。","局部性出血或鬱血屬局部病變，切除後其餘可食用，非例外情形。","局部性外傷屬局部病變，切除患部後其餘可食用，非例外情形。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_036","year":2020,"roc_year":109,"session":"1","examNo":36,"q":"依據動物產品中農藥殘留容許量標準，嘉磷塞（glyphosate）在豬、牛、禽肌肉中的殘留容許量為多少ppm？","opts":["A. 100","B. 10","C. 1","D. 0.1"],"ans":3,"exp":"依台灣「動物產品中農藥殘留容許量標準」，嘉磷塞（glyphosate，農達除草劑主成分）在豬、牛、禽等肌肉中的殘留容許量為0.1 ppm，屬於嚴格限值，因肌肉為直接食用部位。","we":["100 ppm 過高，非肌肉中的殘留容許量。","10 ppm 亦非正確限值。","1 ppm 亦非正確限值（肌肉中更嚴格）。","（正確）嘉磷塞在豬、牛、禽肌肉中的殘留容許量為0.1 ppm，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_037","year":2020,"roc_year":109,"session":"1","examNo":37,"q":"下列何種細菌以豬為最常見之宿主，容易引起人類感染型食物中毒？","opts":["A. Clostridium botulinum","B. Yersinia enterocolitica","C. Listeria monocytogenes","D. Bacillus cereus"],"ans":1,"exp":"Yersinia enterocolitica（腸炎耶辛氏菌）的最主要動物宿主為豬（豬為無症狀帶菌者），可污染豬肉及豬肉相關產品，人食入後引起感染型食物中毒，症狀包括腸炎、假性闌尾炎、關節炎等。","we":["Clostridium botulinum（肉毒桿菌）引起毒素型食物中毒，主要與罐頭食品、醃製品相關，最常見宿主並非豬。","（正確）Yersinia enterocolitica以豬為最常見宿主，可引起人類感染型食物中毒，為正確答案。","Listeria monocytogenes（李斯特菌）廣泛存在於環境、多種動物中，非以豬為特定最常見宿主。","Bacillus cereus（仙人掌菌）主要來自土壤和植物，與豬無特定關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_038","year":2020,"roc_year":109,"session":"1","examNo":38,"q":"下列有關禽流感之敘述，何者錯誤？","opts":["A. 禽流感病毒一般僅感染禽類，但在某些情況下會跨越物種障礙感染人","B. 若發現有疑似病例之屠體，必須封存送檢，檢驗結果陽性時，該批禽肉都要銷毀","C. 需經屠前檢查陰性合格者，才能進行屠宰","D. 禽肉完全煮熟時仍無法完全殺死禽流感病毒"],"ans":3,"exp":"禽流感病毒（influenza A）在高溫下可被殺死；完全煮熟的禽肉（達到足夠溫度，如70°C以上持續數分鐘）可有效殺死禽流感病毒，使肉品安全食用。「禽肉完全煮熟時仍無法完全殺死禽流感病毒」的說法是錯誤的，禽流感病毒並非耐熱病原。","we":["禽流感病毒雖以禽類為主，但在某些情況下確實可感染人（如H5N1、H7N9），此敘述正確。","疑似陽性屠體封存送檢，陽性時全批銷毀，是標準處理程序，此敘述正確。","屠前檢查陰性才能進入屠宰程序，是防止疫情擴散的標準措施，此敘述正確。","（正確）禽流感病毒對熱敏感，禽肉完全煮熟可以完全殺死病毒，「仍無法殺死」的說法錯誤，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_039","year":2020,"roc_year":109,"session":"1","examNo":39,"q":"生乳送往加工廠前應先檢測合格後才可進行加工，其測定項
