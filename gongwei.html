防止因分組而產生的測量與觀察差異。","隨機分組使各組在已知與未知干擾因子上趨於均衡，但觀察者仍可能因知悉分組而產生偏差。","長期追蹤有助於觀察疾病自然史，但無法防止觀察者因知悉分組而做出差異性評估。","分層分析用於控制干擾因子，無法防止因分組知識產生的觀察偏差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_011","year":2023,"roc_year":112,"session":"","examNo":11,"q":"某馬場新購入200匹馬，購入時有100匹馬具有西尼羅病毒抗體，5年後再次測量發現共有150匹呈現抗體陽\r   性。下列敘述何者正確？（假設5年間沒有馬匹新生或死亡，亦沒有抗體由陽轉陰的問題）","opts":["A. 西尼羅病毒5年累積感染發生率為25%（50/200）","B. 最後一次測量時西尼羅病毒感染盛行率為50%（50/100）","C. 西尼羅病毒感染發生密度為10/每千馬年","D. 西尼羅病毒感染發生密度為100/每千馬年"],"ans":3,"exp":"5年累積感染發生率以可感受個體（初始抗體陰性的100匹）為分母，5年新增陽性50匹，故累積發生率=50/100=50%。發生密度=50匹/(100匹×5年)=50/500馬年=100/每千馬年。因此選項D（100/每千馬年）正確。","we":["累積發生率分母應為可感受個體（100匹陰性馬），而非全部200匹，故25%（50/200）錯誤。","最後測量時盛行率為150/200=75%，非50/100=50%，故此選項錯誤。","發生密度=50新病例/(100可感受馬×5年)=0.1/馬年=100/千馬年，非10/千馬年。","（正確）發生密度=50/(100×5)=0.1/馬年=100/每千馬年，此選項正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_012","year":2023,"roc_year":112,"session":"","examNo":12,"q":"以流行病學觀察性研究探討甲及乙因子引發疾病的可能性，結果顯示甲因子造成疾病相對危險性為5，乙因子\r   造成疾病相對危險性為10，甲與乙同時存在時引起疾病的相對危險性為14。下列敘述何者錯誤？","opts":["A. 甲因子可能是造成疾病的危險因子","B. 乙因子可能是造成疾病的危險因子","C. 甲與乙因子未呈現相加性交互作用","D. 甲與乙因子具相乘性交互作用"],"ans":3,"exp":"相加性交互作用：若甲乙單獨RR分別為5和10，相加性預期甲乙合計RR=5+10-1=14，而實際RR=14，恰好等於相加性預期，故甲乙呈現相加性交互作用（而非未呈現）。相乘性預期RR=5×10=50，實際14＜50，故無相乘性交互作用。選項D「甲與乙因子具相乘性交互作用」錯誤，是本題答案。","we":["甲因子RR=5＞1，確實可能是危險因子，此敘述正確。","乙因子RR=10＞1，確實可能是危險因子，此敘述正確。","相加性預期=5+10-1=14，實際=14，恰好呈現相加性交互作用，故「未呈現相加性」是錯誤的，此敘述錯誤，即C選項為錯誤敘述。","（正確作為錯誤選項）相乘性預期=5×10=50，實際14遠小於50，無相乘性交互作用，故D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_013","year":2023,"roc_year":112,"session":"","examNo":13,"q":"結紮與尿道\r   結石之相對危險性（relative risk）為何？","opts":["A. (30/400) / (10/3000)","B. (30 × 2990) / (10 × 370)","C. (10 × 370) / (30 × 2990)","D. (30/40) / (370/3360)"],"ans":0,"exp":"本題需配合題目中未完整呈現的2×2表格。依題目選項格式推測，相對危險性（RR）＝暴露組發病率／非暴露組發病率。若結紮組（暴露）病例數為30、結紮組總數為400，非結紮組病例數為10、總數為3000，則RR=(30/400)/(10/3000)，對應選項A。","we":["（正確）RR=暴露組發病率/非暴露組發病率=(30/400)/(10/3000)，此為正確計算式。","選項B的計算式為OR（勝算比）的分子，而非RR，用途不同。","選項C為OR分母（病例對照研究），不是世代研究的RR計算式。","選項D分母為370（40-30=10？），計算式與標準RR公式不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_公衛_014","year":2023,"roc_year":112,"session":"","examNo":14,"q":"承上題，尿道結石與結紮有關的相差危險性（attributable risk）為何？","opts":["A. (30/400) / (10/3000)","B. (30/400)－(10/3000)","C. (30/370)－(10/2990)","D. (30 × 2990) / (10 × 370)"],"ans":1,"exp":"相差危險性（attributable risk, AR）＝暴露組發病率－非暴露組發病率。在世代研究中，若依暴露（結紮）狀況分組，AR＝（結紮組發病率）－（非結紮組發病率）＝(30/400)－(10/3000)，對應選項B。","we":["選項A為相對危險性（RR）的計算式，不是相差危險性。","（正確）相差危險性＝暴露組發病率－非暴露組發病率＝(30/400)－(10/3000)。","選項C的分母370和2990是去除病例後的人數（病例對照研究計算OR的方式），非世代研究AR公式。","選項D為勝算比（OR）的計算式，不是相差危險性。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_公衛_015","year":2023,"roc_year":112,"session":"","examNo":15,"q":"下列有關病例對照研究法（case-control study）與世代研究法（cohort study）之比較，何者錯誤？","opts":["A. 前者之相關性強度以勝算比（odds ratio）來表示","B. 前者較快得到結果","C. 後者較不會有記憶偏差","D. 兩者在研究之始都必須有病例的存在"],"ans":3,"exp":"世代研究（cohort study）在研究開始時依暴露狀況分組，追蹤後才觀察是否發病，研究開始時並不需要有病例存在。病例對照研究才需要有病例（已確診的病例組）才能開始研究。故「兩者在研究之始都必須有病例的存在」為錯誤敘述。","we":["病例對照研究確實以勝算比（OR）作為相關強度的指標，此敘述正確。","病例對照研究從已有疾病結果回溯暴露，速度確實較快，此敘述正確。","世代研究為前瞻性收集資料，暴露確認在發病之前，不存在回憶偏差問題，此敘述正確。","（正確）世代研究開始時只需依暴露狀況分組，不需要已有病例；只有病例對照研究才需要病例，D錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_016","year":2023,"roc_year":112,"session":"","examNo":16,"q":"在肉品衛生調查時，於屠宰線上每隔固定頭數豬經過，即選取抽樣的豬作為採檢對象，直到達到預期調查的\r   樣本總數後即停止抽樣，此種抽樣方式屬於下列何者？","opts":["A. 簡單抽樣","B. 系統性抽樣","C. 分層抽樣","D. 集簇抽樣"],"ans":1,"exp":"每隔固定頭數選取一頭豬的抽樣方式稱為系統性抽樣（systematic sampling），即按照固定間隔從抽樣框中抽取樣本。簡單抽樣是完全隨機選取，分層抽樣需先依特性分層，集簇抽樣以群組為單位抽取。","we":["簡單抽樣（simple random sampling）是從族群中完全隨機選取，並非按固定間隔抽取。","（正確）每隔固定頭數選取即為系統性抽樣，按等間隔從排列中抽取樣本。","分層抽樣（stratified sampling）需先將族群依特性分層再各層隨機抽樣，不適用本情境。","集簇抽樣（cluster sampling）以群組（如豬場、欄）為抽樣單位，不是按頭數間隔抽取。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_017","year":2023,"roc_year":112,"session":"","examNo":17,"q":"在修改疫苗計畫之後，某雞場主人想了解感染傳染性支氣管炎的盛行率比起先前的10%是否有改變，在統計\r   的信心水準為95%之下，並容許盛行率估計誤差為 ± 2%，若不考慮母群體數，所需抽樣數約為下列何者？（Z 0.975 ≒2）","opts":["A. 900","B. 450","C. 200","D. 100"],"ans":0,"exp":"樣本數公式：n = Z² × p(1-p) / d²，其中 Z=2（95%信心水準），p=0.1，d=0.02。n = (2²×0.1×0.9) / (0.02²) = (4×0.09) / 0.0004 = 0.36 / 0.0004 = 900。所需抽樣數約為900。","we":["（正確）n = Z²p(1-p)/d² = 4×0.1×0.9/0.0004 = 0.36/0.0004 = 900。","450僅為正確答案的一半，可能誤用Z=1（68%信心水準），不符合題目要求。","200遠低於正確計算值，樣本數不足以達到所要求的精確度。","100樣本數過少，會導致估計誤差遠超過±2%的要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_018","year":2023,"roc_year":112,"session":"","examNo":18,"q":"下列何者為兩次檢測後的全盤敏感性（overall sensitivity）？","opts":["A. 64%","B. 72%","C. 54%","D. 48%"],"ans":0,"exp":"本題需配合未完整呈現的檢測表格。兩次檢測的全盤敏感性（overall sensitivity）若採平行（parallel）策略，overall Se = 1-(1-Se1)(1-Se2)；若採序列（serial）策略，overall Se = Se1 × Se2。依常見國考題型，若Se1=Se2=0.8，平行策略overall Se = 1-(0.2×0.2) = 0.96；序列策略則為 0.8×0.8 = 0.64。64%對應選項A，推測為序列測試。","we":["（正確，需配合原始表格確認）依序列測試策略，overall Se = Se1×Se2，推測為64%。","72%可能對應特異度相關計算，非全盤敏感性的標準計算結果。","54%不符合常見二次檢測敏感性計算的結果。","48%不符合常見二次檢測敏感性計算的結果。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_公衛_019","year":2023,"roc_year":112,"session":"","examNo":19,"q":"下列何者為test 2檢測的陽性預測值（positive predictive value）？","opts":["A. 18%","B. 26%","C. 50%","D. 90%"],"ans":2,"exp":"陽性預測值（PPV）= TP / (TP + FP)。本題需配合原始表格計算。依常見國考題型推算（盛行率10%，Se=0.8，Sp=0.9），PPV ≈ 0.8×0.1 / (0.8×0.1 + 0.1×0.9) = 0.08/0.17 ≈ 47%，最接近50%（選項C）。需以原始表格數值確認。","we":["18%偏低，可能錯誤計算為FP/(FP+TN)或混淆分母。","26%與常見計算結果不符，可能使用了不同的表格數值。","（正確推測）50%最接近依標準參數推算的PPV，需配合原始表格確認。","90%接近特異度而非陽性預測值，可能混淆兩個指標。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_公衛_020","year":2023,"roc_year":112,"session":"","examNo":20,"q":"經兩次檢測後，結果為偽陽性的數目有多少？","opts":["A. 72","B. 144","C. 432","D. 828"],"ans":2,"exp":"偽陽性數目為真正陰性但被兩次檢測都判為陽性的數目。若採平行策略，FP_overall = 未感染動物數 × (1-Sp1) × (1-Sp2) 取補集，或 FP = 未感染動物數 × [1-(Sp1)(Sp2)]（至少一次陽性的FP）。依常見國考題型推算，偽陽性數目為432（選項C），需配合原始表格確認。","we":["72可能為單次test的TP數，而非兩次檢測後的偽陽性總數。","144可能計算時未正確使用聯合策略，導致偏低估計。","（正確推測）432為最常見的標準答案，對應典型國考題表格中的偽陽性數目。","828可能誤算為TN或其他類別的數目。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_公衛_021","year":2023,"roc_year":112,"session":"","examNo":21,"q":"利用讓動物暴露於環境中之低量病原體時，以獲得免疫能力的免疫策略為何？","opts":["A. 群體免疫","B. 自然免疫","C. 基礎免疫","D. 遺傳免疫"],"ans":1,"exp":"讓動物暴露於環境中低量病原體以獲得免疫力，稱為自然免疫（natural immunity）或自然感染免疫。群體免疫是整體族群的概念，基礎免疫指基礎接種計畫，遺傳免疫是與生俱來的先天抵抗力。","we":["群體免疫（herd immunity）是指族群中足夠比例個體具免疫力，使病原無法有效傳播，是群體層次的概念，並非個體透過低量病原暴露獲得免疫的策略。","（正確）藉由讓動物自然暴露於環境中的低量病原體而獲得免疫力，屬於自然免疫策略。","基礎免疫（primary vaccination）指按程序接種疫苗的基礎免疫計畫，並非自然暴露策略。","遺傳免疫（genetic immunity）是與遺傳背景相關的先天性抵抗力，非後天暴露所獲得。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_022","year":2023,"roc_year":112,"session":"","examNo":22,"q":"競爭性排除（competitive exclusion）屬於下列何種疾病控制方法？","opts":["A. 生物性控制（biological control）","B. 使用治療性化學藥品（therapeutic drug use）","C. 傳毒物的消毒（fomite disinfection）","D. 填補空穴（niche filling）"],"ans":0,"exp":"競爭性排除（competitive exclusion）是利用益菌或正常菌叢與病原菌競爭棲位和資源，使病原菌無法定殖，屬於生物性控制（biological control）的範疇。此策略常用於控制家禽腸道沙氏桿菌，藉由提供健康菌叢競爭排除病原。","we":["（正確）競爭性排除利用正常菌叢競爭定殖棲位排除病原菌，是生物性控制方法。","使用治療性化學藥品是化學療法，競爭性排除完全不涉及化學藥品。","傳毒物消毒是針對環境中的無生物傳播媒介，競爭性排除是活菌的生物競爭機制。","填補空穴（niche filling）本身是競爭性排除的作用機制之一，但作為獨立選項不是分類名稱，而競爭性排除的分類歸屬是「生物性控制」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_023","year":2023,"roc_year":112,"session":"","examNo":23,"q":"下列何者的定義係指病原體長期存在某一地區或族群之動物中，而不需要時常的重新引入傳染源？","opts":["A. 宿主","B. 保毒宿主","C. 帶原者","D. 病媒"],"ans":1,"exp":"保毒宿主（reservoir host）的定義是病原體長期持續存在於某動物族群中，不需要從外部重新引入傳染源，可維持病原體在自然界的循環。宿主泛指任何可被感染的動物，帶原者指攜帶病原但無明顯症狀的個體，病媒是傳播病原的節肢動物或其他媒介。","we":["宿主（host）泛指能被病原體感染的動物，定義較廣，無「長期維持病原不需重新引入」的意涵。","（正確）保毒宿主（reservoir）是病原體長期存在的動物族群，使病原無需外部重新引入即可持續存在。","帶原者（carrier）指攜帶病原且可傳播但無明顯臨床症狀的個體，強調個體層次，非族群維持。","病媒（vector）是傳播病原的節肢動物，強調傳播功能，並非「病原長期存在」的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_024","year":2023,"roc_year":112,"session":"","examNo":24,"q":"依據食品安全衛生管理法，屠宰場內畜禽屠宰及分切之衛生查核，由下列那個機關依相關法規規定辦理？","opts":["A. 農業主管機關","B. 衛生福利主管機關","C. 經濟主管機關","D. 環境資源主管機關"],"ans":0,"exp":"依食品安全衛生管理法第22條規定，屠宰場內畜禽屠宰及分切之衛生查核，由農業主管機關依相關法規（畜牧法、屠宰衛生檢查規則）辦理。食品安全管理雖由衛生福利部負責，但屠宰場內的屠宰查核權責屬農業主管機關。","we":["（正確）依食品安全衛生管理法，屠宰場內畜禽屠宰及分切衛生查核由農業主管機關負責。","衛生福利主管機關負責食品流通於市面後的衛生管理，屠宰場內的查核不歸其管轄。","經濟主管機關無管轄畜禽屠宰衛生查核的法源依據。","環境資源主管機關主管環境保護事務，與畜禽屠宰衛生查核無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_025","year":2023,"roc_year":112,"session":"","examNo":25,"q":"依據畜牧法，屠宰衛生檢查規則由下列何者訂定？","opts":["A. 行政院農業委員會會同衛生福利部","B. 行政院農業委員會動植物防疫檢疫局","C. 衛生福利部會同行政院農業委員會","D. 衛生福利部"],"ans":0,"exp":"依畜牧法第31條規定，屠宰衛生檢查規則由行政院農業委員會會同衛生福利部訂定。此規定體現農業與衛生雙主管機關共同負責屠宰衛生的精神。","we":["（正確）依畜牧法，屠宰衛生檢查規則由行政院農業委員會會同衛生福利部訂定。","行政院農業委員會動植物防疫檢疫局是農委會下屬機關，無法單獨訂定此規則。","衛生福利部會同農委會的順序相反，法規明定農委會為主辦機關。","衛生福利部單獨無法訂定屠宰衛生檢查規則，需與農委會共同訂定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_027","year":2023,"roc_year":112,"session":"","examNo":27,"q":"對於國內外動物傳染病疫區和非疫區之公告，由下列何者負責？","opts":["A. 行政院農業委員會","B. 衛生福利部","C. 各縣巿政府","D. 財團法人中央畜產會"],"ans":0,"exp":"依動物傳染病防治條例，國內外動物傳染病疫區和非疫區的公告，由行政院農業委員會負責。農委會為動物疾病防治的中央主管機關。","we":["（正確）依動物傳染病防治條例，疫區非疫區之公告由行政院農業委員會負責。","衛生福利部主管人類公共衛生，動物傳染病疫區公告不屬其職權。","各縣市政府為地方機關，疫區公告屬中央主管機關職權。","財團法人中央畜產會為民間法人，無法律授權進行疫區公告。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_028","year":2023,"roc_year":112,"session":"","examNo":28,"q":"目前政府執行畜禽違法使用乙型受體素抽驗不合格案件，是由下列何者依動物用藥品管理法相關規定查處？","opts":["A. 行政院農業委員會動植物防疫檢疫局","B. 衛生福利部食品藥物管理署","C. 轄區直轄市、縣（市）動物防疫機關","D. 財團法人中央畜產會"],"ans":2,"exp":"依動物用藥品管理法，畜禽違法使用乙型受體素（瘦肉精）的查處，由轄區直轄市、縣（市）動物防疫機關依相關規定辦理。此屬地方動物防疫主管機關的執法職權。","we":["農委會動植物防疫檢疫局為中央機關，實際查處違法用藥由地方動物防疫機關執行。","食品藥物管理署主管食品及人用藥品，動物用藥品違法使用非其主要職掌。","（正確）依動物用藥品管理法，違法使用乙型受體素由轄區直轄市、縣市動物防疫機關查處。","財團法人中央畜產會無執法權限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_029","year":2023,"roc_year":112,"session":"","examNo":29,"q":"國內發生重大動物疫情時，需向下列那一個國際組織通報疫情？","opts":["A. 世界動物衛生組織（OIE）","B. 世界衛生組織（WHO）","C. 動物疾病管制中心（CDC）","D. 世界糧農組織（FAO）"],"ans":0,"exp":"依動物傳染病防治條例，國內發生重大動物疫情時，應向世界動物衛生組織（OIE，現更名為WOAH）通報。OIE為動物衛生領域的國際權威組織，負責收集全球動物疫情資訊。","we":["（正確）重大動物疫情應向世界動物衛生組織（OIE/WOAH）通報，此為法定義務。","世界衛生組織（WHO）主要負責人類公共衛生，動物疫情通報需向OIE（WOAH）提報。","CDC通常指疾病管制中心，為各國國內機構，非接受動物疫情國際通報的組織。","世界糧農組織（FAO）與OIE（WOAH）有合作關係，但法定通報對象為OIE（WOAH）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_030","year":2023,"roc_year":112,"session":"","examNo":30,"q":"依據動物及其產品進出金門馬祖地區檢查規則，牛隻輸往臺灣本島前，應於來源場或所在地動物防疫機關指\r  定之隔離場所內，隔離飼養檢查多少日以上？","opts":["A. 7","B. 14","C. 21","D. 30"],"ans":2,"exp":"依動物及其產品進出金門馬祖地區檢查規則，牛隻輸往臺灣本島前應在指定隔離場所隔離飼養21日以上，以確認無動物傳染病後才得輸入本島。","we":["7日隔離期過短，不足以觀察大多數動物傳染病的潛伏期，不符合規定。","14日常用於一般進口動物隔離，但金馬地區牛隻輸臺的規定為21日。","（正確）依規定，金馬地區牛隻輸往臺灣本島須隔離飼養21日以上。","30日隔離期超過法規規定的21日最低要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_031","year":2023,"roc_year":112,"session":"","examNo":31,"q":"下列何者為畜牧場中規定要聘用「特約獸醫師」的法源依據？","opts":["A. 獸醫師法","B. 動物用藥品管理法","C. 動物傳染病防治條例","D. 畜牧法"],"ans":3,"exp":"畜牧場聘用特約獸醫師的規定源自畜牧法，畜牧法明定一定規模以上的畜牧場需聘用特約獸醫師，負責場內動物健康管理、疾病預防及疫苗接種等工作。","we":["獸醫師法規範獸醫師的執業資格與行為規範，未有畜牧場應聘特約獸醫師的規定。","動物用藥品管理法規範動物用藥品的製造、輸入、販售與使用，不含聘用獸醫師的規定。","動物傳染病防治條例規範動物傳染病的防治措施，不含畜牧場聘用特約獸醫師的規定。","（正確）畜牧法第26條規定，達一定規模的畜牧場應聘用特約獸醫師，是法源依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_032","year":2023,"roc_year":112,"session":"","examNo":32,"q":"依據畜禽人道屠宰準則，下列何者不是有效的致昏家畜判定基準？","opts":["A. 無眼瞼反應","B. 有節律性呼吸","C. 對擰耳刺鼻無反應","D. 無發出聲音或四肢僵直後之無意識踢動"],"ans":1,"exp":"依畜禽人道屠宰準則，有效致昏的判定基準包括：無眼瞼反應、無有節律性（規則性）呼吸、對擰耳刺鼻無反應、無發出聲音或四肢僵直後無意識踢動等。「有節律性呼吸」表示動物仍有意識，是動物尚未有效致昏的指標，故為不符合有效致昏的狀況。","we":["無眼瞼反應（眼瞼反射消失）是有效致昏的正向判定基準之一，不在例外之列。","（正確）有節律性呼吸表示動物仍有腦幹反射，代表未有效致昏，是判定無效致昏的指標。","對擰耳刺鼻無反應是有效致昏的正向判定基準，不是「不有效」的指標。","無發出聲音或四肢無意識踢動也是有效致昏的正向判定基準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_033","year":2023,"roc_year":112,"session":"","examNo":33,"q":"依據畜禽人道屠宰準則，畜禽未經人道致昏前不得放血，但仍有例外，下列何者並不屬於例外狀況？","opts":["A. 宗教","B. 特殊民俗","C. 經中央主管機關認定之事由","D. 中秋烤肉活動"],"ans":3,"exp":"依畜禽人道屠宰準則，未致昏即放血（不先致昏）的例外情況包括：宗教因素（如清真、猶太屠宰）、特殊民俗，以及經中央主管機關認定的事由。「中秋烤肉活動」並非法定例外情況，屬於一般節慶活動，不得豁免人道屠宰規定。","we":["宗教（如伊斯蘭清真屠宰、猶太潔食屠宰）是法定允許不先致昏的例外情況。","特殊民俗為法規明文列舉的例外情況之一。","經中央主管機關認定之事由為概括性例外條款，屬法定例外。","（正確）中秋烤肉活動非法定例外，不得以此為由跳過人道致昏程序，應判為廢棄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_034","year":2023,"roc_year":112,"session":"","examNo":34,"q":"丙式屠宰衛生檢查合格標誌，適用於下列何種畜產品？","opts":["A. 豬牛屠體表面","B. 剝皮屠體","C. 禽肉包裝","D. 禽肉包裝束口"],"ans":2,"exp":"依屠宰衛生檢查規則，屠宰衛生檢查合格標誌分為甲、乙、丙三式。丙式標誌適用於家禽（禽肉）的包裝，張貼於禽肉包裝上。甲式適用於豬牛屠體表面（火印），乙式適用於剝皮屠體或禽類屠體，丙式為禽肉包裝使用的標貼。","we":["豬牛屠體表面使用甲式標誌（熱壓火印），不是丙式。","剝皮屠體使用乙式標誌，不是丙式。","（正確）丙式標誌適用於禽肉包裝，以貼紙或標籤形式黏貼於包裝上。","禽肉包裝束口使用的是另一型式標誌，丙式為平面標貼而非束口封條。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_035","year":2023,"roc_year":112,"session":"","examNo":35,"q":"依據屠宰衛生檢查規則，家禽屠後檢查時發現屠體受消化道內容物之嚴重污染者，應如何判定？","opts":["A. 不合格","B. 稽留","C. 清洗後合格","D. 縝密檢查"],"ans":0,"exp":"依屠宰衛生檢查規則，家禽屠後檢查時若發現屠體受消化道內容物嚴重污染，應判定為「不合格」（廢棄），不得清洗後流入市場，以防止食品安全風險。","we":["（正確）消化道內容物嚴重污染屠體，依規定應判定不合格廢棄。","「稽留」是需要進一步檢查後才能判定的暫時措施，不適用於嚴重污染的情形。","消化道嚴重污染屬食品安全問題，清洗無法確保安全，不得以清洗後合格處理。","「縝密檢查」適用於疑似有疾病但尚無法確認的情形，嚴重污染應直接廢棄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_036","year":2023,"roc_year":112,"session":"","examNo":36,"q":"臺灣豬隻屠宰時，屠檢獸醫師會在下列那個步驟之後進行屠後檢查？","opts":["A. 放血","B. 剖胸剖腹","C. 取出內臟","D. 屠體沖洗"],"ans":2,"exp":"臺灣豬隻屠宰流程為：擊昏→放血→燙毛或剝皮→清洗→剖胸剖腹→取出內臟→屠體分切。屠後檢查在取出內臟後進行，此時可同時檢查屠體與內臟，判斷是否有疾病病變。","we":["放血後屠體尚未剖開，無法進行完整的屠後檢查（需檢查內臟）。","剖胸剖腹是打開體腔的步驟，內臟尚在體內，無法完整檢查。","（正確）取出內臟後，屠後檢查員同時檢查屠體（頭、體表）及內臟（肺、心、肝、腎等）。","屠體沖洗是最後清潔步驟，在屠後檢查之後進行，而非檢查後的步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_037","year":2023,"roc_year":112,"session":"","examNo":37,"q":"依據屠宰衛生檢查規則，進行屠體衛生檢查時，下列何種疾病之屠體應判為全部廢棄？","opts":["A. 豬瘟","B. 局部性豬丹毒","C. 慢性黴漿菌肺炎","D. 侷限性的布氏桿菌症"],"ans":0,"exp":"依屠宰衛生檢查規則，豬瘟等法定動物傳染病的屠體應判為全部廢棄。豬瘟（Classical Swine Fever）為法定傳染病，其屠體不得流入食物鏈。局部性豬丹毒、慢性黴漿菌肺炎、侷限性布氏桿菌症則可去除患部後條件性通過。","we":["（正確）豬瘟為法定動物傳染病，屠體應全部廢棄，不得供食用。","局部性豬丹毒可切除病灶部位，其餘屠體條件性通過，不需全部廢棄。","慢性黴漿菌肺炎為局部性病變，通常切除病灶肺葉後其餘部位可通過檢查。","侷限性布氏桿菌症若病變局限，可去除患部後條件性通過，非全部廢棄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_038","year":2023,"roc_year":112,"session":"","examNo":38,"q":"屠體之肺臟和心房充滿黑色血液，其最可能原因為何？","opts":["A. 創傷或骨折","B. 窒息","C. 敗血症","D. 豬瘟"],"ans":1,"exp":"肺臟和心房充滿黑色血液是窒息（asphyxia）的典型屠後病變。窒息時血液無法充分氧合，靜脈血（暗黑色）大量積聚於肺臟和右心。這常見於屠前壓制、運輸擁擠或致昏不當導致呼吸停止而非立即死亡的情形。","we":["創傷或骨折主要表現為局部出血、血腫、骨折部位充血，不會出現肺臟和心房充滿黑色血液的全面性表現。","（正確）窒息時動物因缺氧死亡，靜脈血（含大量CO2的暗黑色血液）積聚於肺臟和右心房，是典型表現。","敗血症會有全身性血管擴張、點狀出血、臟器腫大等病變，但不以「黑色血液充滿肺和心房」為主要特徵。","豬瘟主要表現為多發性出血點（皮膚、淋巴結、腎臟等），不以黑色血液積聚為主要病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_039","year":2023,"roc_year":112,"session":"","examNo":39,"q":"下列有關屠宰場供水規定之敘述，何者錯誤？","opts":["A. 使用地下水者，其水源應與化糞池、廢棄物堆置場所等污染源保持至少15公尺以上之距離","B. 屠宰場應充足供應攝氏63度以上之滅菌用熱水","C. 屠宰場之蓄水池應為密閉性構造物，其設置地點應距污穢場所、化糞池3公尺以上","D. 儲水槽（塔、池）應以無毒，不致污染水質之材料構築，並應有防護污染之設施"],"ans":1,"exp":"依屠宰場設置基準，屠宰場滅菌用熱水溫度規定應供應攝氏82度以上（非63度）的熱水，以有效消毒屠宰設備與器具。選項B所述63度低於法規要求，故為錯誤敘述。","we":["地下水水源與污染源距離15公尺以上的規定符合實際法規要求，此敘述正確。","（正確）法規要求屠宰場應充足供應攝氏82度以上（非63度）的滅菌用熱水，63度不符規定。","蓄水池為密閉性構造且距污穢場所3公尺以上的規定符合法規，此敘述正確。","儲水槽使用無毒材料且有防污染設施的規定符合法規要求，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_040","year":2023,"roc_year":112,"session":"","examNo":40,"q":"依據畜牧法，經檢查為合格之屠體及內臟或其包裝容器，其應標明之事項不包含下列何者？","opts":["A. 屠宰衛生檢查合格標誌","B. 屠宰衛生檢查獸醫師","C. 屠宰場編號","D. 屠宰日期"],"ans":1,"exp":"依畜牧法，合格屠體及內臟或其包裝容器應標明：屠宰衛生檢查合格標誌、屠宰場編號、屠宰日期。「屠宰衛生檢查獸醫師」個人姓名並非法定必須標明事項，屠宰查核由官方獸醫師執行，但不需在產品上標示個別獸醫師姓名。","we":["屠宰衛生檢查合格標誌是法定應標明事項，須印於屠體或包裝上。","（正確）屠宰衛生檢查獸醫師個人姓名不屬法定標示事項，標示屠宰場編號已足夠可追溯性。","屠宰場編號是法定應標明事項，可追溯產品來源。","屠宰日期是法定應標明事項，確保消費者了解產品新鮮度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_041","year":2023,"roc_year":112,"session":"","examNo":41,"q":"依據優良農產品驗證管理辦法，肉製品磷酸鹽添加使用標準為多少%以下？","opts":["A. 0.3","B. 0.5","C. 1.0","D. 1.5"],"ans":1,"exp":"依優良農產品驗證管理辦法，肉製品中磷酸鹽添加量規定不得超過0.5%（以磷酸根計）。磷酸鹽常作為保水劑使用，過量添加會影響腎功能，故有明確限量規定。","we":["0.3%低於實際規定的0.5%上限，此數值不正確。","（正確）依優良農產品驗證管理辦法，肉製品磷酸鹽添加量不得超過0.5%。","1.0%超過規定上限，屬不合格品，此數值不正確。","1.5%遠超規定上限，此數值不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_042","year":2023,"roc_year":112,"session":"","examNo":42,"q":"在燒烤牛排中容易發現下列何種主要是由蛋白質與胺基酸熱分解物產生的致癌物質？","opts":["A. 亞硫酸鹽","B. 多氯聯苯","C. 異環胺類","D. 多環芳香族碳氫化合物"],"ans":2,"exp":"異環胺類（heterocyclic amines, HCA）是由蛋白質和胺基酸在高溫（尤其是明火燒烤）時熱分解所產生的致癌物質，是燒烤肉類中最主要的致癌物來源之一。多環芳香族碳氫化合物（PAH）則主要來自不完全燃燒的煙霧，非胺基酸熱分解物。","we":["亞硫酸鹽是食品防腐劑，非燒烤過程中由蛋白質熱分解產生的致癌物。","多氯聯苯（PCB）是持久性有機污染物，來自工業污染，非燒烤分解產物。","（正確）異環胺類由肉類蛋白質中的胺基酸（如色胺酸、苯丙胺酸）高溫熱分解產生，為主要致癌物。","多環芳香族碳氫化合物主要由脂肪燃燒的煙霧沉積在肉表面，非蛋白質胺基酸熱分解的主要產物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_043","year":2023,"roc_year":112,"session":"","examNo":43,"q":"下列何種革蘭氏陽性菌容易在未適當冷藏的烤肉中繁殖而引起食物中毒？","opts":["A. 沙氏桿菌","B. 大腸桿菌","C. 產氣莢膜梭菌","D. 彎曲桿菌"],"ans":2,"exp":"產氣莢膜梭菌（Clostridium perfringens）是革蘭氏陽性菌，其芽孢耐熱，烤肉冷卻後若未適當冷藏，芽孢萌發並快速繁殖，大量攝入後毒素在腸道產生，引起食物中毒（腹瀉、腹痛）。","we":["沙氏桿菌（Salmonella）是革蘭氏陰性菌，不符合題目「革蘭氏陽性菌」的條件。","大腸桿菌（E. coli）是革蘭氏陰性菌，不符合題目「革蘭氏陽性菌」的條件。","（正確）產氣莢膜梭菌為革蘭氏陽性菌，其耐熱芽孢在未充分冷藏的烤肉中萌發繁殖，引起食物中毒。","彎曲桿菌（Campylobacter）是革蘭氏陰性菌，且不形成耐熱芽孢，不符合題目條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_044","year":2023,"roc_year":112,"session":"","examNo":44,"q":"下列何者不是醃製煙燻肉品中主要的食品安全問題？","opts":["A. 亞硝胺","B. 肉毒桿菌毒素","C. 多環芳香族碳氫化合物","D. 高鈉含量"],"ans":3,"exp":"醃製煙燻肉品的主要食品安全問題包括：亞硝胺（亞硝酸鹽與胺類反應）、肉毒桿菌毒素（厭氧低pH環境）、多環芳香族碳氫化合物（煙燻過程）。高鈉含量（鹽分高）是醃製肉品的營養健康問題，並非「食品安全（微生物或化學污染）」問題，故為不屬於主要食品安全問題的選項。","we":["亞硝胺（nitrosamines）由醃製用的亞硝酸鹽與食物中的胺類反應產生，是已知致癌物，確屬食品安全問題。","肉毒桿菌（Clostridium botulinum）在醃製品的厭氧環境中產生毒素，是重要食品安全威脅。","多環芳香族碳氫化合物（PAH）在煙燻過程中沉積於肉品表面，具致癌性，確屬食品安全問題。","（正確）高鈉含量是慢性健康問題（高血壓等），不屬於急性食品安全（污染、毒素）問題的分類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_045","year":2023,"roc_year":112,"session":"","examNo":45,"q":"根據優良農產品乳品項目驗證基準修正規定，每公克市售鮮乳含李斯特菌的生菌數規定為何？","opts":["A. 不得多於3,000","B. 不得多於300","C. 不得多於30","D. 不得檢出"],"ans":3,"exp":"依優良農產品乳品項目驗證基準，市售鮮乳中李斯特菌（Listeria monocytogenes）的規定為不得檢出（0 CFU/g），屬於「不得檢出」等級。李斯特菌為重要人畜共通食品病原，在低溫仍可生長，管制嚴格。","we":["3,000 CFU/g的容許量過高，不符合李斯特菌作為重要病原的嚴格管制要求。","300 CFU/g仍有允許殘留量，與法規「不得檢出」的要求不符。","30 CFU/g雖然極低，仍非「不得檢出」，與法規規定不符。","（正確）依驗證基準，鮮乳中李斯特菌規定不得檢出（zero tolerance）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_046","year":2023,"roc_year":112,"session":"","examNo":46,"q":"下列何者為一次污染性病原之疾病，最容易經由食用生乳或乳製品而感染人類？","opts":["A. 鸚鵡病","B. 結核病","C. 白喉","D. 志賀氏菌病"],"ans":1,"exp":"結核病（tuberculosis）由結核桿菌（Mycobacterium bovis/tuberculosis）引起，屬於一次污染性病原（animal source pathogens），牛的結核菌可直接分泌於乳汁中，未經巴氏殺菌的生乳或乳製品是人類感染牛結核病的重要途徑。","we":["鸚鵡病（psittacosis）由Chlamydia psittaci引起，主要經由吸入含病原的鳥糞塵埃傳染，不經乳品傳播。","（正確）結核病（牛型）病原可排泄於乳汁中，生乳是人類感染的重要媒介，屬一次污染性病原。","白喉（diphtheria）由Corynebacterium diphtheriae引起，主要經飛沫傳播，乳品為二次污染媒介，非一次污染。","志賀氏菌病（shigellosis）主要經糞口傳播，在乳品中屬二次污染，非一次污染性病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_047","year":2023,"roc_year":112,"session":"","examNo":47,"q":"生乳污染途徑中，下列何種細菌屬於下行性的生體內污染？","opts":["A. 念珠菌","B. 炭疽桿菌","C. 腸球菌","D. 彎曲桿菌"],"ans":1,"exp":"下行性（descending/endogenous）生體內污染是指病原體從感染動物的血液或其他部位，透過循環系統進入乳腺，直接污染乳汁。炭疽桿菌（Bacillus anthracis）感染動物後可由血液循環進入乳腺，屬下行性生體內污染。","we":["念珠菌（Candida spp.）屬外部上行性感染（乳頭管入侵），為上行性污染，非下行性。","（正確）炭疽桿菌為典型下行性生體內污染，經由菌血症從血液進入乳腺分泌至乳汁中。","腸球菌（Enterococcus）通常為乳腺上行性感染或環境污染，非典型下行性。","彎曲桿菌（Campylobacter）主要為腸道病原，乳品污染多為擠乳過程的外部污染，非下行性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_048","year":2023,"roc_year":112,"session":"","examNo":48,"q":"過量攝取大型魚的魚肝或內臟，可能導致何種中毒？","opts":["A. 維生素A","B. 維生素B","C. 維生素C","D. 維生素K"],"ans":0,"exp":"大型魚（鮪魚、鯊魚、劍旗魚等）的肝臟和內臟富含大量脂溶性維生素A（視黃醇），過量攝取會導致維生素A急性中毒，症狀包括噁心、嘔吐、頭痛、皮膚脫皮等。北極熊肝臟也因含極高量維生素A而著名，早期探險者食用後中毒。","we":["（正確）大型魚肝和內臟富含高濃度維生素A，過量攝取會導致急性或慢性維生素A中毒。","維生素B（水溶性）過量可由腎臟排出，不易因攝取大型魚而中毒。","維生素C（水溶性）過量也可由腎臟排出，不存在魚類攝取過量的問題。","維生素K雖為脂溶性，但魚類肝臟不含高濃度維生素K，不會引起維生素K中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_049","year":2023,"roc_year":112,"session":"","examNo":49,"q":"沙氏桿菌引起人類食物中毒通常需要至少多少菌量（CFU/g）？","opts":["A. 10 1 ～10 2","B. 10 3 ～10 4","C. 10 6 ～10 7","D. 10 10 ～10 11"],"ans":2,"exp":"沙氏桿菌（Salmonella spp.）引起人類食物中毒通常需要較大菌量，一般認為需要10⁶～10⁷ CFU/g（或更高）才能引起典型腸炎型食物中毒。這與肉毒桿菌毒素（極微量即可致命）不同，沙氏桿菌需要大量活菌進入腸道。","we":["10¹～10² CFU/g的菌量極低，沙氏桿菌需要更高菌量才能突破宿主防禦機制，此選項不正確。","10³～10⁴ CFU/g仍偏低，可能在少數免疫力低下者引起感染，但不是一般健康成人的最低致病量。","（正確）沙氏桿菌通常需要10⁶～10⁷ CFU/g以上的菌量才能引起典型食物中毒症狀。","10¹⁰～10¹¹ CFU/g過高，超過沙氏桿菌的實際致病菌量範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_050","year":2023,"roc_year":112,"session":"","examNo":50,"q":"依據優良農產品驗證管理辦法附件「優良農產品蛋品項目驗證基準」，下列何者於熟鹹蛋產品中有規定允許\r   檢出量？","opts":["A. 蘇丹紅","B. 生菌數","C. 己二烯酸及其鹽類","D. 四環黴素類抗生素"],"ans":1,"exp":"依優良農產品蛋品項目驗證基準，熟鹹蛋（加工蛋品）中規定有生菌數的允許檢出量（有標準值），而蘇丹紅、己二烯酸（苯甲酸）、四環黴素類抗生素等均為不得檢出的項目。生菌數是衛生品質指標，訂有容許量；其他為非法添加物或藥物殘留，不得檢出。","we":["蘇丹紅為非法色素（致癌物），所有蛋品中均不得檢出，無容許量。","（正確）生菌數是衛生指標，熟鹹蛋的驗證基準中有規定允許的最高生菌數值。","己二烯酸（山梨酸）及其鹽類在蛋品中不屬於允許添加的防腐劑，不得檢出。","四環黴素類抗生素為動物用藥物殘留，不得在蛋品中檢出（zero tolerance）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_051","year":2023,"roc_year":112,"session":"","examNo":51,"q":"下列何種沙氏桿菌血清型主要經由生食雞蛋感染人類？","opts":["A. Typhi","B. Enteritidis","C. Choleraesuis","D. Pullorum"],"ans":1,"exp":"沙氏桿菌腸炎型（Salmonella Enteritidis）主要藉由垂直傳播（transovarian transmission）感染雞隻卵巢，使蛋在形成過程中就受到污染，因此生食雞蛋（含雞蛋液）是人類感染的主要途徑。","we":["Salmonella Typhi引起人類傷寒，主要透過受污染的水和食物（糞口途徑），非經生食雞蛋。","（正確）Salmonella Enteritidis（腸炎沙氏桿菌）主要透過垂直感染污染雞蛋，生食蛋是主要感染途徑。","Salmonella Choleraesuis主要感染豬，可感染人但主要不經由生食雞蛋傳播。","Salmonella Pullorum引起雞白痢，主要感染家禽本身，較少引起人類食物中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_052","year":2023,"roc_year":112,"session":"","examNo":52,"q":"依據食品中污染物質及毒素衛生標準，關於牛羊豬及家禽可食性內臟其檢驗的金屬與其對應之限量標準，下\r   列何者正確？","opts":["A. 銅：5 ppm","B. 錫：150 ppm","C. 砷：0.2 ppm","D. 鉛：0.5 ppm"],"ans":3,"exp":"依食品中污染物質及毒素衛生標準，牛羊豬及家禽可食性內臟的鉛限量為0.5 ppm。其他金屬限量：銅的肝臟限量較高（25-50 ppm），錫主要針對罐頭食品（150 ppm），砷在肌肉中為0.1 ppm，內臟中砷限量為0.5 ppm，但鉛0.5 ppm是較確定的選項。","we":["銅的內臟限量一般高於5 ppm（如肝臟銅代謝旺盛，限量較高），5 ppm不是正確限量。","錫150 ppm主要適用於罐頭食品中的錫溶出，不是新鮮內臟的限量標準。","砷在可食性內臟中的限量一般為0.5 ppm而非0.2 ppm，此選項數值不準確。","（正確）鉛在牛羊豬及家禽可食性內臟的衛生標準為0.5 ppm，此為正確數值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_053","year":2023,"roc_year":112,"session":"","examNo":53,"q":"依據動物用藥殘留標準，下列何種藥品在水產動物訂有殘留容許量？","opts":["A. 孔雀綠","B. 龍膽紫","C. 硫酸銅","D. 三氯仿"],"ans":2,"exp":"依動物用藥殘留標準，硫酸銅（copper sulfate）在水產動物中訂有殘留容許量，可作為外用殺菌劑。孔雀綠（malachite green）和龍膽紫（crystal violet）為禁止使用的染料（致癌物），三氯仿（chloroform）亦屬禁用物質，均無容許量。","we":["孔雀綠（malachite green）已被列為禁用動物用藥品，其代謝物無色孔雀綠有致癌性，無容許量。","龍膽紫（crystal violet, gentian violet）同為禁用染料，無殘留容許量規定。","（正確）硫酸銅在水產動物中訂有使用規範及殘留容許量，是合法水產用藥。","三氯仿（chloroform）為有機氯溶劑，已禁止用於動物用藥，無殘留容許量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_054","year":2023,"roc_year":112,"session":"","examNo":54,"q":"食入過量有毒物質所引起的病徵，下列何者正確？","opts":["A. 鎘會引起周邊神經炎","B. 鉛會引起腦部病變","C. 鋅會引起多發性關節疼痛","D. 亞硝酸鹽會引起脈搏下降"],"ans":1,"exp":"鉛中毒會造成神經系統（腦部）病變，包括腦病變（encephalopathy）、智能受損、末梢神經炎等。兒童更敏感，可造成不可逆的腦部發育障礙。選項B「鉛會引起腦部病變」是正確的描述。","we":["鎘中毒主要引起腎臟近端小管損傷（腎小管病變）、骨軟化症（痛痛病），而非周邊神經炎，此敘述錯誤。","（正確）鉛中毒確實引起腦部病變（鉛腦病）和神經系統損傷，此為正確敘述。","鋅過量主要引起腸胃不適、銅吸收障礙，不引起多發性關節疼痛（痛痛病為鎘中毒），此敘述錯誤。","亞硝酸鹽中毒將血紅素氧化為變性血紅素（methemoglobin），使血液無法攜氧，造成血氧不足，臨床表現為發紺及脈搏加速而非下降，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_055","year":2023,"roc_year":112,"session":"","examNo":55,"q":"有關漢他出血熱腎病症候群（HFRS）及漢他病毒肺症候群（HPS）兩型之敘述，下列何者正確？","opts":["A. HFRS的死亡率高於HPS","B. HFRS是由漢他病毒屬之無名病毒（Sin Nombre virus）所引起","C. 嚙齒類動物為主要傳染媒介，而人是最終宿主","D. HPS主要發生在中國東北"],"ans":2,"exp":"漢他病毒有兩型：HFRS（出血熱腎病症候群）主要發生在亞洲和歐洲，HPS（漢他病毒肺症候群）主要發生在美洲，由無名病毒（Sin Nombre virus）引起。嚙齒類動物為主要傳染宿主，人是終端（終末）宿主，但不會人傳人。HFRS死亡率約1-15%，HPS死亡率約30-40%，HPS死亡率更高，C選項正確。","we":["HFRS死亡率（1-15%）低於HPS（30-40%），故「HFRS死亡率高於HPS」錯誤。","HPS（肺症候群）才是由Sin Nombre virus引起，HFRS不是，此敘述錯誤。","（正確）嚙齒類動物為主要傳染媒介，人是終末宿主，通常無人傳人，此敘述正確。","HPS主要發生在美洲（北美、南美），不是中國東北；HFRS才常見於中國東北，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_056","year":2023,"roc_year":112,"session":"","examNo":56,"q":"下列何種疾病在懷孕母豬可造成胎豬水腦、腦萎縮或畸型胎？","opts":["A. 日本腦炎","B. 布氏桿菌症","C. 鉤端螺旋體病","D. 李斯特菌症"],"ans":0,"exp":"日本腦炎病毒可感染懷孕母豬，透過胎盤感染胎豬，導致胎豬水腦（hydrocephalus）、腦萎縮或畸型胎、木乃伊化胎兒等。豬是日本腦炎病毒的放大宿主，蚊子叮咬感染豬後再叮人，可傳染給人類。","we":["（正確）日本腦炎病毒在懷孕母豬可經胎盤感染胎豬，造成水腦、腦萎縮或畸型胎。","布氏桿菌症（brucellosis）會造成流產，但主要表現為全身性感染和流產，不以水腦和腦畸型為主要病變。","鉤端螺旋體病在豬主要引起流產、死胎、黃疸和血紅素尿，不以水腦和腦畸型為特徵。","李斯特菌症可引起流產，偶見神經症狀，但不以水腦和腦畸型為典型胎兒病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_057","year":2023,"roc_year":112,"session":"","examNo":57,"q":"對於家禽流行性感冒病毒於禽類感染之傳播途徑，何者錯誤？","opts":["A. 藉緊密接觸而感染","B. 藉由水鳥、候鳥遷徙或受病毒污染之設備、用具、交通工具、工作人員傳播至另一禽群","C. 候鳥以及蒼蠅可能為此類病毒之傳播者","D. 介蛋傳播為主要途徑"],"ans":3,"exp":"禽流感（AI）在禽類主要透過：直接接觸感染禽只（或其分泌物/排泄物）、水鳥候鳥遷徙攜帶、污染設備/人員傳播等途徑。介蛋傳播（垂直傳播）極為罕見，高病原性禽流感感染的母禽通常死亡，產蛋率大幅下降，且病毒不穩定，介蛋傳播不是禽流感的主要傳播途徑。","we":["緊密接觸確實是禽流感在禽群間的主要傳播方式，此敘述正確。","水鳥、候鳥遷徙及污染設備人員是跨禽群傳播的重要途徑，此敘述正確。","候鳥和蒼蠅均可攜帶病毒成為傳播媒介，此敘述正確。","（正確）介蛋傳播非禽流感主要途徑，感染母禽通常無法正常產蛋，且病毒難以在蛋中存活，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_058","year":2023,"roc_year":112,"session":"","examNo":58,"q":"下列何者不是日本腦炎主要的流行國家？","opts":["A. 臺灣","B. 印度","C. 美國","D. 韓國"],"ans":2,"exp":"日本腦炎（Japanese Encephalitis）主要流行於亞洲和部分太平洋地區，包括臺灣、日本、韓國、中國、印度、東南亞等地。美國本土並非日本腦炎的流行地區，僅在關島等太平洋島嶼偶有病例報告，且無本土持續傳播紀錄，故美國不是主要流行國家。","we":["臺灣是日本腦炎的流行地區，有本土病例，尤其夏季豬群扮演放大宿主。","印度是日本腦炎的重要流行地區，尤其東北部和南部農業區病例眾多。","（正確）美國本土不是日本腦炎的流行國家，日本腦炎病毒不在美洲本土流行。","韓國是日本腦炎的流行地區之一，每年夏秋季有病例發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_059","year":2023,"roc_year":112,"session":"","examNo":59,"q":"下列何者不是由parapoxvirus所引起的疾病？","opts":["A. 牛丘疹性口炎","B. 羊接觸傳染性化膿性口炎","C. 偽牛痘","D. 牛痘"],"ans":3,"exp":"Parapoxvirus（副痘病毒屬）引起的疾病包括：牛丘疹性口炎（bovine papular stomatitis）、羊接觸傳染性化膿性口炎（orf, contagious ecthyma）、偽牛痘（pseudocowpox）等。牛痘（cowpox）由Orthopoxvirus（正痘病毒屬）引起，不屬於parapoxvirus。","we":["牛丘疹性口炎確實由parapoxvirus引起，此選項不是答案。","羊接觸傳染性化膿性口炎（Orf）確實由parapoxvirus引起，此選項不是答案。","偽牛痘（pseudocowpox）確實由parapoxvirus引起，此選項不是答案。","（正確）牛痘（cowpox）由Orthopoxvirus（正痘病毒屬）引起，非parapoxvirus，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_060","year":2023,"roc_year":112,"session":"","examNo":60,"q":"下列何種疾病必須藉由蚊子為媒介來傳播？","opts":["A. 拉薩熱（Lassa fever）","B. 克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）","C. 漢他病毒肺症候群（Hantavirus pulmonary syndrome）","D. 裂谷熱（Rift valley fever）"],"ans":3,"exp":"裂谷熱（Rift Valley Fever）由裂谷熱病毒引起，以蚊子（如Aedes、Culex等）為主要傳播媒介，蚊子吸食受感染動物血液後再叮咬人類或其他動物，可同時引起人與動物的疾病。拉薩熱經嚙齒類動物傳人，克里米亞剛果出血熱主要由蜱傳播，漢他肺症候群由鼠糞塵埃吸入。","we":["拉薩熱（Lassa fever）由拉薩病毒引起，主要透過接觸感染嚙齒類（多乳鼠Mastomys）的排泄物傳播，非蚊子媒介。","克里米亞剛果出血熱主要由璃眼蜱（Hyalomma）叮咬傳播，並非蚊子媒介。","漢他病毒肺症候群（HPS）透過吸入受感染鼠類糞便/尿液的乾燥塵埃傳播，非蚊子媒介。","（正確）裂谷熱必須藉由蚊子（Aedes、Culex）為媒介傳播，是本題唯一以蚊子傳播的疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_061","year":2023,"roc_year":112,"session":"","examNo":61,"q":"人類腸道出血型大腸桿菌感染症，大多數是與食用下列何種肉品相關？","opts":["A. 豬肉","B. 雞肉","C. 牛肉","D. 羊肉"],"ans":2,"exp":"腸道出血型大腸桿菌（EHEC，最常見為O157:H7）感染人類大多數病例與食用未熟牛肉（尤其是漢堡絞肉）相關，因牛是O157:H7的主要帶菌宿主，屠宰過程中腸道內容物污染牛肉是主要感染來源。","we":["豬肉與EHEC感染較少直接相關，沙氏桿菌和豬丹毒等是豬肉更常見的食安問題。","雞肉較常與Campylobacter、Salmonella Enteritidis感染相關，非EHEC的主要來源。","（正確）腸道出血型大腸桿菌（尤其O157:H7）主要來自牛，食用未熟牛絞肉是最常見感染途徑。","羊肉雖也可能攜帶EHEC，但在流行病學上人類感染病例以牛肉最為主要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_062","year":2023,"roc_year":112,"session":"","examNo":62,"q":"鼠類常是下列何種疾病之帶菌者？①類丹毒（erysipeloid）②鸚鵡病（psittacosis）③布氏桿菌症   （brucellosis）④鉤端螺旋體病（leptospirosis）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":3,"exp":"鼠類是多種疾病的帶菌者，其中包括：類丹毒（erysipeloid，豬丹毒桿菌，鼠可攜帶）和鉤端螺旋體病（leptospirosis，鼠為最重要的保毒宿主，由尿液排出）。鸚鵡病（Chlamydia psittaci）主要由鳥類（尤其鸚鵡科）傳播，鼠不是主要帶菌者。布氏桿菌症（Brucella spp.）的主要保毒宿主為牛、羊、豬等，鼠不是主要帶菌者。因此①④（類丹毒和鉤端螺旋體病）組合符合，答案為D（①④）。","we":["①②組合：鸚鵡病主要由鸚鵡科鳥類傳播，鼠並非鸚鵡病的主要帶菌者，此組合不正確。","②③組合：鸚鵡病（鸚鵡/鳥類傳播）和布氏桿菌症（牛羊豬為主）均非鼠類主要疾病，不正確。","③④組合：布氏桿菌症的主要保毒宿主為牛羊豬，鼠不是主要帶菌者，此組合不完全正確。","（正確）①④：類丹毒病原（豬丹毒桿菌）和鉤端螺旋體均可由鼠類攜帶傳播給人，此組合正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_063","year":2023,"roc_year":112,"session":"","examNo":63,"q":"下列有關耶氏菌症（yersiniosis）的敘述，何者錯誤？","opts":["A. 病原屬於革蘭氏陽性球桿菌","B. 經由糞口傳播","C. 常發生在籠飼鳥類","D. 病原可由污染的肉品、乳製品媒介給人類"],"ans":0,"exp":"耶氏菌（Yersinia spp.）屬於腸桿菌科（Enterobacteriaceae），為革蘭氏陰性桿菌，非革蘭氏陽性球桿菌。故選項A「屬於革蘭氏陽性球桿菌」為錯誤敘述，是本題答案。","we":["（正確）耶氏菌屬於革蘭氏陰性桿菌，並非陽性球桿菌，此為錯誤敘述，故為答案。","耶氏菌確實經由糞口途徑傳播，此敘述正確。","耶氏菌（特別是Yersinia pseudotuberculosis）確實好發於籠飼鳥類，此敘述正確。","耶氏菌確實可藉污染肉品和乳製品傳給人類，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_064","year":2023,"roc_year":112,"session":"","examNo":64,"q":"下列有關Q熱之敘述，何者錯誤？","opts":["A. 人主要藉由節肢動物叮咬傳染","B. 造成動物流產或死產","C. 急性以肝炎和肺炎為主","D. 病原為立克次體"],"ans":0,"exp":"Q熱（Query fever）由Coxiella burnetii引起，人類主要透過吸入受感染動物（牛、羊、貓等）的胎盤、羊水、糞便乾燥後形成的氣溶膠而感染，而非藉由節肢動物叮咬。蜱可作為動物間傳播媒介，但人類感染主要為吸入途徑，故選項A「人主要藉由節肢動物叮咬傳染」為錯誤敘述。","we":["（正確）人類感染Q熱主要透過吸入氣溶膠，非節肢動物叮咬，A為錯誤敘述，是本題答案。","C. burnetii感染動物確實可造成流產或死產（特別是牛羊），此敘述正確。","急性Q熱確實以肝炎和肺炎為主要表現，此敘述正確。","Q熱病原Coxiella burnetii曾被分類為立克次體（Rickettsia），現雖重新分類，但考試仍習慣稱為立克次體或立克次體類微生物，此敘述大致正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_065","year":2023,"roc_year":112,"session":"","examNo":65,"q":"下列那一種炭疽桿菌感染型別，在人的致死率最高？","opts":["A. 腸道型","B. 肺型","C. 皮膚型","D. 泌尿道型"],"ans":1,"exp":"炭疽桿菌（Bacillus anthracis）感染人類有三種型別：肺型（吸入性）、皮膚型和腸道型。肺型炭疽（吸入性炭疽）致死率最高，可達80-90%甚至更高，即使治療也難挽救。皮膚型炭疽若不治療致死率約10-20%，經治療可降至＜1%；腸道型死亡率約25-60%。","we":["腸道型炭疽致死率約25-60%，雖也很高，但低於肺型的80-90%以上。","（正確）肺型（吸入性）炭疽致死率最高，可達80%以上，即使治療預後仍差，是最危險的感染型別。","皮膚型炭疽（最常見型別）若及時治療預後良好，致死率最低，約＜1%。","炭疽桿菌感染無泌尿道型，此選項為干擾選項，不存在此種型別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_066","year":2023,"roc_year":112,"session":"","examNo":66,"q":"李斯特菌症主要由Listeria monocytogenes引起，下列何種李斯特菌也會引起反芻獸流產及人類感染的病例？","opts":["A. L. innocua","B. L. grayi","C. L. welshimeri","D. L. ivanovii"],"ans":3,"exp":"除Listeria monocytogenes外，L. ivanovii也是已知的致病性李斯特菌，可引起反芻獸（尤其綿羊）流產，偶爾也有人類感染病例的報告。L. innocua、L. grayi和L. welshimeri通常被視為非致病性或致病性極低，不與反芻獸流產和人類感染有明確關聯。","we":["L. innocua（無害李斯特菌）通常無致病性，不引起動物流產或人類感染。","L. grayi對動物和人類的致病性極低，不與反芻獸流產有關聯。","L. welshimeri為環境性李斯特菌，致病性未被確認，不引起反芻獸流產。","（正確）L. ivanovii確實會引起反芻獸（尤其綿羊）流產，也有人類感染病例的文獻記錄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_067","year":2023,"roc_year":112,"session":"","examNo":67,"q":"人感染下列何種疾病其皮膚會出現遊走性紅斑（erythema migrans）？","opts":["A. 類丹毒","B. 炭疽病","C. 萊姆病","D. 結核病"],"ans":2,"exp":"遊走性紅斑（erythema migrans）是萊姆病（Lyme disease）的特徵性皮膚病變，由蜱傳播的螺旋菌Borrelia burgdorferi感染後，在蜱叮咬部位形成逐漸擴大的紅斑，中心較淡、外圈鮮紅，形似靶心，是萊姆病的診斷標誌。","we":["類丹毒（erysipeloid）的皮膚病變為局部紅腫、邊緣清楚的紫紅色斑塊，非遊走性紅斑。","炭疽病皮膚型病變為無痛性焦痂（eschar），黑色中心壞死，非遊走性紅斑。","（正確）萊姆病的特徵性皮膚表現為遊走性紅斑，由Borrelia burgdorferi感染所致。","結核病的皮膚表現為皮膚結核（scrofuloderma）或結核性潰瘍，無遊走性紅斑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_068","year":2023,"roc_year":112,"session":"","examNo":68,"q":"下列有關鸚鵡病的敘述，何者正確？①病原為Rickettsia psittaci ②僅限於鸚鵡科鳥類感染 ③哺乳類所分離\r   之病原不會造成鳥禽臨床症狀 ④為人畜共通疾病","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":2,"exp":"分析各敘述：①鸚鵡病病原是Chlamydia（Chlamydophila）psittaci，非Rickettsia，①錯誤；②鸚鵡病不只限鸚鵡科，可感染多種鳥類，②錯誤；③哺乳類分離株確實不引起鳥禽臨床症狀，③正確；④鸚鵡病確為人畜共通疾病（可從鳥傳人），④正確。故③④組合（選項C）正確。","we":["①②：鸚鵡病病原非Rickettsia且不限鸚鵡科，兩者均錯誤，此組合不選。","②③：②錯誤（不限鸚鵡科），故此組合不正確。","（正確）③（哺乳類分離株不引起鳥禽臨床症狀）和④（為人畜共通疾病）均正確，選C③④。","①④：①錯誤（病原為Chlamydia非Rickettsia），故此組合不完全正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_069","year":2023,"roc_year":112,"session":"","examNo":69,"q":"下列何種地理區域最容易發生恙蟲病？","opts":["A. 城市內","B. 叢林地區","C. 沙漠礫岩區","D. 水稻田區"],"ans":1,"exp":"恙蟲病（scrub typhus）由Orientia tsutsugamushi引起，媒介為恙蟎（chigger mite）幼蟲。恙蟎幼蟲棲息於叢林地帶、草叢密集的邊緣環境，尤其是叢林邊緣、河岸草叢等半開放式環境。進入叢林地區採集或工作的人員最容易接觸恙蟎，故叢林地區發病率最高。","we":["城市內恙蟎密度低，不是恙蟲病的好發地理環境。","（正確）叢林地區（草木茂密的半開放環境）是恙蟎孳生棲地，最容易發生恙蟲病。","沙漠礫岩區植被稀少，不適合恙蟎生存，發生恙蟲病的機率低。","水稻田區雖在農業環境中，但恙蟎主要棲息在草叢濃密的叢林邊緣，而非水田環境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_070","year":2023,"roc_year":112,"session":"","examNo":70,"q":"下列有關鉤端螺旋體的敘述，何者錯誤？","opts":["A. 人類感染可使用盤尼西林治療","B. 動物感染後可藉由尿液排出病原","C. 可經由皮膚傷口或黏膜造成感染","D. 不易經由消毒劑、高溫等方式消滅"],"ans":3,"exp":"鉤端螺旋體（Leptospira spp.）對消毒劑、高溫和乾燥非常敏感，一般消毒劑（如漂白水）和加熱即可有效殺滅。故選項D「不易經由消毒劑、高溫等方式消滅」為錯誤敘述。","we":["人類感染鉤端螺旋體可使用盤尼西林（penicillin）或doxycycline治療，此敘述正確。","動物感染後確實可透過尿液長期排出鉤端螺旋體，污染水源和環境，此敘述正確。","鉤端螺旋體可經皮膚傷口、眼睛或口鼻黏膜進入人體，此敘述正確。","（正確）鉤端螺旋體對消毒劑和高溫敏感，容易被消毒劑和加熱消滅，D為錯誤敘述，是本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_071","year":2023,"roc_year":112,"session":"","examNo":71,"q":"食用未煮熟的牛肉，容易感染下列何種寄生蟲？","opts":["A. 廣節裂頭絛蟲","B. 薑片吸蟲","C. 無鈎絛蟲","D. 有鈎絛蟲"],"ans":2,"exp":"無鈎絛蟲（Taenia saginata，牛肉絛蟲）的中間宿主為牛，食用未煮熟的牛肉會攝入牛肉絛蟲的囊尾幼蟲（cysticercus），在人體小腸發育為成蟲，引起無鈎絛蟲病。","we":["廣節裂頭絛蟲（Diphyllobothrium latum）的中間宿主為淡水魚，食用未熟魚肉感染，非牛肉。","薑片吸蟲（Fasciolopsis buski）的囊狀幼蟲附著在水生植物（如菱角、荸薺）上，非牛肉傳播。","（正確）無鈎絛蟲（牛肉絛蟲，T. saginata）中間宿主為牛，食用未熟牛肉是人類感染的主要途徑。","有鈎絛蟲（豬肉絛蟲，T. solium）的中間宿主為豬，食用未熟豬肉感染，非牛肉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_072","year":2023,"roc_year":112,"session":"","examNo":72,"q":"下列何種疾病於人類先天性感染最可能造成失明？","opts":["A. 隱胞子蟲症（cryptosporidiosis）","B. 旋毛蟲病（trichinellosis）","C. 弓蟲病（toxoplasmosis）","D. 中華肝吸蟲症（clonorchiasis）"],"ans":2,"exp":"弓蟲病（toxoplasmosis）由Toxoplasma gondii引起，先天性感染（母體感染後經胎盤傳給胎兒）可造成嚴重後果，包括眼部病變（視網膜脈絡膜炎→失明）、腦部鈣化、腦水腫等。眼部弓蟲病（ocular toxoplasmosis）是先天性感染最常見的長期後遺症，可導致失明。","we":["隱胞子蟲症（cryptosporidiosis）主要引起腸胃炎（嚴重腹瀉），不以先天性失明為主要後果。","旋毛蟲病（trichinellosis）主要影響肌肉（肌炎），不以先天性失明為特徵。","（正確）先天性弓蟲病可引起視網膜脈絡膜炎，最終導致失明，是最重要的先天性感染後遺症。","中華肝吸蟲症（clonorchiasis）主要影響膽道系統，不以先天性失明為特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_073","year":2023,"roc_year":112,"session":"","examNo":73,"q":"下列有關麴菌症的敘述，何者錯誤？","opts":["A. 在幼禽多為散發而成禽感受性較高","B. 病原亦可以感染狗、貓","C. 可藉由蛋殼感染","D. 肉眼病變多見於肺臟"],"ans":0,"exp":"麴菌症（aspergillosis）感染特性：幼禽（雛禽）對麴菌高度易感，常見散發或爆發；成禽（成鳥）對麴菌感受性較低，不易感染。故選項A「在幼禽多為散發而成禽感受性較高」為錯誤敘述（應為成禽感受性較低）。","we":["（正確）幼禽對麴菌易感，但成禽感受性較低（非較高），A敘述相反，為錯誤敘述，是本題答案。","麴菌確實可感染狗和貓，屬於人畜共通的機會性感染，此敘述正確。","麴菌孢子可污染蛋殼，孵化過程中侵入雛禽，介蛋傳播是重要感染途徑，此敘述正確。","麴菌症的肉眼病變確實多見於肺臟（結節性肉芽腫），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_074","year":2023,"roc_year":112,"session":"","examNo":74,"q":"動物感染隱球菌（Cryptococcus neoformans）之病變或病徵包括：①中樞神經受損及口鼻黏膜肉芽腫 ②乳房\r  及鄰近淋巴結腫脹 ③呼吸困難及流鼻膿，分別依序好發於下列何種動物？","opts":["A. ①馬②犬貓③牛","B. ①馬②牛③犬貓","C. ①犬貓②牛③馬","D. ①牛②犬貓③牛"],"ans":2,"exp":"隱球菌（Cryptococcus neoformans）感染各動物的典型病變：犬貓好發中樞神經受損及口鼻黏膜肉芽腫（①）；牛好發乳房及鄰近淋巴結腫脹（②，稱為隱球菌性乳房炎）；馬好發呼吸困難及流鼻膿（③，鼻腔和鼻竇隱球菌病）。故正確配對為①犬貓②牛③馬，對應選項C。","we":["①馬②犬貓③牛：馬的隱球菌以鼻腔流膿為主，犬貓為CNS/口鼻肉芽腫，牛為乳房，配對錯誤。","①馬②牛③犬貓：配對錯誤，馬應為③（呼吸困難流鼻膿），不是①。","（正確）①犬貓（CNS及口鼻黏膜肉芽腫）②牛（乳房及淋巴結腫脹）③馬（呼吸困難流鼻膿），選C正確。","①牛②犬貓③牛：重複選牛且配對錯誤，此選項本身有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_075","year":2023,"roc_year":112,"session":"","examNo":75,"q":"下列何者並非引起毛樣圓蟲症（trichostrongyliasis）之寄生蟲？","opts":["A. Ostertagia spp.","B. Haemonchus contortus","C. Trichostrongylus spp.","D. Angiostrongylus spp."],"ans":3,"exp":"毛樣圓蟲症（trichostrongyliasis）由毛樣線蟲科（Trichostrongylidae）的多種寄生蟲引起，包括：Ostertagia spp.（奧氏蟲）、Haemonchus contortus（血矛線蟲）、Trichostrongylus spp.（毛圓線蟲）等。Angiostrongylus spp.（管圓線蟲）屬於後圓線蟲科，引起管圓線蟲病，不屬於毛樣圓蟲症的病原，故選項D為答案。","we":["Ostertagia spp.屬於毛樣線蟲科，確實引起毛樣圓蟲症，不是答案。","Haemonchus contortus（捻轉血矛線蟲）是反芻獸最重要的毛樣圓蟲之一，不是答案。","Trichostrongylus spp.正是毛樣圓蟲症的主要病原，不是答案。","（正確）Angiostrongylus spp.（管圓線蟲）屬後圓線蟲科，引起管圓線蟲病（非毛樣圓蟲症），為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_076","year":2023,"roc_year":112,"session":"","examNo":76,"q":"下列何組吸蟲的囊狀幼蟲（metacercaria）皆附著於水生植物上等待宿主攝食？","opts":["A. 薑片吸蟲、中華肝吸蟲","B. 薑片吸蟲、牛羊肝吸蟲","C. 橫川氏吸蟲、牛羊肝吸蟲","D. 橫川氏吸蟲、中華肝吸蟲"],"ans":1,"exp":"薑片吸蟲（Fasciolopsis buski）的囊狀幼蟲附著於菱角、荸薺等水生植物；牛羊肝吸蟲（Fasciola hepatica）的囊狀幼蟲也附著於水草等水生植物上，等待牛羊等宿主食入。中華肝吸蟲（Clonorchis sinensis）囊狀幼蟲寄生於淡水魚（鯉科魚），非水生植物。橫川氏吸蟲（Metagonimus yokogawai）囊狀幼蟲也在淡水魚中。故薑片吸蟲和牛羊肝吸蟲的囊狀幼蟲附著於水生植物，選項B正確。","we":["薑片吸蟲囊狀幼蟲確在水生植物，但中華肝吸蟲的囊狀幼蟲寄生於淡水魚體，非水生植物，A不正確。","（正確）薑片吸蟲和牛羊肝吸蟲的囊狀幼蟲均附著於水生植物，等待宿主攝食，選B正確。","橫川氏吸蟲囊狀幼蟲寄生於淡水魚，牛羊肝吸蟲在水生植物，兩者不同來源，C不正確。","橫川氏吸蟲和中華肝吸蟲的囊狀幼蟲均寄生於淡水魚，並非水生植物，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_078","year":2023,"roc_year":112,"session":"","examNo":78,"q":"下列何種病原與飲用水衛生沒有關連性？","opts":["A. Rabies virus","B. Vibrio cholerae","C. Salmonella Typhi","D. Entamoeba histolytica"],"ans":0,"exp":"狂犬病病毒（Rabies virus）主要透過被感染動物咬傷後由傷口進入神經組織傳播，不透過飲用水傳播，與飲用水衛生無關聯性。霍亂弧菌（V. cholerae）、傷寒沙氏桿菌（S. Typhi）和痢疾阿米巴（E. histolytica）均可透過受污染的飲用水傳播，是經典的水媒傳染病病原。","we":["（正確）狂犬病病毒不經飲水傳播，與飲用水衛生無關聯性，為本題答案。","Vibrio cholerae（霍亂弧菌）是典型水媒傳染病病原，可藉受污染飲用水爆發。","Salmonella Typhi（傷寒沙氏桿菌）透過糞口途徑傳播，受污染飲水是重要媒介。","Entamoeba histolytica（溶組織阿米巴）透過受污染飲水和食物傳播，引起阿米巴痢疾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_079","year":2023,"roc_year":112,"session":"","examNo":79,"q":"下列有關三段式養豬廢水處理過程當中產生沼氣之敘述，何者正確？","opts":["A. 堆肥時糞尿中之大腸桿菌分解有機物所產生","B. 固液分離時，廢水中之大腸桿菌分解有機物所產生","C. 厭氣處理之厭氧細菌分解有機物所產生","D. 好氣處理過程中之好氧細菌分解有機物所產生"],"ans":2,"exp":"三段式養豬廢水處理為：①固液分離→②厭氣處理（沼氣池）→③好氣處理（曝氣池）。沼氣在第二階段厭氣（anaerobic）處理中，由厭氧細菌（產甲烷菌等）分解有機物產生，主要成分為甲烷（CH₄）和二氧化碳。","we":["堆肥過程中大腸桿菌並非產生沼氣的主要微生物，且堆肥為好氧/兼性厭氧過程，不產生大量甲烷。","固液分離為物理分離步驟，不產生沼氣；沼氣在後續厭氣處理中產生。","（正確）三段式處理的厭氣槽中，厭氧細菌（甲烷菌）分解有機物產生沼氣（甲烷+CO₂），此為正確答案。","好氣處理（曝氣）是利用好氧菌分解有機物，產生的是CO₂和水，不產生沼氣（甲烷）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_080","year":2023,"roc_year":112,"session":"","examNo":80,"q":"依據事業廢棄物貯存清除處理方法及設施標準，感染性生物醫療事業廢棄物如以滅菌方式處理，指標微生物滅菌削減率至少應達多少？","opts":["A. 99%","B. 99.9%","C. 99.99%","D. 99.999%"],"ans":3,"exp":"依事業廢棄物貯存清除處理方法及設施標準，感染性生物醫療廢棄物以滅菌方式處理時，指標微生物的滅菌削減率至少應達到99.999%（5-log reduction），確保滅菌效果符合感染性廢棄物的安全處置要求。","we":["99%（2-log reduction）的滅菌效率過低，無法達到感染性廢棄物安全滅菌標準。","99.9%（3-log reduction）的效率仍不足，不符合感染性醫療廢棄物的最低標準。","99.99%（4-log reduction）接近但未達法規要求的99.999%（5-log reduction）。","（正確）法規要求指標微生物滅菌削減率至少達99.999%（5-log reduction），選D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_001","year":2024,"roc_year":113,"session":"","examNo":1,"q":"氯化萘常用來做切麵包機的潤滑油及木頭防腐劑，觀察某一疾病在以麵包切片餵飼的牛隻、有舔潤滑油的小\r  牛及接觸木頭防腐劑的牛隻皆有發生，故推論氯化萘為該病之病因。此方法為流行病學上之何種假說產生方 式？","opts":["A. 差異法（method of difference）","B. 一致法（method of agreement）","C. 共同因素差異法（method of concomitant variations）","D. 類推法（method of analogy）"],"ans":1,"exp":"一致法（method of agreement）：當不同情況下都有共同的暴露因素，且該因素在所有病例中都出現，則推論為病因。氯化萘在切片餵飼牛、舔潤滑油的小牛及接觸木頭防腐劑的牛中皆有出現，符合一致法。","we":["差異法是暴露與未暴露組比較有無疾病差異，此題無對照組對比。","（正確）一致法：多種不同情境都存在共同暴露因素氯化萘，推論為病因。","共同因素差異法（concomitant variations）是暴露量與發病量成比例變化，題幹未涉及。","類推法是比較已知病因疾病的類似性，此題未做類比。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_002","year":2024,"roc_year":113,"session":"","examNo":2,"q":"下列有關發生率（incidence）、累積發生率（cumulative incidence）及盛行率（prevalence）之敘述，何\r  者錯誤？","opts":["A. 發生率的分子為該研究期間之新病例數","B. 盛行率之分母為該研究期間內之可感受個體數","C. 累積發生率的時間為該研究的時間點（single point）","D. 盛行率的測量可由橫斷式研究（cross-sectional study）得知"],"ans":2,"exp":"累積發生率（cumulative incidence）是在「一段觀察期間」內新發病例數除以期初可感受個體數，代表一段時間的累積風險，不是單一時間點。單一時間點的測量是「點盛行率」。","we":["發生率分子確為新病例數，A正確。","盛行率分母為觀察開始時的總人口（含已患病者），不一定是可感受個體數，但此選項有爭議，不是最明顯的錯誤。","（正確錯誤）累積發生率是一段時間內的累積風險，不是單一時間點。","盛行率可由橫斷式研究（cross-sectional study）得知，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_003","year":2024,"roc_year":113,"session":"","examNo":3,"q":"下列何者不屬於流行病學中的次級資料（secondary data）？","opts":["A. 寵物醫院的病歷","B. 科學論文中的病例報告","C. 病理診斷中心的組織病理報告","D. 研究者對畜主進行的訪視報告"],"ans":3,"exp":"次級資料（secondary data）是已存在、由他人收集的資料，如病歷、報告等。研究者對畜主進行的訪視報告是研究者直接收集的一手資料（primary data），不屬於次級資料。","we":["寵物醫院病歷是既有紀錄，屬次級資料。","科學論文病例報告是已發表的紀錄，屬次級資料。","病理診斷中心報告是既有機構資料，屬次級資料。","（正確）研究者直接訪視所得報告是初級（primary）資料，不是次級資料。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_004","year":2024,"roc_year":113,"session":"","examNo":4,"q":"下列那一項獸醫師之工作，為應用到獸醫流行病學相關之原理與原則？","opts":["A. 依藥物手冊之建議劑量給予犬隻心臟病的藥物，進行治療","B. 依文獻報告尋找並比較最佳犬隻心臟病治療方法，據以施行","C. 開會討論相關犬隻心臟病治療方法，與會專家依自已過去經驗進行交流後，該獸醫師依所抄之筆記進行治療","D. 依自已過去經驗及動物的反應，自行調整犬隻心臟病藥物及劑量，進行治療"],"ans":1,"exp":"循證獸醫學（evidence-based veterinary medicine）即獸醫流行病學的應用精神：依據文獻報告尋找並比較最佳治療方法。其他選項均是根據個人習慣、手冊或經驗，未應用流行病學原理。","we":["依藥物手冊建議劑量是標準作業，非流行病學應用。","（正確）依文獻尋找並比較最佳治療法是循證醫學/流行病學的應用。","依專家筆記治療是傳統做法，未系統性應用流行病學。","依個人過去經驗調整是主觀經驗，非流行病學原則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_005","year":2024,"roc_year":113,"session":"","examNo":5,"q":"有關散發性疾病的定義，下列何者錯誤？","opts":["A. 可能為單一病例","B. 可能為數個病例的集合","C. 該疾病不被預期發生在某特定地區","D. 該疾病在某特定地區過去從未發生過"],"ans":3,"exp":"散發性疾病（sporadic disease）定義為在特定地區偶發、無規律的疾病，指「不被預期」會規律發生，但並非「從未發生過」。D選項「過去從未發生過」是錯誤的——散發性疾病可能在同一地區曾偶爾發生。","we":["散發性疾病可為單一病例，A正確。","散發性疾病可為數個病例的集合，B正確。","散發性疾病的定義包含不被預期在某特定地區發生，C正確。","（正確錯誤）散發性疾病並非該地區從未發生過，而是不規律、偶發，此描述有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_006","year":2024,"roc_year":113,"session":"","examNo":6,"q":"下列有關勝算比（odds ratio）的敘述，何者正確？","opts":["A. 又稱為相對危險性估計值（estimated relative risk），為危險性的非精確估值","B. 適用於橫斷式研究法中對危險性的準確測量","C. 又稱為剩餘危險性（excess risk），為暴露後多出的危險值","D. 計算方式為暴露組的發生率除以非暴露組的發生率"],"ans":0,"exp":"勝算比（OR）在病例對照研究中用於估計相對危險性（RR），當疾病盛行率低時OR≈RR，為RR的近似估值，不是精確值（非精確估值）。C是歸因危險度的定義，D是RR的計算方式。","we":["（正確）OR可作為RR的估計值，在盛行率低時近似RR，屬非精確估值。","橫斷式研究可計算OR，但不是對危險性的「準確」測量，B有誤。","剩餘危險性（excess risk）是歸因危險度（attributable risk），不是OR的定義，C有誤。","暴露組發生率除以非暴露組發生率是相對危險性RR的計算方式，不是OR，D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_007","year":2024,"roc_year":113,"session":"","examNo":7,"q":"流行病曲線無法提供下列何項資訊？","opts":["A. 潛伏期","B. 來源地區","C. 暴露型態","D. 病例數"],"ans":1,"exp":"流行病曲線（epidemic curve）以時間為橫軸、病例數為縱軸，可推估潛伏期、暴露型態（點源或持續源）及病例數，但「來源地區」需要使用地圖點圖（spot map）才能呈現，無法從流行病曲線獲得。","we":["流行病曲線可推估潛伏期（暴露點到發病高峰的時間差），A可以提供。","（正確）來源地區資訊需要地圖點圖，無法從時間分布曲線得知。","流行病曲線的形狀（陡峭或平緩）可反映暴露型態，C可以提供。","流行病曲線縱軸即為病例數，D可以提供。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_008","year":2024,"roc_year":113,"session":"","examNo":8,"q":"下列何種敘述屬於病原體對宿主具有高毒力及高侵犯力？","opts":["A. 牛瘟病毒對牛","B. 狂犬病病毒對蛇","C. 新城病病毒對人","D. 漢他病毒對嚙齒類"],"ans":0,"exp":"牛瘟病毒（rinderpest virus）對牛具有極高毒力（案例致死率可達80-100%）及高侵犯力（極易在牛群間傳播），是典型高毒力高侵犯力的例子。狂犬病不感染蛇，新城病對人毒力極低，漢他病毒對囓齒類宿主通常無症狀。","we":["（正確）牛瘟病毒對牛高毒力、高侵犯力，為典型案例。","蛇是冷血動物，狂犬病病毒通常不感染爬蟲類。","新城病病毒偶爾感染人類，但僅引起輕微結膜炎，毒力極低。","漢他病毒對嚙齒類宿主（儲存宿主）通常無症狀，表示毒力低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_009","year":2024,"roc_year":113,"session":"","examNo":9,"q":"想評估某收容所每年收容流浪狗數的長期變化趨勢，下列何種圖形最適合？","opts":["A. 柱狀圖","B. 圓餅圖","C. 線條圖","D. 散佈圖"],"ans":2,"exp":"線條圖（折線圖）最適合呈現長期時間趨勢，橫軸為時間，縱軸為數值，可清楚顯示變化走向。柱狀圖適合比較不同類別，圓餅圖顯示比例，散佈圖顯示兩變數相關性。","we":["柱狀圖適合比較不同類別的數量，不適合長期趨勢。","圓餅圖顯示各組成比例，不適合時間趨勢。","（正確）線條圖最適合顯示某指標隨時間的長期變化趨勢。","散佈圖適合顯示兩連續變數的相關性，不是時間趨勢圖。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_010","year":2024,"roc_year":113,"session":"","examNo":10,"q":"關於疾病基本複製數（basic reproductive number, R0）的敘述，下列何者正確？","opts":["A. 所有疾病都有一基本複製數","B. 基本複製數越大表示疾病傳染力越小","C. 基本複製數小於1表示病例發生數會逐漸減少","D. 基本複製數大於0表示此疫情會持續"],"ans":2,"exp":"基本複製數R0<1表示每個感染個體平均傳染不到1個新個體，疫情會逐漸縮小並消退。R0>1才表示疫情擴大，R0=1表示疫情維持穩定。","we":["並非所有疾病都有傳染病意義上的R0，如非傳染性疾病，A有誤。","R0越大表示傳染力越強（可感染更多個體），B敘述相反。","（正確）R0<1時每個感染者平均感染不到1人，病例數會逐漸減少。","R0>1才表示疫情會持續並擴大，D描述應為R0>1，非R0>0。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_011","year":2024,"roc_year":113,"session":"","examNo":11,"q":"在建立一個豬場多重感染導致豬隻死亡率增加的前瞻性世代追蹤研究中，下列那種情況發生的死亡個案在統\r   計上稱為設限資料（censoring data）？","opts":["A. 豬在研究終止之前因多重感染死亡","B. 豬隻因多重感染死亡前即被販賣離開豬場","C. 豬場豬隻因特殊原因而被研究計畫所排除","D. 研究終止後豬因不明原因死亡"],"ans":1,"exp":"設限資料（censoring data）指在研究終止前，研究對象因非研究目標的其他原因（如被賣出農場）離開追蹤，使得無法觀察到最終結局（死亡或存活）的資料。此豬隻在觀察終點前離開，屬於設限。","we":["豬在研究終止前因多重感染死亡是研究所要觀察的事件，不是設限資料。","（正確）豬因被販賣離開豬場而失去追蹤，無法確認最終結局，屬設限資料。","被計畫排除的豬屬於排除標準（exclusion criteria），不是設限資料。","研究終止後死亡是研究期間外的事件，不屬於研究資料範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_012","year":2024,"roc_year":113,"session":"","examNo":12,"q":"臺灣在2015年爆發禽流感流行，經過研究調查與禽場密度過高有關，勝算比（odds ratio）可達8，此值若\r   可對等於相對危險性（relative risk），造成禽流感病毒感染禽場的可歸因百分比（attributable  proportion, ％）為下列何者？","opts":["A. 7","B. 87.5","C. 50","D. 12.5"],"ans":1,"exp":"可歸因百分比（attributable proportion）= (RR-1)/RR = (8-1)/8 = 7/8 = 87.5%。這代表在密度過高的禽場中，禽流感的發生有87.5%可歸因於密度過高這個危險因子。","we":["7是RR-1（絕對差），不是百分比。","（正確）AP = (8-1)/8 = 7/8 = 87.5%。","50%不符合計算結果。","12.5% = 1/8，與AP公式相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_013","year":2024,"roc_year":113,"session":"","examNo":13,"q":"探討人飼養寵物與有外食習慣對於感染沙氏桿菌之研究中，若依沒有飼養寵物亦沒有外食習慣者為參考族群\r   其感染沙氏桿菌發生率僅有2/1000，有飼養寵物但沒有外食習慣者之感染沙氏桿菌發生率為6/1000，沒有飼  養寵物但有外食習慣者之感染沙氏桿菌發生率為21/1000，同時有外食習慣且有飼養寵物者對於感染沙氏桿  菌之相對危險性為31.5，則外食習慣與飼養寵物兩者對於感染沙氏桿菌的影響，下列敘述何者正確？","opts":["A. 具有累乘性協同交互作用","B. 具有累乘性拮抗交互作用","C. 具有累乘性但沒有交互作用","D. 不具有累乘性也沒有交互作用"],"ans":2,"exp":"無飼養寵物且無外食的基線RR=1（2/1000）。飼養寵物的RR=3，外食的RR=10.5。若無累乘性交互作用，預期兩者並存的RR = 3×10.5 = 31.5，與實際觀察RR=31.5完全相符，表示具有累乘性但無交互作用。","we":["累乘性協同交互作用需實際RR大於兩者相乘，此題實際=預期，A有誤。","拮抗交互作用需實際RR小於預期，B有誤。","（正確）實際RR(31.5) = 預期RR(3×10.5=31.5)，具累乘性但無交互作用。","若無累乘性，以累加模型預期RR = 3+10.5-1 = 12.5，與31.5不符，D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_014","year":2024,"roc_year":113,"session":"","examNo":14,"q":"在一項調查牛隻貧血的病例對照研究中，發現17％的病牛被診斷出牛捻轉胃蟲感染，而對照組僅有4％感\r   染，因此研究的結論為牛捻轉胃蟲為牛貧血的主要病因，針對此結論下列何者正確？","opts":["A. 此結論相當合理","B. 因為對照組仍有4％的牛有感染牛捻轉胃蟲，因此無法下此結論","C. 因為缺乏時序性的資料證明因果相關，因此無法下此結論","D. 因為缺乏控制組，因此無法下此結論"],"ans":2,"exp":"病例對照研究屬回溯性研究，收集資料時疾病已發生，缺乏時序性（temporality）的直接證據。因為無法確定「捻轉胃蟲感染在先、貧血在後」，所以不能直接推論因果關係，C正確。","we":["病例組比對照組更常見捻轉胃蟲感染有相關性，但相關性不等於因果，A不合理。","對照組仍有4%感染並不影響因果推論，問題在於時序性，B理由不當。","（正確）病例對照研究缺乏時序性證據，無法確認疾病在感染之後發生，故無法下因果結論。","病例對照研究有對照組，D理由不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_015","year":2024,"roc_year":113,"session":"","examNo":15,"q":"下列何種情形可經由增加抽樣數目來降低可能造成的偏差？","opts":["A. 名單並不完整","B. 部分名冊中成員不合作","C. 不是採隨機抽樣","D. 抽樣變異性大"],"ans":3,"exp":"抽樣變異性大（sampling variability）是隨機誤差的來源，增加樣本數可降低標準誤，使估計更精確。其他選項（名單不完整、不合作、非隨機抽樣）均屬系統性偏差，無法靠增加樣本數改善。","we":["名單不完整是框架偏差（frame bias），增加抽樣數無法彌補名單本身的問題。","部分成員不合作是無回應偏差，增加樣本量仍有相同比例不合作。","非隨機抽樣是系統性方法問題，增加樣本數不能修正選樣偏差。","（正確）抽樣變異性（隨機誤差）隨樣本數增加而降低，可靠增加抽樣數解決。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_016","year":2024,"roc_year":113,"session":"","examNo":16,"q":"下列何種情形會造成選樣偏差？","opts":["A. 研究對象為自願參加者","B. 研究對象對暴露史記憶有誤","C. 研究對象逃避責任而隱瞞訊息","D. 未能追蹤研究對象後續反應"],"ans":0,"exp":"選樣偏差（selection bias）發生於研究對象的納入方式導致樣本無法代表目標族群。自願參與者（volunteer bias）屬於選樣偏差，因自願者通常與一般族群有系統性差異。B、C是資訊偏差，D是失訪偏差。","we":["（正確）研究對象為自願參加者產生志願者偏差，屬選樣偏差。","暴露史記憶有誤是記憶偏差（recall bias），屬資訊偏差，非選樣偏差。","逃避責任隱瞞訊息是資訊偏差，非選樣偏差。","未能追蹤後續是失訪偏差（attrition bias），不是選樣偏差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_017","year":2024,"roc_year":113,"session":"","examNo":17,"q":"下列何者為隨機抽樣？","opts":["A. 隨研究者之意願抽樣","B. 選取與研究者有合作關係之農牧場抽樣","C. 對高風險族群抽樣","D. 不同地理區域在相同機率下進行集簇抽樣"],"ans":3,"exp":"集簇抽樣（cluster sampling）在不同地理區域以相同機率抽取，每個地理區域有相同被選中的機率，屬於隨機抽樣。A、B、C均非隨機：A依研究者意願（方便抽樣），B依合作關係（方便抽樣），C對高風險族群（目的性抽樣）。","we":["隨研究者意願抽樣是方便性抽樣，非隨機。","選取有合作關係的農牧場是方便性抽樣，非隨機。","對高風險族群抽樣是目的性抽樣，非隨機。","（正確）在相同機率下進行集簇抽樣屬於隨機抽樣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_018","year":2024,"roc_year":113,"session":"","examNo":18,"q":"欲瞭解族群某疾病盛行率時，下列何種情形下所需樣本數越少？","opts":["A. 預期疾病盛行率越接近50％","B. 目標族群越大","C. 可容許之錯誤範圍越小","D. 信心水準越低"],"ans":3,"exp":"估計盛行率的樣本數公式 n = Z²p(1-p)/d²，其中d為容許誤差、Z由信心水準決定。信心水準越低，Z值越小，所需樣本數越少。目標族群大小對樣本數影響有限（有限族群修正），預期盛行率接近50%時樣本數最大。","we":["預期盛行率接近50%時p(1-p)最大，需要的樣本數最多，A錯。","目標族群越大，有限族群修正對樣本數影響微小，非越大越多，B不直接相關。","容許誤差越小，需要的樣本數越多（分母變小），C錯。","（正確）信心水準越低（如90%比99%），Z值越小，所需樣本數越少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_019","year":2024,"roc_year":113,"session":"","examNo":19,"q":"調查某疾病盛行率時，為確保無論目標族群大小都能有足夠的樣本數，可以用預期盛行率多少來決定所需樣\r   本數？","opts":["A. 10％","B. 50％","C. 80％","D. 95％"],"ans":1,"exp":"當無論目標族群大小都能保有足夠代表性，應選用使樣本數最大的預期盛行率。p(1-p)在p=0.5時最大，因此使用50%可計算出最保守（最大）的樣本數，確保估計精度。","we":["10%使p(1-p)=0.09，樣本數較小，不足以保守估計，A不對。","（正確）50%使p(1-p)=0.25為最大值，可得到最大樣本數，確保任何盛行率下均有足夠估計精度。","80%時p(1-p)=0.16，小於0.25，樣本數較小，C不對。","95%時p(1-p)=0.0475，遠小於0.25，D不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_020","year":2024,"roc_year":113,"session":"","examNo":20,"q":"動物血液學檢查的血容比（PCV）資料，屬於何種度量尺度？","opts":["A. 正常尺度（normal scale）","B. 類別尺度（nominal scale）","C. 序位尺度（ordinal scale）","D. 等距尺度（interval scale）"],"ans":3,"exp":"血容比（PCV）是連續型數值資料，有等距間隔且有真實零點（0%=無紅血球），在度量尺度分類中屬於等距尺度或比率尺度（最高層級）。四種尺度由低到高：類別→序位→等距→比率，PCV屬高層級連續數值。","we":["正常尺度不是標準流行病學統計分類名詞，A為干擾選項。","類別尺度是無順序的分組資料（如血型），PCV是連續數值，B不對。","序位尺度有排序但間距不固定（如疼痛分級），PCV不符合，C不對。","（正確）PCV為連續數值，有固定間距及真實零點，屬等距/比率尺度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_021","year":2024,"roc_year":113,"session":"","examNo":21,"q":"下列有關試驗的預測值，何者正確？①敏感性越高，偽陰性率越大 ②敏感性越高，偽陰性率越小 ③特異\r   性越高，偽陽性率越小 ④特異性越高，偽陽性率越大","opts":["A. ①③","B. ②④","C. ②③","D. ①④"],"ans":2,"exp":"敏感性（Se）= TP/(TP+FN)，Se越高→FN越少→偽陰性率越小（②正確）。特異性（Sp）= TN/(TN+FP)，Sp越高→FP越少→偽陽性率越小（③正確）。","we":["①敏感性越高，偽陰性率越大——相反，Se高則偽陰性少，①錯。","④特異性越高，偽陽性率越大——相反，Sp高則偽陽性少，④錯。","（正確）②敏感性高→偽陰性率低；③特異性高→偽陽性率低，②③皆正確。","①③組合錯誤，①本身有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_022","year":2024,"roc_year":113,"session":"","examNo":22,"q":"當進行平行式試驗時，那些數值會提高？①總敏感性 ②總特異性 ③總陽性預測值 ④總陰性預測值","opts":["A. ①③","B. ②③","C. ①④","D. ②④"],"ans":2,"exp":"平行式試驗（parallel/OR testing）：任一試驗陽性即判為陽性。結果：敏感性提高（減少漏診）、陰性預測值提高；但特異性降低（誤判增加）、陽性預測值降低。①總敏感性提高✓ ④總陰性預測值提高✓。","we":["②總特異性：平行試驗降低特異性，②不會提高，A①③錯。","②③：特異性降低（非提高），③陽性預測值降低，B錯。","（正確）平行試驗提高①敏感性和④陰性預測值。","②④：特異性降低，非提高，D②錯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_023","year":2024,"roc_year":113,"session":"","examNo":23,"q":"下列有關Kappa值的敘述，何者錯誤？","opts":["A. 在計算去除隨機作用影響後的真正一致性","B. 值越接近1，一致性越高","C. 值越小，表示被比較的診斷或試驗不佳","D. 可判斷不同的診斷或試驗方法結果一致的程度"],"ans":2,"exp":"Kappa值小只表示兩種試驗/診斷方法的結果一致性低，但不能直接說明「試驗不佳」——可能是疾病本身在兩種方法下本質差異大，或隨機一致性高。C的推論不當。","we":["Kappa計算去除隨機作用後的真正一致性，A正確。","Kappa越接近1代表一致性越高，B正確。","（正確錯誤）Kappa值小只代表一致性低，不能直接說試驗不佳，C的推論有誤。","Kappa可評估不同診斷方法結果一致程度，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_024","year":2024,"roc_year":113,"session":"","examNo":24,"q":"下列敘述何者正確？","opts":["A. A點為最佳判定點","B. B點特異性最高","C. C點敏感性最高","D. A點特異性最低"],"ans":0,"exp":"在ROC曲線中，最佳判定點（optimal cutoff）通常位於曲線最接近左上角（高敏感性+高特異性）的位置，即A點。B點特異性最高（靠右），C點敏感性最高（靠上）。（本題含圖，答案需對照圖形）","we":["（正確，需圖確認）A點為ROC曲線上最接近左上角的點，通常是最佳判定點。","B點通常靠近X軸（高特異性），為特異性最高點，不是最佳判定點。","C點通常靠近Y軸頂部（高敏感性），不一定是最佳判定點。","A點為最佳判定點時特異性不是最低，A點接近左上角故敏感性和特異性均相對合適。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_公衛_025","year":2024,"roc_year":113,"session":"","examNo":25,"q":"承上題，若以B點為判定點，並利用此診斷工具進行疾病調查，當疾病盛行率為10％時，檢測結果陽性者確\r   實罹患該疾病的機率最接近下列何者？","opts":["A. 10％","B. 20％","C. 30％","D. 40％"],"ans":2,"exp":"陽性預測值（PPV）= Se×P / [Se×P + (1-Sp)×(1-P)]。若B點特異性偏低，以B點為判定點時假陽性較多，PPV偏低。在盛行率10%時，PPV大致落在20-30%範圍。（本題需對照圖形數值計算）","we":["10%=盛行率本身，若完全無鑑別能力才等於盛行率，A太低。","20%可能，但需圖形數值驗證。","（正確估計）30%為此題範圍內合理估值，需圖形確認。","40%偏高，B點特異性不高時PPV不會到40%。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_公衛_026","year":2024,"roc_year":113,"session":"","examNo":26,"q":"下列有關目標監控（targeted surveillance）的敘述，何者錯誤？","opts":["A. 必須藉由症狀監控（syndromic surveillance）之方式達成","B. 有時可藉由基於風險監控（risk-based surveillance）之方式達成","C. 可用來監控是否為某一特定疾病之非疫區","D. 通常是針對某一特定疾病進行"],"ans":0,"exp":"目標監控（targeted surveillance）針對特定疾病監控，可採用多種方式達成（基於風險的監控、血清學監控等），「不必」藉由症狀監控（syndromic surveillance）才能達成，A的敘述過於絕對且有誤。","we":["（正確錯誤）目標監控有多種達成方式，不一定需要症狀監控，A有誤。","目標監控可藉基於風險監控方式達成，B正確。","目標監控可用於確認非疫區狀態，C正確。","目標監控通常針對特定疾病，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_027","year":2024,"roc_year":113,"session":"","examNo":27,"q":"下列何者不屬於主要的流行病學監控（surveillance）方式？","opts":["A. 自願通報（voluntary notification）系統","B. 強制通報（mandatory notification）系統","C. 疫情調查（outbreak investigation）","D. 無特別目的之例行牧場訪視（general farm visitings）"],"ans":3,"exp":"主要的流行病學監控方式包括自願通報、強制通報及疫情調查。「無特別目的之例行牧場訪視」雖有助於發現疾病，但並非主要的正式監控方式，屬於一般性診療活動。","we":["自願通報系統是主要監控方式之一，A是監控方式。","強制通報系統是最重要的監控方式，B是監控方式。","疫情調查是主要監控方式之一，C是監控方式。","（正確）無特別目的的例行訪視不是主要流行病學監控方式，屬一般診療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_028","year":2024,"roc_year":113,"session":"","examNo":28,"q":"有關屠宰衛生檢查政策、方案、計畫的擬訂以及其執行，是由下列何機關負責與督導？","opts":["A. 衛生福利部疾病管制署","B. 環境部化學物質管理署","C. 農業部獸醫研究所","D. 農業部動植物防疫檢疫署"],"ans":3,"exp":"依台灣現行法規，屠宰衛生檢查政策、方案、計畫的擬訂及執行，由農業部動植物防疫檢疫署（防檢署）負責督導，此為其主管業務之一。","we":["衛生福利部疾管署負責人類傳染病防治，非屠宰衛生。","環境部化學物質管理署負責化學物質管理，非屠宰衛生。","農業部獸醫研究所主要執行研究業務，非政策監督。","（正確）農業部動植物防疫檢疫署負責屠宰衛生檢查政策的擬訂、執行與督導。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_029","year":2024,"roc_year":113,"session":"","examNo":29,"q":"乳牛場中牛隻經檢驗確診屬人畜共通之牛結核病，罹患該病牛隻的撲殺補償由何機關辦理？","opts":["A. 中央衛生主管機關","B. 中央動物防疫主管機關","C. 當地衛生主管機關","D. 當地動物防疫主管機關"],"ans":1,"exp":"依動物傳染病防治條例，動物罹患人畜共通傳染病（如牛結核病）而遭撲殺的補償，由中央動物防疫主管機關（農業部）負責辦理，因為動物屬農業主管機關管轄。","we":["中央衛生主管機關管轄人類疾病，動物撲殺補償非其業務。","（正確）中央動物防疫主管機關（農業部）依法辦理動物撲殺補償。","當地衛生主管機關為地方衛生局，動物補償非其業務。","當地動物防疫機關負責執行，但補償辦理屬中央層級。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_030","year":2024,"roc_year":113,"session":"","examNo":30,"q":"自國外進口肉品時，若有重大或突發性食品衛生安全事件之相關檢驗及後續處理，由何機關負責處理相關事\r   宜？","opts":["A. 中央經濟主管機關","B. 中央衛生福利主管機關","C. 中央農業主管機關","D. 中央環境保護主管機關"],"ans":1,"exp":"依食品安全衛生管理法，進口食品（含肉品）發生重大食品衛生安全事件時，由中央衛生福利主管機關（衛生福利部食品藥物管理署）負責相關檢驗及後續處理。","we":["中央經濟主管機關負責貿易政策，非食品安全事件處理。","（正確）中央衛生福利主管機關（衛福部食藥署）依食安法負責進口食品安全事件。","中央農業主管機關負責國內動物衛生，進口食品安全事件非其主責。","中央環境保護主管機關負責環境污染，非食品安全事件主管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_031","year":2024,"roc_year":113,"session":"","examNo":31,"q":"下列那一項不是農業部動植物防疫檢疫署所主管的業務？","opts":["A. 家畜禽屠宰場之稽核與管理","B. 生產及供應實驗動物","C. 植物產品輸入檢疫工作","D. 水產品輸出檢疫工作"],"ans":1,"exp":"農業部動植物防疫檢疫署負責家畜禽屠宰場稽核、植物及水產品輸出入檢疫等。「生產及供應實驗動物」屬農業部獸醫研究所的業務，非防檢署主管業務。","we":["家畜禽屠宰場稽核與管理是防檢署業務，A是其業務。","（正確）生產供應實驗動物是農業部獸醫研究所業務，非防檢署。","植物產品輸入檢疫是防檢署業務，C是其業務。","水產品輸出檢疫是防檢署業務，D是其業務。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_032","year":2024,"roc_year":113,"session":"","examNo":32,"q":"有關動物用藥品的使用，下列敘述何者錯誤？","opts":["A. 獸醫師（佐）處方藥品之使用，應依獸醫師（佐）處方藥品販賣及使用管理辦法","B. 非獸醫師（佐）處方藥品依獸醫師經驗進行使用","C. 水產動物用藥品使用應符合水產動物用藥品使用規範","D. 添加於飼料中之動物用藥品製劑應符合含藥物飼料添加物使用規範"],"ans":1,"exp":"非獸醫師（佐）處方藥品應依照藥品標示使用（label use），不是「依獸醫師經驗使用」。依法，非處方動物用藥品的使用應符合藥品標示規定，B的敘述有誤。","we":["獸醫師（佐）處方藥品應依處方藥品管理辦法，A正確。","（正確錯誤）非處方藥品應依藥品標示使用，而非依獸醫師個人經驗，B有誤。","水產動物用藥品使用符合水產動物用藥品使用規範，C正確。","含藥物飼料添加物應符合相關使用規範，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_033","year":2024,"roc_year":113,"session":"","examNo":33,"q":"獸醫師執行診斷與使用藥物治療非法定動物傳染病時，除獸醫師法外，還須遵守何種法規？","opts":["A. 動物用藥品管理法","B. 動物傳染病防治條例","C. 畜牧法","D. 食品安全衛生管理法"],"ans":0,"exp":"獸醫師診斷及使用藥物治療動物疾病時，除須遵守獸醫師法外，使用藥物時也必須依動物用藥品管理法辦理，包括藥品來源、使用方式及停藥期等規定。","we":["（正確）獸醫師使用藥物時須遵守動物用藥品管理法的相關規定。","動物傳染病防治條例主要規範法定傳染病的通報和防疫措施，非所有診療行為。","畜牧法規範畜牧場設置與經營，非直接約束診療用藥。","食品安全衛生管理法規範食品，非直接約束獸醫師診療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_034","year":2024,"roc_year":113,"session":"","examNo":34,"q":"依動物傳染病防治條例規定，獸醫師（佐）於執行業務時，發現動物罹患、疑患或可能感染甲類動物傳染病\r   或重大人畜共通之乙類、丙類動物傳染病時，應於多久時間內向當地動物防疫機關報告？","opts":["A. 12小時","B. 24小時","C. 48小時","D. 72小時"],"ans":1,"exp":"依動物傳染病防治條例第11條，獸醫師（佐）發現動物罹患甲類動物傳染病或重大人畜共通傳染病時，應於24小時內向當地動物防疫機關報告。","we":["12小時是某些更嚴格的緊急規定，甲類法定通報時限為24小時，A不符。","（正確）甲類動物傳染病通報時限為24小時內。","48小時時間過長，不符合甲類傳染病的緊急通報要求。","72小時時間過長，甲類傳染病需快速通報。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_035","year":2024,"roc_year":113,"session":"","examNo":35,"q":"依現行法規，動物用藥品與農藥管理之政策與法規之規劃、研擬、執行及監督，是由何機關掌理？","opts":["A. 農業部獸醫研究所","B. 農業部動植物防疫檢疫署","C. 農業部畜產試驗所","D. 衛生福利部食品藥物管理署"],"ans":1,"exp":"動物用藥品與農藥管理政策（包括規劃、研擬、執行及監督）屬農業部動植物防疫檢疫署的主管業務。","we":["農業部獸醫研究所主要執行研究業務，非政策規劃。","（正確）農業部動植物防疫檢疫署負責動物用藥品管理政策的規劃、執行與監督。","農業部畜產試驗所負責畜牧技術研究，非藥品政策。","衛生福利部食藥署管理人用藥品及食品，非動物用藥品政策主管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_036","year":2024,"roc_year":113,"session":"","examNo":36,"q":"依屠宰作業準則規定，屠宰場每日作業前，應經屠宰場設置標準所定檢查人員執行作業前查核，確認無下列\r   何者情形始得開始作業？","opts":["A. 建築及設施經適當維護，無污染屠體、內臟之虞","B. 設備未經適當清洗及消毒，仍有肉屑、脂肪、血液、油漬或其他可能污染屠體、內臟之污物附著","C. 屠後檢查設備經適當維護，無礙執行檢查之虞","D. 員工穿著乾淨工作服，準備上線作業"],"ans":1,"exp":"作業前查核確認「無以下情形始得開始作業」，B描述的是設備未經清洗消毒仍有污物——這是「不良情形」，必須確認此情形不存在才能開始作業。其他選項描述的是「已符合規定」的良好狀態。","we":["A描述建築維護適當，是已符合的良好狀態，非確認缺失。","（正確）B描述設備未清洗有污物，是需確認不存在的不良情形，確認「無此情形」才能開始作業。","C描述設備維護適當，是良好狀態。","D描述員工穿著乾淨，是良好狀態。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_037","year":2024,"roc_year":113,"session":"","examNo":37,"q":"依屠宰作業準則規定，屠宰場對於經檢查判定為廢棄之屠體及內臟之處理，下列何者不符合作業規定？","opts":["A. 應使用有蓋且明顯標示之裝盛容器","B. 裝盛容器須在作業結束後於固定場所清洗並消毒之","C. 廢棄之屠體及內臟應經適當處理並防止流為食用","D. 其處理方法、處理日期、處理者及處理數量應妥予記錄，並保存1個月"],"ans":3,"exp":"依屠宰作業準則規定，廢棄屠體及內臟的處理記錄（方法、日期、處理者、數量）應保存2年，D選項說1個月不符合法規要求。","we":["廢棄物應使用有蓋且明顯標示的容器，A符合規定。","裝盛容器在作業結束後清洗消毒，B符合規定。","廢棄屠體應適當處理防止流為食用，C符合規定。","（正確錯誤）記錄應保存2年，非1個月，D不符合規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_038","year":2024,"roc_year":113,"session":"","examNo":38,"q":"依屠宰衛生檢查規則規定，屠宰場應指定足夠且熟練之人員，並於屠宰衛生檢查時，依屠宰衛生檢查獸醫師\r   指示執行工作。下列敘述何者錯誤？","opts":["A. 屠前檢查時，驅趕、移動、隔離及管理家畜、家禽","B. 對家畜、家禽及其屠體、內臟進行屠前及屠後衛生檢查","C. 將檢查標的物予以切割、顯露或排列","D. 將屠體、內臟進行切除、修整、清洗或消毒"],"ans":1,"exp":"依屠宰衛生檢查規則，屠宰衛生「檢查」（即屠前屠後的衛生判定）是屠宰衛生檢查獸醫師的職責，場內人員只負責執行獸醫師指示的輔助工作，不能自行對屠體進行衛生檢查。","we":["場內人員可協助驅趕隔離動物，A是場內人員可執行的工作。","（正確錯誤）屠前及屠後衛生檢查是獸醫師的職責，非場內人員，B敘述有誤。","場內人員可協助切割、顯露待查組織，C是可執行的輔助工作。","場內人員可協助屠體切除修整清洗消毒，D是可執行的輔助工作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_039","year":2024,"roc_year":113,"session":"","examNo":39,"q":"依屠宰衛生檢查規則規定，屠檢獸醫師發現牛屠體、內臟有結核病之局部病灶，應如何處置？","opts":["A. 判定不合格，該屠體及其內臟不得供為食用","B. 應切除該患部，其餘正常部分始得供食用","C. 判定為加熱後合格或冷凍後合格","D. 判定合格，適合供人食用"],"ans":1,"exp":"依屠宰衛生檢查規則，牛屠體發現結核病局部病灶時，應切除患部，其餘正常部分判定合格，始得供人食用（B正確）。全身廢棄的情況是病灶廣泛或全身性感染。","we":["局部病灶並非直接判定整頭不合格，A過嚴。","（正確）局部病灶應切除患部，其餘正常部分合格供食用。","結核病不適用加熱/冷凍後合格的判定，C不適用。","有病灶不能直接判定合格，D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_040","year":2024,"roc_year":113,"session":"","examNo":40,"q":"依屠宰場設置標準規定，配置2名以下檢查人員之辦公室，其室內面積至少要多少平方公尺？","opts":["A. 5","B. 10","C. 15","D. 20"],"ans":1,"exp":"依屠宰場設置標準，配置2名以下檢查人員的辦公室，室內面積至少需10平方公尺。","we":["5平方公尺太小，不符合標準。","（正確）配置2名以下檢查人員的辦公室至少需10平方公尺。","15平方公尺是較多人員的要求。","20平方公尺超出2名以下人員的最低要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_041","year":2024,"roc_year":113,"session":"","examNo":41,"q":"依屠宰場設置標準規定，為確保屠體的衛生安全，去骨室室溫應達到攝氏幾度以下？","opts":["A. 0","B. 10","C. 20","D. 30"],"ans":1,"exp":"依屠宰場設置標準，去骨室（boning room）室溫應維持在10℃以下，以防止肉品在分切去骨過程中微生物過度增殖，確保肉品衛生安全。","we":["0℃以下會造成肉品凍結，影響去骨作業操作，A不符合實際需求。","（正確）去骨室室溫應在10℃以下，以控制微生物增殖。","20℃以下標準不夠嚴格，無法有效控制微生物。","30℃以下完全不符合低溫作業要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_042","year":2024,"roc_year":113,"session":"","examNo":42,"q":"依屠宰衛生檢查合格標誌及標明方法規定，甲式標誌用於未剝皮之成豬屠體，其合格標誌之標明方式為下列\r   何者？","opts":["A. 屠體兩側肩胛至臀部，各蓋一行甲式標誌","B. 屠體兩側肩胛至臀部，各蓋兩行甲式標誌","C. 屠體兩側豬腿部，各蓋兩行甲式標誌","D. 屠體任意部位，各蓋兩行甲式標誌"],"ans":0,"exp":"依屠宰衛生檢查合格標誌及標明方法，甲式標誌用於未剝皮的成豬屠體，標明方式為在屠體兩側肩胛至臀部各蓋一行甲式標誌（共兩行，左右各一行）。","we":["（正確）甲式標誌在未剝皮成豬屠體兩側肩胛至臀部各蓋一行。","兩行甲式標誌適用於其他類型屠體，非未剝皮成豬的標明方式。","僅在豬腿部蓋章不符合法規標明方式。","任意部位蓋章不符合標準化標明方式的規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_043","year":2024,"roc_year":113,"session":"","examNo":43,"q":"依據畜禽人道屠宰準則，畜禽屠宰作業應經人道有效致昏及充分放血之方式為之，下列何者不是人道致昏方\r   式？","opts":["A. 電擊器","B. 撞擊器","C. 棍棒擊昏","D. 氣體致昏設備"],"ans":2,"exp":"依畜禽人道屠宰準則，人道致昏方式包括：電擊器（電昏法）、撞擊器（穿透式/非穿透式射栓）及氣體致昏設備（CO2）。棍棒擊昏無法保證一擊致昏，會造成動物痛苦，不符合人道致昏要求。","we":["電擊器是合法人道致昏設備，A是人道方式。","撞擊器（射栓槍）是人道致昏方式，B是人道方式。","（正確）棍棒擊昏不穩定、可能多次擊打，不符合人道屠宰要求，C非人道方式。","氣體致昏設備（如CO2）是人道致昏方式，D是人道方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_044","year":2024,"roc_year":113,"session":"","examNo":44,"q":"依據屠宰場設置標準規定，冷藏庫與凍藏庫應能分別使產品中心溫度經常維持在下列何者溫度之間？","opts":["A. -18℃以下與4℃至-2℃","B. 4℃至-2℃與-18℃以下","C. 4℃至0℃與-15℃以下","D. 2℃至-2℃與-15℃以下"],"ans":1,"exp":"依屠宰場設置標準，冷藏庫應使產品中心溫度維持在4℃至-2℃之間（冷藏不結凍），凍藏庫應使產品中心溫度維持在-18℃以下（完全冷凍）。","we":["A選項順序相反（-18℃以下在前，4℃至-2℃在後），說明順序錯誤。","（正確）冷藏庫：4℃至-2℃；凍藏庫：-18℃以下。","4℃至0℃與-15℃以下不符合標準規定的溫度範圍。","2℃至-2℃與-15℃以下不符合標準規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_045","year":2024,"roc_year":113,"session":"","examNo":45,"q":"依優良農產品肉品項目驗證基準規定，家禽屠體應符合在多久時間內進行預冷，使得腿部中心溫度在4小時\r   內達到7℃？","opts":["A. 5分鐘","B. 10分鐘","C. 30分鐘","D. 60分鐘"],"ans":2,"exp":"依優良農產品（CAS）肉品驗證基準，家禽屠體屠宰後應在30分鐘內開始進行預冷，使腿部中心溫度在4小時內降至7℃以下，以控制微生物增殖。","we":["5分鐘內開始預冷的規定過短，不符合CAS標準。","10分鐘不符合CAS規定的時限。","（正確）家禽屠體應在屠宰後30分鐘內開始預冷，4小時內腿部中心溫度達7℃。","60分鐘時間過長，可能導致細菌過度增殖，不符合CAS要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_046","year":2024,"roc_year":113,"session":"","examNo":46,"q":"依優良農產品水產品項目驗證基準規定，超低溫冷凍水產品中心溫度須符合低於多少℃以下？","opts":["A. -18","B. -23","C. -25","D. -50"],"ans":3,"exp":"依台灣優良農產品水產品驗證基準，超低溫冷凍（用於如鮪魚等高價值魚類保存）的水產品中心溫度須維持在-50℃以下，以保持肉質品質並防止脂肪氧化。","we":["-18℃是一般冷凍標準，非超低溫冷凍要求。","-23℃未達超低溫冷凍標準。","-25℃未達超低溫冷凍標準。","（正確）超低溫冷凍水產品中心溫度須低於-50℃。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_047","year":2024,"roc_year":113,"session":"","examNo":47,"q":"依優良農產品蛋品項目驗證基準規定，液蛋之檢驗項目不包括下列何者？","opts":["A. 黴菌及酵母菌","B. 大腸桿菌群","C. 沙氏桿菌","D. 彎曲桿菌"],"ans":3,"exp":"液蛋的標準微生物檢驗項目包括：黴菌及酵母菌、大腸桿菌群、沙氏桿菌（Salmonella）。彎曲桿菌（Campylobacter）通常不列為液蛋的常規標準檢驗項目。","we":["黴菌及酵母菌是液蛋常規檢驗項目，A是檢驗項目。","大腸桿菌群是液蛋常規檢驗項目，B是檢驗項目。","沙氏桿菌是液蛋最重要的食安檢驗項目，C是檢驗項目。","（正確）彎曲桿菌不在液蛋的標準檢驗項目清單中，D不包括。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_048","year":2024,"roc_year":113,"session":"","examNo":48,"q":"依優良農產品乳品項目驗證基準規定，乳品每公克（以脂肪計）中，戴奧辛毒性當量應為多少以下？","opts":["A. 2.5皮克","B. 2.5微克","C. 2.5毫克","D. 2.5絲克"],"ans":0,"exp":"依優良農產品乳品驗證基準，乳品中戴奧辛（dioxin）毒性當量（TEQ）應低於2.5皮克（pg）/公克脂肪。皮克（pg）= 10⁻¹²克，微克（μg）= 10⁻⁶克。","we":["（正確）乳品戴奧辛毒性當量應低於2.5皮克/公克脂肪，皮克是極微量單位。","2.5微克遠高於皮克，不符合戴奧辛的極微量標準，B有誤。","2.5毫克更大，不符合戴奧辛管制標準，C有誤。","絲克（絲=10⁻⁴克）比皮克大，不是正確單位，D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_049","year":2024,"roc_year":113,"session":"","examNo":49,"q":"食用烹調不全的海洋魚類，下列何種寄生蟲感染的風險較高？","opts":["A. 利什曼原蟲","B. 海獸胃線蟲","C. 巴貝氏蟲","D. 枯西錐蟲"],"ans":1,"exp":"海獸胃線蟲（Anisakis spp.）寄生於海洋魚類（鮭魚、鯖魚、鱈魚等），人類食用烹調不全（生食或半生食）的海魚時，幼蟲進入消化道引起海獸胃線蟲病。","we":["利什曼原蟲由沙蠅傳播，與海洋魚類無關。","（正確）海獸胃線蟲（Anisakis）透過生食/半熟海魚感染人類。","巴貝氏蟲由蜱傳播，與海魚無關。","枯西錐蟲（Trypanosoma cruzi）由錐蝽傳播，非食物傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_050","year":2024,"roc_year":113,"session":"","examNo":50,"q":"下列何種寄生蟲比較不是因為飲用受污染的水而感染？","opts":["A. 旋毛蟲","B. 有鈎絛蟲","C. 布氏薑片吸蟲","D. 梨形鞭毛蟲"],"ans":0,"exp":"旋毛蟲（Trichinella spiralis）主要透過食入含有包囊的生豬肉、野生動物肉（熊肉等）感染，不是經由飲水傳播。布氏薑片吸蟲、梨形鞭毛蟲（梨形蟲）可經受污染的水傳播，有鈎絛蟲的蟲卵也可能污染飲水。","we":["（正確）旋毛蟲是透過食入含包囊的生肉感染，非飲水傳播。","有鈎絛蟲（豬絛蟲）蟲卵可污染水源，可能透過飲水感染，B與飲水有關。","布氏薑片吸蟲的囊幼蟲附著於水生植物，與水接觸有關，C與飲水有關。","梨形鞭毛蟲（賈第蟲）是飲水感染的重要寄生蟲，D與飲水密切相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_051","year":2024,"roc_year":113,"session":"","examNo":51,"q":"依據家禽肉類輸入檢疫條件規定，未經我國中央農業主管機關認定為新城病非疫區者，其家禽產品在何種加\r   熱條件下始可輸入我國？","opts":["A. 產品中心溫度達攝氏70度並維持15分鐘以上","B. 產品中心溫度達攝氏80度並維持5分鐘以上","C. 產品中心溫度達攝氏100度並維持1分鐘以上","D. 不得輸入"],"ans":0,"exp":"依台灣家禽肉類輸入檢疫條件，來自新城病非疫區未認定地區的家禽產品，須經中心溫度達70℃並維持15分鐘以上的加熱處理，以確保病毒滅活後始可輸入。","we":["（正確）中心溫度達70℃並維持15分鐘以上，符合台灣新城病相關進口規定。","80℃維持5分鐘不是台灣相關規定的標準時間溫度組合。","100℃維持1分鐘標準不同，不是相關規定要求。","並非完全不得輸入，加熱處理後可輸入。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_052","year":2024,"roc_year":113,"session":"","examNo":52,"q":"依據優良農農品乳品項目驗證基準，市售鮮乳中所含沙氏桿菌的菌數（CFU）每毫升容許量為下列何者？","opts":["A. 不得檢出","B. 50","C. 1000","D. 10000"],"ans":0,"exp":"依優良農產品乳品驗證基準及食品安全規定，市售鮮乳中沙氏桿菌（Salmonella）每毫升應「不得檢出」，因為沙氏桿菌是人畜共通重要病原，在鮮乳中有任何殘存均不可接受。","we":["（正確）鮮乳沙氏桿菌標準為不得檢出（absence in test sample）。","50 CFU/mL完全無法接受，沙氏桿菌零容忍，B有誤。","1000 CFU/mL不可接受，C有誤。","10000 CFU/mL不可接受，D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_053","year":2024,"roc_year":113,"session":"","examNo":53,"q":"依動物用藥殘留標準，乃卡巴精（nicarbazin）不得於下列何者檢出？","opts":["A. 雞肉","B. 雞肝","C. 雞蛋","D. 雞皮"],"ans":2,"exp":"乃卡巴精（nicarbazin）是用於肉雞的抗球蟲藥，台灣動物用藥殘留標準規定乃卡巴精「不得於雞蛋中檢出」，因為它可能透過蛋雞傳入蛋中，且其在蛋中的殘留有潛在健康顧慮。","we":["雞肉有設定殘留容許量，不是完全不得檢出的對象，A不符題意。","雞肝有設定殘留容許量，B不符題意。","（正確）乃卡巴精不得於雞蛋中檢出，以保護消費者。","雞皮有設定殘留容許量，D不符題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_054","year":2024,"roc_year":113,"session":"","examNo":54,"q":"農業部逐年檢討刪減含藥物飼料添加物品目，下列敘述何者錯誤？","opts":["A. 以人畜共用之抗生素為刪減考量","B. 以先進國家不生產為刪減考量","C. 以縮小藥品使用範圍為成效","D. 以減少藥品使用量為成效"],"ans":1,"exp":"農業部刪減含藥物飼料添加物品目的考量因素包括：（1）人畜共用抗生素（避免抗藥性）、（2）已有更好替代品。「以先進國家不生產為考量」並非官方政策說明的刪減依據，B的描述有誤。","we":["以人畜共用抗生素為刪減考量是正確政策目標（減少耐藥性），A正確。","（正確錯誤）先進國家不生產不是台灣刪減含藥飼料添加物的考量，B有誤。","縮小藥品使用範圍是成效描述，C正確。","減少藥品使用量是成效描述，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_055","year":2024,"roc_year":113,"session":"","examNo":55,"q":"下列何種人畜共通傳染病主要為直接傳播型（orthozoonoses）？①裂谷熱（Rift Valley fever）②伊波拉病毒出血熱（Ebola virus hemorrhagic fever） ③淋巴球性脈絡叢腦膜炎（lymphocytic  choriomeningitis） ④黃熱病（yellow fever） ⑤疱疹B病毒感染（herpesvirus B virus infection）","opts":["A. ①②③","B. ②④⑤","C. ②③⑤","D. ①③⑤"],"ans":2,"exp":"直接傳播型（orthozoonoses）：病原不需中間宿主即可在動物與人之間直接傳播。②伊波拉（直接接觸血液/分泌物）、③LCM（囓齒類尿液/排泄物直接接觸）、⑤疱疹B（猴咬傷/抓傷）均為直接傳播。①裂谷熱（主要蚊蟲傳播）、④黃熱病（蚊蟲傳播）不是主要直接傳播。","we":["①裂谷熱主要由蚊蟲媒介傳播，雖可直接接觸感染但非「主要為直接傳播型」，A含①不正確。","④黃熱病必須透過埃及斑蚊傳播，不是直接傳播型，B含④不正確。","（正確）②伊波拉、③LCM、⑤疱疹B均為直接接觸傳播型。","①裂谷熱非主要直接傳播型，D含①不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_056","year":2024,"roc_year":113,"session":"","examNo":56,"q":"下列何種人畜共通疾病，於感染動物臨床症狀多不明顯，但是感染人類時卻造成高致死率？①疱疹B病毒感\r   染 （herpesvirus B virus infection） ②羊接觸傳染性化膿性口炎（orf） ③家禽流行性感冒 ④淋  巴球性脈絡叢腦膜炎（lymphocytic choriomeningitis） ⑤發熱伴血小板減少綜合症（SFTS）","opts":["A. ①②","B. ②③","C. ①⑤","D. ④⑤"],"ans":2,"exp":"①疱疹B病毒：亞洲獼猴多為無症狀帶原，人感染後致死率>70%（若不治療）。⑤SFTS（發熱伴血小板減少綜合症）：蜱傳病毒，感染貓狗等動物多無症狀，人類感染致死率約12-30%。兩者均符合「動物無症狀、人類高致死率」。","we":["②Orf（羊接觸傳染性化膿性口炎）：感染羊有明顯皮膚病變，②不符「動物無症狀」。","③禽流感：感染禽類有明顯症狀，③不符合「動物無症狀」。","（正確）①疱疹B（猴無症狀，人高致死）和⑤SFTS（動物無症狀，人較高致死率）符合。","④LCM：囓齒類多無症狀，但人感染通常為自限性輕症，不屬「高致死率」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_057","year":2024,"roc_year":113,"session":"","examNo":57,"q":"非人類之靈長類為下列何種病原之最主要的保毒宿主？①馬堡病毒（Marburg virus） ②亨德拉病毒   （Hendra virus） ③疱疹B病毒 （herpesvirus B virus） ④伊波拉病毒（Ebola virus） ⑤裂谷熱病毒（Rift Valley fever virus）","opts":["A. ①②","B. ①③","C. ②③","D. ④⑤"],"ans":1,"exp":"疱疹B病毒（B virus/Macacine herpesvirus 1）：亞洲獼猴（Macaca spp.）為主要保毒宿主。馬堡病毒：最新研究確認埃及果蝠（Rousettus aegyptiacus）是主要保毒宿主，但早期研究曾與非人類靈長類相關聯，考試常以①③列為答案。","we":["（正確，考試觀點）①馬堡病毒和③疱疹B病毒均與非人類靈長類保毒相關（疱疹B確定，馬堡早期文獻相關）。","①②：亨德拉病毒的保毒宿主是果蝠（Pteropus），非靈長類。","②③：亨德拉病毒非靈長類宿主，C不正確。","④伊波拉保毒宿主為蝙蝠；⑤裂谷熱病毒宿主為反芻動物，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_058","year":2024,"roc_year":113,"session":"","examNo":58,"q":"下列何種人畜共通傳染病原主要藉由囓齒類動物傳播？①禽流感病毒 ②西尼羅病毒 ③漢他病毒 ④立百\r   病毒 ⑤拉薩病毒","opts":["A. ①③","B. ②④","C. ③⑤","D. ④⑤"],"ans":2,"exp":"③漢他病毒（Hantavirus）：田鼠、鼷鼠等囓齒類為主要保毒宿主，經由其尿液/糞便/唾液傳播給人。⑤拉薩病毒（Lassa virus）：多乳鼠（Mastomys natalensis）等非洲囓齒類為主要保毒宿主。兩者均主要藉由囓齒類傳播。","we":["①禽流感病毒主要保毒宿主是野鳥/禽類，非囓齒類。","②西尼羅病毒主要由蚊蟲傳播，鳥類是增殖宿主，非囓齒類。","（正確）③漢他病毒和⑤拉薩病毒均以囓齒類為主要保毒宿主。","④立百病毒（Nipah virus）保毒宿主是果蝠（Pteropus），非囓齒類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_059","year":2024,"roc_year":113,"session":"","examNo":59,"q":"關於屈公病之敘述，下列何者錯誤？","opts":["A. 經由蚊子傳播","B. 靈長類為自然界的保毒宿主","C. 與登革熱病毒同屬，血清學診斷時必須與登革熱病毒鑑別","D. 人類患者會出現發燒、出血以及關節炎之病徵"],"ans":2,"exp":"屈公病毒（Chikungunya virus）屬Togaviridae科、Alphavirus屬；登革熱病毒屬Flaviviridae科、Flavivirus屬。兩者不同科，更不同屬，C的敘述錯誤。屈公病毒確實由蚊子傳播，靈長類可作為保毒宿主，血清學有交叉反應需鑑別。","we":["屈公病確實由斑蚊傳播（伊蚊屬），A正確。","靈長類（人和猴）為屈公病毒的自然保毒宿主，B正確。","（正確錯誤）屈公病毒（Alphavirus）與登革熱病毒（Flavivirus）不同科屬，C有誤。","人類患者出現發燒、關節炎，但出血並非屈公病主要特徵，D有些問題但非最明顯錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_060","year":2024,"roc_year":113,"session":"","examNo":60,"q":"亨德拉病毒與立百病毒感染症相似之處為：①病原隸屬於正黏液病毒科 ②感染動物出現腦炎或呼吸症狀\r   ③為致死性之人畜共通傳染病 ④主要藉由吸入帶原動物之飛沫而感染","opts":["A. ①③","B. ②③","C. ②④","D. ①④"],"ans":1,"exp":"亨德拉（Hendra）和立百（Nipah）病毒均屬Paramyxoviridae科（副黏液病毒科），均可引起感染動物腦炎和呼吸症狀（②），均為致死性人畜共通傳染病（③）。①說正黏液病毒科是錯的，④主要感染源各有不同（一為馬，一為豬）。","we":["①兩者均屬副黏液病毒科（Paramyxoviridae），非正黏液病毒科，①錯。","（正確）②感染動物可見腦炎或呼吸症狀，③均為高致死性人畜共通病，②③均正確。","④傳播途徑：亨德拉由蝙蝠→馬→人，立百由蝙蝠→豬→人，傳播不完全相同。","①正黏液病毒科是流感病毒所屬，非亨德拉/立百，①錯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_061","year":2024,"roc_year":113,"session":"","examNo":61,"q":"下列針對疱疹B病毒的敘述，何者正確？①主要感染靈長動物，於猴科動物之間傳染高 ②經常造成亞洲獼猴嚴重腦炎 ③此病毒感染人類之發生率不高，致死性高 ④不會造成潛伏感染","opts":["A. ①②","B. ①③","C. ②④","D. ③④"],"ans":1,"exp":"疱疹B病毒（Macacine herpesvirus 1）：①在靈長動物（尤其亞洲獼猴）中傳染力強（正確）；②通常不造成獼猴嚴重腦炎，多為無症狀或輕微口腔皰疹（②錯誤）；③感染人類罕見，但致死率極高（>70%，若不治療）（正確）；④疱疹病毒可造成潛伏感染（④錯誤）。","we":["（正確）①靈長類間傳染高，③人類感染率不高但致死性高，①③均正確。","②疱疹B病毒通常不造成獼猴嚴重腦炎，獼猴多為隱性帶原，②③不全對。","②③：②錯誤（獼猴輕症），④：疱疹病毒可潛伏，④也錯。","③④：疱疹病毒確可潛伏（④錯），D組合不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_062","year":2024,"roc_year":113,"session":"","examNo":62,"q":"長時間擺放於超市低溫冷藏的肉類產品，最容易滋長下列何種人畜共通致病菌？","opts":["A. Listeria spp.","B. Mycobacterium spp.","C. Streptococcus spp.","D. Campylobacter spp."],"ans":0,"exp":"李斯特菌（Listeria monocytogenes）是嗜冷性細菌（psychrotrophic bacteria），可在4℃甚至更低溫度繼續生長繁殖，是低溫冷藏肉品中最危險的病原之一，也是重要的人畜共通致病菌。","we":["（正確）Listeria spp.可在低溫冷藏條件下生長，是低溫肉品的重要污染菌。","Mycobacterium spp.生長緩慢，需特殊培養條件，不是低溫冷藏中常見增殖菌。","Streptococcus spp.最適生長溫度為37℃，低溫下增殖受限。","Campylobacter spp.雖是食源性病原，但耐冷性不如Listeria，且對氧氣敏感。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_063","year":2024,"roc_year":113,"session":"","examNo":63,"q":"下列何種疾病組合皆需要依賴節肢動物叮咬而傳播？","opts":["A. Q fever and rat bite fever","B. spotted fever rickettsiosis and Lyme borreliosis","C. cat scratch disease and yersinosis","D. leptospirosis and listeriosis"],"ans":1,"exp":"斑疹熱立克次體（spotted fever rickettsiosis）和萊姆病（Lyme borreliosis）均需經蜱（tick）叮咬傳播，兩者都是典型的節肢動物媒介傳染病。Q fever和rat bite fever不依賴節肢動物；cat scratch disease和yersinosis亦非節肢動物傳播。","we":["Q fever（Q熱）主要由吸入帶菌動物的氣溶膠感染，Rat bite fever由鼠咬傷感染，兩者均非需節肢動物傳播。","（正確）斑疹熱立克次體和萊姆病均需蜱叮咬傳播，B正確。","Cat scratch disease（貓抓病）由Bartonella經貓抓/咬感染；yersinosis（耶氏桿菌病）為食物傳播，均非節肢動物傳播。","Leptospirosis（鉤端螺旋體）和listeriosis均為直接接觸或食物傳播，非節肢動物傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_064","year":2024,"roc_year":113,"session":"","examNo":64,"q":"在自然界具有廣宿主範圍如野生動物、爬蟲類、鳥類胃腸道的人畜共通疾病病原為下列何者？","opts":["A. Salmonella spp.","B. Yersinia spp.","C. Bartonella spp.","D. Leptospira spp."],"ans":0,"exp":"沙氏桿菌（Salmonella spp.）宿主範圍極廣，幾乎所有脊椎動物（哺乳類、鳥類、爬蟲類、兩棲類）的胃腸道均可攜帶，是宿主範圍最廣的人畜共通腸道病原之一。","we":["（正確）Salmonella spp.可感染野生動物、爬蟲類、鳥類等幾乎所有脊椎動物，宿主範圍最廣。","Yersinia spp.主要感染哺乳類（豬、囓齒類），宿主範圍較窄。","Bartonella spp.主要存在於哺乳類（貓、囓齒類等），不以爬蟲類為主。","Leptospira spp.主要感染哺乳類（以囓齒類為主），不常見於爬蟲類和鳥類胃腸道。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_065","year":2024,"roc_year":113,"session":"","examNo":65,"q":"預防反芻動物的李斯特菌症（listeriosis），以減少人類感染之風險，需特別注意下列何者？","opts":["A. 撲滅野鼠","B. 管制流浪貓、狗進入畜牧場","C. 控制精料餵食量","D. 檢驗青貯料的酸鹼值"],"ans":3,"exp":"李斯特菌症在反芻動物的主要感染源是製備不良的青貯料（silage）。當青貯料酸鹼值（pH值）>4.5時（偏鹼），李斯特菌可大量增殖。檢驗青貯料pH值是預防反芻動物感染的關鍵管理措施。","we":["撲滅野鼠可降低某些鼠傳疾病風險，但李斯特菌症與青貯料有關，A非主要措施。","管制流浪貓狗進入畜牧場對部分疾病有效，非李斯特菌防制重點，B不對。","控制精料量影響代謝病，與李斯特菌無直接關係，C不對。","（正確）青貯料pH值高（>4.5）是李斯特菌增殖的關鍵條件，檢驗pH值是最重要的預防措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_066","year":2024,"roc_year":113,"session":"","examNo":66,"q":"下列何者是造成人顆粒球艾利希氏體症的病原？","opts":["A. Ehrlichia ewingii","B. Anaplasma phagocytophila","C. Ehrlichia chaffeensis","D. Neorickettsia sennetsu"],"ans":1,"exp":"人顆粒球艾利希氏體症（Human Granulocytic Anaplasmosis, HGA）的病原是Anaplasma phagocytophilum（前稱Anaplasma phagocytophila），由蜱傳播，感染人類顆粒球（嗜中性球）。","we":["Ehrlichia ewingii主要引起人類顆粒球艾利希氏體症的少見型，不是主要病原。","（正確）Anaplasma phagocytophilum（前稱A. phagocytophila）是HGA的主要病原。","Ehrlichia chaffeensis引起人單核球艾利希氏體症（HME），感染單核球，不是顆粒球。","Neorickettsia sennetsu引起牛岐熱（sennetsu fever），非HGA的病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_067","year":2024,"roc_year":113,"session":"","examNo":67,"q":"有關人感染人畜共通之阿米巴性痢疾的敘述，何者正確？","opts":["A. 食入被滋養體（trophozoite）污染的食物或飲水而感染","B. 主要引起之症狀為水樣下痢便","C. 以下痢便中發現蟲卵為確診依據","D. 偶而會移行至肝、肺、腦等內臟，造成膿瘍"],"ans":3,"exp":"阿米巴性痢疾（由痢疾阿米巴Entamoeba histolytica引起）感染途徑為食入囊體（cysts）污染的食物/飲水，主要引起侵犯性痢疾（血樣便），偶爾幼蟲移行至肝、肺、腦形成膿瘍（D正確）。診斷靠糞便中發現滋養體或囊體，非蟲卵。","we":["感染需食入囊體（cyst），不是滋養體（trophozoite）；滋養體在外界不能存活，A有誤。","阿米巴性痢疾的特徵是含血液和黏液的「侵犯性痢疾」，不是水樣下痢便，B有誤。","痢疾阿米巴是原蟲（protozoa），無蟲卵（egg），診斷靠發現囊體或滋養體，C有誤。","（正確）痢疾阿米巴偶爾移行至肝（肝膿瘍最常見）、肺、腦，造成膿瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_068","year":2024,"roc_year":113,"session":"","examNo":68,"q":"有關日本住血吸蟲（   Schistosoma japonicum）的敘述，下列何者正確？","opts":["A. 主要寄生於右心室與肺動脈附近，造成循環系統的問題","B. 產卵後經循環由腎臟穿出，經由輸卵管及尿道將蟲卵排出體外","C. 蟲體細長吸盤位於頭部及尾部，為雌雄同體、異體生殖","D. 主要感染方式為在水中的尾動幼蟲直接穿入皮膚感染"],"ans":3,"exp":"日本住血吸蟲（Schistosoma japonicum）的感染方式是水中的尾幼蟲（cercariae）直接穿入皮膚，造成人類感染。中間宿主是釘螺（Oncomelania），最終寄生在門靜脈系統（不是右心室或腎臟）。","we":["日本住血吸蟲寄生於腸系膜靜脈（門靜脈系統），不是右心室和肺動脈，A有誤。","蟲卵經由血液循環到腸壁穿出，隨糞便排出，不是經腎臟和尿道，B有誤。","血吸蟲是雌雄異體（dioecious），雄蟲有抱雌溝，非雌雄同體，C有誤。","（正確）尾幼蟲在水中自由游動，直接穿入皮膚感染宿主，不需中間宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_069","year":2024,"roc_year":113,"session":"","examNo":69,"q":"有關人類感染犬蛔蟲（    Toxocara canis）的敘述，下列何者錯誤？","opts":["A. 透過食入蟲卵造成感染","B. 蟲卵排出後可在環境中維持數週到數月之久","C. 主要藉由病人糞便中發現蟲卵確診","D. 幼蟲是造成人類致害的主要型態"],"ans":2,"exp":"人類感染犬蛔蟲（Toxocara canis）是透過食入蟲卵（不是幼蟲）感染，幼蟲在人體內移行造成幼蟲移行症（VLM），但因人是非適當（偶然）宿主，蟲體無法完成生活史，糞便中找不到蟲卵。診斷靠血清學（ELISA）或組織切片，C有誤。","we":["透過食入蟲卵感染，A正確。","蟲卵在環境中可存活數週至數月，B正確。","（正確錯誤）人是犬蛔蟲的非適當宿主，糞便中找不到蟲卵，診斷靠血清學，C有誤。","幼蟲（移行性幼蟲）是在人體內造成傷害的主要型態，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_070","year":2024,"roc_year":113,"session":"","examNo":70,"q":"有關人畜共通傳染病原孟松裂頭絛蟲（          Spirometra mansoni）之敘述，下列何者正確？","opts":["A. 成蟲頭節具有吸盤，以幫助蟲體附著於宿主上","B. 屬於小型絛蟲，外型較短，僅有4～5個體節","C. 卵於水中孵化為幼蟲後，進入中間宿主，形成囊尾幼蟲","D. 蛇、蛙可做為第二中間宿主"],"ans":3,"exp":"孟松裂頭絛蟲（Spirometra mansoni）的生活史：成蟲在貓狗等食肉目終宿主腸道 → 蟲卵隨糞便排出 → 水中孵化為鉤球幼蟲 → 進入劍水蚤（第一中間宿主）→ 第一實尾幼蟲 → 蛙或蛇（第二中間宿主）→ 裂頭幼蟲（plerocercoid）→ 貓狗食入蛙/蛇完成生活史。","we":["裂頭絛蟲（假葉目絛蟲）頭節無吸盤，以吸槽（bothria）附著，A有誤。","裂頭絛蟲是大型絛蟲，可達數公尺長，體節數多，B有誤。","裂頭絛蟲的囊幼蟲不叫囊尾幼蟲（cysticercus），而叫裂頭幼蟲（plerocercoid），C有誤。","（正確）蛇和蛙作為第二中間宿主，攜帶裂頭幼蟲，被終宿主（貓狗）捕食後完成生活史。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_071","year":2024,"roc_year":113,"session":"","examNo":71,"q":"人類可經由生吃蟹類感染下列何種寄生蟲？","opts":["A. 有棘顎口蟲及宮崎肺吸蟲","B. 有棘顎口蟲及橫川氏吸蟲","C. 橫川氏吸蟲及肺吸蟲","D. 宮崎肺吸蟲及肺吸蟲"],"ans":3,"exp":"衛氏肺吸蟲（Paragonimus westermani）和宮崎肺吸蟲（Paragonimus miyazakii）均透過食入含有後囊幼蟲（metacercariae）的生/未熟淡水蟹類或淡水蝦感染人類。有棘顎口蟲和橫川氏吸蟲則主要透過生食淡水魚類傳播。","we":["有棘顎口蟲（Gnathostoma spinigerum）主要透過生食淡水魚（非蟹）傳播，A中顎口蟲不符。","有棘顎口蟲和橫川氏吸蟲均透過淡水魚類傳播，非蟹類，B不符。","橫川氏吸蟲（Metagonimus yokogawai）透過淡水魚（鮎魚等）傳播，非蟹，C中橫川氏吸蟲不符。","（正確）宮崎肺吸蟲和衛氏肺吸蟲（肺吸蟲）均透過生吃淡水蟹感染人類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_072","year":2024,"roc_year":113,"session":"","examNo":72,"q":"水域環境中劍水蚤（cyclops）可傳播下列何種寄生蟲？","opts":["A. 心絲蟲屬（Dirofilaria spp.）","B. 麥地那絲蟲屬（Dracunculus spp.）","C. 指狀絲蟲屬（Setaria spp.）","D. 蟠尾絲蟲屬（Onchocerca spp.）"],"ans":1,"exp":"麥地那絲蟲（Dracunculus medinensis）的生活史需要劍水蚤（Cyclops）作為中間宿主。人類飲入含感染性幼蟲的劍水蚤後，幼蟲在腸道逸出，雌蟲移行至皮下（通常在腿部），形成水泡後從皮膚穿出產卵至水中，幼蟲被劍水蚤吞食完成循環。","we":["心絲蟲（Dirofilaria）由蚊子傳播，不需劍水蚤，A不對。","（正確）麥地那絲蟲（Dracunculus）透過飲用含感染性劍水蚤的水感染，B正確。","指狀絲蟲（Setaria）由蚊子或其他昆蟲傳播，不需劍水蚤，C不對。","蟠尾絲蟲（Onchocerca）由黑蠅（Simulium）傳播，不需劍水蚤，D不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_073","year":2024,"roc_year":113,"session":"","examNo":73,"q":"依照飲用水水質標準，下列何者為非加氯消毒副產物？","opts":["A. 四氯化碳","B. 含鹵乙酸","C. 甲醛","D. 三鹵甲烷"],"ans":2,"exp":"甲醛（formaldehyde）是臭氧（ozone）消毒的副產物，不是加氯消毒的副產物。加氯消毒的副產物包括：三鹵甲烷（THMs，如氯仿）、含鹵乙酸（HAAs）、四氯化碳等含氯化合物。","we":["四氯化碳（CCl4）是含氯消毒的副產物之一，A是加氯副產物。","含鹵乙酸（HAAs，如二氯乙酸、三氯乙酸）是加氯消毒的主要副產物，B是加氯副產物。","（正確）甲醛是臭氧消毒的副產物，不是加氯消毒的副產物，C不屬於加氯副產物。","三鹵甲烷（THMs，如氯仿）是加氯消毒最重要的副產物，D是加氯副產物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_074","year":2024,"roc_year":113,"session":"","examNo":74,"q":"下列化合物中，何者屬於含氯或鹵素類消毒水，接觸有機物質後形成的消毒副產物會影響健康？①總三鹵甲\r   烷（total trihalomethanes） ②亞硝酸鹽氮（nitrite-nitrogen） ③二溴乙酸（dibromoacetic  acid） ④亞氯酸鹽（chlorite）","opts":["A. ①②","B. ②④","C. ③④","D. ①③"],"ans":3,"exp":"含氯消毒水與有機物反應形成的副產物包括：①總三鹵甲烷（THMs，如氯仿）和③二溴乙酸（含鹵乙酸的一種）。亞硝酸鹽氮（②）是廢棄物來源，不是消毒副產物；亞氯酸鹽（④）是使用二氧化氯消毒的副產物，不是含氯消毒的副產物。","we":["①②：亞硝酸鹽氮不是含氯消毒副產物，A不對。","②④：兩者均非含氯消毒的典型副產物，B不對。","③④：亞氯酸鹽是二氧化氯消毒副產物，非含氯消毒副產物，C含④不對。","（正確）①總三鹵甲烷和③二溴乙酸（含鹵乙酸類）均是含氯消毒水的典型副產物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_075","year":2024,"roc_year":113,"session":"","examNo":75,"q":"下列何種重金屬中毒會引起痛痛病？","opts":["A. 汞","B. 鉛","C. 鎘","D. 砷"],"ans":2,"exp":"痛痛病（Itai-itai disease）是日本富山縣因鎘（Cadmium）污染導致的公害病，以骨骼劇痛和骨折為主要症狀，係因鎘累積在腎臟損害腎功能，導致鈣磷代謝異常、骨質疏鬆。","we":["汞（Mercury）中毒引起「水俁病」（Minamata disease），以神經系統損害為主，非痛痛病。","鉛（Lead）中毒主要影響造血和神經系統，非痛痛病病因。","（正確）鎘（Cadmium）中毒引起痛痛病，以骨骼疼痛和腎臟損害為特徵。","砷（Arsenic）中毒引起皮膚病變（烏腳病等），非痛痛病病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_076","year":2024,"roc_year":113,"session":"","examNo":76,"q":"在三段式養豬廢水處理的過程中，下列那一階段清除生物需氧量（BOD）的效率最佳？","opts":["A. 好氣處理","B. 厭氣發酵","C. 固液分離","D. 堆肥處理"],"ans":0,"exp":"三段式養豬廢水處理流程：固液分離→厭氣發酵→好氣處理。好氣處理（aerobic treatment）使用微生物在有氧條件下分解有機物，對可溶性有機物（BOD的主要來源）的去除效率最高，是三段中清除BOD效率最佳的階段。","we":["（正確）好氣處理對溶解性有機物的BOD去除效率最高，是最佳BOD清除階段。","厭氣發酵雖可分解有機物並產生沼氣，但BOD去除效率低於好氣處理。","固液分離主要去除固體懸浮物，對溶解性BOD去除效率有限。","堆肥處理是對固體廢棄物的處理，不是廢水處理中的BOD清除階段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_077","year":2024,"roc_year":113,"session":"","examNo":77,"q":"沼氣當中何種成分會造成金屬製相關設備的腐蝕？","opts":["A. 甲烷","B. 二氧化碳","C. 硫化氫","D. 氮氣"],"ans":2,"exp":"沼氣主要成分為甲烷（CH4）和二氧化碳（CO2），以及少量硫化氫（H2S）。硫化氫是造成金屬腐蝕的主要成分，因為H2S遇水形成弱酸（H2S + H2O），並在氧氣存在下進一步氧化成硫酸（H2SO4），腐蝕金屬設備。","we":["甲烷（CH4）不具腐蝕性，主要作為燃料使用，A不對。","二氧化碳（CO2）溶於水形成碳酸，腐蝕性弱，非主要腐蝕成分，B不對。","（正確）硫化氫（H2S）是沼氣中造成金屬腐蝕的主要成分，形成酸腐蝕管道和設備。","氮氣（N2）是惰性氣體，不具腐蝕性，D不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_078","year":2024,"roc_year":113,"session":"","examNo":78,"q":"下列何項養豬廢水處理設施，需要加設如加壓送風機與散氣管等設備，用以增加廢水中的溶氧量？","opts":["A. 固液分離機","B. 曝氣池","C. 厭氣槽","D. 污泥濃縮池"],"ans":1,"exp":"曝氣池（aeration tank）是好氣處理的核心設備，需要加壓送風機（air compressor）和散氣管（diffuser）向廢水中強制充入空氣，提高廢水中的溶氧量，以支持好氣性微生物分解有機物。","we":["固液分離機以機械方式分離固體和液體，不需要增加溶氧的設備，A不對。","（正確）曝氣池需要加壓送風機和散氣管充氧，以進行好氣性生物處理，B正確。","厭氣槽在無氧環境下運行，不能充入空氣（否則抑制厭氣微生物），C相反。","污泥濃縮池是將污泥脫水濃縮，不需要充氧設備，D不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_079","year":2024,"roc_year":113,"session":"","examNo":79,"q":"豬糞尿經過三段式廢水處理後，廢水中生物需氧量（BOD）至少可達去除率為多少以上？","opts":["A. 20％","B. 50％","C. 70％","D. 90％"],"ans":3,"exp":"豬糞尿經三段式廢水處理（固液分離→厭氣發酵→好氣處理）後，BOD的去除率可達90%以上，使排放水達到放流水標準。此三段式處理是台灣豬場標準廢水處理流程。","we":["20%去除率過低，固液分離單一步驟就可達此效果，A不符三段式的效果。","50%去除率過低，三段式完整處理可達更高效率，B不對。","70%去除率略低，三段式完整處理的設計目標高於此，C不對。","（正確）三段式廢水處理後BOD去除率可達90%以上，符合台灣豬場廢水處理標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_公衛_080","year":2024,"roc_year":113,"session":"","examNo":80,"q":"下列豬糞尿的處理方法中，何者會有沼氣生成？","opts":["A. 液肥貯存法","B. 厭氣處理法","C. 好氣處理法","D. 生物膜旋轉盤法"],"ans":1,"exp":"厭氣處理法（anaerobic digestion）在無氧條件下，有機物被甲烷菌（methanogens）等厭氣微生物分解，產生沼氣（主要成分為甲烷CH4和二氧化碳CO2）。好氣處理法、液肥貯存法和生物膜旋轉盤法不產生大量沼氣。","we":["液肥貯存法是將廢水儲存後作為液肥，雖有部分厭氣發酵，但主要目的不是產沼氣，A不是主要沼氣來源。","（正確）厭氣處理法透過甲烷菌的無氧分解過程產生沼氣（CH4+CO2），是三段式處理中的產氣步驟。","好氣處理法需要氧氣，有氧條件下不產沼氣，主要產CO2和水，C不對。","生物膜旋轉盤法（RBC）是好氣性生物處理，不產沼氣，D不對。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_001","year":2025,"roc_year":114,"session":"","examNo":1,"q":"下列有關獸醫流行病學與獸醫臨床醫學之敘述，何者錯誤？","opts":["A. 獸醫臨床醫學的結論通常無法幫助防疫政策的擬定，而獸醫流行病學則可以","B. 獸醫臨床醫學考慮的是個體的疾病型態，而獸醫流行病學考慮的是群體","C. 獸醫流行病學通常著重在患病動物，而較不重視健康動物","D. 獸醫臨床醫學通常著重在治療患病動物，而獸醫流行病學則找出問題並評估介入方案"],"ans":2,"exp":"獸醫流行病學強調群體（population）的疾病分布與決定因素，必須同時研究患病與健康動物，才能找出危險因子。選項C「著重患病動物，較不重視健康動物」與流行病學基本定義矛盾——流行病學需比較病例組與對照組（健康動物），才能評估暴露與疾病的關聯。","we":["A. 雖略顯誇張，但臨床知識確實可用於政策（如通報門檻設定），此選項有爭議但並非本題最明顯的錯誤。","B. 臨床=個體診療，流行病學=群體研究，正確描述兩者核心差異，不是錯誤選項。","C. 錯誤：流行病學研究必須同時納入健康動物作為對照，方能計算相對風險或勝算比，此敘述違背流行病學基本概念。","D. 正確區分兩者目標：臨床治療個體，流行病學找出族群問題並評估介入方案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_002","year":2025,"roc_year":114,"session":"","examNo":2,"q":"有關獸醫臨床試驗（clinical trial）分期之評估目的，下列敘述何者錯誤？","opts":["A. 第一期主要是評估藥物的藥理及毒性","B. 第二期主要是評估藥物效果及安全性","C. 第三期為大規模實驗動物分組效力試驗","D. 第四期為上市後之監測"],"ans":2,"exp":"獸醫臨床試驗第三期（Phase III）應為大規模「目標動物」臨床隨機對照試驗（field trial），評估藥物在實際臨床環境中的有效性與安全性，而非「實驗動物（laboratory animals）」試驗。「實驗動物」試驗屬於第一期（毒理學、藥理學評估），使用實驗室動物（如大鼠、小鼠）。","we":["A. 第一期確為評估藥物藥理（PK/PD）及毒性（急性、亞急性毒理），正確。","B. 第二期為小規模目標動物效果及安全性評估，正確。","C. 錯誤：第三期應為「大規模目標動物田間試驗」，而非「實驗動物」（lab animals）效力試驗。","D. 第四期為藥物上市後監測（post-marketing surveillance），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_003","year":2025,"roc_year":114,"session":"","examNo":3,"q":"下列何者最接近流行性疾病（epidemic）之定義？","opts":["A. 在某地區反覆低程度發生的疾病","B. 在特定時間地點發生病例數量超過預期的疾病","C. 在多地區短時間內發生高病例數量的疾病","D. 偶然且局部性發生的疾病"],"ans":1,"exp":"流行性疾病（epidemic）的定義：在特定時間與地點，某疾病的病例數量超過預期（expected/baseline）水準。A描述的是地方性（endemic）疾病；C描述的是大流行（pandemic）；D描述的是散發（sporadic）疾病。","we":["A. 描述地方性（endemic）疾病——在某地區長期、規律、低程度發生，不是epidemic的定義。","B. 正確定義：在特定時間地點病例數超過預期，即為流行性疾病（epidemic）。","C. 描述大流行（pandemic）——疫情跨越多國多地區大規模擴散，比epidemic更廣。","D. 描述散發（sporadic）——偶然、局部、無規律性發生的個別病例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_004","year":2025,"roc_year":114,"session":"","examNo":4,"q":"流行病學曲線的橫軸代表下列何種意義？","opts":["A. 疾病率","B. 盛行率","C. 傳播速度","D. 時間"],"ans":3,"exp":"流行病學曲線（epidemic curve）的橫軸（X軸）代表時間（time），縱軸（Y軸）代表新增病例數。透過曲線形狀（point source、propagated、intermittent）可推斷暴露來源與傳播模式。","we":["A. 疾病率（morbidity rate）是縱軸的計算依據，不是橫軸。","B. 盛行率（prevalence）是疾病指標，不是epidemic curve的橫軸。","C. 傳播速度可從曲線形狀推算，但它是縱軸的導出資訊，不是橫軸座標。","D. 正確：橫軸代表時間，顯示疫情隨時間的發展趨勢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_005","year":2025,"roc_year":114,"session":"","examNo":5,"q":"小鼠50％致死劑量（50% mouse lethal dose, MLD 50 ），是用於描述病原的何種因子？","opts":["A. 感染力","B. 毒力","C. 侵犯力","D. 病原性"],"ans":1,"exp":"MLD50（50% mouse lethal dose）是使50%接種動物死亡所需的最低劑量，用來測量病原的「毒力（virulence）」——即病原造成嚴重疾病或死亡的能力。感染力（infectivity）用ID50測量；侵犯力（invasiveness）描述突破屏障的能力；病原性（pathogenicity）描述引起疾病的整體能力。","we":["A. 感染力（infectivity）以ID50（infectious dose 50%）表示，非MLD50。","B. 正確：MLD50測量病原使動物致死的能力，屬於毒力（virulence）的量化指標。","C. 侵犯力（invasiveness）描述病原突破宿主防禦並擴散的能力，無MLD50量化。","D. 病原性（pathogenicity）是廣義概念，指病原引起疾病的能力，MLD50是毒力的特定指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_006","year":2025,"roc_year":114,"session":"","examNo":6,"q":"下列何者為疾病決定因子中的病原因素？","opts":["A. 宿主對此病原的免疫力","B. 宿主遺傳性缺陷","C. 宿主飼養密度","D. 宿主特異性"],"ans":3,"exp":"疾病決定因子三角：宿主（host）、病原（agent）、環境（environment）。宿主特異性（host specificity）是病原的特性，描述病原能感染哪些宿主物種，屬於病原因素。宿主免疫力、遺傳缺陷屬於宿主因素；飼養密度屬於環境因素。","we":["A. 宿主對此病原的免疫力是「宿主因素」（免疫狀態），非病原因素。","B. 宿主遺傳性缺陷是「宿主因素」（遺傳易感性），非病原因素。","C. 宿主飼養密度是「環境因素」（密度影響傳播機會），非病原因素。","D. 正確：宿主特異性（host specificity）是病原的特性——描述該病原能感染哪些宿主物種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_007","year":2025,"roc_year":114,"session":"","examNo":7,"q":"當一疾病在族群的基本複製數（basic reproductive number, R 0 ）為2.3時，下列敘述何者正確？① 一個感染個體可在平均2.3天感染另一具感受性的個體 ②一個感染個體平均可再感染2.3個具感受 性的個體 ③族群中疫情可能會持續且擴大 ④族群中疫情可能會減少並漸受控制","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":2,"exp":"基本複製數R0=2.3：定義為一個感染個體在完全易感族群中平均能感染的繼發病例數，R0>1表示疫情會持續擴大。①說的是「2.3天感染」是錯誤的；②說「平均再感染2.3個個體」是R0的正確定義；③R0>1疫情擴大正確；④R0>1不會減少。故②③正確，答案為C（②③）。","we":["A. ①③：①錯誤（R0是傳染個數，非天數），③正確，但①不對，故此組合錯誤。","B. ①④：①錯誤，④錯誤（R0>1疫情會擴大不會受控），兩者皆錯。","C. 正確：②為R0的正確定義（一個感染個體平均再感染2.3個易感個體）；③R0>1疫情持續擴大正確。","D. ②④：②正確，但④錯誤（R0=2.3>1，疫情應擴大而非受控），組合有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_公衛_008","year":2025,"roc_year":114,"session":"","examNo":8,"q":"下列有關盛行率（prevalence）的敘述，何者正確？","opts":["A. 屬於發生率的一種指標","B. 可由流行病學曲線得知","C. 點盛行率和期間盛行率通常相同","D. 考慮觀察期間內所有病例"],"ans":3,"exp":"期間盛行率（period prevalence）考慮觀察期間內所有病例（既有病例+新增病例），選項D正確描述
