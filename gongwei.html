誌通常用於禽肉包裝袋上；豬牛屠體表面蓋印章，禽肉包裝束口貼標籤為另一型式。題目圖示為適用禽肉包裝之標誌。","we":["A錯誤：豬牛屠體表面使用不同形式（印戳蓋印），非圖示之標誌型態。","B錯誤：剝皮屠體有其對應標誌型式，與圖示不同。","D錯誤：禽肉包裝束口使用束口標籤，與圖示包裝標誌不同。","C正確：圖示標誌適用於禽肉包裝袋外包裝。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_023","year":2021,"roc_year":110,"session":"","examNo":23,"q":"食品衛生檢驗及動植物檢疫（sanitary and phytosanitary；SPS）協定中有關風險評估及適當的檢驗或防檢疫保\r   護水準之決定，下列敘述何者錯誤？","opts":["A. 會員在進行風險評估時應考量現有科學證據","B. 決定採行可達適當的檢驗或防檢疫保護水準之措施以防範該風險時，應考量相關經濟因素","C. 在決定其適當的檢驗或防檢疫保護水準之際，毋需兼顧貿易負面影響","D. 於制定檢驗或防檢疫措施時，應保證該等措施對貿易的限制以不超過達成適當的檢驗或防檢疫保護水準為   限"],"ans":2,"exp":"SPS協定要求會員在決定適當保護水準時，需在風險管理與減少貿易障礙之間取得平衡，必須兼顧貿易負面影響，盡量選擇對貿易限制最少的措施。C稱「毋需兼顧貿易負面影響」與SPS協定精神相違，為錯誤敘述。","we":["A正確：SPS協定明確要求風險評估需以現有科學證據為基礎。","B正確：SPS協定允許在制定措施時考量相關經濟因素。","D正確：SPS協定要求措施對貿易的限制不超過達成適當保護水準所必要的程度。","C錯誤：SPS協定明確要求兼顧貿易負面影響，C敘述與此相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_024","year":2021,"roc_year":110,"session":"","examNo":24,"q":"依據畜牧法施行細則，屠宰場自原場址遷移時，依法應如何辦理？","opts":["A. 在同一縣巿內可繼續營業","B. 需申請變更為新場址","C. 換照即可","D. 重新申請設立"],"ans":3,"exp":"依畜牧法施行細則規定，屠宰場自原場址遷移，視同新設場，須重新申請設立，不得以換照或變更方式代替。","we":["A錯誤：即使在同一縣市內，遷移後仍需重新申請，不得繼續以原許可營業。","B錯誤：遷移不屬於一般的場址變更，須重新申請，非單純申請變更。","C錯誤：換照僅適用於許可證到期續展，不適用場址遷移。","D正確：場址遷移依法須重新申請設立許可。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_025","year":2021,"roc_year":110,"session":"","examNo":25,"q":"下列有關鼻疽（glanders）的敘述，何者錯誤？","opts":["A. 病原為Burkholderia pseudomallei","B. 人主要透過皮膚傷口感染","C. 其病原在水或土中的抵抗力較類鼻疽菌弱","D. 曾為馬、驢、騾的重要傳染病"],"ans":0,"exp":"鼻疽（glanders）的病原為Burkholderia mallei，而Burkholderia pseudomallei是類鼻疽（melioidosis）的病原。兩者同屬但不同種，常被混淆。其餘敘述（皮膚傷口感染、B. mallei抵抗力較B. pseudomallei弱、曾為馬驢騾重要傳染病）均正確。","we":["B正確：人主要透過皮膚傷口接觸感染動物的分泌物而感染鼻疽。","C正確：Burkholderia mallei（鼻疽菌）在外環境存活能力比B. pseudomallei（類鼻疽菌）弱，對熱和乾燥較敏感。","D正確：鼻疽曾是馬、驢、騾的重要傳染病，現已極罕見。","A錯誤：鼻疽病原為B. mallei，非B. pseudomallei（後者為類鼻疽病原）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_026","year":2021,"roc_year":110,"session":"","examNo":26,"q":"下列那一個國際組織隸屬於聯合國且與維護動物健康及動物產品貿易有關？","opts":["A. World Organization for Animal Health（OIE）","B. World Trade Organization（WTO）","C. Food and Agriculture Organization（FAO）","D. International Plant Protection Convention（IPPC）"],"ans":2,"exp":"FAO（聯合國糧食及農業組織）隸屬於聯合國，與動物健康及動物產品貿易密切相關，並與OIE及WHO合作制定食品安全及動物衛生標準（如Codex）。OIE現更名為WOAH，非聯合國機構。WTO非聯合國機構。IPPC主要負責植物保護。","we":["A錯誤：OIE（現WOAH）雖與動物健康密切相關，但並非聯合國機構，是政府間獨立組織。","B錯誤：WTO是國際貿易組織，非聯合國機構，且主要負責貿易規則而非動物衛生本身。","D錯誤：IPPC（國際植物保護公約）主要針對植物健康，非動物健康。","C正確：FAO隸屬聯合國，與維護動物健康及動物產品貿易安全有直接關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_027","year":2021,"roc_year":110,"session":"","examNo":27,"q":"根據世界衛生組織的國際疫情資訊，臺灣在2007年獲認定為下列那一個疾病的風險已控制國家？","opts":["A. 馬鼻疽","B. 牛海綿狀腦病","C. 口蹄疫","D. 非洲豬瘟"],"ans":2,"exp":"台灣自1997年爆發口蹄疫疫情，歷經多年努力防治，並停打疫苗、持續監控，在2007年獲OIE（世界動物衛生組織，非世衛WHO）認定為「不施打疫苗之口蹄疫風險已控制國家」。","we":["A錯誤：馬鼻疽在台灣並非主要議題，亦非2007年特別認定的疾病。","B錯誤：台灣從未發生牛海綿狀腦病（BSE），無須另行認定風險控制。","D錯誤：非洲豬瘟在2007年尚未傳入台灣周邊，非該年認定項目。","C正確：台灣2007年獲OIE認定為口蹄疫風險已控制（不打疫苗）國家。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_028","year":2021,"roc_year":110,"session":"","examNo":28,"q":"依據優良農產品驗證管理辦法，臺灣乳品檢驗法酸度滴定之基準為多少以下？","opts":["A. 0.18%","B. 0.17%","C. 0.16%","D. 0.15%"],"ans":1,"exp":"依優良農產品（CAS）驗證管理辦法及台灣乳品相關標準，鮮乳酸度（以乳酸計）的上限為0.17%以下。此數值為台灣乳品品質的法定基準。","we":["A錯誤：0.18%超過法定上限，不符合標準。","C錯誤：0.16%雖符合，但題目問「基準為多少以下」，正確上限值為0.17%。","D錯誤：0.15%過低，非法定基準值。","B正確：台灣乳品酸度滴定基準為0.17%以下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_029","year":2021,"roc_year":110,"session":"","examNo":29,"q":"因食用生魚片或海鮮產品引起食物中毒的好鹽性細菌病原為下列何者？","opts":["A. Bacillus cereus","B. Campylobacter jejuni","C. Vibrio parahemolyticus","D. Clostridium perfringens"],"ans":2,"exp":"腸炎弧菌（Vibrio parahaemolyticus）為好鹽性（halophilic）細菌，廣泛存在海洋環境，是台灣及東亞地區因食用生魚片、海鮮最常見的食物中毒病原菌。","we":["A錯誤：Bacillus cereus常見於米飯、澱粉類食品，非好鹽性，與生食海鮮關聯較低。","B錯誤：Campylobacter jejuni多與禽肉、未滅菌乳品相關，非好鹽性細菌。","D錯誤：Clostridium perfringens多與大量熟食放置室溫過久相關，非好鹽性。","C正確：V. parahaemolyticus為好鹽性，是生食海鮮最常見的食物中毒病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_030","year":2021,"roc_year":110,"session":"","examNo":30,"q":"下列何種病原不是藉由食用牛肉而致病？","opts":["A. Prion","B. 無鈎絛蟲","C. 有鈎絛蟲","D. O157大腸桿菌"],"ans":2,"exp":"有鈎絛蟲（Taenia solium）的中間宿主為豬（非牛），人食用含囊尾蚴的生豬肉才會感染，食用牛肉並不傳播有鈎絛蟲。Prion（BSE）、無鈎絛蟲（T. saginata）及O157大腸桿菌均可經食用牛肉傳播人。","we":["A錯誤：Prion透過食用感染BSE的牛腦/脊髓等組織傳染給人（vCJD），屬牛肉相關傳播。","B錯誤：無鈎絛蟲（T. saginata）中間宿主為牛，人食用含囊尾蚴的生牛肉而感染。","D錯誤：O157大腸桿菌（STEC）常汙染牛糞，進而汙染牛肉，食用不熟牛肉可致病。","C正確：有鈎絛蟲宿主為豬，不透過食用牛肉傳播，故為不藉牛肉致病的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_031","year":2021,"roc_year":110,"session":"","examNo":31,"q":"牛肉藉由熟成過程嫩化肉質，主要是由下列何原因所造成？","opts":["A. 肉澱粉酵素分解肝醣產生乳酸","B. 肉中黴菌產生的酵素造成結締組織分解","C. 肉中脂肪酵素分解脂肪產生游離脂肪酸","D. 肉中蛋白酵素將蛋白質分解"],"ans":3,"exp":"牛肉熟成（aging）的嫩化主要機制是肌肉自身蛋白酶（如鈣蛋白酶calpain）在低溫儲存期間分解肌原纖維蛋白，使肌肉組織結構軟化，口感更嫩。此過程不依賴黴菌或脂肪分解。","we":["A錯誤：澱粉酶分解肝醣產生乳酸是宰後僵直pH下降的機制，與嫩化作用不同。","B錯誤：乾式熟成表面可能有黴菌，但主要嫩化機制仍為內源性蛋白酶，黴菌酵素非主因。","C錯誤：脂肪分解產生游離脂肪酸影響風味，不是嫩化（肌肉軟化）的原因。","D正確：熟成嫩化主要由肉中內源性蛋白酶分解肌纖維蛋白所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_032","year":2021,"roc_year":110,"session":"","examNo":32,"q":"依據食品含戴奧辛及戴奧辛類多氯聯苯處理規範，下列有關戴奧辛的敘述，何者錯誤？","opts":["A. 具致癌、難分解及蓄積等特性","B. 屬於脂溶性","C. 禽肉及其製品中不得檢出","D. 生物體內累積，主要對肝臟、生殖系統有害"],"ans":2,"exp":"戴奧辛（dioxin）為脂溶性持久性有機污染物，具致癌性且難分解，在生物體中蓄積，主要對肝臟、生殖系統和免疫系統有害。台灣法規設有容許上限（不是完全禁止），並非「不得檢出」，故C為錯誤敘述。","we":["A正確：戴奧辛具致癌、難分解及蓄積（bioaccumulation）等特性，屬持久性有機污染物（POP）。","B正確：戴奧辛屬脂溶性物質，易在脂肪組織中蓄積。","D正確：戴奧辛主要對肝臟及生殖系統造成毒性，亦影響免疫及神經系統。","C錯誤：禽肉及製品中戴奧辛設有容許限量標準（TEQ值），並非完全不得檢出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_033","year":2021,"roc_year":110,"session":"","examNo":33,"q":"於乳製品生產過程中，下列何者為二次污染性病原？","opts":["A. 李斯特菌","B. 炭疽桿菌","C. B型肝炎病毒","D. 副傷寒菌"],"ans":0,"exp":"李斯特菌（Listeria monocytogenes）是典型的二次污染性（post-processing）病原，因其耐低溫（可在冷藏環境生長），常在乳製品生產後的環境中殘留並二次汙染成品。炭疽桿菌、B型肝炎病毒及副傷寒菌均屬原料帶入的一次污染病原。","we":["B錯誤：炭疽桿菌來自感染動物的原料乳，屬一次污染，不是加工環境的二次污染。","C錯誤：B型肝炎病毒為人傳人的血液/體液傳播病毒，非乳品加工環境常見二次污染源。","D錯誤：副傷寒菌（Salmonella Paratyphi）主要來自原料或人員污染，非典型的加工後二次污染菌。","A正確：李斯特菌耐低溫、廣泛存在加工環境，是乳製品加工後二次污染的代表性病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_034","year":2021,"roc_year":110,"session":"","examNo":34,"q":"牛乳比重之測定操作時，其校正值以15℃為基準，當溫度每增加1℃，牛乳的比重減少多少？","opts":["A. 0.02","B. 0.0002","C. 0.002","D. 0.2"],"ans":2,"exp":"牛乳比重以15℃為基準進行溫度校正，每增加或降低1℃，比重相差約0.0002（即2×10⁻⁴）。實際操作中換算為乳稠計讀數，每1℃對應校正值0.0002，故每升高1℃比重減少0.0002。選項C標示0.002差一個數量級，但依標準教科書校正值為0.0002，故選B（0.0002）。","we":["A錯誤：0.02差了100倍，數量級明顯偏大。","B正確（實際答案）：每1℃校正0.0002，此為標準教科書值。","C錯誤：0.002差了10倍，不符合標準校正值。","D錯誤：0.2完全不合理，差了1000倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_035","year":2021,"roc_year":110,"session":"","examNo":35,"q":"牛乳的酸度不與pH值成絕對比例之關係，是因為下列何者具有緩衝作用所致？","opts":["A. 水分","B. 磷酸鹽、檸檬酸鹽","C. 脂肪","D. 維生素"],"ans":1,"exp":"牛乳含有磷酸鹽、檸檬酸鹽及蛋白質等多種緩衝物質，使乳中酸鹼值（pH）不與可滴定酸度成直線比例關係。即使加入少量酸，pH變化也相對緩和，這是牛乳特有的緩衝能力（buffer capacity）所致。","we":["A錯誤：水分本身對緩衝作用貢獻有限，不是主要緩衝物質。","C錯誤：脂肪不溶於水，幾乎不參與水相中的緩衝反應。","D錯誤：維生素含量極微，對緩衝作用無顯著貢獻。","B正確：磷酸鹽和檸檬酸鹽是牛乳中主要緩衝物質，賦予牛乳良好的緩衝能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_036","year":2021,"roc_year":110,"session":"","examNo":36,"q":"生乳中含有超標的黃麴黴菌毒素（aflatoxin），其影響為何？","opts":["A. 讓蛋白質凝固","B. 可引起食物中毒","C. 產生高酸度之牛乳","D. 是一種內毒素，有助殺死其他病菌"],"ans":1,"exp":"黃麴黴菌毒素（aflatoxin）是由黴菌（Aspergillus flavus/parasiticus）產生的強效真菌毒素，具有致癌性（尤其肝癌）及急性毒性，食入超標含量可引起食物中毒，亦有免疫毒性。它不使蛋白質凝固，不產生高酸度，更非有益的內毒素。","we":["A錯誤：aflatoxin不會造成蛋白質凝固，蛋白凝固是高溫或酸鹼變性的結果。","C錯誤：黃麴毒素不會提高乳的酸度，酸度增加通常來自乳酸菌產酸。","D錯誤：黃麴毒素是外毒素型真菌毒素，對人體有強烈毒害，絕非有益。","B正確：aflatoxin可引起急性食物中毒及慢性致癌效應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_037","year":2021,"roc_year":110,"session":"","examNo":37,"q":"依據食品輻射照射處理標準，下列何種產品未准許在合法劑量下使用輻射照射？","opts":["A. 生鮮冷凍禽肉","B. 生鮮冷藏禽肉","C. 生鮮水產品","D. 生鮮冷凍畜肉"],"ans":1,"exp":"依台灣食品輻射照射處理標準，允許輻射照射的品項包括生鮮冷凍禽肉、生鮮冷凍畜肉及生鮮水產品等，但生鮮冷藏（非冷凍）禽肉並未列入允許使用輻射照射的項目。","we":["A錯誤：生鮮冷凍禽肉在法定劑量下准許使用輻射照射。","C錯誤：生鮮水產品亦在准許使用輻射照射的項目之列。","D錯誤：生鮮冷凍畜肉同樣被允許在合法劑量下輻射照射。","B正確：生鮮冷藏（非冷凍）禽肉並未列入准許使用輻射照射的品項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_038","year":2021,"roc_year":110,"session":"","examNo":38,"q":"生食海產魚類，感染何種寄生蟲的風險較高？","opts":["A. 蛔蟲","B. 隱胞子蟲","C. 巴貝氏蟲","D. 海獸胃線蟲"],"ans":3,"exp":"海獸胃線蟲（Anisakis spp.）廣泛寄生於海洋魚類（如鯖魚、鮭魚、烏賊），人食用含第三期幼蟲的生食海產魚類時即可感染海獸胃線蟲症（anisakiasis），造成腸胃道症狀。","we":["A錯誤：蛔蟲（Ascaris lumbricoides）主要透過蔬菜、土壤傳播，非海產魚類感染途徑。","B錯誤：隱胞子蟲（Cryptosporidium）主要透過污染水源或人畜糞便傳播，非海產魚類。","C錯誤：巴貝氏蟲（Babesia）經蜱（壁蝨）叮咬傳播，與生食魚類無關。","D正確：海獸胃線蟲寄生於海洋魚類，生食海產魚類是其主要感染途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_039","year":2021,"roc_year":110,"session":"","examNo":39,"q":"生食甲魚卵或因處理生甲魚食材時污染其他食材，則受下列何種病原菌感染的風險較高？","opts":["A. 貝氏考克斯菌（Coxiella burnetii）","B. 土拉倫法蘭西氏菌（Francisella tularensis）","C. 霍亂弧菌（Vibrio cholerae）","D. 韓瑟勒巴通氏菌（Bartonella henselae）"],"ans":1,"exp":"甲魚（鱉）及兩棲爬行類動物常帶有Francisella tularensis（土拉倫菌），食入生甲魚卵或處理生甲魚時接觸傷口可感染土拉倫症（tularemia）。Coxiella burnetii（Q熱）主要來自反芻動物；Vibrio cholerae來自污染水源；Bartonella henselae為貓抓熱病原。","we":["A錯誤：Coxiella burnetii（Q熱）主要透過接觸反芻動物（牛羊）的分娩產物或氣溶膠傳播，與甲魚無關。","C錯誤：Vibrio cholerae來自污染的水源和食物，甲魚並非其主要傳染媒介。","D錯誤：Bartonella henselae為貓抓熱病原，由貓跳蚤傳播，非甲魚相關。","B正確：Francisella tularensis常見於爬行類動物（包括鱉），是生食或處理甲魚感染土拉倫症的重要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_040","year":2021,"roc_year":110,"session":"","examNo":40,"q":"下列那一種弧菌較不會引起人類嚴重感染病？","opts":["A. 溶藻弧菌","B. 腸炎弧菌","C. 霍亂弧菌","D. 創傷性弧菌"],"ans":0,"exp":"溶藻弧菌（Vibrio alginolyticus）致病力相對最低，通常只引起輕微的傷口感染或外耳炎，鮮少造成全身性嚴重感染。腸炎弧菌（V. parahaemolyticus）可引起嚴重腹瀉，霍亂弧菌（V. cholerae）引起霍亂，創傷性弧菌（V. vulnificus）可致敗血症死亡。","we":["B錯誤：腸炎弧菌可引起急性腸胃炎，嚴重時可導致脫水，屬較嚴重感染病。","C錯誤：霍亂弧菌引起霍亂，以嚴重水樣腹瀉著稱，致死率高。","D錯誤：創傷性弧菌可引起壞死性筋膜炎及敗血症，死亡率極高，屬最危險的弧菌之一。","A正確：溶藻弧菌致病性相對最低，較不會引起嚴重感染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_041","year":2021,"roc_year":110,"session":"","examNo":41,"q":"依據動物用藥殘留標準，下列何種藥物在雞蛋中具有允許殘留容許量？","opts":["A. 必利美達民（pyrimethamine）","B. 乃卡巴精（nicarbazin）","C. 硝基呋喃類（nitrofurantoins）","D. 拉薩羅（lasalocid）"],"ans":3,"exp":"依動物用藥殘留標準，lasalocid（拉薩羅，一種離子載體型抗球蟲藥）在雞蛋中設有殘留容許量。必利美達民（pyrimethamine）、乃卡巴精（nicarbazin）在蛋中不得檢出，硝基呋喃類（nitrofurantoins）屬禁用藥物。","we":["A錯誤：必利美達民（pyrimethamine）在雞蛋中無容許殘留量（不得檢出）。","B錯誤：乃卡巴精（nicarbazin）雖為常用抗球蟲藥，但在蛋中規定不得檢出。","C錯誤：硝基呋喃類為禁用藥物，在所有食用動物產品中均不得檢出。","D正確：lasalocid在雞蛋中有法定殘留容許量，可合法使用並設有容許上限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_042","year":2021,"roc_year":110,"session":"","examNo":42,"q":"依據動物用藥殘留標準，家禽蛋類中有關安保寧（amprolium）的殘留容許量為多少ppm？","opts":["A. 40","B. 4","C. 0.4","D. 0"],"ans":1,"exp":"依動物用藥殘留標準，安保寧（amprolium）在家禽蛋類中的殘留容許量為4 ppm。Amprolium為常用的抗球蟲藥，被允許在蛋中有一定殘留量。","we":["A錯誤：40 ppm過高，非法定容許量。","C錯誤：0.4 ppm過低，非法定容許量。","D錯誤：0 ppm表示不得檢出，但amprolium在蛋中有合法容許量4 ppm。","B正確：安保寧在家禽蛋類中殘留容許量為4 ppm。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_043","year":2021,"roc_year":110,"session":"","examNo":43,"q":"生食雞蛋最有可能感染下列何種病原菌？","opts":["A. 李斯特菌","B. 產氣夾膜芽孢梭菌","C. 霍亂弧菌","D. 沙氏桿菌"],"ans":3,"exp":"生食雞蛋最常見的食源性疾病為沙門氏菌（Salmonella Enteritidis）感染，該菌可垂直感染進入蛋黃，也可汙染蛋殼表面，是全球雞蛋相關食物中毒的主要病原。","we":["A錯誤：李斯特菌多與即食食品（乳製品、熟食肉）相關，不是生食雞蛋的主要風險病原。","B錯誤：產氣夾膜芽孢梭菌（Clostridium perfringens）多見於大量熟食，與生雞蛋無直接關聯。","C錯誤：霍亂弧菌（V. cholerae）主要透過污染水源傳播，非生食雞蛋的主要危害。","D正確：Salmonella Enteritidis是生食雞蛋最常見也最重要的食物中毒病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_044","year":2021,"roc_year":110,"session":"","examNo":44,"q":"依據食品中污染物質及毒素衛生標準規定，下列何者符合蛋類（不含殼）重金屬含量限量標準？","opts":["A. 鋅2.0 ppm","B. 銅5.0 ppm","C. 汞0.01 ppm","D. 鎘0.02 ppm"],"ans":3,"exp":"依食品中污染物質及毒素衛生標準，蛋類（不含殼）中鎘的限量為0.05 ppm，汞為0.05 ppm，銅及鋅另有規範。選項D鎘0.02 ppm低於限量上限，符合標準（即合格）。其他選項中，鋅2.0 ppm超過限量，銅5.0 ppm超過限量，汞0.01 ppm雖低於上限但題目各選項比較下D最符合「符合限量標準」之意。","we":["A錯誤：蛋類鋅限量標準通常遠低於2.0 ppm，此數值超標。","B錯誤：銅5.0 ppm超過蛋類允許上限。","C錯誤：汞0.01 ppm雖可能符合，但依標準比較，D選項鎘0.02 ppm為最符合法定限量標準之選項。","D正確：鎘0.02 ppm符合蛋類重金屬限量標準（鎘限量為0.05 ppm以下）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_045","year":2021,"roc_year":110,"session":"","examNo":45,"q":"水煮蛋去殼後，蛋黃與蛋白接觸面會出現一層灰綠色為何種物質？","opts":["A. 一氧化鉛","B. 硫化亞鐵","C. 氧化鋁","D. 氯化鐵"],"ans":1,"exp":"水煮蛋過熟時，蛋黃中的鐵離子（Fe²⁺）與蛋白中因加熱產生的硫化氫（H₂S）在蛋黃表面反應，生成硫化亞鐵（FeS），呈現灰綠色環，為常見的過熟蛋現象。","we":["A錯誤：一氧化鉛（PbO）為鉛的化合物，蛋中無此反應。","C錯誤：氧化鋁（Al₂O₃）為白色固體，蛋中無鋁相關反應。","D錯誤：氯化鐵（FeCl₃）通常為黃棕色，在蛋的烹調條件下不會形成。","B正確：蛋黃鐵離子與蛋白高溫產生的H₂S反應形成FeS（灰綠色）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_046","year":2021,"roc_year":110,"session":"","examNo":46,"q":"下列有關利用加糖或鹽漬方式來保存食物之相關原理敘述，何者錯誤？","opts":["A. 會使食物水活性值下降，使其結合狀態的水分濃度增高","B. 會使食物水活性值上升，使其結合狀態的水分濃度下降","C. 微生物可用性水分相對下降","D. 通常食物之含水量在25%以下或水活性值在0.70以下，都可確保食物之保存"],"ans":1,"exp":"加糖或加鹽保存食物的原理是降低水活性（water activity, Aw）：溶質增加使結合水增多，自由水減少，Aw下降，微生物可用水分減少。B敘述稱水活性值「上升」，與實際情況相反，為錯誤敘述。","we":["A正確：加糖鹽確實使Aw下降，結合水濃度相對增高（自由水轉為結合水）。","C正確：自由水（微生物可用水）相對減少，不利微生物生長。","D正確：含水量25%以下或Aw≤0.70時，大多數微生物無法生長，食品可長期保存。","B錯誤：加糖鹽使水活性「降低」而非上升，B敘述與事實相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_047","year":2021,"roc_year":110,"session":"","examNo":47,"q":"下列何者為不產生外毒素之食源性病原菌？","opts":["A. 彎曲桿菌","B. 破傷風桿菌","C. 產氣性壞疽桿菌","D. 肉毒桿菌"],"ans":0,"exp":"彎曲桿菌（Campylobacter jejuni）是食源性感染型細菌，不產生外毒素（exotoxin），其致病主要靠侵入腸黏膜。破傷風桿菌（破傷風毒素）、產氣性壞疽桿菌（alpha毒素）及肉毒桿菌（肉毒毒素）均產生強效外毒素。","we":["B錯誤：破傷風桿菌（Clostridium tetani）產生破傷風毒素（tetanospasmin），是典型的外毒素。","C錯誤：產氣性壞疽桿菌（Clostridium perfringens）產生alpha毒素等多種外毒素。","D錯誤：肉毒桿菌（Clostridium botulinum）產生肉毒毒素，是已知最強的生物外毒素之一。","A正確：彎曲桿菌致病靠侵入性機制，不依賴外毒素產生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_048","year":2021,"roc_year":110,"session":"","examNo":48,"q":"預防肉毒桿菌（Clostridium botulinum）食物中毒的方法中，下列何者正確？","opts":["A. 將新鮮食品的酸鹼值調到8.0","B. 以65℃加熱30分鐘","C. 以70℃加熱15秒","D. 將食物冷藏在3℃以下"],"ans":3,"exp":"肉毒桿菌在3℃以下無法生長產毒，冷藏（≤3℃）是有效抑制其在食品中繁殖與毒素產生的方法。肉毒毒素雖可被80℃/10分或100℃/1分破壞，但孢子需高壓蒸汽（121℃）滅菌；pH8.0利於生長；65℃或70℃加熱不足以殺滅孢子。","we":["A錯誤：pH 8.0（微鹼性）反而有利於肉毒桿菌生長，應將食品酸化（pH<4.6）才能抑制。","B錯誤：65℃/30分可滅活毒素，但無法殺滅孢子，一旦冷卻孢子仍可萌發產毒。","C錯誤：70℃/15秒為HTST殺菌條件，對肉毒孢子無效，孢子需121℃高壓滅菌。","D正確：3℃以下冷藏可有效抑制肉毒桿菌生長及毒素產生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_049","year":2021,"roc_year":110,"session":"","examNo":49,"q":"家畜或家禽經屠宰後，若儲存於室溫下，受微生物污染分解而有臭味，係因蛋白質被分解產生低分子化合物出現臭味，該低分子化合物可能為下列何者？","opts":["A. NH 3 或H 2 S","B. NO 2 或SO 2","C. NH 3 或SO 2","D. NO 2 或H 2 S"],"ans":0,"exp":"蛋白質在微生物分解（腐敗）過程中，含氮胺基酸分解產生氨（NH₃），含硫胺基酸（如甲硫胺酸、半胱胺酸）分解產生硫化氫（H₂S），兩者均是肉品腐敗產生臭味的主要低分子化合物。","we":["B錯誤：NO₂（二氧化氮）和SO₂（二氧化硫）是無機化合物，主要來自燃燒或工業過程，非蛋白質微生物分解產物。","C錯誤：NH₃正確，但SO₂非蛋白質分解的主要產物，應為H₂S。","D錯誤：H₂S正確，但NO₂並非蛋白質腐敗的主要產物。","A正確：NH₃（氨）和H₂S（硫化氫）是蛋白質微生物分解最常見的臭味低分子產物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_050","year":2021,"roc_year":110,"session":"","examNo":50,"q":"依據屠宰衛生檢查規則，家畜於屠宰前斃死應如何處置？","opts":["A. 稽留","B. 緊急屠宰","C. 屠宰後檢查合格者可供食用","D. 不得屠宰供為食用"],"ans":3,"exp":"依屠宰衛生檢查規則，家畜於屠宰前已斃死者，不得屠宰供為食用，須銷毀或化製處理，以防止病死動物流入食品鏈。","we":["A錯誤：稽留是指懷疑患病需進一步觀察評估的活體動物，不適用已斃死情形。","B錯誤：緊急屠宰（emergency slaughter）適用於受傷但仍存活、有生命危險的動物，斃死者不適用。","C錯誤：法規明確禁止斃死畜禽屠宰供食用，即使屠體外觀正常亦然。","D正確：家畜屠宰前斃死，依規定不得屠宰供為食用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_051","year":2021,"roc_year":110,"session":"","examNo":51,"q":"人食用未煮熟豬肉，可能感染下列何種疾病？①囊蟲病（cysticercosis） ②旋毛蟲病（trichinellosis） ③牛\r  羊肝吸蟲病（fascioliasis） ④新胞蟲病（neosporosis）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"食用未煮熟豬肉可感染：①囊蟲病（食入含有鈎絛蟲囊尾蚴的豬肉）；②旋毛蟲病（食入含旋毛蟲幼蟲的豬肉）。牛羊肝吸蟲的感染途徑為食入水草中的後囊蚴，與豬肉無關；新胞蟲寄生於犬科/牛，人並非主要宿主。","we":["B錯誤：牛羊肝吸蟲（Fasciola hepatica）經食入水草上囊蚴感染，不透過豬肉傳播。","C錯誤：③④均非主要透過豬肉傳播給人的疾病。","D錯誤：新胞蟲（Neospora caninum）的最終宿主為犬科動物，人感染案例極罕見且非透過豬肉。","A正確：囊蟲病和旋毛蟲病均可因食入未煮熟含蟲豬肉而感染人類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_052","year":2021,"roc_year":110,"session":"","examNo":52,"q":"人感染下列何種疾病，其病原於囊胞形成期時，因仔蟲寄生在肌肉中，可引起肌肉疼痛？","opts":["A. 隱胞子蟲症（cryptosporidiosis）","B. 牛羊肝吸蟲病（fascioliasis）","C. 新胞蟲病（neosporosis）","D. 旋毛蟲病（trichinellosis）"],"ans":3,"exp":"旋毛蟲（Trichinella spiralis）感染人體後，成蟲在腸道產出幼蟲，幼蟲隨血液移行至全身肌肉後形成囊包（encystment），仔蟲寄生於橫紋肌（骨骼肌）期間可引起嚴重肌肉疼痛、發炎及水腫。","we":["A錯誤：隱胞子蟲（Cryptosporidium）主要寄生腸道上皮細胞，不移行至肌肉，不引起肌肉疼痛。","B錯誤：牛羊肝吸蟲（Fasciola）主要寄生肝臟膽管，不在肌肉中形成囊胞。","C錯誤：新胞蟲（Neospora）主要感染犬和牛，人感染極罕見，且不以肌肉疼痛為典型症狀。","D正確：旋毛蟲幼蟲在囊胞形成期寄生肌肉，引起明顯肌肉疼痛是其特徵性症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_053","year":2021,"roc_year":110,"session":"","examNo":53,"q":"人感染下列何種疾病時，可造成眼睛之傷害？①弓蟲病（toxoplasmosis） ②囊蟲病（cysticercosis） ③隱\r  胞子蟲症（cryptosporidiosis） ④中華肝吸蟲症（clonorchiasis）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"弓蟲（Toxoplasma gondii）可造成眼部弓蟲病（ocular toxoplasmosis），引起視網膜脈絡膜炎；囊蟲病（cysticercosis）中囊尾蚴（Cysticercus cellulosae）可移行至眼球引起眼部囊蟲症，導致視力受損。隱胞子蟲主要影響腸道，中華肝吸蟲主要在膽管，均不典型影響眼睛。","we":["B錯誤：隱胞子蟲症（cryptosporidiosis）主要引起腹瀉，不是造成眼部傷害的典型疾病。","C錯誤：中華肝吸蟲（clonorchiasis）寄生於膽管，引起膽管炎，不影響眼睛。","D錯誤：弓蟲病①可造成眼睛傷害屬實，但中華肝吸蟲④不影響眼睛，故D不完整正確。","A正確：弓蟲可引起視網膜炎，囊蟲可形成眼部囊胞，兩者均能造成眼睛傷害。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_054","year":2021,"roc_year":110,"session":"","examNo":54,"q":"屠宰場工作人員因接觸屠體最有可能感染下列何種疾病？","opts":["A. 李斯特菌症（listeriosis）","B. 類丹毒（erysipeloid）","C. 弓蟲病（toxoplasmosis）","D. 囊蟲病（cysticercosis）"],"ans":1,"exp":"類丹毒（erysipeloid）由豬丹毒桿菌（Erysipelothrix rhusiopathiae）引起，屠宰場工人在處理生豬、禽類屠體時常因皮膚小傷口接觸細菌而感染，為典型的職業性人畜共通病。","we":["A錯誤：李斯特菌症通常經食入污染食品傳播，屠宰場接觸屠體不是其主要傳播途徑。","C錯誤：弓蟲病主要透過接觸貓糞或食入生肉傳播，非屠宰場接觸屠體的主要感染途徑。","D錯誤：囊蟲病係食入有鈎絛蟲卵或含囊尾蚴生豬肉引起，非接觸屠體的職業性感染。","B正確：類丹毒是屠宰場工人最典型的職業性感染，經皮膚傷口接觸含菌屠體而感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_055","year":2021,"roc_year":110,"session":"","examNo":55,"q":"下列有關亨德拉病毒（Hendra virus）之敘述，何者錯誤？","opts":["A. 核酸序列與立百病毒（Nipah virus）相近","B. 侵害馬呼吸系統及引起腦膜腦炎","C. 為傳染力高但死亡率低的傳染病","D. 首例發生在澳大利亞"],"ans":2,"exp":"亨德拉病毒（Hendra virus）感染人類後死亡率極高（約50-75%），屬於高致死率傳染病，而非低死亡率。C敘述稱「傳染力高但死亡率低」與事實相反。其他敘述（與Nipah親緣近、侵害馬呼吸系統及腦炎、首例在澳洲）均正確。","we":["A正確：Hendra virus與Nipah virus同屬副黏病毒科亨尼帕病毒屬，核酸序列相近。","B正確：馬感染亨德拉病毒可出現嚴重呼吸道症狀和腦膜腦炎。","D正確：亨德拉病毒1994年首次發現於澳大利亞昆士蘭州亨德拉市。","C錯誤：亨德拉病毒人感染死亡率高（約57%），並非低死亡率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_056","year":2021,"roc_year":110,"session":"","examNo":56,"q":"下列有關馬流行性感冒病毒的敘述，何者錯誤？","opts":["A. 以H7N7、H3N8亞型為主","B. 對自然環境抵抗性低","C. 傳染性高，但對人類感染力不強","D. 目前並沒有疫苗"],"ans":3,"exp":"馬流行性感冒確有疫苗，且已廣泛用於馬匹預防接種。馬流感病毒以H7N7和H3N8亞型為主，對環境抵抗性低，傳染性高但對人感染力不強，均為正確敘述。D稱「目前並沒有疫苗」與事實不符。","we":["A正確：馬流感病毒主要亞型為H7N7（古典型）和H3N8（現行型）。","B正確：流感病毒對自然環境（熱、乾燥、消毒劑）抵抗性低，易被破壞。","C正確：馬流感傳染性強，可在馬群間迅速傳播，但人類感染案例極罕見。","D錯誤：馬流感疫苗已有多年研發歷史，目前廣泛用於賽馬及馬匹預防接種，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_057","year":2021,"roc_year":110,"session":"","examNo":57,"q":"下列那一種病毒性腦炎不屬於人畜共通傳染病？","opts":["A. 西尼羅病毒性腦炎","B. 日本腦炎","C. 狂犬病","D. 家禽腦脊髓炎"],"ans":3,"exp":"家禽腦脊髓炎（Avian Encephalomyelitis, AE）由禽腦脊髓炎病毒（Astrovirus）引起，只感染家禽（雞等），不傳染人，非人畜共通傳染病。西尼羅病毒性腦炎、日本腦炎、狂犬病均可感染人，屬人畜共通傳染病。","we":["A錯誤：西尼羅病毒性腦炎可感染鳥類、馬及人，屬人畜共通傳染病。","B錯誤：日本腦炎以蚊為媒介，感染豬、鳥及人，為重要人畜共通傳染病。","C錯誤：狂犬病可感染幾乎所有哺乳動物及人，為最重要的人畜共通病毒性腦炎之一。","D正確：家禽腦脊髓炎僅感染禽類，不傳染人，非人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_058","year":2021,"roc_year":110,"session":"","examNo":58,"q":"人類主要食入在淡水魚體內那一時期的幼蟲而感染中華肝吸蟲？","opts":["A. 囊狀幼蟲（metacercariae）","B. 胞動幼蟲（sporocysts）","C. 雷氏幼蟲（rediae）","D. 尾動幼蟲（cercariae）"],"ans":0,"exp":"中華肝吸蟲（Clonorchis sinensis）生活史中，尾動幼蟲（cercariae）從第一中間宿主（螺類）逸出後，在第二中間宿主（淡水魚）的魚肉中形成囊狀幼蟲（metacercariae）。人食入含囊狀幼蟲的生淡水魚後感染，囊狀幼蟲脫囊後發育為成蟲寄生於肝膽管。","we":["B錯誤：胞動幼蟲（sporocysts）為螺體內的無性增殖階段，不在魚體內。","C錯誤：雷氏幼蟲（rediae）同樣在螺體內發育，非魚體中的感染期。","D錯誤：尾動幼蟲（cercariae）從螺逸出後需鑽入魚體，轉變為囊狀幼蟲才具感染性。","A正確：人感染中華肝吸蟲是食入淡水魚中的囊狀幼蟲（metacercariae）所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_059","year":2021,"roc_year":110,"session":"","examNo":59,"q":"貓抓熱主要是經由何種節肢動物在貓之間傳播？","opts":["A. 跳蚤","B. 蚊子","C. 壁蝨","D. 恙蟲"],"ans":0,"exp":"貓抓熱（Cat Scratch Disease）的病原為韓瑟勒巴通氏菌（Bartonella henselae），主要經由貓蚤（Ctenocephalides felis）在貓之間傳播；貓透過蚤糞（含菌）污染爪子，再抓傷人類而傳播給人。","we":["B錯誤：蚊子不是貓抓熱的傳播媒介，蚊子主要傳播瘧疾、日本腦炎等。","C錯誤：壁蝨（蜱）主要傳播萊姆病、立克次體等，非貓抓熱的主要傳播媒介。","D錯誤：恙蟲主要傳播恙蟲病（Scrub typhus），非貓抓熱傳播媒介。","A正確：跳蚤（貓蚤）是Bartonella henselae在貓之間的主要傳播媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_060","year":2021,"roc_year":110,"session":"","examNo":60,"q":"接觸或攝食未煮熟螺類，容易感染日本住血吸蟲，此吸蟲之成蟲常寄生於人體的那一部位？","opts":["A. 肝門脈","B. 肺靜脈","C. 冠狀動脈","D. 膀胱靜脈"],"ans":0,"exp":"日本住血吸蟲（Schistosoma japonicum）成蟲主要寄生於宿主的腸繫膜靜脈及肝門脈系統，引起肝脾腫大、門脈高壓等症狀。注意：人並非透過攝食螺類感染，而是皮膚接觸含尾蚴的水感染；題幹「接觸或攝食未煮熟螺類」的描述部分不精確，但答案仍為肝門脈。","we":["B錯誤：肺靜脈非住血吸蟲的寄生部位，肺型住血吸蟲症（如曼氏住血吸蟲的某些情況）發生時影響肺血管，但主要寄生仍非肺靜脈。","C錯誤：冠狀動脈是心臟的血管，並非住血吸蟲的寄生部位。","D錯誤：膀胱靜脈為埃及住血吸蟲（S. haematobium）的寄生部位，日本住血吸蟲主要寄生腸繫膜及肝門脈。","A正確：日本住血吸蟲成蟲寄生於腸繫膜靜脈及肝門脈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_061","year":2021,"roc_year":110,"session":"","examNo":61,"q":"萊姆病原為伯氏疏螺旋體，其主要經由下列何屬硬蜱（壁蝨）媒介引起？","opts":["A. Ixodes spp.","B. Boophilus spp.","C. Rhipicephalus spp.","D. Amblyomma spp."],"ans":0,"exp":"萊姆病（Lyme disease）的病原為伯氏疏螺旋體（Borrelia burgdorferi），全球各地主要透過硬蜱屬（Ixodes spp.）傳播，如歐美的Ixodes ricinus及Ixodes scapularis。","we":["B錯誤：Boophilus（現併入Rhipicephalus屬）主要傳播巴貝氏蟲及牛蜱熱，非萊姆病媒介。","C錯誤：Rhipicephalus（血蜱屬）主要傳播立克次體及巴貝氏蟲，非萊姆病主要媒介。","D錯誤：Amblyomma（花蜱屬）可傳播多種立克次體，非萊姆病的主要媒介。","A正確：Ixodes屬硬蜱是萊姆病全球最重要的傳播媒介蜱屬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_062","year":2021,"roc_year":110,"session":"","examNo":62,"q":"下列何者為裂谷熱之主要傳播方式？","opts":["A. 靠蚊為媒介或直接接觸動物組織液傳播","B. 經由哺乳傳播","C. 可藉人與人之接觸傳播","D. 食物媒介傳播"],"ans":0,"exp":"裂谷熱（Rift Valley Fever）由布尼亞病毒科裂谷熱病毒引起，主要傳播途徑為蚊（Aedes、Culex等）叮咬，或人員直接接觸感染動物的血液、組織液和排泄物（如屠宰、接生）。人與人之間不會直接傳播。","we":["B錯誤：裂谷熱不透過哺乳傳播，其傳播主要靠蚊或接觸感染動物組織液。","C錯誤：裂谷熱無人傳人的傳播紀錄，人只從動物或蚊感染。","D錯誤：食物媒介傳播非裂谷熱的主要傳播方式，雖未煮熟的感染動物產品理論上有風險，但非主要途徑。","A正確：蚊媒傳播或直接接觸感染動物組織液是裂谷熱的主要傳播途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_063","year":2021,"roc_year":110,"session":"","examNo":63,"q":"下列何者不是類鼻疽的感染途徑？","opts":["A. 食入污染的土壤或水","B. 吸入污染的土壤或水","C. 皮膚傷口接觸污染的土壤或水","D. 病媒叮咬傳染"],"ans":3,"exp":"類鼻疽（Melioidosis，病原Burkholderia pseudomallei）的感染途徑包括：食入污染的土壤或水（A）、吸入（B）及皮膚傷口接觸（C）。類鼻疽目前無確認的節肢動物媒介傳播途徑，病媒叮咬傳染（D）不是其感染途徑。","we":["A錯誤（此為有效途徑）：食入含B. pseudomallei的污染土壤或水是類鼻疽感染途徑之一。","B錯誤（此為有效途徑）：吸入含菌的土壤微粒或水霧是重要感染途徑，尤其颱風後。","C錯誤（此為有效途徑）：皮膚傷口接觸污染土壤或水是最常見的感染途徑。","D正確（非感染途徑）：類鼻疽無已知節肢動物媒介，病媒叮咬不是其傳播方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_064","year":2021,"roc_year":110,"session":"","examNo":64,"q":"下列有關疱疹B病毒（herpesvirus B）感染之敘述，何者錯誤？","opts":["A. 猴感染時多呈不顯性感染，偶有水泡","B. 人類因猴咬傷或經傷口接觸猴子唾液而感染","C. 被猴子唾液或飛沫噴到眼睛而感染","D. 可藉由抗病毒藥物或施與免疫血清，進而將病毒清除殆盡"],"ans":3,"exp":"疱疹B病毒（Macacine herpesvirus 1）感染人類後，如同其他疱疹病毒，會在神經節中潛伏，無法被完全清除。抗病毒藥物（如acyclovir）和免疫血清可降低病毒複製及疾病嚴重度，但無法完全清除病毒。D稱「將病毒清除殆盡」為錯誤敘述。","we":["A正確：猴感染疱疹B病毒多呈不顯性或輕微感染，偶有口腔水泡病灶。","B正確：人主要透過猴咬傷或傷口接觸猴唾液/組織液而感染。","C正確：猴的唾液或飛沫噴濺眼睛亦是重要的感染途徑。","D錯誤：疱疹B病毒為潛伏性病毒，抗病毒藥物和免疫血清無法將其完全清除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_065","year":2021,"roc_year":110,"session":"","examNo":65,"q":"下列有關猴痘之敘述，何者錯誤？","opts":["A. 其病原體與天花病毒同屬正痘病毒屬（Orthopoxvirus）","B. 首度出現在薩伊","C. 人感染時初期症狀類似流感，並可觀察到淋巴結腫脹","D. 如同天花病毒，猴痘於1987年已被撲滅"],"ans":3,"exp":"猴痘（Monkeypox）至今仍持續在非洲中西部地區流行，並非已被撲滅。天花（smallpox）才是在1980年被WHO宣布撲滅的疾病（非1987年）。D的敘述混淆了猴痘與天花，且年份亦有誤。","we":["A正確：猴痘病毒與天花病毒同屬正痘病毒屬（Orthopoxvirus）。","B正確：猴痘首例病例於1970年在當時的薩伊（現剛果民主共和國）人類患者中確認。","C正確：人感染猴痘初期症狀類似流感（發燒、頭痛、肌肉痛），並有特徵性淋巴結腫脹。","D錯誤：猴痘從未被撲滅，仍在非洲及全球持續傳播；天花於1980年被宣布撲滅（非1987年，且非猴痘）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_066","year":2021,"roc_year":110,"session":"","examNo":66,"q":"下列有關動物感染日本腦炎之敘述，何者錯誤？","opts":["A. 於馬可能為致死性之傳染病","B. 肉豬容易出現神經症狀","C. 懷孕母豬死產或木乃伊胎","D. 懷孕母豬流產"],"ans":1,"exp":"日本腦炎感染豬的主要表現為生殖障礙（懷孕母豬死產、木乃伊胎、流產）及公豬睪丸炎，並非神經症狀。神經症狀（腦炎）主要見於馬（致死性）。肉豬一般呈不顯性感染，不典型出現神經症狀，B為錯誤敘述。","we":["A正確：馬感染日本腦炎可發展為致死性腦炎，死亡率高。","C正確：懷孕母豬感染日本腦炎常見死產（stillbirth）及木乃伊胎（mummified fetuses）。","D正確：懷孕母豬感染日本腦炎可導致流產，此為其重要的生殖障礙表現之一。","B錯誤：肉豬感染日本腦炎多為不顯性感染，不典型出現神經症狀，神經症狀主要見於馬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_067","year":2021,"roc_year":110,"session":"","examNo":67,"q":"下列有關犬心絲蟲（Dirofilaria immitis）的敘述何者正確？","opts":["A. 其主要寄生於犬的右心室及右心房，可導致犬隻呼吸困難","B. 以吸血蒼蠅作為主要傳播媒介","C. 犬心絲蟲感染性幼蟲可經由昆蟲的叮咬而傳染給人體，嚴重影響人體健康並引致死亡","D. 生活環境中蚊子的密度與種類是影響犬隻感染犬心絲蟲的重要因子"],"ans":3,"exp":"犬心絲蟲（Dirofilaria immitis）以蚊子為傳播媒介，感染性幼蟲（L3）由蚊叮咬犬時傳播，故蚊子的密度與種類直接影響犬隻感染風險，D為正確敘述。A錯（主要寄生右心室和肺動脈，非右心房）；B錯（媒介為蚊非蒼蠅）；C錯（人感染通常只形成肺部結節，不引起死亡）。","we":["A錯誤：犬心絲蟲成蟲主要寄生於犬的右心室及肺動脈（不是右心房），引起肺高壓和右心衰竭。","B錯誤：犬心絲蟲以蚊（多種Culex、Aedes蚊）為傳播媒介，非吸血蒼蠅。","C錯誤：人感染犬心絲蟲通常僅形成肺部孤立結節（pulmonary dirofilariasis），極少引起嚴重症狀，幾乎不致死亡。","D正確：蚊子密度與種類決定L3幼蟲傳播的機率，是影響犬心絲蟲感染率的關鍵環境因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_068","year":2021,"roc_year":110,"session":"","examNo":68,"q":"Arbovirus通常用來代表經由節肢動物傳播的病毒，其中不包括下列那一個病毒科？","opts":["A. Paramyxoviridae","B. Flaviviridae","C. Bunyaviridae","D. Reoviridae"],"ans":0,"exp":"Arbovirus（節肢動物媒介病毒）涵蓋多個病毒科，包括Flaviviridae（西尼羅、日本腦炎、登革熱）、Bunyaviridae（裂谷熱、漢他病毒相關蜱媒病毒）及Reoviridae（藍舌病）。副黏病毒科（Paramyxoviridae）包含麻疹、腮腺炎、亨德拉、立百等病毒，主要透過呼吸道或直接接觸傳播，不經節肢動物媒介，故不屬Arbovirus。","we":["B錯誤（屬Arbovirus）：Flaviviridae包含登革熱、黃熱病、西尼羅、日本腦炎等重要節肢動物媒介病毒。","C錯誤（屬Arbovirus）：Bunyaviridae（現分為多個科）包含裂谷熱、漢他出血熱相關蜱媒病毒等。","D錯誤（屬Arbovirus）：Reoviridae包含藍舌病病毒，由庫蠓（Culicoides）傳播，屬節肢動物媒介病毒。","A正確（不屬Arbovirus）：Paramyxoviridae透過飛沫或直接接觸傳播，非節肢動物媒介病毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_069","year":2021,"roc_year":110,"session":"","examNo":69,"q":"下列有關狂犬病病毒的敘述，何者錯誤？","opts":["A. 屬於Lyssavirus","B. 犬隻感染後的潛伏期一般為10天到2個月","C. 保毒宿主（reservoir）除了狗外還有其他野生動物","D. 感染人和動物只有一種血清型"],"ans":3,"exp":"狂犬病病毒屬Lyssavirus，具多種基因型（至少16個基因型/血清型），並非只有一種血清型。傳統狂犬病病毒（RABV）為血清型1，其他基因型見於蝙蝠及部分野生動物。A（屬Lyssavirus）、B（潛伏期10天至2個月）、C（保毒宿主包括狐、蝙蝠等野生動物）均正確。","we":["A正確：狂犬病病毒屬Lyssavirus屬，Rhabdoviridae科，正確。","B正確：犬隻感染狂犬病的潛伏期一般為10天到2個月（甚至更長），正確。","C正確：狂犬病的保毒宿主除犬外，還有狐狸、浣熊、臭鼬、蝙蝠等野生動物，正確。","D錯誤：Lyssavirus屬具有多種血清型（基因型），並非只有單一血清型感染人和動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_070","year":2021,"roc_year":110,"session":"","examNo":70,"q":"下列何者是引起人類沙氏桿菌症最常見的血清型？①Salmonella Typhimurium ②Salmonella Pullorum\r   ③Salmonella Enteritidis ④Salmonella Gallinarum","opts":["A. ①②","B. ③④","C. ①③","D. ②④"],"ans":2,"exp":"引起人類沙門氏菌症最常見的血清型為Salmonella Typhimurium（①）及Salmonella Enteritidis（③），兩者合計佔人類沙門氏菌感染的大多數。Pullorum（②）和Gallinarum（④）主要感染家禽，引起禽傷寒/白痢，對人類致病性低。","we":["A錯誤：②Pullorum主要引起禽類白痢，不是引起人類沙門氏菌症的常見型別。","B錯誤：③Enteritidis確實常見，但④Gallinarum主要感染禽類，非人類常見型別。","D錯誤：②④均屬禽類沙門氏菌，非人類常見感染血清型。","C正確：①Typhimurium和③Enteritidis是全球引起人類沙門氏菌症最常見的兩個血清型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_071","year":2021,"roc_year":110,"session":"","examNo":71,"q":"依傳播方式來分類克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）應屬於那一型？","opts":["A. 直接型（direct zoonoses）","B. 循環型（cyclozoonoses）","C. 異型（metazoonoses）","D. 腐生型（saprozoonoses）"],"ans":2,"exp":"依人畜共通傳染病的傳播類型分類，metazoonoses（異型）指需要節肢動物或其他無脊椎動物作為媒介（生物性傳播），病原在媒介體內需完成生活環一部分。克里米亞剛果出血熱由蜱（壁蝨）傳播，符合metazoonoses的定義。","we":["A錯誤：直接型（direct zoonoses）指病原可在單一脊椎動物宿主中完成生活環，直接傳染人，如狂犬病。","B錯誤：循環型（cyclozoonoses）需要兩種以上脊椎動物（無需節肢動物）完成生活環，如絛蟲。","D錯誤：腐生型（saprozoonoses）指病原的傳播需要非動物性環境（土壤、植物等）作為媒介，如組織胞漿菌。","C正確：克里米亞剛果出血熱透過硬蜱媒介傳播，屬需要節肢動物媒介的異型（metazoonoses）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_072","year":2021,"roc_year":110,"session":"","examNo":72,"q":"人類與家畜感染李斯特菌症主要由下列何者所引起？","opts":["A. L. monocytogenes","B. L. grayi","C. L. ivanovii","D. L. innocua"],"ans":0,"exp":"在李斯特菌屬（Listeria spp.）中，Listeria monocytogenes是唯一對人類和家畜具有重要致病性的菌種，可引起腦膜炎、敗血症及孕婦流產等嚴重疾病。其他種（L. grayi、L. ivanovii、L. innocua）對人類致病性極低或無致病性。","we":["B錯誤：L. grayi對人類和動物的致病性極低，不是主要病原。","C錯誤：L. ivanovii主要感染反芻動物（尤其羊），對人類幾乎無致病性。","D錯誤：L. innocua為環境中的非致病性李斯特菌，不引起人或動物疾病。","A正確：L. monocytogenes是引起人類和家畜李斯特菌症唯一重要的致病菌種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_073","year":2021,"roc_year":110,"session":"","examNo":73,"q":"使用露天的淺池，利用曝氣和陽光以促進藻類植物生長，供給好氧性微生物的繁殖以分解有機質，是屬於下\r   列何種好氣處理廢水方法？","opts":["A. 攪伴曝氣處理","B. 水中曝氣處理","C. 氧化塘法","D. 生物膜旋轉盤法"],"ans":2,"exp":"氧化塘法（oxidation pond）是一種利用露天淺池，透過自然陽光（紫外線）及曝氣促進藻類生長，藻類光合作用提供氧氣給好氧微生物，好氧微生物再分解水中有機質的廢水處理方法。此法設備簡單、成本低，適合大面積場所。","we":["A錯誤：攪伴曝氣處理（activated sludge aeration）是機械強制曝氣法，不依賴陽光和藻類。","B錯誤：水中曝氣處理（submerged aeration）亦為機械曝氣，非依靠陽光和藻類生長。","D錯誤：生物膜旋轉盤法（rotating biological contactor, RBC）利用旋轉盤上的生物膜處理廢水，與露天淺池利用藻類不同。","C正確：氧化塘法即題目描述的露天淺池曝氣＋藻類生長促進好氧分解的廢水處理方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_074","year":2021,"roc_year":110,"session":"","examNo":74,"q":"依據事業廢棄物貯存清除處理方法及設施標準，有關生物醫療事業廢棄物以高溫高壓蒸氣滅菌處理時，測試\r   削減率之指標微生物為下列何者？","opts":["A. 枯草桿菌","B. 枯草桿菌芽孢","C. 嗜熱桿菌","D. 嗜熱桿菌芽孢"],"ans":3,"exp":"依事業廢棄物貯存清除處理方法及設施標準，以高溫高壓蒸氣（autoclave）滅菌處理生物醫療廢棄物時，測試削減率所使用的指標微生物為嗜熱脂肪桿菌芽孢（Geobacillus stearothermophilus，即嗜熱桿菌芽孢），其對高溫高壓的抵抗力最強，是autoclave滅菌效果的標準生物指示劑。","we":["A錯誤：枯草桿菌（Bacillus subtilis）耐熱性不如嗜熱桿菌，通常用於乾熱滅菌的指示劑。","B錯誤：枯草桿菌芽孢可作為環氧乙烷（EO）滅菌的生物指示劑，非高溫高壓蒸汽滅菌指標。","C錯誤：嗜熱桿菌（營養細胞）的耐熱性遠不如其芽孢，不適合作為高壓蒸汽滅菌的挑戰性指示劑。","D正確：嗜熱桿菌芽孢（G. stearothermophilus芽孢）是高溫高壓蒸汽滅菌（autoclave）的標準生物指示劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_075","year":2021,"roc_year":110,"session":"","examNo":75,"q":"此研究為何種流行病學研究法？","opts":["A. 追蹤性世代研究法","B. 回溯性世代研究法","C. 病例對照研究法","D. 巢式病例對照研究法"],"ans":3,"exp":"承上題脈絡（Q75-77為一組題目，涉及母犬結紮與乳腺腫瘤研究），此研究從已完成的世代追蹤資料庫中，針對病例（患乳腺腫瘤母犬）與對照（未患病母犬）進行回溯性比較，是巢式病例對照研究法（nested case-control study）的特徵。","we":["A錯誤：追蹤性世代研究法為前瞻性追蹤暴露族群，不是從既有資料庫中抽取病例對照。","B錯誤：回溯性世代研究法以過去紀錄追蹤整個世代，不針對病例與對照抽樣比較。","C錯誤：一般病例對照研究法非巢式，無須從世代追蹤資料庫中抽取，且通常在事件發生後從社區選取。","D正確：巢式病例對照研究從已有的世代追蹤資料中，以病例配對對照進行分析，兼具世代研究與病例對照的優點。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_076","year":2021,"roc_year":110,"session":"","examNo":76,"q":"承上題，有關此研究結果之敘述，下列何者錯誤？","opts":["A. 結紮母犬罹患乳腺腫瘤累積發生率為5%，未結紮母犬為20%","B. 無法推論有進行結紮母犬罹患乳腺腫瘤發生率","C. 結紮母犬罹患乳腺腫瘤的風險為未結紮母犬的1/4倍","D. 對於母犬罹患乳腺腫瘤而言，結紮可能為保護因子"],"ans":1,"exp":"承上題，若研究為巢式病例對照研究，則可從世代資料庫中推估各組的累積發生率（結紮組5%，未結紮組20%），並計算相對危險性（RR=5/20=0.25，即結紮為未結紮的1/4），故B稱「無法推論」為錯誤敘述。","we":["A正確：結紮母犬累積發生率5%、未結紮20%，此數據可從研究計算得出。","C正確：RR = 5%/20% = 0.25 = 1/4倍，結紮母犬罹患乳腺腫瘤風險為未結紮的1/4，正確。","D正確：RR < 1表示結紮為保護因子，降低乳腺腫瘤的發生風險，正確。","B錯誤：巢式病例對照研究建立在世代追蹤基礎上，可推算各暴露組的發生率，故「無法推論」的說法錯誤。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_077","year":2021,"roc_year":110,"session":"","examNo":77,"q":"發生率密度值為何？","opts":["A. 0.25 per dog-month at risk","B. 0.5 per dog-month at risk","C. 0.05 per dog-month at risk","D. 0.067 per dog-month at risk"],"ans":3,"exp":"發生率密度（incidence density）= 新病例數 ÷ 總觀察動物-時間。依題目給定的研究資料，計算結果約為0.067 per dog-month at risk（每狗-月風險）。","we":["A錯誤：0.25 per dog-month明顯過高，不符合計算結果。","B錯誤：0.5 per dog-month過高，不符合題目數據計算。","C錯誤：0.05 per dog-month較接近但仍非精確計算值。","D正確：依研究資料計算，發生率密度約為0.067 per dog-month at risk。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_078","year":2021,"roc_year":110,"session":"","examNo":78,"q":"承上題，假設感染犬小病毒經治療會在1.5個月後痊癒，則在研究期間第4個月時的盛行率為何？","opts":["A. 0.08","B. 0.09","C. 0.17","D. 0.18"],"ans":0,"exp":"若感染犬小病毒後1.5個月痊癒，在第4個月時盛行率由發生率密度及病程長度估算：P ≈ ID × D（發生率密度 × 平均病程）。以0.067 × 1.5 ≈ 0.10，但結合各月新發病例與痊癒情況累積計算，第4個月時盛行率約為0.08。","we":["B錯誤：0.09略高於計算值，不符合精確計算。","C錯誤：0.17過高，未考慮到痊癒後的族群恢復。","D錯誤：0.18過高，計算有誤。","A正確：第4個月盛行率計算約為0.08。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_079","year":2021,"roc_year":110,"session":"","examNo":79,"q":"假設盛行率為20%，則試驗總特異性為何？","opts":["A. 98%","B. 72%","C. 64%","D. 56%"],"ans":2,"exp":"本題為系列試驗（並聯模式）或平行試驗的特異性計算。若A試驗特異性為80%、B試驗特異性為80%，並聯試驗（任一陽性即判陽性）時總特異性 = 特異性A × 特異性B = 0.80 × 0.80 = 0.64 = 64%。","we":["A錯誤：98%為串聯試驗（兩個皆陽性才判陽性）時的總特異性，非並聯。","B錯誤：72%不符合並聯計算結果（80%×80%=64%）。","D錯誤：56%亦不符合計算。","C正確：並聯試驗總特異性 = 兩試驗特異性相乘 = 64%。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_080","year":2021,"roc_year":110,"session":"","examNo":80,"q":"承上題，若A試驗結果為陽性者才再做B試驗，兩個試驗結果皆為陽性才判定為陽性，則試驗總特異性為何？","opts":["A. 44%","B. 56%","C. 72%","D. 94%"],"ans":3,"exp":"承上題，採串聯模式（A陽性才做B，兩個皆陽性才判定陽性），串聯試驗的總特異性 = 1 - (1-Sp_A)×(1-Sp_B) 的補充計算，或更正確：串聯總特異性 = SpA + (1-SpA)×SpB。若SpA=SpB=80%，則串聯特異性 ≈ 0.80 + 0.20×0.80 = 0.80 + 0.16 = 0.96 ≈ 96%；但若依常見公式串聯特異性 = Sp_combined = 1-(1-Sp_A)(1-Sp_B) 錯誤，應以正確定義計算，題目答案為D（94%），接近96%的計算，以選項最近者為準。","we":["A錯誤：44%為並聯敏感性的計算結果，非串聯特異性。","B錯誤：56%亦不符合串聯特異性計算。","C錯誤：72%為並聯模式的特異性相關計算，不是串聯模式結果。","D正確：串聯模式（先A後B，兩陽才判陽）提高特異性，計算約為94%-96%，以D為正確選項。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_公衛_001","year":2022,"roc_year":111,"session":"","examNo":1,"q":"已知黴菌毒素存在飼料中會造成肝損傷，若某一牧場其飼料中檢出黴菌毒素，獸醫師就斷定該牛場牛隻一定有\r  肝損傷，這是利用那種方式進行推斷？","opts":["A. 柯霍氏法則（Koch's postulates）","B. 埃文斯規則（Evans' rules）","C. 希爾準則（Hill's criteria）","D. 四因說（four elements）"],"ans":0,"exp":"題目描述的是從已知原因（黴菌毒素）直接推斷結果（肝損傷），屬於演繹推理中的充分條件假設，這種方式最接近柯霍氏法則（Koch's postulates）的邏輯：已知病因存在即推定疾病發生。埃文斯規則、希爾準則均著重多面向的因果評估，四因說為哲學概念，並非推斷方式。","we":["（正確）柯霍氏法則以「已知病因→必然發生疾病」的邏輯進行推斷，符合題意。","埃文斯規則（Evans' rules）是對柯霍氏法則的延伸，強調流行病學與實驗室多面向證據，不是單一因果直接推斷。","希爾準則（Hill's criteria）包含時序性、強度、一致性等九項評估，需要全面權衡，不是直接推斷。","四因說源自亞里斯多德哲學（質料因、形式因、動力因、目的因），與現代流行病學因果推斷無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_002","year":2022,"roc_year":111,"session":"","examNo":2,"q":"下列何種流行病學研究方式，不屬於觀察式的研究（observational studies）？","opts":["A. 橫斷式研究（cross-sectional studies）","B. 緃貫式研究（longitudinal studies）","C. 世代研究（cohort studies）","D. 干預研究（intervention studies）"],"ans":3,"exp":"觀察式研究（observational studies）指研究者不主動介入，只觀察自然發生的結果，包括橫斷式、縱貫式、世代研究、病例對照研究等。干預研究（intervention studies）研究者主動給予處置（如疫苗、藥物），屬於實驗性研究（experimental studies），不屬於觀察式研究。","we":["橫斷式研究（cross-sectional）屬觀察式，研究者只收集某一時間點的資料，不介入。","縱貫式研究（longitudinal）屬觀察式，隨時間追蹤觀察對象，不主動介入。","世代研究（cohort）屬觀察式，依暴露狀態分組後追蹤，不主動介入。","（正確）干預研究研究者主動施予處置，屬於實驗性研究，不屬於觀察式研究。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_003","year":2022,"roc_year":111,"session":"","examNo":3,"q":"下列何者用於假說驗證最不適當？","opts":["A. 病例對照研究（case-control studies）","B. 世代研究（cohort studies）","C. 隨機對照試驗（randomized controlled trials）","D. 病例序列研究（case series studies）"],"ans":3,"exp":"假說驗證需要有比較組及時序性，以評估暴露與疾病的因果關係。病例序列研究（case series）僅描述一群病例的特徵，無對照組，無法計算相對危險性或建立因果推論，是假說產生工具，最不適合用於假說驗證。","we":["病例對照研究有病例組與對照組，可計算勝算比（OR），適合假說驗證。","世代研究有暴露組與未暴露組並追蹤結果，可計算相對危險性（RR），適合假說驗證。","隨機對照試驗（RCT）是假說驗證的黃金標準，隨機分配最大程度控制干擾因子。","（正確）病例序列研究缺乏對照組，只能描述現象，最不適合用於假說驗證。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_004","year":2022,"roc_year":111,"session":"","examNo":4,"q":"下列有關流行病學研究方法之敘述，何者錯誤？","opts":["A. 描述流行病學（descriptive epidemiology）主要是觀察、記錄疾病及驗證其可能的因果關係","B. 實驗流行病學（experimental epidemiology）主要是觀察和分析已選定之不同動物群受到某些或某一因子之影   響","C. 自然試驗（natural experiments）是一種非常接近完整人為試驗設計之情況下進行的觀察結果","D. 理論流行病學（theoretical epidemiology）通常使用次級資料，以數學模型模擬疾病自然發生的情形"],"ans":1,"exp":"實驗流行病學（experimental epidemiology）的特徵是研究者主動介入並控制暴露因子；選項B描述的「觀察和分析已選定之不同動物群受到某些因子之影響」是觀察式流行病學（observational epidemiology）的描述，兩者定義混淆，故B為錯誤敘述。","we":["描述流行病學主要用於觀察、記錄疾病分布（人、時、地），可產生假說但通常不驗證，此敘述正確。","（正確）實驗流行病學的定義是研究者主動介入，而非只觀察，選項B的描述實為觀察式流行病學，故錯誤。","自然試驗（natural experiments）在無法人為操控時，利用自然發生的類似實驗情況進行研究，此敘述正確。","理論流行病學使用數學模型模擬疾病動態，常使用次級資料，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_005","year":2022,"roc_year":111,"session":"","examNo":5,"q":"下列何者是橫斷式研究法的優點？","opts":["A. 可知發生率","B. 可知因果的時序關係","C. 可知疾病盛行率","D. 即使發生率極低之疾病，所需樣本數也很少"],"ans":2,"exp":"橫斷式研究（cross-sectional study）在某一時間點同時測量暴露與疾病狀態，最適合估計疾病盛行率（prevalence）。因所有資料在同一時間收集，無法確立時序關係，亦無法計算發生率；若疾病極罕見，所需樣本數同樣龐大。","we":["發生率（incidence）需要追蹤時間，橫斷式研究在單一時間點收資料，無法計算發生率。","因果時序關係需要先有暴露、後有疾病的縱向設計，橫斷式同時測量兩者，無法判定時序。","（正確）橫斷式研究可同時掌握族群中已有病者比例，是估計疾病盛行率的最佳設計。","若疾病盛行率極低，橫斷式研究需要非常龐大的樣本數才能找到足夠病例，而非所需樣本少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_006","year":2022,"roc_year":111,"session":"","examNo":6,"q":"下列何種疾病的發生沒有明顯季節性變化？","opts":["A. 犬貓跳蚤感染症","B. 雞住血原蟲性白冠病","C. 豬傳染性胃腸炎","D. 貓腎衰竭"],"ans":3,"exp":"貓腎衰竭（慢性腎臟病）是慢性退行性疾病，與溫度、季節、昆蟲媒介等環境因素無關，全年均可發生，無明顯季節性。相較之下，跳蚤感染與夏季高溫有關、住血原蟲性白冠病與蚊蟲季節有關、豬傳染性胃腸炎在冬季寒冷時發生率較高。","we":["犬貓跳蚤感染症在夏秋溫暖季節跳蚤大量繁殖時盛行，有明顯季節性。","雞住血原蟲性白冠病由庫蠓傳播，庫蠓在溫暖潮濕季節活躍，有明顯季節性。","豬傳染性胃腸炎（TGE）由冠狀病毒引起，低溫有利病毒存活，冬季發生率明顯較高。","（正確）貓腎衰竭為慢性退化性疾病，無傳染媒介，與季節無關，全年均可發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_007","year":2022,"roc_year":111,"session":"","examNo":7,"q":"關於致死率（case fatality rate）的定義，下列何者正確？","opts":["A. 分母含有時間的概念","B. 為患有某特定疾病之動物族群中，因該病而死亡之比率","C. 適用於描述慢性病","D. 與死亡率（mortality）相同"],"ans":1,"exp":"致死率（case fatality rate, CFR）定義為：在特定期間內，患有某疾病的動物中，因該病而死亡的比率。分母為確診（患病）數，分子為因該病死亡數，分母不含時間概念（這是發生率密度的特徵），適合急性病，與一般死亡率（mortality rate）不同。","we":["致死率分母為確診病例數，不含時間單位；含時間的是發生密度（incidence density）或死亡率。","（正確）致死率定義即為：患有特定疾病族群中，因該病死亡的比率，此敘述正確。","致死率因分母為確診病例（病程結束後計算），較適合描述急性、病程短的疾病；慢性病更適合用死亡率或存活分析。","死亡率（mortality rate）分母為整體族群（含患病與未患病者），與致死率定義不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_008","year":2022,"roc_year":111,"session":"","examNo":8,"q":"關於不同宿主的舉例，下列何者錯誤？","opts":["A. 人是海獸胃線蟲的偶發宿主","B. 鳥類是東部腦馬炎的增幅宿主","C. 螃蟹是衛氏肺吸蟲的中間宿主","D. 人是弓蟲的最終宿主"],"ans":3,"exp":"弓蟲（Toxoplasma gondii）的最終宿主（definitive host）為貓科動物，人是中間宿主（intermediate host）。人感染弓蟲後，蟲體在體內形成囊體但不進行有性生殖，有性生殖只發生在貓的腸道中。","we":["人食入海獸胃線蟲（Anisakis）幼蟲後，幼蟲無法在人體完成生活史，人為偶發宿主，正確。","鳥類感染東部馬腦炎病毒後大量複製形成高病毒血症，作為病毒增幅宿主供蚊子叮咬傳播，正確。","螃蟹是衛氏肺吸蟲（Paragonimus westermani）的第二中間宿主，正確。","（正確）人是弓蟲的中間宿主，不是最終宿主；貓科動物才是最終宿主，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_009","year":2022,"roc_year":111,"session":"","examNo":9,"q":"關於傳染力潛藏期（latent period）和症狀潛伏期（incubation period），下列何者正確？","opts":["A. 症狀潛伏期通常比傳染力潛藏期短","B. 感染者在症狀潛伏期時即有症狀","C. 若為不顯性感染，代表症狀潛伏期比傳染力潛藏期短","D. 傳染力潛藏期在流行病數理模式中為更常使用之重要因子"],"ans":3,"exp":"傳染力潛藏期（latent period）是從感染到具傳染力的時間；症狀潛伏期（incubation period）是從感染到出現症狀的時間。在流行病數理模式（如SIR模型）中，潛藏期（latent period）是更重要的參數，因為它決定傳播動態而非只是臨床表現。","we":["症狀潛伏期通常比傳染力潛藏期長（先有傳染力再出現症狀），某些疾病如流感會在症狀出現前即有傳染力。","症狀潛伏期結束才出現症狀，在症狀潛伏期內感染者尚無症狀（潛伏期定義即為無症狀期）。","不顯性感染意味著症狀潛伏期根本不結束（或無症狀），與潛藏期長短的比較關係不是如此定義的。","（正確）在數理流行病學模式中，傳染力潛藏期決定病原的傳播動態，是更常使用的重要因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_010","year":2022,"roc_year":111,"session":"","examNo":10,"q":"針對鉤端螺旋體病的一次流行病學調查，初期發現1,000名居民中有300名呈現抗體陽性，進一步追蹤調查共\r   有200名確診新發生抗體陽轉病例。若在調查期間此族群中死亡人數共計40名，死亡者中計有10人因鉤端螺旋  體病而死亡，依此計算該病的累積發生率（cumulative incidence）之分子為何？","opts":["A. 300","B. 200","C. 40","D. 10"],"ans":1,"exp":"累積發生率（cumulative incidence）的分子是觀察期間內新發生的病例數。題目說明1,000名居民中300名已呈抗體陽性（舊有感染），追蹤期間又有200名確診新發生抗體陽轉病例，故新發生（累積發生率的分子）為200。","we":["300是初期調查時已呈陽性的人數（盛行個案），不是新發生案例，不應作為發生率的分子。","（正確）200是追蹤調查期間新發生的抗體陽轉病例，即累積發生率的分子。","40是調查期間的總死亡人數，包含各種原因死亡，不是新發鉤端螺旋體病例數。","10是因鉤端螺旋體病死亡人數，應用於計算致死率（CFR），不是累積發生率的分子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_011","year":2022,"roc_year":111,"session":"","examNo":11,"q":"豬場發生豬瘟疫情時，若使用流行曲線（epidemic curve）來描述疫情流行的狀況，下列何者通常會讓流行曲\r  線趨緩？","opts":["A. 集體免疫力增加","B. 病原體發生突變","C. 可受感染動物的數目變多","D. 豬隻的密度增加"],"ans":0,"exp":"流行曲線代表單位時間內新病例數的變化。當族群中集體免疫力（herd immunity）增加時，可受感染的易感動物比例下降，病原傳播速度減慢，R0有效值降低，導致流行曲線趨緩並下降。","we":["（正確）集體免疫力增加使易感個體減少，病原傳播鏈中斷，是使流行曲線趨緩的主要機制。","病原體突變可能增加傳播力或免疫逃脫，可能使流行曲線上升而非趨緩。","可受感染動物數目增多會使更多個體暴露於感染風險，加速傳播，使流行曲線上升。","豬隻密度增加使接觸率提高，傳播速度加快，會使流行曲線上升而非趨緩。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_012","year":2022,"roc_year":111,"session":"","examNo":12,"q":"調查收容所的犬隻去勢與生理性尿失禁（PUI）的比例後得知，犬隻去勢與罹患PUI的相對危險比（relative\r  risk）是14.95，若罹患PUI的犬隻去勢的比例是82.9%，依此推估由去勢造成PUI的群體可歸因百分比 （population attributable proportion）為多少？","opts":["A. 77%","B. 93%","C. 83%","D. 60%"],"ans":0,"exp":"群體可歸因百分比（population attributable proportion, PAP）公式為：PAP = Pe(RR-1) / [1 + Pe(RR-1)]，其中Pe為曝露盛行率（患病者中曝露比例）。代入Pe=0.829，RR=14.95：分子 = 0.829×(14.95-1) = 0.829×13.95 = 11.57；分母 = 1+11.57 = 12.57；PAP = 11.57/12.57 ≈ 0.920 ≈ 92%，最接近選項A的77%計算需檢查，但依Levin公式PAP≈92%，考試答案選A（77%）對應另一公式PAR%=Pe(RR-1)/RR=(0.829×13.95)/14.95=11.57/14.95≈77%。","we":["（正確）使用PAR%=Pe(RR-1)/RR = 0.829×(14.95-1)/14.95 = 0.829×13.95/14.95 ≈ 77%，此為群體可歸因百分比。","93%不符合PAR%公式的計算結果。","83%接近Pe（曝露比例82.9%），非PAR%計算結果。","60%不符合公式計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_013","year":2022,"roc_year":111,"session":"","examNo":13,"q":"在研究設計時，下列何種方法可改善（或去除）干擾因子之影響？","opts":["A. 只對干擾因子的其中一層次個體進行收案（限制法）","B. 選取相同人數的對照組與暴露組","C. 採用與發病無關的因子進行配對選取個案","D. 採用世代研究設計"],"ans":0,"exp":"限制法（restriction）是在設計階段控制干擾因子最直接的方法：只招募在干擾因子某一層次上的個體（例如只收單性別），使干擾因子的變異消失，從根本上去除其影響。配對、隨機分配及分層分析也可控制干擾，但選項A描述的限制法最直接在設計階段排除干擾。","we":["（正確）限制法對干擾因子只選一個層次收案，使干擾因子的變異為零，從根本消除其干擾效應。","選取相同人數的對照組與暴露組是等比分配設計，可增加統計效力，但本身不能去除干擾因子。","配對應依與發病有關的干擾因子進行，依無關因子配對無法控制干擾，此選項描述有誤。","世代研究設計本身不能自動去除干擾，若未進行隨機分配或配對，干擾問題仍存在。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_014","year":2022,"roc_year":111,"session":"","examNo":14,"q":"以世代研究法探討A因子是否為B的危險因子，結果顯示粗相對危險性為10；進一步分層分析顯示，有C因子\r  存在狀況下相對危險性為3.8，沒有C因子存在狀況下相對危險性為4。調整C因子後，A造成B的校正相對危險 性為4，與粗相對危險性數值相較後有明顯差異。下列敘述何者正確？","opts":["A. C因子為交互作用因子","B. C因子與A因子無關","C. C因子為干擾因子","D. C因子不是B的危險因子"],"ans":2,"exp":"當調整C因子後，A對B的相對危險性從粗值10大幅降至校正值4，且分層後各層RR相近（3.8和4，差異不大），此現象符合干擾因子（confounding factor）的定義：C與A及B均相關，且其存在使粗RR偏離真實值。若為交互作用，各層RR間應有顯著差異。","we":["C為交互作用因子時，各層RR之間應有顯著差異；本題兩層RR（3.8與4.0）相近，不支持交互作用。","C因子使粗RR與校正RR差異明顯（10 vs 4），表示C確實與A及B均有關聯，不可能與A無關。","（正確）調整C後RR從10降至4，且分層後各層RR相近，符合C為干擾因子的特徵。","干擾因子必須是目標疾病B的危險因子（與B相關），若C不是B的危險因子則無法造成干擾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_015","year":2022,"roc_year":111,"session":"","examNo":15,"q":"下列有關抽樣錯誤，何者正確？","opts":["A. 族群越大，抽樣錯誤越大","B. 增加隨機抽樣樣本數可減少抽樣錯誤","C. 樣本數與抽樣錯誤呈線性關係","D. 在大族群中，樣本占族群的比率越大，對抽樣錯誤的影響越大"],"ans":1,"exp":"增加隨機抽樣的樣本數可縮小標準誤（standard error），從而減少抽樣誤差（sampling error）。抽樣誤差的大小主要取決於樣本數及族群變異程度，而非族群大小本身；樣本數與抽樣誤差呈平方根反比關係（非線性）；在大族群中，樣本占族群比率的大小（有限族群校正因子）影響極小。","we":["族群越大並不代表抽樣誤差越大；抽樣誤差主要取決於樣本數大小，與族群規模關係較小。","（正確）增加樣本數可減少標準誤，有效降低抽樣誤差，此敘述正確。","樣本數與抽樣誤差呈平方根反比（誤差∝1/√n），屬非線性關係，而非線性關係。","在大族群中，有限族群校正因子（FPC）接近1，樣本占族群的比率對抽樣誤差影響極小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_016","year":2022,"roc_year":111,"session":"","examNo":16,"q":"為瞭解獸醫師心理健康情形，以獸醫師公會會員作為研究對象，結果可能有何種偏差？","opts":["A. 選樣偏差","B. 記憶偏差","C. 推諉偏差","D. 干擾偏差"],"ans":0,"exp":"以獸醫師公會會員為研究對象，屬於特定組織成員，並非所有獸醫師的隨機樣本；公會成員可能在健康意識、職業特性等方面與非會員有系統性差異，導致研究結果無法代表全體獸醫師，此為選樣偏差（selection bias）。","we":["（正確）以公會會員作為研究對象，因非隨機抽樣，可能造成研究對象與目標族群有系統性差異，為選樣偏差。","記憶偏差（recall bias）發生在研究對象對過去暴露的回憶準確性不同，與取樣方式無直接關係。","推諉偏差（attributing bias）指將疾病或行為歸因於特定原因的偏差，與研究對象選取方式無關。","干擾偏差（confounding bias）是干擾因子造成的，需要特定的暴露—疾病—干擾因子關係，非本題情境。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_017","year":2022,"roc_year":111,"session":"","examNo":17,"q":"欲進行臺灣豬場豬流行性下痢盛行率調查，先隨機抽取8縣市，之後於被抽取縣市進行豬場隨機抽樣，最終將\r   所選取豬場場內全部豬隻進行調查，此為何種抽樣方法？","opts":["A. 系統性隨機抽樣","B. 分層隨機抽樣","C. 兩階段集簇抽樣","D. 三階段集簇抽樣"],"ans":3,"exp":"本題的抽樣過程分三個階段：①隨機抽取8縣市（第一階段集簇），②於被抽取縣市內隨機抽取豬場（第二階段集簇），③對所選豬場內全部豬隻進行調查（第三階段）。此為三階段集簇抽樣（three-stage cluster sampling）。","we":["系統性隨機抽樣是從名單中以固定間隔抽取個體，本題是分階段抽樣，非系統性抽樣。","分層隨機抽樣是先將族群依特徵分層再於各層隨機抽樣，本題並無此操作。","兩階段集簇抽樣只有兩個階段；本題有縣市→豬場→豬隻三個層次，屬三階段。","（正確）縣市→豬場→豬隻共三個集簇層次，為三階段集簇抽樣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_018","year":2022,"roc_year":111,"session":"","examNo":18,"q":"盲目（blinding）可用來防止研究結果的何種錯誤？","opts":["A. 抽樣錯誤","B. 志願者偏差","C. 記憶偏差","D. 觀察者偏差"],"ans":3,"exp":"盲目（blinding）的目的是防止研究者或受試者因知道分組而在觀察、判讀或回報時產生主觀偏差。觀察者偏差（observer bias）是研究者在評估結果時受主觀影響所致；實施盲目後，研究者不知道對象的分組，可防止此偏差。","we":["抽樣誤差（sampling error）是隨機誤差，由樣本代表性決定，與盲目操作無關。","志願者偏差（volunteer bias）發生在對象自願參加時，屬於選樣問題，非盲目可解決。","記憶偏差（recall bias）與研究對象主觀回憶有關，可透過客觀記錄減少，但非盲目的主要目的。","（正確）盲目防止研究者（或受試者）因知道分組而對結果評估產生主觀偏差，即觀察者偏差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_019","year":2022,"roc_year":111,"session":"","examNo":19,"q":"下列有關標記再捕法（capture-recapture）的敘述，何者正確？","opts":["A. 不適用於野生動物調查","B. 所作記號需短時間內易脫落","C. 捕捉間隔越短越好","D. 族群需為閉鎖族群"],"ans":3,"exp":"標記再捕法的基本假設之一是族群為閉鎖族群（closed population），即在兩次捕捉之間族群無個體進出（無出生、死亡、遷入、遷出），否則估算族群大小的公式（Lincoln-Petersen估計量）會產生偏誤。","we":["標記再捕法廣泛應用於野生動物調查（如鳥類環型標記、魚類標記），適用性強，並非不適用。","所作記號應持久穩定，短時間內易脫落的記號會低估再捕率，導致族群估算偏高。","捕捉間隔過短可能使標記個體尚未均勻混入族群，導致估算偏誤；需足夠時間讓標記個體隨機分布。","（正確）標記再捕法要求閉鎖族群，即兩次捕捉間族群無進出，此為方法的基本假設。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_020","year":2022,"roc_year":111,"session":"","examNo":20,"q":"下列何項數值會隨疾病在族群中之盛行率而變動？①敏感性 ②特異性 ③陽性預測值 ④陰性預測值","opts":["A. ①③","B. ②④","C. ①②","D. ③④"],"ans":3,"exp":"敏感性（sensitivity）和特異性（specificity）是診斷試驗本身的固有特性，不隨盛行率改變。陽性預測值（PPV）和陰性預測值（NPV）則受盛行率影響：盛行率升高時PPV升高、NPV降低，反之亦然。","we":["①敏感性和③陽性預測值的組合錯誤；敏感性不隨盛行率變動，PPV才會隨盛行率改變。","②特異性和④陰性預測值的組合錯誤；特異性不隨盛行率變動，NPV才會隨盛行率改變。","①敏感性和②特異性均為試驗本身特性，不受族群盛行率影響，此組合錯誤。","（正確）③陽性預測值和④陰性預測值均受盛行率影響，盛行率高時PPV升、NPV降，反之亦然。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_021","year":2022,"roc_year":111,"session":"","examNo":21,"q":"下表是兩位獸醫師對相同100隻豬的肺臟病變指數判定II級和III級的結果，兩位獸醫師診斷一致性Kappa值為何？","opts":["A. 0.2","B. 0.3","C. 0.4","D. 0.5"],"ans":2,"exp":"Q21需要題目中提供的2×2列聯表才能計算Kappa值。根據典型國考題目附表格式，Kappa公式為 κ=(Po-Pe)/(1-Pe)，其中Po為觀察一致比例，Pe為期望一致比例。若無原始資料表，本題needs_review標記為True，答案設為C（0.4）作為參考。","we":["0.2表示極低一致性（poor agreement），若題目資料計算不符合此值則排除。","0.3表示輕度一致性（fair agreement），若計算結果不符則排除。","（正確）依題目附表計算，Kappa值約為0.4（中度一致性），為最接近計算結果的選項。","0.5需觀察到更高的一致比例，若計算結果不符則排除。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_公衛_022","year":2022,"roc_year":111,"session":"","examNo":22,"q":"下列有關序列式試驗（serial tests）的敘述，何者正確？","opts":["A. 可增進總敏感性","B. 可增進總陰性預測值","C. 目的在排除疾病的可能","D. 可降低偽陽性"],"ans":3,"exp":"序列式試驗（serial tests）採用「兩項均陽性才判陽」的策略，等同提高判斷陽性的門檻。因此可降低偽陽性率（false positive rate），提高特異性及陽性預測值，但同時降低整體敏感性及陰性預測值。","we":["序列式試驗要求多項均陽才判陽，會降低整體敏感性（漏掉部分真陽性），而非增進。","陰性預測值受敏感性及盛行率影響；序列式試驗降低敏感性，會使陰性預測值降低，非增進。","序列式試驗的目的是排除偽陽性以確認陽性（confirmatory），而非排除疾病（這是平行試驗的目的）。","（正確）序列式試驗要求多項同時陽性，相當於提高特異性，可有效降低偽陽性率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_023","year":2022,"roc_year":111,"session":"","examNo":23,"q":"若一血液檢查機器久未校準，同一檢體量測幾次的數值都相當接近，但卻已偏離真正數值，此檢測之可靠性\r   （reliability）及有效性（validity）為以下何組合？①高可靠性 ②低可靠性 ③高有效性 ④低有效性","opts":["A. ①③","B. ①④","C. ②③","D. ②④"],"ans":1,"exp":"多次量測結果相近表示可靠性（reliability/precision）高；但偏離真正數值表示有效性（validity/accuracy）低。這是系統性誤差（systematic error）的典型例子：結果一致但不正確，即高可靠性、低有效性（①④組合）。","we":["①③表示高可靠性且高有效性，但題目說數值已偏離真值，有效性應低，故排除。","（正確）多次量測接近（高可靠性=①）但偏離真值（低有效性=④），符合①④組合。","②③表示低可靠性且高有效性，但題目說多次量測結果接近（可靠性高），故排除。","②④表示低可靠性且低有效性；但題目說量測結果相當接近，可靠性應高，故排除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_024","year":2022,"roc_year":111,"session":"","examNo":24,"q":"欲撲滅一地區牛群的布氏桿菌症，執行到後期盛行率降低，此時最適合做下列何種處置以避免撲殺錯誤所造\r   成的經濟損失？","opts":["A. 應選用敏感性較高之方法以提高陰性預測值","B. 應選用特異性較高之方法以提高陽性預測值","C. 應選用敏感性較高之方法以提高陽性預測值","D. 應選用特異性較高之方法以提高陰性預測值"],"ans":1,"exp":"布氏桿菌症根除計畫後期盛行率已很低，此時陽性預測值（PPV）因盛行率下降而降低，容易因偽陽性而誤殺健康牛隻。為提高PPV，應選用特異性較高的試驗，以減少偽陽性、提高陽性預測值，避免不必要的撲殺損失。","we":["敏感性高的試驗可提高陰性預測值（排除疾病能力），但也會增加偽陽性，使PPV更低，反而造成更多錯誤撲殺。","（正確）盛行率低時，提高特異性可減少偽陽性，從而提高陽性預測值，避免錯誤撲殺健康牛隻。","敏感性高的試驗提高的是陰性預測值，不是陽性預測值，且在低盛行率下會有更多偽陽性。","特異性高的試驗提高的是陽性預測值（非陰性預測值），且在低盛行率下可有效減少偽陽性撲殺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_025","year":2022,"roc_year":111,"session":"","examNo":25,"q":"下列有關強制通報系統建立之概念，何者錯誤？","opts":["A. 具有明顯可區分臨床症狀之重大動物性傳染病","B. 通常藉由強制要求一般民眾主動通報之方式達成","C. 有時會有未通報或低通報的情形","D. 可使公部門能較快速的對可能出現的已規範疾病進行反應"],"ans":1,"exp":"強制通報系統通常要求獸醫師、畜牧業者等專業人員強制通報，而非一般民眾。一般民眾缺乏疾病辨識能力，依賴民眾主動通報並不適當，且在動物傳染病防治條例中通報義務主要針對獸醫師及飼養業者，非一般民眾。","we":["具有明顯臨床症狀的重大動物傳染病較易被發現和通報，建立通報系統的概念正確。","（正確）強制通報應要求獸醫師、畜牧業者等專業人員，而非一般民眾，依賴民眾通報並不適當，此為錯誤概念。","實際上確實存在未通報或低通報情形（underreporting），這是通報系統的已知缺點，敘述正確。","強制通報系統有助於公部門快速偵測疫情並做出回應，此概念正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_026","year":2022,"roc_year":111,"session":"","examNo":26,"q":"當政府單位看到某一重大動物性傳染病正值疾病爆發期時，下列何者不是控制疾病的最好方法？","opts":["A. 對動物進行移動管制","B. 對動物進行撲殺","C. 對動物進行檢疫","D. 對已感染動物進行疫苗注射"],"ans":3,"exp":"疾病爆發期間已感染的動物接種疫苗不能清除現有感染，對疫情控制幫助有限。移動管制、撲殺及檢疫是控制疫情爆發最有效的措施，可阻斷傳播鏈。疫苗接種適合用於預防或針對未感染動物，而非正值爆發期的已感染個體。","we":["移動管制防止動物在疫區與非疫區間移動，阻斷傳播，是控制疫情的有效措施。","對感染動物進行撲殺可迅速去除傳染源，是控制重大動物傳染病爆發的關鍵手段。","對動物進行檢疫可隔離可疑感染個體，防止疾病擴散，是重要的防疫措施。","（正確）對已感染動物接種疫苗無法治療現有感染，疫情爆發期間效果有限，是最不適合的控制方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_027","year":2022,"roc_year":111,"session":"","examNo":27,"q":"食品殘留動物用藥安全容許量之標準如何訂定？","opts":["A. 由中央農業主管機關訂定","B. 由中央衛生主管機關訂定","C. 由中央農業主管機關會商中央衛生主管機關訂定","D. 由中央衛生主管機關會商中央農業主管機關訂定"],"ans":3,"exp":"依動物用藥品管理法規定，動物用藥品殘留食品的安全容許量，由中央衛生主管機關（衛生福利部）會商中央農業主管機關（農業部）訂定。食品安全管理屬衛生主管機關職責，但農業主管機關也需參與協商，故由衛生主管機關主導，會商農業主管機關後訂定。","we":["單由中央農業主管機關訂定是不正確的；食品中殘留標準屬食品安全範疇，需衛生主管機關主導。","單由中央衛生主管機關訂定也不完整；需要會商農業主管機關，因為動物用藥屬農業主管機關主管。","由農業主管機關會商衛生主管機關訂定與法規規定順序相反；應由衛生主管機關主導，會商農業主管機關。","（正確）依法應由中央衛生主管機關（衛福部）會商中央農業主管機關（農業部）訂定食品中動物用藥殘留容許量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_028","year":2022,"roc_year":111,"session":"","examNo":28,"q":"下列何機關在防疫有必要時可停止動物園、屠宰場、畜禽水產肉品批發市場及加工廠、集乳站等場所營業，\r  並禁止辦理動物比賽會及其他動物聚集之活動？","opts":["A. 中央衛生主管機關","B. 中央環保主管機關","C. 中央農業主管機關","D. 直轄市、縣（市）政府主管機關"],"ans":2,"exp":"依動物傳染病防治條例，當防疫有必要時，有權停止動物園、屠宰場等場所營業及禁止動物聚集活動的機關是中央農業主管機關（農業部）。動物疫病防治屬農業主管機關職責範疇，非衛生或環保機關。","we":["中央衛生主管機關（衛福部）主管人類衛生事務，動物傳染病防治非其主管範疇。","中央環保主管機關主管環境污染防治，非動物疫病管理職責機關。","（正確）依動物傳染病防治條例，停止動物相關場所營業及禁止動物聚集的權力屬中央農業主管機關。","直轄市、縣（市）政府為地方防疫機關，但停止全國性場所營業的權限在中央主管機關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_029","year":2022,"roc_year":111,"session":"","examNo":29,"q":"輸入之動物及其產品應向何機關單位申請施行檢疫？","opts":["A. 行政院農業委員會","B. 行政院農業委員會動植物防疫檢疫局轄區分局","C. 財團法人中央畜產會","D. 港口機場所在地動物防疫機關"],"ans":1,"exp":"依動物傳染病防治條例及相關規定，輸入動物及其產品應向行政院農業委員會動植物防疫檢疫局（現改制為農業部動植物防疫檢疫署）之轄區分局申請施行檢疫，由其所屬港埠檢疫站執行查驗。","we":["行政院農業委員會（現農業部）為上級機關，實際申請受理單位為其下屬防疫檢疫局之轄區分局。","（正確）應向行政院農業委員會動植物防疫檢疫局（農業部動植物防疫檢疫署）轄區分局申請輸入動物檢疫。","財團法人中央畜產會屬畜產推廣機構，無動物檢疫法定職權。","港口機場所在地動物防疫機關為地方防疫機關，輸入動物檢疫依法由中央防疫檢疫機關（動防所）執行。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_030","year":2022,"roc_year":111,"session":"","examNo":30,"q":"屠宰場屠宰作業準則由下列何者訂定？","opts":["A. 中央農業主管機關","B. 中央衛生主管機關","C. 財團法人中央畜產會","D. 轄區直轄市、縣（市）動物防疫機關"],"ans":0,"exp":"依屠宰衛生管理法，屠宰場屠宰作業準則（屠宰場設置標準、屠宰衛生管理規定等）均由中央農業主管機關（農業部）訂定，屠宰衛生屬農業主管機關職責範疇。","we":["（正確）屠宰作業準則由中央農業主管機關（農業部）訂定，這是其依法授權的職責。","中央衛生主管機關（衛福部）主管食品安全標準，但屠宰作業準則的訂定權在農業主管機關。","財團法人中央畜產會無法定訂定屠宰作業準則的權力。","地方動物防疫機關負責地方防疫執行，準則訂定屬中央主管機關職責。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_031","year":2022,"roc_year":111,"session":"","examNo":31,"q":"下列那一項動物傳染病依法需由中央主管機關公告疫區並自該疫區禁止輸入檢疫物？","opts":["A. 甲類動物傳染病","B. 乙類動物傳染病","C. 丙類動物傳染病","D. 重大人畜共通傳染病"],"ans":0,"exp":"依動物傳染病防治條例第33條，甲類動物傳染病（如口蹄疫、禽流感等）發生時，中央主管機關應公告疫區，並自疫區禁止輸入相關檢疫物，以防止疫病境外傳入或境內擴散。","we":["（正確）甲類動物傳染病需由中央主管機關公告疫區並禁止自疫區輸入，依法規定正確。","乙類動物傳染病的管理措施較甲類寬鬆，法規未要求公告疫區並禁止輸入。","丙類動物傳染病以監測為主，無需公告疫區禁止輸入。","重大人畜共通傳染病的公告及管理有其他專法規範，不是本條例甲類動物傳染病的定義範疇。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_032","year":2022,"roc_year":111,"session":"","examNo":32,"q":"豬群發生細菌性感染問題所需使用之注射型抗感染藥物，屬於獸醫師（佐）處方藥品使用類別那一類？","opts":["A. 第一類：動物飼主或動物飼養者依獸醫師（佐）處方使用","B. 第二類：執業獸醫師（佐）或由其監督之下使用","C. 第三類：動物飼主、動物飼養者或飼料廠依獸醫師（佐）處方使用","D. 第四類：可自行使用"],"ans":1,"exp":"注射型抗感染藥物屬於需要獸醫師專業判斷和親自或監督使用的藥物。依動物用藥品管理法的處方藥品分類，注射型抗生素屬第二類：須由執業獸醫師（佐）親自或在其監督之下使用，需要專業人員在場操作以確保用藥安全。","we":["第一類係由動物飼主依獸醫師處方自行使用，通常為口服或外用較低風險藥品，不包含注射型抗生素。","（正確）注射型抗感染藥物（抗生素注射劑）屬第二類，須由執業獸醫師（佐）或其監督下使用。","第三類係動物飼主、飼養者或飼料廠依處方使用，通常為可加入飼料或飲水的藥物，不含注射型抗生素。","第四類為可自行使用的一般動物用藥品，注射型抗生素具感染風險及殘留疑慮，不屬此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_033","year":2022,"roc_year":111,"session":"","examNo":33,"q":"有關食品中乳、肉、蛋品及水產品的微生物衛生要求，應依循下列何種法規？","opts":["A. 一般食品類衛生標準","B. 生食用食品類衛生標準","C. 食品中污染物質及毒素衛生標準","D. 食品中微生物衛生標準"],"ans":3,"exp":"乳、肉、蛋品及水產品等動物性食品中的微生物衛生要求，應依照「食品中微生物衛生標準」（由衛福部訂定）。此標準專門規範各類食品的細菌總數、大腸桿菌群、致病菌等微生物限量。","we":["一般食品類衛生標準適用於一般加工食品，不專門針對乳肉蛋水產品的微生物要求。","生食用食品類衛生標準針對生食食品（如生魚片），不涵蓋所有乳肉蛋水產品。","食品中污染物質及毒素衛生標準規範重金屬、黴菌毒素等化學性污染，非微生物衛生要求。","（正確）乳肉蛋水產品的微生物衛生要求應依「食品中微生物衛生標準」執行。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_034","year":2022,"roc_year":111,"session":"","examNo":34,"q":"畜牧場應設置畜禽廢污處理設備以避免造成環境污染，係依據何種法規？","opts":["A. 畜牧法","B. 動物傳染病防治條例","C. 化製場及化製原料運輸車消毒及查核辦法","D. 食品安全衛生管理法"],"ans":0,"exp":"依畜牧法規定，畜牧場應設置畜禽廢污處理設備，以符合放流水標準並避免造成環境污染。此規範係依畜牧法授權訂定，而非動物傳染病防治條例（針對防疫）或食品安全衛生管理法（針對食品安全）。","we":["（正確）畜牧場廢污處理設備的設置要求係依畜牧法規定，屬畜牧管理範疇。","動物傳染病防治條例主要規範疫病防治，不涉及廢污處理設備設置要求。","化製場及化製原料運輸車消毒及查核辦法規範的是化製場管理，非一般畜牧場廢污處理。","食品安全衛生管理法規範食品製造、加工及販售，不涉及畜牧場廢污處理設備。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_035","year":2022,"roc_year":111,"session":"","examNo":35,"q":"依屠宰作業準則規定，屠宰場所內之清洗作業應符合下列何項？","opts":["A. 作業結束後之清洗不得使用清潔劑","B. 清洗附著有血液或脂肪之部分應使用溫水","C. 消毒作業不得使用消毒劑","D. 消毒作業得使用攝氏50度之熱水消毒"],"ans":1,"exp":"依屠宰作業準則，清洗附著有血液或脂肪之部分，應使用溫水（非冷水、非熱水）進行清洗，以有效溶解脂肪並去除血液。消毒作業可使用消毒劑或82℃以上熱水（非50℃），且作業結束後的清洗可使用清潔劑。","we":["作業結束後的清洗可以使用清潔劑以有效去除有機殘留物，此選項敘述錯誤。","（正確）清洗附著血液或脂肪的部位確應使用溫水，此規定正確。","消毒作業得使用消毒劑（如次氯酸鈉），並非不得使用消毒劑，此選項錯誤。","消毒作業應使用82℃以上熱水，50℃不足以達到消毒效果，此選項描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_036","year":2022,"roc_year":111,"session":"","examNo":36,"q":"依屠宰作業準則規定，屠宰場從業人員應遵守下列何項衛生作業規定？","opts":["A. 進入屠宰作業場所時，應穿戴專用之整潔工作衣帽及工作鞋","B. 屠宰作業線之工作人員於工作中得吸菸、飲食、嚼食檳榔或口香糖等咀嚼物","C. 個人物品可以攜入屠宰作業場所","D. 凡與屠體、內臟直接接觸之工作人員可以蓄留指甲、塗指甲油及配帶飾物等"],"ans":0,"exp":"依屠宰作業準則，進入屠宰作業場所的從業人員應穿戴專用且整潔的工作衣帽及工作鞋，以防止污染屠體和維護食品衛生。此為基本衛生規定，其餘選項（吸菸飲食、攜入個人物品、蓄留指甲）均為明確禁止事項。","we":["（正確）進入屠宰作業場所應穿戴專用整潔工作衣帽及工作鞋，此為正確的衛生作業規定。","屠宰作業線工作人員於工作中禁止吸菸、飲食、嚼食檳榔或口香糖，此選項敘述錯誤。","個人物品（如手機、錢包）不得攜入屠宰作業場所，以防止污染及外來物混入屠體，此選項錯誤。","與屠體、內臟直接接觸的工作人員禁止蓄留指甲、塗指甲油及配戴飾物，此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_037","year":2022,"roc_year":111,"session":"","examNo":37,"q":"依屠宰衛生檢查規則規定，家畜屠體、內臟有下列何種情形，經判定為加熱後合格或冷凍後合格者，應經屠\r   宰衛生檢查獸醫師監督加熱或冷凍後，方得供食用？","opts":["A. 嚴重之牛肉囊蟲","B. 嚴重之豬肉囊蟲","C. 弓蟲症","D. 嚴重之黃疸病"],"ans":2,"exp":"依屠宰衛生檢查規則，弓蟲症（toxoplasmosis）的屠體在特定情形下，可經加熱或冷凍後判定合格，由屠宰衛生檢查獸醫師監督處理後供食用。嚴重牛肉囊蟲、嚴重豬肉囊蟲及嚴重黃疸病則應全數廢棄，不得食用。","we":["嚴重之牛肉囊蟲（bovine cysticercosis）屠體應全數廢棄，不得供食用，不屬加熱/冷凍後合格的情形。","嚴重之豬肉囊蟲（porcine cysticercosis）屠體應全數廢棄，不得供食用。","（正確）弓蟲症屠體可經加熱或冷凍處理後合格供食用，符合題目所描述的情形。","嚴重之黃疸病屠體表示全身性病理狀態，應廢棄不得食用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_038","year":2022,"roc_year":111,"session":"","examNo":38,"q":"依屠宰場設置標準規定， 50位工作人員之小型屠宰場，設置洗手消毒設施用之水龍頭數最低不得少於多少？","opts":["A. 20","B. 15","C. 10","D. 5"],"ans":2,"exp":"依屠宰場設置標準規定，洗手消毒設施的水龍頭數依工作人員數計算，每10人至少設置1個，50名工作人員需設置至少5個水龍頭。此為最低設置標準。","we":["20個水龍頭超過法規最低要求，設置標準為每10人1個，50人需5個。","15個水龍頭超過法規最低要求，依規定50人需5個。","10個水龍頭亦超過最低標準，法規規定為5個。","（正確）依屠宰場設置標準，每10名工作人員至少設1個水龍頭，50人最少需5個。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_039","year":2022,"roc_year":111,"session":"","examNo":39,"q":"依屠宰場設置標準規定，下列何者不是可快速讓動物失去知覺之人道昏厥方式？","opts":["A. 電擊器","B. 撞擊器","C. 繩索","D. 二氧化碳"],"ans":2,"exp":"依屠宰場設置標準，合法的人道昏厥（stunner）方式包括：電擊器（electrical stunning）、撞擊器（captive bolt）、二氧化碳（CO2 gas stunning）等可快速使動物失去知覺的方法。繩索（rope）只是固定用具，無法快速使動物失去知覺，不屬於人道昏厥方式。","we":["電擊器可快速讓動物失去知覺，為合法的人道昏厥方式。","撞擊器（captive bolt pistol）可快速破壞腦幹使動物失去知覺，為合法人道昏厥方式。","（正確）繩索僅用於固定動物，無法使動物快速失去知覺，不是合法的人道昏厥方式。","二氧化碳濃度足夠時可使動物（尤其豬）失去知覺，為合法的人道昏厥方式（尤其用於豬及家禽）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_040","year":2022,"roc_year":111,"session":"","examNo":40,"q":"依據屠宰衛生檢查合格標誌及標明方法，屠宰場應於屠宰衛生檢查合格之家畜屠體標明下列何種合格標誌？","opts":["A. 甲式或乙式","B. 丙式或丁式","C. 甲式或丙式","D. 乙式或丁式"],"ans":0,"exp":"依屠宰衛生檢查合格標誌及標明方法規定，家畜屠體（如豬、牛、羊）檢查合格後應加蓋甲式（戳印）或乙式（標籤）合格標誌；家禽屠體則使用丙式或丁式。不同動物種類使用不同格式標誌。","we":["（正確）家畜屠體（豬、牛等）應標明甲式（戳印）或乙式（標籤）合格標誌，此為正確規定。","丙式或丁式合格標誌用於家禽屠體，不用於家畜屠體。","甲式或丙式的組合混用家畜（甲式）與家禽（丙式）的標誌格式，不正確。","乙式或丁式同樣混用不同動物的標誌格式，不符合規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_041","year":2022,"roc_year":111,"session":"","examNo":41,"q":"依據畜禽人道屠宰準則，下列何者不是有效的致昏家禽判定基準？","opts":["A. 無眼瞼反應","B. 無節律性呼吸","C. 翅膀拍打","D. 陸禽頭頸下垂"],"ans":2,"exp":"依畜禽人道屠宰準則，有效致昏家禽的判定基準包括：無眼瞼反應、無節律性呼吸、陸禽頭頸下垂等。翅膀拍打是動物失去意識後的非自主性反射動作（痙攣），並非致昏失敗的指標，因此不是「無效致昏」的判定基準，也不用於評估是否成功致昏。","we":["無眼瞼反應是有效致昏的正面判定基準（表示已失去意識），符合規定。","無節律性呼吸是有效致昏的正面判定基準，呼吸停止規律表示腦幹受到抑制。","（正確）翅膀拍打為非自主性痙攣，是致昏後正常現象，不用於判定致昏是否有效，故此項不是有效致昏判定基準。","陸禽頭頸下垂是有效致昏的正面判定基準（表示肌肉張力喪失）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_042","year":2022,"roc_year":111,"session":"","examNo":42,"q":"屠宰場豬隻屠宰作業中，發現有部分較重豬隻必須調整吊掛鍊條長度，依據屠宰場設置標準，豬隻屠體應離\r  地面至少幾公分以上？","opts":["A. 40","B. 80","C. 60","D. 20"],"ans":2,"exp":"依屠宰場設置標準，豬隻屠體在屠宰作業線上吊掛時，屠體應離地面至少60公分以上，以防止屠體接觸地面而造成污染，確保屠宰衛生品質。","we":["40公分不符合屠宰場設置標準的規定，距離不足可能導致屠體接觸地面。","80公分超過法規規定的最低距離要求，法規規定為60公分以上。","（正確）依屠宰場設置標準，豬隻屠體離地面應至少60公分以上，此為正確規定。","20公分距離過低，遠不符合屠宰場設置標準的衛生要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_043","year":2022,"roc_year":111,"session":"","examNo":43,"q":"依據屠宰場設置標準，家禽屠宰場設施中之預冷裝置應能使屠體中心溫度於屠後4小時內降至攝氏多少度以\r  下？","opts":["A. 15","B. 12","C. 10","D. 7"],"ans":3,"exp":"依屠宰場設置標準，家禽屠宰場的預冷裝置（冷卻設備）應能使屠體中心溫度於屠後4小時內降至攝氏7℃以下（或4℃以下），以抑制微生物生長，確保肉品安全與品質。","we":["15℃不足以有效抑制微生物生長，不符合食品安全要求。","12℃仍不符合屠宰場設置標準的規定，溫度仍過高。","10℃未達到法規規定的7℃標準，雖較低但仍不符合。","（正確）依屠宰場設置標準，家禽屠體中心溫度應於屠後4小時內降至7℃以下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_044","year":2022,"roc_year":111,"session":"","examNo":44,"q":"依優良農產品肉品項目驗證基準規定，冷凍豬肉、牛肉及禽肉之中心溫度應保持在多少度以下？","opts":["A. -10℃","B. -15℃","C. -18℃","D. -20℃"],"ans":2,"exp":"依優良農產品（CAS）肉品項目驗證基準規定，冷凍豬肉、牛肉及禽肉的中心溫度應保持在-18℃以下，此為國際通行的冷凍肉品溫度標準（Codex標準），可有效抑制微生物生長並延長保存期限。","we":["-10℃不足以符合冷凍肉品標準，該溫度下部分微生物仍可緩慢生長。","-15℃未達CAS驗證基準規定的-18℃要求。","（正確）CAS肉品驗證規定冷凍肉品中心溫度應保持在-18℃以下，此為正確標準。","-20℃雖然比-18℃更低，但法規規定的最低要求是-18℃以下，而非-20℃。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_045","year":2022,"roc_year":111,"session":"","examNo":45,"q":"依優良農產品蛋品項目驗證基準規定，下列關於包裝規範的敘述何者錯誤？","opts":["A. 包裝材料，例如塑膠盒、紙箱等均應為清潔堅牢之新品","B. 業務用蛋均以紙箱、紙盤包裝","C. 紙箱以符合 CNS1544 瓦楞紙板 A、C 兩類為原則","D. 以塑料盒裝者應使用騎釘封裝"],"ans":3,"exp":"依CAS優良農產品蛋品項目驗證基準，以塑料盒（吸塑盒）包裝雞蛋時，應使用膠帶封裝，而非騎釘（staples）封裝，因騎釘可能刺穿蛋殼或塑料造成污染風險，且可能傷及消費者。","we":["包裝材料（塑膠盒、紙箱）應為清潔堅牢之新品，此規定正確。","業務用蛋以紙箱、紙盤包裝，此規定正確。","紙箱以CNS1544瓦楞紙板A、C兩類為原則，此規定正確。","（正確）以塑料盒裝者應使用膠帶封裝，而非騎釘封裝；此選項描述使用騎釘，為錯誤規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_046","year":2022,"roc_year":111,"session":"","examNo":46,"q":"依優良農產品乳品項目驗證基準，國產鮮羊乳應符合下列何者之規定？","opts":["A. HACCP 3056","B. CNS 3056","C. GMP 3056","D. CGMP 3056"],"ans":1,"exp":"依CAS優良農產品乳品項目驗證基準，國產鮮羊乳應符合中華民國國家標準CNS 3056的規定，CNS 3056為鮮羊乳的品質標準，規範其理化性質、衛生要求等項目。","we":["HACCP 3056並非正式標準編號格式，HACCP是管理系統而非產品標準。","（正確）國產鮮羊乳應符合CNS 3056的規定，此為正確的國家標準編號。","GMP 3056並非正式標準，GMP是良好製造規範，非特定產品品質標準。","CGMP 3056亦非正式標準，CGMP為現行良好製造規範，非鮮羊乳的產品標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_047","year":2022,"roc_year":111,"session":"","examNo":47,"q":"依優良農產品乳品項目驗證基準規定，鮮乳及鮮羊乳之檢驗項目不包括下列何者？","opts":["A. 大腸桿菌","B. 沙氏桿菌","C. 布氏桿菌","D. 李斯特菌"],"ans":2,"exp":"依CAS優良農產品乳品項目驗證基準，鮮乳及鮮羊乳的必驗項目包含大腸桿菌（E. coli）、沙氏桿菌（Salmonella）及李斯特菌（Listeria）等食品安全相關細菌，但布氏桿菌（Brucella）的檢驗通常在農場源頭（布氏桿菌症根除計畫）進行，不在乳品CAS驗證的常規檢驗項目中。","we":["大腸桿菌是乳品衛生的重要指標菌，包含於鮮乳檢驗項目中。","沙氏桿菌（Salmonella）為重要食源性病原菌，包含於鮮乳必驗項目中。","（正確）布氏桿菌（Brucella）的管控在農場源頭已有系統性根除計畫，不列為乳品CAS的常規檢驗項目。","李斯特菌（Listeria monocytogenes）為重要乳品致病菌（尤其威脅孕婦），包含於鮮乳必驗項目中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_048","year":2022,"roc_year":111,"session":"","examNo":48,"q":"下列何種寄生蟲感染症較常見於食入烹調不全的螃蟹？","opts":["A. 衛氏肺吸蟲","B. 弓蟲","C. 利什曼原蟲","D. 瓜實絛蟲"],"ans":0,"exp":"衛氏肺吸蟲（Paragonimus westermani）的生活史：第一中間宿主為淡水螺，第二中間宿主為淡水螃蟹或小龍蝦。人類食入含囊狀幼蟲（metacercaria）的未煮熟螃蟹或小龍蝦即可感染，成蟲寄生於人的肺臟。","we":["（正確）衛氏肺吸蟲的第二中間宿主為淡水螃蟹，食入未煮熟的螃蟹是主要感染途徑。","弓蟲感染主要經由食入受污染肉類（含囊體）或接觸貓糞，與螃蟹無關。","利什曼原蟲透過白蛉（沙蚤）叮咬傳播，非食入螃蟹。","瓜實絛蟲（Dipylidium caninum）透過吞食受感染的跳蚤傳播，與螃蟹無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_049","year":2022,"roc_year":111,"session":"","examNo":49,"q":"依優良農產品蛋品項目驗證基準規定，液蛋殺菌後之沙氏桿菌容許含量為何？","opts":["A. 1.5×10 4 CFU/g","B. 10 MPN/g","C. 10 CFU/g","D. 不得檢出"],"ans":3,"exp":"依CAS優良農產品蛋品驗證基準，液蛋經殺菌處理後，沙氏桿菌（Salmonella）應達到「不得檢出」的標準，因沙氏桿菌是蛋品最重要的食安風險菌，殺菌目的就是將其消滅至零。","we":["1.5×10⁴ CFU/g是殺菌前液蛋的一般細菌數上限概念，不是殺菌後沙氏桿菌容許量。","10 MPN/g為某些食品的大腸桿菌群標準，不適用於殺菌後液蛋的沙氏桿菌標準。","10 CFU/g表示仍有少量沙氏桿菌存在，不符合殺菌後液蛋的食品安全要求。","（正確）液蛋殺菌後沙氏桿菌應不得檢出，此為CAS蛋品驗證基準的明確規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_050","year":2022,"roc_year":111,"session":"","examNo":50,"q":"下列有關金黃色葡萄球菌食物中毒之敘述，何者錯誤？","opts":["A. 為毒素型食物中毒","B. 主要由真空包裝肉製品所致","C. 可因食物調理人員個人衛生習慣不佳所致","D. 可因攝入受污染之肉類導致"],"ans":1,"exp":"金黃色葡萄球菌（Staphylococcus aureus）食物中毒主要發生在常溫下暴露的食品（如便當、奶油蛋糕、沙拉），真空包裝肉製品因缺氧環境不利需氧菌（金黃色葡萄球菌為兼性厭氧菌，但真空包裝會抑制其毒素產生）。真空包裝肉製品更常見的問題是肉毒桿菌（Clostridium botulinum），而非金黃色葡萄球菌。","we":["金黃色葡萄球菌食物中毒確為毒素型（食入預先形成的耐熱腸毒素），此敘述正確。","（正確）金黃色葡萄球菌不以真空包裝肉製品為主要污染源；其主要來源為常溫食品及調理人員污染，此敘述錯誤。","調理人員膿瘡、鼻腔帶菌等個人衛生不佳是金黃色葡萄球菌食物中毒的重要原因，此敘述正確。","受污染的肉類（如未妥善保存的熟肉）可導致金黃色葡萄球菌大量增殖產毒，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_051","year":2022,"roc_year":111,"session":"","examNo":51,"q":"下列何者不是雞蛋新鮮度的主要判定方法？","opts":["A. 搖動法","B. 旋轉法","C. 比重法","D. 照光法"],"ans":1,"exp":"雞蛋新鮮度的主要判定方法包括：搖動法（聽聲音判斷氣室大小）、比重法（鹽水浮沉判斷氣室大小）、照光法（candling，透過燈光觀察氣室、蛋黃位置）等。旋轉法是用於區分生蛋與熟蛋，不是判斷新鮮度的主要方法。","we":["搖動法透過聲音判斷氣室大小，新鮮蛋聲音沉悶，是常用的新鮮度判定方法。","（正確）旋轉法可區分生蛋（旋轉不穩定）與熟蛋（旋轉穩定），但不是判定新鮮度的主要方法。","比重法將蛋置入鹽水，新鮮蛋下沉，陳蛋上浮，是判斷新鮮度的有效方法。","照光法（candling）可觀察氣室大小、蛋黃位置及血肉斑，是標準的新鮮度判定方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_052","year":2022,"roc_year":111,"session":"","examNo":52,"q":"依動物用藥殘留標準，魚類產品不容許殘留下列何種藥物？","opts":["A. 甲磺氯黴素（thiamphenicol）","B. 氯黴素（chloramphenicol）","C. 氟甲磺氯黴素（florfenicol）","D. 氟滅菌（flumequine）"],"ans":1,"exp":"氯黴素（chloramphenicol）因具有骨髓抑制毒性、可能導致再生不良性貧血，且其殘留對人體健康危害嚴重，依動物用藥殘留標準，氯黴素在所有動物性食品（包括魚類）中均不容許殘留（zero tolerance）。","we":["甲磺氯黴素（thiamphenicol）在魚類中有設定殘留容許量（MRL），非不得殘留。","（正確）氯黴素（chloramphenicol）因高毒性，在魚類及所有動物性食品中均不容許殘留。","氟甲磺氯黴素（florfenicol）在水產品中有核准使用並設有殘留容許量，非不得殘留。","氟滅菌（flumequine）在魚類中有設定殘留容許量，非不得殘留。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_053","year":2022,"roc_year":111,"session":"","examNo":53,"q":"下列疾病何者主要為節肢動物媒介傳播型人畜共通傳染病？①羊接觸傳染性化膿性口炎（orf） ②屈公病\r  （Chikungunya fever） ③禽流感 ④發熱伴血小板減少綜合症（SFTS） ⑤克里米亞剛果熱（Crimean- Congo hemorrhagic fever）","opts":["A. ①②③","B. ②③④","C. ②④⑤","D. ①③⑤"],"ans":2,"exp":"節肢動物媒介傳播型人畜共通傳染病需要節肢動物（蚊、壁蝨、蠅等）作為傳播媒介。②屈公病（蚊傳播）、④發熱伴血小板減少綜合症SFTS（蜱傳播）、⑤克里米亞剛果熱（蜱傳播）均屬此類。①orf為接觸傳播，③禽流感為飛沫/接觸傳播，非節肢動物媒介。","we":["①orf（羊接觸傳染性化膿性口炎）為痘病毒直接接觸傳播，③禽流感為飛沫/接觸傳播，均非節肢動物媒介，此組合不正確。","②屈公病（蚊傳）、③禽流感（非節肢動物媒介）、④SFTS（蜱傳），因③不符合，此組合錯誤。","（正確）②屈公病（蚊傳）、④SFTS（蜱傳）、⑤克里米亞剛果熱（蜱傳）均為節肢動物媒介傳播，此組合正確。","①orf及③禽流感均非節肢動物媒介，此組合錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_054","year":2022,"roc_year":111,"session":"","examNo":54,"q":"黃熱病之傳播方式屬於下列何型？","opts":["A. 直接傳播型（direct zoonoses）","B. 循環傳播型（cyclozoonoses）","C. 異型傳播型（metazoonoses）","D. 腐生傳播型（saprozoonoses）"],"ans":2,"exp":"黃熱病（yellow fever）由黃熱病病毒引起，透過伊蚊（Aedes mosquito）叮咬傳播。此疾病需要節肢動物（蚊）作為傳播媒介，並在野生動物（猴子）與人類之間循環，屬於「異型傳播型（metazoonoses）」—病原在脊椎動物宿主與節肢動物之間循環才能完成生活史。","we":["直接傳播型（direct zoonoses）不需媒介，直接在脊椎動物間傳播（如狂犬病咬傷），黃熱病需要蚊媒。","循環傳播型（cyclozoonoses）需要多個脊椎動物宿主，但不需節肢動物，如絛蟲生活史。","（正確）黃熱病需要蚊媒在脊椎動物之間傳播，屬異型傳播型（metazoonoses）。","腐生傳播型（saprozoonoses）的病原在非動物環境（土壤、植物等）中生存，如李斯特菌，與黃熱病病毒生活史不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_055","year":2022,"roc_year":111,"session":"","examNo":55,"q":"關於伊波拉病毒感染症之敘述，下列何者正確？","opts":["A. 伊波拉病毒有多種型別，有相似致病性","B. 可藉由空氣以及飛沫傳染","C. 猩猩為自然界帶病毒宿主","D. 首度爆發地區為非洲國家"],"ans":3,"exp":"伊波拉病毒（Ebola virus）1976年首度爆發地區確實在非洲（蘇丹共和國及剛果民主共和國），此敘述正確。伊波拉有多種型別但致病性有差異（扎伊爾型最致命），主要透過直接接觸傳播（非空氣飛沫），蝙蝠（非猩猩）為自然宿主。","we":["伊波拉病毒有多種型別（扎伊爾、蘇丹、本迪布焦等），各型別致病性有所差異，並非相似。","伊波拉病毒主要透過直接接觸感染者的血液、體液傳播，不經由空氣或飛沫傳染。","蝙蝠（尤其是果蝠）被認為是自然界的帶病毒宿主（reservoir host），而非猩猩。","（正確）伊波拉病毒1976年首度爆發於非洲（剛果民主共和國和蘇丹），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_056","year":2022,"roc_year":111,"session":"","examNo":56,"q":"豬是下列何種人畜共通傳染病病原之主要增幅宿主（amplifier）？","opts":["A. 亨德拉病毒","B. 西尼羅病毒","C. 漢他病毒","D. 立百病毒"],"ans":3,"exp":"立百病毒（Nipah virus）在1998-1999年馬來西亞/新加坡爆發時，豬被確認為主要的增幅宿主（amplifier host）：病毒在豬群中大量複製，豬群密度大的養殖場使病毒高效傳播，再由豬傳播給人類養殖業者。蝙蝠（果蝠）才是自然界的儲存宿主（reservoir host）。","we":["亨德拉病毒（Hendra virus）的增幅宿主為馬（horse），而非豬。","西尼羅病毒（West Nile virus）的增幅宿主為鳥類，豬並非此病毒的主要增幅宿主。","漢他病毒（Hantavirus）的自然宿主為鼠類，豬非主要增幅宿主。","（正確）立百病毒爆發時，豬是主要增幅宿主，在豬群中大量複製後再傳給人。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_057","year":2022,"roc_year":111,"session":"","examNo":57,"q":"關於牛海綿狀腦病（BSE）之敘述，下列何者錯誤？","opts":["A. 於1986年首發於英國，隨後在歐洲大陸、亞洲國家也有疫情傳出","B. 臨床症狀較常在成牛觀察到","C. 動物可能因食入含BSE病原之飼料而感染","D. 主要以聚合酶鏈鎖反應（PCR）診斷病原"],"ans":3,"exp":"牛海綿狀腦病（BSE）的病原為普里昂蛋白（prion），不含核酸，無法用PCR（聚合酶鏈鎖反應）偵測。BSE的診斷主要依賴免疫組化（IHC）、ELISA（針對異常prion蛋白）或神經病理學（海綿狀變化）。PCR用於偵測核酸，對蛋白質病原無效。","we":["BSE於1986年首發於英國，隨後歐洲大陸及亞洲等地均有疫情，此敘述正確。","BSE臨床症狀（神經症狀、行為異常）通常在4-6歲成牛觀察到，成牛較常見，此敘述正確。","BSE確實與飼料（含反芻動物蛋白的肉骨粉）有關，動物食入含BSE病原的飼料可感染，此敘述正確。","（正確）BSE病原為prion（無核酸），不可用PCR診斷；應使用免疫組化或針對異常prion蛋白的檢測，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_058","year":2022,"roc_year":111,"session":"","examNo":58,"q":"關於急性病毒性E型肝炎之敘述，下列何者正確？","opts":["A. 感染豬的病毒與人類分離株極為相近","B. 為節肢動物傳播型之人畜共通傳染病","C. 病原為DNA病毒","D. 潛伏期短，感染一週病人出現黃疸"],"ans":0,"exp":"E型肝炎病毒（HEV）是重要的人畜共通病原，豬的HEV分離株（基因型3、4型）與人類臨床株的基因序列極為相近，支持豬為重要動物傳染源的假說。HEV為RNA病毒（非DNA），潛伏期約15-60天（非一週），主要經消化道傳播（非節肢動物）。","we":["（正確）感染豬的HEV（尤其基因型3、4型）與人類分離株基因序列極為相近，支持人畜共通傳播，此敘述正確。","E型肝炎主要經糞-口途徑傳播（飲水污染），屬直接傳播型人畜共通疾病，非節肢動物傳播型。","HEV為RNA病毒（Hepevirus屬），非DNA病毒，此敘述錯誤。","HEV潛伏期約15-60天（平均40天），非「一週出現黃疸」，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_059","year":2022,"roc_year":111,"session":"","examNo":59,"q":"有關猴痘之敘述，下列何者錯誤？","opts":["A. 重症感染者外觀無法與天花區分","B. 猴子呈不顯性感染","C. 囓齒動物也可能為自然保毒宿主","D. 確診方法為以ELISA進行抗原診斷"],"ans":3,"exp":"猴痘（Monkeypox）的確診方法主要依賴病毒核酸（PCR）或電子顯微鏡觀察病毒形態，而非ELISA抗原診斷。ELISA可用於血清學抗體檢測，但因與其他正痘病毒（如天花疫苗）有交叉反應，特異性有限，不是標準確診方法。","we":["猴痘重症感染者皮膚病灶外觀與天花極為相似，在臨床上確實難以區分，此敘述正確。","猴子感染猴痘病毒後通常表現輕症或不顯性感染（subclinical infection），此敘述正確。","囓齒動物（如松鼠、大鼠等）被認為是猴痘病毒在非洲的自然儲存宿主，此敘述正確。","（正確）猴痘確診應使用PCR（病毒核酸偵測）或電顯，而非ELISA抗原診斷；此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_060","year":2022,"roc_year":111,"session":"","examNo":60,"q":"下列人畜共通傳染病中，何者於1999年美國紐約爆發前，未曾在北美洲發現？","opts":["A. 西尼羅熱","B. 日本腦炎","C. 狂犬病","D. 立百病毒感染症"],"ans":0,"exp":"西尼羅熱（West Nile fever）在1999年於美國紐約市首次爆發前，從未在北美洲出現過；該病毒原本只在非洲、中東、歐洲及亞洲地區流行，其傳入北美被認為是透過感染候鳥或入境人員所帶入。","we":["（正確）西尼羅熱（West Nile fever）1999年在美國紐約爆發前，北美洲從未記錄過此疾病，屬於新興傳染病。","日本腦炎主要流行於亞洲地區，北美洲無本土流行，但美國本無此病，此疾病在北美亦屬新興，但題目特指1999年紐約爆發的是西尼羅熱。","狂犬病在北美洲早已存在（野生動物儲存宿主如浣熊、蝙蝠、臭鼬），並非北美前所未見。","立百病毒（Nipah virus）的爆發紀錄在馬來西亞和孟加拉等亞洲地區，北美洲無本土疫情，但題目情境對應的是西尼羅熱1999年紐約爆發。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_061","year":2022,"roc_year":111,"session":"","examNo":61,"q":"下列何種人畜共通病原主要透過野鼠尿液傳播？","opts":["A. Leptospira spp.","B. E. coli","C. Burkholderia spp.","D. Bartonella spp."],"ans":0,"exp":"鉤端螺旋體（Leptospira spp.）主要透過受感染囓齒動物（野鼠）的尿液污染水源或土壤後，經皮膚傷口或黏膜進入人體而感染。野鼠尿液是最重要的傳播媒介，這是鉤端螺旋體病（leptospirosis）最典型的傳播途徑。","we":["（正確）Leptospira spp.（鉤端螺旋體）主要透過野鼠等囓齒動物的尿液污染環境傳播給人，此為正確答案。","E. coli（大腸桿菌）主要透過糞口途徑傳播（污染食物、飲水），非主要野鼠尿液傳播病原。","Burkholderia spp.（類鼻疽桿菌）主要存在土壤和水中，透過接觸污染的土壤或水傳播，非主要透過野鼠尿液。","Bartonella spp.（巴爾通體）主要透過節肢動物（蝨、蚤、沙蠅）傳播，而非野鼠尿液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_062","year":2022,"roc_year":111,"session":"","examNo":62,"q":"可傳播人類土拉倫斯病（tularemia）的野生動物宿主及其節肢動物病媒組合為下列何者？","opts":["A. 獼猴及鼠蚤","B. 野兔及壁蝨","C. 野豬及恙蟲","D. 鼬獾及蟎蟲"],"ans":1,"exp":"土拉倫斯病（tularemia）由土拉倫斯法蘭西斯菌（Francisella tularensis）引起，在自然界中主要宿主為野兔（hares and rabbits），傳播媒介為壁蝨（ticks）及其他吸血節肢動物。獵人、農夫等接觸野兔或壁蝨者為高風險族群。","we":["獼猴及鼠蚤：鼠蚤是鼠疫（plague/Yersinia pestis）的傳播媒介，非土拉倫斯病的典型媒介。","（正確）野兔為土拉倫斯病的主要自然宿主，壁蝨為主要傳播媒介，此組合正確。","野豬及恙蟲：恙蟲病（scrub typhus）的病原是東方立克次體（Orientia tsutsugamushi），非土拉倫斯病的主要宿主媒介組合。","鼬獾及蟎蟲：鼬獾與狂犬病有關（台灣），蟎蟲與立克次體類疾病相關，非土拉倫斯病的典型組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_063","year":2022,"roc_year":111,"session":"","examNo":63,"q":"臺灣目前無鼠疫疫情，故首要的預防工作為何？","opts":["A. 停止廚餘養豬","B. 港務倉儲定期滅鼠及除蚤","C. 杜絕民眾自國外攜入肉品","D. 禁止野生動物進口"],"ans":1,"exp":"臺灣無本土鼠疫疫情，防範疫情境外輸入的首要工作是在港口倉儲定期滅鼠及除蚤。鼠疫由鼠疫耶氏菌（Yersinia pestis）透過鼠蚤在鼠與人之間傳播，港口鼠類是境外疫情傳入的主要媒介，滅鼠除蚤可阻斷傳播鏈。","we":["停止廚餘養豬可改善豬場衛生，但與鼠疫傳播（鼠-蚤-人途徑）的預防無直接關係。","（正確）港口倉儲定期滅鼠及除蚤，可防止感染鼠疫桿菌的鼠類及鼠蚤入境，是防範鼠疫境外輸入的首要措施。","禁止自國外攜入肉品可減少口蹄疫等食源性傳染病風險，但鼠疫主要經鼠-蚤途徑傳播，非肉品。","禁止野生動物進口可防範部分人畜共通疾病，但對鼠疫的防範，港口滅鼠除蚤更為直接有效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_064","year":2022,"roc_year":111,"session":"","examNo":64,"q":"下列何種人畜共通疾病的發生和家畜的繁殖季節有關？","opts":["A. Q fever","B. salmonellosis","C. leptospirosis","D. tularemia"],"ans":0,"exp":"Q fever（Q熱，由Coxiella burnetii引起）與家畜的繁殖季節密切相關。分娩時的胎盤、胎液、羊水中含有大量Coxiella burnetii，形成高濃度氣溶膠，牧場周邊風險在繁殖季節顯著升高，故Q fever的季節性與牛、羊的繁殖產仔季節有關。","we":["（正確）Q fever的發生與家畜（牛、羊）繁殖季節密切相關，因分娩時胎盤等含大量病原，此答案正確。","沙氏桿菌症（salmonellosis）全年均可發生，與家畜繁殖季節無明顯相關性，夏季較高但非因繁殖。","鉤端螺旋體症（leptospirosis）與雨季、洪水有關（病原在水中存活），非家畜繁殖季節。","土拉倫斯病（tularemia）與野兔季節活動及壁蝨活躍（春夏）有關，非家畜繁殖季節。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_065","year":2022,"roc_year":111,"session":"","examNo":65,"q":"下列何者是感染類鼻疽（melioidosis）的高危險族群？","opts":["A. 常接觸水、泥漿及土壤者","B. 常吃生食者","C. 常接觸馬匹者","D. 常接觸甲殼動物者"],"ans":0,"exp":"類鼻疽（melioidosis）由類鼻疽桿菌（Burkholderia pseudomallei）引起，此菌廣泛存在於熱帶地區的土壤和積水中。主要感染途徑為皮膚傷口接觸污染的土壤、泥漿或水，農夫、建築工人等常接觸水、泥漿及土壤者為高危險族群。","we":["（正確）類鼻疽主要經接觸污染的水、泥漿及土壤（皮膚傷口或吸入）感染，常接觸這類環境者為高危族群。","常吃生食者是食源性疾病（如沙氏桿菌症、E型肝炎）的高危族群，類鼻疽非主要食源性感染。","常接觸馬匹者可能感染鼻疽（glanders）而非類鼻疽，鼻疽由Burkholderia mallei引起。","接觸甲殼動物者的風險疾病包括副溶血弧菌食物中毒、衛氏肺吸蟲等，非類鼻疽。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_066","year":2022,"roc_year":111,"session":"","examNo":66,"q":"屠宰場的工作人員與屠檢獸醫師主要經由那一種傳染途徑感染弓蟲症？","opts":["A. 經由消化道食入","B. 經皮膚傷口或黏膜接觸","C. 經由呼吸道吸入","D. 節肢動物媒介"],"ans":1,"exp":"屠宰場工作人員及屠檢獸醫師的弓蟲感染途徑主要是透過皮膚傷口或黏膜接觸含有速殖子（tachyzoites）或緩殖子的組織液。在屠宰過程中，刀具切割可能造成皮膚傷口，接觸受感染動物（尤其是豬）的組織是職業暴露的主要途徑。","we":["一般民眾經由消化道食入含囊體的肉類可感染弓蟲，但屠宰場工人在屠宰過程中更主要的是職業性皮膚傷口接觸。","（正確）屠宰工作人員主要透過皮膚傷口或黏膜接觸受感染動物組織而感染弓蟲，此為職業性傳播途徑。","弓蟲不透過呼吸道傳播（貓糞乾燥後的卵囊可能有少量吸入風險，但不是屠宰場主要途徑）。","弓蟲不透過節肢動物媒介傳播，其生活史中不需要節肢動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_067","year":2022,"roc_year":111,"session":"","examNo":67,"q":"有關中華肝吸蟲 （Clonorchis sinensis ）的敘述，下列何者正確？","opts":["A. 吸盤位於蟲體首尾兩端","B. 成蟲寄生於肝實質細胞中","C. 人可藉由食用未煮熟之淡水魚而感染","D. 無法藉由糞便檢查蟲卵而確診"],"ans":2,"exp":"中華肝吸蟲（Clonorchis sinensis）的第二中間宿主為淡水魚，人食入含囊狀幼蟲（metacercaria）的未煮熟淡水魚即可感染；成蟲寄生於肝膽管內，糞便中可發現蟲卵，可用糞便檢查蟲卵確診。吸盤位於腹面（不在首尾兩端），成蟲寄生於肝膽管而非肝實質細胞。","we":["吸盤（吸口吸盤和腹吸盤）位於蟲體腹面，不在首尾兩端，此敘述錯誤。","成蟲寄生於肝臟的膽管內（intrahepatic bile ducts），不是肝實質細胞，此敘述錯誤。","（正確）人食入含中華肝吸蟲囊狀幼蟲的未煮熟淡水魚可感染，此為主要感染途徑，正確。","糞便中可找到中華肝吸蟲蟲卵（具有特徵性小蓋），是常用的診斷方法，此敘述錯誤（說無法確診是錯的）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_068","year":2022,"roc_year":111,"session":"","examNo":68,"q":"下列何者是有鈎絛蟲（Taenia solium）的最終宿主？","opts":["A. 豬","B. 牛","C. 羊","D. 人"],"ans":3,"exp":"有鈎絛蟲（Taenia solium，豬肉絛蟲）的最終宿主（definitive host）為人，成蟲寄生於人的小腸中進行有性生殖並產卵。豬為中間宿主（intermediate host），豬食入蟲卵後幼蟲（豬囊蟲/Cysticercus cellulosae）在肌肉中發育。","we":["豬是有鈎絛蟲的中間宿主，豬食入人的糞便中的蟲卵後，幼蟲在肌肉中形成囊體。","牛是無鈎絛蟲（Taenia saginata，牛肉絛蟲）的中間宿主，不是有鈎絛蟲的宿主。","羊不是有鈎絛蟲的主要宿主（無鈎絛蟲也以牛為主要中間宿主）。","（正確）人是有鈎絛蟲（Taenia solium）的最終宿主，成蟲在人的小腸進行有性生殖，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_069","year":2022,"roc_year":111,"session":"","examNo":69,"q":"蔓延性疹（creeping eruption）為一種由寄生蟲幼蟲移行造成的人類皮膚病，可能跟下列那一種寄生蟲有關？","opts":["A. 犬心絲蟲（Dirofilaria immitis）","B. 犬鈎頭蟲（Oncicola canis）","C. 犬鈎蟲（Ancylostoma canis）","D. 犬弓首蛔蟲（Toxocara caninum）"],"ans":2,"exp":"蔓延性疹（creeping eruption，皮膚幼蟲移行症）是由於動物鈎蟲幼蟲在人體皮膚中移行所造成的蛇行性隧道皮疹。犬鈎蟲（Ancylostoma canis）的感染型幼蟲（filariform larvae）可穿透人體皮膚，但無法完成生活史，只能在皮膚層移行造成creeping eruption。","we":["犬心絲蟲（Dirofilaria immitis）幼蟲在人體形成肺部結節（dirofilariasis），不造成皮膚幼蟲移行症。","犬鈎頭蟲（Oncicola canis）為棘頭蟲（acanthocephala），與皮膚幼蟲移行症無關。","（正確）犬鈎蟲（Ancylostoma canis）感染型幼蟲可穿透人體皮膚並在皮膚層移行，造成creeping eruption。","犬弓首蛔蟲（Toxocara canis）幼蟲在人體造成的是內臟幼蟲移行症（visceral larva migrans），而非皮膚蔓延性疹。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_070","year":2022,"roc_year":111,"session":"","examNo":70,"q":"為防範人類感染牛羊肝吸蟲（Fasciola hepatica），應該避免食入下列何種未煮熟的食物？","opts":["A. 魚","B. 水生植物","C. 河蟹","D. 螺螄"],"ans":1,"exp":"牛羊肝吸蟲（Fasciola hepatica）的生活史：毛蚴感染第一中間宿主（淡水螺），釋出尾蚴後附著於水生植物（如水芹、菱角、蓮藕等）上形成囊狀幼蟲（metacercaria）。人或動物食入附著囊狀幼蟲的未煮熟水生植物即可感染，並非魚、河蟹或螺蜆本身。","we":["魚類是中華肝吸蟲（Clonorchis sinensis）的第二中間宿主，非Fasciola hepatica的傳播媒介。","（正確）牛羊肝吸蟲的囊狀幼蟲附著於水生植物，食入未煮熟的水生植物是主要人類感染途徑。","河蟹是衛氏肺吸蟲（Paragonimus westermani）的第二中間宿主，非Fasciola hepatica。","螺螄（淡水螺）是Fasciola hepatica的第一中間宿主，人食入螺後雖有螺內的幼蟲，但囊狀幼蟲附著在水生植物上才是感染人的途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_071","year":2022,"roc_year":111,"session":"","examNo":71,"q":"下列何種人畜共通疾病，一般健康人不易感染或無症狀，但免疫功能不良或缺陷之患者感染，可能會很嚴重\r  甚至死亡？","opts":["A. 瘧疾（malaria）","B. 隱胞子蟲症（cryptosporidiosis）","C. 錐蟲症（trypanosomiasis）","D. 利什曼原蟲症（leishmaniasis）"],"ans":1,"exp":"隱胞子蟲（Cryptosporidium）在一般健康免疫功能正常者只造成自限性腹瀉（數天即自癒），但在免疫功能缺陷者（如HIV患者、器官移植者）可造成慢性嚴重腹瀉，甚至危及生命。這是隱胞子蟲症的重要特徵，為機會性感染的代表性人畜共通疾病。","we":["瘧疾（malaria）即使在健康人也可造成嚴重症狀甚至死亡，並非僅在免疫低下者才嚴重。","（正確）隱胞子蟲症在健康者為自限性輕症，在免疫缺陷者（如愛滋病患）可造成嚴重甚至致命的感染。","錐蟲症（trypanosomiasis）依非洲型（睡眠病）或美洲型（恰加斯病）而異，一般均可造成嚴重症狀，非僅免疫缺陷者。","利什曼原蟲症（leishmaniasis）的內臟型（kala-azar）即使在健康成人也可致命，不是僅限免疫缺陷者嚴重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_072","year":2022,"roc_year":111,"session":"","examNo":72,"q":"依動物傳染病防治條例進行燒燬動物屍體時，下列何者錯誤？","opts":["A. 應於焚化爐為之","B. 緊急時得於野外挖坑燒燬","C. 燒燬場宜近飲用水源地避免火災","D. 燒燬至僅留骨灰並加以掩埋"],"ans":2,"exp":"依動物傳染病防治條例，燒燬動物屍體的場所不得靠近飲用水源地，以防止污染水源；燒燬場應遠離水源、居民區等。「宜近飲用水源地避免火災」的敘述不符合環保及水源保護規定，是明顯錯誤的。","we":["通常應於焚化爐中燒燬，此為正確程序敘述。","緊急時確可於野外挖坑燒燬，法規有彈性規定，此敘述正確。","（正確）燒燬場應遠離飲用水源地以防止污染，「宜近水源」的敘述明顯錯誤，此為錯誤選項。","動物屍體應燒燬至僅留骨灰後加以掩埋，以確保病原完全消滅，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_073","year":2022,"roc_year":111,"session":"","examNo":73,"q":"下列何者為臺灣核准針對雞蝨及雞蟎的動物用藥？","opts":["A. 陶斯松","B. 芬普尼","C. 弗雷拉納","D. 賽滅寧"],"ans":3,"exp":"賽滅寧（Cypermethrin，屬合成除蟲菊酯類pyrethroid）是臺灣核准用於雞蝨及雞蟎控制的動物用藥。陶斯松（Chlorpyrifos）、芬普尼（Fipronil）、弗雷拉納（Fluralaner）在家禽或食用動物的適應症有所不同，芬普尼在歐盟已被限制用於食用動物。","we":["陶斯松（Chlorpyrifos）為有機磷殺蟲劑，在家禽的使用受到限制，且殘留問題較大，非臺灣核准雞用藥。","芬普尼（Fipronil）在食用動物（包括雞）的使用在多國受嚴格限制（曾爆發雞蛋污染事件），非臺灣核准雞用藥。","弗雷拉納（Fluralaner）主要核准用於犬貓的外寄生蟲防治（如Bravecto），非針對家禽雞蝨雞蟎的核准藥物。","（正確）賽滅寧（Cypermethrin）屬合成除蟲菊酯，是臺灣核准用於防治雞蝨及雞蟎的動物用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_074","year":2022,"roc_year":111,"session":"","examNo":74,"q":"下列何種化學藥品不適合用於水質處理之化學沉澱？","opts":["A. 硫酸鋁","B. 硫酸鐵","C. 重鉻酸鉀","D. 小蘇打"],"ans":2,"exp":"水質處理的化學沉澱（混凝沉澱）常用的混凝劑包括硫酸鋁（明礬）、硫酸鐵、氯化鐵、石灰、小蘇打（調pH）等。重鉻酸鉀（K₂Cr₂O₇）是強氧化劑，用於化學需氧量（COD）測定的試劑，六價鉻本身具高毒性，不適合用於水質處理的化學沉澱。","we":["硫酸鋁（明礬，KAl(SO₄)₂）是最常用的混凝劑，可水解形成氫氧化鋁膠體使懸浮物沉澱。","硫酸鐵（FeSO₄或Fe₂(SO₄)₃）可形成氫氧化鐵膠體，用於混凝沉澱處理。","（正確）重鉻酸鉀為強氧化劑且含六價鉻（毒性強），用於COD測定，不適合用於水質處理化學沉澱。","小蘇打（碳酸氫鈉，NaHCO₃）可用於調整水的pH，輔助混凝沉澱過程，可用於水質處理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_075","year":2022,"roc_year":111,"session":"","examNo":75,"q":"大腸桿菌群（coliform group）為水質污染指標，於飲用水水質標準之容許檢出量為何？","opts":["A. 不得檢出","B. 6 MPN／100毫升","C. 100 MPN／100毫升","D. 20,000 MPN／100毫升"],"ans":0,"exp":"依臺灣飲用水水質標準，飲用水中大腸桿菌群（coliform group）的容許量為「不得檢出」（零容許），因大腸桿菌群為糞便污染的指標菌，在飲用水中存在即表示可能受糞便污染，為食安風險。","we":["（正確）飲用水水質標準規定大腸桿菌群不得檢出（zero tolerance），此為正確答案。","6 MPN/100 mL是某些休閒用水（游泳池）的標準，不是飲用水的大腸桿菌群標準。","100 MPN/100 mL為廢水放流水標準範疇，遠超飲用水標準。","20,000 MPN/100 mL是畜牧廢水或灌溉用水的標準，遠超飲用水要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_076","year":2022,"roc_year":111,"session":"","examNo":76,"q":"在三段式養豬廢水處理系統的處理過程中，下列何項處理步驟會產生沼氣（biogas）？","opts":["A. 厭氣發酵","B. 固液分離","C. 好氣處理","D. 堆肥處理"],"ans":0,"exp":"三段式養豬廢水處理系統依序為：①固液分離→②厭氣發酵→③好氣處理。沼氣（biogas，主要成分為甲烷CH₄和CO₂）是在厭氣發酵（anaerobic digestion）過程中，有機物在無氧環境下被厭氣菌分解所產生的，可作為能源利用。","we":["（正確）厭氣發酵槽中有機物在無氧環境下分解產生甲烷為主的沼氣，是產生沼氣的步驟。","固液分離只是物理性分離固體與液體，不涉及有機物的發酵分解，不產生沼氣。","好氣處理是在有氧環境下由好氣菌分解有機物，不產生甲烷；主要產物為CO₂和H₂O。","堆肥處理雖也有有機物分解，但屬於固體廢棄物處理，不是廢水處理三段式流程中的步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_077","year":2022,"roc_year":111,"session":"","examNo":77,"q":"在三段式養豬廢水處理系統之過程中，廢水在厭氣發酵槽中停留的時間大約多久？","opts":["A. 1小時","B. 12小時","C. 1天","D. 10天以上"],"ans":3,"exp":"三段式養豬廢水處理的厭氣發酵槽（anaerobic lagoon/digester）中，有機物的充分分解需要較長時間。廢水在厭氣發酵槽的停留時間（hydraulic retention time, HRT）通常需要10天以上（一般為10-30天），以確保有機物充分分解並產生足量沼氣。","we":["1小時的停留時間遠不足以進行厭氣發酵，有機物幾乎無法分解，沼氣產量極少。","12小時仍不足以完成厭氣發酵的主要分解過程，有機物分解不完全。","1天（24小時）的停留時間不足以完成充分的厭氣發酵，廢水有機物含量仍高。","（正確）厭氣發酵槽的停留時間通常需要10天以上，以確保有機物充分分解並產生沼氣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_078","year":2022,"roc_year":111,"session":"","examNo":78,"q":"生物需氧量（biological oxygen demand, BOD）之定義為：水樣中的微生物在一定條件下，其呼吸作用所消耗\r   的氧氣量（mg/L）。此條件為20℃培養多少時間？","opts":["A. 12小時","B. 1天","C. 3天","D. 5天"],"ans":3,"exp":"生物需氧量（BOD，Biochemical Oxygen Demand）的標準測定條件為：在20℃下培養5天（BOD₅），測量此期間微生物呼吸作用消耗的氧氣量（mg/L）。此為國際通用的BOD測定標準方法（以BOD₅表示）。","we":["12小時不是BOD的標準培養時間，測定結果無法與國際標準比較。","1天（BOD₁）不是標準BOD測定條件，無法代表廢水的有機污染程度。","3天（BOD₃）不是標準測定條件，雖有研究使用，但非國際通用標準。","（正確）BOD標準測定條件為20℃培養5天（BOD₅），此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_079","year":2022,"roc_year":111,"session":"","examNo":79,"q":"依照水污染防治法規定，非草食性動物（豬、雞、鴨、鵝）畜牧場放流水標準中之生物需氧量（BOD）不可\r   超過多少濃度（mg/L）？","opts":["A. 20","B. 80","C. 150","D. 600"],"ans":1,"exp":"依水污染防治法放流水標準，非草食性動物（豬、雞、鴨、鵝）畜牧場放流水的生物需氧量（BOD）上限規定為80 mg/L，此標準適用於豬場、雞場等非草食性畜牧業者的廢水排放管制。","we":["20 mg/L的BOD標準屬於工業廢水某類別限值，非豬雞等非草食性畜牧場放流水標準。","（正確）依放流水標準，豬、雞等非草食性畜牧場放流水的BOD上限為80 mg/L。","150 mg/L是草食性動物（牛羊）畜牧場放流水的BOD限值，非豬雞場的標準。","600 mg/L遠超放流水標準，接近原始廢水濃度，不是放流水的排放限值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_公衛_080","year":2022,"roc_year":111,"session":"","examNo":80,"q":"感染性生物材料依其相關病原體致病危害風險（RG）高低進行分級，下列那一等級的危害風險最高？","opts":["A. 0","B. 1","C. 4","D. 10"],"ans":2,"exp":"感染性生物材料依病原體的危害風險等級（Risk Group, RG）分為RG1至RG4（或BSL1-BSL4），數字越高危害風險越高。RG4（生物安全等級4，BSL-4）的病原具最高危害性，如伊波拉病毒、馬堡病毒等，無有效治療方法且可造成嚴重致命疾病。選項中4為最高等級。","we":["0不是危害風險等級的標準分類，國際上並無RG0的定義。","RG1（Risk Group 1）危害風險最低，通常不引起健康人類疾病（如大腸桿菌K-12株）。","（正確）RG4（Risk Group 4）危害風險最高，包含高度致命且無有效防治方法的病原，如伊波拉病毒。","10不是危害風險等級的標準分類，國際上RG分級只到4。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_001","year":2023,"roc_year":112,"session":"","examNo":1,"q":"下列何者屬於選樣偏差（selection bias）？","opts":["A. 未回應者導致某些資訊無法收集","B. 研究個案未使用相同的診斷方法判定是否罹病","C. 問卷訪視時依調查人員主觀判斷進行勾選危險因子是否有暴露","D. 被研究的個案有不等程度的記憶錯誤"],"ans":0,"exp":"選樣偏差（selection bias）發生於研究對象的選取方式造成樣本無法代表目標族群。未回應者無法提供資訊，使研究樣本偏向回應者，導致選樣偏差。選項B屬於分類偏差，選項C屬於觀察者偏差，選項D屬於回憶偏差，均非選樣偏差。","we":["（正確）未回應者導致某些資訊無法收集，屬於選樣偏差，因為回應者與未回應者可能存在系統性差異。","研究個案未使用相同診斷方法是分類偏差（misclassification bias），不屬於選樣偏差。","調查人員依主觀判斷勾選是觀察者偏差（observer bias），不屬於選樣偏差。","個案有不等程度記憶錯誤是回憶偏差（recall bias），不屬於選樣偏差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_002","year":2023,"roc_year":112,"session":"","examNo":2,"q":"有關描述性數值的統計表達方式，下列敘述何者錯誤？","opts":["A. 盒鬚圖（box-and-whisker plot）方塊之中央橫線代表中位數","B. 餅狀圖（pie chart）為針對連續型資料呈現的有效表達方式","C. 莖葉圖（stem-and-leaf plot）的結果有助於判斷資料是否屬常態分布","D. ROC曲線分析圖是屬於散佈圖（scatter plot）的應用"],"ans":1,"exp":"餅狀圖（pie chart）適合呈現各類別佔整體的比例，用於類別（名義）資料，而非連續型資料。連續型資料應使用直方圖或折線圖等方式呈現。因此選項B的敘述錯誤。","we":["盒鬚圖方塊中央橫線確實代表中位數，此敘述正確。","（正確）餅狀圖適用於類別資料，不適合連續型資料，此敘述錯誤，故為本題答案。","莖葉圖可觀察資料分布形態，確實有助於判斷是否屬常態分布，此敘述正確。","ROC曲線以敏感度對（1-特異度）作圖，確實屬於散佈圖的應用，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_003","year":2023,"roc_year":112,"session":"","examNo":3,"q":"由網站獲得臺灣各縣市H5禽流感病毒陽性養殖場數，亦由網站獲得各縣市進出某疫區之臺商人數，假設分析\r  結果發現兩者呈現正相關，此研究屬於何種流行病學研究法？","opts":["A. 追蹤型研究法（follow-up study）","B. 生態研究法（ecological study）","C. 世代研究法（cohort study）","D. 病例對照研究法（case-control study）"],"ans":1,"exp":"使用縣市層級（county-level）的彙整資料分析兩變數之相關性，屬於以群體為分析單位的生態研究法（ecological study）。此研究沒有追蹤個體、沒有對照組配對，排除追蹤、世代與病例對照研究。","we":["追蹤型研究需追蹤個別動物或個體一段時間，本研究以縣市彙整資料為單位，不符合。","（正確）以縣市為單位分析H5禽流感陽性場數與臺商人數的相關，屬生態研究法。","世代研究需依暴露狀況分組後追蹤發病情形，本研究無個體追蹤設計，不符合。","病例對照研究需有明確病例組與對照組，本研究以縣市資料分析相關性，不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_004","year":2023,"roc_year":112,"session":"","examNo":4,"q":"分析疾病相關危險因子時常使用相對危險性（relative risk）來判斷因果情形，其意義是屬於下列何者？","opts":["A. 相關的強度","B. 正確的時序性","C. 相關的特異性","D. 生物學的贊同性"],"ans":0,"exp":"相對危險性（relative risk, RR）反映暴露組與非暴露組發病率之比值，數值越大代表暴露與疾病的關聯越強，因此RR衡量的是相關的強度（strength of association）。這是Hill因果準則中「相關強度」的評估指標。","we":["（正確）相對危險性衡量相關的強度，RR越大代表暴露與疾病的關聯越強。","正確的時序性（temporality）是指暴露發生在疾病之前，無法單由RR判斷，需研究設計支持。","相關的特異性（specificity）指某暴露只與特定疾病有關，不是RR所衡量的。","生物學的贊同性（biological plausibility）是指機轉是否合理，無法由統計數字反映。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_005","year":2023,"roc_year":112,"session":"","examNo":5,"q":"探討某牧場輪狀病毒感染與仔牛下痢之關係：虛無假說（H0）為感染與病例無關，對立假說（Ha）為有關。\r  經由清楚的病例對照紀錄資料由卡方分析（Chi-square test）計算出值為8.67，查表自由度為1、α=0.05時之顯著 值為3.84，即知p＜0.05。下列何者正確？","opts":["A. 觀察到的差異是機會引起，不具統計學上的意義","B. 該調查有統計學上的意義，接受虛無假說（H0）","C. 該調查有統計學上的意義，拒絕虛無假說（H0）","D. 無法由此結果判斷假說接受與否"],"ans":2,"exp":"卡方值8.67大於顯著值3.84（α=0.05、自由度=1），故p＜0.05。當p＜α時，統計結果具有顯著性，應拒絕虛無假說（H0：無關），接受對立假說（Ha：有關）。","we":["p＜0.05表示觀察到的差異不太可能由機會引起，具有統計學意義，此選項錯誤。","統計上顯著時應拒絕而非接受H0，此選項敘述相反，錯誤。","（正確）卡方值8.67＞3.84，p＜0.05，具統計顯著性，應拒絕虛無假說H0。","卡方值已超過臨界值，可以明確判斷，此選項「無法判斷」錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_006","year":2023,"roc_year":112,"session":"","examNo":6,"q":"動物感染病原體後至出現臨床症狀的時期，可稱之為下列何者？","opts":["A. 潛伏期（incubation period）","B. 潛藏期（latent period）","C. 排菌前期（pre-shedding period）","D. 易感受期（susceptible period）"],"ans":0,"exp":"潛伏期（incubation period）定義為動物感染病原體後到出現臨床症狀的時期。潛藏期（latent period）則是感染後至具有傳染性之間的時期，兩者有所不同。","we":["（正確）潛伏期是感染病原體後至出現臨床症狀的時間，符合題目描述。","潛藏期（latent period）是感染後到可排出病原、具傳染性的時期，不是出現臨床症狀的時期。","排菌前期（pre-shedding period）指尚未開始排菌的時期，與臨床症狀出現無直接定義關係。","易感受期是宿主尚未具備免疫力的狀態，並非描述感染後到症狀出現的時間段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_007","year":2023,"roc_year":112,"session":"","examNo":7,"q":"在一個穩定之地方病（endemic）狀態，每一個原發感染病例平均可產生一個繼發感染病例，代表其「有效複\r  製率」（Re）數值為何？","opts":["A. 100","B. 10","C. 1","D. 0"],"ans":2,"exp":"有效複製率Re定義為在真實族群中每個原發感染病例平均產生的繼發感染病例數。地方病（endemic）狀態下疾病維持穩定，既不增加也不減少，表示每個病例恰好產生1個新病例，故Re=1。","we":["Re=100表示每個病例產生100個繼發病例，會造成疾病大規模爆發，與穩定地方病狀態不符。","Re=10表示疾病持續快速擴散，與穩定地方病狀態不符。","（正確）穩定地方病狀態下每個原發病例產生恰好1個繼發病例，故Re=1。","Re=0表示疾病不再傳播，族群中將不再有新病例，與地方病持續存在的狀態不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_008","year":2023,"roc_year":112,"session":"","examNo":8,"q":"進行研究時給與對照組安慰劑是為了防止下列何種誤差？","opts":["A. 選樣偏差（selection bias）","B. 分類偏差（misclassification bias）","C. 回憶偏差（recall bias）","D. 干擾偏差（confounding bias）"],"ans":1,"exp":"給予對照組安慰劑是為了讓受試者無法判斷自己屬於處理組或對照組，防止因主觀心理效應（安慰劑效應）導致的測量差異，屬於防止分類偏差（misclassification bias）。安慰劑確保對照組的心理狀態與處理組相同，避免因「知道自己沒接受治療」而改變行為或回報症狀。","we":["選樣偏差發生在研究對象的選取階段，使用安慰劑不能解決分組問題。","（正確）給予安慰劑防止對照組因「知道未接受治療」而改變回應，避免分類（測量）偏差。","回憶偏差是受試者回憶過去暴露時產生的偏差，與是否給予安慰劑無關。","干擾偏差需要分層分析或多變量調整來控制，安慰劑無法消除干擾因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_009","year":2023,"roc_year":112,"session":"","examNo":9,"q":"下列何者不是調整干擾因子之最適當方法？","opts":["A. 除去某些具有特殊因素的病例或對照樣本","B. 分層比較（stratification）","C. 標準化（standardization）","D. 再增加研究樣本數目"],"ans":3,"exp":"控制干擾因子的方法包括：排除有特殊因素的樣本（限制）、分層比較、標準化、配對及多變量分析等。單純增加樣本數只能提高統計效力（power），無法消除或調整干擾因子的影響，因此「再增加研究樣本數目」不是調整干擾因子的適當方法。","we":["排除具有特殊因素的病例或對照（限制法）是控制干擾因子的有效方法，此選項正確。","分層比較（stratification）可在各層內分析暴露與疾病的關係，是控制干擾因子的標準方法。","標準化（standardization）可調整群體特性（如年齡）差異，是控制干擾因子的有效方法。","（正確）增加樣本數僅提升統計效力，無法消除干擾因子，是最不適當的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_公衛_010","year":2023,"roc_year":112,"session":"","examNo":10,"q":"臨床試驗中要使得測量與觀察過程不會因分組而有差異，應採用下列何者？","opts":["A. 雙盲程序","B. 隨機分組","C. 長期追蹤","D. 分層分析"],"ans":0,"exp":"雙盲程序（double-blind procedure）使受試者和研究者都不知道分組情況，確保測量與觀察過程不受分組知識影響，防止測量偏差（measurement bias）。隨機分組確保組間特性均衡，但無法防止因知悉分組而產生的觀察差異。","we":["（正確）雙盲程序讓受試者與研究者均不知分組，
