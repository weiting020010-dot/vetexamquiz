血性尿毒症候群（A正確）、主要感染途徑為污染的肉類（B正確）、生食蔬菜亦可感染（C正確）。","we":["EHEC確實可引起溶血性尿毒症候群（HUS），A是正確敘述。","主要感染途徑確實是肉類（特別是生牛絞肉）污染，B是正確敘述。","生食蔬菜（如菠菜）確實可感染EHEC，C是正確敘述。","（正確）EHEC在台灣屬第三類傳染病，需1週內通報，非第一類24小時內通報，D是錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_020","year":2016,"roc_year":105,"session":"2","examNo":20,"q":"動物感染布氏桿菌病之主要症狀為","opts":["A. 腦炎或腦膜腦炎","B. 腸炎與下痢","C. 肺炎","D. 流產或早產"],"ans":3,"exp":"動物感染布氏桿菌病（Brucellosis）的主要症狀為流產或早產（abortion or premature birth），特別是妊娠後期（第二孕期末至第三孕期），以及睪丸炎（公畜）。這是因為布氏桿菌對含有赤藻糖醇（erythritol）豐富的胎盤組織有特殊親和性。","we":["腦炎或腦膜腦炎不是布氏桿菌病的主要臨床表現。","腸炎與下痢不是布氏桿菌病的主要症狀。","肺炎不是布氏桿菌病的主要表現。","（正確）動物感染布氏桿菌病的主要症狀是流產或早產，因病菌對含赤藻糖醇的胎盤有親和性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_021","year":2016,"roc_year":105,"session":"2","examNo":21,"q":"臺灣鹿隻最需特別注意的人畜共通傳染病為","opts":["A. 結核病","B. 布氏桿菌症","C. 炭疽","D. 類鼻疽"],"ans":0,"exp":"台灣鹿隻（包括梅花鹿、水鹿等）最需特別注意的人畜共通傳染病是結核病（Tuberculosis，主要為Mycobacterium bovis）。台灣曾有鹿結核病的疫情，且結核病的慢性特性使其難以察覺，對人類也有感染風險。","we":["（正確）結核病（Mycobacterium bovis）是台灣鹿隻最需注意的人畜共通傳染病，曾有疫情記錄。","布氏桿菌症雖可感染鹿隻，但在台灣鹿群中的風險相對較低。","炭疽在台灣並非主要威脅，且鹿隻不是炭疽的主要感受動物。","類鼻疽在台灣南部有地方性流行，但不是鹿隻最需注意的人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_022","year":2016,"roc_year":105,"session":"2","examNo":22,"q":"下列何種人畜共通傳染病，人類為其病原的原發性自然儲主（reservoirs）？","opts":["A. 志賀桿菌症","B. 沙氏桿菌症","C. 大腸桿菌症","D. 彎曲桿菌症"],"ans":0,"exp":"在列出的選項中，志賀桿菌症（Shigellosis）以人類為原發性自然儲主（primary natural reservoir）。人類是唯一已知的自然宿主，志賀桿菌在自然界不在動物中流行。相較之下，沙氏桿菌、大腸桿菌、彎曲桿菌均有各種動物宿主。","we":["（正確）志賀桿菌症以人類為原發性自然儲主，不在其他動物中持續流行。","沙氏桿菌症有廣泛的動物宿主，包括家禽、爬蟲類等，非人類為主要儲主。","大腸桿菌症有多種動物宿主，特別是牛（O157:H7的主要宿主）。","彎曲桿菌症以家禽（雞、火雞）等動物為主要儲主，而非人類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_023","year":2016,"roc_year":105,"session":"2","examNo":23,"q":"依照人類感染後之臨床症狀，下列何者不是鼠疫的類型？","opts":["A. 腺鼠疫（bubonic plague）","B. 腎鼠疫（renal plague）","C. 肺鼠疫（pneumonic plague）","D. 敗血症型鼠疫（septicemic plague）"],"ans":1,"exp":"根據臨床類型，鼠疫（Plague）分為：腺鼠疫（bubonic plague）、肺鼠疫（pneumonic plague）、敗血症型鼠疫（septicemic plague）三種主要類型，並無「腎鼠疫（renal plague）」這一分類。","we":["腺鼠疫（bubonic plague）是最常見的鼠疫類型，以淋巴結腫大（淋巴腺腫）為特徵。","（正確）腎鼠疫（renal plague）並非正式的鼠疫臨床類型，是不存在的分類。","肺鼠疫（pneumonic plague）是透過飛沫傳播的最危險類型。","敗血症型鼠疫（septicemic plague）是病菌直接進入血液引起全身性感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_024","year":2016,"roc_year":105,"session":"2","examNo":24,"q":"下列何種人畜共通傳染病病原為絕對胞內寄生菌？","opts":["A. 鸚鵡披衣菌（Chlamydophila psittaci）","B. 李斯特菌（Listeria monocytogenes）","C. 土拉倫斯菌（Francisella tularensis）","D. 腸炎沙氏桿菌（Salmonella Enteritidis）"],"ans":0,"exp":"鸚鵡披衣菌（Chlamydophila psittaci）是絕對胞內寄生菌，無法在胞外培養基上生長，必須寄生在宿主細胞內才能複製。李斯特菌可在細胞內外生長，土拉倫斯菌雖偏好胞內但有時可在培養基上生長，腸炎沙氏桿菌是兼性胞內寄生菌。","we":["（正確）鸚鵡披衣菌（Chlamydophila psittaci）是絕對胞內寄生菌，其能量代謝依賴宿主細胞，無法獨立繁殖。","李斯特菌（Listeria monocytogenes）雖可在細胞內存活，但並非絕對胞內寄生。","土拉倫斯菌（Francisella tularensis）雖主要在胞內複製，但可在特殊培養基上生長，並非絕對胞內寄生。","腸炎沙氏桿菌（Salmonella Enteritidis）可在普通培養基上生長，為兼性胞內寄生菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_025","year":2016,"roc_year":105,"session":"2","examNo":25,"q":"下列何種病原會引起搔癢性丘疹狀皮疹而被稱為泳者之癢（swimmer's itch）？","opts":["A. 犬鈎蟲（Ancylostoma caninum）","B. 棘顎口線蟲（Gnathostoma spinigerum）","C. 日本住血吸蟲（Schistosoma japonicum）","D. 糞小桿線蟲（Strongyloides stercoralis）"],"ans":2,"exp":"「泳者之癢」（swimmer's itch，血吸蟲性皮膚炎）是由血吸蟲（Schistosoma）的尾蚴（cercariae）試圖穿透人類皮膚引起的過敏反應，主要由不適合人類的動物血吸蟲（如日本住血吸蟲尾蚴）所引起，造成搔癢性丘疹狀皮疹。","we":["犬鈎蟲（Ancylostoma caninum）引起皮膚幼蟲移行症，表現為蜿蜒的皮下隧道，非泳者之癢的典型皮疹。","棘顎口線蟲（Gnathostoma spinigerum）引起幼蟲移行症，可造成皮下遊走性腫塊。","（正確）日本住血吸蟲（Schistosoma japonicum）的尾蚴穿透皮膚引起搔癢性丘疹狀皮疹，即泳者之癢。","糞小桿線蟲（Strongyloides stercoralis）引起幼蟲移行症（creeping eruption），為蜿蜒爬行疹。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_026","year":2016,"roc_year":105,"session":"2","examNo":26,"q":"食用未熟的蛙、蛇、淡水魚肉，有機會感染下列何種線蟲？","opts":["A. 顎口蟲（Gnathostoma spp.）","B. 旋毛蟲（Trichinella spp.）","C. 肺蟲（Angiostrongylus spp.）","D. 食道蟲（Gongylonema spp.）"],"ans":0,"exp":"食用未熟的蛙、蛇、淡水魚肉可感染顎口蟲（Gnathostoma spp.），這些動物是顎口蟲的第二中間宿主或轉續宿主（paratenic host）。人類感染後，顎口蟲幼蟲在皮下或內臟遊走，引起皮膚幼蟲移行症或嗜酸性腦膜炎。","we":["（正確）食用未熟的蛙、蛇、淡水魚等可感染顎口蟲（Gnathostoma spp.），因為這些動物是其中間/轉續宿主。","旋毛蟲（Trichinella）主要從食用未熟的豬肉或野生動物肉感染，蛙蛇非主要來源。","肺蟲（Angiostrongylus）主要由食用生蝸牛或受污染的蔬菜感染，非蛙蛇魚。","食道蟲（Gongylonema）感染極罕見，通常因誤食受感染的昆蟲（如甲蟲、蟑螂）而感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_027","year":2016,"roc_year":105,"session":"2","examNo":27,"q":"牛羊肝蛭之感染來源是","opts":["A. 飲水","B. 水生植物","C. 陸生植物","D. 空氣感染"],"ans":1,"exp":"牛羊肝蛭（Fasciola hepatica/gigantica）的感染來源是水生植物（特別是水芹菜等水生植物）上附著的囊狀幼蟲（metacercaria）。囊狀幼蟲由螺螄（如Galba/Lymnaea屬螺類）釋出後附著在水生植物上，動物或人食用這些水生植物後感染。","we":["飲水不是肝蛭的主要感染途徑，囊狀幼蟲主要附著在植物上而非自由游泳於水中。","（正確）牛羊肝蛭的感染主要透過食用附著囊狀幼蟲的水生植物，如水芹菜等。","陸生植物通常不是肝蛭的主要感染來源，因為中間宿主螺類需要水環境。","空氣感染不是寄生蟲的傳播方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_028","year":2016,"roc_year":105,"session":"2","examNo":28,"q":"下列何者為非洲昏睡病（African trypanosomiasis）的媒介者？","opts":["A. 采采蠅","B. 熱帶家蚊","C. 埃及斑蚊","D. 蚤"],"ans":0,"exp":"非洲昏睡病（African trypanosomiasis，African sleeping sickness）是由布氏錐蟲（Trypanosoma brucei）引起的，其唯一媒介是采采蠅（tsetse fly，Glossina屬）。采采蠅是一種吸血蠅，廣泛分布於撒哈拉以南非洲。","we":["（正確）采采蠅（Glossina屬）是非洲昏睡病唯一的傳播媒介，廣泛分布於非洲撒哈拉以南地區。","熱帶家蚊（Culex quinquefasciatus）是絲蟲病（淋巴絲蟲病）的媒介，不傳播非洲昏睡病。","埃及斑蚊（Aedes aegypti）是登革熱、黃熱病等的媒介，不傳播錐蟲病。","蚤（flea）主要傳播鼠疫、跳蚤性絛蟲等，不傳播非洲昏睡病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_029","year":2016,"roc_year":105,"session":"2","examNo":29,"q":"人或動物如果接受過下列何種手術，會顯著增加對焦蟲的感受性？","opts":["A. 切除膽囊","B. 切除腎臟","C. 切除脾臟","D. 切除肝臟"],"ans":2,"exp":"脾臟切除（splenectomy）會顯著增加對焦蟲（Babesia）的感受性，因為脾臟是清除紅血球內焦蟲的主要免疫器官，脾臟的過濾功能對控制焦蟲症至關重要。脾臟切除後的患者感染焦蟲可能引起嚴重的致命性感染。","we":["切除膽囊不影響對焦蟲的免疫防禦，膽囊與免疫功能無直接關係。","切除腎臟可影響整體健康，但不特別增加對焦蟲的感受性。","（正確）切除脾臟顯著增加對焦蟲的感受性，因脾臟是清除胞內寄生蟲（如焦蟲）的主要器官。","切除肝臟不是焦蟲感受性增加的主要原因，且肝臟不可完全切除。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_030","year":2016,"roc_year":105,"session":"2","examNo":30,"q":"人類在生吃魚肉後出現腸阻塞、消化障礙與惡性貧血等症狀，下列何者為最有可能感染之寄生蟲？","opts":["A. 海獸胃線蟲","B. 橫川吸蟲","C. 廣節裂頭絛蟲","D. 中華肝吸蟲"],"ans":2,"exp":"廣節裂頭絛蟲（Diphyllobothrium latum）是感染人類最大的絛蟲，人類因食用含有第二期幼蟲（plerocercoid）的生魚或未熟魚肉而感染。成蟲寄生於小腸，可引起腸阻塞、消化障礙，且因與宿主競爭維生素B12導致惡性貧血（megaloblastic anemia）。","we":["海獸胃線蟲（Anisakis）主要引起胃或腸壁的嗜酸性肉芽腫，不引起惡性貧血。","橫川吸蟲（Metagonimus）感染一般症狀輕微，主要引起腸炎，不引起惡性貧血。","（正確）廣節裂頭絛蟲（Diphyllobothrium latum）感染可引起腸阻塞、消化障礙及惡性貧血（維生素B12吸收障礙）。","中華肝吸蟲（Clonorchis sinensis）主要寄生於膽管，引起膽管炎，不引起惡性貧血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_031","year":2016,"roc_year":105,"session":"2","examNo":31,"q":"人類攝食加熱不完全的豬肉，最有可能感染下列何種寄生蟲？","opts":["A. 無鈎絛蟲（Taenia saginata）","B. 有鈎絛蟲（Taenia solium）","C. 縮小包膜絛蟲（Hymenolepis diminuta）","D. 短小包膜絛蟲（Hymenolepis nana）"],"ans":1,"exp":"有鈎絛蟲（Taenia solium，豬肉絛蟲）的中間宿主是豬，蟲卵在豬體內孵化為六鈎幼蟲，進入肌肉形成囊尾蚴（cysticercus cellulosae）。人食用含囊尾蚴的未熟豬肉後，在腸道發育為成蟲，引起豬肉絛蟲症。","we":["無鈎絛蟲（Taenia saginata，牛肉絛蟲）的中間宿主是牛，感染途徑為食用未熟牛肉，非豬肉。","（正確）有鈎絛蟲（Taenia solium）的中間宿主是豬，食用含囊尾蚴的未熟豬肉可感染成人絛蟲症。","縮小包膜絛蟲（Hymenolepis diminuta）以昆蟲（如鼠蚤、甲蟲）為中間宿主，非豬肉傳播。","短小包膜絛蟲（Hymenolepis nana）可直接感染，或透過昆蟲中間宿主，不需要豬肉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_032","year":2016,"roc_year":105,"session":"2","examNo":32,"q":"從人畜共通感染的觀點，人感染到動物來源之蛔蟲，所造成的胃腸不適，以下列何者居多？","opts":["A. Ascaris lumbricoides","B. Ascaris suum","C. Neoascaris vitulorum","D. Ascaris galli"],"ans":1,"exp":"從人畜共通感染的觀點，人感染到動物蛔蟲中，豬蛔蟲（Ascaris suum）是最常見引起胃腸不適的物種，因為豬蛔蟲與人蛔蟲基因相似度高，且人與豬接觸機會多。豬蛔蟲在人體內可短暫移行，引起消化道症狀。","we":["Ascaris lumbricoides是人蛔蟲，屬於人對人的傳播，非動物來源的人畜共通感染。","（正確）Ascaris suum（豬蛔蟲）是最常見從動物傳播給人類並引起胃腸不適的蛔蟲。","Neoascaris vitulorum（牛蛔蟲）主要感染牛犢，人類感染罕見。","Ascaris galli（雞蛔蟲）感染禽類，人類感染極罕見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_033","year":2016,"roc_year":105,"session":"2","examNo":33,"q":"食用煮熟豬肉可避免下列何種病原感染？","opts":["A. Streptococcus suis type 2","B. Orientia tsutsugamushi","C. Coxiella burnetii","D. Bartonella henselae"],"ans":0,"exp":"Streptococcus suis type 2（豬鏈球菌第2型）是最常見引起人類感染的豬鏈球菌，主要透過接觸受感染豬隻的血液、體液或食用未煮熟的豬肉感染。充分煮熟豬肉可有效滅殺病菌，預防感染。","we":["（正確）Streptococcus suis type 2可透過食用未煮熟豬肉感染，煮熟可預防。","恙蟲（Orientia tsutsugamushi）由恙蟲（chigger mite）叮咬傳播，與豬肉無關。","Coxiella burnetii（Q熱）主要藉由吸入傳播，煮熟豬肉不能有效預防（因為主要傳播途徑不是食肉）。","Bartonella henselae（貓抓病）由貓抓傷傳播，與豬肉無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_034","year":2016,"roc_year":105,"session":"2","examNo":34,"q":"生食海產魚類，感染下列何種寄生蟲的風險最高？","opts":["A. 日本住血吸蟲","B. 安尼線蟲","C. 巴貝氏蟲","D. 隱胞子蟲"],"ans":1,"exp":"生食海產魚類感染安尼線蟲（Anisakis spp.，海獸胃線蟲）的風險最高。安尼線蟲的第三期幼蟲存在於許多海魚（如鮭魚、鮪魚、鯖魚等）的肌肉組織中，生食或半生食魚肉可導致感染，引起胃或腸道的嗜酸性肉芽腫。","we":["日本住血吸蟲（Schistosoma japonicum）透過接觸淡水而感染，非海產魚類。","（正確）安尼線蟲（Anisakis）幼蟲廣泛存在於海魚肌肉中，生食海魚是最主要的感染途徑。","巴貝氏蟲（Babesia）由壁蝨傳播，不存在於魚類中。","隱胞子蟲（Cryptosporidium）主要透過糞口傳播（污染水源），不由海產魚類傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_035","year":2016,"roc_year":105,"session":"2","examNo":35,"q":"下列有關肉毒桿菌中毒的敘述，何者錯誤？","opts":["A. 肉毒桿菌中毒病人因會出現人與人之間的直接感染，因此中毒個案須隔離","B. 食用煙燻或真空包裝的食品，食用前應依製造商指示充分加熱","C. 操作此菌之工作人員均須在生物安全第二等級之實驗室操作","D. 因孢子在自然界廣於存在，一歲以下嬰兒避免餵食蜂蜜"],"ans":0,"exp":"肉毒桿菌中毒（botulism）是由肉毒毒素（botulinum toxin）引起的中毒，不是感染性疾病，毒素不在人與人之間傳播，因此不需要隔離患者。選項B（加熱）正確，因孢子耐熱但毒素可被加熱破壞；選項C（BSL-2）可商榷但操作含活菌是安全考量；選項D（嬰兒蜂蜜）正確，因嬰兒腸道中孢子可萌發產生毒素。","we":["（正確）肉毒桿菌中毒是毒素性疾病，無人傳人感染，不需要隔離，A是錯誤敘述。","食用煙燻或真空包裝食品前依指示充分加熱，可破壞肉毒毒素（80°C 10分鐘或100°C 1分鐘），B是正確敘述。","肉毒桿菌屬生物安全第二級（BSL-2），操作需適當防護，C基本正確。","一歲以下嬰兒避免餵食蜂蜜是正確建議，因蜂蜜可能含孢子，嬰兒腸道中孢子可萌發產生毒素，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_036","year":2016,"roc_year":105,"session":"2","examNo":36,"q":"牛隻屠宰後，其屠體肌肉內的蛋白分解酵素可自行分解一些蛋白質為胺基酸，游離於肉中，經烹調後增加風味，此現象稱之\r 為","opts":["A. 肉熟成","B. 肉的僵直","C. 腐敗","D. 酸敗"],"ans":0,"exp":"肉熟成（ageing/conditioning of meat）是指屠宰後，屠體肌肉內的內源性蛋白分解酵素（如鈣蛋白酶cathepsin等）自行分解肌肉蛋白質（特別是結締組織），使肌肉變嫩，並將蛋白質分解為胺基酸，增加風味。這是肉品加工的重要品質改善過程。","we":["（正確）肉熟成（ageing）是指屠宰後內源性酵素分解蛋白質為胺基酸，增加風味、嫩化肉質的過程。","肉的僵直（rigor mortis）是ATP耗盡後肌動蛋白與肌球蛋白不可逆結合，導致肌肉變硬，不是產生胺基酸的過程。","腐敗是微生物分解蛋白質引起，產生有害物質，與肉熟成不同。","酸敗是脂肪氧化引起，與蛋白質分解無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_037","year":2016,"roc_year":105,"session":"2","examNo":37,"q":"下列何者為引起食媒性李斯特菌感染症爆發所常見的來源食品？","opts":["A. 豬肉鬆","B. 保久乳產品","C. 真空包裝豆干","D. 軟質乳酪"],"ans":3,"exp":"食媒性李斯特菌感染症（Listeriosis）爆發常見的食品來源是軟質乳酪（soft cheese，如Brie、Camembert等），因為李斯特菌可在低溫（4-10°C）下生長，在這類含水量高的軟質乳酪中容易繁殖，且通常不需加熱即食用。","we":["豬肉鬆加工溫度高，且水活性低，不利李斯特菌生長。","保久乳已經過高溫滅菌，不利李斯特菌存活。","真空包裝豆干雖有特殊環境，但並非李斯特菌感染症爆發的常見食品。","（正確）軟質乳酪是李斯特菌感染症爆發最常見的食品來源，因其高水活性且低溫保存時李斯特菌可生長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_038","year":2016,"roc_year":105,"session":"2","examNo":38,"q":"下列敘述何者不是常見食物媒介疾病（food-borne illness）範圍？","opts":["A. 以節肢動物為生物性傳播病媒","B. 食物本身就具有毒素","C. 有毒化學物污染食物","D. 病原微生物污染了食物後經口感染之疾病"],"ans":0,"exp":"食物媒介疾病（food-borne illness）是指透過食物攝入而導致的疾病，包括：食物本身的毒素（如河豚毒）、化學物污染（如農藥）、或病原微生物污染食物後的感染。以節肢動物為生物性傳播病媒（如蚊子傳播瘧疾）不屬於食物媒介疾病的範疇，這類疾病是「媒介傳播疾病」而非食物媒介。","we":["（正確）以節肢動物為生物性傳播病媒（如蚊媒傳播）屬於媒介傳播疾病，不屬於食物媒介疾病的範疇。","食物本身就具有毒素（如河豚毒素、某些植物毒素）確屬食物媒介疾病。","有毒化學物污染食物（如農藥殘留、重金屬）屬於食物媒介疾病（化學性食物中毒）。","病原微生物污染食物後經口感染是食物媒介疾病的最典型定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_039","year":2016,"roc_year":105,"session":"2","examNo":39,"q":"優良農產品蛋品項目驗證基準中規定，對皮蛋產品微生物檢驗未包括下列何者？","opts":["A. 生菌數","B. 沙氏桿菌","C. 肉毒桿菌","D. 金黃色葡萄球菌"],"ans":2,"exp":"皮蛋（preserved egg）在製作過程中經過強鹼（NaOH或鹼灰）處理，pH極高，能有效抑制沙氏桿菌和金黃色葡萄球菌的生長，且蛋殼完整。優良農產品蛋品驗證基準中，皮蛋的微生物檢驗項目包括生菌數和沙氏桿菌，及金黃色葡萄球菌，但肉毒桿菌並不在皮蛋的標準檢驗項目中（因強鹼環境不利其生長）。","we":["生菌數是皮蛋的基本微生物衛生指標，列為檢驗項目。","沙氏桿菌是食品安全的重要指標，列為皮蛋的檢驗項目。","（正確）肉毒桿菌並非皮蛋驗證基準中的規定檢驗項目，因強鹼環境不利其孢子萌發及毒素產生。","金黃色葡萄球菌列為皮蛋的微生物衛生指標之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_040","year":2016,"roc_year":105,"session":"2","examNo":40,"q":"食用海鮮魚貝類產品，下列何種病原菌感染的風險最大？","opts":["A. 鈎端螺旋菌","B. 土拉倫斯菌","C. 結核分枝桿菌","D. 創傷性弧菌"],"ans":3,"exp":"食用海鮮魚貝類產品，感染風險最大的病原菌是創傷性弧菌（Vibrio vulnificus），特別對免疫力低下者（如肝病患者）可引起致命的菌血症和壞死性筋膜炎。此菌廣泛存在於沿海溫暖水域的海鮮中，特別是牡蠣、蚌類等。","we":["鈎端螺旋菌（Leptospira）主要透過皮膚接觸受污染的水/土壤傳播，非海鮮直接攝食感染。","土拉倫斯菌（Francisella tularensis）不是海鮮中的常見病原菌。","結核分枝桿菌（Mycobacterium tuberculosis）主要透過飛沫傳播，不是海鮮食品的主要病原。","（正確）創傷性弧菌（Vibrio vulnificus）廣泛存在於海鮮（特別是牡蠣）中，食用海鮮感染風險最大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_041","year":2016,"roc_year":105,"session":"2","examNo":41,"q":"下列何種細菌，當於食品中增殖達10 7 cfu/g菌量後，才會引起食物中毒？","opts":["A. 魏氏桿菌（Clostridium perfrigens）","B. 仙人掌菌（Bacillus cereus）","C. 腸炎弧菌（Vibrio parahemolyticus）","D. 肉毒桿菌（Clostridium botulinum）"],"ans":0,"exp":"魏氏桿菌（Clostridium perfringens，即產氣莢膜梭菌）引起食物中毒的機制是：細菌在食品中大量增殖（達到10^7 cfu/g或更多），隨食物攝入後在腸道中形成芽孢過程中釋放腸毒素（enterotoxin），引起腹瀉和腹痛。需要達到一定菌量才能致病。","we":["（正確）魏氏桿菌（C. perfringens）需在食品中增殖至10^7 cfu/g以上，食入後在腸道釋放毒素才能引起食物中毒。","仙人掌菌（Bacillus cereus）的嘔吐型毒素（cereulide）可在較低菌量時在食品中預先形成，不需要到10^7才中毒。","腸炎弧菌（Vibrio parahaemolyticus）致病菌量約10^5-10^7，感染型腸炎。","肉毒桿菌（Clostridium botulinum）在食品中預先產生毒素，即使少量毒素也可致病，不需要大量菌體存在。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_042","year":2016,"roc_year":105,"session":"2","examNo":42,"q":"依食品安全衛生管理法第17條訂定的「牛羊豬及家禽可食性內臟重金屬限量標準」之鉛限量為多少ppm？","opts":["A. 1.0","B. 0.5","C. 0.1","D. 0.05"],"ans":1,"exp":"根據食品安全衛生管理法第17條訂定的「牛羊豬及家禽可食性內臟重金屬限量標準」，鉛（Pb）的限量標準為0.5 ppm（mg/kg）。這是台灣對可食性內臟（肝、腎等）的特定重金屬安全標準。","we":["1.0 ppm高於現行標準，不符合規定。","（正確）可食性內臟的鉛限量標準為0.5 ppm，這是台灣食品安全法規的規定。","0.1 ppm低於實際標準，過於嚴格。","0.05 ppm遠低於實際標準，不符合規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_043","year":2016,"roc_year":105,"session":"2","examNo":43,"q":"下列何種藥物在雞蛋中有訂定最高殘留容許量（maximum residue limit）？","opts":["A. 必利美達民（pyrimethamine）","B. 乃卡巴精（nicarbazin）","C. 硝基呋喃類（nitrofurantoins）","D. 康黴素 (kanamycin)"],"ans":3,"exp":"在雞蛋中有訂定最高殘留容許量（MRL）的藥物是康黴素（kanamycin），屬胺基配醣體類抗生素。必利美達民（pyrimethamine）、乃卡巴精（nicarbazin）、硝基呋喃類（nitrofurantoins）在雞蛋中不得檢出（zero tolerance），不訂定MRL；康黴素有具體MRL值。","we":["必利美達民（pyrimethamine）在雞蛋中不得檢出，無MRL。","乃卡巴精（nicarbazin）殘留可影響孵化率，在雞蛋中有嚴格限制或不得檢出。","硝基呋喃類（nitrofurantoins）屬禁用藥物類別，在動物性食品中不得檢出。","（正確）康黴素（kanamycin）在雞蛋中有訂定MRL，是胺基配醣體類抗生素中有具體標準的藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_044","year":2016,"roc_year":105,"session":"2","examNo":44,"q":"常見乾燥保存的魚乾、肉乾、肉鬆等食物，其含水量都在多少%以下？","opts":["A. 38","B. 35","C. 28","D. 18"],"ans":3,"exp":"乾燥保存的食物（如魚乾、肉乾、肉鬆等）其含水量通常在18%以下，水活性（water activity, aw）控制在0.85以下，以抑制大多數微生物的生長，達到防腐效果。","we":["38%含水量過高，這樣的食品無法達到乾燥防腐的效果。","35%含水量仍偏高，大多數微生物仍可生長。","28%含水量接近臨界值，部分微生物仍可能生長。","（正確）乾燥保存食品含水量通常在18%以下，水活性低，能有效抑制微生物生長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_045","year":2016,"roc_year":105,"session":"2","examNo":45,"q":"下列何種魚媒介類病原菌在污染人類食物後，會造成人類水樣下痢（如洗米水）與嘔吐呈現脫水現象，若不治療，則常在24小\r 時內死亡？","opts":["A. Vibrio anguillarum","B. Vibrio cholerae","C. Shigella dysenteriae","D. Salmonella Typhi"],"ans":1,"exp":"洗米水樣下痢（rice-water stool）與嘔吐、嚴重脫水是霍亂的典型臨床表現。Vibrio cholerae分泌的霍亂毒素（cholera toxin）激活腸細胞的腺苷酸環化酶，導致大量電解質和水分分泌，24小時內可因脫水死亡。","we":["Vibrio anguillarum是魚類病原菌，不引起人類霍亂樣疾病。","（正確）Vibrio cholerae（霍亂弧菌）引起洗米水樣腹瀉與嚴重嘔吐，不治療可在24小時內死亡。","Shigella dysenteriae引起痢疾（黏液血便），不是洗米水樣腹瀉。","Salmonella Typhi引起傷寒，以發燒、玫瑰疹為主要表現，不是洗米水樣腹瀉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_046","year":2016,"roc_year":105,"session":"2","examNo":46,"q":"家畜疑有全身性豬丹毒，經判定為疑畜者，應依屠宰衛生檢查獸醫師指示進行下列何種處置？","opts":["A. 宰殺","B. 緊急屠宰","C. 廢棄","D. 稽留"],"ans":3,"exp":"根據屠宰衛生檢查規則，家畜疑有全身性豬丹毒（systemic erysipelas），經判定為疑畜時，應依屠宰衛生檢查獸醫師指示進行「稽留」（detention），即暫時扣押不得屠宰，待進一步檢查確認後再做處置決定。","we":["宰殺是對確認為廢棄動物的處置，不是疑畜的第一步。","緊急屠宰是針對因意外受傷或緊急狀況動物的特殊處置，不適用於疑似傳染病的疑畜。","廢棄是確認不可食用後的最終處置，在確認前不可直接廢棄。","（正確）疑畜應先進行「稽留」，由屠宰衛生檢查獸醫師進行進一步檢查，確診後再決定處置方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_047","year":2016,"roc_year":105,"session":"2","examNo":47,"q":"檢查為合格之屠體及內臟或其包裝容器，應標明屠宰衛生檢查合格標誌，此合格標誌及標明方法由下列何者定之？","opts":["A. 中央主管機關","B. 各直轄市或縣（市）主管機關","C. 財團法人中央畜產會","D. 各屠宰場自行設計並報中央主管機關核定"],"ans":0,"exp":"根據屠宰衛生檢查規則，屠宰衛生檢查合格標誌（包括圖示和標明方法）由中央主管機關（農委會）定之，以確保全國標準統一，消費者能識別合格產品。","we":["（正確）屠宰衛生檢查合格標誌由中央主管機關（農業委員會）統一制定，以維持全國標準一致。","各直轄市或縣市主管機關負責執行屠宰檢查，但不能自行制定合格標誌格式。","財團法人中央畜產會不是法定的標誌制定機關。","屠宰場不能自行設計合格標誌，必須統一由中央主管機關制定，即使報備核定也不符合規定的程序。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_048","year":2016,"roc_year":105,"session":"2","examNo":48,"q":"在30℃環境之下，金黃色葡萄球菌約需多少時間才可產生足夠的毒素使人中毒？","opts":["A. 1～3小時","B. 5～6小時","C. 7～9小時","D. 24小時"],"ans":1,"exp":"金黃色葡萄球菌（Staphylococcus aureus）食物中毒的毒素（enterotoxin）預先在食品中形成。在30°C下，葡萄球菌約需5-6小時增殖至足夠菌量並產生足以致病的腸毒素。低於此溫度所需時間更長，高於此溫度可更快。","we":["1-3小時在30°C條件下通常不足以使葡萄球菌產生足夠的腸毒素引起中毒。","（正確）在30°C下，金黃色葡萄球菌約需5-6小時增殖並產生足量腸毒素引起食物中毒。","7-9小時雖然可產生毒素，但實際上5-6小時已足夠，且此選項描述的是較長時間。","24小時是很長的時間，在食品工業中早已超出安全溫度存放的時限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_049","year":2016,"roc_year":105,"session":"2","examNo":49,"q":"下列有關屠宰衛生檢查規則之敘述，何者錯誤？","opts":["A. 屠宰衛生檢查，包括家畜、家禽在屠宰場內之屠前、屠後檢查及其他有關檢查工作","B. 屠宰場應分開展示屠體及內臟，以供屠宰衛生檢查獸醫師執行檢查","C. 家畜、家禽於施行屠前檢查前，應經充分之繫留","D. 疑畜、疑禽應隔離屠宰或應於當日所有屠前檢查合格之家畜、家禽屠宰後再進行屠宰"],"ans":3,"exp":"根據屠宰衛生檢查規則，疑畜、疑禽應在隔離設施中屠宰，且必須在當日所有屠前檢查合格之家畜、家禽屠宰完畢後才能進行屠宰，兩項條件必須同時符合，而非二選一（OR）。選項D以「或」字連接，使其成為可任選一條件，是錯誤的描述。","we":["選項A（屠宰衛生檢查包括屠前、屠後檢查及其他相關工作）是正確的描述。","選項B（屠宰場應分開展示屠體及內臟供檢查）是正確規定。","選項C（家畜、家禽施行屠前檢查前應經充分繫留）是正確規定，動物需休息後再接受檢查。","（正確）選項D錯誤：疑畜不是「隔離屠宰OR最後屠宰」的二選一，而是必須在隔離設施中且在合格動物屠宰完後才能屠宰，兩條件缺一不可。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_050","year":2016,"roc_year":105,"session":"2","examNo":50,"q":"關於家畜屠宰場設施中之預冷室，下列敘述何者錯誤？","opts":["A. 牆壁應以淺色不透水材料敷設，地面應有良好之排水設施","B. 其空間應能維持每二公尺吊軌吊掛豬體六頭以下或牛體三頭以下","C. 預冷設施應使屠體中心溫度於屠後十八小時內降至攝氏零下二十度","D. 預冷室室溫應平均分布並維持在攝氏零至五度"],"ans":2,"exp":"根據屠宰場設置標準（家畜部分），預冷室的預冷設施應使屠體中心溫度於屠後24小時（非18小時）內降至攝氏7度（或4度）以下，而非降至-20度（-20度是冷凍庫的溫度要求）。選項C同時錯誤在時間（18小時）和溫度（-20度）。","we":["預冷室牆壁應以淺色不透水材料敷設，地面有良好排水設施，A是正確描述。","每兩公尺吊軌吊掛豬體六頭以下或牛體三頭以下，B是正確描述。","（正確）選項C錯誤：應是在屠後24小時內降至攝氏7度（或4度）以下，而非18小時降至-20度。","預冷室室溫應平均分布並維持在攝氏零至五度，D是正確描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_052","year":2016,"roc_year":105,"session":"2","examNo":52,"q":"下列對於高溫高壓滅菌法處理操作何者錯誤？","opts":["A. 感染性醫療廢棄物滅菌鍋應為專用，不可與醫療器械混合使用","B. 滅菌鍋操作條件為121℃以上、15 psi以上、加熱時間60分鐘以上","C. 滅菌鍋操作條件為135℃以上、31 psi以上、加熱時間45分鐘以上","D. 滅菌處理以枯草桿菌芽孢或葡萄球菌毒素做為效能評估"],"ans":3,"exp":"高溫高壓滅菌法（autoclave）的效能評估應使用嗜熱脂肪芽孢桿菌（Geobacillus stearothermophilus，舊稱Bacillus stearothermophilus）的芽孢，而非枯草桿菌芽孢。枯草桿菌用於乾熱滅菌的效能評估。選項D的「葡萄球菌毒素」更是不相關的指標，毒素不適合用於滅菌效能評估。","we":["選項A（感染性醫療廢棄物滅菌鍋應專用）是正確的安全操作規範。","選項B（121°C以上、15 psi以上、60分鐘以上）針對廢棄物滅菌的較嚴格要求，在某些規範中是正確的。","選項C（135°C以上、31 psi以上、45分鐘以上）是快速滅菌循環的條件，在特定規範中是正確的。","（正確）選項D錯誤：高溫高壓滅菌效能評估應使用嗜熱脂肪芽孢桿菌（Geobacillus stearothermophilus）的孢子，而非枯草桿菌孢子或葡萄球菌毒素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_053","year":2016,"roc_year":105,"session":"2","examNo":53,"q":"活性污泥法係用來處理環境廢水過程之一種，其構成活性污泥之要素有那些？①厭氣性微生物群 ②好氣性微生物群 ③溶氧\r ④有機物","opts":["A. ①②③","B. ②③④","C. ①②④","D. ①③④"],"ans":1,"exp":"活性污泥法（activated sludge process）是好氧生物處理方法，構成活性污泥的要素包括：②好氣性微生物群（aerobic microorganisms）、③溶氧（dissolved oxygen）、④有機物（organic matter）。厭氣性微生物①不是活性污泥法的要素，因為活性污泥需要曝氣維持好氧環境。","we":["①②③組合包含厭氣性微生物，而活性污泥法是好氧系統，不含厭氣性微生物群。","（正確）②好氣性微生物群、③溶氧、④有機物是活性污泥法的三個核心要素，構成好氧生物降解系統。","①②④組合包含厭氣性微生物，不符合活性污泥法的好氧本質。","①③④組合包含厭氣性微生物，且無好氣性微生物，不符合活性污泥法的原理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_054","year":2016,"roc_year":105,"session":"2","examNo":54,"q":"下列何者屬於放流水標準中所稱之畜牧業(一) 之飼養動物？","opts":["A. 牛","B. 馬","C. 兔","D. 雞"],"ans":3,"exp":"根據台灣放流水標準，畜牧業（一）指飼養豬、雞、鴨、鵝、火雞等動物，而不包括牛、馬、兔等。雞（chicken）屬於畜牧業（一）的飼養動物。牛和馬屬於畜牧業（二）（草食動物），兔在某些規定中有獨立分類。","we":["牛屬於畜牧業（二），指草食動物，不屬於畜牧業（一）。","馬屬於畜牧業（二），指草食動物，不屬於畜牧業（一）。","兔有時有獨立的分類規範，不一定歸屬畜牧業（一）。","（正確）雞屬於畜牧業（一）的飼養動物，與豬、鴨、鵝、火雞等同類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_055","year":2016,"roc_year":105,"session":"2","examNo":55,"q":"下列那一個疾病在2011年由世界動物衛生組織宣布已從全世界撲滅？","opts":["A. 天花（smallpox）","B. 結核病（tuberculosis）","C. 牛瘟（rinderpest）","D. 非洲馬疫（African horse sickness）"],"ans":2,"exp":"牛瘟（rinderpest）於2011年5月25日被世界動物衛生組織（OIE）和聯合國糧農組織（FAO）正式宣布已從全世界撲滅，是繼天花之後第二種被撲滅的傳染病，也是首種被撲滅的動物傳染病。","we":["天花（smallpox）於1980年由WHO宣布撲滅，早於2011年，且屬人類疾病非OIE的管轄範疇。","結核病（tuberculosis）目前仍廣泛存在，尚未被撲滅。","（正確）牛瘟（rinderpest）於2011年由OIE和FAO正式宣布已從全世界撲滅，是重大的動物防疫里程碑。","非洲馬疫（African horse sickness）目前仍在部分地區流行，尚未被撲滅。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_056","year":2016,"roc_year":105,"session":"2","examNo":56,"q":"下列那一個單位不是與動物疫病或動物產品貿易規範相關的國際組織？","opts":["A. World Organization for Animal Health","B. Food and Agriculture Organization","C. National Institutes of Health","D. World Trade Organization"],"ans":2,"exp":"與動物疫病或動物產品貿易規範相關的國際組織包括：OIE（世界動物衛生組織）、FAO（聯合國糧農組織）、WTO（世界貿易組織，有SPS協定）。National Institutes of Health（NIH，美國國立衛生研究院）是美國政府的生物醫學研究機構，不是與動物疫病貿易規範相關的國際組織。","we":["World Organization for Animal Health（OIE/WOAH）是動物疫病相關的核心國際組織，負責動物健康標準。","Food and Agriculture Organization（FAO）與動物疫病防治和食品貿易標準密切相關。","（正確）National Institutes of Health（NIH）是美國政府的生物醫學研究機構，不是與動物疫病或動物產品貿易規範相關的國際組織。","World Trade Organization（WTO）透過SPS協定規範動物產品的貿易規則，與動物疫病貿易密切相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_057","year":2016,"roc_year":105,"session":"2","examNo":57,"q":"我國動物傳染病防治條例所稱的防治不包括下列何種業務？","opts":["A. 預防","B. 防疫","C. 檢疫","D. 治療"],"ans":3,"exp":"根據台灣「動物傳染病防治條例」，第2條第1款定義「防治」包括：預防、防疫、檢疫三項業務。治療（treatment）不屬於「防治」的範疇，因為動物傳染病防治條例的重點是群體性的預防、防疫和檢疫工作，而非個體治療。","we":["預防是動物傳染病防治的重要業務，屬於防治的範疇。","防疫（包括疫苗接種、消毒、隔離等措施）屬於防治業務。","檢疫（進出口動物及產品的衛生檢查）屬於防治業務。","（正確）治療不屬於動物傳染病防治條例定義的「防治」業務，防治著重在群體預防和管制，非個體治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_058","year":2016,"roc_year":105,"session":"2","examNo":58,"q":"在一群300頭的牛隻族群中，引入一個疾病感染病例，若族群個體間傳播此感染時的有效接觸率為0.05，且假設整個族群都對\r 此疾病有感受性，請以 Reed-Frost model 計算引入此病例後，第一個時間點（t+1）時的牛隻新感染病例數為何？","opts":["A. 5","B. 15","C. 30","D. 285"],"ans":1,"exp":"Reed-Frost模型中：C(t+1) = S(t) × (1-(1-p)^C(t))，其中S(t)為感受性動物數，p為有效接觸率，C(t)為感染病例數。當N=300，C(0)=1，p=0.05，S(0)=299時：C(1) = 299 × (1-(1-0.05)^1) = 299 × 0.05 = 14.95 ≈ 15。","we":["5不正確：若p=0.05且C(0)=1，C(1)=299×0.05≈15，不是5。","（正確）Reed-Frost模型計算：C(1) = 299×(1-0.95^1) = 299×0.05 ≈ 15頭新感染病例。","30不正確：若p=0.1才可能得到30，題目p=0.05。","285不是新感染病例數，而是剩餘感受性動物大致數目（300-15=285）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_059","year":2016,"roc_year":105,"session":"2","examNo":59,"q":"罹患糖尿病的犬隻在未經治療下的五年存活率是12.3%，以下敘述何者錯誤？","opts":["A. 有12.3%罹患糖尿病的犬隻在未治療的情況下平均存活年數是五年","B. 有12.3%罹患糖尿病的犬隻在未治療的情況下可活過五年","C. 此存活率的計算為條件機率","D. 可用生命表法來計算存活率"],"ans":0,"exp":"糖尿病犬五年存活率12.3%表示：在罹患糖尿病且未治療的犬隻中，有12.3%能存活超過五年（即活過五年的比例）。這不是指平均存活年數為五年，也不是死亡率。12.3%活過五年意味著87.7%在五年內死亡，存活率是條件機率，可用生命表法計算。","we":["（正確）「12.3%能活過五年」≠「平均存活年數是五年」，前者是存活比例，後者是平均值，是不同概念，選項A是錯誤敘述。","有12.3%罹患糖尿病的犬隻在未治療下可活過五年，B是正確敘述。","此存活率的計算確實為條件機率（在五年時間點還存活的條件概率），C是正確敘述。","生命表法（life table method/Kaplan-Meier）確實可用來計算存活率，D是正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_060","year":2016,"roc_year":105,"session":"2","examNo":60,"q":"請問對疾病之控制方式，下列何者正確？","opts":["A. 控制疾病可以採用防治的方式，不一定要用撲殺","B. 控制疾病其目的主要是在降低死亡率，至於發生率則不需太多考慮","C. 一個成功的控制方案，其目標在保持疾病的再發生率應為0%","D. 為了要控制疾病，是不需要考慮其成本的"],"ans":0,"exp":"疾病控制（disease control）的目的是降低疾病的發生率、流行程度或後果，不一定需要採用撲殺（stamping-out）措施，也可以採用疫苗接種、隔離、治療等防治手段。撲殺是用於疾病撲滅（eradication）的方法之一，控制則更靈活。","we":["（正確）控制疾病可以採用多種防治方式（疫苗、隔離、治療等），不一定要用撲殺，A是正確敘述。","控制疾病的目的包括降低發生率和死亡率，兩者都需要考慮，B是錯誤敘述。","成功的控制方案目標是維持疾病在可接受的低水平，不必要求再發生率為0%（那是撲滅的目標），C是錯誤敘述。","疾病控制需要考慮成本效益，投入資源必須合理，D是錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_061","year":2016,"roc_year":105,"session":"2","examNo":61,"q":"下列有關病例對照研究法中對照組的選擇，何項錯誤？","opts":["A. 考量與病例組的可比較性","B. 暴露與否不影響對照組的選擇","C. 病例組與對照組的樣本數一定要1:1","D. 可選擇多個對照組進行比較"],"ans":2,"exp":"在病例對照研究（case-control study）中，對照組與病例組的樣本數不一定要1:1，可以是1:2、1:3或1:4等比例（matching ratio），以增加統計效力（statistical power），特別是當病例數較少時。因此「一定要1:1」的說法是錯誤的。","we":["考量病例組與對照組的可比較性是對照組選擇的重要原則，A是正確陳述。","暴露與否不應影響對照組的選擇（除了對照組需要來自相同的基礎人群外），B是正確陳述。","（正確）病例組與對照組樣本數不一定要1:1，可用1:2或1:4等比例以提高統計效力，C是錯誤陳述。","可選擇多個對照組進行比較是有效的研究設計，D是正確陳述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_062","year":2016,"roc_year":105,"session":"2","examNo":62,"q":"下列何者不影響陽性預測值的高低？","opts":["A. 敏感度","B. 特異度","C. 疾病盛行率","D. Kappa 值"],"ans":3,"exp":"陽性預測值（PPV）由敏感度（sensitivity）、特異度（specificity）和疾病盛行率（prevalence）三個因素決定。Kappa值是衡量兩個評估者之間一致性（agreement）的統計量，與陽性預測值的計算無直接關係，因此不影響PPV的高低。","we":["敏感度影響陽性預測值：敏感度越高，假陰性越少，通常PPV也會受影響。","特異度影響陽性預測值：特異度越高，假陽性越少，PPV越高。","疾病盛行率影響陽性預測值：盛行率越高，PPV越高（Bayes定理）。","（正確）Kappa值衡量評估者間一致性（inter-rater agreement），與PPV的計算無關，不影響PPV高低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_063","year":2016,"roc_year":105,"session":"2","examNo":63,"q":"一病例對照研究中，因醫療紀錄發生誤植，導致部分患有疾病的動物登錄為未患病，此會導致下列何種誤差？","opts":["A. 選樣偏差（selection bias）","B. 錯分偏差（misclassification bias）","C. 回憶偏差（recall bias）","D. 干擾因子（confounding）"],"ans":1,"exp":"當醫療紀錄發生誤植，導致患有疾病的動物被錯誤登錄為未患病（疾病狀態誤分類），這種因記錄錯誤導致研究對象被錯誤分類的偏差稱為錯分偏差（misclassification bias）。此偏差屬於資訊偏差（information bias）的一種，可使研究結果偏向無效值（null hypothesis）。","we":["選樣偏差（selection bias）是由於研究對象的選取方式系統性偏差，而非記錄誤植。","（正確）錯分偏差（misclassification bias）是指疾病狀態或暴露狀態因記錄錯誤被系統性錯誤分類，醫療紀錄誤植屬於此類。","回憶偏差（recall bias）是研究對象對過去暴露的回憶不準確，不是記錄誤植。","干擾因子（confounding）是第三個變量同時影響暴露和疾病，與記錄誤植不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_064","year":2016,"roc_year":105,"session":"2","examNo":64,"q":"動物進行體態評分（body condition score）的評分方式，為下列那一種數據型態？","opts":["A. 序位數據","B. 等比數據","C. 等距數據","D. 類別數據"],"ans":0,"exp":"動物體態評分（BCS）採用1-5分（或1-9分）的量表，各分數代表不同程度的身體狀況（如消瘦、正常、肥胖等），分數間有相對大小關係但間距並不一定相等，因此屬於序位數據（ordinal scale）。序位數據有排列順序但無法確定兩個等級之間的差距是否相等。","we":["（正確）體態評分屬序位數據（ordinal scale），各分數間有大小關係但間距不保證相等，無法進行加減運算。","等比數據（ratio scale）需要有真正的零點（如體重、身高），BCS沒有真正的零點。","等距數據（interval scale）的各測量值間距相等（如溫度），BCS分數間距不一定相等。","類別數據（nominal/categorical scale）無順序之分（如品種、毛色），BCS有明確的大小順序，不屬於純類別數據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_065","year":2016,"roc_year":105,"session":"2","examNo":65,"q":"下列對檢疫（quarantine）敘述何者正確？","opts":["A. 檢疫之目的在檢出已有臨床症狀的檢疫物","B. 利用檢疫來限制接觸者在一段時間內的行動，以防止疾病的蔓延","C. 國際檢疫的目的在防止國內傳染病的輸出","D. 國內檢疫的目的在防止傳染病自港口進入國內蔓延"],"ans":1,"exp":"檢疫（quarantine）的目的是限制可能暴露於傳染病的接觸者（或動物）的行動，防止疾病進一步擴散，確保在潛伏期內進行觀察和監控。國際檢疫目的是防止境外疾病輸入，國內檢疫目的是防止國內疾病擴散。","we":["檢疫的目的是限制接觸者行動，而非只檢出已有臨床症狀者（那是診斷），A是錯誤描述。","（正確）檢疫（quarantine）利用限制接觸者在一段時間內的行動，防止疾病在潛伏期內蔓延，B是正確描述。","國際檢疫的目的是防止疾病的輸入（而非輸出），C說「防止輸出」是錯誤的。","國內檢疫的目的是防止疾病在國內擴散，而非特指防止從港口進入，D描述不完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_066","year":2016,"roc_year":105,"session":"2","examNo":66,"q":"世代研究和病例對照研究最重要的區別為","opts":["A. 世代研究是前瞻性研究，病例對照研究是回溯性研究","B. 病例對照研究可以評估多種疾病，而世代研究可以評估多種暴露","C. 病例對照研究比較容易評估發生率","D. 在研究開始，世代研究依照研究對象的暴露的狀態分組，病例對照研究依照研究對象的疾病狀態分組"],"ans":3,"exp":"世代研究（cohort study）在研究開始時，根據研究對象的暴露狀態（暴露組vs.未暴露組）進行分組，然後追蹤觀察疾病發生率。病例對照研究（case-control study）在研究開始時，根據疾病狀態（病例vs.對照）進行選擇，然後回溯調查暴露史。這是兩種設計最根本的區別。","we":["世代研究可以是前瞻性或回溯性，病例對照研究通常是回溯性，但不是兩者最重要的區別，A不夠精確。","病例對照研究可以評估多種暴露因子（不是多種疾病），世代研究可以評估多種結果（不是多種暴露），B的說法是相反的。","世代研究（而非病例對照研究）更容易計算發生率，C是錯誤的。","（正確）世代研究依暴露狀態分組，病例對照研究依疾病狀態分組，這是兩者最根本的差別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_067","year":2016,"roc_year":105,"session":"2","examNo":67,"q":"獸醫流行病學調查時所涉及的群體一般都很大，限於人力和經費，於短時期內可以得到較具代表性資料的方法是","opts":["A. 普查","B. 指定調查","C. 抽樣調查","D. 監視與監控"],"ans":2,"exp":"抽樣調查（sampling survey）在限於人力和經費的情況下，可在短時期內對大群體進行代表性調查。透過隨機抽樣方法，可以用較小的樣本估計整個族群的特性，兼顧效率和代表性。","we":["普查（census）需要對整個族群進行調查，人力和經費消耗巨大，不適合資源有限的情況。","指定調查（purposive survey）選擇特定動物進行調查，無法代表整個族群，缺乏代表性。","（正確）抽樣調查在有限資源下，透過適當的抽樣設計，在短時期內獲得具代表性的數據。","監視與監控是長期性的系統，雖然重要，但不是「短時期內獲得較具代表性資料」的首選方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_068","year":2016,"roc_year":105,"session":"2","examNo":68,"q":"疾病在某地區的發生病例數超過期望值，稱為","opts":["A. 泛流行病（pandemic）","B. 散發病（sporadic）","C. 流行病（epidemic）","D. 地方病（endemic）"],"ans":2,"exp":"流行病（epidemic）指在特定地區、特定時間內，疾病的發生病例數超過預期（期望值）的情況，即疾病的發生頻率顯著高於通常水平。泛流行病（pandemic）是全球性或多國的大規模流行；散發病（sporadic）是疾病偶發，無規律；地方病（endemic）是疾病以固定的規律性在某地區持續發生。","we":["泛流行病（pandemic）指跨越多個國家或大洲的大規模流行，規模大於epidemic。","散發病（sporadic）指疾病偶爾發生，無明顯時間或地點的集中性。","（正確）流行病（epidemic）指疾病在某地區的發生病例數超過期望（預期）值。","地方病（endemic）指疾病在某地區以預期的規律性持續發生，是「正常基線」，非超出期望值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_069","year":2016,"roc_year":105,"session":"2","examNo":69,"q":"依照獸醫流行病學資料處理方式以1～5分記錄屠體的等級時，如以1分代表很差，依序3代表中等，5分代表很好等方式表示，\r 請問此種資料處理方式屬於下列何種等級？","opts":["A. 順序等級（ordinal scale）","B. 特殊等級（special scale）","C. 間隔等級（interval scale）","D. 比率等級（ratio scale）"],"ans":0,"exp":"屠體等級以1-5分表示時，各分數代表不同等級的品質（1分=很差，3分=中等，5分=很好），各分數之間有大小排列順序，但不確定各分數間的差距是否相等（例如從1到2和從4到5的差距未必相同），因此屬於順序等級（ordinal scale）。","we":["（正確）以1-5分表示屠體品質的評分屬於順序等級（ordinal scale），有大小關係但間距不確定相等。","特殊等級（special scale）不是標準的統計資料類型，不是正確答案。","間隔等級（interval scale）要求各測量值間距相等，且無真正的零點，如溫度（攝氏）；屠體評分不保證間距相等。","比率等級（ratio scale）有真正的零點（如體重0kg代表沒有），屠體評分的0不代表「沒有屠體」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_070","year":2016,"roc_year":105,"session":"2","examNo":70,"q":"於一單次流行病學調查中，探討屠宰工作人員與鈎端螺旋體病血清抗體陽性的關係。研究結果如下表所示，該研究所用的方法 為何？","opts":["A. 世代研究法","B. 病例對照研究法","C. 橫斷式研究法","D. 臨床試驗"],"ans":2,"exp":"於一單次流行病學調查中，同時調查工作人員（暴露）與鈎端螺旋體病血清抗體陽性（疾病狀態）的關係，是在同一時間點測量暴露和疾病狀態，屬於橫斷式研究法（cross-sectional study）。橫斷式研究在同一時間點測量所有變量，無法確定因果方向。","we":["世代研究法先選定暴露和未暴露組，追蹤觀察疾病發生，此研究為單次調查，非追蹤性設計。","病例對照研究法先選定病例和對照，回溯調查暴露史；此研究為單次調查，非病例對照設計。","（正確）此研究在單一時間點同時測量暴露（工作）和疾病（血清抗體），屬橫斷式研究法，但需原始表格資料確認。","臨床試驗需要隨機分配干預，此研究為觀察性研究，非試驗設計。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_105_2_公衛_071","year":2016,"roc_year":105,"session":"2","examNo":71,"q":"以下有關特定診斷試驗的敘述何者正確？","opts":["A. 在疾病盛行率為80%的族群測試時，試驗的敏感性（sensitivity）會比在疾病盛行率為20%的族群測試時為高","B. 敏感性為60%的試驗，會比敏感性為70%的試驗，更可能發生假陽性結果","C. 對疾病盛行率為80%的族群測試時，試驗的陽性預測值（positive predictive value）會比在疾病盛行率為20%的族群測試時\r 為高","D. 降低特異性（specificity）可以減少假陽性結果"],"ans":2,"exp":"陽性預測值（PPV）受盛行率影響：PPV = (Se × P) / [(Se × P) + (1-Sp) × (1-P)]，其中P為盛行率。當盛行率從20%增加到80%時，PPV顯著上升，因為在高盛行率群體中，陽性結果更可能是真正的病例。敏感度（Se）和特異度（Sp）不受盛行率影響，是試驗本身的特性。","we":["敏感度（sensitivity）是試驗固有特性，不受盛行率變化影響，在不同盛行率族群中相同；A是錯誤說法。","敏感性高的試驗假陰性少，但假陽性多寡由特異度決定，而非敏感性；B說法混淆了概念。","（正確）盛行率80%的族群中PPV高於盛行率20%的族群，因為高盛行率使陽性結果更可能是真陽性。","降低特異性會增加（而非減少）假陽性結果，D是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_072","year":2016,"roc_year":105,"session":"2","examNo":72,"q":"一般民眾中有將近11%（50/450）的血清抗體陽性率，此意義為","opts":["A. 盛行率","B. 累積發生率","C. 發生率密度","D. 抗體陽轉率"],"ans":0,"exp":"在調查資料中，50/450 = 11.1%的血清抗體陽性率，是在特定時間點測量已存在的感染情形，代表在該時間點上的患病（感染）比例。這是盛行率（prevalence）的定義：特定時間點族群中已感染（患病）者的比例。","we":["（正確）在某一時間點測量已有的血清抗體陽性率（11%），代表盛行率（prevalence），即當時族群中的感染比例。","累積發生率（cumulative incidence）是在一段時間內新發生感染的比例，需追蹤時間，非一次性調查所得。","發生率密度（incidence density/incidence rate）需要以「動物-時間」為分母，非一次性橫斷式調查。","抗體陽轉率（seroconversion rate）是從陰性轉為陽性的比率，需要前後兩次檢測比較，非一次性調查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_073","year":2016,"roc_year":105,"session":"2","examNo":73,"q":"若已知某豬場沙氏桿菌感染之實際真盛行率（true prevalence）為10%，利用80%敏感度與90%特異度之快速診斷試劑進行隨\r 機抽樣100隻豬血清檢測，請問理論上依此診斷試劑診斷後所顯示的血清抗體陽性率（%）為","opts":["A. 11","B. 13","C. 15","D. 17"],"ans":3,"exp":"外表盛行率（apparent prevalence，AP）= 真實盛行率(TP) × 敏感度(Se) + (1-TP) × (1-特異度(Sp)) = 0.1 × 0.8 + 0.9 × 0.1 = 0.08 + 0.09 = 0.17 = 17%。這100頭豬中，理論上8頭真陽性被正確檢出，9頭假陽性被錯誤判為陽性，共17頭陽性。","we":["11%不正確：若AP=TP×Se=0.1×0.8=8%，加上假陽性0.9×0.1=9%，總計17%，而非11%。","13%不正確：計算結果應為17%，非13%。","15%不正確：計算結果應為17%，非15%。","（正確）AP = TP×Se + (1-TP)×(1-Sp) = 0.1×0.8 + 0.9×0.1 = 0.08+0.09 = 0.17 = 17%。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_074","year":2016,"roc_year":105,"session":"2","examNo":74,"q":"假設暴露在某致病因子下發病動物150頭，未發病450頭；未暴露在某致病因子下發病動物60頭，未發病540頭。請問此種致病\r 因子對此動物之危險勝算比（odds ratio，OR）為多少？","opts":["A. 2.0","B. 2.5","C. 3.0","D. 4.7"],"ans":2,"exp":"勝算比（OR）= (a/b)/(c/d) = (a×d)/(b×c)。暴露發病150（a），未發病450（b）；未暴露發病60（c），未發病540（d）。OR = (150×540)/(450×60) = 81000/27000 = 3.0。暴露組的發病勝算比未暴露組高3倍。","we":["OR = 2.0不正確，正確計算為150×540/(450×60) = 3.0。","OR = 2.5不正確，計算結果為3.0。","（正確）OR = (150×540)/(450×60) = 81000/27000 = 3.0。","OR = 4.7不正確，計算結果為3.0。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_075","year":2016,"roc_year":105,"session":"2","examNo":75,"q":"下列何者不是研究獸醫流行病學的主要目的？","opts":["A. 預防或控制疾病","B. 治療疾病","C. 維護動物的健康","D. 維持其適當的產能"],"ans":1,"exp":"獸醫流行病學的主要研究目的包括：預防或控制疾病、維護動物健康、維持適當的產能、保護公共衛生等。治療疾病（treatment）是臨床獸醫學的主要目的，不是流行病學研究的主要目的。流行病學著重於群體層面的疾病規律，而非個體治療。","we":["預防或控制疾病是獸醫流行病學的核心目的之一，A是正確的。","（正確）治療疾病是臨床獸醫師的主要工作，不是獸醫流行病學的主要目的，B是例外選項。","維護動物的健康是獸醫流行病學的重要目標，C是正確的。","維持其適當的產能（如生長、繁殖、泌乳等）是畜牧業流行病學關注的重要議題，D是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_076","year":2016,"roc_year":105,"session":"2","examNo":76,"q":"關於致死率（case-fatality rate）的敘述何者正確？","opts":["A. 用於測量暴露組較於非暴露組死亡的相對危險性（relative risk）","B. 如果患畜得到疾病後迅速死於這種疾病則致死率低","C. 測量疾病在某一特定時間點的發生情形","D. 疾病有很高的致死率，但死亡率（mortality）低是可能的"],"ans":3,"exp":"致死率（case-fatality rate，CFR）是感染該疾病後死亡的比例，與死亡率（mortality rate）不同。一種疾病可以有很高的CFR（如一旦感染非常致命），但如果疾病的發生率（incidence）極低，則整體死亡率（mortality rate）也會很低。例如：狂犬病CFR接近100%，但整體死亡率因發生率低而較低。","we":["致死率與相對危險性（RR）不同，RR是暴露組與對照組的危險性比較，CFR是疾病致死比例。A是錯誤的。","若患畜得到疾病後迅速死亡，致死率應是「高」而非低。B是錯誤的。","C描述的是盛行率（prevalence）的概念，測量特定時間點的發生情形，不是致死率。","（正確）疾病有很高的致死率但死亡率低是可能的，例如稀有但致命的疾病，發生率低使整體死亡率也低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_077","year":2016,"roc_year":105,"session":"2","examNo":77,"q":"動物防疫人員為鑑定動物傳染病之病因，得令疑患動物傳染病動物之所有人或管理人將其隔離繫養，其隔離期間不得超過多\r 久？","opts":["A. 14日","B. 10日","C. 7日","D. 5日"],"ans":0,"exp":"根據台灣動物傳染病防治條例第22條，動物防疫人員為鑑定動物傳染病之病因，得令疑患動物傳染病動物之所有人或管理人將其隔離繫養，其隔離期間不得超過14日。超過後需要法律依據才能繼續限制。","we":["（正確）根據動物傳染病防治條例，動物防疫人員令疑患動物傳染病之動物隔離繫養，不得超過14日。","10日不符合法律規定的期間。","7日不符合法律規定的期間（7日是某些疾病的最長潛伏期，但法定隔離期為14日）。","5日不符合法律規定的期間。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_078","year":2016,"roc_year":105,"session":"2","examNo":78,"q":"依放流水標準，畜牧業（二）適用草食動物之生化需氧量（BOD）為多少（毫克／公升）？","opts":["A. 20","B. 40","C. 60","D. 80"],"ans":3,"exp":"根據台灣放流水標準，畜牧業（二）適用草食動物（牛、馬、驢、騾、羊、鹿等），其放流水生化需氧量（BOD）標準為80 mg/L，與畜牧業（一）（豬、雞、鴨等）相同，均規定BOD不得超過80 mg/L。","we":["20 mg/L是飲用水或更嚴格標準的BOD，不是畜牧業放流水標準。","40 mg/L不符合台灣放流水標準中畜牧業的BOD規定。","60 mg/L不符合台灣放流水標準中畜牧業的BOD規定。","（正確）畜牧業（二）草食動物的放流水BOD標準為80 mg/L。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_079","year":2016,"roc_year":105,"session":"2","examNo":79,"q":"政府公告禁止自疫區國家的偶蹄類動物輸入臺灣檢疫要件中，不包括下列何種疫病？","opts":["A. 口蹄疫","B. 牛傳染性胸膜肺炎","C. 非洲豬瘟","D. 馬鼻疽"],"ans":3,"exp":"馬鼻疽（glanders）是由Burkholderia mallei引起的疾病，主要感染馬、驢等奇蹄類動物，而非偶蹄類（如豬、牛、羊等）。政府禁止自疫區輸入的偶蹄類動物相關疫病主要是口蹄疫、牛傳染性胸膜肺炎、非洲豬瘟等。馬屬奇蹄類，馬鼻疽不在偶蹄類動物檢疫禁令中。","we":["口蹄疫是偶蹄類動物（牛、豬、羊等）的重要傳染病，確實在輸入禁止清單中。","牛傳染性胸膜肺炎（CBPP）是偶蹄類（牛科）的傳染病，在禁止輸入清單中。","非洲豬瘟是偶蹄類（豬）的重要傳染病，確實在禁止輸入清單中。","（正確）馬鼻疽（glanders）主要感染馬等奇蹄類，不是偶蹄類動物的限制性疫病，不在偶蹄類動物的進口禁令中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_105_2_公衛_080","year":2016,"roc_year":105,"session":"2","examNo":80,"q":"防檢局屠宰衛生合格之禽肉標示中，其中丙式屠宰衛生檢查合格標誌圖示如下。請 問，其中英文字母''a'' 所指為何？","opts":["A. 檢核碼","B. 流水編號","C. 屠宰場編號","D. 屠宰日期"],"ans":0,"exp":"在屠宰衛生檢查丙式合格標誌中，標誌上通常包含屠宰場代號、屠宰日期及流水編號等資訊。根據農委會防檢局相關規定，字母'a'所指位置通常為屠宰場的識別碼或特定資訊欄位，需參考原始標誌圖示確認。","we":["（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）","（此題需對照圖示確認，以考選部公布之答案為準）"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_106_1_公衛_001","year":2017,"roc_year":106,"session":"1","examNo":1,"q":"2014年伊波拉病毒在非洲嚴重流行，請問該病毒的主要傳播途徑為何？","opts":["A. 體液傳播","B. 糞口傳播","C. 空氣傳播","D. 蚊子病媒傳播"],"ans":0,"exp":"伊波拉病毒（Ebola virus）的主要傳播途徑為直接接觸感染者或死亡者的血液、體液（汗液、唾液、嘔吐物、糞便等），屬於體液傳播（contact/body fluid transmission）。病毒不能透過空氣或蚊蟲媒介傳播。","we":["（正確）伊波拉病毒主要透過直接接觸感染者的血液與體液傳播，是2014年西非大流行期間最重要的傳播途徑。","糞口傳播（fecal-oral）是腸道感染的傳播方式，伊波拉病毒雖可在糞便中出現，但主要傳播仍以直接體液接觸為主，並非糞口途徑。","伊波拉病毒無法透過空氣（airborne）傳播，此為重要的防疫誤解；空氣傳播的疾病如結核病、麻疹等。","伊波拉病毒目前無已知蚊蟲媒介傳播的證據，蚊蟲傳播僅適用於部分蟲媒傳染病如登革熱、日本腦炎等。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_002","year":2017,"roc_year":106,"session":"1","examNo":2,"q":"狂犬病病毒不易感染下列那一種動物？","opts":["A. 鼠","B. 蛇","C. 雞","D. 牛"],"ans":2,"exp":"狂犬病病毒（Lyssavirus）對冷血動物感受性很低；爬蟲類（如蛇）屬冷血動物，其體溫調節方式不適合病毒複製，因此蛇對狂犬病病毒感受性最低，最不易感染。","we":["鼠類屬哺乳動物（恆溫），對狂犬病有一定感受性，雖在自然界少見，但實驗室中可感染。","雞屬禽類（恆溫），雖然禽類對狂犬病感受性低，但比冷血動物高，不是最不易感染的選項。","（正確）蛇是爬蟲類（冷血動物），體溫不恆定，狂犬病病毒無法在其體內有效複製，是最不易感染狂犬病的選項。","牛是偶蹄目哺乳動物，對狂犬病具有感受性，感染後可出現臨床症狀，並非最不易感染的動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_003","year":2017,"roc_year":106,"session":"1","examNo":3,"q":"亨德拉病毒（Hendra virus）主要是在何種動物與人之間互相傳染？","opts":["A. 牛","B. 豬","C. 馬","D. 犬"],"ans":2,"exp":"亨德拉病毒（Hendra virus）主要在澳洲的馬（horses）與人之間傳播，由感染的狐蝠（自然帶原宿主）傳播給馬，再由馬傳染給人（獸醫師、馬主等）。","we":["牛並非亨德拉病毒的中間宿主，亨德拉病毒未見牛與人之間的傳播記錄。","豬是尼帕病毒（Nipah virus）的重要中間宿主，並非亨德拉病毒的主要宿主。","（正確）亨德拉病毒的傳播模式為：狐蝠（帶原宿主）→馬（中間宿主）→人，馬是連接自然界與人類的關鍵中間宿主。","犬並非亨德拉病毒的已知中間宿主，目前無犬隻引起人類感染亨德拉病毒的記錄。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_004","year":2017,"roc_year":106,"session":"1","examNo":4,"q":"下列關於狂犬病的敘述，何者正確？","opts":["A. 多數溫血動物皆有感受性","B. 潛伏期為3～5天","C. 無疫苗可以使用","D. 病毒可由昆蟲媒介散播"],"ans":0,"exp":"狂犬病可感染幾乎所有的溫血哺乳動物（包括犬、貓、蝙蝠、狐狸、鹿、牛等），對溫血動物（恆溫動物）普遍具感受性，此為狂犬病的重要特性。","we":["（正確）狂犬病病毒對多數溫血哺乳動物均具感受性，幾乎所有哺乳動物均可被感染，此敘述正確。","狂犬病的潛伏期為10天至1年以上（通常1-3個月），並非「3-5天」；3-5天的潛伏期遠不足以描述狂犬病，此敘述錯誤。","狂犬病有核准上市的動物及人用疫苗，是最重要的預防手段，「無疫苗可用」描述錯誤。","狂犬病病毒透過神經組織傳播（如咬傷時的唾液接種），而非由昆蟲媒介散播，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_005","year":2017,"roc_year":106,"session":"1","examNo":5,"q":"有關里夫谷熱（Rift Valley fever）的敘述何者正確？","opts":["A. 為節肢動物媒介傳染病","B. 在成年綿羊易引起急性高死亡率的傳染病","C. 目前動物中無疫苗可預防此病，因此只能端賴加強公共衛生工作進行防治","D. 其病原在酸性環境中穩定不易殺滅"],"ans":0,"exp":"里夫谷熱（Rift Valley fever）由布尼亞病毒科（Bunyaviridae，現稱Phenuiviridae）病毒引起，主要透過受感染的蚊子（如Aedes、Culex屬）叮咬傳播，屬於節肢動物媒介傳染病（arboviral disease）。","we":["（正確）里夫谷熱是節肢動物媒介傳染病（arboviral disease），主要由蚊子傳播，也可透過接觸感染動物的血液/組織傳播，選項A描述正確。","里夫谷熱在幼年綿羊（羔羊）的死亡率遠高於成年綿羊（成年羊死亡率相對低），選項B「成年綿羊易引起急性高死亡率」描述不精確。","里夫谷熱已有動物疫苗（formalin-inactivated and modified live vaccines），選項C「無疫苗可預防」描述錯誤。","里夫谷熱病毒在鹼性（非酸性）環境中較穩定，選項D「在酸性環境中穩定」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_006","year":2017,"roc_year":106,"session":"1","examNo":6,"q":"由崩芽病毒科（Bunyaviridae）所引起的疾病不包括下列何者？","opts":["A. 克里米亞剛果出血熱（Crimean-Congo hemorrhagic fever）","B. 聖路易腦炎（St. Louis encephalitis）","C. 腎症候性出血熱（Hemorrhagic fever with renal syndrome）","D. 里夫谷熱（Rift Valley fever）"],"ans":1,"exp":"聖路易腦炎（St. Louis encephalitis）屬黃病毒科（Flaviviridae），由黃病毒屬引起，病媒為庫蚊（Culex mosquitoes）；而非由布尼亞病毒科（Bunyaviridae）引起。","we":["克里米亞剛果出血熱（CCHF）由布尼亞病毒科的奈羅病毒（Nairovirus）引起，屬此科疾病。","（正確）聖路易腦炎由黃病毒科（Flaviviridae）的黃病毒引起，不屬於布尼亞病毒科，是本題「不包括」的選項。","腎症候性出血熱（HFRS）由布尼亞病毒科的漢他病毒（Hantavirus）引起，屬此科疾病。","里夫谷熱（RVF）由布尼亞病毒科的白嶺病毒（Phlebovirus）引起，屬此科疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_007","year":2017,"roc_year":106,"session":"1","examNo":7,"q":"下列何者為俄羅斯及中歐春夏腦炎（Russian and central European spring-summer encephalitis）之主要傳播病媒\r （vector）？","opts":["A. 壁蝨","B. 斑蚊","C. 家蚊","D. 鼠類"],"ans":0,"exp":"俄羅斯及中歐春夏腦炎（Russian and Central European spring-summer encephalitis，即壁蝨性腦炎 Tick-borne encephalitis，TBE）的主要傳播病媒為壁蝨（蜱），尤其是Ixodes ricinus（歐洲）和Ixodes persulcatus（亞洲）。","we":["（正確）TBE（壁蝨性腦炎/春夏腦炎）的主要傳播病媒為壁蝨（硬蜱），以Ixodes屬為主，是典型的蜱媒傳染病。","斑蚊（Aedes mosquitoes）是登革熱、黃熱病等蚊媒傳染病的病媒，並非TBE的傳播媒介。","家蚊（Culex mosquitoes）是西尼羅病、日本腦炎等疾病的病媒，並非TBE的主要傳播病媒。","鼠類是TBE的保毒宿主（reservoir host），但不是傳播病媒（vector）；傳播病媒仍為壁蝨。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_008","year":2017,"roc_year":106,"session":"1","examNo":8,"q":"下列何種疾病與漢他病毒感染症的傳播方式最為接近？","opts":["A. 淋巴球性脈絡叢腦膜炎（lymphocytic choriomeningitis）","B. 貓抓熱（cat scratch disease）","C. 巴氏桿菌症（pasteurellosis）","D. 聖路易腦炎（St. Louis encephalitis）"],"ans":0,"exp":"漢他病毒感染症（Hantavirus infection）的傳播方式是人類吸入帶毒嚙齒類（主要為野鼠）的排泄物（糞便、尿液、唾液）乾燥後形成的氣溶膠。淋巴球性脈絡叢腦膜炎（LCM）同樣由囓齒類（主要為家鼠/倉鼠）帶原，主要透過接觸囓齒類排泄物或被咬傷感染，傳播方式與漢他病毒最為相近。","we":["（正確）淋巴球性脈絡叢腦膜炎（LCM）與漢他病毒感染症均由囓齒類排泄物氣溶膠傳播，傳播方式最為接近。","貓抓熱（cat scratch disease）由Bartonella henselae引起，主要透過貓爪抓傷或咬傷傳播，傳播方式與漢他病毒截然不同。","巴氏桿菌症（Pasteurellosis）主要由動物咬傷或抓傷傳播，傳播途徑不同於漢他病毒。","聖路易腦炎（St. Louis encephalitis）由庫蚊傳播（蚊媒），傳播方式與漢他病毒（囓齒類排泄物氣溶膠）完全不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_009","year":2017,"roc_year":106,"session":"1","examNo":9,"q":"腎症候性出血熱之主要保毒貯主為何？","opts":["A. 蝙蝠","B. 野鳥","C. 野鼠","D. 豬"],"ans":2,"exp":"腎症候性出血熱（HFRS）的主要保菌貯主（reservoir host）為野鼠（嚙齒類動物），特別是姬鼠（Apodemus屬）和褐家鼠（Rattus norvegicus），漢他病毒在這些囓齒類體內持續感染而不致病。","we":["蝙蝠是許多其他病毒（如伊波拉、亨德拉、SARS冠狀病毒）的天然保毒宿主，並非HFRS（漢他病毒）的主要貯主。","野鳥並非漢他病毒的保菌貯主，野鳥更多扮演西尼羅病毒等病毒的擴散宿主角色。","（正確）野鼠（特別是野棲嚙齒類如姬鼠、田鼠等）是漢他病毒的主要保菌貯主，帶毒而不發病，透過排泄物將病毒散播至環境中。","豬並非漢他病毒的主要保菌貯主，豬在腎症候性出血熱的流行中不扮演重要角色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_010","year":2017,"roc_year":106,"session":"1","examNo":10,"q":"對於B病毒感染症的病原體之敘述，何者錯誤？","opts":["A. 猿猴對此病的流行扮演著重要的角色","B. 人類感染除了產生水泡外還有肌肉與神經等症狀","C. 屬雙股DNA疱疹病毒科","D. 人類感染後之致死率在5%以下"],"ans":3,"exp":"疱疹B病毒（Herpesvirus simiae，B virus，現稱Macacine alphaherpesvirus 1）感染人類後，若不及時治療，致死率高達70-80%，遠高於5%，因此選項D「致死率在5%以下」的描述是錯誤的。","we":["猿猴（特別是恆河猴等獼猴屬）是B病毒的自然宿主，在其種群中流行且扮演重要傳播角色，此述正確。","人類感染B病毒後可出現皮膚水泡（類似疱疹），並引起嚴重的肌肉、神經症狀（上行性腦脊髓炎），此述正確。","B病毒屬雙股DNA的疱疹病毒科（Alphaherpesvirinae亞科），此述正確。","（正確，即本題所問之錯誤）人類感染B病毒若未治療，致死率可達70-80%，遠超過5%；「致死率在5%以下」描述嚴重低估了B病毒的危險性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_011","year":2017,"roc_year":106,"session":"1","examNo":11,"q":"有關日本腦炎的敘述何者正確？","opts":["A. 馬感染後不引起臨床症狀","B. 豬在日本腦炎傳播中為終宿主的角色","C. 水鳥為傳染環中的重要宿主","D. 以埃及斑蚊為主要病媒蚊"],"ans":2,"exp":"水鳥（herons、egrets等）是日本腦炎病毒的重要增殖宿主（amplifying host）及維持宿主（maintenance host），病毒在水鳥體內維持高病毒血症而不致病，並透過三斑家蚊（Culex tritaeniorhynchus）傳播至豬、馬及人。","we":["馬感染日本腦炎後確實可出現嚴重的神經症狀（腦炎），並非「不引起臨床症狀」，選項A描述錯誤。","豬在日本腦炎傳播中扮演的是「擴大（amplifying）宿主」角色，而非終宿主（dead-end host）；人和馬才是終宿主，選項B描述錯誤。","（正確）水鳥（包括鷺鷥等）是日本腦炎傳播循環中的重要維持宿主，帶有高滴度的病毒血症，使病毒在自然界中持續循環。","日本腦炎的主要病媒蚊為三斑家蚊（Culex tritaeniorhynchus），而非埃及斑蚊（Aedes aegypti）；埃及斑蚊是登革熱、黃熱病的主要病媒，選項D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_012","year":2017,"roc_year":106,"session":"1","examNo":12,"q":"目前高病原性家禽流行性感冒病毒株中主要為下列那些HA亞型（subtype）？①H1 ②H3 ③H5 ④H6 ⑤H7","opts":["A. ①②","B. ③④","C. ③⑤","D. ①⑤"],"ans":2,"exp":"高病原性家禽流行性感冒（HPAI）的主要HA亞型為H5和H7，其中H5N1和H7N9等是造成全球重大禽流感疫情的型別。H1、H3、H6通常只引起低病原性禽流感。","we":["H1和H2屬低病原性禽流感，並非高病原性禽流感的主要HA亞型，選項A描述錯誤。","H3和H6屬低病原性禽流感，並非高病原性禽流感的主要HA亞型，選項B描述錯誤。","（正確）H5和H7是高病原性家禽流行性感冒的主要HA亞型，如H5N1（亞洲大流行）、H5N2（台灣）及H7N9（中國）等均為高度關注的高病原性禽流感型別。","H1和H5的組合不正確，H1並非高病原性禽流感的主要亞型；正確組合應為H5和H7。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_013","year":2017,"roc_year":106,"session":"1","examNo":13,"q":"流浪動物收容中心工作人員在接觸動物後，皮膚出現局部化膿、紅腫性丘疹、單側性淋巴腺腫，最有可能是感染下列何種病\r 原？","opts":["A. 漢他病毒","B. 巴通氏菌","C. 甘比亞錐蟲","D. 隱球菌"],"ans":1,"exp":"流浪動物收容中心工作人員接觸動物後出現局部化膿性丘疹、單側性淋巴腺腫，此為典型的貓抓熱（Cat Scratch Disease）表現，病原為巴通氏菌（Bartonella henselae），透過貓爪抓傷傳播，也可見於犬隻收容環境。","we":["漢他病毒主要影響呼吸及腎臟功能，主要透過吸入囓齒類排泄物氣溶膠感染，不引起局部化膿性丘疹和淋巴腺腫。","（正確）巴通氏菌（Bartonella henselae）引起的貓抓熱表現為接觸部位的局部化膿性丘疹，並伴有單側性局部淋巴腺腫，符合本題描述。","甘比亞錐蟲引起非洲睡眠病，主要分布於非洲，由采采蠅傳播，不出現局部化膿性丘疹。","隱球菌（Cryptococcus）感染主要影響肺部及中樞神經系統（腦膜炎），不引起局部化膿性淋巴腺腫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_014","year":2017,"roc_year":106,"session":"1","examNo":14,"q":"我國對於經濟動物布氏桿菌病的防疫，下列敘述何者錯誤？","opts":["A. 國內乳牛自1962年開始監測，1989年宣布撲滅","B. 乳羊至今仍未發現有陽性病例","C. 幾次對豬抽檢曾發現陽性之後又回復陰性","D. 感染該菌主要經口、黏膜、乳汁、交配及皮膚傷口感染"],"ans":1,"exp":"台灣乳羊至今仍有布氏桿菌（Brucella melitensis）陽性病例的記錄，並非「未發現陽性病例」；B. melitensis為山羊/綿羊的主要布氏桿菌，是台灣乳羊場需持續監測的重要疾病。","we":["台灣乳牛確實自1962年開始監測布氏桿菌病，並於1989年宣布撲滅，此述正確。","（正確，即本題所問之錯誤）台灣乳羊並非「至今未發現陽性病例」；實際上曾有Brucella melitensis感染乳羊的陽性報告，此敘述錯誤。","台灣豬隻曾在抽檢中發現陽性，後又回復陰性，此述正確，反映防疫工作的成效。","布氏桿菌感染主要途徑確為口腔黏膜、傷口、乳汁、交配及皮膚，此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_015","year":2017,"roc_year":106,"session":"1","examNo":15,"q":"人類對於下列何種布氏桿菌較無感受性？","opts":["A. Brucella abortus","B. Brucella melitensis","C. Brucella suis","D. Brucella ovis"],"ans":3,"exp":"Brucella ovis（羊種布氏桿菌）對人類感受性極低，幾乎不引起人類感染；相較之下，B. abortus（牛種）、B. melitensis（羊山羊種）和B. suis（豬種）均對人類具有感受性，B. melitensis對人感受性最高。","we":["Brucella abortus（牛種）對人類具有感受性，可引起布氏桿菌病（波狀熱），並非人類感受性低的種別。","Brucella melitensis（山羊種）是對人類致病性最強的布氏桿菌種別，感受性最高。","Brucella suis（豬種）對人類具有相當感受性，尤其是血清型1和3，可引起嚴重人類布氏桿菌病。","（正確）Brucella ovis主要感染公羊睪丸，對人類的感受性極低，幾乎不引起人類感染，是布氏桿菌屬中人類感受性最低的種別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_016","year":2017,"roc_year":106,"session":"1","examNo":16,"q":"由伯氏疏螺旋體（Borrelia burgdorferi sensu lato）引起之人畜共通感染症，下列何種動物為其最主要保菌宿主？","opts":["A. 小型囓齒類","B. 牛羊","C. 野鹿","D. 野豬"],"ans":0,"exp":"伯氏疏螺旋體（Borrelia burgdorferi sensu lato）引起萊姆病，其最主要的保菌宿主為小型囓齒類（如白足鼠Peromyscus leucopus、姬鼠Apodemus屬），這些小型哺乳動物維持病原在自然界中的循環，並作為Ixodes蜱的餵血宿主。","we":["（正確）小型囓齒類（如白足鼠等）是伯氏疏螺旋體在自然界的最主要保菌宿主，蜱在這些動物身上攝取血餐時感染螺旋體，再傳播給其他宿主（包括人）。","牛羊雖可被Ixodes蜱叮咬，但對萊姆病螺旋體的保菌效率低，不是主要保菌宿主。","野鹿是Ixodes蜱的重要餵血宿主（幫助蜱族群維持），但對伯氏螺旋體的保菌效率低，不是主要保菌宿主。","野豬並非萊姆病螺旋體的主要保菌宿主，其在萊姆病傳播循環中的角色有限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_017","year":2017,"roc_year":106,"session":"1","examNo":17,"q":"目前全世界已知的斑點熱群立克次體病原，主要都由下列何種生物媒介傳播？","opts":["A. 蜱蟎","B. 蚊蚋","C. 劍水蚤","D. 陸地小型蜘蛛類"],"ans":0,"exp":"斑點熱群立克次體（spotted fever group Rickettsiae）全球已知的病原，包括Rickettsia rickettsii（洛磯山斑點熱）、R. conorii（地中海斑點熱）等，幾乎都由蜱蟎（硬蜱或軟蜱）作為傳播媒介及保毒宿主。","we":["（正確）斑點熱群立克次體的全球病原幾乎都由蜱蟎（ticks/mites）傳播，蜱蟎既是傳播媒介也是保毒宿主（經卵傳播）。","蚊蚋（mosquitoes/blackflies）是其他蟲媒傳染病（如日本腦炎、里夫谷熱）的病媒，並非斑點熱群立克次體的主要傳播媒介。","劍水蚤（copepods）是麥地那絲蟲等的中間宿主，並非斑點熱群立克次體的傳播媒介。","陸地小型蜘蛛類並非立克次體的傳播媒介；蜘蛛類雖屬蛛形綱，但螨（mites）和蜱（ticks）才是立克次體的媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_018","year":2017,"roc_year":106,"session":"1","examNo":18,"q":"鼠疫桿菌（Yersinia pestis）的傳播方式是屬於下列何者？","opts":["A. 直接傳播型（orthozoonoses）","B. 循環傳播型（cyclozoonoses）","C. 媒介或變異傳播型（metazoonoses）","D. 腐生物傳播型（saprozoonoses）"],"ans":2,"exp":"鼠疫桿菌（Yersinia pestis）的傳播需要透過蚤（flea，尤其是鼠蚤Xenopsylla cheopsis）作為生物媒介，病原在蚤的體內增殖後再傳播給脊椎動物宿主，屬於「媒介或變異傳播型（metazoonoses）」，需要節肢動物媒介完成傳播循環。","we":["直接傳播型（orthozoonoses）指不需要媒介、在動物和人之間直接傳播的疾病（如狂犬病），鼠疫需要蚤媒介，不屬此型。","循環傳播型（cyclozoonoses）指需要兩種以上脊椎動物完成生活史的疾病（如絛蟲症），鼠疫不需要多種脊椎動物中間宿主，不屬此型。","（正確）鼠疫屬媒介或變異傳播型（metazoonoses），需要節肢動物媒介（蚤）在脊椎動物宿主間傳播病原。","腐生物傳播型（saprozoonoses）指病原在環境中（土壤、植物）存在的疾病（如炭疽），鼠疫非此型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_019","year":2017,"roc_year":106,"session":"1","examNo":19,"q":"下列那一項不屬於感染E. coli O157：H7的風險因子？","opts":["A. 食用未清洗過的生菜","B. 接觸犬貓類後沒有洗手","C. 清理洪水後的災區","D. 飲用生牛乳"],"ans":1,"exp":"E. coli O157:H7（腸出血性大腸桿菌）的主要風險因子包括：食用未洗淨的生菜（受糞便污染）、清理洪水後的災區（接觸受污染水土）、飲用生牛乳（牛為帶菌者）。接觸犬貓後未洗手雖有一定風險，但犬貓並非E. coli O157:H7的主要帶菌動物，感染風險遠低於前述因子，是本題中最不屬於該病風險因子的選項。","we":["食用未清洗的生菜是E. coli O157:H7的已知感染來源（受牛糞污染的蔬菜），屬重要風險因子。","（正確，即本題所問之不屬於風險因子）接觸犬貓後沒有洗手是一般衛生問題，但犬貓並非E. coli O157:H7的主要宿主，此選項並非該病的主要風險因子。","清理洪水後的災區（接觸受糞便污染的水土）確實是E. coli O157:H7的感染風險因子。","飲用生牛乳是E. coli O157:H7的重要感染來源，牛隻是此菌的主要動物宿主，生乳中可能含有大量病菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_020","year":2017,"roc_year":106,"session":"1","examNo":20,"q":"以公共衛生的層面而言，下列何種疾病是乳牛健康上的指標，並列為政府實施防疫的重點？","opts":["A. 結核病","B. 口蹄疫","C. 流行熱","D. 牛瘟"],"ans":0,"exp":"從公共衛生層面而言，牛結核病（由Mycobacterium bovis引起）是乳牛健康的重要指標，因為M. bovis可藉由生乳傳播給人類（人畜共通傳染）。台灣政府一直將乳牛結核病列為重點防疫項目，並對生乳進行定期結核病監測。","we":["（正確）結核病（Tuberculosis，由M. bovis引起）是乳牛健康的公衛指標，因其可透過生乳傳播給人，政府將其列為重點防疫。","口蹄疫（FMD）雖是重要動物傳染病，但不構成直接的公共衛生威脅（不感染人），主要以保護動物為目的，並非「乳牛公衛指標」。","流行熱（Bovine Ephemeral Fever）是牛隻的重要病毒性疾病，但並不傳染給人，非公衛指標疾病。","牛瘟（Rinderpest）已於2011年宣告全球消滅，且為牛的特定疾病，不涉及人畜共通傳染的公衛指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_021","year":2017,"roc_year":106,"session":"1","examNo":21,"q":"下列有關細菌毒素的敘述中，何者為正確？","opts":["A. 金黃色葡萄球菌（Staphylococcus aureus）所產生的腸毒素不具良好的耐熱性","B. 肉毒桿菌（Clostridium botulinum）所產生的毒素是神經毒","C. 魏氏桿菌（Clostridium perfringens）在分裂時，會產生毒素","D. 仙人掌菌（Bacillus cereus）所產生的下痢型毒素，具良好的耐熱性"],"ans":1,"exp":"肉毒桿菌（Clostridium botulinum）所產生的毒素是已知最強的神經毒素，透過阻斷神經肌肉接點的乙醯膽鹼釋放，導致鬆弛型麻痺。其他選項的描述均有誤。","we":["金黃色葡萄球菌腸毒素具良好耐熱性（100°C 30分鐘不被破壞），「不具耐熱性」描述錯誤。","（正確）肉毒桿菌毒素是神經毒，作用於運動神經末梢，阻斷乙醯膽鹼釋放，引起鬆弛型麻痺，此述正確。","魏氏桿菌（C. perfringens）的毒素是在形成孢子（sporulation）時產生，而非細胞「分裂」時，「分裂時產生毒素」描述錯誤。","仙人掌菌（B. cereus）的下痢型毒素（diarrheal toxin）不耐熱，會被加熱破壞；嘔吐型毒素才具耐熱性，描述混淆。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_022","year":2017,"roc_year":106,"session":"1","examNo":22,"q":"下列何者為鸚鵡熱之主要傳染途徑？","opts":["A. 病媒叮咬","B. 吸入感染","C. 經口感染","D. 接觸感染"],"ans":1,"exp":"鸚鵡病（Psittacosis）的主要傳染途徑為吸入感染（inhalation）——吸入含有Chlamydophila psittaci的乾燥禽鳥糞便或分泌物形成的氣溶膠，是人類感染的最主要途徑。","we":["鸚鵡病不由病媒叮咬傳播，與節肢動物媒介無關。","（正確）鸚鵡病的主要傳染途徑是吸入含C. psittaci的氣溶膠（乾燥禽鳥排泄物粉塵），這是鳥類飼養員、獸醫師等職業暴露的主要感染方式。","鸚鵡病並非主要以消化道（經口）途徑感染，雖理論上可能，但並非主要傳播途徑。","直接接觸感染在理論上存在，但吸入感染才是最主要且最常見的傳播途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_023","year":2017,"roc_year":106,"session":"1","examNo":23,"q":"下列何種疾病的特徵性病變為在皮膚出現無痛性洞穿式潰瘍性焦痂（eschar）？","opts":["A. 恙蟲病","B. 鼠性斑疹傷寒","C. 洛磯山斑點熱","D. 地方性斑疹傷寒"],"ans":0,"exp":"恙蟲病（Scrub typhus）由恙蟲病立克次體（Orientia tsutsugamushi）引起，其特徵性病變為在恙蟲幼蟲叮咬部位形成無痛性洞穿式潰瘍性焦痂（eschar）——一個中央有黑色壞死組織的無痛性潰瘍。","we":["（正確）恙蟲病（Scrub typhus）是以無痛性焦痂（eschar）為特徵的立克次體病，焦痂出現在恙蟲幼蟲叮咬處，可幫助臨床診斷。","鼠性斑疹傷寒（Murine typhus，Rickettsia typhi）可引起皮疹，但不以焦痂為特徵。","洛磯山斑點熱（Rocky Mountain Spotted Fever，R. rickettsii）的特徵為廣泛的皮膚出血性斑疹（由四肢向軀幹蔓延），無典型焦痂。","地方性斑疹傷寒即鼠性斑疹傷寒，同上，不以焦痂為特徵病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_024","year":2017,"roc_year":106,"session":"1","examNo":24,"q":"下列有關隱球菌病（cryptococcosis）的敘述，何者錯誤？","opts":["A. 常與低免疫力有關","B. 主要表現為隱球菌性腦膜炎","C. 存在土壤及家禽、鴿子糞便中","D. 主要經由消化道進入人體"],"ans":3,"exp":"隱球菌（Cryptococcus neoformans）主要透過吸入（inhalation）含隱球菌孢子的空氣（來自鴿糞等禽鳥糞便）進入呼吸道，而非「主要經由消化道進入人體」，因此選項D的描述錯誤。","we":["隱球菌感染確實常與免疫力低下（如HIV/AIDS、使用免疫抑制劑）相關，此述正確。","隱球菌病的主要表現確為隱球菌性腦膜炎（Cryptococcal meningitis），此述正確。","隱球菌廣泛存在於土壤及鴿糞、家禽糞便中，此述正確。","（正確，即本題所問之錯誤）隱球菌主要經由呼吸道（吸入孢子）進入人體，而非消化道；「主要經消化道進入」描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_025","year":2017,"roc_year":106,"session":"1","examNo":25,"q":"下列關於日本住血吸蟲（Schistosoma japonicum）之敘述，何者正確？","opts":["A. 尾動幼蟲（cercariae）可經皮膚感染","B. 囊狀幼蟲（metacercariae）存在淡水魚類肌肉","C. 蟲卵可經污染之飲水而傳播","D. 幼蟲可經吸血昆蟲叮咬而傳播"],"ans":0,"exp":"日本住血吸蟲（Schistosoma japonicum）的感染途徑是：人類接觸含有尾動幼蟲（cercariae）的疫水時，尾動幼蟲主動穿透人體皮膚進入血液循環，這是血吸蟲症（Schistosomiasis）的標準感染途徑。","we":["（正確）日本住血吸蟲的尾動幼蟲（cercariae）可從水中主動穿透人類皮膚，這是血吸蟲症的特徵性感染途徑。","日本住血吸蟲沒有囊狀幼蟲（metacercariae）的生活史階段；metacercariae是吸蟲在中間宿主（魚、螺）組織中的感染型，如肝吸蟲等。","日本住血吸蟲的蟲卵不透過飲水傳播；蟲卵從糞便中排出，在水中孵化為毛動幼蟲，侵入中間宿主（釘螺），非飲水傳播給人。","日本住血吸蟲不由吸血昆蟲叮咬傳播；其傳播需要皮膚接觸含尾動幼蟲的水源。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_026","year":2017,"roc_year":106,"session":"1","examNo":26,"q":"麥地那絲狀蟲（Dracunculus medinensis），主要寄生於人及各種動物之皮下組織，其主要感染途徑為何？","opts":["A. 經皮膚接觸感染","B. 經由蚊子叮咬感染","C. 經由蠅類叮咬感染","D. 經飲水而食入水蚤感染"],"ans":3,"exp":"麥地那絲狀蟲（Dracunculus medinensis，龍線蟲）的生活史需要劍水蚤（Cyclops，一種小型甲殼動物）作為中間宿主。人類飲用含有帶蟲劍水蚤的生水後，劍水蚤在胃中被消化，幼蟲釋出，穿越腸壁後在皮下發育為成蟲，成蟲破皮而出，因此感染途徑為「經飲水食入水蚤感染」。","we":["麥地那絲狀蟲不透過皮膚接觸直接感染，幼蟲需在人體內通過消化道才能進入組織。","麥地那絲狀蟲的感染不需要蚊子，蚊子不是此蟲的傳播媒介。","蠅類也不是麥地那絲狀蟲的傳播媒介。","（正確）麥地那絲狀蟲透過飲用含有帶蟲劍水蚤（copepods）的生水感染，是典型的「水源性寄生蟲病」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_027","year":2017,"roc_year":106,"session":"1","examNo":27,"q":"2012年5月彰化有數位泰國籍外勞因食用未充分煮熟的福壽螺拌青菜辣椒而致病，最有可能感染下列何種寄生蟲？","opts":["A. 廣東住血線蟲","B. 猬粒絛蟲","C. 日本住血吸蟲","D. 弓蟲"],"ans":0,"exp":"2012年彰化外勞食用未充分煮熟的福壽螺（Pomacea canaliculata）引起的疫情，最有可能為廣東住血線蟲（Angiostrongylus cantonensis）感染，因為廣東住血線蟲以淡水螺（包括福壽螺）為中間宿主，幼蟲進入人體後主要侵犯腦部（嗜酸性腦膜炎）。","we":["（正確）廣東住血線蟲（Angiostrongylus cantonensis）以福壽螺等淡水螺類為中間宿主，食入含三期幼蟲的螺肉可引起嗜酸性腦膜炎，符合本題情境。","猬粒絛蟲（Echinococcus）需要食入蟲卵（來自犬糞污染食物）感染，與食用螺肉無關。","日本住血吸蟲透過皮膚接觸感染，與食用螺肉無關（雖螺為中間宿主，但非食螺傳播）。","弓蟲透過食入含包囊的肉類或接觸貓糞感染，與食用福壽螺無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_028","year":2017,"roc_year":106,"session":"1","examNo":28,"q":"下列何種寄生蟲不會造成內臟仔蟲移行症（visceral larva migrans）？","opts":["A. Dioctophyma renale","B. Toxocara canis","C. Toxocara cati","D. Gnathostoma spinigerum"],"ans":0,"exp":"腎巨大線蟲（Dioctophyma renale）是一種主要寄生於水獺、犬等動物腎臟的大型線蟲，其幼蟲在人體偶發性移行時不造成典型的「內臟仔蟲移行症（VLM）」模式，VLM主要由Toxocara屬和Gnathostoma屬引起。Dioctophyma主要引起腎臟的物理性損傷，與VLM的定義不同。","we":["（正確）Dioctophyma renale（腎巨大線蟲）在人體中主要造成腎臟物理性損傷，不是典型VLM的病原，選項A是本題所問「不造成VLM」的選項。","Toxocara canis（犬蛔蟲）是引起內臟仔蟲移行症（VLM）的最重要病原，幼蟲在人體內臟中移行。","Toxocara cati（貓蛔蟲）也可引起VLM，與T. canis類似，幼蟲在人體組織中移行。","Gnathostoma spinigerum（有棘顎口蟲）引起顎口蟲症，幼蟲在人體皮下及內臟廣泛移行，符合VLM的廣義定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_029","year":2017,"roc_year":106,"session":"1","examNo":29,"q":"人食用未煮熟之泥鰍會感染下列何種寄生蟲？","opts":["A. 衛氏肺吸蟲","B. 旋毛蟲","C. 有棘顎口蟲","D. 貓蛔蟲"],"ans":2,"exp":"有棘顎口蟲（Gnathostoma spinigerum）的第二中間宿主包括泥鰍（loach）等淡水魚類。食用未充分煮熟的泥鰍可感染有棘顎口蟲，幼蟲在人體組織中移行引起皮膚（及內臟）仔蟲移行症。","we":["衛氏肺吸蟲（Paragonimus westermani）的感染源為溪蟹或蝲蛄（甲殼類），非泥鰍；食用未煮熟溪蟹才感染。","旋毛蟲（Trichinella spiralis）的感染源為豬肉或野生動物肉（熊、野豬等），非泥鰍。","（正確）有棘顎口蟲（G. spinigerum）可寄生於泥鰍等淡水魚，食用未煮熟泥鰍是感染此蟲的主要途徑之一。","貓蛔蟲（Toxocara cati）透過食入蟲卵（糞口途徑）或食入含幼蟲的轉續宿主感染，食用泥鰍並非主要感染途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_030","year":2017,"roc_year":106,"session":"1","examNo":30,"q":"曾有報導證實國人因生吃甲魚（鱉）肉而感染下列何種魚媒介類寄生蟲？","opts":["A. 海獸胃線蟲","B. 旋毛蟲","C. 中華肝吸蟲","D. 廣東住血線蟲"],"ans":2,"exp":"中華肝吸蟲（Clonorchis sinensis，又稱華支睪吸蟲）可寄生於甲魚（鱉）中作為第二中間宿主。台灣曾有國人生吃甲魚肉而感染中華肝吸蟲的報告，此蟲成蟲寄生於人類及哺乳動物的膽道中，引起肝膽系統病變。","we":["海獸胃線蟲（Anisakis）主要存在於海水魚類及頭足類（花枝等）中，甲魚為淡水動物，並非海獸胃線蟲的宿主。","旋毛蟲（Trichinella）主要存在於豬肉等哺乳動物肌肉中，甲魚非旋毛蟲的主要宿主。","（正確）中華肝吸蟲（Clonorchis sinensis）可寄生於淡水魚及甲魚（鱉）的肌肉中，食用未充分加熱的甲魚肉可導致感染。","廣東住血線蟲（Angiostrongylus cantonensis）主要寄生於淡水螺類（如福壽螺），甲魚並非其主要宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_031","year":2017,"roc_year":106,"session":"1","examNo":31,"q":"下列何種蟲雖經投予驅蟲藥後仍不能被排出宿主體外？","opts":["A. 橫川氏吸蟲（Metagonimus yokogawai）","B. 布氏薑片蟲（Fasciolopsis buski）","C. 短小包膜絛蟲（Hymenolepis nana）","D. 班氏絲狀蟲（Wuchereria bancrofti）"],"ans":3,"exp":"班氏絲狀蟲（Wuchereria bancrofti，引起淋巴絲蟲病）的成蟲寄生於淋巴管，蟲體不存在於腸道，投予驅蟲藥後無法透過腸道排出（因為成蟲位於深層淋巴管組織中），必須使用特定治療（如乙胺嗪diethylcarbamazine）使微絲蚴死亡後逐漸吸收。","we":["橫川氏吸蟲（Metagonimus yokogawai）寄生於小腸，投予適當驅蟲藥（如吡喹酮）後可排出蟲體。","布氏薑片蟲（Fasciolopsis buski）寄生於小腸，投予驅蟲藥可有效驅除蟲體。","短小包膜絛蟲（Hymenolepis nana）寄生於小腸，驅蟲藥（如吡喹酮）可有效驅除。","（正確）班氏絲狀蟲的成蟲寄生於淋巴管深處，投予驅蟲藥後無法透過腸道排出，需透過特定療法使蟲體在組織中死亡吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_032","year":2017,"roc_year":106,"session":"1","examNo":32,"q":"那一種疾病不經由魚類感染人？","opts":["A. 橫川氏吸蟲症","B. 薑片吸蟲症","C. 海獸胃線蟲症","D. 有棘顎口蟲症"],"ans":1,"exp":"薑片吸蟲症（Fasciolopsiasis，布氏薑片蟲症）的感染源是水生植物（如菱角、荸薺、蓮藕等）上附著的囊蚴（metacercariae），並非魚類；食用含囊蚴的水生植物才是薑片吸蟲的感染途徑，與魚類無關。","we":["橫川氏吸蟲症（Metagonimiasis）的感染源為淡水魚（含囊蚴），確實透過魚類感染人。","（正確）薑片吸蟲症的感染途徑為食用含囊蚴的水生植物（非魚類），是本題中「不經由魚類感染人」的疾病。","海獸胃線蟲症（Anisakiasis）的感染源為海水魚類，確實透過魚類感染人。","有棘顎口蟲症的感染源包括淡水魚（及蛙肉），確實透過魚類（及蛙）感染人。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_033","year":2017,"roc_year":106,"session":"1","examNo":33,"q":"美國對Zilpaterol在牛肝臟規定最高容許殘留量（MRL）為0.012 ppm，請問臺灣動物用藥殘留標準對牛肝臟MRL的規定為何？","opts":["A. 不得檢出","B. 0.012 ppm","C. 0.005 ppm","D. 0.001 ppm"],"ans":0,"exp":"台灣動物用藥殘留標準規定，牛肝臟中Zilpaterol（乙帕特醇，一種β-促效劑，類似萊克多巴胺）不得檢出（zero tolerance），即使美國規定0.012 ppm，台灣採最嚴格的零殘留標準。","we":["（正確）台灣規定牛肝臟中Zilpaterol不得檢出（零容許量），採比美國更嚴格的標準。","0.012 ppm是美國規定值，台灣並未採用此標準，台灣採零殘留。","0.005 ppm並非台灣對Zilpaterol的規定值，台灣採零殘留標準。","0.001 ppm並非台灣對Zilpaterol的規定值，台灣採不得檢出的零容許量標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_034","year":2017,"roc_year":106,"session":"1","examNo":34,"q":"多數國家生乳檢驗均以密度（比重）方法來測定水的攙拌與否，一般牛乳正常比重是1.028～1.034，操作時必須在特定溫度\r 下，否則須以下列何者溫度校正之？","opts":["A. 5℃","B. 10℃","C. 15℃","D. 25℃"],"ans":2,"exp":"牛乳比重測定應在15°C下進行（國際標準），操作時若溫度不在15°C，需依照15°C校正。每偏離1°C，比重修正值約為0.0002。","we":["5°C不是牛乳比重測定的標準校正溫度，此溫度主要用於食品冷藏。","10°C不是牛乳比重測定的國際標準溫度。","（正確）牛乳比重測定的國際標準溫度為15°C，操作時需以15°C作為基準進行溫度校正。","25°C不是牛乳比重測定的標準溫度，在此溫度下液體密度較低，需校正。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_035","year":2017,"roc_year":106,"session":"1","examNo":35,"q":"關於甲級乳品質之敘述，下列何者錯誤？","opts":["A. 無脂固形物8.5％","B. 乳脂率3.0以上","C. 細菌數50萬以下","D. 酒精試驗陰性"],"ans":2,"exp":"依台灣優良農產品（CAS）甲級乳品質標準，細菌數的規定為「50,000 CFU/mL以下」（5萬以下），並非「50萬以下」。選項C「細菌數50萬以下」描述錯誤，應為5萬以下。","we":["甲級乳無脂固形物（SNF）規定為8.5%以上，此述正確。","甲級乳乳脂率規定為3.0%以上，此述正確。","（正確，即本題所問之錯誤）甲級乳的細菌數規定應為50,000 CFU/mL（5萬）以下，而非「50萬以下」；選項C數字錯誤。","甲級乳酒精試驗應為陰性（表示乳蛋白穩定，無摻水或酸敗），此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_036","year":2017,"roc_year":106,"session":"1","examNo":36,"q":"依據臺灣優良農產品驗證管理辦法中，有關液蛋之定義為雞蛋收集後，經洗淨、風乾、檢驗、打蛋去殼、蛋白與蛋黃分離或不\r 分離、殺菌，包裝後冷藏或冷凍者。請問冷藏與冷凍之溫度分別為何？","opts":["A. 7℃與-18℃以下","B. 4℃與-15℃以下","C. 2℃與-4℃以下","D. 7℃與-4℃以下"],"ans":0,"exp":"依台灣優良農產品驗證管理辦法，液蛋殺菌後需冷藏或冷凍保存，冷藏溫度為7°C以下，冷凍溫度為-18°C以下，此為液蛋保存的標準規定。","we":["（正確）液蛋冷藏溫度為7°C以下，冷凍溫度為-18°C以下，此為台灣優良農產品液蛋保存的標準規定。","4°C與-15°C的組合不符合台灣液蛋保存的規定；冷凍應為-18°C以下。","2°C與-4°C的組合完全不符合規定，-4°C遠不足以達到冷凍效果。","7°C與-4°C的組合不符合規定，冷凍溫度應為-18°C以下，而非-4°C。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_037","year":2017,"roc_year":106,"session":"1","examNo":37,"q":"依現今標準，液蛋殺菌後，沙氏桿菌含菌量（cfu/25g）之規定，下列何者正確？","opts":["A. ＜5,000","B. 25","C. 6","D. 0"],"ans":3,"exp":"依液蛋殺菌後品質標準，液蛋殺菌後沙氏桿菌（Salmonella）含菌量應為0（不得檢出），即每25克液蛋中不得檢出沙氏桿菌（零容許量），此為食品安全的最嚴格要求。","we":["<5,000 cfu/25g完全不符合殺菌後液蛋的標準，殺菌後沙氏桿菌應不得檢出。","25 cfu/25g不符合殺菌後液蛋的標準，任何數量的沙氏桿菌均不被允許。","6 cfu/25g不符合規定，殺菌後液蛋中沙氏桿菌含菌量應為0。","（正確）液蛋殺菌後，每25克中沙氏桿菌含菌量規定為0（不得檢出），確保液蛋產品的食用安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_038","year":2017,"roc_year":106,"session":"1","examNo":38,"q":"依據臺灣優良農產品驗證管理辦法對皮蛋之檢驗項目、方法與標準規定鉛含量之標準為多少 ppm 以下？","opts":["A. 0.1","B. 0.3","C. 0.5","D. 1.0"],"ans":1,"exp":"依台灣優良農產品驗證管理辦法，皮蛋（preserved egg）的鉛（Pb）含量規定為0.3 ppm以下，是皮蛋品質安全的重要指標（傳統皮蛋製作使用氧化鉛，鉛含量管控是公衛重點）。","we":["0.1 ppm低於規定標準，台灣皮蛋鉛含量規定為0.3 ppm以下，0.1雖符合規定但並非規定上限值。","（正確）台灣優良農產品對皮蛋鉛含量的規定為0.3 ppm以下，此為保護消費者免受鉛暴露的食品安全標準。","0.5 ppm超過台灣皮蛋鉛含量規定（0.3 ppm以下），不符合規定。","1.0 ppm遠超過規定標準，此濃度的鉛在食品中屬不合格品。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_039","year":2017,"roc_year":106,"session":"1","examNo":39,"q":"依現行規定之動物用藥殘留標準，家禽蛋類中磺胺劑的最高殘留容許濃度為多少 ppm？","opts":["A. 10","B. 1","C. 0.1","D. 0.01"],"ans":2,"exp":"依台灣動物用藥殘留標準，家禽蛋類中磺胺劑（sulfonamides）的最高殘留容許濃度為0.1 ppm（100 μg/kg）。","we":["10 ppm遠超過家禽蛋類磺胺劑的規定值，此選項錯誤。","1 ppm超過規定值（0.1 ppm），此選項錯誤。","（正確）依現行規定，家禽蛋類中磺胺劑的最高殘留容許濃度為0.1 ppm，此為台灣動物用藥殘留標準的明確規定。","0.01 ppm低於規定值；蛋類磺胺劑規定為0.1 ppm，而非更嚴格的0.01 ppm。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_040","year":2017,"roc_year":106,"session":"1","examNo":40,"q":"動物用藥殘留標準是依據下列何種法律訂定的？","opts":["A. 畜牧法","B. 動物用藥品管理法","C. 動物傳染病防治條例","D. 食品安全衛生管理法"],"ans":1,"exp":"動物用藥殘留標準是依據「動物用藥品管理法」訂定的，該法授權主管機關訂定各動物產品中動物用藥品的最高殘留容許量，以保障食品安全和公共衛生。","we":["畜牧法主要規範畜牧業的許可、屠宰場設置及乳業管理等，並非動物用藥殘留標準的直接授權法律。","（正確）動物用藥殘留標準係依據「動物用藥品管理法」第32條之授權訂定，規範各種動物產品中藥物殘留的最高容許量。","動物傳染病防治條例主要規範動物疫病的防治，不是動物用藥殘留標準的訂定依據。","食品安全衛生管理法（食安法）由衛福部主管，規範食品添加物等；動物用藥殘留標準則由農政主管機關依動物用藥品管理法訂定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_041","year":2017,"roc_year":106,"session":"1","examNo":41,"q":"蛋的新鮮度判定中，下列何者錯誤？","opts":["A. 外觀法：蛋殼表面光滑為新鮮蛋","B. 搖動法：搖動蛋體，毫無感覺移動者為新鮮蛋","C. 比重法：腐敗蛋比重通常低於1.02，若低於1.05為陳舊蛋","D. 照光法：蛋之鈍端其氣室極小者為新鮮蛋"],"ans":0,"exp":"蛋的新鮮度比重判定：新鮮蛋比重約1.080-1.090（高）；腐敗蛋因蛋白水分蒸發、氣室擴大，比重降低至約1.02以下；陳舊蛋（次新鮮蛋）比重低於1.055（非1.05）。選項C「低於1.05為陳舊蛋」數值有誤，應為低於1.055才判為陳舊蛋——但最主要的錯誤是「腐敗蛋低於1.02」（應是低於1.025）。考選部答案為A（外觀法：蛋殼表面光滑為新鮮蛋）——實際上新鮮蛋蛋殼表面有一層粉霜（bloom/cuticle），感覺粗糙，而非「光滑」；陳舊蛋因粉霜脫落反而較光滑。","we":["（正確，即本題所問之錯誤）新鮮蛋蛋殼表面應有粉霜（霧面感），而非光滑；光滑的蛋殼反而表示蛋不新鮮（粉霜已消失），選項A的外觀描述錯誤。","搖動法：新鮮蛋蛋白濃稠，搖動時無移動感，此述正確。","比重法的數值（腐敗蛋<1.02，陳舊蛋<1.05）在不同教科書間略有差異，考選部認定選項C正確；實際上選項A更明確是錯誤的描述。","照光法：新鮮蛋氣室小（鈍端），氣室越大表示越不新鮮，此述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_042","year":2017,"roc_year":106,"session":"1","examNo":42,"q":"發現牛乳遭受抗生素污染時，應採取下列那種措施？","opts":["A. 經-20℃冷凍處理後仍可食用","B. 過濾後仍可食用","C. 將過去一週內搾得的乳汁全數廢棄","D. 經巴士德處理法加熱消毒後准予食用"],"ans":2,"exp":"牛乳一旦遭受抗生素污染，抗生素（如盤尼西林、四環素等）無法透過冷凍、過濾或巴氏德消毒法去除，因此受污染的乳汁應全數廢棄。廢棄範圍需涵蓋用藥期間及停藥後合理期間（一週）的乳汁。","we":["-20°C冷凍無法破壞抗生素活性，冷凍後抗生素殘留仍存在，不可食用。","過濾無法去除溶於乳汁中的抗生素（分子量太小，分子溶解於乳汁中），不可食用。","（正確）受抗生素污染的牛乳，無論採取何種處理，均應全數廢棄；應廢棄自用藥至停藥後適當停藥期間內搾得的乳汁（通常建議廢棄過去一週的乳汁）。","巴氏德消毒法（72°C/15秒）主要用於殺菌，無法分解或去除抗生素殘留，此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_043","year":2017,"roc_year":106,"session":"1","examNo":43,"q":"家畜經判定疑有邊蟲病，應依屠宰衛生檢查獸醫師指示予以","opts":["A. 緊急屠宰","B. 廢棄","C. 稽留","D. 宰殺"],"ans":2,"exp":"依「屠宰衛生檢查規則」，家畜經判定疑有邊蟲病（Anaplasmosis）或其他特定疾病時，應依獸醫師指示予以「稽留（detention）」——即暫時扣留、觀察並等待進一步診斷，不得擅自屠宰或廢棄。","we":["緊急屠宰適用於有緊急狀況（如骨折、難產）但不涉及傳染病疑慮的家畜，疑有邊蟲病時不應緊急屠宰。","廢棄（全頭廢棄）適用於確診嚴重傳染病或不適人食用的屠體，疑有邊蟲病時尚未確診，應先稽留而非直接廢棄。","（正確）疑有邊蟲病或其他特定疾病時，應依屠宰衛生檢查獸醫師指示予以「稽留」，等待進一步診斷或觀察。","宰殺並非「屠宰衛生檢查規則」規定的處置項目，疑有傳染病的家畜應稽留而非直接宰殺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_044","year":2017,"roc_year":106,"session":"1","examNo":44,"q":"依我國「屠宰作業準則」規定，屠宰場用於消毒的熱水應為幾度以上？","opts":["A. 攝氏83度","B. 攝氏95度","C. 華氏83度","D. 華氏95度"],"ans":0,"exp":"依台灣「屠宰作業準則」規定，屠宰場用於消毒器具的熱水水溫應為攝氏82°C（某些規定為83°C）以上，以有效殺滅微生物。考選部公布答案為A（攝氏83度）。","we":["（正確）依屠宰作業準則，消毒器具用熱水應達攝氏83度以上，以確保消毒效果。","攝氏95度雖高於規定，但並非本規定的最低要求值；規定下限為83°C。","華氏83度約等於攝氏28度，遠不足以消毒，此溫度完全不符合消毒要求。","華氏95度約等於攝氏35度，同樣遠不足以達到消毒效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_045","year":2017,"roc_year":106,"session":"1","examNo":45,"q":"下列有關屠宰場一般設施規定的敘述中，何者錯誤？","opts":["A. 更衣室應設於屠宰作業區附近適當之地點","B. 屠宰場對外出入口設泡鞋池或同等功能之潔淨鞋底設備，並應設置洗手消毒設施","C. 設有廢棄屠體之化製或燒燬設備者，其容量至少應可放入整頭屠體","D. 廁所應與屠宰、分切包裝之場所完全隔離，其建築地點應距水源（井）5公尺以上"],"ans":3,"exp":"依「屠宰場設置標準」，廁所應與屠宰、分切包裝場所完全隔離，其建築地點應距水源（井）15公尺以上（非5公尺），以防止廁所排泄物污染水源及屠宰場環境。","we":["更衣室應設於作業區附近，此述正確。","出入口設泡鞋池及洗手消毒設施，此述正確。","廢棄屠體化製或燒燬設備容量至少可放入整頭屠體，此述正確（以備緊急處置需要）。","（正確，即本題所問之錯誤）廁所距水源應為15公尺以上，而非5公尺；選項D「5公尺以上」描述錯誤，應為15公尺以上，以防止污染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_046","year":2017,"roc_year":106,"session":"1","examNo":46,"q":"家畜屠宰前應儘量避免使用電擊棒驅趕，使用交流電之電擊棒應將電壓減低至50伏特以下，是下列何種法規的規定？","opts":["A. 屠宰作業準則","B. 屠宰衛生檢查規則","C. 屠宰場設置標準","D. 屠宰衛生檢查收費標準"],"ans":0,"exp":"「家畜屠宰前應盡量避免使用電擊棒驅趕，使用交流電的電擊棒應將電壓減低至50伏特以下」，此規定載於「屠宰作業準則」中，屬於屠宰作業前家畜人道處理的規範。","we":["（正確）電擊棒電壓限制（50伏特以下）屬於屠宰作業中對家畜人道對待的操作規範，載於「屠宰作業準則」。","屠宰衛生檢查規則規範屠前、屠後的衛生檢查程序，不涉及電擊棒電壓限制。","屠宰場設置標準規範屠宰場的硬體設施規格，不規範操作流程中的電擊棒使用。","屠宰衛生檢查收費標準規範各項屠宰衛生檢查的收費金額，不涉及操作流程。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_047","year":2017,"roc_year":106,"session":"1","examNo":47,"q":"屠宰場使家畜、家禽於放血前之致昏作業，下列何種昏厥之設備不可使用？","opts":["A. 電擊器","B. 撞擊器","C. 二氧化碳昏厥設備","D. 木棒敲擊"],"ans":3,"exp":"依「屠宰作業準則」，家畜禽致昏設備包括電擊器、撞擊器（captive bolt）及二氧化碳昏厥設備均為合法設備；「木棒敲擊」屬不人道方式，不符合現代動物福利要求，不可使用。","we":["電擊器（電擊致昏）是合法且常用的人道致昏設備，可使用。","撞擊器（captive bolt pistol）是常用的人道致昏設備，適用於牛、羊、豬等，可使用。","二氧化碳昏厥設備（CO2 stunning）適用於豬隻，是合法的人道致昏方式，可使用。","（正確）木棒敲擊頭部屬粗暴且不人道的方式，無法確保致昏效果，違反屠宰作業準則的人道要求，不可使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_048","year":2017,"roc_year":106,"session":"1","examNo":48,"q":"依據屠宰作業準則，下列有關家畜禽屠宰之一般作業規定的敘述，何者錯誤？","opts":["A. 繫留場之家畜禽排泄物應洗淨或適當處理","B. 在繫留欄中，應提供動物飲水。需在繫留欄過夜之動物，應有充足之空間以供動物躺下","C. 家畜禽於剖腹或切下頭部後，開始施行屠宰衛生檢查前，屠體應先沖洗","D. 家畜禽尚未經人道方式昏厥前，不得綑綁、拋投、丟擲、切割及放血"],"ans":2,"exp":"依屠宰作業準則，家禽屠宰流程中，應在剖腹（取內臟）之前沖洗屠體，而非「剖腹或切下頭部後，開始施行屠宰衛生檢查前，屠體先沖洗」——正確程序是先沖洗再取內臟，選項C的時間點描述有誤（應在取內臟前沖洗）。考選部答案為C（0-indexed=2）。","we":["繫留場排泄物應洗淨或適當處理，此述正確。","繫留欄內應提供飲水，過夜動物應有足夠空間躺下，此述正確，符合動物福利原則。","（正確，即本題所問之錯誤）正確程序應是在剖腹取內臟之前先沖洗屠體，選項C的描述時間點（剖腹或切下頭部後才沖洗）違反正確屠宰流程，可能造成交叉污染。","家畜禽昏厥前不得綑綁、拋投、切割及放血，此述正確，符合人道屠宰原則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_049","year":2017,"roc_year":106,"session":"1","examNo":49,"q":"依據屠宰作業準則，下列有關家禽屠宰作業規定之敘述，何者錯誤？","opts":["A. 燙毛時，每隻家禽放入燙毛槽後應能溢出適當之水量，以保持水之清潔度","B. 脫離之羽毛以容器收集者，其容器應置於污染作業區內，並適時搬離屠宰場所","C. 取內臟之作業前，應更換掛鉤，原掛鉤須清洗及消毒後始可再使用","D. 與屠體接觸過之刀具應立即以含氯消毒劑消毒，以避免交叉污染"],"ans":3,"exp":"依屠宰作業準則，家禽屠宰時與屠體接觸過的刀具應以熱水（82°C/83°C以上）消毒，而非使用含氯消毒劑——含氯消毒劑可能造成肉品化學污染，刀具消毒應使用熱水消毒，選項D的消毒方式不符規定。","we":["燙毛槽應能溢出適當水量以保持清潔度，此述正確。","脫離羽毛應以容器收集，容器置污染區並適時搬離，此述正確。","取內臟作業前應更換掛鉤，用過的掛鉤清洗消毒後才可再用，此述正確，符合衛生規定。","（正確，即本題所問之錯誤）刀具應使用熱水（82-83°C以上）消毒，而非含氯消毒劑；使用化學消毒劑可能污染肉品，是規定所不允許的作法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_050","year":2017,"roc_year":106,"session":"1","examNo":50,"q":"卵白蛋白具有下列何種功能？","opts":["A. 抑制胰蛋白酶作用","B. 抑制病毒引起紅血球凝集","C. 與鐵螯合抑制細菌生長","D. 具有溶解酵素的作用"],"ans":3,"exp":"蛋白中的溶菌素（lysozyme，又稱溶菌酶）具有溶解細菌細胞壁（特別是革蘭氏陽性菌肽聚糖）的作用，是雞蛋白天然的抗菌防禦成分。","we":["抑制胰蛋白酶作用的蛋白成分是卵黏蛋白（ovomucoid），而非卵白蛋白（ovalbumin）。","抑制病毒引起紅血球凝集的是卵黏蛋白（ovomucoid）等，並非卵白蛋白。","與鐵螯合抑制細菌生長的是伴清蛋白（conalbumin/ovotransferrin），可螯合鐵離子使細菌無法利用鐵，並非卵白蛋白的功能。","（正確）卵白蛋白（ovalbumin）雖為蛋白中主要蛋白質，但「溶解酵素作用」（lysozyme activity）是溶菌素的功能，不是卵白蛋白的功能。考選部答案為D——實際上這是對蛋白成分功能的分類測驗，溶菌素（lysozyme）具有溶解酵素作用，考選部公布答案D代表蛋白確有「具有溶解酵素的作用」的成分（即溶菌素）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_051","year":2017,"roc_year":106,"session":"1","examNo":51,"q":"下列對肉毒桿菌毒素預防之敘述，何者錯誤？","opts":["A. 將食物冷藏在3℃以下","B. 注意不要食用外形隆凸的罐頭","C. 肉毒桿菌芽孢耐熱性高，80℃加熱數分鐘不足以殺滅","D. 使人中毒的毒素型以A、C、D為主"],"ans":3,"exp":"引起人類肉毒桿菌中毒的毒素型主要為A型、B型及E型，而非「A、C、D型」。C型和D型主要引起動物（家禽、牛）的肉毒桿菌中毒，並非主要引起人類中毒的型別，因此選項D的描述是錯誤的。","we":["3°C以下冷藏確實可抑制肉毒桿菌生長及毒素產生，此述正確。","外形隆凸的罐頭（因產氣菌繁殖）確實是肉毒桿菌污染的警示，應避免食用，此述正確。","肉毒桿菌芽孢具高度耐熱性，需121°C（高壓蒸氣滅菌）才能殺滅，80°C確實不足以殺滅芽孢，此述正確。","（正確，即本題所問之錯誤）使人中毒的肉毒桿菌毒素型以A、B、E型為主，C型和D型主要引起動物中毒，「A、C、D為主」的描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_052","year":2017,"roc_year":106,"session":"1","examNo":52,"q":"慢速過濾法為淨水方法之一，請問此種方法之濾床構造由上層至下層分別為","opts":["A. 砂礫層－細砂層－卵石層","B. 卵石層－砂礫層－細砂層","C. 砂礫層－卵石層－細砂層","D. 細砂層－砂礫層－卵石層"],"ans":3,"exp":"慢速過濾法（slow sand filtration）的濾床構造由上至下為：細砂層→砂礫層→卵石層，上層的細砂層主要依靠微生物膜（schmutzdecke）去除污染物，下層砂礫和卵石提供支撐及排水。","we":["砂礫層→細砂層→卵石層的順序不正確，細砂層應在最上層。","卵石層→砂礫層→細砂層的順序相反，此為排水層在上、過濾層在下，不符合慢速過濾的設計原理。","砂礫層→卵石層→細砂層的順序不正確，細砂層應在最上層，用於過濾最細小的懸浮物。","（正確）慢速過濾法濾床由上至下為：細砂層（過濾層，含有效的生物膜）→砂礫層（過渡層）→卵石層（支撐層/排水層）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_053","year":2017,"roc_year":106,"session":"1","examNo":53,"q":"老鼠常造成畜牧及其相關產業困擾，並有可能傳播人畜共通傳染病。下列何者不是有效的控制鼠類方法？","opts":["A. 倉庫定期清理","B. 將雜物堆積室內外","C. 垃圾密封加蓋","D. 定期清理水溝"],"ans":1,"exp":"有效的鼠類控制方法應消除鼠類的食物來源、棲息地及進出通道。將雜物堆積於室內外（B選項）反而提供鼠類更多的棲息地和藏身處，是無效（甚至有害）的控制方法，應選擇此項為「不是有效控制鼠類的方法」。","we":["倉庫定期清理可消除鼠類的糧食來源和棲息地，是有效的鼠類控制方法。","（正確）將雜物堆積於室內外反而為鼠類提供棲息及藏身場所，是增加鼠患的行為，不是有效控制鼠類的方法。","垃圾密封加蓋可減少鼠類的食物來源，是有效的鼠類控制措施。","定期清理水溝可消除鼠類的水源及藏身處，是有效的鼠類控制方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_054","year":2017,"roc_year":106,"session":"1","examNo":54,"q":"畜牧廢水之厭氣處理方法中，下列何者不是其特點？","opts":["A. 橫置式處理過程所需空間小","B. 處理時間長","C. 產生沼氣","D. 可處理高濃度廢水"],"ans":0,"exp":"厭氣（anaerobic）處理方法的主要特點是不需要供氧設備（節能）、可產生沼氣（biogas）作為能源回收、可處理高濃度廢水、但處理時間較長。「橫置式處理過程所需空間小」並非厭氣處理的特點，且與「處理時間長」矛盾——橫置式反應器是一種設計，但並非厭氣處理「不是其特點」的選項。考選部答案為A（橫置式處理所需空間小並非厭氣處理的特點）。","we":["（正確）「橫置式處理過程所需空間小」並非厭氣處理的固有特點，且厭氣處理通常需要較大的體積/空間以維持足夠的水力停留時間，選項A不是厭氣處理的特點。","厭氣處理的確需要較長的處理時間（水力停留時間長），此為厭氣處理的固有特點，非本題所問之不屬於特點的選項。","厭氣處理確實會產生沼氣（主要為甲烷CH4），可回收作為能源，是厭氣處理的重要特點。","厭氣處理可以有效處理高濃度（高BOD）廢水，是其相較於好氣處理的優勢，是其特點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_055","year":2017,"roc_year":106,"session":"1","examNo":55,"q":"水源受到何種物質的長期污染會產生赤潮？","opts":["A. 重金屬","B. 工業廢水","C. 無機排泄物","D. 有機排泄物"],"ans":3,"exp":"赤潮（red tide，有害藻華）是由於水體中大量有機排泄物（有機物，特別是含氮、磷的有機物）污染，造成富營養化（eutrophication），導致藻類（浮游植物）大量繁殖，進而形成赤潮現象。","we":["重金屬污染水體可引起毒性傷害，但不直接導致藻類大量繁殖形成赤潮。","一般工業廢水若含有機物則可能助長赤潮，但「工業廢水」本身過於籠統，有機排泄物是更直接的赤潮原因。","無機排泄物（如銨鹽、磷酸鹽）雖可提供藻類營養，但有機排泄物分解後產生無機鹽，有機排泄物是更根本的來源。","（正確）水源受有機排泄物（富含氮、磷的有機物）長期污染，引起富營養化，促使藻類大量繁殖，最終形成赤潮（有害藻華）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_056","year":2017,"roc_year":106,"session":"1","examNo":56,"q":"食品安全檢驗與動植物防疫檢疫（Sanitary and Phytosanitary，SPS）是國際間通行的重要措施，為避免SPS措施對國際農產\r 品貿易造成限制性的影響，世界貿易組織鼓勵會員採用包括三個國際組織所制定之國際標準，請問，這三個國際組織不包含下\r 列那一個？","opts":["A. 國際食品標準委員會（Codex）","B. 世界動物衛生組織（OIE）","C. 國際植物保護公約（IPPC）","D. 食品添加劑專家委員會（JECFA）"],"ans":3,"exp":"WTO的SPS協定鼓勵會員採用三個國際組織制定的標準：①Codex（國際食品標準委員會）、②OIE（世界動物衛生組織）、③IPPC（國際植物保護公約）。JECFA（食品添加劑專家委員會）是Codex的附屬機構，並非WTO/SPS認定的三個獨立國際標準組織之一。","we":["Codex（食品法典委員會）是WTO/SPS認定的三個國際標準組織之一，負責食品安全標準。","OIE（世界動物衛生組織）是WTO/SPS認定的三個標準組織之一，負責動物衛生標準。","IPPC（國際植物保護公約）是WTO/SPS認定的三個標準組織之一，負責植物衛生標準。","（正確）JECFA（食品添加劑專家委員會）是FAO/WHO的聯合專家委員會，屬Codex的附屬機構，並非WTO/SPS獨立認定的三個國際標準組織之一，故本題答案為D。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_057","year":2017,"roc_year":106,"session":"1","examNo":57,"q":"依據動物傳染病防治條例施行細則規定，牛、綿羊、山羊、豬及其他偶蹄動物，輸出隔離檢疫日數為幾日？","opts":["A. 7日","B. 10日","C. 15日","D. 21日"],"ans":2,"exp":"依「動物傳染病防治條例施行細則」，牛、綿羊、山羊、豬及其他偶蹄動物輸出前的隔離檢疫日數為21日（三週），此為防止輸出動物攜帶傳染病（如口蹄疫）的重要措施。","we":["7日（一週）的隔離期不足以觀察口蹄疫等偶蹄動物重要傳染病的潛伏期，不符合法規規定。","10日的隔離期不符合法規規定的21日要求。","15日的隔離期不符合法規規定的21日要求，偶蹄動物需21日。","（正確）依動物傳染病防治條例施行細則，偶蹄動物（牛、綿羊、山羊、豬等）輸出前隔離檢疫日數為21日，以充分觀察並排除傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_058","year":2017,"roc_year":106,"session":"1","examNo":58,"q":"為調查某社區之犬隻接受狂犬病疫苗注射之盛行率，下列那一種群體中選取樣本的相對偏差較小？","opts":["A. 從有寵物晶片植入紀錄者","B. 從該地區所有住址","C. 從該地區電話簿","D. 從該地區寵物醫療院所之紀錄"],"ans":1,"exp":"為調查某社區犬隻狂犬病疫苗接種的盛行率，選取樣本時應從「該地區所有住址」取樣，因為這樣的骨架（sampling frame）最能代表該地區所有有養犬的家庭，相對偏差（selection bias）較小。其他選項均有選擇性偏差（只代表已登記、已就醫或已植入晶片的犬隻）。","we":["從有寵物晶片植入紀錄者取樣，只代表已登記並植入晶片的犬隻，未登記的犬隻被排除，選擇偏差大。","（正確）從該地區所有住址取樣，最能代表社區中所有家庭（含養犬和未養犬），是最能降低選擇偏差的抽樣框架。","從電話簿取樣只代表有登記電話的用戶，且電話簿日益過時，覆蓋率不完整，選擇偏差存在。","從寵物醫療院所紀錄取樣，只代表有就醫記錄的犬隻，未就醫的犬隻（可能接種率更低）被排除，高估接種率的偏差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_059","year":2017,"roc_year":106,"session":"1","examNo":59,"q":"有關獸醫流行病學研究方法和相關性強度的表示法，下列敘述何者正確？","opts":["A. 相對風險（relative risk）不適用於世代研究法（cohort study）","B. 勝算比（odds ratio）只適用於病例對照法（case-control study）","C. 相對風險（relative risk）只適用於病例對照法（case-control study）","D. 當疾病為少見疾病時，勝算比（odds ratio）可間接用來預估相對風險（relative risk）"],"ans":3,"exp":"當疾病為少見疾病時（罕見病），病例對照研究中的勝算比（OR）可以很好地估計（近似）相對風險（RR），因為當盛行率很低時，OR ≈ RR（稀有疾病假設）。","we":["相對風險（RR）可應用於世代研究法（cohort study）中計算，並非「不適用」，選項A描述錯誤。","勝算比（OR）也可應用於橫斷研究及世代研究，並非「只適用於病例對照法」，選項B描述過於絕對。","相對風險（RR）主要適用於世代研究（cohort study）和隨機對照試驗，而非「只適用於病例對照法」，選項C描述錯誤（應是OR才主要用於病例對照研究）。","（正確）當疾病為少見疾病時（稀有疾病假設），OR可以作為RR的良好近似估計值，這是病例對照研究的重要應用原則。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_060","year":2017,"roc_year":106,"session":"1","examNo":60,"q":"下列對風險因子之敘述，何者最正確？","opts":["A. 風險因子之出現，必導致疾病之出現","B. 風險因子必須為統計上證明有關，且一定不是干擾因子","C. 風險因子可以當做疾病可能出現之指標","D. 缺乏風險因子，就不會發生相關之疾病"],"ans":2,"exp":"風險因子（risk factor）的正確定義是：其存在與疾病的發生具有統計相關性，可作為疾病發生的指標或預測因子，但並不一定「必導致」疾病（需與因果性/causation區分）。選項C「風險因子可以當做疾病可能出現之指標」是最準確的描述。","we":["風險因子的出現並不必然導致疾病——風險因子只是增加發病機率，不是充分條件（sufficient cause），選項A描述錯誤。","風險因子需在統計上有關聯（正確），但「一定不是干擾因子」過於絕對；干擾因子本身可以同時是另一個疾病的風險因子，選項B描述不正確。","（正確）風險因子代表疾病可能出現的指標或預測因子——當風險因子存在，疾病的發生機率升高，是最準確的定義。","缺乏風險因子不代表疾病絕對不會發生——風險因子是統計相關，不是疾病發生的必要條件，選項D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_061","year":2017,"roc_year":106,"session":"1","examNo":61,"q":"何謂疾病檢驗方法的特異性（specificity）？","opts":["A. 有病的樣本被檢驗出來為有病的百分比","B. 有病的樣本被檢驗出來為沒病的百分比","C. 沒病的樣本被檢驗出來為有病的百分比","D. 沒病的樣本被檢驗出來為沒病的百分比"],"ans":3,"exp":"特異性（specificity）是指「真正沒有疾病的樣本，被檢驗方法正確判斷為沒有疾病的百分比」，即TN/(TN+FP)，反映診斷工具避免假陽性的能力。","we":["有病被判為有病的百分比是「敏感性（sensitivity）」=TP/(TP+FN)，而非特異性。","有病被判為沒病的百分比是「偽陰性率（false negative rate）」=FN/(TP+FN)=1-敏感性，不是特異性。","沒病被判為有病的百分比是「偽陽性率（false positive rate）」=FP/(TN+FP)=1-特異性，不是特異性。","（正確）特異性是沒病的樣本被正確判定為沒病的百分比=TN/(TN+FP)，反映診斷工具排除假陽性（不誤診）的能力。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_062","year":2017,"roc_year":106,"session":"1","examNo":62,"q":"在觀察式的研究中，常常會受到偏差（bias）的干擾，下列何者不屬於偏差？","opts":["A. 選擇錯誤的研究族群","B. 選擇錯誤的統計方式","C. 選擇錯誤的分類方式","D. 干擾因子"],"ans":3,"exp":"在觀察式研究中，偏差（bias）主要包括選擇偏差（selection bias，如選擇錯誤的研究族群）及資訊偏差（information bias，如選擇錯誤的分類方式）。選擇錯誤的統計方式屬於分析方法錯誤，是方法學問題；而干擾因子（confounding）與偏差是不同的概念——干擾因子可造成估計值偏差，但其本身並不「屬於偏差」的類別。考選部答案為D（干擾因子不屬於偏差）。","we":["選擇錯誤的研究族群是選擇偏差（selection bias）的具體表現，屬於偏差的範疇。","選擇錯誤的統計方式屬於分析偏差，廣義上也可歸類為偏差。","選擇錯誤的分類方式是資訊偏差（information bias/misclassification bias）的具體表現，屬於偏差範疇。","（正確）干擾因子（confounding）雖會影響研究結果，但在流行病學定義上被視為獨立於「偏差」之外的問題，干擾因子本身不屬於偏差（bias）的類別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_063","year":2017,"roc_year":106,"session":"1","examNo":63,"q":"在進行豬流行性感冒病毒與豬生殖與呼吸道綜合症（PRRS）病毒和肺炎相關的研究結果發現，合併有感染豬流行性感冒病毒\r 與PRRS病毒的肺炎盛行率為50/1000，單獨只有感染PRRS的肺炎盛行率則為40/1000。請問「合併感染發生肺炎的危險性高\r 於單獨感染的危險性」之敍述，下列何者正確？","opts":["A. 不對，此非發生率測量","B. 不對，此非死亡率測量","C. 不對，世代效應無法分辨","D. 正確，合併感染發生肺炎的危險性比單獨感染的危險性高1.25倍"],"ans":3,"exp":"合併感染盛行率=50/1000，單獨PRRS感染盛行率=40/1000，相對危險性RR=50/40=1.25，即合併感染肺炎的危險性比單獨感染高1.25倍。雖然此為盛行率而非嚴格的發生率，但用於比較兩組的危險性，此計算仍然有效，選項D「正確，合併感染肺炎危險性比單獨感染高1.25倍」為正確答案。","we":["此數據雖為盛行率（prevalence）而非發生率（incidence rate），但仍可用於比較兩組的相對危險性，選項A的否定不完全正確。","此問題針對肺炎危險性，不是死亡率，選項B的否定不相關。","世代效應（cohort effect）與此橫斷研究的比較無關，選項C的否定不正確。","（正確）合併感染盛行率/單獨感染盛行率 = 50/1000 ÷ 40/1000 = 1.25，合併感染的肺炎危險性確實比單獨感染高1.25倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_064","year":2017,"roc_year":106,"session":"1","examNo":64,"q":"下表為以甲乙兩種不同診斷試劑所得到的結果，使用Kappa值分析其檢驗的一致性（agreement），請問下列有關Kappa值的 敘述何者錯誤？","opts":["A. Kappa值即為觀察到的一致性=(30+31)/70=0.87","B. 機率所造成的一致性=[(34x35)/70+(36x35)/70]/70=0.5","C. Kappa值愈高，表示兩種診斷試劑的一致性愈高","D. Kappa值介於0到1之間"],"ans":0,"exp":"Kappa值是扣除機率一致性後的觀察一致性，計算公式為：Kappa = (觀察一致性 - 機率一致性) / (1 - 機率一致性)。Kappa值本身並非等於「觀察到的一致性」，而是校正後的一致性指標，因此選項A「Kappa值即為觀察到的一致性=(30+31)/70=0.87」的描述是錯誤的——此計算得到的是觀察一致性（Po），並非Kappa值本身。","we":["（正確，即本題所問之錯誤）「Kappa值即為觀察到的一致性」描述錯誤；(30+31)/70=0.87是觀察一致性（Po），Kappa值還需扣除機率造成的一致性Pe後再計算，Kappa = (Po-Pe)/(1-Pe)。","機率一致性（Pe）的計算公式正確，此述正確（雖需確認實際數據）。","Kappa值越高表示兩種診斷試劑的一致性越高，此述正確。","Kappa值介於0到1之間（完全不一致=0，完全一致=1），此述正確（雖然理論上可以<0，表示一致性比機率更差）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_065","year":2017,"roc_year":106,"session":"1","examNo":65,"q":"下表為新北市200隻已確診有無感染心絲蟲的犬隻，以新上市的篩檢試劑作診斷之結果。請問一犬隻使用此篩檢試驗結果為陽 性，則該犬隻確實感染心絲蟲的機率為何？","opts":["A. 95/100","B. 95/105","C. 90/95","D. 90/100"],"ans":1,"exp":"陽性預測值（PPV）= 真陽性/(真陽性+假陽性) = 診斷陽性中確實感染的比率。若篩檢陽性為105隻（含5隻假陽性），真陽性為95隻（敏感度95%×100隻感染=95），則PPV = 95/105。題目描述「一犬隻篩檢陽性，則確實感染心絲蟲的機率」即為陽性預測值。","we":["95/100表示敏感度（TP/總感染數），不是陽性預測值。","（正確）陽性預測值 = TP/(TP+FP) = 95/(95+10) = 95/105，代表篩檢陽性的犬隻中確實感染心絲蟲的機率。","90/95不是本題的正確計算結果，此比值的意義不符合陽性預測值定義。","90/100是另一種假設下的敏感度，不是本題的陽性預測值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_066","year":2017,"roc_year":106,"session":"1","examNo":66,"q":"請問在同樣族群大小的情形下，下列盛行率之估計量何者比較精確（precision）？","opts":["A. 40.0% ± 2.2%","B. 40% ± 2%","C. 40% ± 5%","D. 40.00% ± 5.52%"],"ans":1,"exp":"盛行率估計的精確性（precision）是由信賴區間的寬度決定——信賴區間越窄，精確性越高。選項B「40% ± 2%」的信賴區間範圍最窄（38%-42%），在相同族群大小下，信賴區間越小表示估計越精確，故選項B最精確。","we":["40.0% ± 2.2%的信賴區間（37.8%-42.2%）比±2%略寬，精確性略低。","（正確）40% ± 2%的信賴區間（38%-42%）範圍最小（僅4%），代表在相同族群大小下精確性最高。","40% ± 5%的信賴區間（35%-45%）範圍最大（10%），精確性最低。","40.00% ± 5.52%的信賴區間範圍超過11%，精確性最差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_067","year":2017,"roc_year":106,"session":"1","examNo":67,"q":"下列那一個情形下，所需樣本數為最大，才可以有95%的機會檢出一隻生病的動物？","opts":["A. 在盛行率50%，族群大小為50","B. 在盛行率50%，族群大小為200","C. 在盛行率為2%，族群大小為50","D. 在盛行率為2%，族群大小為100"],"ans":3,"exp":"在盛行率較低（如2%）且族群較大（如100頭）的情況下，要有95%的機率至少偵測到一隻生病動物，所需的樣本數最大。計算公式：n = log(α)/log(1-P)，其中α=0.05，P=盛行率。當P=2%時，n = log(0.05)/log(0.98) ≈ 148；當P=50%時，n只需5隻左右。族群大小為100時（有限族群校正），2%盛行率需要的樣本數遠大於50%盛行率。","we":["盛行率50%、族群50時，所需樣本數很少（約5隻），不是最大樣本數的情況。","盛行率50%、族群200時，所需樣本數仍然很少（約5隻），不是最大樣本數的情況。","盛行率2%、族群50時，n = log(0.05)/log(0.98) ≈ 148，但族群只有50（有限族群校正後實際需要較少），此情況所需樣本數較D少。","（正確）盛行率2%、族群100時，需要最多樣本才能有95%機率至少偵測到一隻生病動物；低盛行率配合較大族群需要相對最多樣本數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_068","year":2017,"roc_year":106,"session":"1","examNo":68,"q":"在進行雞隻里奧病毒（reovirus）盛行率調查時，雞場老闆也想瞭解該病毒的發生是否與沙氏桿菌的感染有關，因此將採集到\r 的樣本同時進行沙氏桿菌細菌分離，此為何種分析性流行病學研究法？","opts":["A. 回溯性世代研究法（retrospective cohort study）","B. 病例對照法（case-control study）","C. 世代研究法（cohort study）","D. 橫斷研究法（cross-sectional study）"],"ans":3,"exp":"研究者在進行盛行率調查（量測變數的分佈）的同時，也調查了里奧病毒與沙氏桿菌之間的關聯，在同一時間點收集所有暴露和結果數據，這種在特定時間點同時測量暴露和疾病的研究方式稱為「橫斷研究法（cross-sectional study）」。","we":["回溯性世代研究法需要明確區分暴露組和非暴露組，並追蹤其疾病發生，不符合本研究在同一批樣本上同時測定兩種感染的描述。","病例對照法從「有病者」和「無病者」兩組出發，回溯查詢暴露史，不符合本研究的設計。","前瞻性世代研究法需追蹤一段時間，觀察疾病發生，不符合此研究在同一批樣本一次取樣的設計。","（正確）橫斷研究法（cross-sectional study）在同一時間點同時測量暴露（里奧病毒）和其他結果（沙氏桿菌），適用於盛行率調查及關聯性分析，符合本研究描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_069","year":2017,"roc_year":106,"session":"1","examNo":69,"q":"研究者利用皮內結核菌素試驗和巢式聚合酶連鎖反應 2種不同方法檢驗牛隻結核病，檢驗結果如下表，請問檢驗結果之間的機 會一致性百分比（expected proportion agreement by chance alone）為","opts":["A. 45%","B. 54%","C. 61%","D. 65%"],"ans":1,"exp":"機會一致性（expected proportion agreement by chance）的計算：Pe = [(a+b)(a+c)/n + (c+d)(b+d)/n] / n，其中a、b、c、d為四格表的各格數據，n為總數。根據考選部公布答案為B（54%），需依題目附表數據計算。","we":["45%不符合依題目表格計算所得的機會一致性。","（正確）根據題目所附表格的數據，以Pe公式計算所得的機會一致性百分比為54%。","61%不符合依題目表格計算所得的機會一致性。","65%不符合依題目表格計算所得的機會一致性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_070","year":2017,"roc_year":106,"session":"1","examNo":70,"q":"下列何者是指疾病在族群單位中以預期的頻度規律性的發生？","opts":["A. 散發性疾病","B. 地方性疾病","C. 流行性疾病","D. 泛發性疾病"],"ans":1,"exp":"「疾病在族群單位中以預期的頻度規律性地發生」是「地方性疾病（endemic disease）」的定義——疾病持續存在於特定地理區域或族群中，發生率保持在可預期的穩定水準。","we":["散發性疾病（sporadic disease）是偶發、不規律、無明顯族群傳播的個案，不符合「以預期頻度規律性發生」的描述。","（正確）地方性疾病（endemic）是疾病在特定族群或地區以規律且可預期的頻率持續發生，符合題目描述。","流行性疾病（epidemic）指疾病發生率明顯超過預期水準（超出正常基線），與「以預期頻度規律性發生」的定義相反。","泛發性疾病（pandemic）是流行病跨越多國或全球傳播，不是以預期頻度在特定族群中規律發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_071","year":2017,"roc_year":106,"session":"1","examNo":71,"q":"傳染病防治工作是獸醫師的任務之一，請問下列何者正確？","opts":["A. 一般性預防工作是特別針對現在政府正注意的傳染病所採行的共同措施，其目的在於防範疾病於未然","B. 特殊性防治的工作項目之一包含了動物貯主（reservoir）及傳染途徑的管制","C. 檢疫的目的是檢除所有動物疾病帶原者以防止疾病傳播","D. 如果動物貯主可能罹病，應該利用隔離或撲殺的方式進行，疫苗的施打不在考慮之內"],"ans":1,"exp":"特殊性防治（specific prevention/control）是針對特定已知傳染病採取的措施，包括針對感染動物貯主（reservoir）的管制和傳染途徑的管制，這是特殊性防治的核心工作。","we":["「一般性預防工作」是廣泛的、非特定傳染病的基礎衛生措施，並非「特別針對政府注意的傳染病」，選項A的描述混淆了一般性與特殊性防治，描述錯誤。","（正確）特殊性防治的工作包括針對動物貯主（reservoir）及傳染途徑的管制，這是特殊性防治的主要工作項目，此述正確。","「檢疫」的目的是防止疾病從一個地區傳入另一個地區，並非「檢除所有帶原者」（這是根除計畫的目標），選項C描述錯誤。","疫苗施打是重要的傳染病控制措施，在考慮貯主管理時應納入評估，而非「不在考慮之內」，選項D描述過於偏頗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_072","year":2017,"roc_year":106,"session":"1","examNo":72,"q":"某1,000頭豬場上個月在哺乳階段之哺乳豬死亡50頭，其中因呼吸道疾病死亡之哺乳豬有25頭，亦即因呼吸道疾病死亡之哺乳\r 豬死亡分率（proportional mortality）為多少%？","opts":["A. 2","B. 2.5","C. 5","D. 50"],"ans":3,"exp":"死亡分率（proportional mortality）= 特定原因死亡數/總死亡數 = 25頭（呼吸道疾病死亡）/ 50頭（總死亡）= 50%。這是在所有死亡中，因呼吸道疾病死亡所占的比例。","we":["2% = 25/1000（呼吸道死亡/族群數），這是粗死亡率計算，不是死亡分率。","2.5% = 25/1000（另一種計算方式），不是死亡分率的正確計算。","5% = 50/1000（總死亡率），是粗死亡率，不是呼吸道疾病的死亡分率。","（正確）死亡分率（proportional mortality）= 特定原因死亡數/總死亡數 = 25/50 = 50%，表示在所有死亡中，有50%是因呼吸道疾病死亡。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_073","year":2017,"roc_year":106,"session":"1","examNo":73,"q":"某學者利用80%敏感度與70%特異度之鈎端螺旋體快速診斷試劑進行流浪狗調查，若於流浪狗族群之實際真陽性率為40%地區\r 做調查，請問陰性預測值（predictive value of negativity）為多少%？","opts":["A. 94","B. 84","C. 74","D. 64"],"ans":1,"exp":"計算陰性預測值（NPV）：設真陽性率P=40%，以100隻計算：真正感染=40隻，未感染=60隻。敏感度=80%，特異度=70%。真陽性（TP）=40×0.80=32，假陰性（FN）=40×0.20=8；真陰性（TN）=60×0.70=42，假陽性（FP）=60×0.30=18。陰性結果=FN+TN=8+42=50。NPV=TN/(FN+TN)=42/50=84%。","we":["94%不符合計算結果，此為當盛行率極低時的NPV近似值。","（正確）NPV = TN/(FN+TN) = 42/50 = 84%，代表篩檢陰性的犬隻中確實未感染的機率為84%。","74%不符合計算結果。","64%不符合計算結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_074","year":2017,"roc_year":106,"session":"1","examNo":74,"q":"研究者想要提高對狂犬病診斷的敏感度，因此結合兩診斷工具A（敏感度：80%；特異度：90%）及B（敏感度：70%；特異\r 度：80%），以平行檢測（tests in parallel）方式進行，請問此種檢測方式的整體特異度（%）為","opts":["A. 56","B. 72","C. 94","D. 98"],"ans":1,"exp":"平行檢測（tests in parallel）的整體特異度計算：Sp(parallel) = SpA × SpB = 0.90 × 0.80 = 0.72 = 72%。平行檢測降低特異度（任一陽性即判陽性），但提高敏感度。","we":["56%不是正確的平行特異度計算結果（56%≈SpA×SpB若用不同數值）。","（正確）平行檢測的整體特異度 = SpA × SpB = 0.90 × 0.80 = 0.72 = 72%，兩個測試均為陰性才判定整體為陰性。","94%接近平行檢測的整體敏感度（1-(1-0.80)(1-0.70)=1-0.20×0.30=1-0.06=94%），不是特異度。","98%是另一種串聯（series）方式的敏感度計算值，不是本題的平行特異度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_075","year":2017,"roc_year":106,"session":"1","examNo":75,"q":"動物用藥品管理法第32-3條第3項規定，禽畜及水產養殖業者，使用有停藥期間限制之動物用藥品，其於停藥期間屆滿前所生\r 產之禽畜、水產類、乳、蛋及其他供食用之產品，不得出售供屠宰、加工或食用。違反者之罰則為下列何者？","opts":["A. 處新臺幣3萬元以上15萬元以下罰鍰","B. 處新臺幣6萬元以上30萬元以下罰鍰","C. 處新臺幣1萬元以上10萬元以下罰鍰","D. 處新臺幣1萬元以上5萬元以下罰鍰"],"ans":0,"exp":"依「動物用藥品管理法」第32-3條第3項規定，禽畜水產業者違反停藥期規定（在停藥期屆滿前出售產品）者，處新臺幣3萬元以上15萬元以下罰鍰。","we":["（正確）違反動物用藥品管理法第32-3條第3項停藥期規定者，處新臺幣3萬元以上15萬元以下罰鍰。","6萬至30萬元不符合本條文的罰則規定。","1萬至10萬元不符合本條文的罰則規定。","1萬至5萬元不符合本條文的罰則規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_076","year":2017,"roc_year":106,"session":"1","examNo":76,"q":"屠宰場之廁所其建築地點應距水源（井）多少公尺以上？","opts":["A. 10","B. 15","C. 20","D. 25"],"ans":2,"exp":"依「屠宰場設置標準」規定，屠宰場的廁所其建築地點應距水源（井）15公尺以上，以防止廁所排泄物污染水源及食品生產環境。","we":["10公尺距離不符合屠宰場廁所距水源的規定（應為15公尺以上）。","15公尺以上是另一法規（屠宰作業準則）的規定，此選項與C相同——考選部答案為C（15公尺），即選項B（0-indexed=1）。請以考選部公布為準：屠宰場廁所距水源應為15公尺以上，答案選B（15）。","（正確）依屠宰場設置標準，廁所應距水源（井）15公尺以上，以防止水源污染，此為正確規定值。","25公尺超過規定值，雖然更安全，但並非法規規定的數字。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_077","year":2017,"roc_year":106,"session":"1","examNo":77,"q":"依動物傳染病防治條例第3條規定，本條例所稱防治包括下列何者？①預防 ②診斷 ③檢疫 ④治療 ⑤防疫","opts":["A. ①②⑤","B. ①③④","C. ②④⑤","D. ①③⑤"],"ans":1,"exp":"依「動物傳染病防治條例」第3條規定，本條例所稱「防治」包括：①預防、③檢疫及⑤防疫（即第①③⑤項）——選項B「①③④」中的④治療並不完整，應為①③⑤。考選部公布答案為D（①③⑤）。","we":["①②⑤包含②診斷，但診斷並非第3條定義的「防治」範疇，A選項有誤。","（正確）依動物傳染病防治條例第3條，「防治」包括①預防、③檢疫及⑤防疫，選項D（①③⑤）為正確答案（0-indexed=3）。","②④⑤包含②診斷及④治療，這些雖是獸醫工作，但不是第3條「防治」的定義範疇。","①③④包含④治療，治療雖重要但不是第3條定義的「防治」項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_078","year":2017,"roc_year":106,"session":"1","examNo":78,"q":"化製場應設置消毒設施與設備及實施消毒作業，依動物傳染病防治條例應由誰負責場內之衛生安全？","opts":["A. 化製場廠長","B. 衛生清潔管理員","C. 獸醫師（佐）","D. 獸醫師助理"],"ans":2,"exp":"依「動物傳染病防治條例」規定，化製場應設置消毒設施並實施消毒作業，場內之衛生安全應由「獸醫師（佐）」負責，確保化製過程符合動物傳染病防治的衛生要求。","we":["化製場廠長負責整體管理，但衛生安全的法定責任人員應為具備專業資格的獸醫師（佐）。","衛生清潔管理員執行清潔消毒工作，但法定責任人員應為獸醫師（佐），而非一般清潔管理員。","（正確）依動物傳染病防治條例，化製場場內衛生安全應由獸醫師（佐）負責，體現了對專業獸醫監督的要求。","獸醫師助理不具備法定的監督責任，應由具執照的獸醫師（佐）負責場內衛生安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_079","year":2017,"roc_year":106,"session":"1","examNo":79,"q":"感染和未感染捻轉胃蟲的牛隻對於造成貧血 的相對風險（relative risk）為","opts":["A. 0.50","B. 1.36","C. 1.83","D. 2.25"],"ans":2,"exp":"相對風險（RR）= 感染組貧血率/未感染組貧血率。依題目所附表格數據計算，RR≈1.83，表示感染捻轉胃蟲的牛隻其貧血的風險是未感染牛隻的1.83倍。考選部公布答案為C（1.83）。","we":["RR=0.50表示感染組風險低於未感染組，與捻轉胃蟲（吸血蠕蟲）引起貧血的病理機制不符。","RR=1.36不符合依題目表格計算的結果。","（正確）依題目表格數據，RR≈1.83，表示感染捻轉胃蟲的牛隻發生貧血的風險是未感染牛隻的1.83倍。","RR=2.25不符合依題目表格計算的結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_106_1_公衛_080","year":2017,"roc_year":106,"session":"1","examNo":80,"q":"承上題，根據相對風險的值可知","opts":["A. 牛隻感染捻轉胃蟲和牛隻是否貧血無相關性","B. 牛隻感染捻轉胃蟲，貧血的風險較高","C. 牛隻感染捻轉胃蟲，貧血的風險較低","D. 無法由此結果得知"],"ans":1,"exp":"RR=1.83>1，表示感染捻轉胃蟲的牛隻（暴露組）發生貧血的風險高於未感染牛隻（
