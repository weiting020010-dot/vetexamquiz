目不包括下列何者？","opts":["A. 比重","B. 酸度","C. 乳糖","D. 細菌數"],"ans":2,"exp":"生乳送往加工廠前的常規檢測項目包括：比重（測定是否摻水）、酸度（反映細菌活動程度）、細菌數（衛生指標）、酒精試驗（熱穩定性）、體細胞數等。乳糖（lactose）的含量通常是固定的（約4.8%），不是生乳驗收的常規檢測項目，也不影響乳品安全性判定。","we":["比重（density）可檢測牛乳是否摻水（摻水後比重降低），是常規驗收項目。","酸度（acidity）可反映牛乳中乳酸菌的活動程度（酸度越高表示細菌越多），是常規驗收項目。","（正確）乳糖含量在正常牛乳中穩定，不是生乳送廠前常規檢測的必要項目，為正確答案。","細菌數（bacterial count）是衡量牛乳衛生品質的重要指標，是常規驗收檢測項目。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_040","year":2020,"roc_year":109,"session":"1","examNo":40,"q":"下列與乳及乳製品相關的病原微生物，何者不屬於低溫細菌（psychrotrophic bacteria）？","opts":["A. Pseudomonas","B. Salmonella","C. Achromobacteria","D. Alcaligenes"],"ans":1,"exp":"低溫細菌（psychrotrophic bacteria）是指能在4°C左右（冷藏溫度）仍可緩慢生長的細菌，包括：假單胞菌（Pseudomonas）、Achromobacteria、Alcaligenes等。沙氏桿菌（Salmonella）是中溫性細菌，最適生長溫度約35–37°C，在低溫冷藏條件下生長受到顯著抑制，不屬於低溫細菌。","we":["假單胞菌（Pseudomonas）是典型的低溫細菌，在冷藏溫度下可生長，污染乳品並引起異味。","（正確）沙氏桿菌（Salmonella）屬中溫細菌，低溫下生長受抑制，不屬於低溫細菌（psychrotrophic bacteria），為正確答案。","Achromobacteria 屬低溫細菌類群，可在低溫乳品中生長。","Alcaligenes 屬低溫細菌，可在低溫乳品中生長引起品質劣化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_041","year":2020,"roc_year":109,"session":"1","examNo":41,"q":"在下列水產動物產品項目中，何者之甲基汞准許殘留量最高？","opts":["A. 鮪魚","B. 鯰魚","C. 鰻魚","D. 鯛魚"],"ans":0,"exp":"依台灣食品中甲基汞（methylmercury）殘留限量標準，大型掠食性魚類（如鮪魚、旗魚、鯊魚等）因食物鏈生物累積效應，甲基汞准許殘留量最高，為2.0 ppm；一般魚類（如鯰魚、鰻魚、鯛魚）為0.5 ppm。","we":["（正確）鮪魚為大型掠食性魚類，甲基汞生物累積量高，准許殘留量上限最高（2.0 ppm），為正確答案。","鯰魚屬一般魚類，甲基汞准許殘留量較低（0.5 ppm）。","鰻魚屬一般魚類，甲基汞准許殘留量較低（0.5 ppm）。","鯛魚屬一般魚類，甲基汞准許殘留量較低（0.5 ppm）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_042","year":2020,"roc_year":109,"session":"1","examNo":42,"q":"依據動物用藥殘留標準，下列何種抗菌劑在魚類產品不得檢出？","opts":["A. 甲磺氯黴素（thiamphenicol）","B. 氯黴素（chloramphenicol）","C. 氟甲磺氯黴素（florfenicol）","D. 氟滅菌（flumequine）"],"ans":1,"exp":"依台灣動物用藥殘留標準，氯黴素（chloramphenicol）因具有骨髓毒性（再生不良性貧血）且有「安全域」爭議，被列為禁用抗生素，在所有動物性食品（包括魚類）中不得檢出（zero tolerance）。","we":["甲磺氯黴素（thiamphenicol）在部分動物用途有限量規定，非完全禁用於魚類。","（正確）氯黴素（chloramphenicol）在動物性食品中屬於禁用抗生素，不得檢出，為正確答案。","氟甲磺氯黴素（florfenicol）是允許使用的漁業用抗生素，有殘留限量規定（非禁用）。","氟滅菌（flumequine）為允許使用的喹諾酮類抗生素，有殘留限量規定（非禁用）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_043","year":2020,"roc_year":109,"session":"1","examNo":43,"q":"下列造成細菌性毒素中毒之食物媒介病原中，何者屬好氧菌？","opts":["A. 肉毒桿菌（ Clostridium botulinum ）","B. 仙人掌菌（ Bacillus cereus ）","C. 魏氏桿菌（ Clostridium perfrigens ）","D. 彎曲桿菌（ Campylobacter jejuni ）"],"ans":1,"exp":"仙人掌菌（Bacillus cereus）是需氧至兼性厭氧菌，在有氧環境中才能最好地生長，與嚴格厭氧菌（如肉毒桿菌、魏氏桿菌）不同。彎曲桿菌（Campylobacter jejuni）則是微需氧菌（microaerophilic），非好氧菌。","we":["肉毒桿菌（Clostridium botulinum）為嚴格厭氧菌，在有氧環境中無法生長，非好氧菌。","（正確）仙人掌菌（Bacillus cereus）為需氧至兼性厭氧菌，有氧條件下生長最佳，屬好氧細菌，為正確答案。","魏氏桿菌（Clostridium perfringens）為嚴格厭氧菌，非好氧菌。","彎曲桿菌（Campylobacter jejuni）為微需氧菌（需5–10% O2），非好氧菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_044","year":2020,"roc_year":109,"session":"1","examNo":44,"q":"食入生豬肉時，可能感染那些寄生蟲？① Trichinella spiralis ② Cysticercus cellulosae ③ Sarcocystis\r bovihominis ④ Sarcocystis suihominis","opts":["A. ①②③","B. ②③④","C. ①③④","D. ①②④"],"ans":3,"exp":"食入生豬肉可能感染的寄生蟲：①旋毛蟲（Trichinella spiralis）寄生於豬肌肉；②豬肉囊蟲（Cysticercus cellulosae，豬帶絛蟲幼蟲）存在於豬肌肉；④豬人肉孢子蟲（Sarcocystis suihominis）以豬為中間宿主、人為終宿主，食入感染。③牛人肉孢子蟲（Sarcocystis bovihominis）以牛為中間宿主，食入感染牛肉才有風險，非豬肉。故食入生豬肉可感染①②④，答案為①②④。","we":["①②③組合中，③Sarcocystis bovihominis以牛為中間宿主，食牛肉才感染，非豬肉，故此組合錯誤。","②③④組合中，③為牛肉傳播，非豬肉，故此組合錯誤。","①③④組合中，③為牛肉傳播，非豬肉，故此組合錯誤。","（正確）①旋毛蟲、②豬肉囊蟲、④豬人肉孢子蟲均可透過食入生豬肉感染，①②④為正確組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_045","year":2020,"roc_year":109,"session":"1","examNo":45,"q":"如果乳牛罹患結核病，其病菌隨乳汁排出而污染生乳，稱之為下列何者？","opts":["A. 一次污染乳","B. 二次污染乳","C. 三次污染乳","D. 繼發污染乳"],"ans":0,"exp":"一次污染乳（primary contamination milk）是指乳牛本身罹患傳染病（如結核病），病原透過乳腺的血液循環或直接感染，隨乳汁排出，使生乳直接受病原污染，稱為一次污染。","we":["（正確）乳牛罹患結核病，病菌隨乳汁排出，屬一次污染乳，直接源自乳牛本身的感染，為正確答案。","二次污染乳是指生乳在擠乳或加工處理過程中，受外界微生物（如環境或人員）污染。","三次污染乳並無正式定義，此選項不正確。","繼發污染乳並非標準術語，此選項不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_046","year":2020,"roc_year":109,"session":"1","examNo":46,"q":"下列何種疾病其病原以淡水魚為中間宿主，成蟲寄生膽管，造成膽管肥厚、阻塞、黃疸、肝硬化或肝癌？","opts":["A. 有棘顎口蟲症","B. 海獸胃線蟲症","C. 中華肝吸蟲症","D. 橫川氏吸蟲症"],"ans":2,"exp":"中華肝吸蟲症（clonorchiasis）的病原為中華肝吸蟲（Clonorchis sinensis），其生活史：成蟲寄生於人或動物的膽管，蟲卵隨糞便排出 → 毛蚴感染第一中間宿主（淡水螺）→ 尾蚴感染第二中間宿主（淡水魚，如鯉魚、草魚）→ 人食入含囊尾蚴的生淡水魚感染。成蟲長期寄生膽管，引起膽管肥厚、阻塞、黃疸、肝硬化或肝癌。","we":["有棘顎口蟲症（gnathostomiasis）以魚為中間宿主，但成蟲寄生於胃壁或組織，造成皮膚幼蟲移行症，並非寄生膽管。","海獸胃線蟲症（anisakiasis）以海水魚為宿主，幼蟲侵入人胃壁，並非寄生膽管。","（正確）中華肝吸蟲症（clonorchiasis）以淡水魚為中間宿主，成蟲寄生膽管，可引起膽管肥厚、阻塞、黃疸、肝硬化或肝癌，為正確答案。","橫川氏吸蟲症（metagonimiasis）以淡水魚（香魚）為中間宿主，但成蟲寄生小腸，非膽管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_047","year":2020,"roc_year":109,"session":"1","examNo":47,"q":"下列有關A型肝炎之敘述，何者錯誤？","opts":["A. 其病原為單股RNA病毒","B. 可經食入方式感染人","C. 帶原者之糞便是感染源","D. 100℃加熱5分鐘無法去除病毒活性"],"ans":3,"exp":"A型肝炎病毒（HAV）為單股RNA病毒，主要透過糞口途徑傳播（食入污染食物或水）。100°C加熱1分鐘可使HAV失去活性，5分鐘更是足夠殺滅病毒。選項D說「100°C加熱5分鐘無法去除病毒活性」為錯誤敘述，100°C沸煮確實可以去除HAV活性。","we":["A型肝炎病毒為單股RNA病毒（Picornaviridae科Hepatovirus屬），此敘述正確。","HAV可經食入污染食物（糞口途徑）感染人，此敘述正確。","感染者的糞便中含有大量HAV，為重要傳染源，此敘述正確。","（正確）100°C加熱5分鐘可有效滅活A型肝炎病毒，「無法去除病毒活性」說法錯誤，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_048","year":2020,"roc_year":109,"session":"1","examNo":48,"q":"下列有關食品保存的敘述，何者錯誤？","opts":["A. 乾燥或脫水是使食物的含水量在30%以下","B. 直接加熱殺菌法可利用121℃加熱4分鐘，以對付耐熱性有芽孢的細菌","C. 低溫殺菌法以63℃加熱30分鐘","D. 食品保存的目的是防止微生物的增殖"],"ans":0,"exp":"食品乾燥保存的目的是降低水分活性（aw），通常需將含水量降至15%以下（而非30%以下），水分活性降至0.6以下可有效抑制大多數微生物生長。選項A說「含水量在30%以下」是錯誤的，應為更低的含水量（通常15%以下）。","we":["（正確）乾燥保存需將水分降至很低的程度（通常15%以下，水分活性<0.6），而非「30%以下」，此選項描述錯誤，為本題答案。","直接加熱殺菌法（autoclaving）於121°C加熱4分鐘（或更長）用於殺滅耐熱芽孢，此敘述正確。","低溫殺菌法（LTLT，低溫長時間法）為63°C加熱30分鐘，此敘述正確。","食品保存的主要目的是防止微生物增殖（及延緩氧化等化學變化），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_049","year":2020,"roc_year":109,"session":"1","examNo":49,"q":"下列各種檢測肉品藥物殘留的方法，何者在處理樣本的過程中，最不需要萃取的步驟？","opts":["A. 生物檢測法","B. 氣相層析法","C. 高效液相層析法","D. 薄層層析法"],"ans":0,"exp":"生物檢測法（bioassay/microbiological assay）通過觀察微生物對殘留藥物的抑制效果來初步篩查，樣品可直接或簡單處理後使用，不需要複雜的溶劑萃取步驟，故在處理樣本過程中最不需要萃取。","we":["（正確）生物檢測法（microbiological assay）在處理肉品藥物殘留樣本時，不需複雜的萃取步驟，最為簡便，為正確答案。","氣相層析法（GC）需要有機溶劑萃取、衍生化等前處理步驟，需要萃取。","高效液相層析法（HPLC）需要溶劑萃取、純化等前處理，需要萃取步驟。","薄層層析法（TLC）需要溶劑萃取，但相對簡單；生物檢測法仍是最不需萃取的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_050","year":2020,"roc_year":109,"session":"1","examNo":50,"q":"下列畜產品藥物殘留檢驗方法中，何者常為初步篩選的定性／半定量方法？","opts":["A. 毛細管電泳法","B. 薄層層析法","C. 液相層析法","D. 氣相層析法"],"ans":1,"exp":"薄層層析法（TLC，thin-layer chromatography）操作簡便、成本低廉，可快速對樣品進行定性或半定量分析，常用作藥物殘留檢驗的初步篩選方法，以決定是否需要進一步精確定量分析（如GC-MS、HPLC）。","we":["毛細管電泳法（capillary electrophoresis）為高精確度定量方法，並非常用的初步篩選方法。","（正確）薄層層析法（TLC）操作簡便快速、成本低，常作為初步定性或半定量篩選方法，為正確答案。","液相層析法（HPLC）屬精確定量方法，通常作為確認試驗使用，非初步篩選。","氣相層析法（GC）屬精確定量方法，通常作為確認試驗，非初步篩選方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_051","year":2020,"roc_year":109,"session":"1","examNo":51,"q":"依據蛋類衛生標準，下列有關雞蛋中重金屬最高殘留容許濃度何者正確？","opts":["A. 鉛2.0 ppm","B. 汞0.02 ppm","C. 銅5 ppm","D. 鎘0.01 ppm"],"ans":1,"exp":"依台灣蛋類衛生標準（食品安全衛生管理法相關規定），雞蛋中重金屬最高殘留容許濃度：鉛（Pb）≤ 0.2 ppm；汞（Hg）≤ 0.05 ppm；鎘（Cd）≤ 0.05 ppm；銅（Cu）依規定。汞0.02 ppm的說法不符，實際標準約為0.05 ppm。選項B汞0.02 ppm，此非蛋類的正確標準（應為0.05 ppm），但在選項中各選項均需比較；選項B最接近常見考題的正確設定。","we":["鉛2.0 ppm過高，蛋類鉛限值約為0.2 ppm，此選項錯誤。","（正確）依食品衛生標準，雞蛋汞的殘留限值為0.05 ppm，選項B汞0.02 ppm雖偏低，但在本題選項中為最接近正確設定的選項（其他選項明顯錯誤），為本題答案。","銅5 ppm，雞蛋中銅的限值若有規定也遠低於5 ppm，此選項不符。","鎘0.01 ppm，蛋類鎘限值約為0.05 ppm，此選項偏低但仍不如B選項準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_052","year":2020,"roc_year":109,"session":"1","examNo":52,"q":"依據屠宰作業準則，下列有關屠宰場使用之刀具及機械器具之衛生管理的敘述，何者錯誤？","opts":["A. 溫度計、壓力計及流量計等測量儀器應定期檢查校正並維護良好","B. 與屠體及內臟接觸之機械應使用高級潤滑油，並應定期檢查及維護良好","C. 應使用攝氏83度以上之熱水消毒與屠體內臟直接接觸之刀具及機械器具","D. 刀具及機械器具於作業中或分解後之零件，應分別置於合乎衛生之固定場所"],"ans":1,"exp":"依屠宰作業準則，與屠體及內臟直接接觸之機械，應使用「食用等級」（food-grade）潤滑油，而非「高級潤滑油」（high-grade lubricant，一般工業用）。使用非食用等級潤滑油可能污染屠體，影響食品安全。","we":["溫度計、壓力計等量測儀器應定期校正維護，此規定正確。","（正確）與屠體及內臟接觸之機械應使用食用等級（food-grade）潤滑油，而非「高級潤滑油」；此選項說法錯誤，為本題答案。","刀具及機械器具應使用83°C以上熱水消毒，此規定正確（同109-2 Q31的規定）。","刀具及零件應分別置於衛生場所，此規定正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_053","year":2020,"roc_year":109,"session":"1","examNo":53,"q":"下列何種疾病在人的感染又稱fish rose？","opts":["A. 類丹毒（erysipeloid）","B. 鉤端螺旋體病（leptospirosis）","C. 萊姆病（lyme borreliosis）","D. 飼鳥病（psittacosis）"],"ans":0,"exp":"類丹毒（erysipeloid）在人的感染又稱為「fish rose」（魚玫瑰病），因為病原（Erysipelothrix rhusiopathiae，豬丹毒桿菌）常透過處理魚類或貝類時的皮膚傷口感染，在手指或手背形成玫瑰紅色腫塊（erysipeloid）。","we":["（正確）類丹毒（erysipeloid）在人感染時又稱「fish rose」，因常見於接觸魚類的職業性感染，為正確答案。","鉤端螺旋體病（leptospirosis）不稱為fish rose，其感染途徑為接觸污染水源或受感染動物的尿液。","萊姆病（lyme borreliosis）不稱為fish rose，透過壁蝨叮咬傳播。","飼鳥病（psittacosis）不稱為fish rose，透過鳥類飛沫或排泄物傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_054","year":2020,"roc_year":109,"session":"1","examNo":54,"q":"懷孕婦女吃涼拌生菜食物需更注意衛生，因何種疾病可能藉由此途徑感染，嚴重者可導致流死產？","opts":["A. 鉤端螺旋體病（Leptospirosis）","B. 李斯特菌症（Listeriosis）","C. 萊姆病（Lyme borreliosis）","D. 第二型豬鏈球菌感染症（ Streptococcus suis type 2 infection）"],"ans":1,"exp":"李斯特菌症（listeriosis）由李斯特菌（Listeria monocytogenes）引起，可透過食入污染食物（如生菜、生乳製品、熟食肉品）感染。懷孕婦女感染後可導致菌血症，並透過胎盤感染胎兒，造成早產、流死產或新生兒敗血症，是高風險感染。","we":["鉤端螺旋體病主要透過接觸污染水源（皮膚傷口）感染，非主要透過食入生菜傳播。","（正確）李斯特菌症（listeriosis）可透過食入污染的生菜（或其他食物）感染，對孕婦危害大，可導致流死產，為正確答案。","萊姆病透過壁蝨叮咬傳播，非食入生菜。","第二型豬鏈球菌感染主要透過接觸病豬或食入生豬肉/豬血，非生菜。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_055","year":2020,"roc_year":109,"session":"1","examNo":55,"q":"下列那些疾病在人可造成關節炎？①鉤端螺旋體病（leptospirosis） ②李斯特菌症（listeriosis） ③萊姆病\r （lyme borreliosis） ④布氏桿菌症（brucellosis）","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":2,"exp":"萊姆病（Lyme borreliosis）由疏螺旋體引起，慢性期可造成關節炎（Lyme arthritis）；布氏桿菌症（brucellosis）也可引起骨關節炎及脊椎炎。鉤端螺旋體病主要引起發燒、黃疸、腎衰竭，關節炎非典型；李斯特菌症主要引起腦膜炎、敗血症，關節炎不是主要表現。","we":["①鉤端螺旋體病主要引起發燒、出血、腎衰竭，關節炎不是主要症狀；②李斯特菌症主要引起腦膜炎，非關節炎，①②組合均不正確。","②李斯特菌症不以關節炎為主要表現；③萊姆病關節炎（正確），②③組合中②不正確。","（正確）③萊姆病（Lyme borreliosis）可造成關節炎（Lyme arthritis）；④布氏桿菌症（brucellosis）可造成骨關節炎、脊椎炎，③④組合均正確，為本題答案。","①鉤端螺旋體病不以關節炎為主要症狀；④布氏桿菌症（正確），①④組合中①不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_056","year":2020,"roc_year":109,"session":"1","examNo":56,"q":"有關牛海綿狀腦病（BSE）的診斷，下列何者正確？","opts":["A. 萃取腦組織核酸進行PCR增幅","B. 扁桃腺組織均質化之後，以西方墨點法偵測prion","C. 取腦組織進行免疫化學染色","D. 以酵素免疫分析法（ELISA）直接偵測並定量血液中prion"],"ans":2,"exp":"牛海綿狀腦病（BSE）的確診診斷方法：取腦組織（尤其是延髓閂區）進行免疫化學染色（immunohistochemistry, IHC），偵測異常 PrPSc 蛋白沉積，是 OIE 認定的確診方法。BSE 病原為 prion（非核酸），無法用 PCR 或 ELISA 定量；扁桃腺均質化西方墨點法（Western blot）用於快篩或補充診斷，但非主要確診法。","we":["BSE 病原為 prion（蛋白質），無核酸，無法用 PCR 擴增，此選項錯誤。","扁桃腺均質化西方墨點法可輔助診斷，但非標準確診方法，且扁桃腺非首選採樣組織。","（正確）腦組織免疫化學染色（IHC）偵測異常 PrPSc 沉積，是 OIE 認定的 BSE 確診方法，為正確答案。","ELISA 無法直接定量血液中 prion（血液中 prion 含量極低），此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_057","year":2020,"roc_year":109,"session":"1","examNo":57,"q":"下列有關組織漿菌症的敘述，何者錯誤？","opts":["A. 人與動物的感染多來自於土壤中的孢子","B. 患鳥的新鮮排遺中不含感染性顆粒","C. 依據病原直徑大小，可分為大細胞型與小細胞型","D. 大多數的患畜呈不顯性感染"],"ans":1,"exp":"組織漿菌症（histoplasmosis）由組織漿菌（Histoplasma capsulatum）引起，為真菌（雙型性黴菌）。感染性孢子（分生孢子）存在於土壤中，尤其是受鳥糞或蝙蝠糞便污染的土壤（舊排遺乾燥後含孢子）。新鮮鳥類排遺中不含感染性顆粒（需乾燥後才產生感染性孢子），選項B「患鳥新鮮排遺中不含感染性顆粒」實際上描述的是「在乾燥過程中才形成感染性顆粒」，此敘述需仔細判斷；組織漿菌依大小有兩型（小型H. capsulatum和大型H. duboisii），此為正確分類，選項C正確。選項B「新鮮排遺中不含感染性顆粒」雖有其道理（新鮮排遺無孢子），但一般考題答案以「感染性孢子在土壤（非直接排遺）」為重點；多數考題版本答案為B。","we":["人與動物（如犬、貓）的感染多來自土壤中的孢子（吸入），此敘述正確。","（正確）組織漿菌的感染性顆粒（孢子）存在於乾燥的土壤（受鳥或蝙蝠糞污染後），新鮮排遺本身並非直接含有感染性孢子；但題目考的是此敘述「何者錯誤」，實際上各選項需更詳細判斷，B為最常見考題答案。","依Histoplasma的分類，有小型（H. capsulatum var. capsulatum）和大型（H. capsulatum var. duboisii）兩型，可依病原大小分類，此敘述正確。","大多數感染動物呈不顯性感染（亞臨床），只有免疫低下者才發展為嚴重疾病，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_058","year":2020,"roc_year":109,"session":"1","examNo":58,"q":"下列有關家禽流行性感冒的敘述，何者正確？","opts":["A. 低病原家禽流行性感冒目前並無哺乳類的感染案例","B. 高病原家禽流行性感冒目前並無哺乳類的感染案例","C. 其病原僅有一種血清型","D. 其病原之基因體為線狀且分段之RNA病毒"],"ans":3,"exp":"家禽流行性感冒（AI）的正確特性：低病原AI（LPAI）和高病原AI（HPAI）均已有哺乳類感染案例（如豬、貓、人等）；其病原具多種血清型（H1–H16, N1–N9，非單一血清型）；AI病毒基因體為分段（8段）的負義單股RNA，線狀且分段，此描述正確。","we":["低病原AI（LPAI）也有感染哺乳類（如豬感染H1N1等）的案例，「並無哺乳類感染案例」說法錯誤。","高病原AI（HPAI，如H5N1）也有感染貓、虎、人等哺乳類的確認案例，「並無哺乳類感染案例」說法錯誤。","AI病毒有多種血清型（H1–H16 × N1–N9 = 多種組合），並非只有一種血清型，此說法錯誤。","（正確）AI病毒基因體為線狀且分段（8段）的負義單股RNA（-ssRNA）病毒，此描述正確，為本題答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_059","year":2020,"roc_year":109,"session":"1","examNo":59,"q":"新城病在人的感染病例主要病徵為","opts":["A. 肺炎","B. 結膜炎","C. 泌尿道炎","D. 皮膚結節"],"ans":1,"exp":"新城病（Newcastle disease）偶爾可感染人類（職業暴露，如家禽業者、獸醫師），人感染後主要臨床表現為結膜炎（conjunctivitis），通常為自限性，少數可有輕度全身症狀，不會引起嚴重肺炎或神經症狀。","we":["肺炎不是新城病在人的主要病徵，人類感染通常局限於眼部。","（正確）新城病在人感染後主要引起結膜炎，為職業性感染的典型表現，為正確答案。","泌尿道炎非新城病人類感染的症狀。","皮膚結節非新城病人類感染的症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_060","year":2020,"roc_year":109,"session":"1","examNo":60,"q":"下列何者為海獸胃線蟲（ Anisakis spp.）的第一中間宿主？","opts":["A. 水螅蟲","B. 軟體動物","C. 魚","D. 甲殼類"],"ans":3,"exp":"海獸胃線蟲（Anisakis spp.）的生活史：第一中間宿主為甲殼類（磷蝦等浮游甲殼動物），幼蟲被磷蝦等小型甲殼類食入發育；第二中間宿主或傳播宿主為魚類（幼蟲在魚體肌肉中囊化）；終宿主為鯨豚等海洋哺乳動物。人食入含幼蟲的生魚後感染。","we":["水螅蟲（hydroids）非海獸胃線蟲的中間宿主。","軟體動物（mollusks）非海獸胃線蟲的第一中間宿主。","魚類為海獸胃線蟲的第二中間宿主（非第一中間宿主），幼蟲在魚體中囊化待人食入。","（正確）甲殼類（crustaceans，如磷蝦）是海獸胃線蟲的第一中間宿主，幼蟲首先感染甲殼類，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_061","year":2020,"roc_year":109,"session":"1","examNo":61,"q":"萊姆病（Lyme disease）主要由下列何種壁蝨屬為傳播媒介？","opts":["A. Ixodes spp.","B. Boophilus spp.","C. Rhipicephalus spp.","D. Dermacentor spp."],"ans":0,"exp":"萊姆病（Lyme disease）的傳播媒介為Ixodes屬壁蝨（硬蜱），包括Ixodes scapularis（美洲黑腿蜱）和Ixodes ricinus（歐洲蓖麻蜱）等。病原為疏螺旋體（Borrelia burgdorferi sensu lato），必須透過Ixodes屬壁蝨叮咬傳播。","we":["（正確）萊姆病的主要傳播媒介為Ixodes spp.（硬蜱屬），為正確答案。","Boophilus spp.（牛蜱）主要傳播巴貝斯蟲症，非萊姆病媒介。","Rhipicephalus spp.（扇頭蜱）傳播巴貝斯蟲、焦蟲等，非萊姆病媒介。","Dermacentor spp.（花蜱）傳播洛磯山斑點熱（R. rickettsii），非萊姆病媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_062","year":2020,"roc_year":109,"session":"1","examNo":62,"q":"下列何種魚介類較可能引起人類感染廣節裂頭絛蟲？","opts":["A. 貽貝類","B. 鮭或鱒魚","C. 蝦蟹類","D. 石斑魚"],"ans":1,"exp":"廣節裂頭絛蟲（Diphyllobothrium latum，魚肉絛蟲）的生活史：第一中間宿主為橈腳類（劍水蚤）；第二中間宿主為淡水魚（尤其是鮭魚、鱒魚等）；終宿主為人或熊等哺乳動物。人食入含感染性裂尾蚴（plerocercoid）的生鮭魚或鱒魚即可感染。","we":["貽貝類為海水雙殼貝，非廣節裂頭絛蟲的中間宿主。","（正確）鮭魚或鱒魚為廣節裂頭絛蟲的第二中間宿主，食入含裂尾蚴的生魚可感染，為正確答案。","蝦蟹類為甲殼類，非廣節裂頭絛蟲的傳播媒介。","石斑魚為海水魚，廣節裂頭絛蟲主要透過淡水魚（鮭、鱒）傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_063","year":2020,"roc_year":109,"session":"1","examNo":63,"q":"下列何種立克次體疾病在自然環境中可經由空氣傳播？","opts":["A. 恙蟲病","B. 洛磯山斑點熱","C. 鼠性斑疹傷寒","D. Q熱"],"ans":3,"exp":"Q熱（Q fever）由伯內特立克次體（Coxiella burnetii）引起，其特殊之處在於病原可形成孢子樣的小細胞變體（SCV），在自然環境中極為穩定，可藉由乾燥的動物分娩排出物（胎盤、羊水）形成氣霧，在空氣中傳播距離可達數百公尺，屬少數可自然空氣傳播的立克次體疾病。其他立克次體疾病主要透過節肢動物媒介傳播。","we":["恙蟲病（scrub typhus）透過恙蟎（chigger mite）叮咬傳播，並非自然空氣傳播。","洛磯山斑點熱（RMSF）透過Dermacentor屬壁蝨叮咬傳播，並非空氣傳播。","鼠性斑疹傷寒（murine typhus）透過鼠蚤叮咬傳播，並非空氣傳播。","（正確）Q熱（Coxiella burnetii）的病原可形成穩定孢子樣結構，可藉由氣霧（乾燥的污染物）在空氣中傳播，是立克次體病中唯一可經空氣傳播的疾病，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_064","year":2020,"roc_year":109,"session":"1","examNo":64,"q":"下列有關漢他病毒肺症候群的敘述，何者錯誤？","opts":["A. 此病毒可經人與人之傳播感染","B. 平均潛伏期為1至2週","C. 死亡率低於10%","D. 造成肺水腫，終因呼吸衰竭而致死"],"ans":2,"exp":"漢他病毒肺症候群（Hantavirus pulmonary syndrome, HPS）：病毒不會人傳人（美洲漢他病毒）；平均潛伏期1至2週；死亡率高（約35–40%，遠高於10%）；主要造成肺水腫，終因呼吸衰竭死亡。選項C說「死亡率低於10%」為錯誤敘述，HPS死亡率約35–50%。","we":["美洲漢他病毒（Sin Nombre virus等）並不像漢他出血熱腎症候群的某些病毒，HPS不會人傳人（安地斯漢他病毒除外，但為特例），此敘述有其依據，但本題更明確的錯誤是C。","HPS平均潛伏期1至2週（部分文獻1至5週），此敘述基本正確。","（正確）漢他病毒肺症候群（HPS）死亡率高，約35–50%，遠超10%；「死亡率低於10%」為嚴重錯誤描述，為本題答案。","HPS確實引起肺水腫及呼吸衰竭，此為疾病的主要致死機制，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_065","year":2020,"roc_year":109,"session":"1","examNo":65,"q":"下列有關結核病之敘述，何者錯誤？","opts":["A. 幼兒感染易致腦型肺結核，死亡率高","B. 結核菌之病人及病牛為人類最主要感染源","C. 羊主要是由鳥型結核菌感染引起","D. 牛感染人型結核菌症狀較輕"],"ans":2,"exp":"結核病中，牛的感受性分析：牛感染「牛型」結核菌（Mycobacterium bovis）症狀嚴重，感染「人型」（Mycobacterium tuberculosis）症狀較輕。羊主要不是由「鳥型」結核菌引起，而是由牛型或偶見人型結核菌感染；「鳥型」（M. avium complex）主要感染禽類、豬和免疫低下人類。選項C「羊主要是由鳥型結核菌感染引起」為錯誤敘述。","we":["幼兒感染結核菌確實易引起血行播散（如腦膜炎型），死亡率高，此敘述正確。","結核病的主要傳染源為結核菌感染患者（人）及病牛（牛型，透過乳汁），此敘述正確。","（正確）羊並非主要由「鳥型」結核菌（M. avium complex）感染，鳥型主要感染禽類；羊感染結核病主要由牛型菌引起，此選項錯誤，為本題答案。","牛感染人型結核菌（M. tuberculosis）症狀確實比感染牛型（M. bovis）輕，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_066","year":2020,"roc_year":109,"session":"1","examNo":66,"q":"下列有關伊波拉病毒之敘述，何者錯誤？","opts":["A. 為RNA病毒","B. 目前人類病例主要源自於非洲","C. 人類主要藉由老鼠暴露而感染","D. 為生物安全第4等級病毒"],"ans":2,"exp":"伊波拉病毒（Ebola virus）的自然宿主研究顯示，蝙蝠（尤其是果蝠）是最可能的自然保毒宿主，人類主要透過接觸受感染動物（野生動物，如猩猩、大猩猩等靈長類或蝙蝠）或感染者的體液感染，並非以老鼠（囓齒類）為主要媒介。選項C「人類主要藉由老鼠暴露而感染」為錯誤敘述。","we":["伊波拉病毒為RNA病毒（負義單股RNA，線狀病毒科Filoviridae），此敘述正確。","目前人類伊波拉病毒感染病例主要集中在非洲（中非、西非），此敘述正確。","（正確）伊波拉病毒主要透過接觸受感染野生動物（蝙蝠、靈長類）或感染人的體液傳播，並非主要藉由老鼠感染；選項C「老鼠」說法錯誤，為本題答案。","伊波拉病毒為BSL-4病原（生物安全第4等級），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_067","year":2020,"roc_year":109,"session":"1","examNo":67,"q":"下列有關日本腦炎病毒之敘述，何者錯誤？","opts":["A. 具封套病毒","B. 為RNA病毒","C. 主要流行病學區域涵蓋亞洲與美洲地區","D. 家蚊（Culex spp.）為主要傳播病媒"],"ans":2,"exp":"日本腦炎病毒（JEV）流行病學主要涵蓋「亞洲」地區（東亞、東南亞、南亞），並不涵蓋美洲地區。選項C說「主要流行病學區域涵蓋亞洲與美洲地區」為錯誤敘述，美洲並非日本腦炎的流行區。","we":["日本腦炎病毒具有脂質封套（lipid envelope），屬有封套病毒，此敘述正確。","日本腦炎病毒為RNA病毒（黃病毒科，正義單股RNA），此敘述正確。","（正確）日本腦炎主要流行於亞洲地區，不涵蓋美洲；「與美洲地區」的說法錯誤，為本題答案。","家蚊（Culex spp.，尤其是三帶喙庫蚊C. tritaeniorhynchus）是日本腦炎的主要傳播病媒，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_068","year":2020,"roc_year":109,"session":"1","examNo":68,"q":"下列有關西尼羅病毒的敘述，何者正確？","opts":["A. 馬為主要保毒宿主","B. 屬Flaviviridae","C. 為DNA病毒","D. 感染個案因出血而死亡"],"ans":1,"exp":"西尼羅病毒（West Nile virus, WNV）屬黃病毒科（Flaviviridae），為正義單股RNA病毒（+ssRNA）。鳥類是主要保毒宿主（amplifying hosts），馬和人為偶發性宿主（dead-end hosts），並非主要保毒宿主。感染通常表現為發燒、腦炎、偶爾死亡，並非以出血為主。","we":["馬為偶發性宿主（dead-end host），病毒在馬血液中濃度不足以感染蚊子，並非主要保毒宿主，此選項錯誤。","（正確）西尼羅病毒屬Flaviviridae（黃病毒科），與日本腦炎病毒、登革病毒同科，為正確答案。","西尼羅病毒為RNA病毒（正義單股RNA），非DNA病毒，此選項錯誤。","西尼羅病毒感染主要引起發燒、神經症狀（腦炎）、死亡，不以出血為主要表現，此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_069","year":2020,"roc_year":109,"session":"1","examNo":69,"q":"下列人畜共通傳染病病原，何者不是以病媒傳播為主要途徑？","opts":["A. 亨德拉病毒（Hendra virus）","B. 日本腦炎病毒（Japanese encephalitis virus）","C. 裂谷熱病毒（Rift valley fever virus）","D. 西尼羅病毒（West Nile virus）"],"ans":0,"exp":"亨德拉病毒（Hendra virus）主要透過直接接觸受感染馬匹的體液、組織或分泌物傳播給人，並非以節肢動物（蚊、壁蝨等）為傳播媒介。其自然保毒宿主為果蝠（Pteropus spp.），馬為中間宿主，人接觸病馬而感染。","we":["（正確）亨德拉病毒（Hendra virus）主要透過接觸受感染馬匹的體液傳播，並非以病媒（節肢動物）傳播為主要途徑，為正確答案。","日本腦炎病毒（JEV）以家蚊（Culex spp.）為主要傳播病媒，屬病媒傳播。","裂谷熱病毒（RVFV）以蚊子（Aedes、Culex等）為主要傳播病媒，屬病媒傳播。","西尼羅病毒（WNV）以Culex屬蚊子為主要傳播病媒，屬病媒傳播。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_070","year":2020,"roc_year":109,"session":"1","examNo":70,"q":"下列何種人畜共通傳染病病原主要以囓齒類動物為媒介？","opts":["A. 漢他病毒","B. 立百病毒","C. 狂犬病毒","D. 羊接觸傳染性化膿性口炎病毒"],"ans":0,"exp":"漢他病毒（Hantavirus）的主要保毒宿主和傳播媒介為囓齒類動物（如鹿鼠、田鼠等），人類主要透過吸入受感染囓齒類的尿液、糞便或唾液形成的氣霧而感染。","we":["（正確）漢他病毒以囓齒類動物為主要宿主和傳播媒介，為正確答案。","立百病毒（Nipah virus）的主要宿主為果蝠（Pteropus spp.），非囓齒類。","狂犬病毒主要宿主為犬、狐、蝙蝠等肉食性動物，並非囓齒類（囓齒類偶可感染但非主要媒介）。","羊接觸傳染性化膿性口炎病毒（ORF virus，副痘病毒）主要宿主為山羊和綿羊，非囓齒類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_071","year":2020,"roc_year":109,"session":"1","examNo":71,"q":"下列何種疾病最不可能因為飲用生乳而感染？","opts":["A. 結核病","B. 炭疽病","C. 彎曲桿菌症","D. 李斯特菌症"],"ans":1,"exp":"炭疽病（anthrax）由炭疽桿菌（Bacillus anthracis）引起，主要透過吸入、食入或皮膚接觸芽孢感染。生乳中偶可含有炭疽菌，但炭疽病透過飲用生乳感染人類的案例極為罕見（炭疽菌在乳品中存活能力有限）。相較之下，結核病、彎曲桿菌症、李斯特菌症均有明確的生乳傳播案例。","we":["結核病（牛型結核菌）可透過飲用含病原的生乳感染，是著名的乳源性人畜共通傳染病，此選項是「可能感染」。","（正確）炭疽病透過飲用生乳感染的案例極罕見，是最不可能因飲用生乳而感染的疾病，為正確答案。","彎曲桿菌症（campylobacteriosis）可透過污染的生乳傳播，為常見乳源性食物中毒。","李斯特菌症可透過污染的生乳及未充分殺菌的乳製品傳播，為重要的乳源性感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_072","year":2020,"roc_year":109,"session":"1","examNo":72,"q":"下列何種人畜共通傳染病會造成火雞雞冠發紺而有藍冠（blue comb）症狀？","opts":["A. 豬丹毒","B. 狂犬病","C. 西尼羅熱","D. 日本腦炎"],"ans":2,"exp":"西尼羅熱（West Nile fever）的病原西尼羅病毒可感染多種禽類，在火雞中可造成雞冠發紺（變藍紫色），又稱「藍冠病」（blue comb），這是西尼羅病毒在火雞中的特徵性臨床表現之一。","we":["豬丹毒（swine erysipelas）主要感染豬，不引起火雞雞冠發紺。","狂犬病主要引起神經症狀，不以禽類為主要宿主，不引起火雞雞冠發紺。","（正確）西尼羅熱（West Nile fever）可造成火雞雞冠發紺（藍冠症狀），此為其在禽類的特徵性表現，為正確答案。","日本腦炎主要在哺乳動物（豬、馬）和人類引起症狀，並不以火雞雞冠發紺為特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_073","year":2020,"roc_year":109,"session":"1","examNo":73,"q":"下列何種吸蟲症會因牛食入含有被囊幼蟲（metacercaria）的螞蟻而造成感染？","opts":["A. 橫川氏吸蟲","B. 日本住血吸蟲","C. 槍形吸蟲","D. 牛羊肝吸蟲"],"ans":2,"exp":"槍形吸蟲（Dicrocoelium dendriticum，小型肝吸蟲）的生活史特殊：第一中間宿主為陸生螺牛；第二中間宿主為螞蟻（Formica spp.），螞蟻食入尾蚴後形成囊尾蚴，寄生於螞蟻體內。牛羊食入含囊尾蚴的螞蟻後感染，成蟲寄生於膽管。這是以螞蟻為傳播宿主的特殊寄生蟲。","we":["橫川氏吸蟲（Metagonimus yokogawai）第二中間宿主為淡水魚（香魚），非螞蟻。","日本住血吸蟲（Schistosoma japonicum）透過尾蚴直接穿透皮膚感染，無螞蟻中間宿主。","（正確）槍形吸蟲（Dicrocoelium dendriticum）以螞蟻為第二中間宿主，牛羊食入含囊尾蚴的螞蟻感染，成蟲寄生膽管，為正確答案。","牛羊肝吸蟲（Fasciola hepatica）第二中間宿主為淡水螺（metacercaria附著水草），牛羊食入水草感染，非螞蟻。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_074","year":2020,"roc_year":109,"session":"1","examNo":74,"q":"東方眼蟲（ Thelazia callipaeda ）寄生在犬、兔和人的結膜囊內，下列何者是助其傳播的媒介？","opts":["A. 蠅類","B. 斑蚊","C. 老鼠","D. 壁蝨"],"ans":0,"exp":"東方眼蟲（Thelazia callipaeda，東方眼線蟲）的傳播媒介為蠅類，尤其是果蠅（Drosophila spp.）或其他相關蠅類，會在宿主眼眶處舔食分泌物時傳播感染性幼蟲。成蟲寄生於犬、兔、人的結膜囊，引起結膜炎和角膜炎。","we":["（正確）蠅類（flies，包括果蠅Drosophila等）是東方眼蟲的傳播媒介，舔食眼部分泌物時傳播感染性幼蟲，為正確答案。","斑蚊傳播登革熱等蟲媒病，並非東方眼蟲的傳播媒介。","老鼠並非東方眼蟲的傳播媒介。","壁蝨傳播萊姆病、Q熱等，並非東方眼蟲的傳播媒介。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_075","year":2020,"roc_year":109,"session":"1","examNo":75,"q":"桿菌性痢疾（bacillary dysentery）的病原體主要為下列何者？","opts":["A. Shigella dysenteriae","B. Vibrio cholerae","C. Salmonella Typhi","D. Entamoeba histolytica"],"ans":0,"exp":"桿菌性痢疾（bacillary dysentery）的主要病原體為志賀氏菌（Shigella dysenteriae，以及S. flexneri、S. sonnei等）。其他選項：Vibrio cholerae引起霍亂；Salmonella Typhi引起傷寒；Entamoeba histolytica引起阿米巴性痢疾（非桿菌性）。","we":["（正確）桿菌性痢疾（shigellosis）主要由Shigella dysenteriae引起，是細菌性痢疾最嚴重的菌種（產毒最強），為正確答案。","Vibrio cholerae引起霍亂（cholera），以嚴重水樣腹瀉為特徵，非桿菌性痢疾。","Salmonella Typhi引起傷寒（typhoid fever），以全身性菌血症為特徵，非桿菌性痢疾。","Entamoeba histolytica引起阿米巴性痢疾（amoebic dysentery），為原蟲性，非桿菌性痢疾。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_076","year":2020,"roc_year":109,"session":"1","examNo":76,"q":"依據動物傳染病防治條例施行細則，掩埋動物屍體或物品時，土坑深度應在屍體或物品投入後，自屍體或物品頂端，應距離地面多少公尺以上？","opts":["A. 0.3","B. 0.5","C. 1","D. 1.5"],"ans":2,"exp":"依動物傳染病防治條例施行細則，掩埋動物屍體時，土坑深度應使屍體頂端距地面至少1公尺以上，以防止病原藉土壤或地下水擴散，以及防止野生動物挖掘。","we":["0.3公尺過淺，不符合防止污染擴散及野生動物挖掘的要求。","0.5公尺仍不足，未達法規規定的最低深度。","（正確）掩埋後屍體頂端距地面至少1公尺以上，為正確法規規定，為本題答案。","1.5公尺雖然更安全，但法規規定的最低標準為1公尺，選項C（1公尺）已符合，若需從選項中選「至少幾公尺以上」，1公尺為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_1_公衛_077","year":2020,"roc_year":109,"session":"1","examNo":77,"q":"【已刪除】77.下列何者為小於6個月齡豬隻FMDV實際陽性率？ (A)10/110=9.1%","opts":["A. 40/110=36.4%","B. 20/110=18.2%","C. 無法計算 (E)一律給分"],"ans":0,"exp":"本題（第77題）為「已刪除」題目，依考選部規定一律給分。本題需搭配原試題圖表（2×2表），問小於6個月齡豬隻FMDV實際陽性率，因無法取得原始表格資料，且本題已刪除，建議一律給分。","we":["（本題已刪除，一律給分）","（本題已刪除，一律給分）","（本題已刪除，一律給分）","（本題已刪除，一律給分）"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_078","year":2020,"roc_year":109,"session":"1","examNo":78,"q":"【已刪除】78.承上題，依此診斷工具之敏感性及特異性，回推在未發生錯誤分組情況下，下列何者為勝算比實際值？","opts":["A. 3.5","B. 7.5","C. 17.5","D. 27.5 (E)一律給分"],"ans":0,"exp":"本題（第78題）為「已刪除」題目，依考選部規定一律給分。本題需搭配原試題圖表及前題數值，因無法取得原始資料，且本題已刪除，建議一律給分。","we":["（本題已刪除，一律給分）","（本題已刪除，一律給分）","（本題已刪除，一律給分）","（本題已刪除，一律給分）"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_079","year":2020,"roc_year":109,"session":"1","examNo":79,"q":"假設此疫情為連續傳播所造成，下列敘述何者錯誤？","opts":["A. 易感受性宿主的多寡影響此流行曲線型態","B. 17日之前，基本再生數（basic reproduction number, R 0 ）應小於1","C. 因疫情持續不到1週，顯示此傳染病潛伏期很短","D. 17日之後，基本再生數（basic reproduction number, R 0 ）應小於1"],"ans":2,"exp":"本題需搭配原試題圖（疫情流行曲線），描述「連續傳播所造成的疫情」。若疫情在17日之前發病數持續增加，表示R0>1；17日之後發病數減少，表示R0<1（選項D正確）。選項C說「疫情持續不到1週，顯示潛伏期很短」，連續傳播的疫情持續時間長短由傳播速度和族群易感性決定，不能直接反映潛伏期的長短，此敘述錯誤。","we":["易感受性宿主的多寡確實影響流行曲線型態（易感個體越多，流行越大），此敘述正確。","17日之前發病數增加，代表每個感染者可傳染超過1個人，R0>1，選項B「應小於1」描述錯誤（應為大於1）。","（正確）連續傳播疫情的持續時間無法直接反映潛伏期，因為疫情持續取決於族群易感性和傳播效率，「持續不到1週顯示潛伏期很短」的推論不正確，為本題答案。","17日之後發病數減少，代表R0<1（每個感染者傳染不到1個人），疫情消退，此敘述正確。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_1_公衛_080","year":2020,"roc_year":109,"session":"1","examNo":80,"q":"承上題，若此疫情為共同傳染源所造成，第15百分位病例發生時間為16日12時，第50百分位病例發生時間為 17日12時，第85百分位病例發生時間為19日12時，則此傳染病的潛伏期為幾天？","opts":["A. 1","B. 1.5","C. 2","D. 2.5"],"ans":2,"exp":"共同傳染源疫情的潛伏期估算法：利用百分位數法。已知：P15（第15百分位病例發生時間）= 16日12時；P50 = 17日12時；P85 = 19日12時。中位潛伏期 = P50 - 暴露時間；若暴露時間未知，可用公式估算：暴露時間 ≈ P50 - (P85-P15)/2 × 特定係數（或直接用Sartwell法）。依題目設計，P85-P15 = 3天，潛伏期估計（中位數）= 暴露至P50病例發生，依計算約為2天。","we":["1天過短，依百分位數計算結果不符。","1.5天，依計算結果不完全符合。","（正確）依共同暴露疫情百分位數估算法，潛伏期約為2天，符合P50-P15=1天、P85-P50=2天的時間分布，為最接近的答案。","2.5天，依計算結果偏高。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_2_公衛_001","year":2020,"roc_year":109,"session":"2","examNo":1,"q":"有關信賴區間的敘述,下列何者正確?","opts":["A. 為非常態(non-normal)分布的連續型資料描述其估計值的變化範圍之有效方式","B. 變異數(variance)為影響信賴區間大小的唯一因子","C. 95%信賴區間所對應統計學檢定顯著意義之p值為0.95","D. 可使用此方法描述類別型資料其所占百分比估計值的變化範圍"],"ans":3,"exp":"信賴區間（CI）可用於描述任何估計值（包括比例、百分比）的不確定範圍，因此類別型資料的百分比估計值同樣可使用此方法。95%CI 對應的顯著性 p 值為 0.05，而非 0.95；且影響 CI 寬窄的因素包括樣本數與變異數，並非只有變異數一個。","we":["非常態分布的連續型資料若樣本足夠大，仍可利用中央極限定理計算信賴區間，但最適合仍是正態或可轉換為正態的資料，故此選項有誤。","信賴區間的寬窄同時受樣本數大小與資料變異程度影響，並非只有變異數是唯一因子，此選項錯誤。","95%信賴區間對應的統計顯著 p 值為 0.05（非 0.95），若某因子的 95%CI 不包含虛無假設值，則 p < 0.05，此選項錯誤。","（正確）信賴區間確實可用於描述類別型資料（如盛行率、百分比）估計值的不確定範圍，是正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_002","year":2020,"roc_year":109,"session":"2","examNo":2,"q":"下列有關新城病病因(cause)之敘述,何者正確?①新城病病毒為發生此病的必需病因(necessary cause)\r ②家禽的年齡可為發生此病的組成病因(component cause) ③新城病疫苗是否施打為發生此病的必需病因\r ④此病的充分病因(sufficient cause)僅為是否感染此病毒","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":0,"exp":"必需病因（necessary cause）是指缺乏該因子，疾病就不會發生；新城病病毒是發生新城病的必需病因。家禽年齡屬於組成病因（component cause）之一，可影響易感性。疫苗未施打僅為危險因子，並非必需病因；充分病因（sufficient cause）是多種組成病因加總，不僅是病毒一項。","we":["（正確）①新城病病毒為必需病因（正確）；②年齡為組成病因（正確），因此①②組合正確。","②年齡確為組成病因，但③疫苗是否施打並非必需病因，因不打疫苗的禽隻仍可能不發病，故②③組合不正確。","③疫苗未施打不是必需病因；④充分病因不只是病毒一項，故③④均錯，此選項不正確。","④充分病因涵蓋所有導致疾病必然發生的組成病因組合，並不只是「是否感染病毒」，故①④組合中④有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_003","year":2020,"roc_year":109,"session":"2","examNo":3,"q":"下列何種研究主題最適合利用横斷式研究法cross-sectionalstudy)之研究結果進行因果關條判定?","opts":["A. 牛隻移動是否增加感染結核病風險","B. 裝設防鳥網是否降低鴨感染禽流感風險","C. 豬隻混養是否增加感染豬瘟風險","D. 犬隻性別是否影響罹患糖尿病風險"],"ans":3,"exp":"橫斷式研究（cross-sectional study）同時量測暴露與結果，因此暴露與疾病的時序不明確，通常不適合做因果推論。然而，若暴露因子是「固定不變的生物特性」（如性別、血型、品種），則時序問題不存在，因果推論較為可靠。犬隻性別是出生既定的固定特性，故最適合用橫斷式研究推論因果。","we":["牛隻移動是可改變的行為因素，橫斷式研究中移動與感染哪個先發生不清楚，因果推論困難。","防鳥網的裝設是干預措施，屬於實驗設計範疇，使用橫斷式研究無法排除時序混淆，不適合因果判定。","豬隻混養是可改變的管理因素，無法確定混養在前還是感染在前，因果推論不可靠。","（正確）犬隻性別為固定生物特性（出生即決定），橫斷式研究的時序問題不存在，最適合利用橫斷式研究結果進行因果判定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_004","year":2020,"roc_year":109,"session":"2","examNo":4,"q":"下列何者不是世代研究法中控制干擾因子的方法?","opts":["A. 分層分析","B. 配對","C. 校正診斷工具","D. 多變項廻歸分析"],"ans":2,"exp":"世代研究中控制干擾因子的方法包括：設計階段的限制（restriction）與配對（matching）、分析階段的分層分析與多變項迴歸分析。「校正診斷工具」是用來提升測量的準確性（減少測量偏差），並非用來控制干擾因子的方法。","we":["分層分析是分析階段常用的干擾因子控制方法，為世代研究的有效工具，並非不是干擾因子控制方法。","配對是設計階段常用的干擾因子控制方法（如對照組與暴露組依年齡、性別配對），為有效控制干擾的方式。","（正確）校正診斷工具是為了減少測量誤差（misclassification），目的是提升測量準確性，並非直接用來控制干擾因子，故為「不是干擾因子控制方法」的正確答案。","多變項迴歸分析是分析階段同時調整多個干擾因子的統計方法，屬於世代研究常用的干擾控制工具。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_005","year":2020,"roc_year":109,"session":"2","examNo":5,"q":"調査牛捻轉血矛線蟲Haemonchus contortus)感染症發現三項統計正相關事件:①寄生蟲之存在與牛皺胃充\r 血②寄生蟲之存在與牛貧血③牛皺胃充血與貧血。由疾病因果相關分析,下列敘述何者錯誤?","opts":["A. 寄生蟲之存在與牛皺胃充血是因果相關","B. 寄生蟲之存在與牛貧血是因果相關","C. 牛皺胃充血與貧血為因果相關","D. 牛皺胃充血與貧血兩者不是獨立事件"],"ans":2,"exp":"捻轉血矛線蟲寄生牛皺胃，直接吸血造成皺胃充血（①正確因果），並因持續失血導致貧血（②正確因果）。皺胃充血與貧血均為同一原因（寄生蟲）的不同結果，兩者為伴隨現象（spurious correlation），並非因果關係；但兩者確實不是獨立事件（④正確）。選項C說「皺胃充血與貧血為因果相關」是錯誤敘述，因為兩者是共同結果而非因果鏈。","we":["寄生蟲直接附著並刺破皺胃黏膜吸血，造成皺胃充血，①為正確的因果相關，此敘述正確。","寄生蟲大量吸血導致宿主失血性貧血，②亦為正確的因果相關，此敘述正確。","（正確）皺胃充血與貧血均為寄生蟲感染的結果（兩者皆由同一原因引起），彼此之間是偽相關（spurious）而非因果關係，故「牛皺胃充血與貧血為因果相關」是錯誤敘述。","皺胃充血與貧血共同由寄生蟲引起，兩者有共同原因，統計上具相關性，確實不是獨立事件，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_006","year":2020,"roc_year":109,"session":"2","examNo":6,"q":"正確診斷出未感染動物的機率稱為","opts":["A. 真陽性率","B. 敏感性","C. 特異性","D. 偽陽性率"],"ans":2,"exp":"特異性（specificity）定義為：真正未感染的動物中，被診斷為陰性（正確排除）的比例，即真陰性率。題目「正確診斷出未感染動物的機率」即是特異性的定義。","we":["真陽性率（true positive rate）即敏感性，指真正感染動物中被正確診斷為陽性的比例，與題意不符。","敏感性（sensitivity）是在已感染動物中正確診斷為陽性的比率，而非針對未感染動物，此選項不正確。","（正確）特異性（specificity）定義為「真正未感染（陰性）動物被正確診斷為陰性的機率」，與題目描述完全符合。","偽陽性率（false positive rate）是未感染動物中被錯誤診斷為陽性的比例，與「正確診斷未感染」相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_007","year":2020,"roc_year":109,"session":"2","examNo":7,"q":"世界動物組織認為下述牛隻產品可以自由輸出人而不需要考慮牛海綿狀腦病的發生與相關風險,何者錯誤?","opts":["A. 牛肉","B. 牛奶","C. 乳酪","D. 皮革"],"ans":0,"exp":"依世界動物衛生組織（OIE/WOAH）規範，牛乳、乳酪及皮革因不含高風險神經組織，被認為可以自由貿易且不受 BSE（牛海綿狀腦病）風險限制。牛肉本身（特別是去骨肌肉）在符合規定條件下也可自由貿易，但「牛肉」若包含脊髓等特定風險物質（SRM）則受限；題目中純粹「牛肉」若指帶骨或含 SRM 則可能受限，故此選項「錯誤」。","we":["（正確錯誤）依 OIE 規定，未去除特定風險物質（SRM）的牛肉可能仍有 BSE 風險考量，因此「牛肉可自由輸出入而不需考慮 BSE 風險」的說法有誤，為本題答案。","牛乳及乳製品已被 OIE 認定為 BSE 低風險產品，可自由貿易，此敘述正確，不是錯誤選項。","乳酪（cheese）由牛乳製造，同屬低風險產品，OIE 認定可自由貿易，此敘述正確。","皮革不含神經或淋巴組織，被 OIE 認定為安全，可自由貿易，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_008","year":2020,"roc_year":109,"session":"2","examNo":8,"q":"研究族群依所選特性分成數個次群組,每一群組內個體特性儘量相同但不同群組之個體特性要儘量不同,依此\r 能包括群組中各種特性再進行簡單抽樣,此為下列何種方式?","opts":["A. 完全逢機抽様 (completely random sampling )","B. 系統性逢機抽樣(systematic random sampling)","C. 分層逢機抽樣(stratified random sampling)","D. 集簇抽様 (cluster sampling)"],"ans":2,"exp":"分層逢機抽樣（stratified random sampling）是先將族群依特定特性分為若干層（strata），各層內個體特性盡量相同（均質），層間個體特性盡量不同（異質），再於各層中進行隨機抽樣。此方法能確保各層都有代表，提高估計精確度。","we":["完全逢機抽樣（simple random sampling）是對整個族群隨機抽取，不先分群，每個個體被選中機率相等，並未先分層。","系統性逢機抽樣（systematic random sampling）是先確定抽樣間隔（k），從第一個隨機起點開始，每隔 k 個個體抽取一個，並非先分組。","（正確）分層逢機抽樣先依特性分層，層內均質、層間異質，再各層隨機抽樣，完全符合題目描述。","集簇抽樣（cluster sampling）是先將族群分為若干群組（cluster，通常為地理單位），再隨機抽取整個群組，並非先依特性分層。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_009","year":2020,"roc_year":109,"session":"2","examNo":9,"q":"下列有關預測值的敘述,何者錯誤?","opts":["A. 要計算預測值時,需知道敏感性、特異性與盛行率","B. 陰性預測值指一個檢測結果陰性的動物確實未感染疾病的機率","C. 敏感性、特異性對預測值影響很大,但盛行率對預測值影響很小","D. 試驗的特異性越高,陽性預測值越佳"],"ans":2,"exp":"預測值（predictive value）受敏感性、特異性及盛行率三者共同影響。盛行率對預測值影響甚大：盛行率低時，即使特異性高，陽性預測值仍可能偏低（假陽性多）。選項C說「盛行率對預測值影響很小」是錯誤敘述。","we":["計算預測值確實需要知道敏感性、特異性與盛行率三個參數，此敘述正確。","陰性預測值（NPV）定義為檢測結果陰性的動物確實未感染的機率，此敘述正確。","（正確）盛行率對預測值影響非常大：盛行率越低，陽性預測值越低（偽陽性比例增加）；盛行率越高，陰性預測值越低，故「盛行率對預測值影響很小」為錯誤敘述。","特異性越高，偽陽性越少，陽性預測值（PPV）越佳，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_010","year":2020,"roc_year":109,"session":"2","examNo":10,"q":"下列有關疾病發生的量測,何者錯誤?","opts":["A. 發生率表示一特定時間內新病例發生的速度","B. 累積發生率表示一特定時間内發生疾病之危險性","C. 盛行率表示一特定時間點上有病的機率","D. 盛行率高表示危險性高,致死率高"],"ans":3,"exp":"盛行率（prevalence）是一特定時間點上族群中有病的比例，受發生率與疾病持續時間影響（Prevalence ≈ Incidence × Duration）。盛行率高可能是因為疾病持續時間長（慢性病），而非致死率高；致死率高的疾病盛行率反而可能偏低。故選項D「盛行率高表示危險性高，致死率高」為錯誤敘述。","we":["發生率（incidence rate）表示單位時間內新病例的速度，此定義正確。","累積發生率（cumulative incidence）表示特定時間內族群中發生疾病的危險性（比例），此定義正確。","盛行率（point prevalence）表示某特定時間點上族群中有病（現有病例）的機率，此定義正確。","（正確）盛行率高不一定代表危險性或致死率高；慢性病因持續時間長往往盛行率高，但致死率未必高，故此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_011","year":2020,"roc_year":109,"session":"2","examNo":11,"q":"下列何者是病例對照研究法的優點?","opts":["A. 可知發生率","B. 不易有選樣偏差","C. 可計算相對危險性","D. 適用於臨床病例或是潛伏期很長的疾病研究"],"ans":3,"exp":"病例對照研究法（case-control study）從已知結果（有病/無病）回溯暴露史，特別適合研究罕見疾病或潛伏期很長的疾病，因為不需要長期追蹤大量個體。其缺點包括容易有選樣偏差，且無法直接計算發生率或相對危險性（只能計算勝算比 OR）。","we":["病例對照研究無法直接計算發生率，因為並非追蹤族群，分母無法確定，此選項錯誤。","病例對照研究容易有選樣偏差（selection bias）和回憶偏差（recall bias），並非不易，此選項錯誤。","病例對照研究只能計算勝算比（OR），無法直接計算相對危險性（RR），因為無法得知暴露族群的發病人數，此選項錯誤。","（正確）病例對照研究特別適合研究臨床病例（已有病例可供選取）或潛伏期很長的疾病（不需長期前瞻追蹤），是其主要優點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_012","year":2020,"roc_year":109,"session":"2","examNo":12,"q":"進行禽流感流行病學研究時,若畜主或員工對於病例組之場內管理和雞隻異常情形有所隱瞞,導致分析結果\r 無法符實,此錯誤屬於下列何者?","opts":["A. 干擾 (confounding)","B. 分類偏差(misclassification bias)","C. 交互作用(interaction)","D. 選樣偏差(selection bias)"],"ans":1,"exp":"分類偏差（misclassification bias）是指因資訊不準確（如隱瞞、遺忘或不實記錄）導致暴露或結果被錯誤分類，進而影響研究結果。題目中畜主隱瞞場內管理和雞隻異常，導致病例組資料失真，屬於資訊偏差中的分類偏差。","we":["干擾（confounding）是第三變數同時影響暴露和結果，與題目中「隱瞞資訊」的情境不同。","（正確）畜主隱瞞資訊導致病例組暴露史被錯誤記錄，屬於差異性分類偏差（differential misclassification bias），為正確答案。","交互作用（interaction）是指兩個因子的共同效應不同於各自效應之和，與隱瞞資訊無關。","選樣偏差（selection bias）是選取研究對象時系統性地過度或不足代表某群體，與資訊隱瞞不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_013","year":2020,"roc_year":109,"session":"2","examNo":13,"q":"為證實臺灣已是口蹄疫清淨國而欲進行抽樣測試,以須至少能檢出一隻感染動物計算所需樣本數,下列敘述 何者錯誤?","opts":["A. 當疾病盛行率越低,所需樣本數越多","B. 信心水準越高,所需樣本數越多","C. 目標族群越大,所需樣本數越多","D. 若在金門高風險地區採樣,所需樣本數越多"],"ans":2,"exp":"在疾病清淨化調查中，目標族群越大時，若以有限抽樣估計，族群規模達到一定大小後，所需樣本數趨於穩定（樣本數主要由設計盛行率和信心水準決定），並不會因族群越大而無限增加。相反，在高風險地區（金門）採樣可降低所需樣本數，因為盛行率假設較高，更容易偵測到陽性。","we":["疾病盛行率越低，要確保至少能偵測到一個陽性個體，需要更多樣本，此敘述正確。","信心水準越高（如99% vs 95%），需要更多樣本才能達到統計要求，此敘述正確。","（正確）當族群足夠大時，所需樣本數趨於穩定，不會隨族群增大而持續增加（有限族群修正後），故「目標族群越大，所需樣本數越多」是錯誤敘述。","在高風險地區（如金門）採樣，預設盛行率較高，偵測到陽性所需樣本數反而較少，故「越多」的說法錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_014","year":2020,"roc_year":109,"session":"2","examNo":14,"q":"下列有關疫苗應用與群體免疫herdimmunity)關條之敘述,何者錯誤?","opts":["A. 族群中免疫的個體數量越多,族群免疫力越佳","B. 限界族群密度(criticalpopulation density)越高,疾病越易發生流行","C. 基礎複製數 (basic reproductive number; R o )越大,疾病越難從一地區撲滅","D. 族群密度增高時,基礎複製數(basic reproductive number: R o )随之升高"],"ans":1,"exp":"限界族群密度（critical population density）是疾病能維持流行所需的最低易感族群密度。此密度越高，代表疾病傳播需要更多易感個體，表示病原傳播效率低，反而疾病不易流行；限界族群密度越低，才表示疾病越容易流行。因此「越高，疾病越易流行」為錯誤敘述。","we":["族群中免疫個體越多，易感個體越少，群體免疫力越佳，疾病傳播鏈越容易被阻斷，此敘述正確。","（正確）限界族群密度越高，代表需要更多易感個體才能維持流行，實際上疾病「不容易」流行（因為需要更高密度才能傳播），此選項說法相反，故為錯誤。","基礎複製數（R0）越大，每個感染個體能傳染給更多個體，需要更高比例免疫個體才能阻止流行，故越難從地區撲滅，此敘述正確。","族群密度增高時，個體間接觸機率增加，每個感染者平均可接觸更多易感個體，R0 隨之升高，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_015","year":2020,"roc_year":109,"session":"2","examNo":15,"q":"動物自感染病原至排出病原的期間,稱之為下列何者?","opts":["A. 潛伏期(incubation period )","B. 持續期(latent period)","C. 前驅期(prodromal period)","D. 消退期(regression period)"],"ans":1,"exp":"持續期（latent period）又稱潛伏感染期，是指動物從感染病原到開始排出病原（具傳染性）的期間。與之不同的是，潛伏期（incubation period）是指從感染到出現臨床症狀的期間。題目描述「自感染至排出病原」的期間，即為持續期（latent period）。","we":["潛伏期（incubation period）是從感染到出現臨床症狀的期間，而非到排出病原的期間，兩者不同。","（正確）持續期（latent period）是指從感染病原到開始具有傳染性（排出病原）的期間，與題目描述完全符合。","前驅期（prodromal period）是臨床症狀出現前的輕微不適期，與感染到排出病原的定義不符。","消退期（regression period）是疾病臨床症狀逐漸減輕的階段，與題目定義無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_016","year":2020,"roc_year":109,"session":"2","examNo":16,"q":"下列有關點盛行率之敘述,何者錯誤?","opts":["A. 點盛行率一般簡稱為盛行率","B. 其定義是在某一時間點上,某族群的所有新病例數占全人口數的比率","C. 點盛行率會受到得病動物數的影響","D. 點盛行率會受到疾病持續期的影響"],"ans":1,"exp":"點盛行率（point prevalence）的正確定義是在某一特定時間點上，某族群中「所有現有病例數（含新舊病例）」占總族群人口數的比率，而非「所有新病例數」。選項B說「所有新病例數」是錯誤的，應為「所有病例數（現患病例）」。","we":["點盛行率確實即一般所稱的盛行率，此敘述正確。","（正確）點盛行率分子應為某時間點上「所有現有病例數」（包含新舊），而非「所有新病例數」（新病例是計算發生率的分子），此選項定義錯誤，為本題答案。","點盛行率受到族群中患病動物數影響，患病動物越多，點盛行率越高，此敘述正確。","點盛行率受疾病持續期影響，持續期越長，同一時間點上現患病例越多，點盛行率越高（P ≈ I × D），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_017","year":2020,"roc_year":109,"session":"2","examNo":17,"q":"某研究收集有及無接種日本腦炎疫苗的懷孕母豬各100頭,並追蹤有無流產或死胎發生。此研究設計屬於何種\r 流行病學研究法?","opts":["A. 臨床試驗(clinical trial)","B. 横斷式研究(cross-sectionalstudy)","C. 病例對照研究(case-control study)","D. 世代研究 (cohort study)"],"ans":3,"exp":"此研究收集「有接種疫苗」與「無接種疫苗」兩組懷孕母豬，並追蹤後續流產或死胎發生，是前瞻性追蹤暴露組（接種）與非暴露組（未接種）的結果，屬於世代研究（cohort study）的設計。","we":["臨床試驗（clinical trial）需要研究者主動介入並隨機分組，此研究只是收集已有接種情況的動物追蹤，並未隨機介入，不屬於臨床試驗。","橫斷式研究（cross-sectional study）是在同一時間點同時測量暴露與結果，此研究有明確追蹤期，不是橫斷式。","病例對照研究（case-control study）是先選取有病（流產）與無病（未流產）的動物，再回溯其暴露史（是否接種），與此研究設計（先分組再追蹤）方向相反。","（正確）世代研究（cohort study）是先依暴露狀況（接種 vs 未接種）分組，再前瞻追蹤疾病結果（流產/死胎），符合本研究設計。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_018","year":2020,"roc_year":109,"session":"2","examNo":18,"q":"下列有關匹配(matching)的敘違,何者錯誤?","opts":["A. 常被使用的干擾因子控制方法","B. 可提高研究的效率","C. 可增加相關估計值的精確度","D. 病例對照法中匹配可調整干擾因子之作用"],"ans":3,"exp":"在病例對照研究中，若使用配對（matching）設計，分析時必須使用配對分析方法（如 McNemar 檢定或條件式 logistic regression），才能正確調整干擾因子。若未使用配對分析方法，配對反而無法控制干擾，甚至可能導致偏差。因此選項D「配對可調整干擾因子之作用」是不完整的說法，配對本身不直接調整，而是透過配對分析才能達到此目的。","we":["配對是常用的干擾因子控制設計方法，廣泛用於病例對照研究和世代研究，此敘述正確。","配對可讓病例組與對照組在干擾因子上更為相似，提高研究效率（需要更少樣本數），此敘述正確。","配對可使估計值更精確（減少因干擾因子造成的變異），此敘述正確。","（正確）在病例對照研究中，配對本身不會自動調整干擾因子，必須搭配配對分析（如條件式 logistic regression）才能正確調整；若進行非配對分析，配對反而無效甚至有害，故此選項說法有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_019","year":2020,"roc_year":109,"session":"2","examNo":19,"q":"獸醫流行病學研究方法中可以提供疾病盛行率,但不適合用來研究罕見疾病的是何種方法?","opts":["A. 横斷式研究法","B. 病例對照研究法","C. 世代研究法","D. 回溯性研究法"],"ans":0,"exp":"橫斷式研究法（cross-sectional study）在特定時間點對族群進行一次性調查，可估計疾病的盛行率（prevalence）。由於所有個體在同一時點被調查，若疾病罕見，在抽樣人數有限時很難找到足夠病例，故不適合研究罕見疾病。","we":["（正確）橫斷式研究可提供疾病盛行率，但因一次性採樣時罕見疾病病例太少，不適合研究罕見疾病，符合題目描述。","病例對照研究法特別適合研究罕見疾病（因為直接從病例選取，不需大規模篩查），且無法直接提供盛行率。","世代研究法可計算發生率，也可追蹤罕見疾病，但需要追蹤大量個體，其提供的是發生率而非盛行率。","回溯性研究法是一種世代研究的變體，利用已有的歷史記錄追蹤，可用於研究罕見疾病，提供的不是即時盛行率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_020","year":2020,"roc_year":109,"session":"2","examNo":20,"q":"當疾病的發生頻率較低,並且無明顯的時間形式,則該疾病屬於下列何者?","opts":["A. 點流行性(point epidemic)","B. 地方性(endemic)","C. 散發性(sporadic)","D. 泛流行性(pandemic)"],"ans":2,"exp":"散發性（sporadic）指某疾病在族群中偶爾零星出現，發生頻率低且無明顯時間、地點或族群的規律形式。地方性（endemic）指持續穩定地存在於某地區；點流行性（point epidemic）指短時間內大量病例出現；泛流行性（pandemic）指跨越多國或全球的大規模流行。","we":["點流行性（point epidemic）是指短時間內因共同暴露於同一感染源而出現大量病例，有明顯時間群聚，不符題意。","地方性（endemic）是指疾病在某地區持續以穩定頻率存在，有規律性，不符合「頻率較低且無明顯時間形式」。","（正確）散發性（sporadic）是指疾病發生頻率低、不定期、無明顯時間或地理聚集形式，符合題目描述。","泛流行性（pandemic）是指疾病在全球或多個大陸廣泛流行，規模大且跨國，與「頻率較低」不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_021","year":2020,"roc_year":109,"session":"2","examNo":21,"q":"欲了解在未生育過的犬隻,黃體激素的給予是否和子宮蓄膿有關,研究人員選取了有子宮蓄膿的犬隻453隻, 以及沒有子宮蓄膿的犬隻2,110隻,再以病歷資料和紀錄進行研究分析。此種流行病學研究方法為下列何者?","opts":["A. 世代研究法(cohort study)","B. 病例對照研究法(case-control study)","C. 横斷式研究法(cross-sectional study)","D. 臨床試驗(clinical trial)"],"ans":1,"exp":"此研究先選取有子宮蓄膿的犬隻（病例組）和沒有子宮蓄膿的犬隻（對照組），再以病歷資料回溯是否曾給予黃體激素，屬於病例對照研究法（case-control study）。","we":["世代研究法（cohort study）是先選取暴露組（有使用黃體激素）與非暴露組，前瞻性追蹤是否發生子宮蓄膿，此研究並非從暴露分組出發。","（正確）病例對照研究法（case-control study）是先選取有病（子宮蓄膿）與無病個體，再回溯暴露史（黃體激素），符合本研究設計。","橫斷式研究法（cross-sectional study）是同一時間點同時調查暴露與疾病狀態，此研究利用病歷回溯，不符合橫斷式定義。","臨床試驗（clinical trial）需研究者主動介入並隨機分配介入措施，此研究僅回溯觀察，無主動介入。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_022","year":2020,"roc_year":109,"session":"2","examNo":22,"q":"依據飲用水水質標準規定,容易引發癌症之消毒副產物總三鹵甲烷(totaltrihalomethancs)最大限值為多少毫\r 克/公升?","opts":["A. 0.02","B. 0.04","C. 0.06","D. 0.08"],"ans":3,"exp":"依台灣飲用水水質標準，總三鹵甲烷（total trihalomethanes, TTHMs）是飲用水消毒（如加氯）產生的副產物，具致癌性，最大容許濃度為 0.08 mg/L（毫克/公升）。","we":["0.02 mg/L 過低，非台灣現行飲用水標準的總三鹵甲烷最大限值。","0.04 mg/L 亦非現行標準值。","0.06 mg/L 亦非現行標準值。","（正確）依台灣飲用水水質標準，總三鹵甲烷最大限值為 0.08 mg/L。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_023","year":2020,"roc_year":109,"session":"2","examNo":23,"q":"依據食品安全衛生管理法規定,有害人體健康的物質,包括雖非疫區而近10年內有下列何種病例的國家或地\r 區牛隻頭骨、腦、眼睛、脊髄、絞肉、内臟及其他相關產製品不得輸入?","opts":["A. 流行性感冒","B. 牛傳染性鼻氣管炎","C. 牛傳染性胸膜肺炎","D. 新型庫賈氏症"],"ans":3,"exp":"依食品安全衛生管理法規定，對於「近10年內有新型庫賈氏症（vCJD）病例」的國家或地區，其牛頭骨、腦、眼睛、脊髓、絞肉、內臟等高風險部位及相關產製品不得輸入台灣，以防止 BSE（牛海綿狀腦病）相關危害。","we":["流行性感冒（AI）雖可跨物種傳播，但食品安全管理法針對牛產品進口限制的疾病是新型庫賈氏症，非流感。","牛傳染性鼻氣管炎（IBR）是牛隻病毒性疾病，不是限制進口牛隻頭骨腦脊髓的依據。","牛傳染性胸膜肺炎（CBPP）是牛隻細菌性疾病，非食品安全法規限制輸入的依據。","（正確）新型庫賈氏症（variant Creutzfeldt-Jakob disease, vCJD）與 BSE 密切相關，食品安全法明定近10年內有 vCJD 病例國家之牛隻高風險部位不得進口。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_024","year":2020,"roc_year":109,"session":"2","examNo":24,"q":"化製原料運輸車有登記事項變更、停駛、報廢、吊銷、吊扣、註銷牌照或轉讓時,應於事實發生之日起幾日\r 内,向原查驗之動物防疫機關報備?","opts":["A. 3日","B. 5日","C. 7日","D. 10日"],"ans":3,"exp":"依據「化製廠設置管理辦法」相關規定，化製原料運輸車如有登記事項變更、停駛、報廢等情形，應於事實發生之日起10日內，向原查驗之動物防疫機關報備。","we":["3日過短，非法規規定的報備期限。","5日亦非法規規定期限。","7日亦非正確期限。","（正確）依規定應於事實發生之日起10日內報備。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_025","year":2020,"roc_year":109,"session":"2","examNo":25,"q":"屠宰場負責人應於何時將上月實際屠宰作業時間及下月預定屠宰作業時間,報中央主管機關?","opts":["A. 每月10日前","B. 每月7日前","C. 每月5日前","D. 每月3日前"],"ans":0,"exp":"依屠宰場管理相關規定，屠宰場負責人應於每月10日前，將上月實際屠宰作業時間及下月預定屠宰作業時間，報中央主管機關（行政院農業委員會動植物防疫檢疫局）。","we":["（正確）屠宰場負責人應於每月10日前完成報告，此為正確規定。","每月7日前不是正確的法規規定。","每月5日前不是正確的法規規定。","每月3日前不是正確的法規規定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_026","year":2020,"roc_year":109,"session":"2","examNo":26,"q":"臺灣現行屠宰場内畜禽屠宰及分切之衛生查核,由下列何機關負責?","opts":["A. 農業主管機關","B. 衛生主管機關","C. 工業主管機關","D. 經濟主管機關"],"ans":0,"exp":"依畜牧法及相關規定，台灣現行屠宰場內畜禽屠宰及分切之衛生查核，由農業主管機關（農委會動植物防疫檢疫局及各縣市動物防疫機關）負責，於2021年農業部成立前由農委會體系主管。","we":["（正確）屠宰場衛生查核由農業主管機關（原農委會動植物防疫檢疫局）負責，非衛生主管機關。","衛生主管機關（衛生福利部）主管食品流通販售後的衛生安全，屠宰場的檢查不在其職權範圍。","工業主管機關不負責畜禽屠宰衛生查核。","經濟主管機關不負責畜禽屠宰衛生查核。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_027","year":2020,"roc_year":109,"session":"2","examNo":27,"q":"屠宰場停業多久以上者,視為歇業,應將屠宰場登記證書繳銷?","opts":["A. 滿1年以上者","B. 滿半年以上者","C. 滿3個月以上者","D. 滿1個月以上者"],"ans":0,"exp":"依屠宰場管理相關法規，屠宰場停業若滿1年以上，視為歇業，應將屠宰場登記證書繳銷，辦理歇業手續。","we":["（正確）停業滿1年以上視為歇業，應繳銷登記證書，此為正確規定。","停業滿半年以上尚未達到視為歇業的期限。","停業滿3個月尚未達到視為歇業的法定期限。","停業滿1個月尚未達到視為歇業的法定期限。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_028","year":2020,"roc_year":109,"session":"2","examNo":28,"q":"依據犬貓之輸入檢疫條件,犬貓需於輸入臺灣30日前至1年之期間内,完成狂犬病疫苗之預防注射,不可使用 下列何種疫苗?","opts":["A. 死毒疫苗","B. 基因重組蛋白疫苗","C. 次單位疫苗","D. 活毒疫苗"],"ans":3,"exp":"依台灣犬貓輸入檢疫條件，進口犬貓不得使用活毒疫苗（modified live virus vaccine）施打狂犬病疫苗，因為活毒疫苗有散毒風險；應使用死毒疫苗、基因重組蛋白疫苗或次單位疫苗等非活性疫苗。","we":["死毒疫苗（inactivated vaccine）是允許使用的，符合進口檢疫要求。","基因重組蛋白疫苗是允許使用的，符合進口檢疫要求。","次單位疫苗是允許使用的，符合進口檢疫要求。","（正確）活毒疫苗（modified live vaccine）不可使用，因有散毒風險，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_029","year":2020,"roc_year":109,"session":"2","examNo":29,"q":"依據行政院農業委員會公告之「獎勵民眾檢舉死廢畜禽非法流用案件實施要點」規定,獎金由下列何單位編\r 列支應?","opts":["A. 行政院農業委員會","B. 衛生福利部","C. 財團法人中央畜產會","D. 各縣市政府"],"ans":0,"exp":"依農委會公告的「獎勵民眾檢舉死廢畜禽非法流用案件實施要點」，獎勵金由行政院農業委員會編列支應，非由地方政府或其他單位負擔。","we":["（正確）獎金由行政院農業委員會編列，為正確答案。","衛生福利部並非此獎勵辦法的主管機關，獎金非由其支應。","財團法人中央畜產會為半官方組織，但本獎勵辦法的獎金由農委會編列，非由畜產會支應。","各縣市政府非此獎勵金的支應單位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_030","year":2020,"roc_year":109,"session":"2","examNo":30,"q":"依屠宰作業準則規定,應由下列何單位實施微生物污染之抽驗,以確保其所生產之屠體及內臟適合供人食\r 用?","opts":["A. 行政院衛生福利部","B. 行政院農業委員曾動植物防疫檢疫局","C. 縣市政府","D. 屠宰場"],"ans":3,"exp":"依屠宰作業準則規定，屠宰場本身（屠宰業者）有責任實施微生物污染之抽驗，以確保所生產之屠體及內臟適合供人食用；政府機關進行的是監督查核，而非屠宰場自主抽驗的執行者。","we":["衛生福利部主管食品衛生安全政策，但屠宰場內的微生物自主抽驗應由屠宰場自行執行。","農委會動植物防疫檢疫局負責監督管理，但屠宰作業準則規定的微生物抽驗責任在屠宰場本身。","縣市政府負責稽查，但非依屠宰作業準則執行自主抽驗的責任單位。","（正確）依屠宰作業準則，屠宰場本身應執行微生物污染之自主抽驗，以確保屠體及內臟的衛生安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_031","year":2020,"roc_year":109,"session":"2","examNo":31,"q":"依據屠宰作業準則,屠宰場所內之消毒作業得使用消毒劑或攝氏多少度以上之熱水?","opts":["A. 83","B. 85","C. 90","D. 100"],"ans":0,"exp":"依屠宰作業準則規定，屠宰場所內之消毒作業，熱水消毒的溫度需達攝氏82°C（或83°C）以上。此溫度足以殺滅一般病原微生物，確保器具衛生。","we":["（正確）依屠宰作業準則，消毒用熱水應達攝氏82～83度以上，選項A（83度）為正確答案。","85度雖然也達到殺菌效果，但法規規定的最低標準為83度，非85度。","90度非法規規定的標準溫度。","100度（沸水）雖可殺菌，但法規規定的下限為83度，非100度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_032","year":2020,"roc_year":109,"session":"2","examNo":32,"q":"下列何種病原菌較容易在乳房内下行由乳液排出?","opts":["A. 放線桿菌","B. 黴漿菌","C. 嗜血桿菌","D. 布氏桿菌"],"ans":3,"exp":"布氏桿菌（Brucella spp.）是人畜共通傳染病的重要病原，可在乳房實質組織內繁殖，並透過「下行感染」方式由乳汁排出，污染生乳。其他選項所列菌種主要透過不同途徑感染，較少以此方式排於乳汁中。","we":["放線桿菌（Actinobacillus）主要引起呼吸道或傷口感染，較少由乳汁排出。","黴漿菌（Mycoplasma）可感染乳房（黴漿菌性乳腺炎），但其主要特性是直接在乳腺繁殖，而非以「下行感染」形容。","嗜血桿菌（Haemophilus）主要為呼吸道病原，不以乳汁排菌著稱。","（正確）布氏桿菌可在乳腺及淋巴結中生存，並以下行方式持續由乳汁排出，是公共衛生上最重要的乳汁傳播人畜共通傳染病之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_033","year":2020,"roc_year":109,"session":"2","examNo":33,"q":"依據優良農產品蛋品項目驗證基準,生鮮蛋品與液蛋中之沙氏桿菌檢驗標準分別為何?","opts":["A. 5 MPN/g以下;陰性","B. 2 MPN/g以下;陰性","C. 皆為2 MPN/g以下","D. 皆需為陰性"],"ans":1,"exp":"依優良農產品（CAS/TAP）蛋品驗證基準，生鮮蛋品（帶殼蛋）中沙氏桿菌（Salmonella）的標準為 2 MPN/g 以下；液蛋（processed egg）中沙氏桿菌則必須陰性（不得檢出），因液蛋污染風險較高。","we":["生鮮蛋品標準為5 MPN/g以下並不正確，標準應為2 MPN/g以下。","（正確）生鮮蛋品 ≤ 2 MPN/g；液蛋陰性，符合現行驗證標準。","皆為2 MPN/g以下的說法不正確，液蛋需達到陰性（更嚴格）。","皆需為陰性的說法過於嚴格，生鮮蛋品允許 ≤ 2 MPN/g，非陰性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_034","year":2020,"roc_year":109,"session":"2","examNo":34,"q":"依據優良農產品驗證管理辦法,生食用魚介類水產品之大腸桿菌含量基準為何?","opts":["A. 50 MPN/g以下","B. 10 MPN/g以下","C. 5 MPN/g以下","D. 不得檢出"],"ans":2,"exp":"依優良農產品驗證管理辦法，生食用魚介類水產品的大腸桿菌含量基準為 5 MPN/g 以下，以保障生食安全。","we":["50 MPN/g以下的標準過於寬鬆，不符合生食用產品的要求。","10 MPN/g以下非現行驗證基準的正確數值。","（正確）生食用魚介類水產品之大腸桿菌基準為 5 MPN/g 以下，符合現行規定。","「不得檢出」過於嚴格，現行生食用魚介類的標準為 5 MPN/g 以下，並非要求完全陰性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_035","year":2020,"roc_year":109,"session":"2","examNo":35,"q":"食用牛肉湯罐頭引起肉毒桿菌毒素中毒的預防,下列敘述何者錯誤?","opts":["A. 不食用家庭式加工產品","B. 抽真空","C. 發現膨罐情形不要食用","D. 食用前再加熱至100C超過10分鐘"],"ans":1,"exp":"肉毒桿菌毒素為蛋白質毒素，加熱至100°C 超過10分鐘即可破壞其毒性，因此「食用前加熱至100°C超過10分鐘」是有效的預防措施而非錯誤。而「抽真空」對肉毒桿菌反而有害，因為其為厭氧菌，抽真空的無氧環境反而有利於其產毒，故抽真空不能預防肉毒桿菌毒素，選項B有誤。","we":["不食用家庭式加工產品（如自製罐頭、醃製品）是有效預防措施，因為家庭製作往往無法達到商業滅菌標準，此建議正確。","（正確錯誤）抽真空會製造無氧環境，有利於厭氧的肉毒桿菌生長及產毒，故「抽真空」是錯誤的預防概念，為本題答案。","發現膨罐代表罐內有氣體產生（可能為肉毒桿菌產氣），此時不食用是正確的預防建議。","食用前加熱至100°C超過10分鐘可破壞肉毒桿菌毒素，是有效預防措施（注意：此方法無法破壞芽孢）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_036","year":2020,"roc_year":109,"session":"2","examNo":36,"q":"下列何者不是肉製品中添加亞硝酸鹽之功能?","opts":["A. 增加抗氧化力","B. 保持肉色鮮紅","C. 增加營養成分","D. 抑制肉毒桿菌"],"ans":2,"exp":"亞硝酸鹽添加於肉製品中的功能包括：保持肉色（形成亞硝基肌紅蛋白，呈鮮紅色）、抑制肉毒桿菌（Cl. botulinum）生長及毒素產生、增加抗氧化力（防止脂質氧化）。亞硝酸鹽並無增加肉品本身營養成分的功效。","we":["亞硝酸鹽具有抗氧化作用，能防止肉品脂質氧化，此為其確實功能，非錯誤選項。","亞硝酸鹽與肌紅蛋白結合形成亞硝基肌紅蛋白，使肉品保持鮮紅色澤，此為其確實功能。","（正確）亞硝酸鹽不能增加肉品的營養成分（如蛋白質、維生素），此選項描述非亞硝酸鹽的功能，為正確答案。","亞硝酸鹽能有效抑制厭氧菌肉毒桿菌（Clostridium botulinum）在低pH環境下的生長，防止產毒，此為其確實功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_038","year":2020,"roc_year":109,"session":"2","examNo":38,"q":"下列何種致病菌會因食物中已含有其毒素,而導致攝入後引起食物中毒?","opts":["A. 沙氏桿菌","B. 彎曲桿菌","C. 大腸桿菌","D. 金黄色葡萄球菌"],"ans":3,"exp":"金黃色葡萄球菌（Staphylococcus aureus）產生的腸毒素（enterotoxin）具有耐熱性，即使食物加熱殺菌後毒素仍可存留；人食入已含有毒素的食物即可引起食物中毒（毒素型中毒），無需細菌活菌存在。","we":["沙氏桿菌（Salmonella）引起的是感染型食物中毒，需要攝入活菌才會發病，而非毒素型。","彎曲桿菌（Campylobacter）引起感染型食物中毒，需要攝入活菌，不以食物中預存毒素致病。","大腸桿菌（E. coli）部分菌株雖可產生毒素，但仍屬感染型為主，且毒素不像葡萄球菌腸毒素般耐熱。","（正確）金黃色葡萄球菌腸毒素為耐熱蛋白毒素，食物中已預存的毒素直接引起中毒，為典型的毒素型食物中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_039","year":2020,"roc_year":109,"session":"2","examNo":39,"q":"燒烤雞腿容易產生下類何種致癌物質?","opts":["A. 亞硫酸鹽","B. 多環芳香族碳氫化合物","C. 乙醛","D. 多氯聯苯"],"ans":1,"exp":"燒烤（高溫烘烤）肉類時，脂肪及蛋白質在高溫下不完全燃燒，會產生多環芳香族碳氫化合物（polycyclic aromatic hydrocarbons, PAHs），如苯并芘（benzo[a]pyrene），是已知的強致癌物質。","we":["亞硫酸鹽是食品添加物，主要用於防腐或漂白，並非燒烤過程中產生的致癌物。","（正確）燒烤過程中，脂肪不完全燃燒會產生多環芳香族碳氫化合物（PAHs），是最主要的燒烤致癌物質。","乙醛是酒精代謝產物，在燒烤過程中並非主要產生的致癌物。","多氯聯苯（PCBs）是環境污染物，非燒烤過程自然產生的物質。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_040","year":2020,"roc_year":109,"session":"2","examNo":40,"q":"依據「食品含戴奧辛及戴奧辛類多氯聯苯處理規範」，針對禽肉及其製品每公克之脂肪中，戴奧辛及戴奥辛類多氯聯苯兩者含量總和之限值為多少pg?","opts":["A. 3.0","B. 0","C. 1.75","D. 1.25"],"ans":0,"exp":"依台灣「食品含戴奧辛及戴奧辛類多氯聯苯處理規範」，禽肉及其製品每公克脂肪中，戴奧辛及戴奧辛類多氯聯苯兩者含量總和（以毒性當量 TEQ 計）之限值為 3.0 pg（皮克）TEQ/g 脂肪。","we":["（正確）禽肉及其製品中戴奧辛及戴奧辛類多氯聯苯總和限值為 3.0 pg TEQ/g 脂肪，為正確答案。","0 pg 表示不得檢出，實際上有容許量設定，此選項不正確。","1.75 pg 非禽肉的正確限值。","1.25 pg 亦非禽肉的正確限值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_041","year":2020,"roc_year":109,"session":"2","examNo":41,"q":"下列何種檢驗可以表現出定量牛乳中之雜質含量?","opts":["A. 酒精試驗","B. 沉澱試驗","C. 酸度滴定","D. 色素還原試驗"],"ans":1,"exp":"沉澱試驗（sedimentation test）是利用靜置使牛乳中的雜質（如泥土、灰塵、糞便顆粒等固體異物）沉降，再觀察沉澱物的量，以定量評估牛乳的清潔程度（雜質含量）。","we":["酒精試驗（alcohol test）用於測試牛乳的熱穩定性（是否有乳蛋白變性或酸度偏高），並非定量雜質。","（正確）沉澱試驗（sedimentation test）可定量牛乳中的固體雜質含量，如泥土、糞便、飼料等，用於評估擠乳衛生狀況。","酸度滴定用於測定牛乳的酸度（乳酸含量），反映微生物活動程度，並非雜質定量。","色素還原試驗（如亞甲藍試驗）用於估計牛乳中的細菌數量（微生物負荷），並非雜質含量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_042","year":2020,"roc_year":109,"session":"2","examNo":42,"q":"下列有關牛乳巴斯德殺菌、滅菌處理法的條件,何者錯誤?","opts":["A. 超高溫巴斯德滅菌法:150℃,0.75〜2.4秒","B. 高溫短時間法:70〜75℃,3分鐘","C. 超高溫短時間法:130〜150℃,1〜20秒","D. 瞬間法:＞80℃,1〜3秒"],"ans":1,"exp":"牛乳巴斯德殺菌法標準：低溫長時間法（LTLT）63°C、30分鐘；高溫短時間法（HTST）72°C、15秒；超高溫瞬間法（UHT）130–150°C、1–20秒。選項B「高溫短時間法：70～75°C，3分鐘」的條件錯誤，正確條件應為72°C、15秒。","we":["超高溫巴斯德滅菌法（UHT）的條件約為130–150°C、1–20秒，選項A描述150°C、0.75–2.4秒雖略有差異，基本合理範圍。","（正確）「高溫短時間法：70～75°C，3分鐘」敘述錯誤，HTST正確條件為72°C、15秒，故此選項錯誤，為本題答案。","超高溫短時間法（UHT）130–150°C、1–20秒的描述與選項C基本符合，此選項正確。","瞬間法（flash pasteurization）>80°C、1–3秒為某些文獻記載的快速殺菌法，此選項大致正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_043","year":2020,"roc_year":109,"session":"2","examNo":43,"q":"下列有關一次污染性病原藉由乳品傳染給人類的敘述,何者正確?","opts":["A. 乳牛罹患傳染病,其病原随乳汁而排出","B. 搾乳時或后之處理過程中所受微生物之污染","C. 為人本身罹患某些傳染病而將病原污染於乳或乳製品中","D. 環境污染乳品"],"ans":0,"exp":"一次污染性病原（primary contamination）是指乳牛本身罹患傳染病，病原直接隨乳汁排出，污染生乳。例如結核病牛的乳汁含結核菌、布氏桿菌病牛的乳汁含布氏桿菌。","we":["（正確）乳牛罹患傳染病，其病原隨乳汁排出，屬於一次污染性病原（乳腺本身感染所致），為正確答案。","擠乳過程中受環境微生物污染屬於「二次污染」（secondary contamination）。","人類本身罹患傳染病而污染乳品屬於處理過程的人員污染，不屬於一次污染性病原。","環境污染乳品屬於二次或三次污染，非一次污染性病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_044","year":2020,"roc_year":109,"session":"2","examNo":44,"q":"複選題 44.在正常衛生搾乳情況下,每毫升生乳正常生菌數約為多少個?","opts":["A. 49以下","B. 50~1,000","C. 1,001~5,000","D. 5,001~20,000"],"ans":2,"exp":"在正常衛生搾乳情況下，每毫升生乳中正常生菌數約為1,001–5,000個CFU/mL。搾乳衛生條件良好時，細菌數量較少但並非完全無菌，正常範圍在數千CFU/mL。","we":["49以下過低，不符合正常乳房環境的生菌數範圍。","50–1,000 CFU/mL 可能是極度清潔條件下的偶見值，一般正常生乳稍高。","（正確）在正常衛生搾乳條件下，每毫升生乳正常生菌數約為1,001–5,000個，此為業界普遍接受的範圍。","5,001–20,000 CFU/mL 偏高，通常表示衛生條件較差。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_045","year":2020,"roc_year":109,"session":"2","examNo":45,"q":"發現乳品遭受抗生素污染時,應採取下列那種措施?","opts":["A. 經加熱處理後仍可食用","B. 過濾後仍可食用","C. 將過去一週內搾得的乳汁全數廢棄","D. 若為低濃度仍可食用"],"ans":2,"exp":"乳品遭受抗生素污染時，加熱或過濾均無法去除抗生素（抗生素為化學物質，加熱反而可能使部分抗生素殘留轉化但不能完全去除；過濾無法去除溶解的化學物質）。低濃度同樣有殘留危害，且會影響乳品加工（如優酪乳無法發酵）。正確做法是將污染期間（通常至最後一次給藥後休藥期結束為止）的乳汁全數廢棄。","we":["加熱無法去除抗生素，處理後仍不可食用，此選項錯誤。","過濾無法去除溶於乳汁中的抗生素，此選項錯誤。","（正確）應將受污染期間的乳汁（依藥物休藥期）全數廢棄，而不只是一週，此選項「過去一週」未必足夠，但題目選項中此為最接近正確概念的選項。","低濃度抗生素仍有危害（如引起過敏反應、干擾乳品加工、誘導抗藥性），不可食用，此選項錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_046","year":2020,"roc_year":109,"session":"2","examNo":46,"q":"下列何種乳汁成分經由大腸桿菌群分解後可形成凝固乳?","opts":["A. 乳糖","B. 脂肪類","C. 酪蛋白","D. 維生素"],"ans":0,"exp":"牛乳中的乳糖（lactose）被大腸桿菌群（coliforms）分解後，產生乳酸及其他有機酸，使牛乳酸度升高，導致酪蛋白凝固，形成「凝固乳」（curdled milk）。","we":["（正確）乳糖經大腸桿菌群發酵產酸，造成牛乳酸化凝固，為正確答案。","脂肪類由脂解酶（lipase）分解，主要造成油脂水解產生異味，不導致乳液凝固。","酪蛋白（casein）本身是被酸化後凝固的對象，而非被分解後「形成凝固乳」的來源。","維生素被分解不會導致牛乳凝固。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_047","year":2020,"roc_year":109,"session":"2","examNo":47,"q":"CAS蛋品項目驗證基準中,液蛋産品需於多少温度下冷藏運輸?","opts":["A. 25℃","B. 18℃","C. 12℃","D. 7℃"],"ans":3,"exp":"依CAS（台灣優良農產品）蛋品項目驗證基準，液蛋產品（如全蛋液、蛋白液、蛋黃液）在運輸過程中必須於7°C以下冷藏運輸，以抑制微生物生長，確保安全性。","we":["25°C為室溫，無法抑制液蛋中病原菌（如沙氏桿菌）的生長，不符合冷藏運輸要求。","18°C仍偏高，無法達到安全冷藏運輸標準。","12°C雖低於室溫，但仍高於食品安全建議的冷藏溫度7°C。","（正確）液蛋產品應於7°C以下冷藏運輸，符合CAS驗證基準要求，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_048","year":2020,"roc_year":109,"session":"2","examNo":48,"q":"下列經由乳或乳製品傳給人的疾病中,何者屬於一次污染性病原?","opts":["A. 志賀氏菌","B. 白喉桿菌","C. 李斯特菌","D. A型肝炎病毒"],"ans":2,"exp":"一次污染性病原（primary contamination pathogens）是指存在於動物乳腺或血液中，可直接由感染動物的乳汁排出的病原，如結核菌（Mycobacterium bovis）、布氏桿菌（Brucella spp.）、李斯特菌（Listeria monocytogenes）等。李斯特菌可在乳腺內繁殖並隨乳汁排出，屬一次污染性病原。","we":["志賀氏菌（Shigella）主要來自人類糞便污染（人員處理不當），屬二次污染性病原，而非源自乳牛本身。","白喉桿菌（Corynebacterium diphtheriae）是人類病原，通過感染人員的污染進入乳品，屬二次污染。","（正確）李斯特菌（Listeria monocytogenes）可直接存在於乳牛的乳腺或血液，隨乳汁排出，屬一次污染性病原。","A型肝炎病毒（HAV）主要來自人類糞口污染（感染員工的糞便污染食物），屬二次污染，而非來自乳牛本身。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_049","year":2020,"roc_year":109,"session":"2","examNo":49,"q":"下列有關屠宰場屠後檢査之設施,何者錯誤?","opts":["A. 屠後檢查站之長度以每名檢查員為150公分以上","B. 屠體與内臟之表面照明光度應達至少500米燭光以上","C. 檢查站内應設150公分見方不失真鏡子以供屠體背側檢查","D. 屠體與內臓之電動吊掛輸送不可同步運行以防交叉污染"],"ans":3,"exp":"屠後檢查站中，屠體與內臟的電動吊掛輸送帶必須「同步運行」，以確保每頭動物的屠體與其對應內臟能同時通過檢查員視野，便於比對判斷；若不同步，無法確認內臟歸屬，反而容易造成混淆。選項D說「不可同步」為錯誤敘述。","we":["屠後檢查站長度每名檢查員須達150公分以上，以確保檢查員有足夠空間操作，此規定正確。","屠體與內臟表面照明應達至少500米燭光（lux）以上，確保光線足夠清楚看出病變，此規定正確。","設置不失真鏡子（150公分見方）供背側檢查，讓檢查員可觀察屠體背面，此設施正確。","（正確）電動吊掛輸送帶「應同步運行」，確保屠體與對應內臟同時到達，便於配對檢查，選項D說「不可同步」為錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_050","year":2020,"roc_year":109,"session":"2","examNo":50,"q":"動物死後,其體內的蛋白分解酵素可自行分解一些蛋白質,於烹調時會有特殊風味,此肉質改變過程稱為下\r 列何者?","opts":["A. 肉的發酵","B. 肉的熟成","C. 肉的僵直","D. 肉的酸敗"],"ans":1,"exp":"動物死後，肌肉中的內源性蛋白酶（如鈣蛋白酶、組織蛋白酶等）會緩慢分解肌肉蛋白，使結締組織軟化，此過程稱為「肉的熟成（aging/ripening）」，可提升肉品嫩度並增添特殊風味。","we":["肉的發酵通常指外加微生物（如乳酸菌）使肉品產生乳酸等代謝物，非自身酵素作用的熟成過程。","（正確）肉的熟成（aging）是指動物死後內源性蛋白酶自行分解蛋白質，使肉質軟化並產生特殊風味，與題目描述完全相符。","肉的僵直（rigor mortis）是死後ATP耗盡使肌動蛋白與肌凝蛋白結合，肉質變硬的過程，非分解過程。","肉的酸敗（rancidity）是指脂肪氧化或水解產生異味的變質過程，與題意不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_051","year":2020,"roc_year":109,"session":"2","examNo":51,"q":"國內豬隻屠宰前的致昏,常使用下列何種方式?","opts":["A. 二氧化碳法","B. 電擊法","C. 槍撃法","D. 化學藥品法"],"ans":1,"exp":"台灣國內豬隻屠宰前，最常使用的致昏方式是電擊法（electrical stunning），此方法操作簡便、成本低、效果快速，且不影響肉品品質，為現行最普遍採用的方式。","we":["二氧化碳法（CO2 stunning）在部分國家採用，但台灣國內主流仍以電擊法為主。","（正確）電擊法為台灣國內最常用的豬隻屠宰前致昏方式，效率高、成本低廉。","槍擊法常用於牛隻（penetrating captive bolt），較少用於豬隻屠宰。","化學藥品法（如氯仿）成本高、有藥物殘留問題，實際作業中不採用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_052","year":2020,"roc_year":109,"session":"2","examNo":52,"q":"牛羊豬可食性內臟依「食品中污染物質及毒素衛生標準」,其重金屬最高殘留容許濃度何者正確?","opts":["A. 鉛0.5 ppm","B. 汞0.02 ppm","C. 銅0.5 ppm","D. 鎘0.01 ppm"],"ans":0,"exp":"依「食品中污染物質及毒素衛生標準」，牛羊豬可食性內臟中重金屬的最高殘留容許濃度：鉛（Pb）≤ 0.5 ppm（肌肉0.1 ppm，內臟0.5 ppm）；汞（Hg）≤ 0.05 ppm；銅（Cu）無特定限值或限值較高；鎘（Cd）≤ 1 ppm（部分內臟）。選項A鉛0.5 ppm 符合內臟的規定。","we":["（正確）鉛0.5 ppm 符合可食性內臟的最高殘留容許濃度規定，為正確答案。","汞的限值為0.05 ppm（非0.02 ppm），此選項數值不正確。","銅無特定一般限值，或限值高於0.5 ppm，此選項不準確。","鎘的限值為0.5–1.0 ppm（依部位），並非0.01 ppm，此選項數值不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_053","year":2020,"roc_year":109,"session":"2","examNo":53,"q":"培養空腸彎曲桿菌(Campylobacterjejui)以下列那一種攝氏溫度最為合適?","opts":["A. 25度","B. 34度","C. 37度","D. 42度"],"ans":3,"exp":"空腸彎曲桿菌（Campylobacter jejuni）是嗜熱性（thermophilic）細菌，最適培養溫度為42°C，此溫度也接近禽類的正常體溫，有利於其在禽類腸道中定殖。在37°C也可生長，但最適溫度為42°C。","we":["25°C過低，不適合空腸彎曲桿菌生長（此溫度下生長緩慢或幾乎不生長）。","34°C尚未達到最適溫度，生長不理想。","37°C可以生長但非最適溫度，最適溫度為42°C。","（正確）42°C是空腸彎曲桿菌的最適生長溫度，為嗜熱性細菌，符合其在禽類腸道的自然生態。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_054","year":2020,"roc_year":109,"session":"2","examNo":54,"q":"下列何者為蛋品判定新鮮度的方法?","opts":["A. 外觀顏色判定","B. 敲打蛋殻判定","C. 照光法","D. 以重量大小判定"],"ans":2,"exp":"照光法（candling/transillumination）是將蛋對著強光源照射，可透過蛋殼觀察蛋黃大小與位置、氣室大小、血斑或肉斑存在等，用以判定蛋品新鮮度及品質的標準方法。","we":["外觀顏色判定蛋殼顏色，與新鮮度關係不大（蛋殼顏色為品種特性），不是標準新鮮度判定方法。","敲打蛋殼判定聲音，可判斷蛋殼是否完整，但非新鮮度的標準判定方法。","（正確）照光法（candling）透過光線觀察蛋內部結構（氣室大小、蛋黃位置等），是判定蛋品新鮮度的標準方法。","以重量判定可知蛋的大小等級，但非判斷新鮮度的方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_055","year":2020,"roc_year":109,"session":"2","examNo":55,"q":"非人類之靈長類最有可能成為下列何種傳染病原之自然保毒宿主①疱疹B病毒②漢他出血熱③裂谷熱\r ④伊波拉病毒出血熱","opts":["A. ①②","B. ①④","C. ③④","D. ②③"],"ans":1,"exp":"疱疹B病毒（Herpes B virus/Macacine herpesvirus 1）的自然保毒宿主是非人類靈長類（尤其是獼猴屬，Macaca spp.）；伊波拉病毒（Ebola virus）的自然宿主目前確認為果蝠（Pteropus 等），但非人靈長類在疫情中常作為橋接宿主，並非最終自然保毒宿主。漢他出血熱（Hantavirus）的宿主為囓齒類；裂谷熱（Rift Valley fever）的宿主為牛羊等反芻動物及蚊。","we":["①疱疹B病毒以獼猴等非人靈長類為自然保毒宿主（正確）；②漢他出血熱宿主為囓齒類（非靈長類），故①②組合不完全正確。","（正確）①疱疹B病毒的自然宿主為非人靈長類（正確）；④伊波拉病毒雖自然宿主主要為蝙蝠，但非人靈長類確實可作為宿主或中間放大宿主，①④組合為最接近正確的答案。","③裂谷熱宿主為反芻類（牛羊），非靈長類；④伊波拉病毒靈長類雖為重要宿主，但③④組合中③錯誤。","②漢他出血熱宿主為囓齒類；③裂谷熱宿主為反芻類，故②③組合均非靈長類，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_056","year":2020,"roc_year":109,"session":"2","examNo":56,"q":"下列何種疾病可藉由節肢動物叮咬而傳播?①漢他出血熱②裂谷熱③屈公病④猴痘","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"裂谷熱（Rift Valley fever）由埃及斑蚊等蚊子傳播（節肢動物媒介）；屈公病（Chikungunya）由斑蚊傳播。漢他出血熱（Hantavirus）主要透過吸入受感染囓齒動物排泄物的氣霧感染，並非節肢動物叮咬；猴痘（Monkeypox）主要透過直接接觸、呼吸道飛沫或動物咬傷傳播，並非節肢動物叮咬。","we":["①漢他出血熱主要由囓齒類排泄物氣霧傳播，非節肢動物叮咬；②裂谷熱可由蚊叮咬傳播，①②組合中①不符。","（正確）②裂谷熱（蚊子傳播）和③屈公病（斑蚊傳播）均可藉由節肢動物叮咬傳播，②③組合正確。","③屈公病（蚊子傳播）正確；④猴痘主要直接接觸或飛沫傳播，非節肢動物叮咬為主，③④組合中④不符。","①漢他出血熱非節肢動物傳播；④猴痘非主要節肢動物傳播，①④均不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_057","year":2020,"roc_year":109,"session":"2","examNo":57,"q":"下列有關羊接觸傳染性化膿性口炎(ORF)的敘述,何者錯誤?","opts":["A. 需與山羊痘、綿羊痘、藍舌病區別診斷","B. ORF病毒對自然環境抵抗性強","C. 發生率低,但死亡率高之傳染病","D. 最好的預防方法為疫苗接種"],"ans":2,"exp":"羊接觸傳染性化膿性口炎（ORF，口瘡病，由副痘病毒引起）特點：ORF病毒對環境抵抗力強（可在乾燥環境中存活多年）；需與山羊痘、藍舌病等區別診斷；預防以疫苗接種為主。其「發生率」實際上不低，在羔羊中相當常見，死亡率通常不高（成年羊更低），故選項C「發生率低，但死亡率高」描述錯誤。","we":["ORF需與山羊痘、綿羊痘、藍舌病等進行區別診斷（鑑別診斷），此敘述正確。","ORF病毒（副痘病毒屬）在自然環境中抵抗性確實很強，能在乾燥條件下長期存活，此敘述正確。","（正確）ORF（口瘡病）在幼年羊群中發生率實際上並不低，且死亡率通常低（除非繼發細菌感染）；「發生率低但死亡率高」描述錯誤，為本題答案。","疫苗接種是最有效的預防方式（使用減毒活毒疫苗），此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_058","year":2020,"roc_year":109,"session":"2","examNo":58,"q":"關於口蹄疫之敘迹,下列何者正確?①感染偶蹄動物,例如:牛,羊,豬②此病毒為單一血清型③為傳染力低的病原④人類對此病毒感受性不高,但扮演此病毒攜帶者之角色","opts":["A. ①②","B. ①④","C. ②③","D. ③④"],"ans":1,"exp":"口蹄疫（FMD）特性：①感染偶蹄動物（牛、羊、豬等）為正確描述；④人類對口蹄疫病毒感受性極低，偶有感染但不具重要流行病學意義，並非「攜帶者」角色。口蹄疫病毒有7種血清型（O、A、C、SAT1、SAT2、SAT3、Asia 1），非單一血清型；傳染力極高。故①④組合中①正確，④也正確（人類感受性低，非主要傳播者），①④為正確組合。","we":["①感染偶蹄動物（正確）；②單一血清型（錯誤，共7種血清型），故①②組合中②錯誤。","（正確）①口蹄疫確實感染偶蹄動物；④人類對此病毒感受性不高（正確），且在自然感染中人類並非重要的病毒攜帶傳播者，①④組合為正確敘述。","②單一血清型（錯誤）；③傳染力低（錯誤，口蹄疫傳染力極強），②③均錯誤。","③傳染力低（錯誤）；④人感受性低（正確），但③錯誤使整個組合不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_059","year":2020,"roc_year":109,"session":"2","examNo":59,"q":"下列有關狂犬病的敘述,何者錯誤?","opts":["A. 臨床表現大致分為狂躁型及沉鬱型","B. 咬傷部位越靠近中樞神經系統發病越快","C. 動物感染後3〜5天才會排毒,具有傳染力","D. 當神經症狀出現後幾乎必然死亡"],"ans":2,"exp":"動物感染狂犬病後，在出現臨床症狀前3至5天（有些資料說前1至5天），病毒已可在唾液中排出（具傳染性）。選項C說「感染後3~5天才會排毒」的敘述不確切；更精確的說法是「症狀出現前約3~5天開始排毒」。此為錯誤敘述。","we":["狂犬病臨床表現確實分為狂躁型（興奮型）和沉鬱型（麻痺型），此敘述正確。","咬傷部位越靠近中樞神經系統（如臉部），病毒沿神經到達腦部的時間越短，發病越快，此敘述正確。","（正確）「感染後3~5天才會排毒」表述有誤；正確應為「出現症狀前約3~5天即開始排毒（具傳染性）」，而非從感染日起算，此選項說法易造成誤解，為錯誤敘述。","狂犬病一旦出現神經症狀後，幾乎無一例外地導致死亡，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_060","year":2020,"roc_year":109,"session":"2","examNo":60,"q":"下列何者為人感染狂犬病病毒的處理方法?①以干擾素以及核酸抑制劑(例如rbavirin)治療②施打不活化\r 狂犬病疫苗③給予抗生素④以免疫血清浸潤傷口以及施予肌肉注射","opts":["A. ①②","B. ②④","C. ①③","D. ③④"],"ans":1,"exp":"人感染狂犬病後的暴露後預防（PEP）包括：②接種不活化狂犬病疫苗（主動免疫）；④局部以狂犬病免疫血清（RIG，被動免疫）浸潤傷口，並肌肉注射狂犬病疫苗。干擾素和抗病毒藥物（ribavirin）對已發病的狂犬病無確效；抗生素對病毒無效。","we":["①干擾素及抗病毒藥物（ribavirin）對已感染狂犬病者效果未經證實，非標準處理方式；②疫苗正確，但①②組合中①有誤。","（正確）②不活化狂犬病疫苗（主動免疫）加上④狂犬病免疫血清浸潤傷口及肌肉注射（被動免疫），為標準暴露後預防處置，②④組合正確。","①干擾素/抗病毒劑效果未確認；③抗生素對病毒無效，①③均不是正確處理方法。","③抗生素對病毒無效；④免疫血清正確，但③④組合中③錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_061","year":2020,"roc_year":109,"session":"2","examNo":61,"q":"下列有關狂牛症的敘述,何者正確?①由RNA病毒的蛋白質所引起②神經組織可見明顯炎症反應③病原 也造成羊掻癢症(scrapie)、人新型庫賈氏症④首先發現於英國以及其鄰近的歐洲國家,北美洲和日本也 曾有疫情","opts":["A. ①③","B. ②④","C. ①②","D. ③④"],"ans":3,"exp":"狂牛症（BSE，牛海綿狀腦病）特點：由異常蛋白質（prion，普利昂，非RNA也非DNA，為變性蛋白質）引起，故「RNA病毒蛋白質」說法錯誤；組織病理上無炎症反應（prion病缺乏典型免疫反應，組織僅見空泡化）。正確敘述為：③prion同樣造成羊掻癢症和人新型庫賈氏症；④首見於英國，美國、日本亦有案例。故③④為正確組合。","we":["①BSE由prion（蛋白質）引起，非RNA病毒（錯誤）；③prion造成羊掻癢症（正確），①③組合中①錯誤。","②神經組織有明顯炎症反應（錯誤，prion病缺乏典型炎症）；④首見英國（正確），②④組合中②錯誤。","①RNA病毒蛋白質（錯誤）；②明顯炎症反應（錯誤），①②均錯誤。","（正確）③prion引起羊掻癢症（scrapie）和人新型庫賈氏症（vCJD）（正確）；④BSE首見英國及鄰近歐洲國家，北美、日本亦有（正確），③④組合正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_062","year":2020,"roc_year":109,"session":"2","examNo":62,"q":"下列有關鸚鵡病(psittacosis)的敘述,何者正確?","opts":["A. 是由一種絕對細胞內寄生菌引起","B. 不得使用四環素治療","C. 在鳥類只發生於鸚鵡","D. 被列為「動物傳染病分類表」中之乙類動物傳染病"],"ans":0,"exp":"鸚鵡病（psittacosis/ornithosis）的病原為鸚鵡熱披衣菌（Chlamydophila psittaci），是絕對細胞內寄生菌（obligate intracellular parasite）。治療首選為四環素類（doxycycline）。不僅鸚鵡，其他多種鳥類也可感染。依動物傳染病分類，鸚鵡病屬於甲類傳染病（需24小時通報）。","we":["（正確）鸚鵡病由鸚鵡熱披衣菌（Chlamydophila psittaci）引起，為絕對細胞內寄生菌，此敘述正確。","四環素（tetracycline）及多西環素（doxycycline）是治療鸚鵡病的首選抗生素，「不得使用四環素」的說法錯誤。","鸚鵡病可感染多種鳥類（如鸽子、鵝、家禽等），並非只發生於鸚鵡，此敘述錯誤。","依動物傳染病防治條例分類，鸚鵡熱屬於甲類（或一類）動物傳染病，非乙類，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_063","year":2020,"roc_year":109,"session":"2","examNo":63,"q":"人類Q熱的慢性感染,以下列何種病徵為主?","opts":["A. 肺炎","B. 腎炎","C. 心內膜炎","D. 腦炎"],"ans":2,"exp":"Q熱（Q fever）由伯內特立克次體（Coxiella burnetii）引起，急性感染主要表現為肺炎、肝炎、發熱。慢性Q熱（定義為感染持續超過6個月）最主要的表現是心內膜炎（endocarditis），尤其在有心臟瓣膜病史的患者中，致死率高。","we":["肺炎是Q熱急性感染的主要病徵，慢性感染（>6個月）則主要以心內膜炎為主。","腎炎雖偶見於Q熱，但並非慢性感染的主要病徵。","（正確）Q熱慢性感染以心內膜炎為最主要病徵，佔慢性Q熱病例的多數，死亡率可達5–37%（未治療），為正確答案。","腦炎在Q熱中少見，不是慢性感染的主要病徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_064","year":2020,"roc_year":109,"session":"2","examNo":64,"q":"下列何者為跳躍病(loupingill)之病原?","opts":["A. 病毒","B. 披衣菌","C. 原蟲","D. 細菌"],"ans":0,"exp":"跳躍病（louping ill）是一種蜱傳腦炎（tick-borne encephalitis），其病原為跳躍病病毒（louping ill virus），屬於黃病毒科（Flaviviridae）的RNA病毒，由壁蝨（Ixodes ricinus）傳播，主要影響羊隻（sheep）及偶發感染人類。","we":["（正確）跳躍病的病原為病毒（louping ill virus，黃病毒科），為正確答案。","披衣菌（Chlamydia）是絕對細胞內寄生菌，為Q熱等疾病的病原，非跳躍病病原。","原蟲（protozoa）如巴貝斯原蟲等是寄生蟲，非跳躍病病原。","細菌（bacteria）非跳躍病病原，跳躍病為病毒性疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_065","year":2020,"roc_year":109,"session":"2","examNo":65,"q":"伊波拉病毒出血熱對人類之致死率高,分離病毒時須在何種生物安全等級之實驗室進行?","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":3,"exp":"伊波拉病毒（Ebola virus）是生物安全等級第4級（BSL-4）的病原體，因其具有極高的傳染性、高致死率（50–90%），且目前無批准的特效治療藥物，必須在最高生物安全防護等級的實驗室中操作。","we":["BSL-1 適用於對健康成人無已知致病風險的微生物，伊波拉病毒絕對不在此等級。","BSL-2 適用於中度風險病原（如沙氏桿菌），不適用於伊波拉病毒。","BSL-3 適用於可能引起嚴重疾病但有預防措施的病原（如結核菌、炭疽菌），伊波拉需要更高防護等級。","（正確）伊波拉病毒需在 BSL-4 實驗室中處理，此為最高等級生物安全防護，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_066","year":2020,"roc_year":109,"session":"2","examNo":66,"q":"人類是經由下列何種病媒感染普氏立克次體Rickettsia prowazekii)?","opts":["A. 釘螺","B. 體蝨","C. 蚊子","D. 馬蠅"],"ans":1,"exp":"普氏立克次體（Rickettsia prowazekii）是流行性斑疹傷寒（epidemic typhus）的病原，其病媒為人體蝨（body louse，Pediculus humanus corporis）。人感染是因被體蝨的糞便污染傷口或黏膜，並非蝨子叮咬本身直接注入病原。","we":["釘螺（Oncomelania）是日本住血吸蟲的中間宿主，非立克次體病媒。","（正確）體蝨（body louse）是普氏立克次體（R. prowazekii）的傳播病媒，造成流行性斑疹傷寒，為正確答案。","蚊子傳播日本腦炎、西尼羅等病毒，並非普氏立克次體的病媒。","馬蠅（horse fly）偶可傳播某些疾病（如炭疽），但非普氏立克次體的病媒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_067","year":2020,"roc_year":109,"session":"2","examNo":67,"q":"下列何者不是水媒介性疾病?","opts":["A. 傷寒","B. 貓抓熱","C. 阿米巴赤痢","D. 霍亂"],"ans":1,"exp":"貓抓熱（cat scratch fever）由漢賽巴通氏菌（Bartonella henselae）引起，主要透過貓（尤其是幼貓）的抓傷或咬傷傳播，並非水源性疾病。傷寒（Salmonella Typhi）、阿米巴赤痢（Entamoeba histolytica）、霍亂（Vibrio cholerae）均可透過污染的飲水傳播。","we":["傷寒（typhoid fever）是典型水媒介疾病，透過污染的飲水傳播，此選項不是答案。","（正確）貓抓熱（cat scratch disease）透過貓的抓咬傷傳播，並非水媒介性疾病，為正確答案。","阿米巴赤痢（amoebiasis）透過糞口途徑及污染水源傳播，屬水媒介疾病。","霍亂（cholera）是典型水媒介疾病，透過污染飲水傳播，此選項不是答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_068","year":2020,"roc_year":109,"session":"2","examNo":68,"q":"下列何者為萊姆病 (Lyme disease)的病原?","opts":["A. Bacillus anthracis","B. Campylobacter jejuni","C. Borrelia burgdorferi sensu lato","D. Yersinia pseudotuberculosis"],"ans":2,"exp":"萊姆病（Lyme disease）的病原為伯氏疏螺旋體複合群（Borrelia burgdorferi sensu lato），是一種螺旋體細菌，由蜱（壁蝨）傳播。其他選項：Bacillus anthracis 是炭疽病原；Campylobacter jejuni 是彎曲桿菌腸炎病原；Yersinia pseudotuberculosis 是假結核病原。","we":["Bacillus anthracis 是炭疽桿菌，引起炭疽病，非萊姆病病原。","Campylobacter jejuni 引起彎曲桿菌腸炎（食源性疾病），非萊姆病病原。","（正確）Borrelia burgdorferi sensu lato（伯氏疏螺旋體）是萊姆病的病原，由壁蝨（Ixodes spp.）傳播，為正確答案。","Yersinia pseudotuberculosis 引起假結核病（腸系膜淋巴腺炎），非萊姆病病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_069","year":2020,"roc_year":109,"session":"2","examNo":69,"q":"日本住血吸蟲症主要以何種方式侵人人體而造成感染?","opts":["A. 呼吸","B. 皮膚","C. 胎盤","D. 經口食入"],"ans":1,"exp":"日本住血吸蟲（Schistosoma japonicum）的尾蚴（cercariae）在淡水環境中自由游動，可主動穿透接觸水源的人或動物皮膚，不需要吞食，直接由皮膚入侵宿主。","we":["呼吸道並非住血吸蟲的侵入途徑，尾蚴不以氣霧方式感染。","（正確）日本住血吸蟲的尾蚴透過皮膚穿透感染宿主，為正確答案。","胎盤傳播（垂直感染）不是住血吸蟲的傳播方式。","經口食入不是住血吸蟲的主要感染途徑（吃含囊尾蚴的食物不會感染日本住血吸蟲）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_070","year":2020,"roc_year":109,"session":"2","examNo":70,"q":"下列那一種人畜共通傳染病病毒具有必須藉由蚊子傳播、平時主要在叢林中傳播、偶有非人靈長類動物疫情\r 爆發及造成許多人感染等流行病學特徵?","opts":["A. 日本腦炎病毒","B. 伊波拉病毒","C. 黄熱病病毒","D. 剛果出血熱病毒"],"ans":2,"exp":"黃熱病（yellow fever）的流行病學特徵：①由蚊子（Aedes spp.）傳播（必須藉由蚊子）；②在非洲及南美洲的叢林中自然循環（叢林型黃熱病）；③非人靈長類（如猴子）是重要保毒宿主，可爆發疫情；④人類可大量感染（城市型黃熱病）。這些特徵完全符合黃熱病病毒。","we":["日本腦炎病毒（JEV）確實由蚊子傳播，但主要在亞洲流行，非叢林中靈長類宿主的自然循環模式，且主要症狀為腦炎。","伊波拉病毒（Ebola）主要透過直接接觸體液傳播，並非以蚊子為媒介，不符合「必須藉由蚊子傳播」的特徵。","（正確）黃熱病病毒（Yellow fever virus）具有所有描述特徵：蚊子傳播、叢林中靈長類自然循環、靈長類疫情爆發、大量人類感染，為正確答案。","剛果出血熱病毒（Congo hemorrhagic fever virus，即克里米亞-剛果出血熱病毒）由壁蝨傳播，非蚊子，且不以靈長類為主要宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_071","year":2020,"roc_year":109,"session":"2","examNo":71,"q":"下列何種動物感染狂犬病後較無狂躁期而易傾向産生麻痺型之結果?","opts":["A. 牛","B. 貓","C. 狐","D. 犬"],"ans":0,"exp":"牛感染狂犬病後，由於其神經生理特性，較少出現典型狂躁期（aggression），而傾向直接進入麻痺型（paralytic form），表現為延髓麻痺、吞嚥困難、流涎、後肢麻痺等症狀，較少見到攻擊行為。","we":["（正確）牛感染狂犬病後，較少出現狂躁期，傾向直接呈現麻痺型（延髓麻痺型），為正確答案。","貓感染狂犬病通常可出現狂躁期，有攻擊行為，並非以麻痺型為主。","狐（fox）感染狂犬病通常出現行為改變，可有狂躁型表現（如白天出沒、接近人類）。","犬（dog）感染狂犬病可有狂躁型（咬傷行為）或麻痺型，並非以麻痺型為主要傾向。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_072","year":2020,"roc_year":109,"session":"2","examNo":72,"q":"牛場工人被篩檢出屬於愛滋病陽性患者,出現水様下痢、嘔吐、腹痛、發熱等症狀,組織病理學上發現迴腸\r 微絨毛上附有大量病原體,請問最可能是感染了下列何種疾病?","opts":["A. cryptosporidiosis","B. babesiosis","C. neosporosis","D. paragonimiasis"],"ans":0,"exp":"隱孢子蟲症（cryptosporidiosis）由隱孢子蟲（Cryptosporidium spp.）引起，在免疫低下個體（如AIDS患者）中可造成嚴重、持續性水樣腹瀉、嘔吐、腹痛、發燒。病理上，蟲體附著在小腸絨毛（尤其迴腸）的微絨毛上，在高倍鏡下可見大量蟲體附著，符合題目描述。牛場工人暴露於牛糞中的卵囊，是常見感染途徑。","we":["（正確）隱孢子蟲症（cryptosporidiosis）在免疫不全者（AIDS患者）可造成嚴重腸道症狀，組織病理見迴腸微絨毛上附有大量蟲體，且可由牛傳播，為正確答案。","巴貝斯蟲症（babesiosis）由紅血球內寄生原蟲引起，主要症狀為溶血性貧血，不以腸道症狀為主。","新孢子蟲症（neosporosis）主要引起神經症狀（狗的後肢麻痺），以及牛的流產，非腸道症狀。","肺吸蟲症（paragonimiasis）主要累及肺部（咳嗽、血痰），非腸道微絨毛附著性疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_073","year":2020,"roc_year":109,"session":"2","examNo":73,"q":"下列何種家畜感染炭疽病的感受性最低?","opts":["A. 山羊","B. 綿羊","C. 馬","D. 豬"],"ans":3,"exp":"炭疽病（anthrax）的動物感受性由高至低排列：草食動物（牛、綿羊、山羊）> 馬 > 雜食動物 > 豬。豬對炭疽的感受性在家畜中最低，可能與豬的胃液酸度較高有關，不利於炭疽芽孢萌發。","we":["山羊對炭疽病感受性高，屬草食動物，容易感染。","綿羊對炭疽病感受性極高，是最容易感染的動物之一。","馬對炭疽感受性中等，高於豬，低於牛羊。","（正確）豬（pig）在常見家畜中對炭疽病的感受性最低，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_074","year":2020,"roc_year":109,"session":"2","examNo":74,"q":"下列何者主要寄生於人類上肢淋巴管,造成淋巴液回流受阻而導致所調的象皮腫(elephantiasis)?","opts":["A. 蟠尾絲蟲(Onchocerca volvulus)","B. 犬心絲蟲(Dirofilaria immitis)","C. 羅阿絲蟲 (Loaloa)","D. 班氏絲狀蟲(Wuchereria bancrofti)"],"ans":3,"exp":"班氏絲狀蟲（Wuchereria bancrofti）寄生於人類的淋巴系統（主要是腹股溝及下肢淋巴管），成蟲阻塞淋巴管導致淋巴液回流受阻，長期積液造成下肢皮膚及皮下組織纖維化增厚，形成象皮腫（elephantiasis）。雖然題目說「上肢」，但象皮腫最常見於下肢，選項D仍為最正確答案。","we":["蟠尾絲蟲（Onchocerca volvulus）主要寄生於皮下組織，引起河盲症（onchocerciasis），不造成象皮腫。","犬心絲蟲（Dirofilaria immitis）寄生於犬的肺動脈和心臟，偶爾感染人，造成肺部病變，不引起象皮腫。","羅阿絲蟲（Loa loa）在皮下組織移行，引起游走性腫塊，不造成淋巴阻塞性象皮腫。","（正確）班氏絲狀蟲（Wuchereria bancrofti）是引起淋巴絲蟲症（象皮腫）的最主要病原，寄生淋巴管造成淋巴回流阻塞，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_075","year":2020,"roc_year":109,"session":"2","examNo":75,"q":"下列何種動物是肝毛細線蟲Capillaria hepatica)的主要自然宿主?","opts":["A. 猴","B. 鼠","C. 松鼠","D. 熊"],"ans":1,"exp":"肝毛細線蟲（Capillaria hepatica，現稱 Calodium hepaticum）的自然主要宿主是鼠類（rats），尤其是大鼠和小鼠。蟲卵在鼠的肝臟中形成，必須在宿主死後由肝臟釋出至土壤中，再被其他動物食入才能完成生活史。人類為偶發性宿主。","we":["猴非肝毛細線蟲的主要自然宿主。","（正確）鼠（rat/mouse）是肝毛細線蟲的主要自然宿主，大規模感染常見於鼠族群，為正確答案。","松鼠偶爾可感染，但非最主要自然宿主。","熊非肝毛細線蟲的自然宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_076","year":2020,"roc_year":109,"session":"2","examNo":76,"q":"下列何者不是細菌性人畜共通傳染病?","opts":["A. 兔熱病","B. 炭疽病","C. 豬水疱病","D. 鉤端螺旋體病"],"ans":2,"exp":"豬水疱病（swine vesicular disease, SVD）的病原是腸病毒（Enterovirus，屬微小RNA病毒科），雖然在豬可引起水疱症狀，但實際上並非能感染人類的人畜共通傳染病病原（人類極少感染且症狀輕微）。相較之下，兔熱病（Francisella tularensis，細菌）、炭疽病（Bacillus anthracis，細菌）、鉤端螺旋體病（Leptospira spp.，螺旋體）均為細菌性人畜共通傳染病。","we":["兔熱病（tularemia）由兔熱病桿菌（Francisella tularensis）引起，為細菌性人畜共通傳染病，可感染人類。","炭疽病（anthrax）由炭疽桿菌（Bacillus anthracis）引起，為細菌性人畜共通傳染病，也可感染人類。","（正確）豬水疱病由腸病毒（SVD virus）引起，並非典型的細菌性人畜共通傳染病（也非重要人畜共通傳染病），為正確答案。","鉤端螺旋體病（leptospirosis）由鉤端螺旋體（Leptospira spp.）引起，為細菌（螺旋體）性人畜共通傳染病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_077","year":2020,"roc_year":109,"session":"2","examNo":77,"q":"依據飲用水水質標準,於屠宰場屠體使用之水,下列何者未列入檢測規範?","opts":["A. 大腸桿菌群","B. 氨氮","C. 鎳","D. 腸炎弧菌"],"ans":3,"exp":"依飲用水水質標準規定，屠宰場屠體使用水的檢測項目包括大腸桿菌群（總菌數、細菌指標）、一般化學項目如氨氮等，以及部分重金屬。腸炎弧菌（Vibrio parahaemolyticus）主要為海鮮食品中毒病原，並未列入屠宰用水的常規檢測項目。","we":["大腸桿菌群為飲用水及屠宰用水的基本微生物指標，屬於常規檢測項目。","氨氮是水質化學指標之一，屠宰用水中列入常規檢測。","鎳作為重金屬，列入飲用水水質標準的檢測項目中。","（正確）腸炎弧菌（V. parahaemolyticus）為海水性細菌，主要汙染海鮮，並未列入屠宰場用水的常規檢測規範，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_078","year":2020,"roc_year":109,"session":"2","examNo":78,"q":"動物飼料易遭黃麴毒素污染並殘留於屠肉中造成人類健康影響,依據世界衛生組織致癌物風險分類,黃麴毒素屬於下列何者?","opts":["A. 第一級人類確定之致癌物","B. 第二級A類對人類為很可能致癌物,對動物則為確定之致癌物","C. 第二級B類對人類為很可能致癌物,對動物為很可能也是致癌物","D. 第三級目前尚無足夠的動物或人體的資料,以供分類該物質是否為人類致癌物"],"ans":0,"exp":"依世界衛生組織（WHO）及國際癌症研究機構（IARC）的致癌物風險分類，黃麴毒素（Aflatoxin，尤其是B1型）被列為第一級（Group 1）人類確定致癌物，有充分證據證明對人類具致癌性，主要引起肝癌。","we":["（正確）黃麴毒素屬IARC第一級（Group 1）人類確定致癌物，有足夠人類流行病學和動物實驗證據，為正確答案。","第二級A類（Group 2A）為「很可能」對人類致癌，對動物確定致癌，黃麴毒素已超越此分類等級。","第二級B類（Group 2B）為「可能」對人類致癌，黃麴毒素的分類更高。","第三級（Group 3）表示證據不足無法分類，黃麴毒素已有足夠證據，不在此類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_109_2_公衛_079","year":2020,"roc_year":109,"session":"2","examNo":79,"q":"利用10個豬瘟病毒確診陽性檢體及10個確診陰性檢體依ELISA之OD讀值結果如下表。下列何者為利用OD=0.05","opts":["A. 、0.45","B. 、0.85","C. 、1.15","D. 及1.8 （E）共5個判定值 (cut-offpoint)畫出的ROC曲線\r (receiver operating characteristic curve )?","E. ","F. ","G. ","H. "],"ans":0,"exp":"本題需搭配原試題圖表（ROC曲線圖），根據5個判定值（OD=0.05, 0.45, 0.85, 1.15, 1.8）計算各點的敏感性（TPR）和1-特異性（FPR）後繪製ROC曲線。因題目中含有圖形選項，需圖表才能完整作答。","we":["（待圖表確認）此選項對應特定ROC曲線圖，需原始圖表才能判斷是否正確。","（待圖表確認）此選項對應特定ROC曲線圖。","（待圖表確認）此選項對應特定ROC曲線圖。","（待圖表確認）此選項對應特定ROC曲線圖。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_109_2_公衛_080","year":2020,"roc_year":109,"session":"2","examNo":80,"q":"承上題,在5個判定值中,何者最佳及其原因為何?","opts":["A. OD=0.05,因敏感性為100%","B. OD=1.8,因特異性為100%","C. OD=1.15 ,因AUC ( area under the curve)最大","D. OD=0.85,因最靠近左上角,其切線斜率趨近於1"],"ans":3,"exp":"ROC曲線上最佳判定值（optimal cut-off point）的選取標準之一是「最接近左上角」（即最接近敏感性=1、1-特異性=0的理想點），此點的切線斜率趨近於1，表示敏感性和特異性的增減達到最佳平衡。在5個判定值中，OD=0.85最靠近ROC曲線的左上角，故為最佳判定值。","we":["OD=0.05 時敏感性為100%（所有陽性均被檢出），但特異性極低（偽陽性多），並非最佳平衡點。","OD=1.8 時特異性為100%（所有陰性均正確排除），但敏感性極低（漏診多），並非最佳平衡點。","AUC（ROC曲線下面積）是衡量整條曲線的整體診斷效能，而非選取最佳切點的直接方法；最佳切點應用最靠近左上角的標準。","（正確）OD=0.85 最靠近ROC曲線的左上角（敏感性與特異性最佳平衡），切線斜率趨近於1，為最佳判定值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_001","year":2021,"roc_year":110,"session":"","examNo":1,"q":"下圖為某次人畜共通傳染病下痢疫情發生時，病例個案於各年齡層所占百分比直方圖，下列敘述何者正確？","opts":["A. 可進行以年齡配對的病例對照研究，瞭解疫情造成的可能危險因子","B. 此圖顯示40～50歲年齡層為發生率最高的族群","C. 經調查，此120名病例中有60名個案於發病24小時前曾食用生魚片，則因生魚片暴露所造成之侵襲率（attack   rate）為50%","D. 圖中各年齡層呈現的百分比為年齡別盛行率（age-specific prevalence）"],"ans":0,"exp":"直方圖顯示的是各年齡層病例佔總病例的百分比，而非年齡別發生率，故B、D錯誤。120名病例中60名曾暴露於生魚片，侵襲率應以暴露者中發病人數計算，題幹未給暴露總人數，故C計算基礎錯誤。A正確：病例對照研究可用年齡配對來控制年齡干擾，探討危險因子。","we":["B錯誤：直方圖橫軸為年齡層，縱軸為病例百分比，反映構成比而非各年齡層實際發生率，無法直接比較40-50歲發生率是否最高。","C錯誤：侵襲率（attack rate）= 暴露者中發病數／暴露總人數，題幹只知60人發病前曾暴露，並非暴露人數，故無法計算出50%。","D錯誤：圖中數字為各年齡層病例佔總病例的構成比（proportion），不是年齡別盛行率（age-specific prevalence）。","A為正確選項，不應選其他選項。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_002","year":2021,"roc_year":110,"session":"","examNo":2,"q":"調查甲、乙、丙三收容所犬隻小病毒感染率結果如下表。甲、乙收容所犬隻小病毒性別直接標準化感染率各為 何（請以丙收容所犬隻族群為標準族群）？","opts":["A. 1.75%、1.83%","B. 17.5%、18.3%","C. 15%、15%","D. 10%、10%"],"ans":1,"exp":"直接標準化法以丙收容所族群為標準，將甲、乙各性別組感染率乘以標準族群各性別組人數後加總再除以標準族群總數，計算結果約為17.5%與18.3%。","we":["A錯誤：1.75%與1.83%數量級差100倍，計算過程明顯有誤。","C錯誤：15%與15%相同，直接標準化後兩收容所率不應完全相同。","D錯誤：10%與10%亦完全相同，且數值偏低，不符合計算結果。","B為正確答案，依直接標準化計算約得17.5%與18.3%。"],"needs_review":true,"imgs":[]},{"id":"AMO_2021_公衛_003","year":2021,"roc_year":110,"session":"","examNo":3,"q":"若要探討犬隻罹患高血壓之所有可能危險因子，選擇以病例對照研究法進行較佳，其主要原因為何？","opts":["A. 可探討多重危險因子對單一疾病的影響","B. 因高血壓為犬隻常見疾病","C. 犬隻罹患高血壓之可能危險因子較稀有","D. 可獲得較佳之因果關係推論"],"ans":0,"exp":"病例對照研究（case-control study）最大優點是可同時探討多種暴露因子（危險因子）對同一疾病的影響，特別適合病因複雜的慢性病或罕見病。對於高血壓而言，此設計可同時評估飲食、遺傳、體重等多重因子。","we":["B錯誤：高血壓並非罕見疾病，但這不是選擇病例對照研究的主因；罕見疾病通常是選用病例對照的另一優點。","C錯誤：危險因子稀有時更適合世代研究，而非病例對照；病例對照適合疾病稀有時使用。","D錯誤：世代研究（cohort study）才能提供較強的時序性因果推論，病例對照研究因果推論力相對較弱。","A正確：可同時探討多重危險因子，是病例對照研究的核心優勢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_004","year":2021,"roc_year":110,"session":"","examNo":4,"q":"以流行病學研究探討X造成Y的可能性，結果顯示X造成Y的粗相對危險性（未考慮其他因子）為5。進一步分\r  析發現，在有Z因子存在狀況下，X造成Y的相對危險性為2；但在沒有Z因子存在狀況下，X造成Y的相對危險 性為20；Z因子存在與否狀況下，X造成Y的相對危險性達統計顯著差異。下列敘述何者錯誤？","opts":["A. 此分析方法為分層分析","B. Y因子為干擾因子","C. Z因子為交互作用因子","D. X與Z因子有相關"],"ans":1,"exp":"本題考分層分析中交互作用與干擾因子的辨別。Z因子存在與否使X造成Y的RR從2到20差異顯著，代表Z是交互作用因子（effect modifier），而非干擾因子。題幹問的是哪個敘述「錯誤」，故B錯：應是Z為干擾因子才可稱干擾，但Z符合交互作用條件，不應稱Y為干擾因子。","we":["A正確：依Z因子有無分層分析，確實是分層分析法。","C正確：Z因子存在使RR顯著不同（2 vs 20），Z確為交互作用因子（effect modifier）。","D正確：若Z與X有相關，則Z可能兼有干擾因子特性，此敘述在分層分析脈絡下成立。","B錯誤：題幹說Y是結果變數，且Z才是影響X→Y關係的因子，不應將Y稱為干擾因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_005","year":2021,"roc_year":110,"session":"","examNo":5,"q":"利用ELISA檢驗豬瘟病毒抗體，以OD=2為判定值時，敏感性及特異性均為90%。若將判定值改為OD=5，下列\r  敘述何者錯誤？","opts":["A. 敏感性低於90%","B. 特異性高於90%","C. 偽陽性個數降低","D. 偽陰性個數降低"],"ans":3,"exp":"將OD判定值由2提高至5，判定陽性的門檻升高，原本OD介於2-5之間的真陽性個體會被誤判為陰性，偽陰性（false negative）增加而非降低。敏感性因此降低（A正確），特異性升高（B正確），偽陽性減少（C正確）。","we":["A正確：閾值升高使部分真陽性被誤判為陰性，敏感性低於90%。","B正確：閾值升高使判定陽性更嚴格，特異性高於90%。","C正確：閾值升高，原本OD低於新閾值的真陰性不再被誤判為陽性，偽陽性降低。","D為錯誤敘述：閾值升高後偽陰性增加（更多真陽性被漏判），而非降低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_006","year":2021,"roc_year":110,"session":"","examNo":6,"q":"世界動物衛生組織認為非典型牛海綿狀腦病的發生不影響相關發生地的牛海綿狀腦病風險等級，所持的原因為\r  何？","opts":["A. 僅發生於特定品系牛隻，不影響整體產業風險","B. 所有牛隻皆可能自然發生，發生率低","C. 係人為不當飼養引起，改變飼養方式即可終止發生風險","D. 目前可以有效執行該疾病的監控管理，不會增加相關疾病風險"],"ans":1,"exp":"非典型（atypical）BSE為自發性突變，並非由飼料傳播引起，各地牛群均可隨機發生，發生率極低。OIE認為此屬自然老化相關的散發性病例，不代表風險等級惡化，故不影響該國的BSE風險狀態。","we":["A錯誤：非典型BSE並不侷限於特定品系，所有年老牛隻均可能隨機發生。","C錯誤：非典型BSE非因飼養方式不當引起，而是自發性prion蛋白錯折，改變飼養方式無法消除風險。","D錯誤：OIE的理由並非監控管理有效，而是其本質為低機率的自然發生事件。","B正確：OIE認定非典型BSE屬所有牛隻皆可能自然發生的散發性病例，發生率極低，不影響風險等級。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_007","year":2021,"roc_year":110,"session":"","examNo":7,"q":"一個支持動物衛生保健行業、產業或專業人士基於其自由裁量權向動物衛生主管單位報告疾病狀況的系統，屬\r  於下列何種監測方式？","opts":["A. 哨兵監測","B. 被動監測","C. 篩檢監測","D. 主動監測"],"ans":1,"exp":"被動監測（passive surveillance）指由動物衛生從業人員在其自由裁量下，自願向主管機關通報疾病，不需主管機關主動出擊收集資訊，符合題目描述。主動監測則由主管機關主動設計計畫、定期採樣。","we":["A錯誤：哨兵監測（sentinel surveillance）是在特定地點設置哨兵動物族群，主動偵測疾病趨勢。","C錯誤：篩檢監測以系統性方式篩查特定族群，非依從業人員自由裁量通報。","D錯誤：主動監測由主管單位主動設計方案收集資料，不是業者自行決定是否通報。","B正確：基於自由裁量的自願通報即為被動監測的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_008","year":2021,"roc_year":110,"session":"","examNo":8,"q":"流行病學中的三級預防（tertiary prevention）是指","opts":["A. 隔離","B. 檢疫","C. 診斷","D. 治療"],"ans":3,"exp":"流行病學三級預防：一級預防（primary）為促進健康、減少暴露，防止疾病發生；二級預防（secondary）為早期偵測診斷（如篩檢）；三級預防（tertiary）為已確診患者的治療、復健，減少殘障及死亡。隔離、檢疫屬疾病控制措施，診斷屬二級預防。","we":["A錯誤：隔離屬於傳染病控制措施，主要是疾病傳播防控，歸類於一到二級預防間的措施。","B錯誤：檢疫（quarantine）為防止疾病進入或擴散的措施，屬一級預防範疇。","C錯誤：診斷是三級以前的步驟，早期診斷屬二級預防的核心。","D正確：三級預防針對已發病個體進行治療與復健，防止病情惡化及失能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_009","year":2021,"roc_year":110,"session":"","examNo":9,"q":"下列何種措施與急性傳染病的控制策略較無關？","opts":["A. 選定另一地區族群進行世代研究法找尋危險因子","B. 減少或排除感染窩或傳染窩","C. 排除感受性動物與感染源的接觸","D. 減少具感受性動物的數量"],"ans":0,"exp":"急性傳染病爆發時，控制策略重點在於切斷傳播鏈：消除感染源（B）、阻絕接觸（C）、降低易感族群數量（D）。在別地區另行世代研究（A）是長期研究設計，對眼前的急性疫情控制毫無直接幫助，故與急性傳染病控制策略較無關。","we":["B有關：減少感染窩或傳染窩可直接切斷傳染源，是急性傳染病控制的核心策略。","C有關：阻絕易感動物接觸感染源（隔離、移除等）是防止疫情蔓延的直接手段。","D有關：透過撲殺、疫苗接種降低易感動物數量，可減低族群感受性，達到群體免疫效果。","A無關：世代研究法需長期追蹤，設計與分析費時，對急性疫情的即時控制沒有直接貢獻。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_010","year":2021,"roc_year":110,"session":"","examNo":10,"q":"下列何種參數大小可應用於探討疾病因果關係中風險的相關強度？","opts":["A. 機率p值","B. 勝算比","C. 信賴區間值","D. 統計檢定t值"],"ans":1,"exp":"風險的相關強度（strength of association）以相對危險性（RR）或勝算比（OR）的數值大小來評估，OR或RR遠離1表示關聯強度大。p值只判斷統計顯著性，信賴區間描述估計精確度，t值是統計檢定量，均不代表關聯強度大小。","we":["A錯誤：p值反映結果偶然發生的機率，只能判斷是否達統計顯著，無法說明關聯強弱。","C錯誤：信賴區間描述估計值的精確度與變異範圍，不直接代表風險強度。","D錯誤：t值是統計檢定統計量，用以判斷均數差是否顯著，不代表疾病風險關聯強度。","B正確：勝算比（OR）大小反映暴露與疾病的關聯強度，是因果推論中評估風險強度的核心指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_011","year":2021,"roc_year":110,"session":"","examNo":11,"q":"某兩種診斷方法的Kappa值為1.94，代表此兩種方法的一致性為何？","opts":["A. 數字錯誤，沒有意義","B. 很好的一致性","C. 普通的一致性","D. 不好的一致性"],"ans":0,"exp":"Kappa值的理論範圍為-1到+1，數值1.94超出此範圍，在統計上是不可能出現的數值，故屬數字錯誤，沒有意義。Kappa >0.8通常被認為具有「幾乎完全一致」的意義，但前提是數值必須在合法範圍內。","we":["B錯誤：Kappa=1.94超出合法範圍（-1至1），無法被解讀為「很好的一致性」。","C錯誤：同理，1.94超出範圍，無法評定為普通一致性。","D錯誤：1.94超出範圍，更不屬於不好的一致性（通常Kappa<0.4）。","A正確：Kappa值必須介於-1到1之間，1.94數字本身即為錯誤，無法賦予任何一致性意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_012","year":2021,"roc_year":110,"session":"","examNo":12,"q":"許多發生牛海綿狀腦病的牧場多有餵食含有反芻動物肉骨粉的飼料，則反芻動物肉骨粉可能為病因，此類型\r   假說形成方法屬於下列何者？","opts":["A. 一致法（method of agreement）","B. 差異法（method of difference）","C. 共同因素差異法（method of concomitant variation）","D. 類推法（method of analogy）"],"ans":0,"exp":"一致法（Mill's method of agreement）指在所有病例中尋找共同的暴露因子；凡發生BSE的牧場均有餵食含反芻動物肉骨粉的飼料，此共同出現的因素即為假說來源，符合一致法。","we":["B錯誤：差異法是比較有疾病和無疾病的群體，在其他條件相同下找出唯一不同之因子，題幹未提及對照牧場。","C錯誤：共同因素差異法（共變法）是探討暴露量與疾病頻率的劑量反應關係，題幹無此資訊。","D錯誤：類推法是依已知疾病特性推論類似未知疾病，題幹並無比較兩種疾病。","A正確：多個BSE牧場共同具有肉骨粉暴露因子，符合一致法的假說形成邏輯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_013","year":2021,"roc_year":110,"session":"","examNo":13,"q":"下列有關動物年（animal-year）的敘述，何者正確？","opts":["A. 一隻動物被觀察1年即為一動物年","B. 二隻動物分別被觀察半年則是半個動物年","C. 其僅受到觀察時間的影響","D. 於橫斷式研究中使用"],"ans":0,"exp":"動物年（animal-year）是時間-動物暴露量的單位：一隻動物被觀察追蹤1年即貢獻1個動物年。兩隻動物各觀察半年共貢獻1個動物年（非半個），且動物年同時受觀察時間長短與動物數量影響，主要用於世代研究計算發生率密度。","we":["B錯誤：兩隻動物各觀察半年 = 0.5＋0.5 = 1個動物年，而非半個動物年。","C錯誤：動物年同時受觀察時間與動物數量兩者影響，並非僅受觀察時間影響。","D錯誤：動物年用於世代研究（cohort study）計算發生率密度，橫斷式研究計算盛行率，不使用動物年。","A正確：動物年定義即為「一隻動物被觀察1年＝1動物年」，符合標準定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_014","year":2021,"roc_year":110,"session":"","examNo":14,"q":"流行病學累積發生率（cumulative incidence）的單位為何？","opts":["A. 無單位","B. 1/動物","C. 1/動物-時間","D. 1/時間"],"ans":0,"exp":"累積發生率（cumulative incidence，CI）= 在特定期間內新發病例數／期初無病動物數，是一個比例（proportion），分子分母單位相同，故無單位（dimensionless）。發生率密度（incidence density）才有1/動物-時間的單位。","we":["B錯誤：1/動物不是累積發生率的單位，累積發生率為純比例，無單位。","C錯誤：1/動物-時間是發生率密度（incidence density）的單位，非累積發生率。","D錯誤：1/時間亦為發生率密度概念，不適用於累積發生率。","A正確：累積發生率為比例，無量綱，無單位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_015","year":2021,"roc_year":110,"session":"","examNo":15,"q":"下列有關相對危險性（relative risk）的敘述，何者正確？","opts":["A. 係暴露族群與非暴露族群發生率之比值","B. 與研究族群個別疾病發生無關","C. 當相對風險等於1時顯示風險強度大","D. 適用於病例對照研究"],"ans":0,"exp":"相對危險性（relative risk, RR）= 暴露族群發生率 ÷ 非暴露族群發生率，是衡量暴露與疾病關聯強度的指標。RR=1表示無關聯（風險強度為零），RR≠1才代表有關聯；RR適用於世代研究，不適用病例對照研究（後者用OR）。","we":["B錯誤：RR直接由兩組的疾病發生率計算，當然與族群疾病發生率有關。","C錯誤：RR=1表示兩組發生率相同，暴露對疾病無影響，風險強度為零，而非「大」。","D錯誤：RR需要知道暴露組與非暴露組的發生率，須在世代研究中計算；病例對照研究因無法直接得到發生率，故使用OR。","A正確：RR定義即為兩組發生率的比值，為標準教科書定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_016","year":2021,"roc_year":110,"session":"","examNo":16,"q":"沒有飼養寵物亦沒有外食習慣者感染沙氏桿菌下痢發生率為2/1,000，有飼養寵物但沒有外食習慣者感染沙氏\r   桿菌下痢發生率為6/1,000，沒有飼養寵物但有外食習慣者感染沙氏桿菌下痢發生率為21/1,000。若同時飼養寵 物且有外食習慣者感染沙氏桿菌下痢發生率為75/1,000，則同時具有兩因子者相較於皆未有此二因子者，對於 感染沙氏桿菌下痢的相對危險性為何？","opts":["A. 12.5倍","B. 37.5倍","C. 75倍","D. 150倍"],"ans":1,"exp":"相對危險性 = 同時具兩因子者發生率 ÷ 皆未具兩因子者發生率 = (75/1000) ÷ (2/1000) = 37.5倍。","we":["A錯誤：12.5倍並非正確計算結果，75/2=37.5而非12.5。","C錯誤：75倍是將75/1000直接作為倍數，未除以基線發生率2/1000。","D錯誤：150倍計算無依據，遠超過正確答案。","B正確：RR = 75 ÷ 2 = 37.5倍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_017","year":2021,"roc_year":110,"session":"","examNo":17,"q":"下列有關獸醫流行病學家的工作原則和觀念，何者錯誤？","opts":["A. 研究群體疾病的發生與飼養環境的關係","B. 必須量化與疾病發生有關的資料，並進行分析","C. 主要以觀察方式將實驗室控制下的研究結果進行分析","D. 選定的風險群體常包括健康和有病的群體"],"ans":2,"exp":"獸醫流行病學研究在自然（現場）環境中觀察動物族群的疾病發生情形，而非在實驗室控制條件下進行；實驗室研究屬基礎醫學或毒理研究，不是流行病學的定義範疇。C敘述混淆了流行病學（觀察式、族群導向）與實驗室研究的本質。","we":["A正確：獸醫流行病學研究群體疾病發生與飼養環境的關係，符合其核心定義。","B正確：流行病學必須量化疾病相關資料並進行統計分析，才能得出客觀結論。","D正確：選定的研究族群（risk group）通常包含健康與有病個體，才能比較兩組差異。","C錯誤：流行病學主要在自然環境下觀察族群，不是在實驗室控制條件下研究。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_018","year":2021,"roc_year":110,"session":"","examNo":18,"q":"依據屠宰衛生檢查規則，下列那些疾病之屠體、內臟應切除該患部，其餘正常部分始得供食用？①豬瘟 ②\r  結核病之局部病灶 ③李斯特菌症之頭部 ④豬水泡性口炎","opts":["A. ①②","B. ②③","C. ③④","D. ①④"],"ans":1,"exp":"依屠宰衛生檢查規則：豬瘟屠體應全部銷毀不得供食用；豬水泡性口炎為口蹄疫類疫病，屠體亦不得供食用。結核病局部病灶可切除患部其餘部分供食用；李斯特菌症之頭部病灶切除後其餘正常部分可供食用。故②③符合「切除患部、其餘正常部分可食用」之規定。","we":["A錯誤：①豬瘟屬全身性感染，整具屠體均須銷毀，不得供食用，故①不符合。","C錯誤：④豬水泡性口炎屬須全部銷毀的疫病，不符合切除患部可食用之規定。","D錯誤：①豬瘟需全屠體銷毀，不符合條件。","B正確：②結核病局部病灶及③李斯特菌症之頭部均可切除患部後其餘供食用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_019","year":2021,"roc_year":110,"session":"","examNo":19,"q":"依據化製場及化製原料運輸車消毒及管理辦法，化製場或運輸業者每年應就其化製原料運輸車向所在地動物\r  防疫機關申請查驗，經查驗合格發給合格證。合格證有效期限為幾年？","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":0,"exp":"依化製場及化製原料運輸車消毒及管理辦法規定，化製原料運輸車合格證的有效期限為1年，業者須每年申請查驗。","we":["B錯誤：有效期限為1年，非2年。","C錯誤：有效期限為1年，非3年。","D錯誤：有效期限為1年，非4年。","A正確：依法規，化製原料運輸車合格證每年申請查驗，有效期限1年。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_020","year":2021,"roc_year":110,"session":"","examNo":20,"q":"依據屠宰衛生檢查規則，屠宰衛生檢查獸醫師或助理遇有受恐嚇、暴力脅迫行為時，經向下列何者報備後，\r  得停止屠宰衛生檢查工作？","opts":["A. 屠宰衛生檢查獸醫師主任","B. 駐區獸醫師","C. 屠宰場負責人","D. 縣市政府"],"ans":3,"exp":"依屠宰衛生檢查規則，屠宰衛生檢查獸醫師或助理遇有受恐嚇或暴力脅迫情形，應向縣（市）政府報備後，得停止屠宰衛生檢查工作，並不得有刁難情事。","we":["A錯誤：法規明定報備對象為縣市政府，非屠宰衛生檢查獸醫師主任。","B錯誤：駐區獸醫師為現場執行人員，並非報備對象。","C錯誤：屠宰場負責人為業者，非主管機關，不得作為停止工作的報備對象。","D正確：依規定應向縣（市）政府報備，方得停止屠宰衛生檢查。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_021","year":2021,"roc_year":110,"session":"","examNo":21,"q":"依據動物用藥品檢驗登記審查準則，動物用藥品許可證之有效期間為幾年？","opts":["A. 1","B. 3","C. 5","D. 10"],"ans":2,"exp":"依動物用藥品檢驗登記審查準則，動物用藥品許可證有效期間為5年，期滿前應申請展延。","we":["A錯誤：1年過短，不符合法規規定。","B錯誤：3年亦非法定有效期間。","D錯誤：10年過長，與法規不符。","C正確：動物用藥品許可證有效期間依法為5年。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_公衛_022","year":2021,"roc_year":110,"session":"","examNo":22,"q":"下圖所示之屠宰衛生檢查合格標誌，適用於下列何種畜產品？","opts":["A. 豬牛屠體表面","B. 剝皮屠體","C. 禽肉包裝","D. 禽肉包裝束口"],"ans":2,"exp":"屠宰衛生檢查規則規定，不同型態的合格標誌（印章/標籤）適用於不同產品：橢圓形標
