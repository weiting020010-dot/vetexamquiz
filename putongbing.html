<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>獸醫普通疾病學題庫</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:#2e3347;--border2:#3d4260;
  --text:#e8eaf6;--text2:#9096b8;--text3:#555d80;
  --accent:#5c6bc0;--accent2:#7986cb;
  --green:#43a867;--green-bg:#0d2318;--green-border:#1e4d32;
  --red:#e05252;--red-bg:#250f0f;--red-border:#4d1f1f;
  --yellow:#f0c060;--yellow-bg:rgba(240,192,96,.08);--yellow-border:rgba(240,192,96,.3);
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:740px;margin:0 auto}
.hdr{margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1.25rem;position:relative}
.btn-clr-bottom{display:block;margin:1.5rem auto 0;background:none;border:1px solid #2d3548;border-radius:8px;padding:8px 20px;font-size:.78rem;color:#475569;cursor:pointer;transition:color .15s,border-color .15s}
.btn-clr-bottom:hover{color:var(--red);border-color:var(--red)}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.mono{font-family:"Courier New",Courier,monospace}
.lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
h1{font-size:21px;font-weight:700;line-height:1.3}
.sub{font-size:12px;color:var(--text3);margin-top:4px}
.stats{display:flex;gap:8px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;text-align:center;min-width:56px}
.st-n{font-size:18px;font-weight:700;font-family:"Courier New",monospace}
.st-l{font-size:10px;color:var(--text3);margin-top:2px}
.ctrl{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.csel{flex:1;min-width:180px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;cursor:pointer}
.csel:focus{outline:none;border-color:var(--accent)}
.modes{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px}
.mb{flex:1;padding:7px 10px;font-size:13px;border-radius:7px;border:none;background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s}
.mb:hover{color:var(--text)}
.mb.on{background:var(--bg3);color:var(--text);font-weight:500}
.pb{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1rem}
.meta{display:flex;align-items:center;gap:7px;margin-bottom:.9rem;flex-wrap:wrap}
.bdg{font-size:11px;padding:3px 9px;border-radius:20px;font-family:"Courier New",monospace}
.bdg-yr{background:rgba(92,107,192,.2);color:var(--accent2);border:1px solid rgba(92,107,192,.3)}
.bdg-src{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.bdg-rv{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.qn{font-size:12px;color:var(--text3);margin-left:auto;font-family:"Courier New",monospace}
.qt{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:14px;color:var(--text2);transition:.15s;display:flex;gap:9px;align-items:flex-start;line-height:1.6;background:var(--bg)}
.opt:hover:not(.dis){border-color:var(--border2);color:var(--text);background:var(--bg3)}
.opt.ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.opt.no{border-color:var(--red-border);background:var(--red-bg);color:#f08080;cursor:pointer}
.opt.dis{cursor:default}
.okey{font-weight:700;min-width:18px;flex-shrink:0;font-family:"Courier New",monospace;font-size:13px}
.exp{margin-top:.9rem;padding:13px 15px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.exp.show{display:block}
.exp-t{font-weight:700;color:var(--accent2);margin-bottom:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.wexp{margin-top:.6rem;padding:11px 14px;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.wexp.show{display:block}
.wexp-t{font-weight:700;color:#f08080;margin-bottom:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.act{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:8px}
.btn{padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);font-size:13px;color:var(--text2);cursor:pointer;transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:default}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btnp:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.res{text-align:center;padding:2.5rem 1rem}
.res-s{font-size:52px;font-weight:700;font-family:"Courier New",monospace}
.res-sub{font-size:13px;color:var(--text3);margin-top:5px}
.res-row{display:flex;gap:2rem;justify-content:center;margin:1.25rem 0}
.ri{text-align:center}
.rn{font-size:22px;font-weight:700;font-family:"Courier New",monospace}
.rl{font-size:12px;color:var(--text3);margin-top:3px}
.grn{color:var(--green)}.red{color:var(--red)}
.note-box{margin-top:.6rem;padding:10px 14px;background:var(--yellow-bg);border-left:3px solid var(--yellow-border);border-radius:0 var(--rs) var(--rs) 0;font-size:12px;color:var(--yellow);line-height:1.7}
.foot{text-align:center;margin-top:2.5rem;font-size:11px;color:var(--text3);font-family:"Courier New",monospace;border-top:1px solid var(--border);padding-top:1.25rem}
.q-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:.75rem 0 .25rem}
.q-imgs img{max-width:100%;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg3);cursor:pointer}
.q-imgs img:hover{border-color:var(--border2)}
.nav-wrap{margin-bottom:1rem}
.nav-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;user-select:none}
.nav-hdr:hover{border-color:var(--border2)}
.nav-title{font-size:12px;color:var(--text2);font-family:"Courier New",monospace;letter-spacing:.05em}
.nav-arrow{font-size:10px;color:var(--text3);transition:transform .2s}
.nav-arrow.open{transform:rotate(180deg)}
.nav-grid{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:160px;overflow-y:auto}
.nav-grid.hidden{display:none}
.qnb{width:34px;height:30px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text3);font-size:11px;font-family:"Courier New",monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.qnb:hover{border-color:var(--accent2);color:var(--text)}
.qnb.cur{border-color:var(--accent2);background:var(--accent);color:#fff;font-weight:700}
.qnb.ans-ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.qnb.ans-ok.cur{background:var(--green);color:#fff}
.qnb.ans-no{border-color:var(--red-border);background:var(--red-bg);color:#f08080}
.qnb.ans-no.cur{background:var(--red);color:#fff}
.opt.peek{cursor:pointer;border-color:var(--yellow-border);color:var(--text2)}
.opt.peek:hover{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.07);color:var(--text)}
.opt.peek-active{border-color:rgba(240,192,96,.6) !important;background:rgba(240,192,96,.1) !important;color:var(--text) !important}
@media(max-width:480px){
  h1{font-size:18px}
  .st{padding:6px 9px;min-width:48px}.st-n{font-size:16px}
  .mb{font-size:12px;padding:6px 6px}
  .qt{font-size:14px}
  .qnb{width:30px;height:28px;font-size:10px}
}
.btn-ai{background:rgba(121,134,203,.15);border-color:rgba(121,134,203,.3);color:var(--accent2)}
.btn-ai:hover{background:rgba(121,134,203,.25);color:var(--text);border-color:var(--accent)}
.ec-badge{background:rgba(240,96,96,.2);color:#f08080;border:1px solid rgba(240,96,96,.3)}
.btn-clr{padding:5px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;letter-spacing:.03em}
.btn-clr:hover{color:var(--red);border-color:var(--red-border)}
.btn-exam{padding:7px 14px;border-radius:var(--rs);border:1px solid rgba(92,107,192,.4);background:rgba(92,107,192,.15);font-size:13px;color:var(--accent2);cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn-exam:hover{background:rgba(92,107,192,.28);color:var(--text);border-color:var(--accent)}
.btn-star{width:38px;height:38px;border-radius:50%;border:1px solid #2d3548;background:transparent;color:#475569;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;line-height:1;padding:0}
.btn-star:hover{color:var(--yellow);border-color:var(--yellow-border)}
.btn-star.active{color:var(--yellow);border-color:var(--yellow-border);background:var(--yellow-bg)}
.btn-star.invis{opacity:0;pointer-events:none}
.qnb.ans-unsure{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.08);color:var(--yellow)}
.qnb.ans-unsure.cur{background:var(--yellow);color:#0f1117;font-weight:700}
.unsure-tag{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border);font-size:13px;letter-spacing:.02em}
.wrong-tag{background:rgba(224,82,82,.15);color:#f08080;border:1px solid var(--red-border)}
.fc-container{margin-bottom:1.2rem}
.fc-container>.fc-wrap{margin-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fc-container>.fc-wrap .fc-front,.fc-container>.fc-wrap .fc-back{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.fc-note{border:1px solid var(--border);border-radius:0 0 var(--r) var(--r);padding:.85rem 1.1rem;background:var(--bg)}
.fc-note-hdr{display:flex;align-items:center;gap:8px;margin-bottom:.55rem;flex-wrap:wrap}
.fc-note-label{font-size:11px;color:var(--text3);font-family:"Courier New",monospace;flex:1}
.fc-note-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;line-height:1.7;padding:8px 10px;resize:vertical;min-height:56px;font-family:inherit}
.fc-note-ta::placeholder{color:var(--text3)}
.fc-note-ta:focus{outline:none;border-color:var(--accent)}
.btn-note-img{padding:3px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:"Courier New",monospace;transition:.15s;display:inline-block}
.btn-note-img:hover{border-color:var(--accent2);color:var(--text)}
.note-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:.55rem}
.note-img-wrap{position:relative}
.note-img-wrap img{width:72px;height:56px;object-fit:cover;border-radius:var(--rs);border:1px solid var(--border);cursor:zoom-in;display:block}
.note-img-wrap img:hover{border-color:var(--accent2)}
.note-img-del{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.us-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;z-index:1000;overflow-y:auto}
.us-box{width:100%;max-width:400px}
.us-title{font-size:20px;font-weight:700;margin:1rem 0 1.5rem;text-align:center}
.us-lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.75rem;font-family:"Courier New",monospace}
.us-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.55rem;cursor:pointer;transition:.15s}
.us-item:hover{border-color:var(--accent2);background:var(--bg3)}
.us-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;color:#fff}
.us-uname{font-size:14px;font-weight:600;flex:1}
.us-del{padding:4px 8px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;transition:.15s}
.us-del:hover{color:var(--red);border-color:var(--red-border)}
.us-new{display:flex;gap:8px;margin-top:1rem}
.us-input{flex:1;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px}
.us-input:focus{outline:none;border-color:var(--accent)}
.us-cur{font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:6px}
.us-cur-name{color:var(--accent2);font-weight:500}
.btn-sw{padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:10px;color:var(--text3);cursor:pointer;font-family:"Courier New",monospace;transition:.15s}
.btn-sw:hover{color:var(--accent2);border-color:var(--accent)}
.fc-wrap{cursor:pointer;margin-bottom:1rem}
.fc-front,.fc-back{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;transition:opacity .2s}
.fc-back{border-color:var(--green-border);background:var(--green-bg);display:none}
.fc-wrap.flipped .fc-front{display:none}
.fc-wrap.flipped .fc-back{display:block}
.fc-hint{font-size:11px;color:var(--text3);text-align:center;padding:.35rem 0 .1rem;font-family:"Courier New",monospace;letter-spacing:.04em}
.sp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;margin-bottom:.75rem}
.sp-q{font-size:14px;color:var(--text);margin-bottom:.6rem;line-height:1.7}
.sp-ans{font-size:13px;color:var(--green);margin-bottom:.5rem;font-weight:600}
.sp-exp{font-size:12px;color:var(--text2);line-height:1.75}
.sp-wrong{font-size:12px;color:#f08080;margin-top:.5rem;padding:.6rem .75rem;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;line-height:1.7}
</style>
</head>

<div id="main-app" style="display:none">
<div class="wrap">
<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="lbl mono"><a href="./index.html" style="color:inherit;text-decoration:none;opacity:.7">獸醫師國考</a> · 獸醫普通疾病學 · 官方歷屆題</div>
      <h1>普通疾病學 歷屆國考題庫</h1>
      <div class="sub">共 <span id="qtotal">0</span> 題 · v1 · <span class="us-cur"><span class="us-cur-name" id="cur-user-name"></span><button class="btn-sw" onclick="logout()">登出</button><button class="btn-sw" onclick="deleteOwnAccount()" style="color:var(--red);border-color:var(--red-border);margin-left:2px">刪除帳號</button></span></div>
    </div>
    <div class="stats">
      <div class="st"><div class="st-n mono" id="sd">0</div><div class="st-l">已答</div></div>
      <div class="st"><div class="st-n mono" id="sc">0</div><div class="st-l">答對</div></div>
      <div class="st"><div class="st-n mono" id="sa">&#x2014;</div><div class="st-l">正確率</div></div>
    </div>
  </div>
</div>
<div class="ctrl">
  <select class="csel" id="yrsel" onchange="setFilter(this.value)">
    <option value="all">全部年份</option>
  </select>
  <div class="modes">
    <button class="mb on" id="m0" onclick="setM(0)">選擇題</button>
    <button class="mb" id="m1" onclick="setM(1)">字卡</button>
    <button class="mb" id="m2" onclick="setM(2)">重點</button>
  </div>

</div>
<div class="pb"><div class="pf" id="pf" style="width:0%"></div></div>
<div class="nav-wrap">
  <div class="nav-hdr" onclick="toggleNav()">

    <span class="nav-arrow" id="nav-arrow">&#9660;</span>
  </div>
  <div class="nav-grid hidden" id="nav-grid"></div>
</div>

</div>

<script>
const ALL_QS=[{"id":"AMO_2025_普通病_001","year":2025,"roc_year":114,"session":"","examNo":1,"q":"診斷為何？","opts":["A. 軟顎背側異位（dorsal displacement of the soft palate）","B. 耳咽管囊臌脹（guttural pouch tympany）","C. 喉返神經疾病（recurrent laryngeal neuropathy）","D. 會厭包嵌（epiglottic entrapment）"],"ans":0,"exp":"本題考馬匹上呼吸道疾病診斷。軟顎背側異位（DDSP）是馬匹運動時軟顎翻越會厭背側，造成特徵性呼氣期雜音，為常見的馬匹上呼吸道疾病。（本題臨床情境依圖片，標記待覆核）","we":["（正確）DDSP 是軟顎向背側位移覆蓋在會厭上方，運動時產生呼氣期「flapping」雜音。","耳咽管囊臌脹主要見於幼駒，因耳咽管內氣體異常積聚造成，與運動型呼吸雜音不同。","喉返神經疾病（roaring）造成吸氣期喘鳴，雜音以吸氣為主而非呼氣。","會厭包嵌（epiglottic entrapment）是杓會厭皺褶包住會厭，通常引起吸氣或雙相性雜音。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_002","year":2025,"roc_year":114,"session":"","examNo":2,"q":"承上題，關於此疾病之敘述，下列何者正確？","opts":["A. 呼吸雜音在吸氣時比呼氣大","B. 喉返神經漸進性發炎產生的狀況","C. 鎮靜後在安靜的狀況下檢查最可能觀察到病變","D. 會厭軟骨通常仍會回到正常位置"],"ans":3,"exp":"DDSP（軟顎背側異位）的臨床特徵：雜音以呼氣為主（非吸氣）；屬動態性疾病，需運動中內視鏡診斷；馬匹咳嗽吞嚥後軟顎常可自行復位，即會厭軟骨通常回到正常位置（軟顎回到下方）。","we":["吸氣時比呼氣雜音大是喉返神經疾病（roaring）的特徵，DDSP 以呼氣性雜音為主。","DDSP 的成因是神經肌肉協調障礙造成軟顎功能異常，並非喉返神經漸進性發炎。","DDSP 是動態性疾病，在鎮靜安靜狀態下通常觀察不到病變，需跑步機運動內視鏡檢查。","（正確）DDSP 發作後馬匹咳嗽或吞嚥可使軟顎復位，會厭軟骨回到正常高於軟顎的位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_003","year":2025,"roc_year":114,"session":"","examNo":3,"q":"影像的拍攝方位最接近的是","opts":["A. dorsomedial to plantarolateral oblique projection","B. dorsolateral to plantaromedial oblique projection","C. lateromedial projection","D. flexed dorsoplantar projection"],"ans":0,"exp":"本題為馬匹跗關節 X 光投照方位題，需依據影像判斷（dorsomedial-plantarolateral 斜位常用於評估跗關節內側結構）。（圖片題，標記待覆核）","we":["（正確依圖判斷）dorsomedial to plantarolateral 斜位可評估跗關節特定骨性結構。","dorsolateral to plantaromedial 斜位用於評估跗關節外側結構，角度與本題不符。","lateromedial 為標準側位，用於整體跗關節評估，非斜位。","flexed dorsoplantar 為彎曲背跖位，評估遠端跗骨，與斜位不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_004","year":2025,"roc_year":114,"session":"","examNo":4,"q":"承上題，箭頭所指之結構為何？","opts":["A. medial trochlear ridge of the talus","B. lateral trochlear ridge of the talus","C. plantar border of the talus","D. intermediate ridge of the talus"],"ans":0,"exp":"本題為馬匹跗關節 X 光上特定結構辨識（箭頭所指），需依圖判斷。（圖片題，標記待覆核）","we":["（正確依圖判斷）距骨內側滑車嵴（medial trochlear ridge of talus）是跗關節常見損傷部位。","距骨外側滑車嵴（lateral trochlear ridge）位置偏外側，與標準斜位顯現位置不同。","距骨蹠側緣（plantar border）位於後方，非滑車嵴結構。","距骨中間嵴（intermediate ridge）位於兩滑車嵴之間，超音波或特殊投照才易辨識。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_005","year":2025,"roc_year":114,"session":"","examNo":5,"q":"下圖馬匹之蹄部最可能罹患何種疾病？","opts":["A. 蹄葉炎（laminitis）","B. 白線病（white line disease）","C. pedal osteitis","D. 腐蹄（thrush）"],"ans":0,"exp":"本題為馬匹蹄部疾病影像診斷（下圖），需依據蹄部影像特徵判斷（蹄葉炎常見蹄骨旋轉下沉）。（圖片題，標記待覆核）","we":["（正確依圖判斷）蹄葉炎（laminitis）X 光可見蹄骨旋轉或下沉，蹄壁與蹄骨間距增大。","白線病（white line disease）侵犯蹄白線，X 光改變較輕微，通常不見明顯蹄骨移位。","Pedal osteitis 為蹄骨骨炎，X 光可見蹄骨邊緣不規則，但無旋轉/下沉特徵。","腐蹄（thrush）是蹄叉腐爛的細菌感染，以臨床外觀及氣味診斷，X 光無特異性表現。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_006","year":2025,"roc_year":114,"session":"","examNo":6,"q":"牛第四胃左側異位常伴有下列何種血液變化？","opts":["A. 低血氯","B. 低血鎂","C. 高血鈣","D. 高血鉀"],"ans":0,"exp":"第四胃左側異位（LDA）時，第四胃積氣移位至左腹脇，幽門出口受阻→胃酸（HCl）無法向前流入十二指腸→H⁺和 Cl⁻ 滯留於瘤胃/第四胃→血中 Cl⁻ 降低（低血氯），同時發生代謝性鹼中毒和低血鉀。","we":["（正確）LDA 因胃酸積聚於第四胃，Cl⁻ 隨 H⁺ 滯留，血液中 Cl⁻ 濃度下降，出現低血氯。","低血鎂（低血鎂症）與草地痙攣（grass tetany）有關，不是 LDA 的典型代謝異常。","高血鈣不是 LDA 的典型表現；乳熱症才以低血鈣為主要特徵。","LDA 反而常見低血鉀（低鉀血症），而非高血鉀；高血鉀多見於腎上腺皮質功能低下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_007","year":2025,"roc_year":114,"session":"","examNo":7,"q":"下列何者不是牛隻創傷性蜂巢胃炎－腹膜炎的典型症狀？","opts":["A. 盲腸臌脹","B. 左肘頭外展","C. 站立時拱背","D. 心搏過快"],"ans":0,"exp":"創傷性蜂巢胃炎（TRP/hardware disease）典型症狀包括：胸骨後疼痛（劍狀軟骨叩診陽性）、拱背、兩側肘頭外展（不限左側）、心搏過快、食慾下降、乳量減少。盲腸臌脹（cecal dilation）是迷走性消化不良或盲腸扭轉的特徵，不是 TRP 的典型症狀。","we":["（正確）盲腸臌脹為盲腸擴張或扭轉的症狀，不是創傷性蜂巢胃炎的典型臨床表現。","肘頭外展（elbows abducted）是為減輕胸部疼痛而展開前肢，TRP 確有此典型症狀。","拱背（arched back）是腹痛及腹腔感染的典型姿勢，屬 TRP 常見症狀。","心搏過快（tachycardia）在 TRP 因疼痛與炎症反應而常見，屬典型症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_008","year":2025,"roc_year":114,"session":"","examNo":8,"q":"某一牧場，畜主表示懷孕3個月後的乳牛流產比例非常高，尤其是在懷孕第5至7月，且自家飼養的犬 隻能自由在牧場內行走，包含飼料走道及圈養區，也曾看到犬隻將流產的胎盤叼走。經獸醫師建議 後，將犬隻栓在牧場門口而無法隨意進入到牧場內，並且表示流產比例有逐漸的下降。根據以上狀 況，下列何者是最有可能造成牛隻流產的病因？","opts":["A. Neospora caninum","B. Trichomonas foetus","C. Toxoplasma gondii","D. Bovine herpesvirus 1"],"ans":0,"exp":"Neospora caninum（新孢子蟲）的終宿主是犬（definitive host），犬隻排出卵囊→牛隻攝入→在牛體內形成組織囊胞→懷孕時垂直感染胎兒→主要造成妊娠 5–7 個月之流產。牧場限制犬隻後流產率下降，強烈支持 Neospora 診斷。","we":["（正確）Neospora caninum 以犬為終宿主，牛為中間宿主，犬糞散播卵囊，牛攝入後導致胎兒神經肌肉損傷並流產，典型於妊娠 5–7 月。","Trichomonas foetus 透過性接觸傳播，造成早期胚胎死亡和流產，不涉及犬隻傳播途徑。","Toxoplasma gondii 終宿主為貓，雖可感染牛但傳播途徑依賴貓糞，非犬隻糞便。","Bovine herpesvirus 1（IBR）透過呼吸道及性接觸傳播，與犬隻活動於牧場關聯性低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_009","year":2025,"roc_year":114,"session":"","examNo":9,"q":"在牛隻呈現臨床症狀的澱粉樣變性症（amyloidosis）最常出現在下列那一個臟器？","opts":["A. 腎臟","B. 肝臟","C. 心臟","D. 中樞神經"],"ans":0,"exp":"牛隻澱粉樣變性（amyloidosis）最常見為 AA 型（繼發性），主要沉積於腎臟（腎小球和腎間質），造成蛋白尿、低蛋白血症和全身性水腫。臨床表現以腎臟症狀為主，遠多於肝臟、心臟或神經系統的受累。","we":["（正確）牛隻澱粉樣變性最常影響腎臟（AA 澱粉樣蛋白沉積於腎小球），造成蛋白尿和腎病症候群。","肝臟澱粉樣沉著在牛隻較少造成明顯臨床症狀，腎臟受累比肝臟更常見且更具臨床意義。","心臟澱粉樣沉著在牛隻極罕見，且心臟受累不是牛隻澱粉樣變性的主要表現。","中樞神經系統澱粉樣沉著在牛隻臨床上非常罕見，不是本病的典型受累臟器。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_010","year":2025,"roc_year":114,"session":"","examNo":10,"q":"關於仔牛地方性肺炎（enzootic pneumonia），下列敘述何者最不適當？","opts":["A. 通常為支氣管肺炎（bronchopneumonia）","B. 仔牛在經過運輸後常有較高的發生率","C. 通常發生於群體飼養之仔牛群","D. 通常由單一特定病原所引起"],"ans":3,"exp":"仔牛地方性肺炎（enzootic pneumonia）通常為「多病原性」（multifactorial），常涉及多種病毒（BRSV、BCoV、BPI3V）及細菌（Mannheimia、Pasteurella、Mycoplasma）的混合感染，並非由單一特定病原引起。","we":["仔牛地方性肺炎確實以支氣管肺炎（bronchopneumonia）為主要病變，此描述正確。","運輸壓力（shipping fever）可降低免疫力，確實提高仔牛地方性肺炎發生率，此描述正確。","群體飼養（group housing）的仔牛密度高、病原交叉感染風險大，確實好發，此描述正確。","（正確錯誤）仔牛地方性肺炎通常由多種病原共同參與，而非單一特定病原，此敘述最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_011","year":2025,"roc_year":114,"session":"","examNo":11,"q":"臨床上檢測乳牛次臨床性乳房炎的項目中，下列何者為現場最常用的篩選方式？","opts":["A. 乳汁樣本微生物培養","B. 乳營養成分分析","C. 加州乳房炎試驗（California mastitis test）","D. 乳汁樣本pH值檢測"],"ans":2,"exp":"加州乳房炎試驗（CMT）是最常用的現場篩選次臨床性乳房炎的方法。CMT 利用試劑與乳汁中 DNA 反應，體細胞數越高（即乳房炎時），反應越強（凝膠越明顯）。此法快速、廉價、可在牛隻側直接操作。","we":["乳汁微生物培養是確診病原的金標準，但費時（需 24–48 小時以上），不適合作為現場快速篩選。","乳汁營養成分分析（脂肪、蛋白質、乳糖比例）可間接反映乳房健康，但不是乳房炎的直接篩選工具。","（正確）CMT 是現場最常用的次臨床性乳房炎篩選方式，透過試劑與體細胞 DNA 反應快速判讀。","乳汁 pH 值可於乳房炎時輕度上升，但靈敏度與特異度不如 CMT，不是首選篩選方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_012","year":2025,"roc_year":114,"session":"","examNo":12,"q":"為避免Holstein新生仔牛被動免疫失效（failure of passive immunity），下列有關餵飼初乳的 敘述何者最適當？","opts":["A. Holstein母牛的初乳使用Brix曲折度計（refractometer）檢測數值為18％ Brix，可視為適當品質 的初乳","B. 第一餐的初乳所餵飼的量應為仔牛體重的15％，且在出生後4至6小時內餵飼含有至少150 g IgG的 初乳","C. 初乳餵飼前需經過巴斯德滅菌法處理，以避免病原傳播給新生仔牛","D. 經過冷藏保存56小時的初乳仍可餵飼，但須添加山梨酸鉀（potassium sorbate）作為防腐劑使用"],"ans":2,"exp":"初乳巴斯德滅菌法（60°C/30–60 min）可有效降低病原（約尼氏分枝桿菌、沙門氏菌、支原體等）傳播風險，且不顯著破壞 IgG 活性，是推薦的初乳管理措施。","we":["Holstein 初乳 Brix 折射計≥22% 才視為優質（IgG ≥50g/L），18% Brix 屬於品質不足，此選項錯誤。","第一餐初乳應為仔牛體重的 10%（非 15%），且應在出生後 1–2 小時內（最遲 4 小時）餵飼，體重 15% 的量過大。","（正確）巴斯德滅菌初乳（60°C/30 min 或 60°C/60 min）可減少病原傳播，是最適當的敘述。","冷藏保存初乳建議 24–36 小時內使用，56 小時已超出安全期；山梨酸鉀可用於保存但不是標準建議。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_013","year":2025,"roc_year":114,"session":"","examNo":13,"q":"治療牛酮病採用腎上腺皮質素注射之用意，乃在促進下列何種作用？","opts":["A. 蛋白質新生成作用","B. 糖解作用","C. 糖質新生作用","D. 蛋白質降解作用"],"ans":2,"exp":"腎上腺皮質素（糖皮質素）用於治療牛酮病的機制：促進糖質新生作用（gluconeogenesis）——將胺基酸、丙酮酸等非醣前驅物轉化為葡萄糖，提高血糖濃度，減少脂肪動員，緩解酮症。","we":["蛋白質新生成（protein synthesis）不是糖皮質素治療酮病的主要機轉，反而糖皮質素可促進蛋白質分解提供糖質新生底物。","糖解作用（glycolysis）是葡萄糖分解為丙酮酸的過程，糖皮質素並非直接促進此途徑以治療酮病。","（正確）糖皮質素促進糖質新生（gluconeogenesis），從胺基酸、丙酸等前驅物合成葡萄糖，提升血糖以治療酮病。","蛋白質降解（protein catabolism）雖是糖皮質素的作用之一（提供糖質新生底物），但治療目的是糖質新生而非單純蛋白質降解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_014","year":2025,"roc_year":114,"session":"","examNo":14,"q":"有關乳牛發生乳熱症之敘述，下列何者最適當？","opts":["A. 母牛最常發生於分娩前","B. 本症常發生在3～5產次且低泌乳量之牛隻","C. 大多發生在分娩後48小時內","D. 病牛常見精神正常，前軀正常但後軀無力而無法站立"],"ans":2,"exp":"乳牛乳熱症（產後低血鈣）：最常於分娩後 12–48 小時內發生；好發於 3 產次以上的高泌乳量母牛；臨床三期：I 期激動不安→II 期側臥無力→III 期深度側臥昏迷。","we":["乳熱症最常發生於分娩後（非分娩前），分娩時泌乳啟動造成鈣大量需求而低血鈣，A 錯誤。","乳熱症好發於高泌乳量（非低泌乳量）的 3–5 產次母牛，泌乳量越高鈣需求越大，B 錯誤。","（正確）大多數乳熱症病例在分娩後 48 小時內發生，此時鈣的需求量超過體內調節能力。","II 期乳熱症表現為臥地、頸部 S 形彎曲（不是前軀正常），精神沉鬱而非精神正常，D 錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_015","year":2025,"roc_year":114,"session":"","examNo":15,"q":"下列那一個化學物質添加於日糧中，對預防牛產後血紅素尿（postparturient hemoglobinuria） 最沒有效果？","opts":["A. 磷（phosphorus）","B. 銅（copper）","C. 硒（selenium）","D. 鈣（calcium）"],"ans":3,"exp":"產後血紅素尿（PHU）的主要病因是低磷血症（磷缺乏），輔以銅缺乏造成紅血球脆性增加→溶血→血紅素尿。補充磷（A）和銅（B）有預防效果；硒（C）與谷胱甘肽過氧化酶有關，輔助防止氧化溶血。鈣（D）與 PHU 的發病機制無直接關聯，補充鈣對預防 PHU 最沒有效果。","we":["磷（phosphorus）缺乏是 PHU 的主要病因，日糧補充磷是最有效的預防措施之一。","銅（copper）缺乏導致紅血球超氧化物歧化酶活性下降，造成氧化性溶血，補充銅有預防作用。","硒（selenium）透過穀胱甘肽過氧化酶保護紅血球免受氧化損傷，適量補充有輔助預防效果。","（正確）鈣與 PHU 的溶血機制無直接關聯，補充鈣對預防產後血紅素尿最沒有效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_016","year":2025,"roc_year":114,"session":"","examNo":16,"q":"放牧的肉牛大量食入羊齒蕨植物（bracken fern）後，最可能出現下列何種異常反應？","opts":["A. 心律不整","B. 肝臟衰竭","C. 骨髓功能被抑制","D. 神經症狀"],"ans":2,"exp":"羊齒蕨（bracken fern）含有 ptaquiloside 等毒素，大量攝入後抑制骨髓功能（aplastic anemia），造成全血球減少：血小板減少→出血；嗜中性球減少→繼發感染；紅血球減少→貧血。慢性攝入可引起地方性血尿（enzootic hematuria，膀胱腫瘤）。","we":["心律不整與羊齒蕨中毒無直接關聯；強心苷類植物（如毛地黃）才是典型心律不整病因。","肝臟衰竭與銅中毒、黃麴毒素等有關，不是羊齒蕨慢性中毒的主要臨床表現。","（正確）ptaquiloside 抑制骨髓造血幹細胞，造成再生不良性貧血、出血傾向及免疫抑制。","神經症狀與羊齒蕨急性中毒在馬匹（thiamine 缺乏）有關，但牛隻主要表現為骨髓抑制而非神經症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_017","year":2025,"roc_year":114,"session":"","examNo":17,"q":"一頭10日齡40公斤嚴重下痢的小牛，體溫36.3℃，小牛倒臥且虛弱，眼眶凹陷與眼球達1公分寬， 下列何種治療最適當？","opts":["A. 靜脈注射1公升Ringer's solution加gentamicin","B. 靜脈注射4公升生理鹽水加葡萄糖液","C. 皮下注射1公升生理鹽水加NaHCO 3 及少量的K +","D. 靜脈注射4公升生理鹽水加葡萄糖液、NaHCO 3 及少量的K +"],"ans":3,"exp":"嚴重下痢仔牛（10日齡，眼眶凹陷 1 cm ≈ 10–12% 脫水，倒臥虛弱，體溫 36.3°C 低體溫）：需靜脈輸液（皮下輸液吸收不良），4L 補充脫水量，加葡萄糖（低血糖風險）、NaHCO₃（代謝性酸中毒）及少量 K⁺（低血鉀）。選 D。","we":["IV 1L Ringer's + gentamicin 量不足（需 4L），且 gentamicin 對脫水動物有腎毒性，不是首選。","IV 4L 生理鹽水 + 葡萄糖 缺少碳酸氫鈉（無法矯正嚴重代謝性酸中毒）和鉀離子，不完整。","皮下注射（SC）對倒臥虛弱的仔牛吸收不良，不適合嚴重脫水的緊急補液。","（正確）IV 4L 生理鹽水 + 葡萄糖 + NaHCO₃ + 少量 K⁺ 同時矯正脫水、低血糖、酸中毒和低血鉀，最為完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_018","year":2025,"roc_year":114,"session":"","examNo":18,"q":"在小牛臍帶炎的外科手術中，必須注意是否因臍靜脈發炎而導致何種器官的併發感染？","opts":["A. 肝臟","B. 小腸","C. 膀胱","D. 心臟"],"ans":0,"exp":"臍靜脈（umbilical vein）連接臍部→門脈系統→肝臟。臍靜脈發炎（omphalophlebitis）可沿靜脈蔓延至肝臟，造成肝臟膿瘍（hepatic abscess）。因此臍帶炎手術時需評估肝臟是否受累。","we":["（正確）臍靜脈直接引流至肝臟（經門脈），發炎可向上蔓延造成肝臟膿瘍，術中需觸診評估肝臟。","小腸與臍靜脈無直接解剖連通，臍靜脈發炎不會直接導致小腸感染。","膀胱與臍尿管（urachus）相連，臍尿管感染可影響膀胱，但問題特指「臍靜脈」，非臍尿管。","心臟位於臍靜脈血流下游，細菌性心內膜炎理論上可能，但肝臟是第一個受累器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_019","year":2025,"roc_year":114,"session":"","examNo":19,"q":"乳牛產後發生第四胃往右或往左方向的異位，常取決於發生異位當下的何種因素？","opts":["A. 喜愛側躺的方向","B. 採食日糧的精粗料比","C. 瘤胃的大小","D. 血鈣濃度的高低"],"ans":0,"exp":"第四胃左側或右側異位的方向，與母牛發生異位時偏好側躺的方向有關：若母牛偏好右側側躺，第四胃擴張後傾向往右移（RDA）；偏好左側側躺則較易發生左側異位（LDA），此為最常被引用的決定因素。","we":["（正確）發生異位當下母牛側躺的方向決定第四胃偏向左側或右側移動，LDA 比 RDA 更常見（約 85%）。","日糧精粗料比影響瘤胃 pH 值和蠕動，是 LDA 的危險因子之一，但不是決定左右方向的主要因素。","瘤胃大小（體積）影響腹腔空間，瘤胃萎縮為 LDA 危險因子，但不直接決定左右異位方向。","低血鈣影響第四胃蠕動力，是 LDA 的全身性危險因子，但不是決定左右方向的主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_020","year":2025,"roc_year":114,"session":"","examNo":20,"q":"有關乳牛第四胃左側異位的治療，下列何者對左腹脇部切開大網膜固定術之敘述最不適當？","opts":["A. 使用不可吸收線固定時，可能造成第四胃瘻管","B. 可能造成乳靜脈穿刺","C. 手短的手術者不利進行此術式","D. 視野不佳無法容易接觸第四胃進行排氣及復位(E)一律給分"],"ans":0,"exp":"本題由考選部公告「（E）一律給分」，表示此題答案有爭議，每位考生均獲分。關於左腹脇部切開大網膜固定術（left flank omentopexy）：使用不可吸收縫線可能造成第四胃瘻管；視野有限；手短者不易操作。乳靜脈（milk vein）位於腹中線側，一般不在左脇部手術風險範圍內（此點有爭議）。","we":["使用不可吸收縫線固定大網膜確實可能侵蝕第四胃壁造成瘻管，屬已知手術風險，描述適當。","乳靜脈位於腹部腹側，左脇部切開手術中穿刺乳靜脈的風險有爭議，本題為一律給分題。","手短的手術者在左脇部進行網膜固定術時確實操作困難，此描述屬適當提醒。","左脇部切開視野確實受限，不易直接接觸第四胃進行排氣及復位，此描述適當。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_021","year":2025,"roc_year":114,"session":"","examNo":21,"q":"下列何種治療方式對剛出生仔牛的先天性腕關節彎曲最沒有幫助？","opts":["A. 校正蹄鞋（glue-on shoe）","B. 尺腕屈肌（flexor carpi ulnaris muscle）與外尺肌（ulnaris lateralis muscle）肌腱切斷術","C. 拉伸復健","D. 夾板固定"],"ans":0,"exp":"先天性腕關節彎曲（congenital carpal flexion deformity）的治療包括：物理治療（拉伸復健）、夾板固定、必要時屈肌腱切斷術。「校正蹄鞋（glue-on shoe）」用於矯正蹄部角度問題，對於腕關節彎曲無直接矯正效果，最沒有幫助。","we":["（正確）校正蹄鞋是針對蹄部角度問題的治療工具，對先天性腕關節彎曲幾乎無矯正效果。","嚴重或保守治療無效的腕關節彎曲，可進行屈肌腱切斷術（如尺腕屈肌/外尺肌腱），有臨床效果。","拉伸復健（物理治療）是輕至中度先天性腕關節彎曲的第一線保守治療，有明確幫助。","夾板固定可維持腕關節在正確位置，配合物理治療促進肌腱延展，對治療有幫助。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_022","year":2025,"roc_year":114,"session":"","examNo":22,"q":"眼球後神經阻斷法（retrobulbar block）常使用於反芻動物的眼球手術，關於此技術之敘述，下 列何者錯誤？","opts":["A. 可能造成眼球後出血","B. 可能造成視神經受傷","C. 可能將麻醉劑注入腦膜","D. 對眼球不易造成傷害"],"ans":3,"exp":"眼球後神經阻斷（retrobulbar block）的已知風險包括：眼球後出血（retrorbulbar hemorrhage）、視神經損傷、麻醉劑注入腦膜下腔（needle可沿視神經鞘到達顱內）。因此「對眼球不易造成傷害」是錯誤的——注射針頭本身即可直接損傷眼球，且升高眼內壓。","we":["眼球後出血確實是 retrobulbar block 的常見併發症，注射時血管易破裂，A 描述正確。","視神經損傷確實是 retrobulbar block 的風險，針頭可直接刺傷視神經，B 描述正確。","沿視神經鞘注射麻醉劑可能擴散至蛛網膜下腔（腦脊液），造成廣泛神經阻斷，C 描述正確。","（正確錯誤）retrobulbar block 可直接損傷眼球（針刺穿眼球）並升高眼內壓，「不易造成傷害」為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_023","year":2025,"roc_year":114,"session":"","examNo":23,"q":"於仔牛去勢時，若選擇切開手術去勢術，應使用下圖何種器械切斷精索部位？","opts":["A. 甲","B. 乙","C. 丙","D. 丁"],"ans":0,"exp":"仔牛開放式去勢手術（切開法）應使用 emasculator（去勢鉗）切斷精索，同時達到切斷和壓碎止血的效果。本題需依圖辨識器械。（圖片題，標記待覆核）","we":["（正確依圖判斷）Emasculator（去勢鉗）是切開去勢手術中用於精索的標準器械，兼具切斷與止血功能。","乙圖器械需依圖判斷是否為去勢鉗或其他外科器械。","丙圖器械需依圖判斷功能。","丁圖器械需依圖判斷功能。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_024","year":2025,"roc_year":114,"session":"","examNo":24,"q":"牧場中有母牛懷孕270天，觸診胎兒已死亡，外陰部有暗紅色惡臭分泌物，經施打類固醇及PGF 2α引 產無效後決定進行帝王切開術，母牛因多日未進食體力不佳無法長時間站立，下列那一個開創術式 最不適合本病例？","opts":["A. 左腹脇部切開（left flank approach）","B. 腹中線旁切開（ventral paramedian approach）","C. 腹中線切開（ventral medline approach）","D. 腹外側斜線切開（ventrolateral oblique approach）"],"ans":2,"exp":"母牛體力不佳無法長時間站立，加上胎兒死亡腐敗：腹中線切開（ventral midline）需完全背位保定，對反芻動物有嚴重脹氣/逆流吸入風險，且腐敗羊水可大量汙染手術野；此為體弱反芻動物剖腹產最不適合的術式。","we":["左腹脇部切開可在站立或側躺保定下進行，對體弱母牛相對安全，但站立受限時操作難度增加。","腹中線旁切開同樣需要背位保定，有脹氣/逆流風險，但比正中線切開稍微可行（腹旁側偏移）。","（正確）腹中線切開（ventral midline）需完全背位，反芻動物有脹氣和逆流窒息風險，為最不適合術式。","腹外側斜線切開可在半側臥位進行，適合體力不佳無法站立的母牛，較腹中線安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_025","year":2025,"roc_year":114,"session":"","examNo":25,"q":"仔牛進行臍赫尼亞手術時，切開皮下組織露出赫尼亞環如下圖A後，要從圖B的那一條綠色虛線進行 切創打開腹腔並切除赫尼亞囊最適當？","opts":["A. ①","B. ②","C. ③","D. ④"],"ans":0,"exp":"臍赫尼亞環切開位置：應選擇赫尼亞環的最佳開口線，通常沿赫尼亞環邊緣切開，注意避開血管和重要結構。（圖片題，標記待覆核）","we":["（正確依圖判斷）臍赫尼亞修復應在赫尼亞環安全區域切創打開腹腔，以利完整切除赫尼亞囊。","②號虛線位置需依圖判斷是否合適。","③號虛線位置需依圖判斷。","④號虛線位置需依圖判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_026","year":2025,"roc_year":114,"session":"","examNo":26,"q":"有一放牧綿羊群，部分羊隻突然出現血尿及猝死，剖檢時，於皮下及大網膜等處發現全身出血或鬱 血斑，於膀胱發現血塊，於瘤胃發現乳突狀瘤增生（ruminal papillomatosis），下列何種疾病最 符合上述症狀？","opts":["A. 羊齒蕨中毒","B. 銅中毒","C. 銅缺乏","D. 鉬中毒"],"ans":0,"exp":"血尿、猝死、全身出血/鬱血、膀胱血塊、瘤胃乳突狀瘤增生（ruminal papillomatosis）→高度符合羊齒蕨中毒（bracken fern toxicosis）：ptaquiloside 造成骨髓抑制（再生不良性貧血、血小板減少→出血）+地方性血尿（enzootic hematuria，膀胱腫瘤/乳突瘤）+瘤胃乳突瘤。","we":["（正確）羊齒蕨慢性中毒在綿羊表現為：骨髓抑制（出血）+ 地方性血尿（膀胱乳突瘤）+ 瘤胃乳突狀瘤增生，完全符合本題描述。","銅中毒（急性）表現為黃疸、溶血性貧血、血紅素尿，與瘤胃乳突瘤無關，不符合本題。","銅缺乏造成共濟失調（swayback）或白肌病，不是出血性/血尿表現，不符合本題。","鉬中毒會干擾銅吸收造成繼發性銅缺乏，表現為腹瀉、毛色改變，不會造成血尿和骨髓抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_027","year":2025,"roc_year":114,"session":"","examNo":27,"q":"成年山羊頻繁做出排尿動作但未有尿液排出，觸診可感覺膀胱脹大，尿道乙狀彎曲處未有明顯硬 塊，在沒有其他診斷工具下，建議先嘗試下列何種治療法？","opts":["A. 尿道造口術","B. 陰莖切開術","C. 膀胱切開術","D. 尿道突切除"],"ans":3,"exp":"雄性山羊泌尿道阻塞最常見部位為尿道突（urethral process）。在無診斷工具的情況下，乙狀彎曲處無明顯硬塊，最可能阻塞在尿道突→先嘗試切除尿道突（最簡單、最快速的第一線處置）。若仍無效再考慮尿道造口術或其他手術。","we":["尿道造口術（urethrostomy）是尿道突切除失敗後的次選術式，創傷較大，不是第一步處置。","陰莖切開術（penile transection）是在所有保守治療和尿道造口失敗後的最後手段，創傷最大。","膀胱切開術（cystotomy）可排空膀胱，但不能解除尿道阻塞，通常配合其他術式。","（正確）尿道突切除（amputation of urethral process）是雄性山羊泌尿道阻塞最常見的第一線簡易手術，可在局麻下快速完成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_028","year":2025,"roc_year":114,"session":"","examNo":28,"q":"有關犬隻疾病之敘述，下列何者最適當？","opts":["A. 大型犬在脾臟腫瘤和骨肉瘤的患病率較低","B. 小型犬比較不易罹患慢性胰腺炎","C. 自發性免疫性多發性關節炎（idiopathic immune-mediated polyarthritis）於各年齡層均可發 現，常見於3～7歲犬隻","D. 小型犬隻比較容易有心臟腫瘤"],"ans":2,"exp":"自發性免疫性多發性關節炎（idiopathic immune-mediated polyarthritis, IMPA）可發生於各年齡層犬隻，最常見於中年犬（3–7 歲），品種無顯著好發傾向（但中型至大型犬略多）。","we":["大型犬的脾臟腫瘤（血管肉瘤）和骨肉瘤發生率遠高於小型犬，A 的「較低」描述錯誤。","慢性胰腺炎（chronic pancreatitis）在小型犬（尤其 Miniature Schnauzer）發生率更高，B 錯誤。","（正確）IMPA 可發生於各年齡層，常見於 3–7 歲犬隻，此描述最適當。","心臟腫瘤（如右心房血管肉瘤）好發於大型犬（German Shepherd、Golden Retriever），非小型犬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_029","year":2025,"roc_year":114,"session":"","examNo":29,"q":"肝臟疾病會引起何種營養素缺乏而導致凝血功能障礙？","opts":["A. 維生素K","B. 維生素C","C. 維生素B","D. Fe"],"ans":0,"exp":"肝臟疾病時：①膽汁分泌減少→脂溶性維生素 K 吸收障礙；②肝細胞損傷→無法利用維生素 K 進行凝血因子（II、VII、IX、X）的 γ-羧化→凝血功能障礙（PT/APTT 延長）。","we":["（正確）維生素 K 缺乏（因膽汁減少影響吸收，或肝細胞損傷無法活化維生素 K 依賴性凝血因子）是肝臟疾病引起凝血障礙的主要機制。","維生素 C 缺乏造成膠原蛋白合成障礙（壞血病），不是肝臟疾病凝血障礙的主要原因。","維生素 B 群缺乏影響代謝酶功能，不直接造成凝血因子合成不足。","鐵缺乏（Fe）造成缺鐵性貧血，不是肝臟疾病凝血障礙的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_030","year":2025,"roc_year":114,"session":"","examNo":30,"q":"貓第四期慢性腎病，經過輸液治療後，頭抬不起來，身體變軟弱，最可能的原因為下列何者？","opts":["A. 低血鈉","B. 低血鉀","C. 高血鈣","D. 高血磷"],"ans":1,"exp":"貓第四期慢性腎病（CKD）在靜脈輸液後出現頸部腹側彎曲（頭抬不起來）及全身軟弱：這是低血鉀（hypokalemia）的典型表現。CKD 貓常見低血鉀（因腎臟保鉀能力下降），輸液進一步稀釋血鉀→頸腹屈（ventroflexion）和骨骼肌無力。","we":["低血鈉（hyponatremia）主要表現為神經症狀（嗜睡、癲癇），不是頸部腹屈和軟弱的典型原因。","（正確）低血鉀（hypokalemia）造成骨骼肌無力，貓的特徵性表現為頸部腹屈（ventroflexion）和全身軟弱；CKD 貓輸液後鉀濃度進一步下降。","高血鈣（hypercalcemia）可造成多尿、嗜睡、心律不整，不是此情境的典型表現。","高血磷（hyperphosphatemia）在 CKD 貓很常見，但不直接造成肌肉軟弱和頸部腹屈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_031","year":2025,"roc_year":114,"session":"","examNo":31,"q":"利用側照X光評估犬貓的vertebral heart score（VHS）時，量測時不會用到下列何種定位點？","opts":["A. 心尖","B. 第四胸椎","C. 後腔靜脈","D. 左主支氣管"],"ans":2,"exp":"VHS（Vertebral Heart Score，Buchanan 法）量測：側位 X 光→長軸（long axis）從心臟最腹側（心尖）到頭背側（支氣管分叉/隆突處）→轉移至 T4 起計算椎體數；短軸（short axis）垂直於長軸的最寬處。所用定位點：心尖（A）、T4（B）、左主支氣管（D 隆突端）。後腔靜脈（caudal vena cava）不是標準 VHS 量測的定位點。","we":["心尖（cardiac apex）是 VHS 長軸的末端定位點，量測時必須使用，是必要的定位點。","第四胸椎（T4）是 VHS 椎體長度比較的起始點，為量測時必要的參考定位，不可省略。","（正確）後腔靜脈（CVC）不是標準 VHS 量測的定位點，量測中不會用到後腔靜脈。","左主支氣管（left main bronchus / 隆突）是 VHS 短軸的起始定位點，量測時必須使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_032","year":2025,"roc_year":114,"session":"","examNo":32,"q":"貓因疱疹病毒感染（herpesvirus infection）而引起結膜炎與角膜炎，常會併發那個系統疾病？","opts":["A. 胃炎","B. 上呼吸道疾病","C. 腸炎","D. 肺炎"],"ans":1,"exp":"貓疱疹病毒 1（FHV-1）感染後，除造成眼部疾病（結膜炎、角膜潰瘍）外，最常見的合併症為上呼吸道疾病（鼻炎、鼻竇炎、打噴嚏、鼻分泌物）。FHV-1 是貓上呼吸道感染（URTI）的重要病原之一。","we":["胃炎不是 FHV-1 感染的典型合併症，FHV-1 主要親眼睛和上呼吸道黏膜上皮。","（正確）FHV-1 感染的典型表現為眼部疾病（結膜炎/角膜炎）合併上呼吸道疾病（鼻炎、噴嚏），兩者常同時出現。","腸炎不是 FHV-1 感染的典型合併症；腸道病毒感染（FPV）才主要影響腸道。","肺炎在重症 FHV-1（免疫抑制患者）偶見，但不是 FHV-1 最常見的合併症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_033","year":2025,"roc_year":114,"session":"","examNo":33,"q":"一隻12歲馬爾濟斯犬經由心臟聽診發現第四級收縮期心雜音，且聽診雜音最大強度位置（point of maximal intensity, PMI）在左側心基部（left base）。依據以上結果應診斷為下列那種心臟 病？","opts":["A. 二尖瓣逆流（mitral regurgitation）","B. 三尖瓣逆流（tricuspid regurgitation）","C. 主動脈閉鎖不全（aortic insufficiency）","D. 肺動脈狹窄（pulmonic stenosis）"],"ans":3,"exp":"心雜音定位：左心基部（left base）= 主動脈瓣及肺動脈瓣聽診區。收縮期（systolic）雜音在左基部 → 肺動脈狹窄（pulmonic stenosis）最常見（通常為收縮期噴射型雜音）。主動脈閉鎖不全為舒張期雜音；二尖瓣逆流的 PMI 在左側心尖部；三尖瓣逆流的 PMI 在右側。","we":["二尖瓣逆流（mitral regurgitation）的 PMI 在左側心尖部（left apex），不在左側心基部。","三尖瓣逆流（tricuspid regurgitation）的 PMI 在右側胸壁，不在左側心基部。","主動脈閉鎖不全（aortic insufficiency/regurgitation）是舒張期雜音，而本題為收縮期雜音，不符。","（正確）肺動脈狹窄（pulmonic stenosis）產生收縮期噴射性雜音，PMI 在左側心基部，符合描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_034","year":2025,"roc_year":114,"session":"","examNo":34,"q":"有關犬隻絲球體性腎病造成蛋白尿之處理，在未能確定病因前，不適合使用下列何者？","opts":["A. 血管張力素轉換酶抑制劑（angiotensin-converting enzyme inhibitors）","B. 血管張力素受體阻斷劑（angiotensin receptor blockers）","C. 低劑量aspirin","D. 類固醇（corticosteroids）"],"ans":3,"exp":"犬絲球體性腎病蛋白尿：在確認病因前不宜使用類固醇（corticosteroids），因為若病因為感染性（如心絲蟲、立克次體）或非免疫性（遺傳性、高血壓），類固醇可能加重蛋白尿和腎臟損傷。必須先進行腎臟切片確認免疫介導性後才可使用。","we":["ACE 抑制劑可降低腎小球內壓力和蛋白尿，對各種原因的腎病蛋白尿均有保護效果，可先使用。","ARBs 機制類似 ACE 抑制劑，可降低絲球體蛋白漏出，在確認病因前相對安全。","低劑量 aspirin 用於高凝狀態（腎病症候群易血栓），在確認病因前使用相對安全。","（正確）類固醇在確認非感染性/免疫介導性病因前不應使用，可能惡化感染性或遺傳性腎病，最不適合在未確定病因前給予。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_035","year":2025,"roc_year":114,"session":"","examNo":35,"q":"13歲，已絕育混種公貓，因嘔吐下痢就診，下圖為其腹腔X光影像，箭號所指為何？","opts":["A. 胰臟（pancreas）","B. 脾臟（spleen）","C. 小腸（small intestine）","D. 淋巴結（lymph node）"],"ans":0,"exp":"本題為腹腔 X 光影像辨識題（13 歲貓，嘔吐下痢），箭號所指結構需依圖判斷。老年貓嘔吐下痢伴腹腔腫塊常考慮腸道腫瘤（淋巴瘤）或腸套疊。（圖片題，標記待覆核）","we":["胰臟（pancreas）在貓腹部 X 光通常不易辨識，需超音波確認。","脾臟（spleen）在貓通常位於左中腹部，腫大時可見明顯軟組織影。","小腸（small intestine）環狀分布，有時可見積氣或阻塞改變。","淋巴結（lymph node）腫大在淋巴瘤時常見，有時 X 光可見腹腔腫塊影。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_036","year":2025,"roc_year":114,"session":"","examNo":36,"q":"下列選項何者最不可能引起氣胸？","opts":["A. 肺臟臟層胸膜撕裂（tear in lung involving visceral pleura）","B. 橫膈疝氣（diaphragmatic hernia）","C. 嚴重縱膈氣腫（severe pneumomediastinum）","D. 肺臟腔室樣團塊破裂（rupture of cavitary lung mass）"],"ans":1,"exp":"氣胸（pneumothorax）的常見原因包括：肺臟臟層胸膜撕裂（空氣直接進入胸腔）、嚴重縱膈氣腫（空氣沿筋膜滲入胸膜腔）、空洞性肺腫塊破裂（空洞內氣體釋放）。橫膈疝氣（diaphragmatic hernia）是腹腔臟器疝入胸腔，本身不直接導致氣胸（空氣進入胸膜腔）。","we":["肺臟臟層胸膜撕裂直接使肺內空氣進入胸膜腔，是氣胸的常見直接原因。","（正確）橫膈疝氣是腹腔臟器（腸管、胃、肝等）進入胸腔，但不會直接導致胸膜腔積氣，最不可能引起氣胸。","嚴重縱膈氣腫時，縱膈內氣體可沿胸膜反折滲入胸膜腔，造成繼發性氣胸。","空洞性肺腫塊（如膿瘍、囊腫）破裂後，腔室內氣體直接進入胸膜腔，可造成氣胸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_037","year":2025,"roc_year":114,"session":"","examNo":37,"q":"一隻6歲齡已絕育的雄性短毛家貓，過去1週，持續有厭食、呼吸困難和張口呼吸的病史。身體檢查 時聽診發現心音變小（muffled heart sounds），在胸腔兩邊的腹側面皆聽到混濁的肺音（dull lung sound）。根據檢查結果，懷疑有胸腔積液（pleural effusion）。胸腔穿刺其積液樣本，分 析結果顯示為修飾性漏出液（modified transudate）。下列何者是此貓發生胸腔積液最可能的潛 在病因（underlying cause）？","opts":["A. 鬱血性心衰竭","B. 貓傳染性腹膜炎","C. 低白蛋白血症","D. 肺葉扭轉"],"ans":0,"exp":"修飾性漏出液（modified transudate）：蛋白質中等（2.5–5.5 g/dL），細胞數低至中等。貓雙側胸腔積液 + 心音減弱 + 呼吸困難 + 修飾性漏出液 → 鬱血性心衰竭（CHF）最常見。FIP 造成滲出液（高蛋白）；低蛋白血症造成純漏出液（低蛋白）；肺葉扭轉造成乳糜胸或血胸。","we":["（正確）鬱血性心衰竭（CHF）是貓雙側胸腔積液最常見的原因，積液性質為修飾性漏出液，心音因積液而減弱，與本題描述完全符合。","貓傳染性腹膜炎（FIP）造成的胸腔積液通常為高蛋白滲出液（黃色黏稠），而非修飾性漏出液。","低白蛋白血症造成的胸腔積液通常為純漏出液（低蛋白、低細胞數），而非修飾性漏出液。","肺葉扭轉造成乳糜胸或血性積液，不是修飾性漏出液，且通常為單側。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_038","year":2025,"roc_year":114,"session":"","examNo":38,"q":"最常造成貓動脈血栓症的原因為下列何者？","opts":["A. 心肌病","B. 糖尿病","C. 甲狀腺功能低下","D. 蛋白流失性腎病"],"ans":0,"exp":"貓動脈血栓症（feline aortic thromboembolism, FATE）：最常見原因為心肌病（cardiomyopathy），尤其是肥厚性心肌病（HCM）。左心房擴大→血流停滯→血栓形成→脫落至主動脈分叉（saddle thrombus）→後肢急性截癱（cold/painful hindlimbs）。","we":["（正確）心肌病（尤其 HCM）是貓 FATE 最常見原因，左心房擴大導致血液停滯和血栓形成。","糖尿病可增加血栓風險，但不是貓 FATE 最常見的直接原因；心肌病遠比糖尿病更常見。","甲狀腺功能低下在貓中極罕見，且不是 FATE 的主要原因；甲狀腺功能亢進反而與繼發性心肌病相關。","蛋白流失性腎病可增加高凝狀態，但不是貓 FATE 最常見的原因；心肌病仍占大多數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_039","year":2025,"roc_year":114,"session":"","examNo":39,"q":"在犬貓出現呼吸困難時，可以提供不同的供氧方式，在依據不同方式的建議流量下，下列何種方式 能達到最大氧氣濃度？","opts":["A. transtracheal catheter","B. nasal catheter","C. tracheal tube","D. oxygen case"],"ans":2,"exp":"各氧氣供應方式在建議流量下的最高氧氣濃度：tracheal tube（氣管插管）搭配密閉迴路可達接近 100% FiO₂；transtracheal catheter 約 40–60%；nasal catheter 約 30–50%；oxygen cage 約 40%。氣管插管（tracheal tube）可達最高氧氣濃度。","we":["Transtracheal catheter 可提供 40–60% FiO₂，比 nasal catheter 高，但低於氣管插管。","Nasal catheter 提供約 30–50% FiO₂，取決於流量，低於氣管內插管。","（正確）Tracheal tube（氣管插管）搭配麻醉機密閉迴路可提供接近 100% 的氧氣濃度，為各方式中最高。","Oxygen cage（氧氣箱）通常維持 40% 左右的 FiO₂，低於氣管插管和 transtracheal catheter。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_040","year":2025,"roc_year":114,"session":"","examNo":40,"q":"庫姆氏試驗（Coombs test）通常為檢測體內溶血的抗體是否存在，下列敘述何者最不適當？","opts":["A. 庫姆氏試驗的結果可以用來作為評估免疫性溶血性貧血的預後","B. 敗血症的犬隻庫姆氏試驗可能會出現偽陽性","C. 高丙種球蛋白血症（hypergammaglobulinemia）的犬隻庫姆氏試驗可能會出現偽陽性","D. 人為造成試劑的污染可能會導致檢驗結果出現偽陰性或偽陽性"],"ans":0,"exp":"Coombs 試驗是診斷工具（偵測紅血球表面抗體），不是預後評估工具。Coombs 結果陽性/陰性並不能預測 IMHA 的預後，因此「用 Coombs 結果評估預後」是最不適當的敘述。","we":["（正確）Coombs 試驗是診斷 IMHA 的工具，其結果（陽性或陰性）不能作為疾病預後的指標，此描述最不適當。","敗血症可非特異性地使免疫球蛋白吸附於紅血球表面→Coombs 偽陽性，此描述正確。","高丙種球蛋白血症時多餘的 Ig 可非特異性吸附紅血球→Coombs 偽陽性，此描述正確。","試劑污染（蛋白質汙染等）可干擾反應，造成偽陰性或偽陽性，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_041","year":2025,"roc_year":114,"session":"","examNo":41,"q":"下列何種疾病或血液異常所引起的多渴多尿機制與抗利尿激素（antidiuretic hormone）最不相 關？","opts":["A. 腎上腺功能亢進","B. 解除阻塞後的利尿現象（postobstructive diuresis）","C. 糖尿病","D. 低鉀血症"],"ans":2,"exp":"ADH（抗利尿激素）相關的多渴多尿：腎上腺功能亢進（A）— 皮質醇拮抗 ADH 作用；解除阻塞後利尿（B）— 尿素等溶質滲透利尿，與 ADH 關聯較間接；低血鉀（D）— 干擾 ADH 受體訊號（aquaporin-2 下調）。糖尿病（DM，C）— 高血糖→糖尿→滲透性利尿，完全不依賴 ADH，是與 ADH 最不相關的機制。","we":["腎上腺功能亢進（Cushing's）的高皮質醇直接拮抗 ADH 分泌和腎小管反應，ADH 相關。","解除阻塞後利尿涉及尿素等積聚造成的滲透利尿，與 ADH 關聯較少，但間接有關。","（正確）DM 的多尿因葡萄糖超過腎閾值形成滲透利尿，此機制完全不依賴 ADH，是最不相關者。","低血鉀下調腎臟 aquaporin-2 通道（ADH 信號路徑），造成腎性尿崩，與 ADH 反應性有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_042","year":2025,"roc_year":114,"session":"","examNo":42,"q":"某犬被診斷為急性腎損傷，下列何者最不可能出現？","opts":["A. 腎臟大小可能正常","B. 腎臟大小可能輕微變大","C. 超音波顯示副甲狀腺增大","D. 體重沒有明顯下降"],"ans":2,"exp":"急性腎損傷（AKI）的特點：腎臟大小可正常或輕度腫大（水腫/炎症）；體重短期可能增加（液體瀦留）或無明顯變化；不會出現副甲狀腺增大——副甲狀腺增大（繼發性副甲狀腺功能亢進）是慢性腎病（CKD）長期高磷低鈣刺激的表現，需數月至數年才發展，AKI 不會出現此變化。","we":["腎臟大小正常在 AKI 中可見（尤其腎前性 AKI 早期），A 是可能出現的表現。","腎臟輕微腫大（水腫、充血、炎症滲出）在 AKI 中可見，B 是可能出現的表現。","（正確）副甲狀腺增大是 CKD 長期刺激的結果（慢性低鈣高磷→繼發性副甲功能亢進），AKI 病程過短，最不可能出現。","體重無明顯下降在 AKI 中是合理表現（病程短，尚無顯著肌肉消耗），D 可能出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_043","year":2025,"roc_year":114,"session":"","examNo":43,"q":"下列何項貓肝病的治療，會選擇免疫抑制劑或類固醇製劑？","opts":["A. 嗜中性球性膽管炎","B. 淋巴球性膽管炎","C. 肝臟類澱粉沉著症","D. 肝門脈分流"],"ans":1,"exp":"貓膽管炎/膽管肝炎：嗜中性球性膽管炎（neutrophilic cholangitis）→細菌感染→抗生素治療；淋巴球性膽管炎（lymphocytic cholangitis）→免疫介導性→免疫抑制劑（潑尼松龍、苯丁酸氮芥）治療。","we":["嗜中性球性膽管炎由細菌感染引起，以抗生素（amoxicillin-clavulanate 或 fluoroquinolone）治療，不是免疫抑制劑的適應症。","（正確）淋巴球性膽管炎為免疫介導性，治療選擇免疫抑制劑（prednisolone ± chlorambucil）。","肝臟類澱粉沉著症（hepatic amyloidosis）無特效免疫抑制治療，以支持性療法為主。","肝門脈分流（portosystemic shunt）以手術結紮或低蛋白飲食管理為主，免疫抑制劑無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_044","year":2025,"roc_year":114,"session":"","examNo":44,"q":"關於貓脂肪肝（hepatic lipidosis）的敘述，下列何者最不適當？","opts":["A. 好發於肥胖貓","B. 容易出現多渴（polydipsia）、多尿（polyuria）的症狀","C. 高膽紅素血症（hyperbilirubinemia）是常見的血檢異常","D. 建議給予高蛋白質飲食"],"ans":1,"exp":"貓脂肪肝（hepatic lipidosis）的特徵：肥胖貓（A 正確）、黃疸/高膽紅素血症（C 正確）、建議高蛋白飲食（D 正確）。多渴多尿（PU/PD，B）不是貓脂肪肝的典型症狀——PU/PD 更常見於 DM、CKD、甲狀腺功能亢進等。脂肪肝主要表現為黃疸、食慾廢絕、嗜睡。","we":["好發於肥胖貓是脂肪肝的公認危險因子，肥胖貓在厭食時大量動員脂肪→肝臟負荷超載，A 正確。","（正確）多渴多尿不是貓脂肪肝的典型症狀，PU/PD 主要與 DM、CKD 或甲亢有關；此選項最不適當。","高膽紅素血症（hyperbilirubinemia）是脂肪肝常見的血液學異常，造成臨床黃疸，C 正確。","高蛋白飲食（high-protein diet）是貓脂肪肝的建議飲食，以促進白蛋白合成和脂肪代謝，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_045","year":2025,"roc_year":114,"session":"","examNo":45,"q":"下列何者不是貓甲狀腺功能亢進常見的共病症（common concurrent problems）？","opts":["A. 再生性貧血","B. 肥厚性心肌病","C. 泌尿道感染","D. 高血壓"],"ans":0,"exp":"貓甲狀腺功能亢進常見共病症包括：HCM（肥厚性心肌病）、高血壓（約 25%）、CKD（被高血流量掩蓋）。再生性貧血（regenerative anemia）不是甲亢的典型共病；甲亢貓若有貧血通常為非再生性（慢性病貧血），而非再生性貧血（後者多因血液流失/溶血）。","we":["（正確）再生性貧血（如溶血性貧血或失血後）不是貓甲狀腺功能亢進的典型共病症，為最不常見者。","肥厚性心肌病（HCM）是甲亢貓最常見的心臟共病，甲狀腺激素過多直接造成心肌肥厚。","泌尿道感染在甲亢貓稍有增加（因多尿稀釋尿液），但相比 HCM 和高血壓，不是最典型的。","高血壓在甲亢貓中常見（約 25%），與腎上腺素系統激活有關，是重要共病症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_046","year":2025,"roc_year":114,"session":"","examNo":46,"q":"在臺灣，下列何者不是貓疫苗指引的核心疫苗？","opts":["A. feline leukemia virus","B. feline panleukopenia virus","C. feline calicivirus","D. feline herpesvirus-1"],"ans":0,"exp":"台灣貓疫苗核心疫苗（依 WSAVA 指引）：FPV（貓泛白血球減少症病毒）、FCV（貓卡里西病毒）、FHV-1（貓疱疹病毒 1）。FeLV（貓白血病病毒）在台灣為「非核心疫苗」（non-core），視生活型態風險決定是否施打（室外/多貓環境高風險）。","we":["（正確）FeLV 在台灣屬非核心疫苗，依生活型態風險決定是否施打，不在所有貓的常規核心疫苗清單中。","FPV（貓泛白血球減少症）是台灣貓的核心疫苗，為高度接觸性、致死性病毒，所有貓必打。","FCV（貓卡里西病毒）是台灣貓的核心疫苗，為貓上呼吸道感染的重要病原。","FHV-1（貓疱疹病毒 1）是台灣貓的核心疫苗，為貓 URTI 和角結膜炎的主要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_047","year":2025,"roc_year":114,"session":"","examNo":47,"q":"病貓為2歲，體重4公斤，雄性未節育美國短毛貓，因誤食被殺鼠靈毒殺之老鼠，其臨床症狀低體 溫、血便、口腔黏膜乾燥、吐血、流鼻血，胸部聽診音異常，血容比為18％，主治醫師決定輸血， 獻血貓血容比36％，需要輸多少毫升的獻血貓血液，才能讓病貓血容比回到約為26％？","opts":["A. 20～25","B. 30～35","C. 45～55","D. 70～75"],"ans":2,"exp":"輸血量計算（貓）：Volume(mL) = BW(kg) × 血容量(mL/kg) × [目標 PCV－患者 PCV] ÷ 供血貓 PCV。貓血容量約 60–65 mL/kg。= 4 × 60 × (0.26－0.18) ÷ 0.36 = 240 × 0.08 ÷ 0.36 ≈ 53 mL。此計算值落在 C 選項（45–55 mL）範圍內。","we":["20–25 mL 量不足，以 60 mL/kg 血容量計算結果遠超此範圍。","30–35 mL 量偏少，計算值約 53 mL，此選項低估了所需輸血量。","（正確）以 BW 4 kg × 60 mL/kg × (0.26－0.18) ÷ 0.36 ≈ 53 mL，落於 45–55 mL 範圍，此選項正確。","70–75 mL 量過多，計算值約 53 mL，此選項高估了所需輸血量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_048","year":2025,"roc_year":114,"session":"","examNo":48,"q":"下列何種成分不是常用的prebiotics？","opts":["A. lactulose","B. inulin","C. sucrose","D. fructo-oligosaccharides（FOS）"],"ans":2,"exp":"Prebiotics（益菌生）是不被消化的食物成分，可選擇性促進腸道有益菌（雙歧桿菌、乳酸菌）的生長。常見益菌生：lactulose（乳果糖）、inulin（菊苣纖維）、FOS（果寡糖）、GOS（半乳寡糖）。Sucrose（蔗糖）是一般雙糖，在小腸被完全消化吸收，不到達大腸，不是 prebiotic。","we":["Lactulose（乳果糖）為半合成雙糖，腸道細菌可發酵利用，屬常用益菌生（亦用於肝性腦病治療）。","Inulin（菊苣纖維）是天然多糖，腸道細菌發酵後促進雙歧桿菌增殖，為最常用的益菌生之一。","（正確）Sucrose（蔗糖）= 葡萄糖＋果糖，在小腸完全消化吸收，不具益菌生特性。","FOS（果寡糖/fructo-oligosaccharides）是最廣泛使用的益菌生，選擇性促進有益菌生長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_049","year":2025,"roc_year":114,"session":"","examNo":49,"q":"下列何種必需脂肪酸在貓需由膳食獲得，而犬隻可以自行在體內合成？","opts":["A. 亞麻油酸（linoleic acid）","B. α-次亞麻油酸（α-linolenic acid）","C. 花生四烯酸（arachidonic acid）","D. 牛磺酸（taurine）"],"ans":2,"exp":"貓缺乏足夠的 delta-6-去飽和酶活性，無法有效從亞麻油酸（linoleic acid）合成花生四烯酸（arachidonic acid, AA）。犬隻可自行由亞麻油酸→γ-亞麻油酸→花生四烯酸。因此貓必須從動物性食物攝取 AA，而犬不需要。","we":["亞麻油酸（linoleic acid，C18:2 n-6）對犬貓均為必需脂肪酸，兩者均需從飲食中攝取，非本題答案。","α-次亞麻油酸（α-linolenic acid，C18:3 n-3）對犬貓均為必需脂肪酸，均需飲食補充，非本題答案。","（正確）花生四烯酸（arachidonic acid，C20:4 n-6）：貓缺乏 delta-6-去飽和酶，無法自合成，必須從飲食（動物性食物）獲得；犬可從亞麻油酸合成。","牛磺酸（taurine）是胺基酸而非脂肪酸，雖然貓也必需從飲食攝取（無法足量合成），但題目問的是「必需脂肪酸」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_050","year":2025,"roc_year":114,"session":"","examNo":50,"q":"在營養失衡引起的骨骼疾病中，下列何種營養素最不可能與此相關？","opts":["A. 維生素A","B. 維生素D","C. 鈣","D. 維生素K"],"ans":3,"exp":"營養性骨骼疾病相關營養素：維生素 A（A）過多→骨膜增生/骨刺；維生素 D（B）缺乏→佝僂病/骨軟化，過多→高鈣血症/骨鈣化；鈣（C）缺乏→繼發性甲狀腺功能亢進→骨質疏鬆。維生素 K（D）雖有 K2 參與骨鈣素羧化，但在臨床獸醫學中，維生素 K 缺乏不是常見的骨骼疾病原因，與骨骼病最不相關。","we":["維生素 A 過量（hypervitaminosis A）在貓可造成頸椎/胸椎骨贅形成，與骨骼疾病明確相關。","維生素 D 缺乏導致佝僂病（幼年）或骨軟化（成年），是最重要的營養性骨骼疾病原因之一。","鈣缺乏（鈣磷不平衡）引起繼發性副甲狀腺功能亢進，造成骨質疏鬆，與骨骼疾病直接相關。","（正確）維生素 K（主要 K1 為止血用）臨床上不常見造成骨骼疾病；K2 在骨代謝有輔助作用但在獸醫臨床不是骨骼疾病的主要致因，最不可能相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_051","year":2025,"roc_year":114,"session":"","examNo":51,"q":"有關犬甲狀腺功能低下的敘述，下列何者錯誤？","opts":["A. lymphocytic thyroiditis是常見的致因之一","B. 先天性甲狀腺功能低下會造成侏儒症","C. 易導致毛囊蟲的感染","D. thyroglobulin autoantibody與甲狀腺功能低下的發生無關"],"ans":3,"exp":"甲狀腺球蛋白自體抗體（thyroglobulin autoantibody, TgAA）與犬甲狀腺功能低下確實相關——TgAA 陽性是淋巴球性甲狀腺炎（autoimmune thyroiditis）的免疫標記，在部分甲狀腺功能低下犬隻可測出 TgAA，且 TgAA 陽性犬隻有較高風險發展為甲狀腺功能低下。因此 D 選項「與甲狀腺功能低下發生無關」是錯誤的。","we":["Lymphocytic thyroiditis 確實是犬甲狀腺功能低下最常見的致病原因之一，A 正確。","先天性甲狀腺功能低下（cretinism）確實造成侏儒症（dwarfism/不成比例的矮小），B 正確。","甲狀腺功能低下造成免疫抑制和皮膚屏障功能下降，確實易繼發毛囊蟲（Demodex）感染，C 正確。","（正確錯誤）TgAA（甲狀腺球蛋白自體抗體）與淋巴球性甲狀腺炎及甲狀腺功能低下有關，說「無關」是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_052","year":2025,"roc_year":114,"session":"","examNo":52,"q":"關於兔子的麻醉，下列何者最不適當？","opts":["A. 非侵入性的血壓測量建議使用前肢進行","B. 嗎啡類藥物因嚴重影響腸胃蠕動，不常做為止痛選擇","C. 兔子的潮氣量較犬貓小，是麻醉下常缺氧的原因之一","D. 兔子使用isoflurane常見血管擴張進而引起低血壓"],"ans":1,"exp":"兔子麻醉中，嗎啡類（opioids）藥物如 buprenorphine、butorphanol 是兔子術後/術中止痛的重要選擇；雖然確實可減緩腸蠕動，但臨床上適當使用並不比不止痛更危險。現代兔子麻醉指引明確建議使用 opioids 進行止痛，不應以「影響腸胃蠕動」為由完全避免。","we":["非侵入性血壓測量在前肢（brachial/radial area）適用於兔子，A 正確。","（正確錯誤）Opioids 確實是兔子推薦使用的止痛藥物，雖可輕度抑制腸蠕動，但效益大於風險，「不常作為止痛選擇」的描述最不適當。","兔子潮氣量較犬貓小（約 5–7 mL/kg），是麻醉下易低通氣/缺氧的原因之一，C 正確。","Isoflurane 造成血管擴張和心肌抑制→低血壓，在兔子中確實常見，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_053","year":2025,"roc_year":114,"session":"","examNo":53,"q":"下列何種症狀與發生在犬第7頸椎和第1胸椎間的脊髓壓迫無關？","opts":["A. 前肢出現lower motor neuron（LMN）症狀","B. Horner syndrome","C. 眼球震顫","D. 皮肌反射消失"],"ans":2,"exp":"C7–T1 脊髓壓迫的預期症狀：前肢 LMN 症狀（C7–T1 含前肢 LMN 胞體）；Horner syndrome（T1 含交感神經起始點）；皮肌反射消失（C8–T1 範圍）。眼球震顫（nystagmus）來自前庭/小腦異常，與 C7–T1 脊髓壓迫無解剖學關聯。","we":["C7–T1 包含支配前肢的 LMN 胞體（brachial intumescence），壓迫後出現前肢 LMN 症狀，A 正確。","T1 段含交感神經節前纖維起源（第三眼瞼突出、瞳孔縮小、上瞼下垂），C7–T1 壓迫可見 Horner syndrome，B 正確。","（正確）眼球震顫（nystagmus）為前庭或小腦疾病的表現，與 C7–T1 脊髓壓迫無關，不會出現。","皮肌反射（cutaneous trunci reflex）由 C8–T1 神經支配，C7–T1 壓迫可能使反射消失，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_054","year":2025,"roc_year":114,"session":"","examNo":54,"q":"關於貓自發性骨股頭生長板骨折（spontaneous capital physeal fracture），下列敘述何者最不 適當？","opts":["A. 好發於早期絕育且肥胖的母貓","B. 好發於2歲左右","C. 雙側好發，但不一定同時發生","D. 拍攝髖關節延展腹背照（extended hip ventrodorsal radiograph）及彎曲蛙腿照（flexed radiograph, frog-leg）有助於診斷此疾病"],"ans":0,"exp":"貓自發性骨股頭生長板骨折（SCFE-like）：好發於早期絕育（neutering before skeletal maturity）和肥胖的「公貓」（neutered male cats），不是「母貓」。因睪固酮對骨骼成熟有重要作用，早期去勢延遲骨骺閉合→生長板脆弱。","we":["（正確錯誤）本病好發於早期絕育且肥胖的「公貓（neutered male）」，而非母貓；A 說「母貓」是錯誤的。","好發年齡約 1.5–2 歲，正值骨骺尚未完全閉合且體重逐漸增加的階段，B 正確。","雙側發生（bilateral）是本病特徵，但兩側不一定同時發作，可能相隔數週至數月，C 正確。","延展腹背照（extended VD）和彎曲蛙腿照（frog-leg）均是評估此骨折的重要影像，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_055","year":2025,"roc_year":114,"session":"","examNo":55,"q":"下列何者不是關節鏡檢查的適應症？","opts":["A. 肱二頭肌肌腱發炎","B. 長趾伸肌肌腱（long digital extensor tendon）撕裂傷","C. 棘上肌肌腱病","D. 肱骨髁骨化不全（incomplete ossification of the humeral condyle）"],"ans":2,"exp":"關節鏡適應症（小動物）：肩關節（bicipital tenosynovitis、OCD、biceps tendon pathology）；膝關節（CCL、OCD、meniscal injury）；肘關節（OCD、fragmented coronoid process、IOHC）。棘上肌肌腱病（supraspinatus tendinopathy）為肩關節外肌腱病，位於關節外，關節鏡難以直接評估/治療，不是關節鏡的適應症。","we":["肱二頭肌肌腱發炎（bicipital tenosynovitis）位於肩關節囊內/近端，是肩關節鏡的適應症，A 不是答案。","長趾伸肌肌腱（LDE tendon）撕裂位於膝關節外側（由關節囊起源），可透過膝關節鏡評估，B 不是答案。","（正確）棘上肌肌腱病（supraspinatus tendinopathy）為關節外軟組織疾病，不在關節腔內，不是關節鏡的適應症。","IOHC（incomplete ossification of the humeral condyle）透過肘關節鏡評估骨化情形，D 不是答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_056","year":2025,"roc_year":114,"session":"","examNo":56,"q":"下列有關炎症性關節液性狀的敘述，何者錯誤？","opts":["A. 關節液量增加","B. 置於試管中會凝固","C. 黏度增加","D. 呈混濁狀"],"ans":2,"exp":"炎症性關節液性狀：量增加（A）、置於試管中因含纖維蛋白原而凝固（B）、外觀混濁（D）——以上均正確。黏度（C）在炎症時因透明質酸被白血球酶降解而「下降」，而非「增加」。","we":["炎症使關節囊通透性增加，大量液體滲出→關節液量增加，A 正確。","炎症性關節液含纖維蛋白原，置於試管中確實會凝固（正常關節液不含凝固因子），B 正確。","（正確錯誤）炎症性關節液的黏度「降低」（因透明質酸被白血球分泌的透明質酸酶分解），而非增加；C 說「黏度增加」是錯誤的。","白血球和細菌增加使關節液呈混濁/化膿性外觀，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_057","year":2025,"roc_year":114,"session":"","examNo":57,"q":"下列關於犬貓腎上腺腫瘤的敘述，何者最不適當？","opts":["A. 犬的發生率比貓高","B. 若出現術前高血壓且有侵犯後大靜脈，該腫瘤為嗜鉻細胞瘤（pheochromocytoma）的機率非常大","C. 無功能性的腎上腺腫瘤占大多數","D. 容易轉移，所以臨床上雙側腎上腺常會同時發生腫瘤"],"ans":3,"exp":"腎上腺腫瘤雙側同時發生不是因為「轉移」：雙側腎上腺腫瘤通常為雙側原發性腫瘤（bilateral primary adrenocortical tumors）或雙側腎上腺增生（PDH 造成）；嗜鉻細胞瘤偶見雙側但也是各自原發，而非轉移。D 的因果說明錯誤。","we":["犬腎上腺腫瘤的發生率確實比貓高，A 正確。","術前高血壓合併後腔靜脈侵犯強烈提示嗜鉻細胞瘤（pheochromocytoma），B 正確。","功能性腎上腺腫瘤（如皮質醇瘤、嗜鉻細胞瘤）有臨床症狀；無功能性（incidentaloma）亦存在，C 在部分脈絡中正確。","（正確錯誤）雙側腎上腺腫瘤不是因為「轉移」，而是各自原發性腫瘤或腺體增生；以轉移解釋雙側發生的描述最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_058","year":2025,"roc_year":114,"session":"","examNo":58,"q":"關於犬喉頭麻痺（laryngeal paralysis）的敘述，下列何者正確？","opts":["A. 好發於小型犬","B. 採用杓狀軟骨固定術（arytenoid lateralization）進行手術治療時，建議固定單側即可","C. 通常在動物吐氣時會出現明顯的呼吸雜音","D. 拍攝頸部X光影像可有效確診"],"ans":1,"exp":"犬喉頭麻痺（laryngeal paralysis）：好發於大/巨型犬（拉不拉多、黃金獵犬、西伯利亞哈士奇）；手術標準術式為單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）；雜音以吸氣性喘鳴為主；確診需內視鏡觀察杓狀軟骨在淺麻醉下的運動。","we":["喉頭麻痺好發於大/巨型犬，小型犬發生率低，A 說「好發於小型犬」錯誤。","（正確）單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）是推薦術式，固定單側以改善通氣同時降低吸入性肺炎風險。","喉頭麻痺的呼吸雜音為吸氣性喘鳴（inspiratory stridor），C 說「吐氣時」是錯誤的。","確診需要喉部內視鏡在淺度麻醉下觀察杓狀軟骨運動；頸部 X 光無法確診喉頭麻痺，D 錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_059","year":2025,"roc_year":114,"session":"","examNo":59,"q":"下列何種方式最適合用於治療胸腔氣管塌陷的狗？","opts":["A. 單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）","B. 放置氣管內支架","C. 永久性氣管造口","D. 軟顎部分切除整型術"],"ans":1,"exp":"胸腔氣管塌陷（intrathoracic tracheal collapse）：因胸腔段氣管在體外無法手術放置外支架環，故選擇「腔內氣管支架（intraluminal tracheal stent）」以微創方式（透視/內視鏡引導）置入，是目前胸腔段氣管塌陷的首選治療。","we":["杓狀軟骨側方固定術用於喉頭麻痺，不適用於氣管塌陷治療。","（正確）胸腔段氣管塌陷因手術不易到達，放置腔內氣管支架（intraluminal stent）是首選微創治療方案。","永久性氣管造口（permanent tracheostomy）僅用於頸部段氣管重度塌陷，不適用於胸腔段病變。","軟顎部分切除整型術用於短頭型犬的軟顎延長，與氣管塌陷無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_060","year":2025,"roc_year":114,"session":"","examNo":60,"q":"下列何種犬骨科疾病和退化的關聯性最高？","opts":["A. 前十字韌帶斷裂（cranial cruciate ligament rupture）","B. 分離性軟骨炎（osteochondritis dissecans）","C. 寰樞椎半脫位（atlantoaxial subluxation）","D. 膝蓋骨異位（patellar luxation）"],"ans":0,"exp":"前十字韌帶斷裂（cranial cruciate ligament rupture, CCLR）是犬最常見的膝關節疾病，且幾乎必然導致進行性骨關節炎（OA/DJD）。無論是否手術，膝關節退化持續進展，是犬骨科疾病中與退化關聯性最高的疾病。","we":["（正確）CCL 斷裂幾乎必然導致膝關節進行性骨關節炎，是犬骨科疾病中與退化關聯最高的疾病。","OCD（分離性骨軟骨炎）造成關節軟骨損傷，可導致繼發性 OA，但不如 CCL 斷裂那樣普遍必然進展。","寰樞椎半脫位（atlantoaxial subluxation）主要造成神經壓迫，與關節退化關聯性較低。","膝蓋骨異位（patellar luxation）可導致 OA，但嚴重程度和普遍性不如 CCL 斷裂。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_061","year":2025,"roc_year":114,"session":"","examNo":61,"q":"下列用於促進骨癒合的犬貓骨移植物（bone graft）的敘述，何者最不適當？","opts":["A. 在臨床上可用的骨移植物中，自體海綿骨（cancellous bone autograft）效果最佳","B. 常用於保肢手術（limb-sparing procedures）的骨移植物為自體皮質骨（cortical autograft）","C. 肋骨常作為自體皮質骨（cortical autograft）的來源","D. 和異體骨移植物相比，自體骨移植物具有較佳的骨發生（osteogenesis）能力"],"ans":1,"exp":"保肢手術（limb-sparing surgery，如骨肉瘤切除後骨重建）通常使用「自體皮質骨」在犬不切實際（太長/供體部位傷害大），實際上使用「異體皮質骨（cortical allograft）」作為結構性支撐。B 說「自體皮質骨」用於保肢手術是錯誤的。","we":["自體海綿骨（cancellous bone autograft）含活細胞、生長因子和骨架，骨癒合效果最佳，A 正確。","（正確錯誤）保肢手術使用的是「異體皮質骨（cortical allograft）」提供結構支撐，而非自體皮質骨；使用自體皮質骨會造成嚴重供體部位並發症，B 最不適當。","肋骨可作為自體皮質骨的供體來源（適合板狀皮質骨需求），C 正確。","自體骨移植含活骨細胞（osteoblasts）→骨生成能力優於無活細胞的異體骨，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_062","year":2025,"roc_year":114,"session":"","examNo":62,"q":"下列犬的骨疾病中，統計上何者發生年齡最晚？","opts":["A. 股骨頭缺血性壞死（Legg-Calvé-Perthes disease）","B. 肥大型骨形成不全（hypertrophic osteodystrophy）","C. 肥大型骨病（hypertrophic osteopathy）","D. 全骨炎（panosteitis）"],"ans":2,"exp":"犬各骨病發病年齡：Legg-Calvé-Perthes 病（股骨頭缺血性壞死）= 4–11 月；HOD（肥大型骨形成不全）= 2–8 月；全骨炎（panosteitis）= 5–18 月。肥大型骨病（hypertrophic osteopathy）繼發於胸腔/腹腔腫塊（如肺腫瘤），通常發生於成年至老年犬，發病年齡最晚。","we":["Legg-Calvé-Perthes 病通常在 4–11 月齡發病（小型犬，股骨頭血供障礙）。","HOD（肥大型骨形成不全）發生於 2–8 月齡的快速生長大型犬幼犬，發病年齡最早之一。","（正確）肥大型骨病（hypertrophic osteopathy）繼發於胸腔/腹腔腫塊（肺腫瘤、膿胸等），通常在中老年犬發病，發病年齡最晚。","全骨炎（panosteitis）通常在 5–18 月齡的大型犬發病（自限性骨髓炎），屬幼犬疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_063","year":2025,"roc_year":114,"session":"","examNo":63,"q":"下列那一種輸液最不適合用於術中大量出血時的急救？","opts":["A. Ringer's solution","B. 6％ hydroxyethyl starch","C. 7.5％ NaCl solution","D. 0.45％ NaCl solution"],"ans":3,"exp":"急救術中大量出血（失血性休克）需快速恢復血容量和攜氧能力：Ringer's solution（A）等張晶體、6% HES（B）膠體、7.5% NaCl（C）高張鹽水均可用於容量復甦。0.45% NaCl（D）為低張溶液：進入血管後水分向細胞內移動，無法有效維持血管內容量，甚至加重細胞水腫，最不適合用於急救出血。","we":["Ringer's solution（等張電解質液）為標準外科補液，用於出血急救安全有效。","6% hydroxyethyl starch（HES）為膠體，可維持血漿膠體滲透壓，適用於出血急救擴容。","7.5% NaCl（高張鹽水）小劑量即可快速擴張血管內容量（osmotic draw），用於失血性休克。","（正確）0.45% NaCl 為低張溶液，進入體內後水分向細胞內移動，不能有效擴張血管容量，最不適合術中大量出血急救。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_064","year":2025,"roc_year":114,"session":"","examNo":64,"q":"犬發生會陰赫尼亞時，最常見於下列何種肌肉的萎縮？","opts":["A. 外肛門括約肌","B. 提肛肌","C. 半腱肌","D. 內閉鎖肌"],"ans":1,"exp":"犬會陰赫尼亞（perineal hernia）：骨盆橫膈（pelvic diaphragm）包括提肛肌（levator ani）和尾骨肌，其中「提肛肌（levator ani）」的萎縮/退化是犬會陰赫尼亞最核心的病因，形成肛門旁的肌肉缺損使腹腔臟器疝入。","we":["外肛門括約肌萎縮可能影響括約肌功能，但主要造成會陰赫尼亞的是提肛肌而非外括約肌。","（正確）提肛肌（levator ani）萎縮退化是犬會陰赫尼亞最主要的原因，形成骨盆橫膈缺損。","半腱肌為後肢肌肉，與會陰赫尼亞發生無直接關聯。","內閉鎖肌可用於修復會陰赫尼亞（obturator muscle transposition），但其萎縮不是本病的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_065","year":2025,"roc_year":114,"session":"","examNo":65,"q":"在標準外科手術操作過程中（正常手術時間無不當延長且保持無菌操作），關於造成手術部位感染 的危險因子敘述，下列何者最適當？","opts":["A. 術區剃毛清理範圍愈大，術前愈早進行且消毒液刷洗次數至少4次以上愈不容易造成感染","B. 預防性抗生素除了術中每90分鐘給予外，術後仍應持續給予1週，以減少感染機率","C. 麻醉本身與感染風險無關，主要決定於手術時間","D. 手術時間每增加1小時，手術部位感染機率風險加倍"],"ans":3,"exp":"手術部位感染（SSI）危險因子：手術時間每增加 1 小時，SSI 風險大約加倍（手術時間是最重要的可控危險因子之一）；術前剃毛應在手術前不超過 1 小時（過早剃毛增加皮膚菌落）；預防性抗生素術後不需常規給予 1 週（短程或單次）；麻醉本身亦有輕度免疫抑制效應。","we":["術區剃毛應儘量接近手術時間（不超過 1 小時前），過早剃毛反而增加 SSI 風險，A 描述錯誤。","預防性抗生素建議術中每 90–120 分鐘補充一次，術後通常不需持續給藥 1 週，B 描述錯誤。","麻醉藥物確實有輕度免疫抑制作用，且麻醉時間與手術時間高度相關，C 說「麻醉與感染風險無關」不完全正確。","（正確）每增加 1 小時手術時間，SSI 風險約加倍，是最有循證依據的 SSI 危險因子描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_066","year":2025,"roc_year":114,"session":"","examNo":66,"q":"下列有關進行腸切開或腸吻合後的腸道縫合方法，何者最不適當？","opts":["A. 雙層內翻縫合法","B. 簡單間斷縫合法","C. 簡單連續縫合法","D. 改良式Gambee縫合法"],"ans":0,"exp":"腸道吻合術縫合方法：目前推薦「單層外翻或對合縫合」（簡單間斷、簡單連續、Gambee 等），可維持腸管腔徑和血供。「雙層內翻縫合法（如 Cushing + Lembert）」過度內翻腸壁→嚴重縮窄腸腔→梗阻風險，同時內翻組織供血不良，是最不適合的腸吻合方法。","we":["（正確）雙層內翻縫合法造成腸腔嚴重狹窄（stenosis）和組織壞死風險，是腸吻合最不適合的縫合方式。","簡單間斷縫合法（simple interrupted）是腸道吻合的標準術式，術後腸壁對合良好，B 適合。","簡單連續縫合法（simple continuous）在有經驗的外科醫師手中可用於腸吻合，C 可接受。","改良式 Gambee 縫合法為單層全層對合縫合，是推薦的腸吻合技術之一，D 適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_067","year":2025,"roc_year":114,"session":"","examNo":67,"q":"下列有關犬橫膈裂孔赫尼亞（hiatal hernia）的敘述，何者最不適當？","opts":["A. 大多為後天創傷造成","B. 不一定會有臨床症狀","C. 手術修復步驟包括hiatal reduction、esophagopexy和left-sided fundus gastropexy","D. 術後通常預後佳"],"ans":0,"exp":"犬橫膈裂孔赫尼亞（hiatal hernia）：大多為「先天性（congenital）」，好發於短頭型犬（French Bulldog、Pug 等），因上呼吸道阻塞造成胸腔負壓增大，加上先天性裂孔發育異常。A 說「大多為後天創傷造成」是錯誤的。","we":["（正確錯誤）犬橫膈裂孔赫尼亞大多為先天性（congenital），不是後天創傷（traumatic）造成；A 的描述最不適當。","部分裂孔赫尼亞患犬無明顯症狀（尤其小的 Type I 滑動型），不一定有臨床表現，B 正確。","手術修復包括 hiatal reduction（將胃放回腹腔）、esophagopexy 和 left-sided fundus gastropexy，C 正確。","術後預後通常良好，尤其年輕犬隻，症狀顯著改善，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_068","year":2025,"roc_year":114,"session":"","examNo":68,"q":"下列關於甲狀腺切除術可能併發症的敘述，何者最不適當？","opts":["A. 呼吸困難（dyspnea）","B. 低血磷（hypophosphatemia）","C. 霍納式症候群（Horner syndrome）","D. 喉頭輕癱（laryngeal paralysis）"],"ans":1,"exp":"甲狀腺切除術可能的已知併發症：呼吸困難（氣管塌陷/喉頭麻痺/水腫）、Horner syndrome（頸部交感鏈損傷）、喉頭輕癱（RLN 損傷）、低血鈣（副甲狀腺摘除）。「低血磷（hypophosphatemia）」不是甲狀腺切除術的典型併發症；應是「低血鈣（hypocalcemia）」才對。","we":["呼吸困難可因喉頭水腫、RLN 雙側損傷或氣管塌陷，是甲狀腺切除術的已知嚴重併發症，A 正確。","（正確錯誤）低血磷（hypophosphatemia）不是甲狀腺切除術的典型併發症；典型為低血鈣（副甲腺受損），B 的描述不適當。","Horner syndrome 可因手術損傷頸部交感神經鏈（sympathetic trunk），是已知術後併發症，C 正確。","喉頭輕癱（laryngeal paralysis）因 RLN（喉返神經）術中損傷，是甲狀腺切除術的已知風險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_069","year":2025,"roc_year":114,"session":"","examNo":69,"q":"使用dopamine agonist讓懷孕1個月的母狗終止懷孕的原理為何？","opts":["A. 屬於prolactin inhibitor的作用","B. 競爭progesterone receptor","C. 使輸卵管水腫","D. 誘發estradiol作用後的連續反應"],"ans":0,"exp":"Dopamine agonists（如 cabergoline、bromocriptine）終止妊娠的機制：多巴胺作用於垂體前葉→抑制泌乳素（prolactin）分泌（prolactin inhibitor）→狗在黃體期高度依賴泌乳素維持黃體功能和助孕素（progesterone）分泌→泌乳素下降→黃體功能衰退→助孕素降低→妊娠終止。","we":["（正確）Dopamine agonist 屬於 prolactin inhibitor，藉由抑制垂體泌乳素分泌，間接使犬的黃體退化、助孕素下降，終止妊娠。","競爭助孕素受體（progesterone receptor antagonist）是 aglepristone（RU486 類似物）的機制，不是 dopamine agonist 的作用方式。","使輸卵管水腫不是多巴胺致效劑的藥理機制，此描述無科學依據。","誘發 estradiol 的連續反應不是 dopamine agonist 的主要作用途徑，與終止妊娠機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_070","year":2025,"roc_year":114,"session":"","examNo":70,"q":"牛隻進行碎胎術時，下列敘述何者最不適當？","opts":["A. 母體站立時對母體較安全","B. 母體站立時對施術者最為便利","C. 施術過程應儘量減少污染產道","D. 碎胎線鋸於每一次切割後應檢視是否要更換"],"ans":1,"exp":"牛隻碎胎術（fetotomy）：母體站立時對母體較安全（減少脹氣和異常臥位風險，A 正確）；但「對施術者最便利」是有問題的——施術者需彎腰從後方進行，若母體站立，操作空間受限，實際上側臥位有時對施術者更為方便，B 的說法最不適當。","we":["母體站立進行碎胎術對母體較安全（減少脹氣風險、利於體液引流），A 正確。","（正確錯誤）母體站立對施術者未必是「最便利」的姿勢；側臥位有時提供更好的視野和操作空間，B 說「最便利」為最不適當的描述。","碎胎過程應盡量保持無菌操作，減少產道汙染以降低母體感染風險，C 正確。","碎胎線鋸（wire saw）每次切割後需檢視是否需要更換，避免斷鋸造成危險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_071","year":2025,"roc_year":114,"session":"","examNo":71,"q":"有關牛胎兒木乃伊變性之敘述，下列何者錯誤？","opts":["A. 妊娠中期後胎兒死亡","B. 卵巢之黃體消失","C. 中子宮動脈缺強搏動","D. 子宮壁薄缺收縮性"],"ans":1,"exp":"胎兒木乃伊變性（fetal mummification）：胎兒死亡後脫水成木乃伊→沒有正常胎盤→無法釋放 PGF2α→黃體（CL）持續存在（not disappear）→子宮頸關閉、妊娠維持。中子宮動脈搏動消失（因無活胎）；子宮壁薄且缺乏收縮性，為典型特徵。B 說「黃體消失」是錯誤的。","we":["妊娠中期後胎兒死亡且無法排出時，才發生木乃伊變性（早期死亡會被吸收），A 正確。","（正確錯誤）木乃伊變性時，黃體因缺乏前列腺素刺激而「持續存在」，而非消失；B 說「黃體消失」為錯誤的敘述。","中子宮動脈（middle uterine artery）因無活胎血液供應需求，缺乏正常的強搏動（fremitus），C 正確。","木乃伊化過程使子宮壁因長期維持狀態而薄化，缺乏正常收縮性，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_072","year":2025,"roc_year":114,"session":"","examNo":72,"q":"治療一頭體重約500公斤的乳牛發生產後低血鈣的乳熱症狀時，靜脈輸液應含多少公克的鈣？","opts":["A. 2～6","B. 80～120","C. 8～13","D. 30～36"],"ans":2,"exp":"乳熱症（低血鈣）靜脈補鈣標準：每頭 500 kg 乳牛靜脈注射 400–500 mL 的 23% 硼葡萄糖酸鈣（calcium borogluconate），其中元素鈣含量約 8–13 克。（23% borogluconate × 400 mL ÷ 23 MW ratio ≈ 9–13 g elemental Ca）","we":["2–6 g 鈣量過低，不足以有效矯正 500 kg 乳牛的低血鈣症。","80–120 g 鈣量過高，超量靜脈注射可造成高血鈣和心臟毒性，有致死風險。","（正確）每頭 500 kg 乳牛靜脈注射約 400–500 mL 的 23% 硼葡萄糖酸鈣，元素鈣量約 8–13 g，此為標準治療劑量。","30–36 g 鈣量偏高，超出標準治療劑量，可能造成心律不整和高血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_073","year":2025,"roc_year":114,"session":"","examNo":73,"q":"針對下圖懷孕母馬redbag的敘述，下列何者最不適當？","opts":["A. 是由於尿囊絨毛膜過早脫離所導致的現象","B. 此現象多為非感染性原因所致","C. 此現象並非產科緊急事件，可以等待至動物分娩時一併處置","D. 胎兒在此狀況下容易缺氧"],"ans":2,"exp":"Red bag（尿囊絨毛膜早期脫離）是「產科緊急事件」：絨毛膜尿囊膜從子宮壁提前分離，切斷胎兒氧氣供應，若不立即切開並分娩，胎兒在 3–5 分鐘內即可缺氧死亡。C 說「非緊急事件，可以等待」是最不適當的描述。","we":["Red bag 是因絨毛膜尿囊膜（chorioallantois）提前從子宮內膜脫離，A 正確。","Red bag 多為非感染性原因（高草木鹼/fescue 毒素、特發性），也可因感染而發生，B 正確。","（正確錯誤）Red bag 是真正的產科急診，必須立即切開外露的絨毛膜並幫助分娩，不可等待，C 描述最不適當。","絨毛膜尿囊膜提前分離使胎兒失去氧氣交換，高度缺氧風險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_074","year":2025,"roc_year":114,"session":"","examNo":74,"q":"下列何種動物的動情週期（cyclic activity）不受光照時間長短影響？","opts":["A. 飼養在北半球的乳牛","B. 飼養在南半球的小鼠","C. 飼養在北半球的貓","D. 飼養在南半球的駱駝"],"ans":0,"exp":"光照週期（photoperiod）對動情週期的影響：馬（長日照繁殖）、綿羊/山羊（短日照繁殖）、貓（長日照）均受光照影響。乳牛（dairy cattle）為全年多次發情（polyestrous），其動情週期不受光照時間長短顯著影響，一年四季均可發情配種。","we":["（正確）飼養在北半球的乳牛為全年多次發情（polyestrous），動情週期不受季節性光照變化的顯著影響。","小鼠通常被認為在實驗室條件下受光暗週期影響（12h:12h 可保持正常發情），但在某些條件下，飼養環境的人工光照可以主導其發情週期，故不是「不受光照影響」的最佳例子。","北半球的貓為長日照季節性繁殖動物（春至夏季發情），動情週期明顯受光照影響，C 不符合題意。","駱駝是季節性繁殖動物，受光照和溫度影響，並非全年多次發情，D 不符合題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_075","year":2025,"roc_year":114,"session":"","examNo":75,"q":"以3.5 MHz探頭檢查一頭配種3個月的母山羊，子宮超音波影像顯示如下圖，下列何種治療方法最適當？","opts":["A. 注射性腺素釋放激素（GnRH），7天後再注射prostaglandin F 2α","B. 置入progesterone陰道塞劑","C. 注射prostaglandin F 2α，12天後再注射一次prostaglandin F 2α","D. 注射estradiol，7天後注射prostaglandin F 2α"],"ans":0,"exp":"本題為母山羊子宮超音波影像判讀，需依圖確認是否懷孕（正常發育的胚胎/胎兒），或是否為子宮積液/黃體囊腫等異常。（圖片題，標記待覆核）","we":["注射 GnRH 後 7 天再注射 PGF2α 為 Ovsynch 一部分；若影像為正常懷孕則不應施打，此選項需依圖判斷。","Progesterone 陰道塞劑用於同期發情誘導，若已確認懷孕則不需要，需依圖判斷。","注射 PGF2α × 2（間隔 12 天）為同期發情方案之一，需依圖判斷是否適用。","Estradiol + PGF2α 也是同期發情方案，需依圖確認子宮狀態後判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_076","year":2025,"roc_year":114,"session":"","examNo":76,"q":"請依序回答下列3題： 某一牧場每7天會請獸醫師為乳牛進行繁殖器官檢查，在一次檢查當中，一頭分娩後35天的母牛， 經直腸超音波檢查子宮無任何異常，雙側卵巢上並無任何功能性組織，下列何種處置對於當天檢查 結果最不適當？","opts":["A. 給予性腺素釋放激素致效劑（GnRH agonist）","B. 給予性腺素釋放激素致效劑（GnRH agonist）及陰道內助孕素（intravaginal progesterone）釋 放裝置","C. 不進行任何處置，7天後再次檢查","D. 給予前列腺素F 2α致效劑（prostaglandin F 2α agonist）"],"ans":3,"exp":"分娩後 35 天的母牛，雙側卵巢無任何功能性組織（無黃體、無優勢濾泡）＝卵巢靜止/無動情週期狀態（ovarian inactivity）。此時給予 PGF2α 完全無效，因為 PGF2α 的作用機制是溶解「已存在的黃體」，但此牛無黃體可溶解，為最不適當的處置。","we":["給予 GnRH agonist 可嘗試誘導排卵或刺激濾泡發育，雖效果有限但不是最不適當。","GnRH + 陰道內助孕素裝置（如 CIDR）可促進濾泡發育和黃體前期建立，有合理的生理基礎。","不進行任何處置，7 天後再次檢查，是合理且保守的選擇（35 天仍在正常過渡期範圍內）。","（正確）PGF2α agonist 的作用為溶解黃體，無黃體時完全無效；給予 PGF2α 是此情境下最不適當的處置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_077","year":2025,"roc_year":114,"session":"","examNo":77,"q":"下列何種診斷最適合？","opts":["A. 一般正常濾泡","B. 濾泡囊腫（follicular cyst）","C. 黃體囊腫（luteal cyst）","D. 囊腫性黃體（cystic corpus luteum）"],"ans":3,"exp":"本題為上題情境的追蹤，需依超音波影像判斷卵巢結構診斷。若影像顯示為囊腫性黃體（cystic corpus luteum），其特徵為中心有液態空腔但邊緣有明顯黃體組織（能分泌助孕素）。（圖片題，標記待覆核）","we":["一般正常濾泡直徑通常小於 20 mm，無需特殊治療，可等待自然排卵。","濾泡囊腫（follicular cyst）壁薄、無黃體組織，超音波下呈完全無回音的大型液體結構（>25 mm）。","黃體囊腫（luteal cyst）有薄層黃體組織，可分泌少量助孕素，超音波下有稀薄回音邊緣。","（正確）囊腫性黃體（cystic corpus luteum）為黃體內含有液態空腔，仍有功能性黃體組織，可分泌助孕素，是正常或半正常的卵巢結構。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_078","year":2025,"roc_year":114,"session":"","examNo":78,"q":"承上題，針對此檢查結果，有關當天給予的處置下列何者最不適當？","opts":["A. 給予性腺素釋放激素致效劑（GnRH agonist）","B. 給予前列腺素F 2α致效劑（prostaglandin F 2α agonist）","C. 給予人類絨毛膜促性腺激素（human chorionic gonadotrophin）","D. 同時給予性腺素釋放激素致效劑（GnRH agonist）及前列腺素F 2α致效劑（prostaglandin F 2α agonist）"],"ans":1,"exp":"若 Q77 診斷為囊腫性黃體（cystic corpus luteum，有功能），PGF2α agonist 可溶解黃體→使週期繼續，是有效的處置；GnRH 或 hCG 對已有功能性黃體的情況不是首選（無法再誘導排卵）。單獨使用 PGF2α 或 GnRH + PGF2α 組合均有合理性。（本題答案依 Q77 圖片確認後判斷，標記待覆核）","we":["GnRH agonist 對囊腫性黃體的治療效果有限（LH surge 已無濾泡可排卵），但可配合其他藥物。","（正確）PGF2α agonist 可溶解囊腫性黃體，使週期繼續，是針對功能性黃體結構最直接有效的處置；單獨給予 PGF2α 是最合理的。","hCG 作用類似 LH，對囊腫性黃體（已有 CL）效果不明顯，不是最不適當。","同時給予 GnRH + PGF2α 在臨床上有合理性（Ovsynch 方案），不是最不適當的選擇。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_079","year":2025,"roc_year":114,"session":"","examNo":79,"q":"下列何種內泌素，可促使睪丸的賽托利細胞（Sertoli cell）分泌雄性素結合蛋白（androgen binding protein）？","opts":["A. 腎上腺皮質刺激素（ACTH）","B. 濾泡刺激素（FSH）","C. 黃體激素（LH）","D. 睪固酮（testosterone）"],"ans":1,"exp":"賽托利細胞（Sertoli cells）分泌雄性素結合蛋白（androgen binding protein, ABP）的主要刺激素為「FSH（濾泡刺激素）」。FSH 與賽托利細胞上的 FSH 受體結合→cAMP 訊號→促進 ABP 合成分泌。睪固酮雖可輔助，但 FSH 是主要調節因子。","we":["ACTH 主要刺激腎上腺皮質分泌皮質醇，不直接調控賽托利細胞功能。","（正確）FSH（濾泡刺激素）是刺激賽托利細胞分泌 ABP 的主要荷爾蒙，ABP 幫助維持高濃度睪固酮在曲細精管內以支持精子發生。","LH 主要作用於萊氏細胞（Leydig cells）刺激睪固酮分泌，不是直接刺激賽托利細胞分泌 ABP 的主要因素。","睪固酮雖可輔助支持賽托利細胞功能（協同 FSH），但 FSH 才是促進 ABP 合成的主要刺激素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_080","year":2025,"roc_year":114,"session":"","examNo":80,"q":"下列何種雄性動物的flehmen response，不包含上嘴唇翻折（curly of the upper lip）？","opts":["A. 綿羊","B. 牛","C. 馬","D. 駝科動物"],"ans":3,"exp":"Flehmen response（費洛蒙反應）在大多數哺乳動物表現為上嘴唇翻折（curling of upper lip）使費洛蒙進入鋤鼻器官（VNO）。駝科動物（camelids：駱駝、羊駝、大羊駝等）的 flehmen response 不包含典型的上嘴唇翻折，其行為表現較為不明顯或以不同方式表現。","we":["綿羊雄性在感知母羊費洛蒙時，會展現包含上嘴唇翻折的 flehmen response，A 不是答案。","牛（公牛）也展現典型的上嘴唇翻折 flehmen response，B 不是答案。","馬（種馬）的 flehmen response 是最典型的動物之一，明顯的上嘴唇後翻，C 不是答案。","（正確）駝科動物（camelids）的 flehmen response 不包含典型的上嘴唇翻折，其鋤鼻器官結構和費洛蒙感知方式與其他哺乳動物不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_001","year":2024,"roc_year":113,"session":"","examNo":1,"q":"馬主人表示有一匹馬持續5週呈現間歇性發燒（>38.6°C），精神及食慾皆差，心跳及呼吸次數在正常值範圍\r  或稍高，腸蠕動音減少，直腸觸診無異常，血檢白血球總數偏高，下列疾病何者可能性最低？","opts":["A. 細菌性肺炎","B. 慢性腹膜炎","C. 細菌性心內膜炎","D. 十二指腸炎及近端小腸炎（duodentitis-proximal jejunitis）"],"ans":3,"exp":"問「最不可能」的診斷。犬隻間歇性發燒5週合併WBC升高，最不可能是十二指腸炎（近端小腸炎），因此類腸道發炎通常不會引起持續高燒。蜱媒疾病（tick-borne disease）、心內膜炎（endocarditis）、骨髓炎（osteomyelitis）等感染源較常造成持續間歇性發燒。","we":["蜱媒疾病（如艾利希體症）可引起週期性發燒及白血球變化，是鑑別診斷之一。","心內膜炎細菌菌血症可造成間歇性發燒及WBC升高，應列入鑑別。","骨髓炎或深部感染可引起持續性發燒，需考慮。","十二指腸炎（近端小腸炎）屬腸道疾病，通常以嘔吐、腹痛為主，不常引起持續性高燒，故為最不可能診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_002","year":2024,"roc_year":113,"session":"","examNo":2,"q":"一匹馬疑似前肢蹄葉炎時，以放射線學檢查時，下列何種照射方向最適合用於觀察蹄骨角度是否旋轉，並可\r  用以測量其角度？","opts":["A. lateromedial view","B. dorsopalmar view","C. dorsoproximal-palmarodistal oblique（upright pedal）view","D. flexed dorsolateral-palmaromedial oblique view"],"ans":0,"exp":"蹄骨旋轉（pedal bone rotation）的診斷最佳攝影方向為lateromedial（側正位），可清楚觀察蹄骨相對於蹄壁的角度變化。","we":["Lateromedial view 是評估蹄骨旋轉的標準投影，可看到蹄骨與蹄壁的關係角度。","Dorsopalmar view 主要評估蹄部橫向結構，較難判斷旋轉程度。","Palmaroproximal-palmarodistal（navicular view）專用於舟狀骨評估。","Skyline view 用於特定結構評估，非蹄骨旋轉首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_003","year":2024,"roc_year":113,"session":"","examNo":3,"q":"下圖為馬前肢放射線影像圖，下列敘述何者正確？","opts":["A. 圖之右側為外側","B. A 為 3rd metacarpal bone","C. B 為 carpometacarpal joint","D. C 為 radial carpal bone"],"ans":0,"exp":"（此題依賴圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_004","year":2024,"roc_year":113,"session":"","examNo":4,"q":"下圖為馬匹右前肢病灶，觸診無疼痛感，無溫熱感，左前肢無此病灶，下列敘述何者最符合此馬之狀況？","opts":["A. 右前肢通常無跛行","B. 蜂窩組織炎可能性高","C. 右前肢舟骨病（navicular bone disease）","D. 賽前密集訓練的結果"],"ans":0,"exp":"（此題依賴圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_005","year":2024,"roc_year":113,"session":"","examNo":5,"q":"馬匹 deep digital flexor tenotomy可用於治療下列何種疾病？","opts":["A. 新生小馬angular limb deformity","B. 蹄骨已呈旋轉之蹄葉炎","C. 白線病","D. 舟骨病（navicular bone disease）"],"ans":1,"exp":"蹄骨旋轉嚴重且無法保守治療時，deep digital flexor tenotomy（深指屈肌肌腱切斷術）可釋放對蹄骨的屈曲張力，改善旋轉。","we":["Corrective shoeing（矯正蹄鐵）屬保守治療，對輕症有效，但嚴重旋轉時效果有限。","Deep digital flexor tenotomy 切斷肌腱，釋放旋轉張力，為嚴重蹄葉炎蹄骨旋轉的外科介入選項。","Hoof resection 屬慎選術式，需依病況決定。","Coffin joint arthrodesis 為末期融合術，非第一線手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_006","year":2024,"roc_year":113,"session":"","examNo":6,"q":"承上題，其手術部位應該在何處？","opts":["A. hock area","B. navicular bone","C. palmar aspect of midmetacarpal area","D. dorsal aspect of midmetacarpal area"],"ans":2,"exp":"DDFT（deep digital flexor tendon）手術入路最常選擇掌骨中段掌側（palmar aspect of midmetacarpal area），該部位組織覆蓋少，易於操作且術後復原較佳。","we":["背側入路（dorsal）易接觸伸肌腱，非DDFT手術入路。","蹄部（hoof）入路組織密度高，操作困難，非首選。","掌骨中段掌側（palmar aspect of midmetacarpal）是DDFT手術的標準入路，視野好、組織層次清晰。","遠端球節（fetlock）入路可能干擾關節結構，非標準DDFT入路。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_007","year":2024,"roc_year":113,"session":"","examNo":7,"q":"有關馬上頷竇圓鋸術之敘述，下列何項錯誤？","opts":["A. 此手術通常可用來治療馬的上頷竇炎","B. 圓鋸部位在鼻甲部額竇的後部","C. 圓鋸部位通常位於鼻骨較為寬闊之處","D. 皮膚圓形切口的直徑應稍大於圓鋸之直徑"],"ans":1,"exp":"問何者「錯誤」。額竇手術的環鋸術（trephination）位置應在maxillary sinus（上頜竇），而非turbinate frontal sinus（鼻甲-額竇）。選項B描述環鋸位置錯誤，故B為最不正確的敘述。","we":["鼻竇炎的抗生素治療需根據培養結果選擇，長期使用是必要的，描述正確。","環鋸術的位置若描述為turbinate frontal sinus是錯誤的；馬的上頜竇（maxillary sinus）才是最常見的環鋸部位。","沖洗鼻竇可作為輔助治療，描述方向正確。","牙根感染（tooth root infection）是馬鼻竇炎的常見原因，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_008","year":2024,"roc_year":113,"session":"","examNo":8,"q":"關於乳牛亞急性瘤胃酸中毒，下列敘述何者最不恰當？","opts":["A. 亞急性瘤胃酸中毒牛隻瘤胃液的pH值通常在5.0～5.5之間","B. 由於瘤胃壁的傷害，可能造成繼發的肝臟膿瘍","C. 通常在2～3天內食入大量短纖維與澱粉時，因產生乳酸堆積造成","D. 得病牛隻通常會有乳量下降、乳脂率上升的情形"],"ans":3,"exp":"亞急性瘤胃酸中毒（SARA）會導致乳脂率「降低」，而非升高。瘤胃pH下降造成瘤胃生物相改變，乙酸產量減少，乳脂合成前驅物不足，故乳脂率下降。選項D說乳脂升高是錯誤的。","we":["SARA確實與採食行為異常及採食量下降有關，描述正確。","SARA時瘤胃pH持續低於5.5-5.8，牛隻可能出現蹄葉炎，描述正確。","纖維素分解菌減少而澱粉分解菌增加是SARA的特徵，描述正確。","SARA導致乳脂率「下降」（因乙酸減少），而非升高；D是錯誤描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_009","year":2024,"roc_year":113,"session":"","examNo":9,"q":"某牧場主要以草梗較多的百慕達草作為牛隻主食，於該場診療牛隻時，發現牛隻下顎腫脹，觸診為單側下頷\r  有堅實團塊，放射線學檢查可見病灶區團塊內有放射狀影像與纖維化組織。開口檢查可見病灶同側臼齒根部 有瘻管形成，本病例最可能之診斷為何？","opts":["A. Actinomyces bovis感染","B. Actinobacillus lignieresii感染","C. 齒根膿瘍","D. 鱗狀上皮細胞瘤"],"ans":0,"exp":"Actinomyces bovis 是造成牛隻lumpy jaw（木質舌/骨放線菌症）的病原，侵犯下頷骨造成骨組織溶解與纖維化。","we":["Actinomyces bovis 感染下頷骨，造成granulomatous osteomyelitis，俗稱lumpy jaw，A正確。","Actinobacillus lignieresii 造成木舌病（wooden tongue），侵犯軟組織（舌），而非骨。","Fusobacterium necrophorum 與蹄腐病（foot rot）有關，非lumpy jaw病原。","Clostridium chauvoei 造成氣腫疽（blackleg），與lumpy jaw無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_010","year":2024,"roc_year":113,"session":"","examNo":10,"q":"下列何者不是導致肥胖牛症候群（fat cow syndrome）發生的誘因？","opts":["A. 長期處於能量負平衡狀態","B. 過度餵飼（over-feeding）精料","C. 脂肪肝","D. 高血糖"],"ans":0,"exp":"問「哪項不是誘發因子」。長期負能量平衡（negative energy balance）是脂肪肝/肥胖牛症候群的直接促發因素，故A「長期負能量平衡不是誘發因子」是錯誤的說法，A為正確答案。","we":["長期負能量平衡正是脂肪牛症候群的核心誘因，A的說法錯誤，因此A為最不正確的選項。","分娩前過度肥胖確實是risk factor，非錯誤敘述。","泌乳高峰期採食量不足導致能量缺口，是誘發因子，描述正確。","過多精料可能誘發代謝疾病，但在此情境下描述合理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_011","year":2024,"roc_year":113,"session":"","examNo":11,"q":"下列何者對預防牛隻罹患乾乳期乳房炎最沒有效果？","opts":["A. 泌乳期結束進入乾乳時給予乳房內灌注乾乳期抗生素藥膏","B. 乾乳牛牛舍保持乾燥與清潔","C. 使用乳頭密封膠","D. 為避免分群緊迫，讓乾乳牛與泌乳牛持續混養在同一牛群"],"ans":3,"exp":"問「最不有效的預防措施」。混合乾乳牛與泌乳牛管理（D）不但無助於預防乳房炎，反而可能增加交叉感染風險，是最無效的預防措施。","we":["定期乳頭消毒（post-dipping）是預防傳染性乳房炎的有效措施。","乾乳牛治療（DCT）可清除亞臨床感染，是有效預防策略。","定期體細胞數監控可早期發現並治療，有效降低乳房炎盛行率。","混合乾乳牛與泌乳牛容易造成細菌交叉傳播，是最不有效的預防措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_012","year":2024,"roc_year":113,"session":"","examNo":12,"q":"關於牛隻黴漿菌性乳房炎，下列敘述何者正確？","opts":["A. 可能增加場內小牛呼吸道疾病的風險","B. 主要引起臨床性乳房炎","C. 與牛隻黴漿菌乳房炎最相關的菌種為               Mycoplasma bovigenitalium","D. 不會引起乳量下降"],"ans":0,"exp":"Mycoplasma bovis 乳房炎除造成牛隻泌乳問題外，其分泌乳汁可能污染代用乳，導致飲用代用乳的犢牛發生呼吸道疾病（respiratory disease），A正確。","we":["Mycoplasma bovis 可透過初乳/代用乳傳給犢牛，造成犢牛關節炎、肺炎，A正確。","Mycoplasma bovis 乳房炎對抗生素治療反應差，並非因為細胞壁缺乏而對所有抗生素無效（僅對作用在細胞壁的藥物無效）。","Mycoplasma 不易在環境中長期存活，主要透過接觸傳播，環境污染程度相對有限。","Mycoplasma 乳房炎通常造成乳汁異常（水樣、有沉澱物），多個乳區同時受影響，但並非所有案例皆如此。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_013","year":2024,"roc_year":113,"session":"","examNo":13,"q":"獸醫師至現場檢查牛隻，發現其鞏膜黃染，該牛最不可能有下列那一種情形？","opts":["A. 體內出血","B. 體外出血","C. 肝臟疾病","D. 血管內溶血"],"ans":1,"exp":"問「最不可能造成黃疸（icterus）」的原因。外出血（external hemorrhage）造成血液流失，並不直接導致紅血球內血紅素大量溶血或肝臟功能障礙，因此最不可能引起黃疸。","we":["溶血性貧血（hemolytic anemia）大量RBC破壞→大量膽紅素→黃疸，是常見原因。","外出血（external hemorrhage）血液流失，膽紅素不會因此大量釋放，最不可能造成黃疸。","膽汁淤積（cholestasis）阻礙膽汁排出→結合膽紅素升高→黃疸，是常見原因。","肝臟疾病（hepatic disease）影響膽紅素代謝，可造成黃疸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_014","year":2024,"roc_year":113,"session":"","examNo":14,"q":"有關牛隻頭頸部進行理學檢查之敘述，下列何者最正確？","opts":["A. 進行頸靜脈壓迫性試驗時，若用手指壓迫後，再放開，發現頸靜脈不下沉，表示左心衰竭","B. 若鼻腔發現膿性分泌物，則表示其有肺炎","C. 威嚇反應（menace reflex）若使用於小於2週齡之牛隻沒有太大價值","D. 若要檢查口腔，必須將其舌頭向前方伸長拉出才能檢查"],"ans":2,"exp":"威脅反射（menace response）在2週齡以下的犢牛尚未成熟，此反射需要視覺皮質整合，犢牛神經系統發育未完全，2週內無法可靠評估，故C最正確（<2週犢牛威脅反射無助於神經學評估）。","we":["瞳孔對光反射（PLR）在新生犢牛即存在，可作為神經學評估指標。","肌腱反射（tendon reflexes）在犢牛出生後即可評估。","威脅反射（menace reflex）需要視覺皮質參與，在<2週齡犢牛尚未發育完全，不適合用於評估，C正確。","姿勢反應（postural reactions）在新生犢牛可作部分評估，但需考慮發育階段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_015","year":2024,"roc_year":113,"session":"","examNo":15,"q":"下列有關牛隻臨床性低血鈣症，以葡萄糖鈣注射進行治療，何者最正確？","opts":["A. 由於治療後血鈣會快速上升，因此無論臨床症狀的輕重，治療後效果都很好","B. 每100公斤的牛隻體重給予2公克鈣（2g Ca/100 kg body weight）是有效的","C. 以肌肉注射的方式常會造成肌肉壞死，故在本治療之給藥途徑是禁止使用的","D. 由於治療時能快速給予鈣是重要的，應以皮下方式給予，每一個注射位置應儘可能給予100～150mL之葡萄   糖鈣液"],"ans":1,"exp":"牛生產性低血鈣（milk fever）的靜脈鈣補充：2 g Ca/100 kg BW是有效且安全的劑量，B正確。","we":["口服鈣劑需要消化吸收，在危急低血鈣時效果太慢，非首選。","靜脈給予2 g Ca/100 kg BW是治療牛低血鈣的有效劑量，B正確。","高劑量鈣靜脈注射可能造成心律不整，需緩慢給藥，過高劑量有害。","皮下注射鈣的吸收速度介於靜脈與口服之間，常與IV合併使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_016","year":2024,"roc_year":113,"session":"","examNo":16,"q":"對於圈飼小牛引起的細菌性肺炎之治療與預防的敘述，下列何者最不恰當？","opts":["A. 一般治療pasteurellosis的抗生素療程至少為3～5天","B. 治療 Mannheimia haemolytica引起之肺炎，合併使用類固醇消炎劑較非類固醇消炎劑效果好","C. 小牛舍保持良好通風有預防效果","D. 運輸前可先預防性投予長效型抗生素"],"ans":1,"exp":"問「何者不正確」。對於Mannheimia haemolytica引起的牛肺炎，NSAIDs（如flunixin）效果比corticosteroids好，因為NSAIDs可降低發炎介質並維持免疫功能；類固醇有免疫抑制效果，反而不建議。B說類固醇優於NSAIDs是錯誤的。","we":["抗生素治療（如florfenicol、enrofloxacin）是Mannheimia肺炎的核心治療，描述正確。","Corticosteroids的效果「不優於」NSAIDs用於牛隻細菌性肺炎；類固醇有免疫抑制效果，可能加重感染，B是錯誤敘述。","NSAIDs（如flunixin meglumine）可降低發炎反應，改善預後，是輔助治療，描述正確。","早期診斷與治療對預後影響大，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_017","year":2024,"roc_year":113,"session":"","examNo":17,"q":"小牛感染rotavirus以及enterotoxigenic E. coli時，其造成下痢的致病機序分別為何？","opts":["A. hypomotility以及malabsorption","B. 兩者皆為hypermotility","C. malabsorption以及hypersecretion","D. hypertrophy以及osmosis"],"ans":2,"exp":"Rotavirus造成小腸絨毛受損→吸收不良性腹瀉（malabsorption diarrhea）；ETEC（大腸桿菌，K99型）分泌腸毒素→高分泌性腹瀉（hypersecretion diarrhea），C正確。","we":["Rotavirus和ETEC都是新生犢牛/仔豬腹瀉的常見病原，A描述的機制有誤。","Rotavirus造成的是吸收不良性腹瀉（villous atrophy→malabsorption），非高分泌性，B的描述相反。","Rotavirus→malabsorption；ETEC→hypersecretion，C正確描述各自機制。","Coronavirus也會造成腸絨毛萎縮，但ETEC是高分泌性，D混淆了機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_018","year":2024,"roc_year":113,"session":"","examNo":18,"q":"新生的小牛兩前肢呈現圖片中的外觀，其最有可能的診斷為下列何項？","opts":["A. polyarhtritis","B. flexural deformities","C. septic arthritis","D. rickets"],"ans":1,"exp":"（此題可能依賴圖片。）屈曲肢變形（flexural deformities）在犢牛中，輕度可保守治療（夾板、物理治療），嚴重者需手術切斷韌帶/肌腱。","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_019","year":2024,"roc_year":113,"session":"","examNo":19,"q":"methylene blue可用於治療牛隻何種中毒？","opts":["A. 草酸鹽中毒","B. 亞硝酸鹽中毒","C. 洋蔥中毒","D. 羊齒類中毒"],"ans":1,"exp":"亞硝酸鹽（nitrite）中毒造成高鐵血紅素血症（methemoglobinemia），治療用亞甲藍（methylene blue），靜脈給藥後可將Fe³⁺還原為Fe²⁺，恢復攜氧能力。","we":["Atropine 用於有機磷/胺基甲酸酯中毒，非亞硝酸鹽中毒的解毒劑。","Methylene blue（亞甲藍）是亞硝酸鹽/硝酸鹽中毒（高鐵血紅素血症）的特效解毒劑，B正確。","Activated charcoal 可用於早期毒物吸附，但無法逆轉已形成的methemoglobin。","Sodium thiosulfate 用於氰化物中毒，非亞硝酸鹽中毒的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_020","year":2024,"roc_year":113,"session":"","examNo":20,"q":"下列何者為乳牛乳房炎之接觸傳染性（contagious）病原菌？","opts":["A. 異乳鏈球菌（ Streptococcus dysgalactiae）","B. 乳房鏈球菌（Streptococcus uberis）","C. 金黃色葡萄球菌（Staphylococcus aureus）","D. 大腸桿菌（Escherichia coli）"],"ans":2,"exp":"問「傳染性乳房炎（contagious mastitis）的病原」。Staphylococcus aureus 是最重要的傳染性乳房炎病原，在擠乳過程中透過乳頭傳播，C正確。","we":["E. coli 屬環境性乳房炎病原，不是傳染性乳房炎的典型病原。","Streptococcus uberis 主要是環境性（environmental）病原。","Staphylococcus aureus 是典型的傳染性乳房炎（contagious mastitis）病原，牛對牛傳播，C正確。","Klebsiella spp. 屬環境性乳房炎病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_021","year":2024,"roc_year":113,"session":"","examNo":21,"q":"牛隻吞入金屬異物至蜂巢胃造成胃壁穿刺後，最不可能引起下列何種臟器之創傷？","opts":["A. 肝","B. 心","C. 脾","D. 肺"],"ans":3,"exp":"問「最不可能被網胃異物穿透的器官」。肺臟（lung）位於胸腔且有橫膈保護，網胃異物通常向前方穿透，較易傷及心包（pericardium）、肝臟、脾臟，而非直接到達肺臟，D正確為最不可能。","we":["心包（pericardium）位於網胃前方，是最常被異物穿透的部位之一。","肝臟位於右側前腹，網胃異物可向右穿透到肝，常見。","脾臟位於左側，網胃異物也可能向左穿刺到脾。","肺臟（lung）有橫膈及胸膜保護，且距離網胃較遠，最不容易直接被穿透。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_022","year":2024,"roc_year":113,"session":"","examNo":22,"q":"關於牛隻腹脅部手術時施行的脊柱旁阻斷麻醉（paravertebral block），下列敘述何者錯誤？","opts":["A. 使用Magda's method與Farquharson method所阻斷的神經群不同","B. Farquharson method進行阻斷時通常會穿透脊椎橫突間韌帶","C. Magda's method進行阻斷時需於脊椎橫突背側面與腹側面注射","D. 相較於Magda's method，使用Farquharson method進行阻斷所需之注射針較長"],"ans":0,"exp":"問何者「錯誤」。A說兩種方法（cornual nerve block和 Peterson's block）阻斷「不同」神經群，這是錯誤的——兩者都是去角神經阻斷，都針對cornual nerve（角神經）的不同阻斷位置，最終阻斷的感覺傳入是相似的。","we":["兩種去角神經阻斷術（如proximal cornual block和Peterson's block）雖施術位置不同，但最終都阻斷角部的感覺神經，A說「不同神經群」是錯誤的。","去角局部麻醉後再進行去角手術可有效降低疼痛，描述正確。","Peterson's eye block 阻斷多條顱神經，適用於眼部手術，描述正確。","角神經（cornual nerve）是三叉神經的分支，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_023","year":2024,"roc_year":113,"session":"","examNo":23,"q":"下列那一種牛隻疾病最不會在體壁右側聽扣診時出現金屬音（ping sound）？","opts":["A. 瘤胃塌陷（rumen collapse）","B. 瘤胃腹囊積氣（gas in ventral sac of rumen）","C. 小腸擴張（distention of the small intestine）","D. 直腸積氣（pneumorectum）"],"ans":3,"exp":"問「不會造成右側ping的原因」。Pneumorectum（直腸進氣）位於後腹腔，不會在右側前腹造成ping聲，D正確。","we":["右側皺胃變位（RDA/RTA）可造成右側前腹ping。","盲腸臌脹可在右腹後方造成ping。","小腸臌脹（如腸扭轉）可在右側腹造成ping。","Pneumorectum 氣體在直腸，位置偏後，不會造成右側前腹典型ping聲，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_024","year":2024,"roc_year":113,"session":"","examNo":24,"q":"使用體外穿刺（blink tack）加上Toggle pin治療牛隻第四胃異位時，下列何者最不可能是術後併發症？","opts":["A. 第四胃瘻管","B. 第四胃破裂","C. 瀰漫性腹膜炎","D. 肝臟穿刺傷"],"ans":1,"exp":"Toggle pin固定術（皺胃復位）最少見的併發症是皺胃穿孔/破裂（abomasal rupture）；較常見的問題是局部腹膜炎、復位失敗等。B正確為最不常見的併發症。","we":["局部腹膜炎（peritonitis）是toggle pin術後較常見的併發症，非最少見。","皺胃破裂（abomasal rupture）在toggle pin術後非常罕見，是最不可能的併發症，B正確。","皺胃再次變位（recurrence）是toggle pin術已知的缺點之一，並不少見。","網膜沾黏是腹腔手術的常見後遺症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_025","year":2024,"roc_year":113,"session":"","examNo":25,"q":"以右脇腹大網膜固定術（right-flank omentopexy）及幽門固定術（pyloropexy）治療乳牛第四胃異位之術\r   後併發症，下列何項最為常見？","opts":["A. 第四胃破裂","B. 幽門狹窄","C. 異位復發","D. 肝臟膿瘍"],"ans":2,"exp":"右側腹腔切開大網膜固定術（right flank omentopexy）後，皺胃再次變位（displacement recurrence）比其他術式更常見，C正確。","we":["通氣管引流（trocar decompression）是緊急減壓措施，不是長期預防再發的手術。","右側腹腔切開僅減壓但不固定，復發率高。","右側腹腔切開大網膜固定術（right flank omentopexy）因固定效果相對不確實，再發率高於pyloric omentopexy，C正確。","幽門網膜固定術（pylo
