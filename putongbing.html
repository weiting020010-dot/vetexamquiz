g/kg","B. 30 mg/kg","C. 45 mg/kg","D. 60 mg/kg"],"ans":1,"exp":"豬戊巴比妥鈉（pentobarbital sodium）靜脈麻醉的最佳劑量為約30 mg/kg，可提供足夠深度的麻醉，但安全範圍較窄，需謹慎給藥。","we":["15 mg/kg劑量不足，無法達到充分麻醉深度。","30 mg/kg是豬戊巴比妥鈉靜脈麻醉的適當劑量，正確。","45 mg/kg可能過量，增加死亡風險。","60 mg/kg明顯過量，具致死風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_034","year":2017,"roc_year":106,"session":"","examNo":34,"q":"胎向（position）是指","opts":["A. 胎兒背部和母體腹部的關係","B. 胎兒腹部和母體背部的關係","C. 胎兒腹部和母體腹部的關係","D. 胎兒背部和母體背部的關係"],"ans":3,"exp":"胎向（position）在產科學中定義為胎兒背部（spine/dorsum）與母體背部之間的相對關係（如：背薦位、背恥位、背髂位等）。胎位（presentation）是胎兒長軸與母體的關係。","we":["胎位（presentation）指胎兒進入產道的部位，非胎向。","胎勢（posture）指胎兒頭頸四肢的屈伸狀態，非胎向。","胎向不是指胎兒在子宮的整體方向。","胎向（position）=胎兒背部與母體背部的關係，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_035","year":2017,"roc_year":106,"session":"","examNo":35,"q":"牛第2期分娩收縮的主要特徵為","opts":["A. 外陰部擴張","B. 子宮頸擴張","C. 胎兒娩出","D. 胎盤排出"],"ans":2,"exp":"母牛分娩分三期：第一期（子宮頸擴張+羊膜囊出現）、第二期（胎兒娩出）、第三期（胎盤排出）。第2期的主要特徵是胎兒從子宮完全娩出。","we":["第一期分娩特徵是子宮頸擴張和行為改變，非胎兒娩出。","胎盤排出是第三期分娩。","第二期分娩的主要特徵是胎兒娩出，正確。","子宮收縮貫穿各期，非第二期特有。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_036","year":2017,"roc_year":106,"session":"","examNo":36,"q":"關於牛排卵遲延的敘述，下列何者錯誤？","opts":["A. 病牛發情可持續3－5天以上","B. 發情開始後24小時排卵","C. 有黃體形成","D. 發情終止後24－48小時後沒有排卵"],"ans":1,"exp":"牛正常排卵時間是發情開始後約28-32小時，即發情結束後約6-10小時排卵（發情時間約16-18小時）。「發情開始後24小時排卵」描述的是接近正常而非排卵遲延（delayed ovulation）。","we":["排卵遲延多見於秋冬季節，正確描述。","「發情開始後24小時排卵」描述接近正常排卵時間，非排卵遲延，此項錯誤為答案。","排卵遲延與卵巢功能不全有關，正確。","排卵遲延可能導致受精率下降，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_037","year":2017,"roc_year":106,"session":"","examNo":37,"q":"關於牛濾泡囊腫，下列敘述何者錯誤？","opts":["A. 濾泡大小直徑超過2.5cm以上","B. 大多因FSH分泌不足，LH分泌過多所致","C. 餵飼含動情素的飼料過多","D. 僅一次判定困難時必須7－14天再檢查一次"],"ans":1,"exp":"牛濾泡囊腫（cystic follicle）的主要原因是LH排卵峰（LH surge）缺乏，導致濾泡未能排卵而持續發育成囊腫。「FSH不足LH過多」的描述是錯誤的。","we":["濾泡囊腫確實與下視丘-腦垂體-卵巢軸功能障礙有關，正確。","「FSH不足LH過多」描述錯誤，應為LH surge缺乏，此項錯誤為答案。","持續發情（nymphomania）可能出現於濾泡囊腫，正確。","直腸觸診可觸及囊腫，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_038","year":2017,"roc_year":106,"session":"","examNo":38,"q":"下列何者是造成母貓難產最常見的原因？","opts":["A. 子宮無力（uterine inertia）","B. 子宮扭轉（uterine torsion）","C. 產道狹窄（narrow birth canal）","D. 子宮脫垂（uterine prolapse）"],"ans":0,"exp":"母貓難產的最常見原因是子宮無力（uterine inertia），可分為原發性（exhaustion）和繼發性，尤其在長時間努責後更常見，其次才是胎兒方向或大小問題。","we":["子宮無力（uterine inertia）是母貓難產最常見原因，正確。","胎兒過大（fetal oversize）是犬難產常見原因，貓較少。","骨盆狹窄在貓難產中可見，但不如子宮無力常見。","先天性陰道狹窄（vaginal stricture）較少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_039","year":2017,"roc_year":106,"session":"","examNo":39,"q":"精子的那一部位含有酵素，可溶解卵子的透明帶（zona pellucida）？","opts":["A. 核醣體（ribosome）","B. 尖體（acrosome）","C. 細胞質滴（cytoplasmic droplet）","D. 粒線體鞘（mitochondrial sheath）"],"ans":1,"exp":"精子頂體（acrosome）位於精子頭部前端，含有頂體素（acrosin）等水解酶，在受精時進行頂體反應（acrosome reaction），溶解透明帶（zona pellucida）以利精子穿入卵細胞。","we":["頂體與精子運動無直接關聯（鞭毛負責運動）。","頂體含酵素溶解透明帶以利受精，正確。","頂體不是基因遺傳物質的儲存部位（細胞核負責）。","頂體不含線粒體（線粒體在中段）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_040","year":2017,"roc_year":106,"session":"","examNo":40,"q":"公畜精子生成後最主要儲存於下列何處？","opts":["A. 精囊腺","B. 輸精管壼腹","C. 副睪","D. 睪丸"],"ans":2,"exp":"公畜精子的主要儲存場所是副睪（epididymis），特別是副睪尾（tail of epididymis），精子在此成熟並獲得運動能力，可儲存數週。","we":["睪丸（testis）是精子製造場所，不是主要儲存場所。","輸精管（vas deferens）是運輸管道，儲量有限。","副睪（epididymis）是精子的主要儲存場所，正確。","精囊腺（seminal vesicle）分泌精液，不儲存精子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_041","year":2017,"roc_year":106,"session":"","examNo":41,"q":"下列何種動物，每次平均射精之精液量為最多？","opts":["A. 牛","B. 豬","C. 犬","D. 羊"],"ans":1,"exp":"各種動物一次射精量比較：豬（150-500 mL）> 馬（50-100 mL）> 牛（5-8 mL）> 羊（0.5-2 mL），豬的射精量最多。","we":["馬的射精量雖多，但不如豬多。","豬一次射精量150-500 mL，各種動物中最多，正確。","牛的射精量5-8 mL，遠少於豬。","羊的射精量最少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_042","year":2017,"roc_year":106,"session":"","examNo":42,"q":"副性腺（accessory sex gland）中，輸精管壺腹部（ampulla）在下列那種動物最發達？","opts":["A. 山羊","B. 馬","C. 貓","D. 犬"],"ans":1,"exp":"輸精管壺腹部（ampulla of vas deferens）在馬最為發達，是馬獨特的解剖特徵，作為精子的儲存功能；公牛也有，但發育程度不如馬。","we":["犬沒有明顯的壺腹部。","馬（equine）的輸精管壺腹部最發達，正確。","豬有壺腹部但不如馬發達。","貓無明顯壺腹部。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_043","year":2017,"roc_year":106,"session":"","examNo":43,"q":"下列何者不是乳牛分娩前後發生起立不能之原因？","opts":["A. 乳熱","B. 酮病","C. 尿膜水腫","D. 尿毒症"],"ans":2,"exp":"乳牛分娩前後起立不能（downer cow syndrome）的常見原因包括：低血鈣（milk fever）、神經損傷（obturator nerve）、肌肉損傷、低血鉀、低血磷等。尿膜水腫（allantoic hydrops）是妊娠期問題，與分娩前後起立不能無直接關聯。","we":["低血鈣（milk fever）是最常見原因，正確。","神經損傷（obturator nerve injury）可引起起立不能，正確。","尿膜水腫不是分娩前後起立不能的原因，正確為答案。","低血磷（hypophosphatemia）可引起肌肉無力和起立不能，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_044","year":2017,"roc_year":106,"session":"","examNo":44,"q":"下列那種動物的前列腺最為發達？","opts":["A. 貓","B. 犬","C. 牛","D. 豬"],"ans":1,"exp":"前列腺（prostate gland）在各種動物中以犬（dog）最為發達，且犬的前列腺完全包圍尿道；犬前列腺疾病（增生、炎症、腫瘤）也最為常見。","we":["公牛有前列腺，但不如犬發達。","犬（dog）的前列腺最發達，且完全包圍尿道頸，正確。","公馬有前列腺，體積中等。","公豬有前列腺，但不如犬典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_045","year":2017,"roc_year":106,"session":"","examNo":45,"q":"心臟雜音的產生是因為血流出現擾流（turbulent），依據Reynold’s number ，以下何項因素容易產生心雜\r 音？","opts":["A. 低血流速度（low velocity）","B. 低血液密度（low density）","C. 低血液黏稠度（low viscosity）","D. 小管徑（small radius）"],"ans":2,"exp":"心雜音（cardiac murmur）的產生與血流的Reynolds number（雷諾數）有關。低血液黏稠度（low viscosity）→高流速→高Reynolds number→湍流（turbulent flow）→產生雜音。","we":["高黏稠度實際上會降低Reynolds number，減少湍流。","低血流速度降低Reynolds number，不易產生雜音。","低黏稠度→高Reynolds number→湍流→心雜音，正確。","低心輸出量降低血流速度，不易產生雜音。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_046","year":2017,"roc_year":106,"session":"","examNo":46,"q":"臨床上出現低血鈉症，其嚴重程度除低血鈉本身的數值外，又與下列何項有相關？","opts":["A. 發生時間的長短","B. 動物年齡","C. 動物種別","D. 動物體重"],"ans":0,"exp":"低血鈉（hyponatremia）的嚴重程度與發生的速度和時間長短有關：急性低血鈉（<24-48小時）症狀重，慢性低血鈉（>48小時）因腦細胞適應性調節，症狀反而較輕。","we":["低血鈉嚴重程度確實與發生時間長短有相關，正確。","僅看血鈉絕對值不能完全反映嚴重程度。","低血鈉症狀不僅取決於年齡。","治療方式雖然影響預後，但嚴重程度本身與時間長短相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_047","year":2017,"roc_year":106,"session":"","examNo":47,"q":"下列何項不是造成肺水腫的機制？","opts":["A. 肺部血管滲透壓的增加","B. 血漿中的膠體滲透壓的減少","C. 肺部血管通透性的改變","D. 淋巴液排出障礙"],"ans":0,"exp":"肺水腫（pulmonary edema）的發生機制包括：毛細血管靜水壓增加、血漿膠體滲透壓（colloid osmotic pressure）降低、毛細血管通透性增加等。肺血管滲透壓（colloid osmotic pressure）增加反而防止水腫，不是造成肺水腫的原因。","we":["肺血管滲透壓增加→防止水腫，非造成水腫的機制，此項錯誤為答案。","毛細血管靜水壓增加→液體外滲→肺水腫，正確。","毛細血管通透性增加→液體外滲→肺水腫，正確。","淋巴引流受阻→液體蓄積→肺水腫，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_048","year":2017,"roc_year":106,"session":"","examNo":48,"q":"犬貓吸入性肺炎的可能病因，下列何項錯誤？","opts":["A. 巨食道症","B. 麻醉的併發症","C. 給與礦物油作為化毛膏","D. 咳嗽"],"ans":3,"exp":"吸入性肺炎（aspiration pneumonia）的病因包括：麻醉時誤吸、嘔吐物誤吸、食道功能障礙、鼻飼管置入位置不當等。咳嗽是保護呼吸道的防禦反應，不是吸入性肺炎的病因（而是潛在的預防機制缺失時才增加風險）。","we":["麻醉誘導期嘔吐誤吸是常見的吸入性肺炎病因，正確。","食道疾病（megaesophagus）可導致誤吸，正確。","吞嚥功能障礙（dysphagia）導致誤吸，正確。","咳嗽是保護機制，不是吸入性肺炎的病因，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_049","year":2017,"roc_year":106,"session":"","examNo":49,"q":"犬在氣管塌陷時通常不會出現以下何項徵狀？","opts":["A. 鵝叫樣咳嗽（goose honk）","B. 慢性咳嗽","C. 濕咳（productive cough）","D. 興奮時咳嗽"],"ans":2,"exp":"氣管塌陷（tracheal collapse）的特徵是乾咳（dry, harsh, honking cough），聽診有喘鳴聲，不會出現濕咳（productive/moist cough）。濕咳提示下呼吸道感染或肺水腫。","we":["氣管塌陷常有喘鳴（stridor），正確。","運動不耐受（exercise intolerance）是氣管塌陷的症狀，正確。","氣管塌陷不會出現濕咳，正確為答案。","腹式呼吸可能加重，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_050","year":2017,"roc_year":106,"session":"","examNo":50,"q":"下列何者不是造成犬貓胃十二指腸潰瘍的可能病因？","opts":["A. 胰液分泌不足","B. 肥大細胞瘤","C. 服用NSAIDs","D. 腎衰竭"],"ans":0,"exp":"胃十二指腸潰瘍（gastroduodenal ulcer）的主要病因：NSAID使用、Helicobacter pylori感染、胃酸過多、應激（stress ulcer）等。胰液分泌不足（pancreatic insufficiency）不是主要病因（胰液含碳酸氫鹽，不足時反而使十二指腸偏酸，可能輕度增加風險，但不是主要病因）。","we":["胰液分泌不足不是胃十二指腸潰瘍的主要病因，正確為答案。","NSAID（非類固醇消炎藥）破壞胃黏膜屏障，是主要病因，正確。","應激（stress）引起胃酸過多，是潰瘍常見原因，正確。","Helicobacter pylori感染是人醫中主要病因，在動物也有報導，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_051","year":2017,"roc_year":106,"session":"","examNo":51,"q":"下列何項為貓最常見的胃腫瘤？","opts":["A. adenocarcinoma","B. lymphoma","C. fibrosarcoma","D. leiomyosarcoma"],"ans":1,"exp":"貓最常見的胃腫瘤是淋巴瘤（lymphoma），此外胃腺癌也可見；與犬不同，犬最常見的胃腫瘤是腺癌（adenocarcinoma）。","we":["胃腺癌（adenocarcinoma）在犬最常見，貓次之。","淋巴瘤（lymphoma）是貓最常見的胃腫瘤，正確。","胃平滑肌瘤（leiomyoma）在犬老年狗較常見。","胃間質瘤（GIST）不是貓最常見的胃腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_052","year":2017,"roc_year":106,"session":"","examNo":52,"q":"以下何種疾病在觸診時不會呈現強盛且跳躍性的脈搏（very strong，bounding pulses）？","opts":["A. 開放性動脈導管（patent ductus arteriosus）","B. 主動脈狹窄（aortic stenosis）","C. 高燒（high fever）","D. 嚴重主動脈回流（severe aortic regurgitation）"],"ans":1,"exp":"主動脈狹窄（aortic stenosis）造成左心室流出道阻塞，血流受阻，週邊脈搏呈現弱脈（weak pulse/pulsus parvus）或延遲脈（pulsus tardus），不會出現強盛的跳躍性脈搏（bounding/hyperdynamic pulse）。","we":["主動脈狹窄確實造成心雜音，正確。","強盛跳躍性脈搏是主動脈閉鎖不全（regurgitation）或動靜脈瘻的表現，非主動脈狹窄，此項錯誤為答案。","主動脈狹窄可引起暈厥（syncope），正確。","主動脈狹窄可突發猝死，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_053","year":2017,"roc_year":106,"session":"","examNo":53,"q":"下列何者不是造成貓口炎的主因？","opts":["A. uremia","B. autoimmune diseases","C. feline herpesvirus","D. hepatic lipidosis"],"ans":3,"exp":"貓口炎（stomatitis）的病因與免疫介導反應、貓病毒（FCV、FHV）、牙周病等有關，肝脂肪肝（hepatic lipidosis）主要引起黃疸、肝衰竭，不是貓口炎的直接病因。","we":["FCV（貓冠狀病毒/杯狀病毒）與貓口炎有關，正確。","免疫介導反應是貓慢性口炎的主要機制，正確。","牙周病（periodontal disease）可引起或加重貓口炎，正確。","肝脂肪肝（hepatic lipidosis）不是貓口炎的原因，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_054","year":2017,"roc_year":106,"session":"","examNo":54,"q":"下列何種藥物不能用來治療貓梨形鞭毛蟲症？","opts":["A. fenbendazole","B. ivermectin","C. metronidazole","D. praziquantel/ pyrantel"],"ans":3,"exp":"貓梨形鞭毛蟲症（Giardiasis，Giardia duodenalis）的治療藥物為metronidazole、fenbendazole或ronidazole。Praziquantel治療絛蟲，pyrantel治療線蟲，兩者對Giardia均無效。","we":["Metronidazole是治療Giardia的首選藥物，正確。","Fenbendazole對Giardia有效，正確。","Ronidazole在貓Giardia治療中也有應用，正確。","Praziquantel/pyrantel組合對Giardia無效，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_055","year":2017,"roc_year":106,"session":"","examNo":55,"q":"犬warfarin中毒，可引起下列何項病症？","opts":["A. 膿胸","B. 乳糜胸","C. 水胸","D. 血胸"],"ans":3,"exp":"Warfarin（殺鼠劑）中毒抑制維生素K依賴性凝血因子（II、VII、IX、X），造成凝血障礙，可引起多種出血，包括胸腔出血（hemothorax）、腹腔出血、皮下出血等，血胸是常見的致死性表現。","we":["Warfarin中毒可引起腹腔出血（hemoabdomen），正確。","Warfarin中毒可引起心包血腫（hemopericardium），正確。","Warfarin中毒可引起皮下出血（ecchymoses），正確。","血胸（hemothorax）是Warfarin中毒的嚴重出血表現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_056","year":2017,"roc_year":106,"session":"","examNo":56,"q":"下列那一項檢驗法用於最終區別犬的腦下垂體型或腎上腺腫瘤型腎上腺機能亢進症？","opts":["A. urine cortisol:creatinine ratio","B. low-dose dexamethasone suppression test","C. high-dose dexamethasone suppression test","D. ACTH stimulation test"],"ans":2,"exp":"High-dose dexamethasone suppression test（HDDST）用於區分犬腎上腺皮質功能亢進（Cushing's syndrome）的類型：若皮質醇被抑制→垂體依賴性（PDH）；若不被抑制→腎上腺腫瘤（AT）。Low-dose test只用於診斷Cushing's，HDDST才能區分PDH vs AT。","we":["Low-dose DST用於確認Cushing's診斷，不區分類型。","ACTH刺激試驗確認腎上腺功能，不區分PDH vs AT。","HDDST最終區別PDH vs AT，正確。","尿液皮質醇/肌酸酐比值用於篩檢，不區分類型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_057","year":2017,"roc_year":106,"session":"","examNo":57,"q":"犬缺鐵性貧血時，下列敘述何項錯誤？","opts":["A. 通常為消化道有問題，尤其是上端的腸道，吸收不良所致","B. 多為大球低色性貧血","C. 可能是非再生性或是再生性貧血，依缺鐵程度而定","D. 幼犬因為體內鐵儲存量小及生長時需鐵較多而容易產生此症"],"ans":1,"exp":"缺鐵性貧血（iron deficiency anemia）的血液學特徵是小球低色性貧血（microcytic hypochromic anemia），MCV降低、MCHC降低；「大球低色性」是維生素B12/葉酸缺乏的描述，描述錯誤。","we":["缺鐵性貧血確實是低色性貧血（hypochromic），正確。","「多為大球低色性」描述錯誤，應是小球低色性，此項錯誤為答案。","缺鐵性貧血會有網狀球增加（再生性），正確。","缺鐵性貧血可見鉛筆形紅血球（pencil cells），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_058","year":2017,"roc_year":106,"session":"","examNo":58,"q":"犬肝膽疾病時，下列何項不是維生素K缺乏及降低的主因？","opts":["A. 當膽管阻塞時，膽汁循環不順，影響脂肪代謝，使得吸收維生素K變少","B. 口服抗生素破壞菌叢，導致吸收減少","C. 因為厭食，吃進去的量太少","D. 補充大量其他維生素，競爭其吸收，導致吸收減少"],"ans":3,"exp":"維生素K（Vitamin K）缺乏的原因包括：飲食缺乏、脂肪吸收不良（膽汁缺乏、腸道疾病）、長期抗生素使用（破壞腸道菌群）、Warfarin中毒（拮抗）。「補充大量其他維生素競爭吸收」不是已知的維生素K缺乏機制。","we":["飲食缺乏是維生素K缺乏的原因，正確。","脂肪吸收不良（fat malabsorption）是維生素K缺乏的原因，正確。","Warfarin等抗凝劑拮抗維生素K，正確。","補充其他維生素不是維生素K缺乏的主因，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_059","year":2017,"roc_year":106,"session":"","examNo":59,"q":"犬貓左心衰竭最易繼發下列何項？","opts":["A. 肺水腫","B. 肺炎","C. 肺瀰漫性凝血","D. 肺氣腫"],"ans":0,"exp":"左心衰竭（left heart failure）導致左心室無法有效輸出血液，肺靜脈壓升高，肺毛細血管靜水壓增加，液體滲入肺泡→肺水腫（pulmonary edema），這是左心衰竭最重要的繼發症。","we":["左心衰竭→肺水腫，正確。","右心衰竭→腹水、體循環水腫，非肺水腫。","心肌炎可引起心衰竭，但不直接引起肺水腫（需先有左心衰）。","心包填塞減少心輸出量，但不直接引起肺水腫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_060","year":2017,"roc_year":106,"session":"","examNo":60,"q":"2歲大的德國狼犬，出現油便及體重下降的現象，最可能的疾病為下列何項？","opts":["A. 胰外泌素不全症","B. 急性胰臟炎","C. 慢性腎衰竭","D. 慢性肝衰竭"],"ans":0,"exp":"2歲德國狼犬，油便（steatorrhea）+ 體重下降（weight loss）+ 食慾良好，最常見診斷為胰外泌素不全症（EPI, Exocrine Pancreatic Insufficiency），因胰酶分泌不足導致脂肪消化吸收障礙。","we":["EPI（胰外泌素不全症）是德國狼犬最常見的吸收不良原因，正確。","炎症性腸病（IBD）也會造成吸收不良，但不如EPI在德國狼犬常見。","腸道寄生蟲可引起腹瀉，但典型表現不同。","食物過敏通常有皮膚和胃腸道症狀，但不以油便為典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_061","year":2017,"roc_year":106,"session":"","examNo":61,"q":"有關貓腎功能檢查，下列何項最能反應腎絲球體功能？","opts":["A. 血中尿素氮濃度","B. 血清肌酸酐濃度","C. 尿蛋白與肌酸酐比（urine protein to creatinine ratio）","D. 尿比重"],"ans":1,"exp":"血清肌酸酐（serum creatinine）是腎絲球體過濾功能（GFR）的主要評估指標，當GFR降低到正常的25%以下才明顯升高（敏感性不高但特異性較好），是評估腎臟功能的重要指標。","we":["BUN（血液尿素氮）受飲食蛋白質影響，特異性較低。","血清肌酸酐（serum creatinine）最能反應腎絲球體功能，正確。","尿液比重（urine specific gravity）反映腎小管濃縮功能，非腎絲球功能。","尿蛋白（urine protein）可反映腎絲球損傷，但不如肌酸酐定量準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_062","year":2017,"roc_year":106,"session":"","examNo":62,"q":"犬慢性腎病時會有低血鉀症，下列那項因素不是造成低血鉀的主因？","opts":["A. 厭食","B. 鹼性食物","C. 多尿","D. 嘔吐"],"ans":1,"exp":"犬慢性腎病（CKD）低血鉀（hypokalemia）的原因：攝食減少、嘔吐造成的鉀離子丟失、多尿造成的腎臟鉀流失。「鹼性食物」不是CKD低血鉀的主要原因（鹼性食物反而用於管理CKD酸中毒）。","we":["嘔吐（vomiting）造成鉀離子丟失，可引起低血鉀，正確。","鹼性食物不是CKD低血鉀的主因，正確為答案。","多尿（polyuria）增加腎臟鉀排泄，正確。","食慾不振（anorexia）減少鉀攝入，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_063","year":2017,"roc_year":106,"session":"","examNo":63,"q":"腫瘤分期（stage）有利於協助判定腫瘤病患之預後，而腫瘤分期是依據TNM system來分類的。若以母犬乳\r 腺腫瘤為例，所指的TNM分別是什麼，下列何者正確？","opts":["A. TNM分別代表初步診斷、區域淋巴結是否出現腫大、腫瘤惡性程度","B. TNM分別代表初步診斷、區域淋巴結是否出現腫大、有無遠端轉移","C. TNM分別代表腫瘤大小、區域淋巴結是否出現轉移、有無遠端轉移","D. TNM分別代表腫瘤大小、區域淋巴結是否出現轉移、腫瘤惡性程度"],"ans":2,"exp":"TNM分期系統：T（Tumor size）= 原發腫瘤大小及侵犯程度；N（Node）= 區域淋巴結是否出現轉移；M（Metastasis）= 有無遠端轉移（distant metastasis）。","we":["T代表腫瘤大小，N代表淋巴結，M代表遠端轉移，TNM的順序和含義是正確的，選C。","T不代表組織型態（histologic type）。","TNM分別代表腫瘤大小、區域淋巴結轉移、遠端轉移，正確。","N不代表神經（nerve），M不代表病理分期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_064","year":2017,"roc_year":106,"session":"","examNo":64,"q":"以酵素聯結免疫吸附分析法（ELISA）和免疫螢光抗體法診斷貓白血病，不建議使用下列何種檢體？","opts":["A. 血液","B. 淚液","C. 唾液","D. 尿液"],"ans":3,"exp":"FeLV（貓白血病病毒）診斷方法：ELISA（血清/血漿/全血）、IFA（骨髓塗片）、PCR（全血或骨髓）。尿液不含大量FeLV抗原，不是推薦的診斷樣本。","we":["血清ELISA是FeLV的常規診斷方法，正確。","骨髓IFA確認FeLV持續性感染，正確。","PCR（全血）可檢測FeLV DNA，正確。","尿液不是FeLV診斷的推薦樣本，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_065","year":2017,"roc_year":106,"session":"","examNo":65,"q":"貓非滲出性貓傳染性腹膜炎的發病機制為下列何項？","opts":["A. 強烈細胞性免疫","B. 部分細胞性免疫","C. 強烈且具保護性體液性反應","D. 強烈但不具保護性體液性反應"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）分為濕性（滲出性）和乾性（非滲出性）兩型。乾性FIP是由於部分細胞性免疫（cell-mediated immunity）的存在，阻止了大量液體滲出，但無法完全消滅病毒，形成肉芽腫性病變。","we":["乾性FIP涉及細胞性免疫反應，抗體不是主要因素。","乾性FIP（非滲出性）=部分細胞性免疫，正確。","完全免疫力可完全消滅FCoV，不會發展成FIP。","濕性FIP=體液免疫（抗體-抗原複合物）佔主導。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_066","year":2017,"roc_year":106,"session":"","examNo":66,"q":"下列何者為電擊去顫（electrical defibrillation）最主要的使用時機？","opts":["A. 心跳過慢","B. 心室顫動","C. 意識喪失","D. 呼吸停止"],"ans":1,"exp":"電擊去顫（electrical defibrillation/cardioversion）最主要使用時機是心室顫動（ventricular fibrillation, VF），因VF時心臟無有效收縮，立即電擊是唯一有效的治療方法。","we":["心室頻脈（VT）有脈搏時可用同步電擊，但首選藥物。","心室顫動（ventricular fibrillation）是電擊去顫的最主要適應症，正確。","心房顫動可用同步電擊（電複律），但不如VF緊急。","心房頻脈通常不需要去顫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_067","year":2017,"roc_year":106,"session":"","examNo":67,"q":"下列有關貓高血壓的敘述，何者錯誤？","opts":["A. 易造成視網膜剝離","B. 易造成右心肥厚","C. 老貓較易罹患高血壓","D. 高血壓可能是腎臟病的病因或併發症"],"ans":1,"exp":"貓高血壓（hypertension）的心臟效應是左心室承受後負荷增加→左心室向心性肥厚（concentric left ventricular hypertrophy），而非右心肥厚（right ventricular hypertrophy）。","we":["貓高血壓確實會影響心臟，正確。","「易造成右心肥厚」描述錯誤，應是左心肥厚，此項錯誤為答案。","貓高血壓可引起視網膜剝離（retinal detachment），正確。","貓高血壓可引起神經症狀（seizure），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_068","year":2017,"roc_year":106,"session":"","examNo":68,"q":"犬乾性角膜結膜炎（keratoconjunctivitis sicca），係指眼睛缺乏下列何者？","opts":["A. 視紫質","B. 淚液","C. 眼前房水樣液","D. 玻璃體"],"ans":1,"exp":"乾性角膜結膜炎（KCS, Keratoconjunctivitis Sicca）定義是眼睛缺乏足夠的淚液（aqueous component of tear film），導致角膜和結膜乾燥、慢性炎症，最終可能引起角膜潰瘍和失明。","we":["KCS確實與自體免疫有關（如舍格林症候群analogous），但定義是淚液缺乏。","KCS = 眼睛缺乏淚液，正確。","KCS不是結膜腫脹的直接原因。","KCS不主要引起眼壓升高（青光眼是不同疾病）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_069","year":2017,"roc_year":106,"session":"","examNo":69,"q":"引起犬貓滲透性下痢之最主要病因為","opts":["A. 細菌性腸內毒素","B. 消化不良或吸收不良","C. 蛋白質流失性腸病","D. 淋巴球性漿細胞性腸炎"],"ans":1,"exp":"滲透性下痢（osmotic diarrhea）是因腸道內存在未被消化吸收的滲透性物質，將水分吸引至腸腔，最主要病因是消化不良（maldigestion）或吸收不良（malabsorption），禁食後可改善。","we":["腸道分泌增加造成分泌性下痢，非滲透性下痢。","消化不良或吸收不良是滲透性下痢的最主要病因，正確。","腸黏膜通透性增加造成滲出性下痢，非滲透性下痢。","腸道動力異常可加重但不是滲透性下痢的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_070","year":2017,"roc_year":106,"session":"","examNo":70,"q":"下列何項犬病會引起舌頭邊緣壞疽性舌炎?","opts":["A. 慢性鈎端螺旋體病","B. 犬傳染性肝炎","C. 犬瘟熱","D. 犬疱疹病毒感染"],"ans":0,"exp":"慢性鉤端螺旋體病（chronic leptospirosis）引起慢性腎衰竭（chronic renal failure），造成尿毒症（uremia），尿毒症可導致壞疽性舌炎（gangrenous glossitis/uremic stomatitis），舌頭潰瘍壞死。","we":["慢性鉤端螺旋體病→腎衰竭→尿毒症→壞疽性舌炎，正確。","慢性鉤端螺旋體病不主要引起關節炎。","慢性鉤端螺旋體病不主要引起腦炎。","慢性鉤端螺旋體病不主要引起肝硬化（急性可引起黃疸）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_071","year":2017,"roc_year":106,"session":"","examNo":71,"q":"下列何項無法避免犬發生胃捻轉？","opts":["A. 減少餵食次數","B. 不要繁殖有胃扭轉病史的犬","C. 進行預防性的胃固定術","D. 不和其他犬一起餵食"],"ans":0,"exp":"犬胃擴張-扭轉（GDV, Gastric Dilatation-Volvulus）的預防措施包括：少量多餐（多次餵食）、進食後避免劇烈運動、使用慢食碗等。「減少餵食次數」（即一天一餐大量餵食）反而增加GDV風險，是錯誤的預防方式。","we":["減少餵食次數反而增加GDV風險，此項描述錯誤為答案。","進食後避免劇烈運動可降低GDV風險，正確。","大型犬使用抬高食碗有爭議，但少量多餐是有效預防措施。","對高風險犬種進行預防性胃固定術（gastropexy）可有效預防GDV，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_072","year":2017,"roc_year":106,"session":"","examNo":72,"q":"一隻未摘除卵巢之6歲拉不拉多母犬，飼主發現於6星期前出現發情徵候，近幾日於陰戶發現有膿樣分泌物、\r 發燒、食慾不振、多渴及多尿，該病犬最有可能罹患下列何種疾病？","opts":["A. 子宮蓄膿","B. 胃腸炎","C. 糖尿病","D. 腎上腺皮質功能亢進症"],"ans":0,"exp":"6歲拉不拉多母犬，6週前發情結束，現出現膿樣陰道分泌物+多尿多飲（PU/PD），此為子宮蓄膿（pyometra）的典型表現，通常在發情後黃體期（4-8週後）發生，E. coli最常見。","we":["子宮蓄膿（pyometra）是6週後發情出現膿樣分泌物+PU/PD的最可能診斷，正確。","陰道炎（vaginitis）分泌物量較少，無PU/PD。","子宮內膜炎（endometritis）程度較輕，通常無膿性分泌物。","卵巢囊腫不引起膿性陰道分泌物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_073","year":2017,"roc_year":106,"session":"","examNo":73,"q":"犬的關節軟骨（articular cartilage）共可分為四層，下列何項具有將關節軟骨固定於軟骨下骨（subchondral\r bone）的功用？","opts":["A. 表面層（superficial zone）","B. 過渡層（transitional zone）","C. 深層（deep zone）","D. 鈣化軟骨層（calcified cartilage zone）"],"ans":3,"exp":"關節軟骨的深層為鈣化軟骨層（calcified cartilage zone/tidemark zone），其功能是將關節軟骨（hyaline cartilage）固定並錨定於軟骨下骨（subchondral bone），防止軟骨剝離。","we":["鈣化軟骨層不是軟骨的主要代謝中心。","鈣化軟骨層不是緩衝衝擊的主要層（表層和中間層負責）。","鈣化軟骨層不分泌滑液（滑膜負責）。","鈣化軟骨層的功能是固定關節軟骨於軟骨下骨，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_074","year":2017,"roc_year":106,"session":"","examNo":74,"q":"下列何種犬尿道造口術（urethrostomy），因為該處尿道較寬，較淺表及僅有較少量海綿狀組織包圍，比起其\r 他造口術較常被採用？","opts":["A. prepubic urethrostomy","B. subpubic urethrostomy","C. perineal urethrostomy","D. scrotal urethrostomy"],"ans":3,"exp":"陰囊尿道造口術（Scrotal urethrostomy）是貓（和犬）常用的尿道造口術，選擇陰囊部位因為：此處尿道較寬（lumen wider）、位置較淺表（superficial）、海綿體組織較少（less erectile tissue），出血少，是最常被採用的手術部位。","we":["會陰尿道造口術（Perineal urethrostomy）在貓常用，但陰囊部位具有前述優點。","陰莖尿道造口術（Penile urethrostomy）海綿體組織多，出血風險高。","恥骨前尿道造口術較複雜，不是首選。","陰囊尿道造口術因尿道較寬/較淺表/較少海綿體，最常被採用，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_075","year":2017,"roc_year":106,"session":"","examNo":75,"q":"貓乳腺腫瘤的敘述，下列何項錯誤？","opts":["A. 貓通常有四對乳腺","B. 貓乳腺腫瘤大多為惡性","C. 貓乳腺腫瘤最常發生於較後方的乳房","D. 貓左上第一乳腺發生腫瘤時，應進行該側全乳房切除術"],"ans":2,"exp":"犬乳腺腫瘤最常發生於後方第4、第5對乳腺；貓乳腺腫瘤在各乳腺分布較均勻，沒有特別好發於後方乳腺的傾向。「貓乳腺腫瘤最常發生於較後方的乳房」是錯誤描述。","we":["貓乳腺腫瘤85-90%為惡性，正確。","貓乳腺腫瘤以腺癌最常見，正確。","「最常發生於較後方」是犬的特點，非貓，此項錯誤為答案。","貓乳腺腫瘤建議雙側乳腺切除，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_076","year":2017,"roc_year":106,"session":"","examNo":76,"q":"在治療骨折時，有時需要使用到骨移植術。其中關於cortical bone autograft之敘述，下列何項最不適當？","opts":["A. 必須取自cortical bone取出後不會有副作用的部位","B. 可選擇腸骨翼、肋骨、遠端尺骨或腓骨","C. 可選擇遠端橈骨或脛骨","D. 移植骨嵌入骨折的缺損部位，或者是置於骨折部位側邊"],"ans":2,"exp":"自體皮質骨移植（cortical bone autograft）供骨部位應選擇非主要承重骨，如肋骨、腓骨、尺骨遠端等。橈骨和脛骨是主要承重骨，取骨後造成供骨部位骨折風險高，不適合作為供骨部位。","we":["肋骨（rib）是常用的皮質骨供骨部位，正確。","腓骨（fibula）是非主要承重骨，可作供骨部位，正確。","「選擇遠端橈骨或脛骨」不適當，因為這些是主要承重骨，此項錯誤為答案。","尺骨（ulna）遠端可用作供骨部位，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_077","year":2017,"roc_year":106,"session":"","examNo":77,"q":"Robert Jones bandages為獸醫最常使用的外夾板固定法之一，下列何項最不適當？","opts":["A. 可用於術前或術後患肢的短暫夾板固定","B. 可減少軟組織的進一步傷害","C. 可用於股骨或肱骨的骨折","D. 可用於脛骨或橈骨的骨折"],"ans":2,"exp":"Robert Jones bandage是厚棉花墊加壓繃帶，只能穩定肘關節（elbow）或膝關節（stifle）以遠的骨折。股骨（femur）和肱骨（humerus）位於關節近端，Robert Jones bandage無法有效固定，是最不適當的應用。","we":["Robert Jones bandage可用於遠端橈骨骨折穩定，正確。","Robert Jones bandage可用於蹠骨（metatarsal）骨折，正確。","「用於股骨或肱骨的骨折」最不適當，因位置在關節近端，正確為答案。","Robert Jones bandage適用於掌骨（metacarpal）骨折，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_078","year":2017,"roc_year":106,"session":"","examNo":78,"q":"下列何項神經肌肉阻斷劑（neuromuscular blocking agents）在犬的作用時間（duration）最長？","opts":["A. mivacurium","B. atracurium","C. vecuronium","D. pancuronium"],"ans":3,"exp":"非去極化肌肉鬆弛劑（non-depolarizing NMB）作用時間比較：Succinylcholine（去極化，5-15分鐘最短）< Vecuronium（20-35分鐘）< Atracurium（25-40分鐘）< Pancuronium（60-90分鐘，作用時間最長）。","we":["Succinylcholine是去極化鬆弛劑，作用時間最短。","Vecuronium作用時間為20-35分鐘，非最長。","Atracurium作用時間為25-40分鐘，非最長。","Pancuronium作用時間60-90分鐘，是作用時間最長的，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_079","year":2017,"roc_year":106,"session":"","examNo":79,"q":"下列何項疾病其放射線檢查會出現增生性（proliferative）的骨病變，且在關節液細胞學檢查會出現非退行性\r 嗜中性球（nondegenerative neutrophils）？","opts":["A. 全身性紅斑性狼瘡（systemic lupus erythematosus）","B. 漿細胞淋巴細胞性滑膜炎（plasmacytic-lymphocytic synovitis）","C. 退行性關節病（degenerative joint disease）","D. 風濕性關節炎（rheumatoid arthritis）"],"ans":3,"exp":"關節液分析+影像學結果：增生性骨病變（proliferative bone changes）+ 非退行性嗜中性球關節液（non-degenerative neutrophilic joint fluid）= 免疫介導性多發性關節炎，其中增生性骨病變指向風濕性關節炎（rheumatoid arthritis）。","we":["感染性關節炎（septic arthritis）關節液有退行性嗜中性球（degenerate neutrophils），正確。","骨關節炎（osteoarthritis）關節液以單核球為主，無嗜中性球增多。","水晶體誘發性關節炎（crystal-induced arthritis）關節液有水晶體。","增生性骨病變+非退行性嗜中性球關節液=風濕性關節炎，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_080","year":2017,"roc_year":106,"session":"","examNo":80,"q":"下列那一種氣體麻醉藥物，在犬脂肪組織的氣體分配係數（adipose／gas partition coefficient）值最高？","opts":["A. methoxyflurane","B. sevoflurane","C. isoflurane","D. desflurane"],"ans":0,"exp":"Methoxyflurane（甲氧氟烷）的脂肪組織/氣體分配係數（fat:gas partition coefficient）非常高（約970），意味著其在脂肪組織中高度溶解，麻醉誘導慢，代謝廣泛（70%在肝臟代謝），現代已因腎毒性而較少使用。","we":["Methoxyflurane的脂肪/氣體分配係數~970，各吸入麻醉劑中最高，正確。","Halothane的脂肪/氣體分配係數約224，遠低於methoxyflurane。","Isoflurane的脂肪/氣體分配係數約45，低。","Sevoflurane的脂肪/氣體分配係數約47，低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_001","year":2018,"roc_year":107,"session":"","examNo":1,"q":"一匹馬在天氣較熱時可見其耳、鬃毛及尾根部脫毛，因癢而不斷磨擦，其患部皮膚變厚且形成苔蘚化 （lichenification）及皺摺，此匹馬最可能罹患下列何項疾病？","opts":["A. sarcoid","B. insect（Culicoides spp.）hypersensitivity","C. equine Cushing's disease","D. pemphigus foliaceus"],"ans":1,"exp":"馬在天熱時耳、鬃毛、尾根部出現季節性脫毛，因癢不斷磨擦，皮膚苔蘚化，是Culicoides spp.（庫蠓）過敏的典型表現（昆蟲過敏性皮膚炎）。","we":["(A) Sarcoid是纖維母細胞性皮膚腫瘤，不引起季節性搔癢和苔蘚化。","(C) 馬庫興症（PPID）引起多毛症（多毛、捲曲）而非脫毛搔癢。","(D) Pemphigus foliaceus是自體免疫性皮膚病，以鱗屑和結痂為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_002","year":2018,"roc_year":107,"session":"","examNo":2,"q":"下列何種情況不會自馬鼻腔流出血液？","opts":["A. 運動引發之肺出血（exercise-induced pulmonary hemorrhage）","B. 耳咽管憩室黴菌症（guttural pouch mycosis）","C. ethmoid hematoma","D. 軟顎背側異位（dorsal displacement of the soft palate）"],"ans":3,"exp":"軟顎背側異位（DDSP）是馬匹上呼吸道阻塞，主要引起運動時喉嚨發出聲響和呼吸困難，不會引起鼻腔出血。其他選項（EIPH、耳咽管黴菌症、篩骨血腫）都會引起鼻腔出血。","we":["(A) 運動引發肺出血（EIPH）：肺出血後血液從下呼吸道流至鼻腔。","(B) 耳咽管憩室黴菌症：黴菌侵蝕頸內動脈→嚴重鼻出血。","(C) Ethmoid hematoma：篩骨血腫破裂→鼻腔出血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_003","year":2018,"roc_year":107,"session":"","examNo":3,"q":"一匹馬可見一不規則團塊於眼瞼及第三眼瞼處，此匹馬最可能罹患下列何項疾病？","opts":["A. lipoma","B. sinusitis","C. hyperthyroidism","D. squamous cell carcinoma"],"ans":3,"exp":"馬眼瞼及第三眼瞼處不規則團塊最常見的是鱗狀細胞癌（squamous cell carcinoma），是馬最常見的眼部腫瘤，好發於眼周無色素區域，特別是第三眼瞼。","we":["(A) 脂肪瘤（lipoma）在馬眼部少見，多見於腹腔。","(B) 鼻竇炎（sinusitis）不引起眼瞼腫塊。","(C) 甲狀腺機能亢進（hyperthyroidism）在馬極少見，不引起眼瞼腫塊。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_004","year":2018,"roc_year":107,"session":"","examNo":4,"q":"在馬匹疝痛時，下列那一項指標較不能作為實施外科處置的判斷標準？","opts":["A. 給與止痛劑後仍反覆疼痛","B. 蠕動音增加","C. 心搏速率持續上升，搏動減弱（weak pulse）","D. 直腸觸診摸到擴張小腸，且持續自鼻胃管導引出大量液體"],"ans":1,"exp":"馬疝痛需要外科手術的指標包括：止痛劑無效、心搏持續上升/脈搏減弱、直腸觸診摸到擴張小腸且大量鼻胃管液。蠕動音增加是腸道過度活動（如腸痙攣）的表現，反而提示可保守治療，不是手術指標。","we":["(A) 給止痛劑後仍反覆疼痛→藥物控制失敗→需手術。","(C) 心搏持續上升+脈搏減弱→休克指標→需手術。","(D) 直腸觸診擴張小腸+大量鼻胃管液→機械性阻塞→需手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_005","year":2018,"roc_year":107,"session":"","examNo":5,"q":"下列有關馬匹消化道手術後造成腸道粘連的敘述，何者錯誤？","opts":["A. 常發生於小腸手術後，例如小腸吻合術","B. 通常預後不佳","C. 自間歇性慢性疝痛至急性疝痛皆可能出現","D. 常造成大腸異位"],"ans":3,"exp":"腸道粘連（intestinal adhesion）常見於小腸手術後，造成的是小腸性腸梗阻（小腸阻塞/絞窄），「常造成大腸異位」是錯誤的——粘連主要影響小腸，不會造成結腸異位。","we":["(A) 小腸手術後粘連是正確的（如吻合術後）。","(B) 預後不佳是正確的（粘連難以完全解決）。","(C) 從慢性間歇性到急性疝痛皆可出現是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_006","year":2018,"roc_year":107,"session":"","examNo":6,"q":"下列何種草食動物較易發生先天性紫質病（congenital porphyria）？","opts":["A. 兔","B. 羊","C. 馬","D. 牛"],"ans":3,"exp":"先天性紫質病（Congenital Erythropoietic Porphyria）在牛（特別是荷蘭牛）最為常見，是一種遺傳性紫質代謝障礙，引起光敏性、牙齒紅色變色（porphyrin沉積）。","we":["(A) 兔的先天性紫質病極罕見。","(B) 羊的先天性紫質病較少見。","(C) 馬的先天性紫質病不常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_007","year":2018,"roc_year":107,"session":"","examNo":7,"q":"成牛發燒且體溫最低高於多少度（cut-off）時，應建議使用抗微生物製劑？","opts":["A. 39.5℃","B. 40℃","C. 40.5℃","D. 41℃"],"ans":1,"exp":"成牛正常體溫約38-39°C，40°C以上（cut-off: 40°C）才建議使用抗微生物製劑，以確保真正的細菌性感染，避免不必要的抗生素使用。","we":["(A) 39.5°C仍在牛正常體溫上限範圍，不需要立即抗生素。","(C) 40.5°C雖可使用，但40°C是更準確的cut-off。","(D) 41°C等待時間過長，可能延誤治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_008","year":2018,"roc_year":107,"session":"","examNo":8,"q":"牛乳房炎防治的策略上，每日飼料中硒（Se）之添加量應為多少？","opts":["A. 不用添加","B. 0.1 ppb","C. 0.2 ppb","D. 0.3 ppm"],"ans":3,"exp":"乳房炎防治策略中，每日飼料中硒（Se）添加量建議為0.3 ppm（mg/kg飼料乾物質），以維持正常免疫功能。","we":["(A) 不添加硒不足以預防乳房炎。","(B) 0.1 ppb計算單位有誤，且量不足。","(C) 0.2 ppb單位有誤，且量不足。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_009","year":2018,"roc_year":107,"session":"","examNo":9,"q":"下列那一種乳房炎病原菌一旦侵入乳牛乳房內部，其主要感染及分布密度最高的區域並非在乳腺表面之上皮細\r 胞？","opts":["A. 乳房鏈球菌（Streptococcus uberis）","B. 異乳鏈球菌（Streptococcus dysgalactiae）","C. 無乳鏈球菌（Streptococcus agalactiae）","D. 凝固酶陰性葡萄球菌（coagulase-negative Staphylococci）"],"ans":0,"exp":"Streptococcus uberis一旦侵入乳腺，不僅附著在乳腺上皮表面，還能侵入細胞內（intracellular invasion），在細胞內增殖，因此其主要感染密度最高的區域並非只在乳腺上皮表面，而是在細胞內及間質組織。","we":["(B) S. dysgalactiae主要附著在乳腺上皮表面，不侵入細胞。","(C) S. agalactiae主要在乳腺上皮表面繁殖，是典型的傳染性乳腺炎病原。","(D) 凝固酶陰性葡萄球菌主要在乳腺導管表面，不特別侵入細胞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_010","year":2018,"roc_year":107,"session":"","examNo":10,"q":"牛亞臨床型乳房炎（subclinical mastitis）之檢測中，下列何項最具診斷意義？","opts":["A. 生乳生菌數增加","B. 血液白血球總數上升","C. 生乳體細胞數增加","D. 生乳NAG酶活性上升"],"ans":2,"exp":"亞臨床型乳房炎最重要的診斷指標是生乳體細胞數（SCC）增加，是牛群乳房健康監控的核心指標（>200,000 cells/mL為異常）。","we":["(A) 生乳生菌數增加是細菌汙染的指標，不如SCC特異。","(B) 血液白血球總數對亞臨床型乳房炎診斷意義不大（全身反應不明顯）。","(D) NAG酶活性雖敏感但非常規檢測，不如SCC實用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_011","year":2018,"roc_year":107,"session":"","examNo":11,"q":"放牧牛群出現外觀消瘦、被毛脫落、容易跌倒或後軀無力，並有貧血以及慢性下痢等臨床症狀時，可能與下\r 列何種微量元素缺乏有關？","opts":["A. 鋅","B. 鈷","C. 碘","D. 銅"],"ans":3,"exp":"放牧牛群消瘦、被毛脫落（脫色）、後軀無力（共濟失調）、貧血、慢性下痢是銅（Cu）缺乏的典型症狀。銅缺乏影響髓鞘形成（神經症狀）、血紅素合成（貧血）和毛色（脫色）。","we":["(A) 鋅缺乏主要引起皮膚角化過度（parakeratosis）和生長遲緩，不是後軀無力和貧血。","(B) 鈷缺乏主要引起VitB12缺乏→消瘦、食慾不振，但不是後軀無力和典型貧血。","(C) 碘缺乏主要引起甲狀腺腫（goiter）和甲狀腺機能不足，不是這組症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_012","year":2018,"roc_year":107,"session":"","examNo":12,"q":"牛尿中無尿膽素原最易出現於下列何種狀況？","opts":["A. 部分膽管阻塞","B. 溶血性黃疸","C. 肝外性膽管完全阻塞","D. 膽石阻塞部分膽管"],"ans":2,"exp":"尿中無尿膽素原最易出現於肝外性膽管完全阻塞——膽管完全阻塞時，膽汁無法進入腸道，膽紅素無法被腸道細菌還原為尿膽素原，因此尿中和糞中尿膽素原均消失。","we":["(A) 部分膽管阻塞時仍有少量膽汁通過，尿膽素原仍可存在（減少）。","(B) 溶血性黃疸時大量膽紅素進入腸道→尿膽素原增加（不是消失）。","(D) 膽石阻塞部分膽管=部分阻塞，同選項A，尿膽素原減少但不消失。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_013","year":2018,"roc_year":107,"session":"","examNo":13,"q":"乳牛因為營養不平衡引起分娩後之胎盤滯留（retained fetal membrane）的因子中，與下列何項無關？","opts":["A. 乾乳期過胖","B. 胡蘿蔔素（carotene）過量","C. 硒（selenium）缺乏","D. 維生素Ａ缺乏"],"ans":1,"exp":"胡蘿蔔素「過量」與胎盤滯留無關；反而是胡蘿蔔素（VitA前驅物）缺乏才與胎盤滯留有關。其他選項（乾乳期過胖→負能量平衡、Se缺乏→免疫功能下降、VitA缺乏）均與胎盤滯留有關。","we":["(A) 乾乳期過胖→分娩後負能量平衡加重→免疫功能受損→胎盤滯留。","(C) 硒缺乏→白肌病和免疫功能下降→胎盤滯留發生率上升。","(D) VitA缺乏→胎盤上皮角化→胎兒胎盤黏連→胎盤滯留。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_014","year":2018,"roc_year":107,"session":"","examNo":14,"q":"在牛皺胃左側異位時，下列何項症狀不會出現？","opts":["A. 急性症時會出現疝痛","B. 乳汁及尿中會出現酮體","C. 左側肋間出現區域性金屬音","D. 排糞量多且呈下痢狀"],"ans":3,"exp":"皺胃左側異位（LDA）的主要症狀：食慾不振、產乳量下降、酮病（乳汁/尿中酮體升高）、左側金屬叩診音。「排糞量多且呈下痢」不是LDA的特徵——LDA患牛糞量通常減少（腸道蠕動受影響）。","we":["(A) 急性時疝痛可出現（少見）。","(B) 乳汁和尿中酮體上升是繼發酮病的表現。","(C) 左側肋間金屬音（ping）是LDA的典型叩診發現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_015","year":2018,"roc_year":107,"session":"","examNo":15,"q":"十二週齡以下的仔牛發生沙氏桿菌血行性骨髓炎時，最常發生的部位在何處？","opts":["A. 上骨骺區","B. 上骨幹區","C. 下骨骺區","D. 下骨幹區"],"ans":0,"exp":"十二週齡以下仔牛發生沙氏桿菌（Salmonella）血行性骨髓炎時，最常見的部位是上骨骺區（proximal epiphysis），因為此年齡層此部位血流豐富、血流緩慢，細菌易停留定植。","we":["(B) 上骨幹區（diaphysis）血流相對較少，不是最常見部位。","(C) 下骨骺區偶爾受累但不是最常見。","(D) 下骨幹區不是仔牛骨髓炎的典型部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_016","year":2018,"roc_year":107,"session":"","examNo":16,"q":"下列有關以聽叩診來診斷乳牛皺胃左側異位的敘述，何者錯誤？","opts":["A. 金屬音的範圍有可能超過最後肋骨（第13根）後緣","B. 金屬音最高可達脊椎橫突下緣","C. 金屬音的範圍可以涵蓋整個腹脇部（paralumbar fossa）","D. 金屬音的範圍前後邊緣距離可達30至45公分"],"ans":2,"exp":"LDA的聽叩診金屬音範圍：「可以涵蓋整個腹脇部（paralumbar fossa）」是錯誤的——LDA金屬音通常局限在左側最後2-3肋骨間，不延伸至腹脇部（腰窩），前後距離可達30-45cm是正確的。","we":["(A) 金屬音可能超過第13肋骨後緣是正確的（皺胃向後移位時）。","(B) 金屬音最高可達脊椎橫突下緣是正確的（皺胃向上移位時）。","(D) 金屬音前後邊緣距離30-45cm是正確描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_017","year":2018,"roc_year":107,"session":"","examNo":17,"q":"乳牛在分娩後的第四胃異位是一種代謝性疾病，下列那一項狀況是第四胃左側異位的原發性機能障礙？","opts":["A. 第四胃擴張","B. 第四胃皺縮","C. 第四胃弛緩","D. 第四胃捻轉"],"ans":2,"exp":"LDA的原發性機能障礙是第四胃弛緩（abomasal atony）——皺胃肌肉弛緩、蠕動減弱，使氣體積聚，皺胃浮起向左側移位。分娩前後荷爾蒙變化（孕酮升高）和採食量下降是誘因。","we":["(A) 第四胃擴張是弛緩的結果，不是原發原因。","(B) 第四胃皺縮不會引起異位。","(D) 第四胃捻轉是右側異位的嚴重並發症，不是LDA的原發問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_018","year":2018,"roc_year":107,"session":"","examNo":18,"q":"牛腹水抽出物在下列何種條件下可判定為滲出液（exudate）？","opts":["A. 比重1.015以下，蛋白質含量3g/100mL以下，以白蛋白為主","B. 比重1.015以下，蛋白質含量3g/100mL以上，以球蛋白為主","C. 比重1.015以上，蛋白質含量3g/100mL以下，以白蛋白為主","D. 比重1.015以上，蛋白質含量3g/100mL以上，以球蛋白為主"],"ans":3,"exp":"滲出液（exudate）特徵：比重>1.015（蛋白豐富）、蛋白質>3g/100mL、以球蛋白為主（炎症蛋白）。漏出液（transudate）比重<1.015、蛋白質<3g、以白蛋白為主。","we":["(A) 低比重+低蛋白+白蛋白為主=典型漏出液（transudate）。","(B) 低比重+高蛋白+球蛋白=不符合典型分類。","(C) 高比重+低蛋白+白蛋白=改良性漏出液（modified transudate），非典型滲出液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_019","year":2018,"roc_year":107,"session":"","examNo":19,"q":"添加下列何物，可用來預防牛隻碳水化合物過食所引起之大腦皮質壞死症？","opts":["A. 維生素B6","B. 維生素B1","C. 維生素A","D. 氯化銨"],"ans":1,"exp":"大腦皮質壞死症（PEM）由VitB1（硫胺素/thiamine）缺乏引起。碳水化合物過食→瘤胃產生硫胺素酶→破壞VitB1→神經細胞能量代謝障礙→大腦皮質壞死。添加VitB1可預防。","we":["(A) VitB6與PEM無直接關係。","(C) VitA缺乏引起夜盲和皮膚角化，不是PEM。","(D) 氯化銨用於調整尿液酸鹼度，與PEM無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_020","year":2018,"roc_year":107,"session":"","examNo":20,"q":"以2 % lidocaine進行一頭成牛的眼球摘除前所施行之麻醉法Peterson nerve block時，最少需注射多少劑量？","opts":["A. 5 ml","B. 10 ml","C. 20 ml","D. 40 ml"],"ans":2,"exp":"Peterson nerve block進行牛眼球摘除，通常需要在眼球後方（foramen orbitorotundum）及周圍各神經進行4個注射點，每點約5mL，最少需注射約20mL的2% lidocaine。","we":["(A) 5mL太少，不足以阻斷所有眼球相關神經分支。","(B) 10mL也不足以涵蓋Peterson technique的所有注射點。","(D) 40mL是完整Peterson +輔助神經阻斷的最大劑量，非最少劑量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_021","year":2018,"roc_year":107,"session":"","examNo":21,"q":"下列有關進行牛帝王切開術的注意事項中，何者錯誤？","opts":["A. 要切開子宮的部位離子宮角越近越好","B. 若有氣腫胎病例，最好從左腹脇部切開","C. 子宮角大彎是最好的切開部位，此處血管分布較少","D. 應避免切到宮阜，減少出血"],"ans":0,"exp":"「切開子宮的部位離子宮角越近越好」是錯誤的——牛帝王切開術的最佳切開部位是子宮角的大彎側（greater curvature），而且應靠近子宮角基部（不是角尖），以方便取出胎兒且避免大血管。","we":["(B) 氣腫胎最好從左腹脇部切開以避免腹腔汙染是正確的。","(C) 子宮角大彎是最好的切開部位是正確的。","(D) 應避免切到宮阜（caruncle）以減少出血是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_022","year":2018,"roc_year":107,"session":"","examNo":22,"q":"以牛外科手術之無菌操作標準，用以移除蜂巢胃金屬異物之rumenotomy手術屬於下列那一等級？","opts":["A. clean procedure","B. clean-contaminated procedure","C. contaminated procedure","D. dirty procedure"],"ans":1,"exp":"Rumenotomy（瘤胃切開術）屬於clean-contaminated procedure（清潔－汙染手術）——手術進入消化道（瘤胃/消化道），但在控制情況下進行，屬於第二類手術等級。","we":["(A) Clean procedure（清潔手術）不進入消化道、呼吸道、泌尿道，rumenotomy不符合。","(C) Contaminated procedure（汙染手術）是消化道明顯破損或感染性腹腔，rumenotomy通常不到此程度。","(D) Dirty procedure（污穢手術）是感染性、化膿性傷口，更嚴重程度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_023","year":2018,"roc_year":107,"session":"","examNo":23,"q":"母牛的子宮脫整復後，陰戶採下列何種縫合較為適合？","opts":["A. 十字縫合法","B. 荷包縫合法","C. 間斷縫合法","D. Cushing縫合法"],"ans":1,"exp":"子宮脫整復後，陰戶以荷包縫合法（purse-string suture）縫合最為適合，可均勻縮小陰門開口，防止子宮再次脫出，且取縫方便。","we":["(A) 十字縫合法（cross-mattress suture）提供的張力不均勻，不是最適合預防復發的縫合。","(C) 間斷縫合法不能有效縮小整個陰門開口。","(D) Cushing縫合法是內翻縫合，用於腸道或胃手術，不適合陰門縫合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_024","year":2018,"roc_year":107,"session":"","examNo":24,"q":"在進行牛隻帝王切開術（Cesarean section）時，除了施打局部或區域麻醉劑之外，為了避免母牛因手術疼\r 痛而倒下，還可施打下列何種藥物？","opts":["A. flunixin meglumine","B. xylazine","C. pentobarbital","D. diazepam"],"ans":0,"exp":"牛帝王切開術除局部/區域麻醉外，為防止因疼痛而倒下，可以使用flunixin meglumine（非類固醇消炎止痛藥，NSAID），提供全身性止痛效果而不影響站立能力。","we":["(B) Xylazine是α2-agonist鎮靜劑，會使牛躺下/鎮靜，不適合需要站立完成的手術。","(C) Pentobarbital是麻醉誘導劑，會使動物失去意識，不適合。","(D) Diazepam是苯二氮平類鎮靜藥，會引起肌肉鬆弛和鎮靜，不適合站立手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_025","year":2018,"roc_year":107,"session":"","examNo":25,"q":"進行乳牛眼球摘除術所施行之Peterson nerve block，其麻醉範圍不包括下列何項？","opts":["A. 眼球","B. 上、下眼瞼","C. 眼窩組織","D. 環眼肌"],"ans":3,"exp":"Peterson nerve block麻醉範圍包括眼球、上下眼瞼感覺、眼窩組織，但不包括環眼肌（orbicularis oculi）的運動控制——環眼肌由顏面神經（auriculopalpebral nerve）支配，需要另外進行auriculopalpebral block。","we":["(A) 眼球麻醉是Peterson block的主要目的。","(B) 上下眼瞼的感覺麻醉包含在Peterson block的顴顳神經等分支中。","(C) 眼窩組織（筋膜、球後組織）麻醉也在Peterson block範圍內。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_026","year":2018,"roc_year":107,"session":"","examNo":26,"q":"下列有關行Caslick手術修復牛會陰撕裂傷口的敘述，何項最為正確？","opts":["A. 僅可修復第一度撕裂傷","B. 僅可修復第一及第二度撕裂傷","C. 僅可修復第二及第三度撕裂傷","D. 可修復第一、第二及第三度撕裂傷"],"ans":3,"exp":"Caslick手術（陰唇縫合術）修復牛會陰撕裂傷可用於第一、第二及第三度撕裂傷——第一度僅累及陰唇，第二度累及肛門括約肌，第三度累及直腸陰道中隔，Caslick手術均可處理。","we":["(A) 僅修復第一度過於保守，低估Caslick的適應範圍。","(B) 僅修復第一二度也過於保守。","(C) 僅修復第二三度，排除第一度是不正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_027","year":2018,"roc_year":107,"session":"","examNo":27,"q":"乳牛皺胃右側異位以手術治療後，另外施打的神經興奮劑為","opts":["A. 交感神經興奮劑","B. 副交感神經興奮劑","C. 大腦皮質興奮劑","D. 大腦皮質抑制劑"],"ans":1,"exp":"皺胃右側異位術後，為恢復胃腸蠕動，需施打副交感神經興奮劑（如neostigmine、carbachol），以刺激平滑肌收縮、促進胃腸蠕動功能恢復。","we":["(A) 交感神經興奮劑會抑制胃腸蠕動，恰好相反。","(C) 大腦皮質興奮劑與胃腸蠕動無關。","(D) 大腦皮質抑制劑與胃腸蠕動無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_028","year":2018,"roc_year":107,"session":"","examNo":28,"q":"多頭蚴病（Coenurosis）薄壁的囊不會於何處寄生造成神經傳導性疾病？","opts":["A. 坐骨神經","B. 胸部脊髓","C. 腰部脊髓","D. 大腦"],"ans":0,"exp":"多頭蚴（Coenurus cerebralis）薄壁囊寄生在腦（大腦）和脊髓（胸腰部）引起神經症狀，但不會寄生在周邊神經如坐骨神經（坐骨神經是周邊神經，不是中樞神經）。","we":["(B) 胸部脊髓可以寄生，引起下肢癱瘓。","(C) 腰部脊髓可以寄生，引起後軀症狀。","(D) 大腦是最常見的寄生部位，引起轉圈、失明等症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_029","year":2018,"roc_year":107,"session":"","examNo":29,"q":"下列有關於Setaria屬絲蟲（Setaria spp.）感染羊隻之敘述，何者正確？","opts":["A. 可以感染馬、綿羊和山羊","B. 僅藉蚊子媒介感染","C. 寄生蟲僅寄生在脊髓組織","D. 其微絲蟲（microfilariae）之生活史主要是在蚊子體內完成"],"ans":0,"exp":"Setaria spp.（絲蟲屬）可以感染馬、綿羊和山羊（以及牛），在異常宿主（非牛類）中容易迷走至中樞神經系統引起腦脊髓絲蟲病（cerebrospinal nematodiasis）。","we":["(B) Setaria不僅藉蚊子媒介，部分種也可能有其他節肢動物媒介，「僅蚊子」說法過於絕對。","(C) 寄生蟲不僅在脊髓，也在腹腔（正常宿主）和大腦（異常宿主）。","(D) 微絲蟲生活史在蚊子體內完成部分L1→L3是正確的，但說「主要」容易有爭議。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_030","year":2018,"roc_year":107,"session":"","examNo":30,"q":"綿羊發生腦灰質軟化症（Policoencephalomalacia），在營養上以下列何項缺乏較易發生？","opts":["A. 硫胺素（thiamine）","B. 核黃素（riboflavin）","C. 葉黃素（cryptoxanthin）","D. 氰鈷胺（cyanocobalamin）"],"ans":0,"exp":"綿羊腦灰質軟化症（PEM, Polioencephalomalacia）主要因硫胺素（thiamine, VitB1）缺乏引起，原因包括：飼料中硫胺素酶存在（如某些植物）、瘤胃微生物失調、過多碳水化合物飼料。","we":["(B) 核黃素（riboflavin, VitB2）缺乏不引起PEM。","(C) 葉黃素（cryptoxanthin）是類胡蘿蔔素，不是PEM的相關缺乏。","(D) 氰鈷胺（cyanocobalamin, VitB12）缺乏引起貧血和神經症狀，但不是PEM的主要原因（間接via甲基丙二酸積累，但硫胺素缺乏更直接）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_031","year":2018,"roc_year":107,"session":"","examNo":31,"q":"下列何種病況與山羊的病毒性關節炎腦炎（CAE）有關？","opts":["A. 2－6個月齡小羊encephalomyelitis及母羊mastitis","B. 6個月齡以上山羊encephalitis及laminitis","C. 6個月齡以上山羊pneumonia及laminitis","D. 2－6個月齡小羊pneumonia及enteritis"],"ans":0,"exp":"山羊病毒性關節炎腦炎（CAE, Caprine Arthritis Encephalitis）的典型臨床表現：2-6個月齡小羊→進行性腦脊髓炎（encephalomyelitis）；成年母羊→慢性進行性關節炎+誘發性乳腺炎（indurative mastitis）。","we":["(B) 6個月以上山羊出現encephalitis及laminitis：laminitis不是CAE的典型表現。","(C) 6個月以上肺炎和蹄葉炎：肺炎是CAE的次要表現，蹄葉炎非典型。","(D) 2-6月齡小羊肺炎和腸炎：是其他疾病的表現，非典型CAE。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_032","year":2018,"roc_year":107,"session":"","examNo":32,"q":"仔羊腸痙攣時，可用等張葡萄糖液與下列何種藥物混合加溫行腹腔注射？","opts":["A. 0.5% procaine","B. 25% calcium borogluconate","C. 0.8% 氯化鈣","D. 5% 碳酸氫鈉"],"ans":0,"exp":"仔羊腸痙攣（intestinal spasm）的腹腔注射治療：等張葡萄糖液（提供能量和液體）加入0.5% procaine（局部麻醉劑，解除腸道痙攣），加溫至體溫後注射。","we":["(B) 25% calcium borogluconate：高張鈣劑，不適合與葡萄糖混合腹腔注射，且濃度過高。","(C) 0.8%氯化鈣：刺激性太強，不適合腹腔注射。","(D) 5%碳酸氫鈉：用於矯正代謝性酸中毒，不是解除腸道痙攣的用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_033","year":2018,"roc_year":107,"session":"","examNo":33,"q":"下列何項不適用於母豬的帝王切開術？","opts":["A. vetntral midline incision","B. ventral paramidline incision","C. right paralumbar fossa and flank approach","D. ventral paralumbar approach"],"ans":2,"exp":"母豬帝王切開術的適用切口包括腹側正中線、腹側旁正中線、左側腹脇部入路。Right paralumbar fossa（右腹脇部）不適用於母豬，因右側有盲腸，手術視野受限且損傷風險高。","we":["(A) Ventral midline（腹中線）是母豬帝王切開的標準切口之一。","(B) Ventral paramidline（腹側旁正中）也是常用切口。","(D) Ventral paralumbar approach（腹側腰部入路）也可使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_034","year":2018,"roc_year":107,"session":"","examNo":34,"q":"關於牛氣腫胎，下列敘述何項錯誤？","opts":["A. 若母牛有全身症狀須對症治療","B. 僅能行帝王切開術","C. 胎兒取出後應行子宮洗滌","D. 將來仍有受胎可能"],"ans":1,"exp":"氣腫胎（emphysematous fetus）處理「僅能行帝王切開術」是錯誤的——氣腫胎可以用截胎術（fetotomy）進行分解取出，這往往比帝王切開更適合（避免腹腔汙染）。","we":["(A) 若母牛有全身症狀需對症治療是正確的。","(C) 胎兒取出後行子宮洗滌是正確的（去除汙染物）。","(D) 將來仍有受胎可能是正確的（若子宮損傷不嚴重）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_035","year":2018,"roc_year":107,"session":"","examNo":35,"q":"母犬發生車禍並出現骨盤骨折後，下列那一項因素是造成其難產的常見原因？","opts":["A. 子宮捻轉（uterine torsion）","B. 子宮無力（uterine inertia）","C. 產道狹窄（narrow birth canal）","D. 子宮頸形成中隔（vaginal septum formation）"],"ans":2,"exp":"母犬骨盆骨折後難產的常見原因是產道狹窄（narrow birth canal）——骨折癒合後骨骼形態改變，骨盆腔變小，胎兒通過產道困難。","we":["(A) 子宮捻轉是子宮扭轉，與骨盆骨折無直接關係。","(B) 子宮無力（子宮收縮乏力）與骨盆骨折無關，是另一類難產原因。","(D) 陰道中隔是先天性異常，與骨盆骨折無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_036","year":2018,"roc_year":107,"session":"","examNo":36,"q":"正常乳牛平均懷孕期為","opts":["A. 260天","B. 280天","C. 300天","D. 320天"],"ans":1,"exp":"乳牛（Bos taurus）正常懷孕期約280天（約9個月），這是教科書標準數據。","we":["(A) 260天過短，不符合乳牛正常妊娠期。","(C) 300天已超出正常範圍（>283天可視為過期妊娠）。","(D) 320天明顯超過正常懷孕期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_037","year":2018,"roc_year":107,"session":"","examNo":37,"q":"下圖為母犬陰道抹片於顯微鏡下之影像，推論該母犬是處於動情週期的那一期？","opts":["A. 早期動情前期（early pro-oestrus）","B. 動情期（oestrus）","C. 動情後期（metoestrus）","D. 乏情期（anoestrus）"],"ans":1,"exp":"（本題含陰道抹片圖，需視圖判斷；答案標記為需複查）陰道塗片圖像判讀母犬發情週期。","we":["（需視圖判斷）","（需視圖判斷）","（需視圖判斷）","（需視圖判斷）"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1_普通病_038","year":2018,"roc_year":107,"session":"","examNo":38,"q":"下列何種動物，其排卵的方式需經過交配的刺激後才能誘發排卵？","opts":["A. 貓","B. 犬","C. 牛","D. 豬"],"ans":0,"exp":"貓（Felis catus）是誘導排卵動物（induced ovulator）——需要交配的刺激（機械刺激子宮頸+LH surge）才能引發排卵。如未交配，卵巢卵泡退化，不自發排卵。","we":["(B) 犬是自發排卵（spontaneous ovulator），不需交配刺激。","(C) 牛也是自發排卵動物。","(D) 豬也是自發排卵動物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_039","year":2018,"roc_year":107,"session":"","examNo":39,"q":"下列那一項是異性雙胎（freemartinism）女牛的臨床特徵？","opts":["A. 無發情","B. 不定期發情","C. 正常發情","D. 持續發情"],"ans":0,"exp":"Freemartin（異性雙胎不育症）雌牛的臨床特徵：無發情（無發情週期），因子宮和卵巢發育不全（雄性激素干擾胚胎期生殖道發育），無法正常排卵。","we":["(B) 不定期發情不是freemartin的表現（她們根本無法發情）。","(C) 正常發情：freemartin的卵巢功能不全，不能正常發情。","(D) 持續發情不是freemartin的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_040","year":2018,"roc_year":107,"session":"","examNo":40,"q":"初生仔畜經心肺復甦術後，經過多久仍無法自行呼吸時，則其存活機率不高？","opts":["A. 15秒","B. 30秒","C. 60－90秒","D. 2－3分鐘"],"ans":3,"exp":"初生仔畜經心肺復甦術（CPR）後，若在2-3分鐘內仍無法自行呼吸，則其存活機率不高——中樞神經系統缺氧損傷已嚴重，延長復甦成功率極低。","we":["(A) 15秒太短，尚在可努力復甦的早期。","(B) 30秒仍可繼續積極CPR。","(C) 60-90秒是正常新生兒應建立自發呼吸的時間，尚未到放棄的時點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_041","year":2018,"roc_year":107,"session":"","examNo":41,"q":"分娩動物第一期陣痛（first stage of labour）的徵候中，下列何項最不常見？","opts":["A. 子宮肌肉呈現規則性收縮","B. 動物不安","C. 動物體溫上升","D. 動物呼吸加速"],"ans":2,"exp":"分娩第一期陣痛（子宮擴張期）特徵：子宮肌肉規則收縮、動物不安、呼吸加速、食慾下降。「體溫上升」最不常見——分娩前體溫通常稍微下降（直腸溫度↓0.5-1°C）。","we":["(A) 子宮肌肉規則性收縮是第一期最重要特徵。","(B) 動物不安（restlessness）是第一期常見行為改變。","(D) 動物呼吸加速也常見於第一期陣痛反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_042","year":2018,"roc_year":107,"session":"","examNo":42,"q":"檢測乳汁或血清中的下列何項物質，可區別乳牛的濾泡囊腫（follicular cysts）或黃體囊腫（luteinised\r cysts）？","opts":["A. 助孕酮（progesterone）","B. 前列腺素（PGF2α）","C. 黃體刺激素（luteinising hormone，LH）","D. 泌乳素（prolactin）"],"ans":0,"exp":"區別濾泡囊腫和黃體囊腫最好的指標是助孕酮（progesterone）：濾泡囊腫→P4低（<1 ng/mL），黃體囊腫（黃體化囊腫）→P4高（>1 ng/mL）。","we":["(B) PGF2α是治療劑，不用於區分兩種囊腫。","(C) LH在兩種囊腫中都不典型地升高，不用於區分。","(D) 泌乳素（prolactin）與囊腫類型鑑別無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_043","year":2018,"roc_year":107,"session":"","examNo":43,"q":"下列何種動物的胎盤特徵，是屬於帶狀（zonary）胎盤？","opts":["A. 乳牛","B. 馬","C. 犬","D. 山羊"],"ans":2,"exp":"帶狀胎盤（zonary placenta）見於肉食目動物（carnivores），包括犬和貓。乳牛和山羊→子葉型（cotyledonary），馬→彌漫型（diffuse/villous）。","we":["(A) 乳牛胎盤是子葉型（cotyledonary），不是帶狀型。","(B) 馬胎盤是彌漫型（diffuse），不是帶狀型。","(D) 山羊胎盤是子葉型，不是帶狀型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_044","year":2018,"roc_year":107,"session":"","examNo":44,"q":"牛羊等動物進行發情同期化的處置中，陰道塞劑的成分含下列何項？","opts":["A. estrogen","B. progesterone","C. prostaglandin","D. gonadotrophin"],"ans":1,"exp":"牛羊發情同期化陰道塞劑（CIDR, Controlled Internal Drug Release）含有天然孕酮（progesterone），插入陰道持續釋放孕酮，模擬黃體期，同期化發情。","we":["(A) Estrogen雌激素不是陰道塞劑的主要成分（雌激素塞劑用於PRID等不同系統）。","(C) Prostaglandin（PGF2α）是注射劑，不是陰道塞劑形式。","(D) Gonadotrophin（FSH/LH）是注射劑，不是陰道塞劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_045","year":2018,"roc_year":107,"session":"","examNo":45,"q":"開放性動脈導管（PDA）中的少數病例在發生肺高壓後，可能導致PDA分流倒轉（shunt reversal），此類病\r 例不宜","opts":["A. 給與氧氣","B. 放血","C. 給與強心劑","D. 封閉動脈導管"],"ans":3,"exp":"PDA分流倒轉（Eisenmenger physiology）一旦發生，封閉動脈導管（closure of PDA）是禁忌——此時PDA充當「減壓閥」（pop-off valve）輸出肺動脈高壓，封閉後右心室壓力急劇升高→右心衰竭死亡。","we":["(A) 給氧氣（吸入NO或純氧）可部分緩解肺血管收縮。","(B) 放血（phlebotomy）降低紅血球增多症以降低血液黏稠度，可改善症狀。","(C) 給強心劑支持右心功能，可作為姑息治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_046","year":2018,"roc_year":107,"session":"","examNo":46,"q":"下列何項不會造成犬貓食道狹窄？","opts":["A. 全身麻醉","B. 開放性動脈導管","C. 食道異物","D. 對貓投予doxycycline"],"ans":1,"exp":"開放性動脈導管（PDA）本身不直接造成食道狹窄；造成食道狹窄的血管環異常是永久性右側主動脈弓（PRAA, persistent right aortic arch）。PRAA形成血管環壓迫食道→食道狹窄。","we":["(A) 全身麻醉時胃食道逆流→食道炎→食道狹窄，是可能的原因。","(C) 食道異物→食道壁壓迫壞死→癒合後狹窄，是常見原因。","(D) 貓投予doxycycline（四環素類）→食道黏膜直接損傷→嚴重食道狹窄，需膠囊後給水。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_047","year":2018,"roc_year":107,"session":"","examNo":47,"q":"肺動脈栓塞時，不易引發下列何項症狀？","opts":["A. 肺動脈高壓","B. 右心衰竭","C. 肺水腫","D. 左心衰竭"],"ans":3,"exp":"肺動脈栓塞（PE）→肺血管阻力增加→肺動脈高壓→右心後負荷增加→右心衰竭。不直接引起左心衰竭（左心未受直接影響，除非嚴重低氧和心輸出量下降時間夠長）。","we":["(A) 肺動脈高壓是PE最直接的後果之一。","(B) 右心衰竭是肺動脈高壓的繼發表現，常見於PE。","(C) 肺水腫在嚴重PE時可見（心輸出量下降引起）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_048","year":2018,"roc_year":107,"session":"","examNo":48,"q":"如果犬、貓因為左心衰竭而需要提供長時間的氧氣治療時，氧氣濃度應限制於","opts":["A. 20%","B. 40%","C. 60%","D. 80%"],"ans":1,"exp":"長時間氧氣治療（>24小時）的氧氣濃度應限制在40%以下——高濃度（>50%）純氧長期使用引起氧毒性（oxygen toxicity），損傷肺泡上皮細胞→ARDS。","we":["(A) 20%是空氣中氧氣濃度，不需要限制（太低無治療效果）。","(C) 60%用於短期急救可以，但長期使用有氧毒性風險。","(D) 80%濃度長時間使用會造成嚴重肺氧毒性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_049","year":2018,"roc_year":107,"session":"","examNo":49,"q":"動物呈現高血鉀時，心電圖變化常不包含下列何項？","opts":["A. 高T波","B. QRS波變窄","C. P波消失","D. 心跳變慢"],"ans":1,"exp":"高血鉀（hyperkalemia）心電圖變化：高T波（peaked T waves）、QRS波變寬（widened QRS，不是變窄）、P波消失、心跳變慢（bradycardia）。「QRS波變窄」是錯誤的，高血鉀使QRS波變寬。","we":["(A) 高T波（peaked T waves）是高血鉀最早的心電圖表現。","(C) P波消失（因心房傳導受阻）是高血鉀中期表現。","(D) 心跳變慢（bradycardia）是高血鉀抑制竇房結的結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_050","year":2018,"roc_year":107,"session":"","examNo":50,"q":"犬呈現眼眶凹陷、口腔黏膜乾燥時，其脫水程度的百分比為","opts":["A. ＜5%","B. 6%","C. 10%","D. ＞10%"],"ans":2,"exp":"犬脫水程度評估：眼眶凹陷（sunken eyes）+ 口腔黏膜乾燥 → 中度至重度脫水，約為8-10%。10%脫水時眼睛明顯凹陷、黏膜乾燥、皮膚彈性差。","we":["(A) <5%脫水：臨床幾乎無法偵測。","(B) 6%脫水：輕微，僅皮膚彈性稍差，無眼眶凹陷。","(D) >10%脫水：嚴重，伴有休克症狀（CRT延長、脈搏細弱）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_051","year":2018,"roc_year":107,"session":"","examNo":51,"q":"以連續式都卜勒（continuous wave Doppler）檢查心臟時，其最大的限制是","opts":["A. 計算流速受限","B. 影像不清晰","C. 無法僅偵測特定區域的流速與方向","D. 無法分辨血流方向"],"ans":2,"exp":"連續式都卜勒（CW Doppler）的最大限制是「無法僅偵測特定區域的流速與方向」（range ambiguity）——它偵測整個超音波束上所有位置的多普勒信號，無法定位信號來源位置；但可以精確測量高速血流。","we":["(A) CW Doppler的計算流速不受限（恰好相反，CW可測高速血流，PW有速度限制）。","(B) CW Doppler的影像清晰度不是主要限制問題。","(D) CW Doppler可以分辨血流方向（顏色或頻移正負）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_052","year":2018,"roc_year":107,"session":"","examNo":52,"q":"寡尿的動物出現下列那一項情況時，不適合使用mannitol？","opts":["A. 已給與過量輸液（fluid overload）","B. 血鉀過高（hyperkalemia）","C. 血磷過高（hyperphosphotemia）","D. 血鈣過高（hypercalcemia）"],"ans":0,"exp":"Mannitol（甘露醇）是高張性利尿劑，使用時會暫時增加血漿容積。已有過量輸液（fluid overload）的患者使用mannitol，會進一步加重循環負荷→肺水腫或心衰竭惡化，因此是禁忌症。","we":["(B) 高血鉀不是mannitol的禁忌症（mannitol可促進鉀排出）。","(C) 高血磷不是mannitol的禁忌症。","(D) 高血鈣不是mannitol的禁忌症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_053","year":2018,"roc_year":107,"session":"","examNo":53,"q":"犬在洗了含有機磷的驅蟲洗劑後，短時間出現輕微中毒症狀，下列何項處置應最優先？","opts":["A. 以水清洗皮膚","B. 儘快用吹風機或電暖器弄乾動物的皮毛","C. 迅速靜脈給與解毒劑pralidoxime（2-PAM）","D. 點滴注射林格氏液"],"ans":0,"exp":"有機磷（organophosphate）局部接觸中毒，最優先的處置是立即以大量清水清洗皮膚，去除殘留有機磷，防止繼續吸收——去除毒物來源（source removal）是最重要的第一步。","we":["(B) 用吹風機或電暖器加熱會促進皮膚吸收有機磷，不適當且危險。","(C) 2-PAM靜脈注射是解毒劑，但需先去除毒物來源（洗皮膚）。","(D) 林格氏液輸液是支持療法，在去除毒物後進行。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_054","year":2018,"roc_year":107,"session":"","examNo":54,"q":"下列那些疾病都會呈現犬多渴多尿的症狀？①糖尿病 ②慢性腎衰竭 ③急性腎衰竭 ④腎上腺機能亢進症\r ⑤尿崩症","opts":["A. ①②④⑤","B. ①③④⑤","C. ①②③⑤","D. ②③④⑤"],"ans":0,"exp":"犬多渴多尿（PU/PD）疾病：①糖尿病（尿糖→滲透利尿）②慢性腎衰竭（腎臟濃縮功能下降）④腎上腺機能亢進（皮質醇影響ADH）⑤尿崩症（ADH缺乏）均引起PU/PD。③急性腎衰竭通常引起「寡尿或無尿」，不是PU/PD。","we":["(B) 含③急性腎衰竭不正確，急性腎衰竭是少尿。","(C) 含③急性腎衰竭不正確。","(D) 不含①糖尿病不正確，糖尿病是PU/PD的教科書原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_055","year":2018,"roc_year":107,"session":"","examNo":55,"q":"犬心絲蟲生活史中，微絲蟲（microfilaria）被蚊子吸入後，發展到第幾期幼蟲才會感染犬？","opts":["A. 第2期","B. 第3期","C. 第4期","D. 第5期"],"ans":1,"exp":"犬心絲蟲（Dirofilaria immitis）生活史：微絲蟲（L1）被蚊子吸入後→L1→L2→L3（感染性幼蟲）在蚊子體內發育→蚊子叮咬犬時注入L3→L3→L4→成蟲（L5）。L3是感染犬的幼蟲期。","we":["(A) 第2期幼蟲（L2）仍在蚊子體內發育，不是感染期。","(C) 第4期幼蟲（L4）已在犬體內發育，不是蚊子注入的期別。","(D) 第5期（成蟲）在犬肺動脈及右心室定居。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_056","year":2018,"roc_year":107,"session":"","examNo":56,"q":"犬絲球體性腎炎時，下列何項藥物可減緩其惡化及減緩蛋白尿的現象？","opts":["A. angiotensin-converting enzyme inhibitors","B. β-blockers","C. inotropic agents","D. diuretics"],"ans":0,"exp":"犬絲球體性腎炎（glomerulonephritis）治療：ACE抑制劑（ACEI，如enalapril, benazepril）可降低腎小球內壓→減少蛋白尿→延緩腎功能惡化，是最重要的腎臟保護藥物。","we":["(B) β-blockers（乙型交感神經阻斷劑）用於心臟病，不用於腎絲球腎炎。","(C) Inotropic agents（強心劑）用於心臟衰竭，非腎絲球腎炎。","(D) Diuretics（利尿劑）可暫時減輕水腫，但不能延緩腎絲球腎炎惡化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_057","year":2018,"roc_year":107,"session":"","examNo":57,"q":"下圖係由一歲已絕育雄性短毛家貓皮膚取得的檢體鏡檢圖像，其為何種病原？","opts":["A. Heamatopinus","B. Sarcoptes","C. Ctenocephalides","D. Demodex"],"ans":3,"exp":"（本題含顯微鏡圖像，需視圖判斷；答案標記為需複查）貓皮膚病原鏡檢識別。","we":["（需視圖判斷）","（需視圖判斷）","（需視圖判斷）","（需視圖判斷）"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_1_普通病_058","year":2018,"roc_year":107,"session":"","examNo":58,"q":"犬貓皮膚病灶以伍氏燈（Wood’s light）檢查結果為陽性，此犬貓最可能的病原為下列何項？","opts":["A. 毛囊蟲","B. 疥癬蟲","C. 天疱瘡","D. 皮黴菌"],"ans":3,"exp":"伍氏燈（Wood's lamp，UV光365nm）陽性（蘋果綠螢光）→皮黴菌感染，特別是Microsporum canis感染的毛髮在Wood's lamp下呈螢光陽性。","we":["(A) 毛囊蟲（Demodex）感染Wood's lamp呈陰性。","(B) 疥癬蟲（Sarcoptes）感染Wood's lamp呈陰性。","(C) 天疱瘡（pemphigus）是自體免疫性皮膚病，Wood's lamp呈陰性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_059","year":2018,"roc_year":107,"session":"","examNo":59,"q":"下列何項不是自主神經機能障礙（dysautonomia）的臨床症狀？","opts":["A. 乾眼症","B. 胃腸道蠕動減緩","C. 心跳加快","D. 消瘦"],"ans":2,"exp":"自主神經機能障礙（dysautonomia）是副交感神經和交感神經功能障礙，特徵是副交感神經功能喪失：乾眼症（淚液分泌減少）、胃腸道蠕動減緩、散瞳（mydriasis）、心跳變慢（bradycardia）。「心跳加快」不是症狀，恰好相反。","we":["(A) 乾眼症（KCS）是dysautonomia的典型症狀（淚腺分泌受副交感神經控制）。","(B) 胃腸道蠕動減緩→便秘/巨腸症，是dysautonomia常見症狀。","(D) 消瘦是繼發性症狀（胃腸功能障礙導致吸收不良）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_060","year":2018,"roc_year":107,"session":"","examNo":60,"q":"下列何項犬病最常出現非再生性貧血？","opts":["A. 焦蟲症","B. 失血後48小時","C. 免疫性溶血性貧血","D. 慢性腎衰竭"],"ans":3,"exp":"慢性腎衰竭（CKD）引起非再生性貧血（non-regenerative anemia）——原因是腎臟功能細胞減少→促紅血球生成素（EPO）產生不足→骨髓紅血球生成減少→正常血球性正常色素性貧血。","we":["(A) 焦蟲症（babesiosis）引起再生性溶血性貧血（急性破壞紅血球）。","(B) 失血後48小時：骨髓開始再生反應→再生性貧血（多染性紅血球、網狀紅血球增加）。","(C) 免疫性溶血性貧血（IMHA）：自體抗體破壞紅血球→代償性再生性貧血（骨髓反應良好）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_061","year":2018,"roc_year":107,"session":"","examNo":61,"q":"下列何項不是造成貓脂肪肝的危險因子？","opts":["A. 肥胖","B. 糖尿病","C. 類固醇的使用","D. 罹患皮膚病"],"ans":3,"exp":"貓脂肪肝（hepatic lipidosis）危險因子：肥胖（最重要）、糖尿病、類固醇使用（引起代謝變化）、任何引起厭食的疾病（因脂肪動員到肝臟）。「罹患皮膚病」本身不是直接危險因子（皮膚病引起厭食時才間接相關）。","we":["(A) 肥胖是貓脂肪肝最重要的危險因子（脂肪動員加劇）。","(B) 糖尿病引起代謝紊亂，增加脂肪肝風險。","(C) 類固醇使用引起高血脂→脂肪在肝臟累積。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_062","year":2018,"roc_year":107,"session":"","examNo":62,"q":"貓最常見的乳房腫瘤為下列何項？","opts":["A. adenocarcinoma","B. fibrosarcoma","C. adenoma","D. papilloma"],"ans":0,"exp":"貓乳房腫瘤約85-93%為惡性，其中最常見的是腺癌（adenocarcinoma，乳腺管腺癌），通常預後差（侵犯性強、高轉移率）。","we":["(B) 纖維肉瘤（fibrosarcoma）在貓乳房腫瘤中少見。","(C) 腺瘤（adenoma）在貓乳房腫瘤中很少見（<10%是良性）。","(D) 乳頭狀瘤（papilloma）在貓乳房極罕見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_063","year":2018,"roc_year":107,"session":"","examNo":63,"q":"下列何項不是造成犬水腫性胰臟炎（edematous pancreatitis）之最主要原因？","opts":["A. 低甲狀腺功能症","B. 高血脂症","C. 低腎上腺皮質功能症","D. 糖尿病"],"ans":2,"exp":"犬胰臟炎（edematous/acute pancreatitis）主要危險因子：高脂血症（hyperlipidemia，最重要）、高脂肪飲食、甲狀腺低下、糖尿病、肥胖、某些藥物。低腎上腺皮質功能症（hypoadrenocorticism）不是最主要的胰臟炎病因。","we":["(A) 甲狀腺低下（hypothyroidism）→高血脂→胰臟炎，是已知危險因子。","(B) 高血脂症（hyperlipidemia）是犬胰臟炎最重要的代謝危險因子。","(D) 糖尿病→高血脂→胰臟炎，也是危險因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_064","year":2018,"roc_year":107,"session":"","examNo":64,"q":"下列何種犬腎臟疾病屬於腎小管型疾病（renal tubular disease）？","opts":["A. Fanconi syndrome","B. Samoyed犬性聯遺傳性腎病","C. Bull terrier犬遺傳性腎病","D. 萊姆病（Lyme disease）"],"ans":0,"exp":"Fanconi syndrome（範科尼症候群）是腎小管型疾病（renal tubular disease）——近端腎小管的重吸收功能障礙，導致葡萄糖、胺基酸、磷酸鹽、碳酸氫根、尿酸等大量由尿液流失。","we":["(B) Samoyed犬性聯遺傳性腎病是絲球體型（Alport syndrome類似）。","(C) Bull terrier犬遺傳性腎病也是絲球體型疾病。","(D) 萊姆病引起腎小球腎炎（immune-complex glomerulonephritis）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_065","year":2018,"roc_year":107,"session":"","examNo":65,"q":"下列何種犬寄生蟲，偶會迷入犬膽管引起膽管阻塞或阻塞性黃疸？","opts":["A. 鞭蟲","B. 蛔蟲","C. 鈎蟲","D. 瓜實絛蟲"],"ans":1,"exp":"犬蛔蟲（Toxocara canis/Toxascaris leonina）幼蟲或成蟲偶爾會迷走至膽管，引起膽管阻塞和阻塞性黃疸（biliary obstruction）。蛔蟲是最常見迷入膽管的腸道寄生蟲。","we":["(A) 鞭蟲（Trichuris）主要寄生在大腸，不迷入膽管。","(C) 鈎蟲（Ancylostoma）主要寄生在小腸，不迷入膽管。","(D) 瓜實絛蟲（Dipylidium caninum）是絛蟲，不迷入膽管。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_066","year":2018,"roc_year":107,"session":"","examNo":66,"q":"癌症對動物身體的影響中，常見且重要的是造成明顯營養失調（profound malnutrition）和體重減輕（body\r mass wasting）。若癌症病畜有適當的營養攝取，仍然出現體重減輕和新陳代謝改變，則稱之為下列何項？","opts":["A. cancer anorexia","B. cancer cachexia","C. cancer pyrexia","D. cancer anemia"],"ans":1,"exp":"Cancer cachexia（癌症惡病質）：即使給予適當營養，仍持續出現體重減輕和新陳代謝改變——是由腫瘤分泌的細胞激素（TNF-α, IL-6, IL-1）引起的複雜代謝綜合症，非單純營養不足。","we":["(A) Cancer anorexia是食慾不振，而cachexia是即使有適當攝取仍消瘦。","(C) Cancer pyrexia是腫瘤引起的發熱，非代謝性消瘦。","(D) Cancer anemia是腫瘤引起的貧血，非代謝性消瘦。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_067","year":2018,"roc_year":107,"session":"","examNo":67,"q":"惡性腫瘤（癌）的轉移是由多個因素所組成，下列何項敘述錯誤？","opts":["A. 腫瘤細胞進入血液循環時絕對能夠存活","B. 快速增殖的腫瘤可創造物理性的壓力將細胞推入阻力較小的區域","C. 腫瘤細胞進入循環中並不等於轉移","D. 血管新生成的作用必須發生在腫瘤團塊周邊"],"ans":0,"exp":"「腫瘤細胞進入血液循環時絕對能夠存活」是錯誤的——絕大多數循環腫瘤細胞（CTCs）被免疫系統（NK cells）消滅或物理性破壞，只有極少數能在循環中存活並最終轉移。","we":["(B) 快速增殖的腫瘤可創造物理性壓力是正確的腫瘤擴散機制。","(C) 腫瘤細胞進入循環不等於轉移（需要能存活、植入、血管新生）是正確的。","(D) 血管新生必須在腫瘤周邊發生才能持續生長是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_068","year":2018,"roc_year":107,"session":"","examNo":68,"q":"犬鈎端螺旋體症最主要之感染源存在下列何項？","opts":["A. 尿","B. 糞","C. 鼻腔分泌物","D. 精液"],"ans":0,"exp":"犬鈎端螺旋體症（Leptospirosis）最主要感染源是感染動物的尿液——Leptospira在尿液中大量排出，通過皮膚傷口、黏膜或受汙染的水源傳播。","we":["(B) 糞便不是鈎端螺旋體的主要傳播途徑。","(C) 鼻腔分泌物不是主要感染源。","(D) 精液不是鈎端螺旋體的主要傳播途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_069","year":2018,"roc_year":107,"session":"","examNo":69,"q":"犬貓罹患下列何項肝病，會以乳果糖（lactulose）液口服來治療？","opts":["A. 嗜中性球性膽管炎","B. 淋巴球性膽管炎","C. 膽道阻塞","D. 肝門脈分流"],"ans":3,"exp":"乳果糖（lactulose）口服用於治療肝門脈分流（portosystemic shunt）引起的肝性腦病——乳果糖酸化腸道環境，減少氨的吸收，降低血氨濃度，改善肝性腦病。","we":["(A) 嗜中性球性膽管炎（neutrophilic cholangitis）以抗生素治療為主。","(B) 淋巴球性膽管炎（lymphocytic cholangitis）以免疫抑制劑治療為主。","(C) 膽道阻塞需手術解除，乳果糖無法解除阻塞。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_070","year":2018,"roc_year":107,"session":"","examNo":70,"q":"肥胖細胞瘤（mast cell tumor）的患犬貓，易再繼發下列何項疾病？","opts":["A. 肥胖症","B. 急性腎衰竭","C. 胃潰瘍","D. 擴張性心肌病"],"ans":2,"exp":"肥大細胞瘤（mast cell tumor）患犬貓，腫瘤的肥大細胞（mast cells）釋放大量組織胺→刺激胃壁細胞H2受體→胃酸過多→胃潰瘍（peptic ulcer）是最常見的副腫瘤繼發疾病。","we":["(A) 肥胖症與肥大細胞瘤無直接繼發關係。","(B) 急性腎衰竭不是肥大細胞瘤的典型繼發症。","(D) 擴張性心肌病與肥大細胞瘤無直接繼發關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_071","year":2018,"roc_year":107,"session":"","examNo":71,"q":"下列何項不是內翻縫法？","opts":["A. Lembert pattern","B. Connell pattern","C. Cushing pattern","D. cruciate pattern"],"ans":3,"exp":"內翻縫合法（inverting suture patterns）包括：Lembert（連續內翻）、Connell（貫穿內翻）、Cushing（不貫穿連續內翻）。Cruciate pattern（十字縫合）是張力縫合（tension suture），不是內翻縫合法。","we":["(A) Lembert pattern是標準的連續內翻縫合，用於胃腸道。","(B) Connell pattern是貫穿胃腸壁的連續內翻縫合。","(C) Cushing pattern是不貫穿黏膜層的連續內翻縫合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_072","year":2018,"roc_year":107,"session":"","examNo":72,"q":"脛骨的前抽屜運動（cranial drawer movement）測試，主要用於檢測下列那一項韌帶是否完整（integrity）\r 或斷裂（rupture）？","opts":["A. 十字韌帶（cruciate ligament）","B. 膝蓋骨韌帶（patellar ligament）","C. 內側副韌帶（medial collateral ligament）","D. 外側副韌帶（lateral collateral ligament）"],"ans":0,"exp":"前抽屜運動（cranial drawer movement）測試：固定股骨，向前推動脛骨，若脛骨可向前移動（正常不應移動），代表前十字韌帶（cranial cruciate ligament, CCL）斷裂。","we":["(B) 膝蓋骨韌帶（patellar ligament）完整性以觸診和膝蓋骨位置評估。","(C) 內側副韌帶（medial collateral ligament）以外翻壓力測試評估。","(D) 外側副韌帶（lateral collateral ligament）以內翻壓力測試評估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_073","year":2018,"roc_year":107,"session":"","examNo":73,"q":"前十字韌帶斷裂（cranial cruciate ligament rupture）的外科治療中，下列何項手術法會重建主動拘束\r （active constraints）？","opts":["A. 關節囊內的手術重建（intracapsular reconstruction）","B. 關節囊外的手術重建（extracapsular reconstruction）","C. 脛骨岡提高骨切除術（tibial plateau leveling osteotomy）","D. 滑車窩切除手術（trochlear resection）"],"ans":0,"exp":"前十字韌帶斷裂的手術治療中，關節囊內重建（intracapsular reconstruction，如over-the-top技術使用骨-筋膜-骨移植物）最接近原始韌帶的功能，可重建主動拘束（active constraints，動態穩定）機制。","we":["(B) 關節囊外重建（extracapsular reconstruction，如lateral suture）提供被動拘束，無法重建主動拘束。","(C) TPLO（脛骨岡提高骨切除術）改變生物力學而非重建韌帶，是被動幾何修正。","(D) 滑車窩切除術（trochlear resection）用於治療髕骨脫臼，非前十字韌帶手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_074","year":2018,"roc_year":107,"session":"","examNo":74,"q":"貓甲狀腺腫瘤（feline thyroid tumors）的敘述，下列何項錯誤？","opts":["A. 典型的臨床症狀包括：體重減輕，但食慾上升","B. 大部分為良性","C. 大部分具有功能性","D. 大部分血中T4濃度會下降"],"ans":3,"exp":"貓甲狀腺腫瘤（feline thyroid tumors）敘述：大部分為良性腺瘤（>95%）、有功能性（引起甲狀腺機能亢進）、血中T4濃度升高（not降低）、典型症狀是體重減輕+食慾上升。「T4會下降」是錯誤的。","we":["(A) 體重減輕但食慾上升是甲亢（hyperthyroidism）的典型症狀，正確。","(B) 大部分為良性腺瘤（>95%）是正確的。","(C) 大部分具有功能性（分泌甲狀腺素）是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_075","year":2018,"roc_year":107,"session":"","examNo":75,"q":"犬胰臟疾病，下列何項敘述最不適當？","opts":["A. insulinoma常會造成hypoglycemia","B. 治療insulinoma時，最好採用total pancreatectomy","C. 因有胰臟炎的風險，術中結紮pancreatic ducts時要使用不可吸收線","D. pancreatitis是pancreatic surgery最常見的併發症"],"ans":1,"exp":"治療犬insulinoma（胰島素瘤）時，最好採用total pancreatectomy（全胰臟切除術）是不適當的——全胰臟切除後會永久失去胰島素（糖尿病）和胰酶（EPI），應採用腫瘤切除術（nodulectomy）或部分胰臟切除（partial pancreatectomy）。","we":["(A) Insulinoma常造成低血糖（hypoglycemia）是正確的（腫瘤過度分泌胰島素）。","(C) 結紮胰管時使用不可吸收縫線以避免胰臟炎是正確的（可吸收縫線溶解後可能漏出胰液）。","(D) 胰臟炎是胰臟手術最常見的併發症是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_076","year":2018,"roc_year":107,"session":"","examNo":76,"q":"下列何項不屬於骨折評估指數（fracture assessment score）？","opts":["A. economic factor","B. mechanical factor","C. biologic factor","D. clinical factor"],"ans":0,"exp":"骨折評估指數（Fracture Assessment Score, FAS）包含三個因子：機械性因子（mechanical factor：骨折型態、位置、骨質量）、生物性因子（biologic factor：年齡、血供、軟組織狀況）、臨床因子（clinical factor：病患依從性）。Economic factor（經濟因子）不屬於標準FAS評估內容。","we":["(B) Mechanical factor（機械性因子）是FAS的標準組成部分。","(C) Biologic factor（生物性因子）是FAS的標準組成部分。","(D) Clinical factor（臨床因子）是FAS的標準組成部分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_077","year":2018,"roc_year":107,"session":"","examNo":77,"q":"鴉片類藥物適用於手術前或手術中的止痛，而靜脈注射morphine容易導致血管擴張與低血壓之原因為何？","opts":["A. 利尿","B. 組織胺釋放","C. 血中二氧化碳分壓升高","D. 抑制腎上腺素分泌"],"ans":1,"exp":"靜脈注射嗎啡（IV morphine）引起血管擴張和低血壓的原因是組織胺釋放（histamine release）——嗎啡刺激皮膚和血管的肥大細胞釋放組織胺→血管擴張→低血壓。","we":["(A) 利尿作用不是嗎啡引起低血壓的主要機制。","(C) 血中CO2分壓升高是嗎啡呼吸抑制的結果，不是低血壓原因。","(D) 抑制腎上腺素分泌不是嗎啡IV低血壓的主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_078","year":2018,"roc_year":107,"session":"","examNo":78,"q":"下列何項局部麻醉藥物（local anesthetics）在犬的作用時間（duration）最短？","opts":["A. procaine","B. lidocaine","C. mepivacaine","D. bupivacaine"],"ans":0,"exp":"局部麻醉藥物作用時間（duration of action）由短到長：Procaine（普魯卡因，30-60分鐘）< Lidocaine（60-90分鐘）< Mepivacaine（90-180分鐘）< Bupivacaine（180-360分鐘，最長）。Procaine作用時間最短。","we":["(B) Lidocaine作用時間約60-90分鐘，比procaine長。","(C) Mepivacaine作用時間約90-180分鐘，更長。","(D) Bupivacaine作用時間最長（3-6小時）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_079","year":2018,"roc_year":107,"session":"","examNo":79,"q":"穿戴手術衣物的正確順序為何？","opts":["A. 帽子→口罩→無菌手術袍→手套","B. 手套→口罩→帽子→無菌手術袍","C. 無菌手術袍→帽子→口罩→手套","D. 口罩→帽子→手套→無菌手術袍"],"ans":0,"exp":"穿戴手術衣物正確順序：①帽子（cap，覆蓋頭髮）→②口罩（mask，覆蓋口鼻）→③刷手消毒→④無菌手術袍（sterile gown）→⑤無菌手套（sterile gloves）。帽子和口罩先戴，以確保在無菌操作前頭髮和飛沫已被遮蔽。","we":["(B) 手套→口罩→帽子→袍：順序完全錯誤，手套應最後戴。","(C) 袍→帽→口罩→手套：袍不應在帽口罩之前穿。","(D) 口罩→帽→手套→袍：袍應在手套之前穿。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_1_普通病_080","year":2018,"roc_year":107,"session":"","examNo":80,"q":"Billroth I手術是用來治療下列那一部位病變？","opts":["A. 胃幽門部","B. 胃大彎","C. 胃賁門部","D. 胃小彎"],"ans":0,"exp":"Billroth I（胃十二指腸吻合術）：切除遠端胃（包括幽門部/胃竇部）後，將殘留胃直接與十二指腸吻合，用於治療胃幽門部及胃竇部的病變（如幽門肥厚、胃潰瘍、胃腫瘤）。","we":["(B) 胃大彎的病變通常用部分胃切除或胃壁切除，非Billroth I。","(C) 胃賁門部（gastroesophageal junction）病變用全胃切除或Ivor Lewis術，非Billroth I。","(D) 胃小彎的病變可用局部切除，不是Billroth I的典型適應症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_001","year":2018,"roc_year":107,"session":"","examNo":1,"q":"下列何項不是造成馬肺炎的可能原因？","opts":["A. 全身麻醉","B. 運輸","C. 賽前密集訓練","D. sarcoid"],"ans":3,"exp":"Sarcoid（肉瘤病）是馬的皮膚腫瘤，不會引起肺炎。","we":["(A) 牛皮蠅幼蟲寄生可引起皮下腫塊與組織損傷。","(B) 馬腺疫由Streptococcus equi引起，可見化膿性淋巴腺炎。","(C) 皮下血腫是常見外傷性皮膚病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_002","year":2018,"roc_year":107,"session":"","examNo":2,"q":"下列馬的傷口以二期癒合（second-intention healing）處理，何者最不易癒合？","opts":["A. 臀部肌肉外傷","B. 掌骨段外傷","C. 耳咽管憩室引流（Viborg's Triangle approach for drainage of the guttural pouch）後的傷口","D. 鼻竇圓鋸術（sinus trephination）"],"ans":1,"exp":"掌骨段（掌部）血液供應差，傷口癒合困難，以二期癒合（開放性癒合）最為困難。","we":["(A) 前臂部血供相對較好，癒合較順利。","(C) 球節部雖活動度大，但血供尚可。","(D) 掌關節以上部位血供豐富，癒合較佳。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_003","year":2018,"roc_year":107,"session":"","examNo":3,"q":"下列何種手術常用於治療馬喉頭偏癱（laryngeal hemiplegia）？","opts":["A. laryngeal ventriculectomy","B. partial resection of the soft palate","C. hyovertebrotomy","D. partial resection of the epiglottis"],"ans":0,"exp":"Laryngeal ventriculectomy（喉室切除術）用於治療馬的喉頭半側偏癱（喉頭偏癱），移除聲囊以改善氣道通暢。","we":["(B) 腭裂修補術用於先天性腭裂。","(C) 氣管切開術用於緊急上呼吸道阻塞。","(D) 軟腭切除術用於軟腭過長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_004","year":2018,"roc_year":107,"session":"","examNo":4,"q":"犢牛發生急性鉛中毒時，下列何種症狀較少發生？","opts":["A. 強直性和間接性痙攣","B. 眼球震顫","C. 瞳孔散大","D. 潰瘍性口炎"],"ans":3,"exp":"急性鉛中毒症狀包括腦炎（共濟失調、失明、抽搐）、消化道症狀，不會出現潰瘍性口炎。","we":["(A) 腦炎症狀（抽搐、轉圈）是鉛中毒的典型神經症狀。","(B) 失明（皮質性）是鉛中毒神經損傷的表現。","(C) 消化道症狀如腹痛、腹瀉可見於鉛中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_005","year":2018,"roc_year":107,"session":"","examNo":5,"q":"有關牛隻急性砷中毒之敘述，下列何者正確？","opts":["A. 動物呈現圈狀運動","B. 嚴重時造成失明現象","C. 惡臭性出血性下痢","D. 動物呈現興奮狂躁"],"ans":2,"exp":"急性砷中毒（三氧化二砷）特徵為惡臭性出血性下痢（腸道出血性炎症）、腹痛、虛脫。","we":["(A) 黏膜蒼白/發紺見於硝酸鹽中毒（methemoglobinemia）。","(B) 肌肉震顫、抽搐見於有機磷中毒。","(D) 尿液呈紅色見於洋蔥中毒引起的溶血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_006","year":2018,"roc_year":107,"session":"","examNo":6,"q":"牛隻草酸鹽中毒會導致血液中何種離子下降？","opts":["A. 磷","B. 鈉","C. 鎂","D. 鈣"],"ans":3,"exp":"草酸鹽（乙二醇代謝產物）與鈣結合形成草酸鈣→血鈣下降（低血鈣症），引起神經肌肉症狀。","we":["(A) 高血鈣不是草酸鹽中毒的結果，恰好相反。","(B) 高血磷不是草酸鹽主要作用機制。","(C) 低血糖與草酸鹽中毒無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_007","year":2018,"roc_year":107,"session":"","examNo":7,"q":"乳牛最常用來界定健康乳房及乳房炎的體細胞數值為多少cells/mL？","opts":["A. 50,000","B. 200,000","C. 500,000","D. 1,000,000"],"ans":1,"exp":"牛乳品質標準：體細胞數（SCC）200,000 cells/mL（或20萬）為衛生界定值，超過此值視為有乳腺炎問題。","we":["(A) 100,000 cells/mL過低，不是標準界定值。","(C) 500,000 cells/mL雖是某些標準，但台灣及國際主流標準為20萬。","(D) 1,000,000 cells/mL已是明顯炎症，超過常用界定值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_008","year":2018,"roc_year":107,"session":"","examNo":8,"q":"下列何者為乳牛乳房炎之環境性（environmental）病原菌？","opts":["A. 乳房鏈球菌（Streptococcus uberis）","B. 金黃色葡萄球菌（Staphylococcus aureus）","C. 牛黴漿菌（Mycoplasma bovis）","D. 無乳鏈球菌（Streptococcus agalactiae）"],"ans":0,"exp":"Streptococcus uberis（乳房鏈球菌）是環境性病原菌（environmental pathogen），來自糞便、墊料，不以牛為主要宿主。","we":["(B) S. agalactiae是傳染性病原（contagious pathogen），主要存在乳腺中。","(C) Staphylococcus aureus是傳染性病原，主要存在乳腺及皮膚。","(D) Mycoplasma bovis是傳染性病原，可引起嚴重乳腺炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_009","year":2018,"roc_year":107,"session":"","examNo":9,"q":"乳牛場流行黴漿菌性乳房炎時，場內小牛若喝入未消毒生乳常引發其他疾病，下列何者最不常見？","opts":["A. 肺炎","B. 多發性漿膜炎","C. 關節炎","D. 中耳炎"],"ans":1,"exp":"Mycoplasma bovis感染小牛的典型表現包括：關節炎、肺炎、中耳炎，不是多發性漿膜炎（Polyserositis）。","we":["(A) 關節炎（多發性關節炎）是M. bovis小牛感染的典型症狀。","(C) 肺炎（間質性肺炎）是M. bovis重要表現。","(D) 中耳炎（歪頭症）是M. bovis小牛感染特有症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_010","year":2018,"roc_year":107,"session":"","examNo":10,"q":"乳牛的眼癌（cancer eye）主要是下列何種腫瘤？","opts":["A. fibrosarcoma","B. adenocarcinoma","C. lymphosarcoma","D. squamous cell carcinoma"],"ans":3,"exp":"乳牛眼癌（cancer eye）最常見的是鱗狀細胞癌（squamous cell carcinoma），好發於第三眼瞼及眼瞼緣。","we":["(A) 黑色素瘤在牛較少見於眼部。","(B) 基底細胞癌在牛眼部不是最常見。","(C) 纖維肉瘤不是牛眼部最常見腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_011","year":2018,"roc_year":107,"session":"","examNo":11,"q":"初生仔牛餵食母牛初乳非常重要，有關影響仔牛吸收免疫球蛋白之效能，下列何者最不重要？","opts":["A. 初乳是否來自仔牛的親生母牛","B. 初乳中免疫球蛋白濃度","C. 仔牛出生後餵食初乳的時間","D. 仔牛餵食初乳的量"],"ans":0,"exp":"評估初乳品質最不重要的因素是「是否為親生母牛的初乳」——任何同種母牛的優質初乳均有效，重要的是初乳品質（IgG濃度）與及時哺餵。","we":["(B) 哺餵時間（出生後6小時內）非常重要，因腸道通透性快速下降。","(C) 初乳IgG濃度（Brix計）是品質最重要指標。","(D) 哺餵量（至少4公升）影響被動免疫轉移效率。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_012","year":2018,"roc_year":107,"session":"","examNo":12,"q":"在牛右側第11~13肋上方進行ping test呈現金屬反響音，應懷疑下列那一項疾病？","opts":["A. 迴腸擴張症","B. 空腸積氣","C. 皺胃左側異位","D. 結腸臌脹症"],"ans":3,"exp":"牛右側腹壁11~13肋上方出現ping聲（tympanic resonance）→結腸臌脹症（cecal/colonic dilatation）。","we":["(A) 右側腹部ping聲較低位置提示皺胃右側變位。","(B) 左側腹部ping聲提示皺胃左側變位（LDA）。","(C) 右側腹部ping聲合併腸蠕動消失提示腸套疊，但位置不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_013","year":2018,"roc_year":107,"session":"","examNo":13,"q":"下列何項不是牛胸膜炎之主要症狀？","opts":["A. 胸膜摩擦音出現","B. 腹式呼吸","C. 流鼻液","D. 脈搏增快"],"ans":2,"exp":"牛胸膜炎（pleuritis）主要症狀為發熱、疼痛性淺呼吸、胸膜摩擦音、胸腔積液，流鼻液不是主要症狀（流鼻液多見於上呼吸道疾病）。","we":["(A) 胸腔積液（胸水）是纖維素性或化膿性胸膜炎的表現。","(B) 胸膜摩擦音是早期乾性胸膜炎的特徵聽診發現。","(D) 疼痛性淺呼吸（呼吸淺快）是胸膜疼痛的典型反應。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_014","year":2018,"roc_year":107,"session":"","examNo":14,"q":"牛大腦皮質壞死症與下列何種維生素缺乏有關？","opts":["A. B 2","B. B 1","C. B 6","D. B 12"],"ans":1,"exp":"大腦皮質壞死症（Polioencephalomalacia, PEM）在反芻動物中由Vitamin B1（硫胺素）缺乏引起。","we":["(A) VitA缺乏引起夜盲症、皮膚角化等，不引起PEM。","(C) VitD缺乏引起佝僂病/軟骨症，非PEM。","(D) VitE缺乏引起白肌病，非PEM。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_015","year":2018,"roc_year":107,"session":"","examNo":15,"q":"牛酮病的症狀無下列何型？","opts":["A. 消化器型","B. 神經型","C. 乳熱型","D. 生殖道型"],"ans":3,"exp":"生殖道型（reproductive form）是乳牛酮病（ketosis）的分類之一，但不是Coppock分類系統的標準分類。非酮病的分類包括：臨床型、亞臨床型、消化道型、神經型、生殖道型。","we":["(A) 臨床型酮病有明顯臨床症狀（食慾廢絕、牛奶產量下降）。","(B) 亞臨床型（subclinical）無明顯症狀但血酮升高。","(C) 神經型（nervous form）表現為神經症狀如轉圈、攻擊行為。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_016","year":2018,"roc_year":107,"session":"","examNo":16,"q":"牛在下列何種中毒情況下黏膜會出現發紺？","opts":["A. 硝酸鹽","B. 鉛","C. 銅","D. 鉬"],"ans":0,"exp":"硝酸鹽中毒機制：NO3→NO2→與血紅素結合形成methemoglobin→無法攜氧→黏膜發紺（巧克力棕色血液）。","we":["(B) 溶血性貧血是洋蔥中毒的機制，非硝酸鹽。","(C) 神經毒素不是硝酸鹽中毒主要機制。","(D) 腎毒性不是硝酸鹽中毒主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_017","year":2018,"roc_year":107,"session":"","examNo":17,"q":"乳牛正確的擠乳作業程序中，擠乳前藥浴（predipping）最主要在預防下列那一種病原菌所引起的乳房炎？","opts":["A. 腸道菌群（coliforms）","B. 金黃色葡萄球菌（Staphylococcus aureus）","C. 異乳鏈球菌（Streptococcus dysgalactiae）","D. 無乳鏈球菌（Streptococcus agalactiae）"],"ans":0,"exp":"Predipping（擠乳前藥浴）主要目的是減少環境性病原（如腸道菌群：E. coli、Klebsiella）引起的乳腺炎。","we":["(B) 傳染性乳腺炎（S. aureus、S. agalactiae）主要靠擠乳後藥浴（postdipping）預防。","(C) 乾乳期乳腺炎由乾乳軟膏（dry cow therapy）預防，非predipping。","(D) 酵母菌性乳腺炎預防靠改善環境衛生，非predipping。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_018","year":2018,"roc_year":107,"session":"","examNo":18,"q":"在防治牛乳房炎之策略上，處方維生素Ｅ於懷孕後期之乳牛，建議之飼料添加量應為多少？","opts":["A. 100 IU／日","B. 250 IU／日","C. 1,000 IU／日","D. 不用添加"],"ans":2,"exp":"懷孕後期乳牛補充Vitamin E劑量建議為每日1,000 IU，以預防白肌病及胎盤滯留。","we":["(A) 100 IU/日劑量過低，無法有效預防。","(B) 500 IU/日低於建議量。","(D) 2,000 IU/日超過標準建議量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_019","year":2018,"roc_year":107,"session":"","examNo":19,"q":"牛隻在進行眼球摘除手術前，進行Peterson Block所麻醉的幾條神經中，不包括下列何者？","opts":["A. 視神經","B. 動眼神經","C. 滑車神經","D. 三叉神經"],"ans":0,"exp":"Peterson Block（眼球後神經阻斷術）阻斷眼球後的顴顳神經、外展神經、動眼神經等，但不包括視神經（optic nerve, CN II），因此不影響視力功能。","we":["(B) 顴顳神經（zygomatic temporal nerve）是Peterson Block的阻斷目標之一。","(C) 外展神經（abducens nerve）控制眼外直肌，包含在Peterson Block中。","(D) 動眼神經（oculomotor nerve）控制大部分眼外肌，是Peterson Block阻斷目標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_020","year":2018,"roc_year":107,"session":"","examNo":20,"q":"牛隻開腹術前所使用之遠端脊椎旁神經阻斷法（distal paravertebral block），麻醉針刺入之橫突部位為下列\r 何者？","opts":["A. 第13胸椎橫突、第1、2腰椎橫突","B. 第1、2、3腰椎橫突","C. 第1、2、4腰椎橫突","D. 第2、3、4腰椎橫突"],"ans":0,"exp":"Distal paravertebral block（遠端椎旁神經阻斷）在T13、L1、L2橫突末端注射，阻斷這三條神經，使左側腹壁產生麻醉效果，用於牛的腹腔手術。","we":["(B) Proximal paravertebral block在橫突基部注射，與distal不同。","(C) Inverted-L block是另一種腹壁麻醉方式，直接在切口周圍注射。","(D) Line block沿預計切口線直接浸潤注射。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_021","year":2018,"roc_year":107,"session":"","examNo":21,"q":"成牛手術前施行之硬膜外麻醉（epidural anesthesia），可於2% lidocaine中添加多少mg/kg之xylazine，以延 長麻醉作用時間？","opts":["A. 0.01","B. 0.03","C. 0.1","D. 0.3"],"ans":2,"exp":"Xylazine 0.1 mg/kg加入硬膜外麻醉（epidural anesthesia）中，可延長麻醉作用時間並增加止痛效果。","we":["(A) 0.05 mg/kg劑量太低，效果不明顯。","(B) 0.5 mg/kg劑量太高，可能引起全身性鎮靜效果。","(D) 1.0 mg/kg會引起明顯全身性α2-agonist效應（心搏過緩、鎮靜）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_022","year":2018,"roc_year":107,"session":"","examNo":22,"q":"當牛隻進行帝王切開術時，下圖何者為最適當的子宮切開部位？","opts":["A. A","B. B","C. C","D. D"],"ans":0,"exp":"（本題含圖，需視圖判斷；答案標記為需複查）子宮切開術相關題目。","we":["（需視圖判斷）","（需視圖判斷）","（需視圖判斷）"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_2_普通病_023","year":2018,"roc_year":107,"session":"","examNo":23,"q":"下列那一種牛隻手術可應用於蜂巢胃內之金屬異物取出？","opts":["A. rumenostomy（rumenal fistulation）","B. rumenotomy","C. left-flank omentopexy","D. right-flank abomasopexy"],"ans":1,"exp":"Rumenotomy（瘤胃切開術）除了直接探查瘤胃外，也可以伸手通過網胃取出金屬異物（hardware disease）。","we":["(A) 皺胃切開術（abomasotomy）用於取出皺胃異物或結石，非蜂巢胃（網胃）金屬異物。","(C) 開腹探查是更大範圍手術，rumenotomy較為直接有效。","(D) 磁鐵投服可預防網胃炎，但已有金屬進入網胃壁需手術取出。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_024","year":2018,"roc_year":107,"session":"","examNo":24,"q":"有關使用ventral paramedian abomasopexy法治療乳牛第四胃異位之優點，下列何者錯誤？","opts":["A. 第四胃很容易可以矯正回正確位置","B. 第四胃通常立即回到正確位置","C. 第四胃很容易可以詳細檢查","D. 術後併發第四胃沾黏的機會少"],"ans":3,"exp":"Ventral paramedian abomasopexy（腹側近旁正中皺胃固定術）術後沾黏機會不少是「錯誤」敘述；正確為此術式進入腹腔，術後沾黏風險確實存在，但並非常見主要問題。","we":["(A) 手術在仰臥姿勢下執行是正確的。","(B) 切口位於乳靜脈與腹中線之間是正確描述。","(C) 需要全身麻醉（牛的仰臥位手術需適當保定）是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_025","year":2018,"roc_year":107,"session":"","examNo":25,"q":"若以腹側近中線切開（ventral paramedian incision）法進行乳牛帝王切開術，下列切創部位何者正確？","opts":["A. 腹中線與左側皮下腹靜脈間、臍孔後至乳房前緣","B. 腹中線與右側皮下腹靜脈間、臍孔後至乳房前緣","C. 腹中線與左側皮下腹靜脈間、劍突下方8公分處至臍孔前","D. 腹中線與右側皮下腹靜脈間、劍突下方8公分處至臍孔前"],"ans":0,"exp":"牛腹側近中線帝王切開術切口位置：腹中線與左側皮下腹靜脈（subcutaneous abdominal vein）之間，臍孔後方至乳房前緣。","we":["(B) 右側腹壁切口是右側腹脅帝王切開術的位置。","(C) 左側腹脅（左肷部）是left flank caesarean的切口位置。","(D) 乳房後方切口不符合標準術式位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_026","year":2018,"roc_year":107,"session":"","examNo":26,"q":"一般認為羊運輸痙攣是血液中何種元素低下所引起？","opts":["A. 鈣","B. 磷","C. 鎂","D. 銅"],"ans":2,"exp":"羊運輸痙攣（transit tetany）由低血鎂（hypomagnesemia）引起，與長途運輸應激及飼料中鎂攝取不足有關。","we":["(A) 低血鈣引起生產癱瘓（milk fever），不是運輸痙攣的主因。","(B) 低血糖（hypoglycemia）引起妊娠毒血症，非運輸痙攣。","(D) 高血鉀與運輸痙攣無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_027","year":2018,"roc_year":107,"session":"","examNo":27,"q":"羊軟骨症與下列何者較無相關？","opts":["A. 飼料中鈣磷比不平衡","B. 副甲狀腺機能亢進","C. 維生素D不足","D. 飼料中鈷不足"],"ans":3,"exp":"飼料中鈷（cobalt）不足主要影響VitB12合成（反芻動物瘤胃微生物合成VitB12需要鈷），造成消瘦、貧血，與軟骨症（osteomalacia/rickets）關係較無。","we":["(A) 消瘦（wasting）是鈷缺乏的典型症狀。","(B) 貧血（VitB12缺乏性）是鈷缺乏的重要後果。","(C) 食慾不振是鈷缺乏的早期症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_028","year":2018,"roc_year":107,"session":"","examNo":28,"q":"下列何種原因通常不會造成懷孕母羊的流產？","opts":["A. 靜脈注射chlorpromazine","B. 使用驅蟲藥phenothiazine","C. 靜脈注射flunixin meglumine","D. 母羊長期發高燒"],"ans":1,"exp":"Phenothiazine（苯噻嗪）是驅蟲藥，其代謝產物phenothiazine sulfoxide雖有光敏性，但通常不直接引起母羊流產。","we":["(A) 光敏性皮膚炎（photosensitization）確實是phenothiazine的已知副作用。","(C) 初產羊（primigravida）使用需注意，但流產不是主要副作用。","(D) 劑量過高可能引起毒性，但流產仍非典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_029","year":2018,"roc_year":107,"session":"","examNo":29,"q":"進行母豬帝王切開術時，子宮的切創部位最好位於下列何處？","opts":["A. 越靠近子宮頸越好","B. 越靠近子宮體越好","C. 越靠近子宮角大彎越好","D. 左右兩個子宮角各開創一處"],"ans":2,"exp":"豬帝王切開術（caesarean section）切口選在子宮角的大彎側（greater curvature），以避開血管並方便取出胎兒。","we":["(A) 子宮角小彎側（lesser curvature）血管較多，不適合切開。","(B) 子宮體切開取胎效率低，因豬子宮角長而細。","(D) 子宮頸切開不適用於帝王切開術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_030","year":2018,"roc_year":107,"session":"","examNo":30,"q":"何種公畜精液的平均精子濃度最高？","opts":["A. 牛","B. 豬","C. 犬","D. 馬"],"ans":0,"exp":"各畜種精子濃度比較：牛的精液濃度最高（約10億~20億/mL），遠高於其他畜種。","we":["(B) 豬精液量大但濃度低（約2~3億/mL）。","(C) 馬精子濃度約1~3億/mL，低於牛。","(D) 羊精子濃度約20~30億/mL，接近但通常低於牛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_031","year":2018,"roc_year":107,"session":"","examNo":31,"q":"何種公畜陰莖不屬於纖維彈性（fibroelastic）陰莖？","opts":["A. 馬","B. 牛","C. 豬","D. 羊"],"ans":0,"exp":"馬的陰莖是「肌肉血管型（musculocavernous type）」，不是纖維彈性型（fibroelastic type）。纖維彈性陰莖見於牛、豬、羊。","we":["(B) 牛的陰莖是纖維彈性型，有S型彎曲。","(C) 豬的陰莖也是纖維彈性型，有螺旋狀龜頭。","(D) 羊的陰莖同樣是纖維彈性型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_032","year":2018,"roc_year":107,"session":"","examNo":32,"q":"下列何種母畜進入發情活動時，只有單一個動情週期（monocyclic）？","opts":["A. 兔","B. 犬","C. 豬","D. 牛"],"ans":1,"exp":"犬是單發情動物（monoestrous）——每次發情只有一個發情期（不像貓是多次誘導排卵型）。實際上犬是diestrous（每年2次），但在選項中B是正確的。","we":["(A) 貓是多發情（polyestrous，季節性多發情）。","(C) 牛是多發情動物（polyestrous）。","(D) 馬是季節性多發情動物（seasonally polyestrous）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_033","year":2018,"roc_year":107,"session":"","examNo":33,"q":"母犬以X-ray進行妊娠診斷時，最早可於懷孕開始第幾天後看見胎兒骨化構造？","opts":["A. 25~28","B. 35~38","C. 45~48","D. 55~58"],"ans":2,"exp":"母犬X光攝影在懷孕45~48天可見明顯胎兒骨骼鈣化（礦化），可用於確認懷孕及評估胎兒數量。","we":["(A) 懷孕28~35天可見胎兒輪廓但骨骼未鈣化。","(B) 懷孕38~42天骨骼開始輕微鈣化，但不夠清晰。","(D) 懷孕55天以後骨骼鈣化完整，但45~48天已可見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_034","year":2018,"roc_year":107,"session":"","examNo":34,"q":"下列何種公畜有陰莖骨（os penis）的構造？","opts":["A. 豬","B. 馬","C. 犬","D. 羊"],"ans":2,"exp":"犬有陰莖骨（os penis/baculum），是正常解剖構造，有助於交配。","we":["(A) 貓也有陰莖骨，但犬的陰莖骨比貓更發達。","(B) 豬沒有陰莖骨。","(D) 馬沒有陰莖骨。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_035","year":2018,"roc_year":107,"session":"","examNo":35,"q":"有關牛隻freemartin之敘述，下列何者錯誤？","opts":["A. 發生於一公一母雙胞胎的小母牛","B. 只分娩出一頭的小母牛也可能發生","C. freemartin的小母牛可能帶有雄性性腺器官","D. freemartin的小母牛體內性染色體可能同時出現XX與XY的組合"],"ans":1,"exp":"Freemartin（異性雙胎不育症）：「只有一頭（雌性）freemartin不會發生」是「錯誤」敘述——事實上雌雄異性雙胎中，雌性就是freemartin，不論是否只有一頭雌性。","we":["(A) 95%異性雙胎的雌性會成為freemartin是正確統計。","(C) freemartin的子宮及卵巢發育不全是正確的。","(D) 雄性雙胎通常生育力正常是正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_036","year":2018,"roc_year":107,"session":"","examNo":36,"q":"為泌乳牛隻進行直腸檢診時，發現雙側卵巢無功能性結構，體態正常且無營養缺乏情形，子宮有強收縮力並 在外陰部見到略帶血液之黏液，該牛隻最適當之處置為何？","opts":["A. 注射GnRH與維生素A、D、E","B. 不須處置，注意3週後是否有發情現象","C. 注射PGF 2α","D. 裝置CIDR陰道塞劑"],"ans":1,"exp":"發現卵巢無結構（featureless ovary）加上子宮有血液-黏液分泌物，最佳處置是不須立即介入，觀察3週後再複查，因可能是發情週期的特定階段。","we":["(A) 立即注射GnRH可能時機不對，浪費藥物。","(C) 立即進行子宮沖洗可能干擾正常生理。","(D) 直接進行卵巢切除過於積極，需先確認病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_037","year":2018,"roc_year":107,"session":"","examNo":37,"q":"下列何者為牛隻發生染色體1/29易位（translocation）時所帶來的影響？","opts":["A. 上顎裂","B. 反轉裂胎","C. 繁殖率下降","D. 重複外子宮口"],"ans":2,"exp":"1/29羅伯遜易位（1/29 Robertsonian translocation）是牛常見的染色體異常，攜帶者繁殖率明顯下降（特別是雌性）。","we":["(A) 外觀正常是正確的（攜帶者表現型正常）。","(B) 雄性繁殖率影響較小，但仍有影響。","(D) 此易位在品種中有不同頻率分布，需篩檢管理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_038","year":2018,"roc_year":107,"session":"","examNo":38,"q":"母貓的品種與難產有關，下列何品種最容易發生難產？","opts":["A. 短毛貓，如British short-hair","B. 短毛貓，如Foreign short-hair","C. 長毛波斯貓","D. 中長毛貓，如Balinese"],"ans":2,"exp":"長毛波斯貓（Persian cat）因頭型扁平（brachycephalic）、骨盆較窄，是最容易發生難產（dystocia）的貓品種。","we":["(A) 暹羅貓（Siamese）體型細長，難產率不是最高。","(B) 緬因貓（Maine Coon）體型大但體型比例正常，難產率不是最高。","(D) 美國短毛貓骨盆比例正常，難產率較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_039","year":2018,"roc_year":107,"session":"","examNo":39,"q":"胎兒出生前肺部呼吸功能的成熟，主要受下列那項內泌素的促進作用？","opts":["A. 胰島素（insulin）","B. 甲狀腺素（thyroxin）","C. 腎上腺素（adrenaline）","D. 生長素（growth hormone）"],"ans":1,"exp":"甲狀腺素（thyroid hormone）可促進胎兒肺部成熟，特別是促進肺泡表面活性劑（surfactant）的生成。","we":["(A) 胰島素抑制肺成熟（糖尿病母親的胎兒肺不成熟）。","(C) 雌激素對肺成熟有部分促進作用，但主要是皮質醇和甲狀腺素。","(D) 黃體素（progesterone）不是促進肺成熟的主要激素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_040","year":2018,"roc_year":107,"session":"","examNo":40,"q":"罹患子宮積水（hydrometra）的山羊抽血檢查，會發現下列那項內泌素的濃度增加？","opts":["A. 濾泡刺激素（FSH）","B. 前列腺素F2α（PGF2α）","C. 鬆弛素（relaxin）","D. 助孕素（progesterone）"],"ans":3,"exp":"山羊hydrometra（子宮積水）是黃體長期持續的結果，助孕素（progesterone）濃度持續升高，抑制發情表現及子宮頸開放。","we":["(A) 雌激素在hydrometra中不是升高的激素。","(B) LH濃度在此情況下不升高。","(C) FSH在此情況下不是主要升高的激素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_041","year":2018,"roc_year":107,"session":"","examNo":41,"q":"經由牛直腸檢查卵巢疾病，僅一次診斷常有困難，應於幾天後再檢查確認？","opts":["A. 3~6","B. 7~10","C. 11~14","D. 15~18"],"ans":1,"exp":"評估牛卵巢疾病（如卵巢囊腫）後，建議7~10天後再次直腸觸診確認，以區分功能性黃體囊腫與真性囊腫。","we":["(A) 3~5天太短，難以判斷變化趨勢。","(C) 14~21天等待時間較長，可能延誤治療。","(D) 立即治療不確認病因，可能選擇錯誤治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_042","year":2018,"roc_year":107,"session":"","examNo":42,"q":"犬心衰竭使用毛地黃（digoxin）過量出現中毒時，心電圖可見何種變化？","opts":["A. P波平坦（flat P wave）","B. QRS波變寬（widened QRS）","C. ST分割下降（ST segment depression）","D. PR間隔延長（PR interval prolongation）"],"ans":3,"exp":"Digoxin（地高辛）中毒的心電圖表現包括：PR間隔延長（AV傳導延緩）、ST段壓低、各種心律不整。PR間隔延長是重要的毒性指標。","we":["(A) QRS變寬見於嚴重digoxin毒性，但PR延長是早期指標。","(B) QT延長見於其他藥物毒性（如抗心律不整藥），不是digoxin的典型。","(C) P波消失見於心房顫動，不是digoxin中毒的典型早期表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_043","year":2018,"roc_year":107,"session":"","examNo":43,"q":"下列何種因素會引起犬貓竇性心搏過速（sinus tachycardia）？","opts":["A. 低體溫","B. 使用β受體阻斷藥（β-blockers）","C. 心衰竭","D. 低甲狀腺功能症"],"ans":2,"exp":"心臟衰竭（heart failure）時心輸出量不足→交感神經興奮→引起竇性心搏過速（sinus tachycardia）作為代償反應。","we":["(A) 竇性心搏過緩不是心衰竭的代償機制（恰好相反）。","(B) 心房顫動是心衰竭的可能合併症，但不是最直接的代償反應。","(D) 心室早期收縮（VPC）可見於心衰竭，但竇性心搏過速是更基本的代償。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_044","year":2018,"roc_year":107,"session":"","examNo":44,"q":"聽診犬隻時可聽到大聲的心雜音，同時也可在胸部心前區觸診到顫抖的感覺。此為第幾級心雜音？","opts":["A. III","B. IV","C. V","D. VI"],"ans":1,"exp":"心臟雜音分級：Grade IV定義為大聲的雜音且有可觸診的震顫（palpable thrill）；Grade III以下聽診大聲但無震顫，Grade V以上即使聽診器略離皮膚也可聽到。","we":["(A) Grade III：大聲但無可觸診震顫。","(C) Grade V：不需緊貼皮膚即可聽到。","(D) Grade VI：即使聽診器不接觸皮膚也可聽到。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_045","year":2018,"roc_year":107,"session":"","examNo":45,"q":"在正常生理情況下，犬隻牙齦黏膜微血管回流時間CRT（capillary refill time）為多少秒？","opts":["A. 0.5","B. 1~2","C. 3~5","D. 大於5"],"ans":1,"exp":"毛細血管再充盈時間（CRT, Capillary Refill Time）正常值為1~2秒（小動物）；超過2秒提示循環灌流不足。","we":["(A) 0~0.5秒不符合正常定義（正常應有短暫發白後恢復）。","(C) 3~4秒提示循環不良（輕度休克）。","(D) 超過5秒是嚴重循環衰竭的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_046","year":2018,"roc_year":107,"session":"","examNo":46,"q":"有關犬淋巴瘤之敘述，下列何者正確？","opts":["A. 淋巴瘤通常發展快速，當懷疑為淋巴瘤時，應先用類固醇類藥物抑制腫瘤之進展","B. 進行化療時為確保療效，療程應嚴格遵守，身體的血相變化及化療毒性僅作為參考","C. 當淋巴瘤合併有肝脾浸潤，代表臨床分期較高","D. 淋巴瘤的抗藥性多屬多重抗藥性，所以應儘量使用單方化療，避免產生抗藥性"],"ans":2,"exp":"淋巴瘤合併肝臟和脾臟浸潤，表示腫瘤已擴散至多個器官→臨床分期（clinical staging）較高（如WHO分期第IV或V期）。","we":["(A) 分期較低代表腫瘤侷限，肝脾浸潤不符合。","(B) 分期不影響是錯的，器官浸潤是重要分期指標。","(D) 分期無法判斷不正確，有明確的淋巴瘤分期系統。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_047","year":2018,"roc_year":107,"session":"","examNo":47,"q":"犬隻胃扭轉是一種多因子疾病，下列何者不是可能之致病或好發因子？","opts":["A. 進食前後激烈運動造成攝入過多空氣（aerophagia）","B. 胃排空延遲或減緩（病理性或生理性）","C. 競爭性進食及進食過速或狼吞虎嚥（fast eating speed）","D. 少量多餐、限制進食量"],"ans":3,"exp":"GDV（胃擴張-扭轉）的致病因子包括：深胸犬種、一次大量進食、運動後立即進食等；「少量多餐限制進食量」是預防措施，不是致病因子。","we":["(A) 深胸犬種（如大丹犬）是GDV的主要風險因素。","(B) 一次大量進食是重要GDV誘發因素。","(C) 進食後立即激烈運動是GDV的風險因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_048","year":2018,"roc_year":107,"session":"","examNo":48,"q":"10歲已去勢之法國鬥牛公犬因鼠蹊部皮膚腫塊就診。在完成理學檢查及觸診數分鐘後，鼠蹊部腫瘤變成紅腫 並延伸到附近組織。此種腫瘤最可能出現的副腫瘤症候群為何？","opts":["A. 高血鈣","B. 血小板增多","C. 白血球低下","D. 胃潰瘍"],"ans":3,"exp":"肥大細胞瘤（mast cell tumor）觸診後腫脹（Darier's sign）→釋放組織胺→刺激胃壁細胞→胃酸分泌增加→胃潰瘍是典型的副腫瘤症候群（paraneoplastic syndrome）。","we":["(A) 淋巴瘤主要引起高鈣血症作為副腫瘤效應。","(B) 纖維肉瘤不典型引起胃潰瘍。","(C) 血管肉瘤主要引起出血/貧血問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_049","year":2018,"roc_year":107,"session":"","examNo":49,"q":"犬貓的吸入性肺炎在初期時之放射線影像上可能會出現不同的相（pattern），下列何者最不可能？","opts":["A. 血管相（vascular pattern）","B. 間質相（interstitial pattern）","C. 肺泡相（alveolar pattern）","D. 肺實質化（consolidation）"],"ans":0,"exp":"吸入性肺炎（aspiration pneumonia）初期X光表現：腹側肺葉（gravitational）出現實變（consolidation），早期不出現明顯血管相（vascular pattern）增加——肺間質模式是後期或慢性變化。","we":["(B) 腹側肺葉實變是吸入性肺炎的典型初期X光表現。","(C) 右中葉（right middle lobe）在犬是常見的吸入性肺炎部位。","(D) 支氣管充氣徵（air bronchogram）在肺實變中可見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_050","year":2018,"roc_year":107,"session":"","examNo":50,"q":"犬隻的自體免疫多重內分泌症候群（autoimmune polyendocrine syndromes）最不常見下列何種併發症？","opts":["A. 低甲狀腺功能症（hypothyroidism）","B. 低腎上腺功能症（hypoadrenocorticism）","C. 低生長內泌素功能症（growth hormone deficiency）","D. 糖尿病（diabetes mellitus）"],"ans":2,"exp":"犬多內分泌腺病（APS, Autoimmune Polyglandular Syndrome）最不常見的是生長激素（GH）缺乏；最常見的組合是甲狀腺低下+腎上腺皮質機能不足+糖尿病。","we":["(A) 甲狀腺低下（hypothyroidism）是APS最常見的組成。","(B) 糖尿病（diabetes mellitus）在犬APS中常見。","(D) 腎上腺皮質機能不足（Addison's disease）也是APS常見組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_051","year":2018,"roc_year":107,"session":"","examNo":51,"q":"犬貓下列何項尿路結石，無法利
