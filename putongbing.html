. 注射prostaglandin F 2α，12天後再注射一次prostaglandin F 2α","D. 注射estradiol，7天後注射prostaglandin F 2α"],"ans":0,"exp":"本題為母山羊子宮超音波影像判讀，需依圖確認是否懷孕（正常發育的胚胎/胎兒），或是否為子宮積液/黃體囊腫等異常。（圖片題，標記待覆核）","we":["注射 GnRH 後 7 天再注射 PGF2α 為 Ovsynch 一部分；若影像為正常懷孕則不應施打，此選項需依圖判斷。","Progesterone 陰道塞劑用於同期發情誘導，若已確認懷孕則不需要，需依圖判斷。","注射 PGF2α × 2（間隔 12 天）為同期發情方案之一，需依圖判斷是否適用。","Estradiol + PGF2α 也是同期發情方案，需依圖確認子宮狀態後判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_076","year":2025,"roc_year":114,"session":"","examNo":76,"q":"請依序回答下列3題： 某一牧場每7天會請獸醫師為乳牛進行繁殖器官檢查，在一次檢查當中，一頭分娩後35天的母牛， 經直腸超音波檢查子宮無任何異常，雙側卵巢上並無任何功能性組織，下列何種處置對於當天檢查 結果最不適當？","opts":["A. 給予性腺素釋放激素致效劑（GnRH agonist）","B. 給予性腺素釋放激素致效劑（GnRH agonist）及陰道內助孕素（intravaginal progesterone）釋 放裝置","C. 不進行任何處置，7天後再次檢查","D. 給予前列腺素F 2α致效劑（prostaglandin F 2α agonist）"],"ans":3,"exp":"分娩後 35 天的母牛，雙側卵巢無任何功能性組織（無黃體、無優勢濾泡）＝卵巢靜止/無動情週期狀態（ovarian inactivity）。此時給予 PGF2α 完全無效，因為 PGF2α 的作用機制是溶解「已存在的黃體」，但此牛無黃體可溶解，為最不適當的處置。","we":["給予 GnRH agonist 可嘗試誘導排卵或刺激濾泡發育，雖效果有限但不是最不適當。","GnRH + 陰道內助孕素裝置（如 CIDR）可促進濾泡發育和黃體前期建立，有合理的生理基礎。","不進行任何處置，7 天後再次檢查，是合理且保守的選擇（35 天仍在正常過渡期範圍內）。","（正確）PGF2α agonist 的作用為溶解黃體，無黃體時完全無效；給予 PGF2α 是此情境下最不適當的處置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_077","year":2025,"roc_year":114,"session":"","examNo":77,"q":"下列何種診斷最適合？","opts":["A. 一般正常濾泡","B. 濾泡囊腫（follicular cyst）","C. 黃體囊腫（luteal cyst）","D. 囊腫性黃體（cystic corpus luteum）"],"ans":3,"exp":"本題為上題情境的追蹤，需依超音波影像判斷卵巢結構診斷。若影像顯示為囊腫性黃體（cystic corpus luteum），其特徵為中心有液態空腔但邊緣有明顯黃體組織（能分泌助孕素）。（圖片題，標記待覆核）","we":["一般正常濾泡直徑通常小於 20 mm，無需特殊治療，可等待自然排卵。","濾泡囊腫（follicular cyst）壁薄、無黃體組織，超音波下呈完全無回音的大型液體結構（>25 mm）。","黃體囊腫（luteal cyst）有薄層黃體組織，可分泌少量助孕素，超音波下有稀薄回音邊緣。","（正確）囊腫性黃體（cystic corpus luteum）為黃體內含有液態空腔，仍有功能性黃體組織，可分泌助孕素，是正常或半正常的卵巢結構。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_078","year":2025,"roc_year":114,"session":"","examNo":78,"q":"承上題，針對此檢查結果，有關當天給予的處置下列何者最不適當？","opts":["A. 給予性腺素釋放激素致效劑（GnRH agonist）","B. 給予前列腺素F 2α致效劑（prostaglandin F 2α agonist）","C. 給予人類絨毛膜促性腺激素（human chorionic gonadotrophin）","D. 同時給予性腺素釋放激素致效劑（GnRH agonist）及前列腺素F 2α致效劑（prostaglandin F 2α agonist）"],"ans":1,"exp":"若 Q77 診斷為囊腫性黃體（cystic corpus luteum，有功能），PGF2α agonist 可溶解黃體→使週期繼續，是有效的處置；GnRH 或 hCG 對已有功能性黃體的情況不是首選（無法再誘導排卵）。單獨使用 PGF2α 或 GnRH + PGF2α 組合均有合理性。（本題答案依 Q77 圖片確認後判斷，標記待覆核）","we":["GnRH agonist 對囊腫性黃體的治療效果有限（LH surge 已無濾泡可排卵），但可配合其他藥物。","（正確）PGF2α agonist 可溶解囊腫性黃體，使週期繼續，是針對功能性黃體結構最直接有效的處置；單獨給予 PGF2α 是最合理的。","hCG 作用類似 LH，對囊腫性黃體（已有 CL）效果不明顯，不是最不適當。","同時給予 GnRH + PGF2α 在臨床上有合理性（Ovsynch 方案），不是最不適當的選擇。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_079","year":2025,"roc_year":114,"session":"","examNo":79,"q":"下列何種內泌素，可促使睪丸的賽托利細胞（Sertoli cell）分泌雄性素結合蛋白（androgen binding protein）？","opts":["A. 腎上腺皮質刺激素（ACTH）","B. 濾泡刺激素（FSH）","C. 黃體激素（LH）","D. 睪固酮（testosterone）"],"ans":1,"exp":"賽托利細胞（Sertoli cells）分泌雄性素結合蛋白（androgen binding protein, ABP）的主要刺激素為「FSH（濾泡刺激素）」。FSH 與賽托利細胞上的 FSH 受體結合→cAMP 訊號→促進 ABP 合成分泌。睪固酮雖可輔助，但 FSH 是主要調節因子。","we":["ACTH 主要刺激腎上腺皮質分泌皮質醇，不直接調控賽托利細胞功能。","（正確）FSH（濾泡刺激素）是刺激賽托利細胞分泌 ABP 的主要荷爾蒙，ABP 幫助維持高濃度睪固酮在曲細精管內以支持精子發生。","LH 主要作用於萊氏細胞（Leydig cells）刺激睪固酮分泌，不是直接刺激賽托利細胞分泌 ABP 的主要因素。","睪固酮雖可輔助支持賽托利細胞功能（協同 FSH），但 FSH 才是促進 ABP 合成的主要刺激素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_080","year":2025,"roc_year":114,"session":"","examNo":80,"q":"下列何種雄性動物的flehmen response，不包含上嘴唇翻折（curly of the upper lip）？","opts":["A. 綿羊","B. 牛","C. 馬","D. 駝科動物"],"ans":3,"exp":"Flehmen response（費洛蒙反應）在大多數哺乳動物表現為上嘴唇翻折（curling of upper lip）使費洛蒙進入鋤鼻器官（VNO）。駝科動物（camelids：駱駝、羊駝、大羊駝等）的 flehmen response 不包含典型的上嘴唇翻折，其行為表現較為不明顯或以不同方式表現。","we":["綿羊雄性在感知母羊費洛蒙時，會展現包含上嘴唇翻折的 flehmen response，A 不是答案。","牛（公牛）也展現典型的上嘴唇翻折 flehmen response，B 不是答案。","馬（種馬）的 flehmen response 是最典型的動物之一，明顯的上嘴唇後翻，C 不是答案。","（正確）駝科動物（camelids）的 flehmen response 不包含典型的上嘴唇翻折，其鋤鼻器官結構和費洛蒙感知方式與其他哺乳動物不同。"],"needs_review":false,"imgs":[]}];

function getNote(id){return notesStore[id]||(notesStore[id]={text:'',imgs:[]});}

function compressImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=720;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleNoteImgs(id,fcIdx,input){
  const files=Array.from(input.files);if(!files.length)return;
  const note=getNote(id);
  for(const f of files){try{note.imgs.push(await compressImg(f));}catch(e){}}
  saveNotes();renderNoteImgs(id,fcIdx);input.value='';
}
function removeNoteImg(id,i,fcIdx){
  const note=getNote(id);note.imgs.splice(i,1);saveNotes();renderNoteImgs(id,fcIdx);
}
function renderNoteImgs(id,fcIdx){
  const el=document.getElementById('ni-'+fcIdx);if(!el)return;
  const imgs=getNote(id).imgs;
  el.innerHTML=imgs.map((src,i)=>`<div class="note-img-wrap"><img src="${src}" alt="筆記圖片" onclick="viewImg('${src}')"><button class="note-img-del" onclick="removeNoteImg('${id}',${i},${fcIdx})" title="刪除">✕</button></div>`).join('');
}
function viewImg(src){
  const m=document.createElement('div');

  m.innerHTML=`<img src="${src}" style="max-width:100%;max-height:90vh;border-radius:8px">`;
  m.onclick=()=>m.remove();document.body.appendChild(m);
}

function saveProgress(){
  if(!currentUser)return;
  const data={qStates,errorCounts,unsureSet,mode,curFilter,qi:state.qi,ts:Date.now()};
  try{localStorage.setItem(SAVE_KEY_BASE+'_local_'+currentUser,JSON.stringify(data));}catch(e){}
  db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).set(data).catch(()=>{});
}
async function loadProgress(){
  if(!currentUser)return;
  try{
    const snap=await db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).get();
    const d=snap.exists?snap.data():null;
    if(!d)return;
    if(d.qStates)qStates=d.qStates;
    if(d.errorCounts)errorCounts=d.errorCounts;
    if(d.unsureSet)unsureSet=d.unsureSet;
    if(d.mode!==undefined)mode=d.mode;
    if(d.curFilter)curFilter=d.curFilter;
    recalcStats();
    const qs=getQs();
    state.qi=Math.min(Math.max(d.qi||0,0),Math.max(qs.length-1,0));
  }catch(e){
    try{
      const d=JSON.parse(localStorage.getItem(SAVE_KEY_BASE+'_local_'+currentUser)||'null');
      if(!d)return;
      if(d.qStates)qStates=d.qStates;
      if(d.errorCounts)errorCounts=d.errorCounts;
      if(d.unsureSet)unsureSet=d.unsureSet;
      if(d.mode!==undefined)mode=d.mode;
      if(d.curFilter)curFilter=d.curFilter;
      recalcStats();
      const qs=getQs();
      state.qi=Math.min(Math.max(d.qi||0,0),Math.max(qs.length-1,0));
    }catch(e2){}
  }
}
function recalcStats(){
  const qs=getQs();state.done=0;state.cor=0;
  qs.forEach(q=>{const st=qStates[q.id];if(st){state.done++;if(st==='ok')state.cor++;}});
}
function clearProgress(){
  if(!confirm('確定清除所有作答記錄與錯題歷史？此操作無法復原。'))return;
  qStates={};errorCounts={};unsureSet={};state={qi:0,done:0,cor:0};
  try{localStorage.removeItem(SAVE_KEY_BASE+'_local_'+currentUser);}catch(e){}
  if(currentUser)db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).delete().catch(()=>{});
  render();

function startExam(){
  const qs=getQs();
  const unanswered=qs.filter(q=>!qStates[q.id]);
  const label=curFilter==='all'?'全部題目':document.getElementById('yrsel').options[document.getElementById('yrsel').selectedIndex].text;
  const msg=unanswered.length===qs.length
    ?`開始測驗：${label}（${qs.length} 題）？`
    :`「${label}」還有 ${unanswered.length} 題未作答。\n\n• 繼續作答剩餘題目：點「繼續」\n• 重新測驗全部：點「重新開始」`;
  if(unanswered.length===qs.length){
    if(!confirm(msg))return;
  }else{
    const choice=confirm(msg+'\n\n（確定 = 重新開始，取消 = 繼續作答）');
    if(choice){
      qs.forEach(q=>{delete qStates[q.id];delete errorCounts[q.id];delete unsureSet[q.id];});
      state={qi:0,done:0,cor:0};saveProgress();
    }else{
      const firstUnanswered=qs.findIndex(q=>!qStates[q.id]);
      if(firstUnanswered>=0)state.qi=firstUnanswered;
    }
  }
  mode=0;
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===0)});
  recalcStats();saveProgress();render();
}

function pick(i,ans){
  const qs=getQs();const q=qs[state.qi];
  if(!q||qStates[q.id])return;
  const correct=q.ma?q.ma.includes(i):(i===ans);
  state.done++;if(correct)state.cor++;
  qStates[q.id]=correct?'ok':'no-'+i;
  if(!correct)errorCounts[q.id]=(errorCounts[q.id]||0)+1;
  saveProgress();
  for(let j=0;j<q.opts.length;j++){
    const d=document.getElementById('o'+j);if(!d)continue;
    const isAns=q.ma?q.ma.includes(j):(j===ans);if(isAns){d.classList.add('dis','ok');d.removeAttribute('onclick');}
    else if(j===i&&!correct){d.classList.add('no');d.setAttribute('onclick','peekWexp('+j+')');}
    else{d.classList.add('peek');d.setAttribute('onclick','peekWexp('+j+')');}
  }
  document.getElementById('exp').classList.add('show');
  if(!correct&&q.we&&q.we[i]&&q.we[i]!==''){
    const we=document.getElementById('wexp');const t=document.getElementById('wexp-t');
    if(we){document.getElementById('wexp-body').textContent=q.we[i];if(t)t.innerHTML='你可能選這個，是因為&#x2026;&#x2026;';we.classList.add('show');}
  }
  const nb=document.getElementById('nb');if(nb)nb.style.display='';
  const ubtn=document.getElementById('unsure-btn');
  if(ubtn)ubtn.classList.remove('invis');
  const aiWrap=document.getElementById('ai-wrap');
  if(aiWrap&&!aiWrap.querySelector('.btn-ai')){
    const btn=document.createElement('button');
    btn.className='btn btn-ai';btn.style.cssText='width:100%;margin-top:.6rem';
    btn.textContent='🤖 問 AI 獲取詳細解析';
    btn.onclick=()=>showAIModal(state.qi);
    aiWrap.appendChild(btn);
  }
  const ec=errorCounts[q.id]||0;
  if(!correct&&ec>=2){
    const expEl=document.getElementById('exp');
    if(expEl&&!expEl.querySelector('.ec-hint')){
      const hint=document.createElement('div');
      hint.className='note-box ec-hint';hint.style.marginTop='.5rem';
      hint.innerHTML=`⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。`;
      expEl.appendChild(hint);
    }
  }
  updStats();renderNav();
}
function peekWexp(i){
  const qs=getQs();const q=qs[state.qi];
  document.querySelectorAll('.opt.peek').forEach(el=>el.classList.remove('peek-active'));
  const el=document.getElementById('o'+i);if(el)el.classList.add('peek-active');
  const we=document.getElementById('wexp');const weBody=document.getElementById('wexp-body');const weT=document.getElementById('wexp-t');
  if(!we||!weBody)return;
  const letter=String.fromCharCode(65+i);
  const isPicked=el&&el.classList.contains('no');
  if(weT)weT.textContent=isPicked?'你選了 ('+letter+')，為什麼不對？':'選項 ('+letter+') 為什麼不對？';
  const txt=(q.we&&q.we[i]&&q.we[i]!=='')?q.we[i]:'（解析待補充）';
  weBody.textContent=txt;we.classList.add('show');
}
function toggleUnsure(){
  const qs=getQs();const q=qs[state.qi];if(!q)return;
  if(unsureSet[q.id])delete unsureSet[q.id];
  else unsureSet[q.id]=true;
  saveProgress();
  const btn=document.getElementById('unsure-btn');
  if(btn){
    const active=!!unsureSet[q.id];
    btn.classList.toggle('active',active);
    btn.title='★';
  }
  const meta=document.querySelector('.meta');
  if(meta){
    const old=meta.querySelector('.unsure-tag');if(old)old.remove();
    if(unsureSet[q.id]){
      const tag=document.createElement('span');
      tag.className='bdg unsure-tag';tag.textContent='★';
      const qn=meta.querySelector('.qn');if(qn)meta.insertBefore(tag,qn);else meta.appendChild(tag);
    }
  }
  renderNav();
}
function restartQuiz(){

function showAIModal(qIdx){
  const qs=getQs();const q=qs[qIdx];if(!q)return;

  lines.push('',`【正確答案】${String.fromCharCode(65+q.ans)}`,'',`【現有解析】${q.exp}`,'');

  const text=lines.join('\n');

  const modal=document.createElement('div');
  modal.id='ai-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem';
  modal.innerHTML=`<div style="background:#1a1d27;border:1px solid #3d4260;border-radius:12px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-size:14px;font-weight:700;color:#7986cb">🤖 問 AI 獲取更詳細解析</div>
      <button onclick="document.getElementById('ai-modal').remove()" style="background:none;border:none;color:#9096b8;cursor:pointer;font-size:20px;line-height:1">✕</button>
    </div>
    <div style="font-size:11px;color:#9096b8;margin-bottom:.5rem">以下文字將傳給 AI。點 AI 按鈕時自動複製，開啟網站後貼上（Ctrl+V）：</div>
    <div id="ai-preview" style="font-size:11px;color:#9096b8;background:#0f1117;border:1px solid #2e3347;border-radius:6px;padding:10px;max-height:130px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-bottom:.75rem"></div>
    <button onclick="copyAIText()" style="width:100%;padding:9px;background:#22263a;border:1px solid #3d4260;border-radius:8px;color:#e8eaf6;cursor:pointer;margin-bottom:6px;font-size:13px">📋 複製題目文字</button>
    <div id="copy-ok" style="text-align:center;color:#43a867;font-size:12px;min-height:18px;margin-bottom:6px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem">
      <a href="https://chat.openai.com/" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#10a37f15;border:1px solid #10a37f40;border-radius:8px;color:#10a37f;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">🤖<span>ChatGPT</span></a>
      <a href="https://claude.ai/new" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#d97a2015;border:1px solid #d97a2040;border-radius:8px;color:#d97a20;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">⚡<span>Claude</span></a>
      <a href="https://gemini.google.com/app" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#4285f415;border:1px solid #4285f440;border-radius:8px;color:#4285f4;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">✨<span>Gemini</span></a>
    </div>
    <div style="font-size:11px;color:#555d80;text-align:center">點 AI 按鈕後在新分頁貼上即可</div>
  </div>`;
  modal.querySelector('#ai-preview').textContent=text;
  modal._aiText=text;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
}
function copyAIText(){
  const modal=document.getElementById('ai-modal');if(!modal||!modal._aiText)return;
  const ok=document.getElementById('copy-ok');
  const show=msg=>{if(ok){ok.textContent=msg;setTimeout(()=>ok.textContent='',2500);}};
  navigator.clipboard.writeText(modal._aiText).then(()=>show('✓ 已複製到剪貼簿！開啟 AI 後貼上')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=modal._aiText;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
    show('✓ 已複製！');
  });
}
document.getElementById('qtotal').textContent=ALL_QS.length;
(function(){
  const sel=document.getElementById('yrsel');
  const seen=new Set();const opts=[];
  ALL_QS.forEach(q=>{
    const key=q.session?String(q.year)+'-'+q.session:String(q.year);
    if(!seen.has(key)){seen.add(key);opts.push({key,year:q.year,roc:q.roc_year,session:q.session||''});}
  });
  opts.sort((a,b)=>b.year-a.year||(b.session<a.session?-1:1));
  opts.forEach(o=>{
    const op=document.createElement('option');op.value=o.key;
    op.textContent=o.session?'民國'+o.roc+'年 第'+o.session+'次':'民國'+o.roc+'年';
    sel.appendChild(op);
  });
  if(curFilter!=='all')sel.value=curFilter;
})();
auth.onAuthStateChanged(user=>{if(user){enterApp(user);}else{location.href='./index.html';}});

</script>
