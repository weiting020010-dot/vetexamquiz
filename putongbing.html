_2019_2_普通病_074","year":2019,"roc_year":108,"session":"","examNo":74,"q":"承上題，腹背照中變大的左心房位於何處？","opts":["A. 心臟2~3點鐘位置","B. ","C. 心臟5點鐘位置","D. ","E. 氣管分枝處尾側","F. ","G. 心臟10~11點鐘位置","H. "],"ans":6,"exp":"犬VD照心臟評估中，左心房（left atrium）位於10~11點鐘位置，擴大時在該位置出現膨出。需確認圖示選項對應關係。","we":["A. 12點鐘位置代表主動脈結。","B. （空選項）","C. 9點鐘位置代表肺動脈幹。","D. （空選項）","E. 3點鐘位置代表右心室流出道。","F. （空選項）","","H. （空選項）"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_075","year":2019,"roc_year":108,"session":"","examNo":75,"q":"圖中白色箭頭所指\r  波形為何？","opts":["A. 左心室舒張初期，由左心房流入左心室之血流波形","B. 遠離探頭之血流波形","C. 速度不定之血流波形","D. 左心房收縮，流向左心室之血流波形"],"ans":0,"exp":"超音波心臟檢查二尖瓣血流圖中，在舒張早期出現的波峰為E wave（early filling wave），代表早期被動舒張期二尖瓣血流。需確認圖示。","we":["","B. A wave代表心房收縮引起的舒張晚期血流。","C. S wave是肺靜脈血流圖的收縮期波。","D. D wave是肺靜脈血流圖的舒張期波。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_076","year":2019,"roc_year":108,"session":"","examNo":76,"q":"承上題，圖中紅色箭頭所指波形為何？","opts":["A. 發生於心房收縮後","B. 發生於心室收縮期","C. 發生於心室舒張期","D. 稱為A波（A wave）"],"ans":3,"exp":"超音波心臟多普勒圖中，在E wave之後出現的波峰代表心房收縮所引起的血流，稱為A波（A wave，atrial contraction wave）。需確認圖示。","we":["A. E wave是舒張早期波，在A wave之前。","B. S wave是肺靜脈收縮期波。","C. D wave是肺靜脈舒張期波。",""],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_077","year":2019,"roc_year":108,"session":"","examNo":77,"q":"承上題，有關圖中紅色箭頭所指波形，下列敘述何者錯誤？","opts":["A. 為由左心房流向左心室之血流波形","B. 為發生於心房收縮後之血流波形","C. 該血流朝向探頭","D. 稱為E波（E wave）"],"ans":3,"exp":"若紅色箭頭指向的波是在E wave之後（舒張晚期），稱為A wave（心房收縮波），而非E波。說「稱為E波」是錯誤的。需確認圖示。","we":["A. E wave在舒張早期是正確的描述。","B. A wave在舒張晚期代表心房收縮是正確的。","C. E/A ratio評估舒張功能是正確的。",""],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_078","year":2019,"roc_year":108,"session":"","examNo":78,"q":"麻醉醫師採用自主呼吸方式來進行氣體麻醉時，下列何種方式較適合？","opts":["A. full rebreathing system","B. non-rebreathing system","C. close type system","D. partial rebreathing system"],"ans":1,"exp":"Non-rebreathing system（非重複呼吸系統，如Bain circuit）適用於自主呼吸（spontaneous breathing）的小型動物，需要高新鮮氣流，不適用於大型動物。","we":["A. Non-rebreathing system需要高新鮮氣流（high fresh gas flow）。","","C. Rebreathing system（重複呼吸系統）適用於大型動物。","D. Non-rebreathing system中CO2不在系統中重新吸收。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_079","year":2019,"roc_year":108,"session":"","examNo":79,"q":"承上題，該犬從14：30開始麻醉手術（生理監視數值如圖一），進行到16：18時發現生理監視數值如圖二，\r   該犬隻最有可能發生什麼問題？","opts":["A. 高血鉀","B. 心室早期收縮","C. 房室傳導阻滯","D. 低血鎂"],"ans":1,"exp":"心電圖中，在正常P-QRS節律之間提前出現的寬大QRS波，無前置P波，稱為心室早期收縮（ventricular premature complex, VPC）。需確認圖示。","we":["A. 正常竇性心律不會有提前出現的異常QRS。","","C. 二度房室傳導阻滯表現為P波後缺少QRS。","D. 心室顫動表現為無規則的混亂波形。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_080","year":2019,"roc_year":108,"session":"","examNo":80,"q":"承上題，在麻醉中該如何進行緊急治療？","opts":["A. 靜脈注射CaCl 2","B. 靜脈注射lidocaine","C. 靜脈注射atropine","D. 靜脈注射MgSO 4"],"ans":1,"exp":"心室早期收縮（VPC）的急性治療首選靜脈注射lidocaine（利多卡因），是犬VPC最快速有效的緊急處理，尤其在手術麻醉中出現VPC時。需確認圖示。","we":["A. Atropine用於心搏過緩（bradycardia），不是VPC。","","C. Digoxin用於心房顫動或充血性心衰竭，不是VPC急性處理。","D. Propranolol（β-blocker）可用於VPC但不如lidocaine IV快速。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_001","year":2020,"roc_year":109,"session":"","examNo":1,"q":"有關馬內毒素血症的敘述，下列何者錯誤？","opts":["A. 臨床上常見休克","B. 末期常見發燒，四肢發熱","C. 黏膜暗紅","D. 可能併發蹄葉炎"],"ans":1,"exp":"馬內毒素血症末期因心輸出量下降、周邊血管收縮，四肢末梢應出現冰冷（cold extremities），而非發熱。發燒與四肢發熱是早至中期的表現，至末期反而可能出現低溫及四肢冰涼。","we":["休克（低血壓、心輸出量下降）是內毒素血症的核心臨床表現，常見。","末期四肢發熱是錯誤描述；末期反而因周邊循環衰竭而四肢冰冷。","黏膜暗紅（toxic line）是內毒素血症的典型黏膜表現。","蹄葉炎是內毒素血症常見的繼發性併發症，可能出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_002","year":2020,"roc_year":109,"session":"","examNo":2,"q":"有關馬非類固醇抗發炎藥物使用時的注意事項，下列敘述何者錯誤？","opts":["A. 長期使用易造成消化道潰瘍","B. 具腎毒性","C. 初生幼駒應使用較低劑量","D. 脫水時應提高劑量以控制感染"],"ans":3,"exp":"馬匹脫水時腎臟灌流已不足，此時使用NSAID（具腎毒性）應降低劑量或暫緩使用，而非提高劑量。提高劑量會加重腎損傷。","we":["長期NSAID使用會抑制前列腺素保護胃黏膜，造成消化道潰瘍，此敘述正確。","NSAID透過抑制腎臟前列腺素合成，降低腎臟血流，具腎毒性，此敘述正確。","新生幼駒腎臟發育未完全，藥物代謝能力弱，應使用較低劑量，此敘述正確。","脫水時應降低劑量或避免使用，而非提高劑量，此為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_003","year":2020,"roc_year":109,"session":"","examNo":3,"q":"有一跛行馬匹，某單側後肢跨距明顯變短，在即將碰觸地面時，該後肢會突然稍微提舉，其最可能罹患何病？","opts":["A. 坐骨神經炎","B. 腰椎椎間盤突出","C. 後腿肌肉炎","D. 腸骨動脈血栓"],"ans":3,"exp":"腸骨動脈血栓（iliac artery thrombosis）會造成後肢血流減少，運動時肌肉缺氧，導致單側後肢跨距縮短、步伐緊澀；在即將落蹄時因肌肉痙攣而有短暫提舉動作，是典型臨床表現。","we":["坐骨神經炎會造成持續性後肢無力或垂蹄，不具此種突然提舉的間歇性特徵。","腰椎椎間盤突出較少見於馬，且症狀多為雙側、持續性疼痛反應。","後腿肌肉炎多表現為對稱性步態異常和肌肉僵硬，不符合單側間歇性提舉的描述。","腸骨動脈血栓造成缺血性間歇性跛行，即將落蹄前突然提舉為典型症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_004","year":2020,"roc_year":109,"session":"","examNo":4,"q":"下列何種疾病不可能從成馬的直腸觸診觸摸到其疾病特徵？","opts":["A. cecal impaction","B. left dorsal displacement of large colon","C. right dorsal displacement of large colon","D. gastric dilation"],"ans":3,"exp":"胃擴張（gastric dilation）位於腹腔最前方（顱側），超出直腸觸診的可及範圍，因此無法在直腸觸診時觸摸到。馬的胃位於肋弓後方，無法經由直腸觸診評估。","we":["盲腸嵌塞可在直腸觸診時於右背側觸摸到膨大的盲腸體，可診斷。","左背側大腸移位可觸及脾腎韌帶間的大腸，在直腸觸診下可評估。","右背側大腸移位同樣可在直腸觸診下於右背側觸及異位的大腸段。","胃位於前腹部，距離肛門過遠，直腸觸診無法到達，故無法觸摸其病徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_005","year":2020,"roc_year":109,"session":"","examNo":5,"q":"馬剖腹產手術中，有關子宮壁切創處的縫合，下列何種縫合法最為恰當？","opts":["A. 以overlapping方式簡單間斷縫合創口","B. 以Lembert suture縫合創口","C. 以水平褥式（mattress）縫合創口","D. 在兩切創緣全層穿透連續縫合"],"ans":1,"exp":"馬剖腹產子宮切口最常採用Lembert縫合（翻入縫合），此法可將切口邊緣翻入腔腔內，形成良好的密封與癒合，減少腹腔污染。","we":["overlapping簡單間斷縫合不提供理想的組織對合與翻入效果，不適合子宮壁。","Lembert縫合是大型動物子宮切口的標準縫合法，正確答案。","水平褥式縫合（horizontal mattress）主要用於張力縫合，非子宮首選。","全層穿透連續縫合會增加腔腔污染風險，不適合子宮縫合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_006","year":2020,"roc_year":109,"session":"","examNo":6,"q":"複選題 6.下列何者為牛隻亞硝酸鹽中毒之血液變化？","opts":["A. 血液凝固不全，呈鮮紅色","B. 血液凝固不全，呈暗紅色","C. 血液凝固不全，呈巧克力色","D. 血液溶血，呈鮮血樣"],"ans":2,"exp":"牛亞硝酸鹽中毒導致高鐵血紅素（methemoglobin）形成，血液呈巧克力棕色（chocolate brown），血液凝固功能下降（因缺氧導致的凝血因子異常），是亞硝酸鹽中毒的典型血液變化。","we":["鮮紅色血液代表氧合良好，亞硝酸鹽中毒時高鐵血紅素形成，血液無法攜氧，故呈暗棕色。","暗紅色血液（靜脈血色）見於缺氧，但亞硝酸鹽中毒的特徵是巧克力棕色，非暗紅色。","巧克力棕色血液（methemoglobinemia）是亞硝酸鹽中毒的病理學標誌，此為正確答案。","溶血性血液外觀見於溶血性貧血，非亞硝酸鹽中毒的主要機轉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_007","year":2020,"roc_year":109,"session":"","examNo":7,"q":"有關引起牛隻呼吸困難之敘述，下列何者正確？","opts":["A. 肺氣腫所引起的呼吸困難是氧氣太高之充氧性所致","B. 心臟性呼吸困難是因為伴有肺水腫或肺充血的左心逆向性心衰竭所致","C. 心臟性呼吸困難是因為伴有肺水腫或肺充血的右心逆向性心衰竭所致","D. 鹼中毒時，由於二氧化碳濃度上升會刺激呼吸中樞而引發呼吸困難"],"ans":1,"exp":"心臟性呼吸困難是因為左心室逆向性（backward）衰竭，導致肺靜脈血液回流障礙，進而引起肺充血與肺水腫，壓迫肺泡氣體交換而造成呼吸困難。","we":["肺氣腫引起呼吸困難是因為肺泡壁破壞、空氣滯留，而非「氧氣太高」，此敘述錯誤。","左心逆向性心衰竭 → 肺靜脈高壓 → 肺充血/肺水腫 → 呼吸困難，此敘述正確。","右心逆向性心衰竭導致體循環靜脈高壓（腹水、浮腫），而非肺水腫，不引起肺性呼吸困難。","鹼中毒時CO₂濃度下降（非上升），反而抑制呼吸中樞而非刺激，此敘述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_008","year":2020,"roc_year":109,"session":"","examNo":8,"q":"動物發生肺水腫時，聽診會出現何種聲音？","opts":["A. 乾性囉音","B. 濕性囉音","C. 空洞音","D. 汽笛音"],"ans":1,"exp":"肺水腫時肺泡及細支氣管內充滿液體，聽診時可聽到濕性囉音（moist/wet rales），這是液體在氣流通過時振動所產生的音響，是肺水腫的特徵性聽診音。","we":["乾性囉音（dry rale）是氣道分泌物或黏膜腫脹引起，見於支氣管炎或哮喘，不是肺水腫的特徵。","濕性囉音由肺泡或細支氣管液體振動所產生，是肺水腫的典型聽診音，此為正確答案。","空洞音見於肺膿腫或肺空洞，為空洞型病變的特徵音。","汽笛音（wheeze）因氣道狹窄產生，見於支氣管痙攣，不是肺水腫特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_009","year":2020,"roc_year":109,"session":"","examNo":9,"q":"牛隻於下列何種情況，可能在其左腹脇部聽叩診到金屬音（ping）？","opts":["A. 瘤胃體積縮小","B. 創傷性蜂巢胃炎","C. 皺胃右側異位","D. 子宮蓄膿"],"ans":1,"exp":"創傷性蜂巢胃炎（traumatic reticuloperitonitis）時，發炎的瘤網胃區域可出現局部氣體積聚，因此在左腹脇部聽叩診可能聽到金屬音（ping）。其他選項中皺胃右側異位（RDA）的ping在右側，而子宮蓄膿與瘤胃縮小本身不產生ping。","we":["瘤胃體積縮小本身不直接產生金屬音；需有氣體積聚才能形成ping。","創傷性蜂巢胃炎時局部氣體積聚可在左腹脇部產生金屬音，此為正確答案。","皺胃右側異位（RDA）的ping位於右側，不在左腹脇部。","子宮蓄膿為液體積聚，不會產生金屬叩診音。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_010","year":2020,"roc_year":109,"session":"","examNo":10,"q":"下列何種病原菌最常造成乾乳牛或分娩前女牛的乳房感染，且其感染多為次臨床型乳房炎（subclinical\r mastitis）？","opts":["A. 金黃色葡萄球菌（Staphylococcus aureus）","B. 大腸桿菌（Escherichia coli）","C. 凝固酶陰性葡萄球菌（coagulase negative Staphylococci ）","D. 異乳鏈球菌（Streptococcus dysagalactiae）"],"ans":2,"exp":"凝固酶陰性葡萄球菌（CNS）是乾乳期及分娩前母牛最常見的乳房感染病原，多呈現次臨床型乳房炎（體細胞數升高但無臨床症狀），感染多在乾乳期侵入乳頭管。","we":["金黃色葡萄球菌會造成慢性深層腺體感染，但在乾乳牛次臨床感染中不是最常見者。","大腸桿菌（E. coli）造成分娩後急性臨床型乳房炎，不是次臨床型的主要病原。","凝固酶陰性葡萄球菌是乾乳牛及分娩前母牛次臨床型乳房炎最常見病原，此為正確答案。","異乳鏈球菌多造成臨床型乳房炎，不是次臨床型的主要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_011","year":2020,"roc_year":109,"session":"","examNo":11,"q":"一頭分娩約1週的母牛罹患急性乳房炎，症狀包括發燒、食慾廢絕、心跳及呼吸速率增加，感染乳房明顯紅\r 腫，乳汁水樣化甚至無乳等現象，其最有可能感染什麼病菌？","opts":["A. 無乳鏈球菌（Streptococcus agalactiae）","B. 凝固酶陰性葡萄球菌（coagulase negative Staphylococci）","C. 牛黴漿菌（Mycoplasma bovis）","D. 大腸桿菌（Escherichia coli）"],"ans":3,"exp":"分娩後1週急性乳房炎、全身症狀嚴重（發燒、食廢、心跳呼吸加速）、乳房明顯紅腫、乳汁水樣化，此為大腸桿菌（E. coli）引起的急性毒血症型乳房炎的典型表現，常見於新鮮乳牛（分娩後1-2週）。","we":["無乳鏈球菌造成慢性次臨床型乳房炎，不會引起如此嚴重的急性全身症狀。","凝固酶陰性葡萄球菌多為次臨床型感染，不引起急性全身性症狀。","牛黴漿菌引起多乳區同時感染，分泌物黃色膿樣，不是這種急性毒血症表現。","大腸桿菌在分娩後新鮮乳牛中引起急性毒血症型乳房炎，系統性症狀嚴重，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_012","year":2020,"roc_year":109,"session":"","examNo":12,"q":"乳牛之加州乳房炎試驗（California mastitis test）是用來檢測生乳的何種指標？","opts":["A. 生菌數","B. 固形物","C. 體細胞數","D. 導電度"],"ans":2,"exp":"加州乳房炎試驗（CMT）是利用清潔劑裂解細胞釋放DNA，與試劑中的溴甲酚紫反應形成凝膠，凝膠的黏稠程度反映體細胞數（SCC）的高低，是間接評估乳房炎的快速篩檢工具。","we":["生菌數（bacterial count）需要細菌培養計數，CMT無法檢測生菌數。","固形物含量需要用乳汁成分分析儀測定，CMT不測固形物。","CMT透過DNA凝膠反應間接反映體細胞數，此為正確答案。","導電度用來偵測乳汁離子濃度變化，是電子乳房炎偵測儀的原理，非CMT。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_013","year":2020,"roc_year":109,"session":"","examNo":13,"q":"牛嚴重喉頭炎時，最易呈現下列那一症狀？","opts":["A. 吸氣性呼吸困難","B. 呼氣性呼吸困難","C. 呼吸數減少","D. 鼻塞"],"ans":0,"exp":"牛嚴重喉頭炎時，喉腔腫脹造成氣道狹窄，氣流在吸氣時受到阻礙（阻力增加），產生吸氣性呼吸困難（inspiratory dyspnea），並伴有喘鳴聲（stridor）。","we":["吸氣性呼吸困難是喉頭或上呼吸道阻塞的特徵，此為正確答案。","呼氣性呼吸困難見於肺氣腫或細支氣管痙攣等下呼吸道疾病，不是喉頭炎的主要症狀。","喉頭炎引起氣道阻塞，呼吸數通常增加而非減少。","鼻塞見於鼻炎，不是喉頭炎的主要症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_014","year":2020,"roc_year":109,"session":"","examNo":14,"q":"牛隻在維生素D過多時，最不可能出現下列何項症狀？","opts":["A. 高血鈣症","B. 血液凝固不全","C. 轉移性鈣化","D. 尿毒症"],"ans":1,"exp":"維生素D過多（中毒）的主要病理為高血鈣症（促進腸道吸收及骨骼鈣釋放）→轉移性鈣化（軟組織鈣沉積）→腎臟鈣化→腎衰竭→尿毒症。血液凝固不全並非維生素D中毒的典型症狀（鈣是凝血因子所需，高血鈣不致凝血障礙）。","we":["高血鈣症（hypercalcemia）是維生素D中毒最直接的代謝異常，必然出現。","血液凝固不全不是維生素D中毒的典型表現，為最不可能出現的症狀，此為正確答案。","轉移性鈣化（心臟、腎臟、血管壁鈣沉積）是維生素D中毒的病理特徵。","尿毒症由腎臟礦物質化（鈣磷沉積）造成腎衰竭繼發，可出現於嚴重病例。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_015","year":2020,"roc_year":109,"session":"","examNo":15,"q":"牛隻若吞食了尖銳的金屬異物，常造成創傷性蜂巢胃腹膜炎，但也可能引起其他併發症或後遺症，下列那一\r 種是最不常見的併發症？","opts":["A. 創傷性脾膿腫","B. 創傷性心包炎","C. 迷走神經性消化不良","D. 重瓣胃膿腫"],"ans":3,"exp":"創傷性蜂巢胃腹膜炎中，金屬異物穿刺方向多為腹側及顱側，最常造成心包炎（perforating toward heart）、脾膿腫及迷走神經性消化不良。重瓣胃（omasum）位置較後，且較少受直接穿刺，重瓣胃膿腫是最不常見的併發症。","we":["創傷性脾膿腫：金屬異物可穿入脾臟，脾膿腫是已知的併發症。","創傷性心包炎：金屬向顱側穿透膈肌達心包是最著名的致命併發症。","迷走神經性消化不良：因發炎影響迷走神經功能，是常見功能性後遺症。","重瓣胃膿腫：重瓣胃距離穿刺點較遠，是這幾種併發症中最不常見的，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_016","year":2020,"roc_year":109,"session":"","examNo":16,"q":"下列造成乳牛乳房炎的微生物中，何者最易造成慢性、深層腺體組織病變，並且不容易治癒？","opts":["A. 無乳鏈球菌（Streptococcus agalactiae）","B. 異乳鏈球菌（Streptococcus dysgalactiae）","C. 腸道菌群（coliforms）","D. 金黃色葡萄球菌（Staphylococcus aureus）"],"ans":3,"exp":"金黃色葡萄球菌（S. aureus）能形成生物膜（biofilm）侵入深層腺體組織，造成慢性感染，治癒率極低（抗生素治療成功率僅20-30%）。這是因為其能在腺泡上皮細胞內存活並逃避抗生素及免疫反應。","we":["無乳鏈球菌對青黴素敏感，適當治療下治癒率高，不屬於難治療的病原。","異乳鏈球菌多為環境性病原，對抗生素治療有良好反應。","腸道菌群（大腸桿菌等）引起急性乳房炎，多可靠支持療法緩解，不是慢性深層感染。","金黃色葡萄球菌因生物膜形成及細胞內存活機制，是最難治療的乳房炎病原，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_017","year":2020,"roc_year":109,"session":"","examNo":17,"q":"下列健康成年牛隻每分鐘的心跳數及呼吸數，各為多少次最為正確？","opts":["A. 心跳數40，呼吸數36","B. 心跳數40，呼吸數18","C. 心跳數50，呼吸數40","D. 心跳數70，呼吸數24"],"ans":1,"exp":"健康成年牛的正常生理數值：心跳數（HR）40-80次/分鐘（平均約60次），呼吸數（RR）10-30次/分鐘（平均約18-20次）。選項B（心跳40，呼吸18）最符合正常範圍。","we":["心跳40正常，但呼吸36次/分鐘明顯高於正常範圍（10-30次/分鐘）。","心跳40、呼吸18均在正常範圍內，此為正確答案。","心跳50在正常範圍，但呼吸40次/分鐘超出正常範圍，屬呼吸急促。","心跳70雖在正常上限，但呼吸24次/分鐘仍屬正常範圍的偏高端，綜合比較B較為典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_018","year":2020,"roc_year":109,"session":"","examNo":18,"q":"健康牛在右側胸部肺區之何部位最易聽診到肺泡呼吸音？","opts":["A. 腹側後方三分之一","B. 背側後方三分之一","C. 背側前方三分之一","D. 腹側前方三分之一"],"ans":1,"exp":"牛肺泡呼吸音（vesicular breath sounds）在右側胸部最容易於背側後方三分之一的肺區聽到，這個位置肺組織較多且靠近主要支氣管分叉，氣流較強，呼吸音最清晰。","we":["腹側後方：此處為肺臟腹緣，受橫膈影響，呼吸音較不明顯。","背側後方三分之一是肺泡呼吸音最強的位置，此為正確答案。","背側前方：靠近心臟及前葉，受心音干擾，不是最佳聽診位置。","腹側前方：靠近心臟，受心音遮蓋，呼吸音不清晰。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_019","year":2020,"roc_year":109,"session":"","examNo":19,"q":"下列何種治療方式對牛腐蹄病效果不好？","opts":["A. 70,000 IU/kg之penicillin 及 70mg/kg之streptomycin 肌肉注射","B. 5%之硫酸銅溶液足浴","C. 5%之硫酸鋅溶液足浴","D. 5%之福馬林液足浴"],"ans":3,"exp":"牛腐蹄病（foot rot）由Fusobacterium necrophorum等厭氧菌引起，5%福馬林液主要是角質硬化劑，抗菌效果有限，對活動性感染療效不佳；相比之下，系統性抗生素及硫酸銅/硫酸鋅足浴均有明確療效。","we":["Penicillin+streptomycin IM對腐蹄病致病菌有效，是合理的治療方式。","5%硫酸銅溶液足浴具抗菌及收斂效果，可輔助治療腐蹄病。","5%硫酸鋅溶液足浴也有抗菌效果，可用於治療與預防。","5%福馬林液主要作為角質硬化劑用於預防，對活動性感染的治療效果不佳，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_020","year":2020,"roc_year":109,"session":"","examNo":20,"q":"下列何者不是牛嚴重呼吸困難（respiratory distress）之症狀？","opts":["A. 呼吸速度變快","B. 不願運動或進食","C. 發紺（cyanosis）","D. 頻繁走動"],"ans":3,"exp":"牛嚴重呼吸困難時，動物通常靜止不動（頸部伸長、肘部外展）以減少氧氣消耗。頻繁走動（D）反而消耗更多氧氣，在嚴重呼吸困難時不會發生，是最不可能的症狀。","we":["呼吸加快（tachypnea）是呼吸困難代償反應，必然出現。","不願運動或進食：因任何運動加重缺氧，呼吸困難的動物多靜臥或站立不動。","發紺（cyanosis）是嚴重缺氧導致血紅素氧飽和度下降的表現，可見於嚴重呼吸困難。","頻繁走動會增加氧耗，嚴重呼吸困難時動物不會這樣做，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_021","year":2020,"roc_year":109,"session":"","examNo":21,"q":"迷走神經性消化不良為乳牛常見疾病之一，瘤胃的功能主要受迷走神經那一條分支所調控支配？","opts":["A. 尾支","B. 腹支","C. 前支","D. 背支"],"ans":3,"exp":"迷走神經背支（dorsal vagal branch）支配瘤胃（rumen）的主要蠕動功能，包括瘤胃背囊與腹囊的節律性收縮。迷走神經腹支主要支配蜂巢胃（reticulum）。","we":["尾支：迷走神經無明確「尾支」分支支配前胃。","腹支：主要支配蜂巢胃（reticulum），非瘤胃的主要調控分支。","前支：支配食道及前段瘤胃，非主要調控瘤胃整體蠕動。","背支支配瘤胃主體（背囊及腹囊）的蠕動節律，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_022","year":2020,"roc_year":109,"session":"","examNo":22,"q":"有關牛乳頭撕裂傷縫合的縫線粗細，下列何項規格最適合？","opts":["A. No.2","B. No.1","C. No.2-0","D. No.4-0"],"ans":2,"exp":"牛乳頭撕裂傷縫合需要細小的縫線以減少組織損傷並允許精細的黏膜縫合。No. 2-0（2/0）是最適合的縫線規格，提供足夠的強度同時較細，適合乳頭組織的縫合。","we":["No. 2 太粗，縫合乳頭精細組織會造成更大組織創傷及縫線壓迫壞死。","No. 1 仍太粗，不適合乳頭等精細組織縫合。","No. 2-0 粗細適中，是牛乳頭撕裂傷縫合的最佳選擇，此為正確答案。","No. 4-0 太細，提供的張力強度不足以支撐乳頭組織的癒合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_023","year":2020,"roc_year":109,"session":"","examNo":23,"q":"有關使用ventral midline approach進行帝王切開術之敘述，下列何者錯誤？","opts":["A. 對心血管與呼吸系統負擔，比flank approach小","B. 牛隻需仰臥","C. 比起乳牛，較適合使用在肉牛","D. 比起flank approach，可較容易將子宮與胎牛拉出腹腔外"],"ans":0,"exp":"Ventral midline approach（腹中線切口）需要讓牛仰臥（dorsal recumbency），此姿勢對心血管與呼吸系統的負擔比站立的脇腹切口（flank approach）更大，因為仰臥時橫膈受壓且大靜脈受壓迫，心輸出量降低。","we":["腹中線切口需仰臥姿，對心血管與呼吸負擔更大（非更小），此為錯誤敘述，是正確答案。","Ventral midline approach確實需要牛仰臥，此敘述正確。","肉牛體型強健，對仰臥姿勢耐受性較乳牛好，較適合此術式，此敘述正確。","腹中線切口可提供更寬廣的視野，較容易將子宮拉出腹腔，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_024","year":2020,"roc_year":109,"session":"","examNo":24,"q":"下列那一項是以右脇腹大網膜固定術（right-flank omentopexy）治療牛第四胃左側異位的主要缺點？","opts":["A. 第四胃有局部沾粘時，不易進行該手術","B. 手術者的手臂常常因為過短而無法施行","C. 此法無法施行於懷孕初期母牛","D. 乳牛必須保定並維持站立姿勢"],"ans":0,"exp":"Right-flank omentopexy（右脇腹大網膜固定術）治療左側皺胃異位時，若皺胃有局部沾粘（adhesions），則手術者需先徒手整復再進行固定，沾粘使整復困難，是此術式最主要的缺點。","we":["局部沾粘時需手動分離並整復，增加手術難度，是最主要缺點，此為正確答案。","手術者手臂過短並非常見限制，一般術者均可完成。","懷孕初期母牛仍可施行此術式，並非禁忌症。","乳牛站立施術是優點而非缺點，站立手術減少麻醉風險及體力消耗。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_025","year":2020,"roc_year":109,"session":"","examNo":25,"q":"下圖的縫合法為下列那一項？","opts":["A. cruciate（cross mattress）suture","B. Ford interlocking suture","C. vertical mattress suture","D. subcuticular suture"],"ans":1,"exp":"Ford interlocking（鎖扣式連續縫合）是大型動物外科常用的皮膚縫合法，能快速關閉長切口，具良好的張力分散，廣泛用於牛的脇腹手術切口。","we":["Cruciate（cross mattress）縫合是X形間斷縫合，提供張力但速度較慢。","Ford interlocking是鎖扣式連續縫合，適合大型動物長切口快速關閉，此為最可能答案。","Vertical mattress縫合是垂直褥式間斷縫合，用於張力部位。","Subcuticular縫合是皮下縫合，用於美觀性皮膚閉合，不適合大型動物厚皮膚。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_026","year":2020,"roc_year":109,"session":"","examNo":26,"q":"有關以omentopexy外科方法治療皺胃異位之敘述，下列何者錯誤？","opts":["A. 固定大網膜的位置離幽門、十二指腸連合處越遠越好","B. 大網膜固定部位越寬越好","C. 必須將腹膜與大網膜固定在一起","D. 可使用不可吸收線固定，以延長其固定時間"],"ans":0,"exp":"Omentopexy固定大網膜治療皺胃異位時，固定點應盡量靠近幽門及十二指腸連合處，而非越遠越好。距幽門越近，固定效果越穩定；越遠則固定牽拉力不足，復位後容易再異位。","we":["應越靠近幽門越好，越遠越容易固定失敗，此敘述錯誤，為正確答案。","固定部位面積越寬廣，接觸面積越大，固定越穩固，此敘述正確。","大網膜固定需同時縫合腹膜，確保牢固，此敘述正確。","使用不可吸收縫線可延長固定效果，有其臨床依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_027","year":2020,"roc_year":109,"session":"","examNo":27,"q":"小牛臍疝的疝囊是由皮膚與下列何者所構成？","opts":["A. 腹橫肌","B. 腹直肌","C. 腹斜肌","D. 腹膜"],"ans":3,"exp":"小牛臍疝的疝囊由外層皮膚及內層腹膜共同構成，腹壁肌層（腹橫肌、腹直肌、腹斜肌）並不構成疝囊本身，而是疝囊缺損環（hernia ring）周圍的結構。","we":["腹橫肌是腹壁深層肌肉，構成疝囊缺損環，不是疝囊壁組成。","腹直肌同樣構成腹壁，屬疝囊缺損環周圍組織，不是疝囊壁。","腹斜肌（內外）構成腹壁的中間層，不是疝囊壁組成。","腹膜是疝囊內層，與皮膚共同構成疝囊壁，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_028","year":2020,"roc_year":109,"session":"","examNo":28,"q":"使用穿刺法採集羊隻胸水時，穿刺部位在何處較為合適？","opts":["A. 第4~5肋間液面下穿刺","B. 第6~7肋間液面下穿刺","C. 第7~8肋間液面下穿刺","D. 第3~5肋間液面上穿刺"],"ans":1,"exp":"羊胸水穿刺（胸腔穿刺術）的適當部位是第6-7肋間，於液面下方穿刺，以避開肺臟並確保能有效引流積液。過於靠前（第3-5肋）心臟受傷風險高，過於靠後（第7-8肋）橫膈風險增加。","we":["第4-5肋間靠近心臟，穿刺風險較高，不是最佳位置。","第6-7肋間液面下穿刺是羊胸腔穿刺的標準位置，此為正確答案。","第7-8肋間接近橫膈，穿刺時損傷橫膈的風險增加。","液面上穿刺只能引流氣體，無法有效引流積液；且第3-5肋間靠近心臟，有危險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_029","year":2020,"roc_year":109,"session":"","examNo":29,"q":"綿羊在植物性慢性銅中毒時，不會出現下列何種症狀？","opts":["A. 貧血","B. 黃疸","C. 血紅素尿","D. 心囊積水"],"ans":3,"exp":"綿羊慢性銅中毒（植物性，來自攝入過多含銅飼料）的典型症狀包括：溶血危象（hemolytic crisis）→貧血、黃疸、血紅素尿（hemoglobinuria）。心囊積水（pericardial effusion）並非銅中毒的典型症狀。","we":["貧血：溶血性危象時大量紅血球破壞，必然引起貧血。","黃疸：大量溶血時血紅素分解為膽紅素，出現黃疸。","血紅素尿：血管內溶血時游離血紅素通過腎臟排出，尿液呈紅棕色。","心囊積水不是銅中毒的已知症狀，此為最不可能出現的症狀，正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_030","year":2020,"roc_year":109,"session":"","examNo":30,"q":"下列何種消毒劑對牛場隱孢子蟲（Cryptosporidia）有殺滅效果？","opts":["A. 甲酚（cresol）","B. 甲醛（formaldehyde）","C. 優碘（povidone-iodine）","D. 氯化苯二甲烴銨（benzalkonium chloride）"],"ans":1,"exp":"隱孢子蟲（Cryptosporidium）卵囊對大多數消毒劑（包括氯劑、碘劑、苯紮氯銨等）具極高抵抗性，但5-10%甲醛（formaldehyde）能有效殺滅卵囊，是已知少數有效消毒劑之一。","we":["甲酚（cresol）對隱孢子蟲無效，不能殺滅其卵囊。","甲醛（formaldehyde）在適當濃度下可殺滅隱孢子蟲卵囊，此為正確答案。","優碘（povidone-iodine）對隱孢子蟲卵囊無明確殺滅效果。","氯化苯二甲烴銨（benzalkonium chloride）是一般消毒劑，對隱孢子蟲卵囊無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_031","year":2020,"roc_year":109,"session":"","examNo":31,"q":"豬去勢手術若以2% lidocaine進行精索內注入式麻醉，其最佳劑量為多少mg/kg？","opts":["A. 1","B. 4","C. 10","D. 15"],"ans":1,"exp":"豬去勢進行精索內麻醉時，2% lidocaine的最佳劑量為約4 mg/kg。過低劑量麻醉效果不足；過高劑量（10-15 mg/kg）則可能引起lidocaine全身毒性（心律不整、抽搐）。","we":["1 mg/kg 劑量太低，麻醉效果不足以緩解去勢疼痛。","4 mg/kg 是精索內注射麻醉的建議劑量，提供有效麻醉又不超過安全劑量，此為正確答案。","10 mg/kg 超過安全劑量（lidocaine最高建議劑量約6-8 mg/kg），有全身毒性風險。","15 mg/kg 遠超安全劑量，可能引起嚴重中毒反應（心律不整、抽搐）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_032","year":2020,"roc_year":109,"session":"","examNo":32,"q":"有關公豬副性腺，下列何者最為發達？","opts":["A. 尿道球腺（bulbourethral gland）","B. 儲精囊腺（vesicular gland）","C. 前列腺（prostate）","D. 輸精管壺腹（ampulla）"],"ans":0,"exp":"公豬的尿道球腺（bulbourethral glands, Cowper's glands）極度發達，體積龐大，提供大量射精前液（pre-ejaculatory fluid），在豬的精液中貢獻顯著。這是豬獨特的生殖解剖特徵。","we":["尿道球腺（bulbourethral gland）在公豬中極度發達，是最明顯的副性腺，此為正確答案。","儲精囊腺（vesicular gland）在公豬中雖存在但發達程度不如尿道球腺顯著。","前列腺（prostate）在豬中較小且分散，不是最發達的副性腺。","輸精管壺腹（ampulla）是輸精管末端膨大，並非副性腺，且不是最發達的結構。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_033","year":2020,"roc_year":109,"session":"","examNo":33,"q":"下列何者不是犬貓難產的指標？","opts":["A. 生殖道開口有淡黃色物質排出","B. 母畜腹部有明顯之收縮，已超過 1 小時而胎兒未產出","C. 前後胎兒娩出間隔 15 分鐘","D. 懷孕足月母畜有明顯抑鬱或敗血症等不適徵狀"],"ans":2,"exp":"犬貓正常分娩中，前後胎兒娩出間隔通常為15-30分鐘，最長可達2-3小時仍屬正常（取決於母畜是否有正常宮縮）。15分鐘間隔屬正常範圍，不是難產指標。","we":["生殖道開口有淡黃色分泌物：應為綠色（uteroverdin）才正常；淡黃色可能提示異常，是值得關注的難產指標。","腹部收縮超過1小時胎兒未產出是難產的明確指標。","前後胎兒娩出間隔15分鐘屬正常範圍，不是難產指標，此為正確答案。","懷孕足月有明顯抑鬱或敗血症：代表母體可能有嚴重病況，是難產或病態分娩的指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_034","year":2020,"roc_year":109,"session":"","examNo":34,"q":"母豬的動情週期平均為幾天？","opts":["A. 14","B. 21","C. 28","D. 35"],"ans":1,"exp":"母豬的動情週期（estrous cycle）平均為21天（18-24天），與牛、羊相近。豬的動情期（estrus）持續約24-72小時，是人工授精的重要時機。","we":["14天：貓的動情週期（若未發情刺激後退化）接近14天，不是母豬。","21天是母豬動情週期的平均長度，此為正確答案。","28天：人類月經週期接近28天，非母豬。","35天：未交配母馬的動情週期週期約21天，35天不符合任何常見家畜。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_035","year":2020,"roc_year":109,"session":"","examNo":35,"q":"下列何種內泌素具有促使黃體退化的作用，可用於調控母畜發情或排卵的時間？","opts":["A. 濾泡刺激素（FSH）","B. 催產素（Oxytocin）","C. 前列腺素F 2α （PGF 2α ）","D. 黃體生成素（LH）"],"ans":2,"exp":"前列腺素F2α（PGF2α）是最重要的黃體溶解素（luteolytic agent），由子宮內膜分泌，作用於黃體細胞使其退化，進而終止黃體期，可用於調控母畜的發情與排卵時間。","we":["FSH（濾泡刺激素）刺激濾泡發育，不引起黃體退化。","Oxytocin（催產素）促進子宮收縮及分娩，不直接引起黃體溶解。","PGF2α是黃體溶解的關鍵因子，廣泛用於同期發情處理，此為正確答案。","LH（黃體生成素）促進排卵及黃體形成，不引起黃體退化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_036","year":2020,"roc_year":109,"session":"","examNo":36,"q":"牛隻分娩前採用下列何種管理方式，無法改善因母體與胎兒體型比例失衡（fetomaternal disproportion）所產\r 生之難產？","opts":["A. 調整日糧避免過胖體型分娩","B. 避免選用過大品種的公牛精液","C. 於懷孕最後三週給予高能量的日糧補充營養","D. 確保有充足的運動空間"],"ans":2,"exp":"懷孕最後三週給予高能量日糧補充會導致胎兒過大（macrosomia），加重母體-胎兒體型比例失衡，反而增加難產風險，而非改善。應在懷孕期間維持均衡飲食，避免過胖。","we":["控制日糧避免過胖可減少胎兒過大及難產，此為有效的預防措施。","避免使用過大品種公牛精液，選擇胎兒較小的品種，可降低難產率。","懷孕末期高能量飼料會增加胎兒體型，加重難產風險，此措施無法改善反而惡化問題，正確答案。","充足運動可維持母體肌肉張力，改善分娩力，有助預防難產。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_037","year":2020,"roc_year":109,"session":"","examNo":37,"q":"有關牛隻胎衣滯留之敘述，下列何者錯誤？","opts":["A. 須治療後續發生之子宮炎","B. 會降低產後初次配種之受胎率","C. 分娩後立即強制剝離滯留的胎衣，可減少後續之感染","D. 使用PGF 2α 治療，無法明顯減少胎衣滯留的發生率"],"ans":2,"exp":"牛胎衣滯留不建議強制手動剝離（manual removal），因為這樣會造成子宮黏膜撕裂、出血，並增加感染及後續子宮炎的風險，反而使預後更差。現代建議是讓胎衣自然脫落，並輔以抗生素治療防感染。","we":["胎衣滯留後容易繼發子宮炎，需要後續治療，此敘述正確。","胎衣滯留確實會降低產後受胎率，影響繁殖性能，此敘述正確。","強制剝離胎衣會增加子宮損傷和感染風險，不建議操作，此敘述錯誤，為正確答案。","PGF2α對胎衣滯留的治療效果有限，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_038","year":2020,"roc_year":109,"session":"","examNo":38,"q":"牛隻進行超音波妊娠診斷，發現該牛隻懷孕單一胎兒且胎兒正常（如附圖），其懷孕天數最有可能為幾天？","opts":["A. 20","B. 30","C. 40","D. 50"],"ans":2,"exp":"牛懷孕約40天時，胎兒已有清晰的體型輪廓，四肢可見，且胎盤葉（placentome）開始可在超音波下識別。30天時可見心跳但胎兒輪廓不明顯；20天時僅見胚胎囊；50天時胎兒更大且解剖結構更清晰。","we":["20天：可見到早期胚胎囊，但胎兒形態不清楚，通常不稱為「胎兒正常」。","30天：胚胎可見心跳，輪廓仍不清晰，難以清楚辨識正常胎兒形態。","40天：胎兒輪廓清晰，四肢可見，胎盤葉開始形成，是「正常胎兒」的典型影像，此為最可能答案。","50天：胎兒更大，解剖結構清晰，但40天的影像更符合題目中「正常胎兒」的標準描述。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_039","year":2020,"roc_year":109,"session":"","examNo":39,"q":"牛隻進行超音波掃描檢查，其卵巢影像如下圖，囊樣物之壁厚度標示於影像上，其最不可能的診斷為何？","opts":["A. 濾泡囊腫","B. 黃體囊腫","C. 囊腫樣黃體","D. 初期之懷孕黃體"],"ans":3,"exp":"初期之懷孕黃體（CL of early pregnancy）是實心或僅有非常小的腔隙，通常不具有可測量厚度的囊壁；而濾泡囊腫（薄壁）、黃體囊腫（厚壁>3mm）及囊腫樣黃體（有腔隙但仍有明顯黃體組織）均為囊腫樣結構，可見到囊壁。","we":["濾泡囊腫：壁薄（<3mm），是薄壁囊腫，有可辨識的囊壁。","黃體囊腫：壁厚（>3mm），囊腔被黃體化組織包圍，具明顯囊壁。","囊腫樣黃體（cystic CL）：有腔隙及黃體組織囊壁，可見壁厚。","初期懷孕黃體是實心結構，不具中央空腔及可測量的囊壁，是最不可能的囊腫樣診斷，此為正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_040","year":2020,"roc_year":109,"session":"","examNo":40,"q":"維持公畜副性腺功能的雄性素，是由下列何種細胞所分泌？","opts":["A. 萊狄吉細胞（Leydig cell）","B. 賽托利細胞（Sertoli cell）","C. 亞孝夫細胞（Aschoff cell）","D. 亞契柯細胞（Anitschkow cell）"],"ans":0,"exp":"睪丸間質細胞（Leydig cells）位於曲精小管間的間質中，負責分泌睪固酮（testosterone）及其他雄性素，是維持公畜副性腺功能（精囊腺、前列腺、尿道球腺）最重要的內泌素來源。","we":["萊狄吉細胞（Leydig cells）分泌睪固酮，維持副性腺功能，此為正確答案。","賽托利細胞（Sertoli cells）支持精子發生，分泌抑制素（inhibin）和ABP，但不分泌睪固酮。","亞孝夫細胞（Aschoff cells）是心臟組織中的特殊細胞（見於風濕性心肌炎），與生殖無關。","亞契柯細胞（Anitschkow cells）是心臟Aschoff小體中的組織細胞，與睪丸無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_041","year":2020,"roc_year":109,"session":"","examNo":41,"q":"牛膣脫最常發生於","opts":["A. 妊娠早期","B. 妊娠中期","C. 妊娠末期","D. 分娩後"],"ans":2,"exp":"牛膣脫（vaginal prolapse）最常發生於妊娠末期（分娩前1-4週），此時骨盆韌帶因雌激素影響而鬆弛，骨盆底肌群張力下降，加上妊娠末期腹壓增大，導致陰道向外脫出。","we":["妊娠早期：骨盆韌帶尚未鬆弛，腹壓增幅不大，較少發生膣脫。","妊娠中期：類似早期，骨盆鬆弛程度不如末期明顯。","妊娠末期：骨盆韌帶高度鬆弛＋最大腹壓，是膣脫發生的高峰期，此為正確答案。","分娩後：骨盆已張開，此時更容易出現子宮脫（uterine prolapse），而非膣脫。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_042","year":2020,"roc_year":109,"session":"","examNo":42,"q":"依據Frank-Starling Mechanism，正常心臟運動下，增加心室前負荷（preload）會造成什麼影響？","opts":["A. 心跳變快","B. 心輸出量增加","C. 心輸出量減少","D. 呼吸增加"],"ans":1,"exp":"依照Frank-Starling機制，心室前負荷（preload）增加→心室充填血量增加→心肌纖維伸展增加→心肌收縮力增強→每搏輸出量（stroke volume）增加→心輸出量（cardiac output）增加。","we":["增加前負荷主要改變的是心肌收縮力及心輸出量，不直接造成心跳加快（那是後負荷或交感神經的效果）。","增加前負荷 → 增加心輸出量，這是Frank-Starling定律的核心，此為正確答案。","正常心臟中，增加前負荷應增加而非減少心輸出量；超出生理範圍才會因過度伸展而下降。","前負荷增加對呼吸沒有直接影響，呼吸增加是心衰竭的繼發表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_043","year":2020,"roc_year":109,"session":"","examNo":43,"q":"犬貓腦神經檢查中，以物體快速接近受檢者眼睛，造成眼瞼閉合的威脅反應試驗（menace response），其中\r 反應的感覺與運動神經分別為何？","opts":["A. 第2對與第5對腦神經","B. 第2對與第7對腦神經","C. 第3對與第5對腦神經","D. 第5對與第7對腦神經"],"ans":1,"exp":"威脅反應（menace response）的神經弧：感覺（視覺輸入）→第2對腦神經（視神經，optic nerve, CN II）→視覺皮質→小腦→第7對腦神經（顏面神經，facial nerve, CN VII）→眼輪匝肌收縮→眼瞼閉合。","we":["CN II + CN V：CN V是三叉神經，負責角膜反射的傳入，不是威脅反應的傳出。","CN II（感覺）+ CN VII（運動）：視神經傳入視覺刺激，顏面神經控制眼瞼閉合，此為正確答案。","CN III + CN V：CN III為動眼神經（眼球運動），非威脅反應的傳入感覺。","CN V + CN VII：CN V是角膜反射的傳入神經，威脅反應的傳入是CN II（視覺），非觸覺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_044","year":2020,"roc_year":109,"session":"","examNo":44,"q":"犬隻急性白血病與慢性白血病最大的差別在於下列何者？","opts":["A. 罹病動物的年紀","B. 淋巴結與侵犯的器官多寡","C. 臨床症狀嚴重程度","D. 細胞分化程度"],"ans":3,"exp":"急性白血病（acute leukemia）的細胞分化程度低（幼稚/blast細胞），臨床進程快速且預後差；慢性白血病（chronic leukemia）的腫瘤細胞分化程度高（接近成熟細胞），臨床進程較緩慢。細胞分化程度是最根本的區別。","we":["罹病年紀：急性與慢性白血病均可發生於各年齡，年紀並非最大差別。","淋巴結及器官侵犯：兩者均可有淋巴結腫大及器官侵犯，不是最大差別。","臨床症狀嚴重程度：雖急性通常更嚴重，但症狀嚴重度是細胞分化程度的結果，非本質差別。","細胞分化程度（blast vs. mature cells）是急性與慢性白血病分類的根本依據，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_045","year":2020,"roc_year":109,"session":"","examNo":45,"q":"犬隻慢性小腸性下痢與下列何症狀相關？","opts":["A. 黏液便與帶血便","B. 裡急後重","C. 體重下降及脹氣","D. 體重增加"],"ans":2,"exp":"犬慢性小腸性下痢的特點是吸收不良（malabsorption）→體重下降、脂肪痢（steatorrhea）、脹氣（flatulence，因腸道細菌過度發酵）。黏液便、帶血便、裡急後重是大腸性下痢的特徵。","we":["黏液便與帶血便：這是大腸（結腸）性下痢的特徵，小腸性下痢較少見血便。","裡急後重（tenesmus）：大腸直腸刺激的症狀，不見於小腸性下痢。","體重下降及脹氣：小腸吸收不良導致體重下降，腸道發酵產氣引起脹氣，是小腸性下痢特徵，此為正確答案。","體重增加不可能出現在慢性下痢病例中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_046","year":2020,"roc_year":109,"session":"","examNo":46,"q":"下列何者不是犬隻胃潰瘍的致病因子？","opts":["A. 肥大細胞瘤","B. 類固醇或非類固醇類消炎止痛藥物使用","C. 緊迫","D. 食鹽中毒"],"ans":3,"exp":"食鹽中毒（NaCl中毒）主要造成腦水腫及神經症狀（抽搐、失明、嗜睡），不是胃潰瘍的致病因子。肥大細胞瘤（組織胺→胃酸分泌增加）、NSAIDs/類固醇（前列腺素合成抑制）及緊迫（腎上腺皮質素增加）均會引起胃潰瘍。","we":["肥大細胞瘤：釋放組織胺刺激胃壁細胞分泌過多胃酸，引起胃潰瘍，是已知致病因子。","NSAIDs/類固醇：抑制保護性前列腺素合成及直接損傷胃黏膜，是最常見的藥物性胃潰瘍原因。","緊迫（stress）：刺激腎上腺皮質素分泌，抑制黏膜保護，引起應激性胃潰瘍。","食鹽中毒主要引起腦水腫及神經症狀，不引起胃潰瘍，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_047","year":2020,"roc_year":109,"session":"","examNo":47,"q":"下列何種犬隻口腔腫瘤，常在疾病病程早期轉移至肺臟？","opts":["A. 非扁桃腺鱗狀細胞瘤","B. 惡性黑色素瘤","C. 纖維肉瘤","D. 軟骨肉瘤"],"ans":1,"exp":"犬口腔惡性黑色素瘤（malignant melanoma）是高度惡性的腫瘤，以早期轉移至局部淋巴結及肺臟為特徵，診斷時轉移率極高（約70%以上），預後最差。其他口腔腫瘤轉移時間較晚。","we":["非扁桃腺SCC：局部侵犯為主，遠端轉移率較低，預後相對較好。","惡性黑色素瘤：高度惡性，早期肺臟及淋巴結轉移，診斷時常已轉移，此為正確答案。","纖維肉瘤：主要局部侵犯骨骼，遠端轉移率低於黑色素瘤。","軟骨肉瘤：以局部侵犯為主，系統性轉移較少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_048","year":2020,"roc_year":109,"session":"","examNo":48,"q":"9 歲結紮公短毛家貓因有 3 個月跛行及遠端尺骨腫脹而就診。經放射線學檢查，尺骨有明顯的骨溶解及增生\r 現象，採樣後確診為惡性骨瘤，胸腔放射線學檢查並未發現轉移。此時對飼主的治療建議應為何？","opts":["A. 如果進行截肢，有非常大的機會可治癒","B. 如果截肢後同時進行順鉑（cisplatin）化療，則有機會治癒","C. 截肢後也無法治癒，可單用雙磷酸鹽進行止痛","D. 雖影像學檢查並未出現轉移病灶，但骨瘤轉移發生非常的早，故此病畜已無法治癒，不建議任何治療"],"ans":0,"exp":"貓附肢骨肉瘤（appendicular osteosarcoma）與犬相比，轉移率極低（<10%），截肢後長期存活率高，截肢本身即有極大的治癒機率。此外，cisplatin在貓禁忌（致命性肺毒性），不應使用於貓。","we":["貓截肢後有極大的治癒機會，因為轉移率遠低於犬，此為正確答案。","Cisplatin在貓是絕對禁忌症（可引起致命性肺水腫），不應在貓使用。","貓骨肉瘤截肢後預後遠優於犬，並非無法治癒。","貓骨肉瘤轉移率低，雖影像學無轉移仍建議積極手術，而非放棄治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_049","year":2020,"roc_year":109,"session":"","examNo":49,"q":"就下圖的皮膚病灶分布來說，此犬最有可能罹患何種疾病？","opts":["A. immune mediated dermatitis","B. hepatic cutaneous hepatitis","C. endocrine alopecia","D. atopic alopecia"],"ans":0,"exp":"皮膚病灶分布及型態需配合圖片判斷。endocrine alopecia（內分泌性禿毛）呈雙側對稱性禿毛，hepatic cutaneous hepatitis（肝皮膚症候群）主要影響臉部、末端肢體及腹部皮膚，atopic alopecia影響臉耳腋下，immune-mediated分布不一。","we":["Immune mediated dermatitis：分布多樣，需配合血清學或皮膚切片確認。","Hepatic cutaneous hepatitis（superficial necrolytic dermatitis）：特徵性分布於臉部、腳掌及外生殖器。","Endocrine alopecia：雙側對稱禿毛，不伴發紅或皮疹。","Atopic alopecia：影響臉、耳、腋下及腳趾間，伴發搔癢。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_050","year":2020,"roc_year":109,"session":"","examNo":50,"q":"一隻10公斤犬隻，每日所需的維持輸液量（maintenance requirements）為多少mL/day最合適？","opts":["A. 670","B. 770","C. 370","D. 870"],"ans":0,"exp":"犬維持輸液需求：常用公式為66-70 mL/kg/day，10公斤犬約需660-700 mL/day，最接近670 mL/day（選項A）。另亦可使用132×BW^0.75 ≈ 742 mL，但670更接近臨床常用的66 mL/kg/day計算。","we":["670 mL/day（67 mL/kg/day）符合犬維持輸液60-70 mL/kg/day的標準計算，此為正確答案。","770 mL/day（77 mL/kg/day）偏高，超過常規維持量範圍。","370 mL/day（37 mL/kg/day）是貓的維持輸液量公式（30×BW+70）結果，不適用於犬。","870 mL/day（87 mL/kg/day）遠超犬的維持輸液需求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_051","year":2020,"roc_year":109,"session":"","examNo":51,"q":"12歲黃金獵犬，患有乳腺腫瘤，術前評估胸腔X光如下圖，可見肺臟中有直徑約1~2mm之多發性結節影像， 這些結節為何？","opts":["A. 乳腺瘤轉移（metastases）","B. 肺臟骨化生（pulmonary osseous metaplasia）","C. 肺血管端面（end-on vessels）","D. 支氣管礦化（bronchial mineralization）"],"ans":1,"exp":"老齡大型犬胸腔X光出現多發性小鈣化結節（1-2mm），最常見的原因是肺骨化生（pulmonary osseous metaplasia / heterotopic ossification），這是老齡犬的良性偶發性鈣化，與腫瘤轉移無關，不影響預後。","we":["乳腺瘤轉移通常較大（>5mm），且邊緣較清楚，多個1-2mm的瀰漫性結節更符合骨化生。","肺骨化生是老齡犬（尤其大型犬）的常見偶發性發現，多發性1-2mm鈣化結節，此為正確答案。","肺血管端面（end-on vessels）在肺門附近呈圓形不透明影像，非瀰漫性分布。","支氣管礦化呈線狀/管狀，而非多發性圓形結節。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_052","year":2020,"roc_year":109,"session":"","examNo":52,"q":"下列何種犬貓疾病最易引起慢脈（slow pulse）？","opts":["A. 骨折","B. 貧血","C. 腦積水","D. 腸阻塞"],"ans":2,"exp":"腦積水（hydrocephalus）引起顱內壓升高→Cushing's reflex（庫欣反射）：高血壓+心搏徐緩（慢脈）+呼吸不規則（Cheyne-Stokes）。顱內壓升高刺激血壓代償性上升，再通過壓力感受器引發反射性心搏徐緩。","we":["骨折：引起疼痛及交感神經興奮，導致心跳加快（tachycardia），非慢脈。","貧血：組織缺氧刺激交感神經，代償性增加心跳，不引起慢脈。","腦積水：顱內壓升高觸發Cushing's reflex，其中包含心搏徐緩（慢脈），此為正確答案。","腸阻塞：多引起迷走神經亢進或交感神經反應，一般不是慢脈的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_053","year":2020,"roc_year":109,"session":"","examNo":53,"q":"下列何種犬隻疾病在無併發其他疾病時，其肺部放射線照影不會出現肺泡相（alveolar pattern）？","opts":["A. 肺水腫","B. 細菌性肺炎","C. 吸入性肺炎","D. 寄生蟲性肺炎"],"ans":3,"exp":"寄生蟲性肺炎（如蛔蟲幼蟲移行、肺蟲感染）主要引起間質相（interstitial pattern）或細小結節型影像，而非肺泡相（alveolar consolidation）。肺泡相代表肺泡腔填充（水腫液、炎性滲出物），見於細菌性肺炎、肺水腫、吸入性肺炎。","we":["肺水腫：大量液體填充肺泡腔，出現典型的肺泡相（放射線不透明）。","細菌性肺炎：炎性滲出物填充肺泡，形成肺泡相（肺葉固化）。","吸入性肺炎：吸入物及繼發炎症填充肺泡腔，出現肺泡相。","寄生蟲性肺炎主要呈間質相（miliary nodules、间质浸润），不呈肺泡相，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_054","year":2020,"roc_year":109,"session":"","examNo":54,"q":"慢性腎病所導致的鈣磷異常，會繼發下列何病症？","opts":["A. 高甲狀腺素血症","B. 高腎上腺素血症","C. 高副甲狀腺素血症","D. 低腎上腺素血症"],"ans":2,"exp":"慢性腎病（CKD）→磷蓄積（高血磷）→血清鈣降低→副甲狀腺受刺激→副甲狀腺素（PTH）持續分泌增加→繼發性副甲狀腺機能亢進（secondary hyperparathyroidism）。PTH升高又導致骨質脫鈣（腎性骨病）。","we":["高甲狀腺素血症：甲狀腺功能亢進是獨立疾病，不是CKD鈣磷異常的繼發症。","高腎上腺素血症：腎上腺功能亢進（Cushing's）與CKD鈣磷代謝無直接關係。","高副甲狀腺素血症（繼發性副甲狀腺機能亢進）：CKD鈣磷異常直接繼發的內分泌並發症，此為正確答案。","低腎上腺素血症（Addison's disease）是免疫媒介或其他原因，不是CKD的繼發症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_055","year":2020,"roc_year":109,"session":"","examNo":55,"q":"犬隻血中鈣磷濃度（單位為mg/dL）乘積大於下列何項（臨界值）時，易發生組織內鈣沉積？","opts":["A. 30","B. 60","C. 70","D. 90"],"ans":2,"exp":"犬血中鈣磷濃度乘積（Ca × P，單位mg/dL²）超過70 mg²/dL²時，組織內鈣沉積（metastatic calcification）的風險顯著增加。這是臨床監控CKD或其他鈣磷代謝異常時的重要閾值。","we":["乘積>30：此值過低，正常犬血鈣×血磷乘積已可能接近30，此閾值無臨床意義。","乘積>60：部分文獻採用此值，但台灣臨床教學多以70為標準閾值。","乘積>70：超過此值顯著增加軟組織鈣沉積風險，為標準教學閾值，此為正確答案。","乘積>90：此值過高，等到超過90時，組織鈣化可能已相當嚴重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_056","year":2020,"roc_year":109,"session":"","examNo":56,"q":"下圖為一隻 4 歲未絕育雄性拉布拉多犬鼻腔團塊採樣之細胞抹片，以Diff-Quik染色。其最可能是下列何種腫瘤細胞？","opts":["A. 組織細胞瘤（histiocytoma）","B. 淋巴瘤（lymphoma）","C. 漿細胞瘤（plasmacytoma）","D. 傳染性花柳性腫瘤（transmissible venereal tumor）"],"ans":1,"exp":"4歲未絕育雄性拉布拉多鼻腔團塊之細胞學：Diff-Quik染色下若見到大量均一的圓形細胞（圓細胞腫瘤），核仁明顯，細胞質少至中等，以淋巴瘤（lymphoma）最為常見。犬鼻腔腫瘤中淋巴瘤居多。","we":["組織細胞瘤（histiocytoma）：通常發生在年輕犬皮膚表面，鼻腔少見；細胞含腎形核。","淋巴瘤（lymphoma）：鼻腔最常見的圓細胞腫瘤，Diff-Quik下見均一圓形細胞，此為最可能答案。","漿細胞瘤（plasmacytoma）：多見於老齡犬，細胞有偏心核及「鐘面狀」染色質。","TVT（傳染性花柳性腫瘤）：常見於性活躍的流浪犬，Diff-Quik下見空泡化細胞質及特徵性核。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_057","year":2020,"roc_year":109,"session":"","examNo":57,"q":"貓慢性腎臟病最不可能出現下列何項異常？","opts":["A. 氮血症","B. 代謝性鹼血症","C. 高血磷","D. 低血鈣"],"ans":1,"exp":"貓CKD最不可能出現代謝性鹼血症（metabolic alkalosis）。CKD因腎小管分泌H⁺及再吸收HCO₃⁻能力下降，會引起代謝性酸血症（metabolic acidosis），而非鹼血症。其他三個選項（氮血症、高血磷、低血鈣）均是CKD的常見表現。","we":["氮血症（azotemia）：腎臟清除含氮廢物（BUN、肌酸酐）能力下降，是CKD的核心診斷標準。","代謝性鹼血症不是CKD的典型表現；CKD引起代謝性酸血症，此為最不可能出現的異常，正確答案。","高血磷（hyperphosphatemia）：腎臟磷排泄減少，高血磷是CKD的常見並發症。","低血鈣（hypocalcemia）：高血磷抑制活性維生素D合成，導致腸道鈣吸收減少，出現低血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_058","year":2020,"roc_year":109,"session":"","examNo":58,"q":"犬罹患門脈分流，最容易併發下列那一種泌尿道結石？","opts":["A. 磷酸銨鎂","B. 磷酸鈣","C. 尿酸銨","D. 草酸鈣"],"ans":2,"exp":"犬先天性門脈分流（portosystemic shunt）→氨基酸代謝異常→尿酸代謝增加→尿酸銨（ammonium urate）結晶沉積於腎臟或膀胱，是門脈分流犬最常見的泌尿道結石類型。","we":["磷酸銨鎂（struvite）：多與泌尿道細菌感染（產脲酶菌）相關，不是門脈分流的特徵性結石。","磷酸鈣：與高血鈣症或高磷尿症相關，不是門脈分流的特徵性結石。","尿酸銨（ammonium urate）：門脈分流→高尿酸→尿酸銨結晶，是最常見的結石類型，此為正確答案。","草酸鈣：與高尿鈣或高草酸尿相關，不是門脈分流的主要結石類型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_059","year":2020,"roc_year":109,"session":"","examNo":59,"q":"下列何者為貓皮癬菌症（dermatophytosis）最常見的病原？","opts":["A. Trichophyton equinum","B. Microsporum gypseum","C. Microsporum canis","D. Trichophyton verrucosum"],"ans":2,"exp":"貓皮癬菌症（dermatophytosis, ringworm）最常見的病原是Microsporum canis，約佔貓病例的90%以上。此菌在Wood's lamp下可呈現蘋果綠螢光（約50%菌株），是重要的診斷輔助。","we":["Trichophyton equinum：馬的皮癬菌，偶感染人，貓感染罕見。","Microsporum gypseum：土壤性皮癬菌，偶爾感染貓，但不是最常見的貓皮癬菌。","Microsporum canis是貓皮癬菌症最常見的病原（>90%），此為正確答案。","Trichophyton verrucosum：牛的皮癬菌，貓感染極少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_060","year":2020,"roc_year":109,"session":"","examNo":60,"q":"犬隻罹患先天性肝門脈分流時，其腹腔X光檢查會發現下列何種影像？","opts":["A. 肝臟變比較小","B. 肝臟全面變大","C. 脾臟變大","D. 脾臟變小"],"ans":0,"exp":"先天性門脈分流（congenital portosystemic shunt）→肝臟接受的門脈血流減少→肝臟缺乏生長因子（胰島素、胰高血糖素等肝營養因子）→肝臟萎縮（microhepatica）→腹部X光顯示肝臟小於正常。","we":["肝臟變小（microhepatica）：先天性門脈分流的典型X光發現，肝臟缺乏門脈血液中的肝營養因子而萎縮，此為正確答案。","肝臟全面變大：肝臟腫大見於肝炎、肝腫瘤、肝充血，不是先天性門脈分流的表現。","脾臟變大：門脈高壓時可見脾臟充血腫大，但先天性分流不必然引起門脈高壓。","脾臟變小：不是門脈分流的預期X光發現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_061","year":2020,"roc_year":109,"session":"","examNo":61,"q":"犬抽血時，因人為造成的溶血現象會導致下列何項電解質的異常？","opts":["A. hyperkalemia","B. hypokalemia","C. hypernatremia","D. hyponatremia"],"ans":0,"exp":"紅血球細胞內含有高濃度的鉀離子。人為溶血（in vitro hemolysis）時，細胞內鉀離子大量釋放到血漿中，造成偽高血鉀（pseudohyperkalemia），這是犬血液檢查中最常見的人為誤差之一。","we":["Hyperkalemia（偽高血鉀）：溶血釋放紅血球細胞內高濃度鉀到血漿，造成高鉀假象，此為正確答案。","Hypokalemia：溶血只會增加血漿鉀濃度，不會造成低血鉀。","Hypernatremia：鈉主要在細胞外液，溶血不會顯著改變血漿鈉濃度。","Hyponatremia：同上，溶血不引起假性低血鈉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_062","year":2020,"roc_year":109,"session":"","examNo":62,"q":"下列何者不是貓白血病病毒的目標器官？","opts":["A. 胸腺","B. 肝臟","C. 脾臟","D. 淋巴結"],"ans":1,"exp":"貓白血病病毒（FeLV）主要靶向淋巴組織（胸腺、脾臟、淋巴結）引起淋巴瘤，以及骨髓引起骨髓抑制。肝臟不是FeLV的主要靶器官，雖然轉移性淋巴瘤可能侵犯肝臟，但並非原發性目標。","we":["胸腺（thymus）：FeLV引起胸腺萎縮及T細胞淋巴瘤，是主要靶器官。","肝臟：不是FeLV的主要原發性靶器官，此為正確答案（最不是目標器官）。","脾臟（spleen）：FeLV感染的淋巴組織主要受影響，脾臟是主要靶器官。","淋巴結（lymph nodes）：FeLV引起全身性淋巴腺病（lymphadenopathy），是主要靶器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_063","year":2020,"roc_year":109,"session":"","examNo":63,"q":"下列何種犬隻疾病，主要的臨床症狀為消化道症狀？","opts":["A. 永存性動脈導管（PDA）","B. 永存性右主動脈弓（PRAA）","C. 法洛氏四重症（Tetralogy of Fallot）","D. 肺動脈狹窄（Pulmonic stenosis）"],"ans":1,"exp":"永存性右主動脈弓（PRAA）形成血管環（vascular ring）包繞食道，造成食道壓迫→哺乳期至斷奶後開始出現固體食物的逆嘔（regurgitation）→主要呈現消化道症狀（食物逆嘔、體重不增）而非心臟症狀。","we":["PDA（永存性動脈導管）：產生連續性心雜音及左心衰竭症狀，不是消化道症狀。","PRAA（永存性右主動脈弓）：血管環壓迫食道基部→固體食物逆嘔→消化道症狀為主，此為正確答案。","法洛氏四重症（Tetralogy of Fallot）：右至左分流導致發紺、運動不耐，為心臟/呼吸症狀。","肺動脈狹窄（Pulmonic stenosis）：右心負荷增加、心雜音，嚴重者出現暈厥，非消化道症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_064","year":2020,"roc_year":109,"session":"","examNo":64,"q":"有關鎖定式骨板（locking plate）之敘述，下列何者錯誤？","opts":["A. 鎖定式骨板通常不會影響骨生長","B. 使用鎖定螺絲時，骨板必須完美塑型貼附在骨頭表面","C. 穩定性較一般動力加壓骨板（dynamic compression plate）好","D. 鎖定螺絲的方向必須垂直鎖定骨板"],"ans":1,"exp":"鎖定式骨板的優點之一是鎖定螺絲鎖入骨板孔時會自行固定，不需要骨板完美貼合骨面（此為傳統DCP的要求）。鎖定系統的穩定性來自螺絲與骨板的鎖定，而非骨板對骨面的壓迫，因此可以有輕微的骨板-骨頭間隙。","we":["鎖定骨板不壓迫骨膜，對骨膜血流及骨生長影響較小，此敘述正確。","鎖定式骨板不需完美貼合骨面，這是其優點而非要求；此敘述錯誤，為正確答案。","鎖定螺絲與骨板形成固定角度支架，整體穩定性優於傳統DCP，此敘述正確。","鎖定螺絲必須垂直插入骨板鎖定孔，才能完全鎖定，此敘述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_065","year":2020,"roc_year":109,"session":"","examNo":65,"q":"有關犬貓喉頭麻痺（laryngeal paralysis）之敘述，下列何者錯誤？","opts":["A. 貓發生機會比狗少","B. 主要發生在大型犬","C. 可能是全身退化性神經疾病的前兆","D. 一般建議進行雙側的杓狀軟骨側方固定術（arytenoid lateralization）改善症狀"],"ans":3,"exp":"喉頭麻痺治療應進行單側（unilateral）杓狀軟骨側方固定術，而非雙側。雙側固定會過度擴大聲門，顯著增加吸入性肺炎（aspiration pneumonia）的風險，因此僅建議單側手術。","we":["貓發生喉頭麻痺的機率確實比犬低，此敘述正確。","喉頭麻痺主要見於大型及巨型犬（如拉布拉多、金獵犬），此敘述正確。","喉頭麻痺可能是全身退化性神經疾病（polyneuropathy）的早期表徵，此敘述正確。","建議進行單側（非雙側）杓狀軟骨固定術，雙側固定增加吸入性肺炎風險，此敘述錯誤，為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_066","year":2020,"roc_year":109,"session":"","examNo":66,"q":"5 歲雄性未去勢雪納瑞（Schnauzer）犬，有血尿病史，直腸觸診發現前列腺腫大疼痛，觸診後背部疼痛，根據其腰椎X光影像（如附圖），最有可能罹患何病？","opts":["A. 脊椎腫瘤（vertebral neoplasia）","B. 脊椎炎（spondylitis）","C. 椎間盤脊椎炎（discospondylitis）","D. 椎間盤突出（intervertebral disc protrusion）"],"ans":2,"exp":"未去勢雄性犬伴有前列腺腫大疼痛、背部疼痛及腰椎影像異常（椎間盤間隙縮小、終板溶解），高度懷疑椎間盤脊椎炎（discospondylitis）。細菌多由前列腺血行播散至椎間盤，是此病的常見發病機制。","we":["脊椎腫瘤：通常影響椎體而非椎間盤間隙，放射線顯示椎體溶解，且不以前列腺炎為前驅。","脊椎炎（spondylitis）：是脊椎骨本身的感染，椎間盤通常完整，不符合此臨床圖像。","椎間盤脊椎炎（discospondylitis）：細菌由前列腺播散至椎間盤，引起椎間盤及鄰近椎體感染，此為正確答案。","椎間盤突出（IVDD）：通常突然發病，無明顯全身感染跡象，不與前列腺疾病直接相關。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_067","year":2020,"roc_year":109,"session":"","examNo":67,"q":"犬貓大量出血引起休克時，使用下列那一種溶液快速靜脈給與，最能夠暫時維持血管內容積？","opts":["A. 乳酸林格氏液","B. 7.5％食鹽水","C. 哈特曼氏液","D. 2.5％葡萄糖水"],"ans":1,"exp":"大量出血休克時，需快速補充血管內容積。7.5%高張鹽水（hypertonic saline）可迅速從細胞內及間質腔抽取水分進入血管，在極小劑量下快速擴充血管內容積，是「小容積復甦」（small volume resuscitation）的標準用液。","we":["乳酸林格氏液（LRS）：等張液，約70-80%分布於細胞外間質，擴充血管效率低，需補充3倍量。","7.5%食鹽水（高張）：每mL可吸引約4-5 mL細胞外液入血管，快速擴充血管容積，此為正確答案。","哈特曼氏液（Hartmann's）：成分類似LRS，屬等張液，擴充血管容積效率同樣低。","2.5%葡萄糖水：低張液，葡萄糖代謝後相當於自由水，大部分分布至細胞內，最不適合用於血容量補充。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_068","year":2020,"roc_year":109,"session":"","examNo":68,"q":"患犬前肢出現折腳（knuckling）並有共濟失調（ataxia）等步態的症狀時，其病變位置可能在下列何處？","opts":["A. 中樞神經系統（central nervous system）","B. 周邊神經系統（peripheral nervous system）","C. 自主神經系統（autonomic nervous system）","D. 前肢屈肌病變（flexor myopathy）"],"ans":0,"exp":"前肢折腳（knuckling，proprioceptive deficit）合併共濟失調（ataxia）提示上運動神經元（UMN）或本體感覺傳導路徑受損，最可能位於中樞神經系統（頸髓或腦），而非周邊神經（僅影響單一肢體且不伴步態共濟失調）。","we":["中樞神經系統（頸髓或腦部）病變引起UMN徵象（knuckling + ataxia），符合此臨床表現，此為正確答案。","周邊神經病變：通常造成單肢LMN徵象（肌萎縮、反射消失），較少引起雙側共濟失調。","自主神經系統：控制內臟及血管功能，不引起前肢knuckling或步態共濟失調。","前肢屈肌病變：引起局部肌肉萎縮或攣縮，不引起本體感覺缺失及廣泛共濟失調。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_069","year":2020,"roc_year":109,"session":"","examNo":69,"q":"由下圖陰道抹片推論該母犬應處於動情週期的那一時期？","opts":["A. 動情前期（pro-oestrus）","B. 動情期（oestrus）","C. 動情後期（metoestrus）","D. 發情休止期（anoestrus）"],"ans":1,"exp":"陰道抹片需配合圖片判斷動情週期：動情前期含紅血球及有核細胞；動情期以表層無核化細胞（superficial anuclear cells）為主（>80%）；動情後期出現中性球及中間型細胞；靜止期以基底旁層細胞為主。","we":["動情前期（pro-oestrus）：含紅血球、有核細胞、少量表層細胞；黏膜細胞漸成熟。","動情期（oestrus）：>80%表層無核化細胞，紅血球消失，此時為配種最佳時機。","動情後期（metoestrus）：中性球重現，表層細胞快速減少，出現metoestrus cells（Cornified cell engulfing neutrophil）。","靜止期（anoestrus）：幾乎全為基底旁層細胞（parabasal cells），細胞數量少。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_070","year":2020,"roc_year":109,"session":"","examNo":70,"q":"承上題，此時母犬的內泌素以下列何種為主？","opts":["A. 助孕素（progesterone）","B. 鬆弛素（relaxin）","C. 動情素（estrogen）","D. 前列腺素F2α（PGF2α）"],"ans":2,"exp":"若Q69陰道抹片判讀為動情期（oestrus），此時母犬主要的內泌素為動情素（estrogen），由優勢濾泡分泌，抑制FSH並激發LH峰，促進表層細胞角化。","we":["助孕素（progesterone）：在黃體期（metestrus/diestrus）為主要荷爾蒙，動情期時低。","鬆弛素（relaxin）：由黃體及胎盤分泌，妊娠後期才升高，動情期無關。","動情素（estrogen）：動情期由優勢濾泡大量分泌，引起陰道上皮角化及發情行為，此為正確答案。","PGF2α：黃體溶解因子，在黃體期末期升高，動情期不是主要荷爾蒙。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_071","year":2020,"roc_year":109,"session":"","examNo":71,"q":"其診斷為何？","opts":["A. 青光眼","B. 葡萄膜炎","C. 乾性角膜結膜炎","D. 脈絡膜視網膜炎"],"ans":2,"exp":"乾性角膜結膜炎（KCS, keratoconjunctivitis sicca）是犬最常見的眼科疾病之一，表現為黏稠膿樣分泌物、角膜色素沉積及乾燥感。STT（Schirmer淚液試驗）<15mm/min為診斷依據。","we":["青光眼：眼壓升高、角膜水腫、瞳孔散大，臨床表現不同。","葡萄膜炎：眼睛疼痛、縮瞳、前房閃輝，分泌物少。","乾性角膜結膜炎（KCS）：免疫媒介性淚腺破壞，是最常見診斷，此為最可能答案。","脈絡膜視網膜炎：後眼段疾病，前段外觀通常正常。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_072","year":2020,"roc_year":109,"session":"","examNo":72,"q":"承上題，此疾病最常見之成因為何？","opts":["A. 角膜外傷","B. 睫毛倒插","C. 腫瘤","D. 免疫媒介"],"ans":3,"exp":"犬KCS（乾性角膜結膜炎）最常見的原因是免疫媒介性（immune-mediated）淚腺破壞，佔病例超過80%。自體免疫反應攻擊淚腺腺泡，導致淚液分泌減少。","we":["角膜外傷：可引起局部角膜病變，但不引起整體淚液分泌減少。","睫毛倒插（distichiasis/ectopic cilia）：機械性刺激角膜，不直接引起KCS。","腫瘤：淚腺腫瘤可引起分泌減少，但比免疫媒介性KCS罕見。","免疫媒介：80%以上的犬KCS由免疫媒介性淚腺炎引起，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_073","year":2020,"roc_year":109,"session":"","examNo":73,"q":"承上題，絕大多數病例使用下列何種局部藥物有療效？","opts":["A. 碳酸酐酶抑制劑（carbonic anhydrase inhibitors）","B. 類前列腺素（prostaglandin analogue）","C. 免疫抑制劑","D. atropine"],"ans":2,"exp":"免疫媒介性KCS的標準治療是局部免疫抑制劑（cyclosporine或tacrolimus），抑制自體免疫對淚腺的攻擊，同時刺激淚液分泌。多數病例（60-70%）對cyclosporine有良好反應。","we":["碳酸酐酶抑制劑：降低眼壓，用於青光眼治療，對KCS無效。","類前列腺素（prostaglandin analogue）：促進眼房液排出，用於青光眼，不是KCS治療。","免疫抑制劑（cyclosporine/tacrolimus）：KCS的首選治療，抑制自體免疫並刺激淚液分泌，此為正確答案。","Atropine：用於葡萄膜炎散瞳止痛，KCS禁用（會減少淚液分泌）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_074","year":2020,"roc_year":109,"session":"","examNo":74,"q":"依據Modified AHA/ACC Heart Failure Staging System所訂定的心衰竭分級系統，應屬於下列何級？","opts":["A. A","B. B","C. C","D. D"],"ans":1,"exp":"Modified AHA/ACC心衰竭分級：Stage A=有風險但無結構性心臟病；Stage B=有結構性心臟病但無臨床症狀；Stage C=有結構性心臟病且有/曾有心衰竭症狀；Stage D=難治性終末期。若病犬有瓣膜疾病（結構異常）但尚無臨床症狀，分為Stage B。","we":["Stage A：僅有風險因子，無結構性心臟病，不符合有心臟結構異常的病例。","Stage B：有結構性心臟病（如二尖瓣閉鎖不全）但無臨床心衰竭症狀，最可能的初診分級。","Stage C：有結構性心臟病且當前或過去有心衰竭症狀，見Q75的2年後情況。","Stage D：難治性心衰竭，僅適用於標準治療無效的終末期患者。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_075","year":2020,"roc_year":109,"session":"","examNo":75,"q":"承上題，該犬於2年後出現持續咳嗽、運動不耐等臨床症狀，且於後續的X光及心臟超音波檢查都發現左心房及心室變大，而後以心衰竭藥物治療效果反應良好。依據Modified AHA/ACC Heart Failure Staging System所訂定的心衰竭分級系統，應屬於下列何級？","opts":["A. A","B. B","C. C","D. D"],"ans":2,"exp":"該犬2年後出現咳嗽、運動不耐（心衰竭臨床症狀），心臟超音波發現心室及心房擴大，對心衰竭藥物治療有良好反應→符合Stage C：有結構性心臟病且出現/曾出現心衰竭的臨床症狀，且對治療有反應。","we":["Stage A：此犬已有結構性心臟病且出現症狀，已超出Stage A的定義。","Stage B：Stage B無臨床症狀，該犬已出現咳嗽及運動不耐，已進展至Stage C。","Stage C：有結構性心臟病＋出現心衰竭症狀＋對治療有反應，符合Stage C定義，此為正確答案。","Stage D：難治性心衰竭，但此犬對藥物治療「反應良好」，不符合Stage D的難治性定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_076","year":2020,"roc_year":109,"session":"","examNo":76,"q":"於病犬左側頭靜脈放置靜脈留置針，麻醉前給藥：morphine 0.5mg/kg 混合acepromazine 0.03mg/kg 肌肉注射，\r  10 分鐘後，病犬呼吸變快、急促而淺，其最有可能為下列何者所引起？","opts":["A. morphine改變下視丘體溫調控的條件","B. acepromazine造成此類型呼吸抑制","C. morphine造成大量組織胺的釋放","D. acepromazine引起的paradoxical excitation"],"ans":0,"exp":"嗎啡（morphine）在犬體內可改變下視丘體溫調控的設定點（lowering thermoregulatory set point），使動物出現喘氣（panting）以散熱，呈現快而淺的呼吸型態，這是犬對morphine的特殊反應，不是真正的呼吸抑制。","we":["嗎啡在犬可降低體溫調控設定點，引起喘氣（panting）散熱，呈快而淺呼吸，此為正確答案。","Acepromazine引起鎮靜及輕微呼吸抑制，但不引起喘氣型快速呼吸。","嗎啡在貓及某些動物可釋放組織胺，但犬的喘氣反應主要來自體溫調控機轉，非組織胺釋放。","Acepromazine的paradoxical excitation極罕見，且不引起喘氣型呼吸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_077","year":2020,"roc_year":109,"session":"","examNo":77,"q":"承上題，病犬以propofol靜脈注射導入麻醉，插管後，以自主呼吸的方式吸入isoflurane維持麻醉，接上生理監視器監控各項生理數值，發現ETCO 2 的描述圖如下（ETCO 2 ：42，FiCO 2 : 0, RR: 21），其原因為下列何者？","opts":["A. isoflurane引起的呼吸抑制","B. 心臟跳動衝擊呼吸道","C. 動物疼痛","D. propofol引起的呼吸抑制"],"ans":1,"exp":"ETCO2波形呈現小的額外波動（hump pattern）或鋸齒狀，伴隨正常的ETCO2值及呼吸頻率，最常見於心臟搏動衝擊呼吸道（cardiogenic oscillations）。此現象在小動物麻醉中可見，是心跳引起氣道壁振動的偽影。","we":["Isoflurane呼吸抑制：通常引起呼吸緩慢、ETCO2升高，不是此種波形。","心臟跳動衝擊呼吸道（cardiogenic oscillations）：在ETCO2波形上形成特徵性小波動，ETCO2值正常，此為正確答案。","動物疼痛：引起呼吸加快、ETCO2降低，不是此種波形特徵。","Propofol呼吸抑制：已在導入期發生，維持期使用isoflurane後propofol效果已退。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_1_普通病_078","year":2020,"roc_year":109,"session":"","examNo":78,"q":"承上題，病犬先以俯臥姿，兩後肢往前移放呈青蛙狀趴臥，判定已經進入麻醉狀態後，進行硬膜外神經麻醉。下列何者不是執行硬膜外麻醉的禁忌症？","opts":["A. 凝血功能異常","B. 下針區域的皮膚有感染","C. 有低血壓或低血容量情況","D. 骨盆變形"],"ans":3,"exp":"硬膜外麻醉的禁忌症包括：凝血障礙（出血風險）、穿刺部位皮膚感染（感染擴散至硬膜外腔）、低血壓或低血容量（硬膜外麻醉本身會降低血壓，加重休克）。骨盆變形不是硬膜外麻醉的禁忌症，因穿刺位置（L-S間隙）在骨盆後方背側，不受骨盆形狀影響。","we":["凝血功能異常：出血進入硬膜外腔可形成血腫，壓迫脊髓，是明確禁忌症。","穿刺部位皮膚感染：可能導致硬膜外腔感染（硬膜外腔膿腫），是禁忌症。","低血壓或低血容量：硬膜外麻醉阻斷交感神經→血管舒張→血壓進一步下降，危及生命，是禁忌症。","骨盆變形：L-S空間位於骨盆後方背側，穿刺不受骨盆形狀影響，不是禁忌症，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_079","year":2020,"roc_year":109,"session":"","examNo":79,"q":"承上題，手術過程中，可能硬膜外麻醉失敗，導致病犬在手術過程中有疼痛感，因此麻醉醫師立即靜脈注射fentanyl 3 mcg/kg，並以4 mcg/kg/h CRI方式予以止痛。下列那一項不是fentanyl在麻醉過程中可能引起的副作用？","opts":["A. 呼吸抑制，造成呼吸停止","B. 組織胺釋放，造成血管舒張","C. 活化副交感神經，造成心搏徐緩","D. 造成心輸出量下降"],"ans":1,"exp":"Fentanyl的重要藥理特點是幾乎不引起組織胺釋放（不同於嗎啡、哌替啶）。因此血管舒張及皮膚潮紅不是fentanyl的常見副作用，而呼吸抑制、心搏徐緩（迷走神經活化）及心輸出量下降是已知副作用。","we":["呼吸抑制造成呼吸停止：fentanyl的主要副作用，需監控呼吸。","組織胺釋放造成血管舒張：這是嗎啡的副作用，fentanyl幾乎不釋放組織胺，此敘述不是fentanyl的副作用，為正確答案。","迷走神經活化引起心搏徐緩：fentanyl及其他阿片類可活化迷走神經引起bradycardia，是已知副作用。","心輸出量下降：fentanyl引起的心搏徐緩可使心輸出量輕度下降，特別在高劑量時。"],"needs_review":false,"imgs":[]},{"id":"AMO_2020_1_普通病_080","year":2020,"roc_year":109,"session":"","examNo":80,"q":"承上題，手術中生理監視器的參數如下圖，下列何項處置最為正確？","opts":["A. 靜脈注射atropine","B. 靜脈注射atenolol","C. 靜脈注射adrenaline","D. 靜脈注射esmolol"],"ans":0,"exp":"手術中若生理監視器顯示心搏徐緩（bradycardia）（fentanyl CRI可能引起），治療首選靜脈注射atropine（抗副交感神經藥物），可快速增加心率，是麻醉中心搏徐緩的標準緊急處置。","we":["Atropine（靜脈注射）：阻斷迷走神經對心臟的作用，快速提升心率，是麻醉中心搏徐緩的首選治療，此為正確答案。","Atenolol（β1-阻斷劑）：用於治療心跳過快或心律不整，在心搏徐緩時使用會加重病情。","Adrenaline（腎上腺素）：用於心跳停止或嚴重低血壓，不是心搏徐緩的首選。","Esmolol（短效β-阻斷劑）：用於控制心跳過快，在心搏徐緩時禁用。"],"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_001","year":2020,"roc_year":109,"session":"","examNo":1,"q":"下列何者不是造成馬匹舟狀骨疾病(navicular disease)的主要原因?","opts":["A. 蹄跟高低不對稱","B. 蹄較長且蹄跟較低","C. 精料量過多","D. 訓練過度"],"ans":2,"exp":"舟狀骨疾病（navicular disease）的主要風險因子為蹄形問題（蹄跟高低不對稱）、蹄趾過長蹄跟低、訓練過度等；精料量過多是蹄葉炎的風險因子，與舟狀骨疾病的直接原因無明確關係，故精料量過多是本題最不相關的主要原因。","we":{"A":"A. 蹄跟高低不對稱造成蹄部壓力不均，是navicular disease的重要風險因子。","B":"B. 蹄趾過長蹄跟低改變蹄骨角度，增加舟狀骨壓力，是確認的風險因子。","C":"C. (正確) 精料量過多是蹄葉炎（laminitis）的風險因子，不是navicular disease的主要原因。","D":"D. 訓練過度（overwork）使舟狀骨反覆受壓，是重要風險因子。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_002","year":2020,"roc_year":109,"session":"","examNo":2,"q":"下列何種處置方式最不宜用於下圖馬匹之新鮮撕裂傷口?","opts":["A. delayed primary closure","B. interrupted Lembert suture","C. interrupted horizontal mattress suture with pieces of rubber tubing","D. near-far-far-near suture"],"ans":1,"exp":"馬新鮮撕裂傷口的縫合：Lembert suture是一種內翻縫合（inverting suture），適用於腸道/胃壁縫合，使漿膜層相對，不適用於皮膚外傷；皮膚撕裂傷應使用能承受張力的縫合方式（horizontal mattress、near-far-far-near）或延遲縫合（delayed primary closure）。","we":{"A":"A. Delayed primary closure適用於嚴重污染傷口，待感染控制後再縫合，可用於馬外傷。","B":"B. (正確) Interrupted Lembert suture是腸道內翻縫合，不適合皮膚撕裂傷，此為最不宜使用的縫合方式。","C":"C. 水平褥式縫合加橡皮管（horizontal mattress with rubber tubing）可分散張力，適合馬四肢傷口。","D":"D. Near-far-far-near suture是抗張力縫合，適合張力大的傷口。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_003","year":2020,"roc_year":109,"session":"","examNo":3,"q":"Prosthetic laryngoplasty 適用於治療馬下列何種疾病?","opts":["A. sinusitis","B. laryngeal hemiplegia","C. epiglottic entrapment","D. ethmoid hematoma"],"ans":1,"exp":"Prosthetic laryngoplasty（假體喉成形術，tieback手術）是將杓狀軟骨以縫線固定於喉軟骨，永久外展聲帶裂（rima glottidis），用於治療馬喉頭麻痺（laryngeal hemiplegia，roaring）；適用對象為因喉頭麻痺造成運動時吸氣性喘鳴的馬匹。","we":{"A":"A. Sinusitis（竇炎）是馬的鼻竇炎，治療以竇腔灌洗或手術開窗，非喉成形術。","B":"B. (正確) Laryngeal hemiplegia（喉頭麻痺）是prosthetic laryngoplasty的主要適應症，用於賽馬運動時的吸氣性喘鳴。","C":"C. Epiglottic entrapment（會厭軟骨套陷）以手術切除被套陷的組織為主要治療。","D":"D. Ethmoid hematoma（篩骨血腫）以化學消融或手術切除為主。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_004","year":2020,"roc_year":109,"session":"","examNo":4,"q":"牛發生產褥性血紅素血症,一般認為可能由於血中缺乏何種元素所致?","opts":["A. 鈣","B. 磷","C. 矽","D. 鎂"],"ans":1,"exp":"產褥性血紅素血症（postparturient hemoglobinuria）發生於高產乳牛產後，主要是低磷血症（hypophosphatemia）引起；產後大量磷消耗（泌乳、代謝）導致紅血球ATP不足，紅血球膜脆弱，發生血管內溶血，血紅素由尿液排出呈血紅素尿。","we":{"A":"A. 鈣缺乏引起生產癱瘓（milk fever），不直接引起產褥性血紅素血症。","B":"B. (正確) 低磷血症（phosphorus deficiency）是牛產褥性血紅素血症的主要原因，磷不足→紅血球ATP耗盡→溶血→血紅素尿。","C":"C. 矽缺乏與產褥性血紅素血症無關。","D":"D. 鎂缺乏引起低鎂草痙攣，不直接引起產褥性血紅素血症。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_005","year":2020,"roc_year":109,"session":"","examNo":5,"q":"下列何者為小牛水中毒之主要症狀?","opts":["A. 紅血球尿症","B. 血紅素尿","C. 血液凝固不全","D. 黃疸"],"ans":1,"exp":"小牛水中毒（water intoxication）：仔牛在禁食後突然大量飲水或以低滲液體餵食，導致血液急性低滲透壓，紅血球在低張環境下脹破（血管內溶血），血紅素（hemoglobin）大量釋放入血，由尿液排出形成血紅素尿（hemoglobinuria）。","we":{"A":"A. 紅血球尿症（hematuria）是紅血球本身出現在尿中（泌尿道出血），水中毒是紅血球在血管內溶解，尿中是血紅素而非完整紅血球。","B":"B. (正確) 水中毒導致低張性溶血→血紅素釋放→血紅素尿（hemoglobinuria），是本病的主要症狀。","C":"C. 血液凝固不全不是水中毒的主要症狀。","D":"D. 黃疸雖然嚴重溶血後可能出現，但血紅素尿是最主要且最早出現的症狀。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_006","year":2020,"roc_year":109,"session":"","examNo":6,"q":"牛隻氫氰酸中毒時,使用下列何者治療較佳?","opts":["A. 葡萄糖酸鈣 (calcium gluconate)靜脈注射","B. 硫酸鎂口服","C. 亞硝酸鈉和硫代硫酸鈉合劑靜脈注射","D. 活性碳口服"],"ans":2,"exp":"氫氰酸（cyanide）中毒治療：亞硝酸鈉（sodium nitrite）使血紅素氧化為高鐵血紅素（methemoglobin），後者與氰根離子（CN⁻）結合；再給予硫代硫酸鈉（sodium thiosulfate），在硫氰酸酶催化下將氰根轉為低毒的硫氰酸鹽（thiocyanate），從尿液排出。","we":{"A":"A. 葡萄糖酸鈣用於低鈣血症（如草酸鹽中毒），對氫氰酸中毒無效。","B":"B. 硫酸鎂是瀉劑，可用於某些中毒的胃腸道清除，但對氫氰酸中毒無特異性解毒作用。","C":"C. (正確) 亞硝酸鈉+硫代硫酸鈉合劑靜脈注射是氫氰酸中毒的標準解毒療法。","D":"D. 活性碳適用於口服毒素的吸附，但對已吸收的氰化物無效。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_007","year":2020,"roc_year":109,"session":"","examNo":7,"q":"牛隻 氯 酸鹽除草劑中毒所引起之症狀,類似下列何種中毒?","opts":["A. 殺鼠劑warfarin中毒","B. 洋蔥中毒","C. 亞硝酸鹽中毒","D. 有機磷中毒"],"ans":2,"exp":"氯酸鹽（chlorate）除草劑中毒是強氧化劑，使血紅素氧化形成高鐵血紅素（methemoglobinemia），動物黏膜變棕褐色（chocolate brown mucosa）、呼吸困難、發紺；症狀與亞硝酸鹽中毒相似（亞硝酸鹽也引起高鐵血紅素血症）。","we":{"A":"A. Warfarin殺鼠劑中毒引起凝血功能障礙和出血，不引起高鐵血紅素血症。","B":"B. 洋蔥中毒引起Heinz body溶血性貧血，機制不同於高鐵血紅素。","C":"C. (正確) 氯酸鹽中毒引起高鐵血紅素血症，與亞硝酸鹽中毒（也引起高鐵血紅素血症）症狀相似。","D":"D. 有機磷中毒引起膽鹼酯酶抑制→膽鹼激性症狀（流涎、縮瞳、肌肉震顫），機制完全不同。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_008","year":2020,"roc_year":109,"session":"","examNo":8,"q":"右心室無法充分將回心血輸出,導致全身靜脈鬱血及右心房血壓上升,此為下列何種疾病?","opts":["A. 肺因性心衰竭","B. 充血性心衰竭","C. 鬱血性心衰竭","D. 支氣管性肺炎"],"ans":2,"exp":"右心室無法充分輸出回心血→右心房壓升高→全身靜脈端血液鬱積（systemic venous congestion）→鬱血性心衰竭（congestive heart failure, right-sided CHF）。鬱血性心衰竭（C）指靜脈端鬱血的心衰竭類型，此為右側心衰竭的描述。","we":{"A":"A. 肺因性心衰竭（cor pulmonale）是由肺部疾病引起的右心衰竭，強調病因是肺，不是描述血流動力學機制。","B":"B. 充血性心衰竭（hyperemic/congestive）在中文有時與鬱血性混用，但強調動脈充血，不完全對應靜脈鬱血機制。","C":"C. (正確) 鬱血性心衰竭（congestive heart failure）= 右心室輸出不足→靜脈端血液鬱積→全身靜脈壓升高，符合題目描述。","D":"D. 支氣管性肺炎是呼吸系統疾病，不是心臟衰竭的分類。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_009","year":2020,"roc_year":109,"session":"","examNo":9,"q":"牛三尖瓣發生細菌性心内膜炎時,聽診其雜音在下列何處最佳?","opts":["A. 左胸3~4肋間肘頭上方","B. 右胸3~4肋間肘頭上方","C. 左胸5~6肋間","D. 右胸5~6肋間"],"ans":1,"exp":"牛三尖瓣（tricuspid valve）位於右心，聽診最佳位置在右胸3-4肋間肘頭上方（right 3rd-4th ICS, at elbow level）；牛三尖瓣心雜音在右側胸腔聽診最清楚。","we":{"A":"A. 左胸3-4肋間為二尖瓣/主動脈瓣聽診區，非三尖瓣的最佳位置。","B":"B. (正確) 牛三尖瓣細菌性心內膜炎雜音在右胸3-4肋間肘頭上方最清晰，因三尖瓣位於右心房室間。","C":"C. 左胸5-6肋間偏後，非三尖瓣最佳聽診位置。","D":"D. 右胸5-6肋間位置過低，亦非三尖瓣的最佳聽診位置。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_010","year":2020,"roc_year":109,"session":"","examNo":10,"q":"小牛發生氟中毒時,可用下列何種藥劑解毒?","opts":["A. 硫酸銅","B. 硫酸鋁","C. 亞硫酸鈉","D. BAL (Dimercaprol)"],"ans":1,"exp":"氟（fluoride）中毒在急性期，治療主要是給予鋁鹽（如硫酸鋁，aluminum sulfate）口服，鋁離子與氟離子結合形成不溶性的氟化鋁（AlF₃），減少氟的腸道吸收；靜脈給予葡萄糖酸鈣可與游離氟結合，也有輔助效果。","we":{"A":"A. 硫酸銅用於銅缺乏補充或某些寄生蟲治療，對氟中毒無效。","B":"B. (正確) 硫酸鋁口服可與腸道中的氟離子結合，減少吸收，是氟中毒的解毒/治療措施之一。","C":"C. 亞硫酸鈉用於亞硝酸鹽中毒或漂白用途，對氟中毒無效。","D":"D. BAL（二巰基丙醇）用於砷、汞、金等重金屬中毒的螯合治療，對氟中毒無效且有害。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_011","year":2020,"roc_year":109,"session":"","examNo":11,"q":"牛發生尿素中毒時,常用下列何種藥治療?","opts":["A. 硫酸","B. 磷酸","C. 醋酸","D. 鞣酸"],"ans":2,"exp":"牛尿素中毒：尿素在瘤胃中被微生物尿素酶（urease）分解為氨（ammonia），大量氨被吸收導致血氨升高（氨血症）；治療原則是降低瘤胃pH以抑制尿素酶活性（高pH促進尿素酶活性，低pH抑制之）。口服醋酸（acetic acid，稀醋）可酸化瘤胃，抑制尿素酶，減少氨的進一步產生，是尿素中毒的標準口服治療。","we":{"A":"A. 硫酸雖可酸化，但過強，直接口服有腐蝕性，不適合。","B":"B. 磷酸口服有刺激性，不是標準治療。","C":"C. (正確) 醋酸（acetic acid，稀醋 3-5% acetic acid）口服可酸化瘤胃，抑制尿素酶活性，是牛尿素中毒的標準緊急治療。","D":"D. 鞣酸（tannic acid）用於某些金屬中毒，對尿素/氨中毒無特異效果。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_012","year":2020,"roc_year":109,"session":"","examNo":12,"q":"有關女牛蹄葉炎發生的風險因子中,下列何者最不重要?","opts":["A. 體重過重","B. 年齡","C. 餵飼過多精料","D. 飼養在水泥地面"],"ans":1,"exp":"乳牛蹄葉炎（laminitis）的風險因子包括：高精料飼喂（→瘤胃酸中毒→內毒素→蹄部血管傷害）、飼養在水泥地面（→蹄部機械壓力增加）、體重過重（→蹄部負荷增加），這些都是明確的重要風險因子；年齡本身（B）相較之下是最不重要的風險因子，因為蹄葉炎可發生於任何年齡，年齡不是決定性因素。","we":{"A":"A. 體重過重增加蹄部機械負荷，是重要風險因子。","B":"B. (正確) 年齡本身是蹄葉炎最不重要的風險因子，其他因子（精料、地面、體重）的影響遠大於年齡。","C":"C. 餵飼過多精料→瘤胃酸中毒→組織胺和內毒素釋放→蹄部微血管損傷，是最重要的風險因子之一。","D":"D. 水泥地面增加蹄部壓力和磨損，是明確的環境風險因子。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_013","year":2020,"roc_year":109,"session":"","examNo":13,"q":"下列何者不屬於牛原發性光敏症(photosensitization之光敏物質?","opts":["A. 蕎麥鹼(fagopyrin)","B. 金絲桃素(hypercin)","C. 硫二苯胺(phenothiazine)","D. 葉紅素(phylloerythrin)"],"ans":3,"exp":"原發性光敏症（primary photosensitization）的光敏物質是從植物中直接攝取後沉積在皮膚：蕎麥鹼（fagopyrin, 蕎麥）、金絲桃素（hypericin, 聖約翰草）、硫二苯胺（phenothiazine）等均為原發性光敏物質；葉紅素（phylloerythrin）是葉綠素的代謝物，正常由肝臟通過膽汁排出，若肝功能障礙則蓄積於皮膚引起繼發性（肝源性）光敏感症，不是原發性光敏物質。","we":{"A":"A. 蕎麥鹼（fagopyrin）存在於蕎麥中，攝入後直接引起原發性光敏感症，屬原發性光敏物質。","B":"B. 金絲桃素（hypericin/hypericin）存在於聖約翰草，是原發性光敏感症的代表性物質。","C":"C. 硫二苯胺（phenothiazine）是驅蟲藥，代謝物可引起光毒性，屬於化學性光敏物質。","D":"D. (正確) 葉紅素（phylloerythrin）是葉綠素代謝物，引起繼發性（肝源性）光敏感症，不是原發性光敏物質，故不屬於原發性光敏症的光敏物質。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_014","year":2020,"roc_year":109,"session":"","examNo":14,"q":"牛發生消化道出血呈現黑色便時,應推測為何處出血?","opts":["A. 盲腸","B. 結腸","C. 直腸","D. 小腸"],"ans":3,"exp":"消化道出血的顏色與出血位置：黑色焦油狀便（melena）表示血液在腸道停留時間長，受消化酶和細菌作用後血紅素降解，通常來自上消化道或小腸（小腸）；大腸出血通常呈鮮紅色或暗紅色，而非黑色。","we":{"A":"A. 盲腸出血通常呈暗紅色或鮮紅色，不引起典型黑色便。","B":"B. 結腸出血視位置而定，近端結腸出血可能偏深色但不典型的黑色焦油狀。","C":"C. 直腸出血呈鮮血，不引起黑色便。","D":"D. (正確) 黑色便（melena）代表出血部位在小腸或更前段（如胃、十二指腸），血液在腸道被充分消化後呈黑色焦油狀。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_015","year":2020,"roc_year":109,"session":"","examNo":15,"q":"有關引起乳牛創傷性蜂巢胃腹膜炎之敘述,下列何者錯誤?","opts":["A. 創傷性蜂巢胃腹膜炎會引起迷走神經性消化不良","B. 大多數蜂巢胃損傷病例位於蜂巢胃右側壁","C. 其炎性組織和瘢痕組織多損害蜂巢胃前壁的迷走神經腹枝","D. 創傷性蜂巢胃腹膜炎也容易引起瘤胃和皺同之間的粘連"],"ans":1,"exp":"大多數創傷性蜂巢胃炎的異物穿透發生在蜂巢胃的前壁（cranial wall）和腹側壁（ventral wall），而非右側壁；異物受重力影響沉積在蜂巢胃腹側，向前穿透是最常見的方向（指向心臟、橫膈膜）。說「大多數損傷在右側壁」是錯誤的描述。","we":{"A":"A. 創傷性蜂巢胃腹膜炎確可因炎性組織刺激迷走神經，引起繼發性迷走神經性消化不良，描述正確。","B":"B. (正確) 大多數蜂巢胃異物穿透的位置是前壁/腹側壁，而非右側壁；「大多數位於右側壁」是錯誤的描述。","C":"C. 炎性和瘢痕組織損害蜂巢胃前壁的迷走神經腹枝是正確的病理描述。","D":"D. 創傷性蜂巢胃腹膜炎確可引起粘連，雖「瘤胃和皺胃之間的粘連」不是最典型描述，但不是最錯誤的選項。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_016","year":2020,"roc_year":109,"session":"","examNo":16,"q":"有關牛金屬探測器檢查法,下列敘述何項錯誤?","opts":["A. 探測部位在胸腹下方及腹側部","B. 以檢查出磁鐵性異物為主","C. 若有反應即可確診有創傷性蜂巢胃炎","D. 牛舍鐵製夾欄亦可引起反應"],"ans":2,"exp":"金屬探測器檢查牛：A（探測部位）、B（檢測磁性異物）、D（外部鐵製夾欄引起反應是干擾）均為正確描述。C錯誤：金屬探測器有反應只表示存在磁性金屬，不能確診創傷性蜂巢胃炎（可能是已吞入但未穿透的異物、外部干擾等），需結合其他診斷方法（白血球數、纖維素滲出液、超音波等）才能確診。","we":{"A":"A. 探測部位在胸腹下方及腹側部是正確的操作位置。","B":"B. 金屬探測器主要用於偵測磁性（ferro-magnetic）金屬，描述正確。","C":"C. (正確) 金屬探測器有反應只能表示有金屬異物存在，不能直接確診創傷性蜂巢胃炎，需其他診斷依據支持，故「若有反應即可確診」是錯誤的描述。","D":"D. 牛舍鐵製夾欄確為干擾來源，可引起假陽性反應，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_017","year":2020,"roc_year":109,"session":"","examNo":17,"q":"治療牛隻創傷性心囊炎taumatic pericarditis),若使用心包穿刺術pericardiocentesis)時,其進針位置是\r 在左胸第幾肋間?","opts":["A. 3","B. 4","C. 5","D. 6"],"ans":2,"exp":"牛創傷性心包炎（traumatic pericarditis）的心包穿刺術（pericardiocentesis）進針位置：在左胸第5肋間（left 5th intercostal space），位於肘頭（olecranon）水平或稍上方，避開心臟大血管。","we":{"A":"A. 第3肋間位置太前，不在心臟絕對濁音區，不適合穿刺。","B":"B. 第4肋間偏前，不是標準位置。","C":"C. (正確) 牛心包穿刺的標準位置是左胸第5肋間，在肘頭水平上方，以進入心包腔而不穿入心臟。","D":"D. 第6肋間偏後，心臟位置已移出，不是標準穿刺點。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_018","year":2020,"roc_year":109,"session":"","examNo":18,"q":"下列那種病原單純感染牛隻時,通常不會引起高燒(fever)?","opts":["A. 牛疱疹病毒第一型(bovine herpesvirus type 1)","B. 牛呼吸道融合病毒(bovine respiratory syncytial virus )","C. 牛冠狀病毒感染症(bovine coronavirus infection)","D. 牛病毒性下痢病毒(bovine viral diarrhoea virus )"],"ans":3,"exp":"BVDV（牛病毒性下痢病毒）急性感染的特點是免疫抑制（immunosuppression），大多數感染為亞臨床或輕微，不引起顯著高燒；其他病原：BHV-1引起IBR（高燒40-42°C）、BRSV引起下呼吸道炎症（有發燒）、BCoV引起腸炎（可有輕微發燒）均較BVDV更易引起高燒。","we":{"A":"A. 牛疱疹病毒第一型（BHV-1）引起IBR，典型症狀包括高燒（40-42°C），是明顯引起高燒的病原。","B":"B. BRSV引起嚴重下呼吸道疾病，有發燒，尤其幼牛。","C":"C. BCoV引起腸道症狀為主，有時輕微發燒，但仍比BVDV更易引起發燒。","D":"D. (正確) BVDV急性感染通常以免疫抑制為主，發燒輕微或無，「通常不引起高燒」是BVDV急性感染的特點。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_019","year":2020,"roc_year":109,"session":"","examNo":19,"q":"【已刪除】19.有關以blind tack-toggle pi方式治療牛第四胃異位的敘迦,下列何者錯誤?","opts":["A. 沒有聽到高調金屬音(ping)時,就不宜進行此手術","B. 若病牛在手術後4小時內沒有明顯恢復,應立即剪斷縫線","C. 沒有明顯恢復健康的病牛可再進行開腹手術治療","D. 超過3週後再拆線會增加出現第四胃瘻管的風險 (E)一律給分"],"ans":0,"exp":"本題【已刪除】，全體考生一律給分，答案視同全對。","we":{"A":"A. 已刪除題目，全體給分。","B":"B. 已刪除題目，全體給分。","C":"C. 已刪除題目，全體給分。","D":"D. 已刪除題目，全體給分。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_020","year":2020,"roc_year":109,"session":"","examNo":20,"q":"在治療第四胃異位之右脇腹壁大網膜固定術中,為了避免病牛因低血鈣或虛弱而倒臥汙染術區,應採取下列\r 何種保定方式?","opts":["A. 用腳繩同時固定左前肢與左後肢","B. 用腳繩同時固定左前肢與右後肢","C. 用腳繩同時固定右前肢與右後肢","D. 用腳繩同時固定右前肢與左後肢"],"ans":2,"exp":"右脇腹壁大網膜固定術（right paralumbar omentopexy）進行時，為防止牛因低血鈣或虛弱向右側倒臥污染術區（右側手術切口），需用腳繩同時固定右前肢與右後肢（C）；固定右側肢體可防止右側倒臥，維持牛站立姿勢。","we":{"A":"A. 固定左前肢與左後肢不能防止向右側倒臥，效果相反。","B":"B. 固定左前肢與右後肢形成交叉固定，不是防止右側倒臥的最佳方式。","C":"C. (正確) 固定右前肢與右後肢，可提起右側肢體，有效防止牛向右側倒臥，保護右側手術術區。","D":"D. 固定右前肢與左後肢（交叉）會干擾牛的站立平衡，且不能有效防止右側倒臥。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_021","year":2020,"roc_year":109,"session":"","examNo":21,"q":"牛隻手術前靜脈注射多少mg/kg之detomidine會有最佳的鎮靜作用,能維持牛隻站立,不會造成躺臥?","opts":["A. 0.001","B. 0.01","C. 0.1","D. 1"],"ans":1,"exp":"Detomidine（地托咪定）是α₂受體促效劑，在牛靜脈注射的鎮靜劑量：0.01-0.02 mg/kg IV可達最佳站立鎮靜效果；0.001 mg/kg過低（效果不足），0.1 mg/kg或1 mg/kg過高（會造成躺臥或過度鎮靜）。","we":{"A":"A. 0.001 mg/kg劑量過低，鎮靜效果不足，無法達到手術所需的鎮靜水準。","B":"B. (正確) 0.01 mg/kg靜脈注射detomidine可達到最佳站立鎮靜（維持站立但深度鎮靜），適合牛隻站立手術。","C":"C. 0.1 mg/kg劑量過高，會造成牛隻躺臥，超過預期的鎮靜程度。","D":"D. 1 mg/kg遠超過推薦劑量，會引起嚴重副作用（深度麻醉、心血管抑制）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_022","year":2020,"roc_year":109,"session":"","examNo":22,"q":"牛隻開腹術前所使用之脊椎旁神經阻斷法(paravertebralblock,下列何者不是其主要被麻醉之神經?","opts":["A. 第13條胸神經","B. 第1條腰神經","C. 第2條腰神經","D. 第3條腰神經"],"ans":3,"exp":"牛脊椎旁神經阻斷法（paravertebral nerve block）用於腹脇腹手術麻醉，標準阻斷的神經為：第13胸神經（T13）、第1腰神經（L1）和第2腰神經（L2）；第3腰神經（L3）不在標準阻斷範圍內，是本題的錯誤選項。","we":{"A":"A. 第13胸神經（T13）是脊椎旁阻斷的三條神經之一，正確。","B":"B. 第1腰神經（L1）是脊椎旁阻斷的三條神經之一，正確。","C":"C. 第2腰神經（L2）是脊椎旁阻斷的三條神經之一，正確。","D":"D. (正確) 第3腰神經（L3）不是牛脊椎旁神經阻斷的主要麻醉對象，是本題正確回答「不是被麻醉神經」的選項。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_023","year":2020,"roc_year":109,"session":"","examNo":23,"q":"成牛手術前所施行之硬膜外麻醉法(epidural anesthesia),需用多少之2%lidocaine?","opts":["A. 3","B. 6","C. 15","D. 30"],"ans":1,"exp":"成牛（成年牛）的硬膜外麻醉（caudal epidural block）用2% lidocaine：標準劑量約為5-7 mL（依體重和麻醉範圍），一般教科書推薦6 mL；3 mL過少，15 mL和30 mL過多（可能向前擴散，引起前身麻痺）。","we":{"A":"A. 3 mL的2% lidocaine劑量不足，無法達到充分的硬膜外麻醉效果。","B":"B. (正確) 6 mL的2% lidocaine是成牛硬膜外麻醉的標準推薦劑量，可麻醉會陰和後軀而不影響前肢站立。","C":"C. 15 mL劑量過多，可能造成局部麻醉藥前向擴散，引起後肢無力或脊髓麻醉。","D":"D. 30 mL遠超過推薦劑量，會引起廣泛脊髓麻醉，動物倒臥。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_024","year":2020,"roc_year":109,"session":"","examNo":24,"q":"牛臨床上會出現異嗜癖(pica)行為,與下列何者缺乏最有關?","opts":["A. 氯","B. 磷","C. 鈉","D. 鎂"],"ans":1,"exp":"牛異嗜癖（pica）最常與磷缺乏（phosphorus deficiency）相關；磷缺乏的牛會出現啃骨頭（osteophagia）、吃泥土等異嗜行為，是磷缺乏的典型表現之一。","we":{"A":"A. 氯缺乏較少引起典型的異嗜癖。","B":"B. (正確) 磷缺乏（phosphoropenia）引起牛的異嗜癖最為常見，尤其表現為啃食骨頭（osteophagia）和泥土。","C":"C. 鈉缺乏可引起鹽分渴求，但典型異嗜癖以磷缺乏最相關。","D":"D. 鎂缺乏引起低鎂草痙攣，不是異嗜癖的主要病因。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_025","year":2020,"roc_year":109,"session":"","examNo":25,"q":"下列何種牛隻的手術部位,最不適用於帝王切開術(Cesarean section)?","opts":["A. right paralumbar laparotomy","B. left paralumbar laparotomy","C. ventral paramedian laparotomy","D. ventrolateral oblique laparotomy"],"ans":2,"exp":"牛帝王切開術（Cesarean section）各切口部位評估：ventral paramedian laparotomy需要牛採背臥姿（dorsal recumbency），在大型反芻動物中背臥造成嚴重的生理問題（瘤胃壓迫橫膈膜、呼吸障礙、靜脈回流受阻），是最不適合的切口方式；右脇腹、左脇腹、ventrolateral oblique均可在站立或側臥位執行。","we":{"A":"A. Right paralumbar laparotomy是牛帝王切開術的常用切口，可在站立位執行，適合。","B":"B. Left paralumbar laparotomy是牛帝王切開術最常用的切口之一，適合。","C":"C. (正確) Ventral paramedian laparotomy需要牛採背臥姿，在大型反芻動物中背臥極為危險（呼吸障礙、瘤胃壓迫），是最不適合的帝王切開術切口。","D":"D. Ventrolateral oblique laparotomy雖較不常用，但可在側臥位執行，風險低於背臥。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_026","year":2020,"roc_year":109,"session":"","examNo":26,"q":"豬隻的那一關節最少發生關節炎?","opts":["A. 膝關節","B. 髖關節","C. 腕關節","D. 跗關節"],"ans":0,"exp":"豬的關節炎最少發生在膝關節（stifle joint）；豬的常見關節炎好發於腕關節（carpal）、跗關節（tarsal）、趾關節（digital）以及肩關節等，膝關節（stifle，即後肢膝蓋）相對較少受累。","we":{"A":"A. (正確) 膝關節（stifle joint）是豬最少發生關節炎的部位，相較於其他常見受累關節（腕、跗、趾關節）明顯較少。","B":"B. 髖關節在豬也可發生（尤其感染性關節炎），但較不如其他關節常見。","C":"C. 腕關節是豬關節炎最常見的好發部位之一，尤其在集約飼養時。","D":"D. 跗關節也是豬常見的關節炎部位，受飼養地面影響大。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_027","year":2020,"roc_year":109,"session":"","examNo":27,"q":"母豬缺乏下列何種維生素最易引起仔豬先天性關節強直?","opts":["A. A","B. D","C. E","D. K"],"ans":0,"exp":"母豬缺乏維生素A最易引起仔豬先天性關節強直（arthrogryposis）；維生素A對胎兒的神經管、肌肉和骨骼系統的正常發育至關重要，缺乏時可導致胎兒神經肌肉發育異常，出現關節強直（肢體固定屈曲或伸展）。","we":{"A":"A. (正確) 母豬維生素A缺乏可引起胎兒神經肌肉發育障礙，導致先天性關節強直（arthrogryposis）。","B":"B. 維生素D缺乏引起骨骼礦化不良（佝僂病），不直接引起先天性關節強直。","C":"C. 維生素E缺乏引起白肌病（白肌病/桑椹心），不是關節強直的主因。","D":"D. 維生素K缺乏引起凝血功能障礙，不引起關節強直。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_028","year":2020,"roc_year":109,"session":"","examNo":28,"q":"大腸桿菌的腸毒素引起仔豬下痢的最主要機制是下列何項?","opts":["A. 增加腸道蠕動","B. 增加腸道分泌","C. 抑制腸吸收能力","D. 增加仔畜飲水量"],"ans":1,"exp":"大腸桿菌（E. coli）的腸毒素（enterotoxin）引起仔豬腹瀉的主要機制是刺激腸道上皮細胞增加腸液分泌（secretory diarrhea）：熱穩定毒素（ST）激活guanylyl cyclase，增加cGMP；熱不穩定毒素（LT）激活adenylyl cyclase，增加cAMP；兩者均導致Cl⁻分泌增加、Na⁺吸收受抑，引起腸液大量分泌。","we":{"A":"A. 腸毒素不主要增加腸道蠕動，腸蠕動增加見於其他機制（如炎性介質）。","B":"B. (正確) 腸毒素的主要機制是增加腸道分泌（secretory diarrhea），是大腸桿菌性仔豬下痢的核心病理機制。","C":"C. 腸毒素的主要效應是促進分泌而非抑制吸收（雖也有部分吸收抑制，但增加分泌是主要）。","D":"D. 增加飲水量不是腸毒素的直接機制，脫水後的飲水增加是繼發現象。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_029","year":2020,"roc_year":109,"session":"","examNo":29,"q":"雄性寵物豬幾歲進行去勢手術,最能減少因包皮憩室產生的異味?","opts":["A. 3月齡","B. 8月齡","C. 1歲","D. 2歲"],"ans":0,"exp":"雄性寵物豬的包皮憩室（preputial diverticulum）在睪固酮影響下會大量分泌惡臭分泌物；在青春期（約4-6月齡）前進行去勢，可防止憩室在睪固酮刺激下過度發育，最有效減少惡臭；3月齡是最佳去勢時機，此時憩室尚未因睪固酮充分發育。","we":{"A":"A. (正確) 3月齡前（青春期前）去勢，睪固酮尚未開始大量分泌，包皮憩室發育最小，去勢後異味最少。","B":"B. 8月齡已超過青春期，睪固酮已刺激憩室發育，去勢後雖可減少，但已錯過最佳時機。","C":"C. 1歲去勢效果遠不如3月齡，憩室已充分發育，臭味已定型。","D":"D. 2歲去勢最不理想，憩室已完全發育，異味持續時間最長。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_030","year":2020,"roc_year":109,"session":"","examNo":30,"q":"母貓正常懷孕期約為幾天?","opts":["A. 43~45","B. 63~65","C. 83~85","D. 103~105"],"ans":1,"exp":"母貓（queen）的正常妊娠期（gestation period）約為63-65天（約9週）。","we":{"A":"A. 43-45天妊娠期過短，相當於貓實際妊娠期的三分之二，不正確。","B":"B. (正確) 63-65天是母貓正常的妊娠期，此為獸醫臨床的標準數值。","C":"C. 83-85天妊娠期過長，超出正常範圍，不正確。","D":"D. 103-105天更長，超過正常範圍甚多，不正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_031","year":2020,"roc_year":109,"session":"","examNo":31,"q":"下列何種母畜之卵巢外型似桑椹様(mulberry-like)?","opts":["A. 牛","B. 豬","C. 犬","D. 馬"],"ans":1,"exp":"豬（swine）的卵巢在性成熟後表面有多個同時發育的濾泡和黃體突出，外觀呈多囊串珠狀，類似桑椹（mulberry-like appearance）；牛和馬的卵巢較光滑；犬的卵巢較小光滑。","we":{"A":"A. 牛卵巢呈橢圓形，較光滑，黃體和濾泡突出但不如豬多，不呈桑椹樣。","B":"B. (正確) 豬的卵巢性成熟後有多個濾泡和黃體同時突出，外觀似桑椹（mulberry-like），是豬卵巢的特徵。","C":"C. 犬的卵巢較小，橢圓形，有脂肪包覆，不呈桑椹狀。","D":"D. 馬的卵巢呈腎形，有排卵窩（ovulation fossa），外觀特殊但不是桑椹樣。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_032","year":2020,"roc_year":109,"session":"","examNo":32,"q":"公犬陰莖有灰紅色樣及肉樣團塊突起、易碎及出血,其為下列何種腫瘤的常見特徴?","opts":["A. transmissible venereal tumor","B. fibropapilloma","C. squamous cell carcinoma","D. melanoma"],"ans":0,"exp":"傳染性性病腫瘤（transmissible venereal tumor, TVT）是公犬陰莖最具特徵的腫瘤，外觀呈灰紅色/肉紅色菜花狀，表面易碎易出血；TVT是可透過性行為傳播的腫瘤細胞（allograft），在犬群中傳播。","we":{"A":"A. (正確) TVT（傳染性性病腫瘤）表現為陰莖上灰紅色、易碎、易出血的菜花狀團塊，是公犬陰莖最常見的腫瘤，符合題目描述。","B":"B. Fibropapilloma（纖維乳頭瘤）質地較硬，不呈典型灰紅色易碎外觀。","C":"C. Squamous cell carcinoma（鱗狀細胞癌）可見於包皮和陰莖，但TVT更典型符合描述。","D":"D. Melanoma（黑色素瘤）通常有色素，不呈灰紅色菜花狀。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_033","year":2020,"roc_year":109,"session":"","examNo":33,"q":"犬貓分娩時,若生殖道有墨綠色或紅棕色的分泌物,其最可能為下列何者?","opts":["A. 胎糞","B. 胎盤剝離","C. 羊水","D. 子宮破裂"],"ans":1,"exp":"犬貓分娩時出現墨綠色或紅棕色陰道分泌物，是正常分娩的徵兆，代表胎盤開始剝離（placental separation）；分娩時胎盤邊緣竇（marginal sinus）的血液氧化後形成尿素素（uteroverdin），呈現特殊的墨綠色，是正常胎盤剝離的表現。","we":{"A":"A. 胎糞（meconium）呈暗綠色，見於胎兒在宮內缺氧時排出，但典型墨綠色/紅棕色分泌物是胎盤剝離，而非胎糞。","B":"B. (正確) 墨綠色或紅棕色的陰道分泌物代表胎盤開始剝離（uteroverdin出現），是正常分娩第一期至第二期的表現。","C":"C. 羊水呈清澈或淡黃色，不是墨綠色/紅棕色。","D":"D. 子宮破裂是緊急狀況，通常出現大量鮮血和腹膜炎症狀，不是典型墨綠色分泌物。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_034","year":2020,"roc_year":109,"session":"","examNo":34,"q":"牛隻難產,胎兒胎位、胎向、胎勢分別為anteior presentation,dorsal position, right carpal flexion,下列處置何\r 者最為適當?","opts":["A. 以碎胎術切除左後肢后,將胎兒向外拉出","B. 以手握住右前腳蹄部向前拉伸後,將胎兒直接向外拉出","C. 以繩索套住下顎向左方拉伸後,將胎兒向外拉出","D. 以助產器直接將胎兒向外拉出"],"ans":1,"exp":"牛難產，anterior presentation（頭先出）、dorsal position（背向上）、right carpal flexion（右腕關節屈曲）：需先矯正右前肢的腕關節屈曲，方法是：以手握住右前腳蹄部向前推送（扶起蹄部）再向外拉伸，伸直腕關節，使右前肢完全伸展後，再助產將胎兒拉出。","we":{"A":"A. 碎胎術切除左後肢不符合此胎位（胎兒是前肢先出，右腕屈曲），且碎胎術是最後手段。","B":"B. (正確) 握住右前腳蹄部向前推送後拉伸，可矯正右腕關節屈曲（right carpal flexion），是最適當的矯正手法。","C":"C. 以繩索套下顎向左拉伸，不能矯正腕關節屈曲，且方向錯誤。","D":"D. 在腕關節未矯正前直接以助產器拉出會損傷產道，應先矯正胎勢。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_035","year":2020,"roc_year":109,"session":"","examNo":35,"q":"有關牛隻對子宮炎的自體防禦系統,下列敘述何者錯誤?","opts":["A. 黄體助孕索會影響子宮局部免疫機能","B. 牛隻發情時,子宮局部免疫機能會下降","C. 營養不良會造成免疫機能下降,因而容易發生子宮炎","D. 脂肪肝會造成免疫機能下降,因而容易發生子宮炎"],"ans":1,"exp":"牛發情（estrus）時，雌激素（estrogen）水平升高；雌激素實際上能增強子宮局部免疫功能（促進白血球趨化、增強子宮防禦），而非降低；孕酮（progesterone, 黃體期）才會抑制子宮免疫機能，使感染風險增加。說「發情時子宮局部免疫機能下降」是錯誤的。","we":{"A":"A. 黃體（孕酮）確實影響子宮局部免疫，孕酮抑制免疫造成黃體期感染風險增加，正確。","B":"B. (正確) 發情時雌激素升高，子宮局部免疫機能是增強而非下降，「發情時免疫下降」是錯誤描述。","C":"C. 營養不良→免疫機能下降→易發子宮炎，描述正確。","D":"D. 脂肪肝→免疫機能下降→易發子宮炎，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_036","year":2020,"roc_year":109,"session":"","examNo":36,"q":"有關牛隻產後會陰撕裂傷,下列敘述何者錯誤?","opts":["A. 女牛較常發生","B. 第二級撕裂傷牽涉到肌肉,曾影響外陰閉合造成空氣容易進入陰道","C. 第三級撕裂傷應儘早縫合撕裂傷口,以避免後續感染而有較好的預後","D. 第三級撕裂傷傷及肛門括約肌,易使糞便掉入陰道"],"ans":2,"exp":"牛產後會陰撕裂傷第三級（3rd degree perineal laceration）傷及肛門括約肌和直腸壁，使直腸和陰道形成共通通道（rectovaginal fistula），糞便容易進入陰道。治療需延遲縫合（delayed repair），等待急性炎症和感染消退（通常需4-6週），才進行修補；「應儘早縫合以避免感染有較好預後」是錯誤的，因為急性期縫合因污染嚴重，傷口容易裂開，預後反而差。","we":{"A":"A. 女牛（初產）較常發生會陰撕裂傷，描述正確。","B":"B. 第二級撕裂傷及肌肉，破壞外陰的密閉性，描述正確。","C":"C. (正確) 第三級撕裂傷應延遲縫合（而非立即縫合），急性期立即縫合因污染嚴重易失敗，需等炎症消退後修補，預後才較好。","D":"D. 第三級撕裂傷傷及肛門括約肌，糞便易落入陰道，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_037","year":2020,"roc_year":109,"session":"","examNo":37,"q":"牛分娩過程可分成幾期?","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":2,"exp":"牛分娩（parturition）過程分為三期：第一期（子宮頸擴張期、陣痛開始）、第二期（胎兒娩出期）、第三期（胎衣娩出期）；共3期。","we":{"A":"A. 分娩分3期，不是1期。","B":"B. 分娩分3期，不是2期。","C":"C. (正確) 牛分娩分3期：第一期子宮頸擴張、第二期胎兒娩出、第三期胎衣娩出。","D":"D. 分娩分3期，不是4期。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_038","year":2020,"roc_year":109,"session":"","examNo":38,"q":"牛人工授精多少天後再發情者,最可以推定為胚胎死亡所致?","opts":["A. 8~14","B. 16~20","C. 25-40","D. ＞60"],"ans":2,"exp":"牛人工授精後發情週期：正常週期18-21天；若AI後25-40天再發情，表示受精後胚胎在著床後（約17-25天）才死亡，造成黃體延遲退化，發情延後；這是典型的早期胚胎死亡（early embryonic death）時間窗口。","we":{"A":"A. 8-14天再發情：多為配種失敗（受精失敗）、正常週期縮短，通常不代表胚胎死亡。","B":"B. 16-20天再發情：接近正常週期，可能受精失敗或著床前胚胎死亡。","C":"C. (正確) 25-40天再發情：超過正常週期，代表胚胎在著床後死亡（early embryonic death），黃體延遲退化後才發情，是最典型的胚胎死亡表現。","D":"D. >60天再發情：屬晚期胚胎死亡或胎兒死亡，較少見於「胚胎死亡」的主要時間窗口。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_039","year":2020,"roc_year":109,"session":"","examNo":39,"q":"有關牛黃體發育不全的敘述,下列何項錯誤?","opts":["A. 一般再將其分為發育不全黄體與嚢腫性黄體兩種","B. 囊腫性黄體為排卵後7~14天間之黄體,其含液體之內腔顯著增大而周圍黄體組織變薄","C. 囊腫性黄體通常不會自然退化","D. 囊腫性黃體可能與低受胎牛之不孕症有關"],"ans":2,"exp":"囊腫性黃體（luteal cyst）的特點：黃體中心有液體積聚，周圍黃體組織存在且有功能；與濾泡囊腫不同，囊腫性黃體有功能（分泌孕酮）並可「自然退化」（通常在正常的黃體退化週期中消退）；說「通常不會自然退化」是錯誤的。","we":{"A":"A. 黃體發育不全分發育不全黃體和囊腫性黃體兩型，描述正確。","B":"B. 囊腫性黃體為排卵後7-14天間出現，含液體內腔，周圍黃體組織，描述正確。","C":"C. (正確) 囊腫性黃體「通常不會自然退化」是錯誤的——囊腫性黃體可以自然退化（經正常黃體退化週期），說「不會」是錯誤的描述。","D":"D. 囊腫性黃體可能與低受胎牛不孕有關，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_040","year":2020,"roc_year":109,"session":"","examNo":40,"q":"犬隻依正常劑量口服furosemide後,其藥效最長可維持多少小時?","opts":["A. 1","B. 3","C. 6","D. 12"],"ans":2,"exp":"Furosemide（速尿）在犬口服（PO）的藥效持續時間約4-6小時；靜脈注射效果更短（約2小時）；選項C（6小時）是口服furosemide的最長藥效持續時間的合理上限。","we":{"A":"A. 1小時持續時間過短，口服furosemide效果可維持更久。","B":"B. 3小時也偏短，口服劑型吸收後達到更長的作用時間。","C":"C. (正確) 口服furosemide在犬的藥效最長可維持約6小時，C是正確的上限估計。","D":"D. 12小時過長，口服furosemide的實際持續時間通常為4-8小時，12小時超過一般範圍。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_041","year":2020,"roc_year":109,"session":"","examNo":41,"q":"犬貓低血鉀時,會使心電圖波形發生什麽變化?","opts":["A. P波平坦(flat P wave)","B. QRS波變寬(widened QRS)","C. T波變尖 (peaked T wave)","D. QT間隔延長 (prolonged QT interval )"],"ans":3,"exp":"低血鉀（hypokalemia）對心電圖的影響：T波變平或倒置（T wave flattening/inversion）、U波出現（prominent U wave）、QT間隔延長（prolonged QT interval）；T波高尖（peaked T wave）和P波平坦（flat P wave）是高鉀血症的表現。低血鉀的最具特徵的ECG變化是QT間隔延長。","we":{"A":"A. P波平坦（flat P wave）是高鉀血症的表現，不是低血鉀。","B":"B. QRS波增寬（widened QRS）是高鉀血症進展的表現，不是低血鉀。","C":"C. T波高尖（peaked T wave）是高鉀血症最早期的ECG特徵，不是低血鉀。","D":"D. (正確) QT間隔延長（prolonged QT interval）是低鉀血症的典型ECG表現，QT延長增加心律不整風險。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_042","year":2020,"roc_year":109,"session":"","examNo":42,"q":"有關犬貓口腔鱗狀細胞瘤,下列敘述何者錯誤?","opts":["A. 常可見不癒合傷口、潰瘍病灶、持續出血","B. piroxicam治療可能有效","C. 通常以局部淋巴結轉移為主,治療以局部治療為主","D. 一般對於化療反應良好,首選用藥為長春新鹼(vincristine)"],"ans":3,"exp":"口腔鱗狀細胞瘤（oral SCC）在犬的特點：局部侵犯骨組織、轉移率依部位而定（舌SCC轉移率高）、通常對化療反應差；vincristine（長春新鹼）是淋巴瘤和TVT的用藥，不是口腔SCC的首選化療藥，且SCC對化療整體反應不佳。","we":{"A":"A. 口腔SCC常見不癒合潰瘍和出血，描述正確。","B":"B. Piroxicam（COX-2抑制劑）對口腔SCC可能有抗腫瘤和止痛效果，描述正確。","C":"C. 口腔SCC主要局部侵犯，轉移率相對低（尾側上頜和舌SCC例外），局部治療為主，描述正確。","D":"D. (正確) 口腔SCC對化療反應差，vincristine是淋巴瘤/TVT的用藥，不是口腔SCC的首選藥物，描述錯誤。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_043","year":2020,"roc_year":109,"session":"","examNo":43,"q":"有關犬骨肉瘤之敘述,下列何者正確?","opts":["A. 通常好發於中小型犬","B. 血液及放射線學影像檢查為最可靠的確診方法","C. 血清檢查之ALKP數值,具有預後判讀的意義","D. 常見於四肢,尤其肘關節附近最常見"],"ans":2,"exp":"犬骨肉瘤（osteosarcoma）：好發大型犬、大型品種；確診需組織病理（不是血液+X光）；ALKP（ALP）升高有預後意義（高ALP→預後差，轉移早）；四肢好發部位以遠端橈骨和近端肱骨最常見，不是肘關節。","we":{"A":"A. 骨肉瘤好發於大型犬，不是中小型犬，描述錯誤。","B":"B. 血液+X光可高度懷疑，但確診需組織病理（biopsy），描述錯誤。","C":"C. (正確) 血清ALKP（ALP）升高在骨肉瘤中具有預後判讀意義，高ALP與轉移和預後差相關。","D":"D. 四肢骨肉瘤好發於遠端橈骨和近端肱骨，不是肘關節附近，描述錯誤。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_044","year":2020,"roc_year":109,"session":"","examNo":44,"q":"下列何組血檢資料,最可能是犬嚴重肝硬化的表現?","opts":["A. 嚴重上升的ALT,輕微上升的ALKP及膽紅素濃度,正常血中膽酸濃度","B. 輕微上升的ALT,嚴重上升的ALP濃度,中等增加的膽紅素濃度,正常之血中膽酸濃度","C. 嚴重上升的ALT,輕微上升的ALKP及膽紅素濃度,血中膽酸濃度上升","D. 正常ALT、ALKP及膽紅素濃度,血中膽酸濃度上升"],"ans":3,"exp":"嚴重肝硬化（cirrhosis）的血液生化特點：功能性肝細胞大量喪失，肝細胞不再持續壞死→ALT不顯著升高（甚至正常）；ALKP可輕微升高（膽管增生）；膽紅素視膽汁淤積程度；但血中膽酸（bile acids）顯著升高，因肝臟無法清除門脈循環的膽酸，這是最具特徵的表現。","we":{"A":"A. ALT嚴重升高代表急性/活躍性肝炎（肝細胞大量壞死），不符合終末期肝硬化（已無足夠肝細胞釋放ALT）。","B":"B. ALKP嚴重升高更符合膽管疾病（如膽管炎）或類固醇性肝病，不特異於肝硬化。","C":"C. 嚴重ALT升高配合輕微ALKP、膽紅素升高，更符合活躍性肝炎而非穩定期肝硬化。","D":"D. (正確) 嚴重肝硬化時，ALT/ALKP/膽紅素可以正常或輕微升高，但血中膽酸（bile acids）顯著升高是肝功能不足的最靈敏指標，最符合肝硬化。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_045","year":2020,"roc_year":109,"session":"","examNo":45,"q":"下列何者引起犬隻肺動脈栓塞pulmonary thromboembolism)的可能性最低?","opts":["A. 手術","B. 自體免疫性溶血(IMHA)","C. 胰臟炎","D. 支氣管炎"],"ans":3,"exp":"肺動脈栓塞（pulmonary thromboembolism, PTE）的風險因子包括高凝血狀態：手術（血管損傷、制動）、IMHA（溶血→血小板活化）、胰臟炎（炎症→高凝血）；支氣管炎（D）是局部呼吸道炎症，不造成全身高凝血狀態，是PTE可能性最低的原因。","we":{"A":"A. 手術造成組織損傷、血管內皮暴露，是PTE的風險因子。","B":"B. IMHA（自體免疫溶血性貧血）引起血小板過度活化和高凝血狀態，是犬PTE重要風險因子。","C":"C. 胰臟炎引起全身性炎症反應，可激活凝血系統，是PTE的風險因子。","D":"D. (正確) 支氣管炎是局部呼吸道炎症，不直接引起全身高凝血狀態，引起PTE的可能性最低。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_046","year":2020,"roc_year":109,"session":"","examNo":46,"q":"在水合狀態正常的犬貓,絕對性寡尿absoluteliguria)的定義標準是尿液產生量低於多少mL/kg/h?","opts":["A. 4","B. 3","C. 2","D. 1"],"ans":3,"exp":"絕對性寡尿（absolute oliguria）的定義：在水分充足（euhydrated）的犬貓，尿液產生量低於1 mL/kg/hr即為寡尿（oliguria）；低於0.25 mL/kg/hr為無尿（anuria）。選項D（1 mL/kg/hr）是寡尿的臨床定義標準。","we":{"A":"A. 4 mL/kg/hr是正常到偏高的尿液產生量，遠超過寡尿的定義。","B":"B. 3 mL/kg/hr仍為正常範圍，不符合寡尿定義。","C":"C. 2 mL/kg/hr是正常尿液產生量的上限，尚在正常範圍。","D":"D. (正確) 水合正常的犬貓尿液產生量低於1 mL/kg/hr即定義為寡尿（oliguria），是臨床上評估腎功能的重要標準。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_047","year":2020,"roc_year":109,"session":"","examNo":47,"q":"犬貓在急性嚴重低血鈉症情況下,補充鈉之速度不宜過快,一般建議多少mq/L/hr最合適?","opts":["A. 0.5 ~ 1.0","B. 1.1~1.5","C. 1.6~2.0","D. 2.1 ~3.0"],"ans":0,"exp":"急性嚴重低血鈉症（acute severe hyponatremia）的補鈉速度不宜過快，以防止橋腦中央脫髓鞘症（osmotic demyelination syndrome, ODS）；建議補充鈉的速度不超過0.5-1.0 mEq/L/hr（最大不超過10-12 mEq/L/day），以允許腦細胞逐漸調整滲透壓。","we":{"A":"A. (正確) 0.5-1.0 mEq/L/hr是公認的安全補鈉速度，可防止滲透壓性脫髓鞘症（ODS）的發生。","B":"B. 1.1-1.5 mEq/L/hr偏快，可能超過每日最大校正速度（10-12 mEq/L/day），有ODS風險。","C":"C. 1.6-2.0 mEq/L/hr速度過快，顯著增加ODS風險。","D":"D. 2.1-3.0 mEq/L/hr非常危險，此速度快速糾正會導致橋腦中央脫髓鞘。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_048","year":2020,"roc_year":109,"session":"","examNo":48,"q":"13歲哈士奇(Husky)犬呈現消瘦、虛弱、喘、食慾廢絕、尿失禁,胸腔影像如下圖,下列敘迹何者正確?","opts":["A. 後肺葉血管直徑變大","B. 有氣胸(pneumothorax)","C. 有胸膜腔積液 pleuraleffusion)","D. 心臟變小,可能和嚴重脫水有關"],"ans":0,"exp":"13歲哈士奇老年犬胸腔X光（有咳嗽、喘等症狀）：X光顯示後肺葉血管增粗（enlarged caudal pulmonary vasculature）是最符合老年大型犬的變化，可能與心臟病（如二尖瓣/三尖瓣疾病）或肺血管疾病相關，後肺葉血管直徑變大是重要異常。（此題為圖片題，標記待複查）","we":{"A":"A. (最可能) 後肺葉血管直徑變大（enlarged caudal lobar pulmonary vessels）在老年犬的心臟病或肺血管病中最常見。","B":"B. 氣胸（pneumothorax）在X光顯示為肺葉收縮和胸腔氣體無肺紋，與此描述不符。","C":"C. 胸膜腔積液（pleural effusion）X光顯示為胸腔均勻密度增加，不是後肺葉血管改變。","D":"D. 心臟變小可能與嚴重脫水有關，但老年犬更常見的是心臟變大，且脫水不會引起後肺葉血管改變。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_049","year":2020,"roc_year":109,"session":"","examNo":49,"q":"犬右主動脈弓永存,會壓迫食道之那個部位?","opts":["A. 頸部","B. 心基部","C. 心臟后緣","D. 橫膈膜"],"ans":1,"exp":"右主動脈弓永存（persistent right aortic arch, PRAA）：正常主動脈弓在左側發育，若右側主動脈弓永存，右側主動脈弓與左側肺動脈（透過動脈韌帶）及左支氣管共同形成血管環（vascular ring），壓迫食道在心基部（heart base）水平，造成食道憩室和巨食道。","we":{"A":"A. 食道頸部不受PRAA直接壓迫，PRAA壓迫點在心基部。","B":"B. (正確) PRAA形成的血管環壓迫食道在心基部（heart base），造成心基部前方食道擴張（megaesophagus）。","C":"C. 心臟後緣（caudal cardiac border）不是PRAA壓迫食道的位置。","D":"D. 橫膈膜更靠後，不是PRAA的壓迫位置。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_050","year":2020,"roc_year":109,"session":"","examNo":50,"q":"心衰竭使用利尿劑 spironolactone時,尿液中的離子會有何變化?","opts":["A. 增加鈉離子與鉀離子排出","B. 減少鈉離子與鉀離子排出","C. 增加鈉離子排出、減少鉀離子排出","D. 減少鈉離子排出、增加鉀離子排出"],"ans":2,"exp":"Spironolactone（螺內酯）是醛固酮拮抗劑（aldosterone antagonist）/保鉀利尿劑：拮抗醛固酮的作用→遠腎小管和集合管Na⁺重吸收減少（增加Na⁺排出）+ K⁺分泌減少（減少K⁺排出，保鉀）；淨效果：增加鈉排出、減少鉀排出。","we":{"A":"A. 增加鈉和鉀均排出是furosemide等loop利尿劑的效果，不是spironolactone。","B":"B. 減少鈉和鉀均排出描述錯誤，spironolactone會增加鈉排出。","C":"C. (正確) Spironolactone增加鈉離子排出（拮抗醛固酮鈉重吸收）並減少鉀離子排出（保鉀），是保鉀利尿劑的典型效果。","D":"D. 減少鈉排出和增加鉀排出與spironolactone機制相反（描述了aldosterone的效果，非其拮抗劑）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_051","year":2020,"roc_year":109,"session":"","examNo":51,"q":"下列何者較不可能為貓糖尿病的發病因子?","opts":["A. 肝臟慢性炎症","B. 長期使用類固醇藥物","C. 胰臟炎","D. 消瘦"],"ans":3,"exp":"貓糖尿病（feline diabetes mellitus）的發病因子：肥胖、長期類固醇使用、胰臟炎、肢端肥大症（acromegaly）、甲狀腺功能亢進等均是重要發病因子；「消瘦」（D）是糖尿病的臨床症狀/後果，而非引發糖尿病的原因（肥胖才是風險因子，消瘦是胰島素缺乏後分解代謝增加的結果）。","we":{"A":"A. 肝臟慢性炎症可能影響胰島素抵抗，但關係較間接，仍比消瘦更相關。","B":"B. 長期類固醇使用引起類固醇性糖尿病（insulin resistance），是重要發病因子。","C":"C. 胰臟炎破壞胰島素分泌細胞，是貓糖尿病最重要的病因之一。","D":"D. (正確) 消瘦是糖尿病的結果（因胰島素缺乏→分解代謝↑→肌肉和脂肪消耗），而非發病因子；肥胖才是風險因子，故消瘦最不可能是發病因子。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_052","year":2020,"roc_year":109,"session":"","examNo":52,"q":"下列何項病毒感染與貓腎臟疾病最不相關?","opts":["A. 貓免疫不全病毒(feline immunodeficiency virus)","B. 貓疱疹病毒(feline herpesvirus)","C. 貓冠狀病毒(feline coronavirus)","D. 貓白血病病毒(feline leukemia virus )"],"ans":1,"exp":"貓腎臟疾病相關病毒：FIV（腎小球腎炎）、FCoV（FIP引起腎小球炎）、FeLV（腎臟淋巴瘤、腎小球病變）均與貓腎臟疾病有關；FHV-1（貓疱疹病毒第一型）主要引起上呼吸道感染和角膜炎，與貓腎臟疾病最不相關。","we":{"A":"A. FIV可引起免疫複合物沉積性腎小球腎炎，與腎臟疾病相關。","B":"B. (正確) FHV-1（貓疱疹病毒第一型）主要引起貓病毒性鼻氣管炎（FVR），與貓腎臟疾病最不相關，是本題正確選項。","C":"C. FCoV（貓冠狀病毒）引起FIP，乾性FIP可引起肉芽腫性腎炎，與腎臟疾病相關。","D":"D. FeLV可引起腎臟淋巴瘤和腎小球病變，與腎臟疾病相關。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_053","year":2020,"roc_year":109,"session":"","examNo":53,"q":"貓罹患傳染性腹膜炎時,最主要的眼睛病變為何?","opts":["A. 角膜潰瘍","B. 結膜炎","C. 葡萄膜炎","D. 化膿性視神經炎"],"ans":2,"exp":"貓傳染性腹膜炎（FIP）是免疫複合物（antigen-antibody complex）沉積引起的全身性血管炎；眼部最主要病變為葡萄膜炎（uveitis），包括前葡萄膜炎（虹膜睫狀體炎）和後葡萄膜炎（視網膜血管炎），是FIP眼部受累的典型表現。","we":{"A":"A. 角膜潰瘍不是FIP的典型眼部病變，角膜潰瘍見於FHV-1感染。","B":"B. 結膜炎不是FIP的主要眼部表現，FHV-1和FCV更常引起結膜炎。","C":"C. (正確) 葡萄膜炎（uveitis）是FIP最主要的眼部病變，是FIP全身性血管炎在眼部的表現，包括前後葡萄膜炎。","D":"D. 化膿性視神經炎在FIP較少見，葡萄膜炎才是最主要的眼部表現。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_054","year":2020,"roc_year":109,"session":"","examNo":54,"q":"有關犬貓術後復健工具使用時機,下列敘迹何者錯誤?","opts":["A. 感染性的傷口可以使用冷雷射進行治療","B. Tibial Plateau Leveling Osteotomy(TPLO)術後第2天就可以開始進行水中跑步機的治療","C. 乳房腫瘤切除術後當天傷口縫合處不可進行熱敷","D. 骨折以骨板固定後,應避免在骨板的上方使用超音波治療"],"ans":1,"exp":"TPLO（Tibial Plateau Leveling Osteotomy）術後第2天開始水中跑步機（hydrotherapy）是不當的；TPLO是骨科手術，術後傷口需初期癒合（通常建議術後2週以上才開始積極水療），第2天術後切口仍新鮮，感染風險高，且骨頭尚未癒合，水中跑步機過早使用是錯誤的。","we":{"A":"A. 冷雷射對感染傷口有抗炎效果，可謹慎使用，有臨床依據，非最不適當。","B":"B. (正確) TPLO術後第2天即開始水中跑步機過早，此時傷口剛縫合，感染風險高，骨骼固定尚不穩固，應等待傷口癒合後（通常術後2週以上）才開始。","C":"C. 乳房腫瘤切除術後當天不做熱敷（急性期冷敷）是正確的，此描述不是錯誤。","D":"D. 骨板固定後避免在骨板上方使用超音波治療（防止金屬過熱）是正確的注意事項。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_055","year":2020,"roc_year":109,"session":"","examNo":55,"q":"有關犬貓脊髓損傷造成的Schiff-Sherrington postue下列敘述何者錯誤?","opts":["A. 因脊髓灰質的border cells訊息傳遞受阻所致","B. 呈現前肢僵直,后肢無力的症狀","C. 損傷部位在於頸椎","D. 與預后無關"],"ans":2,"exp":"Schiff-Sherrington posture（Schiff-Sherrington現象）：特點是前肢伸肌痙攣（僵直）、後肢截癱；發生機制是胸腰段（T3-L3）脊髓損傷，導致「邊緣細胞」（border cells）向前肢伸肌發送的抑制信號中斷，前肢伸肌失去抑制→痙攣；損傷部位在胸腰段（T3-L3），不是頸椎。","we":{"A":"A. 脊髓灰質的border cells（L4-L7節段）正常向前肢伸肌發送抑制信號，受損後前肢痙攣，描述正確。","B":"B. 前肢僵直（伸肌反射亢進）、後肢無力/截癱，描述正確。","C":"C. (正確) Schiff-Sherrington posture的損傷部位在胸腰段（T3-L3），而非頸椎；頸椎損傷引起的是四肢麻痺，不是Schiff-Sherrington表現。","D":"D. Schiff-Sherrington posture與預後無直接相關（不意味著好壞），描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_056","year":2020,"roc_year":109,"session":"","examNo":56,"q":"犬貓原發性骨腫瘤 (primary bone tumors)最常從何部位産生?","opts":["A. 骨幹 (diaphysis)","B. 幹骺端(metaphysis)","C. 骨骺 (epiphysis)","D. 骨膜 (periosteum)"],"ans":1,"exp":"骨腫瘤（包括骨肉瘤）最常起源於長骨的幹骺端（metaphysis）；幹骺端是骨骼生長最活躍的部位，血供豐富，骨肉瘤好發於此處；犬貓骨肉瘤最常見部位：遠端橈骨、近端肱骨、遠端股骨、近端脛骨等均在幹骺端。","we":{"A":"A. 骨幹（diaphysis）的血供相對較少，骨肉瘤較少發生於此。","B":"B. (正確) 幹骺端（metaphysis）是骨腫瘤最常起源的部位，尤其骨肉瘤好發於長骨幹骺端的高代謝區域。","C":"C. 骨骺（epiphysis）骨腫瘤較少見，通常在閉合後較靜止。","D":"D. 骨膜腫瘤（periosteal osteosarcoma）存在但較少見，不是最主要起源。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_057","year":2020,"roc_year":109,"session":"","examNo":57,"q":"當隻使用過量的鴉片類藥物,產生嚴重副作用時,可使用何種藥物解除鴉片類藥物的作用?","opts":["A. flumazenil","B. atipamezole","C. yohimbine","D. naloxone"],"ans":3,"exp":"各類拮抗劑（reversal agents）：flumazenil（氟馬澤尼）拮抗苯二氮平類；atipamezole（阿替帕莫唑）拮抗α₂促效劑（medetomidine等）；yohimbine拮抗α₂促效劑（xylazine）；naloxone（納洛酮）是鴉片受體拮抗劑，用於逆轉嗎啡、meperidine等鴉片類藥物的過量效應。","we":{"A":"A. Flumazenil是苯二氮平類拮抗劑，不能逆轉鴉片類藥物。","B":"B. Atipamezole是α₂促效劑拮抗劑，不能逆轉鴉片類藥物。","C":"C. Yohimbine也是α₂拮抗劑，不能逆轉鴉片類藥物。","D":"D. (正確) Naloxone（納洛酮）是鴉片受體（μ、κ、δ）競爭性拮抗劑，是鴉片類藥物過量的唯一特異性解毒劑。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_058","year":2020,"roc_year":109,"session":"","examNo":58,"q":"有關犬貓常見腫瘤之預防,下列敘述何者錯誤?","opts":["A. 早期(1歲之前)做卵巢摘除可以減少母犬乳腺癌發生的風險,與未施行母犬比較會有200倍的差距","B. 公犬施行castration可預防睪丸癌","C. 公犬施行castratio並不能減少圍肛腺腺瘤的發生","D. 隱睪症的睪丸容易發生腫瘤,若將其摘除,亦是一種預防腫瘤發生的方法"],"ans":2,"exp":"圍肛腺腺瘤（perianal gland adenoma/circumanal gland adenoma）是雄激素依賴性腫瘤，公犬常見；去勢（castration）後睪固酮下降，可使現有腫瘤消退（regression）並預防新發；說「castration不能減少圍肛腺腺瘤的發生」是錯誤的，castration恰恰是其治療和預防的重要方法。","we":{"A":"A. 1歲前卵巢摘除可顯著降低乳腺腫瘤風險（初次發情前手術降低99.5%），描述方向正確。","B":"B. 公犬castration可摘除睪丸，直接預防睪丸腫瘤，描述正確。","C":"C. (正確) 公犬castration確實能減少圍肛腺腺瘤（perianal adenoma）的發生（因為該腫瘤是雄激素依賴性），說「不能減少」是錯誤的描述。","D":"D. 隱睪症的睪丸容易惡變，摘除是預防措施，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_059","year":2020,"roc_year":109,"session":"","examNo":59,"q":"動脈壓力測量為手術中必須監控的生理數值。其中平均動脈壓(P m )是由收縮壓(P s )及舒張壓(P d )換算 而來,其計算方式為何?","opts":["A. P m =P d + 1/3 (P s -P d )","B. P m =1/2 (P s + P d )","C. P m= P s + 1/3 (P s + P d )","D. P m = P d +1/3(P s +P d )"],"ans":0,"exp":"平均動脈壓（MAP）計算公式：MAP = DBP + 1/3（SBP - DBP）= 舒張壓 + 1/3 × 脈壓差；即MAP = Pd + 1/3（Ps - Pd）。此公式基於心動週期中舒張期占約2/3時間、收縮期占約1/3時間的血壓加權平均。","we":{"A":"A. (正確) MAP = Pd + 1/3（Ps - Pd）是正確的平均動脈壓計算公式，也可改寫為MAP = 1/3 Ps + 2/3 Pd。","B":"B. MAP = 1/2（Ps + Pd）是簡單算術平均，不考慮舒張期更長的加權，誤差較大。","C":"C. MAP = Ps + 1/3（Ps + Pd）計算結果會過高，公式錯誤。","D":"D. MAP = Pd + 1/3（Ps + Pd）計算結果也不正確（分母應是差值，不是和）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_060","year":2020,"roc_year":109,"session":"","examNo":60,"q":"關於犬唾液囊腫 (salivary mucocele)的診斷,以cervicalmucocel為例,下列何者最不適當?","opts":["A. 可詢問飼主當初發現時的位置來協助診斷","B. 可使病患背側躺來看囊腫因引力作用而向那一側移動來决定","C. 可直接抽吸内容物,若是唾液,則可見清澈、淡黄色或含血樣之黏稠黏液樣液體","D. 有必要使用簡單方便之sialography由salivary duct注人水溶性有機碘來辨認位置"],"ans":3,"exp":"犬頸部唾液囊腫（cervical mucocele）的診斷：病史、頭低垂確認囊腫側別、直接抽吸確認分泌物性質均為簡單有效的診斷方法；唾腺管造影（sialography）需向唾腺管注入碘液，是侵入性且複雜的檢查，對絕大多數mucocele不是必要的診斷方法，是「最不適當」（過度侵入性）的選項。","we":{"A":"A. 詢問飼主當初發現位置有助於確認哪側唾腺受累，是適當的問診方式。","B":"B. 讓病患背躺觀察囊腫移向哪側可確認患側，是適當且非侵入性的診斷方法。","C":"C. 直接抽吸內容物（若呈黏稠黃色液體）可確認為唾液，是標準診斷方式。","D":"D. (正確) Sialography（唾腺管造影）侵入性高、技術複雜且對多數mucocele並非必要，是本題「最不適當」的診斷方法。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_061","year":2020,"roc_year":109,"session":"","examNo":61,"q":"膝反射 (patellar reflex)檢查包含下列那一條神經?","opts":["A. 坐骨神經(sciatic nerve)","B. 股神經 (femoral nerve)","C. 陰神經 (pudendal nerve)","D. 脛骨神經(tibial nerve)"],"ans":1,"exp":"膝反射（patellar reflex）的反射弧：感覺傳入（髕韌帶牽拉股四頭肌腱梭）→ 股神經（femoral nerve）傳入纖維→ L4節段 → 股神經運動纖維 → 股四頭肌（quadriceps femoris）收縮。股神經（femoral nerve）是膝反射的關鍵神經。","we":{"A":"A. 坐骨神經支配後肢屈肌和腓腸肌，不參與膝反射。","B":"B. (正確) 股神經（femoral nerve）支配股四頭肌，是膝反射的傳入和傳出神經，為膝反射的核心神經。","C":"C. 陰神經（pudendal nerve）支配會陰部，不參與膝反射。","D":"D. 脛骨神經是坐骨神經分支，支配後肢屈肌群，不是膝反射的神經。"},"needs_review":false,"imgs":[]}
