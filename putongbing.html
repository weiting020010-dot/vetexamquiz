ric omentopexy）固定效果較好，復發率相對較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_026","year":2024,"roc_year":113,"session":"","examNo":26,"q":"下列何項是可吸收縫線？","opts":["A. nylon","B. polyesters","C. silk","D. polydioxanone"],"ans":3,"exp":"問「哪種縫線是可吸收的」。Polydioxanone（PDS）是可吸收合成縫線，在體內水解，D正確。","we":["Polypropylene（prolene）是不可吸收縫線，常用於血管或皮膚縫合。","Polyester（dacron）是不可吸收縫線，常用於心臟瓣膜修補等。","Nylon 是不可吸收縫線（或極慢吸收），常用於皮膚縫合。","Polydioxanone（PDS）是可吸收縫線，吸收時間約180天，常用於腹壁或軟組織縫合，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_027","year":2024,"roc_year":113,"session":"","examNo":27,"q":"下列四種日糧給予方式中，何項最能防止山羊之姙娠毒血症？","opts":["A. 於懷孕末期提供適當比例之穀類","B. 於懷孕末期提供較高比例之乾草","C. 於懷孕前期提供適當比例之穀類","D. 於懷孕前期提供較高比例之乾草"],"ans":0,"exp":"山羊在妊娠後期給予適量穀物（grain）可提供能量，預防妊娠毒血症（pregnancy toxemia）。減少懷孕末期的負能量平衡是預防的關鍵，A正確。","we":["妊娠後期補充適量穀物（grain）提供能量，可有效預防山羊妊娠毒血症（pregnancy toxemia），A正確。","妊娠期間過度限制飲食反而會加重負能量平衡，增加妊娠毒血症風險。","注射丙二醇（propylene glycol）是治療性措施，非預防性飼養管理策略。","分娩後才補充能量對預防妊娠毒血症已無效，預防需在懷孕期管理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_028","year":2024,"roc_year":113,"session":"","examNo":28,"q":"利用繩或鏈之器械進行成年豬隻保定時，該器械常繞在豬隻何部位？","opts":["A. 脖子","B. 耳後","C. 上顎","D. 前肢關節"],"ans":2,"exp":"成豬的保定方式：最適合成年豬（adult pig）的嘴部保定是使用鼻環（snout ring）或上顎固定器（upper jaw/snout restraint），C正確。","we":["僅保定後肢對成豬保定效果不佳，豬仍可掙扎。","耳標鉗夾耳不足以固定頭部，效果差。","成豬使用上顎（snout）固定繩（hog snare）是標準保定方法，可有效固定頭部，C正確。","小豬可以直接提拿，但成豬體重過大無法如此操作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_029","year":2024,"roc_year":113,"session":"","examNo":29,"q":"以urethral process amputation治療山羊尿道結石時，應切除下圖中那個部位？","opts":["A. A","B. B","C. C","D. D"],"ans":0,"exp":"（此題可能依賴圖片，需人工確認。）尿道突（urethral process）切除術是小反芻動物（綿羊、山羊）尿道阻塞的緊急處理。","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_030","year":2024,"roc_year":113,"session":"","examNo":30,"q":"仔豬比其他畜種較常發生直腸脫垂的主要原因為下列何項？","opts":["A. 豬直腸沒有韌帶固定","B. 仔豬腹腔收縮較為用力","C. 仔豬肛門組織較淺薄","D. 仔豬較常發生營養不良"],"ans":0,"exp":"仔豬直腸脫垂（rectal prolapse）比成豬更常見，原因是仔豬缺乏支撐直腸的韌帶組織（supporting ligaments），A正確。","we":["仔豬缺乏支撐直腸的韌帶，加上頻繁用力（如腹瀉），容易發生直腸脫垂，A正確。","腹瀉是誘因之一，但直接解剖原因是韌帶支撐不足。","飼料問題可誘發腹瀉進而促成脫垂，但非最主要解剖原因。","腸套疊與直腸脫垂是不同的疾病，不是直腸脫垂好發於仔豬的解釋。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_031","year":2024,"roc_year":113,"session":"","examNo":31,"q":"犬最常因為何種因素破壞淚腺組織造成犬乾眼症（keratoconjunctivitis sicca, KCS）？","opts":["A. 病毒感染","B. 藥物中毒","C. 免疫媒介","D. 手術切除第三眼瞼"],"ans":2,"exp":"犬隻乾眼症（KCS）最常見的原因是免疫介導性（immune-mediated dacryoadenitis），針對淚腺的自體免疫反應導致淚液產量下降，C正確。","we":["先天性無淚腺（congenital alacrima）極少見，不是最常見原因。","藥物毒性（如sulfonamide）可造成KCS，但相對少見。","免疫介導性KCS最常見，佔犬KCS約90%，C正確。","外傷或感染引起的KCS屬於繼發性，非最常見病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_032","year":2024,"roc_year":113,"session":"","examNo":32,"q":"貓全身性高血壓（systemic hypertension）最不會引起下列那個器官的傷害（target organ damage）？","opts":["A. 眼","B. 腦","C. 腎臟","D. 肝臟"],"ans":3,"exp":"問「不是高血壓的目標器官」。犬貓高血壓的主要靶器官是眼（視網膜剝離）、腎（加重CKD）、心（心肥大）、腦（神經症狀）。肝臟（liver）不是高血壓的主要靶器官，D正確。","we":["眼睛（視網膜）是高血壓的重要靶器官，可造成視網膜出血、剝離及失明。","腎臟高血壓可加重腎絲球損傷，加速CKD進展。","心臟（心肌肥大、CHF）是高血壓靶器官之一。","肝臟不是高血壓的典型靶器官，D為最不正確的選項（肝臟不在主要target organ清單中）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_033","year":2024,"roc_year":113,"session":"","examNo":33,"q":"犬隻renin-angiotensin aldosterone system（RAAS）中，下列何種食物會刺激增加腎素（renin）由腎臟\r    juxtaglomerular cells分泌出？","opts":["A. 低脂食物","B. 低鈉食物","C. 高纖食物","D. 高糖食物"],"ans":1,"exp":"腎素-血管收縮素系統（RAAS）的啟動主因之一是低血鈉（hyponatremia）或低有效循環血量刺激腎小球旁器（juxtaglomerular cells）釋放腎素（renin），B正確。","we":["血管收縮素II（Ang II）升高會透過負回饋抑制腎素釋放，非刺激腎素的原因。","低血鈉（hyponatremia）降低有效循環血量，刺激腎素釋放，B正確。","高血壓本身會透過壓力感受器抑制腎素釋放，非刺激腎素的原因。","高血鈉通常伴隨水分滯留，不會刺激腎素分泌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_034","year":2024,"roc_year":113,"session":"","examNo":34,"q":"下圖（from Textbook of Veterinary Internal Medicine, Stephen J. Ettinger）為一隻犬以心電圖Lead    II, 25 mm/sec, 1 cm = 1 mV所記錄之結果，其心跳數最接近以下那個數值？","opts":["A. 80/min","B. 70/min","C. 60/min","D. 50/min"],"ans":0,"exp":"（此題依賴ECG圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_035","year":2024,"roc_year":113,"session":"","examNo":35,"q":"下列何項疾病在老年犬貓最常呈現神經退化性病變（neurodegenerative disorder）且表現出許多行為上的\r    異常？","opts":["A. cervical spondylomyelopathy","B. peripheral neuropathies","C. vestibular diseases","D. cognitive dysfunction syndrome"],"ans":3,"exp":"老年犬認知功能障礙症候群（cognitive dysfunction syndrome, CDS）的臨床症狀包括迷失方向、睡眠週期改變、對主人認識減退等，D正確。","we":["癲癇（epilepsy）發作有典型的sudden onset和postictal期，與CDS的慢性漸進性不同。","肝腦病變（hepatic encephalopathy）有肝臟疾病背景，血氨升高，可以鑑別。","前庭疾病（vestibular disease）以頭偏轉（head tilt）、眼振（nystagmus）為主，非行為認知改變。","認知功能障礙症候群（CDS）以老年犬迷失方向、行為改變、夜間吠叫等為特徵，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_036","year":2024,"roc_year":113,"session":"","examNo":36,"q":"患有糖尿病之犬隻，下列何項檢查結果可用來診斷該犬有併發酮酸血症？","opts":["A. 高禁食血糖（>200 mg/dL）","B. 高禁食血糖與酮尿","C. 酮尿與代謝性酸中毒伴隨陰離子間隙（anion gap）上升","D. 尿糖與血中鉀離子上升"],"ans":2,"exp":"糖尿病酮酸中毒（DKA）的診斷三要素：酮尿（ketonuria）＋代謝性酸中毒（metabolic acidosis）＋高陰離子間隙（elevated anion gap），C正確組合。","we":["高血糖＋蛋白尿不是DKA的特異性組合，蛋白尿可見於多種腎臟疾病。","低血糖不是DKA的特徵，DKA通常有高血糖。","酮尿＋代謝性酸中毒＋高陰離子間隙是DKA的三大特徵，C正確。","高血鈉＋低血鉀可見於其他代謝疾病，非DKA特異性診斷組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_037","year":2024,"roc_year":113,"session":"","examNo":37,"q":"下列唑（azole）類抗黴菌藥物的特性，何項敘述最正確？","opts":["A. 高水溶性","B. 需與食物一起服用","C. H-2拮抗組織胺藥物可以增加口服吸收性","D. 制酸劑可增加消化道吸收性"],"ans":1,"exp":"抗黴菌藥物azoles（如itraconazole）需與食物一起服用以增加吸收，B正確（應與食物同服，而非空腹）。","we":["Azoles不需要靜脈注射，多數有口服劑型，且口服即可達到治療濃度。","Azoles（如itraconazole）需與食物同服以增加生物利用率，B正確（說「需注意要與食物同服」是正確的）。","Fluconazole的吸收受食物影響較小，但itraconazole等需與食物服用，C描述不全。","Azoles對真菌細胞膜的ergosterol合成有干擾效果，非直接殺菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_038","year":2024,"roc_year":113,"session":"","examNo":38,"q":"貓冠狀病毒腸炎與貓傳染性腹膜炎的差異在於下列何項？","opts":["A. 病毒分屬於不同血清型","B. 病毒在貓宿主的身體內突變造成吞噬球親和力增加，而引起傳染性腹膜炎","C. 患病貓的吞噬球發生突變造成吞噬功能喪失，而引起傳染性腹膜炎","D. 感染造成患病貓的嚴重免疫抑制，最終造成傳染性腹膜炎"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）是FCoV（貓冠狀病毒）突變獲得巨噬細胞趨向性（macrophage tropism）後，大量複製並引發全身性免疫反應的結果，B正確。","we":["FCoV是透過糞-口途徑傳播的腸道冠狀病毒，但FIP不是直接由環境病毒引起，而是體內突變。","FCoV在貓腸道中突變獲得感染單核球/巨噬細胞的能力，全身播散引發FIP，B正確。","FIP不是由兩種不同病毒共同感染引起的，而是同一病毒的突變。","FCoV可以在多隻貓中傳播，但每隻貓體內獨立突變為FIP病毒才是發病關鍵，不是FIP病毒直接貓傳貓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_039","year":2024,"roc_year":113,"session":"","examNo":39,"q":"絕大多數犬隻的化療後白血球數目最低點發生在用藥後的什麼時間？","opts":["A. 化療後1～3天","B. 化療後5～7天","C. 化療後10～14天","D. 化療後16～20天"],"ans":1,"exp":"化療後骨髓抑制的最低點（nadir）通常在給藥後5-7天，此時WBC最低、感染風險最高，B正確。","we":["化療後1-2天是急性毒性反應期（如嘔吐），非骨髓抑制nadir。","化療後5-7天是WBC nadir的典型時間，B正確。","14天後骨髓通常已開始恢復，已過nadir。","21天骨髓多已恢復至可接受程度，不是nadir。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_040","year":2024,"roc_year":113,"session":"","examNo":40,"q":"10歲絕育公黃金獵犬，因為全身周邊淋巴結腫大而就診。犬之食慾精神正常，疫苗、心絲蟲及外寄生蟲預防\r   皆完備。理學檢查發現周邊淋巴結大小約3至5公分直徑，胸腹腔放射線學影像正常、超音波檢查發現肝脾腫  大且有結節性混合回音性影像異常、血液及生化檢查正常。此病例之臨床分期為何？","opts":["A. Stage IIb","B. Stage IIIa","C. Stage IIIb","D. Stage IVa"],"ans":3,"exp":"犬隻淋巴瘤分期：Stage IVa為全身性淋巴結腫大＋肝脾腫大，但無全身性症狀（a = 無，b = 有），D正確。","we":["Stage I 只有單一淋巴結受影響。","Stage II 為局部多個淋巴結受影響。","Stage III 為全身性淋巴結腫大。","Stage IVa：全身性淋巴結腫大＋肝脾腫大，無全身性症狀（substage a），D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_041","year":2024,"roc_year":113,"session":"","examNo":41,"q":"大型犬隻四肢骨之骨瘤好發於下列何部位？","opts":["A. 長骨骨骺（epiphysis）","B. 長骨骨幹（diaphysis）","C. 長骨幹骺（metaphysis）","D. 長骨之皮質骨、密質骨（cortical bone）"],"ans":2,"exp":"大型犬四肢骨的骨肉瘤（osteosarcoma）好發於長骨「幹骺端」（metaphysis），尤其是遠端橈骨（distal radius）、近端肱骨（proximal humerus）、遠端股骨（distal femur）等。","we":["骨骺（epiphysis）是關節面位置，骨瘤較少起源於此。","骨幹（diaphysis）中段的骨瘤少見，骨肉瘤較少發生在純骨幹部位。","幹骺端（metaphysis）含有豐富的骨形成細胞，是犬骨肉瘤最好發的部位，C正確。","皮質骨/密質骨骨瘤雖存在，但骨肉瘤最典型好發是幹骺端，D不是最好答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_042","year":2024,"roc_year":113,"session":"","examNo":42,"q":"下列那一種症狀並非犬隻高分級肥大細胞瘤之副腫瘤症候群（paraneoplastic syndromes）？","opts":["A. 胃潰瘍、腸胃道出血、黑便","B. 紅斑（Darier's sign）、紅腫","C. 延長凝血時間，凝血功能異常","D. 副甲狀腺亢進及高血鈣"],"ans":3,"exp":"高分級肥大細胞瘤（high-grade MCT）的副腫瘤症候群（paraneoplastic syndromes）包括：胃潰瘍（histamine→胃酸）、Darier's sign（局部組織胺釋放）、凝血異常（heparin from mast cells）。高血鈣（hypercalcemia）是淋巴瘤的副腫瘤症候群，與MCT的副甲狀腺亢進無直接關係，D是最不符合的選項。","we":["胃潰瘍/GI出血是MCT最常見的副腫瘤症候群，由組織胺刺激H2受體引起，A正確。","Darier's sign（觸摸腫瘤引起的局部風疹/紅斑）是MCT組織胺釋放的特徵，B正確。","肥大細胞釋放肝素（heparin）可干擾凝血功能，C正確（MCT確實有此副腫瘤症候群）。","副甲狀腺亢進/高血鈣是淋巴瘤的副腫瘤症候群，不是MCT的典型表現，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_043","year":2024,"roc_year":113,"session":"","examNo":43,"q":"有關犬隻肝臟疾病之膳食建議，下列何者最正確？","opts":["A. 以少量多餐的方式給予高蛋白食品，以補充下降的肝臟功能造成之蛋白質低下","B. 避免給予高脂肪食品，尤其在出現膽汁淤積的患犬更要避免","C. 由於碳水化合物的代謝常有擾亂情形，應該以單醣類碳水化合物為主，避免給予複雜之碳水化合物","D. 非發酵性纖維可以降低肝腦病變的機會，應該要多加補充"],"ans":1,"exp":"犬肝臟疾病的膳食建議：膽汁淤積（cholestasis）時應避免高脂肪飲食，因為脂肪消化需要膽鹽，而膽汁淤積時膽鹽排出受阻，B正確。","we":["肝病患犬的蛋白質來源應為高品質易消化蛋白，「高蛋白」不適合肝腦病變患犬，A有誤。","膽汁淤積時膽鹽進入腸道減少，脂肪消化吸收障礙，應避免高脂肪，B正確。","肝病患犬應給予複雜碳水化合物而非單醣，單醣不利於血糖穩定，C有誤。","應給予「發酵性纖維」（fermentable fiber，如psyllium）而非非發酵性纖維，發酵性纖維有助於降低血氨（NH3），D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_044","year":2024,"roc_year":113,"session":"","examNo":44,"q":"6歲已絕育公短毛家貓，體重4.5公斤，因為精神沉鬱、食慾不佳、體重下降而就診。該病畜無預防接種及心   絲蟲或外寄生蟲預防。就診時呼吸急促，體溫39.8oC，血檢每µl WBC 22000, neu. 18000, lym. 1200,  mon. 2800, RBC 3.5x10 6 , non-regenerative anemia, Alb 2.8, Glo 4.7, A/G ratio = 0.59，血清電泳  顯示α-2 spike and broad-based β-γ polyclonal gammopathies，該貓最可能的診斷為下列何項？","opts":["A. 多發性骨髓瘤（multiple myeloma）","B. 貓傳染性腹膜炎（feline infectious peritonitis）","C. 貓小病毒感染（feline parvoviral enteritis）","D. 貓淋巴性白血病（feline lymphocytic leukemia）"],"ans":1,"exp":"6歲已絕育公貓，WBC升高、淋巴球低下、非再生性貧血、低A/G比值（0.59）、血清電泳顯示polyclonal gammopathy（多克隆免疫球蛋白升高）——這是FIP的典型血清電泳表現。多發性骨髓瘤呈現monoclonal spike（M-spike），非polyclonal。","we":["多發性骨髓瘤（multiple myeloma）呈現「單克隆」（monoclonal）免疫球蛋白spike，非polyclonal，與本例不符。","貓傳染性腹膜炎（FIP）：低A/G比值、polyclonal hypergammaglobulinemia、淋巴球低下、非再生性貧血、高球蛋白，與本例完全吻合，B正確。","貓小病毒感染（parvoviral enteritis）以嚴重腸炎、嚴重白血球低下（尤其淋巴球、中性球皆低）為主，且是急性病程，不符合本例。","貓淋巴球性白血病通常呈現大量循環淋巴球，與本例淋巴球低下不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_045","year":2024,"roc_year":113,"session":"","examNo":45,"q":"下列有關犬隻嘔吐和反流的鑑別診斷，何項最正確？","opts":["A. 嘔吐物通常比反流的量為大","B. 反流物一定不會有膽汁","C. 反流物的pH值比嘔吐物高","D. 反流比嘔吐較不會出現流涎（salivation）或噁心（nausea）的現象"],"ans":2,"exp":"反流物（regurgitant）主要來自食道或咽部，pH偏中性或偏鹼（唾液pH約7），而嘔吐物（vomit）含有胃酸（pH 1-3），故反流物的pH較高，C正確。","we":["嘔吐物與反流量的大小並無絕對規律，A並非最正確的鑑別指標。","反流物若有膽汁逆流（如食道下段括約肌功能不全），「不一定」不含膽汁，B的「一定」描述過於絕對。","反流物來自食道（pH接近中性），嘔吐物含胃酸（pH極低），反流物pH確實較高，C正確。","反流比嘔吐較不會出現噁心/流涎是正確的（反流是被動機制），但C是更具體的診斷性鑑別指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_046","year":2024,"roc_year":113,"session":"","examNo":46,"q":"下列有關犬隻尿路導管放置的敘述何項最正確？","opts":["A. 因放置導管後易發生尿路感染，故建議先給抗生素","B. 導管的直徑大小需適宜，否則可能會發生漏尿","C. 為避免阻塞尿路導管系統，需採開放系統（open system）","D. 要時常檢查導管是否在適當的位置，若有部分移出時可以直接用手推回原處"],"ans":1,"exp":"尿路導管的直徑必須適合尿道，過小會導致尿液從導管外側滲漏（漏尿），過大則可能損傷黏膜，B正確。","we":["放置導管前預防性給抗生素會增加抗藥性，不建議；導管放置後若有感染跡象再治療，A不正確。","導管直徑應適合尿道，太細會漏尿，太粗會造成黏膜損傷，B正確。","應採「封閉系統」（closed system）而非開放系統，以減少逆行性感染，C不正確。","已移出的導管不可直接推回，因為移出的部分已被污染，推回會帶入細菌，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_047","year":2024,"roc_year":113,"session":"","examNo":47,"q":"依照病史及血檢數值可作出最有可能的診斷為何？","opts":["A. Cushing's disease","B. Addison's disease","C. 急性腎性腎病","D. 低甲狀腺素血症"],"ans":0,"exp":"（此題為承接題，缺乏前置病史，需人工確認。暫定：依據典型症狀，Cushing's disease的特徵為多渴多尿、腹部下垂、禿毛等。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_048","year":2024,"roc_year":113,"session":"","examNo":48,"q":"承上題，該病必須要進行的確診方式為下列何項？","opts":["A. 高濃度dexamethasone刺激試驗","B. 血清cortisol濃度檢測","C. 低濃度dexamethasone刺激試驗","D. ACTH 刺激試驗"],"ans":2,"exp":"（此題為承上題，缺乏前置病史，需人工確認。若Q47診斷為Cushing's disease，確診試驗首選為低濃度dexamethasone抑制試驗（LDDS test）。若為Addison's則用ACTH刺激試驗。）","we":["高濃度dexamethasone刺激試驗（HDDS）用於區分PDH和adrenal tumor，非初步確診。","單獨血清cortisol濃度不足以確診Cushing's或Addison's，缺乏特異性。","低濃度dexamethasone抑制試驗（LDDS）是Cushing's disease的確診試驗，正常犬皮質醇受到抑制，C為暫定答案。","ACTH刺激試驗是Addison's disease的確診試驗，也用於Cushing's監測。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_049","year":2024,"roc_year":113,"session":"","examNo":49,"q":"下列何項輸液是屬於維持性輸液（maintenance fluid）？","opts":["A. 乳酸林格氏液（LRS）","B. 2.5% dextrose + 0.45% sodium chloride","C. 生理鹽水","D. 白蛋白"],"ans":1,"exp":"維持性輸液（maintenance fluid）含有適量電解質（Na、K、Cl）且滲透壓接近血漿，用於補充每日正常水分流失。2.5% Dextrose + 0.45% NaCl是標準維持性輸液，B正確。","we":["乳酸林格液（LRS）是晶體等張液，用於補充缺水/休克，屬「替換性輸液」（replacement fluid），非維持性。","2.5% Dextrose + 0.45% NaCl 是低張維持性輸液，提供日常水分和電解質需求，B正確。","生理鹽水（0.9% NaCl）是等張輸液，常用於休克復甦，非維持性輸液。","白蛋白（albumin）是膠體液，用於低白蛋白血症，非維持性輸液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_050","year":2024,"roc_year":113,"session":"","examNo":50,"q":"此貓的慢性腎病分級為","opts":["A. stage III borderline proteinuria hypertension","B. stage III proteinuria severe hypertension","C. stage IV proteinuria hypertension","D. stage IV borderline proteinuria hypertension"],"ans":3,"exp":"（此題需結合前置病例數據進行IRIS CKD分期，缺乏前置病史，需人工確認。IRIS分期依據肌酸酐值、UPC ratio、血壓決定stage和sub-stage。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_051","year":2024,"roc_year":113,"session":"","examNo":51,"q":"承上題，該貓的頸部腹側屈曲（neck ventroflexion）與下列何項血檢結果最具相關性？","opts":["A. 低血鈉（hyponatremia）","B. 高血磷（hyperphosphatemia）","C. 貧血","D. 低血鉀（hypokalemia）"],"ans":3,"exp":"貓慢性腎病常見低血鉀（hypokalemia），低血鉀導致全身性肌肉無力，表現為頸部腹側屈曲（cervical ventroflexion）——這是貓低血鉀最具特徵性的臨床症狀，D正確。","we":["低血鈉（hyponatremia）主要引起神經症狀（混亂、癲癇），不是頸部腹側屈曲的典型原因。","高血磷（hyperphosphatemia）促進繼發性副甲狀腺亢進，但不直接造成頸部屈曲。","貧血造成虛弱，但不特別表現為頸部腹側屈曲（cervical ventroflexion）。","低血鉀（hypokalemia）造成肌肉無力，貓特別表現為頸部腹側屈曲，是CKD貓低血鉀的特徵表現，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_052","year":2024,"roc_year":113,"session":"","examNo":52,"q":"關於犬貓縱膈之敘述，下列何者最不適當？","opts":["A. 縱膈氣腫（pneumomediastinum）可能會造成後腹膜腔氣腫（pneumoretroperitonium）","B. 氣胸（pneumothorax）可能會造成縱膈氣腫（pneumomediastinum）","C. 縱膈氣腫（pneumomediastinum）可能會造成皮下氣腫（subcutaneous emphysema）","D. 肺臟內肺泡破裂（intrapulmonary alveolar rupture）可能會造成縱膈氣腫（pneumomediastinum）"],"ans":1,"exp":"問何者「最不適當」。B說氣胸可能造成縱膈氣腫——這是因果關係倒置。正確順序是：肺泡破裂→縱膈氣腫→（氣體沿筋膜播散）→氣胸或皮下氣腫。氣胸本身不會「造成」縱膈氣腫。","we":["縱膈氣腫→後腹膜腔氣腫：氣體沿筋膜平面向後擴散是已知現象，A描述正確。","氣胸（pneumothorax）是縱膈氣腫的「後果」之一，而非「原因」；B描述因果倒置，是最不適當的。","縱膈氣腫→皮下氣腫：氣體向上沿頸部筋膜擴散，C描述正確。","肺泡破裂→縱膈氣腫：氣體從肺間質進入縱膈，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_053","year":2024,"roc_year":113,"session":"","examNo":53,"q":"病犬為3歲齡，體重3公斤，雄性未絕育混種犬，據飼主描述該犬於1小時前被有毒癮的兒子強迫餵食海洛\r   英，該犬到院時呈現精神沉鬱，呼吸緩淺，心搏徐緩，下列那一種急救藥物可以逆轉其症狀？","opts":["A. naloxone","B. atipamezole","C. flumazenil","D. sugammadex"],"ans":0,"exp":"海洛英（heroin）是opioid receptor agonist，犬隻中毒症狀包括呼吸抑制、心搏徐緩、鎮靜。Naloxone是opioid receptor antagonist，可競爭性拮抗並逆轉opioid中毒症狀。","we":["Naloxone 是opioid antagonist，可快速逆轉heroin（opioid）中毒的呼吸抑制和CNS抑制，A正確。","Atipamezole 是alpha-2 adrenergic antagonist，用於逆轉medetomidine等alpha-2 agonist，非opioid拮抗劑。","Flumazenil 是benzodiazepine receptor antagonist，用於逆轉benzodiazepine（如diazepam）中毒，非opioid拮抗劑。","Sugammadex 是neuromuscular blocking agent（如rocuronium）的拮抗劑，與opioid無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_054","year":2024,"roc_year":113,"session":"","examNo":54,"q":"病犬為6歲齡，體重25公斤，雌性已絕育拉布拉多犬，於今日早上與主人一同爬山被毒蛇咬到，依其症狀傷\r   口疼痛、局部腫脹、嗜睡、運動神經失調、眼瞼下垂、瞳孔散大、顎咽麻痺、流涎，在臺灣下列何種毒蛇最  可能是本病例的主兇？","opts":["A. 青竹絲","B. 龜殼花","C. 百步蛇","D. 雨傘節"],"ans":3,"exp":"症狀同時有局部腫脹疼痛（出血毒/細胞毒）及神經毒症狀（眼瞼下垂、瞳孔散大、顎咽麻痺）。台灣雨傘節（Bungarus multicinctus）以神經毒素為主，抑制神經肌肉接合，造成進行性麻痺；雖通常局部腫脹較輕，但仍可造成上述神經症狀。","we":["青竹絲（赤尾青竹絲）以出血毒為主，局部腫脹明顯，但神經症狀輕微。","龜殼花以出血毒為主，不典型造成明顯眼瞼下垂和顎咽麻痺等神經毒症狀。","百步蛇毒性最強，以出血毒為主，局部壞死嚴重，非以神經毒為主。","雨傘節（Bungarus multicinctus）含神經毒素，引起神經肌肉接合阻斷，造成眼瞼下垂、瞳孔散大、顎咽麻痺等神經症狀，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_055","year":2024,"roc_year":113,"session":"","examNo":55,"q":"有關貓乳房瘤的敘述，下列何者最不適當？","opts":["A. 有50%為惡性腫瘤","B. 3公分以上的腫瘤，存活時間僅約4～12個月","C. 艾黴素（doxorubicin）可在貓手術切除乳房瘤後使用","D. 以保守方式進行手術可能會有較早的腫瘤再發，但存活時間並不受影響，所以也可考慮進行較保守的手術  切除"],"ans":0,"exp":"問何者「最不適當」。貓乳房瘤約85-90%為惡性，A說「有50%為惡性」是錯誤的（50%是犬的數據），A最不適當。","we":["貓乳房瘤的惡性率約85-90%（不是50%），50%是犬的比例；A描述貓的惡性率有誤，是最不適當的選項。","腫瘤>3 cm的貓預後差，中位存活時間約4-12個月，B描述正確。","手術切除後使用doxorubicin（艾黴素）化療是貓乳房瘤的輔助治療選項，C描述正確。","保守手術（conservative surgery）確實較早再發，但存活時間是否「不受影響」仍有爭議；廣泛切除通常有更好的局部控制。D描述有一定問題，但A的錯誤更明確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_056","year":2024,"roc_year":113,"session":"","examNo":56,"q":"一隻6歲已結紮約克夏成犬有慢性小腸性下痢，理學檢查發現犬隻非常消瘦但無其他不正常。血檢發現輕微\r   非再生性貧血及明顯之淋巴球低下。血清生化學檢查有輕微低血鈣、低膽固醇及中等程度低蛋白血症。其最  可能的診斷為何？","opts":["A. 組織胞漿菌病（histoplasmosis）","B. 沙氏菌症","C. 淋巴瘤","D. 腸淋巴管擴張症（lymphangiectasia）"],"ans":3,"exp":"約克夏成犬，慢性小腸性下痢、消瘦、淋巴球低下（lymphopenia）、低血鈣、低膽固醇（fat malabsorption）、低蛋白血症——這是腸淋巴管擴張症（lymphangiectasia）的典型表現：乳糜管擴張→淋巴液漏入腸腔→脂肪/蛋白/鈣/膽固醇大量流失+淋巴球流失。","we":["組織胞漿菌病（histoplasmosis）可造成慢性下痢，但通常有肉芽腫且膽固醇不特別低，淋巴球低下也不是典型特徵。","沙氏菌症（salmonellosis）通常是急性腸炎，不是慢性小腸性下痢的首要診斷。","淋巴瘤可造成慢性下痢，但通常可見腸壁增厚或腫塊，且此描述（低膽固醇+淋巴球低下）更符合lymphangiectasia。","腸淋巴管擴張症（lymphangiectasia）：淋巴管擴張→乳糜外漏→低白蛋白、低膽固醇、低血鈣、淋巴球低下，為最符合本例的診斷，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_057","year":2024,"roc_year":113,"session":"","examNo":57,"q":"下列何項犬食道的解剖位置，較不常發生異物阻塞？","opts":["A. 頸段食道","B. 食道的胸腔入口處","C. 心底部食道","D. 食道穿過橫膈處"],"ans":0,"exp":"問「較不常發生」異物阻塞的部位。犬食道異物好發於三個解剖狹窄：胸腔入口（B）、心底部（C）、橫膈食道裂孔（D）。頸段食道（A）相對有彈性、管腔較大，異物較少在此嵌頓。","we":["頸段食道（cervical esophagus）管腔較大且彈性較好，異物較少嵌頓於此，A正確為「較不常發生」的部位。","胸腔入口處（thoracic inlet）是食道三大狹窄之一，異物最常嵌頓，非「較不常見」。","心底部（base of heart）大動脈壓迫造成食道狹窄，是異物常嵌頓處。","橫膈裂孔（diaphragmatic hiatus）食道通過橫膈處，也是常見異物嵌頓部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_058","year":2024,"roc_year":113,"session":"","examNo":58,"q":"有關皮膚疾病的診斷方式，下列敘述何者錯誤？","opts":["A. 膠帶黏貼檢查法可診斷部分蟎類外寄生蟲","B. 拔毛檢查可診斷毛囊蟲","C. 皮膚壓片細胞學檢查可診斷酵母菌感染","D. 皮膚搔刮檢查可診斷天疱瘡"],"ans":3,"exp":"問何者「錯誤」。皮膚搔刮（skin scraping）用於診斷疥蟎（Sarcoptes）、蠕形蟎（Demodex），不能診斷天疱瘡（pemphigus）。天疱瘡需要皮膚切片（biopsy）搭配組織病理和直接免疫螢光（DIF）確診，D是錯誤敘述。","we":["膠帶黏貼法（tape preparation）可找到Cheyletiella等表面寄生蟲，A描述正確。","拔毛鏡檢（trichogram）可在毛囊中找到毛囊蟲（Demodex），B描述正確。","皮膚壓片細胞學（impression smear cytology）可發現Malassezia（酵母菌）感染，C描述正確。","皮膚搔刮（skin scraping）診斷外寄生蟲（如疥螨）；天疱瘡（pemphigus）屬自體免疫性皮膚病，需皮膚切片＋組織病理確診，搔刮不能診斷天疱瘡，D是錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_059","year":2024,"roc_year":113,"session":"","examNo":59,"q":"關於犬膀胱結石疾病，下列何者正確？","opts":["A. 草酸鈣結石無法用放射線學檢查發現","B. 磷酸銨鎂結石形成通常與尿路感染有關","C. 可使用尿路酸化劑預防草酸鈣結石復發","D. 膀胱切開縫合膀胱壁時，使用不可吸收線全層縫合防止尿液外漏"],"ans":1,"exp":"磷酸銨鎂（struvite）結石的形成與尿素酶產生菌（urease-producing bacteria，如Staphylococcus、Proteus）引起的尿路感染有密切關係，細菌分解尿素→氨→鹼性尿→struvite沉澱，B正確。","we":["草酸鈣結石是放射線「不透過性」（radiopaque），在X光片上清晰可見，A描述錯誤。","磷酸銨鎂（struvite）結石與產尿素酶細菌引起的UTI密切相關，B正確。","尿路酸化劑（urinary acidifiers）可溶解struvite，但對草酸鈣結石無效甚至有害（酸性尿促進草酸鈣形成），C描述錯誤。","膀胱縫合應使用可吸收縫線（如PDS），不可吸收線在膀胱內可能作為結石形成核，D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_060","year":2024,"roc_year":113,"session":"","examNo":60,"q":"犬隻因患有唾液腺囊腫而進行舌下及下頷唾液腺切除術時，為求唾液腺及其管道完整摘除，需鈍剝至看到下\r   列何神經再進行結紮摘除？","opts":["A. 顏面神經","B. 喉迴返神經","C. 舌神經","D. 迷走神經"],"ans":2,"exp":"犬隻舌下及下頷唾液腺切除術時，需鈍剝分離，看到舌神經（lingual nerve）後再進行結紮摘除，以避免損傷並確認完整摘除腺體及腺管。","we":["顏面神經（facial nerve）主要控制表情肌，手術時需注意避免損傷，但不是視覺確認標誌。","喉迴返神經（recurrent laryngeal nerve）在頸部氣管旁走行，與唾液腺手術關係較遠。","舌神經（lingual nerve）沿舌下/下頷唾液腺管伴行，手術鈍剝至見到舌神經後再結紮，確保腺體完整摘除，C正確。","迷走神經（vagus nerve）走行較深，不是唾液腺手術的直接視覺確認神經。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_061","year":2024,"roc_year":113,"session":"","examNo":61,"q":"關於犬隻胃擴張扭轉疾病敘述，下列何者錯誤？","opts":["A. 胃固定術可以部分的預防扭轉發生","B. 幽門扭轉方向通常先往腹腔背側再往右側腹壁移動","C. 造成門脈高壓與系統性低血壓","D. 大型深胸犬為好發品種"],"ans":1,"exp":"問「何者錯誤」。B說GDV中幽門扭轉方向「先往腹腔背側再往右側腹壁移動」——這是錯誤的。GDV的幽門（pylorus）扭轉方向是先往腹側（ventral），再往左側移動；而胃底（fundus）往右側移動。B描述方向有誤。","we":["胃固定術（gastropexy）可有效預防復發，A描述正確。","GDV中幽門（pylorus）正確扭轉方向是向腹側（ventral）再向左側（left），B描述「往背側再往右側」是錯誤的，B為最不正確的選項。","GDV造成後腔靜脈壓迫→靜脈回流減少→門脈高壓及系統性低血壓，C描述正確。","大型深胸犬（如大丹犬、德牧）確為GDV好發品種，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_062","year":2024,"roc_year":113,"session":"","examNo":62,"q":"4歲混種犬於股骨骨幹骨折手術復位後14天拍攝X光，下列何者為預期可見的次級骨癒合（secondary bone\r   healing）？","opts":["A. 骨痂出現重塑（remodel）","B. 骨膜內及骨膜外骨痂形成（formation of endosteal and periosteal callus）","C. 骨折線消失（fracture lines disappear）","D. 骨痂中可見骨小樑（trabecular pattern）"],"ans":1,"exp":"次級骨癒合（secondary bone healing）在術後14天時，已進入「硬性骨痂」（hard callus）形成期。骨膜內及骨膜外骨痂（endosteal and periosteal callus）形成發生在約1-4週，14天時可在X光見到骨膜外骨痂形成，B正確。","we":["骨痂重塑（remodeling）發生在骨癒合晚期（數月後），不是14天時的表現，A不正確。","骨膜外及骨膜內骨痂形成（periosteal/endosteal callus）是次級骨癒合第2-4週的特徵，14天時已可見初期骨痂，B正確。","骨折線消失是骨癒合完成的表現，需要數週至數月，14天時骨折線仍清晰可見，C不正確。","骨痂中骨小樑（trabecular pattern）是骨癒合晚期骨痂成熟的表現，14天時尚未形成，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_063","year":2024,"roc_year":113,"session":"","examNo":63,"q":"9歲拉不拉多犬，右前肢負重跛行，觸診右前肢腕部有觸痛反應，X光影像中箭號處骨樣結構為何？","opts":["A. 撕裂性骨折（avulsion fracture）","B. 碎片骨折（chip fracture）","C. 長趾伸肌肌腱（long digital extensor tendon）種子骨","D. 外展拇長肌肌腱（abductor pollicis longus tendon）種子骨"],"ans":3,"exp":"（此題依賴X光圖片，需人工確認。暫定：外展拇長肌肌腱（APL tendon）種子骨是犬腕部的正常解剖變異，在老年拉不拉多的腕部X光可見，需與撕裂性骨折鑑別。）","we":["撕裂性骨折（avulsion fracture）附著點有急性外力損傷史，需排除。","碎片骨折（chip fracture）通常有創傷史，邊緣不規則。","長趾伸肌腱種子骨較少見。","外展拇長肌肌腱（APL tendon）種子骨是腕部常見正常解剖變異，邊緣光滑，需與骨折鑑別，D為暫定答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_064","year":2024,"roc_year":113,"session":"","examNo":64,"q":"關於骨癒合應變理論（strain theory）的敘述，下列何者最不適當？","opts":["A. 骨組織只能存活在2%以下的應變環境（deformation），因此骨折的修復要點之一是儘量減少骨折斷片間的   應變","B. 纖維軟骨組織適合生存在約10～15%的應變環境（deformation）下","C. 在等量的不穩定度下，裂隙較小的骨折和裂隙較大的骨折相比有較小的應變","D. 外骨痂（periosteal callus）的生長會減少骨折斷片間的應變"],"ans":2,"exp":"應變理論（strain theory）：Strain = 位移量 / 裂隙大小（gap size）。在「等量不穩定度（相同位移量）」下，裂隙「較小」的骨折其strain值反而「較大」（因為分母小）。C說「裂隙較小有較小的應變」是錯誤的，C為最不適當選項。","we":["骨組織（bone tissue）的應變耐受上限約2%，應變超過2%則骨組織無法存活，A描述正確。","纖維軟骨（fibrocartilage）可在約10-15%應變環境存活，是骨折裂隙中優先形成的組織，B描述正確。","在等量不穩定度下，裂隙「較小」的骨折strain值「較大」（strain = displacement/gap size），C描述「較小應變」是錯誤的，C為最不適當選項。","外骨痂（periosteal callus）生長增加有效斷面面積，分散應力，減少骨折斷片間應變，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_065","year":2024,"roc_year":113,"session":"","examNo":65,"q":"一隻3歲短毛家貓右後肢有超過10天的大範圍皮膚外傷，皮膚缺損位於右後肢內側，包含大腿、小腿，傷口\r   最遠端在踝掌關節交界處。若計畫在傷口狀況穩定後進行一次性的手術來關閉皮膚缺口，下列那一項軸型皮  瓣的修復方式最適合？","opts":["A. 尾側後血管軸行皮瓣（lateral caudal axial pattern flap）","B. 反轉隱血管通道皮瓣（reverse saphenous conduit flap）","C. 膝軸型皮瓣（genicular axial pattern flap）","D. 後淺腹壁血管軸型皮瓣（caudal superficial epigastric axial pattern flap）"],"ans":1,"exp":"貓右後肢內側大腿到踝掌關節的大範圍皮膚缺損，需覆蓋後肢中遠段。反轉隱血管通道皮瓣（reverse saphenous conduit flap）以逆行血流供應後肢遠端，可覆蓋小腿至跗部，是最適合的選擇。","we":["尾側後血管軸行皮瓣（lateral caudal axial pattern flap）適合覆蓋臀部和後肢近端，無法延伸至踝部，A不適合。","反轉隱血管通道皮瓣（reverse saphenous conduit flap）以逆行血流供應後肢遠端（小腿至跗部），最適合本案例的遠端缺損，B正確。","膝軸型皮瓣（genicular axial pattern flap）覆蓋範圍主要是膝關節附近，無法延伸至踝掌關節，C不適合。","後淺腹壁軸型皮瓣（caudal superficial epigastric flap）覆蓋腹股溝/近端後肢，無法覆蓋踝部，D不適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_066","year":2024,"roc_year":113,"session":"","examNo":66,"q":"下列那個術式與犬隻會陰赫尼亞的預防及治療無關？","opts":["A. 半腱肌轉位（semitendinosus musle transposition）","B. 中臀肌轉位（middle gluteal musle transposition）","C. 膀胱固定術（cystopexy）","D. 公犬絕育（castration）"],"ans":1,"exp":"問「何術式與會陰赫尼亞無關」。半腱肌轉位（A）、膀胱固定術（C）、公犬絕育（D）都是會陰赫尼亞的預防/治療措施。中臀肌轉位（middle gluteal muscle transposition，B）不是會陰疝氣的常用術式，B與會陰赫尼亞無關。","we":["半腱肌轉位（semitendinosus transposition）是會陰疝氣重建的有效術式，A有關。","中臀肌轉位（middle gluteal transposition）不是會陰赫尼亞的標準術式（常用的是內閉孔肌或半腱肌），B與會陰疝氣治療無關，B正確。","膀胱固定術（cystopexy）防止膀胱進入疝囊，是會陰疝氣伴膀胱膨出時的必要處置，C有關。","公犬絕育可移除雄性激素對會陰肌肉的影響，降低復發率，是預防措施，D有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_067","year":2024,"roc_year":113,"session":"","examNo":67,"q":"5月齡拉不拉多犬在連續且劇烈運動後突然出現單側後肢跛行及膝關節部位腫大，下列何者最有可能是造成\r   的原因？","opts":["A. 前十字韌帶疾病","B. 髕骨脫臼","C. 股骨頭缺血性壞死（avascular necrosis of femoral head）","D. 脛骨粗隆撕裂骨折（avulsion fracture of the tibial tuberosity）"],"ans":3,"exp":"5月齡拉不拉多犬，骨骺板尚未閉合，劇烈運動後突然出現膝關節腫大——此為「脛骨粗隆撕裂骨折」（avulsion fracture of tibial tuberosity），因股四頭肌強力收縮拉扯脛骨粗隆骨骺，在未閉合的骺板處撕裂，D正確。","we":["前十字韌帶疾病（CCL disease）好發於中老年犬，幼犬劇烈運動後急性發作較少見，且膝關節腫大不典型。","髕骨脫臼（patellar luxation）通常表現為間歇性跛行（跳躍步態），非急性劇烈腫大，且與運動強度無直接關係。","股骨頭缺血性壞死（avascular necrosis of femoral head，Legg-Calvé-Perthes）表現在「髖關節」而非膝關節，C不符合。","脛骨粗隆撕裂骨折：幼犬骺板未閉合，股四頭肌強力收縮→脛骨粗隆骨骺撕裂，膝關節腫大及急性跛行，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_068","year":2024,"roc_year":113,"session":"","examNo":68,"q":"下列何者非造成此capnography圖形趨勢的原因？（X軸為時間，Y軸為PCO 2 量）","opts":["A. 麻醉過深","B. 組織灌流不足","C. 嚴重換氣過度","D. 甲狀腺功能亢進"],"ans":0,"exp":"（此題依賴capnography圖片，需人工確認。若圖示PCO2呈下降趨勢：麻醉過深導致「低通氣」→PCO2上升，因此麻醉過深不會造成PCO2下降趨勢；其他如組織灌流不足、嚴重過度通氣會造成PCO2下降。若圖示PCO2下降，A（麻醉過深）為不是原因的答案。）","we":["麻醉過深→低通氣→PCO2升高，若圖形顯示PCO2下降，則麻醉過深不是原因，A為暫定答案。","組織灌流不足→CO2輸送到肺臟減少→EtCO2下降，是PCO2下降的可能原因。","嚴重換氣過度（hyperventilation）→CO2大量排出→EtCO2下降，是PCO2下降的原因。","甲狀腺亢進→代謝率升高→CO2產量增加→EtCO2上升，若圖形顯示下降，甲狀腺亢進不是原因。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_069","year":2024,"roc_year":113,"session":"","examNo":69,"q":"關於母馬的懷孕診斷，下列敘述何項最不適當？","opts":["A. 妊馬懷孕150天時，血液中動情素（estrogens）濃度會超過未妊馬的最大值","B. 於配種後16～22天，未妊馬的血液中孕酮（progesterone）濃度會呈現低值而未上升","C. 於配種後30天，可應用超音波影像診斷母馬有無懷孕","D. 於配種後30天，可應用直腸觸診診斷母馬有無懷孕"],"ans":3,"exp":"問何者「最不適當」。馬配種後30天，超音波（C）已可確認懷孕（胚泡可見），但直腸觸診（D）在此時子宮大小變化不明顯，敏感性很低，無法可靠診斷懷孕；馬懷孕需到60-90天後才能透過直腸觸診相對可靠判斷。","we":["懷孕150天時，胎兒胎盤（uterofetoplacental unit）分泌大量雌激素，血清濃度顯著超過非懷孕馬的最大值，A描述正確。","未懷孕的馬在配種後16-22天黃體退化，孕酮降至低值；若懷孕則孕酮維持高值，B描述正確。","超音波在配種後25-35天可清楚看到胚泡，是最早且最可靠的懷孕診斷方式，C描述正確。","直腸觸診在配種後30天時子宮大小與正常非懷孕無顯著差異，敏感性極低，無法可靠診斷懷孕，D為最不適當的說法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_070","year":2024,"roc_year":113,"session":"","examNo":70,"q":"某牧場懷孕280天母牛出現努責現象超過8小時，未見第一水袋破水，外陰部呈現皺摺樣，經陰道檢查無法觸  摸到胎兒，獸醫師診斷後進行倒牛以及母體迴轉（rolling）如下圖，下列何者不適用於母體迴轉成功矯正 之後的下一步處置？","opts":["A. 帝王切開術","B. 注射PGF 2α 與 dethamexasone等待24小時確認是否分娩","C. 進行碎胎術取出胎兒","D. 以助產器進行胎兒牽引"],"ans":1,"exp":"母牛子宮捻轉矯正成功後，應立即評估胎兒活力並進行助產（牽引或帝王切開），而非注射PGF2α+dexamethasone等待24小時。在280天（接近足月）且已有難產跡象的情況下，延誤24小時可能造成胎兒缺氧死亡，B為最不適用的下一步。","we":["帝王切開術：若矯正後子宮頸未充分擴張或胎兒無法正常牽出，帝王切開是合理選擇，A可適用。","注射PGF2α+dexamethasone等待24小時：在已接近足月且剛矯正的情況下，等待24小時延誤分娩，有胎兒缺氧風險，B為最不適用的選項。","碎胎術：若矯正後確認胎兒死亡，碎胎術是取出胎兒的有效方式，C在特定情況下可適用。","助產器牽引：若矯正後子宮頸充分開放且胎位正確，直接牽引是最直接的方式，D可適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_071","year":2024,"roc_year":113,"session":"","examNo":71,"q":"有關山羊異常動情週期之敘述，下列何者錯誤？","opts":["A. 若其動情週期較長，有可能是胚胎早期死亡造成","B. 若其動情週期較短（小於18至21天），有可能是繁殖季期剛開始","C. 若其動情週期較短，有可能是寂靜發情（silent heat）","D. 若其動情週期較短，有可能是黃體提早退行性變化（premature regression of the corpus luteum）"],"ans":2,"exp":"問何者「錯誤」。C說「動情週期較短有可能是寂靜發情（silent heat）」——這是錯誤的。寂靜發情是指有排卵但無明顯發情行為，動情週期長度「正常」，並不縮短。縮短週期的原因是黃體提早退化，不是寂靜發情。","we":["胚胎早期死亡→失去胚胎信號→黃體延長存在→週期延長，A描述正確。","繁殖季開始時的初期週期（transition cycles）可有較短且不規律的週期，B描述正確。","寂靜發情（silent heat）指有排卵無行為表現，週期長度「正常」，不會縮短週期，C是錯誤描述。","黃體提早退行性變化（premature corpus luteum regression）導致黃體期縮短→整個週期縮短，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_072","year":2024,"roc_year":113,"session":"","examNo":72,"q":"有關胎衣滯留之敘述，下列何者最正確？","opts":["A. 雖然用手剝除胎衣是一種處理方式，但牛隻胎衣滯留初期最好不要用手剝除，因為其胎盤結構是宮阜凹  下，子葉突入阜內","B. 其前置因子常與雙胞胎或利用類固醇引產有關","C. 若想要協助胎衣排出，可以使用動情素（estrogen）類藥物，於產後24～48小時內施打","D. 分娩之前給予維生素E或硒，不是最好的方式，其最好的方式為於分娩後24小時內給予"],"ans":0,"exp":"問「何者最正確」。A說：牛的胎盤結構是宮阜凹下（caruncle凹形）、子葉突入阜內，因此胎衣滯留初期不應強行手剝，以免損傷子宮——這個解釋在臨床和解剖上都是正確的。","we":["宮阜（caruncle）凹形，子葉（cotyledon）凸出插入，初期強行手剝容易撕裂組織造成子宮炎；不建議初期手剝是正確的臨床建議，A為最正確選項。","雙胞胎和類固醇引產確實是胎衣滯留的風險因子，B描述基本正確，但不如A具體說明機制。","胎衣滯留治療應使用Oxytocin促進子宮收縮，而非動情素（estrogen）；C的治療建議有誤。","預防胎衣滯留應在「分娩前」補充VitE和硒，而非分娩後；D描述時機相反，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_073","year":2024,"roc_year":113,"session":"","examNo":73,"q":"下列有關牛隻臨床性酮病相關檢驗及治療之敘述，何者最正確？","opts":["A. 酮病發生在較肥胖的牛隻，而不會發生在瘦的牛隻","B. 若使用尿液試紙（dipsticks）進行檢驗時，應注意使用方法，要先使試紙以蒸餾水浸潤，以防止偽陰性","C. 酮體在尿液試紙中若有檢出，不論濃度為何，表示該牛為酮病","D. 不論任何的治療方案，給予50%的葡萄糖輸液是有必要的"],"ans":3,"exp":"（此題各選項均有爭議，暫定D。）對於臨床性酮病（clinical ketosis），靜脈給予50%葡萄糖液是標準急救措施；相較於A（酮病只發生在肥胖牛）、B（試紙預先浸潤）、C（任何濃度酮體即診斷）等明確錯誤敘述，D為相對最正確的選項。","we":["酮病也可發生在瘦牛（負能量平衡），A說「不會發生在瘦的牛隻」是錯誤的。","尿液試紙不應先以蒸餾水浸潤，這樣會稀釋尿液造成偽陰性，B的建議反而有害。","亞臨床程度的酮體在泌乳初期是正常的，不論濃度均判為酮病是錯誤的，C不正確。","臨床性酮病患牛靜脈給予50%葡萄糖是標準治療之一，D為四選項中相對最正確的敘述（但輕症也可能不需IV glucose）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_074","year":2024,"roc_year":113,"session":"","examNo":74,"q":"下列何種動物的平均動情週期最短？","opts":["A. 牛","B. 綿羊","C. 馬","D. 豬"],"ans":1,"exp":"各動物平均動情週期：牛21天，綿羊17天，馬21天，豬21天。綿羊的動情週期最短（約17天），B正確。","we":["牛的平均動情週期約21天，不是最短的。","綿羊的平均動情週期約17天，是四種動物中最短的，B正確。","馬的平均動情週期約21天（18-26天），與牛相近，不是最短。","豬的平均動情週期約21天（18-24天），不是最短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_075","year":2024,"roc_year":113,"session":"","examNo":75,"q":"下列何種雌性動物，不屬於季節性多動情週期型（seasonally polycyclic）？","opts":["A. 馬","B. 羊","C. 牛","D. 貓"],"ans":2,"exp":"季節性多動情週期型（seasonally polycyclic）動物只在特定季節有多次動情週期。牛（cattle）屬於「全年多動情週期型（polyestrous，non-seasonal）」，全年均可繁殖，不受光照週期限制，C正確。","we":["馬（horse）在長日照季節（春夏）多動情，是季節性多動情週期型，A不符合（馬是季節性的）。","羊（sheep）在短日照（秋冬）多動情，是季節性多動情週期型，B不符合。","牛（cattle）是全年多動情（polyestrous）、非季節性，不屬於季節性多動情週期型，C正確。","貓（cat）在長日照（春夏）多動情，屬於季節性多動情週期型，D不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_076","year":2024,"roc_year":113,"session":"","examNo":76,"q":"下列何種動物的平均懷孕期最長？","opts":["A. 牛","B. 羊","C. 豬","D. 馬"],"ans":3,"exp":"各動物平均懷孕期：牛280天、羊150天、豬114天、馬336天。馬的懷孕期最長（約336天，約11個月），D正確。","we":["牛的平均懷孕期約280天（9個月），不是最長。","羊的平均懷孕期約150天（5個月），不是最長。","豬的平均懷孕期約114天（3個月3週3天），不是最長。","馬的平均懷孕期約336天（11個月），是四種動物中最長的，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_077","year":2024,"roc_year":113,"session":"","examNo":77,"q":"血液中的下列何者最不適用於母犬的懷孕診斷？","opts":["A. C-reactive protein","B. fibrinogen","C. progesterone","D. relaxin"],"ans":2,"exp":"問「最不適用於母犬懷孕診斷」。母犬在動情後期（diestrus）無論是否懷孕，孕酮（progesterone）都會維持高值（因為黃體期不依賴懷孕而自動維持）。因此孕酮無法區分懷孕與假懷孕，特異性最差，C最不適用。","we":["CRP（C-reactive protein）在懷孕期升高，有一定指示價值，但特異性一般。","Fibrinogen在懷孕期升高，可作為輔助指標。","Progesterone在母犬動情後期無論懷孕與否均升高（黃體期自動維持），無法鑑別懷孕與非懷孕，C最不適用於懷孕診斷。","Relaxin 由妊娠黃體和胎盤分泌，在懷孕25-30天後才出現，是母犬懷孕的特異性指標，D適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_078","year":2024,"roc_year":113,"session":"","examNo":78,"q":"有關隱睪症（cryptorchidism）的敘述，下列何項最不適當？","opts":["A. 隱睪常在的位置是位於腹腔或鼠蹊","B. 公畜若僅有單側隱睪，該公畜仍可保有繁殖能力","C. 公畜若有雙側隱睪，該公畜會喪失性慾表現（libido）","D. 老年公犬及公馬，隱睪較易發生腫瘤"],"ans":2,"exp":"問何者「最不適當」。雙側隱睪公畜，雖然兩個睾丸留在腹腔（高溫→精子不育），但睾丸仍然正常分泌雄性激素（testosterone），因此性慾（libido）「不會」喪失，C的描述（雙側隱睪→喪失性慾）是錯誤的。","we":["隱睪的常見位置確實是腹腔或鼠蹊（inguinal canal），A描述正確。","單側隱睪公畜，另一側正常睾丸仍可產生精子，繁殖能力保留，B描述正確。","雙側隱睪公畜，睾丸在腹腔中仍可分泌雄性激素（testosterone），性慾（libido）「正常」；C說「喪失性慾」是錯誤的，C為最不適當選項。","老年公犬及公馬的隱睪確實較容易發生腫瘤（Sertoli cell tumor、seminoma等），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_079","year":2024,"roc_year":113,"session":"","examNo":79,"q":"母犬於陰道抹片採檢，看到下圖細胞相時，最不可能是下列何項？","opts":["A. pro-oestrus","B. early metoestrus","C. vaginitis","D. pyometra"],"ans":0,"exp":"（此題依賴陰道抹片圖片，需人工確認。若圖示為以角化無核上皮細胞（cornified anuclear cells）為主，「最不可能」是early metoestrus（此期應有大量中性球）。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_080","year":2024,"roc_year":113,"session":"","examNo":80,"q":"乳牛產後最常見因卵巢功能不良或其他疾病導致發情週期休止期（anestrus）的原因為下列何項？","opts":["A. 卵巢萎縮及濾泡囊腫","B. 卵巢囊腫及卵巢腫瘤","C. 多排卵及卵巢囊腫","D. 卵巢萎縮及潛在性乳房炎"],"ans":0,"exp":"乳牛產後anestrus最常見的卵巢原因是「卵巢萎縮（ovarian atrophy）」及「濾泡囊腫（follicular cysts）」。卵巢萎縮因負能量平衡導致FSH/LH不足；濾泡囊腫是GnRH/LH surge失敗造成排卵未完成。","we":["卵巢萎縮（無黃體，無大濾泡）及濾泡囊腫是乳牛產後anestrus的兩大最常見卵巢原因，A正確。","卵巢囊腫和卵巢腫瘤都可造成anestrus，但卵巢腫瘤（ovarian tumor）相對少見，不是「最常見」的組合。","多排卵（superovulation）在自然情況下少見，不是anestrus的常見原因。","卵巢萎縮是常見原因，但「潛在性乳房炎（subclinical mastitis）」與anestrus的直接關聯較間接，不是最典型的組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_001","year":2023,"roc_year":112,"session":"","examNo":1,"q":"下圖中這匹馬最可能罹患下列何種疾病？","opts":["A. 腦下垂體的中間部功能異常（pituitary pars intermedia dysfunction）","B. 免疫媒介溶血性貧血（immune-mediated hemolytic anemia）","C. 糖尿病（diabetes mellitus）","D. 無汗症（anhidrosis）"],"ans":0,"exp":"（圖片題）老馬毛髮長而捲曲（hypertrichosis）是PPID（垂體中間部功能異常，equine Cushing's）的典型特徵，A正確。","we":["PPID（pituitary pars intermedia dysfunction）是老馬最常見的內分泌疾病，典型表現為多毛/捲毛（hypertrichosis），A為暫定答案。","IMHA（免疫媒介溶血性貧血）主要表現為黃疸、黏膜蒼白，不會有典型長捲毛，B不符。","糖尿病（DM）在馬較少見，且不造成典型的長捲毛，C不符。","無汗症（anhidrosis）表現為不出汗、耐熱差，不會有長捲毛，D不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_002","year":2023,"roc_year":112,"session":"","examNo":2,"q":"承上題，下列何項不是伴隨此種疾病常見的狀況？","opts":["A. 蹄葉炎（laminitis）","B. 體重下降（weight loss）","C. 較鈍（docility）","D. 光敏症（photosensitization）"],"ans":3,"exp":"PPID（垂體中間部功能異常）的常見伴隨狀況包括：蹄葉炎（laminitis）、體重下降（muscle wasting）、性情較鈍（docility/dull demeanor）。光敏症（photosensitization）不是PPID的常見伴隨症狀，D為最不常見的伴隨狀況。","we":["蹄葉炎（laminitis）是PPID最常見的重要伴隨症狀之一，A是常見狀況。","體重下降（肌肉萎縮）是PPID的典型表現，B是常見狀況。","PPID患馬性情通常變得較鈍/溫順（docility），C是常見狀況。","光敏症（photosensitization）非PPID的常見伴隨症狀，D為最不常見，是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_003","year":2023,"roc_year":112,"session":"","examNo":3,"q":"下列那種手術不適合於馬匹以站立方式執行手術（standing surgery）？","opts":["A. palmar digital neurectomy","B. Caslick's operation","C. tracheostomy","D. umbilical herniorrhaphy"],"ans":3,"exp":"問哪種手術「不適合」以站立方式執行。臍疝氣修補術（umbilical herniorrhaphy）是腹部手術，需要全身麻醉及側躺以提供安全手術視野，不適合站立執行。","we":["Palmar digital neurectomy（掌側指神經切斷術）可在站立下局麻執行，A可站立執行。","Caslick's operation（陰道縫合術）是母馬會陰部手術，站立局麻即可執行，B可站立執行。","Tracheostomy（氣管切開術）可在站立下局麻執行，C可站立執行。","Umbilical herniorrhaphy（臍疝氣修補術）需全身麻醉側躺，不適合站立執行，D是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_004","year":2023,"roc_year":112,"session":"","examNo":4,"q":"一匹成馬傷口一直無法癒合如下圖，下列何種情況可能性最低？","opts":["A. sequestrum","B. equine sarcoid","C. exuberant granulation tissue","D. angular limb deformity"],"ans":3,"exp":"問何種情況「可能性最低」導致馬匹傷口無法癒合。Angular limb deformity（肢體角度變形）是骨骼發育問題，與傷口不癒合無關，D可能性最低。","we":["Sequestrum（壞死骨片）是傷口不癒合的常見原因，A可能性高。","Equine sarcoid（馬肉瘤）是馬常見的皮膚腫瘤，常導致傷口不癒合或反覆潰瘍，B可能性高。","Exuberant granulation tissue（肉芽組織過度增生）是馬匹傷口特有問題，常見於下肢，C可能性高。","Angular limb deformity（肢體角度變形）是發育性骨骼問題，與傷口癒合無直接關聯，D可能性最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_005","year":2023,"roc_year":112,"session":"","examNo":5,"q":"有關馬匹敗血性關節炎（septic arthritis），下列敘述何者錯誤？","opts":["A. 可能自周圍蜂窩組織炎蔓延侵入","B. 嚴重可能形成epiphyseal osteomyelitis","C. 在一週齡幼駒抗生素最多只能用一週","D. 會造成軟骨的proteoglycan及collagen快速流失"],"ans":2,"exp":"問何者「錯誤」。馬匹敗血性關節炎（尤其幼駒）需要「長期」抗生素治療（通常4-6週），而非「最多只能用一週」。C的說法錯誤。","we":["敗血性關節炎確實可自周圍蜂窩組織炎蔓延，A描述正確。","嚴重敗血性關節炎可形成epiphyseal osteomyelitis，尤其在幼駒，B描述正確。","幼駒敗血性關節炎需要長期抗生素治療（4-6週），「最多只能用一週」是錯誤說法，C為最不正確的選項。","細菌性關節炎會造成軟骨proteoglycan及collagen快速流失，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_006","year":2023,"roc_year":112,"session":"","examNo":6,"q":"關於小牛地方性肺炎，下列敘述何者最不適當？","opts":["A. bovine coronavirus為主要病原之一","B. 群體飼養之小牛有較高的患病風險","C. 與緊迫造成免疫力下降有關","D. 患病小牛不會傳染給其他小牛"],"ans":3,"exp":"問「最不適當」的描述。小牛地方性肺炎（enzootic pneumonia）是高度接觸性傳染病，患病小牛「可以」傳染給其他小牛。D說不會傳染是錯誤的。","we":["Bovine coronavirus是小牛肺炎的病原之一，A描述正確。","群體飼養密度高，交叉感染風險增加，B描述正確。","緊迫（stress）降低免疫力，增加感染風險，C描述正確。","小牛地方性肺炎具有傳染性，患病小牛「可以」傳染給其他小牛，D的描述「不會傳染」是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_007","year":2023,"roc_year":112,"session":"","examNo":7,"q":"下列何者最不可能是牛隻創傷性蜂巢胃炎常見的併發症？","opts":["A. 肝臟膿瘍","B. 脾臟膿瘍","C. 腎臟膿瘍","D. 心包炎"],"ans":2,"exp":"問「最不可能」的併發症。外來物從蜂巢胃穿出，主要向前（cranially）穿透到心包（心包炎）、膈肌、肝臟、脾臟。腎臟位置偏後且有保護，不在典型穿透路徑上，腎臟膿瘍最不常見。","we":["肝臟膿瘍（hepatic abscess）是創傷性蜂巢胃炎常見併發症，異物可透過門脈循環擴散至肝臟，A常見。","脾臟膿瘍也是常見併發症，異物可直接穿透至脾臟，B常見。","腎臟位置偏後且有較多保護，不在網胃異物典型穿透路徑上，腎臟膿瘍最不常見，C正確。","心包炎（pericarditis）是創傷性蜂巢胃炎最嚴重的常見併發症之一，D常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_008","year":2023,"roc_year":112,"session":"","examNo":8,"q":"關於酵母菌乳房炎（yeast mastitis），下列敘述何者正確？","opts":["A. 無法使用血液培養基培養","B. 使用抗真菌藥劑可有效控制感染","C. 容易發生於長期使用抗生素藥劑乳房灌注","D. 使用單劑量包裝的乳房炎軟膏可以有良好的療效"],"ans":2,"exp":"酵母菌乳房炎（yeast mastitis）容易發生在長期使用抗生素乳房灌注之後，因為抗生素殺死競爭性細菌，允許酵母菌（Candida等）過度增生，C正確。","we":["酵母菌可以在血液培養基（blood agar）上生長，A的說法錯誤。","抗真菌藥劑對酵母菌乳房炎效果有限；酵母菌乳房炎通常為自限性，且乳房內投藥效果不確定，B不正確。","長期抗生素乳房灌注使正常菌叢減少，給酵母菌過度增生的機會，C正確。","標準乳房炎軟膏主要含抗生素，對酵母菌感染無效，D的說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_009","year":2023,"roc_year":112,"session":"","examNo":9,"q":"牛隻輸血時，最常用那一種抗凝血劑？","opts":["A. 肝素（heparin）","B. 乙二胺四乙酸二鈉（sodium ethylenediaminetetraacetic acid）","C. 枸橼酸鹽葡萄糖液（acid citrate-dextrose）","D. 草酸鹽（oxalate）"],"ans":2,"exp":"牛隻輸血最常使用枸橼酸鹽葡萄糖液（ACD, acid citrate-dextrose）作為抗凝血劑，C正確。ACD可保存RBC，適合較長時間的血液保存及輸血。","we":["肝素（heparin）在牛輸血中可使用，但非最常用的抗凝劑，A不是最常用。","EDTA用於實驗室血液抽取，不適合用於輸血（有毒性），B不適合輸血。","ACD（acid citrate-dextrose）是牛輸血的標準抗凝劑，可維持RBC活性，C正確。","草酸鹽（oxalate）有毒性，不用於輸血，D不適合輸血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_010","year":2023,"roc_year":112,"session":"","examNo":10,"q":"下列有關牛隻肺臟聽扣診之敘述，何者錯誤？","opts":["A. 利用手指進行扣診胸腔時，在小牛通常可以得到良好的結果，但是在成牛則較不易得到清楚的聽音","B. 扣診牛隻肺臟之邊緣非常重要，若肺氣腫時，常會發現扣診之肺臟邊緣比正常的範圍還要大","C. 扣診牛隻胸腔時，其前下方（頭腹側）若為濁音，常是因為肺有積液所造成","D. 扣診牛隻胸腔時，若其腹側之肺臟邊緣比正常範圍高，表示可能有胸腔積液"],"ans":2,"exp":"問何者「錯誤」。C說「前下方（頭腹側）若為濁音，常是因為肺有積液（pleural effusion）所造成」——前下方濁音更可能是「肺實變（consolidation/pneumonia）」，而非胸腔積液（胸腔積液通常造成腹側的「水平線」濁音）。C的描述不準確。","we":["手指扣診在小牛效果好，成牛胸壁厚效果差，A描述正確。","肺氣腫時過度充氣→扣診範圍擴大，B描述正確。","前下方（cranioventral）濁音更常是肺實變（肺炎）的表現，而非胸腔積液；胸腔積液通常在腹側形成水平濁音線，C的描述有誤。","腹側肺臟邊緣上移（比正常高）是胸腔積液的特徵（液體將肺往背側推），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_011","year":2023,"roc_year":112,"session":"","examNo":11,"q":"下列何種症狀與小牛白肌病最無關聯？","opts":["A. 猝死","B. 心肌病變","C. 呼吸急促及呼吸困難","D. 強烈痙攣"],"ans":3,"exp":"小牛白肌病（white muscle disease, Vitamin E/Se deficiency）的臨床表現：猝死（心肌型）、心肌病變、呼吸急促（呼吸肌受影響）。強烈痙攣（tetanic seizures）不是白肌病的典型表現；白肌病主要是肌肉變性/無力，非神經性痙攣。","we":["猝死（sudden death）是心肌型白肌病的表現，A與白肌病有關。","心肌病變（myocardial lesions）是白肌病的典型病理表現，B與白肌病有關。","呼吸肌受影響可造成呼吸困難，C與白肌病有關。","強烈痙攣（violent convulsions）不是白肌病的典型表現（痙攣更多見於神經疾病），D與白肌病最無關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_012","year":2023,"roc_year":112,"session":"","examNo":12,"q":"下列何項牛寄生蟲性疾病的敘述最不適當？","opts":["A. 牛焦蟲病（babesiosis）較常見於放牧的牛群","B. 牛焦蟲病（babesiosis）可造成溶血性黃疸及貧血","C. 牛新孢子蟲感染症（neosporosis）常造成懷孕4～6月母牛的流產","D. 牛錐蟲病（trypanosomiasis）主要是由壁蝨傳播所引起"],"ans":3,"exp":"問「最不適當」的描述。D說牛錐蟲病（trypanosomiasis）主要由壁蝨（tick）傳播——這是錯誤的。牛錐蟲病（Trypanosoma vivax, T. congolense等）主要由采采蠅（tsetse fly, Glossina sp.）傳播，不是壁蝨。","we":["牛焦蟲病（babesiosis）由壁蝨傳播，放牧牛接觸蜱機會較多，好發率較高，A描述正確。","牛焦蟲病（babesiosis）→RBC寄生蟲→溶血→黃疸及貧血，B描述正確。","Neospora caninum可跨胎盤傳播，最常造成母牛懷孕4-6個月時流產，C描述正確。","牛錐蟲病（trypanosomiasis）主要由「采采蠅（tsetse fly）」傳播，不是壁蝨，D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_013","year":2023,"roc_year":112,"session":"","examNo":13,"q":"牛隻長期持續採食羊齒植物（bracken fern）發生中毒之主徵為何？","opts":["A. 嘔吐","B. 血尿","C. 大腦性缺氧","D. 失明"],"ans":1,"exp":"牛隻長期採食蕨（bracken fern）含有pterylaquiline等毒素，造成骨髓抑制→血小板減少→出血→「血尿（hematuria）」是主徵。","we":["牛隻不能嘔吐（反芻動物），A不是bracken fern中毒的表現。","血尿（hematuria）是bracken fern中毒（骨髓毒性→血小板減少→出血）的主要臨床表現，B正確。","大腦性缺氧不是bracken fern中毒的主徵（馬採食bracken fern因硫胺素缺乏會有神經症狀，但牛不同）。","失明（blindness）不是bracken fern中毒的主要表現（失明更多見於polioencephalomalacia等）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_014","year":2023,"roc_year":112,"session":"","examNo":14,"q":"乳牛在產後常罹患第四胃異位，下列何種因素是此病症的首要條件？","opts":["A. 分娩","B. 產後精粗料比增加","C. 第四胃蠕動能力下降","D. 高泌乳量"],"ans":0,"exp":"乳牛第四胃異位（DA）的首要條件是「分娩（parturition）」。分娩後子宮體積驟然縮小，腹腔空間改變，允許第四胃移位，A正確。其他因素（高精料、蠕動下降）是次要促進因素。","we":["分娩（parturition）是乳牛DA的首要觸發條件，子宮縮小後腹腔空間變化，A正確。","產後精粗料比增加是誘發因素之一，但非首要條件。","第四胃蠕動能力下降是DA的機制之一，但蠕動下降通常是分娩前後能量代謝問題的結果。","高泌乳量是間接相關因素，但非DA的首要條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_015","year":2023,"roc_year":112,"session":"","examNo":15,"q":"下圖中（由尾部向頭部觀），乳牛瘤胃內充滿了泡沫性液體，其最正確的診斷為何？","opts":["A. 原發性臌脹","B. 迷走神經性消化不良","C. 蜂巢胃食滯","D. 重瓣胃食滯"],"ans":0,"exp":"（圖片題）瘤胃充滿泡沫性液體（frothy content）是「原發性臌脹（frothy bloat/primary bloat）」的特徵。泡沫阻礙氣體通過賁門排出，造成持續臌脹。","we":["原發性臌脹（primary frothy bloat）：瘤胃內容物泡沫化，氣泡無法集中排出，A正確為暫定答案。","迷走神經性消化不良（vagal indigestion）：瘤胃食滯但通常不是泡沫性，B不符。","蜂巢胃食滯（reticulo-rumenal impaction）：固態食滯，非泡沫性，C不符。","重瓣胃食滯（omasal impaction）：乾燥食物阻塞，非瘤胃泡沫性，D不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_016","year":2023,"roc_year":112,"session":"","examNo":16,"q":"牛隻食用之牧草地中，若含氮過高會妨害下列何種離子的吸收，而導致青草痙攣症？","opts":["A. 鈉","B. 鉀","C. 鎂","D. 鈣"],"ans":2,"exp":"青草痙攣症（grass tetany/hypomagnesemic tetany）是低鎂血症（hypomagnesemia）所致。高氮（高蛋白質）牧草中高鉀（K）含量會抑制消化道對鎂（Mg）的吸收，導致低鎂血症→痙攣。","we":["鈉（sodium）吸收不受高氮牧草影響，低血鈉不造成痙攣，A不正確。","鉀（potassium）實際上「增加」而非減少（高氮牧草通常也含高鉀），B不正確。","鎂（magnesium）的吸收受高鉀牧草影響而下降，低鎂血症是青草痙攣症的原因，C正確。","鈣（calcium）主要受PTH和VitD調節，高氮牧草對鈣吸收的影響不是青草痙攣症的機制，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_017","year":2023,"roc_year":112,"session":"","examNo":17,"q":"下列何者不是乳牛酮病（ketosis）的有效治療方法？","opts":["A. 靜脈注射500 mL 50% dextrose","B. 口服丙酸鈉","C. 注射corticosteroids","D. 靜脈注射15%磷酸氫二鈉液和Ringer氏液"],"ans":3,"exp":"問何者「不是有效治療方法」。靜脈注射15%磷酸氫二鈉液（sodium phosphate）和Ringer's液不是酮病的標準治療，磷酸鹽用於低磷血症，Ringer's液只是一般輸液，D不是酮病治療。","we":["靜脈注射50% dextrose 500 mL直接補充葡萄糖，是酮病的有效緊急治療，A有效。","口服丙酸鈉（propionate）提供gluconeogenesis的底物，是酮病的輔助治療，B有效。","注射corticosteroids可誘導糖質新生，增加血糖，是酮病的有效治療之一，C有效。","靜脈注射磷酸氫二鈉液用於低磷血症，加上Ringer's液是一般輸液，兩者不是酮病的特異性治療，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_018","year":2023,"roc_year":112,"session":"","examNo":18,"q":"牛尿石症之尿石主要成分為下列何者時，採用氯化銨口服治療最為有效？","opts":["A. 鈣","B. 鎂","C. 氨","D. 矽"],"ans":1,"exp":"氯化銨（NH4Cl）是尿液酸化劑，用於預防磷酸鎂銨（struvite）結石。Struvite（MgNH4PO4）在鹼性尿中形成，其主要成分含「鎂（Mg，B）」，氯化銨酸化尿液後可溶解和預防struvite形成。","we":["鈣結石（calcium oxalate或calcium phosphate）不是氯化銨最有效的適應症，A不是最佳答案。","鎂（struvite = 磷酸鎂銨）結石在鹼性尿中形成，氯化銨酸化尿液可有效預防，B正確。","氨（NH4+）是struvite的成分之一，但選項B（鎂）更精確描述struvite的主要「礦物質」成分，C不是最佳答案。","矽結石（silicon uroliths）不受尿液酸化影響，氯化銨對矽結石無效，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_019","year":2023,"roc_year":112,"session":"","examNo":19,"q":"牛隻站立以腹腔穿刺術進行腹膜液（peritoneal fluid）檢查，下列敘述何者正確？","opts":["A. 腹底部中央區域最低處最容易取得腹膜液","B. 下針時為避免穿刺腹腔臟器，應以30度角入針","C. 抽取針進入腹腔後無法抽取到腹膜液，表示腹膜液過少，為避免引發腹膜炎應停止於其他部位入針","D. 即使抽出外觀清澈之腹膜液也不能排除腹膜炎的可能性"],"ans":3,"exp":"問何者「正確」。D說即使抽出外觀清澈的腹膜液也不能排除腹膜炎——正確！早期腹膜炎或局限性腹膜炎的腹膜液外觀可能仍清澈，需要細胞學和生化檢查才能確認，D正確。","we":["腹底部中央區域（ventral midline）是站立牛腹腔積液最低處，A描述基本正確，但D更具臨床意義。","腹腔穿刺應垂直（90°）入針，而非30度角，B描述不正確。","若一處無法抽到腹膜液，可嘗試換位置，停止嘗試的建議不正確，C描述不正確。","早期腹膜炎的腹膜液可能外觀清澈，但細胞數和蛋白質已升高，不能僅憑外觀清澈排除腹膜炎，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_020","year":2023,"roc_year":112,"session":"","examNo":20,"q":"小牛出生後無法自行站立，前腳球節如下圖無法自行伸直負重，下列何者是較不建議的治療方式？","opts":["A. 輕度時使用矯正板外固定包紮球節","B. 嚴重時進行淺指屈肌肌腱截斷術","C. 輕度時使用自家製矯正蹄鞋","D. 連續IV注射oxytetracycline"],"ans":3,"exp":"問「較不建議」的治療方式。連續IV注射oxytetracycline不是小牛屈曲肢變形的標準治療，oxytetracycline IV用於馬科動物的屈曲變形（foal contracted tendons），且連續給藥有腎毒性風險，D較不建議。","we":["輕度時使用矯正板外固定球節是正確的保守治療，A建議使用。","嚴重時進行淺指屈肌肌腱截斷術（superficial flexor tenotomy）是有效的外科治療，B建議使用。","自家製矯正蹄鞋可用於輕症牛隻，C可接受。","連續IV注射oxytetracycline在牛隻屈曲變形的使用證據有限，且有腎毒性風險，D為較不建議的治療方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_021","year":2023,"roc_year":112,"session":"","examNo":21,"q":"牛隻分娩後消瘦發生第四胃異位，使用右腹脅部大網膜固定術進行治療時，發現大網膜過薄並容易撕裂，為\r  提升手術成功率，在縫合右腹脅部創口時，可同時固定下列那一個構造？","opts":["A. 幽門竇","B. 第四胃胃壁","C. 瘤胃壁","D. 小網膜"],"ans":0,"exp":"右腹脅部手術時若大網膜過薄，可直接縫合「幽門竇（pyloric antrum）」到右側腹壁，替代或輔助大網膜固定，確保第四胃復位後的固定效果，A正確。","we":["幽門竇（pyloric antrum）是第四胃固定術的備用縫合目標，當大網膜薄弱時，直接固定幽門竇到腹壁是有效的替代方式，A正確。","直接縫合第四胃胃壁可能造成漏乳/漏胃液，風險較高，B不是最佳選項。","瘤胃壁固定是左側手術的方法，不適合右側手術，C不正確。","小網膜連接肝臟和第四胃，不是腹壁固定的合適目標，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_022","year":2023,"roc_year":112,"session":"","examNo":22,"q":"小牛臍赫尼亞環直徑大於15公分，下列那一個方法無法增加赫尼亞修復術的成功率？","opts":["A. 使用人工合成mesh材料","B. 使用可吸收線關閉腹腔","C. 術後使用腹部支撐包紮","D. 限制術後運動"],"ans":1,"exp":"問何者「無法」增加>15cm臍疝氣修復術的成功率。使用「可吸收線關閉腹腔」（B）對於大缺損的問題是使用何種縫線材料，但對大缺損的「結構性」支撐無特別幫助——真正能增加成功率的是mesh（A）、包紮（C）和術後護理（D）。可吸收線的選擇不特別增加大缺損的成功率。","we":["Mesh材料可提供機械性支撐，補強大缺損，確實能增加成功率，A有幫助。","使用可吸收線關閉腹腔是適當的縫合材料選擇，但對>15cm大缺損的成功率提升幫助有限（主要需要mesh支撐），B無法特別增加成功率。","術後腹部支撐包紮可減少腹壓、防止縫線張力，C有幫助。","限制術後運動可減少縫合部位的張力，D有幫助。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_023","year":2023,"roc_year":112,"session":"","examNo":23,"q":"在進行牛隻旁腰窩（paralumbar fossa）剖腹產術時，最需被麻醉的脊神經為下列何項？","opts":["A. L1至L2","B. T11至T12","C. L4至L5","D. L5至L7"],"ans":0,"exp":"牛隻旁腰窩（paralumbar fossa）剖腹產術使用腰椎旁神經阻斷（paravertebral block），最需麻醉的是「L1至L2」脊神經（第一和第二腰椎神經），這些神經支配旁腰窩區域的感覺，A正確。","we":["L1至L2（第一和第二腰椎神經）是旁腰窩手術最主要的麻醉目標，A正確。","T11至T12支配胸腹部，不是旁腰窩手術的主要麻醉神經，B不正確。","L4至L5支配後肢，不是旁腰窩手術的主要麻醉神經，C不正確。","L5至L7支配後肢和骨盆區域，不是旁腰窩手術的主要麻醉神經，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_024","year":2023,"roc_year":112,"session":"","examNo":24,"q":"肥育牛隻長期給予大量精料後常引起第一胃酸中毒症狀，隨後便可能再出現何種併發症？","opts":["A. 倒臥母牛症候群","B. 過肥牛症候群","C. 蹄葉炎","D. 迷走神經性消化不良"],"ans":2,"exp":"肥育牛長期大量精料→第一胃急性酸中毒（ruminal acidosis）→腸道黏膜損傷→細菌內毒素（LPS）吸收→全身炎症→蹄葉炎（laminitis），C正確。","we":["倒臥母牛症候群（downer cow syndrome）通常發生在分娩後，非精料過多的直接後果，A不正確。","過肥牛症候群（fat cow syndrome）是分娩前過度肥胖，非肥育牛高精料的直接後果，B不正確。","瘤胃酸中毒→腸道損傷→LPS吸收→蹄葉炎是已知的病理機制，C正確。","迷走神經性消化不良是慢性瘤胃/第四胃問題，非精料過多的典型後果，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_025","year":2023,"roc_year":112,"session":"","examNo":25,"q":"牛隻若出現步態強拘，體溫正常，球節部顯著下沉，蹄壁有多數明顯蹄輪，蹄底前端向上翹而以蹄踵部負\r   重，蹄尖部角質向前方顯著伸展，蹄骨前端向下壓迫蹄底，可診斷為下列何項？","opts":["A. 裂蹄病（sandcrack）","B. 慢性腐蹄病（footrot）","C. 慢性蹄葉炎（laminitis）","D. 蹄骨發炎"],"ans":2,"exp":"步態強拘、球節下沉（sinking）、蹄輪（rings on hoof wall）、蹄尖上翹、蹄骨前端向下壓迫蹄底——這是「慢性蹄葉炎（chronic laminitis）」的典型表現：蹄骨旋轉和下沉（rotation and sinking of coffin bone）。","we":["裂蹄病（sandcrack）是蹄壁縱向裂開，症狀不符本描述，A不正確。","慢性腐蹄病（chronic footrot）以蹄間組織壞死為主，不會有蹄輪和蹄骨下沉的完整描述，B不正確。","慢性蹄葉炎（chronic laminitis）的特徵完整符合：蹄輪（以往的炎症記錄）、蹄骨旋轉下沉（蹄尖上翹、蹄骨壓迫蹄底）、球節下沉，C正確。","蹄骨發炎（pedal osteitis）以蹄底觸痛為主，不符合本描述，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_026","year":2023,"roc_year":112,"session":"","examNo":26,"q":"以toggle pin治療乳牛第四胃異位，若病牛食慾沒有明顯改善，則最好在幾天內將固定之縫線拆除？","opts":["A. 2","B. 5","C. 10","D. 14"],"ans":3,"exp":"Toggle pin固定第四胃後，若食慾沒有明顯改善，建議在「14天」內將縫線拆除，以避免局部腹膜炎或縫線遷移造成更多問題，D正確。","we":["2天太短，還未能充分評估治療效果，A不適合。","5天也偏短，B不是標準建議。","10天較接近，C可接受，但14天是常用的最長等待期限。","Toggle pin治療無效者（食慾未改善），應在14天內拆除縫線，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_027","year":2023,"roc_year":112,"session":"","examNo":27,"q":"預防公羊的尿道結石可於飼料中添加下列何種添加物？","opts":["A. 4% 食鹽","B. 4% 氧化鎂","C. 4% 硫酸鎂","D. 4% 小蘇打"],"ans":0,"exp":"預防公羊尿道結石，在飼料中添加「4%食鹽（NaCl）」可增加飲水量，稀釋尿液中礦物質濃度，降低結石形成風險，A正確。","we":["4%食鹽增加口渴感→增加飲水量→稀釋尿液→降低結石形成，A正確。","氧化鎂（MgO）是鹼化劑，用於調節pH，但不如食鹽在預防尿石方面有效，B不是最佳選項。","硫酸鎂（MgSO4）主要用於瀉下，不用於預防尿石，C不正確。","小蘇打（NaHCO3）是鹼化劑，用於調節pH，對磷酸鎂銨結石預防不如食鹽有效，D不是最佳選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_028","year":2023,"roc_year":112,"session":"","examNo":28,"q":"下列何種術式被認為最可以成功治療各種類的山羊尿道結石，並有最少的尿道阻塞復發率？","opts":["A. urethral process amputation","B. tube cystostomy","C. perineal urethrostomy","D. penile amputation"],"ans":2,"exp":"山羊尿道結石各種術式比較，perineal urethrostomy（會陰尿道造口術）可治療各種類型的結石，且復發率最低，C正確。","we":["Urethral process amputation（尿道突切除）只解決尿道突處阻塞，其他部位結石仍可復發，A效果有限。","Tube cystostomy（膀胱造瘻管）是暫時性引流措施，不是長期解決方案，B不是最有效。","Perineal urethrostomy可切除遠端尿道並擴大尿道開口，是治療各種類型山羊尿道結石最有效且復發率最低的術式，C正確。","Penile amputation（陰莖截斷術）是最後手段，保留雄性外觀但不是首選，D效果雖佳但手術過大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_029","year":2023,"roc_year":112,"session":"","examNo":29,"q":"下列何者並非貓白內障常見的原因？","opts":["A. 糖尿病（diabetes mellitus）","B. 前葡萄膜炎（anterior uveitis）","C. 青光眼（glaucoma）","D. 遺傳性"],"ans":0,"exp":"問「並非」貓白內障的常見原因。貓白內障最常見原因是前葡萄膜炎（anterior uveitis）。糖尿病（DM）在貓很少造成白內障（與犬不同，犬DM幾乎必然白內障），A是最不常見的原因。","we":["糖尿病（DM）在「犬」常造成白內障，但在「貓」較少見，A並非貓白內障的常見原因，A正確答案。","前葡萄膜炎（anterior uveitis）是貓白內障最常見的原因，B是常見原因（非答案）。","青光眼（glaucoma）的長期眼壓升高可導致繼發性白內障，C是可能原因（非答案）。","遺傳性白內障在某些貓品種中存在，D是可能原因（非答案）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_030","year":2023,"roc_year":112,"session":"","examNo":30,"q":"飼主門診帶來一隻11歲齡雌性馬爾濟斯犬，主訴於近日開始出現咳嗽症狀，主治醫師於身體檢查後進行右側躺胸腔X光影像如圖，其中紅色虛線為氣管及主支氣管而紅色區塊為異常擴大之部分，此異常為下列何項？","opts":["A. 左心房擴大（left atrial enlargement）","B. 左心室擴大（left ventricular enlargement）","C. 右心房擴大（right atrial enlargement）","D. 右心室擴大（right ventricular enlargement）"],"ans":0,"exp":"（圖片題）11歲齡馬爾濟斯犬，小型老年犬咳嗽，胸腔X光右側躺顯示紅色區塊（異常擴大）壓迫氣管。小型犬MMVD（二尖瓣退行性疾病）→左心房擴大→壓迫左主支氣管→咳嗽。暫定答案A（左心房擴大）。","we":["左心房（left atrial）擴大是小型老年犬最常見的心臟疾病（MMVD）的表現，壓迫支氣管造成咳嗽，A為暫定答案。","左心室（left ventricular）擴大也可能，但在MMVD早中期，左心房擴大較左心室明顯，B可能性較低。","右心房（right atrial）擴大不是MMVD的主要表現，C可能性較低。","右心室（right ventricular）擴大通常在肺動脈高壓時出現，D可能性較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_031","year":2023,"roc_year":112,"session":"","examNo":31,"q":"Schober KE在2011年的研究中指出當狗在接受心衰竭治療時，飼主於家中計算患犬靜息呼吸速率（resting\r   respiratory rate）每分鐘多少標準值以下，可預測其心衰竭的控制是良好的？","opts":["A. <100次","B. <60次","C. <40次","D. <20次"],"ans":2,"exp":"Schober 2011研究指出：心衰竭犬的靜息呼吸速率（resting respiratory rate）< 30次/分鐘預測心衰竭控制良好。四個選項中，C（<40次/分鐘）是最接近並包含30的合理臨床閾值。","we":["<100次/分鐘範圍太寬，無法預測心衰竭控制，A不正確。","<60次/分鐘接近正常呼吸速率，但不是Schober研究的精確閾值，B不精確。","<40次/分鐘（實際標準是<30次/分鐘，C是選項中最接近的值），是臨床使用的心衰竭控制良好閾值，C正確。","<20次/分鐘過低，正常貓犬靜息呼吸速率就接近此值，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_032","year":2023,"roc_year":112,"session":"","examNo":32,"q":"用來評估犬隻視力的脅迫測試（menace test），其正常的脅迫反應（menace response）需要多條神經參與，下\r   列何項與此脅迫反應無關？","opts":["A. optic nerve","B. optic radiation up to the occipital cortex","C. oculomotor nerve","D. facial nerve"],"ans":2,"exp":"問與menace test「無關」的神經。Menace response路徑：視網膜→視神經（CNII）→視束→視覺皮質→小腦→顏面神經（CNVII）→瞬目肌收縮。動眼神經（oculomotor nerve, CNIII）負責控制眼外肌（extraocular muscles）和瞳孔括約肌，與menace response的瞬目反射無關，C正確。","we":["Optic nerve（視神經，CNII）傳導視覺刺激是menace response的傳入路徑，A與此反射有關。","Optic radiation to occipital cortex（視覺皮質）是menace response的中樞整合部分，B與此反射有關。","Oculomotor nerve（動眼神經，CNIII）控制眼外肌和瞳孔，不涉及瞬目反射，C與menace test無關，C正確。","Facial nerve（顏面神經，CNVII）支配orbicularis oculi肌，執行瞬目動作，D與此反射有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_033","year":2023,"roc_year":112,"session":"","examNo":33,"q":"下列關於貓甲狀腺功能亢進疾病敘述，何者最不適當？","opts":["A. 心搏過速，增加心肌負擔","B. 由於促甲狀腺激素（thyroid-stimulating hormone）分泌過於旺盛","C. 臨床症狀包括多食、多渴、嘔吐、下痢","D. 大多可觸診到甲狀腺腫大"],"ans":1,"exp":"問「最不適當」。B說「由於促甲狀腺激素（TSH）分泌過於旺盛」——這是錯誤的！貓甲狀腺亢進是甲狀腺腺體自律性（autonomously）過度分泌T3/T4，TSH反而因負回饋而「被抑制」至極低值。","we":["甲狀腺亢進→T3/T4過多→心搏加速、心肌負擔增加，A描述正確。","貓甲狀腺亢進是甲狀腺腺瘤自律分泌T3/T4，TSH反而「受到抑制」（低值），B的「TSH分泌過旺」描述錯誤，B是最不適當的選項。","多食、多渴、嘔吐、下痢是貓甲狀腺亢進的典型症狀，C描述正確。","約70-80%的貓甲亢可觸診到甲狀腺腫大，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_034","year":2023,"roc_year":112,"session":"","examNo":34,"q":"下列何者不是貓慢性腎病進展可能的結果？","opts":["A. 副甲狀腺功能低下（hypoparathyroidism）","B. 骨化三醇（calcitriol）合成下降","C. 離子與水分排除受阻","D. 尿毒症"],"ans":0,"exp":"問「不是CKD進展結果」。A說「副甲狀腺功能低下（hypoparathyroidism）」——CKD造成的是「繼發性副甲狀腺「亢進」（secondary hyperparathyroidism）」：CKD→低calcitriol→低鈣→PTH升高代償→副甲狀腺亢進。A的「低下」描述相反。","we":["CKD導致繼發性副甲狀腺「亢進」（hyperparathyroidism），而非「低下」（hypoparathyroidism），A描述錯誤，A是正確答案。","腎臟合成calcitriol（活性VitD），CKD時腎臟功能下降→calcitriol合成減少，B描述正確（是CKD的進展結果）。","CKD晚期腎臟排泄功能下降→離子和水分排除受阻（少尿/無尿），C描述正確。","CKD→含氮廢物積聚→尿毒症（uremia），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_035","year":2023,"roc_year":112,"session":"","examNo":35,"q":"環孢素（cyclosporine）為皮膚免疫相關疾病及異位性皮膚炎的的重要用藥，下列何者不是其副作用？","opts":["A. 消化道副作用如嘔吐、下痢、厭食","B. 皮膚乳頭狀增生及足墊過度角質化","C. 骨髓抑制及白血球低下","D. 齒齦增生與過度流涎"],"ans":2,"exp":"問「不是cyclosporine副作用」。Cyclosporine的主要副作用是：消化道問題、皮膚乳頭增生、齒齦增生、腎毒性。「骨髓抑制及白血球低下」是azathioprine、cyclophosphamide等細胞毒性藥物的副作用，不是cyclosporine的典型副作用，C是答案。","we":["消化道副作用（嘔吐、下痢、厭食）是cyclosporine常見副作用，A是cyclosporine的副作用。","皮膚乳頭狀增生及足墊過度角質化是cyclosporine的已知副作用，B是cyclosporine的副作用。","骨髓抑制及白血球低下是azathioprine等免疫抑制劑的副作用，不是cyclosporine的典型副作用，C不是cyclosporine副作用，C正確。","齒齦增生（gingival hyperplasia）是cyclosporine的已知副作用（在人尤其明顯），D是cyclosporine的副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_036","year":2023,"roc_year":112,"session":"","examNo":36,"q":"有關犬貓之輸血處置，下列敘述何項正確？","opts":["A. 輸血之血液可以合併給予乳酸林格氏液","B. 貓咪如果未曾接受過輸血，在緊急狀態時可以直接接受輸血","C. 犬隻具有輸血配對意義的紅血球抗原為DEA 1, 2, 8","D. 接受輸血後數日，病畜發生的未預期血容積比下降及血紅素尿，可能是延遲性溶血反應"],"ans":3,"exp":"問何者「正確」。D說輸血後數日發生未預期血容積比下降及血紅素尿，可能是「延遲性溶血反應（delayed hemolytic transfusion reaction, DHTR）」——正確！DHTR在輸血後3-10天發生，因抗體滴度升高溶解輸入的紅血球。","we":["輸血血液不應合併給予乳酸林格液（含Ca²+），Ca²+可能與抗凝劑（ACD中的citrate）作用，影響抗凝效果，A不正確。","貓有自然同凝集素（alloantibodies），B型貓輸A型血（或反之）可能造成嚴重溶血，緊急狀態仍需配型或謹慎，B不完全正確。","犬的輸血配對最重要的抗原是DEA 1（DEA 1.1和DEA 1.2），C描述「DEA 1, 2, 8」不完全準確（DEA 7也重要）。","輸血後數日發生溶血症狀是延遲性溶血輸血反應（DHTR）的典型表現，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_037","year":2023,"roc_year":112,"session":"","examNo":37,"q":"下列何項不是造成犬隻多食（polyphagia）的原因？","opts":["A. 給予phenobarbital甦醒後","B. 糖尿病","C. 靜脈注射葡萄糖或脂肪類的輸液","D. 胰島素瘤（insulinoma）"],"ans":2,"exp":"問「不是」造成多食（polyphagia）的原因。C說靜脈注射葡萄糖或脂肪類輸液——這是靜脈給予，繞過消化道採食行為，不會造成「多食（polyphagia，行為性採食增加）」，C不是多食的原因。","we":["Phenobarbital（苯巴比妥）治療癲癇後，確實會造成多食多渴（polyphagia, PU/PD）的副作用，A是多食的原因。","糖尿病→細胞不能利用葡萄糖→饑餓感增加→多食，B是多食的原因。","靜脈注射葡萄糖/脂肪輸液是靜脈給予，不涉及採食行為，不會造成多食（polyphagia），C不是多食原因，C正確。","胰島素瘤（insulinoma）→低血糖→血糖偵測器刺激採食→多食，D是多食的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_038","year":2023,"roc_year":112,"session":"","examNo":38,"q":"下列何項情況最不可能是造成小黑的hyponatremia的原因？","opts":["A. 嚴重肝病","B. 腹膜炎","C. 二尖瓣脫垂","D. 敗血症或全身炎症反應綜合症（SIRS）"],"ans":2,"exp":"問「最不可能」造成低血鈉的原因。C（二尖瓣脫垂）——輕度二尖瓣脫垂（MVP）通常無顯著血流動力學影響，不直接造成低血鈉；只有嚴重充血性心衰竭才會因RAAS/ADH過度活化造成低血鈉，C最不可能。","we":["嚴重肝病→低白蛋白→腹水→有效循環血量減少→ADH→稀釋性低血鈉，A可能造成低血鈉。","腹膜炎→液體轉移至腹腔→有效循環血量減少→ADH→低血鈉，B可能造成低血鈉。","二尖瓣脫垂（mitral valve prolapse）輕度時不影響血流動力學，不會直接造成低血鈉，C最不可能造成低血鈉，C正確。","敗血症/SIRS→炎症介質→ADH分泌→稀釋性低血鈉，D可能造成低血鈉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_039","year":2023,"roc_year":112,"session":"","examNo":39,"q":"該犬以International Renal Interest Society（IRIS）分級為第幾級？","opts":["A. 第三級","B. 第五級","C. 第六級","D. 第四級"],"ans":3,"exp":"（此題為承接題，缺乏前置病史，需人工確認。IRIS CKD犬分期：Stage I <1.4 mg/dL，Stage II 1.4-2.0，Stage III 2.1-5.0，Stage IV >5.0 mg/dL。注意IRIS只有Stage I-IV，選項B（第五級）和C（第六級）不存在於IRIS分期。）","we":["第三級（Stage III）：犬creatinine 2.1-5.0 mg/dL，可能，但需確認病史數值，A為可能選項。","第五級（Stage V）不存在於IRIS分期，IRIS只有Stage I-IV，B是無效選項。","第六級（Stage VI）不存在於IRIS分期，C是無效選項。","第四級（Stage IV）：犬creatinine >5.0 mg/dL，嚴重腎衰竭，D為暫定答案（需確認病史）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_040","year":2023,"roc_year":112,"session":"","examNo":40,"q":"在治療方面，那項輸液目前最不適合？","opts":["A. 0.45% sodium chloride + dextrose","B. 生理食鹽水","C. 犬血清蛋白","D. 犬新鮮冷凍血漿（fresh frozen plasma）"],"ans":0,"exp":"（此題為承上題的承接題，缺乏前置病史。若患犬有低血鈉（Q38）和CKD（Q39），輸液選擇：0.45% NaCl + dextrose是低張液，可能加重低血鈉，是最不適合的輸液。）","we":["0.45% NaCl + dextrose是低張液，對已有低血鈉的犬可能進一步稀釋血鈉，A最不適合（暫定答案）。","生理食鹽水（0.9% NaCl）是等張液，對CKD低血鈉患犬相對安全，B可使用。","犬血清蛋白（albumin）用於低白蛋白血症，但非腎病低血鈉的常規首選輸液，C選擇性使用。","新鮮冷凍血漿（FFP）主要用於凝血障礙，不是腎病低血鈉的適應症，D不適合但非「最不適合」。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_041","year":2023,"roc_year":112,"session":"","examNo":41,"q":"根據病史該犬最有可能的休克種類為下列何項？","opts":["A. 心因性（cardiogenic）","B. 低血量（hypovolemia）","C. 分布異常性（distributive）","D. 阻塞性（obstructive）"],"ans":1,"exp":"（此題為承接題，缺乏前置病史。若患犬有CKD且血液流失或液體失衡，hypovolemic shock最可能。）","we":["心因性休克（cardiogenic）因心臟泵功能不全，通常有心臟病史，非最常見，A可能性較低。","低血量休克（hypovolemic）是失血、嘔吐、腹瀉等液體流失所致，在急性腎臟/腹部病例中常見，B為暫定答案。","分布異常性休克（distributive）多見於敗血症/過敏反應，C需更多病史。","阻塞性休克（obstructive）由機械阻塞所致，C需更多病史。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_042","year":2023,"roc_year":112,"session":"","examNo":42,"q":"下列有關貓自發性膀胱炎（feline idiopathic cystitis）的敘述，何項最不適當？","opts":["A. 過胖的貓可以進行減重","B. 多數發病的原因常與膀胱本身結構有關","C. 急性期可給予buprenorphine止痛","D. 大部分不需處理可在2～7天內自己改善"],"ans":1,"exp":"問「最不適當」。B說FIC的發病原因「常與膀胱本身結構有關」——這是錯誤的！FIC（feline idiopathic cystitis）的主要發病機制與「壓力（stress）」和「神經-內分泌因素」有關，並非主要是膀胱結構問題（少數有GAG layer缺陷），B不正確。","we":["過胖貓的肥胖是FIC的風險因子，進行減重是合理的管理措施，A描述正確。","FIC的主要原因是多因子的，以壓力和神經內分泌因素為主，並非主要是膀胱結構問題，B描述不正確，是最不適當的選項。","急性FIC疼痛明顯，給予buprenorphine（opioid）止痛是合理的治療，C描述正確。","大多數FIC在2-7天內自行改善，短期自限性是FIC的特點，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_043","year":2023,"roc_year":112,"session":"","examNo":43,"q":"犬胸腔X光下發現肺動脈及肺靜脈同時變大，下列何者非其可能之診斷？","opts":["A. 法洛氏四重畸形（tetralogy of Fallot）","B. 左至右永存性動脈導管（left to right patent ductus arteriosus）","C. 左至右心室中膈缺損（left to right ventricular septal defect）","D. 輸液過量（iatrogenic intravenous fluid overload）"],"ans":0,"exp":"問「非其可能之診斷」。法洛氏四重畸形（Tetralogy of Fallot, ToF）是右至左分流（R→L shunt），導致「肺血流減少（pulmonary hypoperfusion）」，肺動脈和靜脈應該「變小」而非擴大，故A不可能造成肺動脈和肺靜脈同時擴大。","we":["法洛氏四重畸形（ToF）是右至左分流，肺循環血流「減少」，肺動脈和靜脈應縮小，不會擴大，A非其可能診斷，A是正確答案。","PDA（左至右）→額外血液進入肺循環→肺動脈和靜脈均擴大，B是可能診斷。","VSD（左至右）→額外血液進入肺循環→肺動脈和靜脈均擴大，C是可能診斷。","輸液過量→肺靜脈壓升高→肺動靜脈均擴張，D是可能診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_044","year":2023,"roc_year":112,"session":"","examNo":44,"q":"14歲雄性絕育混種貓，咳嗽，胸腔X光可見彎曲的主動脈，其臨床意義為何？","opts":["A. 老貓的正常變異，無臨床意義","B. 和系統性高血壓有關","C. 繼發於貓心肌病","D. 腫瘤壓迫"],"ans":1,"exp":"老年貓的胸腔X光可見「主動脈彎曲（tortuous/kinked aorta）」，這與「系統性高血壓（systemic hypertension）」有關：長期高血壓→主動脈壁結構改變（彈性纖維減少）→主動脈迂曲，B正確。","we":["老年貓主動脈彎曲不是正常變異，有臨床意義，A不正確。","主動脈彎曲（tortuous aorta）是長期系統性高血壓的影像學表現，B正確。","心肌病（cardiomyopathy）主要影響心臟大小形狀，不直接造成主動脈彎曲，C不正確。","腫瘤壓迫可能造成外在性移位，但不造成主動脈本身的彎曲/迂曲，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_045","year":2023,"roc_year":112,"session":"","examNo":45,"q":"下列影像敘述何者錯誤？","opts":["A. 側照右中葉可見肺葉徵（lobar sign）","B. 側照右中葉可見空氣支氣管顯影（air bronchogram）","C. VD照左前葉可見肺泡圖像（alveolar pattern）","D. 側照右中葉可見支氣管圖像（bronchial pattern）"],"ans":3,"exp":"（圖片題，需人工確認。若右中葉有alveolar pattern（lobar sign + air bronchogram），則bronchial pattern不是該部位的典型表現；D說「側照右中葉可見支氣管圖像」可能與alveolar consolidation的表現不符。）","we":["（待確認）","（待確認）","（待確認）","Bronchial pattern（支氣管圖像）出現在bronchial disease，若右中葉為alveolar consolidation，則不會主要呈現bronchial pattern，D可能為錯誤描述。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_046","year":2023,"roc_year":112,"session":"","examNo":46,"q":"承上題，最有可能的區別診斷為何?","opts":["A. 肺炎","B. 心因性肺水腫","C. 非心因性肺水腫","D. 原發肺腫瘤"],"ans":0,"exp":"（承接題，需人工確認。依Q45圖片描述，若右中葉有lobar sign + air bronchogram，最可能是肺炎（lobar pneumonia），A暫定。）","we":["肺炎（pneumonia）呈現lobar sign + air bronchogram + alveolar pattern，A為暫定答案。","心因性肺水腫通常雙側對稱，非lobar pattern，B可能性較低。","非心因性肺水腫也多為非lobar分布，C可能性較低。","原發性肺腫瘤多為單一結節，不典型呈lobar consolidation，D可能性較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_047","year":2023,"roc_year":112,"session":"","examNo":47,"q":"下列犬貓何種疾病在X光影像上，最常觀察到縱膈淋巴結腫大（mediastinal lymph node enlargement）？","opts":["A. 原發性肺腫瘤（primary lung tumor）","B. 散播性組織細胞肉瘤（disseminated histiocytic sarcoma）","C. 轉移性肺腫瘤（metastatic lung tumor）","D. 膿胸（pyothorax）"],"ans":0,"exp":"犬貓X光縱膈淋巴結腫大（mediastinal lymphadenopathy）最常見於「原發性肺腫瘤（primary lung tumor）」，因腫瘤細胞轉移至胸骨旁和縱膈淋巴結，A正確。","we":["原發性肺腫瘤（adenocarcinoma等）常轉移至縱膈/胸骨旁淋巴結，X光可見縱膈淋巴結腫大，A正確。","散播性組織細胞肉瘤（disseminated histiocytic sarcoma）可侵犯全身淋巴結，但縱膈並非最典型，B不是最常見。","轉移性肺腫瘤（metastatic lung tumor）通常血行轉移到肺，不典型造成縱膈淋巴結腫大，C不常見。","膿胸（pyothorax）是胸腔感染，不典型造成縱膈淋巴結腫大，D不常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_048","year":2023,"roc_year":112,"session":"","examNo":48,"q":"犬隻慢性小腸疾病導致吸收功能不足時，何種血液成分可能出現低下？","opts":["A. iron and selenium","B. sodium and chloride","C. folate and cobalamin","D. copper and magnesium"],"ans":2,"exp":"犬慢性小腸疾病吸收不良時，容易低下的血液成分是「folate（葉酸）和cobalamin（維生素B12）」。Folate在近端小腸吸收，cobalamin在遠端小腸（迴腸）吸收，慢性小腸疾病兩者均可缺乏，C正確。","we":["Iron和selenium雖然也在小腸吸收，但不如folate/cobalamin在評估小腸吸收功能時有特異性，A不是最佳答案。","Sodium和chloride主要透過主動運輸機制調節，慢性小腸疾病不典型造成這兩種離子低下，B不是最佳答案。","Folate（近端小腸吸收）和cobalamin（遠端小腸吸收）是評估小腸吸收功能的重要指標，C正確。","Copper和magnesium的吸收不如folate/cobalamin在慢性小腸疾病評估中有代表性，D不是最佳答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_049","year":2023,"roc_year":112,"session":"","examNo":49,"q":"有關貓淋巴瘤，下列敘述何者正確？","opts":["A. 患貓的周邊血液抹片常見到淋巴母細胞","B. 消化道淋巴瘤常見於中年或老年貓","C. 胸中膈淋巴瘤常見於中年或老年貓","D. 多中心性淋巴瘤為最常見的貓淋巴瘤"],"ans":1,"exp":"問貓淋巴瘤「正確」的描述。消化道淋巴瘤（GI lymphoma）是貓最常見的淋巴瘤類型，常見於中年至老年貓，B正確。","we":["周邊血液抹片出現淋巴母細胞不是貓淋巴瘤的常見表現（除非是leukemic phase），A不正確。","消化道淋巴瘤（GI lymphoma）是貓最常見的淋巴瘤，且好發於中年或老年貓（>7歲），B正確。","胸中膈（mediastinal）淋巴瘤常見於「年輕貓」（尤其FeLV陽性），不是中老年貓的好發類型，C不正確。","多中心性淋巴瘤是犬最常見的類型，在貓中並非最常見（貓最常見是GI lymphoma），D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_050","year":2023,"roc_year":112,"session":"","examNo":50,"q":"犬隻患有頸部上呼吸道阻塞時，常出現急性呼吸窘迫（acute respiratory distress），最不需要下列何種處置？","opts":["A. 鎮靜","B. 氧氣","C. 類固醇","D. 支氣管擴張劑"],"ans":3,"exp":"問「最不需要」的處置。犬頸部上呼吸道阻塞急性呼吸窘迫：支氣管擴張劑（D）作用於下呼吸道（bronchi），對「上呼吸道阻塞」無效，是最不需要的處置。","we":["鎮靜可降低焦慮和用力呼吸，減少氧氣消耗，是上呼吸道阻塞急救的重要措施，A需要。","氧氣補充是任何呼吸窘迫的首要處置，B需要。","類固醇可減少上呼吸道水腫（如喉頭水腫），C需要。","支氣管擴張劑（如terbutaline）作用在下呼吸道（bronchospasm），對上呼吸道阻塞無效，D最不需要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_051","year":2023,"roc_year":112,"session":"","examNo":51,"q":"下列何者通常最不可能發生在nephrotic syndrome？","opts":["A. hypercoagulable state","B. hypercholesterolemia","C. hyperlipidemia","D. hyperproteinemia"],"ans":3,"exp":"問「最不可能」發生在nephrotic syndrome的情況。Nephrotic syndrome特徵：大量蛋白尿→低蛋白血症（hypoproteinemia）→高脂血症→高凝血狀態。「高蛋白血症（hyperproteinemia）」是相反的，不可能出現在nephrotic syndrome，D正確。","we":["Hypercoagulable state（高凝血狀態）：抗凝蛋白（如antithrombin III）從尿液流失→凝血失衡，A可能出現。","Hypercholesterolemia（高膽固醇血症）：肝臟代償性合成增加→高脂蛋白血症，B可能出現。","Hyperlipidemia（高脂血症）：與高膽固醇血症同時出現，C可能出現。","Hyperproteinemia（高蛋白血症）：Nephrotic syndrome是「低蛋白血症」（蛋白從尿液流失），高蛋白血症「不可能」出現，D是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_052","year":2023,"roc_year":112,"session":"","examNo":52,"q":"在雌犬陰道和雄犬陰莖基部出現花椰菜狀之腫瘤最常見為","opts":["A. 惡性平滑肌瘤","B. 惡性複層扁平上皮細胞瘤","C. 犬傳染性花柳性腫瘤","D. 惡性淋巴瘤"],"ans":2,"exp":"犬傳染性花柳性腫瘤（canine transmissible venereal tumor, TVT）是犬特有的接觸傳染性腫瘤，好發於外生殖器（陰道、陰莖基部等），外觀呈花椰菜狀（cauliflower-like），C正確。","we":["惡性平滑肌瘤不是外生殖器花椰菜狀腫瘤的最常見診斷，A不正確。","惡性複層扁平上皮細胞瘤（squamous cell carcinoma）通常呈潰瘍性，非花椰菜狀，B不正確。","犬傳染性花柳性腫瘤（TVT）是外生殖器最典型的花椰菜狀腫瘤，直接接觸傳播，C正確。","惡性淋巴瘤呈全身性淋巴結腫大，不呈現外生殖器花椰菜狀，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_053","year":2023,"roc_year":112,"session":"","examNo":53,"q":"下列何項最不可能造成犬隻急性腎衰竭？","opts":["A. 使用cisplatin","B. 細菌性心內膜炎","C. 使用非類固醇性消炎藥（NSAIDs）","D. 使用mannitol"],"ans":3,"exp":"問「最不可能」造成犬急性腎衰竭（ARF）的藥物。Mannitol（甘露醇）是高滲性利尿劑，適量使用可保護腎小管（减少铸型形成），不會造成急性腎衰竭，D最不可能。","we":["Cisplatin（順鉑）是腎毒性化療藥，直接損傷腎小管，A會造成ARF。","細菌性心內膜炎→菌血症→腎臟感染性栓塞→腎損傷，B可能造成ARF。","NSAIDs抑制prostaglandins→腎臟血管收縮→腎缺血→ARF（尤其在低灌流時），C可能造成ARF。","Mannitol是滲透性利尿劑，不直接損傷腎臟，適量使用保護腎小管，D最不可能造成ARF。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_054","year":2023,"roc_year":112,"session":"","examNo":54,"q":"有關犬肥大細胞瘤（mast cell tumor）之敘述，下列何者最不適當？","opts":["A. 最常見的皮膚腫瘤","B. 黃金獵犬（golden retriever）是好發犬種","C. 散播性肥大細胞增多症（disseminated mastocytosis）是確診依據","D. 單獨以放射線治療效果有限"],"ans":2,"exp":"問「最不適當」。C說「散播性肥大細胞增多症（disseminated mastocytosis）是確診依據」——這是錯誤的！MCT的確診是靠「細針穿刺細胞學（FNA cytology）」或「組織切片（histopathology）」，散播性肥大細胞增多症是晚期MCT的臨床表現，不是確診方法。","we":["MCT是犬最常見的皮膚惡性腫瘤，A描述正確。","黃金獵犬（Golden Retriever）、拳師犬（Boxer）等是MCT好發犬種，B描述正確。","散播性肥大細胞增多症是MCT播散的表現，不是MCT的確診依據；確診需FNA細胞學或組織切片，C描述不正確，是最不適當的選項。","MCT對放射線治療有一定反應，尤其是局部控制，但說「效果有限」也有一定根據，D描述有討論空間但不如C明確錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_055","year":2023,"roc_year":112,"session":"","examNo":55,"q":"犬隻慢性腎衰竭不會出現下列何項症狀？","opts":["A. 高血壓","B. 貧血","C. 蛋白尿","D. 寡尿"],"ans":3,"exp":"問「不會出現」的症狀。慢性腎衰竭（CKD）通常表現為「多尿（polyuria）」（腎小管濃縮功能下降），而非「寡尿（oliguria）」。寡尿是急性腎衰竭（ARF）或終末期CKD的表現，D正確（寡尿不是典型CKD症狀）。","we":["高血壓是CKD的常見伴隨症狀（RAAS激活），A會出現。","貧血（非再生性）是CKD的典型症狀（EPO合成減少），B會出現。","蛋白尿是腎絲球損傷的標誌，也是CKD進展的預後因子，C會出現。","慢性腎衰竭通常是「多尿」（腎小管濃縮能力下降），而非「寡尿」；寡尿出現在急性腎衰竭或終末期，D通常不會出現（尤其在中期CKD）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_056","year":2023,"roc_year":112,"session":"","examNo":56,"q":"下列何者不是犬隻胃擴張及扭轉的手術目的？","opts":["A. 永久固定幽門竇（pyloric antrum）與右側腹壁","B. 移除死亡及壞死組織","C. 固定食道位置","D. 將胃復位至正常位置"],"ans":2,"exp":"問「不是GDV手術目的」。C說「固定食道位置」——這不是GDV手術的目標。GDV手術目標是：胃復位、去除壞死組織、永久胃固定（gastropexy）。固定食道不是必要的手術步驟，C正確。","we":["永久固定幽門竇與右側腹壁（right-side gastropexy）是GDV手術的核心目標之一，A是手術目的。","移除壞死組織（胃壁、脾臟）是GDV手術的必要步驟，B是手術目的。","固定食道不是GDV手術的標準目標，食道不需要固定，C不是手術目的，C正確。","將胃復位至正常解剖位置是GDV手術的基本步驟，D是手術目的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_057","year":2023,"roc_year":112,"session":"","examNo":57,"q":"下列關於犬胃扭轉的敘述，何者最不適當？","opts":["A. 將胃幽門部和右側腹壁固定可預防發病","B. 小型犬也會發生","C. 開腹治療時，若看到脾臟扭轉而呈黑紅色，應先將扭轉處轉正，若顏色未改變再進行切除","D. 術後若出現心律不整，並不會增加犬隻死亡風險"],"ans":3,"exp":"問「最不適當」。D說「術後出現心律不整並不會增加犬隻死亡風險」——這是錯誤的！GDV術後的心室性早期搏動（VPC）和心律不整是已知的重要死亡危險因子，D描述完全錯誤。","we":["幽門部和右側腹壁固定（gastropexy）是預防GDV復發的有效措施，A描述正確。","GDV雖然好發於大型深胸犬，小型犬也可發生，B描述正確。","脾臟扭轉時先嘗試還原，若顏色未恢復再切除是正確的手術處置順序，C描述正確。","GDV術後的心律不整（尤其VPC、室性心動過速）顯著增加死亡風險，D的說法完全錯誤，D是最不適當的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_058","year":2023,"roc_year":112,"session":"","examNo":58,"q":"關於犬膽囊黏液囊腫的敘述，下列何者最不適當？","opts":["A. 罹病風險因子包括腎上腺或甲狀腺疾患","B. 嚴重時可能造成膽汁性腹膜炎","C. 無症狀時，可嘗試給予利膽劑治療","D. 患犬膽汁中常可培養出大腸桿菌或鏈球菌"],"ans":3,"exp":"問「最不適當」。D說「患犬膽汁中常可培養出大腸桿菌或鏈球菌」——膽囊黏液囊腫（gallbladder mucocele）通常是「無菌的（sterile）」，細菌感染不是主要特徵，與膿性膽囊炎不同，D最不適當。","we":["Cushing's disease（腎上腺皮質功能亢進）和甲狀腺功能低下是已知的膽囊黏液囊腫風險因子，A描述正確。","黏液囊腫破裂可造成膽汁性腹膜炎（bile peritonitis），是嚴重併發症，B描述正確。","無症狀的膽囊黏液囊腫可嘗試ursodiol（利膽劑）保守治療，C描述合理。","膽囊黏液囊腫通常是無菌性（sterile），細菌感染不是其主要特徵，D描述不正確，是最不適當的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_059","year":2023,"roc_year":112,"session":"","examNo":59,"q":"關於犬氣管塌陷的敘述，下列何者最不適當？","opts":["A. 屬先天發育不良性疾病，與創傷無關","B. 特徵為犬隻咳嗽時會發出''Goose honk''的聲音","C. 不建議將氣管支架用於早期或症狀輕微的動物","D. 避免肥胖及減重有助於控制病情"],"ans":0,"exp":"問「最不適當」。A說「屬先天發育不良性疾病，與創傷無關」——雖然犬氣管塌陷（tracheal collapse）主要是先天性軟骨缺陷，但某些後天形式（如氣管插管損傷、外傷、長期外在壓迫）「可能與創傷有關」，說「與創傷無關」是過於絕對的描述，A最不適當。","we":["氣管塌陷以先天發育性為主，但後天獲得性形式（創傷、插管損傷等）也存在，說「與創傷無關」過於絕對，A最不適當。","Goose honk（鵝鳴聲）咳嗽是氣管塌陷的典型症狀，B描述正確。","氣管支架（stent）有嚴重風險，不建議用於早期或輕症，B描述正確。","肥胖增加腹壓和呼吸負荷，減重確實有助於改善症狀，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_060","year":2023,"roc_year":112,"session":"","examNo":60,"q":"下列犬疾病中，何者最適合將手術作為主要治療方式？","opts":["A. degenerative lumbosacral stenosis","B. degenerative myelopathy","C. fibrocartilaginous embolic myelopathy","D. discospondylitis"],"ans":0,"exp":"問「最適合手術作為主要治療方式」的疾病。退行性腰薦椎狹窄（degenerative lumbosacral stenosis, DLS）在中重度病例（下肢無力、疼痛不控制）時，手術減壓（decompressive surgery）是主要治療方式，A正確。","we":["退行性腰薦椎狹窄（DLS）：中重度病例手術減壓效果好，手術是主要治療方式，A正確。","退行性脊髓病（degenerative myelopathy）是進行性神經退化，無有效手術治療，以物理治療為主，B不適合手術。","纖維軟骨栓塞（FCE）是突發性但多可自愈，支持性治療為主，無手術介入指征，C不適合手術。","椎間盤脊椎炎（discospondylitis）主要是長期抗生素治療，手術只在特殊情況（如神經壓迫）使用，D不是首選手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_061","year":2023,"roc_year":112,"session":"","examNo":61,"q":"下列關於犬貓氣胸的敘述，何者最不適當？","opts":["A. 若因氣管插管造成貓的氣管損傷，容易造成縱隔腔氣腫（pneumomediastinum）","B. 貓氣喘（asthma）可能會造成二次性的自發型氣胸","C. 治療氣管損傷造成的氣胸，大多不需要手術介入","D. 創傷所造成的氣胸均為開放型氣胸"],"ans":3,"exp":"問「最不適當」。D說「創傷所造成的氣胸均為開放型氣胸」——這是錯誤的！創傷可造成開放型（open, sucking wound）或封閉型（closed, blunt trauma）或張力型（tension pneumothorax）氣胸，不是「均為」開放型。","we":["氣管插管損傷→縱膈腔氣腫（air tracking along fascia），A描述正確。","貓氣喘持續發作→氣道壓力升高→肺泡破裂→自發型氣胸，B描述正確。","氣管損傷造成的氣胸通常保守治療（膠管引流）即可，不需要手術，C描述正確。","創傷可造成開放型、封閉型或張力型氣胸，「均為開放型」是錯誤的，D最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_062","year":2023,"roc_year":112,"session":"","examNo":62,"q":"八歲約克夏犬（Yorkshire Terrier）出現慢性漸進性單側後肢跛行，下列何者最不可能是造成原因？","opts":["A. 股骨頭缺血性壞死（avascular necrosis of femoral head）","B. 化膿性關節炎（septic arthritis）","C. 髕骨脫位（patellar luxation）","D. 胸腰椎椎間盤疾病（thoracolumbar disk disease）"],"ans":0,"exp":"問「最不可能」的原因。8歲約克夏犬，慢性漸進性單側後肢跛行：股骨頭缺血性壞死（Legg-Calvé-Perthes disease）主要發生在「<1歲」的小型犬幼犬，8歲成犬不是好發年齡，A最不可能。","we":["股骨頭缺血性壞死（Legg-Calvé-Perthes）主要發生在小型犬幼犬（<1歲），8歲犬幾乎不發生，A最不可能，A正確。","化膿性關節炎可發生在任何年齡，包括成犬，B是可能的鑑別診斷。","髕骨脫位（patellar luxation）是小型犬常見的慢性問題，約克夏犬好發，C是可能原因。","約克夏犬是chondrodystrophic breed，IVDD（椎間盤疾病）好發，可造成後肢症狀，D是可能原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_063","year":2023,"roc_year":112,"session":"","examNo":63,"q":"當該病例經誘導麻醉插管後，以isoflurane維持麻醉穩定後，下列那一種情況不能採用硬膜外神經阻滯術？","opts":["A. 凝血功能異常","B. 心臟病","C. 膝關節手術","D. 短吻犬品種"],"ans":0,"exp":"問「不能採用硬膜外神經阻滯術」的情況（禁忌症）。「凝血功能異常（A）」是硬膜外神經阻滯的絕對禁忌症，因為硬膜外穿刺可能造成硬膜外血腫→脊髓壓迫，A正確。","we":["凝血功能異常（coagulopathy）是硬膜外神經阻滯的絕對禁忌症，穿刺時出血風險極高，A正確。","心臟病不是硬膜外的絕對禁忌症，硬膜外麻醉甚至可減少全身麻醉用量，減輕心臟負擔，B不是禁忌。","膝關節手術是硬膜外麻醉的適應症之一，C不是禁忌。","短吻犬（brachycephalic breeds）麻醉風險高，但這是氣道管理問題，不是硬膜外神經阻滯的禁忌症，D不是禁忌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_064","year":2023,"roc_year":112,"session":"","examNo":64,"q":"當硬膜外神經阻滯針穿過皮膚，皮下組織和韌帶群後進入硬膜外腔，下列那一條韌帶並非屬於該韌帶群？","opts":["A. pubofemoral ligment","B. supraspinous ligament","C. interspinous ligament","D. interarcuate ligament"],"ans":0,"exp":"硬膜外針從皮膚穿入至硬膜外腔的路徑：皮膚→皮下→棘上韌帶（supraspinous ligament）→棘間韌帶（interspinous ligament）→黃韌帶（interarcuate/ligamentum flavum）→硬膜外腔。Pubofemoral ligament（髖關節韌帶）不在此路徑上，A是正確答案。","we":["Pubofemoral ligament（恥骨股骨韌帶）是髖關節的韌帶，與脊椎硬膜外穿刺路徑無關，A正確。","Supraspinous ligament（棘上韌帶）連接棘突頂端，是硬膜外穿刺路徑上的韌帶，B在穿刺路徑中。","Interspinous ligament（棘間韌帶）在棘突之間，是穿刺路徑上的韌帶，C在穿刺路徑中。","Interarcuate ligament（黃韌帶/ligamentum flavum）是進入硬膜外腔前的最後一層韌帶，D在穿刺路徑中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_066","year":2023,"roc_year":112,"session":"","examNo":66,"q":"犬貓胃腸道縫合時，主要支撐縫線力量的是下列那一層組織？","opts":["A. 黏膜層","B. 黏膜下層","C. 肌層","D. 漿膜層"],"ans":1,"exp":"胃腸道縫合中，主要提供縫線支撐力量（holding strength）的是「黏膜下層（submucosa）」，因為黏膜下層含豐富膠原蛋白（collagen fibers），提供最大的縫線抗張強度，B正確。","we":["黏膜層（mucosa）細胞豐富但膠原蛋白少，縫線保持力不佳，A不正確。","黏膜下層（submucosa）含有豐富的膠原蛋白纖維，是GI縫合中提供最主要縫線支撐力量的層次，B正確。","肌層（muscularis）提供部分支撐，但不如黏膜下層，C不是主要支撐層。","漿膜層（serosa）促進組織癒合（密封性好），但提供的縫線支撐力有限，D不是主要支撐層。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_067","year":2023,"roc_year":112,"session":"","examNo":67,"q":"下列何項注射用麻醉劑，不會直接影響腎臟功能，但會因為高劑量造成全身性低血壓，導致腎臟血流降低而\r   間接影響腎臟功能？","opts":["A. etomidate","B. opioids","C. benzodiazepines","D. propofol"],"ans":3,"exp":"Propofol（丙泊酚）不直接作用於腎臟，但高劑量可造成心肌抑制→全身性低血壓→腎臟灌流減少→間接影響腎臟功能，D正確。","we":["Etomidate不會直接影響腎臟，但也不典型造成低血壓（對心血管穩定性好），A不是最典型選項。","Opioids不直接影響腎臟，但可能降低血壓（尤其高劑量），B有一定類似效果但不如propofol典型。","Benzodiazepines不直接影響腎臟，可能造成輕度低血壓，但程度不如propofol顯著，C不是最典型選項。","Propofol高劑量→心肌抑制→低血壓→腎臟灌流減少，是典型的「間接」腎影響機制，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_068","year":2023,"roc_year":112,"session":"","examNo":68,"q":"骨髓釘使用在長骨骨折時，主要可以防止骨折處發生下列何種變化？","opts":["A. 旋轉","B. 折彎","C. 縱向滑動","D. 震動"],"ans":1,"exp":"骨髓釘（intramedullary nail, IM pin）插入長骨髓腔後，主要作用是作為內在橫桿，抵抗「折彎（bending）」力。IM pin對旋轉（rotation）的抵抗力有限（需interlocking nails），B正確。","we":["旋轉（rotation）：IM pin單獨對旋轉抵抗力差（需interlocking或外固定配合），A不是主要防止項。","折彎（bending）：IM pin在髓腔內作為支柱，有效抵抗骨折處的彎曲力，B正確。","縱向滑動（longitudinal sliding）：IM pin可部分限制，但不是最主要功能，C不是最佳答案。","震動（vibration）不是IM nail的主要考量，D不是最佳答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_069","year":2023,"roc_year":112,"session":"","examNo":69,"q":"在牛懷孕早期不會使用下列何種藥物終止懷孕？","opts":["A. corticosteroids","B. estrogen","C. PGF 2α","D. progesterone-receptor antagonist"],"ans":0,"exp":"問「不會使用」來終止牛懷孕早期的藥物。Corticosteroids（糖皮質素）用於誘導牛隻「晚期」分娩（accelerate fetal maturation），不是終止「早期」懷孕的藥物，A正確。","we":["Corticosteroids用於牛隻晚期懷孕引產（促胎兒肺成熟），不用於早期懷孕終止，A正確。","Estrogen可在配種後72小時內使用（morning-after treatment）干擾著床，B可用於早期懷孕終止。","PGF2α溶解黃體→孕酮下降→流產，在懷孕早期（前5個月）有效，C可用於早期懷孕終止。","Progesterone receptor antagonist（如RU486/mifepristone）阻斷孕酮受體，D可用於懷孕終止。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_070","year":2023,"roc_year":112,"session":"","examNo":70,"q":"有一難產母牛經檢查後發現胎兒過大，胎位為正常頭位（anterior presentation）上胎向（dorsal position），需\r   進行全碎胎術取出胎兒時，那一個是最先需切下的部位？","opts":["A. 右前肢","B. 左前肢","C. 胸口","D. 頭部"],"ans":0,"exp":"胎兒為前置頭位（anterior presentation）上胎向（dorsal position），進行全碎胎術時，通常先截除「右前肢（A）」，減少肩膀寬度（shoulder width），以便後續取出，A正確。","we":["右前肢截除：減少肩膀體積，是全碎胎術（anterior presentation）最先截除的部位，A正確。","左前肢通常在右前肢後截除，B不是最先截除的。","胸口在截除前後肢後再處理，C不是最先步驟。","頭部通常在前後肢截除後再分離，D不是最先步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_071","year":2023,"roc_year":112,"session":"","examNo":71,"q":"母羊懷孕期間缺乏下列何種物質，最不可能是造成出生後衰弱仔羊（weak kids）之主因？","opts":["A. 銅（copper）","B. 碘（iodine）","C. 硒（selenium）","D. 鐵（iron）"],"ans":3,"exp":"問「最不可能」是造成衰弱仔羊（weak kids）的主因。母羊懷孕期缺乏：銅→搖擺病（swayback）、碘→甲狀腺腫（congenital goiter）、硒→白肌病（white muscle disease）。鐵（iron）缺乏更多是出生後貧血問題，母羊懷孕期缺鐵不是導致出生後衰弱仔羊的主要原因，D最不可能。","we":["銅缺乏→搖擺病（enzootic ataxia/swayback）→出生後神經症狀及衰弱，A是主因之一。","碘缺乏→先天性甲狀腺腫→甲狀腺功能低下→衰弱仔羊，B是主因之一。","硒缺乏→白肌病（white muscle disease）→肌肉無力→衰弱仔羊，C是主因之一。","鐵缺乏在仔羊出生後（飼餵鐵含量低的乳汁）造成貧血，母羊懷孕期缺鐵不是衰弱仔羊的主要原因，D最不可能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_072","year":2023,"roc_year":112,"session":"","examNo":72,"q":"有關牛隻子宮感染的敘述，下列何項最正確？","opts":["A. 子宮感染以上行性感染為主，全身性感染為輔，而細菌則均為厭氧菌","B. 若發展成子宮蓄膿時，其子宮壁較厚，可與懷孕的子宮區別","C. 子宮感染牛隻常呈現持續發情的狀態","D. 在子宮蓄膿的情形下，其孕酮（progesterone）濃度常缺乏或低下"],"ans":1,"exp":"問「最正確」的牛子宮感染敘述。B說子宮蓄膿（pyometra）時子宮壁較厚，可與懷孕子宮區別——pyometra的子宮壁由於長期感染和纖維化，通常比懷孕後期被胎水撐薄的子宮壁「厚」，B相對正確。","we":["子宮感染是混合菌感染（需氧+厭氧），不是「均為厭氧菌」，A描述不正確。","子宮蓄膿（pyometra）的子宮壁由於長期慢性炎症和纖維化，通常比懷孕後期（子宮壁被撐薄）厚，B相對正確。","子宮感染牛通常有黃體存在（持續黃體）→孕酮高→不發情（anestrus），而非「持續發情」，C描述相反。","子宮蓄膿（pyometra）的特徵是「持續黃體（persistent CL）」→孕酮濃度「升高」，而非「缺乏或低下」，D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_073","year":2023,"roc_year":112,"session":"","examNo":73,"q":"下列何者不是異性雙胎症（freemartinism）女仔牛具有的特徵？","opts":["A. 陰道腔短","B. 直腸檢查無法觸摸到子宮頸","C. 具有明顯之雄性化","D. 貧血"],"ans":3,"exp":"問「不是」異性雙胎症（freemartinism）女仔牛的特徵。Freemartin特徵：陰道短（A）、子宮頸缺失（B）、雄性化（C）——這些都是正確特徵。「貧血（anemia，D）」不是freemartinism的特徵，D正確。","we":["陰道腔短（short vaginal canal）是freemartinism的典型特徵（約2/3的陰道缺失），A是特徵。","直腸檢查無法觸摸到子宮頸是freemartinism的特徵（子宮頸發育不全），B是特徵。","雄性化（masculinization）是freemartinism的特徵（受雄性胎兒雄性激素影響），C是特徵。","貧血（anemia）不是freemartinism的特徵，D正確（不是freemartin的特徵）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_074","year":2023,"roc_year":112,"session":"","examNo":74,"q":"下列母犬動情週期的圖示中，A所指實線最可能代表下列何種內泌素之週期變化？","opts":["A. estrogen","B. progesterone","C. luteinizing hormone（LH）","D. follicle-stimulating hormone（FSH）"],"ans":0,"exp":"（圖片題，需人工確認。母犬動情週期中，estrogen（雌激素）在pro-oestrus達到高峰，然後下降，排卵後孕酮上升。若圖中A所指為在pro-oestrus期間先升高再下降的曲線，最可能是estrogen（A）。）","we":["Estrogen在pro-oestrus期間升高達峰，引發LH surge後下降，若圖中顯示此模式，A為暫定答案。","Progesterone在ovulation後由黃體分泌，diestrus時維持高值，若圖示為持續高值則為B。","LH（促黃體素）在排卵前急速升高（LH surge），呈現短暫明顯峰值，若圖示為此則為C。","FSH在pro-oestrus升高，但變化不如LH那麼明顯，D可能性相對較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_075","year":2023,"roc_year":112,"session":"","examNo":75,"q":"承上題，母犬陰道有多量血液樣分泌物，最可能是處於動情週期的那一個階段？","opts":["A. late pro-oestrus","B. late oestrus","C. early metoestrus","D. anoestrus"],"ans":0,"exp":"母犬陰道多量血液樣分泌物最常見於「late pro-oestrus（動情前期晚期）」，此期子宮出血最多，分泌物量最大，以血液樣為主，A正確。","we":["Late pro-oestrus（動情前期晚期）：子宮出血最多，血液樣分泌物量最大，A正確。","Late oestrus（動情期晚期）：血液樣分泌物減少，轉為清澈黏液，B不是多量血液樣的時期。","Early metoestrus（後動情期早期）：有中性球出現在陰道抹片，分泌物通常減少，C不正確。","Anoestrus（休情期）：無分泌物或極少量，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_076","year":2023,"roc_year":112,"session":"","examNo":76,"q":"有關母犬子宮蓄膿（pyometra）之敘述，下列何者最不適當？","opts":["A. 母犬若先前有使用外源性助孕素藥物來干擾動物週期之情形時，該母犬較易發生子宮蓄膿","B. 若飼主選擇內科治療時，可單獨使用前列腺素（prostaglandin）治療 closed-cervix pyometra","C. 患畜常伴隨有子宮內膜囊樣性增生（cystic endometrial hyperplasia）","D. 子宮蓄膿好發時間點為母犬發情結束後5～80天"],"ans":1,"exp":"問「最不適當」。B說可「單獨使用PGF2α治療closed-cervix pyometra」——這是危險的做法！Closed-cervix pyometra因子宮頸封閉，PGF2α強制收縮子宮可能造成子宮破裂或膿液逆流入腹腔，風險極高，B最不適當。","we":["曾使用外源性progestins干擾動情週期→子宮對細菌敏感性增加→易發生子宮蓄膿，A描述正確。","PGF2α對open-cervix pyometra有效，但「單獨用於closed-cervix pyometra」風險極高（可能子宮破裂），B最不適當。","子宮內膜囊樣性增生（CEH）常與子宮蓄膿並存（CEH-pyometra complex），C描述正確。","母犬子宮蓄膿好發在發情結束後5-80天（diestrus期間，黃體期），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_077","year":2023,"roc_year":112,"session":"","examNo":77,"q":"在繁殖管理不當的牧場，從精液抹片中可觀察下列精子型態異常比例偏高，得以判定種公畜有過度使用的問\r   題？","opts":["A. 精子頭部呈梨形（pyriform head）","B. 精子頭部與尾部交接處折斷（fractured neck）","C. 精子尾巴具有原生質滴（protoplasmic droplets）","D. 精子尾巴後端往其頭側彎曲形成環狀（looped tail）"],"ans":2,"exp":"種公畜過度使用（overuse）→精子在副睾中通過過快，未完全成熟→精子帶有「原生質滴（protoplasmic droplets）」比例增高。原生質滴是精子發育中殘留的細胞質，成熟精子應已脫落，C正確。","we":["梨形頭（pyriform head）通常是遺傳性問題或睾丸疾病，不特別與過度使用相關，A不典型。","頸部斷裂（fractured neck）通常是機械性損傷（採精、處理不當），不是過度使用的標誌，B不典型。","原生質滴（protoplasmic droplets）增多是精子未成熟的標誌，過度使用時精子「加速通過」副睾→未能脫落原生質滴，C正確。","環狀尾（looped tail）通常與低滲/高滲環境損傷有關，不特別是過度使用的標誌，D不典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_078","year":2023,"roc_year":112,"session":"","examNo":78,"q":"有關於母牛發生產後低血鈣症，下列何項敘述最為正確？","opts":["A. 正常牛血鈣濃度平均約為6.3 mg/dL","B. 分娩後兩天完全不榨乳可作為預防或治療","C. 乾乳期給低鈣飼糧可作為預防方法","D. 產前3週餵食高陽離子飼糧可作為預防方法"],"ans":2,"exp":"問「最正確」。C說「乾乳期給低鈣飼糧可作為預防方法」——正確！乾乳期（dry period）低鈣飼糧刺激PTH分泌和骨鈣動員機制，使身體在分娩時能快速調動鈣，預防產後低血鈣症。","we":["正常牛血鈣濃度約為8.5-10.5 mg/dL，6.3 mg/dL是低血鈣值，A的說法錯誤（6.3不是正常值）。","完全不榨乳不是預防低血鈣的有效方法，且對乳房有害，B描述不正確。","乾乳期低鈣飼糧→活化PTH和calcitriol調節機制→分娩時能快速補充血鈣，C是有效且正確的預防方法。","應給予「陰離子飼糧（anionic diet）」或「低DCAD飼糧」（低陽離子），而非「高陽離子飼糧」，高陽離子（Na+, K+）飼糧反而加重代謝性鹼中毒，D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_079","year":2023,"roc_year":112,"session":"","examNo":79,"q":"若乳牛場的懷孕配種次數（services per pregnancy）平均為2.8次，代表的意義為何？","opts":["A. 牛群懷孕率高","B. 牛群中應該有許多繁殖障礙問題","C. 牛群空胎期適當","D. 卵巢囊腫發生比率較高"],"ans":1,"exp":"Services per pregnancy（SPP）= 每次懷孕平均需要的配種次數，理想值約1.5-1.8次。SPP=2.8次遠高於理想值，表示受胎率低，需要多次配種才能懷孕，說明牧場中有「許多繁殖障礙問題」，B正確。","we":["SPP=2.8次高於正常值，代表懷孕率「低」，不是高，A描述相反。","SPP=2.8次遠高於理想值（1.5-1.8），代表牛群受胎率低，有許多繁殖障礙問題，B正確。","SPP=2.8次表示空胎期可能「過長」，不是適當，C描述相反。","卵巢囊腫發生比率高可能是原因之一，但SPP高最直接反映的是整體繁殖障礙問題，D不是最直接的結論。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_080","year":2023,"roc_year":112,"session":"","examNo":80,"q":"牛隻濾泡囊腫時，下列何種症狀較為罕見？","opts":["A. 慕雄狂","B. 不發情","C. 帶血的黏液","D. 經常駕乘其他牛隻"],"ans":2,"exp":"問「較為罕見」的症狀。牛隻濾泡囊腫（follicular cysts）→持續分泌雌激素→慕雄狂（nymphomania，A）、頻繁駕乘（D）是典型症狀。不發情（B）也可能（某些囊腫不產生典型行為）。帶血的黏液（C）不是濾泡囊腫的典型症狀，C較為罕見。","we":["慕雄狂（nymphomania）是濾泡囊腫因持續高雌激素所致，A是常見症狀。","不發情（anestrus）也可能發生（某些囊腫為「安靜型」），但不如慕雄狂典型，B有一定發生率。","帶血的黏液（bloody mucus）不是濾泡囊腫的典型症狀，C較為罕見，C正確。","頻繁駕乘其他牛隻是慕雄狂的表現之一，D是常見症狀。"],"needs_review":false,"imgs":[]}];

let mode=0,curFilter='all',state={qi:0,done:0,cor:0},qStates={},errorCounts={},unsureSet={},notesStore={},navOpen=false;

function compressImg(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=720;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleNoteImgs(id,fcIdx,input){
  const files=Array.from(input.files);if(!files.length)return;
  const note=getNote(id);
  for(const f of files){try{note.imgs.push(await compressImg(f));}catch(e){}}
  saveNotes();renderNoteImgs(id,fcIdx);input.value='';
}
function removeNoteImg(id,i,fcIdx){
  const note=getNote(id);note.imgs.splice(i,1);saveNotes();renderNoteImgs(id,fcIdx);
}
function renderNoteImgs(id,fcIdx){

function viewImg(src){

function saveProgress(){
  if(!currentUser)return;
  const data={qStates,errorCounts,unsureSet,mode,curFilter,qi:state.qi,ts:Date.now()};
  try{localStorage.setItem(SAVE_KEY_BASE+'_local_'+currentUser,JSON.stringify(data));}catch(e){}
  db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).set(data).catch(()=>{});
}
async function loadProgress(){
  if(!currentUser)return;
  try{
    const snap=await db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).get();
    const d=snap.exists?snap.data():null;
    if(!d)return;
    if(d.qStates)qStates=d.qStates;
    if(d.errorCounts)errorCounts=d.errorCounts;
    if(d.unsureSet)unsureSet=d.unsureSet;
    if(d.mode!==undefined)mode=d.mode;
    if(d.curFilter)curFilter=d.curFilter;
    recalcStats();
    const qs=getQs();
    state.qi=Math.min(Math.max(d.qi||0,0),Math.max(qs.length-1,0));
  }catch(e){
    try{
      const d=JSON.parse(localStorage.getItem(SAVE_KEY_BASE+'_local_'+currentUser)||'null');
      if(!d)return;
      if(d.qStates)qStates=d.qStates;
      if(d.errorCounts)errorCounts=d.errorCounts;
      if(d.unsureSet)unsureSet=d.unsureSet;
      if(d.mode!==undefined)mode=d.mode;
      if(d.curFilter)curFilter=d.curFilter;
      recalcStats();
      const qs=getQs();
      state.qi=Math.min(Math.max(d.qi||0,0),Math.max(qs.length-1,0));
    }catch(e2){}
  }
}
function recalcStats(){
  const qs=getQs();state.done=0;state.cor=0;
  qs.forEach(q=>{const st=qStates[q.id];if(st){state.done++;if(st==='ok')state.cor++;}});
}
function clearProgress(){
  if(!confirm('確定清除所有作答記錄與錯題歷史？此操作無法復原。'))return;
  qStates={};errorCounts={};unsureSet={};state={qi:0,done:0,cor:0};
  try{localStorage.removeItem(SAVE_KEY_BASE+'_local_'+currentUser);}catch(e){}
  if(currentUser)db.collection('users').doc(currentUser).collection('progress').doc(SAVE_KEY_BASE).delete().catch(()=>{});
  render();
}
function toggleNav(){

function renderNav(){
  const g=document.getElementById('nav-grid');
  if(!g)return;
  const qs=getQs();
  g.innerHTML=qs.map((q,i)=>{
    const st=qStates[q.id];
    const ec=errorCounts[q.id]||0;
    const isUnsure=!!unsureSet[q.id];
    let cls='qnb'+(i===state.qi?' cur':'');
    if(st==='ok')cls+=isUnsure?' ans-unsure':' ans-ok';
    else if(st)cls+=' ans-no';
    else if(isUnsure)cls+=' ans-unsure';
    const ecBadge=ec>=2?`<sup style="font-size:8px;color:#f0c060;margin-left:1px">${ec}</sup>`:'';
    const unsureDot=isUnsure&&st==='ok'?`<sup style="font-size:8px;color:var(--yellow);margin-left:1px">?</sup>`:'';
    return `<button class="${cls}" onclick="jumpTo(${i})" title="民國${q.roc_year}年 第${q.examNo}題${ec?' | 錯'+ec+'次':''}${isUnsure?' | ★':''}">${q.examNo}${ecBadge}${unsureDot}</button>`;

function jumpTo(idx){

}
function setM(m){
  mode=m;
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===m)});
  state={qi:0,done:0,cor:0};recalcStats();saveProgress();render();
