道疾病（FLUTD, feline lower urinary tract disease）涵蓋膀胱炎、尿道炎、尿道阻塞、特發性膀胱炎等。絲球體性腎炎（glomerulonephritis）屬於上泌尿道（腎臟）疾病，不屬於FLUTD範疇。","we":["A. 膀胱炎（cystitis）是FLUTD常見原因，正確歸類。","C. 尿道結石（urolithiasis）是FLUTD常見病因，尤其是雄貓尿道阻塞。","D. 特發性膀胱炎（idiopathic cystitis/FIC）是貓最常見的FLUTD類型，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_046","year":2015,"roc_year":104,"session":"","examNo":46,"q":"一隻犬因為腫瘤而使用doxorubicin治療後，心電圖如下。你的判讀為何？（from small\r animal internal medicine，lead I，lead II， 25mm/sec）","opts":["A. 心室期外收縮（ventricular premature complex，VPC）","B. 心房提早收縮（atrial premature complex，APC）","C. 右分支阻礙（right bundle branch block，RBBB）","D. 心室性心搏過速（ventricular tachycardia，VT）"],"ans":1,"exp":"（圖像題，需依ECG判讀）Doxorubicin心毒性最常引起的心律不整為室性心律不整（ventricular arrhythmia），包括室性早期收縮（VPC）和心室頻脈（ventricular tachycardia）。ECG中若見寬QRS波群（B選項）則符合此診斷。","we":["A. 若為正常竇性心律，不符合doxorubicin心毒性表現。","C. 若為心房顫動，雖可見於心臟毒性，但doxorubicin更典型引起室性問題。","D. 若為一度房室傳導阻滯，與doxorubicin心毒性不典型。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_2_普通病_047","year":2015,"roc_year":104,"session":"","examNo":47,"q":"德國狼犬，7個月齡，削瘦，主訴為長期嘔吐，且大多發生在食後1小時內，嘔吐物為未消化\r 的食物，有咳嗽症狀，下列何者最有可能為該犬所患疾病？","opts":["A. patent ductus arteriosus","B. persistent right aortic arch","C. gastric dilatation-volvulus","D. intestinal intussusception"],"ans":1,"exp":"7個月齡德國狼犬食後逆流合併咳嗽，高度懷疑持久性右主動脈弓（persistent right aortic arch, PRAA）。正常應由左第四主動脈弓發育為主動脈，若右第四主動脈弓持久存在，形成血管環（vascular ring）壓迫食道，導致食道在心底部（base of heart）擴張，食後即逆流。","we":["A. 食道巨大症（megaesophagus）可引起類似症狀，但德國狼犬幼犬食後逆流需先排除PRAA。","C. 食道異物在7個月齡幼犬需考慮，但持續性症狀且合併咳嗽更支持結構性異常。","D. 重症肌無力（myasthenia gravis）引起巨食道，但PRAA在此品種年齡更典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_048","year":2015,"roc_year":104,"session":"","examNo":48,"q":"獸醫師採用耳翼股反射（pinnal femoral reflex）檢查診斷皮膚疥癬蟲症，請問以下那個疾病\r 也會有此反應？","opts":["A. 異位性（atopic）皮膚炎","B. 維生素E缺乏","C. 紅斑性狼瘡（systemic lupus erythematosus，SLE）","D. 庫興氏症候群（Cushing’s syndrome）"],"ans":0,"exp":"耳翼股反射（pinna-femoral reflex）陽性，即撓耳翼引起後腳搔抓反應，這是特異性皮膚神經反射。異位性（atopic）皮膚炎與過敏性疾病相關，外耳炎和皮膚過敏可引起此反射活躍，是會出現耳翼股反射陽性的疾病。","we":["B. 耳疥蟲（ear mites, Otodectes）引起外耳炎，也可引起此反射，但非最典型。","C. 脊髓病變引起的神經反射異常不典型表現為耳翼股反射陽性。","D. 耳道腫瘤可能引起耳部不適，但耳翼股反射陽性更典型見於過敏/皮膚炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_049","year":2015,"roc_year":104,"session":"","examNo":49,"q":"懷疑犬貓有乳糜胸時，以下列何項在胸腔積液和血清中的濃度差異來作確診？","opts":["A. 膽固醇","B. 三酸甘油酯","C. 球蛋白","D. 白蛋白"],"ans":1,"exp":"犬貓乳糜胸（chylothorax）的確診依據是胸腔積液中三酸甘油酯（triglycerides）濃度高於血清濃度（積液/血清比>1），或積液TG >100 mg/dL。乳糜液富含乳糜微粒（chylomicrons）和TG，是從胸管（thoracic duct）滲漏的淋巴液。","we":["A. 積液外觀呈乳白色雖提示乳糜，但假性乳糜也可呈此顏色，不能單憑外觀確診。","C. 細胞學（以小淋巴球為主）支持診斷但不具決定性。","D. 膽固醇/TG比值<1支持真性乳糜，可作輔助，但TG濃度比較是主要確診依據。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_050","year":2015,"roc_year":104,"session":"","examNo":50,"q":"犬細菌性肺炎（bacterial pneumonia）的處置，下列何項最不適合？","opts":["A. 噴霧治療（nebulization）","B. 氧氣給與","C. 止咳劑","D. 支氣管擴張劑"],"ans":2,"exp":"犬細菌性肺炎（bacterial pneumonia）處置中，最不適合使用止咳劑（antitussives）。咳嗽是清除呼吸道分泌物和滲出液的重要防禦機制，抑制咳嗽會導致分泌物積聚，加重感染和低氧血症，是禁忌。","we":["A. 廣效抗生素治療是細菌性肺炎的核心處置，適合。","B. 霧化療法（nebulization）幫助稀釋分泌物，促進排痰，適合。","D. 支持性治療（補液、氧氣）是必要的，適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_051","year":2015,"roc_year":104,"session":"","examNo":51,"q":"在沒有肺動脈狹窄時以心臟超音波都卜勒測量，以下測得的三尖瓣最大回流流速何者屬於嚴\r 重肺動脈高壓？","opts":["A. ＜2.8m/sec","B. 2.9－3.5m/sec","C. 3.6－4.3m/sec","D. ＞4.3m/sec"],"ans":3,"exp":"三尖瓣最大回流流速（peak tricuspid regurgitation velocity）可用改良Bernoulli方程式估算肺動脈壓力。嚴重肺動脈高壓（severe pulmonary hypertension）時，TR最大流速>4.3 m/sec，對應肺動脈收縮壓>75 mmHg。","we":["A. TR流速<2.5 m/sec為正常或輕度，不符合嚴重肺高壓標準。","B. TR流速2.5-3.4 m/sec為輕至中度肺高壓。","C. TR流速3.4-4.3 m/sec為中度肺高壓，未達嚴重標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_052","year":2015,"roc_year":104,"session":"","examNo":52,"q":"下列那一項不是前葡萄膜炎（anterior uveitis）所表現的臨床症狀？","opts":["A. 眼痛","B. 瞳孔散大","C. 前房積膿","D. 前房液閃光（aqueous flare）"],"ans":1,"exp":"前葡萄膜炎（anterior uveitis）典型症狀包括眼痛、畏光、角膜水腫、眼前房浮游物（flare）、瞳孔縮小（miosis）和眼壓下降。「瞳孔散大（mydriasis）」是前葡萄膜炎不會出現的症狀，發炎時睫狀肌痙攣引起瞳孔縮小。","we":["A. 眼痛和畏光（photophobia）是前葡萄膜炎常見症狀，正確。","C. 眼前房積血（hyphema）或積膿（hypopyon）可見於嚴重前葡萄膜炎，正確。","D. 角膜後沉積物（keratic precipitates, KP）是前葡萄膜炎特徵，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_053","year":2015,"roc_year":104,"session":"","examNo":53,"q":"貓的嚴重胰臟炎，下列何項臨床症狀較不常見？","opts":["A. 精神不佳","B. 食慾下降","C. 嘔吐","D. 黃疸"],"ans":2,"exp":"貓胰臟炎（feline pancreatitis）與犬不同，嘔吐（vomiting）在貓胰臟炎較不常見（約35-50%），而犬胰臟炎嘔吐率高達90%以上。貓胰臟炎更常表現為食慾不振、嗜睡和體重下降，嘔吐相對不典型。","we":["A. 食慾不振（anorexia）在貓胰臟炎非常常見（>90%），正確。","B. 嗜睡（lethargy）在貓胰臟炎很常見，正確。","D. 黃疸（jaundice）在貓胰臟炎可見，因貓常伴隨膽管炎/肝病（triaditis），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_054","year":2015,"roc_year":104,"session":"","examNo":54,"q":"血管中下列何項因子，可使液體由血管內流向血管外間質？","opts":["A. 滲透壓高","B. 淨水壓高","C. 膠體滲透壓高","D. 動脈壓高"],"ans":1,"exp":"依Starling定律，液體由血管內流向血管外（組織水腫形成）的主要驅動力是靜水壓（hydrostatic pressure）升高，尤其是微血管靜水壓（capillary hydrostatic pressure）高於組織靜水壓，促使液體外滲形成水腫。","we":["A. 膠體滲透壓（oncotic pressure）高會將液體留在血管內，降低滲出。","C. 血管通透性增加（如炎症）可促進液體外滲，但非Starling方程式的正常「淨水壓高」機制。","D. 淋巴回流障礙可引起水腫，但機制是引流不足，非靜水壓-滲透壓平衡改變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_055","year":2015,"roc_year":104,"session":"","examNo":55,"q":"貓多發性骨髓瘤（multiple myeloma）的敘述，下列何項錯誤？","opts":["A. 歸屬於漿細胞腫瘤（plasma cell neoplasm）","B. 與FeLV的感染有關","C. 易造成高黏性症候群（hyperviscosity syndrome）","D. 可能會導致Bence Jones proteinuria的發生"],"ans":1,"exp":"貓多發性骨髓瘤（multiple myeloma）描述中，「與FeLV感染有關」是錯誤的。FeLV（貓白血病病毒）主要引起淋巴瘤（lymphoma）和白血病，與多發性骨髓瘤的關聯性並未確立。貓骨髓瘤的病因尚不明確。","we":["A. 血清蛋白電泳出現M蛋白（monoclonal gammopathy）是骨髓瘤特徵，正確。","C. 骨溶解性病變（osteolytic lesions）因漿細胞分泌破骨細胞激活因子，正確。","D. 患貓常出現高黏滯度症候群（hyperviscosity syndrome），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_056","year":2015,"roc_year":104,"session":"","examNo":56,"q":"馬爾濟斯犬全身脫毛，皮膚很薄，且有皮下鈣化現象，最可能罹患下列何項內分泌疾病？","opts":["A. hyperadrenocorticism","B. hypothyroidism","C. hyperthyroidism","D. alopecia X"],"ans":0,"exp":"馬爾濟斯犬全身脫毛、皮薄（皮膚萎縮）和皮下鈣化（calcinosis cutis）是過度腎上腺皮質功能亢進（hyperadrenocorticism, Cushing's disease）的典型皮膚表現。高濃度皮質醇抑制毛囊、使皮膚變薄，並引起皮下異常鈣鹽沉積。","we":["B. 甲狀腺功能低下（hypothyroidism）引起脫毛和皮膚變化，但皮下鈣化不典型。","C. 性腺激素失衡（sex hormone imbalance）可引起脫毛，但皮下鈣化不典型。","D. 糖尿病（diabetes mellitus）皮膚表現為感染和無光澤，非典型脫毛+鈣化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_057","year":2015,"roc_year":104,"session":"","examNo":57,"q":"下圖是一隻十二歲雌性英國鬥牛犬的bipolar心電圖（紙速25 mm／sec；1 cm =1 mV），其\r 最不可能的病因為下列何項？","opts":["A. 慢性二尖瓣閉鎖不全","B. 心基瘤（heart base tumor）","C. 三尖瓣閉鎖不全","D. 心包囊積水"],"ans":1,"exp":"（圖像題）英國鬥牛犬出現biphasic（雙相）心電圖，需考慮心律不整的病因。英國鬥牛犬易患遺傳性心律不整（arrhythmogenic right ventricular cardiomyopathy, ARVC）。bipolar ECG最不可能的病因取決於圖像判讀，B選項（電解質異常/低鉀）引起T波變化，為最不典型。","we":["A. 若為心室肥大，可能見於先天性心臟病，英國鬥牛犬需考慮。","C. ARVC是英國鬥牛犬最典型的遺傳性心臟病，需高度懷疑。","D. 藥物毒性（如強心苷）也可引起心律不整，需排除。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_2_普通病_058","year":2015,"roc_year":104,"session":"","examNo":58,"q":"治療犬warfarin中毒時應給與下列何項藥物？","opts":["A. Vitamin B","B. Vitamin K 1","C. acetylcysteine","D. corticosteroid"],"ans":1,"exp":"犬warfarin中毒（抗凝鼠藥中毒）的治療是給予維生素K1（phytonadione），作為warfarin拮抗劑，恢復凝血因子（II、VII、IX、X）的合成。注意是K1而非K3，K3在犬貓可能引起溶血性貧血。","we":["A. 新鮮冷凍血漿（FFP）可補充凝血因子用於急性嚴重出血，但維生素K1是根本治療。","C. 輸注紅血球（RBC）只補充血紅素，不解決凝血缺陷，非主要治療。","D. 維生素C雖有抗氧化作用，但不能拮抗warfarin的抗凝效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_059","year":2015,"roc_year":104,"session":"","examNo":59,"q":"治療犬胰臟炎時，最適合輸下列何種血液製劑？","opts":["A. 新鮮冷凍血漿","B. 新鮮全血","C. 濃縮紅血球","D. 濃縮血小板"],"ans":0,"exp":"犬胰臟炎（pancreatitis）治療最適合的血液製劑是新鮮冷凍血漿（fresh frozen plasma, FFP），因FFP含有α-巨球蛋白（α-macroglobulin）等蛋白酶抑制劑，可中和循環中的胰酶（trypsin、lipase），同時補充凝血因子，防止DIC。","we":["B. 全血（whole blood）雖含FFP的成分，但體積過大，不如FFP精準。","C. 濃縮紅血球（pRBC）只補充血紅素，無法提供蛋白酶抑制效果。","D. 血小板（platelet concentrate）主要用於血小板減少症，非胰臟炎首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_060","year":2015,"roc_year":104,"session":"","examNo":60,"q":"當犬貓口鼻流出淡色或粉紅色泡沫性液體、呼吸淺而快、開口呼吸和喘息及肺部聽診呈現水\r 泡音時，此犬貓罹患下列何項？","opts":["A. 肺惡性腫瘤","B. 肺膿瘍","C. 肺氣腫","D. 肺水腫"],"ans":3,"exp":"犬貓出現口鼻泡沫液、淺快呼吸（tachypnea/hyperpnea）和水泡音（crackles），是肺水腫（pulmonary edema）的典型臨床表現。肺泡內充滿液體時，呼氣出現水泡音，液體從口鼻湧出形成泡沫，氣體交換嚴重受損引起呼吸窘迫。","we":["A. 肺炎（pneumonia）也可見呼吸困難和水泡音，但泡沫性口鼻分泌物更典型見於肺水腫。","B. 氣胸（pneumothorax）表現為呼吸音減弱/消失，非水泡音和泡沫分泌物。","C. 胸腔積液（pleural effusion）呼吸音減弱，叩診濁音，非典型泡沫分泌物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_061","year":2015,"roc_year":104,"session":"","examNo":61,"q":"犬排黑色糞便，嘔吐物呈咖啡渣樣並含鮮血，此犬罹患下列何症？","opts":["A. 大腸炎","B. 胃潰瘍","C. 小腸炎","D. 肺挫傷"],"ans":1,"exp":"犬出現黑色糞便（melena）、咖啡渣嘔吐物（hematemesis）和鮮血，是上消化道出血的表現，最常見病因是胃潰瘍（gastric ulcer）。NSAID使用、腎上腺皮質機能亢進、肝病等均可引起犬胃潰瘍。","we":["A. 腸套疊（intussusception）可引起血便，但通常為鮮紅色血便而非黑便。","C. 出血性胃腸炎（HGE）主要見於小型犬，以鮮血血便為主，非典型黑便+咖啡渣嘔吐。","D. 腸道腫瘤可引起慢性血便，但急性黑便+咖啡渣嘔吐更典型為胃潰瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_062","year":2015,"roc_year":104,"session":"","examNo":62,"q":"貓傳染性腹膜炎病毒，最主要感染源來自於下列何項？","opts":["A. 口腔分泌物","B. 鼻腔分泌物","C. 糞便","D. 尿"],"ans":2,"exp":"貓傳染性腹膜炎病毒（FIPV）是貓腸道冠狀病毒（FeCV）的突變株，最主要的感染源是糞便（fecal-oral route），FeCV大量存在於腸道並隨糞便排出，貓間透過糞口途徑傳播，在體內突變為強毒株後引起FIP。","we":["A. 呼吸道飛沫傳播不是FIP/FeCV主要傳播途徑。","B. 跳蚤等節肢動物媒介不是FeCV傳播途徑。","D. 直接接觸唾液也可能傳播，但糞便是最主要的排毒途徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_063","year":2015,"roc_year":104,"session":"","examNo":63,"q":"犬罹患下列何項會引發頭頸部水腫？","opts":["A. 橫膈膜赫尼亞（diaphragmatic hernia）","B. 縱膈腔氣胸（pneumomediastinum）","C. 縱膈腔腫瘤（mediastinal tumor）","D. 膿胸（pyothorax）"],"ans":2,"exp":"犬頭頸部水腫（edema）提示前腔靜脈（cranial vena cava）回流受阻，最常見原因是縱膈腔腫瘤（mediastinal neoplasia）壓迫前腔靜脈，引起靜脈高壓和頭頸部淋巴引流受阻，形成「前腔靜脈症候群（cranial vena cava syndrome）」。","we":["A. 頸部扭傷不會引起靜脈回流障礙和水腫。","B. 心包積液引起全身性靜脈回流障礙，但前腔靜脈壓迫更典型引起局部頭頸水腫。","D. 甲狀腺腫大可壓迫氣管，但引起頭頸水腫不典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_064","year":2015,"roc_year":104,"session":"","examNo":64,"q":"貓罹患永存性右主動脈弓，會勒住下列何段食道，引起食道阻塞？","opts":["A. 頸部食道","B. 胸腔入口食道","C. 心底部食道","D. 橫膈前緣食道"],"ans":2,"exp":"持久性右主動脈弓（PRAA）形成血管環（vascular ring anomaly），在心底部（base of heart）勒住食道，造成心底部食道（esophagus at the base of heart）前方擴張，食物無法通過，引起食後逆流。","we":["A. 胸腔入口處食道不是PRAA的勒縮位置。","B. 頸部食道未受PRAA影響，可正常吞嚥。","D. 腹腔食道（esophagogastric junction）不受PRAA影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_065","year":2015,"roc_year":104,"session":"","examNo":65,"q":"下列有關犬永存性右主動脈弓（persistent right aortic arch）之敘述，何者錯誤？","opts":["A. 德國狼犬是本病的好發犬種","B. 本病是因胎兒時期，左第四主動脈弓發育異常，形成血管環壓迫食道","C. 本病因異常血管環壓迫食道，而引起食物逆流","D. 本病會繼發吸入性肺炎和體重減輕"],"ans":1,"exp":"PRAA（持久性右主動脈弓）的正確定義是右第四主動脈弓持久存在（persistent right fourth aortic arch），而非「左第四主動脈弓發育異常」。正常發育時，左第四主動脈弓形成主動脈弓，右側退化；若右側持久存在，則形成血管環壓迫食道。","we":["A. PRAA在德國狼犬和愛爾蘭塞特犬有遺傳傾向，正確。","C. 手術目的是切斷血管環（ligamentum arteriosum）解除壓迫，正確。","D. 早期手術預後較好，確診即應手術，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_066","year":2015,"roc_year":104,"session":"","examNo":66,"q":"下列何者非貓下泌尿道症候群（feline lower urinary tract disease）之常見症狀？","opts":["A. 血尿","B. 在不適當場所排尿（periuria）","C. 多尿（polyuria）","D. 頻尿（pollakiuria）"],"ans":2,"exp":"FLUTD（貓下泌尿道疾病）典型症狀包括頻尿（pollakiuria）、血尿（hematuria）、排尿困難（dysuria）、在貓砂盆外排尿、尿道阻塞（雄貓）等。多尿（polyuria，尿量增多）是上泌尿道/腎臟或系統性疾病的表現，不是FLUTD的症狀。","we":["A. 血尿（hematuria）是FLUTD常見症狀，正確歸類。","B. 排尿困難（dysuria/stranguria）是FLUTD核心症狀，正確。","D. 頻尿（pollakiuria）是FLUTD最常見症狀之一，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_067","year":2015,"roc_year":104,"session":"","examNo":67,"q":"犬貓嚴重肝硬化會導致","opts":["A. 全身性高血壓","B. 頸靜脈性高血壓","C. 門脈性高血壓","D. 肺動脈性高血壓"],"ans":2,"exp":"犬貓嚴重肝硬化（liver cirrhosis）導致肝臟纖維化和再生結節，壓迫肝內門靜脈分支，增加門靜脈阻力，引起門脈性高血壓（portal hypertension）。門脈高壓導致腹水、側支循環形成和脾臟充血等後遺症。","we":["A. 肝臟功能衰竭（hepatic failure）是嚴重肝硬化的結果，但門脈高壓是更直接的血行動力學後果。","B. 高蛋白血症（hyperproteinemia）不是肝硬化的典型結果，相反會出現低蛋白血症。","D. 高血糖（hyperglycemia）在晚期肝病可見，但門脈高壓是更典型的嚴重肝硬化後遺症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_068","year":2015,"roc_year":104,"session":"","examNo":68,"q":"犬貓肺水腫的症狀為","opts":["A. 呼吸快速和濕性囉音","B. 呼吸快速和乾性囉音","C. 呼吸慢且深和濕性囉音","D. 呼吸慢且深和乾性囉音"],"ans":0,"exp":"犬貓肺水腫（pulmonary edema）的典型症狀是呼吸快速（tachypnea）和濕性囉音（moist crackles/rales），肺泡液體積聚導致氣體交換障礙，引起代償性呼吸加速；液體在細支氣管和肺泡產生水泡音。","we":["B. 乾性囉音（wheeze）見於氣道痙攣（哮喘），非典型肺水腫。","C. 呼吸慢（bradypnea）見於鎮靜過度或神經問題，非肺水腫。","D. 胸腔積液（pleural effusion）引起呼吸音減弱，而非肺水腫特有的水泡音。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_069","year":2015,"roc_year":104,"session":"","examNo":69,"q":"下列何項犬病，易繼發睪丸腫瘤？","opts":["A. 隱睪症","B. 睪丸炎","C. 副睪炎","D. 布氏桿菌感染"],"ans":0,"exp":"犬隱睪症（cryptorchidism）患犬睪丸腫瘤發生率顯著高於正常犬（約13倍），因腹腔高溫造成DNA損傷，最常發生Sertoli細胞瘤（Sertoli cell tumor）和精原細胞瘤（seminoma）。隱睪症是犬睪丸腫瘤最重要的易感因子。","we":["B. 自體免疫性睪丸炎可引起睪丸損傷，但非繼發睪丸腫瘤的主因。","C. 睪丸外傷可能引起局部炎症，不典型繼發腫瘤。","D. 老齡性睪丸退化不繼發腫瘤，反而降低腫瘤風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_070","year":2015,"roc_year":104,"session":"","examNo":70,"q":"犬罹患下列何種腫瘤，容易同時罹患肥大性骨病（hypertrophic osteopathy）？","opts":["A. 肝癌","B. 肥胖細胞瘤","C. 肺腫瘤","D. 乳房腫瘤"],"ans":2,"exp":"犬肥大性骨病（Hypertrophic Osteopathy, HO）是指四肢長骨骨膜增生，99%繼發於肺部病變，尤其是肺腫瘤（pulmonary neoplasia）。胸腔內腫瘤（原發或轉移性）引起血管迷走神經刺激或生長因子釋放，導致骨膜異常增生。","we":["A. 脾臟腫瘤（splenic tumor）偶有報告引起HO，但肺腫瘤是最主要的相關腫瘤。","B. 肝腫瘤（hepatic neoplasia）與HO關係不常見。","D. 淋巴瘤（lymphoma）雖為常見腫瘤，但與HO的典型關聯性低於肺腫瘤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_071","year":2015,"roc_year":104,"session":"","examNo":71,"q":"犬水腦症（Hydrocephalus）最好發於下列那些犬種？①Maltese Terrier馬爾第斯梗犬\r ②Yorkshire Terrier約克夏梗犬 ③ Chihuahua吉娃娃 ④Toy poodle玩具貴賓犬","opts":["A. 僅①③","B. 僅②④","C. 僅①②③","D. ①②③④"],"ans":3,"exp":"犬水腦症（hydrocephalus）好發犬種包括：①馬爾濟斯（Maltese）、②約克夏（Yorkshire Terrier）、③吉娃娃（Chihuahua）、④玩具貴賓（Toy Poodle）。這些小型犬種因頭骨骨縫閉合異常、顱腦發育特性，先天性水腦症發生率高。四者均正確。","we":["A. 僅①②不完整，約克夏、吉娃娃和玩具貴賓同樣是高危品種。","B. ①②③不完整，應包含玩具貴賓。","C. ②③④不完整，應包含馬爾濟斯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_072","year":2015,"roc_year":104,"session":"","examNo":72,"q":"複選題 72.小動物自體海綿移植骨（cancellous bone graft）的敍述，下列何項錯誤？","opts":["A. 海綿骨具有骨質傳導（osteoconduction）及骨質誘導（osteoinduction）之特性","B. 海綿骨常取自遠端肱骨（humerus）和腸骨翼（ilial wing）","C. 海綿骨移植可應用於骨折延遲癒合（delayed union）及骨折不癒合（nonunion）之情形","D. 取得的海綿骨應保存於血液中，並儘快放置於骨折處"],"ans":1,"exp":"自體海綿骨移植（autogenous cancellous bone graft）的骨質取自近端肱骨（proximal humerus），透過翼狀突（greater tubercle）鑽孔進入骨髓腔，取材豐富且手術入路簡單。「常取自遠端肱骨」是錯誤描述。","we":["A. 自體骨移植無排斥反應，是最佳骨移植選擇，正確。","C. 海綿骨移植提供成骨細胞和骨基質，促進骨形成，正確。","D. 海綿骨移植適用於骨折癒合延遲（delayed union）和骨不癒合（non-union），正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_073","year":2015,"roc_year":104,"session":"","examNo":73,"q":"檢查脊髓反射（spinal reflex），其結果出現反射增強（exaggeration）的現象，其病變最可\r 能出現在下列何處？","opts":["A. 上位運動神經細胞（upper motor neuron）","B. 下位運動神經細胞（lower motor neuron）","C. 上頸神經節（superior cervical ganglia）","D. 下腸系膜神經節（inferior mesenteric ganglia）"],"ans":0,"exp":"脊髓反射增強（hyperreflexia）表示上位運動神經細胞（UMN, upper motor neuron）受損，因正常情況下UMN對下位運動神經細胞（LMN）有抑制性調控，UMN受損後失去抑制，LMN和反射弧活性增強，表現為反射亢進。","we":["B. 下位運動神經細胞（LMN）受損引起反射減弱（hyporeflexia）或消失（areflexia）。","C. 周邊神經受損同樣引起反射減弱，非反射增強。","D. 神經肌肉接合處（neuromuscular junction）病變引起肌無力，反射通常正常或減弱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_074","year":2015,"roc_year":104,"session":"","examNo":74,"q":"關於犬貓腸管切開術之術後管理，下列何項錯誤？","opts":["A. 術後8－12小時就可以開始給水","B. 術後72小時後，才可開始少量進食","C. 術後飲食應先少量多餐，再慢慢回復正常","D. 除非有腹膜炎發生，否則抗生素應在術後2－6小時內停止給與"],"ans":1,"exp":"腸管切開術（enterotomy）術後管理中，「術後72小時後才可進食」是錯誤的。現代外科建議早期腸道餵食（early enteral feeding），通常術後12-24小時即可開始少量餵食，促進腸道蠕動恢復和傷口癒合，延遲至72小時反而不利。","we":["A. 術後監測腸道蠕動音（borborygmi）是標準術後管理，正確。","C. 術後適當補液維持血容量和電解質平衡，正確。","D. 觀察術後排便情形以確認腸道功能恢復，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_075","year":2015,"roc_year":104,"session":"","examNo":75,"q":"關於犬膀胱切開術和部分切開術之敍述，下列敘述何項錯誤？","opts":["A. 除膀胱三角區域外，最多可切除75%的膀胱組織","B. 若要確認輸尿管開口或放置輸尿管導管時，則建議由膀胱背側面來進行膀胱切開術","C. 縫合膀胱壁時縫線不應進入腔內，但要包含黏膜下層","D. 若膀胱創口有嚴重出血時，可用簡單連續方式先行單獨縫合膀胱黏膜層"],"ans":1,"exp":"膀胱切開術（cystotomy）中，確認輸尿管開口應由腹側（ventral）切開膀胱，進入膀胱後在背側壁（dorsal wall）尋找兩個輸尿管開口。「由背側切開確認輸尿管開口」是錯誤的——背側切開會直接切到輸尿管開口位置，增加損傷風險。","we":["A. 膀胱切開術後應以雙層縫合（two-layer closure）關閉切口，正確。","C. 術後保留導尿管數天有助於減壓和監測，正確。","D. 術前膀胱沖洗可減少細菌負荷，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_076","year":2015,"roc_year":104,"session":"","examNo":76,"q":"犬髖關節發育不良（hip dysplasia）之敍述，下列何項錯誤？","opts":["A. 本病為遺傳性疾病，也會受到營養因子及環境因子影響","B. pelvic triple osteotomy為外科治療的選項","C. 體重控制及使用NSAID藥物為內科治療的選項","D. 本病不會引起退化性關節病"],"ans":3,"exp":"犬髖關節發育不良（canine hip dysplasia, CHD）會引起繼發性退化性關節病（secondary degenerative joint disease, DJD/osteoarthritis），這是CHD最主要的長期併發症。「不會引起退化性關節病」的敘述錯誤。","we":["A. CHD在大型犬（如德國狼犬、拉布拉多）有遺傳傾向，正確。","B. 關節鬆弛（joint laxity）是CHD早期特徵，Ortolani test陽性，正確。","C. X光檢查是CHD診斷和分級的標準方法，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_077","year":2015,"roc_year":104,"session":"","examNo":77,"q":"下列何種腫瘤，最好發於貓的胃部？","opts":["A. 黑色素瘤（melanoma）","B. 胃腺癌（gastric adenocarcinoma）","C. 胃平滑肌瘤（gastric leiomyoma）","D. 淋巴瘤（lymphoma）"],"ans":3,"exp":"貓胃部最常見的腫瘤是淋巴瘤（lymphoma），貓腸胃道淋巴瘤是最常見的貓消化道腫瘤，其中小細胞淋巴瘤（small cell lymphoma）特別好發於老齡貓的腸胃道，包括胃部。","we":["A. 腺癌（adenocarcinoma）在貓胃部偶見，但發生率低於淋巴瘤。","B. 肥大細胞瘤（mast cell tumor）在貓脾臟最常見，胃部相對少見。","C. 平滑肌瘤（leiomyoma）在貓胃腸道少見，非最常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_078","year":2015,"roc_year":104,"session":"","examNo":78,"q":"Bone healing常會受到使用的固定裝置所影響，因為使用不同的固定裝置對骨折骨的血液循\r 環會有不同的效應，下列何項最不適當？","opts":["A. external skeletal fixator對骨外血液供應的影響最少","B. intramedullary pin會妨礙骨髓內血管的循環","C. cerclage wire會妨礙骨膜的血流供應","D. bone plate和screw會造成plate下方的cortical bone的血流供應受阻"],"ans":0,"exp":"骨折固定裝置中，外骨骼固定器（ESF, external skeletal fixation）主要透過外部鋼針穿過皮膚固定骨骼，對骨外血液供應（periosteal blood supply）的影響最少，因為不需要直接剝離骨膜。相比之下，骨板（plate）和骨內髓釘（IM nail）對骨血流影響較大。","we":["B. 骨板（bone plate）需剝離骨膜，對骨外血流影響較ESF大。","C. 髓內釘（IM nail）破壞骨髓腔血流，對骨內血液供應影響大。","D. 骨螺絲（bone screw）需鑽入骨皮質，會局部影響骨血流。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_079","year":2015,"roc_year":104,"session":"","examNo":79,"q":"下列那一種局部麻醉藥物（local anesthetics），在犬的相對效價（relative potency）值最\r 低？","opts":["A. procaine","B. lidocaine","C. mepivacaine","D. bupivacaine"],"ans":0,"exp":"局部麻醉藥效價（potency）比較中，procaine（普魯卡因）的效價最低，其效價定為1作為基準值，其他常用局部麻醉藥效價均高於procaine：lidocaine約2-4倍，bupivacaine約16倍，tetracaine約10倍。","we":["B. Lidocaine效價約為procaine的2-4倍，非最低。","C. Bupivacaine效價高（約16×procaine），持效時間長，非最低。","D. Tetracaine效價高（約10×procaine），常用於脊椎麻醉，非最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_080","year":2015,"roc_year":104,"session":"","examNo":80,"q":"犬髖關節脫臼股骨頭的脫臼位置以下列何項為主？","opts":["A. 頭腹側（cranio-ventral）","B. 頭背側（cranio-dorsal）","C. 尾腹側（caudo-ventral）","D. 尾背側（caudo-dorsal）"],"ans":1,"exp":"犬髖關節脫臼（hip luxation）時，股骨頭最常移位至頭背側（cranio-dorsal direction），即向前（cranial）且向上（dorsal）移位，這是因為臀肌和髂腰肌的牽引力方向，以及髖關節囊前背側部分最脆弱。","we":["A. 股骨頭向尾腹側（caudo-ventral）移位是最少見的脫臼方向。","C. 向內側移位（medial luxation）不符合犬髖關節脫臼典型力學。","D. 向後側（caudal）移位不是犬髖脫臼最常見的移位方向。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_001","year":2016,"roc_year":105,"session":"","examNo":1,"q":"馬發生急性橫紋肌溶解（acute rhabdomyolysis）時，下列何項處置方式較適當？","opts":["A. 牽馬散步以防休克","B. 保持休息，不宜走動","C. 給與治療性蹄鐵以緩解張力","D. 給與抗生素以減緩發炎"],"ans":1,"exp":"馬急性橫紋肌溶解（azoturia/tying-up/acute rhabdomyolysis）時，肌肉大量壞死釋放肌紅蛋白（myoglobin），正確處置是立即停止運動、保持休息，避免進一步肌肉損傷。牽馬散步反而會加重肌肉破壞，是禁忌。","we":["牽馬散步會加重肌肉損傷和肌紅蛋白釋放，是錯誤處置，不適合。","保持休息、不宜走動是急性橫紋肌溶解的首要處置，此為正確答案。","治療性蹄鐵不適用於肌肉疾病，此選項不相關。","抗生素對橫紋肌溶解無直接效果，此選項不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_002","year":2016,"roc_year":105,"session":"","examNo":2,"q":"馬疝痛接受檢查前，先給止痛藥，則此藥物應不具下列那一項作用？","opts":["A. 對心血管影響小","B. 不抑制腸蠕動","C. 中等止痛作用","D. 止痛效果長"],"ans":3,"exp":"馬疝痛止痛藥（如flunixin meglumine）的要求：對心血管影響小（避免加重休克）、不抑制腸蠕動（避免掩蓋腸阻塞惡化）、有中等止痛作用（足夠緩解疼痛但不過度掩蓋症狀）。NSAIDs的止痛效果屬中等，不是長效，因此「止痛效果長」是不具備的特性。","we":["對心血管影響小是馬疝痛止痛藥的要求，此選項具備，非答案。","不抑制腸蠕動是重要要求，此選項具備，非答案。","中等止痛作用是適當要求，此選項具備，非答案。","止痛效果長不是馬疝痛止痛藥的要求（需中等而非長效以利評估），此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_003","year":2016,"roc_year":105,"session":"","examNo":3,"q":"馬於病後之恢復期間若食慾喪失，則下列處置何者錯誤？","opts":["A. 先餵與青草","B. 餵食足量奶粉","C. 儘量給與低纖維草料","D. 可添加維生素B以促進食慾"],"ans":1,"exp":"馬於病後恢復期食慾喪失的處置：先提供新鮮青草（刺激食慾）、給予低纖維易消化草料、添加維生素B群（促進食慾）均屬正確。「餵食足量奶粉」對成年馬是錯誤的，成年馬缺乏乳糖酶，大量奶粉會引起腹瀉和消化問題，且奶粉不符合馬的正常飲食。","we":["先餵青草可刺激食慾，是適當處置，非答案。","餵食足量奶粉對成年馬有害（缺乏乳糖酶），此為正確答案（錯誤處置）。","給予低纖維草料在恢復期是合理的，非答案。","添加維生素B可促進食慾，是適當處置，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_004","year":2016,"roc_year":105,"session":"","examNo":4,"q":"牛發生第四胃右側異位及捻轉時，下列何種臨床病理之檢驗結果較不易出現？","opts":["A. 低氯血症","B. 低鉀血症","C. 代謝性鹼中毒","D. 呼吸性鹼中毒"],"ans":3,"exp":"牛第四胃右側異位及捻轉（RDA/RVA）的臨床病理異常：因胃酸（HCl）在皺胃中蓄積，氫離子和氯離子無法進入十二指腸，導致低氯血症（hypochloremia）、低鉀血症（hypokalemia）和代謝性鹼中毒（metabolic alkalosis）。呼吸性鹼中毒（respiratory alkalosis）與皺胃疾病無直接病理機制，不是常見結果。","we":["低氯血症（hypochloremia）是皺胃疾病的特徵性電解質異常，正確，非答案。","低鉀血症因代謝性鹼中毒時腎臟代償排鉀而發生，正確，非答案。","代謝性鹼中毒是低氯血症的直接後果，正確，非答案。","呼吸性鹼中毒與皺胃捻轉無直接關聯，此為正確答案（不易出現）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_005","year":2016,"roc_year":105,"session":"","examNo":5,"q":"仔牛第四胃潰瘍發生之病變區主要在何處？","opts":["A. 胃底部","B. 幽門部","C. 賁門部","D. 胃大彎部"],"ans":1,"exp":"仔牛第四胃潰瘍（abomasal ulcer）主要病變區在幽門部（pylorus）。仔牛的第四胃潰瘍好發於幽門區，可能與哺乳期的酸性環境、Helicobacter-like organisms、或飼養壓力有關。幽門潰瘍可引起出血和幽門梗阻。","we":["胃底部（fundic region）不是仔牛第四胃潰瘍的主要好發位置，錯誤。","幽門部（pylorus）是仔牛第四胃潰瘍的主要病變區，此為正確答案。","賁門部（cardia）不是主要好發位置，錯誤。","胃大彎部不是主要好發位置，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_006","year":2016,"roc_year":105,"session":"","examNo":6,"q":"仔牛脫水時，若以口服方式進行液體補充，大約可以經由口服方式吸收多少百分比之液體？","opts":["A. 10%－29%","B. 30%－59%","C. 61%－80%","D. 81%－100%"],"ans":3,"exp":"仔牛脫水時口服補充液體的吸收率相當高，約為81%-100%。仔牛的消化道在正常功能時，口服電解質液幾乎可以完全吸收（約95%），因此輕度脫水的仔牛口服補液是有效的治療方式。","we":["10%-29%的吸收率遠低於實際，口服補液在仔牛中非常有效，錯誤。","30%-59%的吸收率仍低估了口服補液的效率，錯誤。","61%-80%的吸收率接近但稍低於實際值，不如D準確。","81%-100%（約95%）是仔牛口服液體的實際吸收率，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_007","year":2016,"roc_year":105,"session":"","examNo":7,"q":"下列何種疾病較易出現酮尿症？","opts":["A. 第一胃腐敗症","B. 第四胃左側異位","C. 第四胃食滯","D. 第三胃食滯"],"ans":1,"exp":"第四胃左側異位（LDA）常發生於圍產期乳牛，此時乳牛處於負能量平衡狀態，脂肪大量動員→酮體升高→酮尿症（ketonuria）。LDA與酮病（ketosis）常同時發生或互為因果，因此LDA病牛較易出現酮尿症。","we":["第一胃腐敗症是瘤胃食物過酸腐敗，不以酮尿症為特徵，錯誤。","第四胃左側異位（LDA）常伴隨酮病和酮尿症，此為正確答案。","第四胃食滯（abomasal impaction）主要是阻塞性問題，不以酮尿症為主，錯誤。","第三胃食滯（omasal impaction）不以酮尿症為特徵，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_008","year":2016,"roc_year":105,"session":"","examNo":8,"q":"下列那一種病毒感染牛隻後，會造成潛伏性感染（latent infection）？","opts":["A. 牛疱疹病毒第一型（bovine herpesvirus type 1）","B. 牛副流感第三型病毒（bovine parainfluenza virus type 3）","C. 牛流行熱病毒（bovine ephemeral fever virus）","D. 牛融合性呼吸道病毒（bovine respiratory syncytial virus）"],"ans":0,"exp":"牛疱疹病毒第一型（Bovine Herpesvirus type 1, BHV-1）是疱疹病毒科成員，可在三叉神經節（trigeminal ganglion）中建立潛伏感染（latent infection）。在壓力（運輸、分娩、免疫抑制）下，病毒可再活化（reactivation），引起IBR（傳染性牛鼻氣管炎）復發。","we":["牛疱疹病毒第一型（BHV-1）可在神經節建立潛伏感染，此為正確答案。","牛副流感第三型病毒（BPIV-3）是RNA病毒（副黏液病毒科），不建立潛伏感染，錯誤。","牛流行熱病毒是彈狀病毒（RNA病毒），不建立潛伏感染，錯誤。","牛融合性呼吸道病毒（BRSV）是RNA病毒，不建立潛伏感染，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_009","year":2016,"roc_year":105,"session":"","examNo":9,"q":"牛發生尿素中毒時，下列何種症狀不易出現？","opts":["A. 初期出現心悸亢進","B. 初期出現高度呼吸困難","C. 極期出現全身強直性痙攣","D. 末期出現泡沫性流涎"],"ans":1,"exp":"牛尿素（氨）中毒（urea/ammonia toxicity）症狀：初期（early）出現過度興奮、流涎、腹部不適、心悸亢進（tachycardia）；中期出現肌肉顫抖、共濟失調；極期出現全身強直性痙攣（tetanic convulsions）；末期出現泡沫性流涎、虛脫、死亡。「初期出現高度呼吸困難」不正確，呼吸困難是後期（極期/末期）的症狀。","we":["初期出現心悸亢進（tachycardia）是氨中毒的初期症狀，可以出現，非答案。","初期出現高度呼吸困難是不正確的（呼吸困難在極期才出現），此為正確答案（不易出現於初期）。","極期出現全身強直性痙攣是氨中毒的典型症狀，正確，非答案。","末期出現泡沫性流涎是氨中毒末期的症狀，正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_010","year":2016,"roc_year":105,"session":"","examNo":10,"q":"牛發生下列何種疾病，通常不會出現酮尿症？","opts":["A. 妊娠毒血症","B. 脂肪壞死症","C. 過肥牛症候群","D. 酮病"],"ans":1,"exp":"脂肪壞死症（fat necrosis/lipomatosis）是一種慢性代謝疾病，腹腔內脂肪皂化、壞死形成硬塊，主要問題是物理性壓迫（壓迫腸道或輸尿管），不伴隨脂肪大量動員產生酮體。妊娠毒血症、過肥牛症候群和酮病都有脂肪大量動員和酮體升高（酮尿症）的病理機制。","we":["妊娠毒血症（pregnancy toxemia）因能量負平衡產生酮體，出現酮尿，錯誤（不選此項）。","脂肪壞死症（fat necrosis）不以酮尿症為特徵，此為正確答案。","過肥牛症候群（fat cow syndrome）與脂肪動員和酮病相關，出現酮尿，錯誤（不選此項）。","酮病（ketosis）本身即以酮尿症為特徵，錯誤（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_011","year":2016,"roc_year":105,"session":"","examNo":11,"q":"牛發生營養性肌病（nutritional myopathy）時，應懷疑最缺乏下列何項維生素？","opts":["A. 維生素A","B. 維生素B12","C. 維生素B1","D. 維生素E"],"ans":3,"exp":"牛營養性肌病（nutritional myopathy），又稱白肌病（white muscle disease），主要與維生素E和硒（selenium）缺乏有關。維生素E是強效抗氧化劑，保護肌肉細胞膜免受氧化損傷；硒作為谷胱甘肽過氧化物酶（GPx）的輔因子，協同維生素E保護肌肉。","we":["維生素A缺乏引起夜盲症、免疫功能下降，與肌病無主要關聯，錯誤。","維生素B12缺乏引起貧血和神經症狀，不是肌病的主因，錯誤。","維生素B1（硫胺素）缺乏引起腦灰質軟化症（PEM），不是肌病，錯誤。","維生素E缺乏是白肌病（nutritional myopathy）的主要病因，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_012","year":2016,"roc_year":105,"session":"","examNo":12,"q":"乳牛血漿中維生素A之含量在下列何範圍（IU/dL）以下時，即表示已出現維生素A缺乏症？","opts":["A. 100－150","B. 80－100","C. 60－80","D. 40－50"],"ans":3,"exp":"乳牛血漿維生素A臨界值：正常乳牛血漿維生素A含量應>100 IU/dL；當含量降至40-50 IU/dL以下，即表示已出現臨床維生素A缺乏症（night blindness、免疫功能下降、繁殖障礙等）。","we":["100-150 IU/dL 是正常範圍，不是缺乏症的臨界值，錯誤。","80-100 IU/dL 仍在正常範圍或接近正常，不是缺乏臨界值，錯誤。","60-80 IU/dL 接近邊界，但不是標準的缺乏症臨界值，錯誤。","40-50 IU/dL 以下即出現維生素A缺乏症，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_013","year":2016,"roc_year":105,"session":"","examNo":13,"q":"牛兩側眼眶周圍黑色毛褪色，出現一圈灰色毛有如戴眼鏡一般，可能是飼糧中缺乏下列何項\r  所致？","opts":["A. 鉬","B. 鐵","C. 銅","D. 錳"],"ans":2,"exp":"牛眼眶周圍黑色毛褪色呈灰色圈（「眼鏡」外觀）是銅（copper）缺乏（低銅血症/hypocuprosis）的特徵性症狀。銅是黑色素合成酶（酪氨酸酶，tyrosinase）的輔因子，銅缺乏時黑色素合成減少，毛色變灰白，尤其眼眶周圍最明顯。","we":["鉬（molybdenum）過多會干擾銅吸收，但本身不直接引起眼鏡徵，錯誤。","鐵（iron）缺乏引起貧血，不引起特徵性眼眶褪色，錯誤。","銅（copper）缺乏引起眼眶周圍灰色圈（glasses effect），此為正確答案。","錳（manganese）缺乏引起繁殖障礙，不引起特徵性眼眶褪色，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_014","year":2016,"roc_year":105,"session":"","examNo":14,"q":"牛過食高碳水化合物之穀物時易誘發那些疾病？①蹄葉炎 ②腐蹄病 ③腸毒血症 ④酮病 ⑤\r    肝膿瘍","opts":["A. ①③⑤","B. ②③④","C. ①②④","D. ③④⑤"],"ans":0,"exp":"牛過食高碳水化合物穀物→瘤胃過酸症→大量產生VFAs（揮發性脂肪酸）和乳酸→引發：①蹄葉炎（laminitis，因VFAs和內毒素影響蹄部血流）③腸毒血症（enterotoxemia，因梭菌大量繁殖產毒）⑤肝膿瘍（liver abscess，因瘤胃炎→細菌移行至肝臟）。②腐蹄病是感染性疾病與過食穀物無直接關係；④酮病是低能量而非過食穀物的結果。","we":["①蹄葉炎+③腸毒血症+⑤肝膿瘍均與過食穀物直接相關，此為正確答案。","②腐蹄病是感染性疾病，不是穀物過食的直接後果，選項含②故不正確。","①②④中，②腐蹄病和④酮病不是直接後果，此選項不正確。","③④⑤中，④酮病是低能量（非穀物過食）的結果，此選項不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_015","year":2016,"roc_year":105,"session":"","examNo":15,"q":"牛創傷性蜂巢胃腹膜炎時，下列何種檢查通常無異常變化？","opts":["A. 血液檢查","B. 金屬探測器探測","C. 胸廓及劍狀軟骨周圍疼痛試驗","D. 右側腹壁下方叩診"],"ans":3,"exp":"牛創傷性蜂巢胃腹膜炎（Traumatic Reticuloperitonitis, TRP）的體格檢查：血液檢查（白血球增多、核左移）有異常；金屬探測器常可發現網胃金屬異物；劍狀軟骨周圍疼痛試驗（pinch test/withers test）陽性；右側腹壁下方叩診通常無異常，因病灶在左前腹部（網胃區域）。","we":["血液檢查（白血球增多/核左移）在TRP時有異常，不是答案。","金屬探測器常可偵測到網胃金屬異物，有診斷意義，不是答案。","胸廓和劍狀軟骨周圍疼痛試驗（pinch test）在TRP時陽性，有異常，不是答案。","右側腹壁下方叩診在TRP（左前腹部病灶）時通常無異常，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_016","year":2016,"roc_year":105,"session":"","examNo":16,"q":"乳牛第四胃異位是一種產後代謝性疾病，病牛常有多項的臨床檢查及血清生化值異常，但下\r  列那一項不發生於第四胃異位病牛？","opts":["A. 低血氯","B. 脫水","C. 高血鉀","D. 代謝性鹼中毒"],"ans":2,"exp":"第四胃異位（LDA/RDA）的臨床病理：氯離子和氫離子在皺胃中蓄積（無法進入腸道）→低氯血症（hypochloremia）；腎臟代償排鉀→低鉀血症（hypokalemia）；代謝性鹼中毒（metabolic alkalosis）；脫水（因食慾廢絕和電解質失衡）。高血鉀症（hyperkalemia）不會發生，第四胃異位反而引起低鉀血症。","we":["低血氯（hypochloremia）是第四胃異位的特徵，可發生，非答案。","脫水因食慾不振和電解質失衡而發生，可發生，非答案。","高血鉀（hyperkalemia）不發生於第四胃異位（反而是低鉀血症），此為正確答案。","代謝性鹼中毒是第四胃異位的特徵性酸鹼失衡，可發生，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_017","year":2016,"roc_year":105,"session":"","examNo":17,"q":"目前台灣乳牛引起蹄葉炎之原因以下列何項為主？","opts":["A. 負重性","B. 產褥性","C. 食因性","D. 過敏性"],"ans":2,"exp":"台灣乳牛蹄葉炎（laminitis）的主要病因是食因性（dietary/alimentary laminitis）。乳牛飼養精料比例過高（高穀物飲食）→瘤胃過酸→VFAs和細菌內毒素吸收→蹄部微血管舒縮障礙→蹄真皮（laminae）缺血發炎→蹄葉炎。台灣集約化乳牛場以食因性為主。","we":["負重性蹄葉炎因肢體受力不均引起，不是台灣的主要原因，錯誤。","產褥性蹄葉炎在分娩前後激素變化相關，不是最主要，錯誤。","食因性（高精料飲食）是台灣乳牛蹄葉炎的最主要原因，此為正確答案。","過敏性蹄葉炎較少見，不是台灣乳牛的主要原因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_018","year":2016,"roc_year":105,"session":"","examNo":18,"q":"牛、羊之下列何種尿石症，口服氯化銨最具療效？","opts":["A. 草酸鈣","B. 碳酸鈣","C. 矽酸鈣","D. 磷酸銨鎂"],"ans":3,"exp":"氯化銨（NH4Cl）是尿液酸化劑，藉由酸化尿液（降低尿液pH）來溶解鹼性結石。磷酸銨鎂結石（struvite，俗稱鳥糞石）在鹼性尿中形成，在酸性尿中溶解，因此NH4Cl對磷酸銨鎂結石的治療和預防效果最佳。","we":["草酸鈣結石在酸性尿中更不易溶解（酸性條件下草酸鈣更易沉澱），NH4Cl反而不適合，錯誤。","碳酸鈣結石也在鹼性尿中形成，NH4Cl有些效果，但效果不如磷酸銨鎂結石好，此選項不如D準確。","矽酸鈣結石對酸化療法反應較差，此選項不如D準確。","磷酸銨鎂（struvite）結石對NH4Cl治療反應最佳，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_019","year":2016,"roc_year":105,"session":"","examNo":19,"q":"下列有關以滾牛（rolling）方式矯正牛第四胃左側異位的方式，何者正確？","opts":["A. 先讓牛左側臥，再以順時針方向轉成右側臥","B. 先讓牛右側臥，再以順時針方向轉成左側臥","C. 先讓牛左側臥，再以逆時針方向轉成右側臥","D. 先讓牛右側臥，再以逆時針方向轉成右側臥"],"ans":1,"exp":"滾牛（rolling）矯正LDA（左側皺胃移位）的標準方式：先讓牛右側臥（右側臥使皺胃因重力移向腹腔右下方）→再以順時針方向轉成左側臥（讓皺胃在轉動過程中恢復正常位置）。先右側臥再順時針翻轉是最常用的LDA滾牛矯正方式。","we":["先讓牛左側臥不能有效矯正LDA（皺胃在左側，左側臥使其更貼近腹壁），錯誤。","先讓牛右側臥，再以順時針方向轉成左側臥是LDA滾牛矯正的標準方式，此為正確答案。","先讓牛左側臥逆時針轉，矯正方向不符合LDA的病理機制，錯誤。","先右側臥再逆時針轉成右側臥（轉了一圈回原位），邏輯上無意義，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_020","year":2016,"roc_year":105,"session":"","examNo":20,"q":"若以xylazine進行一頭約500公斤成牛的鎮靜，下列那一種劑量提供良好的鎮靜作用，牛隻會\r  躺臥下來並有輕微麻醉作用？","opts":["A. 0.01－0.02 mg/kg","B. 0.1－0.2 mg/kg","C. 0.4－0.5 mg/kg","D. 1－2 mg/kg"],"ans":1,"exp":"Xylazine在牛的使用劑量：牛對xylazine的敏感性比馬高約10倍。0.1-0.2 mg/kg（IV或IM）可提供深度鎮靜，使牛躺臥（recumbency）並有輕微麻醉效果，適用於小手術。劑量0.01-0.02 mg/kg只提供輕微鎮靜（站立），不使牛躺臥。","we":["0.01-0.02 mg/kg只提供輕微鎮靜（站立），牛不會躺臥，太低，錯誤。","0.1-0.2 mg/kg可提供深度鎮靜使牛躺臥並有輕微麻醉效果，此為正確答案。","0.4-0.5 mg/kg劑量過高，在牛可能引起過深麻醉和心肺抑制，錯誤。","1-2 mg/kg是馬的使用劑量，用於牛會嚴重過量，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_021","year":2016,"roc_year":105,"session":"","examNo":21,"q":"以2%（20 mg／mL）lidocaine進行牛隻鋸角前的角神經（cornual nerve）麻醉時，正確的\r    注射部位應在何處？","opts":["A. 牛角基部周圍四個點的局部注射","B. 牛角下方之角基部位與眼眶上緣間之中點處","C. 牛角下方之角基部位與耳朵背緣間之中點處","D. 牛角下方朝向耳朵背緣的角基部位"],"ans":2,"exp":"牛角神經阻斷（cornual nerve block）用於鋸角前麻醉：注射部位在牛角下方，角基部（horn base）與耳朵背緣（dorsal ear base）之間的中點處。此處是顴顳神經（zygomaticotemporal nerve）的角支走行位置，在此注射可阻斷整個角部的感覺。","we":["角基部周圍四點局部注射是較不精準的方式，不是標準的角神經阻斷，錯誤。","角基部與眼眶上緣之間的中點是眶上神經的位置，不是角神經，錯誤。","角基部與耳朵背緣之間的中點是標準角神經阻斷的注射位置，此為正確答案。","角基部朝向耳朵方向（非中點）不是最精確的描述，此選項不如C準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_022","year":2016,"roc_year":105,"session":"","examNo":22,"q":"乳牛發生難產並欲進行帝王切開術（Cesarean section）時，通常由下列那一個部位開刀？","opts":["A. 右旁中線","B. 左旁中線","C. 右脇腹部","D. 左脇腹部"],"ans":3,"exp":"乳牛帝王切開術（Cesarean section）通常選擇左側脇腹（left flank）入路。原因：左側開腹時腸管干擾較少（右側有較多小腸）；牛的子宮向左側易於取出；左側站立手術視野較好，且術後護理方便。","we":["右旁中線（right paramedian）入路在牛較少使用，且麻醉管理困難，錯誤。","左旁中線（left paramedian）在牛有時使用，但不如左脇腹常見，此選項不如D準確。","右脇腹（right flank）腸管干擾較多，不是首選，錯誤。","左脇腹（left flank）是乳牛帝王切開術最常用的入路，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_023","year":2016,"roc_year":105,"session":"","examNo":23,"q":"下列那一種方法最適合應用於牛隻腹壁切開後之皮膚傷口的縫合？","opts":["A. Parker-Kerr oversew","B. purse-string suture","C. Ford interlocking suture","D. simple interrupted suture"],"ans":2,"exp":"牛腹壁切開後皮膚傷口縫合最適合Ford interlocking suture（鎖釦連續縫合）。Ford interlocking suture提供良好的止血效果（連續縫合形成均勻的傷口密合）、抗拉力強，且縫合速度快，適合大型動物的腹壁皮膚縫合。","we":["Parker-Kerr oversew是一種翻入縫合法，用於腸道或膀胱等器官的縫合，不適合皮膚，錯誤。","purse-string suture（荷包縫合）用於孔口閉合（肛門、腸造口），不適合長切口皮膚，錯誤。","Ford interlocking suture是牛腹壁皮膚縫合的最佳選擇，此為正確答案。","simple interrupted suture（簡單間斷縫合）在需要快速縫合大切口時效率低，不如Ford interlocking，此選項不如C適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_024","year":2016,"roc_year":105,"session":"","examNo":24,"q":"小牛臍赫尼亞囊（hernial sac）內最常發現有那一個器官嵌入？","opts":["A. 大腸","B. 蜂巢胃","C. 瘤胃","D. 皺胃"],"ans":3,"exp":"小牛臍疝（umbilical hernia）囊內最常發現嵌入的器官是皺胃（abomasum）。仔牛的皺胃位於腹腔右前下方，靠近臍部，是最容易嵌入臍疝囊的器官。臍疝囊也可能含有網膜或小腸，但皺胃最常見。","we":["大腸（large intestine）位置偏後，不是臍疝最常見的嵌入器官，錯誤。","蜂巢胃（reticulum）在腹腔前部偏左，不常嵌入臍疝，錯誤。","瘤胃（rumen）體積龐大，位於左腹腔，不易嵌入臍疝，錯誤。","皺胃（abomasum）是小牛臍疝囊內最常發現的嵌入器官，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_025","year":2016,"roc_year":105,"session":"","examNo":25,"q":"以肌腱截斷術治療先天性球節彎曲變形的小牛，若需另外對此患肢進行物理治療，則要固定\r  下列那些關節？","opts":["A. 腕關節、球節","B. 飛節、球節","C. 腕關節、肩關節","D. 腕關節、肘關節"],"ans":0,"exp":"先天性球節彎曲變形（congenital flexural deformity of fetlock）小牛的肌腱截斷術後，物理治療需固定腕關節（carpus）和球節（fetlock joint）。這兩個關節需要伸展固定，以矯正屈肌腱縮短造成的關節彎曲，並在肌腱癒合期間維持正確的關節角度。","we":["腕關節、球節是需要固定的關節，以矯正球節屈曲變形，此為正確答案。","飛節（hock）在前肢的球節變形中不需要固定，錯誤。","肩關節不是球節彎曲的主要需固定關節，錯誤。","肘關節不是球節彎曲的主要需固定關節，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_026","year":2016,"roc_year":105,"session":"","examNo":26,"q":"黃疸為下列何種物質蓄積於體內的結果？","opts":["A. 膽紅素","B. 尿膽素元","C. 血紅素","D. 變性血色素"],"ans":0,"exp":"黃疸（icterus/jaundice）是膽紅素（bilirubin）蓄積於組織（皮膚、黏膜、鞏膜）所呈現的黃色染色。膽紅素是血紅素分解代謝的產物，在肝臟代謝後從膽汁排出；當膽紅素在血中蓄積並滲入組織，即形成黃疸。","we":["膽紅素蓄積是黃疸的直接原因，此為正確答案。","尿膽素元（urobilinogen）在尿液中排出，少量可引起尿色加深，不是黃疸的直接原因，錯誤。","血紅素（hemoglobin）在血管內，不直接引起組織黃染，錯誤。","變性血色素（methemoglobin）引起血液褐色，不引起組織黃染，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_027","year":2016,"roc_year":105,"session":"","examNo":27,"q":"在變性關節病之關節滑液評估中，其白血球含量（/uL）應在下列那一範圍？","opts":["A. <250","B. 250－1000","C. 10,000－50,000","D. 50,000－150,000"],"ans":1,"exp":"關節滑液分析分類（白血球WBC/uL）：正常<250；非炎症性（如退化性關節病/DJD）250-2000；輕度炎症2000-10000；化膿性>50000。變性關節病（degenerative joint disease）的滑液白血球含量在250-1000 /uL範圍。","we":["<250 /uL是正常關節滑液的白血球含量，不是DJD，錯誤。","250-1000 /uL是DJD（非炎症性）關節滑液的典型白血球含量，此為正確答案。","10,000-50,000 /uL是化膿性/嚴重炎症性關節炎，遠超過DJD的範圍，錯誤。","50,000-150,000 /uL是嚴重化膿性關節炎，不是DJD，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_028","year":2016,"roc_year":105,"session":"","examNo":28,"q":"公羊的尿道結石可在飼料中用何種方法，降低其發生率？","opts":["A. 添加NH4Cl","B. 添加tetracycline","C. 降低鹽的含量","D. 增加磷的比例"],"ans":0,"exp":"公羊尿道結石（urolithiasis）的預防：在飼料中添加氯化銨（NH4Cl）可酸化尿液，降低尿液pH，使磷酸銨鎂（struvite，最常見的反芻動物尿石）溶解度提高，有效降低尿石症的發生率。","we":["添加NH4Cl（氯化銨）酸化尿液，預防磷酸鹽結石，此為正確答案。","tetracycline是抗生素，不預防尿石症，錯誤。","降低鹽的含量會減少飲水，反而增加尿液濃度，不利預防尿石，錯誤。","增加磷的比例會使尿液磷濃度更高，反而更容易形成磷酸鹽結石，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_029","year":2016,"roc_year":105,"session":"","examNo":29,"q":"下列何種羊隻的臨床症狀和Mycoplasma的感染較無關聯？","opts":["A. 下痢","B. 關節炎","C. 肺炎","D. 乳房炎"],"ans":0,"exp":"Mycoplasma在羊的相關疾病：Mycoplasma ovipneumoniae引起羊肺炎（傳染性肺炎）；Mycoplasma agalactiae引起傳染性無乳症（乳房炎）；Mycoplasma capricolum引起多發性關節炎。下痢（diarrhea）不是Mycoplasma感染羊隻的主要臨床表現，與Mycoplasma感染較無關聯。","we":["下痢與Mycoplasma感染較無關聯，此為正確答案。","關節炎（Mycoplasma引起多發性漿液性關節炎）與Mycoplasma有關，非答案。","肺炎（Mycoplasma ovipneumoniae）與Mycoplasma有關，非答案。","乳房炎（傳染性無乳症，Mycoplasma agalactiae）與Mycoplasma有關，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_030","year":2016,"roc_year":105,"session":"","examNo":30,"q":"獸醫師建議羊場飼料中鈣磷比例調為2：1，並添加食鹽至4%、維生素A或氯化銨，其最主要\r    之目的在預防何種疾病？","opts":["A. 尿道結石","B. 瘤胃臌脹","C. 瘤胃食滯","D. 佝僂病"],"ans":0,"exp":"飼料調整（鈣磷比2:1 + 食鹽4% + 維生素A或氯化銨）是預防羊尿道結石（urolithiasis）的綜合措施：氯化銨酸化尿液、食鹽增加飲水量（稀釋尿液）、維生素A維持尿道黏膜完整性、調整鈣磷比降低磷酸鹽結石的風險。","we":["這些飼料調整措施主要針對尿道結石的預防，此為正確答案。","瘤胃臌脹的預防主要靠限制豆科植物和添加消泡劑，與這些措施無關，錯誤。","瘤胃食滯的預防靠提供適量粗料，與這些措施無關，錯誤。","佝僂病的預防靠維生素D和適當鈣磷供應，與這些措施無關，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_031","year":2016,"roc_year":105,"session":"","examNo":31,"q":"臍赫尼亞（umbilical hernia）最常見於下列何種動物？","opts":["A. 豬","B. 馬","C. 犬","D. 山羊"],"ans":0,"exp":"臍疝（umbilical hernia）在所有家畜中均可見，但在豬（pig）的發生率最高。豬臍疝常有遺傳性因素，在育肥豬群中發生率可達2-5%，是豬場常見的先天性異常。","we":["豬（pig）的臍疝發生率在家畜中最高，此為正確答案。","馬也有臍疝，但發生率不如豬高，錯誤。","犬也有臍疝（尤其小型品種），但家畜中以豬最多見，錯誤。","山羊臍疝存在但不是最常見的家畜，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_032","year":2016,"roc_year":105,"session":"","examNo":32,"q":"前列腺素F2α（PGF2α）可引起母畜卵巢上黃體退化，PGF2α主要是由下列何項分泌？","opts":["A. 子宮肌肉層","B. 子宮內膜層","C. 卵巢實質層","D. 卵巢皮層"],"ans":1,"exp":"前列腺素F2α（PGF2α）主要由子宮內膜（uterine endometrium）分泌。在非懷孕期，子宮內膜在動情素作用下合成並分泌PGF2α，PGF2α透過局部逆流機制（countercurrent mechanism）進入卵巢血液循環，作用於黃體使其退化（luteolysis），重新啟動發情週期。","we":["子宮肌肉層（myometrium）不是PGF2α的主要分泌來源，錯誤。","子宮內膜層（endometrium）是PGF2α的主要分泌來源，此為正確答案。","卵巢實質層不是PGF2α的分泌來源，錯誤。","卵巢皮層不是PGF2α的分泌來源，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_033","year":2016,"roc_year":105,"session":"","examNo":33,"q":"經產牛正常分娩第三期陣痛（labour）主要特徵為","opts":["A. 外陰部擴張","B. 子宮頸擴張","C. 胎兒娩出","D. 胎盤排出"],"ans":3,"exp":"分娩分三期：第一期（preparatory stage）→子宮頸擴張（cervical dilation）；第二期（expulsive stage）→胎兒娩出（fetal delivery）；第三期（placental stage）→胎盤排出（placental expulsion）。第三期陣痛的主要特徵是胎盤（包含胎衣/afterbirth）的排出。","we":["外陰部擴張在分娩前期就開始，不是第三期的主要特徵，錯誤。","子宮頸擴張是第一期的主要特徵，不是第三期，錯誤。","胎兒娩出是第二期的主要特徵，不是第三期，錯誤。","胎盤排出是第三期（第三產程）的主要特徵，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_034","year":2016,"roc_year":105,"session":"","examNo":34,"q":"牛長期在胎（prolonged gestation）發生原因，以下敘述何者錯誤？","opts":["A. 動情素分泌不足","B. prostaglandin分泌不足","C. 胎兒腦下垂體後葉機能異常","D. 與難產發生有關"],"ans":2,"exp":"牛長期在胎（prolonged gestation）的原因：動情素分泌不足（無法啟動分娩）、前列腺素分泌不足、胎兒腦下垂體前葉（anterior pituitary）機能異常（ACTH不足→皮質醇不足→無法啟動分娩）、與難產有關。「胎兒腦下垂體後葉（posterior pituitary）機能異常」是錯誤的，後葉分泌oxytocin是分娩發動後的效應器，不是啟動分娩的關鍵。","we":["動情素分泌不足影響分娩啟動，是長期在胎的原因，正確，非答案。","prostaglandin分泌不足影響黃體退化和子宮收縮，是長期在胎的原因，正確，非答案。","胎兒腦下垂體後葉機能異常描述錯誤（應是前葉/ACTH），此為正確答案（錯誤描述）。","長期在胎因胎兒過大或異常，確實與難產相關，正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_035","year":2016,"roc_year":105,"session":"","examNo":35,"q":"牛鈍性發情，下列敘述何項錯誤？","opts":["A. 有正常濾泡發育","B. 無排卵發生","C. 黃體形成","D. 卵巢疾病中的比率較高"],"ans":1,"exp":"鈍性發情（silent estrus/quiet heat）：動物有正常的濾泡發育、排卵和黃體形成，但外部發情行為不明顯（安靜發情）。「無排卵發生」是錯誤描述——鈍性發情確實有排卵，只是行為症狀不明顯，與排卵失敗（anovulation）不同。","we":["有正常濾泡發育是鈍性發情的特徵（濾泡正常發育但無明顯行為），正確，非答案。","無排卵發生是錯誤描述（鈍性發情確實有排卵），此為正確答案（錯誤描述）。","黃體形成在排卵後正常發生，鈍性發情後有黃體，正確，非答案。","鈍性發情在高產乳牛中比率較高，正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_036","year":2016,"roc_year":105,"session":"","examNo":36,"q":"關於懷孕母牛發生子宮捻轉的敘述，下列何項錯誤？","opts":["A. 通常發生在第一期陣痛（first stage of labour）期間","B. 發生率通常在6％左右","C. 胎兒體重愈重愈好發","D. 好發於懷雙胞胎母牛"],"ans":3,"exp":"懷孕母牛子宮捻轉（uterine torsion）的特點：通常發生在第一期陣痛（first stage of labour）期間；牛的發生率約6%；胎兒體重越重越容易誘發（重胎兒作為鐘擺引發捻轉）；好發於懷「單胎」而非雙胞胎（雙胎重量分布均衡，反而不易捻轉）。","we":["通常發生在第一期陣痛期間，正確，非答案。","發生率約6%是教科書常見數據，正確，非答案。","胎兒體重愈重愈好發（重胎兒作為鐘擺），正確，非答案。","「好發於懷雙胞胎母牛」是錯誤的（應好發於單胎），此為正確答案（錯誤描述）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_037","year":2016,"roc_year":105,"session":"","examNo":37,"q":"乳牛初期之子宮蓄膿（前者）與正常懷孕三個月（後者）之直腸檢查，下列何項診斷的敘述\r   錯誤？","opts":["A. 前者之子宮壁常較後者厚","B. 無法觸摸到前者子宮壁之宮阜","C. 前者無尿囊絨毛膜滑落感（slipping of allantochorion）","D. 前者之子宮壁常較後者具彈性"],"ans":1,"exp":"乳牛子宮蓄膿（pyometra）vs 懷孕3個月直腸檢查鑑別：子宮蓄膿時，卵巢有黃體（progesterone維持子宮）；子宮壁增厚、液體充填；宮阜（caruncles）仍可觸摸（但不如懷孕時增大明顯）。「無法觸摸到前者（子宮蓄膿）子宮壁之宮阜」是錯誤的——宮阜在子宮蓄膿時仍可觸摸到。","we":["子宮蓄膿的子宮壁因炎症反應常較懷孕3個月厚，正確，非答案。","「無法觸摸到子宮蓄膿的宮阜」是錯誤的（宮阜在蓄膿時仍可觸及），此為正確答案（錯誤描述）。","子宮蓄膿沒有尿囊絨毛膜（allantochorion），無滑落感，正確，非答案。","子宮蓄膿的子宮壁比懷孕3個月更具彈性（充液但無羊水的張力），此描述有一定爭議，但B更明顯錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_038","year":2016,"roc_year":105,"session":"","examNo":38,"q":"下列何者並非動物分娩前的主要癥候？","opts":["A. 母馬腹脇部盜汗","B. 母馬乳頭有蠟樣物質出現","C. 母牛的尾根部舉高","D. 母羊的外陰部潮紅"],"ans":0,"exp":"動物分娩前的主要徵候：母馬乳頭出現蠟狀分泌物（waxing，分娩前24-48小時）是分娩前的重要徵候；母牛尾根部舉高（因骨盆韌帶鬆弛）；母羊外陰部潮紅腫脹。「母馬腹脇部盜汗」是馬疝痛（colic）的症狀，不是分娩前主要徵候。","we":["母馬腹脇部盜汗是疝痛的症狀，不是分娩前主要徵候，此為正確答案。","母馬乳頭蠟樣物質（waxing）是分娩前重要徵候，是主要徵候，非答案。","母牛尾根部舉高（骨盆韌帶鬆弛）是分娩前主要徵候，非答案。","母羊外陰部潮紅是分娩前主要徵候，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_039","year":2016,"roc_year":105,"session":"","examNo":39,"q":"乳牛產後（10天內）造成子宮炎發生的病原菌通常為單一種或兩種以上合併感染，但臨床上\r   分離率最高者為下列那一種細菌？","opts":["A. Corynebacterium bovis","B. Staphylococcus aureus","C. Arcanobacterium pyogenes","D. Streptococcus bovis"],"ans":2,"exp":"乳牛產後10天內子宮炎（metritis）分離率最高的病原菌是Arcanobacterium pyogenes（現稱Trueperella pyogenes）。此菌是牛產後子宮感染的主要病原，常與大腸桿菌（E. coli）合併感染，引起化膿性子宮炎，分泌惡臭膿液。","we":["Corynebacterium bovis主要引起乳房炎，不是子宮炎的主要病原，錯誤。","Staphylococcus aureus在乳房炎中常見，不是牛子宮炎分離率最高的病原，錯誤。","Arcanobacterium pyogenes（Trueperella pyogenes）是牛產後子宮炎最常分離到的病原，此為正確答案。","Streptococcus bovis主要引起瘤胃過酸症相關疾病和乳房炎，不是子宮炎的主要病原，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_040","year":2016,"roc_year":105,"session":"","examNo":40,"q":"關於導致動物難產原因的敘述下列何項錯誤？","opts":["A. 犬貓最常見子宮無力症（uterine inertia）","B. 牛最常見子宮無力症（uterine inertia）","C. 馬最常見胎位不正（faulty fetal disposition）","D. 豬最常見子宮無力症（uterine inertia）"],"ans":1,"exp":"各動物難產最常見原因：犬貓最常見子宮無力症（uterine inertia）；馬最常見胎位不正（faulty fetal disposition）；豬最常見子宮無力症。牛難產最常見原因是胎位不正（fetal malpresentation）和/或胎兒過大（fetomaternal disproportion），不是子宮無力症。「牛最常見子宮無力症」是錯誤描述。","we":["犬貓最常見子宮無力症，正確，非答案。","牛最常見難產原因是胎位不正，不是子宮無力症，此為正確答案（錯誤描述）。","馬最常見胎位不正，正確，非答案。","豬最常見子宮無力症（多胎耗盡），正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_041","year":2016,"roc_year":105,"session":"","examNo":41,"q":"反芻動物分娩時，那項內泌素（hormones）最先大量釋出以啟動分娩機制？","opts":["A. 胎兒腎上腺皮質醇（fetal adrenal corticosteroids）","B. 助孕酮（progesterone）","C. 動情素（estrogens）","D. 催產素（oxytocin）"],"ans":0,"exp":"反芻動物分娩機制啟動：最先由「胎兒腎上腺皮質醇（fetal adrenal corticosteroids）」大量分泌開始→促進胎盤17α-羥化酶表達→孕酮（progesterone）轉化為動情素（estrogens）→動情素升高→子宮PGF2α增加→黃體退化→孕酮降低→子宮收縮→分娩。","we":["胎兒腎上腺皮質醇是反芻動物分娩啟動的最初觸發因子，此為正確答案。","助孕酮（progesterone）在分娩時降低（而非升高），不是最先釋出的啟動激素，錯誤。","動情素（estrogens）在皮質醇之後才升高，不是最先釋出的，錯誤。","催產素（oxytocin）在分娩最後階段才大量釋出（Ferguson reflex），不是最先的，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_042","year":2016,"roc_year":105,"session":"","examNo":42,"q":"水腫胎（anasarka）在下列何種動物有最高的發生率？","opts":["A. 馬","B. 犬","C. 牛","D. 貓"],"ans":2,"exp":"水腫胎（anasarka/hydrops fetalis）在牛（bovine）中發生率最高。牛的水腫胎（尤其是羊水過多/hydroallantois）有遺傳因素，在部分品種（如Dexter牛的「bulldog calf」）有基因突變基礎。水腫胎在牛中是較常見的繁殖問題。","we":["馬也有水腫胎，但發生率不如牛高，錯誤。","犬的水腫胎較少見，錯誤。","牛的水腫胎發生率在家畜中最高，此為正確答案。","貓的水腫胎非常罕見，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_043","year":2016,"roc_year":105,"session":"","examNo":43,"q":"患犬呈現運動不耐、虛弱、呼吸急促等症狀，並由超音波發現心包囊積液。此心囊填塞\r   （cardiac tamponade）的病例應立即做何種處置？","opts":["A. 注射強心劑","B. 注射利尿劑","C. 口服血管擴張劑","D. 心包囊穿刺術（pericardiocentesis）"],"ans":3,"exp":"心囊填塞（cardiac tamponade）是心包積液壓迫心臟，使心臟充填受限，心輸出量急劇下降的緊急狀況。立即治療是心包囊穿刺術（pericardiocentesis），排出積液以解除對心臟的壓迫，恢復心輸出量。","we":["注射強心劑對心包填塞效果有限（根本問題是心包積液壓迫），不是立即處置，錯誤。","注射利尿劑在心包填塞時反而可能加重前負荷不足，不適合，錯誤。","口服血管擴張劑在心包填塞中不適合且緩不濟急，錯誤。","心包囊穿刺術（pericardiocentesis）是心囊填塞的緊急治療，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_044","year":2016,"roc_year":105,"session":"","examNo":44,"q":"罹患右主動脈弓永存（persistent right aortic arch，PRAA）的病畜，臨床上主要出現的症狀\r    為何 ？","opts":["A. 咳嗽","B. 暈厥","C. 腹水","D. 食道逆流"],"ans":3,"exp":"右主動脈弓永存（Persistent Right Aortic Arch, PRAA）是一種先天性血管畸形，右主動脈弓和動脈韌帶（ligamentum arteriosum）形成一個血管環（vascular ring），壓迫食道（位於血管環中），造成食道在心臟水平處阻塞。主要臨床症狀是餵食後食道逆流（regurgitation），幼犬在斷奶後開始餵固體食物時發現。","we":["咳嗽不是PRAA的主要症狀（食道問題，不是呼吸道），錯誤。","暈厥與PRAA無關，錯誤。","腹水不是PRAA的主要症狀，錯誤。","食道逆流（因血管環壓迫食道）是PRAA的主要臨床症狀，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_045","year":2016,"roc_year":105,"session":"","examNo":45,"q":"下列選項中，最常造成貓巨結腸症的病因為何？","opts":["A. idiopathic","B. obstructive","C. neurologic","D. environmental factors"],"ans":0,"exp":"貓巨結腸症（feline megacolon）的病因分類：特發性（idiopathic，約62%）是最常見原因，病因不明但可能與結腸平滑肌功能障礙有關；阻塞性（obstructive，約23%）次之；神經性（neurologic）和環境因素較少見。","we":["特發性（idiopathic）是貓巨結腸症最常見的病因（約62%），此為正確答案。","阻塞性（obstructive）是第二常見病因，但不是最常見，錯誤。","神經性（neurologic）原因（如脊髓損傷）較少見，不是最常見，錯誤。","環境因素（environmental）是誘因，不是主要病因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_046","year":2016,"roc_year":105,"session":"","examNo":46,"q":"皮膚表面出現乾性皮屑（dry scaly coat）、軀幹雙側對稱非搔癢性脫毛、老鼠尾（rat tail）\r    及頸腹側、腹部、軀幹呈不同程度黑色素沉著的現象，應懷疑那種疾病？","opts":["A. 毛囊蟲感染症","B. 高腎上腺皮質類固醇症","C. 低甲狀腺素症","D. 維生素E缺乏症"],"ans":2,"exp":"犬皮膚呈現雙側對稱非搔癢性脫毛、老鼠尾（rat tail，尾根部毛稀少）、軀幹毛稀少、頸腹側/腹部/軀幹黑色素沉著、乾性皮屑是甲狀腺功能低下（hypothyroidism）的典型皮膚表現。甲狀腺素（T4）不足影響毛囊週期，出現對稱性脫毛。","we":["毛囊蟲感染症（demodicosis）引起搔癢和局部或全身性脫毛，但通常伴炎症，不是雙側對稱非搔癢的特徵，錯誤。","高腎上腺皮質類固醇症（Cushing）引起脫毛，但伴有腹部膨大、多飲多尿等系統症狀，錯誤。","低甲狀腺素症（hypothyroidism）的典型症狀包括雙側對稱非搔癢性脫毛、老鼠尾、黑色素沉著，此為正確答案。","維生素E缺乏症不引起這種特定的脫毛模式，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_047","year":2016,"roc_year":105,"session":"","examNo":47,"q":"以下何項病變不屬於法洛氏四重畸形（tetralogy of Fallot，TF）？","opts":["A. 主動脈偏向右側","B. 主動脈口狹窄","C. 主動脈口下的心室間中膈缺損","D. 繼發的右心室肥大"],"ans":1,"exp":"法洛氏四重畸形（Tetralogy of Fallot, TOF）的四項病變：①肺動脈口狹窄（pulmonic stenosis）；②心室間中膈缺損（VSD）；③主動脈偏向右側（overriding/dextroposition of aorta）；④繼發性右心室肥大（right ventricular hypertrophy）。「主動脈口狹窄（aortic stenosis）」不是TOF的組成，而是獨立的先天性心臟病。","we":["主動脈偏向右側（overriding aorta）是TOF的四項病變之一，正確，非答案。","主動脈口狹窄（aortic stenosis）不是TOF的病變（TOF有肺動脈口狹窄，非主動脈口狹窄），此為正確答案。","主動脈口下的心室間中膈缺損（perimembranous VSD）是TOF的病變，正確，非答案。","繼發的右心室肥大是TOF的四項病變之一，正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_048","year":2016,"roc_year":105,"session":"","examNo":48,"q":"複選題 48. 狗因為咳嗽而經由X光檢查發現肺水腫時，常併發下列何症狀？","opts":["A. 右心擴大","B. 左心擴大","C. 主動脈擴大","D. 後腔靜脈擴大"],"ans":1,"exp":"狗因肺水腫就醫並做X光，肺水腫最常見於左心衰竭（left-sided heart failure）。左心衰竭使肺靜脈壓升高→肺泡積液（肺水腫）。因此X光常見左心（尤其左心室/左心房）擴大，而非右心或主動脈擴大。","we":["右心擴大見於右心衰竭，不是肺水腫的主要伴隨，錯誤。","左心擴大（尤其左心室/左心房）是肺水腫（左心衰竭）的典型X光表現，此為正確答案。","主動脈擴大不是肺水腫的常見伴隨X光異常，錯誤。","後腔靜脈擴大見於右心衰竭，不是左心衰竭/肺水腫的主要表現，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_049","year":2016,"roc_year":105,"session":"","examNo":49,"q":"罹患肺動脈口狹窄（pulmonic stenosis，PS）的犬或貓，隨著病程發展通常會先出現","opts":["A. 左心室肥大","B. 右心室肥大","C. 左心房擴張","D. 右心房擴張"],"ans":1,"exp":"肺動脈口狹窄（Pulmonic Stenosis, PS）時，右心室需對抗更高的後負荷才能將血液推過狹窄的肺動脈瓣。右心室因長期承受壓力超負荷而發生代償性肥大（right ventricular hypertrophy, RVH），這是PS最早且最特徵性的繼發性心臟變化。","we":["左心室肥大與右心流出道阻塞無關，錯誤。","右心室肥大是肺動脈口狹窄最先出現的代償性改變，此為正確答案。","左心房擴張見於二尖瓣疾病（左心衰竭），與PS無關，錯誤。","右心房擴張在右心衰竭晚期出現，不是最先出現的，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_050","year":2016,"roc_year":105,"session":"","examNo":50,"q":"犬貓血鈉值要超過多少時（臨界值）才會出現臨床症狀？","opts":["A. 160 mEq/L","B. 170 mEq/L","C. 180 mEq/L","D. 190 mEq/L"],"ans":0,"exp":"犬貓高血鈉症（hypernatremia）臨床症狀出現的臨界值約在160 mEq/L。正常犬血鈉約138-155 mEq/L；當血鈉>160 mEq/L時，神經症狀（方向感喪失、抑鬱、癲癇、昏迷）開始出現，這是因為細胞外高滲透壓導致腦細胞脫水。","we":["160 mEq/L是犬貓高血鈉出現臨床症狀的臨界值，此為正確答案。","170 mEq/L已是嚴重高血鈉，症狀早在160時就已出現，此選項過高，錯誤。","180 mEq/L更是極度高血鈉，臨界值應更低，錯誤。","190 mEq/L是生命威脅數值，不是臨界值，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_051","year":2016,"roc_year":105,"session":"","examNo":51,"q":"犬喉頭麻痺（larynx paralysis）的內視鏡檢查，可見到下列何種異常現象？","opts":["A. 杓狀軟骨（arytenoid cartilages）和聲門在呼氣時關閉","B. 杓狀軟骨（arytenoid cartilages）和聲門在吸氣時關閉","C. 會厭軟骨（epiglottis）和聲門在吸氣時關閉","D. 會厭軟骨（epiglottis）和聲門在呼氣時關閉"],"ans":1,"exp":"犬喉頭麻痺（laryngeal paralysis）主要是喉返神經（recurrent laryngeal nerve）損傷導致杓狀軟骨（arytenoid cartilage）及聲門（glottis）無法在吸氣時正常外展，反而向內塌陷（關閉），造成上呼吸道吸氣性阻塞（inspiratory dyspnea）和吸氣性喘鳴（stridor）。","we":["杓狀軟骨在吸氣時正常應外展（開放），不應關閉；若呼氣時關閉不符合喉頭麻痺特徵，錯誤。","杓狀軟骨在吸氣時無法外展而關閉是喉頭麻痺的內視鏡特徵，此為正確答案。","會厭軟骨（epiglottis）在喉頭麻痺時不是主要問題，錯誤。","會厭軟骨在呼氣時關閉不是喉頭麻痺的描述，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_052","year":2016,"roc_year":105,"session":"","examNo":52,"q":"下列何項不是犬貓慢性腎病飲食調控的重點？","opts":["A. 限制攝取不飽和脂肪酸","B. 限制磷的攝取","C. 限制蛋白的攝取","D. 調控鈉鹽的攝取"],"ans":0,"exp":"犬貓慢性腎病（CKD）飲食調控重點：①限制磷（降低腎性骨病和礦化）；②限制蛋白（減少氮廢物產生）；③調控鈉鹽（控制血壓）。Omega-3不飽和脂肪酸（n-3 PUFA）對腎病有保護作用（抗發炎、降低腎小球高壓），應增加而非限制。「限制攝取不飽和脂肪酸」不是CKD飲食調控的重點。","we":["限制不飽和脂肪酸不是CKD飲食調控的重點（Omega-3應增加），此為正確答案。","限制磷是CKD飲食調控的重要項目，正確，非答案。","限制蛋白質（限制氮廢物）是CKD飲食調控的重要項目，正確，非答案。","調控鈉鹽（控制高血壓）是CKD飲食調控的重要項目，正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_053","year":2016,"roc_year":105,"session":"","examNo":53,"q":"視診見黏膜蒼白可懷疑為下列何項？","opts":["A. 紅血球增多症（polycythemia）","B. 心輸出量不足","C. 敗血症","D. 肺組織疾病"],"ans":1,"exp":"黏膜蒼白（pale mucous membranes）的主要原因：貧血（減少血紅素攜氧量）或心輸出量不足（末梢血管收縮，末梢灌流不足）。心輸出量不足（如休克、心臟衰竭）時，外周血管代償性收縮→皮膚和黏膜血流減少→黏膜蒼白，是黏膜蒼白的重要原因。","we":["紅血球增多症（polycythemia）引起黏膜變暗紅（磚紅色），不是蒼白，錯誤。","心輸出量不足（心源性休克或低血壓性休克）引起末梢血管收縮和黏膜蒼白，此為正確答案。","敗血症（septicemia）引起黏膜充血或充血性蒼白（微循環障礙），但不是黏膜蒼白的最典型解釋，此選項不如B準確。","肺組織疾病引起發紺（cyanosis，黏膜發紫），不是蒼白，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_054","year":2016,"roc_year":105,"session":"","examNo":54,"q":"下列何項不是犬心絲蟲感染的直接症狀或結果？","opts":["A. 三尖瓣閉鎖不全","B. 二尖瓣閉鎖不全","C. 肝臟腫大","D. 腹水產生"],"ans":1,"exp":"犬心絲蟲（Dirofilaria immitis）主要寄生於右心房、右心室和肺動脈。直接後果包括：三尖瓣閉鎖不全（蟲體機械性干擾）、右心衰竭→肝靜脈鬱血→肝腫大→腹水。二尖瓣（mitral valve）位於左心，心絲蟲不會直接影響，二尖瓣閉鎖不全不是心絲蟲的直接結果。","we":["三尖瓣閉鎖不全因心絲蟲直接機械性干擾三尖瓣，是直接結果，非答案。","二尖瓣閉鎖不全不是心絲蟲的直接結果（蟲在右心），此為正確答案。","肝臟腫大因右心衰竭→靜脈鬱血，是心絲蟲的直接結果，非答案。","腹水因右心衰竭→靜脈高壓，是心絲蟲的直接結果，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_055","year":2016,"roc_year":105,"session":"","examNo":55,"q":"犬肺循環衰竭及鬱血性心衰竭最常見的疾病為下列何項？","opts":["A. 二尖瓣閉鎖不全","B. 主動脈瓣狹窄","C. 肺動脈瓣狹窄","D. 開放性動脈導管"],"ans":0,"exp":"犬最常見的引起肺循環衰竭和鬱血性心衰竭（CHF）的疾病是二尖瓣閉鎖不全（mitral valve insufficiency/regurgitation, MVR）。犬（尤其中老年小型犬）最常見的心臟病是二尖瓣黏液樣變性病（MMVD），引起二尖瓣閉鎖不全和左心衰竭（肺循環鬱血）。","we":["二尖瓣閉鎖不全是犬最常見的後天性心臟病和CHF原因，此為正確答案。","主動脈瓣狹窄（AS）也可引起心臟問題，但不如MVR常見，錯誤。","肺動脈瓣狹窄（PS）引起右心問題，不是肺循環衰竭/CHF的最常見原因，錯誤。","開放性動脈導管（PDA）是先天性心臟病，不是引起CHF最常見的後天性疾病，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_056","year":2016,"roc_year":105,"session":"","examNo":56,"q":"下列何項輸血併發症與免疫機制無關？","opts":["A. 蕁麻疹","B. 低血鈣症","C. 溶血","D. 發燒"],"ans":1,"exp":"輸血免疫性併發症：溶血反應（抗原抗體反應破壞RBC）、蕁麻疹（IgE介導過敏反應）、發燒（非溶血性輸血反應，WBC或細胞激素介導）均為免疫機制相關。低血鈣症（hypocalcemia）是輸血的「代謝性」副作用——血液保存液中的枸椽酸（citrate）螯合血鈣，大量輸血時引起低血鈣，與免疫機制無關。","we":["蕁麻疹是IgE介導的過敏反應（免疫機制），非答案。","低血鈣症（枸椽酸螯合）是非免疫性代謝副作用，此為正確答案。","溶血（血型不合的抗原抗體反應）是免疫機制，非答案。","發燒（非溶血性輸血反應，cytokine介導）是免疫機制，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_057","year":2016,"roc_year":105,"session":"","examNo":57,"q":"下列何項腫瘤，最易引起犬胃酸分泌過多，導致胃和十二指腸潰瘍？","opts":["A. 平滑肌瘤和惡性纖維瘤","B. 胃惡性腺瘤和胃惡性平滑肌瘤","C. 惡性淋巴瘤和扁平細胞瘤","D. 肥胖細胞瘤和胃素瘤（gastrinoma）"],"ans":3,"exp":"引起犬胃酸過多→胃十二指腸潰瘍的腫瘤：肥胖細胞瘤（mast cell tumor, MCT）釋放組織胺（histamine）→刺激H2受體→胃酸大量分泌；胃素瘤（gastrinoma/Zollinger-Ellison syndrome）分泌大量胃泌素（gastrin）→持續刺激壁細胞→胃酸過多。這兩種腫瘤是最易引起胃酸過多和消化性潰瘍的腫瘤。","we":["平滑肌瘤和惡性纖維瘤不以胃酸過多為特徵，錯誤。","胃惡性腺瘤和平滑肌瘤不以胃酸分泌為主要機制，錯誤。","惡性淋巴瘤和扁平細胞瘤不以胃酸過多為特徵，錯誤。","肥胖細胞瘤（組織胺→胃酸）和胃素瘤（gastrin→胃酸）是最易引起胃酸過多的腫瘤，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_058","year":2016,"roc_year":105,"session":"","examNo":58,"q":"下列何項最易引起犬食慾異常增加？","opts":["A. 急性胃炎","B. 高甲狀腺功能症","C. 慢性肝炎","D. 低腎上腺皮質功能症"],"ans":1,"exp":"犬食慾異常增加（多食/polyphagia）的原因：高甲狀腺功能症（hyperthyroidism）使基礎代謝率升高，能量消耗增加→食慾大增（多食）同時體重減輕。這與低甲狀腺功能症（食慾減退）相反。（犬的甲亢較少見，但在老年犬可能發生）","we":["急性胃炎通常引起食慾減退（anorexia），不是食慾增加，錯誤。","高甲狀腺功能症（hyperthyroidism）使代謝率升高，引起食慾異常增加，此為正確答案。","慢性肝炎通常引起食慾減退或正常，不是食慾增加的主因，錯誤。","低腎上腺皮質功能症（Addison's disease）引起食慾減退、嘔吐，不是食慾增加，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_059","year":2016,"roc_year":105,"session":"","examNo":59,"q":"確診犬胰外泌素不全症，主要可以做下列何項實驗室診斷？","opts":["A. trypsin-like immunoreactivity","B. pancreatic lipase immunoreactivity","C. BUN及Creatinine","D. ALT、AST及ALKP"],"ans":0,"exp":"犬胰外泌素不全症（Exocrine Pancreatic Insufficiency, EPI）確診的主要實驗室指標：血清胰蛋白酶樣免疫反應性（Serum Trypsin-Like Immunoreactivity, TLI）是診斷EPI的金標準。EPI時血清TLI極低（<2.5 μg/L），且此測試高度特異，是目前最可靠的EPI確診方法。","we":["血清TLI（trypsin-like immunoreactivity）是EPI診斷的金標準，此為正確答案。","Pancreatic lipase immunoreactivity（PLI）主要用於診斷胰腺炎，不是EPI的主要診斷指標，錯誤。","BUN及Creatinine是腎功能指標，不是EPI的診斷指標，錯誤。","ALT、AST及ALKP是肝功能指標，不是EPI的診斷指標，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_060","year":2016,"roc_year":105,"session":"","examNo":60,"q":"一隻5公斤成犬，脫水約8％，其24小時的嘔吐物和下痢便總計約為100mL，其一天的輸液量\r   約為多少mL？","opts":["A. 300","B. 800","C. 1,500","D. 2,000"],"ans":1,"exp":"5公斤犬，脫水8%，持續損失100 mL/天：①維持量（maintenance）：5 kg × 60 mL/kg/day = 300 mL；②脫水量（deficit）：5 kg × 8% = 0.4 L = 400 mL（24小時補充）；③持續損失（ongoing losses）：100 mL。一天總輸液量 = 300 + 400 + 100 = 800 mL。","we":["300 mL只等於維持量，沒有計入脫水量和持續損失，嚴重不足，錯誤。","800 mL = 維持量(300) + 脫水量(400) + 持續損失(100)，計算正確，此為正確答案。","1,500 mL過高，超出實際需要，錯誤。","2,000 mL嚴重過量，可能引起過度水合，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_061","year":2016,"roc_year":105,"session":"","examNo":61,"q":"下列何項不是犬高腎上腺功能症最常見的併發症？","opts":["A. pulmonary thromboembolism","B. diabetes mellitus","C. pancreatitis","D. tubular nephropathy"],"ans":3,"exp":"犬高腎上腺皮質功能症（Hyperadrenocorticism, HAC/Cushing's disease）常見併發症：①肺栓塞（pulmonary thromboembolism，因高凝狀態）；②糖尿病（diabetes mellitus，皮質醇拮抗胰島素）；③胰腺炎（pancreatitis，因高脂血症）均常見。腎小管腎病（tubular nephropathy）不是HAC的常見直接併發症，HAC影響腎臟主要是多尿/多渴（concentrating ability下降）。","we":["肺栓塞是HAC的重要常見併發症（因凝血亢進），非答案。","糖尿病是HAC的常見併發症（皮質醇拮抗胰島素），非答案。","胰腺炎是HAC的常見併發症（高脂血症），非答案。","腎小管腎病不是HAC的常見直接併發症，此為正確答案（不是最常見併發症）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_062","year":2016,"roc_year":105,"session":"","examNo":62,"q":"慢性腎病時，下列何項不是造成貧血的主因？","opts":["A. 缺乏紅血球生成素而造成非再生性貧血","B. 氮血症造成紅血球壽命減短","C. 腸胃道潰瘍導致的失血","D. 誘發免疫反應造成溶血性貧血"],"ans":3,"exp":"慢性腎病（CKD）貧血的主因：①EPO缺乏→非再生性貧血（最主要）；②尿毒症毒素→紅血球壽命減短；③腸胃道潰瘍（尿毒症引起）→失血。免疫介導溶血性貧血（IMHA）是自身免疫性疾病，不是CKD的直接後果，與CKD的關聯性最弱，不是CKD貧血的主因。","we":["EPO缺乏→非再生性貧血是CKD貧血的最主要原因，正確，非答案。","氮血症（尿毒症毒素）縮短RBC壽命，是CKD貧血的原因之一，正確，非答案。","腸胃道潰瘍（尿毒症性）導致失血，是CKD貧血的原因之一，正確，非答案。","免疫介導溶血性貧血不是CKD的直接病理後果，此為正確答案（不是主因）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_063","year":2016,"roc_year":105,"session":"","examNo":63,"q":"The International Renal Interest Society（IRIS）對慢性腎病的分期，下列何項不是分期評\r   估的項目？","opts":["A. 血清 BUN","B. 血清 creatinine","C. urine protein/creatinine ratio","D. 血壓"],"ans":0,"exp":"IRIS（International Renal Interest Society）慢性腎病分期依據：主要以「血清creatinine」（或SDMA）進行分期（Stage 1-4）；次要亞分類包括「尿蛋白/肌酐比值（UP/C）」和「血壓（blood pressure）」。「血清BUN」不是IRIS分期的評估指標，因為BUN受飲食蛋白質攝取量、肌肉代謝等因素影響，特異性不如creatinine。","we":["血清BUN不是IRIS分期的主要評估指標（受飲食影響大），此為正確答案。","血清creatinine是IRIS分期的核心指標（主要分期依據），正確，非答案。","尿蛋白/肌酐比值（UP/C）是IRIS分期的次要評估指標，正確，非答案。","血壓是IRIS分期的次要評估指標（高血壓亞分類），正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_064","year":2016,"roc_year":105,"session":"","examNo":64,"q":"貓下列何項疾病有抗體依賴性促進作用（antibody dependent enhancement），故不建議以\r       施打疫苗來預防？","opts":["A. 貓白血病","B. 貓傳染性腹膜炎","C. 貓愛滋病","D. 貓卡里西病"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）由貓冠狀病毒（FCoV）突變引起，疫苗誘發的抗體可通過「抗體依賴性促進作用（antibody-dependent enhancement, ADE）」機制，促使更多病毒進入巨噬細胞，反而加重病情。因此不建議以疫苗來預防FIP（目前ADE爭議仍存在，但這是國考常考的概念）。","we":["貓白血病（FeLV）有有效疫苗且不涉及ADE，建議施打，錯誤。","貓傳染性腹膜炎（FIP）因ADE機制，不建議疫苗預防，此為正確答案。","貓愛滋病（FIV）雖有疫苗（部分地區），但主要是管理性預防，且ADE不如FIP典型，此選項不如B準確。","貓卡里西病（FCV）疫苗有效，建議施打，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_065","year":2016,"roc_year":105,"session":"","examNo":65,"q":"貓免疫不全病毒（feline immunodeficiency virus）感染的併發症不包括下列何項？","opts":["A. 慢性口炎（chronic stomatitis）","B. 貧血（anemia）","C. 葡萄膜炎（uveitis）","D. 纖維乳突瘤（fibropapilloma）"],"ans":3,"exp":"貓免疫不全病毒（FIV）感染的常見併發症：慢性口炎/牙周病（最常見）、貧血（骨髓抑制）、葡萄膜炎（uveitis）、免疫功能抑制後繼發各種感染。纖維乳突瘤（fibropapilloma）是一種腫瘤性病變，與FeLV（貓白血病病毒）相關，不是FIV的典型併發症。","we":["慢性口炎是FIV感染最常見的口腔病變，正確，非答案。","貧血（免疫介導或骨髓抑制）是FIV的常見血液學異常，正確，非答案。","葡萄膜炎是FIV的眼部併發症之一，正確，非答案。","纖維乳突瘤與FIV無關（與FeLV相關），此為正確答案（不是FIV的併發症）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_066","year":2016,"roc_year":105,"session":"","examNo":66,"q":"貓因高甲狀腺功能症而引起心臟疾病時，下列何藥物是最合適的選擇？","opts":["A. atenolol","B. benazepril","C. furosemide","D. digoxin"],"ans":0,"exp":"貓高甲狀腺功能症（hyperthyroidism）引起的心臟疾病（通常為肥厚性心肌病/心搏過速）的治療：Atenolol（β1腎上腺素受體阻斷劑）可降低心率（控制心搏過速）、減低心臟收縮力（減少心肌耗氧）、降低血壓，是貓甲亢心臟病（心搏過速型）的首選藥物。","we":["atenolol（β腎上腺素阻斷劑）是貓甲亢引起心臟疾病的首選治療，此為正確答案。","benazepril（ACE抑制劑）用於治療高血壓和蛋白尿，不是甲亢心臟病的首選，錯誤。","furosemide（利尿劑）用於治療肺水腫/充血，不是甲亢心臟病的特異性治療，錯誤。","digoxin（毛地黃）用於心房纖維顫動或擴張型心肌病，貓甲亢首選是atenolol，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_067","year":2016,"roc_year":105,"session":"","examNo":67,"q":"犬貓由鼻孔和口排出淡粉紅色泡沫性液體，此犬貓最有可能罹患","opts":["A. 胃出血","B. 胃潰瘍","C. 肺水腫","D. 肺出血"],"ans":2,"exp":"犬貓由鼻孔和口排出淡粉紅色泡沫性液體（pink frothy fluid）是肺水腫（pulmonary edema）的典型表現。肺水腫時，肺泡中蓄積液體（含血漿蛋白和少量血液成分），與氣體混合形成粉紅色泡沫，從氣管→喉頭→鼻口排出。","we":["胃出血引起嘔吐血液（hematemesis），呈暗紅色或咖啡渣樣，不是泡沫性，錯誤。","胃潰瘍引起嘔血，不是從鼻孔排出泡沫液體，錯誤。","肺水腫（pink frothy fluid from nose/mouth）是最典型的描述，此為正確答案。","肺出血（pulmonary hemorrhage）引起咳血（hemoptysis），顏色較深紅，且不一定是泡沫性，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_068","year":2016,"roc_year":105,"session":"","examNo":68,"q":"犬腎病（nephrosis）之臨床特徵為","opts":["A. 多尿、劇渴、炎症性水腫、氮血症和球蛋白尿","B. 多尿、劇渴、炎症性水腫、氮血症和白蛋白尿","C. 無尿或寡尿、炎症性水腫、氮血症、白蛋白尿和高球蛋白血症","D. 無尿或寡尿、非炎症性水腫、氮血症、白蛋白尿和低白蛋白血症"],"ans":3,"exp":"犬腎病症候群（nephrosis/nephrotic syndrome）的臨床特徵：大量蛋白尿（以白蛋白尿為主）→低白蛋白血症→膠體滲透壓下降→非炎症性水腫（低滲性）；腎功能受損→氮血症；無尿或寡尿（嚴重腎功能不全時）。選項D（無尿/寡尿、非炎症性水腫、氮血症、白蛋白尿、低白蛋白血症）完整描述了腎病症候群。","we":["選項A描述不完整且含有錯誤（球蛋白尿不正確），錯誤。","選項B的描述與腎病症候群不完全吻合（寡尿/多尿混淆），錯誤。","選項C描述炎症性水腫和高球蛋白血症，不是腎病症候群（是腎炎的特徵），錯誤。","非炎症性水腫、白蛋白尿、低白蛋白血症是腎病症候群的完整特徵，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_069","year":2016,"roc_year":105,"session":"","examNo":69,"q":"犬子宮卵巢摘除術中，常會撕斷下列那一條韌帶，以利將卵巢提拉出腹腔外進行卵巢血管結\r       紮？","opts":["A. broad ligament","B. sacrotuberous ligament","C. suspensory ligament","D. uterine ligament"],"ans":2,"exp":"犬卵巢子宮摘除術（OHE）中，為了將卵巢充分提拉出腹腔進行卵巢血管（卵巢動靜脈）結紮，通常需要撕裂（tear）卵巢懸吊韌帶（suspensory ligament of the ovary/ovarian proper ligament），因為此韌帶限制卵巢向頭側移動。","we":["broad ligament（子宮闊韌帶）是子宮的主要固定韌帶，在OHE中切斷但不是主要撕斷的，此選項不如C準確。","sacrotuberous ligament（薦結節韌帶）是骨盆韌帶，與OHE無關，錯誤。","suspensory ligament（卵巢懸吊韌帶）在OHE中通常需要撕斷以提拉卵巢，此為正確答案。","uterine ligament（子宮韌帶）泛指，不是OHE中最常需要撕斷的特定韌帶，此選項不如C具體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_070","year":2016,"roc_year":105,"session":"","examNo":70,"q":"犬顏面部痛覺喪失（analgesia）是下列那一對腦神經病變所出現的症狀？","opts":["A. 第5對腦神經","B. 第7對腦神經","C. 第8對腦神經","D. 第12對腦神經"],"ans":0,"exp":"第5對腦神經（三叉神經/Trigeminal nerve, CN V）的三個分支（眼神經/V1、上頷神經/V2、下頷神經/V3）負責顏面部和口腔的「感覺」（包括痛覺、觸覺、溫度覺）。三叉神經病變時，顏面部感覺喪失（analgesia）或感覺異常。","we":["第5對腦神經（三叉神經）負責顏面部感覺，其病變引起顏面部感覺/痛覺喪失，此為正確答案。","第7對腦神經（顏面神經）負責顏面部運動，病變引起面癱（不是感覺喪失），錯誤。","第8對腦神經（前庭耳蝸神經）負責聽覺和平衡，病變引起耳聾或前庭症狀，錯誤。","第12對腦神經（舌下神經）負責舌肌運動，病變引起舌肌無力/萎縮，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_071","year":2016,"roc_year":105,"session":"","examNo":71,"q":"犬眼下外斜視（ventrolateral strabismus）的原因是下列那一對腦神經的病變？","opts":["A. 第2對腦神經","B. 第3對腦神經","C. 第4對腦神經","D. 第6對腦神經"],"ans":1,"exp":"眼下外斜視（ventrolateral strabismus）是動眼神經（CN III/第3對腦神經）麻痺的典型表現。動眼神經支配大多數眼外肌（上直肌、下直肌、內直肌、下斜肌）；當動眼神經麻痺時，拮抗肌（外展神經支配的外直肌和滑車神經支配的上斜肌）的作用使眼球向下外（ventrolateral）偏斜。","we":["第2對腦神經（視神經）負責視覺，病變引起失明，不是斜視，錯誤。","第3對腦神經（動眼神經）麻痺引起眼下外斜視（ventrolateral strabismus），此為正確答案。","第4對腦神經（滑車神經）麻痺引起眼球輕度外旋，不是典型下外斜視，錯誤。","第6對腦神經（外展神經）麻痺引起內斜視（medial strabismus），不是下外斜視，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_072","year":2016,"roc_year":105,"session":"","examNo":72,"q":"下列何者不是一般常見治療犬會陰赫尼亞（hernia）時所需縫合的肌群？","opts":["A. coccygeus muscle","B. external anal sphincter muscle","C. superficial gluteal muscle","D. internal obturator muscle"],"ans":2,"exp":"犬會陰疝（perineal hernia）手術修復縫合的肌群：coccygeus muscle（尾骨肌）、external anal sphincter muscle（肛門外括約肌）、internal obturator muscle（內閉孔肌，翻轉後縫合填補缺損）是標準縫合肌群。Superficial gluteal muscle（淺臀肌）不是會陰疝修復的常用縫合肌群，因其位置不在會陰疝缺損區域。","we":["coccygeus muscle是會陰疝修復縫合的標準肌群，非答案。","external anal sphincter muscle是會陰疝修復縫合的標準肌群，非答案。","superficial gluteal muscle不是會陰疝修復常用縫合肌群，此為正確答案。","internal obturator muscle是會陰疝修復縫合的重要肌群（轉位縫合），非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_073","year":2016,"roc_year":105,"session":"","examNo":73,"q":"犬貓下頷骨骨折（mandibular fractures）的診斷和治療，下列何項最不適當？","opts":["A. 可能繼發於trauma或severe periodontitis","B. 因腫瘤造成的pathologic fractures，大多會採取mandibulectomy來治療","C. 若同時有牙根位於骨折處，不論有無鬆動，皆應將其拔除","D. 若貓發生high-rise syndrome可能會導致mandibular symphyseal fractures"],"ans":2,"exp":"犬貓下頷骨骨折（mandibular fracture）處理中，「若同時有牙根位於骨折處，不論有無鬆動，皆應將其拔除」是最不適當的描述。正確原則是：若牙根穩定（堅固），應盡量保留以支撐骨折的穩定性（牙根可作為骨折固定的錨點）；只有牙根嚴重鬆動、感染或壞死時才拔除。","we":["外傷或嚴重牙周炎可引起下頷骨骨折，正確，非答案。","腫瘤性病理骨折（pathologic fracture）通常選擇下頷骨切除術，正確，非答案。","不論有無鬆動皆拔除牙根是不適當的（穩定的牙根應保留），此為正確答案（最不適當）。","貓高樓症候群可導致下頷聯合骨折（symphyseal fractures），正確，非答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_074","year":2016,"roc_year":105,"session":"","examNo":74,"q":"下圖為何種外科器械？","opts":["A. Michel trephine","B. Jamshidi needle","C. biopsy punch","D. spine needle"],"ans":1,"exp":"此題為圖像題，需要確認圖示外科器械的外觀特徵。Jamshidi needle是骨髓活體組織穿刺針（bone marrow biopsy needle），具有特徵性的錐形尖端和較寬的針身，用於骨髓穿刺活檢。需要圖像確認具體器械形態。","we":["Michel trephine是一種用於頭骨/骨骼的環鋸型鑽孔器，形態與Jamshidi不同。","Jamshidi needle（骨髓穿刺針）可能是本題圖示的器械，需圖像確認。","biopsy punch是皮膚環形打孔活檢器，形態不同。","spine needle是脊椎穿刺針，形態較細長，與骨髓穿刺針不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_1_普通病_075","year":2016,"roc_year":105,"session":"","examNo":75,"q":"膝蓋骨的內翻應力測試（varus stress test），主要用於檢測下列那一項韌帶是否完整\r   （integrity）或斷裂（rupture）？","opts":["A. 前十字韌帶（cranial cruciate ligament）","B. 後十字韌帶（caudal cruciate ligament）","C. 內側副韌帶（medial collateral ligament）","D. 外側副韌帶（lateral collateral ligament）"],"ans":3,"exp":"膝蓋骨（stifle joint）的應力測試：內翻應力測試（varus stress test）是向關節施加內翻力（向內壓），若出現過度關節內翻運動，表示外側副韌帶（Lateral Collateral Ligament, LCL）損傷或斷裂；外翻應力測試（valgus stress test）則測試內側副韌帶（MCL）。","we":["前十字韌帶（CCL）由抽屜試驗（drawer test）或脛骨壓迫試驗評估，不是內翻應力測試，錯誤。","後十字韌帶（CaCL）由後抽屜試驗評估，不是內翻應力測試，錯誤。","內側副韌帶（MCL）由外翻應力測試（valgus stress test）評估，不是內翻應力測試，錯誤。","外側副韌帶（LCL）由內翻應力測試（varus stress test）評估，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_076","year":2016,"roc_year":105,"session":"","examNo":76,"q":"母犬罹患惡性乳腺腫瘤，最容易轉移到下列何種器官？","opts":["A. 心臟","B. 肺臟","C. 肝臟","D. 脾臟"],"ans":1,"exp":"母犬惡性乳腺腫瘤最常見的遠端轉移部位是肺臟（lungs）。乳腺腫瘤通過淋巴或血行轉移，最終以血行轉移至肺臟最為常見。術前或術後應進行胸腔X光檢查以評估肺轉移情況。","we":["心臟不是乳腺腫瘤常見的轉移部位，錯誤。","肺臟是乳腺腫瘤最常見的血行轉移部位，此為正確答案。","肝臟是次要轉移部位，但不如肺臟常見，錯誤。","脾臟不是乳腺腫瘤的常見轉移部位，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_077","year":2016,"roc_year":105,"session":"","examNo":77,"q":"減壓（decompression）和椎板切除術（laminectomy）主要是針對下列那一部位所進行的手\r   術？","opts":["A. 股骨頭","B. 脊椎","C. 腸骨翼","D. 肋骨"],"ans":1,"exp":"椎板切除術（laminectomy）是脊椎（spine/vertebrae）手術，手術目的是移除椎板（lamina，脊椎後弓的一部分）以減輕對脊髓的壓迫（decompression），常用於椎間盤突出（IVDD）、脊椎腫瘤、脊椎骨折等脊椎相關疾病的治療。","we":["股骨頭是骨科手術的對象（如股骨頭切除術FHO），不是椎板切除術的部位，錯誤。","脊椎（spine）是椎板切除術的手術部位，此為正確答案。","腸骨翼是骨移植供區，不是椎板切除術的手術部位，錯誤。","肋骨是胸腔外科的範疇，不是椎板切除術的部位，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_078","year":2016,"roc_year":105,"session":"","examNo":78,"q":"下列那一種局部麻醉藥物（local anesthetics），其在犬的相對效價（relative potency）值最\r    高？","opts":["A. procaine","B. lidocaine","C. mepivacaine","D. bupivacaine"],"ans":3,"exp":"局部麻醉藥相對效價（relative potency）比較：Procaine（普魯卡因）：1（基準值）；Lidocaine（利多卡因）：2-4；Mepivacaine（美吡卡因）：2-4；Bupivacaine（布比卡因）：8-16。Bupivacaine效價最高（約為procaine的8-16倍），作用持續時間也最長（4-8小時）。","we":["procaine效價最低（基準值1），不是最高，錯誤。","lidocaine效價中等（2-4倍），不是最高，錯誤。","mepivacaine效價中等（2-4倍），不是最高，錯誤。","bupivacaine效價最高（8-16倍）且持續時間最長，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_1_普通病_079","year":2016,"roc_year":105,"session":"","examNo":79,"q":"此匹馬最可能罹患下列何者項疾病？","opts":["A. 結腸左背側異位（left dorsal displacement of the colon）","B. 大腸阻塞","C. 急性小腸捻轉","D. 胃潰瘍"],"ans":0,"exp":"此題為馬疝痛圖像題，詢問圖示馬匹最可能罹患的疾病。需要圖像確認臨床症狀（疼痛程度、腹圍膨大位置、腸蠕動音等）才能判斷具體病因。圖像需配合臨床檢查結果診斷。","we":["此題需要圖像確認才能判斷正確答案。","不同的臨床表現對應不同的疝痛病因。","正確答案取決於圖示的臨床特徵。","此為圖像題，需結合圖示作答。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_1_普通病_080","year":2016,"roc_year":105,"session":"","examNo":80,"q":"承上題，此時最適合的治療方式為","opts":["A. 內科處理，給與礦物油","B. 施行安樂死術","C. 以外科開腹處理","D. 內科處理，給與更強效的止痛藥"],"ans":0,"exp":"此題承接Q79（馬疝痛圖像題），詢問最適合的治療方式。治療選擇取決於Q79確定的病因。圖像題需結合Q79的診斷才能確定最適當的治療。","we":["治療選擇需結合Q79的診斷。","不同病因的疝痛有不同的最佳治療。","正確答案取決於Q79的圖像判讀。","此為連續圖像題，需結合Q79一起作答。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_001","year":2016,"roc_year":105,"session":"","examNo":1,"q":"有關馬內毒素血症之治療方式，何者錯誤？","opts":["A. 預防是最理想的方式","B. 輸液支持療法","C. 非類固醇抗發炎藥物","D. 儘快自鼻胃管給與食物"],"ans":3,"exp":"馬內毒素血症（endotoxemia）治療原則：靜脈輸液補充血容量、給予抗發炎藥物（flunixin meglumine）、抗生素預防繼發感染，以及禁食以減少腸道細菌產生的毒素吸收。「儘快自鼻胃管給與食物」是錯誤的，此時腸道功能受損，強行餵食反而可能加重病情。","we":["靜脈輸液是標準支持療法，正確。","Flunixin meglumine 為常用抗內毒素藥物，正確。","限制腸道吸收毒素為重要原則，抗生素也常使用，正確。","此為錯誤選項：腸道功能受損時不應強行自鼻胃管給食。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_002","year":2016,"roc_year":105,"session":"","examNo":2,"q":"一匹馬精神不佳，運動不耐，不願走動，消瘦，慢性咳嗽，自雙側鼻孔流出黏稠至膿樣分泌物，呼吸用力，呼氣時肛門外突，\r 胸腹兩側出現哮喘線（heave line），此匹馬最可能罹患下列何項疾病？","opts":["A. hyperthyroidism","B. recurrent airway obstruction","C. sinusitis","D. laryngeal hemiplegia"],"ans":1,"exp":"馬復發性氣道阻塞（Recurrent Airway Obstruction, RAO），又稱馬哮喘，臨床特徵包括：喘鳴聲（哮喘線/heave line 形成）、呼氣費力、鼻孔擴張，以及因長期費力呼氣使腹肌肥大形成腹部哮喘線。肛門外突（perineal bulging）是罕見且通常與其他疾病相關，不是RAO的典型症狀。","we":["喘鳴線（heave line）是RAO的特徵，正確。","哮喘線+肛門外突同時出現應考慮RAO（heave line為主要特徵），此為正確答案。","呼氣延長和費力是RAO症狀，正確。","鼻孔擴張和鼻分泌物也是RAO表現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_003","year":2016,"roc_year":105,"session":"","examNo":3,"q":"關於馬的消化作用，下列敘述何者正確？","opts":["A. 發酵作用主要在盲腸及結腸進行","B. 大部分植物纖維在小腸水解","C. 食道具有部分消化及吸收作用","D. 胃可消化大部分的植物纖維"],"ans":0,"exp":"馬消化系統的特點：馬是單胃動物，但有大容量的盲腸和結腸，纖維素主要在盲腸和大結腸中由微生物發酵，產生揮發性脂肪酸作為能量來源。這與反芻動物不同（反芻動物主要在瘤胃發酵）。","we":["馬的纖維發酵確實在盲腸及結腸進行，此為正確答案。","馬不是反芻動物，不在瘤胃發酵，此選項錯誤。","馬的胃容量相對較小，主要消化在小腸，此說法不完整。","馬的消化道通過時間較長，說法有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_004","year":2016,"roc_year":105,"session":"","examNo":4,"q":"牛尿石症的尿中不會出現下列何種物質？","opts":["A. 膽紅素","B. 尿圓柱","C. 白血球","D. 上皮細胞"],"ans":0,"exp":"牛尿石症（urolithiasis）主要臨床症狀：頻尿、排尿困難、血尿、膀胱膨大（阻塞時）、後段尿道觸診到結石，以及尿毒症症狀（氮血症、食慾廢絕）。膽紅素（bilirubin）升高是肝臟疾病或溶血的指標，與尿石症無關。","we":["血尿是尿石症常見症狀，正確。","排尿困難（dysuria）是尿石症主要表現，正確。","氮血症（azotemia）在阻塞性尿石症後期出現，正確。","膽紅素升高與尿石症無關，此為正確答案（不會出現的症狀）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_005","year":2016,"roc_year":105,"session":"","examNo":5,"q":"牛第四胃左側異位之ping test 須將聽診器置於何處始為正確？","opts":["A. 左側6－9肋間上三分之一處","B. 左側9－12肋間上三分之一處","C. 左側6－9肋間下三分之一處","D. 左側9－12肋間下三分之一處"],"ans":1,"exp":"左側皺胃移位（Left Displaced Abomasum, LDA）的 ping test 陽性區域：聽診叩打法（auscultation-percussion）在左側第9至第12肋間的上1/3區域可聽到高亢的金屬音（ping）。這是LDA診斷的重要體格檢查。","we":["右側是右側皺胃移位的聽診區，不是LDA，錯誤。","左側9-12肋間上1/3是LDA的ping test陽性位置，此為正確答案。","左側更低的位置（下1/3）不是典型LDA ping陽性區，錯誤。","前腹部不是LDA ping test的位置，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_006","year":2016,"roc_year":105,"session":"","examNo":6,"q":"下列何種病因較易引起牛第四胃食滯？","opts":["A. 分娩","B. 第四胃粘連","C. 第三胃食滯","D. 第一胃角化"],"ans":1,"exp":"第四胃食滯（abomasal impaction）的主要病因包括：飼料纖維過多、粗糙飼料、水分不足等。第四胃粘連（abomasal adhesion）是第四胃食滯的重要病因之一，因粘連導致胃排空障礙，造成食物蓄積。","we":["飼料品質問題可能是誘因，但不是最主要的，此選項不完整。","第四胃粘連造成排空障礙是主要病因，此為正確答案。","神經性因素也可能，但不是最主要，此選項不完整。","其他選項不如第四胃粘連直接。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_007","year":2016,"roc_year":105,"session":"","examNo":7,"q":"進行小牛脫水之評估時，發現該小牛眼球和眼窩的距離小於0.5公分，於頸部進行拉皮試驗發現回復時間約11－15秒，請問這\r 隻小牛脫水多少百分比？","opts":["A. 3%－5%","B. 6%－8%","C. 9%－10%","D. 11%－12%"],"ans":2,"exp":"仔牛脫水評估：皮膚彈性測試（skin tent test）<0.5cm（幾乎正常）與眼球凹陷程度11-15秒回彈，對應脫水程度約為9%-10%。臨床脫水分級：<5%幾乎無症狀；5-8%輕度（皮膚回彈稍慢）；8-10%中度（眼球凹陷、皮膚回彈>5秒）；>10%重度（休克症狀）。","we":["5-8%脫水的皮膚回彈時間較短，此選項低估，錯誤。","8-9%是中輕度脫水，但皮膚回彈11-15秒更接近更重的脫水，此選項略低。","9%-10%符合皮膚回彈11-15秒的脫水程度，此為正確答案。",">10%脫水會出現更明顯的休克症狀，此選項過重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_008","year":2016,"roc_year":105,"session":"","examNo":8,"q":"草食動物發生黃嘌呤尿（xanthiuria）主要為先天缺乏下列何者所致？","opts":["A. 黃嘌呤（xanthine）","B. 亞黃嘌呤（hypoxanthine）","C. 黃嘌呤氧化酶（xanthine oxidase）","D. 亞黃嘌呤氧化酶（hypoxanthine oxidase）"],"ans":2,"exp":"黃嘌呤尿症（xanthinuria）是由於黃嘌呤氧化酶（xanthine oxidase）缺乏，導致黃嘌呤（xanthine）無法被轉化為尿酸，黃嘌呤在尿液中蓄積並沉澱形成結石。正常代謝路徑：次黃嘌呤→黃嘌呤（xanthine oxidase）→尿酸（xanthine oxidase）。","we":["尿酸氧化酶缺乏會導致尿酸結石（hyperuricosuria），不是黃嘌呤尿，錯誤。","腺嘌呤去氨酶與此代謝路徑無關，錯誤。","黃嘌呤氧化酶缺乏導致黃嘌呤無法轉化為尿酸而蓄積，此為正確答案。","嘌呤核苷磷酸化酶缺乏影響不同代謝路徑，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_009","year":2016,"roc_year":105,"session":"","examNo":9,"q":"下列與牛神經性疾病相關之敘述何者錯誤？","opts":["A. 銅缺乏會造成脊髓（spinal cord）之脫髓鞘病變（demyelination）","B. 維生素E缺乏會造成脫髓鞘病變（demyelination）","C. 鎂缺乏會造成青草強直症（grass tetany）","D. 鉀缺乏會造成牛產前無法站立（prepartum recumbency）"],"ans":3,"exp":"牛神經疾病（低鎂血症/低鈣血症/低鉀血症等）相關敘述：低鉀血症（hypokalemia）在牛常見於高產乳牛，主要臨床症狀為肌肉無力、站立困難，但「產前無法站立」通常與低鈣血症（乳熱/milk fever）更相關，而非低鉀血症。低鉀血症導致產前無法站立的說法不正確。","we":["低鈣血症導致神經肌肉症狀的描述正確。","低鎂血症（grass tetany）的描述正確。","其他神經疾病描述正確。","低鉀血症與產前無法站立的關聯性描述錯誤，此為正確答案（錯誤描述）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_010","year":2016,"roc_year":105,"session":"","examNo":10,"q":"牛在下列何種金屬中毒時會出現血紅素尿？","opts":["A. 鉛","B. 汞","C. 銅","D. 鉬"],"ans":2,"exp":"金屬中毒導致血紅素尿（hemoglobinuria）：銅（copper）中毒是牛羊最重要的引起溶血性貧血和血紅素尿的金屬中毒。銅蓄積達到閾值後突然釋放，導致大量溶血，紅血球破壞釋放血紅素進入血液和尿液，呈現「銅中毒危象」（copper crisis）。","we":["鉛中毒主要影響神經系統，不以血紅素尿為主，錯誤。","鐵中毒不是主要引起溶血性血紅素尿的金屬，錯誤。","銅中毒是最常見引起反芻動物血紅素尿的金屬毒素，此為正確答案。","鋅中毒也可引起溶血，但不如銅中毒常見，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_011","year":2016,"roc_year":105,"session":"","examNo":11,"q":"下列何者不是牛產褥性血紅素尿症（postparturient hemoglobinuria）之主要變化？","opts":["A. 高血鉀症","B. 血管內溶血","C. 再生性貧血","D. 紅血球脆性增加"],"ans":0,"exp":"產褥性血紅素尿（postparturient hemoglobinuria）的主要特徵和病理變化：低磷血症（hypophosphatemia）是主要誘因，導致紅血球脆性增加而溶血；血紅素尿（深紅棕色尿）、貧血、黃疸是主要表現。高血鉀症（hyperkalemia）不是產褥性血紅素尿的主要特徵，溶血會釋放細胞內鉀，但不是「主要變化」。","we":["高血鉀症不是產褥性血紅素尿的主要特徵，此為正確答案（不是主要變化）。","低磷血症是主要誘因，錯誤（這是主要變化）。","血紅素尿是主要症狀，錯誤（這是主要變化）。","溶血性貧血是主要病理，錯誤（這是主要變化）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_012","year":2016,"roc_year":105,"session":"","examNo":12,"q":"於牛肩隆（鬐甲部）挾捏皮膚皺襞所呈現的劍突反射（xiphoid reflex）有助於診斷下列何病？","opts":["A. 瘤胃食滯","B. 皺胃異位","C. 瘤胃臌脹","D. 創傷性蜂巢胃炎和心囊炎"],"ans":3,"exp":"劍突反射（xiphoid reflex/withers reflex）陽性：在牛的劍突（xiphoid process）後方施加壓力，若動物出現疼痛反應（弓背、退縮），提示創傷性網胃腹膜炎（traumatic reticuloperitonitis, TRP）或創傷性心囊炎（traumatic pericarditis）。這兩種疾病均由金屬異物穿透網胃所致。","we":["單純的網胃炎（無異物穿透）不會引起劍突反射陽性，錯誤。","瘤胃積食也有腹痛，但劍突反射更特異於TRP，錯誤。","皺胃移位腹痛位置不同，劍突反射陽性不是其特徵，錯誤。","創傷性蜂巢胃炎和心囊炎（TRP + 心囊炎）是劍突反射陽性的主要原因，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_013","year":2016,"roc_year":105,"session":"","examNo":13,"q":"乳牛若食入大量可以高度醱酵、富有碳水化合物的飼料，瘤胃內下列何種物質會因產生過多而誘發瘤胃過酸症？","opts":["A. 碳酸","B. 磷酸","C. 乳酸","D. 丙酸"],"ans":2,"exp":"瘤胃過酸症（ruminal acidosis）的主要病因：過量攝取穀物或易發酵碳水化合物後，瘤胃微生物大量產生乳酸（lactic acid），尤其是L-乳酸和D-乳酸，導致瘤胃pH急劇下降，引起瘤胃微生物死亡、滲透壓升高、瘤胃炎等一系列變化。","we":["丙酸在正常發酵中產生，不是過酸症的主因，錯誤。","醋酸在正常發酵中產生，不是過酸症的主因，錯誤。","乳酸大量蓄積是瘤胃過酸症的核心機制，此為正確答案。","丁酸在某些發酵中產生，但不是過酸症的主要原因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_014","year":2016,"roc_year":105,"session":"","examNo":14,"q":"下列何者為牛原發性前頭竇炎發生之原因？","opts":["A. 去角","B. 齒齦炎","C. 慢性鼻炎","D. 鼻氣管炎"],"ans":0,"exp":"原發性前頭竇炎（primary frontal sinusitis）的主要原因是去角（dehorning/disbudding）手術操作不當，導致角竇（horn sinus）與前頭竇相通且繼發感染。去角後若消毒不完全或創傷處理不當，細菌可進入前頭竇造成原發性前頭竇炎。","we":["去角是原發性前頭竇炎最常見的原因，此為正確答案。","角折斷可導致繼發性前頭竇炎，但原發性多由去角引起，此選項不如A準確。","上呼吸道感染蔓延是繼發性前頭竇炎的原因，不是原發性，錯誤。","外傷可引起，但去角更是特定的原發性原因，此選項不如A準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_015","year":2016,"roc_year":105,"session":"","examNo":15,"q":"若懷疑牛隻有創傷性蜂巢胃腹膜炎，要採取腹水檢查時，應從下列那一部位穿刺較為恰當？","opts":["A. 左脇部上1/3處","B. 右脇部上1/3處","C. 胸骨劍狀軟骨後方","D. 臍孔後10公分處"],"ans":2,"exp":"牛腹水穿刺術（abdominocentesis）最佳位置：在胸骨劍狀軟骨（xiphoid process）後方正中線偏右側穿刺，可避開瘤胃（左側），在右側可較安全地進行腹腔穿刺。","we":["右側腹壁中段不是標準穿刺位置，錯誤。","左側腹壁會穿刺到瘤胃，應避免，錯誤。","胸骨劍狀軟骨後方是腹水穿刺的標準位置，此為正確答案。","臍後方也可使用，但劍狀軟骨後方更為標準，此選項不如C準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_016","year":2016,"roc_year":105,"session":"","examNo":16,"q":"皺胃左側異位常伴有下列何種中毒症狀？","opts":["A. 代謝性酸中毒","B. 代謝性鹼中毒","C. 呼吸性酸中毒","D. 呼吸性鹼中毒"],"ans":1,"exp":"左側皺胃移位（LDA）伴中毒（toxemia）時的酸鹼失衡：LDA本身因氯離子和氫離子在皺胃中蓄積（無法進入十二指腸），導致血液中氯離子降低、代謝性鹼中毒（metabolic alkalosis）伴低氯血症（hypochloremia）和低鉀血症（hypokalemia）。當伴隨中毒時，代謝性鹼中毒仍是主要失衡。","we":["代謝性酸中毒在嚴重脫水和乳酸蓄積時出現，不是LDA的主要失衡，錯誤。","代謝性鹼中毒（因低氯血症）是LDA的特徵性酸鹼失衡，此為正確答案。","呼吸性鹼中毒與LDA無直接關聯，錯誤。","呼吸性酸中毒與LDA無直接關聯，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_017","year":2016,"roc_year":105,"session":"","examNo":17,"q":"優質穀類飼料被認為可以使乳牛瘤胃中食物向皺胃的流動速度增加，進而引起皺胃那一種物質的濃度增加而抑制皺胃的運動，\r 加上氣體堆積增加而促成第四胃異位的發生？","opts":["A. 揮發性脂肪酸","B. 非脂化脂肪酸","C. 三酸甘油酯","D. 磷脂"],"ans":0,"exp":"第四胃（皺胃）異位的機制：高精料飼糧在瘤胃發酵產生大量揮發性脂肪酸（volatile fatty acids, VFAs），尤其是丁酸，抑制皺胃平滑肌收縮，使皺胃弛緩（abomasal atony）積氣，導致皺胃因浮力作用向左側（LDA）或右側（RDA）移位。","we":["揮發性脂肪酸（VFAs）抑制皺胃收縮是異位的主要機制，此為正確答案。","低鈣血症可引起平滑肌收縮力下降，是誘因但非直接機制，此選項不如A完整。","產後子宮縮小使腹腔空間增加是誘因，非直接機制，此選項不如A完整。","其他因素也是誘因，但VFAs是最直接的機制，此選項不如A準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_018","year":2016,"roc_year":105,"session":"","examNo":18,"q":"牛腦灰質軟化症發生之主因為缺乏下列何者所致？","opts":["A. thiamine disulfate","B. vitamin D","C. thiourea","D. vitamin E"],"ans":0,"exp":"牛腦灰質軟化症（polioencephalomalacia, PEM）又稱硫胺素缺乏性腦病，主要是由於缺乏硫胺素（thiamine, vitamin B1）或其活性形式硫胺素二磷酸酯（thiamine diphosphate/thiamine disulfate）。這導致大腦皮質灰質壞死，出現神經症狀（轉圈、眼球震顫、昏迷等）。","we":["缺乏thiamine disulfate（硫胺素）是PEM的主要原因，此為正確答案。","缺乏維生素E/硒與白肌病（white muscle disease）有關，不是PEM，錯誤。","缺乏維生素A與夜盲症、繁殖障礙有關，不是PEM，錯誤。","缺乏銅與腦病也有關聯，但不是PEM的主因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_019","year":2016,"roc_year":105,"session":"","examNo":19,"q":"請問圖片中的那一個號碼為以Peterson nerve block麻醉法施行牛眼球摘除術時針頭的穿刺部位？","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":0,"exp":"Peterson神經阻斷術（Peterson nerve block）是牛眼科手術常用的局部麻醉技術，用於阻斷支配眼球的神經（動眼神經、滑車神經、外展神經和顴顳神經）。穿刺位置在顴弓後方，翼狀窩（pterygoid fossa）區域進行。需要圖片確認穿刺點。","we":["Peterson神經阻斷術的穿刺位置需要圖像確認。","不同穿刺點的選擇需要根據圖示判斷。","正確穿刺位置是診斷該題的關鍵。","此題為圖像題，需要結合圖示判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_020","year":2016,"roc_year":105,"session":"","examNo":20,"q":"牛施行尾根硬膜外麻醉（epidural analgesia）的最佳注射部位為下列何處？","opts":["A. 薦骨尾骨間關節","B. 第1及2尾骨間關節","C. 第2及3尾骨間關節","D. 第3及4尾骨間關節"],"ans":1,"exp":"牛尾根硬膜外麻醉（caudal epidural anesthesia）的注射位置：在第1及第2尾骨（Co1-Co2）之間的關節（sacrococcygeal joint或first intercoccygeal space）進行注射，此處脊髓已變為馬尾（cauda equina），相對安全。這是牛最常用的硬膜外麻醉部位。","we":["薦骨（sacrum）與第1尾骨之間是薦尾關節，注射較深，不是常用部位，錯誤。","第1及第2尾骨間關節是牛硬膜外麻醉的標準位置，此為正確答案。","第2及第3尾骨之間位置偏後，麻醉效果較差，錯誤。","第3及第4尾骨之間位置太後，效果不佳，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_021","year":2016,"roc_year":105,"session":"","examNo":21,"q":"在進行乳牛rumenotomy手術並切開瘤胃前，必須先將瘤胃漿膜與下列何種組織一起固定以避免術中感染？","opts":["A. 皮膚","B. 皮膚、腹斜肌","C. 皮膚、腹斜肌、腹橫肌","D. 皮膚、腹斜肌、腹橫肌、腹膜"],"ans":3,"exp":"瘤胃切開術（Rumenotomy）前的固定（stay suture/fixation）順序：外科手術層次從外到內依序為：皮膚（skin）→腹外斜肌（external abdominal oblique）→腹內斜肌（internal abdominal oblique）/腹橫肌（transversus abdominis）→腹膜（peritoneum）。固定縫合需穿過皮膚、腹斜肌、腹橫肌至腹膜，才能將瘤胃固定於手術切口。","we":["只固定到腹斜肌不足以防止瘤胃內容物污染腹腔，錯誤。","固定順序不完整，無法有效隔離，錯誤。","未包含腹膜的固定不能達到完全隔離目的，錯誤。","皮膚、腹斜肌、腹橫肌、腹膜的完整固定是標準程序，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_022","year":2016,"roc_year":105,"session":"","examNo":22,"q":"小牛的臍赫尼亞（hernia）若發生赫尼亞囊內腸絞窄，最容易出現下列何種臨床病理學異常？","opts":["A. 低血鈉症","B. 代謝性鹼血症","C. 高血鉀症","D. 高血氯症"],"ans":2,"exp":"臍疝腸絞窄（strangulated umbilical hernia with intestinal incarceration）最常出現的電解質異常：腸管絞窄→腸阻塞→腸管細胞壞死→細胞內鉀離子釋放→高血鉀症（hyperkalemia）。此外，腸絞窄也可引起代謝性酸中毒。","we":["低血鈣症與腸絞窄無直接關聯，錯誤。","低血鉀症在嘔吐或腹瀉時出現，腸絞窄更常見高血鉀，錯誤。","高血鉀症（因腸細胞壞死釋放鉀離子）是腸絞窄最常見的電解質異常，此為正確答案。","低血鈉症與腸絞窄無主要關聯，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_023","year":2016,"roc_year":105,"session":"","examNo":23,"q":"獸醫師欲進行牛複雜的胃腸疾病如第四胃扭轉（abomasal volvulus）之外科治療時，下列那一項血液學及血清生化學項目最有\r 助於了解病畜的生理狀況，以提供治療的建議？","opts":["A. packed cell volume（PCV）","B. total protein（TP）","C. plasma electrolyte concentrations（PEC）","D. complete blood count（CBC）"],"ans":2,"exp":"皺胃捻轉（abomasal volvulus）手術前最重要的準備：需要先評估血漿電解質濃度（plasma electrolyte concentration），尤其是氯化物、鉀和鈉，因為皺胃捻轉常伴有嚴重的低氯血症、低鉀血症和代謝性鹼中毒。術前糾正電解質失衡可降低麻醉和手術風險。","we":["心率評估重要，但電解質更關鍵，此選項不如C重要。","腹圍評估可了解膨脹程度，但電解質更關鍵，此選項不如C重要。","血漿電解質濃度評估是皺胃捻轉術前最重要的準備，此為正確答案。","CBC也重要，但電解質失衡是更直接的手術風險因素，此選項不如C重要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_024","year":2016,"roc_year":105,"session":"","examNo":24,"q":"牛隻下列何種皺胃疾病最有可能產生完全阻塞？","opts":["A. 左側異位（left abomasal displacement）","B. 右側異位（right abomasal displacement）","C. 右側捻轉（right abomasal volvulus）","D. 前方異位（cranial abomasal displacement）"],"ans":2,"exp":"皺胃（abomasum）發生完全阻塞（complete obstruction）最可能的病變：右側皺胃捻轉（right-sided abomasal volvulus, RAV）時，皺胃完全扭轉，幽門和十二指腸也同時受到扭轉，造成完全阻塞，是最嚴重的皺胃疾病形式。","we":["左側皺胃移位（LDA）多為不完全移位，較少造成完全阻塞，錯誤。","皺胃食滯（impaction）導致漸進性阻塞，較少完全阻塞，錯誤。","右側皺胃捻轉（RDA/RVA）造成皺胃完全扭轉，最可能導致完全阻塞，此為正確答案。","皺胃潰瘍造成出血，不是阻塞的主要原因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_025","year":2016,"roc_year":105,"session":"","examNo":25,"q":"以toggle pin治療乳牛皺胃異位時，若病牛沒有明顯的食慾改善情形，則最好在幾天內將固定之縫線拆除？","opts":["A. 2","B. 7","C. 15","D. 21"],"ans":1,"exp":"Toggle pin手術（toggle-pin suture）是LDA的非手術治療方式，透過滾轉後放置固定針將皺胃固定。若Toggle pin手術後無改善，標準建議是在7天後拆除toggle pin，改用手術方式（omentopy或pyloropexy）治療。","we":["3天太短，尚未充分評估效果，錯誤。","7天是標準建議的觀察期，若無改善則拆除，此為正確答案。","14天太長，若無效應及早手術，錯誤。","30天完全不合適，過長的等待期會延誤治療，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_026","year":2016,"roc_year":105,"session":"","examNo":26,"q":"下列那一個病原不是造成山羊紅眼症（pink eye）的主因？","opts":["A. Mycoplasma conjunctivae","B. Acholeplasma oculusi","C. Mycplasma mycoides subsp. mycoides","D. Chlamydia psittaci"],"ans":2,"exp":"山羊傳染性紅眼症（infectious keratoconjunctivitis，俗稱pink eye）的主要病原：犬莫拉氏菌（Moraxella ovis）、黴漿菌（Mycoplasma conjunctivae）是主要病原。M. mycoides subsp. mycoides（Small Colony）是引起山羊傳染性胸膜肺炎（CCPP）的病原，不是紅眼症的主因。","we":["Moraxella ovis是山羊紅眼症的重要病原，正確（不選此項）。","Mycoplasma conjunctivae是山羊紅眼症的重要病原，正確（不選此項）。","M. mycoides subsp. mycoides與山羊紅眼症無關（它引起CCPP），此為正確答案（不是主因）。","外傷或紫外線也是誘因，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_027","year":2016,"roc_year":105,"session":"","examNo":27,"q":"神經性吞嚥困難（neurological dysphagia）最不會出現在下列那項疾病？","opts":["A. 李氏菌感染症（listeriosis）","B. 山羊關節炎腦炎（caprine arthritis encephalitis）","C. 羊接觸傳染性化膿性皮炎（contagious pustular dermatitis）","D. 腦脊髓性線蟲病（cerebrospinal nematodiasis）"],"ans":2,"exp":"神經性吞嚥困難（neurogenic dysphagia）的鑑別診斷：可能疾病包括肉毒桿菌毒素中毒（botulism）、李斯特菌病（listeriosis）、狂犬病（rabies）、鉛中毒等。「羊接觸傳染性化膿性皮炎」（orf/contagious ecthyma）主要影響口唇皮膚，造成機械性吞嚥困難，不是神經性吞嚥困難的原因。","we":["肉毒桿菌毒素中毒可引起神經性吞嚥困難，正確（不選此項）。","李斯特菌病可引起腦幹神經受損和吞嚥困難，正確（不選此項）。","羊接觸傳染性化膿性皮炎（orf）造成口唇病變，不引起神經性吞嚥困難，此為正確答案（最不可能）。","狂犬病引起神經症狀包括吞嚥困難，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_028","year":2016,"roc_year":105,"session":"","examNo":28,"q":"下列何種疾病會引起家畜腎後性血尿？","opts":["A. 腎動脈栓塞","B. 磺胺劑中毒","C. 腎梗塞","D. 膀胱炎"],"ans":3,"exp":"腎後性血尿（postrenal hematuria）是指尿液形成後、在輸尿管至尿道之間的血液滲入，可能原因：膀胱炎（cystitis）、膀胱結石、尿道炎、腫瘤等。膀胱炎是最常見的腎後性血尿原因。","we":["腎臟腫瘤引起腎性血尿，不是腎後性，錯誤。","腎小球腎炎是腎性血尿，不是腎後性，錯誤。","腎盂腎炎（pyelonephritis）是腎性血尿，不是腎後性，錯誤。","膀胱炎是腎後性血尿最常見的原因，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_029","year":2016,"roc_year":105,"session":"","examNo":29,"q":"下列何者不是豬蕁麻疹（urticaria）發生之主要病因？","opts":["A. 使用青黴素","B. 突換飼料中蛋白質過高","C. 豬丹毒","D. 突換飼料中碳水化合物過高"],"ans":3,"exp":"豬蕁麻疹（urticaria in pigs）的主要原因：過敏反應（allergens）、接觸某些植物或化學物質、豬丹毒（erysipelas，菱形皮疹）等。高碳水化合物飲食與蕁麻疹無直接關聯，蕁麻疹主要是免疫介導的過敏反應。","we":["過敏原（飼料、環境）是蕁麻疹主因，正確（不選此項）。","豬丹毒可引起菱形皮疹（diamond skin disease），屬廣義蕁麻疹，正確（不選此項）。","昆蟲叮咬可引起蕁麻疹反應，正確（不選此項）。","高碳水化合物與蕁麻疹無直接關聯，此為正確答案（不是主因）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_030","year":2016,"roc_year":105,"session":"","examNo":30,"q":"有關羊隻發生腸套疊，下列敘述何者錯誤？","opts":["A. 餵飼太冰冷的羊奶為病因之一","B. 主要發生在幼羊","C. 患羊會有間歇性腹痛","D. 注射副交感神經興奮劑（neostigmine）可明顯改善本病"],"ans":3,"exp":"羊腸套疊（intestinal intussusception）的敘述：腸套疊是腸管套入相鄰腸段，造成腸管阻塞和血液循環障礙，需要緊急手術治療。Neostigmine是膽鹼酯酶抑制劑，可促進腸蠕動，但在腸套疊的情況下，促進蠕動反而可能加重套疊，應禁止使用，而非「可改善」。","we":["腸套疊引起急性腹痛的描述正確（不選此項）。","需要緊急手術治療的描述正確（不選此項）。","腸套疊可能引起腸缺血壞死的描述正確（不選此項）。","注射neostigmine可改善腸套疊是錯誤的（反而禁忌），此為正確答案（錯誤描述）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_031","year":2016,"roc_year":105,"session":"","examNo":31,"q":"進行山羊帝王切開術時多從左腹脇部切開（approach），其主要原因為何？","opts":["A. 此處血管分布較少","B. 此處腸管干擾較小","C. 懷孕子宮多處於左腹部","D. 左腹脇部開創所造成的緊迫較小"],"ans":1,"exp":"山羊帝王切開術（Caesarean section）選擇從左腹脇（left flank）入路的原因：左側開腹可避開右側的腸管（十二指腸、空腸、迴腸等），腸管干擾較小，手術視野較清楚，且山羊子宮多在左側，更易操作。","we":["右側手術出血較少的說法不正確，錯誤。","左側開腹腸管干擾較小，此為正確答案。","左側開腹與右側相比，縫合難度相似，此選項不準確。","右側操作較方便的說法不正確，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_032","year":2016,"roc_year":105,"session":"","examNo":32,"q":"有關牛膣脫的敘述，下列何者錯誤？","opts":["A. 輕症者橫臥時發生","B. 分娩後多會自然治癒","C. 次回妊娠期易再發","D. 主要為oxytocin分泌過多導致"],"ans":3,"exp":"牛膣脫（vaginal prolapse）的病因：主要與高齡、多胎次、過肥、近分娩時腹壓增加、低鈣血症有關。主要機制是骨盆韌帶鬆弛（因relaxin等激素作用）和腹壓增加，使陰道和骨盆支持組織無力。「主要為oxytocin分泌過多」是錯誤的，oxytocin主要與子宮收縮和乳汁排出有關，不是膣脫的主要原因。","we":["高齡和多胎次是膣脫的危險因素，正確（不選此項）。","近分娩時骨盆韌帶鬆弛是重要誘因，正確（不選此項）。","腹壓增加（便秘、咳嗽）是誘因，正確（不選此項）。","oxytocin分泌過多是膣脫的主因是錯誤的，此為正確答案（錯誤描述）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_033","year":2016,"roc_year":105,"session":"","examNo":33,"q":"下列何種異常，常會造成母犬產後強直症（puerperal tetanus）？","opts":["A. 低血鈣症","B. 低血鈉症","C. 低血鉀症","D. 低血鎂症"],"ans":0,"exp":"母犬產後強直症（puerperal tetany/eclampsia）的主要病因：哺乳期間大量鈣質隨乳汁流失，加上攝取不足，導致低血鈣症（hypocalcemia）。臨床症狀：肌肉痙攣、強直、不安、高溫（因肌肉活動），嚴重時癲癇發作。治療：靜脈緩慢注射葡萄糖酸鈣。","we":["低血鈣症是母犬產後強直症的直接原因，此為正確答案。","低血糖症引起低血糖危象，症狀不同，錯誤。","低血鎂症（grass tetany）主要見於牛羊，犬較少見，錯誤。","高血鈣症不會引起強直症狀，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_034","year":2016,"roc_year":105,"session":"","examNo":34,"q":"乳牛的平均發情天數為","opts":["A. 1天","B. 3天","C. 5天","D. 7天"],"ans":0,"exp":"乳牛的發情週期（estrous cycle）平均約21天，但發情（estrus）持續時間平均約為1天（18-24小時）。乳牛的發情時間相對較短，因此需要密切觀察才能及時配種。","we":["發情持續平均1天（約18-24小時），此為正確答案。","發情持續2-3天是羊或豬的特徵，不是乳牛，錯誤。","發情持續5-7天是犬的特徵（犬發情持續9-12天），不是乳牛，錯誤。","發情持續2週是犬的整個發情前期，不適用於乳牛，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_035","year":2016,"roc_year":105,"session":"","examNo":35,"q":"下視丘分泌何種性內泌素控制腦下垂體性內泌素分泌？","opts":["A. FSH","B. LH","C. GnRH","D. LTH"],"ans":2,"exp":"下視丘（hypothalamus）分泌的激素控制腦下垂體前葉的功能：促性腺激素釋放素（Gonadotropin-Releasing Hormone, GnRH）控制腦下垂體前葉分泌FSH（促卵泡素）和LH（黃體素），調節生殖功能。","we":["FSH是腦下垂體前葉分泌的，不是下視丘，錯誤。","LH是腦下垂體前葉分泌的，不是下視丘，錯誤。","GnRH是下視丘分泌的，控制腦下垂體分泌FSH和LH，此為正確答案。","催產素（oxytocin）由下視丘合成但在神經垂體釋放，且主要不是控制生殖週期，此選項不如C準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_036","year":2016,"roc_year":105,"session":"","examNo":36,"q":"公犬第三段射精之精漿液體主要來源為下列何者？","opts":["A. 前列腺","B. 精囊腺","C. 尿道球腺","D. 輸精管壼腹"],"ans":0,"exp":"公犬的射精分為三段：第一段（pre-ejaculatory fraction）為清澈液體、量少；第二段（sperm-rich fraction）含大量精子、量少；第三段（prostatic fraction）為前列腺液，量多、清澈，主要功能是沖洗尿道並提供精子運動的介質。","we":["第三段射精精漿主要來自前列腺（prostatic gland），此為正確答案。","第三段精漿非來自睪丸，睪丸主要產生精子，錯誤。","第三段精漿非來自儲精囊（公犬沒有精囊腺），錯誤。","第三段精漿非來自尿道球腺（Cowper's glands），這提供第一段少量液體，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_037","year":2016,"roc_year":105,"session":"","examNo":37,"q":"下列何種動物的排卵方式是誘導性排卵（induced ovulator）？","opts":["A. 狗","B. 貓","C. 豬","D. 馬"],"ans":1,"exp":"誘導性排卵（induced ovulation）動物：某些動物需要交配刺激才能誘發排卵，稱為誘導性排卵動物。代表動物包括：貓（cat）、兔（rabbit）、雪貂（ferret）、駱馬（llama）、羊駝（alpaca）等。狗、牛、羊、豬是自發性排卵動物。","we":["犬（dog）是自發性排卵動物，不是誘導性，錯誤。","貓（cat）是典型的誘導性排卵動物，需要交配刺激才能排卵，此為正確答案。","牛（cattle）是自發性排卵動
