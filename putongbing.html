<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>獸醫普通疾病學題庫</title>
<style>
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:#2e3347;--border2:#3d4260;
  --text:#e8eaf6;--text2:#9096b8;--text3:#555d80;
  --accent:#5c6bc0;--accent2:#7986cb;
  --green:#43a867;--green-bg:#0d2318;--green-border:#1e4d32;
  --red:#e05252;--red-bg:#250f0f;--red-border:#4d1f1f;
  --yellow:#f0c060;--yellow-bg:rgba(240,192,96,.08);--yellow-border:rgba(240,192,96,.3);
  --r:10px;--rs:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh;padding:1.5rem 1rem}
.wrap{max-width:740px;margin:0 auto}
.hdr{margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1.25rem;position:relative}
.btn-clr-bottom{display:block;margin:1.5rem auto 0;background:none;border:1px solid #2d3548;border-radius:8px;padding:8px 20px;font-size:.78rem;color:#475569;cursor:pointer;transition:color .15s,border-color .15s}
.btn-clr-bottom:hover{color:var(--red);border-color:var(--red)}
.hdr-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.mono{font-family:"Courier New",Courier,monospace}
.lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
h1{font-size:21px;font-weight:700;line-height:1.3}
.sub{font-size:12px;color:var(--text3);margin-top:4px}
.stats{display:flex;gap:8px}
.st{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;text-align:center;min-width:56px}
.st-n{font-size:18px;font-weight:700;font-family:"Courier New",monospace}
.st-l{font-size:10px;color:var(--text3);margin-top:2px}
.ctrl{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.csel{flex:1;min-width:180px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;cursor:pointer}
.csel:focus{outline:none;border-color:var(--accent)}
.modes{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:4px}
.mb{flex:1;padding:7px 10px;font-size:13px;border-radius:7px;border:none;background:transparent;color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s}
.mb:hover{color:var(--text)}
.mb.on{background:var(--bg3);color:var(--text);font-weight:500}
.pb{height:3px;background:var(--border);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;margin-bottom:1rem}
.meta{display:flex;align-items:center;gap:7px;margin-bottom:.9rem;flex-wrap:wrap}
.bdg{font-size:11px;padding:3px 9px;border-radius:20px;font-family:"Courier New",monospace}
.bdg-yr{background:rgba(92,107,192,.2);color:var(--accent2);border:1px solid rgba(92,107,192,.3)}
.bdg-src{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.bdg-rv{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border)}
.qn{font-size:12px;color:var(--text3);margin-left:auto;font-family:"Courier New",monospace}
.qt{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{padding:11px 13px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:14px;color:var(--text2);transition:.15s;display:flex;gap:9px;align-items:flex-start;line-height:1.6;background:var(--bg)}
.opt:hover:not(.dis){border-color:var(--border2);color:var(--text);background:var(--bg3)}
.opt.ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.opt.no{border-color:var(--red-border);background:var(--red-bg);color:#f08080;cursor:pointer}
.opt.dis{cursor:default}
.okey{font-weight:700;min-width:18px;flex-shrink:0;font-family:"Courier New",monospace;font-size:13px}
.exp{margin-top:.9rem;padding:13px 15px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.exp.show{display:block}
.exp-t{font-weight:700;color:var(--accent2);margin-bottom:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.wexp{margin-top:.6rem;padding:11px 14px;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;font-size:13px;color:var(--text2);line-height:1.8;display:none}
.wexp.show{display:block}
.wexp-t{font-weight:700;color:#f08080;margin-bottom:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:"Courier New",monospace}
.act{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;gap:8px}
.btn{padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border2);background:var(--bg3);font-size:13px;color:var(--text2);cursor:pointer;transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn:disabled{opacity:.3;cursor:default}
.btnp{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btnp:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.res{text-align:center;padding:2.5rem 1rem}
.res-s{font-size:52px;font-weight:700;font-family:"Courier New",monospace}
.res-sub{font-size:13px;color:var(--text3);margin-top:5px}
.res-row{display:flex;gap:2rem;justify-content:center;margin:1.25rem 0}
.ri{text-align:center}
.rn{font-size:22px;font-weight:700;font-family:"Courier New",monospace}
.rl{font-size:12px;color:var(--text3);margin-top:3px}
.grn{color:var(--green)}.red{color:var(--red)}
.note-box{margin-top:.6rem;padding:10px 14px;background:var(--yellow-bg);border-left:3px solid var(--yellow-border);border-radius:0 var(--rs) var(--rs) 0;font-size:12px;color:var(--yellow);line-height:1.7}
.foot{text-align:center;margin-top:2.5rem;font-size:11px;color:var(--text3);font-family:"Courier New",monospace;border-top:1px solid var(--border);padding-top:1.25rem}
.q-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:.75rem 0 .25rem}
.q-imgs img{max-width:100%;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg3);cursor:pointer}
.q-imgs img:hover{border-color:var(--border2)}
.nav-wrap{margin-bottom:1rem}
.nav-hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;user-select:none}
.nav-hdr:hover{border-color:var(--border2)}
.nav-title{font-size:12px;color:var(--text2);font-family:"Courier New",monospace;letter-spacing:.05em}
.nav-arrow{font-size:10px;color:var(--text3);transition:transform .2s}
.nav-arrow.open{transform:rotate(180deg)}
.nav-grid{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:160px;overflow-y:auto}
.nav-grid.hidden{display:none}
.qnb{width:34px;height:30px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text3);font-size:11px;font-family:"Courier New",monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.qnb:hover{border-color:var(--accent2);color:var(--text)}
.qnb.cur{border-color:var(--accent2);background:var(--accent);color:#fff;font-weight:700}
.qnb.ans-ok{border-color:var(--green-border);background:var(--green-bg);color:#7dd9a4}
.qnb.ans-ok.cur{background:var(--green);color:#fff}
.qnb.ans-no{border-color:var(--red-border);background:var(--red-bg);color:#f08080}
.qnb.ans-no.cur{background:var(--red);color:#fff}
.opt.peek{cursor:pointer;border-color:var(--yellow-border);color:var(--text2)}
.opt.peek:hover{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.07);color:var(--text)}
.opt.peek-active{border-color:rgba(240,192,96,.6) !important;background:rgba(240,192,96,.1) !important;color:var(--text) !important}
@media(max-width:480px){
  h1{font-size:18px}
  .st{padding:6px 9px;min-width:48px}.st-n{font-size:16px}
  .mb{font-size:12px;padding:6px 6px}
  .qt{font-size:14px}
  .qnb{width:30px;height:28px;font-size:10px}
}
.btn-ai{background:rgba(121,134,203,.15);border-color:rgba(121,134,203,.3);color:var(--accent2)}
.btn-ai:hover{background:rgba(121,134,203,.25);color:var(--text);border-color:var(--accent)}
.ec-badge{background:rgba(240,96,96,.2);color:#f08080;border:1px solid rgba(240,96,96,.3)}
.btn-clr{padding:5px 10px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;letter-spacing:.03em}
.btn-clr:hover{color:var(--red);border-color:var(--red-border)}
.btn-exam{padding:7px 14px;border-radius:var(--rs);border:1px solid rgba(92,107,192,.4);background:rgba(92,107,192,.15);font-size:13px;color:var(--accent2);cursor:pointer;transition:.15s;font-weight:500;white-space:nowrap}
.btn-exam:hover{background:rgba(92,107,192,.28);color:var(--text);border-color:var(--accent)}
.btn-star{width:38px;height:38px;border-radius:50%;border:1px solid #2d3548;background:transparent;color:#475569;cursor:pointer;font-size:19px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;line-height:1;padding:0}
.btn-star:hover{color:var(--yellow);border-color:var(--yellow-border)}
.btn-star.active{color:var(--yellow);border-color:var(--yellow-border);background:var(--yellow-bg)}
.btn-star.invis{opacity:0;pointer-events:none}
.qnb.ans-unsure{border-color:rgba(240,192,96,.5);background:rgba(240,192,96,.08);color:var(--yellow)}
.qnb.ans-unsure.cur{background:var(--yellow);color:#0f1117;font-weight:700}
.unsure-tag{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-border);font-size:13px;letter-spacing:.02em}
.wrong-tag{background:rgba(224,82,82,.15);color:#f08080;border:1px solid var(--red-border)}
.fc-container{margin-bottom:1.2rem}
.fc-container>.fc-wrap{margin-bottom:0;border-radius:var(--r) var(--r) 0 0}
.fc-container>.fc-wrap .fc-front,.fc-container>.fc-wrap .fc-back{border-radius:var(--r) var(--r) 0 0;border-bottom-color:transparent}
.fc-note{border:1px solid var(--border);border-radius:0 0 var(--r) var(--r);padding:.85rem 1.1rem;background:var(--bg)}
.fc-note-hdr{display:flex;align-items:center;gap:8px;margin-bottom:.55rem;flex-wrap:wrap}
.fc-note-label{font-size:11px;color:var(--text3);font-family:"Courier New",monospace;flex:1}
.fc-note-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:13px;line-height:1.7;padding:8px 10px;resize:vertical;min-height:56px;font-family:inherit}
.fc-note-ta::placeholder{color:var(--text3)}
.fc-note-ta:focus{outline:none;border-color:var(--accent)}
.btn-note-img{padding:3px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:11px;color:var(--text2);cursor:pointer;font-family:"Courier New",monospace;transition:.15s;display:inline-block}
.btn-note-img:hover{border-color:var(--accent2);color:var(--text)}
.note-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:.55rem}
.note-img-wrap{position:relative}
.note-img-wrap img{width:72px;height:56px;object-fit:cover;border-radius:var(--rs);border:1px solid var(--border);cursor:zoom-in;display:block}
.note-img-wrap img:hover{border-color:var(--accent2)}
.note-img-del{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.us-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;z-index:1000;overflow-y:auto}
.us-box{width:100%;max-width:400px}
.us-title{font-size:20px;font-weight:700;margin:1rem 0 1.5rem;text-align:center}
.us-lbl{font-size:11px;color:var(--accent2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.75rem;font-family:"Courier New",monospace}
.us-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.55rem;cursor:pointer;transition:.15s}
.us-item:hover{border-color:var(--accent2);background:var(--bg3)}
.us-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;color:#fff}
.us-uname{font-size:14px;font-weight:600;flex:1}
.us-del{padding:4px 8px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text3);cursor:pointer;transition:.15s}
.us-del:hover{color:var(--red);border-color:var(--red-border)}
.us-new{display:flex;gap:8px;margin-top:1rem}
.us-input{flex:1;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-size:14px}
.us-input:focus{outline:none;border-color:var(--accent)}
.us-cur{font-size:11px;color:var(--text3);display:inline-flex;align-items:center;gap:6px}
.us-cur-name{color:var(--accent2);font-weight:500}
.btn-sw{padding:2px 8px;border-radius:20px;border:1px solid var(--border2);background:transparent;font-size:10px;color:var(--text3);cursor:pointer;font-family:"Courier New",monospace;transition:.15s}
.btn-sw:hover{color:var(--accent2);border-color:var(--accent)}
.fc-wrap{cursor:pointer;margin-bottom:1rem}
.fc-front,.fc-back{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.4rem;transition:opacity .2s}
.fc-back{border-color:var(--green-border);background:var(--green-bg);display:none}
.fc-wrap.flipped .fc-front{display:none}
.fc-wrap.flipped .fc-back{display:block}
.fc-hint{font-size:11px;color:var(--text3);text-align:center;padding:.35rem 0 .1rem;font-family:"Courier New",monospace;letter-spacing:.04em}
.sp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;margin-bottom:.75rem}
.sp-q{font-size:14px;color:var(--text);margin-bottom:.6rem;line-height:1.7}
.sp-ans{font-size:13px;color:var(--green);margin-bottom:.5rem;font-weight:600}
.sp-exp{font-size:12px;color:var(--text2);line-height:1.75}
.sp-wrong{font-size:12px;color:#f08080;margin-top:.5rem;padding:.6rem .75rem;background:rgba(239,83,80,.07);border-left:3px solid var(--red-border);border-radius:0 var(--rs) var(--rs) 0;line-height:1.7}
</style>
</head>

<div id="main-app" style="display:none">
<div class="wrap">
<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="lbl mono"><a href="./index.html" style="color:inherit;text-decoration:none;opacity:.7">獸醫師國考</a> · 獸醫普通疾病學 · 官方歷屆題</div>
      <h1>普通疾病學 歷屆國考題庫</h1>
      <div class="sub">共 <span id="qtotal">0</span> 題 · v1 · <span class="us-cur"><span class="us-cur-name" id="cur-user-name"></span><button class="btn-sw" onclick="logout()">登出</button><button class="btn-sw" onclick="deleteOwnAccount()" style="color:var(--red);border-color:var(--red-border);margin-left:2px">刪除帳號</button></span></div>
    </div>
    <div class="stats">
      <div class="st"><div class="st-n mono" id="sd">0</div><div class="st-l">已答</div></div>
      <div class="st"><div class="st-n mono" id="sc">0</div><div class="st-l">答對</div></div>
      <div class="st"><div class="st-n mono" id="sa">&#x2014;</div><div class="st-l">正確率</div></div>
    </div>
  </div>
</div>
<div class="ctrl">
  <select class="csel" id="yrsel" onchange="setFilter(this.value)">
    <option value="all">全部年份</option>
  </select>
  <div class="modes">
    <button class="mb on" id="m0" onclick="setM(0)">選擇題</button>
    <button class="mb" id="m1" onclick="setM(1)">字卡</button>
    <button class="mb" id="m2" onclick="setM(2)">重點</button>
  </div>

</div>
<div class="pb"><div class="pf" id="pf" style="width:0%"></div></div>
<div class="nav-wrap">
  <div class="nav-hdr" onclick="toggleNav()">

    <span class="nav-arrow" id="nav-arrow">&#9660;</span>
  </div>
  <div class="nav-grid hidden" id="nav-grid"></div>
</div>

</div>

<script>
const ALL_QS=[{"id":"AMO_2015_1_普通病_001","year":2015,"roc_year":104,"session":"","examNo":1,"q":"關於馬急性下痢，下列敘述何項最正確？","opts":["A. 通常為急性小腸捻轉引起","B. 因嚴重發炎，血檢呈現高蛋白血症","C. 馬通常呈現發燒、脫水、內毒素血症或腎前性氮血症","D. 離子不平衡，呈現急性代謝性鹼血症"],"ans":2,"exp":"馬急性下痢（acute diarrhea）最正確描述：馬通常呈現發燒、脫水、內毒素血症（endotoxemia）或腎前性氮血症（prerenal azotemia）。急性下痢多因沙門桿菌、柔嫩梭菌等引起，大量液體流失導致嚴重脫水和電解質不平衡。","we":["A. 急性下痢不是小腸捻轉的典型表現，小腸捻轉主要引起腹痛和腸管缺血。","B. 嚴重腸炎反而因蛋白質流失（protein-losing enteropathy）導致低蛋白血症，非高蛋白血症。","D. 急性下痢因HCO3-流失引起代謝性酸中毒，非鹼血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_002","year":2015,"roc_year":104,"session":"","examNo":2,"q":"一匹馬呈發燒，些許鼻分泌物，呼吸淺，咳嗽，行走時僵硬疼痛狀，口腔黏膜呈暗紅色，聽\r 診肺部可聽見磨擦音，叩診肺部時可於近腹側聽見鈍音，此匹馬最可能罹患下列何項疾病？","opts":["A. recurrent airway obstruction","B. septic pleuritis","C. arytenoid chondritis","D. pharyngeal lymphoid hyperplasia"],"ans":1,"exp":"馬呈發燒+鼻分泌物+淺呼吸+僵硬+暗紅色黏膜+胸膜摩擦音+腹側鈍音，是膿胸（septic pleuritis）的典型表現。胸膜摩擦音（friction rub）表示胸膜發炎，腹側鈍音表示胸腔積液，全身性敗血症引起發燒和暗紅黏膜。","we":["A. 再發性氣道阻塞（RAO）主要表現為呼氣性呼吸困難和乾性咳嗽，無膿胸的全身症狀。","C. 喉頭軟骨炎（arytenoid chondritis）引起上呼吸道阻塞，無胸腔積液徵象。","D. 咽喉淋巴組織增生主要引起上呼吸道症狀，無全身敗血症表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_003","year":2015,"roc_year":104,"session":"","examNo":3,"q":"下圖是一匹馬蹄部的影像，此匹馬最可能罹患下列何項疾病？","opts":["A. 舟骨病（Navicular disease）","B. 白線病","C. 嚴重腐蹄病","D. 蹄葉炎"],"ans":3,"exp":"（圖像題）馬蹄部影像顯示蹄骨旋轉（pedal bone rotation）和蹄底下陷，為蹄葉炎（laminitis）慢性期的典型X光表現。蹄葉炎引起蹄小葉（laminae）血流障礙，導致蹄骨旋轉和下沉。","we":["A. 舟骨病X光主要顯示舟狀骨硬化或囊性變，非蹄骨旋轉。","B. 白線病為蹄壁與蹄底分離，無明顯蹄骨旋轉。","C. 嚴重腐蹄病（foot rot）以組織壞死為主，蹄骨形態通常正常。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_1_普通病_004","year":2015,"roc_year":104,"session":"","examNo":4,"q":"馬腹正中線切開後，應該會看到的腹腔器官為下列何項？（此器官在腹腔手術時通常作為臟\r 器相對位置的參考指標）","opts":["A. 胃","B. 小腸","C. 盲腸","D. 肝"],"ans":2,"exp":"馬腹正中線切開後，首先看到並作為臟器相對位置參考指標的腹腔器官是盲腸（cecum）。馬的盲腸位於右腹腔，緊鄰中線，頭端（apex）朝向腹壁，是腹腔手術時最易看到且常用作定位參考的器官。","we":["A. 馬的胃位於左上腹，緊靠橫膈膜，腹正中切開時不易直接看見。","B. 小腸在腹腔中分布廣泛，不是固定的解剖標誌。","D. 肝臟位於橫膈膜後方，正中切開時暴露有限，不作為定位參考。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_005","year":2015,"roc_year":104,"session":"","examNo":5,"q":"執行馬的掌趾神經切斷術（palmar digital neurectomy）時，需避開與此神經平行走向之動脈\r 及靜脈，此三者自背側（dorsal）至掌側（palmar）的排序為","opts":["A. 神經，動脈，靜脈","B. 靜脈，動脈，神經","C. 動脈，靜脈，神經","D. 神經，靜脈，動脈"],"ans":1,"exp":"執行馬掌趾神經切斷術時，在蹄踵部位，自背側（dorsal）至掌側（palmar）的排序為：靜脈（vein）→動脈（artery）→神經（nerve）。此VAN順序是重要的解剖知識，神經位於最掌側，手術時需辨識並保護血管。","we":["A. 神經/動脈/靜脈（NAN）排序錯誤，神經實際位於最掌側。","C. 動脈/靜脈/神經排序亦不符合解剖學描述。","D. 神經/靜脈/動脈排序錯誤，靜脈和動脈的位置被誤置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_006","year":2015,"roc_year":104,"session":"","examNo":6,"q":"牛心包膜炎（pericarditis）之主要臨床症狀，下列何者錯誤？","opts":["A. 心搏過速（tachycardia）","B. 心音低沉（muffling of heart sound）","C. 腹側（ventral thorax）肺音比正常響（louder）","D. 背側（dorsal）肺音比正常響"],"ans":3,"exp":"牛心包炎（pericarditis）的主要臨床症狀中，「背側（dorsal）肺音比正常響」是錯誤的。心包炎積液壓迫肺臟，腹側（ventral）肺音因積液而減弱（濁音），背側肺音可能代償性增加，但「比正常響」的描述不精確。正確症狀包括心搏過速、心音低沉、腹側肺音減弱。","we":["A. 心搏過速（tachycardia）因心輸出量下降、代償性心跳加速，是心包炎正確症狀。","B. 心音低沉（muffling）因心包積液隔音，是創傷性心包炎的典型表現。","C. 腹側肺音比正常響（代償）雖有爭議，但腹側積液導致鈍音是正確描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_007","year":2015,"roc_year":104,"session":"","examNo":7,"q":"牛進行支氣管肺泡沖洗術（bronchoalveolar lavage）時，下列敘述何項錯誤？","opts":["A. 以2%之利多卡因（lidocaine）注射液進行氣管麻醉","B. 以利多卡因進行皮膚局部麻醉，其量約少於3ml","C. 每次打入氣管內之無菌生理鹽水之量約在20－30ml之間","D. 容易造成皮下氣腫（subcutaneous emphysema）"],"ans":3,"exp":"牛支氣管肺泡沖洗術（BAL）敘述中，「容易造成皮下氣腫（subcutaneous emphysema）」是錯誤的。BAL通過導管進行，很少引起皮下氣腫；皮下氣腫是氣管切開術（tracheotomy）的可能併發症，不是BAL的常見問題。","we":["A. 以2% lidocaine進行氣管表面麻醉，減少咳嗽反射，是BAL的標準操作，正確。","B. 皮膚局部麻醉使用少量lidocaine（<3ml），正確。","C. 每次注入20-30ml無菌生理鹽水，分次沖洗，是BAL的標準技術，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_008","year":2015,"roc_year":104,"session":"","examNo":8,"q":"有關牛乳房水腫（udder edema）之敘述何者錯誤？","opts":["A. 有可能是病理性的","B. 生理性乳房水腫通常是單側性的","C. 常發生在第一產的女牛","D. 治療時可以考慮利尿劑"],"ans":1,"exp":"乳房水腫（udder edema）敘述中，「生理性乳房水腫通常是單側性的」是錯誤的。生理性乳房水腫（physiological udder edema）通常是「雙側性」的，在分娩前後出現，是正常生理現象，因乳腺血液和淋巴流量增加所致，常見於初產牛。","we":["A. 乳房水腫有可能是病理性的（如心衰竭、低蛋白血症引起），正確。","C. 生理性乳房水腫常發生在第一產（初產牛），正確。","D. 嚴重乳房水腫可考慮使用利尿劑（如furosemide）輔助治療，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_009","year":2015,"roc_year":104,"session":"","examNo":9,"q":"下列有關牛傳染性乳房炎之敘述，何者錯誤？","opts":["A. 已感染的乳房（腺）是傳染性乳房炎病原之傳染窩（reservoir）","B. 其傳染方式主要是在榨乳舍，將病原由一個乳房（腺）傳染到另一個乳房（腺）","C. Corynebacterium bovis為次要之牛隻傳染性乳房炎之病原","D. 抗生素治療為控制傳染性乳房炎傳染之唯一手段"],"ans":3,"exp":"傳染性乳房炎（contagious mastitis）敘述中，「抗生素治療為控制傳染性乳房炎傳染之唯一手段」是錯誤的。控制傳染性乳房炎需要多種措施：榨乳衛生（乳頭消毒）、淘汰慢性感染牛、乾乳期治療、加強環境管理等，抗生素只是其中一項手段。","we":["A. 已感染的乳房是傳染性乳房炎病原的傳染窩（reservoir），正確。","B. 榨乳舍是主要傳播場所，病原透過榨乳設備、手等傳播，正確。","C. Corynebacterium bovis為次要傳染性乳房炎病原，正確（主要病原為S. agalactiae等）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_010","year":2015,"roc_year":104,"session":"","examNo":10,"q":"牛第四胃右側異位的發病原因中，下列何項較為少見？","opts":["A. 第四胃弛緩","B. 精料多給而粗料不足","C. 幽門狹窄","D. 第四胃粘連"],"ans":3,"exp":"牛第四胃右側異位（RDA）/捻轉的發病原因中，「第四胃粘連（adhesion）」較為少見。RDA的常見病因包括：第四胃弛緩（hypomotility）、精料過多粗料不足（導致快速發酵和氣體產生）、幽門狹窄等；粘連通常是其他疾病的繼發結果，不是RDA的主要原因。","we":["A. 第四胃弛緩（hypomotility）是最重要的易感因素，正確。","B. 精料多、粗料不足導致瘤胃pH下降、VFA積聚，影響第四胃蠕動，正確。","C. 幽門狹窄（pyloric stenosis）導致第四胃內容物積聚和氣體產生，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_011","year":2015,"roc_year":104,"session":"","examNo":11,"q":"下列何項不是牛隻維生素E及硒缺乏之症狀？","opts":["A. 胎衣滯留","B. 呼吸困難","C. 起立困難","D. 尿毒症"],"ans":3,"exp":"牛隻維生素E及硒缺乏（白肌病，white muscle disease）的症狀中，「尿毒症（uremia）」不是其症狀。白肌病主要引起骨骼肌和心肌壞死，表現為胎衣滯留（免疫功能下降）、呼吸困難（心肌損傷）、起立困難（肌肉無力），不引起腎臟功能衰竭。","we":["A. 胎衣滯留因中性球功能受損（維生素E是抗氧化劑，缺乏時免疫功能下降），正確症狀。","B. 呼吸困難因心肌（心臟白肌病）受損引起心力衰竭，正確。","C. 起立困難因骨骼肌（尤其是大腿和背部肌肉）壞死引起虛弱，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_012","year":2015,"roc_year":104,"session":"","examNo":12,"q":"反芻動物攝食過多高度醱酵的飼料之後，瘤胃中那一種細菌的數量會顯著增加？","opts":["A. 牛鏈球菌（Streptococcus bovis）","B. 無乳鏈球菌（Streptococcus agalactiae）","C. 異乳鏈球菌（Streptococcus dysgalactiae）","D. 大腸桿菌（Escherichia coli）"],"ans":0,"exp":"反芻動物攝食過多高度醱酵飼料（穀物、玉米等高澱粉飼料）後，瘤胃中「牛鏈球菌（Streptococcus bovis）」數量顯著增加。S. bovis在高澱粉環境下大量繁殖，分解澱粉產生乳酸，使瘤胃pH急劇下降，引起急性瘤胃乳酸中毒（ruminal lactic acidosis）。","we":["B. 無乳鏈球菌（S. agalactiae）是乳房炎病原，不特別在高醱酵飼料環境下增加。","C. 異乳鏈球菌（S. dysgalactiae）也是乳房炎相關病原，非瘤胃乳酸中毒的主要菌。","D. 大腸桿菌（E. coli）不是瘤胃中主要的澱粉發酵菌，高澱粉飼料不特別增加其數量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_013","year":2015,"roc_year":104,"session":"","examNo":13,"q":"牛罹患嚴重瘤胃鹼中毒症時，其瘤胃液有何味道？","opts":["A. 酮臭味","B. 氨臭味","C. 芳香味","D. 酸臭味"],"ans":1,"exp":"牛嚴重瘤胃鹼中毒症（ruminal alkalosis）時，瘤胃液有「氨臭味（ammonia odor）」。過量蛋白質或非蛋白氮（如尿素）在瘤胃中過度醱酵，產生大量氨（NH3），使瘤胃pH升高至鹼性，散發強烈氨臭味，並可導致氨中毒（ammonia toxicosis）。","we":["A. 酮臭味（acetone/fruity odor）是酮病（ketosis）的特徵，瘤胃液非典型。","C. 芳香味是正常或健康瘤胃液的特徵（揮發性脂肪酸發酵香味）。","D. 酸臭味是瘤胃乳酸中毒（lactic acidosis）的特徵，與鹼中毒相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_014","year":2015,"roc_year":104,"session":"","examNo":14,"q":"引起牛類風濕關節炎之原因乃是身體抗體與下列何種變異抗原形成複合體所造成一連串身體\r 反應所致？","opts":["A. IgA","B. IgE","C. IgG","D. IgM"],"ans":2,"exp":"牛類風濕關節炎（rheumatoid arthritis）的發病機制：身體的類風濕因子（rheumatoid factor, RF）是抗「變異IgG（modified IgG）」的抗體，RF（主要為IgM型）與變異IgG結合形成免疫複合物，活化補體，引起關節滑膜炎症。IgG是RF的靶抗原。","we":["A. IgA主要在黏膜免疫中發揮作用，不是類風濕因子的靶抗原。","B. IgE主要介導第I型過敏反應（過敏/過敏性疾病），不是類風濕關節炎的機制。","D. IgM雖然可作為RF，但IgM本身不是類風濕關節炎中「變異抗原」的角色。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_015","year":2015,"roc_year":104,"session":"","examNo":15,"q":"以飼糧陽陰離子差（dietary cation-anion difference）的觀念及方法可以預防乳牛產後發生乳\r 熱（milk fever），在最佳控制效果下的尿液pH值應是多少？","opts":["A. 5.0－6.0","B. 6.0－7.0","C. 7.0－8.0","D. 8.0－9.0"],"ans":0,"exp":"以飼糧陽陰離子差（DCAD）方法預防乳牛乳熱（milk fever）：最佳控制效果下，尿液pH應維持在5.0-6.0之間。降低DCAD值使奶牛輕度代謝性酸中毒（compensated metabolic acidosis），可激活PTH受體和增強鈣的腸道吸收，有效預防分娩後低血鈣症。","we":["B. 尿液pH 6.0-7.0表示DCAD控制不足，未達到足夠的酸化效果。","C. 尿液pH 7.0-8.0偏鹼性，表示DCAD干預失敗，低鈣血症風險高。","D. 尿液pH 8.0-9.0強鹼性，完全無DCAD干預效果，乳熱風險最高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_016","year":2015,"roc_year":104,"session":"","examNo":16,"q":"牛肺部有血漿成分滲漏至肺間質及支氣管內為下列何種疾病的特徵？","opts":["A. 肺炎","B. 肺氣腫","C. 肺水腫","D. 肺充血"],"ans":2,"exp":"牛肺部血漿成分滲漏至肺間質及支氣管內，是「肺水腫（pulmonary edema）」的定義性特徵。肺水腫時，毛細血管靜水壓升高或通透性增加，血漿成分（蛋白液）滲出至肺間質腔和細支氣管腔，影響氣體交換。","we":["A. 肺炎（pneumonia）的特徵是肺實質的炎症和實變，而非單純血漿滲出。","B. 肺氣腫（emphysema）是肺泡腔擴大和壁破壞，無血漿滲出。","D. 肺充血（hyperemia）是肺部血流增加，血管充盈，無大量液體外滲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_017","year":2015,"roc_year":104,"session":"","examNo":17,"q":"牛飼糧缺乏纖維質時，其瘤胃運動次數會有下列何項變化？","opts":["A. 增加","B. 減少","C. 不變","D. 消失"],"ans":1,"exp":"牛飼糧缺乏纖維質時，瘤胃運動次數「減少」。纖維質是刺激瘤胃蠕動的主要機械性因素，纖維不足導致瘤胃充盈感降低，機械性刺激受體減少，瘤胃蠕動頻率下降，咀嚼反芻時間縮短，影響消化功能。","we":["A. 纖維質增加才會刺激瘤胃蠕動增加，缺乏纖維質不會增加蠕動。","C. 纖維質缺乏對瘤胃運動有明確影響，並非不變。","D. 瘤胃運動消失是嚴重疾病（如迷走神經消化不良）的表現，非單純纖維缺乏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_018","year":2015,"roc_year":104,"session":"","examNo":18,"q":"仔牛皺胃潰瘍主要發生在胃的那個部分？","opts":["A. 胃底部","B. 胃大彎","C. 幽門部","D. 平均分布"],"ans":2,"exp":"仔牛皺胃潰瘍（abomasal ulcer in calves）主要發生在「幽門部（pyloric region）」。幽門部胃酸濃度最高，加上幽門括約肌收縮時局部缺血，使幽門區最易受到胃酸侵蝕而形成潰瘍，是仔牛（尤其哺乳期）最常見的潰瘍部位。","we":["A. 胃底部（fundus）富含壁細胞分泌鹽酸，但潰瘍不如幽門部常見。","B. 胃大彎（greater curvature）不是仔牛皺胃潰瘍的典型好發位置。","D. 均勻分布不符合臨床觀察，仔牛潰瘍以幽門部最集中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_019","year":2015,"roc_year":104,"session":"","examNo":19,"q":"下列對牛隻白線病之描述何者錯誤？","opts":["A. 會由慢性蹄葉炎引起","B. 嚴重時會引起蹄底與蹄壁分離","C. 僅會引起蹄底潰瘍而已","D. 在蹄質脆弱時亦會引起"],"ans":2,"exp":"牛白線病（white line disease）敘述中，「僅會引起蹄底潰瘍而已」是錯誤的。白線病是蹄壁與蹄底交界的白線（white zone）分離，可引起：蹄壁與蹄底分離（sole separation）、異物進入引起深部感染（deep sepsis）、甚至P3蹄骨感染，不僅限於蹄底潰瘍。","we":["A. 白線病確實可由慢性蹄葉炎引起（血流障礙影響白線角質形成），正確。","B. 嚴重時蹄底與蹄壁分離是白線病的主要病理表現，正確。","D. 蹄質脆弱（如缺乏生物素、鋅）時白線強度下降，易發生白線病，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_020","year":2015,"roc_year":104,"session":"","examNo":20,"q":"下列何者為牛腸繫膜脂肪壞死症（mesenteric fat necrosis）導致腸不完全阻塞的常見症狀？","opts":["A. 腹圍縮小","B. 異嗜","C. 腹圍擴張","D. 下痢"],"ans":2,"exp":"牛腸繫膜脂肪壞死症（mesenteric fat necrosis）引起腸不完全阻塞時，常見症狀是「腹圍擴張（abdominal distension）」。腸管部分阻塞導致腸道氣體和液體積聚，無法正常通過，引起腹部脹大，可同時伴有慢性腹痛、糞便量減少和食慾下降。","we":["A. 腹圍縮小不是腸阻塞的表現，完全相反，阻塞導致脹氣擴張。","B. 異嗜（pica）是礦物質缺乏的行為表現，非腸不完全阻塞的主要症狀。","D. 下痢是腸道加速排空（非阻塞）或炎症的表現，不完全阻塞通常便秘或無糞便。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_021","year":2015,"roc_year":104,"session":"","examNo":21,"q":"母牛發生下列何種情況時，應避免以偃臥（dorsal recumbency）方式進行第四胃異位治療手\r 術？","opts":["A. 呼吸困難","B. 低血鈣","C. 酮症","D. 第四胃左側異位"],"ans":0,"exp":"母牛進行第四胃異位偃臥（dorsal recumbency）手術時，「呼吸困難（dyspnea）」是主要禁忌症。偃臥時腹部器官壓向橫膈膜，進一步限制肺擴張，對已有呼吸困難的母牛可能引起呼吸衰竭，是最危險的禁忌情況。","we":["B. 低血鈣（hypocalcemia）可用鈣劑治療，不是偃臥術的絕對禁忌。","C. 酮症（ketosis）是代謝問題，可術前處理，不是偃臥術的主要禁忌。","D. 第四胃左側異位（LDA）反而是偃臥術的適應症（利用重力使皺胃復位），非禁忌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_022","year":2015,"roc_year":104,"session":"","examNo":22,"q":"複選題 22.下列有關以滾牛（rolling）方式矯正牛第四胃異位的敘述，何者錯誤？","opts":["A. 矯正原理是利用氣體浮動間接促使第四胃回到正確位置","B. 比開腹術有較少的腹膜炎併發症","C. 可應用於左側及右側異位","D. 可以增加子宮炎母牛子宮內分泌物排出"],"ans":3,"exp":"滾牛（rolling）法矯正牛第四胃異位的敘述中，「可以增加子宮炎母牛子宮內分泌物排出」是錯誤的。滾牛法是將母牛滾動以利用重力和氣體浮動促使皺胃復位，對子宮沒有特殊治療效果，且子宮炎患牛滾動可能有風險。","we":["A. 矯正原理利用氣體浮動間接促使第四胃回到正確位置，正確。","B. 比開腹術有較少腹膜炎風險（無手術傷口），正確。","C. 可應用於左側（LDA）及右側異位（RDA）矯正嘗試，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_023","year":2015,"roc_year":104,"session":"","examNo":23,"q":"下列有關乳牛疾病的敘述中，何者不屬於栓釘固定術（toggle pin）治療乳牛第四胃異位的禁\r 忌？","opts":["A. 低血鈣","B. 盲腸積氣","C. 瀰漫性肺炎","D. 瘤胃積氣"],"ans":0,"exp":"栓釘固定術（toggle pin/Grymer-Sterner technique）治療LDA的禁忌症包括：懷疑皺胃捻轉（volvulus）、腹膜炎、盲腸積氣（可能誤診為LDA）、瘤胃積氣（混淆診斷）。「低血鈣（hypocalcemia）」不是toggle pin的禁忌症，可同時靜脈補鈣治療。","we":["B. 盲腸積氣是禁忌症，因為可能與LDA混淆，且需要單獨治療。","C. 瀰漫性肺炎影響手術耐受性和預後，是相對禁忌。","D. 瘤胃積氣需先處理，且會影響皺胃的位置判斷，是禁忌症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_024","year":2015,"roc_year":104,"session":"","examNo":24,"q":"以xylazine進行一頭約600公斤成牛的手術前鎮靜，下列那一種劑量可以提供鎮靜作用，又不\r 會讓牛躺臥下來？","opts":["A. 0.02 mg/kg，IV","B. 0.2 mg/kg，IV","C. 0.4 mg/kg，IV","D. 1.0 mg/kg，IV"],"ans":0,"exp":"牛對xylazine非常敏感，約為馬的10倍敏感度。600公斤成牛若要維持站立的鎮靜劑量，xylazine IV應使用約0.02-0.05 mg/kg。0.02 mg/kg IV可達到鎮靜效果而不使牛倒地；0.1 mg/kg以上IV通常會使牛躺臥。","we":["B. 0.2 mg/kg IV對牛劑量過大，會導致深度鎮靜並倒地。","C. 0.4 mg/kg IV遠超出站立鎮靜劑量，牛必然倒地。","D. 1.0 mg/kg IV是馬的鎮靜劑量，對牛將引起深度麻醉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_025","year":2015,"roc_year":104,"session":"","examNo":25,"q":"下列何者是乳牛尾椎硬膜外麻醉之最佳注射部位？","opts":["A. 第一、二尾椎間","B. 第二、三尾椎間","C. 第三、四尾椎間","D. 第四、五尾椎間"],"ans":0,"exp":"乳牛尾椎硬膜外麻醉（caudal epidural anesthesia）的最佳注射部位是「第一、二尾椎間（Co1-Co2）」。此處脊髓已終止，安全性高，進針時尾巴可自由活動，易確認正確位置，是牛硬膜外麻醉的標準注射點。","we":["B. 第二三尾椎間位置太遠，麻藥不易擴散至薦椎水平。","C. 第三四尾椎間更遠，注射後效果不確定。","D. 第四五尾椎間距離骶椎太遠，麻藥無法充分擴散至目標神經。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_026","year":2015,"roc_year":104,"session":"","examNo":26,"q":"下列有關乳牛帝王切開術（Cesarean section）開創部位在左、右腹脇部差異點的考量，何\r 者正確？","opts":["A. 小牛大多位於右側子宮角","B. 右側腹腔有較大空間保定子宮","C. 於右側開創，腸道容易溢滑出創口","D. 子宮較難從右腹脇部保定"],"ans":0,"exp":"乳牛帝王切開術左右腹脇部差異：牛的胎兒（小牛）大多位於「右側子宮角（right uterine horn）」，因此右腹脇部切開更容易直接接近胎兒。左側切開較常用是因為左側腹腔空間更大且腸管較少干擾，但小牛位置是重要考量因素。","we":["B. 右側腹腔空間不一定比左側大，左側通常更容易操作。","C. 右側開創腸道容易溢出是缺點而非考量，且左側更易操作。","D. 子宮從右腹脇部較容易保定（因胎兒在右），不是難以保定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_027","year":2015,"roc_year":104,"session":"","examNo":27,"q":"分布於牛左腹脇凹陷處（left paralumbar fossa）的神經有那三條？","opts":["A. 第11、12、13胸椎神經","B. 第12、13胸椎神經及第1腰椎神經","C. 第13胸椎神經及第1、2腰椎神經","D. 第1、2、3腰椎神經"],"ans":2,"exp":"牛左腹脇凹陷處（left paralumbar fossa）分布的三條神經為：第13胸椎神經（T13，腹外側神經）及第1、2腰椎神經（L1 iliohypogastric、L2 ilioinguinal）。這三條神經是倒L型神經阻斷（inverted-L block）的目標，用於腹脇部手術麻醉。","we":["A. T11、T12、T13組合不正確，T11、T12位置太高，不在paralumbar fossa的主要神經支配範圍。","B. T12、T13、L1組合與標準描述略有差異，主要應為T13、L1、L2。","D. 第1、2、3腰椎神經的L3支配後腿，不在腹脇部的主要分布。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_028","year":2015,"roc_year":104,"session":"","examNo":28,"q":"下列那一個病原會造成山羊角膜結膜炎（keratoconjunctivitis）？","opts":["A. 牛鼻氣管炎病毒（infectious bovine rhinotracheitis virus）","B. 牛病毒性下痢（bovine viral diarrhea virus）","C. 副流感病毒第三型（parainfluenza type 3 virus）","D. 冠狀病毒（coronavirus）"],"ans":0,"exp":"引起山羊角膜結膜炎（keratoconjunctivitis）的病原：山羊疱疹病毒1型（Caprine herpesvirus 1, CpHV-1）與牛鼻氣管炎病毒（BHV-1）同屬α-疱疹病毒，可引起山羊角膜結膜炎（「粉紅眼」）、口腔潰瘍等病變，是列出選項中最相關的病原。","we":["B. 牛病毒性下痢病毒（BVDV）主要引起消化道和黏膜病變，不以角膜結膜炎著稱。","C. 副流感病毒第三型（PIV-3）主要引起呼吸道疾病，不典型引起角膜結膜炎。","D. 冠狀病毒主要引起腸胃道和呼吸道疾病，非角膜結膜炎的典型病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_029","year":2015,"roc_year":104,"session":"","examNo":29,"q":"豬水腫病（edema disease）的敘述下列何項錯誤？","opts":["A. 常發生在哺乳期","B. 常發生在離乳期","C. 感染的病原為大腸桿菌","D. 感染源多為α溶血性的病原菌"],"ans":0,"exp":"豬水腫病（edema disease）錯誤描述：「常發生在哺乳期」是錯誤的。豬水腫病（由產Stx2e毒素的大腸桿菌引起）典型發生在「離乳後1-2週」，因飼料突然改變、免疫力暫時下降，好發於剛離乳的健壯仔豬，哺乳期反而少見。","we":["B. 常發生在離乳期，正確敘述。","C. 病原為大腸桿菌（ETEC，β-溶血性），正確。","D. 感染源多為α溶血性大腸桿菌——實際上是β（beta）溶血性，但此選項D說「α溶血性」可能是干擾選項，若為正確敘述需審查題目版本。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_030","year":2015,"roc_year":104,"session":"","examNo":30,"q":"下列有關於反芻動物感染耳蟎（ear mite）之敘述何者正確？","opts":["A. 牛隻主要是感染Psoroptes cuniculi","B. 羊隻主要是感染Raillietia auris","C. 山羊感染常會發展成耳血腫（aural hematoma）","D. 羊感染耳蟎常會併發全身感染"],"ans":2,"exp":"反芻動物感染耳蟎正確描述：「山羊感染常會發展成耳血腫（aural hematoma）」。山羊感染Psoroptes cuniculi耳蟎後，因強烈搔癢而頻繁搖頭和搔抓耳朵，導致耳翼軟骨與皮膚間血管破裂，形成耳血腫。","we":["A. 牛隻主要感染Raillietia auris（非Psoroptes cuniculi，後者是兔和山羊/羊的耳蟎）。","B. 羊隻主要感染Psoroptes cuniculi，而非Raillietia auris（後者是牛的耳蟎）。","D. 羊感染耳蟎主要引起局部耳道問題，很少併發全身感染，此描述誇大病情。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_031","year":2015,"roc_year":104,"session":"","examNo":31,"q":"豬的胃食道部潰瘍（ulceration of the pars esophagea）與下列何者最無關？","opts":["A. 使用糖質類固醇（glucocorticoids）","B. 基因的感受性（genetic susceptibility）","C. 受體素（somatotropin）注射","D. 豬幽門桿菌（Helicobacter suis ）"],"ans":2,"exp":"豬胃食道部潰瘍（ulceration of pars esophagea）與「受體素（somatotropin）注射」最無關。Somatotropin（生長激素）促進生長，不直接引起胃潰瘍。而糖質類固醇（A）、遺傳易感性（B）、幽門桿菌Helicobacter suis（D）均是已知危險因子。","we":["A. 糖質類固醇（glucocorticoids）增加胃酸分泌、降低黏膜保護，是豬胃潰瘍的危險因子。","B. 遺傳易感性（某些純種豬系）是豬胃食道部潰瘍的重要因素。","D. 幽門桿菌H. suis定植於胃黏膜，破壞黏膜屏障，引起豬胃食道部潰瘍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_032","year":2015,"roc_year":104,"session":"","examNo":32,"q":"關於羊肺炎的治療，下列敘述何者最正確？","opts":["A. 口服抗生素容易造成瘤胃纖毛蟲的死亡","B. 應以類固醇治療4－5天","C. 以疫苗注射預防肺炎感染之效果最好","D. 抗生素療程應為2－3天"],"ans":0,"exp":"羊肺炎治療最正確：「口服抗生素容易造成瘤胃纖毛蟲的死亡」。反芻動物口服廣效抗生素（如oxytetracycline, chloramphenicol）會影響瘤胃微生物叢，殺死纖毛蟲（protozoa），破壞瘤胃正常發酵，這是選擇給藥途徑時的重要考量。","we":["B. 類固醇短期使用（2-3天）可考慮，4-5天過長，且主要治療仍為抗生素，正確說法需要更精確。","C. 疫苗預防雖有一定效果，但對多病因肺炎的效果並非「最好」，抗生素和管理更重要。","D. 抗生素療程應為5-7天或更長，2-3天療程通常不足以清除感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_033","year":2015,"roc_year":104,"session":"","examNo":33,"q":"下列動物種類中，何者於外科手術前最難施行氣管插管並常導致嚴重氣管受傷？","opts":["A. 牛","B. 羊","C. 豬","D. 馬"],"ans":2,"exp":"豬（pig/swine）是最難施行氣管插管且常導致嚴重氣管受傷的動物。豬咽喉部有咽憩室（pharyngeal diverticulum）和氣管憩室（tracheal diverticulum），且喉頭角度特殊，盲目插管極易進入憩室，導致嚴重損傷甚至死亡，需在直視下進行。","we":["A. 牛氣管插管需要較長導管，但技術難度低於豬，解剖較直接。","B. 羊氣管插管相對容易，喉頭可透過喉鏡直視。","D. 馬氣管插管雖有其挑戰性，但咽喉解剖較直接，不如豬的憩室問題嚴重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_034","year":2015,"roc_year":104,"session":"","examNo":34,"q":"胎位（presentation）是指","opts":["A. 胎兒縱軸和母體縱軸之關係","B. 胎兒橫軸與母體縱軸之關係","C. 胎兒縱軸與母體橫軸之關係","D. 胎兒橫軸與母體橫軸之關係"],"ans":0,"exp":"胎位（presentation）的定義：胎兒縱軸和母體縱軸之關係。Presentation描述胎兒哪個部分（頭部、尾部、橫向）朝向母體骨盆入口，即胎兒相對於母體的縱向定向關係，分為縱向（longitudinal）和橫向（transverse）胎位。","we":["B. 胎兒橫軸與母體縱軸之關係更接近「胎向（attitude）」的概念，不是presentation定義。","C. 胎兒縱軸與母體橫軸之關係不是標準的obstetrics術語定義。","D. 胎兒橫軸與母體橫軸之關係不對應任何標準obstetrics術語。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_035","year":2015,"roc_year":104,"session":"","examNo":35,"q":"經產牛正常分娩第2期的收縮時間約多久？","opts":["A. 3小時","B. 5小時","C. 6小時","D. 7小時"],"ans":0,"exp":"經產牛正常分娩第二期（胎兒娩出期）的時間約為「3小時」。初產牛第二期可長達5-6小時，而經產牛（multiparous cow）因產道較鬆弛、子宮頸擴張更快，通常在3小時內完成胎兒娩出，超過3小時應視為難產（dystocia）並介入協助。","we":["B. 5小時是初產牛的正常上限，對經產牛來說過長，已屬難產。","C. 6小時遠超正常範圍，任何牛種的第二期超過6小時都需要緊急介入。","D. 7小時完全不在正常範圍內，必須立即手術協助。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_036","year":2015,"roc_year":104,"session":"","examNo":36,"q":"牛真性胎兒過大常發生在妊娠期的何階段？","opts":["A. 250－260天","B. 261－270天","C. 271－280天","D. 300－310天"],"ans":3,"exp":"牛真性胎兒過大（absolute fetal oversize）常發生在妊娠期的「300-310天」。牛的正常妊娠期約280天，過期妊娠（post-term pregnancy）時胎兒持續生長，在300-310天時胎兒體型遠超正常，骨骼也已充分骨化，真性過大導致難產。","we":["A. 250-260天是正常分娩前約20-30天，胎兒尚在生長，未達過大。","B. 261-270天是接近正常足月的時間，不是真性胎兒過大的典型期間。","C. 271-280天是正常分娩期間，此時的大胎兒可能是相對過大（母體骨盆問題），非真性過大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_037","year":2015,"roc_year":104,"session":"","examNo":37,"q":"羊正常懷孕期為","opts":["A. 120天","B. 130天","C. 140天","D. 150天"],"ans":3,"exp":"羊（綿羊/山羊）的正常懷孕期（gestation period）約為「150天」（範圍144-152天）。綿羊平均妊娠期147-150天，山羊約145-155天，以150天作為標準記憶值。較其他家畜（牛280天、馬340天、豬114天）更短。","we":["A. 120天對羊來說過短，此妊娠期相當於豬（114天）的範圍。","B. 130天仍短於羊的正常妊娠期，屬於早產範圍。","C. 140天是羊妊娠期的短端，接近正常但仍略短，150天更準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_038","year":2015,"roc_year":104,"session":"","examNo":38,"q":"經產乳牛正常排卵濾泡直徑約多少公分？","opts":["A. 0.5","B. 1.0","C. 1.5","D. 2.0"],"ans":2,"exp":"經產乳牛正常排卵濾泡（ovulatory follicle）的直徑約為「1.5公分（15mm）」。乳牛的優勢卵泡（dominant follicle）在排卵前直徑約1.5-2.0 cm，超音波可見。1.5 cm是最常引用的標準值，代表成熟卵泡的最小排卵閾值。","we":["A. 0.5 cm的卵泡尚在發育中，未達排卵成熟度。","B. 1.0 cm的卵泡是發育中的卵泡，可能在下次波動時消退或繼續生長。","D. 2.0 cm的卵泡是較大的優勢卵泡，接近囊腫（cyst）的閾值（>2.5 cm），不是典型排卵濾泡直徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_039","year":2015,"roc_year":104,"session":"","examNo":39,"q":"下列何種懷孕動物其胚的早期死亡率最高？","opts":["A. 豬","B. 牛","C. 羊","D. 馬"],"ans":0,"exp":"懷孕動物中，豬（swine）的胚胎早期死亡率（early embryonic mortality）最高，約20-40%。原因包括：胚胎分布不均（spacing）、子宮容量限制、激素失衡（孕酮不足）等。豬需要至少4個功能性胚胎才能維持妊娠，任何一個胚胎死亡都影響鄰近胚胎。","we":["B. 牛通常為單胎，胚胎死亡率約8-15%，低於豬。","C. 羊胚胎死亡率約15-25%，高於牛但低於豬。","D. 馬的胚胎早期死亡率約15-20%，特別在雙胎時一個通常被吸收，低於豬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_040","year":2015,"roc_year":104,"session":"","examNo":40,"q":"犬患有隱睪症時，於腹腔中的睪丸最容易引起下列何種腫瘤？","opts":["A. 精細胞瘤（seminoma）","B. 賽托利細胞瘤（Sertoli cell tumor）","C. 萊狄吉細胞瘤（Leydig cell tumor）","D. 血管肉瘤（hemangioma）"],"ans":1,"exp":"犬腹腔隱睪症中，位於腹腔的睪丸最容易引起「賽托利細胞瘤（Sertoli cell tumor）」。腹腔高溫環境（體溫）促使Sertoli細胞惡性轉化，且Sertoli細胞瘤會分泌大量雌激素，引起女性化症候群（feminization syndrome），包括乳房增大、骨髓抑制等，是腹腔隱睪最典型的腫瘤。","we":["A. 精細胞瘤（seminoma）在陰囊睪丸中更常見，腹腔隱睪中相對少見。","C. 萊狄吉細胞瘤（Leydig cell tumor）通常為良性，可見於正常位置睪丸，不特別與隱睪相關。","D. 血管肉瘤（hemangioma）不是睪丸的典型腫瘤，睪丸腫瘤以生殖細胞腫瘤和性索腫瘤為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_041","year":2015,"roc_year":104,"session":"","examNo":41,"q":"母豬分娩時，下列那項內泌素（hormones）刺激子宮頸鬆弛（relaxation）？","opts":["A. 助孕酮（progesterone）","B. 鬆弛素（relaxin）","C. 胰島素（insulin）","D. 催產素（oxytocin）"],"ans":1,"exp":"母豬分娩時刺激子宮頸鬆弛的主要內泌素是「鬆弛素（relaxin）」。Relaxin由卵巢黃體和胎盤分泌，在分娩前濃度升高，促進骨盆韌帶鬆弛、子宮頸軟化和擴張，以及恥骨聯合分離，為胎兒通過產道做好準備。","we":["A. 助孕酮（progesterone）在妊娠期維持子宮安靜，分娩前下降，並不直接促進子宮頸鬆弛。","C. 胰島素（insulin）主要調節血糖代謝，與分娩過程關係不大。","D. 催產素（oxytocin）主要促進子宮肌肉收縮和乳汁排出，而非子宮頸鬆弛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_042","year":2015,"roc_year":104,"session":"","examNo":42,"q":"下列那種動物在分娩前24小時內，通常體溫會有短暫下降的現象？","opts":["A. 綿羊","B. 山羊","C. 豬","D. 犬"],"ans":3,"exp":"分娩前24小時內，通常體溫會有短暫下降的動物是「犬（dog）」。母犬在分娩前12-24小時，因黃體素（progesterone）下降，體溫由正常38.5-39°C短暫降至37.5-38°C（降幅≥0.5°C），此現象可預測分娩即將發生，是重要的產前監測指標。","we":["A. 綿羊分娩前體溫變化不如犬明顯，不常被引用作為產前體溫指標。","B. 山羊分娩前也無典型的體溫下降指標。","C. 豬分娩前體溫可能略升高（因分娩應激），不以體溫下降作為預產指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_043","year":2015,"roc_year":104,"session":"","examNo":43,"q":"Q fever的病原Coxiella burnetii主要感染那種動物並引起流死產症狀？","opts":["A. 豬","B. 犬","C. 貓","D. 山羊"],"ans":3,"exp":"Q fever病原Coxiella burnetii在動物中主要感染「山羊（goat）」並引起流死產（abortion/stillbirth）。山羊是Q fever的主要儲存宿主，感染懷孕山羊可引起晚期流產和死胎，同時大量病原隨胎盤和陰道分泌物排出，是人畜共患Q fever的重要傳染源。","we":["A. 豬感染Coxiella burnetii通常無明顯臨床症狀，不是典型流死產宿主。","B. 犬可感染但引起流死產的記錄不及山羊常見。","C. 貓可感染但不是Coxiella流死產的典型受影響物種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_044","year":2015,"roc_year":104,"session":"","examNo":44,"q":"乳牛發生胎衣滯留（retained fetal membranes）的致病因子，下列何者錯誤？","opts":["A. 分娩時胎盤血流量不足","B. 熱緊迫（heat stress）","C. 早產（premature birth）","D. 胎盤炎（placentitis）"],"ans":0,"exp":"乳牛胎衣滯留（retained fetal membranes）的致病因子中，「分娩時胎盤血流量不足」不是典型的已知致病因子。胎衣滯留的主要原因包括：早產（C）、胎盤炎（D）、熱緊迫（B）、低鈣血症、免疫功能低下等；「胎盤血流量不足」不在標準致病因子清單中。","we":["B. 熱緊迫（heat stress）在乾乳期影響免疫功能，增加胎衣滯留風險，是已知致病因子。","C. 早產（premature birth）時胎盤-子葉複合體尚未完成成熟分離過程，是最重要的致病因子之一。","D. 胎盤炎（placentitis）引起胎盤-子葉間的炎性粘連，阻礙正常分離，是重要致病因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_045","year":2015,"roc_year":104,"session":"","examNo":45,"q":"下列何項是急性腎損傷而非慢性腎病的特徵性徵狀？","opts":["A. 口腔潰瘍","B. 寡尿","C. 嘔吐","D. 神經症狀"],"ans":1,"exp":"急性腎損傷（AKI）而非慢性腎病（CKD）的特徵性症狀是「寡尿（oliguria）」。AKI因腎臟突然喪失過濾功能，出現寡尿（<0.5 ml/kg/hr）甚至無尿；而CKD因腎臟濃縮功能喪失，通常表現為多尿（polyuria），是兩者的重要鑑別點。","we":["A. 口腔潰瘍（uremic stomatitis）是尿毒症症狀，AKI和CKD均可見，不是特異性鑑別。","C. 嘔吐可見於AKI（尿毒素急性升高）和CKD（慢性尿毒症），不是AKI特有。","D. 神經症狀（尿毒症腦病）見於嚴重AKI和CKD晚期，不是AKI特異性表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_046","year":2015,"roc_year":104,"session":"","examNo":46,"q":"此心電圖的判讀，以下何者為正確 ？\r （from small animal internal medicine，lead II，25mm/sec）","opts":["A. 第1級房室阻礙（first-degree AV block）","B. 第2級房室阻礙（second-degree AV block）","C. 第3級房室阻礙（third-degree AV block）","D. 竇停止（sinus arrest）"],"ans":1,"exp":"（ECG圖像題）根據題目描述（lead II，25mm/sec），若ECG顯示P波後有部分無QRS跟隨，符合「第2級房室阻礙（second-degree AV block）」的圖像特徵。第二度AV block（Mobitz I或II）特徵是某些P波無法傳導至心室，出現「dropped beat」。","we":["A. 第一度AV block僅PR間期延長（>0.2秒），每個P波後仍有QRS，不會有dropped beat。","C. 第三度AV block P波與QRS完全解離（各自獨立），心室率很慢，圖像特徵更明顯。","D. 竇停止（sinus arrest）為P波和QRS複合波完全消失一段時間，不同於部分不傳導的AV block。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_1_普通病_047","year":2015,"roc_year":104,"session":"","examNo":47,"q":"下列何者是放射線胸腔照影中支氣管相（bronchial pattern）的特徵？","opts":["A. 分支狀（branches）","B. 甜甜圈狀（donuts）","C. 小點狀（dots）","D. 非血管線狀（non-vascular linear marking）"],"ans":1,"exp":"放射線胸腔照影支氣管相（bronchial pattern）的特徵是「甜甜圈狀（donuts）」。當增厚的支氣管壁以橫斷面（end-on）方向呈現於X光時，形成環狀的「甜甜圈」影像；縱切面呈現「平行軌道線（tram tracks）」。兩者是bronchial pattern的診斷特徵。","we":["A. 分支狀（branches）是正常或增強的血管相（vascular pattern）的描述。","C. 小點狀（dots）是結節相（nodular pattern）的特徵，見於肺轉移腫瘤。","D. 非血管線狀（non-vascular linear markings）雖可描述支氣管相，但甜甜圈狀更為典型和特異。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_048","year":2015,"roc_year":104,"session":"","examNo":48,"q":"心衰竭使用利尿劑furosemide 時，可能會造成下列何種離子不平衡的症狀？","opts":["A. 高血鉀症","B. 低血鉀症","C. 高血鈣症","D. 高血鈉症"],"ans":1,"exp":"心衰竭使用furosemide（loop diuretic）可能引起「低血鉀症（hypokalemia）」。Furosemide阻斷腎臟厚升管（thick ascending limb）的Na-K-2Cl共同運輸體，增加遠端小管鈉濃度，促使醛固酮活化，增加鉀的排泄，是furosemide最常見的電解質副作用。","we":["A. Furosemide促進鉀排出，引起低血鉀，而非高血鉀症。","C. Furosemide促進鈣排出（抑制鈣再吸收），可能引起低血鈣，非高血鈣症。","D. Furosemide促進鈉排出（利尿作用），可能引起低血鈉，非高血鈉症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_049","year":2015,"roc_year":104,"session":"","examNo":49,"q":"犬氣管塌陷的描述，下列何者錯誤？","opts":["A. 為後天性的疾病","B. 一般比較會發生在氣管的背側面","C. 因為氣管的醣蛋白（glycoprotein）的增加","D. 呼吸時引發氣管管腔的狹窄"],"ans":2,"exp":"犬氣管塌陷（tracheal collapse）錯誤描述：「因為氣管的醣蛋白（glycoprotein）的增加」是錯誤的。氣管塌陷的病理機制是氣管軟骨中醣蛋白（glycoprotein）和醣胺聚醣（glycosaminoglycan）「減少」，使軟骨失去結構支撐性，導致氣管在呼吸時塌陷。","we":["A. 氣管塌陷為後天性疾病（acquired），主要見於中老年玩具犬和小型犬，正確。","B. 氣管塌陷好發於背側（dorsal），因背側膜（dorsal tracheal membrane）最缺乏軟骨支撐，正確。","D. 呼吸時氣管管腔狹窄是塌陷的直接後果，吸氣時頸部氣管塌陷，呼氣時胸部氣管塌陷，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_050","year":2015,"roc_year":104,"session":"","examNo":50,"q":"下列何項不是誘發犬貓胰臟炎的危險因子？","opts":["A. 高血鉀症","B. 肥胖","C. 免疫性腸病","D. 有機磷中毒"],"ans":0,"exp":"「高血鉀症（hyperkalemia）」不是誘發犬貓胰臟炎的危險因子。胰臟炎的已知危險因子包括：肥胖（B，增加胰腺脂肪沉積）、免疫性腸病（C，炎症波及胰腺）、有機磷中毒（D，抑制膽鹼酯酶引起胰腺過度分泌）等；高血鉀與胰臟炎病生理無直接關係。","we":["B. 肥胖（obesity）是犬貓胰臟炎的重要危險因子，增加胰腺脂肪浸潤和炎症敏感性。","C. 免疫性腸病（IBD）與胰臟炎常並存（三腺炎triaditis），是危險因子。","D. 有機磷中毒（organophosphate toxicity）抑制乙醯膽鹼酯酶，刺激胰腺過度分泌，是危險因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_051","year":2015,"roc_year":104,"session":"","examNo":51,"q":"以下何者疾病不會出現黏膜發紺（cyanotic mucous membranes）？","opts":["A. 貧血","B. 肺組織實質疾病","C. 休克","D. 右至左開放性動脈導管（right to left shunting PDA）"],"ans":0,"exp":"貧血（anemia）不會出現「黏膜發紺（cyanotic mucous membranes）」。發紺需要循環中去氧血紅素濃度>5 g/dL才能被肉眼察覺，但貧血患者血紅素總量不足，即使全部去氧化也不能達到此濃度，黏膜呈現「蒼白（pale）」而非發紺。","we":["B. 肺組織實質疾病（如肺炎、肺水腫）引起通氣/灌流不匹配，血液去氧化，導致發紺。","C. 休克（shock）引起組織低灌流，微循環血液滯留去氧化，黏膜可呈現發紺或泥灰色。","D. 右至左分流PDA（如Eisenmenger syndrome）靜脈血繞過肺臟直接進入體循環，引起發紺。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_052","year":2015,"roc_year":104,"session":"","examNo":52,"q":"下列那一種結石在不造成尿道阻塞的情況下，可透過尿液酸化和增加飲水來溶解？","opts":["A. 草酸鈣（oxalate）","B. 半胱氨酸（cystine）","C. 尿酸鹽（urate）","D. 磷酸胺鎂（struvite）"],"ans":3,"exp":"磷酸胺鎂結石（struvite / MAP stone）可透過「尿液酸化和增加飲水」來溶解。Struvite在酸性尿液（pH<6.5）中溶解度增加，配合增加飲水量稀釋尿液，可非手術性溶解struvite結石，是內科溶石治療的選項（前提：無尿道阻塞）。","we":["A. 草酸鈣（calcium oxalate）在酸性和鹼性尿液中均無法溶解，不能用內科溶石。","B. 半胱氨酸（cystine）結石需要尿液鹼化（非酸化）才能增加溶解度。","C. 尿酸鹽（urate）結石需要尿液鹼化（如allopurinol + alkalinization）溶解，非酸化。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_053","year":2015,"roc_year":104,"session":"","examNo":53,"q":"前葡萄膜炎（anterior uveitis）的症狀，以下何者錯誤？","opts":["A. 眼痛","B. 高眼內壓","C. 瞳孔縮小","D. 角膜周圍睫狀充血"],"ans":1,"exp":"前葡萄膜炎（anterior uveitis）症狀中，「高眼內壓（increased IOP）」是錯誤的。前葡萄膜炎因睫狀體發炎導致房水分泌「減少」，眼壓通常「降低（hypotony）」而非升高。慢性前葡萄膜炎晚期才可能因繼發青光眼而眼壓升高，但這是併發症，非典型症狀。","we":["A. 眼痛（ocular pain）因睫狀肌痙攣和神經刺激引起，是前葡萄膜炎的主要症狀，正確。","C. 瞳孔縮小（miosis）因虹膜括約肌痙攣（reflex miosis）是前葡萄膜炎的特徵，正確。","D. 角膜周圍睫狀充血（ciliary flush/perilimbal injection）是前葡萄膜炎的典型外觀，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_054","year":2015,"roc_year":104,"session":"","examNo":54,"q":"一般良性的幼犬性心雜音（innocent puppy murmurs）會在接近幾月齡時消失？","opts":["A. 3月齡","B. 6月齡","C. 9月齡","D. 1歲齡"],"ans":1,"exp":"幼犬性心雜音（innocent puppy murmurs / physiological murmur）通常在「6月齡」時消失。這類功能性雜音由湍流血流引起（無結構性心臟病），隨心臟和血管系統發育成熟，一般在4-6個月齡自行消失，6月齡時仍持續應安排心臟超音波評估。","we":["A. 3月齡消失時間過早，大多數幼犬雜音在此時仍可聽見。","C. 9月齡消失時間過晚，持續至此時已超出正常生理範圍，需要評估器質性心臟病。","D. 1歲齡持續的心雜音幾乎可確定為器質性心臟疾病，需要完整心臟評估。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_055","year":2015,"roc_year":104,"session":"","examNo":55,"q":"下列何項為犬二尖瓣嚴重閉鎖不全之臨床症狀？","opts":["A. 肺充血、胸腔滲出液和緩慢呼吸","B. 肺充血、胸腔漏出液和緩慢呼吸","C. 肺水腫、胸腔積水、犬坐呼吸和心收縮期雜音","D. 肺鬱血、胸腔滲出液和緩慢呼吸"],"ans":2,"exp":"犬二尖瓣嚴重閉鎖不全（mitral valve insufficiency）的臨床症狀：肺水腫（左心衰竭→肺靜脈高壓）、胸腔積水（有時見於嚴重心衰竭）、犬坐呼吸（orthopnea，患犬因呼吸困難採坐姿）、心收縮期雜音（systolic murmur，二尖瓣反流的特徵）。這是C選項的完整描述。","we":["A. 「緩慢呼吸」不符合心衰竭表現，心衰竭引起急促呼吸（tachypnea），非慢速。","B. 同A，「緩慢呼吸」描述錯誤，且「胸腔漏出液」（transudate）的描述需要更精確的診斷依據。","D. 「滲出液（exudate）」通常見於炎症性疾病，心衰竭引起的是漏出液（transudate），描述不精確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_056","year":2015,"roc_year":104,"session":"","examNo":56,"q":"貓出現S3奔馬音（gallop rhythm）的最主要原因為下列何項？","opts":["A. 限制性心肌病（restrictive cardiomyopathy）","B. 擴張性心肌病（dilated cardiomyopathy）","C. 心律不整性右心室心肌病（arrhythmogenic right ventricular cardiomyopathy）","D. 肺動脈瓣狹窄（pulmonic stenosis）"],"ans":1,"exp":"貓出現S3奔馬音（S3 gallop rhythm）的最主要原因是「擴張性心肌病（DCM）」。S3（第三心音）在舒張早期快速充盈期產生，與心室擴張、收縮功能下降有關。貓DCM因心室容積增大和收縮功能受損，是S3奔馬音的最典型病因；HCM更常出現S4奔馬音。","we":["A. 限制性心肌病（RCM）更典型出現S4奔馬音（因心室填充受限，心房收縮引起），而非S3。","C. ARVC（心律不整性右心室心肌病）在犬多見，貓較少見，且主要表現為心律不整。","D. 肺動脈瓣狹窄（pulmonic stenosis）引起右心室壓力過載，不以S3奔馬音著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_057","year":2015,"roc_year":104,"session":"","examNo":57,"q":"犬貓永存性右主動脈弓，會繼發下列何項？","opts":["A. 腔靜脈症候群","B. 門脈高血壓","C. 肺動脈阻塞","D. 環繞箝勒食道"],"ans":3,"exp":"犬貓持久性右主動脈弓（PRAA）繼發「環繞箝勒食道（vascular ring encircling esophagus）」。PRAA時，右第四主動脈弓持久存在，與肺動脈、動脈韌帶（ligamentum arteriosum）共同形成血管環（vascular ring），在心底部（aortic base）緊勒食道，引起食道擴張和食後逆流。","we":["A. 腔靜脈症候群（vena cava syndrome）是縱膈腔腫瘤壓迫前腔靜脈引起，非PRAA的典型繼發症。","B. 門脈高血壓是肝臟疾病的後果，與PRAA無關。","C. 肺動脈阻塞不是PRAA的繼發症，PRAA是解剖性血管環問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_058","year":2015,"roc_year":104,"session":"","examNo":58,"q":"犬罹患下列何項疾病時，腹腔X光檢查並無肝臟變大的影像？","opts":["A. 右心衰竭","B. 庫興氏症候群","C. 肝門脈分流","D. 急性肝中毒"],"ans":2,"exp":"犬門脈分流（portosystemic shunt, PSS）患者，腹腔X光並「無肝臟變大」的影像；相反，PSS患犬因門脈血流繞過肝臟，肝臟失去正常的門脈營養因子（trophic factors），導致肝臟發育不良（hepatic atrophy/microhepatica），X光顯示肝臟「縮小」。","we":["A. 右心衰竭（right heart failure）引起肝臟靜脈充血（hepatic congestion），X光顯示肝臟腫大，正確。","B. 庫興氏症候群（hyperadrenocorticism）引起肝糖原沉積（hepatic glycogen deposition），X光顯示肝臟腫大，正確。","D. 急性肝中毒（acute hepatotoxicity）引起肝臟充血和腫脹，X光顯示肝臟變大，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_059","year":2015,"roc_year":104,"session":"","examNo":59,"q":"5歲威瑪納（Weimaraner）公犬，無隱睪症，最近一個月發現腹部膨大，一星期前開始出現\r 血尿症狀，X-ray檢查發現腹腔內軟組織團塊影像（空心箭頭所示），依據其病史和解剖位\r 置，最有可能是下列何項？","opts":["A. 脾臟腫瘤","B. 腎臟腫瘤","C. 直腸腫瘤","D. 前列腺腫瘤"],"ans":3,"exp":"（圖像題）5歲Weimaraner公犬，腹部膨大+血尿+腹腔軟組織腫塊：Weimaraner易患前列腺腫瘤，且血尿+腹腔尾部腫塊在整犬常見於前列腺腫瘤（carcinoma）。前列腺腫瘤可引起血尿、尿道阻塞，並在腹腔尾部形成腫塊，是本病例最可能的診斷。","we":["A. 脾臟腫瘤（hemangiosarcoma）雖常見於Weimaraner，但通常引起急性腹腔出血而非血尿。","B. 腎臟腫瘤可引起血尿和腹腔腫塊，但位置偏頭側，且Weimaraner不特別好發腎腫瘤。","C. 直腸腫瘤引起便血而非典型的血尿，且腫塊位置在骨盆腔偏後。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_1_普通病_060","year":2015,"roc_year":104,"session":"","examNo":60,"q":"犬胰臟炎最具敏感性及特異性的檢驗項目為下列何項？","opts":["A. amylase","B. lipase","C. trypsin-like immunoreactivity","D. pancreatic lipase immunoreactivity"],"ans":3,"exp":"犬胰臟炎最具敏感性及特異性的檢驗是「pancreatic lipase immunoreactivity（PLI/cPLI，Spec cPL test）」。cPLI測定胰臟特異性脂肪酶免疫活性，敏感度約81%，特異度約96%，是目前臨床上診斷犬胰臟炎最佳的血清學標記，優於傳統的amylase和lipase。","we":["A. Amylase在犬胰臟炎的敏感度低（約50-65%），特異度差，肝、腸道疾病也會升高，已不建議單獨使用。","B. Lipase傳統測定法特異度不佳，其他腹腔臟器疾病也可升高，不如PLI準確。","C. Trypsin-like immunoreactivity（TLI）主要用於診斷外分泌胰臟功能不全（EPI），對胰臟炎的特異度低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_061","year":2015,"roc_year":104,"session":"","examNo":61,"q":"下列何項疾病，會引起犬貓快脈（rapid pulse）？","opts":["A. 心臟傳導阻滯","B. 熱性疾病","C. 腦積水","D. 腦腫瘤"],"ans":1,"exp":"引起犬貓快脈（tachycardia）的疾病是「熱性疾病（febrile disease）」。發燒時體溫升高，交感神經系統活化，代謝率增加，導致反射性心跳加速（每升高1°C約增加10 bpm）。心臟傳導阻滯引起緩慢脈；腦壓升高（腦積水、腦腫瘤）可引起緩慢脈（Cushing反應）。","we":["A. 心臟傳導阻滯（AV block）阻礙衝動傳導，引起心跳緩慢（bradycardia），非快脈。","C. 腦積水（hydrocephalus）引起顱內壓升高，可觸發Cushing反射（緩脈+高血壓），非快脈。","D. 腦腫瘤引起顱內壓升高，同樣可引起緩脈，非快脈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_062","year":2015,"roc_year":104,"session":"","examNo":62,"q":"下圖中的犬皮膚病變，其觸感粗糙硬實，最可能會出現於下列何種疾病？","opts":["A. hypothyroidism","B. hyperadrenocorticism","C. diabetes mellitus","D. hypoparathyroidism"],"ans":0,"exp":"（圖像題）犬皮膚觸感粗糙硬實的病變最可能出現於「甲狀腺功能低下（hypothyroidism）」。甲狀腺素缺乏導致皮膚中黏多醣（glycosaminoglycans）沉積，引起黏液性水腫（myxedema），皮膚增厚、粗糙、硬實，不可凹性水腫（non-pitting edema），是hypothyroidism的特徵性皮膚表現。","we":["B. 腎上腺皮質功能亢進（hyperadrenocorticism）引起皮膚變薄（skin thinning）、鈣化（calcinosis cutis），非增厚硬實。","C. 糖尿病（diabetes mellitus）皮膚表現為感染易感、鱗屑、無光澤，非典型粗糙硬實。","D. 副甲狀腺功能低下（hypoparathyroidism）主要引起低鈣血症和神經肌肉症狀，皮膚變化不典型。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_1_普通病_063","year":2015,"roc_year":104,"session":"","examNo":63,"q":"犬貓急性腎衰竭時，那些利尿劑最常被使用在寡尿期？","opts":["A. mannitol及furosemide","B. furosemide及spironolactone","C. mannitol及spironolactone","D. dopamine及spironolactone"],"ans":0,"exp":"犬貓急性腎衰竭寡尿期最常使用「mannitol及furosemide」利尿劑。Mannitol（滲透性利尿劑）和furosemide（loop diuretic）是AKI寡尿期一線用藥：mannitol增加腎小管液體流速並清除自由基；furosemide阻斷Na-K-2Cl，兩者合用可增加尿量和腎小管排毒。","we":["B. Furosemide及spironolactone的組合：spironolactone是保鉀利尿劑，作用於遠端小管，對AKI急性期療效有限。","C. Mannitol及spironolactone：spironolactone在AKI急性期不是標準用藥，效果緩慢。","D. Dopamine及spironolactone：低劑量dopamine（\"renal dose\" dopamine）已被證明對AKI並無確定療效，不是標準用藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_064","year":2015,"roc_year":104,"session":"","examNo":64,"q":"貓滲出性傳染性腹膜炎的機制為下列何項？","opts":["A. 強烈細胞性免疫","B. 部分細胞性免疫","C. 強烈且具保護性體液性反應","D. 強烈且不具保護性體液性反應"],"ans":3,"exp":"貓滲出性（wet）FIP的免疫病理機制是「強烈且不具保護性的體液性（抗體性）反應」。FCoV突變為FIPV後，若貓產生強烈抗體反應但抗體無法中和病毒（不具保護性），抗體-抗原免疫複合物沉積在血管壁，引起第III型超敏反應性血管炎，導致血管通透性增加和滲出（腹水、胸水）。","we":["A. 強烈細胞性免疫可控制FIPV感染，不引起滲出性FIP。","B. 部分細胞性免疫反應可能引起非滲出性（乾性）FIP，非滲出性FIP。","C. 強烈且具保護性體液性反應會清除病毒，不引起FIP病變。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_065","year":2015,"roc_year":104,"session":"","examNo":65,"q":"下圖是由十歲未絕育雌性混種犬皮膚取得的檢體鏡檢圖像，其為何種病原？","opts":["A. Demodex","B. Notodres","C. Sarcoptes","D. Otodectes"],"ans":2,"exp":"（圖像題）10歲未絕育雌性混種犬皮膚檢體鏡檢：Sarcoptes scabiei（疥蟎）的形態特徵為圓形軀體、短粗腿（4對足，前2對較長，後2對較短）、無毛刺，引起劇烈瘙癢的疥癬（scabies），可感染任何年齡/性別的犬隻。","we":["A. Demodex canis呈細長雪茄形，生活於毛囊，引起蠕形蟎病（demodectic mange），好發幼犬或免疫抑制犬。","B. Notoedres cati主要感染貓，不是犬的常見皮膚蟎。","D. Otodectes cynotis（耳疥蟎）主要存在於耳道，一般不在皮膚刮片中找到。"],"needs_review":true,"imgs":[]},{"id":"AMO_2015_1_普通病_066","year":2015,"roc_year":104,"session":"","examNo":66,"q":"貓甲狀腺功能亢進較不常出現下列何種症狀？","opts":["A. 聽診出現收縮期心雜音","B. 觸診氣管雙側發現甲狀腺腫","C. 頻尿劇渴","D. 低血壓"],"ans":3,"exp":"貓甲狀腺功能亢進（feline hyperthyroidism）較不常出現「低血壓（hypotension）」。甲狀腺素過多引起心跳加速、心輸出量增加，通常導致「高血壓（hypertension）」，這是甲亢的典型心血管表現，可引起視網膜出血、視網膜脫落等高血壓相關病變。","we":["A. 收縮期心雜音因高輸出量（hyperdynamic circulation）引起，是貓甲亢的常見心臟表現。","B. 觸診可發現甲狀腺腫大（goiter）是貓甲亢（幾乎全為功能性腺瘤）的特徵性體格檢查發現。","C. 頻尿劇渴（PU/PD）是貓甲亢的常見症狀，因腎血流增加、腎小管功能改變所致。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_067","year":2015,"roc_year":104,"session":"","examNo":67,"q":"最常見的犬先天性心臟血管疾病為","opts":["A. 肥厚性心肌病","B. 永存性動脈導管","C. 法洛氏四重畸形","D. 永存性右主動脈弓"],"ans":1,"exp":"最常見的犬先天性心臟血管疾病是「永存性動脈導管（PDA, patent ductus arteriosus）」，佔犬先天性心臟病的25-35%。PDA在多種犬種（拉不拉多、貴賓、柯利牧羊犬等）均有遺傳傾向，是犬心臟先天性疾病中最常被診斷的類型。","we":["A. 肥厚性心肌病（HCM）是貓最常見的心臟病，犬的先天性心臟病以PDA為首。","C. 法洛氏四重畸形（TOF）雖嚴重，但發生率低於PDA。","D. 永存性右主動脈弓（PRAA）雖重要，但發生率低於PDA，是相對少見的先天性血管異常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_068","year":2015,"roc_year":104,"session":"","examNo":68,"q":"引起犬貓炎症性胸膜滲出液之疾病為","opts":["A. 胸腔食道穿孔","B. 腎性低蛋白血症","C. 肝性低蛋白血症","D. 心衰竭"],"ans":0,"exp":"引起犬貓「炎症性（inflammatory）胸膜滲出液」的疾病是「胸腔食道穿孔（intrathoracic esophageal perforation）」。食道穿孔使消化液和細菌進入胸腔，引起嚴重的炎症性滲出液（膿胸/pyothorax）。其他選項（低蛋白血症、心衰竭）引起的是非炎症性漏出液（transudate）。","we":["B. 腎性低蛋白血症因膠體滲透壓下降，引起漏出液（transudate），非炎症性滲出液。","C. 肝性低蛋白血症同樣引起漏出液，非炎症性。","D. 心衰竭引起靜水壓升高性漏出液，非炎症性滲出液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_069","year":2015,"roc_year":104,"session":"","examNo":69,"q":"下列何種疾病會引起幼貓出血性腸炎和白血球減少症？","opts":["A. 貓傳染性腹膜炎","B. 貓疱疹病毒感染","C. 貓瘟","D. 貓杯狀病毒感染"],"ans":2,"exp":"引起幼貓出血性腸炎和白血球減少症（leukopenia）的疾病是「貓瘟（feline panleukopenia，貓細小病毒感染）」。貓細小病毒（FPV）破壞腸絨毛隱窩上皮（最活躍分裂的細胞）和骨髓造血細胞，引起出血性腸炎和全血球減少症（特別是白血球顯著減少），是幼貓的重要致命疾病。","we":["A. 貓傳染性腹膜炎（FIP）主要引起腹水/胸水或肉芽腫，不以出血性腸炎和白血球減少為主要表現。","B. 貓疱疹病毒感染主要引起上呼吸道疾病和結膜炎，不引起出血性腸炎。","D. 貓杯狀病毒感染主要引起口腔潰瘍和上呼吸道炎症，不典型引起出血性腸炎和白血球減少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_070","year":2015,"roc_year":104,"session":"","examNo":70,"q":"下列有關犬腹腔輸液的敘述，何者錯誤？","opts":["A. 可以有效緩解高燒","B. 適於投予高張性溶液","C. 懷疑有腹腔疾病時不適合使用","D. 可用於需要快速輸液時，但沒有靜脈注射有效率"],"ans":1,"exp":"腹腔輸液（intraperitoneal fluid administration）錯誤描述：「適於投予高張性溶液（hypertonic solution）」是錯誤的。腹腔輸液應使用「等張溶液（isotonic solution）」；高張溶液注入腹腔會從腸道和腹膜吸收水分，引起腹膜刺激、腹痛，甚至腸道脫水，是禁忌。","we":["A. 腹腔輸液可透過腸道散熱機制有效緩解高燒，正確。","C. 懷疑腹腔疾病（如腹膜炎、腫瘤）時不適合使用，以免掩蓋診斷，正確。","D. 腹腔輸液可用於快速補液，但吸收速度低於靜脈注射，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_071","year":2015,"roc_year":104,"session":"","examNo":71,"q":"患犬出現步態性共濟失調（ataxia of gait）及／或軀幹性共濟失調（truncal ataxia）的神經\r 症狀，其病變部位最有可能位在下列何結構？","opts":["A. 周邊神經","B. 腦幹","C. 小腦","D. 前腦"],"ans":2,"exp":"步態性共濟失調（ataxia of gait）及軀幹性共濟失調（truncal ataxia）的病變部位最可能在「小腦（cerebellum）」。小腦負責運動協調和平衡，受損時出現：步態不穩（wide-based stance）、測距不準（dysmetria）、意向性震顫（intention tremor）和軀幹晃動，是小腦病變的典型神經學表現。","we":["A. 周邊神經（peripheral nerve）受損引起下運動神經元症狀：肌肉無力、反射消失，共濟失調不典型。","B. 腦幹（brainstem）病變可引起共濟失調，但更多表現為腦神經功能異常、意識障礙。","D. 前腦（forebrain）病變引起行為改變、癲癇、意識障礙，不以純粹的步態共濟失調著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_072","year":2015,"roc_year":104,"session":"","examNo":72,"q":"泌尿道結石的敍述，下列何者錯誤？","opts":["A. nephrotomy及pyelolithotomy可用於取出腎臟結石","B. 可利用urohydropulsion方式嘗試將結石由尿道沖回膀胱","C. 膀胱切開取出結石時，應採集尿液及結石分別作尿液微生物培養及結石分析","D. 膀胱及尿道結石，可藉由放射線影像學確定所有結石的位置"],"ans":3,"exp":"泌尿道結石敘述中，「膀胱及尿道結石可藉由放射線影像學確定所有結石的位置」是錯誤的。部分結石為放射線透明（radiolucent）：尿酸鹽（urate）、胱氨酸（cystine）結石在X光不可見，需要超音波或對比造影才能診斷，無法單靠一般X光確定「所有」結石位置。","we":["A. Nephrotomy（腎切開術）和pyelolithotomy（腎盂切石術）可用於取出腎臟結石，正確。","B. Urohydropulsion（液壓沖石術）可嘗試將尿道結石衝回膀胱，正確。","C. 膀胱切開術時應同時採集尿液作微生物培養和結石分析，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_073","year":2015,"roc_year":104,"session":"","examNo":73,"q":"公犬之會陰赫尼亞（hernia），下列敍述何者錯誤？","opts":["A. 好發於結紮之老犬","B. 常與前列腺腫大有關","C. 會有排便困難之症狀","D. 赫尼亞（hernia）囊內可發現膀胱、前列腺及腸道等臟器"],"ans":0,"exp":"公犬會陰疝氣（perineal hernia）好發於「未結紮的老齡公犬（intact elderly male dogs）」，不是「結紮之老犬」。雄性激素刺激前列腺肥大、增加腹壓，加上老齡時提肛肌（levator ani）等會陰肌肉萎縮；「結紮可預防會陰疝氣復發」，說明疝氣好發於未結紮公犬。","we":["B. 會陰疝氣與前列腺肥大（benign prostatic hyperplasia）密切相關，正確。","C. 因腸道進入疝囊引起排便困難（constipation/tenesmus），正確症狀。","D. 疝囊內可發現膀胱（膀胱後屈/retroflexion）、前列腺和腸道等臟器，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_074","year":2015,"roc_year":104,"session":"","examNo":74,"q":"後肢跛行的患犬，觸診時發現膝蓋骨脫出於滑車溝（trochlear groove），強行外力可將其推\r 回正常位置，但外力消失後又會再次脫出，影像學檢查發現遠端股骨往外側弓起及脛骨近端\r 往內側扭轉，此膝關節的脫位在病情分期中屬於下列何者？","opts":["A. 內側脫位，第二級","B. 內側脫位，第三級","C. 外側脫位，第二級","D. 外側脫位，第三級"],"ans":0,"exp":"膝蓋骨脫位描述：強行外力可推回但消失後再次脫出，遠端股骨往外側弓起（genu varum）、脛骨近端往內側扭轉，是典型的「內側脫位（medial patellar luxation, MPL）、第二級」。MPL第二級：膝蓋骨自發性脫位，手動可復位，但外力去除後再次脫位；並有骨骼變形。","we":["B. 第三級MPL：膝蓋骨持續脫位，偶爾可手動復位，但立即再脫位；骨骼變形更嚴重。","C. 外側脫位第二級的解剖特徵相反（股骨往內側弓起，脛骨往外側扭轉），與描述不符。","D. 外側脫位第三級同樣與描述的解剖方向不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_075","year":2015,"roc_year":104,"session":"","examNo":75,"q":"下列何種手術步驟，不是用來治療前十字韌帶斷裂的手術方法？","opts":["A. lateral extracapsular stabilization","B. tibial plateau leveling osteotomy（TPLO）","C. tibial wedge osteotomy（TWO）","D. tibial tuberosity transposition（TTT）"],"ans":3,"exp":"「Tibial tuberosity transposition（TTT）」不是用於治療前十字韌帶（CCL）斷裂的手術方法。TTT是治療「膝蓋骨內側或外側脫位（patellar luxation）」的手術，通過移位脛骨粗隆矯正膝蓋骨的拉力方向。前十字韌帶斷裂的手術包括：lateral extracapsular（A）、TPLO（B）、TTA/TWO（C）。","we":["A. Lateral extracapsular stabilization（關節外穩定術）是前十字韌帶斷裂的傳統手術，正確。","B. TPLO（脛骨高原水平截骨術）是目前最廣泛使用的CCL斷裂手術方法，正確。","C. Tibial wedge osteotomy（楔形截骨術）也是CCL斷裂的治療手術，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_076","year":2015,"roc_year":104,"session":"","examNo":76,"q":"犬耳血腫（aural hematoma）之敘述，下列何項最適當？","opts":["A. 與甩頭或搔抓耳朵有關","B. 通常與外耳炎沒有關係","C. 在手術縫合時一定不可以穿過對側的皮膚","D. S型皮膚與軟骨切創處最後需要縫合"],"ans":0,"exp":"犬耳血腫（aural hematoma）最適當描述：「與甩頭或搔抓耳朵有關」。耳血腫由耳翼內軟骨板與皮膚之間的血管破裂引起，主要原因是因外耳炎引起的搔癢，患犬頻繁搖頭（shaking head）或搔抓耳朵，造成剪切力（shear force）使小血管破裂，血液積聚形成血腫。","we":["B. 耳血腫「通常與外耳炎有關」，非「沒有關係」，此敘述錯誤。","C. 手術時可穿過對側皮膚以利固定和引流，並非「一定不可以」。","D. S型切開後，切口「不需要縫合」以利引流（或用特定縫合方式）；「最後需要縫合」描述不準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_077","year":2015,"roc_year":104,"session":"","examNo":77,"q":"手術中常使用α 2 作用劑作為止痛藥物，下列何項藥物對於α 2 接受器具有最高的專一性？","opts":["A. xylazine","B. romifidine","C. detomidine","D. medetomidine"],"ans":3,"exp":"α2作用劑（α2 agonists）中，對α2接受器具有最高專一性（selectivity ratio α2:α1）的藥物是「medetomidine（美托咪定）」。各藥物α2:α1選擇性由高至低：medetomidine（1620:1）> detomidine（260:1）> romifidine（200:1）> xylazine（160:1）。高選擇性意味著更好的鎮靜效果和更少的α1副作用。","we":["A. Xylazine的α2:α1選擇性最低（約160:1），是最早使用的α2 agonist，但專一性最差。","B. Romifidine選擇性居中，主要用於馬。","C. Detomidine選擇性高於xylazine，主要用於馬和牛，但低於medetomidine。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_078","year":2015,"roc_year":104,"session":"","examNo":78,"q":"氣體麻醉劑揮發成蒸氣後，是以麻醉機中的氣體做為媒介進入病患的呼吸道，使用低流量氣\r 體麻醉法（low-flow anesthesia），可以減少氧氣及麻醉氣體的使用量，在犬之低流量麻醉\r 法是定義氧氣流量少於多少ml/kg/min？","opts":["A. 2","B. 4","C. 22","D. 32"],"ans":2,"exp":"犬低流量麻醉（low-flow anesthesia）定義為氧氣流量少於「22 ml/kg/min」。傳統（高流量）麻醉使用約22-30 ml/kg/min的O2；低流量麻醉使用<22 ml/kg/min，可節省麻醉氣體，減少環境污染和成本，但需要較精密的監測。","we":["A. 2 ml/kg/min是極低流量（ultra-low flow）或封閉迴路麻醉的氧氣消耗量，遠低於低流量定義。","B. 4 ml/kg/min同樣是非常低的流量，接近基本氧氣消耗率，低於標準低流量定義。","D. 32 ml/kg/min高於傳統標準流量（22-30），不符合低流量麻醉定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_079","year":2015,"roc_year":104,"session":"","examNo":79,"q":"有關犬會陰赫尼亞（perineal hernia）的敘述，下列何者最不適當？","opts":["A. 會陰赫尼亞發生在會陰膈膜肌肉未能支撐直腸壁，造成直腸、會陰或腹腔內容物掉至會陰\r 皮下","B. 大多數的會陰赫尼亞的形成發生在提肛肌、外肛門括約肌和內閉鎖肌之間","C. 會陰赫尼亞幾乎都為單側發生，相當罕見雙側發生","D. 會造成腹部用力或努責（straining）的病症，如泌尿道阻塞或便秘等，皆容易導致會陰赫\r 尼亞的形成"],"ans":2,"exp":"犬會陰疝氣（perineal hernia）最不適當描述：「幾乎都為單側發生，相當罕見雙側發生」是錯誤的。實際上，犬會陰疝氣有約30-50%為雙側發生（bilateral occurrence），不算罕見。即使初次就診為單側，另一側在手術時也常被發現有亞臨床的肌肉薄弱。","we":["A. 會陰膈膜肌肉（levator ani等）支撐力不足導致直腸/腹腔內容物下垂至會陰皮下，定義正確。","B. 大多數疝氣發生在提肛肌（levator ani）、外肛門括約肌和內閉鎖肌之間的空隙，正確。","D. 泌尿道阻塞或便秘等需要努責的疾病會增加腹壓，促進疝氣形成，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_1_普通病_080","year":2015,"roc_year":104,"session":"","examNo":80,"q":"若需同時切除好幾個惡性腫瘤時，使用不同的器械包的主因為何？","opts":["A. 避免器械不夠用","B. 避免器械受損","C. 避免細菌感染","D. 避免移植腫瘤細胞"],"ans":3,"exp":"同時切除多個惡性腫瘤時使用不同器械包的主因是「避免移植腫瘤細胞（tumor cell implantation）」。被腫瘤汙染的手術器械可將活的腫瘤細胞帶至其他手術部位，引起醫源性腫瘤播散（iatrogenic tumor dissemination），使用獨立器械包是防止腫瘤細胞移植的關鍵措施。","we":["A. 器械數量充足問題可通過備份解決，不是使用不同器械包的主因。","B. 器械受損問題通過輪換使用可避免，也不是主因。","C. 避免細菌感染是手術無菌技術的一般原則，但對惡性腫瘤切除，腫瘤細胞移植的風險更為特異性和重要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_001","year":2015,"roc_year":104,"session":"","examNo":1,"q":"關於馬匹疼痛控制，下列敘述何者錯誤？","opts":["A. 無法控制疼痛時應施行安樂死術","B. 中度疼痛時建議使用非類固醇抗發炎藥物","C. 重度疼痛時建議合併使用opioids和α2\r  antagonists","D. 懷疑小腸阻塞時應立即以外科開腹處理"],"ans":2,"exp":"馬重度疼痛控制應使用opioids合併α2 agonists（如xylazine/detomidine），而非α2 antagonists（拮抗劑）。α2 agonists具強效鎮痛及鎮靜效果，是馬疼痛管理的核心藥物。","we":["A. NSAIDs為常用鎮痛藥但單獨使用對重度疼痛效果不足。","B. Opioids合併benzodiazepines對馬鎮靜效果較弱，非重度疼痛標準。","D. 局部神經阻斷適用特定部位，非系統性重度疼痛管理首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_002","year":2015,"roc_year":104,"session":"","examNo":2,"q":"馬淺趾屈肌肌腱炎（superficial digital flexor tendinitis），最常發生的位置是下列何項？","opts":["A. the second metacarpus","B. the third metacarpus","C. caudal aspect of the carpus","D. stifle"],"ans":1,"exp":"馬淺趾屈肌肌腱炎（superficial digital flexor tendinitis）最常發生於第三掌骨（the third metacarpus）中段至後段，即掌骨中部肌腱承受張力最大處。","we":["A. 繫球節周圍雖也有肌腱，但非淺趾屈肌炎最常見位置。","C. 近端掌骨處肌腱有腱鞘保護，較少單獨發炎。","D. 蹄部深趾屈肌較易出問題，淺趾屈肌炎較少在此區域。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_003","year":2015,"roc_year":104,"session":"","examNo":3,"q":"關於蹄葉炎之治療方式，下列敘述何者正確？","opts":["A. 減輕深趾屈肌肌腱的張力","B. 給與類固醇","C. 將蹄跟部修短以增加著地面積分散疼痛","D. 強化淺趾屈肌肌腱的張力"],"ans":0,"exp":"蹄葉炎（laminitis）急性期治療正確做法包括減輕深趾屈肌肌腱（DDFT）的張力，可透過墊高蹄踵（heel wedge）達成，減少對蹄骨的拉力，預防蹄骨旋轉。","we":["B. 強迫運動會加重蹄部血流障礙，急性期應限制移動。","C. 蹄尖修削應在慢性期才考慮，急性期不適合。","D. 冷療（icing）可用於預防，但急性發作時效益有限，非主要治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_004","year":2015,"roc_year":104,"session":"","examNo":4,"q":"下列何項不適用於舟狀骨疾病（navicular disease）的治療？","opts":["A. 掌趾神經切除術（palmar digital neurectomy）","B. 舟狀骨懸韌帶切開術（navicular suspensory ligament desmotomy）","C. 先休息幾週後，接下來幾週控制其運動量","D. 將蹄尖背側面削15度角"],"ans":3,"exp":"舟狀骨疾病（navicular disease）治療不包括將蹄尖背側面削15度角。此操作反而會增加深趾屈肌腱在舟狀骨上的壓力，加重病情。正確做法是墊高蹄踵以減少DDFT張力。","we":["A. 使用蹄鐵墊高蹄踵是舟狀骨疾病的標準處置。","B. 限制運動可減少持續性損傷。","C. 使用NSAIDs控制炎症與疼痛是適當的內科治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_005","year":2015,"roc_year":104,"session":"","examNo":5,"q":"幼駒運動過度最常發生下列何處之壓迫性骨折（stress fracture）？","opts":["A. 脛骨","B. 腓骨","C. 掌骨","D. 尺骨"],"ans":2,"exp":"幼駒（foal）壓迫性骨折最常發生於掌骨（metacarpal bone），尤其是第三掌骨，因其承受體重且皮質薄，受壓後易發生不完全骨折（incomplete fracture）。","we":["A. 股骨骨折在幼駒雖可見，但壓迫性骨折較少發生於此。","B. 脛骨骨折多為外傷性，壓迫性骨折不典型。","D. 橈骨骨折在幼駒可見，但掌骨更常見壓迫性骨折。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_006","year":2015,"roc_year":104,"session":"","examNo":6,"q":"下列那一項藥物在治療仔牛腦膜炎（meningitis）後，在腦脊髓液中與血漿中濃度的比值最\r 高？","opts":["A. 安比西林（ampicillin）","B. 健大黴素（gentamicin）","C. 盤尼西林（penicillin）","D. 甲氧芐啶（trimethoprim）與磺胺甲噁唑（sulfamethoxazole）"],"ans":3,"exp":"治療仔牛細菌性腦膜炎時，選擇能良好穿透血腦屏障（BBB）的抗生素至關重要。Trimethoprim與sulfamethoxazole（TMP-SMZ）組合在CSF中的濃度可達血漿濃度的50%以上，具最高CSF/血漿比，是最佳選擇。","we":["A. Penicillin對BBB穿透性差，單獨用於腦膜炎效果不足。","B. Ampicillin穿透性中等，優於penicillin但不如TMP-SMZ。","C. Aminoglycosides（如gentamicin）BBB穿透性極差，不適用於腦膜炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_007","year":2015,"roc_year":104,"session":"","examNo":7,"q":"牛結腸臌脹症之ping test金屬音常出現於下列何處？","opts":["A. 右側假肋至脇部呈香腸樣條狀區域","B. 右側第11－13肋上方","C. 左側第9－12肋上方三分之一處呈圓狀至橢圓狀區域","D. 左側第9－12肋下方三分之一處呈圓狀至橢圓狀區域"],"ans":0,"exp":"牛盲腸與近端結腸臌脹時，ping test（叩診清音）位置在右側假肋（sublumbar fossa）至脇部，呈特徵性香腸樣條狀清音區域（sausage-shaped area），可與皺胃左方移位（LDA）的圓形清音區別。","we":["B. 皺胃左方移位的ping在左側肋骨弓下方，非右側。","C. 右側腸管臌脹區域更廣，非特定香腸形狀。","D. 氣胸ping test在胸廓，非腹腔香腸樣條狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_008","year":2015,"roc_year":104,"session":"","examNo":8,"q":"下列關於心包炎之敘述，何項錯誤？","opts":["A. 發生初期可聽見摩擦音","B. 化膿性心包炎會因心包膜與心外膜粘連，造成鬱血性心衰竭","C. 創傷性心包炎發生時，血液檢查可見白血球增多，但無核左轉現象","D. 心包炎第二期可發現心音和心搏動均減弱，且心濁音界擴大"],"ans":2,"exp":"創傷性心包炎（traumatic pericarditis）敘述中，錯誤的是「無核左轉（left shift）」。實際上，創傷性心包炎因感染/化膿性炎症，白血球計數升高且有明顯的核左轉，反映急性細菌感染。","we":["A. 心包摩擦音（pericardial friction rub）是早期特徵，正確。","B. 雙側頸靜脈怒張是心包積液壓迫的表現，正確。","D. 胸腹水（hydrothorax/hydroperitoneum）在慢性創傷性心包炎可見，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_009","year":2015,"roc_year":104,"session":"","examNo":9,"q":"牛在下列何項中毒時會出現青綠色下痢便？","opts":["A. 鉬","B. 氟","C. 銅","D. 硒"],"ans":0,"exp":"鉬（molybdenum）中毒導致繼發性銅缺乏，表現為青綠色（teal-colored）腹瀉，稱為「teart」病。鉬與硫化物結合形成thiomolybdate，阻礙腸道對銅的吸收，導致銅缺乏性下痢。","we":["B. 鉛中毒表現為神經症狀（失明、抽搐），非青綠色下痢。","C. 砷中毒引起急性胃腸炎和神經症狀，糞便非青綠色。","D. 氟中毒主要影響牙齒和骨骼，不引起青綠色下痢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_010","year":2015,"roc_year":104,"session":"","examNo":10,"q":"牛發生重症肝炎時，在飼養上應給與何種日糧？","opts":["A. 高熱能高蛋白","B. 低熱能高蛋白","C. 高熱能低蛋白","D. 低熱能低蛋白"],"ans":2,"exp":"牛重症肝炎（severe hepatitis）時，肝臟解毒與代謝功能嚴重受損，飼養原則應給予「高熱能低蛋白」飲食，以減少肝臟代謝蛋白質產生的氨（ammonia），預防肝性腦病（hepatic encephalopathy）。","we":["A. 高蛋白飲食會加重氨的產生，對重症肝炎有害。","B. 低熱能高蛋白同樣有害，會導致分解代謝和氨增加。","D. 低熱能低蛋白雖可減少氨，但熱能不足會加速肌肉分解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_011","year":2015,"roc_year":104,"session":"","examNo":11,"q":"皺胃擴張及捻轉最常發生於下列乳牛的那一時期？","opts":["A. 產前3－6週","B. 產後3－6週","C. 產前7－9週","D. 產後7－9週"],"ans":1,"exp":"皺胃擴張及捻轉（abomasal dilatation and volvulus）最常發生於分娩後3-6週，此時母牛採食量尚未完全恢復，皺胃蠕動減弱，加上能量負平衡，易造成皺胃積氣擴張進而捻轉。","we":["A. 分娩前1-2週雖有代謝壓力，但皺胃捻轉較少在此時發生。","C. 分娩後1-2週是皺胃左方移位高峰，捻轉多發於稍後。","D. 泌乳高峰期（分娩後4-8週）是皺胃問題的高危期，但捻轉峰值在3-6週。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_012","year":2015,"roc_year":104,"session":"","examNo":12,"q":"牛酮病時會有那些變化？①血糖下降 ②尿中酮體升高 ③肝臟肝醣上升 ④血糖上升 ⑤\r 肝臟肝醣下降","opts":["A. ①②③","B. ②③④","C. ③④⑤","D. ①②⑤"],"ans":3,"exp":"牛酮病（ketosis）的代謝變化包括：①血糖下降（低血糖）、②酮尿（ketonuria）、⑤肝醣下降（肝糖原消耗）。這些是糖異生不足、脂肪動員過度的典型表現。","we":["A. 僅選①②未包含⑤，不完整。","B. ①②③中，③血中尿素升高不是酮病特徵，而是蛋白質分解增加的表現。","C. ①②④中，④血中游離脂肪酸（NEFA）升高雖可見，但①②⑤更具診斷意義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_013","year":2015,"roc_year":104,"session":"","examNo":13,"q":"下列何種症狀不會出現於牛隻急性維生素E及硒缺乏症？","opts":["A. 全身麻痺","B. 步態僵硬","C. 後弓反張","D. 心悸亢進"],"ans":2,"exp":"急性維生素E/硒缺乏（白肌病，white muscle disease）主要表現為骨骼肌與心肌壞死，症狀包括肌肉僵硬、虛弱、無法站立。「後弓反張（opisthotonus）」是腦部/脊髓病變的表現，不屬於急性白肌病症狀。","we":["A. 肌肉無力（muscular weakness）是白肌病核心症狀，正確。","B. 不願移動/步態僵硬（stiffness）是骨骼肌病變的表現，正確。","D. 心跳異常（cardiac arrhythmia）因心肌受累而出現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_014","year":2015,"roc_year":104,"session":"","examNo":14,"q":"關於牛慢性蹄葉炎，下列何項敘述錯誤？","opts":["A. 蹄壁常有蹄輪形成","B. 蹄尖部角質向前方伸展彎曲","C. 蹄骨前端向上方伸展壓迫蹄壁","D. 蹄骨與蹄壁間之間隔擴大"],"ans":2,"exp":"牛慢性蹄葉炎（chronic laminitis）中，蹄骨（pedal bone）的變化是向下旋轉，蹄骨前端向蹄底方向移位，嚴重時穿透蹄底（sole penetration）。「蹄骨前端向上方伸展壓迫蹄壁」描述錯誤，方向相反。","we":["A. 蹄踵過度生長（heel overgrowth）導致蹄形改變，正確描述。","B. 蹄底平坦或凹陷（dropped sole）是慢性蹄葉炎特徵，正確。","D. 蹄壁出現生長紊亂線（growth rings）是慢性炎症的表現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_015","year":2015,"roc_year":104,"session":"","examNo":15,"q":"牛叩診（acoustic percussion）之反響音試驗（ping test）最不適用於下列何項之診斷？","opts":["A. 皺胃異位","B. 氣胸","C. 結腸臌脹","D. 盲腸捻轉和擴張"],"ans":1,"exp":"Ping test（同步叩打聽診）需要空腔臟器含氣體才能產生清亮的鐘聲。氣胸（pneumothorax）雖然胸腔有氣體，但氣胸時氣體在胸膜腔，加上胸壁厚度，ping test訊號不典型，且氣胸的診斷主要依賴聽診和影像學，不適合用ping test診斷。","we":["A. 皺胃左方移位（LDA）是ping test最典型的應用場景。","C. 盲腸臌脹（cecal dilatation）可在右腹部產生典型ping聲。","D. 皺胃右方移位（RDA）可在右側肋弓後方產生ping聲。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_016","year":2015,"roc_year":104,"session":"","examNo":16,"q":"牛在舌頭及鄰近之淋巴結出現軟而厚壁的膿腫，最有可能為下列何項疾病？","opts":["A. 結核病（tuberculosis）","B. 放線桿菌病（actinobacillosis）","C. 乾酪性淋巴結炎（caseous lymphadenitis）","D. 潰瘍性淋巴管炎（ulcerative lymphangitis）"],"ans":1,"exp":"牛舌頭軟膿腫（木舌病）是由放線桿菌（Actinobacillus lignieresii）引起的肉芽腫性炎症，稱為放線桿菌病（actinobacillosis）。此菌感染舌部軟組織，與感染骨骼的放線菌（Actinomyces）引起的木塊病（lumpy jaw）不同。","we":["A. 放線菌病（actinomycosis，木塊病）感染下頜骨，非軟組織舌頭。","C. 壞死性喉頭炎（necrotic laryngitis，calf diphtheria）影響喉部，非舌部軟膿腫。","D. 口蹄疫（FMD）引起水泡性病變，非膿腫性舌炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_017","year":2015,"roc_year":104,"session":"","examNo":17,"q":"下列何者為牛隻羊齒（蕨）植物中毒之主徵？","opts":["A. 血尿","B. 咳嗽","C. 呼吸困難","D. 便秘"],"ans":0,"exp":"牛食入蕨類植物（bracken fern，Pteridium aquilinum）中毒的主要臨床徵象是血尿（hematuria），由蕨類植物中的tiaquiloside破壞骨髓造血功能，導致血小板減少性出血，表現為持續性血尿和出血傾向。","we":["B. 神經症狀（blind staggers）是某些植物中毒的表現，非蕨類植物急性毒性主徵。","C. 光敏感性（photosensitivity）是其他植物毒素引起的症狀，非蕨類中毒特徵。","D. 流產（abortion）不是蕨類植物中毒的主要特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_018","year":2015,"roc_year":104,"session":"","examNo":18,"q":"牛第四心音出現與下列何項有關？","opts":["A. 心室收縮前期","B. 心室收縮末期","C. 心房舒張","D. 心房收縮"],"ans":3,"exp":"牛的第四心音（S4）又稱心房音（atrial sound），出現在舒張末期，由心房收縮（atrial contraction）推送血液進入心室時引起。正常情況下在大型動物（如牛、馬）可聽到。","we":["A. 第一心音（S1）對應二尖瓣和三尖瓣關閉（收縮期開始）。","B. 第二心音（S2）對應主動脈瓣和肺動脈瓣關閉（舒張期開始）。","C. 第三心音（S3）對應舒張早期快速充盈，非心房收縮。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_019","year":2015,"roc_year":104,"session":"","examNo":19,"q":"牛皺胃左側異位，其糞便通常呈現何種性狀？","opts":["A. 乾燥圓盤狀","B. 黏稠泥狀","C. 含黏液帶黑色水樣下痢便","D. 含血之泥狀栓子塊"],"ans":1,"exp":"皺胃左方移位（LDA）時，由於皺胃位移至瘤胃左側，影響消化與腸道蠕動，糞便特徵為黏稠泥狀（pasty），量減少，顏色較深，這是因為食糜通過受阻、消化不良所致。","we":["A. 水樣腹瀉見於急性腸炎或輪狀病毒感染，非LDA典型。","C. 硬結圓球狀糞便見於便秘，而非LDA主要表現。","D. 血便見於出血性腸炎或腸套疊，LDA不典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_020","year":2015,"roc_year":104,"session":"","examNo":20,"q":"懷孕母牛之飼糧缺乏下列何種元素會引起仔牛一出生即無毛？","opts":["A. 鐵","B. 鋅","C. 銅","D. 碘"],"ans":3,"exp":"懷孕母牛缺乏碘（iodine）時，甲狀腺素合成不足，仔牛出生時可能出現甲狀腺腫（goiter）和無毛（hairless）或毛髮稀疏，因為甲狀腺素對胎兒毛囊發育至關重要。","we":["A. 缺銅（copper deficiency）主要引起毛色褪色（steely wool）和骨骼異常，非無毛。","B. 缺鋅（zinc deficiency）引起皮膚角化不全，非仔牛無毛主因。","C. 缺錳（manganese deficiency）引起骨骼畸形和生殖障礙，非無毛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_021","year":2015,"roc_year":104,"session":"","examNo":21,"q":"若要以2% lidocaine進行成牛手術前之尾根硬膜外（caudal epidural anesthesia）麻醉，下\r 列之總劑量中何者最適當且可以維持牛隻站立？","opts":["A. 4 ml","B. 8 ml","C. 16 ml","D. 40 ml"],"ans":0,"exp":"成牛尾根硬膜外麻醉（caudal epidural anesthesia）若要維持站立姿勢，局部麻醉藥（2% lidocaine）使用量應不超過4 ml，以避免過多藥物擴散至腰薦段脊髓，造成後肢麻痺而無法站立。","we":["B. 8 ml劑量過大，會導致後肢麻痺和臥倒。","C. 12 ml劑量更大，不適合維持站立的硬膜外麻醉。","D. 16 ml為過量，會引起呼吸抑制等全身副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_022","year":2015,"roc_year":104,"session":"","examNo":22,"q":"下列各種切開（approach）方式中，何者最適合進行牛帝王切開術且最不會引起腹腔的污\r 染？","opts":["A. 左腹脇部切開（left-flank incision）","B. 右腹脇部切開（right-flank incision）","C. 斜側腹切開（ventrolateral oblique approach）","D. 腹中線切開（ventral median incision）"],"ans":0,"exp":"牛帝王切開（cesarean section）中，左腹脇部切開（left paralumbar flank approach）是最不會污染腹腔的術式，因為在左側可充分暴露子宮，且腸管較少暴露，腹腔污染風險最低。","we":["B. 腹下部切開（ventral midline）腸管暴露多，污染風險高。","C. 右腹脇部切開也是可行術式，但子宮暴露較困難，污染風險略高。","D. 左側肋弓切開不是常用的帝王切開路徑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_023","year":2015,"roc_year":104,"session":"","examNo":23,"q":"乳牛在分娩後不久隨即發生陰道脫垂，並於初期可見子宮頸脫垂至陰戶外，此為第幾度之陰\r 道脫垂？","opts":["A. 第一度","B. 第二度","C. 第三度","D. 第四度"],"ans":2,"exp":"乳牛分娩後子宮頸完全脫垂至陰戶外，稱為第三度陰道脫垂（third degree vaginal prolapse）或完全性脫垂，包含子宮頸脫出陰門之外。第一度為部分陰道壁下垂，第二度為陰道可見於陰門。","we":["A. 第一度陰道脫垂僅為陰道壁部分外翻，未脫出陰門外。","B. 第二度陰道脫垂為陰道外翻至陰門外，但不包含子宮頸。","D. 第四度（完全子宮脫垂）包含整個子宮翻出體外，比第三度更嚴重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_024","year":2015,"roc_year":104,"session":"","examNo":24,"q":"應用於乳牛手術前之鎮靜藥物xylazine是屬於下列那一種促效劑（agonist）？","opts":["A. α-1","B. α-2","C. β-1","D. β-2"],"ans":1,"exp":"Xylazine是α2-腎上腺素受體促效劑（α2-adrenergic agonist），與突觸前和突觸後α2受體結合，產生鎮靜、鎮痛和肌肉鬆弛效果。在大型動物（尤其是牛）具有強效作用，劑量較馬低10倍。","we":["A. α1腎上腺素受體促效劑（如phenylephrine）主要引起血管收縮，無鎮靜效果。","C. β1腎上腺素受體促效劑（如dobutamine）主要用於強心，非鎮靜藥。","D. β2腎上腺素受體促效劑（如terbutaline）主要用於支氣管擴張，非鎮靜藥。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_025","year":2015,"roc_year":104,"session":"","examNo":25,"q":"小牛臍帶感染最常見之部位為下列何項？","opts":["A. 臍尿管","B. 臍靜脈","C. 臍動脈","D. 臍孔周圍皮下組織"],"ans":1,"exp":"小牛臍帶感染（omphalitis）時，細菌最常沿臍靜脈（umbilical vein）向上蔓延，進入肝臟門脈系統，引起肝膿腫。臍靜脈感染率高於臍動脈，因靜脈壁較薄且直接通向肝臟。","we":["A. 臍動脈（umbilical arteries）感染也可發生，但頻率低於臍靜脈。","C. 臍尿管（urachus）感染較少見，主要引起臍部持續滲尿。","D. 臍孔蜂窩組織炎（cellulitis）為表淺感染，深層導管感染更常見通過臍靜脈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_026","year":2015,"roc_year":104,"session":"","examNo":26,"q":"手術中使用lidocaine作局部麻醉劑時，造成傷口延遲癒合的主要原因為何？","opts":["A. 麻醉神經的效應","B. 會與傷口組織分泌之生化物質結合","C. 成分本身具有組織刺激作用","D. 製劑為酸性，會造成組織傷害"],"ans":3,"exp":"Lidocaine製劑為酸性（pH 3.5-6.0），注射後局部組織pH降低，而局部麻醉藥的活性形式（游離鹼基）在酸性環境中減少，同時酸性環境抑制成纖維細胞活性和膠原合成，這是lidocaine造成傷口延遲癒合的主要原因。","we":["A. 血管收縮劑（如epinephrine）減少血流可延遲癒合，但這是添加劑的作用，非lidocaine本身主因。","B. 神經阻斷雖可降低局部代謝，但非傷口延遲癒合主因。","C. 直接細胞毒性在高濃度時存在，但主因為酸性pH。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_027","year":2015,"roc_year":104,"session":"","examNo":27,"q":"切除有病變的腎臟後最容易出現之手術併發症為下列何項？","opts":["A. 腹膜炎","B. 腹腔內出血","C. 肝臟膿腫","D. 膀胱炎"],"ans":1,"exp":"牛腎臟切除（nephrectomy）後最常見的手術併發症是腹腔內出血（intraperitoneal hemorrhage），因腎動脈、靜脈的結紮或縫合失敗，或因腎門血管撕裂造成術後出血，後果嚴重。","we":["A. 感染/腹膜炎雖為術後併發症，但發生率低於出血。","C. 輸尿管損傷可能發生，但嚴重性低於大血管出血。","D. 腸管損傷在手術中可能發生，但大血管出血更危急。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_028","year":2015,"roc_year":104,"session":"","examNo":28,"q":"山羊在感染山羊關節炎腦炎病毒（caprine arthritis-encephalitis virus）後，主要在那一年齡\r 層的羊出現腦脊髓白質炎 （leukoencephalomyelitis）症狀？","opts":["A. 1到2個月","B. 2到6個月","C. 6個月到12個月","D. 12個月到18個月"],"ans":1,"exp":"山羊關節炎腦炎病毒（CAEV）引起的腦脊髓白質炎（leukoencephalomyelitis）主要影響2到6個月齡的幼山羊，臨床表現為後肢漸進性麻痺，因病毒嗜好髓鞘，在幼畜神經系統發育期間造成最嚴重損傷。","we":["A. 新生羔羊（0-1個月）雖可感染CAEV，但腦脊髓炎更常見於稍大幼羊。","C. 6到12個月齡以上的山羊CAEV感染主要表現為關節炎，非腦脊髓炎。","D. 成年山羊CAEV感染主要引起慢性關節炎、乳腺炎和間質性肺炎，非腦脊髓白質炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_029","year":2015,"roc_year":104,"session":"","examNo":29,"q":"下列何種公畜較易發生尿道結石？","opts":["A. 兔","B. 閹羊","C. 閹馬","D. 豬"],"ans":1,"exp":"閹羊（castrated male sheep/wether）最容易發生尿道結石（urolithiasis），因為去勢後雄性激素減少，導致尿道（特別是乙狀彎曲sigmoid flexure和尿道突起）發育不完全，管腔較細，結石更容易阻塞。","we":["A. 公羊（intact ram）尿道較閹羊粗，結石阻塞較少見。","C. 公豬尿道也相對較粗，尿道結石發生率低於閹羊。","D. 公牛尿道阻塞主要發生在乙狀彎曲，但整體發生率低於閹羊。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_030","year":2015,"roc_year":104,"session":"","examNo":30,"q":"下列何種動物常因胃潰瘍出血而突然死亡？","opts":["A. 牛","B. 馬","C. 豬","D. 羊"],"ans":2,"exp":"豬（swine）常因胃潰瘍（gastric ulcer）出血而突然死亡，豬的胃潰瘍好發於無腺部（pars esophagea），常因精細研磨的飼料、壓力或Helicobacter感染引起，出血量大時可致急性死亡。","we":["A. 牛胃潰瘍雖可發生，但急性大出血致死較少見。","B. 馬胃潰瘍很常見（特別是幼駒），但急性大出血死亡相對少見。","D. 羊胃潰瘍不典型，不以急性出血死亡著稱。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_031","year":2015,"roc_year":104,"session":"","examNo":31,"q":"某山羊場2－8週齡仔羊多數出現急性發燒及死亡，有些出現神經症狀、關節腫脹及肺炎，下\r 列何種疾病最有可能？","opts":["A. 黴漿菌感染症","B. 山羊的病毒性關節炎腦炎","C. 披衣菌感染症","D. 沙氏桿菌感染症"],"ans":0,"exp":"2-8週齡仔羊急性死亡合併關節腫脹和肺炎的典型病因是黴漿菌感染症（Mycoplasma infection），Mycoplasma ovipneumoniae引起肺炎，M. agalactiae等引起多發性關節炎，是仔羊常見的全身性感染。","we":["B. 腸毒血症（enterotoxemia，魏氏梭菌）主要引起急性死亡但不以關節腫脹為特徵。","C. 李斯特菌病（listeriosis）引起腦炎，不典型以關節腫脹+肺炎表現。","D. 沙門桿菌症可引起關節炎，但不是2-8週齡合併肺炎的最典型診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_032","year":2015,"roc_year":104,"session":"","examNo":32,"q":"下列何種飼料最易誘發豬隻桑椹心臟病（mulberry heart disease）？","opts":["A. 硒含量過高","B. 維生素E過量","C. 富含玉米、黃豆飼料","D. 低熱量之飼料"],"ans":2,"exp":"豬桑椹心臟病（mulberry heart disease）由維生素E/硒缺乏引起，常見於餵飼富含玉米黃豆的飼料（缺乏維生素E或維生素E被氧化失活），導致心肌纖維化和出血，心臟切面呈桑椹狀。","we":["A. 富含魚粉飼料與鹽分中毒或缺碘有關，非桑椹心主因。","B. 富含高脂肪飼料主要引起脂肪肝，非桑椹心。","D. 黴菌毒素（mycotoxin）飼料可引起多種器官病變，但桑椹心主因是維生素E/硒缺乏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_033","year":2015,"roc_year":104,"session":"","examNo":33,"q":"下列那一種動物最常發生先天性肛門閉鎖（anal atresia）？","opts":["A. 馬","B. 牛","C. 羊","D. 豬"],"ans":3,"exp":"先天性肛門閉鎖（atresia ani）最常發生於豬（swine），尤其是純種豬，具有遺傳傾向。仔豬出生後因無法排便而腹部膨脹，需緊急手術治療。","we":["A. 仔牛（calf）先天性肛門閉鎖雖可見，但發生率低於豬。","B. 羔羊（lamb）偶見肛門閉鎖，但發生率低於豬。","C. 仔貓雖可發生，但發生率遠低於豬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_034","year":2015,"roc_year":104,"session":"","examNo":34,"q":"下列有關母犬子宮蓄膿之敍述，何者錯誤？","opts":["A. 患畜大都有多渴多尿症狀","B. 好發於未結紮的母犬","C. 患畜常會繼發間質性腎炎","D. 好發於發情期過後1－2個月期間"],"ans":2,"exp":"母犬子宮蓄膿症（pyometra）相關的腎臟病變主要是腎小球腎炎（glomerulonephritis），由免疫複合物沉積引起，而非間質性腎炎（interstitial nephritis）。描述為「繼發間質性腎炎」是錯誤的。","we":["A. 多渴多尿（PU/PD）因細菌毒素影響腎小管對ADH反應，正確。","B. 開放型子宮蓄膿有陰道分泌物，閉鎖型則無，正確描述。","D. 患犬常出現白血球增多症（leukocytosis）和核左轉，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_035","year":2015,"roc_year":104,"session":"","examNo":35,"q":"關於牛子宮捻轉，下列敘述何項錯誤？","opts":["A. 分娩前捻轉多發生在子宮頸部","B. 陰唇常伴隨腫大及歪斜","C. 陰道壁捻轉方向與子宮捻轉方向相反","D. 可使用牛體或胎兒滾轉法處置"],"ans":2,"exp":"牛子宮捻轉（uterine torsion）中，陰道壁的捻轉方向與子宮相同（同方向），非相反。子宮旋轉時帶動周圍韌帶和陰道，陰道壁皺褶的方向可幫助判斷捻轉方向。","we":["A. 子宮捻轉最常見於分娩前或分娩時，正確。","B. 滾轉法（rolling the cow）是非外科處置子宮捻轉的方法，正確。","D. 嚴重捻轉（>360度）需要開腹手術矯正，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_036","year":2015,"roc_year":104,"session":"","examNo":36,"q":"牛胎兒頭部及四肢均無法觸診到的難產為","opts":["A. 縱腹位（ventrovertical presentation）","B. 橫腹位（ventrotransversal presentation）","C. 縱背位（dorsovertical presentation）","D. 側頭位（deviation of the head）"],"ans":1,"exp":"牛難產中，若胎兒頭部及四肢均無法觸診到，最可能是橫腹位（ventrotransversal presentation），胎兒橫向位於產道，腹部朝向頸部，頭部和四肢均在宮腔深處，無法在陰道口觸及。","we":["A. 縱腹位（longitudinal ventral）頭或尾朝外，通常可觸及部分肢體。","C. 背橫位（dorsotransversal）雖也是橫位，但背部朝外，可能觸及背部結構。","D. 前置後腳（posterior presentation）可觸及後肢，能診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_037","year":2015,"roc_year":104,"session":"","examNo":37,"q":"促使黃體退化的內泌素為","opts":["A. FSH","B. oxytocin","C. PGF2α","D. LTH"],"ans":2,"exp":"促使黃體退化（luteolysis）的主要內泌素是前列腺素F2α（PGF2α），由子宮內膜分泌，透過反流（countercurrent exchange）機制作用於黃體，抑制黃體細胞功能，降低黃體酮（progesterone）分泌，使發情週期繼續。","we":["A. LH（黃體生成素）促進黃體形成，非退化。","B. GnRH促進FSH和LH分泌，間接調控黃體，非直接溶黃體激素。","D. Estrogen（雌激素）高濃度時可增加子宮對PGF2α的反應，但本身非直接溶黃體。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_038","year":2015,"roc_year":104,"session":"","examNo":38,"q":"下列那種動物胎盤之特徵，歸類為帶狀（zonary）胎盤？","opts":["A. 牛","B. 兔","C. 馬","D. 貓"],"ans":3,"exp":"帶狀胎盤（zonary placenta）是食肉目動物的特徵，貓（cat）具有帶狀胎盤，胎盤形如腰帶環繞胎兒中部。犬、貓、狐狸等食肉目動物均具此種胎盤類型。","we":["A. 馬（horse）為彌散型胎盤（diffuse placenta）。","B. 豬（swine）為彌散型胎盤（diffuse/folded placenta）。","C. 牛（cattle）為子葉型胎盤（cotyledonary placenta）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_039","year":2015,"roc_year":104,"session":"","examNo":39,"q":"下列有關犬隱睪症（cryptorchidism）之敍述，何者錯誤？","opts":["A. 隱睪常在的位置是位於腹腔或鼠蹊","B. 患畜的精子生成作用（spermatogenesis）不會受影響","C. 患畜的性慾（libido）不會受影響","D. 患畜睪固酮（testosterone）的分泌不會受影響"],"ans":1,"exp":"犬隱睪症（cryptorchidism）中，隱睪的精子生成（spermatogenesis）受到影響，因腹腔或鼠蹊管內溫度高於陰囊（約2-3°C），高溫抑制精子發生，導致受影響的睪丸不育。「精子生成不受影響」的敘述錯誤。","we":["A. 隱睪症具有遺傳傾向，不應用於繁殖，正確。","C. 隱睪症（尤其腹腔隱睪）罹患睪丸腫瘤（特別是精原細胞瘤、Sertoli細胞瘤）的風險顯著升高，正確。","D. 單側隱睪犬因另一側正常睪丸，仍可能有繁殖能力，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_040","year":2015,"roc_year":104,"session":"","examNo":40,"q":"下列何項最不常出現於母犬子宮蓄膿症？","opts":["A. 尿毒症","B. 白血球增多症","C. 酸鹼不平衡","D. 浮腫"],"ans":3,"exp":"母犬子宮蓄膿症（pyometra）常見症狀包括多渴多尿（PU/PD）、嘔吐、腹圍增大、陰道分泌物（開放型）、白血球增多等。「浮腫（edema）」不是子宮蓄膿典型症狀，選項中最不常出現。","we":["A. 多渴多尿（PU/PD）是子宮蓄膿非常常見的症狀。","B. 嘔吐（vomiting）因毒素和腹部疼痛常見於子宮蓄膿患犬。","C. 腹圍增大因子宮擴張積膿而常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_041","year":2015,"roc_year":104,"session":"","examNo":41,"q":"對於母犬子宮蓄膿症採用下列那項治療法，防止復發最有效？","opts":["A. 子宮卵巢切除術（ovariohysterectomy）","B. 注射抗生素及催產素","C. 卵巢切除術（ovarioectomy）","D. 抗生素灌洗子宮"],"ans":0,"exp":"母犬子宮蓄膿症防止復發最有效的方法是子宮卵巢切除術（ovariohysterectomy, OHE），徹底移除子宮和卵巢，消除孕酮刺激和感染病灶，是根治性治療方法。","we":["B. 單純抗生素治療可控制急性感染，但不能防止復發，停藥後易再發。","C. PGF2α促進子宮收縮排出蓄膿，但不能防止下次發情後再發。","D. 卵巢切除（ovariectomy）保留子宮，若子宮已有病變，無法完全預防復發。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_042","year":2015,"roc_year":104,"session":"","examNo":42,"q":"關於動物分娩第一期陣痛（first stage of labour）的特徵，下列何項錯誤？","opts":["A. 子宮頸擴張","B. 子宮角構造改變進而擴張","C. 胎兒姿勢改變為四肢伸展","D. 胎兒轉動呈上胎向"],"ans":1,"exp":"分娩第一期（first stage of labor）特徵包括子宮頸擴張、行為不安、輕微腹痛。描述「子宮角構造改變進而擴張」不準確，第一期主要是子宮頸擴張（cervical dilation），而非子宮角本身改變，這是錯誤的敘述。","we":["A. 行為改變（不安、築巢行為）是第一期正確特徵。","C. 陰道分泌物增加（宮頸黏液栓排出）是第一期特徵，正確。","D. 輕微陣發性子宮收縮從第一期開始，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_043","year":2015,"roc_year":104,"session":"","examNo":43,"q":"關於催產素（oxytocin）的說明，下列何項錯誤？","opts":["A. 分娩初期啟動子宮肌肉之收縮","B. 母體於胎兒頭部碰觸到子宮頸時，導致其大量釋出","C. 其子宮收縮作用與促進前列腺素（PGF2α）釋出有關","D. 其子宮收縮作用與促進鈣離子（Ca 2＋）釋出有關"],"ans":0,"exp":"催產素（oxytocin）在分娩過程中並非「啟動子宮肌肉收縮」的初始信號，而是在子宮頸擴張後（Ferguson反射）正反饋增加分泌，強化和維持已開始的宮縮。分娩初期宮縮由前列腺素和雌激素變化引發，oxytocin是放大器而非啟動者。","we":["B. Oxytocin由腦下垂體後葉（neurohypophysis）分泌，正確。","C. Oxytocin也促進哺乳期泌乳（milk ejection reflex），正確。","D. Oxytocin受體（oxytocin receptor）在分娩前子宮肌層數量顯著增加，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_044","year":2015,"roc_year":104,"session":"","examNo":44,"q":"乳牛於配種後最早於第幾日採乳汁作助孕酮（progesterone）檢測，其妊娠診斷之可信度最\r 佳？","opts":["A. 15","B. 20","C. 24","D. 32"],"ans":2,"exp":"乳牛配種後，使用乳汁孕酮（milk progesterone）檢測確認妊娠或發情週期，最早可在配種後24日採樣檢測。此時黃體若維持功能（妊娠），孕酮濃度高；若黃體退化（未孕），孕酮濃度低。","we":["A. 配種後7日過早，即使妊娠，孕酮僅剛開始升高，不足以區分。","B. 配種後14日孕酮已可升高，但24日更可靠，區分度更高。","D. 配種後30日雖更可靠，但非「最早」的時間點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2015_2_普通病_045","year":2015,"roc_year":104,"session":"","examNo":45,"q":"下列何項不屬於貓的下泌尿道疾病？","opts":["A. 尿道狹窄","B. 絲球體性腎炎","C. 尿道結石","D. 特發性膀胱炎（idiopathic cystitis）"],"ans":1,"exp":"貓下泌尿
