,{"id":"AMO_2020_普通病_062","year":2020,"roc_year":109,"session":"","examNo":62,"q":"骨髓內釘(intramedullary pin)較能抵抗下列那個方向的外力?","opts":["A. 彎曲(bending)","B. 軸向壓迫(axial compression)","C. 扭轉(torsion)","D. 牽引(extraction)"],"ans":0,"exp":"骨髓內釘（intramedullary pin, IM pin）力學特性：IM pin是縱向放置於骨髓腔的長釘，最能抵抗彎曲力（bending）——因為釘子作為中心支柱，分散側向彎曲應力；但對軸向壓迫（易縮短骨折）、扭轉（容易旋轉）和牽引（容易拔出）抵抗力差。","we":{"A":"A. (正確) IM pin最能抵抗彎曲力（bending force），如同橋梁的中央支柱，有效分散側方彎曲應力。","B":"B. 軸向壓迫（axial compression）容易使IM pin活塞式移動（telescoping），抵抗力差。","C":"C. 扭轉（torsion）是IM pin的主要弱點，IM pin缺乏抗旋轉能力，需輔以cerclage wire或外固定。","D":"D. 牽引（extraction/distraction）力也容易使IM pin移位，抵抗力差。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_063","year":2020,"roc_year":109,"session":"","examNo":63,"q":"下列何者與brachycephalic syndrome無關?","opts":["A. 鼻孔狹窄","B. 軟顎過長","C. 舌下囊腫","D. 氣管發育不全"],"ans":2,"exp":"短頭顱症候群（brachycephalic airway obstruction syndrome）的四大主要成分：鼻孔狹窄（stenotic nares）、軟顎過長（elongated soft palate）、扁桃腺外翻（everted laryngeal saccules）、氣管發育不全（hypoplastic trachea，在某些品種）；舌下囊腫（sublingual mucocele）是唾腺囊腫，與短頭顱症候群的定義完全無關。","we":{"A":"A. 鼻孔狹窄是短頭顱症候群的核心表現，正確。","B":"B. 軟顎過長阻塞鼻咽氣道，是短頭顱症候群的主要成分，正確。","C":"C. (正確) 舌下囊腫（sublingual cyst/mucocele）是唾腺囊腫，與短頭顱症候群完全無關，是本題正確答案。","D":"D. 氣管發育不全在鬥牛犬等品種中為短頭顱症候群的一部分，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_064","year":2020,"roc_year":109,"session":"","examNo":64,"q":"有關犬髖關節發育不良之敘述,下列何項最為正確?","opts":["A. 與遺傳無關","B. 好發於小品種犬隻","C. 會引起髖關節脫臼和半脫臼","D. 不會引起髓關節炎和退行性關節病"],"ans":2,"exp":"犬髖關節發育不良（canine hip dysplasia, CHD）：有明確遺傳傾向（多基因遺傳）；好發於大型和巨型犬（如德國牧羊犬、金毛、拉布拉多）；引起髖臼發育不全、股骨頭半脫臼和脫臼（subluxation/luxation）；最終導致繼發性骨關節炎（OA）和退行性關節病（DJD）。","we":{"A":"A. CHD有顯著遺傳基礎（多基因遺傳），「與遺傳無關」是錯誤的。","B":"B. CHD好發於大型品種犬（German Shepherd, Labrador等），「好發於小品種」是錯誤的。","C":"C. (正確) CHD會引起髖臼發育不全，導致股骨頭半脫臼（subluxation）和脫臼，這是CHD的核心病理。","D":"D. CHD長期進展必然引起繼發性髖關節炎和退行性關節病（DJD），「不會引起關節炎」是錯誤的。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_065","year":2020,"roc_year":109,"session":"","examNo":65,"q":"馬主發現馬的排便少,前蹄刨地動作,精神差,問診得知馬匹為兩日前購入,這兩天主人因天較熱没有騎, 餵飼內容及次數和前馬主不同。臨床檢查體溫38.5℃，心跳52次/分鐘,呼吸32次/分鐘,微血管回流時間2 秒,消化道聽診蠕動音減少,直腸觸診得知大腸內大量較硬的糞便,自鼻胃管未導引出液體。接下來的處置 方式何者不猶當?","opts":["A. 經鼻胃管給予礦物油","B. 給予funixin meglumine","C. 給馬匹新鮮青草刺激食慾","D. 牽馬散步"],"ans":2,"exp":"馬便秘疝痛（constipation/large colon impaction）急性期的管理原則：使用礦物油潤滑、止痛（flunixin meglumine）、輸液、牽馬散步均為適當措施；給予大量新鮮青草在急症期是不適當的——消化道積糞時繼續大量進食可能加重脹氣和消化道負擔，此期應禁食而非餵食。","we":{"A":"A. 礦物油（mineral oil）口服可潤滑積糞，有助於排出，是適當的保守療法。","B":"B. Flunixin meglumine是NSAID，用於止痛和抗炎，是馬疝痛的標準止痛藥。","C":"C. (正確) 急性便秘疝痛期間給予大量新鮮青草是不適當的，此時應停食讓消化道休息，進食只會增加消化道負擔。","D":"D. 牽馬散步可刺激腸道蠕動，促進積糞鬆動，是適當的輔助療法。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_066","year":2020,"roc_year":109,"session":"","examNo":66,"q":"承上題,經處置一天後,馬匹症狀並未改善,反覆疼痛,后腹部逐漸膨大,此時下列何種處置最不適當?","opts":["A. 盲腸穿刺放氣","B. 增加輸液量","C. 立即進行開腹手術","D. 採集糞便做細菌培養及抗生素敏感試驗"],"ans":3,"exp":"馬疝痛症狀加重（後腹部膨大），此時的緊急處置優先順序：盲腸穿刺放氣（解除積氣）、增加輸液（支持循環）、立即開腹手術（若有適應症）均有其臨床邏輯；但在急症疝痛情況下採集糞便做細菌培養及抗生素敏感試驗是完全不適當的——培養需時數天才有結果，對急症管理沒有即時幫助，是浪費時間且不切實際的處置。","we":{"A":"A. 盲腸穿刺放氣可緩解後腹部膨大造成的壓力，是適當的緊急處置。","B":"B. 增加輸液量有助於軟化積糞和維持循環灌流，是適當的。","C":"C. 若症狀持續加重，立即開腹手術可能有其適應症（如大腸捻轉），不是最不適當的。","D":"D. (正確) 採集糞便做細菌培養在急症疝痛中沒有緊急診斷或治療意義，培養結果需等待數日，無法即時指導急症處置，是最不適當的措施。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_067","year":2020,"roc_year":109,"session":"","examNo":67,"q":"牛隻產後兩天,體溫40.5℃，食慾下降,經直腸檢查子宮有大量蓄積液體並帶有惡臭,稍微按壓子宮有大量 惡臭惡露排出,下列何種治療最不合適?","opts":["A. 肌肉注射estrogen","B. 靜脈注射oxytetracycline","C. 肌肉注射oxytoxin","D. 子宮灌洗引流(uterine lavage)"],"ans":0,"exp":"牛產後急性子宮炎，治療最不合適者：estrogen肌肉注射在急性感染期是禁忌—estrogen可在慢性子宮炎時用於促進宮頸開張和子宮排液，但在急性感染期使用estrogen會抑制免疫反應、促進細菌繁殖，且在產後早期（子宮尚未完全恢復）使用會加重病情，是最不合適的治療。","we":{"A":"A. (正確) Estrogen肌肉注射在急性產後子宮炎是最不合適的治療，會抑制局部免疫，可能加重感染。","B":"B. Oxytetracycline靜脈注射是廣效抗生素，是治療急性牛子宮炎的適當選擇。","C":"C. Oxytocin肌肉注射可促進子宮收縮排出惡露，是適當的輔助治療。","D":"D. 子宮灌洗引流（uterine lavage）在惡露大量蓄積時可輔助清除感染源，為可接受的治療措施。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_068","year":2020,"roc_year":109,"session":"","examNo":68,"q":"承上題,本病例最正確的診斷為何?","opts":["A. 子宮蓄膿 (pyometra)","B. 産褥性子宮炎(puerperal metritis)","C. 子宮內膜炎(endometritis)","D. 輸卵管卵巢膿瘍(tubo-ovarian abscesses)"],"ans":1,"exp":"產後兩天出現急性子宮感染（體溫40.5°C，大量惡臭惡露）：此為產褥性子宮炎（puerperal metritis）的典型臨床表現；產褥性子宮炎是產後數天內（通常<7天）因難產、胎衣不下、助產操作污染等引起的急性子宮感染，可進展至敗血症。","we":{"A":"A. 子宮蓄膿（pyometra）通常發生於黃體期（發情後4-10週），不是急性產後期，臨床表現也不同（通常無發燒或輕微發燒，陰道分泌物較稀少或閉鎖型無分泌物）。","B":"B. (正確) 產褥性子宮炎（puerperal metritis）是產後早期（<1週）因感染引起的急性全層子宮炎，症狀包括高燒、大量惡臭惡露、全身症狀，完全符合本例。","C":"C. 子宮內膜炎（endometritis）是較慢性/輕微的子宮黏膜感染，通常無高燒，不是本例急性重症的描述。","D":"D. 輸卵管卵巢膿瘍在牛較罕見，且不是產後惡露蓄積的主要診斷。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_069","year":2020,"roc_year":109,"session":"","examNo":69,"q":"14歲已絕育母貓,食慾和活動減少已2週。近2天飼主注意到有多渴和多尿,且長期頭部低垂 (ventroflexio)之狀況這隻貓在3個月前曾被診斷為慢性腎病(CKD)。理學檢查:體重:3.4公斤,心 跳:150次/分,呼吸:48次/分,systolicblood pressure:167 mmHg6%脫水,黏膜色淡(Pale);血液和 尿液檢查結果如附表。此貓的長期頭部低垂(ventroflexio)與那一項血中離子異常最具相關性?","opts":["A. 低血鈉","B. 低血鉀","C. 低血氣","D. 高血磷"],"ans":1,"exp":"老年貓CKD合併低鉀血症：貓慢性腎病（CKD）常見低鉀血症（多尿→鉀隨尿液流失）；低鉀血症在貓最典型的神經肌肉表現是頸部腹側屈曲（ventroflexion of the neck）——頸部伸肌無力、頭部低垂；也可見全身肌肉無力（步態蹣跚）。","we":{"A":"A. 低血鈉可引起神經症狀，但不是貓ventroflexion的主要原因。","B":"B. (正確) 低血鉀（hypokalemia）在貓引起特徵性頸部腹側屈曲（ventroflexion）和廣泛肌肉無力，是CKD貓低鉀血症的典型表現。","C":"C. 低血氣（hypocalcemia）引起神經肌肉興奮性異常（如肌肉震顫、痙攣），不是ventroflexion的主因。","D":"D. 高血磷是CKD的繼發表現，不直接引起ventroflexion。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_070","year":2020,"roc_year":109,"session":"","examNo":70,"q":"承上題,依據最新Interational Renal Interest Society (IRIS)的公布標準,此貓的蛋白尿在那一期?","opts":["A. proteinuric (P)","B. borderline proteinuric (BP)","C. non-proteinuric (NP)","D. hyperproteinuric (HP)"],"ans":0,"exp":"IRIS蛋白尿分類（依UPC ratio）：Proteinuric (P) = UPC >0.4（貓）；Borderline proteinuric (BP) = UPC 0.2-0.4；Non-proteinuric (NP) = UPC <0.2；此題的UPC值需參考附表方能確定分期（附表未見，標記待複查）。","we":{"A":"A. (可能正確) Proteinuric (P)：UPC >0.4，老年CKD貓因腎小管蛋白重吸收下降，常處於proteinuric狀態。","B":"B. Borderline proteinuric (BP)：UPC 0.2-0.4，介於正常與蛋白尿之間的範圍。","C":"C. Non-proteinuric (NP)：UPC <0.2，表示蛋白尿控制良好，需實際UPC值確認。","D":"D. Hyperproteinuric (HP)：此非IRIS標準分類，不是正確選項。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_071","year":2020,"roc_year":109,"session":"","examNo":71,"q":"承上題,依據最新International Renal Interest Society (IRIS)的公布標準,此貓的creatiine數值是在慢性腎病\r 第幾期?","opts":["A. 二","B. 三","C. 四","D. 五"],"ans":1,"exp":"IRIS CKD分期（依血清肌酸酐/SDMA值）：Stage 1=<1.6 mg/dL；Stage 2=1.6-2.8 mg/dL；Stage 3=2.9-5.0 mg/dL；Stage 4=>5.0 mg/dL（IRIS 2023貓版）。需查閱附表中的肌酸酐值才能確認分期，此題標記待複查。","we":{"A":"A. Stage 2：肌酸酐1.6-2.8 mg/dL，輕至中度CKD。","B":"B. (可能正確) Stage 3：肌酸酐2.9-5.0 mg/dL，中至重度CKD，可能伴有ventroflexion等嚴重症狀，符合此老年貓的病情。","C":"C. Stage 4：肌酸酐>5.0 mg/dL，嚴重腎衰竭，也可能但需確認實際數值。","D":"D. IRIS僅有Stage 1-4，不存在第五期（Stage 5）。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_072","year":2020,"roc_year":109,"session":"","examNo":72,"q":"附圖為犬用脈衝式都卜勒(PWDoppler)超音波,於左頭側胸骨旁掃描之心臟短軸像下所測得之肺動脈血 流,圖中白色箭頭所指波形所代表的血流方向為何?","opts":["A. 朝向探頭","B. 遠離探頭","C. 朝向左邊","D. 朝向中央"],"ans":0,"exp":"PW Doppler超音波基礎：波形在基線上方代表血流朝向探頭（by convention），在基線下方代表血流遠離探頭；左頭側胸骨旁掃描肺動脈時，血流方向（朝向或遠離探頭）取決於探頭方向。（圖片題，標記待複查）","we":{"A":"A. (最可能) 朝向探頭：波形在基線上方，表示血流向探頭方向。","B":"B. 遠離探頭：波形在基線下方，表示血流背離探頭方向。","C":"C. 朝向左邊：PW Doppler以探頭為參考，非左右方向描述。","D":"D. 朝向中央：同上，不是標準PW Doppler方向描述。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_073","year":2020,"roc_year":109,"session":"","examNo":73,"q":"承上題,圖中白色箭頭所指的波形代表血流速度為何?","opts":["A. 0.5公尺/分鐘","B. 1公尺/分鐘","C. 0.5公尺秒","D. 1公尺/秒"],"ans":3,"exp":"PW Doppler肺動脈血流速度：正常肺動脈收縮期峰值血流速度約1.0 m/s（0.8-1.2 m/s），在圖中若白色箭頭指向1 m/s附近的波峰，則代表正常的肺動脈血流速度約1 m/s。（圖片題，標記待複查）","we":{"A":"A. 0.5公尺/分鐘：此速度非常慢（幾乎無流動），不符合心臟血流。","B":"B. 1公尺/分鐘：此速度也極慢，不符合心臟血流速度（應為公尺/秒）。","C":"C. 0.5公尺/秒：0.5 m/s屬肺動脈血流較低範圍，可能。","D":"D. (最可能正確) 1公尺/秒（1 m/s）：正常肺動脈峰值血流速度約1 m/s，是最符合標準的選項。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_074","year":2020,"roc_year":109,"session":"","examNo":74,"q":"6歲未去勢混種公犬,出現喘、咳嗽及運動不耐症狀,胸腔左側照及背腹照光影像如下圖,左側照圖中箭號 所指的部位為何?","opts":["A. 變大的右前肺葉肺動脈","B. 變大的右前肺葉肺靜脈","C. 正常的右前肺葉肺動脈","D. 變大的左前肺葉肺靜脈"],"ans":0,"exp":"6歲未去勢公犬心絲蟲感染案例（咳嗽、運動不耐）：心絲蟲感染→右心室壓力升高→肺動脈擴張；在胸腔X光左側照中，右前肺葉肺動脈在脊柱前方明顯擴大是心絲蟲感染的典型影像學表現。（圖片題，標記待複查）","we":{"A":"A. (最可能) 變大的右前肺葉肺動脈：心絲蟲感染引起肺動脈高血壓，右前肺葉動脈擴大是最典型的X光表現。","B":"B. 右前肺葉肺靜脈：心絲蟲主要影響肺動脈而非靜脈，靜脈擴大見於左心衰竭。","C":"C. 正常的右前肺葉肺動脈：若本例為心絲蟲感染，肺動脈應有擴大，不應為正常。","D":"D. 左前肺葉肺靜脈：不符合心絲蟲感染的典型表現。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_075","year":2020,"roc_year":109,"session":"","examNo":75,"q":"承上題,最有可能的診斷為何?","opts":["A. 二尖瓣閉鎖不全(mitral insufficiency)","B. 心絲蟲感染症(heartworm infection)","C. 肺動脈瓣狹窄(pulmonic stenosis)","D. 三尖瓣閉鎖不全(tricuspid insufficiency)"],"ans":1,"exp":"承上題（6歲未去勢公犬，咳嗽、運動不耐，X光右前肺葉肺動脈擴大）：心絲蟲感染症（heartworm disease, Dirofilaria immitis）的X光典型表現是肺動脈擴大和扭曲、右心室擴大；此為最符合未去勢公犬（心絲蟲感染不受性別影響但此年齡和品種常見）的診斷。","we":{"A":"A. 二尖瓣閉鎖不全主要引起左心擴大和肺靜脈充血（左心衰竭），不引起右前肺葉肺動脈擴大。","B":"B. (正確) 心絲蟲感染症（heartworm infection）引起肺動脈高血壓、右前肺葉肺動脈擴大，是本例的最可能診斷。","C":"C. 肺動脈瓣狹窄引起右心室肥大，但其肺動脈血流減少，不引起肺動脈擴大。","D":"D. 三尖瓣閉鎖不全可引起右心擴大，但主要為右心房和肝臟靜脈鬱血，不是肺動脈擴大的主因。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_076","year":2020,"roc_year":109,"session":"","examNo":76,"q":"下圖犬貓心搏週期中,黑色箭頭所指線條為何?(AP:aortic pressure 、IC : isovolumic contraction 、IR :isovolumic relaxation )","opts":["A. 左心房壓力","B. 左心室壓力","C. 左心室容積","D. 左心房容積"],"ans":1,"exp":"心臟週期Wiggers diagram中，黑色箭頭通常指向左心室壓力（left ventricular pressure）曲線：左心室壓力在等容收縮期（IC）急劇上升，在等容舒張期（IR）急劇下降，形成尖峰曲線，是最典型的辨認特徵。（圖片題，標記待複查）","we":{"A":"A. 左心房壓力在Wiggers diagram中通常呈較平緩的三相曲線（a波、c波、v波），不是尖峰曲線。","B":"B. (最可能) 左心室壓力：在IC期急劇升高，達到主動脈瓣開放後峰值，在IR期急劇下降，是Wiggers diagram中最具特徵的尖峰曲線。","C":"C. 左心室容積：在充填期上升，在射血期下降，是S形或梯形曲線，不是尖峰。","D":"D. 左心房容積：也是較平緩的波動，不如左心室壓力的尖峰特徵明顯。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_077","year":2020,"roc_year":109,"session":"","examNo":77,"q":"承上題,圖中紅色箭頭所指為何?","opts":["A. 第1心音","B. 第2心音","C. 心雜音","D. 奔馬音 (gallop sounds )"],"ans":0,"exp":"Wiggers diagram中心音的對應：第一心音（S1）對應二尖瓣/三尖瓣關閉，發生在等容收縮期（IC）開始時；第二心音（S2）對應主動脈瓣/肺動脈瓣關閉，發生在等容舒張期（IR）開始時。（圖片題，標記待複查）","we":{"A":"A. (最可能) 若紅色箭頭指向IC開始處，即代表第1心音（S1）——二尖瓣/三尖瓣關閉，標誌心室收縮開始。","B":"B. 第2心音（S2）對應IR開始時（半月瓣關閉），若箭頭指向IR開始則為S2。","C":"C. 心雜音（murmur）不是正常心音，在正常Wiggers diagram中不標示。","D":"D. 奔馬音（gallop sounds）為S3或S4，是病理性，在正常Wiggers diagram中不出現。"},"needs_review":true,"imgs":[]},{"id":"AMO_2020_普通病_078","year":2020,"roc_year":109,"session":"","examNo":78,"q":"6歲未去勢杜賓公犬因長期消瘦就診BCS-2/9、胃口及食量正常偏多,偶而嘔吐,糞便量多且常為軟便且色淺,紅血球相為中等程度小球性低色性非再生性貧血,白血球相顯現正常血球總數但淋巴球偏低。理學檢查血清白蛋白值為1.8g/dL、總蛋白質4.5g/dL、A/Gratio為0.67、血氮值6mg/dL、肌酸酐0.5mg/dL。較不可能 為下列何種異常?","opts":["A. 胰臟外泌不足","B. 阻塞性腸道疾病","C. 小腸細菌過度增生性疾病","D. 蛋白質流失性腸病變"],"ans":1,"exp":"杜賓犬案例（消瘦、軟便量多色淺、低白蛋白、低BUN/Cr）：最符合消化吸收不良（EPI最可能）；阻塞性腸道疾病（B）通常表現為嘔吐、食慾廢絕、急性腹痛，不是慢性消瘦+大量色淺軟便的表現，是本案最不可能的診斷。","we":{"A":"A. 胰臟外泌不足（EPI）：消瘦、糞便量多色淺（脂肪瀉）、低BUN（蛋白質消化不良）、正常食慾，高度符合本例。","B":"B. (正確) 阻塞性腸道疾病通常引起急性嘔吐、食慾廢絕、腹痛，不引起長期慢性消瘦和脂肪瀉，是本例最不可能的診斷。","C":"C. 小腸細菌過度增生（SIBO）可引起消化吸收不良，症狀與EPI類似，在鑑別診斷中。","D":"D. 蛋白質流失腸病變（PLE）引起嚴重低白蛋白（通常<1.5 g/dL），本例1.8 g/dL也有可能，在鑑別診斷中。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_079","year":2020,"roc_year":109,"session":"","examNo":79,"q":"承上題,若血清胰蛋白酶樣免疫活性測試呈現嚴重下降,代表此病例最可能為何種疾病?","opts":["A. 胰臟外泌不足","B. 腸道寄生蟲感染","C. 小腸細菌過度增生性疾病","D. 蛋白質流失腸病變"],"ans":0,"exp":"血清胰蛋白酶樣免疫活性測試（serum TLI, trypsin-like immunoreactivity）嚴重下降（<2.5 µg/L in dogs）是胰臟外泌不足（exocrine pancreatic insufficiency, EPI）的確診依據；TLI由胰臟腺泡細胞分泌，EPI時胰臟腺泡細胞減少→TLI顯著降低。","we":{"A":"A. (正確) TLI嚴重下降（<2.5 µg/L）確診為胰臟外泌不足（EPI），是此項檢查最主要的臨床意義。","B":"B. 腸道寄生蟲感染不引起TLI下降，寄生蟲診斷靠糞便蟲卵檢查。","C":"C. SIBO（小腸細菌過度增生）的TLI值通常在正常範圍或輕微升高，不是嚴重下降。","D":"D. 蛋白質流失腸病變不直接影響TLI值，TLI是胰臟外泌功能的特異性指標。"},"needs_review":false,"imgs":[]},{"id":"AMO_2020_普通病_080","year":2020,"roc_year":109,"session":"","examNo":80,"q":"承上題,若糞便檢查中α1-蛋白酶抑制劑為陽性,則本病例之臨床診斷可能為何?","opts":["A. 胰臟外泌不足","B. 腸道寄生蟲感染","C. 小腸細菌過度增生性疾病","D. 蛋白質流失腸病"],"ans":3,"exp":"糞便α1-蛋白酶抑制劑（α1-proteinase inhibitor, α1-PI）在糞便中升高，表示腸道蛋白質從腸壁漏出（protein-losing enteropathy, PLE）；α1-PI是一種大分子蛋白質，正常不透過腸壁，若在糞便中測到升高，代表腸黏膜通透性增加導致蛋白質滲漏至腸腔，即蛋白質流失腸病變。","we":{"A":"A. EPI的糞便TLI嚴重下降，但α1-PI不升高（EPI是消化酶不足，不是蛋白質漏入腸腔）。","B":"B. 腸道寄生蟲感染不特異性引起α1-PI升高。","C":"C. SIBO可引起輕微α1-PI升高，但不如PLE顯著。","D":"D. (正確) 糞便α1-PI升高是蛋白質流失腸病變（PLE）的診斷依據，表示腸道蛋白質滲漏至腸腔，是PLE的確認性檢查。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_001","year":2021,"roc_year":110,"session":"","examNo":1,"q":"下圖馬匹之皮膚病灶，最可能罹患何種疾病？","opts":["A. dermatophytosis","B. pemphigus foliaceus","C. photosensitization","D. equine Cushing's disease"],"ans":2,"exp":"皮膚光敏感症（photosensitization）最常見於牛，原發性光敏感症由攝取含光感物質的植物（如聖約翰草）引起，造成無色素皮膚的光化性皮炎，臨床上在白色皮毛區域出現紅腫、水泡和脫皮。","we":{"A":"A. 光敏感症雖可在所有動物發生，但原發性型在牛最為常見，而非以其他原因為主。","B":"B. 皮膚型光敏感症不以全身感染為主要表現，主要是皮膚局部病變。","C":"C. (正確) 原發性光敏感症是因植物中的光感物質（如金絲桃素）吸收後，在太陽光UV照射下造成氧化傷害。","D":"D. 繼發性（肝源性）光敏感症是因肝功能障礙導致葉綠素代謝物蓄積，並非直接攝取光感物質。"},"needs_review":true,"imgs":[]},{"id":"AMO_2021_普通病_002","year":2021,"roc_year":110,"session":"","examNo":2,"q":"當牛隻維生素E或硒缺乏時，下列何種機制使肌肉產生白肌病？","opts":["A. 因過氧化物傷害肌細胞","B. 肌細胞代謝率降低","C. 肌細胞抗氧化能力增強","D. 肌細胞過氧化氫清除能力增強"],"ans":0,"exp":"白肌病（white muscle disease）是硒和/或維生素E缺乏症，缺乏時細胞無法清除過氧化物，導致過氧化物（peroxide）蓄積，使細胞膜受損，骨骼肌和心肌出現白色壞死病灶。","we":{"A":"A. (正確) 缺乏硒/維生素E時，細胞無法清除過氧化物，導致過氧化損傷是白肌病的核心病理機制。","B":"B. 游離基傷害雖相關，但白肌病的核心是過氧化物清除障礙，而非直接游離基傷害。","C":"C. 鈣離子失衡是心肌病的另一病理機制，但非白肌病的主要原因。","D":"D. 粒線體功能障礙雖可繼發，但白肌病的直接原因是抗氧化防禦不足導致過氧化損傷。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_003","year":2021,"roc_year":110,"session":"","examNo":3,"q":"有關牛隻草酸鹽中毒之敘述，下列何者錯誤？","opts":["A. 易造成酸血症","B. 草酸鹽結晶蓄積於腦部會引起動物麻痺","C. 草酸鹽結晶在腎臟沉積會引起尿石症","D. 草酸鹽攝入過多會引起消化道黏膜炎症反應"],"ans":1,"exp":"草酸鹽中毒（如食用酢漿草、反芻動物食用甜菜葉）會造成低鈣血症（因草酸鈣沉積消耗血鈣）以及腎小管草酸鈣結晶沉積導致腎衰竭，但草酸鹽不在腦部形成結晶；腦部草酸鹽結晶蓄積不是造成中樞神經症狀（麻痺）的機制，真正的腦部症狀是由低鈣血症引起的。","we":{"A":"A. 草酸鹽確實可造成低鈣血症，此為正確；低鈣血症可引起神經肌肉症狀。","B":"B. (正確) 草酸鹽不在腦部形成結晶；腦部神經症狀是由低鈣血症間接引起，而非腦部草酸鹽結晶直接造成。","C":"C. 腎小管草酸鹽沉積是草酸鹽中毒的確切病理發現，此描述正確。","D":"D. 草酸鹽與鈣結合造成低鈣血症是正確的病理機制。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_004","year":2021,"roc_year":110,"session":"","examNo":4,"q":"牛隻甜三葉草中毒所引起之症狀如同下列何種中毒？","opts":["A. 草酸鹽中毒","B. 硝酸鹽中毒","C. 殺鼠劑warfarin中毒","D. 氫氰酸中毒"],"ans":2,"exp":"甜三葉草（sweet clover, Melilotus spp.）在發霉後，其中的香豆素（coumarin）被黴菌轉化為雙香豆素（dicoumarol），後者是維生素K拮抗劑，具有抗凝血作用，機制與warfarin相同。","we":{"A":"A. 氰配醣體（cyanogenic glycosides）見於高粱、亞麻等植物，非甜三葉草毒素。","B":"B. 植酸鹽影響礦物質吸收，與甜三葉草中毒無關。","C":"C. (正確) 甜三葉草發霉後產生dicoumarol，是warfarin類（維生素K拮抗劑）抗凝血物質，造成出血症候群。","D":"D. 草酸鹽造成低鈣血症和腎損傷，非甜三葉草的毒素機制。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_005","year":2021,"roc_year":110,"session":"","examNo":5,"q":"下列何者較不易造成牛隻氫氰酸中毒？","opts":["A. 高粱","B. 蘇丹草","C. 亞麻科植物","D. 洋蔥"],"ans":3,"exp":"洋蔥（Allium spp.）中毒是因含有有機硫化物（organosulfoxides），這些物質氧化性代謝物造成紅血球氧化損傷，形成Heinz body（亨氏小體）並導致溶血性貧血；洋蔥不含氰配醣體（cyanogenic glycosides）。","we":{"A":"A. 有機硫化物確為洋蔥中毒的主要成分，此描述正確。","B":"B. Heinz body形成確為洋蔥中毒的病理特徵，正確。","C":"C. 溶血性貧血確為洋蔥中毒的主要臨床表現，正確。","D":"D. (正確) 氰配醣體存在於高粱、亞麻籽、蘋果籽等植物，洋蔥不含氰配醣體，故此描述錯誤。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_006","year":2021,"roc_year":110,"session":"","examNo":6,"q":"下列何者不屬於肺氣腫的分類？","opts":["A. 急性肺泡氣腫","B. 慢性肺泡氣腫","C. 間質性氣腫","D. 肝樣性氣腫"],"ans":3,"exp":"肺氣腫（emphysema）的分類包括：肺泡性（alveolar）和間質性（interstitial）兩大類；間質性又包括皮下型（subcutaneous）。「肝樣性氣腫（hepatization）」不是肺氣腫的分類，肝樣化是指肺炎時肺組織質地似肝臟（包括紅色肝樣化和灰色肝樣化），是大葉性肺炎的病理分期，而非氣腫。","we":{"A":"A. 肺泡性肺氣腫確為肺氣腫的正確分類之一，描述正確。","B":"B. 間質性肺氣腫確為肺氣腫的正確分類之一，描述正確。","C":"C. 皮下氣腫可繼發於肺氣腫，屬於間質性肺氣腫擴散的一部分，描述正確。","D":"D. (正確) 肝樣化（hepatization）是大葉性肺炎的病理改變，與肺氣腫無關，故不屬於肺氣腫的分類。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_007","year":2021,"roc_year":110,"session":"","examNo":7,"q":"牛心臟何處瓣膜較常發生細菌性心內膜炎？","opts":["A. 二尖瓣","B. 三尖瓣","C. 大動脈瓣","D. 肺動脈瓣"],"ans":1,"exp":"牛的細菌性心內膜炎（bacterial endocarditis）最常侵犯三尖瓣（tricuspid valve），因為牛的創傷性網胃心包炎（traumatic reticulopericarditis）常繼發右心感染，細菌藉血流定植於右心瓣膜；加上牛的膿瘍菌（Arcanobacterium pyogenes）傾向在右側心內膜定植。","we":{"A":"A. 二尖瓣（mitral valve）在小動物（犬貓）是最常受影響的瓣膜，但在牛則以三尖瓣為主。","B":"B. (正確) 牛細菌性心內膜炎最好發於三尖瓣，與創傷性網胃心包炎繼發右心感染有關。","C":"C. 肺動脈瓣心內膜炎相對少見，非牛最常見的部位。","D":"D. 主動脈瓣心內膜炎在牛較不常見，小動物則主動脈瓣是第二好發部位。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_008","year":2021,"roc_year":110,"session":"","examNo":8,"q":"肥胖牛症候群（fat cow syndrome）血液檢查中，下列何者最不易出現？","opts":["A. 血酮上升","B. 血中游離脂肪酸上升","C. 血鈣降低","D. 血鎂降低"],"ans":3,"exp":"生產癱瘓（parturient paresis, milk fever）主要是低鈣血症，常見於高產乳牛產後；低鎂血症（低鎂草痙攣）與之不同但可合併發生。血鎂降低最不容易發生在過肥的牛，因為肥胖牛（乾乳期過飼）反而有低鈣風險；低鎂草痙攣主要見於春季放牧、高産牛或應激牛，而非特別針對肥胖個體。","we":{"A":"A. 春季快速生長的牧草（嫩草）鎂含量低，確實是低鎂草痙攣的風險因子。","B":"B. 高產乳牛泌乳消耗大量鎂，是低鎂血症的風險因子，正確。","C":"C. 應激（transport, weather change）會使鎂排出增加，是風險因子，正確。","D":"D. (正確) 肥胖牛（body condition score過高）是低鈣血症（生產癱瘓）的風險因子，而非低鎂血症的特異性風險因子，故在低鎂血症的發生中較不相關。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_009","year":2021,"roc_year":110,"session":"","examNo":9,"q":"乳牛分娩後出現拱背、下顎皮下水腫、頸靜脈怒張，瘤胃體積因持續性的擴張，其腹囊占據了牛隻整個下腹\r  腔，瘤胃內充滿氣泡性液體，其最有可能為下列那一種疾病？","opts":["A. 瘤胃臌脹","B. 創傷性蜂巢胃炎繼發迷走神經性消化不良","C. 重瓣胃食滯","D. 第四胃異位"],"ans":1,"exp":"創傷性蜂巢胃炎（traumatic reticulitis）因異物穿透蜂巢胃壁，刺激迷走神經（vagus nerve）的胃腸分枝，引起繼發性迷走神經性消化不良（vagal indigestion）；迷走神經受損導致胃腸蠕動和括約肌功能異常，造成瘤胃積液或積食。","we":{"A":"A. 創傷性蜂巢胃炎確可繼發腹膜炎，但這與迷走神經性消化不良的病理連結不如直接迷走神經刺激明確。","B":"B. (正確) 創傷性蜂巢胃炎因異物刺激迷走神經，繼發迷走神經性消化不良（vagal indigestion），導致瘤胃功能障礙。","C":"C. 創傷性蜂巢胃炎主要是細菌性腹膜炎，但繼發消化不良的機制是神經性而非直接感染前胃。","D":"D. 橫膈膜破裂是創傷性蜂巢胃炎的嚴重繼發症，但這是另一獨立併發症，非迷走神經性消化不良的直接原因。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_010","year":2021,"roc_year":110,"session":"","examNo":10,"q":"下列何者不是預防乳牛分娩前後易發生之酮症的處置？","opts":["A. 泌乳後期與乾乳期應該避免牛隻過胖","B. 分娩前母牛體態最好維持BCS（body condition score）在3.5～5.0之間","C. 分娩前應該減少精料飼量至每頭牛每日1～2公斤","D. 分娩後應該立即逐漸提高每日精料飼量"],"ans":[1,2,3],"exp":"預防酮症的正確做法：乾乳期BCS應控制在3.0~3.5（非3.5~5.0）；分娩前應「逐漸增加」精料（steam-up飼養），非減少至1~2 kg；分娩後確實需逐漸提高精料，但「立即」二字有誤，需循序漸進避免瘤胃酸中毒。A（避免過胖）才是正確的預防措施。","we":["A. 正確的預防措施，不是答案。","B. 乾乳期BCS 3.5~5.0過高，體況過胖反而增加酮症風險，應維持3.0~3.5。","C. 分娩前應逐漸「增加」精料（lead feeding/steam-up），非減少至1~2 kg。","D. 分娩後確需增加精料，但應「循序漸進」，「立即」大幅增加易引起瘤胃酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_011","year":2021,"roc_year":110,"session":"","examNo":11,"q":"牛下列何項疾病最易繼發橫隔膜破裂？","opts":["A. 迷走神經性胃炎","B. 創傷性蜂巢胃炎","C. 瘤胃遲緩","D. 重瓣胃食滯"],"ans":1,"exp":"創傷性蜂巢胃炎的異物（如鐵絲）可穿透蜂巢胃前壁，繼續向前穿破橫膈膜（diaphragm），此時稱為創傷性蜂巢胃橫膈膜炎（traumatic reticulo-diaphragmitis）；更嚴重時可穿入心包腔，引起創傷性心包炎（traumatic pericarditis）。","we":{"A":"A. 蜂巢胃異物可向後穿透而繼發腹膜炎，但最常見的嚴重繼發症是橫膈膜破裂及心包炎。","B":"B. (正確) 創傷性蜂巢胃炎最嚴重的繼發症是異物穿透橫膈膜，造成創傷性心包炎，是危及生命的併發症。","C":"C. 肝臟穿透雖可發生，但不如橫膈膜和心包受累常見且嚴重。","D":"D. 脾臟受累相對少見，非創傷性蜂巢胃炎的典型嚴重繼發症。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_012","year":2021,"roc_year":110,"session":"","examNo":12,"q":"下列何項是引起牛隻特異體質過敏性皮膚炎（atopic dermatitis）最常見的過敏原？","opts":["A. 消毒劑","B. 花粉","C. 清潔劑","D. 有機化學劑"],"ans":1,"exp":"牛的過敏性皮膚炎（atopic dermatitis）由環境過敏原（如花粉、黴菌孢子、塵蟎等）引起，表現為搔癢和皮膚炎，過敏原測試可確認特定致敏原；花粉（pollen）是重要的吸入性過敏原。","we":{"A":"A. 飼料中的蛋白質可引起食物過敏性皮膚炎，但描述中特指環境（花粉）過敏原，屬atopic dermatitis而非食物過敏。","B":"B. (正確) 花粉是牛atopic dermatitis的重要環境過敏原，透過吸入致敏後引起皮膚症狀，是第一型過敏反應。","C":"C. 藥物過敏雖可引起皮膚反應，但與花粉無關。","D":"D. 接觸性過敏需要皮膚直接接觸過敏原，花粉主要以吸入方式致敏，屬atopic dermatitis範疇。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_013","year":2021,"roc_year":110,"session":"","examNo":13,"q":"牛隻呈後肢屈曲之犬坐姿勢，站立時兩後肢不能內轉，無局部肌肉病變，應懷疑下列何神經麻痺所致？","opts":["A. 尺骨神經","B. 跗骨神經","C. 股神經","D. 閉鎖神經"],"ans":3,"exp":"閉鎖孔神經（obturator nerve）麻痺會造成後肢內收肌（adductor muscles）喪失功能，導致後肢無法內收（adduction），牛站立時後肢向外開展，可能因此「劈叉」摔倒；常見於難產後壓迫性損傷。","we":{"A":"A. 閉鎖孔神經麻痺不造成後肢無法外轉（外展），外展肌受的是臀部神經支配。","B":"B. 閉鎖孔神經麻痺不造成前肢症狀，因為它只支配後肢內收肌群。","C":"C. 後肢無法屈曲是股神經或坐骨神經損傷的表現，非閉鎖孔神經。","D":"D. (正確) 閉鎖孔神經（obturator nerve）支配後肢內收肌，麻痺時後肢無法內轉（內收），站立時後肢外展，容易跌倒。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_014","year":2021,"roc_year":110,"session":"","examNo":14,"q":"有關乳牛瘤胃臌脹之敘述，下列何者錯誤？","opts":["A. 原發性瘤胃臌脹多發生於放牧在豆科草地的牛隻","B. 原發性瘤胃臌脹是由於噯氣的物理性障礙所致","C. 泡沫性瘤胃臌脹多發生於以大量穀物飼料飼養的肥育牛","D. 泡沫性臌脹也稱為原發性瘤胃臌脹"],"ans":1,"exp":"臌脹症（ruminal tympany）分為原發性（泡沫性臌脹，frothy bloat）和繼發性（游離氣體臌脹，free gas bloat）。原發性臌脹是豆科牧草中的皂素等物質造成泡沫，無法噯氣排出氣體，是物理性噯氣障礙。繼發性臌脹才是因噯氣障礙（食道阻塞、迷走神經性消化不良等）引起游離氣體蓄積。","we":{"A":"A. 原發性臌脹確實是泡沫性的，飼料中皂素等物質形成穩定泡沫是正確的病理機制。","B":"B. (正確) 原發性（泡沫性）臌脹的主因是泡沫阻礙噯氣反射，這本身就是一種「物理性噯氣障礙」；繼發性才是因食道阻塞等「物理性阻塞」引起，故說「原發性不是物理性噯氣障礙」是錯誤的描述。","C":"C. 繼發性臌脹由食道阻塞或迷走神經障礙引起，是物理性或神經性噯氣障礙，描述正確。","D":"D. 泡沫性臌脹治療用poloxalene（消泡劑）或植物油等消泡劑，這一治療邏輯是正確的。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_015","year":2021,"roc_year":110,"session":"","examNo":15,"q":"牛於頸部近胸處出現心房性頸靜脈搏動，最常見於下列何種情況？","opts":["A. 正常現象","B. 三尖瓣閉鎖不全","C. 創傷性心囊炎","D. 慢性心臟肥大"],"ans":1,"exp":"三尖瓣閉鎖不全（tricuspid regurgitation）造成右心房壓力升高，進而使前腔靜脈壓力升高，表現在頸靜脈處出現心房性（收縮前期）頸靜脈搏動（jugular pulsation/precordial thrill at jugular vein），與心動週期同步。","we":{"A":"A. 三尖瓣閉鎖不全時，右心收縮血液逆流進右心房，使頸靜脈出現的是「收縮期」搏動，而非舒張期。","B":"B. (正確) 三尖瓣閉鎖不全→右心房壓升高→前腔靜脈壓升高→頸靜脈出現心房性（arterial）搏動，此為三尖瓣閉鎖不全的典型體徵。","C":"C. 主動脈瓣閉鎖不全才會造成水衝脈（Corrigan's pulse）和舒張期心雜音，非三尖瓣閉鎖不全的表現。","D":"D. 二尖瓣閉鎖不全主要影響左心，造成肺靜脈高壓和肺水腫，不造成頸靜脈搏動。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_016","year":2021,"roc_year":110,"session":"","examNo":16,"q":"有關牛乳房炎之預防策略，下列何者正確？","opts":["A. 前藥浴對預防乳房炎的效果不佳","B. 後藥浴若以碘基藥物為主，其濃度為 0.01~0.05%最佳","C. 急性乳房炎應立即以乾乳期軟膏治療，尤其是金黃色葡萄球菌（Staphylococcus aureus）之感染","D. 慢性黴漿菌性乳房炎之治療常無效，應以淘汰為主"],"ans":3,"exp":"黴漿菌性乳房炎（mycoplasmal mastitis）由Mycoplasma bovis等引起，特點是：抗生素治療無效（黴漿菌無細胞壁，對β-lactam抗生素天然耐藥，且常規抗生素治療效果極差）；傳播性強，可透過擠奶機傳播；患牛應予以淘汰以防止傳播，而非積極治療。","we":{"A":"A. 黴漿菌性乳房炎確實對多數抗生素無效，隔離患牛的管理措施描述正確。","B":"B. 病牛乳汁中含有大量黴漿菌，不得混入正常牛乳中，應廢棄，描述正確。","C":"C. 新引進的牛應先隔離觀察，以防止黴漿菌引入牛群，這是正確的預防措施。","D":"D. (正確) 黴漿菌性乳房炎因治療效果極差，以淘汰（culling）患牛為主要管理策略，「應積極抗生素治療而非淘汰」是錯誤的描述。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_017","year":2021,"roc_year":110,"session":"","examNo":17,"q":"成牛站姿下的左腹脇開腹術（left-paralumbar fossa celiotomy）最易觸及下列何種器官？","opts":["A. 脾臟","B. 十二指腸","C. 重瓣胃","D. 肝臟"],"ans":0,"exp":"左腹脇腹切開術（left paralumbar laparotomy, left flank approach）在牛中可直接觀察和觸及的器官包括：瘤胃（rumen）、網胃（reticulum，需向前探入）、左腎（left kidney，吊掛於腹腔頂部）、脾臟（spleen）等；脾臟位於瘤胃左側，透過左側腹切開最容易觀察。","we":{"A":"A. (正確) 左腹脇腹切開術可直接見到脾臟，脾臟位於瘤胃的左背側，透過左側開腹可輕易觸及。","B":"B. 肝臟主要位於右側，透過左側開腹較難直接觀察肝臟，通常需右側開腹。","C":"C. 皺胃（abomasum）位於右側腹（正常位置），左側開腹若發現皺胃表示左方變位，透過右側開腹才能正確復位。","D":"D. 右腎（right kidney）位於右側腹，透過左側開腹無法直接觸及右腎。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_018","year":2021,"roc_year":110,"session":"","examNo":18,"q":"乳牛的右腹切開手術可作為那一型迷走神經性消化不良（vagal indigestion）的探測術？","opts":["A. 第一型","B. 第二型","C. 第三型","D. 第四型"],"ans":2,"exp":"第三型迷走神經性消化不良（type III vagal indigestion）特點是幽門/十二指腸通道阻塞，造成皺胃和小腸積液，瘤胃擴張呈「蘋果型」（apple-shaped）腹部。確診需右側腹部切開（right flank laparotomy）以直接探查皺胃和幽門功能。","we":{"A":"A. 左側開腹雖可見瘤胃擴張，但無法直接評估皺胃和幽門功能，不是診斷第三型的最佳途徑。","B":"B. 直腸觸診可感受到瘤胃下垂擴張，但無法確認皺胃/幽門病變，不足以確診。","C":"C. (正確) 第三型迷走神經性消化不良需透過右側腹切開（right flank laparotomy）直接觸診皺胃和幽門，才能確診並同時治療可能的幽門/十二指腸病變。","D":"D. 超音波雖可輔助，但不能直接確認幽門功能或病理，不是確診的最適方法。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_019","year":2021,"roc_year":110,"session":"","examNo":19,"q":"治療牛第四胃左側異位之右脇腹壁大網膜固定術，用接上針頭之滅菌管進行第四胃放氣時，下列敘述何者錯\r   誤？","opts":["A. 針頭可用10到14-G尺寸","B. 插入部位應選在第四胃的下方，以利放氣","C. 插入部位須繞過瘤胃","D. 自插入部位拔除針頭前，應先將套管折疊以避免管內液體流出進入腹腔"],"ans":1,"exp":"皺胃右方變位（right abomasal displacement, RAD）或皺胃捻轉時，穿刺放氣（trocar and cannula）應選在右腹部皺胃最膨脹的位置穿刺；由於皺胃氣體積聚在上方，應選擇腹部側面較高的位置（上方）穿刺放氣，而非從下方（腹底）穿刺，以免液體湧出或穿刺效果不佳。","we":{"A":"A. 皺胃積氣在上方，選擇上方穿刺可有效放氣，而非從腹底穿刺（下方積液，穿刺後液體湧出）。","B":"B. (正確) 皺胃放氣應選右腹側面較高處（氣體積聚位置），而非下方，以確保有效釋放積氣。","C":"C. 從腹中線穿刺風險較高，且皺胃通常在右側，不是標準穿刺位置。","D":"D. 選擇最低點穿刺會遇到液體而非氣體，放氣效果差，且有液體外洩風險。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_020","year":2021,"roc_year":110,"session":"","examNo":20,"q":"進行乳牛卵巢摘除手術後，所發現的卵巢腫瘤型態最常屬於下列那一種？","opts":["A. lymphoma","B. adenoma","C. adenosarcinoma","D. granulosa cell/stromal tumor"],"ans":3,"exp":"卵巢顆粒細胞瘤（granulosa cell tumor, GCT）是牛最常見的卵巢腫瘤，通常是單側的，受影響的卵巢呈蜂巢狀多囊外觀，對側卵巢常萎縮（因腫瘤分泌inhibin抑制FSH）；臨床表現為無情期（anestrus）或持續發情（nymphomania）。","we":{"A":"A. 黃體瘤（luteoma）在牛較少見，不是最常見的卵巢腫瘤。","B":"B. 卵泡囊腫（follicular cyst）雖常見，但屬於功能性囊腫而非真性腫瘤，不列為「卵巢腫瘤」。","C":"C. 卵巢腺癌（ovarian adenocarcinoma）在牛相對罕見。","D":"D. (正確) 顆粒細胞瘤（granulosa cell tumor）是牛最常見的卵巢腫瘤，呈多囊蜂巢狀，對側卵巢萎縮，可能引起行為和生殖異常。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_021","year":2021,"roc_year":110,"session":"","examNo":21,"q":"關於牛乳頭撕裂傷之手術縫合後傷口癒合的敘述，下列何者錯誤？","opts":["A. 長軸形的傷口比水平傷口容易癒合","B. 乳頭末端的傷口比乳頭基部的傷口容易癒合","C. 有乳房水腫的乳頭傷口較不容易癒合","D. 傷口涉及乳腺腔（gland sinus）部位者較難癒合"],"ans":1,"exp":"乳頭外傷（teat injury）的癒合預後：乳頭基部（base of teat）的傷口因血液供應較好，相對容易癒合；乳頭末端（apex of teat）及乳頭管（teat canal/streak canal）附近的傷口因組織較少、血供差，且癒合後容易造成乳頭管狹窄（teat stenosis），影響泌乳，預後較差。","we":{"A":"A. 乳頭基部血供較佳，癒合能力優於末端，預後相對較好。","B":"B. (正確) 乳頭末端（包括乳頭管區域）的外傷預後差，因血供不足且癒合後易造成乳頭管狹窄，影響擠奶功能。","C":"C. 乳頭側面（lateral aspect）傷口視情況而定，但末端仍是預後最差的位置。","D":"D. 乳頭基部與乳房連接處的傷口雖也可能複雜，但一般仍優於末端。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_022","year":2021,"roc_year":110,"session":"","examNo":22,"q":"下列那一種方法最適合應用於牛隻腹壁切開後之皮膚傷口的縫合？","opts":["A. cross mattress suture","B. Ford interlocking suture","C. simple interrupted suture","D. Connell suture"],"ans":[0,1],"exp":"牛隻腹壁（paralumbar fossa）手術後皮膚縫合：Cross mattress suture（交叉褥式縫合）和 Ford interlocking suture（Ford連鎖縫合）最為適合，因為兩者均提供均勻的張力分布，對厚實皮膚和皮下組織有良好的把持力，且縫合速度快。Connell suture用於內臟（如腸管、膀胱）的內翻縫合，不適用於皮膚。","we":["A. Cross mattress suture 適合，是答案之一。","B. Ford interlocking suture 適合，是答案之一。","C. Simple interrupted suture 雖可用，但對於張力較大的牛腹壁傷口，固定強度不如 cross mattress 或 Ford interlocking。","D. Connell suture 是消化道壁的內翻縫合法，不用於皮膚縫合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_023","year":2021,"roc_year":110,"session":"","examNo":23,"q":"進行牛隻腎臟手術時，有關腎臟解剖位置之敘述，下列何者錯誤？","opts":["A. 右側腎臟的位置靠近肝臟","B. 進行直腸觸診時可以輕易觸及到右側腎臟","C. 從右腹脇部進入腹腔可以觸診到左腎及右腎","D. 從左腹脇部進入腹腔不易觸診到右腎"],"ans":1,"exp":"直腸觸診（rectal palpation）是牛大動物臨床重要的診斷方法。右腎（right kidney）位置較前（向頭端），通常被最後肋骨遮蔽，需深入前伸才能觸及，且不易完整觸診；左腎（left kidney）懸掛於腹腔頂部左側，位置相對後方（尾端），可透過直腸觸診輕易觸及，甚至可感受到其外形和大小。","we":{"A":"A. 右腎位置較前且被肋骨遮擋，透過直腸觸診困難，通常只能觸及後端部分。","B":"B. (正確) 左腎透過直腸觸診可輕易觸及，位置較後，懸掛於左腰部，是大動物直腸觸診腎臟的標準操作。","C":"C. 兩側腎臟均不在前腹，後腹（腰部）才是腎臟的正確位置。","D":"D. 直腸觸診確實用於腎臟評估，但右腎（非左腎）才是較難觸及的。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_024","year":2021,"roc_year":110,"session":"","examNo":24,"q":"對於已發生破傷風（tetanus）之羊隻，下列何項處理最不適當？","opts":["A. 提供良好的肌肉鬆弛劑","B. 提供輸液以維持生命","C. 隔離已發病的動物","D. 用抗毒素血清中和在體內未結合的毒素"],"ans":2,"exp":"破傷風（tetanus）由破傷風梭菌（Clostridium tetani）產生的外毒素（tetanospasmin）引起，毒素沿神經逆行至脊髓和腦幹，抑制抑制性神經元，造成強直性肌肉痙攣。破傷風不是傳染性疾病（不在動物間直接傳播），隔離患病動物對於防止傳播沒有意義（因為是毒素疾病而非接觸傳播）。","we":{"A":"A. 清創傷口（wound debridement）是破傷風治療的重要步驟，可去除厭氧環境和毒素來源，正確。","B":"B. 青黴素（penicillin）可殺滅創口中的破傷風梭菌，是輔助治療的一部分，正確。","C":"C. (正確) 破傷風不在動物間傳播，隔離患畜對預防傳播無意義；說「需要隔離以防止傳播」是錯誤的描述。","D":"D. 肌肉鬆弛劑和鎮靜劑用於控制肌肉痙攣，是破傷風的支持療法之一，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_025","year":2021,"roc_year":110,"session":"","examNo":25,"q":"診斷豬隻食鹽中毒症，腦中鹽分濃度（濕重，wet weight）超過多少 ppm 即可確診？","opts":["A. 1,200","B. 1,400","C. 1,600","D. 1,800"],"ans":3,"exp":"豬食鹽中毒（salt poisoning）可由飼料中食鹽過高或長期限水後突然大量飲水引起。確診的依據包括：病史（限水後大量給水或飼料食鹽含量過高）、臨床症狀（神經症狀、嘔吐）、腦組織病理（嗜酸球性腦膜腦炎，eosinophilic meningoencephalitis）以及血清鈉濃度升高（>1800 ppm的飼料或血鈉>160 mmol/L）。血清/腦脊液鈉濃度>1800 ppm是確診的重要依據。","we":{"A":"A. 臨床症狀（搖頭、轉圈、癲癇）配合病史可高度懷疑，但不足以單獨確診。","B":"B. 腦組織嗜酸球性腦膜腦炎是特徵性病理，但需結合血清鈉或飼料分析。","C":"C. 飼料食鹽分析若超過標準可支持診斷，但血清鈉更直接。","D":"D. (正確) 血清鈉或腦脊液鈉濃度超過1800 ppm（或mg/kg）是豬食鹽中毒確診的重要定量依據，配合病史和病理即可確診。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_026","year":2021,"roc_year":110,"session":"","examNo":26,"q":"一健康豬隻急性黏膜蒼白而死亡。牧場主人陳述該豬曾在快速大量進食與飲水後又有劇烈運動，則該豬隻最\r   有可能罹患下列何項疾病？","opts":["A. 胃潰瘍","B. 胃捻轉","C. 食鹽中毒","D. 產氣芽孢梭菌性腸炎"],"ans":1,"exp":"豬的胃捻轉（gastric volvulus/torsion）常見於大型育成豬或種豬，誘因包括：餵食大量易發酵飼料後立即進行劇烈運動（galloping, exercise immediately post-feeding），造成胃內容物和氣體積聚、胃擴張後發生捻轉。","we":{"A":"A. 長期禁食後突然大量進食是胃擴張的誘因之一，但與劇烈運動合併才更容易引起捻轉。","B":"B. (正確) 大量進食（過度飽食）後隨即進行劇烈運動，胃體積大且移動性增加，容易發生捻轉；這是豬胃捻轉的典型誘因。","C":"C. 飲水不足與胃捻轉關係較間接，非主要誘因。","D":"D. 飼料類型（精飼料vs粗飼料）影響發酵速度，但不如「大量進食+劇烈運動」的組合重要。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_027","year":2021,"roc_year":110,"session":"","examNo":27,"q":"仔豬去勢手術的最佳時機在幾週齡內？","opts":["A. 3","B. 6","C. 8","D. 12"],"ans":0,"exp":"仔豬（piglet）的去勢（castration）最佳時機是出生後3週齡內（通常為7-14日齡），此時仔豬體型小、操作容易、應激反應較小、術後恢復快；超過3週齡後風險增加，且肉品品質考量也需在早期進行。","we":{"A":"A. (正確) 仔豬去勢最佳時機為3週齡內（通常1-2週齡），此時手術簡單、風險低、應激小。","B":"B. 4-6週齡雖仍可去勢，但已超過最佳時機，恢復較慢且出血風險稍增。","C":"C. 2個月齡（8週齡）去勢已算較晚，應激反應大，恢復時間長。","D":"D. 斷奶後去勢（通常3-4週齡以後）在某些場合執行，但不是最佳時機。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_028","year":2021,"roc_year":110,"session":"","examNo":28,"q":"有關犬隱睪症（cryptorchidism）之敘述，下列何者錯誤？","opts":["A. 隱睪常在的位置是位於腹腔或鼠蹊","B. 患畜隱睪的精子生成作用（spermatogenesis）不受影響","C. 患畜隱睪的睪固酮（testosterone）分泌不會受影響","D. 患畜可能會呈現雌性化"],"ans":1,"exp":"隱睪（cryptorchidism）公豬（或其他物種）的隱睪精子生成（spermatogenesis）因腹腔溫度高於正常睪丸溫度（陰囊溫度比體溫低2-3°C），精子生成作用（spermatogenesis）受到嚴重影響甚至缺失，但雄激素生成（steroidogenesis, testosterone production）的Leydig cells較耐熱，仍可正常分泌睪固酮，故隱睪動物仍有性慾。","we":{"A":"A. 隱睪動物的精子生成受影響（高溫環境），並非「精子生成正常，只是精子無法排出」。","B":"B. (正確) 隱睪時腹腔溫度過高導致精子生成作用（spermatogenesis）受損，但間質細胞（Leydig cells）分泌睪固酮的功能不受明顯影響，動物仍有性慾。","C":"C. 隱睪並非「精子形態異常」，而是精子生成根本受抑制。","D":"D. 雄激素分泌並不因隱睪而升高，而是維持正常。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_029","year":2021,"roc_year":110,"session":"","examNo":29,"q":"下列何種母畜屬於季節性且多個動情週期？","opts":["A. 牛","B. 豬","C. 犬","D. 羊"],"ans":3,"exp":"山羊（goats）是季節性多發情（seasonally polyestrous）動物，與綿羊（sheep）相似，發情受光照周期（photoperiod）控制，在短日照（秋冬）季節進入繁殖季，而在長日照（春夏）進入季節性乏情。","we":{"A":"A. 山羊屬季節性多發情動物，並非全年多發情（非季節性）。","B":"B. 山羊並非單發情（monoestrous），每個繁殖季有多次發情週期。","C":"C. 山羊的繁殖季是在短日照（秋冬），而非長日照（春夏）。","D":"D. (正確) 山羊是季節性多發情（seasonally polyestrous）動物，繁殖季在秋冬（短日照），春夏進入乏情期。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_030","year":2021,"roc_year":110,"session":"","examNo":30,"q":"有關賽托利細胞瘤（Sertoli cell tumor）的敘述，下列何者錯誤？","opts":["A. 好發於患有隱睪症的公犬","B. 患畜易有雌性化特徵","C. 若為單側性腫瘤，則對側睪丸通常萎縮","D. 患畜易有睪固酮（testosterone）分泌過多的問題"],"ans":3,"exp":"賽托利細胞瘤（Sertoli cell tumor）是常見的睪丸腫瘤，賽托利細胞具有分泌雌激素（estrogen）的能力；賽托利細胞瘤會過量分泌雌激素（而非睪固酮），導致雌性化（feminization）症狀：對側睪丸萎縮、乳腺發育、包皮下垂、吸引雄性等，以及骨髓抑制（再生障礙性貧血）。","we":{"A":"A. 賽托利細胞瘤分泌的主要是雌激素而非睪固酮，故引起的是雌性化而非雄性化症狀。","B":"B. 賽托利細胞瘤不主要分泌LH，它是功能性腫瘤分泌雌激素。","C":"C. 孕酮（progesterone）並非賽托利細胞瘤的主要分泌物。","D":"D. (正確) 賽托利細胞瘤分泌過量雌激素（estrogen），引起雌性化症狀和骨髓抑制（再生障礙性貧血）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_031","year":2021,"roc_year":110,"session":"","examNo":31,"q":"有關馬、牛、豬、羊四種母畜之平均懷孕天數，下列由多至少的排序何者正確？","opts":["A. 馬牛豬羊","B. 馬牛羊豬","C. 牛馬羊豬","D. 牛馬豬羊"],"ans":1,"exp":"各物種妊娠期（懷孕天數）由長至短：馬（~340天）> 牛（~280天）> 綿羊（~150天）> 豬（~114天）。記憶法：「馬牛羊豬」，天數遞減。","we":{"A":"A. 馬妊娠期最長（約340天），排序正確；但各物種具體順序需確認：馬>牛>羊>豬。","B":"B. (正確) 妊娠期由長至短：馬（~340天）> 牛（~280天）> 綿羊（~150天）> 豬（~114天）。","C":"C. 若排序顛倒或混淆（如牛>馬）則為錯誤。","D":"D. 各物種妊娠期有明確數值，不可混淆羊（150天）與豬（114天）的順序。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_032","year":2021,"roc_year":110,"session":"","examNo":32,"q":"鏡檢一頭剛性成熟的年輕公牛精液，最常出現圖中那個數字所標示的不正常形態精子？","opts":["A. 19","B. 20","C. 22","D. 24"],"ans":0,"exp":"年輕公牛精液（young bulls）中最常見的精子形態異常是原發性異常中的近端原生質滴（proximal cytoplasmic droplet）以及各種頭部和頸部缺陷；在評估種公牛精液時，未成熟精子（含近端原生質滴）比例過高常見於訓練中的年輕公牛。（此題原始為圖像題，標記待複查）","we":{"A":"A. (可能正確) 近端原生質滴（proximal cytoplasmic droplet）是年輕公牛最常見的精子形態異常，表示精子尚未完全成熟。","B":"B. 遠端原生質滴在年輕公牛也常見，但近端比例更高。","C":"C. 頭部缺陷（如巨頭、小頭）雖可見，但在年輕公牛中不是最常見。","D":"D. 鞭毛缺陷在各年齡均可見，但非年輕公牛最具代表性的異常。"},"needs_review":true,"imgs":[]},{"id":"AMO_2021_普通病_033","year":2021,"roc_year":110,"session":"","examNo":33,"q":"下列何種藥物或內泌素組合，最不適合用於母牛或母羊發情同期化？","opts":["A. progesterone +","B. GnRH +","C. progesterone + equine chorionic gonadotropin（FSH-like）","D. GnRH + estrogen"],"ans":3,"exp":"發情同期化（estrus synchronization）常用方案包括：孕酮/合成孕激素（progestins）、PGF2α、GnRH-PGF2α-GnRH（Ovsynch）等；GnRH加上雌激素（estrogen）的組合在大多數動物的同期化效果不如標準方案，且雌激素使用有食品安全限制，臨床上較不適合作為發情同期化的主要方案。（此題選項不完整，標記待複查）","we":{"A":"A. PGF2α是最常用的發情同期化藥物之一，在有功能性黃體的動物效果良好，正確。","B":"B. 孕酮植入劑（CIDR）是廣泛使用的同期化方法，正確。","C":"C. Ovsynch（GnRH-PGF2α-GnRH）是牛定時人工授精的標準方案，正確。","D":"D. (正確) GnRH+estrogen組合在臨床同期化中較不適合，效果不穩定且有食品安全疑慮，是最不適合的選項。"},"needs_review":true,"imgs":[]},{"id":"AMO_2021_普通病_034","year":2021,"roc_year":110,"session":"","examNo":34,"q":"下列那一個疾病是由於副中腎管（müllerian ducts）融合失敗所引起的？","opts":["A. 雙子宮頸（double cervix）","B. 白色女牛病（white heifer disease）","C. 單一子宮角（uterus unicornis）","D. 輸卵管發育不全"],"ans":0,"exp":"雙子宮頸（double cervix, uterus didelphys with double cervix）是Müllerian管（副腎管, paramesonephric duct）在胚胎發育中未完全融合的結果；正常情況下兩側Müllerian管融合形成子宮體、子宮頸和陰道上部，若融合失敗則形成雙角、雙宮頸或雙陰道等畸形。","we":{"A":"A. (正確) 雙子宮頸是Müllerian管（副腎管）融合失敗所致，這是女性生殖管道發育異常的胚胎學基礎。","B":"B. Wolffian管（中腎管）在雌性退化，不與子宮頸形成相關；雙子宮頸與Wolffian管無關。","C":"C. 胚胎分裂異常與雙胎有關，不是雙子宮頸的原因。","D":"D. 染色體異常雖可引起各種發育缺陷，但雙子宮頸的機制是特定的Müllerian管融合失敗。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_035","year":2021,"roc_year":110,"session":"","examNo":35,"q":"有關母犬分娩陣痛之敘述，下列何者錯誤？","opts":["A. 第一期分娩陣痛時，可促使子宮頸打開及胎兒姿勢的調整","B. 第一期分娩陣痛時，母犬直腸溫度會下降及築巢行為","C. 第二期分娩陣痛時，腹部會收縮及胎兒排出","D. 第二期分娩陣痛時，可將胎兒及胎盤完全排出"],"ans":3,"exp":"懷孕各期（分娩各期）的定義：第一期（first stage）= 子宮頸擴張和子宮收縮開始，動物表現不安；第二期（second stage）= 胎兒娩出；第三期（third stage）= 胎膜（胎衣）娩出。第二期結束後進入第三期，第三期才是胎膜排出的時期。","we":{"A":"A. 第一期是子宮頸擴張期，此描述正確。","B":"B. 第二期是胎兒娩出期，此描述正確。","C":"C. 第三期才是胎膜（胎衣）排出，而非第二期，第二期只有胎兒娩出。","D":"D. (正確) 第二期是胎兒娩出，第三期才是排出胎膜（胎衣），故「第二期包含排出胎盤」是錯誤的描述。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_036","year":2021,"roc_year":110,"session":"","examNo":36,"q":"下列何者是乳牛成熟濾泡（mature follicle）排卵後所出現的結構？","opts":["A. 空泡化黃體（vacuolated corpora lutea）","B. 黃體化濾泡（luteinized follicles）","C. 濾泡囊腫（follicular cysts）","D. 黃體化囊腫（luteinized cysts）"],"ans":0,"exp":"空泡化黃體（corpus hemorrhagicum或luteal cyst的早期形式）是成熟濾泡排卵後在排卵點形成的血凝塊（排卵後出血進入卵泡腔），之後逐漸黃體化，這個含血的結構就是空泡化黃體（corpus hemorrhagicum）的前身；它代表剛排卵後的正常過渡形態。","we":{"A":"A. (正確) 空泡化黃體（corpus hemorrhagicum）是成熟濾泡排卵後，排卵腔內充血形成的結構，是正常黃體形成的早期階段。","B":"B. 濾泡囊腫（follicular cyst）是未排卵的濾泡持續存在，非排卵後的結構。","C":"C. 黃體囊腫（luteal cyst）是異常的黃體，中心有液體，非正常排卵後形成。","D":"D. 黃體出血（luteal hematoma）雖相似，但空泡化黃體的形成是排卵後血液進入排卵腔，非黃體本身出血。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_037","year":2021,"roc_year":110,"session":"","examNo":37,"q":"有關妊馬血清性腺激素（equine chorionic gonadotrophin, eCG）的敘述，何者最不適當？","opts":["A. 於懷孕60~65天達最高峰","B. 於懷孕50天時開始產生","C. 於懷孕150天時消失","D. 可刺激附屬黃體的形成（formation of accessory corpus luteum）"],"ans":1,"exp":"孕馬血清促性腺激素（equine chorionic gonadotropin, eCG，舊稱PMSG）由馬妊娠早期（約35-40天開始）在子宮內膜杯（endometrial cups）產生，濃度在妊娠60-70天達高峰，然後下降；並非從妊娠50天才開始產生，實際上更早（約35-40天）即開始出現。","we":{"A":"A. eCG確實由子宮內膜杯（endometrial cups）分泌，此為正確的組織來源。","B":"B. (正確) eCG約在妊娠35-40天開始分泌（而非50天），此描述「妊娠50天後才開始」是錯誤的。","C":"C. eCG在外周血液可被測定，且確在妊娠60-70天達高峰，此描述正確。","D":"D. eCG具有FSH和LH兩者活性，此描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_038","year":2021,"roc_year":110,"session":"","examNo":38,"q":"尿道球腺（bulbourethral gland）在下列那種動物最不發達？","opts":["A. 綿羊","B. 豬","C. 牛","D. 犬"],"ans":3,"exp":"雄性生殖附性腺（male accessory sex glands）在各物種的發育程度不同：犬的附性腺以前列腺（prostate）最發達，其他物種有的尿道球腺（bulbourethral gland/Cowper's gland）較發達；犬缺乏或尿道球腺（Cowper's gland）最不發達，幾乎缺失（犬無精囊腺，尿道球腺退化）。","we":{"A":"A. 公豬的尿道球腺非常發達（提供大量精清），非最不發達的物種。","B":"B. 公牛的尿道球腺中等發達。","C":"C. 公馬的尿道球腺也存在且有功能。","D":"D. (正確) 犬（dog）的尿道球腺（Cowper's gland）最不發達，幾乎缺失或痕跡性；犬的前列腺才是最主要的附性腺。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_039","year":2021,"roc_year":110,"session":"","examNo":39,"q":"通常乳牛連續配種多少次以上仍無法受胎時定義為低受胎牛？","opts":["A. 1","B. 2","C. 3","D. 4"],"ans":2,"exp":"低受胎牛（repeat breeder cow）的定義：在發情週期正常、無明顯生殖器官疾病的情況下，人工授精或自然交配3次或以上仍未受孕的母牛；通常定義為連續3次或以上配種失敗。","we":{"A":"A. 2次配種失敗通常被視為偶發，不符合低受胎的診斷標準（需3次以上）。","B":"B. 配種4次以上雖更嚴重，但標準定義從3次開始。","C":"C. (正確) 連續3次（或以上）無受孕配種失敗（在無明顯可診斷疾病前提下）即定義為低受胎牛（repeat breeder）。","D":"D. 1次配種失敗在正常群體中常見，不構成低受胎牛診斷。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_040","year":2021,"roc_year":110,"session":"","examNo":40,"q":"貓罹患不癒合性角膜潰瘍（indolent ulcers）時，不建議進行下列何處置？","opts":["A. 移除疏鬆上皮","B. 格子狀（grid）或穿刺型（punctate）角膜切開術","C. 隱形眼鏡","D. 局部抗生素"],"ans":1,"exp":"格子狀角膜切開術（grid keratotomy）是用於治療犬的慢性角膜上皮侵蝕症（chronic superficial corneal erosion, SCCE，又稱「拳師犬潰瘍」）的手術，其原理是在基底膜和前基質創造多個微小切口，促進上皮細胞附著；此手術禁用於貓，因為貓的角膜對此手術反應不同（可能引起不良反應，如疤痕化），貓的角膜潰瘍治療有其他替代方案。","we":{"A":"A. 格子狀角膜切開術適用於犬慢性上皮侵蝕症（boxer ulcer），正確。","B":"B. (正確) 格子狀角膜切開術禁用於貓，貓角膜的癒合機制不同，此手術在貓可能引起嚴重的角膜疤痕或並發症。","C":"C. 超音波碎晶術（phacoemulsification）用於白內障手術，與角膜切開術無關。","D":"D. 結膜覆蓋術（conjunctival flap）是另一種角膜潰瘍治療，與禁忌症不同。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_041","year":2021,"roc_year":110,"session":"","examNo":41,"q":"治療犬貓慢性心衰竭使用的藥物enalapril屬於那一類藥物？","opts":["A. 利尿劑（diuretics）","B. 血管張力素轉化酶抑制劑（ACE inhibitors）","C. 抗心律不整藥物","D. 陽性強心劑（positive inotropes）"],"ans":1,"exp":"Enalapril是血管緊張素轉換酶抑制劑（ACE inhibitor, ACEi），透過抑制ACE，減少血管緊張素II（angiotensin II）的形成，導致血管舒張、降低後負荷、減少醛固酮分泌，廣泛用於犬心臟病（如二尖瓣疾病、擴張性心肌病）的治療。","we":{"A":"A. 鈣離子通道阻斷劑（如amlodipine）用於高血壓治療，機制不同於enalapril。","B":"B. (正確) Enalapril是ACE抑制劑（ACEi），抑制血管緊張素轉換酶，減少血管緊張素II生成，降低血管阻力，是犬心臟病常用藥。","C":"C. β-腎上腺素受體阻斷劑（如atenolol）用於心律不整，機制不同。","D":"D. 利尿劑（如furosemide）用於減少體液負荷，機制不同於enalapril。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_042","year":2021,"roc_year":110,"session":"","examNo":42,"q":"依據生理病理學的反應，下列何種犬隻心臟病會造成左心鬱血性心衰竭？","opts":["A. 肺動脈狹窄（pulmonary stenosis）","B. 心絲蟲症（heartworm disease）","C. 永存性動脈導管（patent ductus arteriosus）","D. 心包囊填充（cardiac tamponade）"],"ans":2,"exp":"開放性動脈導管（patent ductus arteriosus, PDA）在左向右分流時，主動脈的高壓血流進入肺動脈，增加肺循環血流量，造成：肺靜脈回流增加 → 左心房、左心室容量負荷增加 → 左心衰竭（left-sided CHF）；表現為肺水腫、運動不耐、連續性心雜音（machinery murmur）。","we":{"A":"A. PDA（左向右分流）主要造成左心衰竭，而非右心衰竭；右心失代償是逆向PDA（右向左分流，艾森曼格綜合征）的晚期表現。","B":"B. 雙心室衰竭（biventricular failure）可在嚴重晚期發生，但初始主要是左心CHF。","C":"C. (正確) PDA（左向右分流）最初造成左心容量超負荷，進展為左側充血性心衰竭（left-sided CHF），表現為肺水腫和左心擴張。","D":"D. 心房顫動雖可繼發，但PDA的直接後果是左心CHF，不是心律不整。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_043","year":2021,"roc_year":110,"session":"","examNo":43,"q":"心臟超音波脈衝式都卜勒（PW Doppler）掃描的最大缺點為何？","opts":["A. 無法確定血流方向","B. 可檢查選定之血管的血流流速與方向","C. 高速血流之流速測定受奈奎斯特限制（Nyquist limit）","D. 解析度不良"],"ans":2,"exp":"脈衝波都卜勒（pulsed wave Doppler, PW Doppler）的限制：有「奈奎斯特限制」（Nyquist limit），即最大可測速度受採樣頻率限制，高速血流（如主動脈狹窄）會發生aliasing（偽像），無法準確測量；連續波都卜勒（CW Doppler）則無此限制，可測高速血流。","we":{"A":"A. PW Doppler可準確定位血流位置（range-gated），這是其優點而非缺點。","B":"B. PW Doppler解析度不如CW低，但主要缺點是速度範圍限制。","C":"C. (正確) PW Doppler因奈奎斯特限制，無法準確測量高速血流（出現aliasing），這是其主要缺點。","D":"D. PW Doppler對低速血流測量是其應用優勢（如靜脈、心室充填），非缺點。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_044","year":2021,"roc_year":110,"session":"","examNo":44,"q":"犬貓血液中何種離子不平衡會造成心電圖中P波消失？","opts":["A. 低血鉀","B. 高血鉀","C. 低血鈣","D. 高血鈣"],"ans":1,"exp":"高鉀血症（hyperkalemia）對心臟的影響：隨著血鉀升高，心電圖（ECG）變化依序為：T波高尖（peaked T wave）→ PR間隔延長 → P波消失（sinoatrial block, SA block）→ QRS波增寬 → 心室顫動 → 心搏停止。P波消失表示心房電位被抑制，是較嚴重高鉀血症的心電圖表現。","we":{"A":"A. T波高尖（peaked T wave）是高鉀血症最早期的心電圖變化，正確。","B":"B. (正確) 血鉀進一步升高時，P波消失（sinoatrial block），心室由交界性或心室性節律驅動，是高鉀血症嚴重心電圖變化。","C":"C. QRS波增寬（wide QRS）是高鉀血症更晚期（P波消失之後）的表現，不是在P波消失之前。","D":"D. 心室顫動（VF）是高鉀血症最嚴重的表現，是最後階段而非P波消失後即刻發生。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_045","year":2021,"roc_year":110,"session":"","examNo":45,"q":"傳統的聽診器有兩面，其中平坦的膜面（diaphragm）最適合用來聽下列何者？","opts":["A. 高頻心音","B. 低頻心音","C. 第3心音","D. 奔馬音（gallop sounds）"],"ans":0,"exp":"心音聽診：聽診器的diaphragm（膜型面）適合聽高頻聲音（高頻心音），如第一、第二心音（S1、S2）以及大多數心雜音；bell（鐘型面）適合聽低頻聲音，如第三心音（S3）、第四心音（S4）以及某些低頻心雜音（如二尖瓣狹窄的雜音）。","we":{"A":"A. (正確) Diaphragm（膜型面）用於聽高頻聲音，包括大多數心雜音和S1/S2，是聽診心臟雜音的主要面。","B":"B. Bell（鐘型面）用於低頻聲音（S3、S4）而非高頻，此描述有誤。","C":"C. 不同心音和雜音的最佳聽診部位（aortic area, pulmonic area等）與使用diaphragm或bell的選擇不同，高頻雜音應用diaphragm。","D":"D. 輕壓聽診器才能用bell面聽低頻音（重壓則bell變為diaphragm），這與高頻音的聽法相反。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_046","year":2021,"roc_year":110,"session":"","examNo":46,"q":"下列何種犬隻疾病最有可能出現白血球低下症？","opts":["A. 細菌性腎盂腎炎","B. 免疫性多發性關節炎","C. 疥蟎（sarcoptic mange）","D. 多發性骨髓瘤（multiple myeloma）"],"ans":3,"exp":"多發性骨髓瘤（multiple myeloma）是漿細胞（plasma cell）的惡性腫瘤，過量的惡性漿細胞在骨髓中增生，取代正常造血細胞；這會導致白血球（尤其是中性球）減少，以及貧血（紅血球減少）和血小板減少。骨髓浸潤的結果是正常造血受抑制，故白血球低下。","we":{"A":"A. 高鈣血症（hypercalcemia）是多發性骨髓瘤的常見副腫瘤表現（骨溶解→釋放鈣），正確。","B":"B. 高黏滯血症（hyperviscosity syndrome）因大量M蛋白（單克隆免疫球蛋白）蓄積，正確。","C":"C. 骨病變（骨溶解、骨折、骨痛）是多發性骨髓瘤的特徵，正確。","D":"D. (正確) 骨髓被惡性漿細胞取代，導致正常白血球生成受抑制，造成白血球低下（leukopenia），不是白血球升高。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_047","year":2021,"roc_year":110,"session":"","examNo":47,"q":"下列何種犬隻口腔腫瘤通常會在疾病早期轉移到肺臟及其他器官？","opts":["A. 口腔非扁桃腺鱗狀上皮細胞瘤","B. 口腔惡性黑色素瘤","C. 口腔纖維肉瘤","D. 口腔齒齦瘤"],"ans":1,"exp":"口腔惡性黑色素瘤（oral malignant melanoma）是犬最惡性的口腔腫瘤之一，特點是：早期即容易發生遠端轉移（lung, lymph node），即使腫瘤看起來較小，也可能已有遠端轉移；局部侵犯骨組織也很常見；預後極差。","we":{"A":"A. 口腔惡性黑色素瘤確有局部骨侵犯，但早期遠端轉移是其最重要的惡性特徵。","B":"B. (正確) 口腔惡性黑色素瘤以早期遠端轉移（肺、淋巴結）著稱，即使腫瘤體積小也可能已轉移，這是其診斷和治療選擇的重要考量。","C":"C. 放射治療對黑色素瘤有一定的局部控制效果，但不能解決遠端轉移問題。","D":"D. 外科切除雖是主要治療，但因早期轉移率高，單純手術預後仍差。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_048","year":2021,"roc_year":110,"session":"","examNo":48,"q":"下列何種犬隻血相變化最能支持免疫性溶血性貧血的診斷？","opts":["A. 棘狀紅血球增多症","B. 強烈再生性貧血","C. 霍威爾－喬利（Howell-Jolly）小粒","D. 球形紅血球增多症（spherocytosis）"],"ans":3,"exp":"球形紅血球（spherocyte）是紅血球部分細胞膜被免疫介導性溶血（IMHA）中的巨噬細胞部分吞噬後，失去雙凹圓盤形變成球形；在血塗片上見到大量球形紅血球是診斷免疫介導性溶血性貧血（IMHA）最具特異性的形態學依據，尤其在犬。","we":{"A":"A. 有核紅血球（nRBC）在嚴重貧血時出現，但不具IMHA特異性。","B":"B. 多染性紅血球（polychromasia）表示再生性貧血，可見於多種原因的貧血。","C":"C. 裂片紅血球（schistocyte）見於微血管病性溶血（如DIC），對IMHA不具特異性。","D":"D. (正確) 球形紅血球（spherocyte）在犬血塗片中的出現是診斷IMHA最具特異性的形態依據，因為它的形成機制直接反映免疫性溶血過程。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_049","year":2021,"roc_year":110,"session":"","examNo":49,"q":"唯一能確診犬貓消化道食物不良反應的檢驗方式為何？","opts":["A. 生檢採樣及組織病理學檢查","B. 食物消去試驗及抗原再刺激法","C. 血清免疫球蛋白E效價測試及細菌培養","D. 皮內抗原測試及試驗治療"],"ans":1,"exp":"食物不良反應（adverse food reaction）包括食物過敏（food allergy，免疫性）和食物不耐症（food intolerance，非免疫性）。唯一能確診食物不良反應的方法是：先執行食物消去試驗（elimination diet trial）至少8-12週，症狀緩解後再進行抗原再刺激（food challenge/provocation test），若症狀復發即確診。","we":{"A":"A. 血清過敏原特異IgE（RAST test）或皮膚點刺試驗在食物不良反應的診斷中準確性低，不是確診方法。","B":"B. (正確) 食物消去試驗配合抗原再刺激（elimination diet + rechallenge）是確診食物不良反應的唯一方法，也是金標準。","C":"C. 內視鏡活檢可評估腸道炎症，但不能確診特定食物不良反應。","D":"D. 飼主日記（食物日記）有助於識別可疑過敏原，但不是確診方法。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_050","year":2021,"roc_year":110,"session":"","examNo":50,"q":"一隻3歲迷你貴賓雌犬已有4個月的間斷性嘔吐。此嘔吐只發生於進食後1~3小時左右，以噴射式呈現且嘔吐物\r  常包括有未消化食物。犬隻之食慾、精神及其他活力皆正常，理學檢查一切正常。其最可能的診斷為何？","opts":["A. 腸胃逆流","B. 胃異物","C. 胃幽門狹窄","D. 慢性腎衰竭"],"ans":2,"exp":"幽門狹窄（pyloric stenosis）造成胃排空障礙，食物在胃內積聚；由於幽門阻塞，食物無法排空，在進食後1-3小時當胃容積達到一定程度後發生噴射式嘔吐（projectile vomiting），嘔吐物為未消化食物（無膽汁，因阻塞在幽門）。","we":{"A":"A. 幽門狹窄嘔吐物無膽汁（阻塞在幽門前），而非含膽汁，正確方向但細節需確認。","B":"B. 嘔吐通常在進食後而非空腹時發生，且是食物充填到一定量後噴出。","C":"C. (正確) 幽門狹窄的典型表現是進食後1-3小時發生噴射式嘔吐，嘔吐物為未消化食物（不含膽汁），屬非阻塞性嘔吐後轉為阻塞性的特徵表現。","D":"D. 嘔吐後動物仍有食慾（幽門狹窄初期），因為嘔吐後胃部空虛，飢餓感出現。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_051","year":2021,"roc_year":110,"session":"","examNo":51,"q":"犬貓患有肺動脈高血壓時，在理學檢查中聽診時的特徵性心音為何？","opts":["A. 第一心音分裂音（split S1）","B. 肺動脈區收縮性心雜音（pulmonary systolic murmur）","C. 第二心音分裂音（split S2）","D. 肺動脈區舒張性心雜音（pulmonary diastolic murmur）"],"ans":2,"exp":"肺動脈高血壓（pulmonary hypertension）時，肺動脈瓣關閉延遲，導致第二心音（S2）的分裂：主動脈瓣（A2）先關閉，肺動脈瓣（P2）後關閉，在聽診上出現可聞及的S2分裂（split S2）；如果肺動脈壓升高，P2成分增強（loud P2），在肺動脈瓣區（左側第2-3肋間隙）最明顯。","we":{"A":"A. 肺動脈高血壓主要在右心，心臟擴大（右心室肥大）雖可見，但最特徵性的聽診發現是S2分裂。","B":"B. 連續性心雜音（machinery murmur）是PDA的特徵，非肺動脈高血壓。","C":"C. (正確) 肺動脈高血壓時，肺動脈瓣關閉延遲，造成可聞及的第二心音分裂（split S2），且P2成分增強，是肺動脈高血壓的重要聽診發現。","D":"D. 右心S3奔馬律（gallop rhythm）在心衰竭時出現，但S2分裂是肺動脈高血壓更特異的表現。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_052","year":2021,"roc_year":110,"session":"","examNo":52,"q":"犬隻有嚴重的喉頭癱（laryngeal paralysis）時，最有可能聽到下列何者？","opts":["A. 呼氣時喘鳴（stridor/stertor）","B. 吸氣時喘鳴（stridor/stertor）","C. 呼氣時哮鳴（wheeze）","D. 吸氣時哮鳴（wheeze）"],"ans":1,"exp":"喉頭癱瘓（laryngeal paralysis）造成喉頭外展（abduction）肌群無力，使喉頭軟骨（杓狀軟骨）在吸氣時無法充分外展，吸氣氣流通過狹窄的喉腔時產生特徵性的「吸氣性喘鳴音」（inspiratory stridor/wheeze）；運動或興奮時加重。","we":{"A":"A. 喉頭癱瘓產生的是吸氣性喘鳴，而非呼氣性喘鳴；呼氣性喘鳴（wheezing）見於下呼吸道疾病（如氣喘）。","B":"B. (正確) 喉頭癱瘓造成上呼吸道阻塞，在吸氣時（氣流向內）喉腔最狹窄，產生特徵性的吸氣時喘鳴音（inspiratory stridor）。","C":"C. 連續性喘鳴（如tracheal collapse）有其特點，但喉頭癱瘓的特徵是吸氣性喘鳴。","D":"D. 喉頭癱瘓通常不造成呼吸音完全消失（silenced breathing），而是出現特殊喘鳴音。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_053","year":2021,"roc_year":110,"session":"","examNo":53,"q":"下列何項最不可能造成呼吸性鹼血症？","opts":["A. 低二氧化碳血症（hypocapenia）","B. 過度換氣（hyperventilation）","C. 換氣不足（hypoventilation）","D. 呼吸過快（tachypnea）"],"ans":2,"exp":"換氣不足（hypoventilation）時，CO2不能充分排出體外，造成PaCO2升高（高碳酸血症, hypercapnia）；CO2溶於血液形成碳酸（H2CO3）解離出H⁺，使血液pH值下降，造成呼吸性酸血症（respiratory acidosis）。","we":{"A":"A. 換氣不足時CO2蓄積，血pH下降，是呼吸性酸血症而非鹼血症。","B":"B. 過度換氣（hyperventilation）才會排出過多CO2，造成呼吸性鹼血症。","C":"C. (正確) 換氣不足 → CO2蓄積 → PaCO2升高 → H2CO3增加 → H⁺升高 → pH下降 → 呼吸性酸血症（respiratory acidosis）。","D":"D. 代謝性酸血症是因非揮發性酸蓄積或HCO3⁻喪失，與換氣不足（呼吸性）機制不同。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_054","year":2021,"roc_year":110,"session":"","examNo":54,"q":"4~5月齡混種公貓，食慾精神下降，後肢跛行，觸診骨盆及背部疼痛。根據其X光影像，下列何種疾病最有可能？","opts":["A. 營養性繼發性高副甲狀腺功能症（nutritional secondary hyperparathyroidism）","B. 營養性繼發性高甲狀腺功能症（nutritional secondary hyperthyroidism）","C. 先天性低甲狀腺功能症（congenital hypothyroidism）","D. 黏多醣症（mucopolysaccharidosis）"],"ans":0,"exp":"全肉飲食（all-meat diet）的鈣磷比失衡：肉類（肌肉）含磷高而鈣低（Ca:P比例大約1:20），長期飼餵全肉飲食的幼貓造成低鈣高磷，繼發性甲狀旁腺功能亢進（nutritional secondary hyperparathyroidism, NSHP）→ PTH過量分泌 → 骨骼脫鈣 → 骨質疏鬆 → 自發性骨折；多見於幼貓。","we":{"A":"A. (正確) 全肉飲食（all-meat diet）的幼貓因鈣:磷比例嚴重失衡（鈣不足磷過多），導致營養性繼發性甲狀旁腺功能亢進（NSHP），骨骼脫鈣，引起自發性骨折。","B":"B. 維生素D3過量可引起高鈣血症，但全肉飲食不是維生素D過量的原因。","C":"C. 高磷飲食可加重腎病，但幼貓骨折的直接原因是NSHP，不是腎性骨病。","D":"D. 蛋白質過量引起的問題通常是腎臟負擔，不是骨折的主因。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_055","year":2021,"roc_year":110,"session":"","examNo":55,"q":"3歲未去勢公柴犬，出現腹痛、嘔吐、精神沉鬱，腹腔右側照及腹背照X光影像如下圖，可見腹腔內臟器漿膜   面可見度降低，下列何者最不可能？","opts":["A. 腹腔內腫瘤（peritoneal neoplasia）","B. 腹膜炎（peritonitis）","C. 腹腔內含有褐色脂肪（brown fat）","D. 腹腔內有積液（peritoneal effusion）"],"ans":2,"exp":"腹腔鏡檢查（exploratory laparoscopy/laparotomy）評估漿膜面（serosal surface）可見度：正常成年犬的腹腔脂肪（omental fat, mesenteric fat）呈黃白色，可能輕微影響視野；成年犬腹腔已無褐色脂肪（brown adipose tissue），褐色脂肪只存在於新生兒或特定物種，不會是影響漿膜面可見度的因素；若說成年犬腹腔有褐色脂肪蓄積並「影響漿膜面可見度」則是錯誤的描述。","we":{"A":"A. 腹水（ascites）可嚴重影響漿膜面可見度，需先引流，描述正確。","B":"B. 腸管擴張可遮擋視野，確影響漿膜面檢查，描述正確。","C":"C. (正確) 成年犬腹腔無褐色脂肪，「成年犬腹腔褐色脂肪蓄積造成漿膜面可見度降低」是錯誤的描述。","D":"D. 腹腔內出血（血腹）大量血液確實影響視野，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_056","year":2021,"roc_year":110,"session":"","examNo":56,"q":"引起貓病毒性鼻氣管炎（Feline viral rhinotracheitis）之病原為","opts":["A. 貓杯狀病毒","B. 貓疱疹病毒","C. 貓冠狀病毒","D. 貓白血病病毒"],"ans":1,"exp":"貓病毒性鼻氣管炎（feline viral rhinotracheitis, FVR）由貓疱疹病毒第一型（Feline herpesvirus type 1, FHV-1）引起，是貓最常見的上呼吸道感染之一；表現為打噴嚏、鼻分泌物、結膜炎、角膜潰瘍等。","we":{"A":"A. 貓卡利西病毒（FCV）也引起上呼吸道感染，但致病原為FCV，不是FHV-1。","B":"B. (正確) 貓病毒性鼻氣管炎（FVR）的病原是貓疱疹病毒第一型（FHV-1），這是正確的病原學對應。","C":"C. 貓泛白血球減少症（FPV, 貓瘟）由細小病毒引起，不是引起鼻氣管炎的病原。","D":"D. 貓冠狀病毒（FCoV）引起傳染性腹膜炎（FIP），不引起鼻氣管炎。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_057","year":2021,"roc_year":110,"session":"","examNo":57,"q":"下列何者為犬乳糜胸（chylothorax）最常見的病因？","opts":["A. 肺水腫","B. 心囊炎","C. 胸管破裂","D. 肝硬化"],"ans":2,"exp":"乳糜胸（chylothorax）最常見的原因是胸管（thoracic duct）破裂或阻塞，導致乳糜液（chyle，富含乳糜微粒的淋巴液）漏入胸腔；在犬貓中，創傷（trauma）是胸管破裂最常見的原因，但在臨床上胸管破裂（不論原因）是乳糜胸的最主要原因。","we":{"A":"A. 腫瘤（如淋巴瘤）可阻塞胸管或引起乳糜外漏，但不是最常見原因。","B":"B. 心臟病（右心衰竭）可提高淋巴管壓力，是乳糜胸的一個病因，但不是最常見。","C":"C. (正確) 胸管破裂（thoracic duct rupture）是乳糜胸最常見的直接原因，導致乳糜液流入胸腔形成乳糜胸。","D":"D. 特發性（idiopathic）乳糜胸在貓也不少見，但胸管病理（破裂/阻塞）仍是最主要原因。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_058","year":2021,"roc_year":110,"session":"","examNo":58,"q":"下列何種呼吸音僅出現於下呼吸道疾病的聽診？","opts":["A. 喘息（wheeze）","B. 鼾聲（stertor）","C. 喘鳴（stridor）","D. 濕囉音（crackles）"],"ans":0,"exp":"喘鳴音（wheezes）是由狹窄的下呼吸道氣流振動產生的連續性高音調呼吸音，特徵性地出現於下呼吸道疾病（如氣喘、支氣管炎、細支氣管痙攣），在上呼吸道疾病中不出現wheeze（上呼吸道產生stridor）；因此wheeze是下呼吸道疾病的特徵性聽診音，上呼吸道疾病不會產生wheeze。","we":{"A":"A. (正確) Wheeze（喘鳴音/哮鳴音）僅見於下呼吸道疾病（如氣喘、支氣管痙攣），是下呼吸道狹窄的特徵；上呼吸道狹窄產生的是stridor，而非wheeze。","B":"B. Crackles（爆裂音）見於肺水腫、肺炎等，與wheeze不同，可見於上下呼吸道問題。","C":"C. Wheeze可以在呼氣和吸氣時都聽到（呼氣型wheeze更常見於氣喘），但描述其為「雙相性」不能說明其特異性。","D":"D. Wheeze與stridor不同：stridor是單音調（monophonic）上呼吸道阻塞音，wheeze是多音調（polyphonic）下呼吸道音。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_059","year":2021,"roc_year":110,"session":"","examNo":59,"q":"下列何項為低張的輸液？","opts":["A. 0.9%生理鹽水","B. 乳酸林格氏液","C. 5%右旋糖溶液","D. 林格氏液"],"ans":2,"exp":"輸液張力（tonicity）：5%右旋糖水（D5W, 5% dextrose in water）的滲透壓雖然接近等張（約252 mOsm/L），但輸入體內後葡萄糖迅速被代謝，留下的是純水，因此有效張力為低張（hypotonic）；在臨床上被歸類為低張輸液，用於補充自由水（free water）。","we":{"A":"A. 0.9% NaCl（生理鹽水）是等張輸液，D5W不是等張。","B":"B. 3% NaCl是高張輸液，D5W不是高張。","C":"C. (正確) 5%右旋糖水雖初始接近等張，但葡萄糖代謝後相當於純水（低張），臨床上分類為低張輸液（hypotonic solution）。","D":"D. 平衡液（如LRS, Plasmalyte）是等張輸液，D5W不是平衡液。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_060","year":2021,"roc_year":110,"session":"","examNo":60,"q":"下列何藥物對貓不屬於dose-dependent hepatotoxins？","opts":["A. acetaminophen","B. phenobarbital","C. tetracycline","D. stanozolol"],"ans":1,"exp":"Phenobarbital（苯巴比妥）在不同物種的肝毒性特徵不同：在犬，長期使用可造成劑量依賴性肝毒性（dose-dependent hepatotoxicity），需監測肝功能；在貓，phenobarbital的肝毒性則屬於特異體質性（idiosyncratic）反應，與劑量無直接相關，無法透過降低劑量來完全預防。","we":{"A":"A. Phenobarbital在犬的肝毒性是劑量依賴性，可透過監測和調整劑量管理，正確。","B":"B. (正確) 在貓，phenobarbital的肝毒性屬特異體質性（idiosyncratic）反應，非劑量依賴性，無法預測或透過減量完全避免。","C":"C. Phenobarbital在犬不是特異體質性肝毒性（在犬是劑量依賴性），描述有誤。","D":"D. Phenobarbital的肝毒性在貓不是全無（有特異體質性風險），不可說貓對phenobarbital肝毒性免疫。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_061","year":2021,"roc_year":110,"session":"","examNo":61,"q":"下列何者不適用於治療犬隻急性下痢？","opts":["A. 為維持體力及補充水分，不應限制正常食物給與","B. 嚴重下痢時，可輸液補充水分","C. 止瀉藥物的投予，應以短期舒緩症狀為原則","D. 不應例行投予抗生素"],"ans":0,"exp":"急性下痢（acute diarrhea）的飲食管理：傳統上建議短暫禁食（24小時），讓腸道休息，減少食物刺激，有助於腸上皮修復；但現代觀點（特別是小動物）逐漸認為短期限食（而非完全禁食）或給予易消化食物更適合（不限制進食），但完全「不限制食物」（ad lib feeding）在急性下痢急性期是錯誤的處理方式。","we":{"A":"A. (正確) 急性下痢急性期應適當禁食或限食，「不限制食物（繼續正常餵食）」是錯誤的處理，會加重腸道負擔。","B":"B. 適當補充水分和電解質是急性下痢的重要支持治療，正確。","C":"C. 益生菌可輔助腸道菌叢恢復，正確。","D":"D. 若懷疑細菌感染，適當使用抗生素是合理的，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_062","year":2021,"roc_year":110,"session":"","examNo":62,"q":"下列何者在貓最不易出現雙側性脫毛？","opts":["A. 低腎上腺皮質功能症","B. 高腎上腺皮質功能症","C. 低甲狀腺功能症","D. 醫源性庫興氏症候群（Cushing's syndrome）"],"ans":0,"exp":"腎上腺皮質功能不足（hypoadrenocorticism, Addison's disease）在貓的臨床表現與犬不同：貓的Addison's disease相對少見且症狀不典型，在貓中「雙側性對稱性脫毛（bilaterally symmetric alopecia）」不是Addison's disease的典型表現（此症狀更常見於過多糖皮質素/庫欣氏症，或甲狀腺低下），故在貓最不容易出現雙側性脫毛。","we":{"A":"A. (正確) 在貓，低腎上腺皮質功能症（Addison's）最不容易表現為雙側性對稱性脫毛；此症狀在貓通常見於高糖皮質素（庫欣氏）或甲狀腺/性激素問題。","B":"B. 虛弱/嗜睡確是Addison's disease在貓的可能表現，描述正確。","C":"C. 食慾不振和嘔吐是Addison's disease的常見非特異性症狀，正確。","D":"D. 低血壓（因醛固酮不足導致鈉水喪失）是Addison's disease的重要表現，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_063","year":2021,"roc_year":110,"session":"","examNo":63,"q":"下列何者最易使黏膜呈藍紫色？","opts":["A. 永存性右主動脈弓","B. 由右向左之永存性動脈導管","C. 主動脈瓣狹窄","D. 二尖瓣發育不全"],"ans":1,"exp":"逆向動脈導管（reversed PDA/right-to-left PDA, Eisenmenger's syndrome）：當PDA長期左向右分流造成肺動脈高壓，肺動脈壓超過主動脈壓時，分流反向（右向左），靜脈血（未氧合血）流入主動脈尾側（後肢血液），造成後半身（後肢和會陰）黏膜發紺（differential cyanosis），而前半身（前肢和口腔黏膜）顏色正常（粉紅色）。","we":{"A":"A. 逆向PDA造成差異性發紺（differential cyanosis），前半身（口腔黏膜）是粉紅色，而非全身黏膜均發紺。","B":"B. (正確) 逆向PDA（右向左分流）使未氧合血進入後半身動脈，造成後肢和會陰黏膜發紺（differential cyanosis），是逆向PDA的典型表現。","C":"C. 逆向PDA不造成前半身發紺，前後半身黏膜顏色差異（前粉後紫）是鑑別要點。","D":"D. 全身黏膜均發紺見於全身性低氧（如嚴重肺病、右向左心內分流），逆向PDA只造成後半身發紺。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_064","year":2021,"roc_year":110,"session":"","examNo":64,"q":"下列何種疾病最容易併發feline fragile skin syndrome？","opts":["A. hyperadrenocorticism","B. diabetes mellitus","C. hypothyroidism","D. hyperthyroidism"],"ans":0,"exp":"高腎上腺皮質素功能症（hyperadrenocorticism, HAC, Cushing's syndrome）在貓中可引起「脆皮症候群」（fragile skin syndrome, feline skin fragility syndrome）：貓皮膚因糖皮質素過量導致皮膚膠原蛋白降解，皮膚變得非常薄脆，輕微觸碰即可撕裂，是貓HAC的特徵性皮膚病變（在犬不常見此表現）。","we":{"A":"A. (正確) 高腎上腺皮質素功能症（HAC）在貓可引起fragile skin syndrome（脆皮症候群），皮膚因膠原蛋白降解而極度薄脆易撕裂，是貓HAC的特異表現。","B":"B. 甲狀腺低下（hypothyroidism）在貓中罕見，且表現為皮膚增厚（黏液水腫）非脆皮。","C":"C. 糖尿病雖與HAC相關，但脆皮症候群是由糖皮質素過量直接引起，不是糖尿病本身。","D":"D. 食物過敏不引起脆皮症候群，而是引起搔癢和炎症反應。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_065","year":2021,"roc_year":110,"session":"","examNo":65,"q":"某犬血液檢查時發現有高血鈣症，下列何項不是其主要病因？","opts":["A. primary hyperparathyroidism","B. malignant lymphosarcoma","C. renal failure","D. diabetes mellitus"],"ans":3,"exp":"高血鈣症（hypercalcemia）的病因（犬貓）：D - 維生素D中毒、I - 特發性（貓）、O - 骨溶解（腫瘤或其他）、G - 顆粒腫性疾病（如肉芽腫）、S - Spurious（偽高值，脂血症）、H - 原發性甲狀旁腺功能亢進、T - 腎上腺皮質功能不足（Addison's）、P - 副腫瘤（PTHrP）、A - 維生素A中毒。糖尿病（diabetes mellitus）本身不是高血鈣症的病因（糖尿病通常是正鈣或低鈣）。","we":{"A":"A. 淋巴瘤（lymphoma）是犬最常見的副腫瘤性高血鈣症原因（分泌PTHrP），正確。","B":"B. 原發性甲狀旁腺功能亢進（primary hyperparathyroidism）造成PTH過量分泌，引起高血鈣，正確。","C":"C. 腎上腺皮質功能不足（hypoadrenocorticism）可造成輕微高血鈣（機制不完全明確），正確。","D":"D. (正確) 糖尿病（diabetes mellitus）本身不會引起高血鈣症，不在高血鈣症的病因清單中，是本題的錯誤選項。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_066","year":2021,"roc_year":110,"session":"","examNo":66,"q":"下列何者為犬貓手術前後產生的併發症，與肝臟疾患較無直接關係？","opts":["A. 全身性高血壓","B. 傷口不易癒合","C. 凝血功能異常","D. 低血糖"],"ans":0,"exp":"全身性高血壓（systemic hypertension）的常見器官損傷靶器官（target organ damage）包括：眼睛（視網膜剝離、視網膜出血、青光眼）、腎臟（腎病惡化、蛋白尿）、神經系統（腦血管意外、癲癇）、心臟（左心室肥大）；肝臟疾患與全身性高血壓的直接因果關係較不明確，肝臟疾病更常見低血壓（門脈高血壓是不同的循環問題）而非因全身高血壓損傷。","we":{"A":"A. (正確) 全身性高血壓與肝臟疾患的直接相關性最弱，高血壓的主要靶器官是眼、腎、腦、心臟，而非肝臟。","B":"B. 腎臟損傷（高血壓性腎病）是全身性高血壓的重要靶器官損傷，描述正確。","C":"C. 眼部損傷（視網膜剝離）是高血壓在小動物的重要臨床表現，描述正確。","D":"D. 中樞神經系統（腦血管意外、神經症狀）是高血壓靶器官之一，描述正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_067","year":2021,"roc_year":110,"session":"","examNo":67,"q":"一隻6月齡20公斤的拉布拉多公犬，就診時發現右前肢跛行，肘關節有腫脹的情形，最不可能為下列何種疾\r   病？","opts":["A. fragmented coronoid process（FCP）","B. Legg-Perthes disease","C. osteochondritis dissecans（OCD）","D. ununited anconeal process（UAP）"],"ans":1,"exp":"Legg-Calvé-Perthes disease（LCP disease，也稱Legg-Perthes disease）是幼犬（通常小型品種，如約克夏㹴、貴賓犬等）股骨頭缺血性壞死（avascular necrosis of the femoral head）；影響部位是股骨頭（femoral head），即髖關節（hip joint），不是肘關節；好發於4-12月齡小型犬。","we":{"A":"A. LCP disease影響髖關節（股骨頭），不是肩關節（肩關節骨軟骨症是另一疾病）。","B":"B. (正確) Legg-Perthes disease是股骨頭缺血性壞死，影響髖關節，好發於小型幼犬（而非大型犬），不是肘關節病變。","C":"C. LCP disease影響髖關節，不是膝關節（膝關節問題如OCD或髕骨脫臼是不同疾病）。","D":"D. LCP disease確實影響髖關節（股骨頭），但本選項若描述為「大型犬髖關節」則需注意：LCP disease是小型犬疾病，大型犬的髖關節問題更常見髖關節發育不良（HD）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_068","year":2021,"roc_year":110,"session":"","examNo":68,"q":"欲以開胸方式結紮犬的永存性動脈導管（PDA）時，導管的解剖位置通常位於","opts":["A. 肺靜脈和主動脈之間","B. 迷走神經下方","C. 肺動脈和後大靜脈之間","D. 右返喉神經和迷走神經之間"],"ans":1,"exp":"動脈導管（ductus arteriosus）的解剖位置：位於主動脈弓（aortic arch）和左肺動脈之間，在迷走神經（vagus nerve）的下方（相對位置）；外科結紮PDA時需辨認迷走神經並避免損傷，PDA通常位於左側胸腔，迷走神經從其上方或背側通過。（此題標記待複查確認解剖細節）","we":{"A":"A. PDA位於迷走神經上方不符合標準手術解剖描述（通常描述為位於迷走神經下方或腹側）。","B":"B. (可能正確但需確認) PDA位於迷走神經下方（腹側），外科手術時需辨識迷走神經保護之，PDA在其下方。","C":"C. PDA不位於頸靜脈神經旁，頸靜脈孔在顱底，與PDA無關。","D":"D. 橫膈神經（phrenic nerve）是另一個在心包切除術中需保護的神經，PDA手術相關的是迷走神經。"},"needs_review":true,"imgs":[]},{"id":"AMO_2021_普通病_069","year":2021,"roc_year":110,"session":"","examNo":69,"q":"下列何者不是造成貓巨結腸症的常見原因？","opts":["A. 會陰疝氣","B. 骨盆創傷造成的狹窄","C. 自律神經失調","D. 不適當的飲食"],"ans":3,"exp":"貓巨結腸症（feline megacolon）的病因包括：骨盆狹窄（骨折後遺症、骨盆發育不良）、神經病變（自主神經功能障礙）、特發性平滑肌功能障礙（最常見）、解剖異常、某些藥物（如鈣離子通道阻斷劑等）；不適當的飲食（dietary inappropriateness）是便秘的誘發因素，但通常不被列為貓巨結腸症的主要病因，尤其是「特發性巨結腸症」的原因是結腸平滑肌功能障礙而非飲食。","we":{"A":"A. 骨盆骨折後骨盆腔狹窄是貓巨結腸症的重要原因，描述正確。","B":"B. 神經病變（如骨盆神經病變）可引起結腸神經性擴張，描述正確。","C":"C. 特發性（idiopathic）巨結腸症因結腸平滑肌功能障礙（neuromuscular dysfunction），正確。","D":"D. (正確) 不適當的飲食不是貓巨結腸症的主要病因，它可引起便秘但不是巨結腸症的根本原因；特發性巨結腸症的病理機制是神經肌肉功能障礙，與飲食無直接關係。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_070","year":2021,"roc_year":110,"session":"","examNo":70,"q":"關於犬隻第一型椎間盤突出的敘述，下列何者錯誤？","opts":["A. 因為有肋間韌帶的保護，前胸椎是最不容易發生此病的地方","B. 症狀的嚴重性和預後與脊髓被壓迫的程度相關","C. 若動物症狀主要為疼痛，仍可負重行走，可先採非手術性的藥物治療法","D. 軟骨發育不良的犬種如臘腸犬、米格魯犬為好發犬種"],"ans":[0,1],"exp":"Hansen Type I IVDD 兩個錯誤敘述：(A) 正確保護結構應為「肋骨頭間韌帶（intercapital/conjugal ligament）」而非「肋間韌帶（intercostal ligament）」，且最好發部位為胸腰椎交接處（T12-L2），非「前胸椎最不容易」的說法不夠精確；(B) 預後最重要的指標是「深層疼痛感（deep pain perception）是否保留」，而非單純壓迫程度，說預後「與壓迫程度相關」不夠準確。","we":["A. 錯誤：保護結構應為 intercapital ligament（肋骨頭間韌帶），且最好發部位是胸腰椎交接處（T12-L2）。","B. 錯誤：預後最重要指標是深層疼痛感（DPP）的有無，而非單純脊髓壓迫程度。","C. 正確：Grade 1-2（疼痛但可負重）可先保守治療（NSAIDs、休息），不一定要立即手術。","D. 正確：臘腸犬（Dachshund）、米格魯（Beagle）等軟骨發育不良犬種（chondrodystrophic breeds）為 Type I IVDD 高危品種。"],"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_071","year":2021,"roc_year":110,"session":"","examNo":71,"q":"1歲雌性未結紮貴賓犬，右後肢跛行，理學檢查右髖關節區域疼痛。根據其X光髖關節腹背照影像，下列何者最有可能？","opts":["A. 髖關節發育不全（hip dysplasia）","B. 股骨頭無菌性壞死（aseptic necrosis of the femoral head, Legg-Calve-Perthes Disease）","C. 骨軟骨病（osteochondrosis）","D. 骨髓炎（osteomyelitis）"],"ans":1,"exp":"Legg-Calvé-Perthes disease（股骨頭缺血性壞死）最常見於1歲以下小型品種幼犬（如約克夏㹴、貴賓犬），臨床表現為後肢跛行，X光顯示股骨頭不規則、扁平化或塌陷。（此題原始為圖像題，標記待複查）","we":{"A":"A. 1歲小型犬的髖關節問題若X光顯示股骨頭骨密度異常，LCP disease是首要考慮。","B":"B. (可能正確) 貴賓犬（poodle）是LCP disease的好發品種之一，1歲幼犬出現髖關節跛行應高度懷疑LCP disease（Legg-Perthes disease）。","C":"C. 髖關節發育不良（hip dysplasia）較常見於大型犬，1歲小型貴賓犬較不典型。","D":"D. 骨肉瘤（osteosarcoma）在1歲幼犬不常見，且通常累及長骨（遠端橈骨、近端肱骨等）。"},"needs_review":true,"imgs":[]},{"id":"AMO_2021_普通病_072","year":2021,"roc_year":110,"session":"","examNo":72,"q":"犬隻手術後如出現肺再擴張性水腫（re-expansion pulmonary edema, RPE）的併發症，下列何種術後早期處置   方式會使病情更惡化？","opts":["A. 給予利尿劑","B. 給予皮質類固醇","C. 使用肺泡復張術，以正壓充壓方式將肺臟維持40 cmH 2 O壓力，持續30秒","D. 有限的輸液體積管理，如使用膠體溶液"],"ans":2,"exp":"肺泡復張術（alveolar recruitment maneuver, ARM）是在全身麻醉期間使用高持續氣道正壓（sustained inflation, SI）以打開塌陷肺泡的手術技術；其潛在風險包括：氣壓傷（barotrauma）、血流動力學抑制、以及對視網膜色素上皮（retinal pigment epithelium, RPE）的損傷（視網膜牽拉/剝離風險增加）；因此ARM中的高壓可使已存在視網膜脫離或RPE病變惡化。","we":{"A":"A. ARM的高壓可能引起氣壓傷，但問題若問到「眼部」的特定風險則是RPE損傷。","B":"B. ARM造成靜脈回流減少和血壓降低（心輸出量下降），這是血流動力學風險，描述正確。","C":"C. (正確) 高壓肺泡復張術（ARM）可使視網膜色素上皮（RPE）病變惡化，特別是已有視網膜脫離風險的患者，高氣道壓可能使RPE進一步損傷。","D":"D. ARM不會直接引起心律不整，心律不整更多與麻醉藥物或缺氧有關。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_073","year":2021,"roc_year":110,"session":"","examNo":73,"q":"下列那一種藥物對於犬隻α 2 接受器具最高的專一性？","opts":["A. xylazine","B. romifidine","C. detomidine","D. medetomidine"],"ans":3,"exp":"Medetomidine（美托咪定）是α₂腎上腺素受體促效劑（α₂-adrenergic agonist），其α₂/α₁選擇性比非常高（約1620:1），是最具選擇性的α₂促效劑之一（比xylazine或detomidine選擇性更高）；高選擇性使其副作用（如低血壓）較低選擇性α₂促效劑更可預測。","we":{"A":"A. Xylazine的α₂/α₁選擇性約160:1，遠低於medetomidine，故medetomidine選擇性更高。","B":"B. Detomidine的α₂/α₁選擇性約260:1，也低於medetomidine。","C":"C. Romifidine的選擇性也低於medetomidine。","D":"D. (正確) Medetomidine的α₂/α₁選擇性（~1620:1）是所列α₂促效劑中最高的，是具有最高α₂選擇性的藥物。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_074","year":2021,"roc_year":110,"session":"","examNo":74,"q":"公貓最適用下列何種部位之尿道造口術？","opts":["A. 會陰部尿道造口術（perineal urethrostomy）","B. 恥骨前尿道造口術（prepubic urethrostomy）","C. 恥骨下尿道造口術（subpubic urethrostomy）","D. 陰囊前尿道造口術（prescrotal urethrostomy）"],"ans":0,"exp":"公貓（male cat）尿道阻塞（urethral obstruction）的特點是陰莖尿道（penile urethra）最狹窄，結石或栓子最易在此阻塞；外科手術選項：會陰部尿道造口術（perineal urethrostomy, PU）是最常執行的手術，將尿道開口前移至會陰部（較寬段），解除狹窄；前恥骨尿道造口術則較少用，適用於更近端的阻塞。","we":{"A":"A. (正確) 公貓尿道阻塞的標準手術是會陰部尿道造口術（perineal urethrostomy），在會陰部建立永久性尿道開口，解決反覆阻塞問題。","B":"B. 膀胱造口術（cystostomy）是緊急減壓用，不是長期解決方案。","C":"C. 尿道括約肌切除術不是公貓尿道阻塞的標準手術方式。","D":"D. 腎造瘻術（nephrostomy）是腎盂引流用，不適用於尿道阻塞治療。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_075","year":2021,"roc_year":110,"session":"","examNo":75,"q":"有關犬隻腫瘤與外科手術的相關性，下列敘述何者錯誤？","opts":["A. 就目前的獸醫領域而言，外科手術是最常用來治療腫瘤的方法","B. 緩解法外科手術（palliative surgery）的目的是改善患畜的生活品質（疼痛的舒緩或功能的改善），而且一定   可以有效延長患畜存活的時間","C. 犬外生殖器的transmissible venereal cell tumor（TVT），當單獨以vincristine給予時的治癒效果可達90%以上","D. 外科手術前若已有更多的活組織生檢診斷結果，常可幫助正確的手術方法的進行"],"ans":1,"exp":"緩解性手術（palliative surgery）目的是減輕症狀（如疼痛、機能障礙），提高生活品質，但不一定能根治腫瘤或延長存活時間；緩解性手術不承諾延長存活期，只是在存活期間提升舒適度，因此「緩解性手術一定延長存活時間」是不正確的陳述。","we":{"A":"A. 緩解性手術可有效減輕疼痛（如骨肉瘤截肢緩解骨痛），正確。","B":"B. (正確) 緩解性手術目的是改善生活品質，並不保證延長存活時間；部分手術可能間接延長存活，但這不是其定義或必然結果。","C":"C. 緩解性手術適用於惡性腫瘤無法根治切除的情況，可降低腫瘤負荷，改善症狀，正確。","D":"D. 緩解性手術前需評估麻醉風險和手術利益，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_076","year":2021,"roc_year":110,"session":"","examNo":76,"q":"預防性抗生素應在犬隻手術前多久給予最適當？","opts":["A. 開始切創時才給予","B. 開始切創的30~60分鐘前","C. 開始切創的70~90分鐘前","D. 開始切創的90~120分鐘前"],"ans":1,"exp":"預防性抗生素（prophylactic antibiotics）的給予時機：應在術前30-60分鐘靜脈給藥，確保手術開始時組織中已有足夠的抗生素濃度；過早給藥（如術前4小時）或過晚給藥（切皮後）都會降低預防效果。手術超過4小時應重複給藥。","we":{"A":"A. 術前2小時給藥組織濃度高峰可能已過，不是最佳時機。","B":"B. (正確) 預防性抗生素應在術前30-60分鐘靜脈給藥，這樣在切皮時組織中藥物濃度達到有效水平，最有效預防手術部位感染。","C":"C. 術前15分鐘靜脈給藥雖也可接受，但30-60分鐘是標準建議，確保充分分佈。","D":"D. 切皮後給藥為時已晚，無法有效預防污染已發生的感染。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_077","year":2021,"roc_year":110,"session":"","examNo":77,"q":"馬皮膚最常發生的腫瘤為","opts":["A. mast cell tumor","B. cutaneous lymphoma","C. vitiligo","D. sarcoid"],"ans":3,"exp":"Sarcoid（類肉瘤）是馬（equine）最常見的皮膚腫瘤，是一種侷限性纖維增生性腫瘤（局限性纖維瘤），與牛乳頭瘤病毒（bovine papillomavirus, BPV）感染相關；佔馬皮膚腫瘤的30-50%，可在任何部位發生，常見於頭部、頸部、腋部和腹股溝。","we":{"A":"A. 黑色素瘤（melanoma）是馬（尤其是灰色馬）的常見腫瘤，但在整體馬皮膚腫瘤中次於sarcoid。","B":"B. 鱗狀細胞癌（squamous cell carcinoma）是馬第二或第三常見皮膚腫瘤，不是最常見。","C":"C. 纖維瘤（fibroma）在馬可見，但不是最常見的皮膚腫瘤。","D":"D. (正確) Sarcoid是馬最常見的皮膚腫瘤，與BPV感染相關，佔馬皮膚腫瘤的多數，需注意其多種臨床形態（扁平型、疣狀、結節型、尤其是侵蝕性）。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_078","year":2021,"roc_year":110,"session":"","examNo":78,"q":"承上題，下列何種處置最不適合？","opts":["A. 投予dexamethasone","B. Bacille Calmette-Guérin（BCG）vaccination","C. cryotherapy","D. 投予cisplatin"],"ans":0,"exp":"馬sarcoid的治療選項包括：手術切除（高復發率）、冷凍治療（cryotherapy）、BCG免疫療法、病灶內化療（cisplatin, 5-FU）、CO2雷射、電化療（electrochemotherapy）等；Dexamethasone（地塞米松，強效皮質類固醇）因其免疫抑制作用，被認為可能刺激BPV相關腫瘤生長，禁用於馬sarcoid的治療。","we":{"A":"A. (正確) Dexamethasone是強效皮質類固醇，有免疫抑制作用，可能促進BPV相關sarcoid生長，是馬sarcoid治療的禁忌用藥。","B":"B. 冷凍治療（cryotherapy）是馬sarcoid的有效治療方法，正確。","C":"C. BCG（卡介苗）免疫療法是馬sarcoid的治療選項之一，正確。","D":"D. Cisplatin病灶內注射是馬sarcoid的化療選項，正確。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_079","year":2021,"roc_year":110,"session":"","examNo":79,"q":"一匹馬呈現急性、非常嚴重且持續性疝痛，腹部明顯擴張（abdominal distention），其最可能罹患下列何項疾\r   病？","opts":["A. 胃阻塞","B. 小腸阻塞","C. 大腸捻轉","D. 近端小腸炎"],"ans":2,"exp":"大腸捻轉（large colon volvulus, LCV）是馬急腹症中最緊急的外科疾病之一，臨床表現包括：急性劇烈疝痛（acute severe colic）、腹部快速擴張（distension）、直腸觸診可感受到大腸擴張和捻轉、休克徵象；因大腸血液供應受阻，病情迅速惡化，是危及生命的緊急症。","we":{"A":"A. 大腸捻轉表現急性劇烈疝痛但通常不伴有腸蠕動音增加（捻轉後迅速減少甚至消失）。","B":"B. 大腸捻轉時腸蠕動音減少（而非亢進），因捻轉造成腸道功能障礙。","C":"C. (正確) 大腸捻轉的典型臨床表現是急性劇烈疝痛（acute severe colic）合併明顯腹部擴張（rapid abdominal distension），因大腸（結腸）積氣積液導致腹圍明顯增大。","D":"D. 大腸捻轉不表現為輕微疝痛；相反，其特點是非常劇烈的疝痛和快速惡化的全身狀態。"},"needs_review":false,"imgs":[]},{"id":"AMO_2021_普通病_080","year":2021,"roc_year":110,"session":"","examNo":80,"q":"承上題，下列治療方式何者最正確？","opts":["A. 立即進行腹腔手術","B. 內科療法，給與止痛藥及輸液並住院觀察","C. 在右腹脇部（flank）進行放氣術","D. 翻轉馬匹，方向為自右側躺翻轉至左側躺"],"ans":0,"exp":"大腸捻轉（large colon volvulus）的治療：確診後需立即進行緊急外科手術（emergency surgical intervention），包括開腹、腸道復位（detorsion）、可能的結腸減壓（decompression）和腸道牽拉固定（colopexy）；手術延誤會導致腸壁缺血壞死，大幅提高死亡率，因此一旦確診，手術是不可拖延的唯一有效治療。","we":{"A":"A. (正確) 大腸捻轉確診後需立即進行緊急外科手術，延誤手術會導致腸道缺血壞死和休克加劇，是本病的標準且唯一有效治療方法。","B":"B. 保守療法（補液、鎮痛）只是暫時性支持，無法解除捻轉，不能單獨作為治療方法。","C":"C. 直腸內導管排氣不能解決捻轉，不是有效治療。","D":"D. 藥物（新斯的明等）促進腸蠕動在捻轉情況下無效且可能有害。"},"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_001","year":2022,"roc_year":111,"session":"","examNo":1,"q":"一匹馬於進食精料不久後出現甩頭、鼻腔可見食物及泡沫樣物質、流涎、頭頸向前伸長及咳嗽等症狀，最有可\r  能是下列那一個疾病？","opts":["A. 破傷風（tetanus）","B. 食道阻塞 （esophageal obstruction）","C. 胃十二指腸潰瘍（gastroduodenal ulceration）","D. 軟顎背側異位（dorsal displacement of the soft palate）"],"ans":1,"exp":"馬食道阻塞（esophageal choke）表現為進食精料後突然出現甩頭、鼻腔可見食物及泡沫、流涎、頸部僵直前伸及咳嗽，乃食物嵌頓食道所致。破傷風為強直痙攣、牙關緊閉；胃潰瘍為腹痛、磨牙；軟顎背側異位發生於劇烈運動後，以喘鳴音為主。","we":["破傷風（tetanus）表現為全身肌肉強直、牙關緊閉和光聲刺激過敏，不出現鼻腔食物回流。","食道阻塞正確：精料堵塞頸段食道，造成吞嚥困難、食物/泡沫從鼻腔返流。","胃十二指腸潰瘍主要表現為間歇性腹痛、磨牙、食慾下降，不會出現鼻腔食物。","軟顎背側異位（DDSP）多在劇烈運動時出現，以喘鳴音和運動耐受下降為主，不會出現鼻腔食物回流。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_002","year":2022,"roc_year":111,"session":"","examNo":2,"q":"馬匹使用 regional limb perfusion 方法治療四肢的遠端感染時，下列敘述何者最不適當？","opts":["A. 可於馬匹站立鎮定（standing sedation）狀況下執行","B. 快速給予以達局部最大濃度","C. 抗生素需以 balanced polyionic solution 稀釋","D. 可用於治療敗血性關節炎（septic arthritis）"],"ans":1,"exp":"馬匹肢端局部灌注（regional limb perfusion）應「緩慢」注射抗生素以維持局部高濃度並避免血管刺激，「快速」給藥會造成血管損傷並使藥物迅速擴散至全身，降低局部組織濃度，是最不適當的操作方式。","we":["站立鎮定下執行區域灌注是標準做法，可免去全身麻醉的風險。","快速給予不適當：應緩慢推注以維持局部最高濃度，快速推注會損傷血管並降低療效。","以平衡多電解質溶液（balanced polyionic solution）稀釋抗生素是標準稀釋介質，正確。","區域灌注廣泛用於治療敗血性關節炎，局部高濃度抗生素可穿透關節腔，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_003","year":2022,"roc_year":111,"session":"","examNo":3,"q":"馬廄失火，馬匹吸入大量濃煙，呈現呼吸困難及背部嚴重燒燙傷，應該最優先採取下列何種處置？","opts":["A. 大量沖水","B. 做氣管切開術","C. 注射高劑量抗生素","D. 大量輸液並給予止痛藥"],"ans":1,"exp":"馬吸入大量濃煙後出現呼吸困難，吸入性損傷是立即危及生命的緊急狀況，首要處置是建立通暢氣道（氣管切開術），以保障氧氣供應；燒燙傷的沖水處理為次要考量。","we":["大量沖水適用於外部燒燙傷的初期降溫，但無法解決吸入性損傷造成的氣道阻塞問題，不是首要處置。","氣管切開術可立即建立氣道，解除吸入性損傷造成的氣道水腫阻塞，是最優先的緊急處置。","抗生素用於預防感染，非急性呼吸窘迫的首要處置。","大量輸液和止痛藥為支持性治療，在確保氣道通暢之後才進行。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_004","year":2022,"roc_year":111,"session":"","examNo":4,"q":"馬消化道疾病時，最常伴隨發生下列何種疾病？","opts":["A. 內毒素血症","B. 胃潰瘍","C. 吸入性肺炎","D. 心肌炎"],"ans":0,"exp":"馬消化道疾病（如結腸炎、腸扭轉）時，腸道屏障受損，革蘭氏陰性菌的脂多醣（LPS）大量進入血液，最常引起內毒素血症（endotoxemia），這是馬消化道疾病的嚴重併發症，可導致休克及蹄葉炎。","we":["內毒素血症是馬消化道疾病最常見的嚴重併發症，因腸道屏障受損使LPS進入血液所致。","胃潰瘍是馬的常見疾病，但不是消化道疾病最常伴隨的直接併發症。","吸入性肺炎與食道阻塞有關，不是一般消化道疾病的常見併發症。","心肌炎與消化道疾病關聯性低，不是其常見伴隨疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_005","year":2022,"roc_year":111,"session":"","examNo":5,"q":"關於馬淺趾屈肌肌腱炎（superficial digital flexor tendenitis）之處置，下列方式何者最不適當？","opts":["A. 冰敷","B. 掌神經切除術（palmar neurectomy）","C. 患部局部給與自體富血小板血漿（platelet-rich plasma）","D. 給與非類固醇抗發炎藥物"],"ans":1,"exp":"掌神經切除術（palmar neurectomy）用於蹄舟骨病的疼痛管理，對肌腱炎本身無治療效果，且會遮蔽疼痛感覺，使患馬無法感知組織損傷而繼續使用肢體，反而加重肌腱損傷，因此最不適當。","we":["冰敷可減輕急性炎症和疼痛，是肌腱炎初期的標準處置，適當。","掌神經切除術遮蔽疼痛但不治療肌腱炎本身，會使患馬繼續使用受損肢體加重病情，最不適當。","自體富血小板血漿（PRP）含有多種生長因子，可促進肌腱組織修復，適當。","NSAIDs可減輕炎症和疼痛，是肌腱炎的標準藥物治療，適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_006","year":2022,"roc_year":111,"session":"","examNo":6,"q":"下列何者不是牛隻急性瘤胃乳酸中毒的致病因子？","opts":["A. 牛隻空胎期延長造成泌乳時間過長","B. 給予牛隻含大量穀物之日糧","C. 泌乳初期牛隻在乾乳期至分娩前未給予轉換期日糧","D. 給予牛隻大量含水果之日糧"],"ans":0,"exp":"急性瘤胃乳酸中毒的主要致病因子是突然大量攝入可發酵碳水化合物（穀物、水果），導致乳酸桿菌過度增殖、瘤胃pH急速下降。「空胎期延長造成泌乳時間過長」與日糧組成無直接關係，不是急性瘤胃乳酸中毒的致病因子。","we":["空胎期延長和泌乳時間過長，主要影響乳房健康和繁殖效率，不是急性瘤胃乳酸中毒的直接致病因子。","給予大量穀物（含大量可發酵碳水化合物）是瘤胃乳酸中毒最主要的致病因子。","乾乳期未給轉換期日糧使瘤胃細菌群落未能適應泌乳期高能量日糧，增加乳酸中毒風險。","大量含水果的日糧含有高量可發酵醣類（果糖），可造成瘤胃乳酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_007","year":2022,"roc_year":111,"session":"","examNo":7,"q":"關於牛隻創傷性蜂巢胃炎的治療，下列敘述何者錯誤？","opts":["A. 投與的磁鐵有一定比例無法到達蜂巢胃","B. 使用全身性抗生素治療效果大多良好","C. NSAIDs 類藥物可用來作為疼痛控制","D. 當發生瀰漫性腹膜炎須配合輸液治療"],"ans":1,"exp":"創傷性蜂巢胃炎（traumatic reticuloperitonitis）的預後取決於腹膜炎的嚴重程度，若已發生瀰漫性腹膜炎，單靠全身性抗生素的效果通常不佳，並非「大多良好」；局限性病例預後相對較好，但仍難以一概而論。","we":["磁鐵投予後，部分磁鐵確實無法進入蜂巢胃（可能留在瘤胃），這是正確的敘述。","全身性抗生素治療創傷性蜂巢胃炎的效果因腹膜炎程度而異，瀰漫性腹膜炎時效果差，「大多良好」的說法過於樂觀。","NSAIDs可用於疼痛控制及抗炎，是治療創傷性蜂巢胃炎的輔助藥物，正確。","發生瀰漫性腹膜炎時確實需配合輸液治療以支持循環，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_008","year":2022,"roc_year":111,"session":"","examNo":8,"q":"擠乳後的乳頭藥浴對預防以下那一種牛細菌性乳房炎最有效果？","opts":["A. Staphylococcus aureus","B. Corynebacterium bovis","C. E.coli","D. Mycoplasma bovis"],"ans":[0,2,3],"exp":"擠乳後乳頭藥浴（post-milking teat dipping）主要預防傳染性乳房炎病原（如 S. aureus）的傳播，同時對環境性病原（如 E. coli）和 Mycoplasma bovis 的預防也有一定效果。Corynebacterium bovis（B）對乳頭藥浴的反應較為特殊，其感染通常由乳頭管定植引起，一般藥浴效果較其他三者差。","we":["A. S. aureus：傳染性乳房炎最重要病原，乳頭藥浴可顯著降低牛隻間傳播，是答案之一。","B. C. bovis：雖為傳染性病原，但乳頭藥浴對其預防效果在選項中相對較弱，非本題答案。","C. E. coli：環境性病原，乳頭藥浴雖主要針對傳染性病原，但對環境性病原的新感染也有預防效果，是答案之一。","D. Mycoplasma bovis：乳頭藥浴對其有一定預防效果（減少接觸傳播），是答案之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_009","year":2022,"roc_year":111,"session":"","examNo":9,"q":"某牧場牛隻平日餵飼青刈牧草，牧場的牧草地使用大量氮肥促進牧草生長，場內牛隻近期有低體溫、食慾下\r  降、呼吸困難、運動不耐以及流產現象，流產胎兒沒有檢出傳染性病原，牛隻沒有脫水、血尿或黑糞之發生。 依上述背景該場最可能發生的問題為下列何種疾病？","opts":["A. 亞硝酸鹽中毒","B. 砷中毒","C. 青草痙攣","D. 銅中毒"],"ans":0,"exp":"亞硝酸鹽中毒：牧草施用大量氮肥→草中硝酸鹽過高→瘤胃細菌將硝酸鹽還原為亞硝酸鹽→亞硝酸鹽進入血液→氧化血紅素Fe²⁺為Fe³⁺形成變性血紅素→組織缺氧→低體溫、呼吸困難、運動不耐、流產。無血尿或黑糞（與銅中毒/砷中毒不同）。","we":["亞硝酸鹽中毒符合所有描述：氮肥牧草→高硝酸鹽→變性血紅素→缺氧症狀，且無出血性表現，正確。","砷中毒通常造成胃腸炎、出血性腹瀉、神經症狀，與本題描述不符。","青草痙攣（低鎂血症）主要表現為肌肉震顫、共濟失調、痙攣，不會有低體溫和流產組合。","銅中毒急性期表現為溶血性貧血、黃疸、黑褐色尿液，與本題無血尿/黑糞的敘述不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_010","year":2022,"roc_year":111,"session":"","examNo":10,"q":"牛隻進行體態評估時，最常從下列何部位開始評估？","opts":["A. 頸部背側","B. 胸部背側","C. 腰部背側","D. 尾部背側"],"ans":2,"exp":"牛的體態評分（BCS）評估通常從腰部（lumbar region）的背側開始，特別是腰椎橫突（transverse processes）和髖骨（tuber coxae）附近的脂肪覆蓋量，是評分最敏感的區域。","we":["頸部背側的脂肪沉積不是BCS評估的主要起始部位，頸部脂肪墊（crest）通常用於馬的BCS。","胸部背側不是牛BCS評估的主要起始部位。","腰部背側（腰椎橫突）是牛BCS評估的標準起始部位，脂肪覆蓋量反映能量儲備狀況。","尾部背側（尾根周圍）也是BCS評估的參考部位之一，但通常不是最先評估的位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_011","year":2022,"roc_year":111,"session":"","examNo":11,"q":"有關牛隻瘤胃的聽扣診之敘述，下列何者最不適當？","opts":["A. 瘤胃可以在第 13 肋後緣近脊突下方進行聽扣診，若有異常響音，應鑑別是否為第 4 胃異位所造成，但仍需   協同其他檢查進行確診","B. 瘤胃聽扣診時，通常由腹脅部以水平方向向頭側方進行，並於每一肋間進行聽扣診，以確定瘤胃是否正常","C. 於牛隻進食前後，其瘤胃聽扣診音可能不同，故需多次檢查以確保資訊之正確性","D. 為確認瘤胃是否受迷走神經異常所影響，可直腸檢查瘤胃做輔助診斷"],"ans":0,"exp":"（需人工確認）一般認為A最不適當：第13肋後緣近脊突下方的聽扣診異常音，應優先鑑別第四胃異位（LDA），而非直接歸因於瘤胃異常。由腹脅部向頭側方向進行聽扣診是診斷第四胃異位的標準技術，敘述B較為正確。","we":["（需人工確認）此區域的ping音主要用於診斷第四胃左方異位，不應直接標記為瘤胃異常。","由左腹脅部以水平方向向頭側方進行聽扣診是診斷LDA的標準技術，正確。","進食前後瘤胃內容物狀態不同，需多次確認，正確。","直腸檢查可評估瘤胃大小及迷走神經性消化不良，是輔助診斷方法，正確。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_012","year":2022,"roc_year":111,"session":"","examNo":12,"q":"有關牛隻頭頸部檢查及其可能之相關疾病敘述，下列何者最不適當？","opts":["A. 若在角膜中央發現潰瘍灶，則有可能是傳染性牛角膜結膜炎（infectious bovine keratoconjunctivitis）","B. 若進行牛隻口部檢查，發現拉出舌頭，於放開後不能快速縮回，則應懷疑牛瘟","C. 若扣診鼻竇呈現濁音（dull），則可懷疑是否有鼻竇炎","D. 若有耳道分泌物時，可懷疑耳道是否有異物或寄生蟲感染"],"ans":1,"exp":"舌頭拉出後無法快速縮回應懷疑的是「李斯特菌感染症」（listeriosis）引起的腦神經（特別是第12對舌下神經）損傷，而非牛瘟（rinderpest）。牛瘟的特徵是高熱、口腔黏膜糜爛和腸炎，台灣已根除。","we":["角膜中央潰瘍是傳染性牛角膜結膜炎（IBK，Moraxella bovis）的典型表現，敘述正確。","舌頭拉出後無法縮回是李斯特菌感染症（listeriosis）的神經症狀，與牛瘟無關，此敘述錯誤。","鼻竇扣診濁音（dull）提示鼻竇炎（sinusitis），敘述正確。","耳道分泌物可能是異物或耳疥（Psoroptes cuniculi）等寄生蟲感染，敘述合理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_013","year":2022,"roc_year":111,"session":"","examNo":13,"q":"一群 3～8 月齡圈養餵予富含碳水化合物日糧的肥育小牛突然出現食慾降低、耳朵下垂，共濟失調，有的甚至\r  有失明、磨牙、後弓反張等症狀，原因最可能為何？","opts":["A. 肉毒桿菌中毒","B. 大腦灰質軟化症","C. 維生素 E 缺乏","D. 李斯特菌感染症"],"ans":1,"exp":"大腦灰質軟化症（polioencephalomalacia，PEM）由硫胺素（維生素B1）缺乏引起，高碳水化合物日糧促進瘤胃中硫胺素酶產生菌大量繁殖，消耗硫胺素→大腦皮質壞死→失明、共濟失調、磨牙、後弓反張。","we":["肉毒桿菌中毒表現為弛緩性麻痺、吞嚥困難，不是本題所描述的神經亢奮症狀。","大腦灰質軟化症（PEM/硫胺素缺乏）正確：高碳水化合物日糧→硫胺素酶↑→硫胺素缺乏→大腦皮質壞死。","維生素E缺乏造成白肌病（心肌和骨骼肌壞死），不會出現失明和後弓反張。","李斯特菌感染（listeriosis）主要表現為顱神經症狀和腦幹炎，而非皮質型失明。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_014","year":2022,"roc_year":111,"session":"","examNo":14,"q":"在小牛常見的疾病中，下列敘述何者最不適當？","opts":["A. 出生幼畜先天性前肢彎曲畸形（flexural deformities），輕度時以 44 mg/kg 葡萄糖鈣靜脈注射治療效果佳","B. 小牛多發性關節炎後的治療預後通常不佳","C. 嚴重的臍帶炎可能併發肝臟的感染","D. 甚急性型白肌病的小牛可在短時間內死於心臟衰弱"],"ans":0,"exp":"先天性前肢彎曲畸形（flexural deformities）的治療為夾板固定、物理治療，或低劑量土黴素（oxytetracycline）靜脈注射（可放鬆結締組織）。以44 mg/kg葡萄糖鈣靜脈注射治療屈曲畸形無生理依據（鈣注射用於低鈣血症/分娩麻痺），此敘述錯誤。","we":["44 mg/kg葡萄糖鈣IV是治療低鈣血症（分娩麻痺）的劑量，不適用於前肢彎曲畸形，此敘述錯誤。","小牛多發性關節炎（敗血性）預後通常不佳，因關節軟骨一旦破壞難以修復，正確。","嚴重臍帶炎（omphalitis）可沿靜脈蔓延至肝臟造成肝膿瘍，正確。","甚急性型白肌病（白肌病心型）可在數小時內因心肌壞死導致急性死亡，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_015","year":2022,"roc_year":111,"session":"","examNo":15,"q":"治療小牛因細菌性肺炎造成之纖維素性胸膜炎，最常因下列何種原因使其治療無法完全成功？","opts":["A. 腦膜炎","B. 慢性阻塞性肺病","C. 肺膿瘍","D. 慢性肺氣腫"],"ans":2,"exp":"小牛細菌性肺炎引發纖維素性胸膜炎時，胸膜腔內的纖維素和膿液可組織化形成「肺膿瘍」（pulmonary abscess），這是治療無法完全成功的最常見原因，因為包膜內的膿腫難以靠抗生素滲透清除。","we":["腦膜炎雖可是牛隻呼吸道感染的遠端並發症，但不是治療纖維素性胸膜炎失敗的主要原因。","慢性阻塞性肺病（COPD）與纖維素性胸膜炎的直接病理關聯性低。","肺膿瘍（lung abscess）是纖維素性胸膜炎最常見的治療失敗原因，包膜隔絕藥物，正確。","慢性肺氣腫不是纖維素性胸膜炎直接造成的治療失敗原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_016","year":2022,"roc_year":111,"session":"","examNo":16,"q":"新生小牛下痢所流失的電解質中，下列何者通常可忽略？","opts":["A. K +","B. ","C. ","D. Cl -"],"ans":3,"exp":"（需人工確認，選項B和C解析失敗）新生小牛腹瀉的主要電解質損失為Na⁺、K⁺、HCO₃⁻（代謝性酸中毒）。Cl⁻在臨床電解質補充方案中相對較不受重視，可能為本題答案。","we":["K⁺是新生小牛腹瀉時重要的損失電解質，低鉀血症可導致肌肉無力，不可忽略。","（選項B解析失敗，可能為Na⁺）Na⁺是腹瀉中大量流失的主要電解質，不可忽略。","（選項C解析失敗，可能為HCO₃⁻）HCO₃⁻大量流失造成代謝性酸中毒，是腹瀉的致死原因之一。","Cl⁻在腹瀉電解質補充中相對次要，但仍有一定程度的流失。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_017","year":2022,"roc_year":111,"session":"","examNo":17,"q":"下列何種疾病與牛隻過食富含碳水化合物之精料最沒有關聯？","opts":["A. 多發性關節炎","B. 蹄葉炎","C. 大腦皮質壞死症","D. 腸毒血症"],"ans":0,"exp":"多發性關節炎（polyarthritis）與過食精料的直接關聯最少。過食精料→瘤胃乳酸中毒→蹄葉炎、大腦皮質壞死症（PEM）、腸毒血症均有明確病理機制連結；多發性關節炎主要與感染性病原有關。","we":["多發性關節炎通常由感染性原因（敗血性）引起，與過食精料的關聯最低，是本題答案。","蹄葉炎（laminitis）是瘤胃乳酸中毒最典型的繼發症，過食精料→瘤胃酸→組胺等物質→蹄部血管炎。","大腦皮質壞死症（PEM）因高碳水化合物日糧使硫胺素缺乏而引發，關聯明確。","腸毒血症由Clostridium perfringens在高碳水化合物環境下過度增殖所致，關聯明確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_018","year":2022,"roc_year":111,"session":"","examNo":18,"q":"牛隻急性心衰竭容易引起下列何者？","opts":["A. 肺因性暈厥","B. 肝因性昏迷","C. 心因性暈厥","D. 腎因性昏迷"],"ans":2,"exp":"牛急性心衰竭（如心包炎、心肌炎）時心臟無法維持足夠腦血流灌注，可引發「心因性暈厥」（cardiac syncope）；這是急性心臟輸出量驟降的特徵性表現。","we":["肺因性暈厥通常由嚴重低氧血症引起，不是心衰竭的直接後果。","肝因性昏迷（hepatic encephalopathy）由肝功能衰竭和氨中毒引起，與心衰竭無直接關聯。","心因性暈厥正確：急性心衰竭→心輸出量驟降→腦灌流不足→暈厥。","腎因性昏迷（尿毒症腦病）由慢性腎衰竭引起，不是急性心衰竭的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_019","year":2022,"roc_year":111,"session":"","examNo":19,"q":"下列何者為造成牛血液性心臟衰竭（haematogenicheartfailure）之病因？","opts":["A. 分娩麻痺","B. 敗血性休克","C. 大出血","D. 急性毒血症"],"ans":2,"exp":"血液性心臟衰竭（haematogenic heart failure）指由血液因素引起的心衰竭，「大出血」造成血液量急劇下降，心臟代償性增加心搏出量，長期過度做功導致心臟衰竭。","we":["分娩麻痺（低鈣血症）造成心肌收縮力下降，屬於代謝性心衰竭，非血液性。","敗血性休克造成血管擴張和組織灌流不足，屬於分配性休克，非典型血液性心衰竭。","大出血造成血容量急減→心臟代償性增加工作量→血液性心衰竭，正確。","急性毒血症（toxemia）造成心肌毒性，屬於毒性心衰竭，非血液性。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_020","year":2022,"roc_year":111,"session":"","examNo":20,"q":"下列何項牛羊疾病不建議使用 BAL（Dimercaprol）治療？","opts":["A. 汞中毒","B. 銅中毒","C. 硒中毒","D. 砷中毒"],"ans":2,"exp":"BAL（Dimercaprol）與硒（selenium）結合形成具有高毒性的複合物，使硒毒性增加，因此硒中毒是BAL的絕對禁忌症。BAL適用於汞、砷、金、銻中毒；銅中毒使用D-青黴胺或四硫鉬酸銨。","we":["汞中毒（mercury poisoning）是BAL的適應症，BAL與汞形成穩定的螯合物從尿液排出，正確使用。","銅中毒（copper poisoning）不使用BAL，應用D-青黴胺（D-penicillamine）或四硫鉬酸銨（tetrathiomolybdate）治療。","硒中毒（selenium poisoning）是BAL的禁忌症：BAL與Se結合形成毒性二甲基硒化物，使中毒加重。","砷中毒（arsenic poisoning）是BAL的適應症，BAL有效螯合砷，是標準解毒劑。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_021","year":2022,"roc_year":111,"session":"","examNo":21,"q":"操作牛隻經口瘤胃管（Kingman tube）取出瘤胃液時，下列那一個操作步驟最不適當？","opts":["A. 以頭繩將頭部向左或向右固定於頸夾，避免牛隻移動","B. 瘤胃管置入之前先使用硬導管（厚 PVC 管或 Frick speculum）進入口部並固定","C. 可以吹氣進入瘤胃，並以聽診器於左腹脅部聽見水泡音來確認導管有進入瘤胃","D. 抽出瘤胃管時應折彎末端並快速抽出，避免管內內容物回流"],"ans":3,"exp":"抽出牛隻瘤胃管時，應折彎（kink）管末端後「緩慢」抽出，避免殘留瘤胃內容物流入咽部造成誤嚥。「快速」抽出反而可能使管內容物噴出，增加吸入性肺炎的風險。","we":["以頭繩將頭部固定是合理的保定方式，可防止牛隻移動造成導管傷害，適當。","使用硬導管（Frick speculum）作為口部支架是標準技術，可保護管子並防止牛咬斷，適當。","吹氣後以聽診器聽診確認瘤胃位置是正確的確認方法，適當。","抽出時應折彎末端後「緩慢」抽出，不是快速，快速抽出可能使殘留物噴出造成誤嚥，最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_022","year":2022,"roc_year":111,"session":"","examNo":22,"q":"黃牛分娩後 6 個月，於站立及躺臥時可見會陰部有紅色團塊突出物如下圖，最可能的診斷為下列何者？","opts":["A. 第二級陰道脫垂","B. 第三級陰道脫垂","C. 第四級陰道脫垂","D. 直腸脫垂"],"ans":1,"exp":"（需確認圖片）陰道脫垂分級：第1級=臥地時脫出、站立時縮回；第2級=臥地脫出、站立部分縮回；第3級=站立和臥地時均脫出且不自行縮回；第4級=慢性不可回復性脫垂。題目描述站立及臥地時均有紅色團塊突出，符合第3級（Grade 3）。","we":["第二級陰道脫垂在站立時可部分自然縮回，與題目描述站立時仍可見突出物不符。","第三級陰道脫垂正確：站立和臥地均有脫垂且不自行縮回，符合題目描述。","第四級為慢性嚴重脫垂，通常有組織壞死和水腫，急性病例不適用。","直腸脫垂脫出組織為直腸黏膜，通常為深紅色管狀結構，與陰道脫垂的外觀不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_023","year":2022,"roc_year":111,"session":"","examNo":23,"q":"牛隻眼球摘除時含鞏膜一起摘除，但留下肌肉與脂肪組織的手術方法是下列那一個術式？","opts":["A. exenteration","B. enucleation","C. evisceration","D. extirpation"],"ans":1,"exp":"Enucleation（眼球摘除術）：摘除整個眼球包含鞏膜，但保留眼外肌和眶內脂肪，適用於無法治療的眼球疾病。Evisceration：移除眼內容物但保留鞏膜；Exenteration：摘除所有眶內容物包括肌肉脂肪。","we":["Exenteration（眼窩內容物完全摘除）包含眼球、眼外肌和脂肪全部切除，與題目「留下肌肉與脂肪」不符。","Enucleation正確：移除眼球（含鞏膜），保留眼外肌和眶內脂肪，符合題目描述。","Evisceration：移除眼球內容物（晶體、玻璃體、葡萄膜）但保留鞏膜，與題目不符。","Extirpation不是眼科手術的標準術語，不適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_024","year":2022,"roc_year":111,"session":"","examNo":24,"q":"關於牛隻乳頭撕裂修復術，下列敘述何者最適當？","opts":["A. 水平撕裂傷相較於垂直撕裂傷有較好的預後","B. 受傷後應等待數日再進行手術，過早縫合會造成乳管的狹窄","C. 縫合後應使用手擠奶避免乳頭內壓力過高","D. 縫合三層（mucosa, muscular-submucosa, skin）會有最好的癒合"],"ans":3,"exp":"乳頭撕裂修復術三層縫合（黏膜層、肌肉-黏膜下層、皮膚層）提供最佳的組織對位和癒合效果，是目前推薦的標準術式。垂直撕裂的預後優於水平撕裂（橫向切斷乳管導管），應立即修復不應延遲。","we":["水平撕裂傷（橫向）比垂直撕裂預後更差（橫向切斷乳管導致狹窄風險更高），此敘述錯誤。","應盡快（傷後數小時內）進行手術修復，延遲數日會增加感染和組織壞死風險，此敘述錯誤。","縫合後應使用留置乳頭插管（indwelling teat tube）避免乳管閉合，不應用手擠奶（增加張力），此敘述錯誤。","三層縫合（黏膜、肌肉-黏膜下、皮膚）提供最佳癒合，是乳頭撕裂修復的標準術式，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_025","year":2022,"roc_year":111,"session":"","examNo":25,"q":"蹄底潰瘍指的是蹄底部角質缺損露出真皮層，接著可能會有細菌二次感染而引起化膿性蹄葉炎，母牛最好發\r  於那個部位？","opts":["A. 前肢內側蹄","B. 前肢外側蹄","C. 後肢內側蹄","D. 後肢外側蹄"],"ans":3,"exp":"母牛蹄底潰瘍（sole ulcer/Rusterholz ulcer）好發於後肢外側蹄（lateral claw），因後肢外側蹄承重更大（體重偏向外側）、蹄底薄弱區域集中於外側蹄。","we":["前肢內側蹄較少發生蹄底潰瘍，母牛前肢外側承重不特別突出。","前肢外側蹄偶有蹄底潰瘍，但遠不及後肢外側多見。","後肢內側蹄較不易發生蹄底潰瘍，承重較少。","後肢外側蹄是母牛蹄底潰瘍的最好發部位：後肢外側蹄承重大、體重傾向外側，蹄底薄弱點集中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_026","year":2022,"roc_year":111,"session":"","examNo":26,"q":"有關乳牛在站姿下進行第四胃異位手術的治療方法中，下列何者最常被應用？","opts":["A. right-paralumbar fossa omentopexy","B. right-paralumbar fossa pyloropexy","C. left-paralumbar fossa abomasopexy","D. right-paralumbar fossa abomasopexy"],"ans":0,"exp":"站立狀態下第四胃左方異位（LDA）最常用的手術是「右側腹脅部網膜固定術（right-paralumbar fossa omentopexy）」：從右側平行腰窩切入，手伸至左側將異位的網膜拉至右側體壁固定，使皺胃回位並防止再次異位。","we":["右側腹脅部網膜固定術（right-paralumbar fossa omentopexy）是LDA最常用的站立手術，正確。","幽門固定術（pyloropexy）通常用於第四胃右方異位（RDA）的固定，不是LDA首選。","左側腹脅部皺胃固定術（left-paralumbar fossa abomasopexy）亦可用，但右側固定更常見。","右側腹脅部皺胃固定術不是LDA的標準術式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_027","year":2022,"roc_year":111,"session":"","examNo":27,"q":"關於豬隻直腸脫垂，下列敘述何者錯誤？","opts":["A. 在直腸表面使用高張糖水溶液，可促進脫出之直腸縮小復位","B. 於成年豬隻肛門的荷包縫合，應僅留下一指寬的排泄空間","C. 荷包縫合之縫線應留置 5～10 天","D. 脫垂復位後可使用臍帶縫合帶（umbilical tape）於肛門周邊縫合"],"ans":1,"exp":"豬直腸脫垂的荷包縫合（purse-string suture）：成年豬應留兩指寬（約2 fingers）的排泄空間，只留一指寬會造成排泄困難和直腸壓力增加，導致治療失敗。幼豬或仔豬可留一指寬。","we":["高張糖水（如50%葡萄糖）可通過滲透壓作用使脫出組織脫水縮小，有助於復位，正確。","成年豬應留兩指寬排泄空間，一指寬會造成嚴重排便困難，此敘述對於成年豬不適當。","荷包縫合通常留置5-7天，讓肛門括約肌力量恢復，5-10天的範圍合理。","用臍帶縫合帶（umbilical tape）作為荷包縫合材料是豬直腸脫垂的標準技術，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_028","year":2022,"roc_year":111,"session":"","examNo":28,"q":"羊的手術時間若僅需 15～20 分鐘，採用下列那一組的藥物及劑量較佳？","opts":["A. 0.6 mg/kg xylazine 及 11 mg/kg ketamine，IM","B. 0.5 mg/kg xylazine 及 22 mg/kg ketamine，IM","C. 0.1 mg/kg xylazine 然後給予 5 mg/kg ketamine，IM","D. 0.4 mg/kg xylazine 然後給予 22 mg/kg ketamine，IM"],"ans":2,"exp":"羊短時間手術（15-20分鐘）IM麻醉標準組合：Xylazine 0.1 mg/kg + Ketamine 4-6 mg/kg IM，選項C的劑量（0.1+5）符合短時間麻醉需求。較高劑量（A、B、D選項）會延長麻醉時間超過需要。","we":["0.6 mg/kg xylazine劑量過高，會造成過度鎮靜和延長麻醉恢復時間，不適合15-20分鐘的手術。","0.5 mg/kg xylazine + 22 mg/kg ketamine劑量過高，麻醉時間會超過20分鐘。","0.1 mg/kg xylazine + 5 mg/kg ketamine IM是羊短時間手術的標準劑量，提供約15-20分鐘麻醉，適合。","22 mg/kg ketamine劑量偏高，即使xylazine調整，麻醉時間仍可能過長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_029","year":2022,"roc_year":111,"session":"","examNo":29,"q":"正常角膜（cornea）細胞的營養供應來源為何？","opts":["A. 血管與淚膜","B. 眼前房液與淚膜","C. 血管與眼前房液","D. 血管與神經束"],"ans":1,"exp":"正常角膜（avascular）的營養供應主要來自兩個無血管來源：(1)眼前房液（aqueous humor）提供葡萄糖和氨基酸；(2)淚膜（tear film）提供氧氣和部分營養。角膜緣血管僅供應角膜邊緣。","we":["正常角膜無血管（avascular），血管不是中央角膜的直接營養來源，與淚膜的組合不正確。","眼前房液（aqueous humor）和淚膜（tear film）是無血管角膜的兩大主要營養來源，正確。","血管與眼前房液的組合不正確，因為正常角膜中央不含血管。","血管與神經束不是角膜的營養來源（神經提供感覺，不直接供應營養）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_030","year":2022,"roc_year":111,"session":"","examNo":30,"q":"臨床上犬貓義眼植入（intraocular prosthesis）最適用於下列何種狀況？","opts":["A. 無視力之慢性青光眼","B. 無視力之眼內腫瘤","C. 無視力之感染性全眼炎（infectious panophthalmitis）","D. 深層角膜潰瘍"],"ans":0,"exp":"義眼植入（intraocular prosthesis）適用於：喪失視力但眼球結構完整的慢性青光眼。眼內腫瘤和感染性全眼炎是禁忌症（腫瘤→擴散風險；感染→植入物感染風險）。深層角膜潰瘍有視力恢復可能。","we":["無視力慢性青光眼是義眼植入的最佳適應症：眼球大小穩定、無感染/腫瘤，保留美觀眼球外觀，正確。","眼內腫瘤是義眼植入的禁忌症，有腫瘤擴散風險，應行眼球摘除（enucleation）。","感染性全眼炎（panophthalmitis）是義眼植入的絕對禁忌，植入物會成為感染的溫床。","深層角膜潰瘍仍有視力恢復的可能，不應立即植入義眼。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_031","year":2022,"roc_year":111,"session":"","examNo":31,"q":"心衰竭依據生理病理機制呈現後負荷（afterload）過高異常時，治療原則應優先考慮何類藥物？","opts":["A. 利尿劑","B. 擬交感神經藥物","C. 血管擴張劑","D. 強心劑"],"ans":2,"exp":"後負荷（afterload）代表心臟收縮時所面臨的阻力（主要為外周血管阻力）。後負荷過高時，使用「血管擴張劑」（vasodilators，如ACE抑制劑、硝普鈉）可降低外周阻力，減少心臟做功。","we":["利尿劑主要減少血液容積（前負荷preload），不直接降低後負荷。","擬交感神經藥物增加心肌收縮力（正性心力），不降低後負荷。","血管擴張劑（ACE inhibitors, amlodipine等）降低外周血管阻力，是治療後負荷過高的首選藥物。","強心劑增強心肌收縮力，對後負荷過高沒有直接改善效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_032","year":2022,"roc_year":111,"session":"","examNo":32,"q":"犬隻眼瞼無法閉合且耳殼下垂無法移動的情況，通常與第幾對腦神經有關？","opts":["A. 二","B. 三","C. 五","D. 七"],"ans":3,"exp":"第七對腦神經（顏面神經，facial nerve/CN VII）控制臉部肌肉，包括眼輪匝肌（orbicularis oculi，閉眼）和耳廓肌肉（ear muscles）。CN VII病變→眼瞼無法閉合（下垂非無力），耳廓下垂無法移動。","we":["第二對腦神經（視神經）控制視覺，損傷造成失明，不影響眼瞼運動或耳廓。","第三對腦神經（動眼神經）控制大多數眼外肌和瞳孔縮小，損傷造成眼球運動障礙和瞳孔散大，不影響耳廓。","第五對腦神經（三叉神經）提供顏面感覺和咀嚼肌運動，損傷不造成眼瞼閉合障礙。","第七對腦神經（顏面神經）正確：控制所有顏面表情肌、閉眼（眼輪匝肌）和耳廓運動。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_033","year":2022,"roc_year":111,"session":"","examNo":33,"q":"下列何疾病不會引起多渴多尿的症狀？","opts":["A. 甲狀腺功能低下","B. 腎上腺皮質功能亢進","C. 副甲狀腺功能亢進","D. 糖尿病"],"ans":0,"exp":"甲狀腺功能低下（hypothyroidism）的主要表現為代謝率下降：嗜睡、體重增加、耐寒力降低、皮膚問題。多渴多尿（PU/PD）不是甲狀腺功能低下的典型症狀。其他選項（腎上腺皮質亢進、副甲狀腺亢進、糖尿病）均可引起PU/PD。","we":["甲狀腺功能低下不引起PU/PD，主要症狀為嗜睡、體重增加和皮膚問題，是本題答案。","腎上腺皮質功能亢進（Cushing's disease）是犬PU/PD最常見原因，皮質醇抑制ADH作用。","副甲狀腺功能亢進→高血鈣→腎小管損傷→PU/PD，確實引起多渴多尿。","糖尿病造成高血糖→滲透性利尿→PU/PD，是常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_034","year":2022,"roc_year":111,"session":"","examNo":34,"q":"下列何種內分泌疾病最可能會造成犬隻禿毛？","opts":["A. 甲狀腺亢進（hyperthyroidism）","B. 腎上腺皮質低下（hypoadrenocorticism）","C. 高動情素分泌症（hyperestrogenism）","D. 肢端巨大症（acromegaly）"],"ans":2,"exp":"高動情素分泌症（hyperestrogenism）可由卵巢腫瘤（如顆粒細胞瘤）、塞托利氏細胞瘤（公犬）等引起，過量動情素→毛囊萎縮→雙側對稱性禿毛（alopecia），同時可見女性化特徵（雄性）。","we":["犬甲狀腺亢進（hyperthyroidism）極為罕見，且在犬不是禿毛的典型原因。","腎上腺皮質低下（Addison's disease）主要引起電解質異常（低鈉高鉀）和虛弱，不以禿毛為主要表現。","高動情素分泌症（hyperestrogenism）正確：過量雌激素造成雙側對稱性禿毛和皮膚角化。","肢端巨大症（acromegaly）由過量GH引起，表現為皮膚增厚、皮褶增加，禿毛不是主要特徵。"],"needs_review
