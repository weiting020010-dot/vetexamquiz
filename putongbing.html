":false,"imgs":[]},{"id":"AMO_2022_普通病_035","year":2022,"roc_year":111,"session":"","examNo":35,"q":"用於犬貓胰臟炎相關之嘔吐症狀，下列何種止吐劑最為適用？","opts":["A. maropitant","B. metoclopramide","C. chlorpromazine","D. ondansetron"],"ans":0,"exp":"Maropitant（Cerenia）是NK1（neurokinin-1）受體拮抗劑，除抑制嘔吐外還具有內臟鎮痛作用（visceral analgesia），對胰臟炎引起的腹痛和嘔吐雙重有效，是首選止吐劑。","we":["Maropitant（NK1拮抗劑）是胰臟炎止吐的最佳選擇：抑制嘔吐＋內臟鎮痛，解決胰臟炎的疼痛和嘔吐問題。","Metoclopramide（D2拮抗劑）是促胃腸動力劑，胰臟炎時使用可能增加胰液分泌，且止吐效果不如maropitant。","Chlorpromazine（吩噻嗪類）止吐效果較弱，副作用較多，不是胰臟炎的首選。","Ondansetron（5-HT3拮抗劑）止吐效果好但缺乏內臟鎮痛作用，次於maropitant用於胰臟炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_036","year":2022,"roc_year":111,"session":"","examNo":36,"q":"5 歲絕育公柴犬，體重約 8 公斤、BCS 為 5/9，室內生活、每日早晨餵食一餐乾料加雞胸肉，有完整免疫及外\r  寄生蟲預防，食慾及排便皆正常。過去 3 個月每天半夜、清晨或早上餵食前均會吐出約 5 至 10 毫升含有膽汁 之黏液性嘔吐物，動物精神食慾皆正常，血檢並無異常，糞便寄生蟲檢查、潛血及酵素消化試驗皆為陰性， 下列何者最符合本病例之診斷？","opts":["A. 慢性胃潰瘍","B. 胰臟外泌功能不足","C. 膽汁性嘔吐症狀","D. 慢性胰臟炎"],"ans":2,"exp":"膽汁性嘔吐症狀（bilious vomiting syndrome，BVS）：長時間空腹後膽汁反流入胃→胃黏膜刺激→清晨/空腹時嘔吐含膽汁的黃綠色黏液。臨床症狀輕微，血檢正常，晚餐額外加餐即可改善，符合本題描述。","we":["慢性胃潰瘍通常有更明顯的腹痛、黑便等症狀，且血檢可能有貧血，與本題不符。","胰臟外泌功能不足（EPI）會有體重減輕、大量惡臭軟便，與本題無此症狀不符。","膽汁性嘔吐症狀（BVS）正確：空腹相關嘔吐、含膽汁黏液、晨間發作、其他檢查正常，晚間加餐可改善。","慢性胰臟炎通常有腹痛、脂肪瀉、體重下降等症狀，與本題精神食慾正常不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_037","year":2022,"roc_year":111,"session":"","examNo":37,"q":"在小動物最常見的維生素 K 缺乏成因為下列何項？","opts":["A. 肝臟疾病","B. 浸潤型腸病變","C. 吞食 warfarin 類殺鼠藥","D. 阻塞性膽汁淤積"],"ans":2,"exp":"小動物最常見的維生素K相關凝血障礙是「吞食warfarin類殺鼠藥（anticoagulant rodenticide）」，其競爭性抑制維生素K循環，使凝血因子II、VII、IX、X無法活化，造成嚴重出血。","we":["肝臟疾病可造成多種凝血因子合成不足，但不是維生素K缺乏的最常見直接原因。","浸潤性腸病變可造成脂溶性維生素吸收不良，但在臨床上不是最常見原因。","吞食warfarin類殺鼠藥是小動物維生素K缺乏相關凝血病的最常見臨床原因，正確。","阻塞性膽汁淤積影響膽酸分泌→脂溶性維生素（含K）吸收不良，但臨床比殺鼠藥中毒少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_038","year":2022,"roc_year":111,"session":"","examNo":38,"q":"有關瀰漫性血管內凝血（DIC），下列何種處置可以抑制凝血現象？","opts":["A. 供應氧氣維持器官氧氣灌流量","B. 積極輸液增加血液灌流","C. 給予肝素（heparin）","D. 給予抗心律不整藥物"],"ans":2,"exp":"DIC（瀰漫性血管內凝血）的高凝期，「肝素（heparin）」可抑制凝血酶和凝血因子Xa，打斷凝血連鎖反應，減少微血管血栓形成，是DIC早期抗凝治療的選擇。","we":["供應氧氣是支持性治療，維持器官灌流，不直接抑制凝血反應。","積極輸液改善循環灌流，為支持治療，不直接抑制凝血。","肝素（heparin）正確：抗凝血酶III介導的抗凝作用，用於DIC早期高凝期抑制異常凝血。","抗心律不整藥物治療心律失常，與DIC的凝血機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_039","year":2022,"roc_year":111,"session":"","examNo":39,"q":"犬隻之免疫性多發性關節炎、免疫性腦膜炎、紅斑性狼瘡、自體免疫性溶血性貧血有下列何項共通症狀？","opts":["A. 再生性貧血","B. 跛行及神經症狀","C. 紅斑（erythema）","D. 發熱（pyrexia）"],"ans":3,"exp":"上述所有免疫媒介性疾病（免疫性多發性關節炎、免疫性腦膜炎、紅斑性狼瘡、AIHA）的共同病理機制均包含免疫系統活化和炎症反應，因此「發熱（pyrexia）」是最一致的共同症狀。","we":["再生性貧血僅見於自體免疫性溶血性貧血（AIHA），不是所有疾病的共通症狀。","跛行見於關節炎，神經症狀見於腦膜炎，但不是所有免疫疾病的共通表現。","紅斑（erythema）主要見於SLE，不是所有免疫疾病的共通症狀。","發熱（pyrexia）正確：所有免疫媒介性疾病均有炎症反應激活，引起前列腺素E2（PGE2）介導的體溫升高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_040","year":2022,"roc_year":111,"session":"","examNo":40,"q":"下列何種化學治療藥物屬於抗腫瘤抗生素？","opts":["A. 環磷酰胺（cyclophosphamide）","B. 米托蒽醌（mitoxantrone）","C. 長春花鹼（vinblastine）","D. 胺基甲基葉酸（methotrexate）"],"ans":1,"exp":"「抗腫瘤抗生素（antitumor antibiotics）」類化療藥物包括：蒽環類（doxorubicin, mitoxantrone）、絲裂黴素、放線菌素D等。Mitoxantrone（米托蒽醌）屬於蒽烯二酮類，作用機制與蒽環類相似，屬於此類別。","we":["環磷酰胺（cyclophosphamide）是烷化劑（alkylating agent），不是抗腫瘤抗生素。","米托蒽醌（mitoxantrone）正確：屬抗腫瘤抗生素（蒽烯二酮類），嵌入DNA並抑制拓撲異構酶II。","長春花鹼（vinblastine）是長春花生物鹼（vinca alkaloid），微管抑制劑，不是抗生素類。","甲胺蝶呤（methotrexate）是葉酸類拮抗劑（antimetabolite），不是抗腫瘤抗生素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_041","year":2022,"roc_year":111,"session":"","examNo":41,"q":"別嘌呤醇（allopurinol）可以用來減少犬隻下列何項尿路結石的形成及復發？","opts":["A. 胱胺酸結石（cystine urolith）","B. 草酸鈣結石（calcium oxalate urolith）","C. 磷酸銨鎂結石（magnesium ammonium phosphate urolith）","D. 尿酸銨結石（ammonium urate urolith）"],"ans":3,"exp":"Allopurinol抑制黃嘌呤氧化酶（xanthine oxidase），減少次黃嘌呤→黃嘌呤→尿酸的代謝，降低血尿酸濃度，用於預防「尿酸銨結石（ammonium urate urolith）」，常見於Dalmatian犬和英國鬥牛犬等有尿酸代謝障礙的品種。","we":["胱胺酸結石的治療是鹼化尿液和限制甲硫胺酸，不使用allopurinol。","草酸鈣結石無法溶解，需外科或碎石術取出，不使用allopurinol。","磷酸銨鎂（struvite）結石可用溶石飼料或尿液酸化溶解，不使用allopurinol。","尿酸銨結石正確：allopurinol抑制尿酸合成，減少尿酸鹽的析出形成，是標準治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_042","year":2022,"roc_year":111,"session":"","examNo":42,"q":"小動物惡性腫瘤性高血鈣症（hypercalcemia of malignancy）的成因，一般被認為是下列何項因素造成？","opts":["A. 維生素 D 缺乏","B. 副甲狀腺荷爾蒙相關胜肽（PTHrP）釋放","C. 繼發於腎臟功能衰竭","D. 甲狀腺 C 細胞分泌不足"],"ans":1,"exp":"惡性腫瘤性高血鈣症（hypercalcemia of malignancy）最常見機制為腫瘤分泌「PTHrP（副甲狀腺荷爾蒙相關胜肽）」，其作用類似PTH但不受正常反饋調控，造成骨吸收增加和腎小管鈣再吸收增加。","we":["維生素D缺乏造成低血鈣（非高血鈣），與惡性腫瘤性高血鈣機制相反。","PTHrP釋放正確：腫瘤（如肛門囊腺癌、淋巴瘤）分泌PTHrP模擬PTH作用→高血鈣，是最常見機制。","腎臟功能衰竭通常造成高磷低鈣（而非高血鈣），繼發性副甲狀腺亢進則表現為骨骼問題。","甲狀腺C細胞分泌降鈣素（calcitonin），不足理論上會提高血鈣，但這不是惡性腫瘤高血鈣的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_043","year":2022,"roc_year":111,"session":"","examNo":43,"q":"下列有關犬隻心包囊穿刺的方法，何者正確？","opts":["A. 通常採取右側躺左側入針","B. 通常採取左側躺右側入針","C. 穿刺時因通常情況緊急故不需剃毛和無菌操作","D. 非必要時不需接心電圖"],"ans":1,"exp":"犬心包囊穿刺標準做法：患犬採左側橫臥（left lateral recumbency），右側朝上，從右側第4-6肋間隙（cardiac notch區域，肺覆蓋少）進針，可避免刺傷肺組織，同時接心電圖監測。","we":["右側躺（右側在下）再從左側入針會穿過較多肺組織，增加氣胸風險，不建議。","左側躺（左側在下）使右側朝上，從右側第5肋間插針正確：心臟切跡減少肺部遮擋，安全有效。","心包穿刺雖緊急，但仍需剃毛和無菌操作，以防醫源性感染性心包炎。","接心電圖監測心律是必要的，可早期偵測針頭觸碰心肌（出現室性早搏）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_044","year":2022,"roc_year":111,"session":"","examNo":44,"q":"最具有診斷意義的症狀為下\r   列何項？","opts":["A. 發紺（cyanosis）","B. 呼吸音變大","C. 反常呼吸（paradoxical breathing）","D. 張口呼吸"],"ans":2,"exp":"（需確認前文語境）反常呼吸（paradoxical breathing）是連枷胸（flail chest，多根肋骨骨折）的病理特徵性體徵：吸氣時胸壁塌陷、呼氣時膨出，與正常呼吸運動相反，診斷意義最高。","we":["發紺（cyanosis）代表組織缺氧，可見於多種呼吸道疾病，特異性低。","呼吸音變大可見於肺炎、氣道分泌物增加等，特異性低。","反常呼吸（paradoxical breathing）是連枷胸的病理特徵，診斷意義最高。","張口呼吸是呼吸窘迫的一般表現，缺乏特異性診斷意義。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_045","year":2022,"roc_year":111,"session":"","examNo":45,"q":"承上題，下列何項治療方法可以最有效減低該犬隻的呼吸窘迫，且有助於進行之後的區別診斷？","opts":["A. 給予利尿劑","B. 胸腔穿刺術","C. 給予氧氣","D. 進行鎮靜"],"ans":1,"exp":"（需確認前文語境）對於呼吸窘迫的胸腔疾病病例，「胸腔穿刺術（thoracocentesis）」兼具診斷和治療雙重功能：若為氣胸或胸腔積液，可立即緩解壓迫；同時獲得的液體可進行細胞學和培養分析，協助區別診斷（漏出液/滲出液/膿胸/血胸）。","we":["利尿劑適用於心因性肺水腫，對氣胸或非心因性積液無效，且不幫助區別診斷。","胸腔穿刺術正確：既減輕胸腔壓迫改善呼吸，又可獲取液體做診斷分析，雙重效益最大。","給予氧氣是支持性治療，可暫時改善氧合，但不能區別診斷病因。","鎮靜雖可減少呼吸做功，但會抑制代償性呼吸驅動，且不能區別診斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_046","year":2022,"roc_year":111,"session":"","examNo":46,"q":"下列處理單純性氣管塌陷犬隻之敘述，何項最不適當？","opts":["A. 可長期給予低劑量類固醇治療","B. 控制體重","C. 給予支氣管擴張劑","D. 需長期給予高劑量鎮靜劑治療"],"ans":3,"exp":"氣管塌陷的長期內科治療包括：低劑量類固醇（減少炎症）、支氣管擴張劑（如theophylline）、體重控制；「長期高劑量鎮靜劑」並非標準治療，高劑量鎮靜劑會抑制呼吸中樞，加重呼吸窘迫。","we":["低劑量類固醇可減少氣管黏膜炎症和水腫，是氣管塌陷的輔助治療之一，適當。","控制體重可減少呼吸系統負擔，是氣管塌陷的重要非藥物管理措施，適當。","支氣管擴張劑（theophylline, terbutaline）可擴張氣道並增強呼吸肌力，是常用藥物，適當。","長期高劑量鎮靜劑抑制呼吸中樞，並非氣管塌陷的標準治療方案，最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_047","year":2022,"roc_year":111,"session":"","examNo":47,"q":"犬 hypertrophic osteopathy 常發生在下列何種疾病？","opts":["A. 肺部腫瘤","B. 肝腫瘤","C. 腦下垂體腫瘤","D. 骨肉瘤"],"ans":0,"exp":"犬肥大性骨病（hypertrophic osteopathy，HO）是四肢長骨骨膜增生性反應，最常與「肺部腫瘤」（原發性或轉移性）相關——胸腔內腫塊（約80%）引起副腫瘤性骨膜刺激。","we":["肺部腫瘤（原發或轉移至肺部）是HO最常見的相關病因，佔病例約80%，正確。","肝腫瘤與HO的關聯極為罕見，遠不如肺部腫瘤常見。","腦下垂體腫瘤與HO無已知關聯。","骨肉瘤是原發性骨腫瘤，HO是繼發於其他疾病（多為肺腫瘤）的骨膜反應，兩者不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_048","year":2022,"roc_year":111,"session":"","examNo":48,"q":"病犬為 3 歲齡，體重 25 公斤，雄性已絕育邊界牧羊犬，於 4 日前被生鏽鐵釘刺傷，依其症狀癲癇發作、強直\r   痙攣、牙關緊閉，診斷為破傷風症，下列那一項藥物最不適合用於此病犬？","opts":["A. phenobarbital","B. chlorpromazine","C. penicillin G","D. glycopyrrolate"],"ans":3,"exp":"破傷風治療：青黴素G（殺菌）、抗毒素（中和毒素）、地西泮/苯巴比妥（控制痙攣）、氯丙嗪（肌肉鬆弛）。Glycopyrrolate為抗膽鹼能藥，可能加重破傷風患者的自主神經失調（破傷風毒素已造成交感神經過度活化），且無直接治療效果，最不適合。","we":["Phenobarbital是控制破傷風痙攣的標準鎮靜抗驚厥藥，適合使用。","Chlorpromazine（吩噻嗪類）有鎮靜和肌肉鬆弛作用，是破傷風的輔助藥物，適合。","Penicillin G是破傷風的首選抗生素，可殺滅梭狀芽孢桿菌，適合。","Glycopyrrolate（抗膽鹼能藥）對破傷風無直接治療作用，且可能加重自主神經失調，最不適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_049","year":2022,"roc_year":111,"session":"","examNo":49,"q":"病犬為 8 歲齡，體重 50 公斤，雄性未絕育高山犬，中毒後常出現神經系統與消化道系統的症狀，出現嗜中性\r  球增多、中度貧血、與紅血球出現嗜鹼性斑點等特異性病徵以及血中鉛濃度增加，診斷為鉛中毒，下列那一 項是治療藥物？","opts":["A. EDTA","B. MgSO4","C. dimethyl sulfoxide（DMSO）","D. methyl blue"],"ans":0,"exp":"鉛中毒的標準螯合治療劑為「CaNa₂EDTA（依地酸二鈉鈣）」，靜脈給藥螯合血中鉛後從腎臟排出。臨床特徵包括嗜鹼性斑點（basophilic stippling）、嗜中性球增多、貧血，確診靠血鉛濃度。","we":["EDTA（CaNa₂EDTA）是鉛中毒的標準解毒劑，有效螯合血鉛並促進腎臟排泄，正確。","MgSO₄用於低鎂血症或硫酸鎂瀉藥，不是鉛中毒的解毒劑。","DMSO（二甲基亞碸）是有機溶劑和部分藥物的載體，不是鉛中毒解毒劑。","亞甲藍（methylene blue）是治療亞硝酸鹽/變性血紅素性貧血的解毒劑，不用於鉛中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_050","year":2022,"roc_year":111,"session":"","examNo":50,"q":"關於常見犬貓口腔腫瘤特徵的敘述，下列何者最不適當？","opts":["A. 黑色素瘤（melanoma）是狗最常見的口腔惡性腫瘤，但在貓卻少見","B. 鱗狀上皮細胞癌（squamous cell carcinoma）是貓最常見的口腔惡性腫瘤，也常發生在狗","C. 齒齦瘤（epulides）是狗最常見的口腔良性腫瘤，不轉移也不具骨侵犯性","D. 口腔乳突瘤（papilloma）主要發生在年輕犬隻，大部分病例不需介入治療，會自行消退"],"ans":2,"exp":"棘狀細胞性齒齦瘤（acanthomatous epulis，現稱為犬口腔棘狀細胞性骨化纖維瘤或ameloblastoma）具有局部侵犯性，可侵入深部骨組織造成骨破壞；「不轉移也不具骨侵犯性」的描述不完全正確。","we":["黑色素瘤是犬口腔最常見惡性腫瘤且貓少見，此描述正確。","SCC是貓口腔最常見惡性腫瘤，也見於犬，此描述正確。","齒齦瘤（epulides）中，棘狀細胞型具局部骨侵犯性，「不具骨侵犯性」的說法錯誤。","口腔乳突瘤由乳突病毒引起，好發年輕犬，大多自行消退，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_051","year":2022,"roc_year":111,"session":"","examNo":51,"q":"此病原最有可能為何？","opts":["A. 隱球菌","B. 細菌","C. 酵母菌","D. 念珠菌"],"ans":0,"exp":"（需確認前文語境，推測為貓隱球菌病）貓面部/鼻腔腫塊伴神經症狀，最可能的病原為隱球菌（Cryptococcus neoformans/gattii）：形成特徵性莢膜多醣（黑色素負染可見荚膜），貓是最常見的感染動物，可累及呼吸道、皮膚、眼睛和CNS。","we":["隱球菌（Cryptococcus）是最可能的答案（需確認前文語境），貓是主要易感物種，CNS親嗜性強。","細菌性感染通常引起化膿性炎症，不是貓鼻腔慢性肉芽腫性病變的首要診斷。","酵母菌（廣義）包含隱球菌，但一般指念珠菌（Candida），在貓不常見且症狀不同。","念珠菌（Candida）在貓極少見，通常為免疫抑制動物的機會性感染，不是本題情境的主要選擇。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_052","year":2022,"roc_year":111,"session":"","examNo":52,"q":"承上題，若此病原確定為此貓的致病病原，則何項器官最不易受到波及？","opts":["A. 消化道","B. 皮膚","C. 眼睛","D. 腦部"],"ans":0,"exp":"（需確認前文語境）隱球菌（Cryptococcus）感染貓最常累及：鼻腔/鼻旁竇、CNS（腦膜腦炎）、皮膚、眼睛。消化道（GI tract）是最少受波及的器官——隱球菌主要通過呼吸道進入，不常規感染消化道。","we":["消化道是隱球菌感染最少波及的器官，正確答案。","皮膚（尤其頭頸部）是隱球菌的常見累及部位，包括結節和潰瘍性皮膚病變。","眼睛（視網膜脫落、葡萄膜炎、視神經損傷）是隱球菌常見的系統性感染部位。","腦部（腦膜炎、腦膜腦炎）是隱球菌的高親嗜器官，通過篩板侵入CNS是經典途徑。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_053","year":2022,"roc_year":111,"session":"","examNo":53,"q":"犬感染鉤端螺旋體之主要臨床症狀為","opts":["A. 嘔吐、黏液鮮血便、裡急後重、腹鳴和腹脹","B. 嘔吐、黏液鮮血便、裡急後重、右前腹部膨大和混濁腹水","C. 發燒、厭食、嘔吐、跪拜姿、兩肘部向外翻和端坐呼吸","D. 發燒、厭食、嘔吐、下痢、腎臟疼痛和腎衰竭"],"ans":3,"exp":"犬鉤端螺旋體病（leptospirosis）的主要臨床表現為：急性發燒、厭食、嘔吐、下痢、腎臟疼痛（腰部疼痛）和急性腎衰竭——因鉤端螺旋體主要嗜腎臟，造成腎小管坏死。","we":["嘔吐+鮮血便+裡急後重+腹鳴腹脹更符合出血性胃腸炎（HGE）或腸炎，與鉤端螺旋體不符。","嘔吐+鮮血便+右前腹部膨大+混濁腹水更符合腸套疊伴腹水，非鉤端螺旋體。","發燒+厭食+嘔吐+跪拜姿+兩肘外翻+端坐呼吸是胰臟炎的典型表現，非鉤端螺旋體。","發燒、厭食、嘔吐、下痢、腎臟疼痛和腎衰竭是犬鉤端螺旋體病的標準臨床表現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_054","year":2022,"roc_year":111,"session":"","examNo":54,"q":"下列何項犬貓疾病最不會出現咳血（hemoptysis）？","opts":["A. 嚴重心衰竭","B. 心絲蟲感染","C. 肺部腫瘤","D. 過敏性支氣管炎"],"ans":3,"exp":"過敏性支氣管炎（如貓氣喘、犬過敏性支氣管炎）的病理機制是支氣管痙攣和黏液過度分泌，不會造成血管損傷或出血，因此「不會出現咳血（hemoptysis）」。","we":["嚴重心衰竭可造成肺靜脈高壓和肺泡微血管破裂→咳血，可發生。","心絲蟲感染造成肺動脈高壓和血管損傷→咳血，可發生。","肺部腫瘤侵犯血管或造成肺組織壞死→咳血，可發生。","過敏性支氣管炎（氣喘）病理為支氣管痙攣和黏液分泌，不涉及血管損傷，最不會出現咳血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_055","year":2022,"roc_year":111,"session":"","examNo":55,"q":"犬雙側性腎囊腫（renal cysts）或腎囊狀腺癌（cystadenocarcinomas），最可能引起下列何種副腫瘤症候群\r  （paraneoplastic syndrome）？","opts":["A. myasthenia gravis","B. nodular dermatofibrosis","C. cutaneous flushing","D. alopecia"],"ans":1,"exp":"德國牧羊犬家族性多灶性腎囊腫/腎囊狀腺癌（German shepherd multifocal renal cystadenocarcinoma）的經典副腫瘤症候群是「結節性皮膚纖維化症（nodular dermatofibrosis）」，表現為多發性皮下結節，由FLCN（folliculin）基因突變引起。","we":["Myasthenia gravis通常與胸腺瘤（thymoma）相關的副腫瘤症候群，非腎臟腫瘤。","Nodular dermatofibrosis正確：德國牧羊犬腎囊腫/腎囊狀腺癌的經典副腫瘤性皮膚病。","Cutaneous flushing是類癌（carcinoid tumor）分泌血清素的副腫瘤表現，非腎臟腫瘤。","Alopecia可見於各種內分泌腫瘤，但不是腎囊狀腺癌的特徵性副腫瘤症候群。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_056","year":2022,"roc_year":111,"session":"","examNo":56,"q":"有關犬貓急性胃炎的處置，下列敘述何者最不適當？","opts":["A. 投予 anticholinergic 的藥物有止吐、去腹痛的效果","B. 嚴重的嘔吐會造成代謝性酸血症，可用生理鹽水來進行輸液","C. 有嘔吐物的嘔吐，原則上不要嘗試去制止嘔吐動作","D. 應先停止供給食物或飲水至少 12 小時"],"ans":1,"exp":"嚴重嘔吐造成的是「代謝性鹼血症（metabolic alkalosis）」——大量HCl從胃液中流失，不是代謝性酸血症。選項B的酸鹼判斷錯誤；生理鹽水（富含Cl⁻）確實用於補充氯離子，但前提診斷錯誤。","we":["Anticholinergic藥物（如atropine）減少GI蠕動，對急性胃炎嘔吐的效果有限，且減少蠕動可能延長有害物質在胃內停留。","嚴重嘔吐造成代謝性鹼血症（非酸血症）因HCl大量流失；生理鹽水補充Cl⁻是正確治療，但敘述酸血症是錯誤的。","有嘔吐物的嘔吐通常是防禦性機制，不需刻意止吐（除非嘔吐本身造成危險），敘述正確。","禁食禁水至少12小時讓胃腸休息是急性胃炎初期的標準處理，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_057","year":2022,"roc_year":111,"session":"","examNo":57,"q":"犬隻最常見下列何種類型之天疱瘡？","opts":["A. pemphigus foliaceus","B. pemphigus erythematosus","C. pemphigus vegetans","D. pemphigus vulgaris"],"ans":0,"exp":"犬最常見的天疱瘡類型是「天疱瘡葉狀型（pemphigus foliaceus，PF）」，以皮膚角質層下的棘層鬆解（acantholysis）為特徵，表現為面部/耳廓/鼻樑的鱗屑、結痂和膿皰。","we":["Pemphigus foliaceus（PF）是犬最常見的天疱瘡類型，也是貓最常見的自體免疫性皮膚病，正確。","Pemphigus erythematosus是PF的局限性輕度型，較少見，不如PF常見。","Pemphigus vegetans是最罕見的天疱瘡類型，犬幾乎不見。","Pemphigus vulgaris（PV）是最嚴重的類型，累及黏膜，但在犬遠不如PF常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_058","year":2022,"roc_year":111,"session":"","examNo":58,"q":"當上位神經元（upper motor neuron）發生病症時，最不會出現下列何種症狀？","opts":["A. 本體感覺（general proprioception）異常","B. 髕骨韌帶反射（patellar tendon reflex）消失","C. 肢體僵硬或強直","D. 膀胱張力增加"],"ans":1,"exp":"上位神經元（UMN）病變的特徵是：脊髓反射弧保留，反射通常正常或亢進（非消失），肢體強直/痙攣性麻痺，膀胱括約肌張力增加（高張力膀胱）。髕骨韌帶反射消失（低反射/無反射）是「下位神經元（LMN）」病變的特徵。","we":["本體感覺（GP）異常是UMN病變的典型表現，本體感覺傳入路徑在脊髓受損，正確出現。","髕骨韌帶反射消失是LMN（L4-L6脊髓節段）病變的特徵，UMN病變時反射應保留或亢進，不會消失。","肢體僵硬或強直（spasticity）是UMN病變特徵，因失去高級中樞的抑制性調控，正確出現。","膀胱張力增加（UMN bladder/spastic bladder）是UMN病變的泌尿道特徵，正確出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_059","year":2022,"roc_year":111,"session":"","examNo":59,"q":"患有短吻症候群（brachycephalic syndrome）犬隻出現呼吸窘迫，下列何項與此症狀無關？","opts":["A. 軟顎過長","B. 鼻孔狹窄","C. 下頷唾液腺腫大","D. 喉囊外翻"],"ans":2,"exp":"短吻症候群（brachycephalic obstructive airway syndrome，BOAS）的組成要素包括：鼻孔狹窄、軟顎過長、氣管發育不全（tracheal hypoplasia）、喉囊外翻（laryngeal saccule eversion）。「下頷唾液腺腫大」不是BOAS的構成要素，與呼吸窘迫無直接關聯。","we":["軟顎過長（elongated soft palate）是BOAS的核心構成要素，引起吸氣性阻塞。","鼻孔狹窄（stenotic nares）是BOAS最常見的外觀特徵，增加上呼吸道阻力。","下頷唾液腺（mandibular salivary gland）腫大不是BOAS的構成要素，與短吻症候群無關。","喉囊外翻（laryngeal saccule eversion）是BOAS的繼發性病變，因持續負壓使喉囊黏膜外翻阻塞喉腔。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_060","year":2022,"roc_year":111,"session":"","examNo":60,"q":"下列關於犬牙周病之敘述，何者錯誤？","opts":["A. 牙周組織（periodontium）包含牙齦、牙周韌帶、牙本質與琺瑯質","B. 牙齦炎是可回復的","C. 會引起牙齦萎縮與牙周囊袋生成","D. 齒槽骨流失一般是不可回復的"],"ans":0,"exp":"牙周組織（periodontium）由四個組成部分構成：牙齦（gingiva）、牙周韌帶（periodontal ligament）、牙骨質（cementum）和齒槽骨（alveolar bone）。牙本質（dentin）和琺瑯質（enamel）屬於牙齒本身結構，不是牙周組織的一部分。","we":["選項A錯誤：牙周組織包含牙齦、牙周韌帶、牙骨質（cementum）和齒槽骨，不含牙本質和琺瑯質。","牙齦炎（gingivitis）是可逆性炎症，若去除牙結石可完全恢復，正確。","牙周病確實會引起牙齦萎縮和牙周囊袋（periodontal pocket）形成，正確。","齒槽骨的流失是不可逆的，是牙周病的嚴重後果，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_061","year":2022,"roc_year":111,"session":"","examNo":61,"q":"下列關於犬隻子宮蓄膿疾病之敘述，何者最為正確？","opts":["A. 起因主要是由於動情素作用","B. 造成子宮蓄膿病原菌大多為糞便來源革蘭氏陽性桿菌","C. 確診主要依靠臨床症狀與觸診","D. 有可能會併發產生 systemic inflammatory response syndrome（SIRS）"],"ans":3,"exp":"犬子宮蓄膿（pyometra）常伴發全身性炎症反應，細菌毒素和炎症介質進入血液，可引起SIRS（systemic inflammatory response syndrome）乃至膿毒症，是子宮蓄膿的主要致死原因之一。","we":["子宮蓄膿主要在「黃體素（progesterone）」作用下發展，不是動情素；黃體期子宮腺體增生→細菌增殖。","最常見病原為大腸桿菌（E. coli，革蘭氏陰性桿菌），來自上行性感染，非糞便來源革蘭氏陽性桿菌。","子宮蓄膿確診主要依靠超音波（子宮擴張充液）、X光和血液學（嗜中性球增多），不僅靠臨床症狀和觸診。","子宮蓄膿可引發SIRS（systemic inflammatory response syndrome），嚴重時進展為敗血症，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_062","year":2022,"roc_year":111,"session":"","examNo":62,"q":"下列何項不是犬貓骨折手術固定後骨不癒合（bone non-union）的風險因子？","opts":["A. 植入物鬆動","B. 骨折處上方覆蓋的軟組織不足","C. 未成年的動物","D. 開放性骨折"],"ans":2,"exp":"未成年動物（幼畜）的骨膜（periosteum）活性強，生長因子豐富，骨折癒合能力優於成年動物，因此「未成年動物」不是骨不癒合（non-union）的風險因子，反而是癒合的有利條件。","we":["植入物（螺絲、鋼板）鬆動會使骨折端不穩定，持續微動阻礙骨痂形成，是骨不癒合的風險因子。","骨折處軟組織覆蓋不足，血液供應受損，影響骨痂血管化，是骨不癒合的重要風險因子。","未成年動物骨膜厚且活性高，骨折癒合能力強，不是骨不癒合的風險因子，是本題答案。","開放性骨折（污染、軟組織損傷、血供破壞）是骨不癒合最重要的風險因子之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_063","year":2022,"roc_year":111,"session":"","examNo":63,"q":"關於犬異位性輸尿管的敘述，下列何者最不適當？","opts":["A. 臨床上被確診的病例中，母犬多於公犬","B. extramural type 的犬異位性輸尿管可建議使用雷射（laser ablation）進行治療","C. 即使對內科藥物治療有反應，也應積極建議患犬進行手術處置","D. 手術後仍會有部分患犬持續有漏尿症狀"],"ans":1,"exp":"異位性輸尿管分為兩型：(1)Intramural型（輸尿管穿過膀胱壁）可用膀胱鏡引導雷射切開治療；(2)Extramural型（輸尿管完全繞過膀胱）需要開腹手術（新輸尿管膀胱吻合術），無法用雷射治療。","we":["母犬異位性輸尿管臨床症狀（漏尿）比公犬明顯，確診病例中母犬確實多於公犬，正確。","Extramural型需開腹手術，雷射（膀胱鏡引導）僅適用於intramural型，此敘述錯誤。","對於異位性輸尿管，即使藥物治療有效，手術矯正是根治方法，建議積極手術，敘述合理。","手術後部分患犬（尤其尿道括約肌不全者）仍可能持續漏尿，需藥物輔助，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_064","year":2022,"roc_year":111,"session":"","examNo":64,"q":"下列關於犬 Chiari-like malformation 的敘述，何者最不適當？","opts":["A. 病因主要是因為小腦發育畸形所引起","B. 後肢以未接觸方式在空中朝頭部抓癢的動作（phantom scratching），是典型特徵","C. 可使用口服藥物 gabapentin 緩解臨床症狀","D. 常見手術方式是移除部分枕骨進行減壓"],"ans":0,"exp":"犬Chiari-like malformation（CLM）的根本病因是「枕骨發育不足（occipital hypoplasia）」，導致後顱窩容積過小，小腦（hindbrain）被擠壓疝出枕骨大孔，非小腦本身的發育畸形。","we":["CLM病因是枕骨（後顱窩）發育不足，造成小腦疝出，不是小腦本身畸形，此敘述錯誤。","Phantom scratching（空中朝頭部抓癢）是CLM/脊髓空洞症的典型表現，由感覺異常（dysesthesia）引起，正確。","Gabapentin（加巴噴丁）可緩解神經性疼痛和感覺異常，是CLM/脊髓空洞症的常用內科藥物，正確。","移除部分枕骨進行顱頸減壓（foramen magnum decompression）是CLM的標準手術治療，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_065","year":2022,"roc_year":111,"session":"","examNo":65,"q":"關於犬骨肉瘤（osteosarcoma），下列敘述何者錯誤？","opts":["A. 好發於長骨的幹骺區（metaphysis）","B. 前肢好發於肱骨近端及橈骨遠端","C. 後肢好發於股骨遠端及脛骨遠端","D. 除了老年犬，2 歲齡是另一個發生率較高的年紀"],"ans":2,"exp":"犬骨肉瘤後肢好發於「股骨遠端」和「脛骨近端」（非遠端）。記憶口訣：遠離肘關節（前肢橈骨遠端）、靠近膝關節（後肢脛骨近端）。","we":["骨肉瘤好發於長骨幹骺區（metaphysis）是正確的，生長旺盛的骨端最易發生。","前肢好發於肱骨近端（shoulder附近）和橈骨遠端（distal radius，最常見部位），正確。","後肢好發於股骨遠端和「脛骨近端（proximal tibia）」，而非脛骨「遠端」，此敘述錯誤。","犬骨肉瘤確有雙峰年齡分佈：老年大型犬（7-9歲）為主峰，年輕大型犬（18-24個月）為次峰。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_066","year":2022,"roc_year":111,"session":"","examNo":66,"q":"下列何種麻醉前鎮靜劑不適合用於此病患？","opts":["A. acepromazine","B. fentanyl","C. lidocaine","D. atropine"],"ans":0,"exp":"（需確認前文案例語境）Acepromazine是吩噻嗪類鎮靜劑，有以下禁忌：心臟病（低血壓/心律不整）、癲癇（降低癲癇閾值）、休克、血容量不足。本題可能描述心臟病或癲癇患犬，acepromazine最不適合。","we":["Acepromazine在心臟病、癲癇或低血壓患者中禁忌，若本案例有上述情況則為最不適合的鎮靜劑。","Fentanyl（阿片類）可安全用於大多數患者，配合心電圖監測，是常見的術前鎮痛藥。","Lidocaine（低劑量IV）作為抗心律不整藥和鎮痛輔助，在心臟手術患者中適合使用。","Atropine用於預防術中心搏過緩，是常見的術前藥，適合大多數患者。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_067","year":2022,"roc_year":111,"session":"","examNo":67,"q":"該病例以 alfaxalone 緩慢靜脈注射直到下顎張力鬆弛，進行插管，並以 isoflurane 維持麻醉，及接上生理監視  器，術中生理數值如圖，此時，病犬生理數值何項異常？","opts":["A. 血壓（133/61, 79 mmHg）","B. 心跳（124）","C. 中心靜脈壓（9/6, 7 cmH2O）","D. 所有數值皆無異常"],"ans":3,"exp":"（需確認圖表語境）術中數值：BP 133/61 (MAP 79 mmHg) = 正常範圍（麻醉下MAP >60-70 mmHg可接受）；HR 124/min = 略高但手術刺激下可接受；CVP 9/6 (mean 7 cmH₂O) = 正常範圍（0-8 cmH₂O）。所有數值均在麻醉允許範圍內。","we":["血壓（133/61，MAP 79 mmHg）：麻醉下MAP目標60-100 mmHg，79屬正常，無異常。","心跳（124/min）：麻醉下犬心率正常約60-120/min，124略高但在手術刺激情況下可接受。","中心靜脈壓（均值7 cmH₂O）：正常範圍0-8 cmH₂O，無異常。","所有數值皆無異常：BP、HR、CVP均在麻醉犬的可接受範圍內，正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_068","year":2022,"roc_year":111,"session":"","examNo":68,"q":"下列何種藥物不會作用於 GABA receptor？","opts":["A. thiamylal","B. propofol","C. alfaxalone","D. tiletamine"],"ans":3,"exp":"Tiletamine（替來他明）是解離性麻醉劑（與ketamine同類），作用機制為NMDA受體拮抗劑，不作用於GABA受體。其他三個藥物（thiamylal、propofol、alfaxalone）均通過增強GABA-A受體功能發揮麻醉作用。","we":["Thiamylal是超短效巴比妥類藥物，增強GABA-A受體Cl⁻通道開放時間，作用於GABA受體。","Propofol（丙泊酚）增強GABA-A受體功能，是最常用的靜脈麻醉誘導劑之一，作用於GABA受體。","Alfaxalone（神經活性類固醇）增強GABA-A受體功能，使Cl⁻通道開放頻率增加，作用於GABA受體。","Tiletamine（解離性麻醉劑）是NMDA受體（不是GABA受體）的非競爭性拮抗劑，不作用於GABA受體，正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_069","year":2022,"roc_year":111,"session":"","examNo":69,"q":"關於牛隻助產器（calving jack or HK calf puller）的使用，下列敘述何項最不適當？","opts":["A. 可提供牛隻正常分娩 5～6 倍的牽引力","B. 胎兒左右腳不同步牽引可使胎兒截面積變小容易拉出","C. 同時牽引頭部可避免造成異常胎勢","D. 相較於三人同時牽引，較不容易使產道嚴重創傷"],"ans":3,"exp":"牛隻助產器（calving jack）提供的牽引力可達正常分娩力的5-6倍，比三人同時徒手牽引的力道「更大」，因此更容易造成產道嚴重創傷、軟組織撕裂和骨盆損傷。選項D說「較不容易造成嚴重創傷」與事實相反。","we":["助產器確實可提供約5-6倍正常分娩力的牽引力，這是其優點（難產時有效）也是風險，敘述正確。","左右腳不同步（交替）牽引可使胎兒肩寬/髖寬縮小，減少梗阻，有助於拉出，正確。","同時牽引頭部和四肢有助於維持胎勢正確，防止頭部反折，正確。","助產器提供的力道遠大於三人徒手牽引，更容易造成產道嚴重創傷，此敘述錯誤，最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_070","year":2022,"roc_year":111,"session":"","examNo":70,"q":"羊隻假懷孕的原因，下列何者最正確？","opts":["A. 持久性黃體（persistent corpus luteum），持續分泌孕酮（progesterone）","B. 濾泡囊腫（follicular cyst），持續分泌孕酮（progesterone）","C. 持久性黃體（persistent corpus luteum），持續分泌動情激素（estrogen）","D. 濾泡囊腫（follicular cyst），持續分泌動情激素（estrogen）"],"ans":0,"exp":"羊（特別是山羊）假懷孕（hydrometra/pseudopregnancy）：持久性黃體（persistent corpus luteum）持續分泌孕酮（progesterone）→子宮腺體分泌液體積聚→子宮積水（hydrometra），母羊呈現腹部膨大、無發情但無活體胎兒。","we":["持久性黃體持續分泌孕酮→子宮積水（pseudopregnancy/hydrometra），正確機制。","濾泡囊腫分泌動情激素（estrogen），造成持續發情（nymphomania），不是假懷孕的機制。","持久性黃體分泌孕酮（progesterone），不是動情激素；描述錯誤。","濾泡囊腫分泌動情激素（非孕酮），且造成nymphomania而非假懷孕。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_071","year":2022,"roc_year":111,"session":"","examNo":71,"q":"成年公、母羊無駕乘行為（failure to stand）之原因中，下列何者最不可能？","opts":["A. 配種季節未到","B. 陰道瓣退化不全（persistent hymen）","C. 陰道收縮（vaginal constriction）","D. 濾泡囊腫（follicularcyst）"],"ans":3,"exp":"濾泡囊腫（follicular cyst）分泌過量動情激素，造成母羊持續強烈發情（nymphomania），表現為持續或過度的駕乘意願，不會造成「無駕乘行為（failure to stand）」；因此濾泡囊腫是「最不可能」的原因。","we":["配種季節未到（小型反芻動物為短日照季節性發情動物）時無發情行為，是駕乘行為缺乏的合理原因。","陰道瓣退化不全（persistent hymen）物理性阻礙交配，可造成無法配種/無駕乘行為，合理。","陰道收縮（vaginal constriction）物理性阻礙交配，可造成行為性拒絕或無法配種，合理。","濾泡囊腫造成持續高動情素→nymphomania（過度發情），不會造成無駕乘行為，最不可能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_072","year":2022,"roc_year":111,"session":"","examNo":72,"q":"牧場牛隻配種後 60 天進行超音波妊娠檢查，於配種後未見發情，其子宮超音波影像如下圖，何者為該牛隻最可能之診斷？","opts":["A. 正常懷孕","B. 雙胞胎","C. 胚胎死亡","D. 畸形胎"],"ans":0,"exp":"（需確認超音波影像）配種後60天、未見發情，超音波影像需人工確認。若影像顯示有胎兒心跳或胎盤葉（cotyledons），則為正常懷孕（A）；若無胎兒結構則考慮胚胎死亡（C）。","we":["若超音波顯示正常的子葉（cotyledons）和胎兒心跳，則為正常懷孕，可能是本題答案（需確認影像）。","雙胞胎需超音波見兩個胎兒，需影像確認。","胚胎死亡超音波可見退化中的胎膜無活動性胎兒，需影像確認。","畸形胎需超音波確認胎兒結構異常，需影像確認。"],"needs_review":true,"imgs":[]},{"id":"AMO_2022_普通病_073","year":2022,"roc_year":111,"session":"","examNo":73,"q":"妊娠 45 天後的綿羊，其維持懷孕所需的孕酮（progesterone）主要是由下列何種器官或組織所分泌？","opts":["A. 胎盤","B. 腎上腺髓質","C. 子宮","D. 卵巢內的黃體"],"ans":0,"exp":"綿羊妊娠約第50-55天後，胎盤（特別是胎盤葉/placentomes）取代黃體成為維持懷孕的主要孕酮來源。妊娠45天後即將進入此轉變期，問題問45天後的主要來源，答案為胎盤。","we":["胎盤正確：綿羊妊娠50天後胎盤逐漸取代黃體成為主要孕酮來源，妊娠45天後（整體妊娠期）以胎盤為主。","腎上腺髓質（髓質）分泌兒茶酚胺（腎上腺素/正腎上腺素），不分泌孕酮。","子宮不是孕酮的分泌來源（子宮是孕酮的靶器官）。","卵巢黃體在妊娠早期（<50天）是主要孕酮來源，但妊娠50天後胎盤取而代之。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_074","year":2022,"roc_year":111,"session":"","examNo":74,"q":"下列何種公犬常見的副性腺出現疾病時，會造成患犬裡急後重、血尿及可能排尿困難？","opts":["A. 輸精管壺部","B. 儲精囊腺","C. 前列腺","D. 尿道球腺"],"ans":2,"exp":"犬唯一的副性腺為「前列腺（prostate）」（犬無儲精囊腺和尿道球腺的明確構造）。前列腺疾病（前列腺肥大、前列腺炎、前列腺囊腫）壓迫直腸和尿道，可造成裡急後重、血尿和排尿困難。","we":["輸精管壺部（ampulla of ductus deferens）是輸精管的膨大部分，不會引起泌尿道症狀。","犬（males）沒有儲精囊腺（seminal vesicles），這是人類有但犬沒有的器官。","前列腺是犬唯一的副性腺，前列腺疾病造成裡急後重（壓迫直腸）、血尿和排尿困難，正確。","犬沒有明確的尿道球腺（bulbourethral gland），且即使存在也不是常見疾病部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_075","year":2022,"roc_year":111,"session":"","examNo":75,"q":"性成熟的雄性動物當睪丸受到損傷時，通常於受損後多少天，可於精液中出現多量主要異常形態（major\r  abnormalities）的精子？","opts":["A. 1～20","B. 30～60","C. 70～90","D. 100～120"],"ans":1,"exp":"睪丸損傷後，受損的精原細胞/精母細胞需完成剩餘的精子發生過程才能出現在射出精液中。犬精子發生週期約61天，加上副睪通過時間（10-14天），總計約30-60天後精液中開始出現大量主要異常精子。","we":["1-20天太短，精原細胞無法在此短時間內完成精子發生並出現在射出精液中。","30-60天符合精子發生週期（~61天）的時間範圍，受損細胞完成發育後出現在精液中，正確。","70-90天略長，但也在可能範圍內；若以更嚴格的副睪成熟計算，主要異常高峰可能稍晚。","100-120天過長，超過了一個完整的精子發生週期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_076","year":2022,"roc_year":111,"session":"","examNo":76,"q":"母豬於仔豬離乳後多少天左右仍未有發情徵候，則需要人員介入以釐清有無繁殖障礙問題？","opts":["A. 7","B. 14","C. 21","D. 28"],"ans":1,"exp":"母豬通常在離乳後5-7天恢復發情。若離乳後「14天」仍未見發情徵候，則超過正常發情恢復時間，需介入評估是否有持久性黃體、黃體囊腫或其他繁殖障礙。","we":["7天是正常發情恢復時間，此時仍可合理等待，無需立即介入。","14天是介入的合理時間點：若離乳後14天仍未發情，超過正常期限，需評估繁殖問題，正確。","21天等待時間過長，會延誤母豬繁殖週期，降低牧場繁殖效率。","28天等待完全浪費生產週期，不應等待如此之久。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_077","year":2022,"roc_year":111,"session":"","examNo":77,"q":"下列何項前置因子最容易使乳牛發生產後胎衣滯留？","opts":["A. 母牛有蹄病","B. 分娩前體重過重的經產牛","C. 懷雙胞胎分娩的牛隻","D. 分娩前體重過輕的女牛"],"ans":2,"exp":"乳牛胎衣滯留（retained fetal membranes）最重要的前置因子是「雙胞胎妊娠」——雙胞胎分娩後胎盤葉（cotyledon）的子宮胎盤連結更難以完全分離，子葉數量增加且分布異常，加上分娩後孕酮下降不完全，大幅增加胎衣不下的發生率。","we":["蹄病影響站立活動，間接影響分娩機制，但不是胎衣滯留的主要前置因子。","分娩前體重過重可能影響分娩，但不是胎衣滯留的最主要風險因子。","懷雙胞胎分娩的牛隻胎衣滯留發生率顯著增高（可達50%以上），是最重要的前置因子，正確。","分娩前體重過輕（能量負平衡）可能影響免疫功能，但不是胎衣滯留的最主要前置因子。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_078","year":2022,"roc_year":111,"session":"","examNo":78,"q":"依照正常的比例，同一天檢查 100 頭正常 15 個月齡的女牛當中，理論上應該會有多少頭女牛當天處於發情\r  期？","opts":["A. 3～5","B. 7～10","C. 11～13","D. 14～15"],"ans":0,"exp":"牛發情週期約21天，發情期持續約18小時（0.75天）。100頭正常15月齡女牛（已達性成熟）中，任一天處於發情期的頭數≈100×(0.75/21)≈3.6頭，即約3-5頭，選項A（3-5）最接近。","we":["3-5頭符合計算：100×(18hr/504hr)≈3.6頭，正確答案。","7-10頭過高，相當於發情期長達37-52小時，與實際不符。","11-13頭過高，相當於發情期長達55-65小時，與實際不符。","14-15頭幾乎佔1/7，相當於發情期長達每週（3天），與實際不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_079","year":2022,"roc_year":111,"session":"","examNo":79,"q":"下列何種處置無法幫助牧場改善牛隻靜默排卵所引起的繁殖障礙？","opts":["A. 灌洗子宮","B. 牛隻裝置計步器","C. 尾根使用蠟筆記號或裝置駕乘偵測器","D. 施行排卵同期化進行定時人工授精"],"ans":0,"exp":"靜默排卵（silent ovulation）指無行為性發情徵候的排卵，偵測方法包括：計步器、駕乘偵測器、蠟筆標記、超音波追蹤、血清孕酮監測、排卵同期化定時AI。「灌洗子宮」與偵測或改善靜默排卵完全無關，無法解決問題。","we":["灌洗子宮（uterine lavage）用於沖洗子宮炎或胚胎移植準備，不能幫助偵測或改善靜默排卵，是本題答案。","計步器（pedometer）偵測發情期增加的步數活動量，可間接偵測靜默排卵，有效。","尾根蠟筆標記和駕乘偵測器（KaMaR）可記錄駕乘行為，即使行為輕微也能偵測，有效。","排卵同期化（如Ovsynch）+定時AI繞過了發情偵測的需求，直接解決靜默排卵問題，有效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2022_普通病_080","year":2022,"roc_year":111,"session":"","examNo":80,"q":"下圖為母犬陰道抹片於顯微鏡下之影像，推論該母犬是處於動情週期的那一期？","opts":["A. 動情前期（pro-oestrus）","B. 動情期（oestrus）","C. 動情後期（metoestrus）","D. 乏情期（anoestrus）"],"ans":1,"exp":"（需確認陰道抹片影像）動情期（oestrus）的陰道抹片特徵：>80%的角化無核鱗狀上皮細胞（cornified cells），無或極少紅血球，無嗜中性球。若圖片顯示大量角化細胞，則為動情期。","we":["動情前期（pro-oestrus）：有核角化細胞和大量紅血球，尚未達到完全角化，與動情期不同。","動情期（oestrus）：大量角化無核鱗狀上皮細胞（>80%），無紅血球，無嗜中性球，是本題最可能答案（需確認影像）。","動情後期（metoestrus）：大型多形核嗜中性球重新出現，角化細胞減少，出現泡沫細胞（foam cells）。","乏情期（anoestrus）：以基底旁細胞（parabasal cells）和少量中間細胞為主，細胞稀少，幾乎無角化。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_001","year":2023,"roc_year":112,"session":"","examNo":1,"q":"下圖中這匹馬最可能罹患下列何種疾病？","opts":["A. 腦下垂體的中間部功能異常（pituitary pars intermedia dysfunction）","B. 免疫媒介溶血性貧血（immune-mediated hemolytic anemia）","C. 糖尿病（diabetes mellitus）","D. 無汗症（anhidrosis）"],"ans":0,"exp":"（圖片題）老馬毛髮長而捲曲（hypertrichosis）是PPID（垂體中間部功能異常，equine Cushing's）的典型特徵，A正確。","we":["PPID（pituitary pars intermedia dysfunction）是老馬最常見的內分泌疾病，典型表現為多毛/捲毛（hypertrichosis），A為暫定答案。","IMHA（免疫媒介溶血性貧血）主要表現為黃疸、黏膜蒼白，不會有典型長捲毛，B不符。","糖尿病（DM）在馬較少見，且不造成典型的長捲毛，C不符。","無汗症（anhidrosis）表現為不出汗、耐熱差，不會有長捲毛，D不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_002","year":2023,"roc_year":112,"session":"","examNo":2,"q":"承上題，下列何項不是伴隨此種疾病常見的狀況？","opts":["A. 蹄葉炎（laminitis）","B. 體重下降（weight loss）","C. 較鈍（docility）","D. 光敏症（photosensitization）"],"ans":3,"exp":"PPID（垂體中間部功能異常）的常見伴隨狀況包括：蹄葉炎（laminitis）、體重下降（muscle wasting）、性情較鈍（docility/dull demeanor）。光敏症（photosensitization）不是PPID的常見伴隨症狀，D為最不常見的伴隨狀況。","we":["蹄葉炎（laminitis）是PPID最常見的重要伴隨症狀之一，A是常見狀況。","體重下降（肌肉萎縮）是PPID的典型表現，B是常見狀況。","PPID患馬性情通常變得較鈍/溫順（docility），C是常見狀況。","光敏症（photosensitization）非PPID的常見伴隨症狀，D為最不常見，是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_003","year":2023,"roc_year":112,"session":"","examNo":3,"q":"下列那種手術不適合於馬匹以站立方式執行手術（standing surgery）？","opts":["A. palmar digital neurectomy","B. Caslick's operation","C. tracheostomy","D. umbilical herniorrhaphy"],"ans":3,"exp":"問哪種手術「不適合」以站立方式執行。臍疝氣修補術（umbilical herniorrhaphy）是腹部手術，需要全身麻醉及側躺以提供安全手術視野，不適合站立執行。","we":["Palmar digital neurectomy（掌側指神經切斷術）可在站立下局麻執行，A可站立執行。","Caslick's operation（陰道縫合術）是母馬會陰部手術，站立局麻即可執行，B可站立執行。","Tracheostomy（氣管切開術）可在站立下局麻執行，C可站立執行。","Umbilical herniorrhaphy（臍疝氣修補術）需全身麻醉側躺，不適合站立執行，D是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_004","year":2023,"roc_year":112,"session":"","examNo":4,"q":"一匹成馬傷口一直無法癒合如下圖，下列何種情況可能性最低？","opts":["A. sequestrum","B. equine sarcoid","C. exuberant granulation tissue","D. angular limb deformity"],"ans":3,"exp":"問何種情況「可能性最低」導致馬匹傷口無法癒合。Angular limb deformity（肢體角度變形）是骨骼發育問題，與傷口不癒合無關，D可能性最低。","we":["Sequestrum（壞死骨片）是傷口不癒合的常見原因，A可能性高。","Equine sarcoid（馬肉瘤）是馬常見的皮膚腫瘤，常導致傷口不癒合或反覆潰瘍，B可能性高。","Exuberant granulation tissue（肉芽組織過度增生）是馬匹傷口特有問題，常見於下肢，C可能性高。","Angular limb deformity（肢體角度變形）是發育性骨骼問題，與傷口癒合無直接關聯，D可能性最低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_005","year":2023,"roc_year":112,"session":"","examNo":5,"q":"有關馬匹敗血性關節炎（septic arthritis），下列敘述何者錯誤？","opts":["A. 可能自周圍蜂窩組織炎蔓延侵入","B. 嚴重可能形成epiphyseal osteomyelitis","C. 在一週齡幼駒抗生素最多只能用一週","D. 會造成軟骨的proteoglycan及collagen快速流失"],"ans":2,"exp":"問何者「錯誤」。馬匹敗血性關節炎（尤其幼駒）需要「長期」抗生素治療（通常4-6週），而非「最多只能用一週」。C的說法錯誤。","we":["敗血性關節炎確實可自周圍蜂窩組織炎蔓延，A描述正確。","嚴重敗血性關節炎可形成epiphyseal osteomyelitis，尤其在幼駒，B描述正確。","幼駒敗血性關節炎需要長期抗生素治療（4-6週），「最多只能用一週」是錯誤說法，C為最不正確的選項。","細菌性關節炎會造成軟骨proteoglycan及collagen快速流失，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_006","year":2023,"roc_year":112,"session":"","examNo":6,"q":"關於小牛地方性肺炎，下列敘述何者最不適當？","opts":["A. bovine coronavirus為主要病原之一","B. 群體飼養之小牛有較高的患病風險","C. 與緊迫造成免疫力下降有關","D. 患病小牛不會傳染給其他小牛"],"ans":3,"exp":"問「最不適當」的描述。小牛地方性肺炎（enzootic pneumonia）是高度接觸性傳染病，患病小牛「可以」傳染給其他小牛。D說不會傳染是錯誤的。","we":["Bovine coronavirus是小牛肺炎的病原之一，A描述正確。","群體飼養密度高，交叉感染風險增加，B描述正確。","緊迫（stress）降低免疫力，增加感染風險，C描述正確。","小牛地方性肺炎具有傳染性，患病小牛「可以」傳染給其他小牛，D的描述「不會傳染」是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_007","year":2023,"roc_year":112,"session":"","examNo":7,"q":"下列何者最不可能是牛隻創傷性蜂巢胃炎常見的併發症？","opts":["A. 肝臟膿瘍","B. 脾臟膿瘍","C. 腎臟膿瘍","D. 心包炎"],"ans":2,"exp":"問「最不可能」的併發症。外來物從蜂巢胃穿出，主要向前（cranially）穿透到心包（心包炎）、膈肌、肝臟、脾臟。腎臟位置偏後且有保護，不在典型穿透路徑上，腎臟膿瘍最不常見。","we":["肝臟膿瘍（hepatic abscess）是創傷性蜂巢胃炎常見併發症，異物可透過門脈循環擴散至肝臟，A常見。","脾臟膿瘍也是常見併發症，異物可直接穿透至脾臟，B常見。","腎臟位置偏後且有較多保護，不在網胃異物典型穿透路徑上，腎臟膿瘍最不常見，C正確。","心包炎（pericarditis）是創傷性蜂巢胃炎最嚴重的常見併發症之一，D常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_008","year":2023,"roc_year":112,"session":"","examNo":8,"q":"關於酵母菌乳房炎（yeast mastitis），下列敘述何者正確？","opts":["A. 無法使用血液培養基培養","B. 使用抗真菌藥劑可有效控制感染","C. 容易發生於長期使用抗生素藥劑乳房灌注","D. 使用單劑量包裝的乳房炎軟膏可以有良好的療效"],"ans":2,"exp":"酵母菌乳房炎（yeast mastitis）容易發生在長期使用抗生素乳房灌注之後，因為抗生素殺死競爭性細菌，允許酵母菌（Candida等）過度增生，C正確。","we":["酵母菌可以在血液培養基（blood agar）上生長，A的說法錯誤。","抗真菌藥劑對酵母菌乳房炎效果有限；酵母菌乳房炎通常為自限性，且乳房內投藥效果不確定，B不正確。","長期抗生素乳房灌注使正常菌叢減少，給酵母菌過度增生的機會，C正確。","標準乳房炎軟膏主要含抗生素，對酵母菌感染無效，D的說法不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_009","year":2023,"roc_year":112,"session":"","examNo":9,"q":"牛隻輸血時，最常用那一種抗凝血劑？","opts":["A. 肝素（heparin）","B. 乙二胺四乙酸二鈉（sodium ethylenediaminetetraacetic acid）","C. 枸橼酸鹽葡萄糖液（acid citrate-dextrose）","D. 草酸鹽（oxalate）"],"ans":2,"exp":"牛隻輸血最常使用枸橼酸鹽葡萄糖液（ACD, acid citrate-dextrose）作為抗凝血劑，C正確。ACD可保存RBC，適合較長時間的血液保存及輸血。","we":["肝素（heparin）在牛輸血中可使用，但非最常用的抗凝劑，A不是最常用。","EDTA用於實驗室血液抽取，不適合用於輸血（有毒性），B不適合輸血。","ACD（acid citrate-dextrose）是牛輸血的標準抗凝劑，可維持RBC活性，C正確。","草酸鹽（oxalate）有毒性，不用於輸血，D不適合輸血。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_010","year":2023,"roc_year":112,"session":"","examNo":10,"q":"下列有關牛隻肺臟聽扣診之敘述，何者錯誤？","opts":["A. 利用手指進行扣診胸腔時，在小牛通常可以得到良好的結果，但是在成牛則較不易得到清楚的聽音","B. 扣診牛隻肺臟之邊緣非常重要，若肺氣腫時，常會發現扣診之肺臟邊緣比正常的範圍還要大","C. 扣診牛隻胸腔時，其前下方（頭腹側）若為濁音，常是因為肺有積液所造成","D. 扣診牛隻胸腔時，若其腹側之肺臟邊緣比正常範圍高，表示可能有胸腔積液"],"ans":2,"exp":"問何者「錯誤」。C說「前下方（頭腹側）若為濁音，常是因為肺有積液（pleural effusion）所造成」——前下方濁音更可能是「肺實變（consolidation/pneumonia）」，而非胸腔積液（胸腔積液通常造成腹側的「水平線」濁音）。C的描述不準確。","we":["手指扣診在小牛效果好，成牛胸壁厚效果差，A描述正確。","肺氣腫時過度充氣→扣診範圍擴大，B描述正確。","前下方（cranioventral）濁音更常是肺實變（肺炎）的表現，而非胸腔積液；胸腔積液通常在腹側形成水平濁音線，C的描述有誤。","腹側肺臟邊緣上移（比正常高）是胸腔積液的特徵（液體將肺往背側推），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_011","year":2023,"roc_year":112,"session":"","examNo":11,"q":"下列何種症狀與小牛白肌病最無關聯？","opts":["A. 猝死","B. 心肌病變","C. 呼吸急促及呼吸困難","D. 強烈痙攣"],"ans":3,"exp":"小牛白肌病（white muscle disease, Vitamin E/Se deficiency）的臨床表現：猝死（心肌型）、心肌病變、呼吸急促（呼吸肌受影響）。強烈痙攣（tetanic seizures）不是白肌病的典型表現；白肌病主要是肌肉變性/無力，非神經性痙攣。","we":["猝死（sudden death）是心肌型白肌病的表現，A與白肌病有關。","心肌病變（myocardial lesions）是白肌病的典型病理表現，B與白肌病有關。","呼吸肌受影響可造成呼吸困難，C與白肌病有關。","強烈痙攣（violent convulsions）不是白肌病的典型表現（痙攣更多見於神經疾病），D與白肌病最無關聯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_012","year":2023,"roc_year":112,"session":"","examNo":12,"q":"下列何項牛寄生蟲性疾病的敘述最不適當？","opts":["A. 牛焦蟲病（babesiosis）較常見於放牧的牛群","B. 牛焦蟲病（babesiosis）可造成溶血性黃疸及貧血","C. 牛新孢子蟲感染症（neosporosis）常造成懷孕4～6月母牛的流產","D. 牛錐蟲病（trypanosomiasis）主要是由壁蝨傳播所引起"],"ans":3,"exp":"問「最不適當」的描述。D說牛錐蟲病（trypanosomiasis）主要由壁蝨（tick）傳播——這是錯誤的。牛錐蟲病（Trypanosoma vivax, T. congolense等）主要由采采蠅（tsetse fly, Glossina sp.）傳播，不是壁蝨。","we":["牛焦蟲病（babesiosis）由壁蝨傳播，放牧牛接觸蜱機會較多，好發率較高，A描述正確。","牛焦蟲病（babesiosis）→RBC寄生蟲→溶血→黃疸及貧血，B描述正確。","Neospora caninum可跨胎盤傳播，最常造成母牛懷孕4-6個月時流產，C描述正確。","牛錐蟲病（trypanosomiasis）主要由「采采蠅（tsetse fly）」傳播，不是壁蝨，D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_013","year":2023,"roc_year":112,"session":"","examNo":13,"q":"牛隻長期持續採食羊齒植物（bracken fern）發生中毒之主徵為何？","opts":["A. 嘔吐","B. 血尿","C. 大腦性缺氧","D. 失明"],"ans":1,"exp":"牛隻長期採食蕨（bracken fern）含有pterylaquiline等毒素，造成骨髓抑制→血小板減少→出血→「血尿（hematuria）」是主徵。","we":["牛隻不能嘔吐（反芻動物），A不是bracken fern中毒的表現。","血尿（hematuria）是bracken fern中毒（骨髓毒性→血小板減少→出血）的主要臨床表現，B正確。","大腦性缺氧不是bracken fern中毒的主徵（馬採食bracken fern因硫胺素缺乏會有神經症狀，但牛不同）。","失明（blindness）不是bracken fern中毒的主要表現（失明更多見於polioencephalomalacia等）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_014","year":2023,"roc_year":112,"session":"","examNo":14,"q":"乳牛在產後常罹患第四胃異位，下列何種因素是此病症的首要條件？","opts":["A. 分娩","B. 產後精粗料比增加","C. 第四胃蠕動能力下降","D. 高泌乳量"],"ans":0,"exp":"乳牛第四胃異位（DA）的首要條件是「分娩（parturition）」。分娩後子宮體積驟然縮小，腹腔空間改變，允許第四胃移位，A正確。其他因素（高精料、蠕動下降）是次要促進因素。","we":["分娩（parturition）是乳牛DA的首要觸發條件，子宮縮小後腹腔空間變化，A正確。","產後精粗料比增加是誘發因素之一，但非首要條件。","第四胃蠕動能力下降是DA的機制之一，但蠕動下降通常是分娩前後能量代謝問題的結果。","高泌乳量是間接相關因素，但非DA的首要條件。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_015","year":2023,"roc_year":112,"session":"","examNo":15,"q":"下圖中（由尾部向頭部觀），乳牛瘤胃內充滿了泡沫性液體，其最正確的診斷為何？","opts":["A. 原發性臌脹","B. 迷走神經性消化不良","C. 蜂巢胃食滯","D. 重瓣胃食滯"],"ans":0,"exp":"（圖片題）瘤胃充滿泡沫性液體（frothy content）是「原發性臌脹（frothy bloat/primary bloat）」的特徵。泡沫阻礙氣體通過賁門排出，造成持續臌脹。","we":["原發性臌脹（primary frothy bloat）：瘤胃內容物泡沫化，氣泡無法集中排出，A正確為暫定答案。","迷走神經性消化不良（vagal indigestion）：瘤胃食滯但通常不是泡沫性，B不符。","蜂巢胃食滯（reticulo-rumenal impaction）：固態食滯，非泡沫性，C不符。","重瓣胃食滯（omasal impaction）：乾燥食物阻塞，非瘤胃泡沫性，D不符。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_016","year":2023,"roc_year":112,"session":"","examNo":16,"q":"牛隻食用之牧草地中，若含氮過高會妨害下列何種離子的吸收，而導致青草痙攣症？","opts":["A. 鈉","B. 鉀","C. 鎂","D. 鈣"],"ans":2,"exp":"青草痙攣症（grass tetany/hypomagnesemic tetany）是低鎂血症（hypomagnesemia）所致。高氮（高蛋白質）牧草中高鉀（K）含量會抑制消化道對鎂（Mg）的吸收，導致低鎂血症→痙攣。","we":["鈉（sodium）吸收不受高氮牧草影響，低血鈉不造成痙攣，A不正確。","鉀（potassium）實際上「增加」而非減少（高氮牧草通常也含高鉀），B不正確。","鎂（magnesium）的吸收受高鉀牧草影響而下降，低鎂血症是青草痙攣症的原因，C正確。","鈣（calcium）主要受PTH和VitD調節，高氮牧草對鈣吸收的影響不是青草痙攣症的機制，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_017","year":2023,"roc_year":112,"session":"","examNo":17,"q":"下列何者不是乳牛酮病（ketosis）的有效治療方法？","opts":["A. 靜脈注射500 mL 50% dextrose","B. 口服丙酸鈉","C. 注射corticosteroids","D. 靜脈注射15%磷酸氫二鈉液和Ringer氏液"],"ans":3,"exp":"問何者「不是有效治療方法」。靜脈注射15%磷酸氫二鈉液（sodium phosphate）和Ringer's液不是酮病的標準治療，磷酸鹽用於低磷血症，Ringer's液只是一般輸液，D不是酮病治療。","we":["靜脈注射50% dextrose 500 mL直接補充葡萄糖，是酮病的有效緊急治療，A有效。","口服丙酸鈉（propionate）提供gluconeogenesis的底物，是酮病的輔助治療，B有效。","注射corticosteroids可誘導糖質新生，增加血糖，是酮病的有效治療之一，C有效。","靜脈注射磷酸氫二鈉液用於低磷血症，加上Ringer's液是一般輸液，兩者不是酮病的特異性治療，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_018","year":2023,"roc_year":112,"session":"","examNo":18,"q":"牛尿石症之尿石主要成分為下列何者時，採用氯化銨口服治療最為有效？","opts":["A. 鈣","B. 鎂","C. 氨","D. 矽"],"ans":1,"exp":"氯化銨（NH4Cl）是尿液酸化劑，用於預防磷酸鎂銨（struvite）結石。Struvite（MgNH4PO4）在鹼性尿中形成，其主要成分含「鎂（Mg，B）」，氯化銨酸化尿液後可溶解和預防struvite形成。","we":["鈣結石（calcium oxalate或calcium phosphate）不是氯化銨最有效的適應症，A不是最佳答案。","鎂（struvite = 磷酸鎂銨）結石在鹼性尿中形成，氯化銨酸化尿液可有效預防，B正確。","氨（NH4+）是struvite的成分之一，但選項B（鎂）更精確描述struvite的主要「礦物質」成分，C不是最佳答案。","矽結石（silicon uroliths）不受尿液酸化影響，氯化銨對矽結石無效，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_019","year":2023,"roc_year":112,"session":"","examNo":19,"q":"牛隻站立以腹腔穿刺術進行腹膜液（peritoneal fluid）檢查，下列敘述何者正確？","opts":["A. 腹底部中央區域最低處最容易取得腹膜液","B. 下針時為避免穿刺腹腔臟器，應以30度角入針","C. 抽取針進入腹腔後無法抽取到腹膜液，表示腹膜液過少，為避免引發腹膜炎應停止於其他部位入針","D. 即使抽出外觀清澈之腹膜液也不能排除腹膜炎的可能性"],"ans":3,"exp":"問何者「正確」。D說即使抽出外觀清澈的腹膜液也不能排除腹膜炎——正確！早期腹膜炎或局限性腹膜炎的腹膜液外觀可能仍清澈，需要細胞學和生化檢查才能確認，D正確。","we":["腹底部中央區域（ventral midline）是站立牛腹腔積液最低處，A描述基本正確，但D更具臨床意義。","腹腔穿刺應垂直（90°）入針，而非30度角，B描述不正確。","若一處無法抽到腹膜液，可嘗試換位置，停止嘗試的建議不正確，C描述不正確。","早期腹膜炎的腹膜液可能外觀清澈，但細胞數和蛋白質已升高，不能僅憑外觀清澈排除腹膜炎，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_020","year":2023,"roc_year":112,"session":"","examNo":20,"q":"小牛出生後無法自行站立，前腳球節如下圖無法自行伸直負重，下列何者是較不建議的治療方式？","opts":["A. 輕度時使用矯正板外固定包紮球節","B. 嚴重時進行淺指屈肌肌腱截斷術","C. 輕度時使用自家製矯正蹄鞋","D. 連續IV注射oxytetracycline"],"ans":3,"exp":"問「較不建議」的治療方式。連續IV注射oxytetracycline不是小牛屈曲肢變形的標準治療，oxytetracycline IV用於馬科動物的屈曲變形（foal contracted tendons），且連續給藥有腎毒性風險，D較不建議。","we":["輕度時使用矯正板外固定球節是正確的保守治療，A建議使用。","嚴重時進行淺指屈肌肌腱截斷術（superficial flexor tenotomy）是有效的外科治療，B建議使用。","自家製矯正蹄鞋可用於輕症牛隻，C可接受。","連續IV注射oxytetracycline在牛隻屈曲變形的使用證據有限，且有腎毒性風險，D為較不建議的治療方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_021","year":2023,"roc_year":112,"session":"","examNo":21,"q":"牛隻分娩後消瘦發生第四胃異位，使用右腹脅部大網膜固定術進行治療時，發現大網膜過薄並容易撕裂，為\r  提升手術成功率，在縫合右腹脅部創口時，可同時固定下列那一個構造？","opts":["A. 幽門竇","B. 第四胃胃壁","C. 瘤胃壁","D. 小網膜"],"ans":0,"exp":"右腹脅部手術時若大網膜過薄，可直接縫合「幽門竇（pyloric antrum）」到右側腹壁，替代或輔助大網膜固定，確保第四胃復位後的固定效果，A正確。","we":["幽門竇（pyloric antrum）是第四胃固定術的備用縫合目標，當大網膜薄弱時，直接固定幽門竇到腹壁是有效的替代方式，A正確。","直接縫合第四胃胃壁可能造成漏乳/漏胃液，風險較高，B不是最佳選項。","瘤胃壁固定是左側手術的方法，不適合右側手術，C不正確。","小網膜連接肝臟和第四胃，不是腹壁固定的合適目標，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_022","year":2023,"roc_year":112,"session":"","examNo":22,"q":"小牛臍赫尼亞環直徑大於15公分，下列那一個方法無法增加赫尼亞修復術的成功率？","opts":["A. 使用人工合成mesh材料","B. 使用可吸收線關閉腹腔","C. 術後使用腹部支撐包紮","D. 限制術後運動"],"ans":1,"exp":"問何者「無法」增加>15cm臍疝氣修復術的成功率。使用「可吸收線關閉腹腔」（B）對於大缺損的問題是使用何種縫線材料，但對大缺損的「結構性」支撐無特別幫助——真正能增加成功率的是mesh（A）、包紮（C）和術後護理（D）。可吸收線的選擇不特別增加大缺損的成功率。","we":["Mesh材料可提供機械性支撐，補強大缺損，確實能增加成功率，A有幫助。","使用可吸收線關閉腹腔是適當的縫合材料選擇，但對>15cm大缺損的成功率提升幫助有限（主要需要mesh支撐），B無法特別增加成功率。","術後腹部支撐包紮可減少腹壓、防止縫線張力，C有幫助。","限制術後運動可減少縫合部位的張力，D有幫助。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_023","year":2023,"roc_year":112,"session":"","examNo":23,"q":"在進行牛隻旁腰窩（paralumbar fossa）剖腹產術時，最需被麻醉的脊神經為下列何項？","opts":["A. L1至L2","B. T11至T12","C. L4至L5","D. L5至L7"],"ans":0,"exp":"牛隻旁腰窩（paralumbar fossa）剖腹產術使用腰椎旁神經阻斷（paravertebral block），最需麻醉的是「L1至L2」脊神經（第一和第二腰椎神經），這些神經支配旁腰窩區域的感覺，A正確。","we":["L1至L2（第一和第二腰椎神經）是旁腰窩手術最主要的麻醉目標，A正確。","T11至T12支配胸腹部，不是旁腰窩手術的主要麻醉神經，B不正確。","L4至L5支配後肢，不是旁腰窩手術的主要麻醉神經，C不正確。","L5至L7支配後肢和骨盆區域，不是旁腰窩手術的主要麻醉神經，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_024","year":2023,"roc_year":112,"session":"","examNo":24,"q":"肥育牛隻長期給予大量精料後常引起第一胃酸中毒症狀，隨後便可能再出現何種併發症？","opts":["A. 倒臥母牛症候群","B. 過肥牛症候群","C. 蹄葉炎","D. 迷走神經性消化不良"],"ans":2,"exp":"肥育牛長期大量精料→第一胃急性酸中毒（ruminal acidosis）→腸道黏膜損傷→細菌內毒素（LPS）吸收→全身炎症→蹄葉炎（laminitis），C正確。","we":["倒臥母牛症候群（downer cow syndrome）通常發生在分娩後，非精料過多的直接後果，A不正確。","過肥牛症候群（fat cow syndrome）是分娩前過度肥胖，非肥育牛高精料的直接後果，B不正確。","瘤胃酸中毒→腸道損傷→LPS吸收→蹄葉炎是已知的病理機制，C正確。","迷走神經性消化不良是慢性瘤胃/第四胃問題，非精料過多的典型後果，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_025","year":2023,"roc_year":112,"session":"","examNo":25,"q":"牛隻若出現步態強拘，體溫正常，球節部顯著下沉，蹄壁有多數明顯蹄輪，蹄底前端向上翹而以蹄踵部負\r   重，蹄尖部角質向前方顯著伸展，蹄骨前端向下壓迫蹄底，可診斷為下列何項？","opts":["A. 裂蹄病（sandcrack）","B. 慢性腐蹄病（footrot）","C. 慢性蹄葉炎（laminitis）","D. 蹄骨發炎"],"ans":2,"exp":"步態強拘、球節下沉（sinking）、蹄輪（rings on hoof wall）、蹄尖上翹、蹄骨前端向下壓迫蹄底——這是「慢性蹄葉炎（chronic laminitis）」的典型表現：蹄骨旋轉和下沉（rotation and sinking of coffin bone）。","we":["裂蹄病（sandcrack）是蹄壁縱向裂開，症狀不符本描述，A不正確。","慢性腐蹄病（chronic footrot）以蹄間組織壞死為主，不會有蹄輪和蹄骨下沉的完整描述，B不正確。","慢性蹄葉炎（chronic laminitis）的特徵完整符合：蹄輪（以往的炎症記錄）、蹄骨旋轉下沉（蹄尖上翹、蹄骨壓迫蹄底）、球節下沉，C正確。","蹄骨發炎（pedal osteitis）以蹄底觸痛為主，不符合本描述，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_026","year":2023,"roc_year":112,"session":"","examNo":26,"q":"以toggle pin治療乳牛第四胃異位，若病牛食慾沒有明顯改善，則最好在幾天內將固定之縫線拆除？","opts":["A. 2","B. 5","C. 10","D. 14"],"ans":3,"exp":"Toggle pin固定第四胃後，若食慾沒有明顯改善，建議在「14天」內將縫線拆除，以避免局部腹膜炎或縫線遷移造成更多問題，D正確。","we":["2天太短，還未能充分評估治療效果，A不適合。","5天也偏短，B不是標準建議。","10天較接近，C可接受，但14天是常用的最長等待期限。","Toggle pin治療無效者（食慾未改善），應在14天內拆除縫線，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_027","year":2023,"roc_year":112,"session":"","examNo":27,"q":"預防公羊的尿道結石可於飼料中添加下列何種添加物？","opts":["A. 4% 食鹽","B. 4% 氧化鎂","C. 4% 硫酸鎂","D. 4% 小蘇打"],"ans":0,"exp":"預防公羊尿道結石，在飼料中添加「4%食鹽（NaCl）」可增加飲水量，稀釋尿液中礦物質濃度，降低結石形成風險，A正確。","we":["4%食鹽增加口渴感→增加飲水量→稀釋尿液→降低結石形成，A正確。","氧化鎂（MgO）是鹼化劑，用於調節pH，但不如食鹽在預防尿石方面有效，B不是最佳選項。","硫酸鎂（MgSO4）主要用於瀉下，不用於預防尿石，C不正確。","小蘇打（NaHCO3）是鹼化劑，用於調節pH，對磷酸鎂銨結石預防不如食鹽有效，D不是最佳選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_028","year":2023,"roc_year":112,"session":"","examNo":28,"q":"下列何種術式被認為最可以成功治療各種類的山羊尿道結石，並有最少的尿道阻塞復發率？","opts":["A. urethral process amputation","B. tube cystostomy","C. perineal urethrostomy","D. penile amputation"],"ans":2,"exp":"山羊尿道結石各種術式比較，perineal urethrostomy（會陰尿道造口術）可治療各種類型的結石，且復發率最低，C正確。","we":["Urethral process amputation（尿道突切除）只解決尿道突處阻塞，其他部位結石仍可復發，A效果有限。","Tube cystostomy（膀胱造瘻管）是暫時性引流措施，不是長期解決方案，B不是最有效。","Perineal urethrostomy可切除遠端尿道並擴大尿道開口，是治療各種類型山羊尿道結石最有效且復發率最低的術式，C正確。","Penile amputation（陰莖截斷術）是最後手段，保留雄性外觀但不是首選，D效果雖佳但手術過大。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_029","year":2023,"roc_year":112,"session":"","examNo":29,"q":"下列何者並非貓白內障常見的原因？","opts":["A. 糖尿病（diabetes mellitus）","B. 前葡萄膜炎（anterior uveitis）","C. 青光眼（glaucoma）","D. 遺傳性"],"ans":0,"exp":"問「並非」貓白內障的常見原因。貓白內障最常見原因是前葡萄膜炎（anterior uveitis）。糖尿病（DM）在貓很少造成白內障（與犬不同，犬DM幾乎必然白內障），A是最不常見的原因。","we":["糖尿病（DM）在「犬」常造成白內障，但在「貓」較少見，A並非貓白內障的常見原因，A正確答案。","前葡萄膜炎（anterior uveitis）是貓白內障最常見的原因，B是常見原因（非答案）。","青光眼（glaucoma）的長期眼壓升高可導致繼發性白內障，C是可能原因（非答案）。","遺傳性白內障在某些貓品種中存在，D是可能原因（非答案）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_030","year":2023,"roc_year":112,"session":"","examNo":30,"q":"飼主門診帶來一隻11歲齡雌性馬爾濟斯犬，主訴於近日開始出現咳嗽症狀，主治醫師於身體檢查後進行右側躺胸腔X光影像如圖，其中紅色虛線為氣管及主支氣管而紅色區塊為異常擴大之部分，此異常為下列何項？","opts":["A. 左心房擴大（left atrial enlargement）","B. 左心室擴大（left ventricular enlargement）","C. 右心房擴大（right atrial enlargement）","D. 右心室擴大（right ventricular enlargement）"],"ans":0,"exp":"（圖片題）11歲齡馬爾濟斯犬，小型老年犬咳嗽，胸腔X光右側躺顯示紅色區塊（異常擴大）壓迫氣管。小型犬MMVD（二尖瓣退行性疾病）→左心房擴大→壓迫左主支氣管→咳嗽。暫定答案A（左心房擴大）。","we":["左心房（left atrial）擴大是小型老年犬最常見的心臟疾病（MMVD）的表現，壓迫支氣管造成咳嗽，A為暫定答案。","左心室（left ventricular）擴大也可能，但在MMVD早中期，左心房擴大較左心室明顯，B可能性較低。","右心房（right atrial）擴大不是MMVD的主要表現，C可能性較低。","右心室（right ventricular）擴大通常在肺動脈高壓時出現，D可能性較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_031","year":2023,"roc_year":112,"session":"","examNo":31,"q":"Schober KE在2011年的研究中指出當狗在接受心衰竭治療時，飼主於家中計算患犬靜息呼吸速率（resting\r   respiratory rate）每分鐘多少標準值以下，可預測其心衰竭的控制是良好的？","opts":["A. <100次","B. <60次","C. <40次","D. <20次"],"ans":2,"exp":"Schober 2011研究指出：心衰竭犬的靜息呼吸速率（resting respiratory rate）< 30次/分鐘預測心衰竭控制良好。四個選項中，C（<40次/分鐘）是最接近並包含30的合理臨床閾值。","we":["<100次/分鐘範圍太寬，無法預測心衰竭控制，A不正確。","<60次/分鐘接近正常呼吸速率，但不是Schober研究的精確閾值，B不精確。","<40次/分鐘（實際標準是<30次/分鐘，C是選項中最接近的值），是臨床使用的心衰竭控制良好閾值，C正確。","<20次/分鐘過低，正常貓犬靜息呼吸速率就接近此值，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_032","year":2023,"roc_year":112,"session":"","examNo":32,"q":"用來評估犬隻視力的脅迫測試（menace test），其正常的脅迫反應（menace response）需要多條神經參與，下\r   列何項與此脅迫反應無關？","opts":["A. optic nerve","B. optic radiation up to the occipital cortex","C. oculomotor nerve","D. facial nerve"],"ans":2,"exp":"問與menace test「無關」的神經。Menace response路徑：視網膜→視神經（CNII）→視束→視覺皮質→小腦→顏面神經（CNVII）→瞬目肌收縮。動眼神經（oculomotor nerve, CNIII）負責控制眼外肌（extraocular muscles）和瞳孔括約肌，與menace response的瞬目反射無關，C正確。","we":["Optic nerve（視神經，CNII）傳導視覺刺激是menace response的傳入路徑，A與此反射有關。","Optic radiation to occipital cortex（視覺皮質）是menace response的中樞整合部分，B與此反射有關。","Oculomotor nerve（動眼神經，CNIII）控制眼外肌和瞳孔，不涉及瞬目反射，C與menace test無關，C正確。","Facial nerve（顏面神經，CNVII）支配orbicularis oculi肌，執行瞬目動作，D與此反射有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_033","year":2023,"roc_year":112,"session":"","examNo":33,"q":"下列關於貓甲狀腺功能亢進疾病敘述，何者最不適當？","opts":["A. 心搏過速，增加心肌負擔","B. 由於促甲狀腺激素（thyroid-stimulating hormone）分泌過於旺盛","C. 臨床症狀包括多食、多渴、嘔吐、下痢","D. 大多可觸診到甲狀腺腫大"],"ans":1,"exp":"問「最不適當」。B說「由於促甲狀腺激素（TSH）分泌過於旺盛」——這是錯誤的！貓甲狀腺亢進是甲狀腺腺體自律性（autonomously）過度分泌T3/T4，TSH反而因負回饋而「被抑制」至極低值。","we":["甲狀腺亢進→T3/T4過多→心搏加速、心肌負擔增加，A描述正確。","貓甲狀腺亢進是甲狀腺腺瘤自律分泌T3/T4，TSH反而「受到抑制」（低值），B的「TSH分泌過旺」描述錯誤，B是最不適當的選項。","多食、多渴、嘔吐、下痢是貓甲狀腺亢進的典型症狀，C描述正確。","約70-80%的貓甲亢可觸診到甲狀腺腫大，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_034","year":2023,"roc_year":112,"session":"","examNo":34,"q":"下列何者不是貓慢性腎病進展可能的結果？","opts":["A. 副甲狀腺功能低下（hypoparathyroidism）","B. 骨化三醇（calcitriol）合成下降","C. 離子與水分排除受阻","D. 尿毒症"],"ans":0,"exp":"問「不是CKD進展結果」。A說「副甲狀腺功能低下（hypoparathyroidism）」——CKD造成的是「繼發性副甲狀腺「亢進」（secondary hyperparathyroidism）」：CKD→低calcitriol→低鈣→PTH升高代償→副甲狀腺亢進。A的「低下」描述相反。","we":["CKD導致繼發性副甲狀腺「亢進」（hyperparathyroidism），而非「低下」（hypoparathyroidism），A描述錯誤，A是正確答案。","腎臟合成calcitriol（活性VitD），CKD時腎臟功能下降→calcitriol合成減少，B描述正確（是CKD的進展結果）。","CKD晚期腎臟排泄功能下降→離子和水分排除受阻（少尿/無尿），C描述正確。","CKD→含氮廢物積聚→尿毒症（uremia），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_035","year":2023,"roc_year":112,"session":"","examNo":35,"q":"環孢素（cyclosporine）為皮膚免疫相關疾病及異位性皮膚炎的的重要用藥，下列何者不是其副作用？","opts":["A. 消化道副作用如嘔吐、下痢、厭食","B. 皮膚乳頭狀增生及足墊過度角質化","C. 骨髓抑制及白血球低下","D. 齒齦增生與過度流涎"],"ans":2,"exp":"問「不是cyclosporine副作用」。Cyclosporine的主要副作用是：消化道問題、皮膚乳頭增生、齒齦增生、腎毒性。「骨髓抑制及白血球低下」是azathioprine、cyclophosphamide等細胞毒性藥物的副作用，不是cyclosporine的典型副作用，C是答案。","we":["消化道副作用（嘔吐、下痢、厭食）是cyclosporine常見副作用，A是cyclosporine的副作用。","皮膚乳頭狀增生及足墊過度角質化是cyclosporine的已知副作用，B是cyclosporine的副作用。","骨髓抑制及白血球低下是azathioprine等免疫抑制劑的副作用，不是cyclosporine的典型副作用，C不是cyclosporine副作用，C正確。","齒齦增生（gingival hyperplasia）是cyclosporine的已知副作用（在人尤其明顯），D是cyclosporine的副作用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_036","year":2023,"roc_year":112,"session":"","examNo":36,"q":"有關犬貓之輸血處置，下列敘述何項正確？","opts":["A. 輸血之血液可以合併給予乳酸林格氏液","B. 貓咪如果未曾接受過輸血，在緊急狀態時可以直接接受輸血","C. 犬隻具有輸血配對意義的紅血球抗原為DEA 1, 2, 8","D. 接受輸血後數日，病畜發生的未預期血容積比下降及血紅素尿，可能是延遲性溶血反應"],"ans":3,"exp":"問何者「正確」。D說輸血後數日發生未預期血容積比下降及血紅素尿，可能是「延遲性溶血反應（delayed hemolytic transfusion reaction, DHTR）」——正確！DHTR在輸血後3-10天發生，因抗體滴度升高溶解輸入的紅血球。","we":["輸血血液不應合併給予乳酸林格液（含Ca²+），Ca²+可能與抗凝劑（ACD中的citrate）作用，影響抗凝效果，A不正確。","貓有自然同凝集素（alloantibodies），B型貓輸A型血（或反之）可能造成嚴重溶血，緊急狀態仍需配型或謹慎，B不完全正確。","犬的輸血配對最重要的抗原是DEA 1（DEA 1.1和DEA 1.2），C描述「DEA 1, 2, 8」不完全準確（DEA 7也重要）。","輸血後數日發生溶血症狀是延遲性溶血輸血反應（DHTR）的典型表現，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_037","year":2023,"roc_year":112,"session":"","examNo":37,"q":"下列何項不是造成犬隻多食（polyphagia）的原因？","opts":["A. 給予phenobarbital甦醒後","B. 糖尿病","C. 靜脈注射葡萄糖或脂肪類的輸液","D. 胰島素瘤（insulinoma）"],"ans":2,"exp":"問「不是」造成多食（polyphagia）的原因。C說靜脈注射葡萄糖或脂肪類輸液——這是靜脈給予，繞過消化道採食行為，不會造成「多食（polyphagia，行為性採食增加）」，C不是多食的原因。","we":["Phenobarbital（苯巴比妥）治療癲癇後，確實會造成多食多渴（polyphagia, PU/PD）的副作用，A是多食的原因。","糖尿病→細胞不能利用葡萄糖→饑餓感增加→多食，B是多食的原因。","靜脈注射葡萄糖/脂肪輸液是靜脈給予，不涉及採食行為，不會造成多食（polyphagia），C不是多食原因，C正確。","胰島素瘤（insulinoma）→低血糖→血糖偵測器刺激採食→多食，D是多食的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_038","year":2023,"roc_year":112,"session":"","examNo":38,"q":"下列何項情況最不可能是造成小黑的hyponatremia的原因？","opts":["A. 嚴重肝病","B. 腹膜炎","C. 二尖瓣脫垂","D. 敗血症或全身炎症反應綜合症（SIRS）"],"ans":2,"exp":"問「最不可能」造成低血鈉的原因。C（二尖瓣脫垂）——輕度二尖瓣脫垂（MVP）通常無顯著血流動力學影響，不直接造成低血鈉；只有嚴重充血性心衰竭才會因RAAS/ADH過度活化造成低血鈉，C最不可能。","we":["嚴重肝病→低白蛋白→腹水→有效循環血量減少→ADH→稀釋性低血鈉，A可能造成低血鈉。","腹膜炎→液體轉移至腹腔→有效循環血量減少→ADH→低血鈉，B可能造成低血鈉。","二尖瓣脫垂（mitral valve prolapse）輕度時不影響血流動力學，不會直接造成低血鈉，C最不可能造成低血鈉，C正確。","敗血症/SIRS→炎症介質→ADH分泌→稀釋性低血鈉，D可能造成低血鈉。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_039","year":2023,"roc_year":112,"session":"","examNo":39,"q":"該犬以International Renal Interest Society（IRIS）分級為第幾級？","opts":["A. 第三級","B. 第五級","C. 第六級","D. 第四級"],"ans":3,"exp":"（此題為承接題，缺乏前置病史，需人工確認。IRIS CKD犬分期：Stage I <1.4 mg/dL，Stage II 1.4-2.0，Stage III 2.1-5.0，Stage IV >5.0 mg/dL。注意IRIS只有Stage I-IV，選項B（第五級）和C（第六級）不存在於IRIS分期。）","we":["第三級（Stage III）：犬creatinine 2.1-5.0 mg/dL，可能，但需確認病史數值，A為可能選項。","第五級（Stage V）不存在於IRIS分期，IRIS只有Stage I-IV，B是無效選項。","第六級（Stage VI）不存在於IRIS分期，C是無效選項。","第四級（Stage IV）：犬creatinine >5.0 mg/dL，嚴重腎衰竭，D為暫定答案（需確認病史）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_040","year":2023,"roc_year":112,"session":"","examNo":40,"q":"在治療方面，那項輸液目前最不適合？","opts":["A. 0.45% sodium chloride + dextrose","B. 生理食鹽水","C. 犬血清蛋白","D. 犬新鮮冷凍血漿（fresh frozen plasma）"],"ans":0,"exp":"（此題為承上題的承接題，缺乏前置病史。若患犬有低血鈉（Q38）和CKD（Q39），輸液選擇：0.45% NaCl + dextrose是低張液，可能加重低血鈉，是最不適合的輸液。）","we":["0.45% NaCl + dextrose是低張液，對已有低血鈉的犬可能進一步稀釋血鈉，A最不適合（暫定答案）。","生理食鹽水（0.9% NaCl）是等張液，對CKD低血鈉患犬相對安全，B可使用。","犬血清蛋白（albumin）用於低白蛋白血症，但非腎病低血鈉的常規首選輸液，C選擇性使用。","新鮮冷凍血漿（FFP）主要用於凝血障礙，不是腎病低血鈉的適應症，D不適合但非「最不適合」。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_041","year":2023,"roc_year":112,"session":"","examNo":41,"q":"根據病史該犬最有可能的休克種類為下列何項？","opts":["A. 心因性（cardiogenic）","B. 低血量（hypovolemia）","C. 分布異常性（distributive）","D. 阻塞性（obstructive）"],"ans":1,"exp":"（此題為承接題，缺乏前置病史。若患犬有CKD且血液流失或液體失衡，hypovolemic shock最可能。）","we":["心因性休克（cardiogenic）因心臟泵功能不全，通常有心臟病史，非最常見，A可能性較低。","低血量休克（hypovolemic）是失血、嘔吐、腹瀉等液體流失所致，在急性腎臟/腹部病例中常見，B為暫定答案。","分布異常性休克（distributive）多見於敗血症/過敏反應，C需更多病史。","阻塞性休克（obstructive）由機械阻塞所致，C需更多病史。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_042","year":2023,"roc_year":112,"session":"","examNo":42,"q":"下列有關貓自發性膀胱炎（feline idiopathic cystitis）的敘述，何項最不適當？","opts":["A. 過胖的貓可以進行減重","B. 多數發病的原因常與膀胱本身結構有關","C. 急性期可給予buprenorphine止痛","D. 大部分不需處理可在2～7天內自己改善"],"ans":1,"exp":"問「最不適當」。B說FIC的發病原因「常與膀胱本身結構有關」——這是錯誤的！FIC（feline idiopathic cystitis）的主要發病機制與「壓力（stress）」和「神經-內分泌因素」有關，並非主要是膀胱結構問題（少數有GAG layer缺陷），B不正確。","we":["過胖貓的肥胖是FIC的風險因子，進行減重是合理的管理措施，A描述正確。","FIC的主要原因是多因子的，以壓力和神經內分泌因素為主，並非主要是膀胱結構問題，B描述不正確，是最不適當的選項。","急性FIC疼痛明顯，給予buprenorphine（opioid）止痛是合理的治療，C描述正確。","大多數FIC在2-7天內自行改善，短期自限性是FIC的特點，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_043","year":2023,"roc_year":112,"session":"","examNo":43,"q":"犬胸腔X光下發現肺動脈及肺靜脈同時變大，下列何者非其可能之診斷？","opts":["A. 法洛氏四重畸形（tetralogy of Fallot）","B. 左至右永存性動脈導管（left to right patent ductus arteriosus）","C. 左至右心室中膈缺損（left to right ventricular septal defect）","D. 輸液過量（iatrogenic intravenous fluid overload）"],"ans":0,"exp":"問「非其可能之診斷」。法洛氏四重畸形（Tetralogy of Fallot, ToF）是右至左分流（R→L shunt），導致「肺血流減少（pulmonary hypoperfusion）」，肺動脈和靜脈應該「變小」而非擴大，故A不可能造成肺動脈和肺靜脈同時擴大。","we":["法洛氏四重畸形（ToF）是右至左分流，肺循環血流「減少」，肺動脈和靜脈應縮小，不會擴大，A非其可能診斷，A是正確答案。","PDA（左至右）→額外血液進入肺循環→肺動脈和靜脈均擴大，B是可能診斷。","VSD（左至右）→額外血液進入肺循環→肺動脈和靜脈均擴大，C是可能診斷。","輸液過量→肺靜脈壓升高→肺動靜脈均擴張，D是可能診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_044","year":2023,"roc_year":112,"session":"","examNo":44,"q":"14歲雄性絕育混種貓，咳嗽，胸腔X光可見彎曲的主動脈，其臨床意義為何？","opts":["A. 老貓的正常變異，無臨床意義","B. 和系統性高血壓有關","C. 繼發於貓心肌病","D. 腫瘤壓迫"],"ans":1,"exp":"老年貓的胸腔X光可見「主動脈彎曲（tortuous/kinked aorta）」，這與「系統性高血壓（systemic hypertension）」有關：長期高血壓→主動脈壁結構改變（彈性纖維減少）→主動脈迂曲，B正確。","we":["老年貓主動脈彎曲不是正常變異，有臨床意義，A不正確。","主動脈彎曲（tortuous aorta）是長期系統性高血壓的影像學表現，B正確。","心肌病（cardiomyopathy）主要影響心臟大小形狀，不直接造成主動脈彎曲，C不正確。","腫瘤壓迫可能造成外在性移位，但不造成主動脈本身的彎曲/迂曲，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_045","year":2023,"roc_year":112,"session":"","examNo":45,"q":"下列影像敘述何者錯誤？","opts":["A. 側照右中葉可見肺葉徵（lobar sign）","B. 側照右中葉可見空氣支氣管顯影（air bronchogram）","C. VD照左前葉可見肺泡圖像（alveolar pattern）","D. 側照右中葉可見支氣管圖像（bronchial pattern）"],"ans":3,"exp":"（圖片題，需人工確認。若右中葉有alveolar pattern（lobar sign + air bronchogram），則bronchial pattern不是該部位的典型表現；D說「側照右中葉可見支氣管圖像」可能與alveolar consolidation的表現不符。）","we":["（待確認）","（待確認）","（待確認）","Bronchial pattern（支氣管圖像）出現在bronchial disease，若右中葉為alveolar consolidation，則不會主要呈現bronchial pattern，D可能為錯誤描述。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_046","year":2023,"roc_year":112,"session":"","examNo":46,"q":"承上題，最有可能的區別診斷為何?","opts":["A. 肺炎","B. 心因性肺水腫","C. 非心因性肺水腫","D. 原發肺腫瘤"],"ans":0,"exp":"（承接題，需人工確認。依Q45圖片描述，若右中葉有lobar sign + air bronchogram，最可能是肺炎（lobar pneumonia），A暫定。）","we":["肺炎（pneumonia）呈現lobar sign + air bronchogram + alveolar pattern，A為暫定答案。","心因性肺水腫通常雙側對稱，非lobar pattern，B可能性較低。","非心因性肺水腫也多為非lobar分布，C可能性較低。","原發性肺腫瘤多為單一結節，不典型呈lobar consolidation，D可能性較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_047","year":2023,"roc_year":112,"session":"","examNo":47,"q":"下列犬貓何種疾病在X光影像上，最常觀察到縱膈淋巴結腫大（mediastinal lymph node enlargement）？","opts":["A. 原發性肺腫瘤（primary lung tumor）","B. 散播性組織細胞肉瘤（disseminated histiocytic sarcoma）","C. 轉移性肺腫瘤（metastatic lung tumor）","D. 膿胸（pyothorax）"],"ans":0,"exp":"犬貓X光縱膈淋巴結腫大（mediastinal lymphadenopathy）最常見於「原發性肺腫瘤（primary lung tumor）」，因腫瘤細胞轉移至胸骨旁和縱膈淋巴結，A正確。","we":["原發性肺腫瘤（adenocarcinoma等）常轉移至縱膈/胸骨旁淋巴結，X光可見縱膈淋巴結腫大，A正確。","散播性組織細胞肉瘤（disseminated histiocytic sarcoma）可侵犯全身淋巴結，但縱膈並非最典型，B不是最常見。","轉移性肺腫瘤（metastatic lung tumor）通常血行轉移到肺，不典型造成縱膈淋巴結腫大，C不常見。","膿胸（pyothorax）是胸腔感染，不典型造成縱膈淋巴結腫大，D不常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_048","year":2023,"roc_year":112,"session":"","examNo":48,"q":"犬隻慢性小腸疾病導致吸收功能不足時，何種血液成分可能出現低下？","opts":["A. iron and selenium","B. sodium and chloride","C. folate and cobalamin","D. copper and magnesium"],"ans":2,"exp":"犬慢性小腸疾病吸收不良時，容易低下的血液成分是「folate（葉酸）和cobalamin（維生素B12）」。Folate在近端小腸吸收，cobalamin在遠端小腸（迴腸）吸收，慢性小腸疾病兩者均可缺乏，C正確。","we":["Iron和selenium雖然也在小腸吸收，但不如folate/cobalamin在評估小腸吸收功能時有特異性，A不是最佳答案。","Sodium和chloride主要透過主動運輸機制調節，慢性小腸疾病不典型造成這兩種離子低下，B不是最佳答案。","Folate（近端小腸吸收）和cobalamin（遠端小腸吸收）是評估小腸吸收功能的重要指標，C正確。","Copper和magnesium的吸收不如folate/cobalamin在慢性小腸疾病評估中有代表性，D不是最佳答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_049","year":2023,"roc_year":112,"session":"","examNo":49,"q":"有關貓淋巴瘤，下列敘述何者正確？","opts":["A. 患貓的周邊血液抹片常見到淋巴母細胞","B. 消化道淋巴瘤常見於中年或老年貓","C. 胸中膈淋巴瘤常見於中年或老年貓","D. 多中心性淋巴瘤為最常見的貓淋巴瘤"],"ans":1,"exp":"問貓淋巴瘤「正確」的描述。消化道淋巴瘤（GI lymphoma）是貓最常見的淋巴瘤類型，常見於中年至老年貓，B正確。","we":["周邊血液抹片出現淋巴母細胞不是貓淋巴瘤的常見表現（除非是leukemic phase），A不正確。","消化道淋巴瘤（GI lymphoma）是貓最常見的淋巴瘤，且好發於中年或老年貓（>7歲），B正確。","胸中膈（mediastinal）淋巴瘤常見於「年輕貓」（尤其FeLV陽性），不是中老年貓的好發類型，C不正確。","多中心性淋巴瘤是犬最常見的類型，在貓中並非最常見（貓最常見是GI lymphoma），D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_050","year":2023,"roc_year":112,"session":"","examNo":50,"q":"犬隻患有頸部上呼吸道阻塞時，常出現急性呼吸窘迫（acute respiratory distress），最不需要下列何種處置？","opts":["A. 鎮靜","B. 氧氣","C. 類固醇","D. 支氣管擴張劑"],"ans":3,"exp":"問「最不需要」的處置。犬頸部上呼吸道阻塞急性呼吸窘迫：支氣管擴張劑（D）作用於下呼吸道（bronchi），對「上呼吸道阻塞」無效，是最不需要的處置。","we":["鎮靜可降低焦慮和用力呼吸，減少氧氣消耗，是上呼吸道阻塞急救的重要措施，A需要。","氧氣補充是任何呼吸窘迫的首要處置，B需要。","類固醇可減少上呼吸道水腫（如喉頭水腫），C需要。","支氣管擴張劑（如terbutaline）作用在下呼吸道（bronchospasm），對上呼吸道阻塞無效，D最不需要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_051","year":2023,"roc_year":112,"session":"","examNo":51,"q":"下列何者通常最不可能發生在nephrotic syndrome？","opts":["A. hypercoagulable state","B. hypercholesterolemia","C. hyperlipidemia","D. hyperproteinemia"],"ans":3,"exp":"問「最不可能」發生在nephrotic syndrome的情況。Nephrotic syndrome特徵：大量蛋白尿→低蛋白血症（hypoproteinemia）→高脂血症→高凝血狀態。「高蛋白血症（hyperproteinemia）」是相反的，不可能出現在nephrotic syndrome，D正確。","we":["Hypercoagulable state（高凝血狀態）：抗凝蛋白（如antithrombin III）從尿液流失→凝血失衡，A可能出現。","Hypercholesterolemia（高膽固醇血症）：肝臟代償性合成增加→高脂蛋白血症，B可能出現。","Hyperlipidemia（高脂血症）：與高膽固醇血症同時出現，C可能出現。","Hyperproteinemia（高蛋白血症）：Nephrotic syndrome是「低蛋白血症」（蛋白從尿液流失），高蛋白血症「不可能」出現，D是正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_052","year":2023,"roc_year":112,"session":"","examNo":52,"q":"在雌犬陰道和雄犬陰莖基部出現花椰菜狀之腫瘤最常見為","opts":["A. 惡性平滑肌瘤","B. 惡性複層扁平上皮細胞瘤","C. 犬傳染性花柳性腫瘤","D. 惡性淋巴瘤"],"ans":2,"exp":"犬傳染性花柳性腫瘤（canine transmissible venereal tumor, TVT）是犬特有的接觸傳染性腫瘤，好發於外生殖器（陰道、陰莖基部等），外觀呈花椰菜狀（cauliflower-like），C正確。","we":["惡性平滑肌瘤不是外生殖器花椰菜狀腫瘤的最常見診斷，A不正確。","惡性複層扁平上皮細胞瘤（squamous cell carcinoma）通常呈潰瘍性，非花椰菜狀，B不正確。","犬傳染性花柳性腫瘤（TVT）是外生殖器最典型的花椰菜狀腫瘤，直接接觸傳播，C正確。","惡性淋巴瘤呈全身性淋巴結腫大，不呈現外生殖器花椰菜狀，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_053","year":2023,"roc_year":112,"session":"","examNo":53,"q":"下列何項最不可能造成犬隻急性腎衰竭？","opts":["A. 使用cisplatin","B. 細菌性心內膜炎","C. 使用非類固醇性消炎藥（NSAIDs）","D. 使用mannitol"],"ans":3,"exp":"問「最不可能」造成犬急性腎衰竭（ARF）的藥物。Mannitol（甘露醇）是高滲性利尿劑，適量使用可保護腎小管（减少铸型形成），不會造成急性腎衰竭，D最不可能。","we":["Cisplatin（順鉑）是腎毒性化療藥，直接損傷腎小管，A會造成ARF。","細菌性心內膜炎→菌血症→腎臟感染性栓塞→腎損傷，B可能造成ARF。","NSAIDs抑制prostaglandins→腎臟血管收縮→腎缺血→ARF（尤其在低灌流時），C可能造成ARF。","Mannitol是滲透性利尿劑，不直接損傷腎臟，適量使用保護腎小管，D最不可能造成ARF。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_054","year":2023,"roc_year":112,"session":"","examNo":54,"q":"有關犬肥大細胞瘤（mast cell tumor）之敘述，下列何者最不適當？","opts":["A. 最常見的皮膚腫瘤","B. 黃金獵犬（golden retriever）是好發犬種","C. 散播性肥大細胞增多症（disseminated mastocytosis）是確診依據","D. 單獨以放射線治療效果有限"],"ans":2,"exp":"問「最不適當」。C說「散播性肥大細胞增多症（disseminated mastocytosis）是確診依據」——這是錯誤的！MCT的確診是靠「細針穿刺細胞學（FNA cytology）」或「組織切片（histopathology）」，散播性肥大細胞增多症是晚期MCT的臨床表現，不是確診方法。","we":["MCT是犬最常見的皮膚惡性腫瘤，A描述正確。","黃金獵犬（Golden Retriever）、拳師犬（Boxer）等是MCT好發犬種，B描述正確。","散播性肥大細胞增多症是MCT播散的表現，不是MCT的確診依據；確診需FNA細胞學或組織切片，C描述不正確，是最不適當的選項。","MCT對放射線治療有一定反應，尤其是局部控制，但說「效果有限」也有一定根據，D描述有討論空間但不如C明確錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_055","year":2023,"roc_year":112,"session":"","examNo":55,"q":"犬隻慢性腎衰竭不會出現下列何項症狀？","opts":["A. 高血壓","B. 貧血","C. 蛋白尿","D. 寡尿"],"ans":3,"exp":"問「不會出現」的症狀。慢性腎衰竭（CKD）通常表現為「多尿（polyuria）」（腎小管濃縮功能下降），而非「寡尿（oliguria）」。寡尿是急性腎衰竭（ARF）或終末期CKD的表現，D正確（寡尿不是典型CKD症狀）。","we":["高血壓是CKD的常見伴隨症狀（RAAS激活），A會出現。","貧血（非再生性）是CKD的典型症狀（EPO合成減少），B會出現。","蛋白尿是腎絲球損傷的標誌，也是CKD進展的預後因子，C會出現。","慢性腎衰竭通常是「多尿」（腎小管濃縮能力下降），而非「寡尿」；寡尿出現在急性腎衰竭或終末期，D通常不會出現（尤其在中期CKD）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_056","year":2023,"roc_year":112,"session":"","examNo":56,"q":"下列何者不是犬隻胃擴張及扭轉的手術目的？","opts":["A. 永久固定幽門竇（pyloric antrum）與右側腹壁","B. 移除死亡及壞死組織","C. 固定食道位置","D. 將胃復位至正常位置"],"ans":2,"exp":"問「不是GDV手術目的」。C說「固定食道位置」——這不是GDV手術的目標。GDV手術目標是：胃復位、去除壞死組織、永久胃固定（gastropexy）。固定食道不是必要的手術步驟，C正確。","we":["永久固定幽門竇與右側腹壁（right-side gastropexy）是GDV手術的核心目標之一，A是手術目的。","移除壞死組織（胃壁、脾臟）是GDV手術的必要步驟，B是手術目的。","固定食道不是GDV手術的標準目標，食道不需要固定，C不是手術目的，C正確。","將胃復位至正常解剖位置是GDV手術的基本步驟，D是手術目的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_057","year":2023,"roc_year":112,"session":"","examNo":57,"q":"下列關於犬胃扭轉的敘述，何者最不適當？","opts":["A. 將胃幽門部和右側腹壁固定可預防發病","B. 小型犬也會發生","C. 開腹治療時，若看到脾臟扭轉而呈黑紅色，應先將扭轉處轉正，若顏色未改變再進行切除","D. 術後若出現心律不整，並不會增加犬隻死亡風險"],"ans":3,"exp":"問「最不適當」。D說「術後出現心律不整並不會增加犬隻死亡風險」——這是錯誤的！GDV術後的心室性早期搏動（VPC）和心律不整是已知的重要死亡危險因子，D描述完全錯誤。","we":["幽門部和右側腹壁固定（gastropexy）是預防GDV復發的有效措施，A描述正確。","GDV雖然好發於大型深胸犬，小型犬也可發生，B描述正確。","脾臟扭轉時先嘗試還原，若顏色未恢復再切除是正確的手術處置順序，C描述正確。","GDV術後的心律不整（尤其VPC、室性心動過速）顯著增加死亡風險，D的說法完全錯誤，D是最不適當的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_058","year":2023,"roc_year":112,"session":"","examNo":58,"q":"關於犬膽囊黏液囊腫的敘述，下列何者最不適當？","opts":["A. 罹病風險因子包括腎上腺或甲狀腺疾患","B. 嚴重時可能造成膽汁性腹膜炎","C. 無症狀時，可嘗試給予利膽劑治療","D. 患犬膽汁中常可培養出大腸桿菌或鏈球菌"],"ans":3,"exp":"問「最不適當」。D說「患犬膽汁中常可培養出大腸桿菌或鏈球菌」——膽囊黏液囊腫（gallbladder mucocele）通常是「無菌的（sterile）」，細菌感染不是主要特徵，與膿性膽囊炎不同，D最不適當。","we":["Cushing's disease（腎上腺皮質功能亢進）和甲狀腺功能低下是已知的膽囊黏液囊腫風險因子，A描述正確。","黏液囊腫破裂可造成膽汁性腹膜炎（bile peritonitis），是嚴重併發症，B描述正確。","無症狀的膽囊黏液囊腫可嘗試ursodiol（利膽劑）保守治療，C描述合理。","膽囊黏液囊腫通常是無菌性（sterile），細菌感染不是其主要特徵，D描述不正確，是最不適當的選項。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_059","year":2023,"roc_year":112,"session":"","examNo":59,"q":"關於犬氣管塌陷的敘述，下列何者最不適當？","opts":["A. 屬先天發育不良性疾病，與創傷無關","B. 特徵為犬隻咳嗽時會發出''Goose honk''的聲音","C. 不建議將氣管支架用於早期或症狀輕微的動物","D. 避免肥胖及減重有助於控制病情"],"ans":0,"exp":"問「最不適當」。A說「屬先天發育不良性疾病，與創傷無關」——雖然犬氣管塌陷（tracheal collapse）主要是先天性軟骨缺陷，但某些後天形式（如氣管插管損傷、外傷、長期外在壓迫）「可能與創傷有關」，說「與創傷無關」是過於絕對的描述，A最不適當。","we":["氣管塌陷以先天發育性為主，但後天獲得性形式（創傷、插管損傷等）也存在，說「與創傷無關」過於絕對，A最不適當。","Goose honk（鵝鳴聲）咳嗽是氣管塌陷的典型症狀，B描述正確。","氣管支架（stent）有嚴重風險，不建議用於早期或輕症，B描述正確。","肥胖增加腹壓和呼吸負荷，減重確實有助於改善症狀，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_060","year":2023,"roc_year":112,"session":"","examNo":60,"q":"下列犬疾病中，何者最適合將手術作為主要治療方式？","opts":["A. degenerative lumbosacral stenosis","B. degenerative myelopathy","C. fibrocartilaginous embolic myelopathy","D. discospondylitis"],"ans":0,"exp":"問「最適合手術作為主要治療方式」的疾病。退行性腰薦椎狹窄（degenerative lumbosacral stenosis, DLS）在中重度病例（下肢無力、疼痛不控制）時，手術減壓（decompressive surgery）是主要治療方式，A正確。","we":["退行性腰薦椎狹窄（DLS）：中重度病例手術減壓效果好，手術是主要治療方式，A正確。","退行性脊髓病（degenerative myelopathy）是進行性神經退化，無有效手術治療，以物理治療為主，B不適合手術。","纖維軟骨栓塞（FCE）是突發性但多可自愈，支持性治療為主，無手術介入指征，C不適合手術。","椎間盤脊椎炎（discospondylitis）主要是長期抗生素治療，手術只在特殊情況（如神經壓迫）使用，D不是首選手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_061","year":2023,"roc_year":112,"session":"","examNo":61,"q":"下列關於犬貓氣胸的敘述，何者最不適當？","opts":["A. 若因氣管插管造成貓的氣管損傷，容易造成縱隔腔氣腫（pneumomediastinum）","B. 貓氣喘（asthma）可能會造成二次性的自發型氣胸","C. 治療氣管損傷造成的氣胸，大多不需要手術介入","D. 創傷所造成的氣胸均為開放型氣胸"],"ans":3,"exp":"問「最不適當」。D說「創傷所造成的氣胸均為開放型氣胸」——這是錯誤的！創傷可造成開放型（open, sucking wound）或封閉型（closed, blunt trauma）或張力型（tension pneumothorax）氣胸，不是「均為」開放型。","we":["氣管插管損傷→縱膈腔氣腫（air tracking along fascia），A描述正確。","貓氣喘持續發作→氣道壓力升高→肺泡破裂→自發型氣胸，B描述正確。","氣管損傷造成的氣胸通常保守治療（膠管引流）即可，不需要手術，C描述正確。","創傷可造成開放型、封閉型或張力型氣胸，「均為開放型」是錯誤的，D最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_062","year":2023,"roc_year":112,"session":"","examNo":62,"q":"八歲約克夏犬（Yorkshire Terrier）出現慢性漸進性單側後肢跛行，下列何者最不可能是造成原因？","opts":["A. 股骨頭缺血性壞死（avascular necrosis of femoral head）","B. 化膿性關節炎（septic arthritis）","C. 髕骨脫位（patellar luxation）","D. 胸腰椎椎間盤疾病（thoracolumbar disk disease）"],"ans":0,"exp":"問「最不可能」的原因。8歲約克夏犬，慢性漸進性單側後肢跛行：股骨頭缺血性壞死（Legg-Calvé-Perthes disease）主要發生在「<1歲」的小型犬幼犬，8歲成犬不是好發年齡，A最不可能。","we":["股骨頭缺血性壞死（Legg-Calvé-Perthes）主要發生在小型犬幼犬（<1歲），8歲犬幾乎不發生，A最不可能，A正確。","化膿性關節炎可發生在任何年齡，包括成犬，B是可能的鑑別診斷。","髕骨脫位（patellar luxation）是小型犬常見的慢性問題，約克夏犬好發，C是可能原因。","約克夏犬是chondrodystrophic breed，IVDD（椎間盤疾病）好發，可造成後肢症狀，D是可能原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_063","year":2023,"roc_year":112,"session":"","examNo":63,"q":"當該病例經誘導麻醉插管後，以isoflurane維持麻醉穩定後，下列那一種情況不能採用硬膜外神經阻滯術？","opts":["A. 凝血功能異常","B. 心臟病","C. 膝關節手術","D. 短吻犬品種"],"ans":0,"exp":"問「不能採用硬膜外神經阻滯術」的情況（禁忌症）。「凝血功能異常（A）」是硬膜外神經阻滯的絕對禁忌症，因為硬膜外穿刺可能造成硬膜外血腫→脊髓壓迫，A正確。","we":["凝血功能異常（coagulopathy）是硬膜外神經阻滯的絕對禁忌症，穿刺時出血風險極高，A正確。","心臟病不是硬膜外的絕對禁忌症，硬膜外麻醉甚至可減少全身麻醉用量，減輕心臟負擔，B不是禁忌。","膝關節手術是硬膜外麻醉的適應症之一，C不是禁忌。","短吻犬（brachycephalic breeds）麻醉風險高，但這是氣道管理問題，不是硬膜外神經阻滯的禁忌症，D不是禁忌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_064","year":2023,"roc_year":112,"session":"","examNo":64,"q":"當硬膜外神經阻滯針穿過皮膚，皮下組織和韌帶群後進入硬膜外腔，下列那一條韌帶並非屬於該韌帶群？","opts":["A. pubofemoral ligment","B. supraspinous ligament","C. interspinous ligament","D. interarcuate ligament"],"ans":0,"exp":"硬膜外針從皮膚穿入至硬膜外腔的路徑：皮膚→皮下→棘上韌帶（supraspinous ligament）→棘間韌帶（interspinous ligament）→黃韌帶（interarcuate/ligamentum flavum）→硬膜外腔。Pubofemoral ligament（髖關節韌帶）不在此路徑上，A是正確答案。","we":["Pubofemoral ligament（恥骨股骨韌帶）是髖關節的韌帶，與脊椎硬膜外穿刺路徑無關，A正確。","Supraspinous ligament（棘上韌帶）連接棘突頂端，是硬膜外穿刺路徑上的韌帶，B在穿刺路徑中。","Interspinous ligament（棘間韌帶）在棘突之間，是穿刺路徑上的韌帶，C在穿刺路徑中。","Interarcuate ligament（黃韌帶/ligamentum flavum）是進入硬膜外腔前的最後一層韌帶，D在穿刺路徑中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_065","year":2023,"roc_year":112,"session":"","examNo":65,"q":"下列那一個方法可以幫助確認針尖已經位於硬膜外腔內？","opts":["A. stifle technique","B. coxofemoral joint technique","C. ultrasonography-guided technique","D. hanging drop technique"],"ans":[2,3],"exp":"確認針尖已進入硬膜外腔（epidural space）的方法：(C) 超音波引導技術（ultrasonography-guided technique）可即時觀察針尖位置和藥液擴散；(D) 懸滴法（hanging drop technique）——在針座放一滴生理鹽水，進入硬膜外腔時負壓會將液滴吸入，是傳統可靠的確認方法。Stifle 和 coxofemoral joint technique 是局部關節麻醉的進針技術，與確認硬膜外腔無關。","we":["A. Stifle technique 是膝關節局部浸潤麻醉的進針方式，非確認硬膜外腔的方法。","B. Coxofemoral joint technique 是髖關節局部麻醉的進針方式，非硬膜外腔確認法。","C. 超音波引導技術可直視針尖進入硬膜外腔並觀察藥液分布，是正確答案之一。","D. 懸滴法（hanging drop）利用硬膜外腔負壓吸入懸掛的液滴，是經典的確認方法，是正確答案之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_066","year":2023,"roc_year":112,"session":"","examNo":66,"q":"犬貓胃腸道縫合時，主要支撐縫線力量的是下列那一層組織？","opts":["A. 黏膜層","B. 黏膜下層","C. 肌層","D. 漿膜層"],"ans":1,"exp":"胃腸道縫合中，主要提供縫線支撐力量（holding strength）的是「黏膜下層（submucosa）」，因為黏膜下層含豐富膠原蛋白（collagen fibers），提供最大的縫線抗張強度，B正確。","we":["黏膜層（mucosa）細胞豐富但膠原蛋白少，縫線保持力不佳，A不正確。","黏膜下層（submucosa）含有豐富的膠原蛋白纖維，是GI縫合中提供最主要縫線支撐力量的層次，B正確。","肌層（muscularis）提供部分支撐，但不如黏膜下層，C不是主要支撐層。","漿膜層（serosa）促進組織癒合（密封性好），但提供的縫線支撐力有限，D不是主要支撐層。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_067","year":2023,"roc_year":112,"session":"","examNo":67,"q":"下列何項注射用麻醉劑，不會直接影響腎臟功能，但會因為高劑量造成全身性低血壓，導致腎臟血流降低而\r   間接影響腎臟功能？","opts":["A. etomidate","B. opioids","C. benzodiazepines","D. propofol"],"ans":3,"exp":"Propofol（丙泊酚）不直接作用於腎臟，但高劑量可造成心肌抑制→全身性低血壓→腎臟灌流減少→間接影響腎臟功能，D正確。","we":["Etomidate不會直接影響腎臟，但也不典型造成低血壓（對心血管穩定性好），A不是最典型選項。","Opioids不直接影響腎臟，但可能降低血壓（尤其高劑量），B有一定類似效果但不如propofol典型。","Benzodiazepines不直接影響腎臟，可能造成輕度低血壓，但程度不如propofol顯著，C不是最典型選項。","Propofol高劑量→心肌抑制→低血壓→腎臟灌流減少，是典型的「間接」腎影響機制，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_068","year":2023,"roc_year":112,"session":"","examNo":68,"q":"骨髓釘使用在長骨骨折時，主要可以防止骨折處發生下列何種變化？","opts":["A. 旋轉","B. 折彎","C. 縱向滑動","D. 震動"],"ans":1,"exp":"骨髓釘（intramedullary nail, IM pin）插入長骨髓腔後，主要作用是作為內在橫桿，抵抗「折彎（bending）」力。IM pin對旋轉（rotation）的抵抗力有限（需interlocking nails），B正確。","we":["旋轉（rotation）：IM pin單獨對旋轉抵抗力差（需interlocking或外固定配合），A不是主要防止項。","折彎（bending）：IM pin在髓腔內作為支柱，有效抵抗骨折處的彎曲力，B正確。","縱向滑動（longitudinal sliding）：IM pin可部分限制，但不是最主要功能，C不是最佳答案。","震動（vibration）不是IM nail的主要考量，D不是最佳答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_069","year":2023,"roc_year":112,"session":"","examNo":69,"q":"在牛懷孕早期不會使用下列何種藥物終止懷孕？","opts":["A. corticosteroids","B. estrogen","C. PGF 2α","D. progesterone-receptor antagonist"],"ans":0,"exp":"問「不會使用」來終止牛懷孕早期的藥物。Corticosteroids（糖皮質素）用於誘導牛隻「晚期」分娩（accelerate fetal maturation），不是終止「早期」懷孕的藥物，A正確。","we":["Corticosteroids用於牛隻晚期懷孕引產（促胎兒肺成熟），不用於早期懷孕終止，A正確。","Estrogen可在配種後72小時內使用（morning-after treatment）干擾著床，B可用於早期懷孕終止。","PGF2α溶解黃體→孕酮下降→流產，在懷孕早期（前5個月）有效，C可用於早期懷孕終止。","Progesterone receptor antagonist（如RU486/mifepristone）阻斷孕酮受體，D可用於懷孕終止。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_070","year":2023,"roc_year":112,"session":"","examNo":70,"q":"有一難產母牛經檢查後發現胎兒過大，胎位為正常頭位（anterior presentation）上胎向（dorsal position），需\r   進行全碎胎術取出胎兒時，那一個是最先需切下的部位？","opts":["A. 右前肢","B. 左前肢","C. 胸口","D. 頭部"],"ans":0,"exp":"胎兒為前置頭位（anterior presentation）上胎向（dorsal position），進行全碎胎術時，通常先截除「右前肢（A）」，減少肩膀寬度（shoulder width），以便後續取出，A正確。","we":["右前肢截除：減少肩膀體積，是全碎胎術（anterior presentation）最先截除的部位，A正確。","左前肢通常在右前肢後截除，B不是最先截除的。","胸口在截除前後肢後再處理，C不是最先步驟。","頭部通常在前後肢截除後再分離，D不是最先步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_071","year":2023,"roc_year":112,"session":"","examNo":71,"q":"母羊懷孕期間缺乏下列何種物質，最不可能是造成出生後衰弱仔羊（weak kids）之主因？","opts":["A. 銅（copper）","B. 碘（iodine）","C. 硒（selenium）","D. 鐵（iron）"],"ans":3,"exp":"問「最不可能」是造成衰弱仔羊（weak kids）的主因。母羊懷孕期缺乏：銅→搖擺病（swayback）、碘→甲狀腺腫（congenital goiter）、硒→白肌病（white muscle disease）。鐵（iron）缺乏更多是出生後貧血問題，母羊懷孕期缺鐵不是導致出生後衰弱仔羊的主要原因，D最不可能。","we":["銅缺乏→搖擺病（enzootic ataxia/swayback）→出生後神經症狀及衰弱，A是主因之一。","碘缺乏→先天性甲狀腺腫→甲狀腺功能低下→衰弱仔羊，B是主因之一。","硒缺乏→白肌病（white muscle disease）→肌肉無力→衰弱仔羊，C是主因之一。","鐵缺乏在仔羊出生後（飼餵鐵含量低的乳汁）造成貧血，母羊懷孕期缺鐵不是衰弱仔羊的主要原因，D最不可能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_072","year":2023,"roc_year":112,"session":"","examNo":72,"q":"有關牛隻子宮感染的敘述，下列何項最正確？","opts":["A. 子宮感染以上行性感染為主，全身性感染為輔，而細菌則均為厭氧菌","B. 若發展成子宮蓄膿時，其子宮壁較厚，可與懷孕的子宮區別","C. 子宮感染牛隻常呈現持續發情的狀態","D. 在子宮蓄膿的情形下，其孕酮（progesterone）濃度常缺乏或低下"],"ans":1,"exp":"問「最正確」的牛子宮感染敘述。B說子宮蓄膿（pyometra）時子宮壁較厚，可與懷孕子宮區別——pyometra的子宮壁由於長期感染和纖維化，通常比懷孕後期被胎水撐薄的子宮壁「厚」，B相對正確。","we":["子宮感染是混合菌感染（需氧+厭氧），不是「均為厭氧菌」，A描述不正確。","子宮蓄膿（pyometra）的子宮壁由於長期慢性炎症和纖維化，通常比懷孕後期（子宮壁被撐薄）厚，B相對正確。","子宮感染牛通常有黃體存在（持續黃體）→孕酮高→不發情（anestrus），而非「持續發情」，C描述相反。","子宮蓄膿（pyometra）的特徵是「持續黃體（persistent CL）」→孕酮濃度「升高」，而非「缺乏或低下」，D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_073","year":2023,"roc_year":112,"session":"","examNo":73,"q":"下列何者不是異性雙胎症（freemartinism）女仔牛具有的特徵？","opts":["A. 陰道腔短","B. 直腸檢查無法觸摸到子宮頸","C. 具有明顯之雄性化","D. 貧血"],"ans":3,"exp":"問「不是」異性雙胎症（freemartinism）女仔牛的特徵。Freemartin特徵：陰道短（A）、子宮頸缺失（B）、雄性化（C）——這些都是正確特徵。「貧血（anemia，D）」不是freemartinism的特徵，D正確。","we":["陰道腔短（short vaginal canal）是freemartinism的典型特徵（約2/3的陰道缺失），A是特徵。","直腸檢查無法觸摸到子宮頸是freemartinism的特徵（子宮頸發育不全），B是特徵。","雄性化（masculinization）是freemartinism的特徵（受雄性胎兒雄性激素影響），C是特徵。","貧血（anemia）不是freemartinism的特徵，D正確（不是freemartin的特徵）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_074","year":2023,"roc_year":112,"session":"","examNo":74,"q":"下列母犬動情週期的圖示中，A所指實線最可能代表下列何種內泌素之週期變化？","opts":["A. estrogen","B. progesterone","C. luteinizing hormone（LH）","D. follicle-stimulating hormone（FSH）"],"ans":0,"exp":"（圖片題，需人工確認。母犬動情週期中，estrogen（雌激素）在pro-oestrus達到高峰，然後下降，排卵後孕酮上升。若圖中A所指為在pro-oestrus期間先升高再下降的曲線，最可能是estrogen（A）。）","we":["Estrogen在pro-oestrus期間升高達峰，引發LH surge後下降，若圖中顯示此模式，A為暫定答案。","Progesterone在ovulation後由黃體分泌，diestrus時維持高值，若圖示為持續高值則為B。","LH（促黃體素）在排卵前急速升高（LH surge），呈現短暫明顯峰值，若圖示為此則為C。","FSH在pro-oestrus升高，但變化不如LH那麼明顯，D可能性相對較低。"],"needs_review":true,"imgs":[]},{"id":"AMO_2023_普通病_075","year":2023,"roc_year":112,"session":"","examNo":75,"q":"承上題，母犬陰道有多量血液樣分泌物，最可能是處於動情週期的那一個階段？","opts":["A. late pro-oestrus","B. late oestrus","C. early metoestrus","D. anoestrus"],"ans":0,"exp":"母犬陰道多量血液樣分泌物最常見於「late pro-oestrus（動情前期晚期）」，此期子宮出血最多，分泌物量最大，以血液樣為主，A正確。","we":["Late pro-oestrus（動情前期晚期）：子宮出血最多，血液樣分泌物量最大，A正確。","Late oestrus（動情期晚期）：血液樣分泌物減少，轉為清澈黏液，B不是多量血液樣的時期。","Early metoestrus（後動情期早期）：有中性球出現在陰道抹片，分泌物通常減少，C不正確。","Anoestrus（休情期）：無分泌物或極少量，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_076","year":2023,"roc_year":112,"session":"","examNo":76,"q":"有關母犬子宮蓄膿（pyometra）之敘述，下列何者最不適當？","opts":["A. 母犬若先前有使用外源性助孕素藥物來干擾動物週期之情形時，該母犬較易發生子宮蓄膿","B. 若飼主選擇內科治療時，可單獨使用前列腺素（prostaglandin）治療 closed-cervix pyometra","C. 患畜常伴隨有子宮內膜囊樣性增生（cystic endometrial hyperplasia）","D. 子宮蓄膿好發時間點為母犬發情結束後5～80天"],"ans":1,"exp":"問「最不適當」。B說可「單獨使用PGF2α治療closed-cervix pyometra」——這是危險的做法！Closed-cervix pyometra因子宮頸封閉，PGF2α強制收縮子宮可能造成子宮破裂或膿液逆流入腹腔，風險極高，B最不適當。","we":["曾使用外源性progestins干擾動情週期→子宮對細菌敏感性增加→易發生子宮蓄膿，A描述正確。","PGF2α對open-cervix pyometra有效，但「單獨用於closed-cervix pyometra」風險極高（可能子宮破裂），B最不適當。","子宮內膜囊樣性增生（CEH）常與子宮蓄膿並存（CEH-pyometra complex），C描述正確。","母犬子宮蓄膿好發在發情結束後5-80天（diestrus期間，黃體期），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_077","year":2023,"roc_year":112,"session":"","examNo":77,"q":"在繁殖管理不當的牧場，從精液抹片中可觀察下列精子型態異常比例偏高，得以判定種公畜有過度使用的問\r   題？","opts":["A. 精子頭部呈梨形（pyriform head）","B. 精子頭部與尾部交接處折斷（fractured neck）","C. 精子尾巴具有原生質滴（protoplasmic droplets）","D. 精子尾巴後端往其頭側彎曲形成環狀（looped tail）"],"ans":2,"exp":"種公畜過度使用（overuse）→精子在副睾中通過過快，未完全成熟→精子帶有「原生質滴（protoplasmic droplets）」比例增高。原生質滴是精子發育中殘留的細胞質，成熟精子應已脫落，C正確。","we":["梨形頭（pyriform head）通常是遺傳性問題或睾丸疾病，不特別與過度使用相關，A不典型。","頸部斷裂（fractured neck）通常是機械性損傷（採精、處理不當），不是過度使用的標誌，B不典型。","原生質滴（protoplasmic droplets）增多是精子未成熟的標誌，過度使用時精子「加速通過」副睾→未能脫落原生質滴，C正確。","環狀尾（looped tail）通常與低滲/高滲環境損傷有關，不特別是過度使用的標誌，D不典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_078","year":2023,"roc_year":112,"session":"","examNo":78,"q":"有關於母牛發生產後低血鈣症，下列何項敘述最為正確？","opts":["A. 正常牛血鈣濃度平均約為6.3 mg/dL","B. 分娩後兩天完全不榨乳可作為預防或治療","C. 乾乳期給低鈣飼糧可作為預防方法","D. 產前3週餵食高陽離子飼糧可作為預防方法"],"ans":2,"exp":"問「最正確」。C說「乾乳期給低鈣飼糧可作為預防方法」——正確！乾乳期（dry period）低鈣飼糧刺激PTH分泌和骨鈣動員機制，使身體在分娩時能快速調動鈣，預防產後低血鈣症。","we":["正常牛血鈣濃度約為8.5-10.5 mg/dL，6.3 mg/dL是低血鈣值，A的說法錯誤（6.3不是正常值）。","完全不榨乳不是預防低血鈣的有效方法，且對乳房有害，B描述不正確。","乾乳期低鈣飼糧→活化PTH和calcitriol調節機制→分娩時能快速補充血鈣，C是有效且正確的預防方法。","應給予「陰離子飼糧（anionic diet）」或「低DCAD飼糧」（低陽離子），而非「高陽離子飼糧」，高陽離子（Na+, K+）飼糧反而加重代謝性鹼中毒，D描述相反。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_079","year":2023,"roc_year":112,"session":"","examNo":79,"q":"若乳牛場的懷孕配種次數（services per pregnancy）平均為2.8次，代表的意義為何？","opts":["A. 牛群懷孕率高","B. 牛群中應該有許多繁殖障礙問題","C. 牛群空胎期適當","D. 卵巢囊腫發生比率較高"],"ans":1,"exp":"Services per pregnancy（SPP）= 每次懷孕平均需要的配種次數，理想值約1.5-1.8次。SPP=2.8次遠高於理想值，表示受胎率低，需要多次配種才能懷孕，說明牧場中有「許多繁殖障礙問題」，B正確。","we":["SPP=2.8次高於正常值，代表懷孕率「低」，不是高，A描述相反。","SPP=2.8次遠高於理想值（1.5-1.8），代表牛群受胎率低，有許多繁殖障礙問題，B正確。","SPP=2.8次表示空胎期可能「過長」，不是適當，C描述相反。","卵巢囊腫發生比率高可能是原因之一，但SPP高最直接反映的是整體繁殖障礙問題，D不是最直接的結論。"],"needs_review":false,"imgs":[]},{"id":"AMO_2023_普通病_080","year":2023,"roc_year":112,"session":"","examNo":80,"q":"牛隻濾泡囊腫時，下列何種症狀較為罕見？","opts":["A. 慕雄狂","B. 不發情","C. 帶血的黏液","D. 經常駕乘其他牛隻"],"ans":2,"exp":"問「較為罕見」的症狀。牛隻濾泡囊腫（follicular cysts）→持續分泌雌激素→慕雄狂（nymphomania，A）、頻繁駕乘（D）是典型症狀。不發情（B）也可能（某些囊腫不產生典型行為）。帶血的黏液（C）不是濾泡囊腫的典型症狀，C較為罕見。","we":["慕雄狂（nymphomania）是濾泡囊腫因持續高雌激素所致，A是常見症狀。","不發情（anestrus）也可能發生（某些囊腫為「安靜型」），但不如慕雄狂典型，B有一定發生率。","帶血的黏液（bloody mucus）不是濾泡囊腫的典型症狀，C較為罕見，C正確。","頻繁駕乘其他牛隻是慕雄狂的表現之一，D是常見症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_001","year":2024,"roc_year":113,"session":"","examNo":1,"q":"馬主人表示有一匹馬持續5週呈現間歇性發燒（>38.6°C），精神及食慾皆差，心跳及呼吸次數在正常值範圍\r  或稍高，腸蠕動音減少，直腸觸診無異常，血檢白血球總數偏高，下列疾病何者可能性最低？","opts":["A. 細菌性肺炎","B. 慢性腹膜炎","C. 細菌性心內膜炎","D. 十二指腸炎及近端小腸炎（duodentitis-proximal jejunitis）"],"ans":3,"exp":"問「最不可能」的診斷。犬隻間歇性發燒5週合併WBC升高，最不可能是十二指腸炎（近端小腸炎），因此類腸道發炎通常不會引起持續高燒。蜱媒疾病（tick-borne disease）、心內膜炎（endocarditis）、骨髓炎（osteomyelitis）等感染源較常造成持續間歇性發燒。","we":["蜱媒疾病（如艾利希體症）可引起週期性發燒及白血球變化，是鑑別診斷之一。","心內膜炎細菌菌血症可造成間歇性發燒及WBC升高，應列入鑑別。","骨髓炎或深部感染可引起持續性發燒，需考慮。","十二指腸炎（近端小腸炎）屬腸道疾病，通常以嘔吐、腹痛為主，不常引起持續性高燒，故為最不可能診斷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_002","year":2024,"roc_year":113,"session":"","examNo":2,"q":"一匹馬疑似前肢蹄葉炎時，以放射線學檢查時，下列何種照射方向最適合用於觀察蹄骨角度是否旋轉，並可\r  用以測量其角度？","opts":["A. lateromedial view","B. dorsopalmar view","C. dorsoproximal-palmarodistal oblique（upright pedal）view","D. flexed dorsolateral-palmaromedial oblique view"],"ans":0,"exp":"蹄骨旋轉（pedal bone rotation）的診斷最佳攝影方向為lateromedial（側正位），可清楚觀察蹄骨相對於蹄壁的角度變化。","we":["Lateromedial view 是評估蹄骨旋轉的標準投影，可看到蹄骨與蹄壁的關係角度。","Dorsopalmar view 主要評估蹄部橫向結構，較難判斷旋轉程度。","Palmaroproximal-palmarodistal（navicular view）專用於舟狀骨評估。","Skyline view 用於特定結構評估，非蹄骨旋轉首選。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_003","year":2024,"roc_year":113,"session":"","examNo":3,"q":"下圖為馬前肢放射線影像圖，下列敘述何者正確？","opts":["A. 圖之右側為外側","B. A 為 3rd metacarpal bone","C. B 為 carpometacarpal joint","D. C 為 radial carpal bone"],"ans":0,"exp":"（此題依賴圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_004","year":2024,"roc_year":113,"session":"","examNo":4,"q":"下圖為馬匹右前肢病灶，觸診無疼痛感，無溫熱感，左前肢無此病灶，下列敘述何者最符合此馬之狀況？","opts":["A. 右前肢通常無跛行","B. 蜂窩組織炎可能性高","C. 右前肢舟骨病（navicular bone disease）","D. 賽前密集訓練的結果"],"ans":0,"exp":"（此題依賴圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_005","year":2024,"roc_year":113,"session":"","examNo":5,"q":"馬匹 deep digital flexor tenotomy可用於治療下列何種疾病？","opts":["A. 新生小馬angular limb deformity","B. 蹄骨已呈旋轉之蹄葉炎","C. 白線病","D. 舟骨病（navicular bone disease）"],"ans":1,"exp":"蹄骨旋轉嚴重且無法保守治療時，deep digital flexor tenotomy（深指屈肌肌腱切斷術）可釋放對蹄骨的屈曲張力，改善旋轉。","we":["Corrective shoeing（矯正蹄鐵）屬保守治療，對輕症有效，但嚴重旋轉時效果有限。","Deep digital flexor tenotomy 切斷肌腱，釋放旋轉張力，為嚴重蹄葉炎蹄骨旋轉的外科介入選項。","Hoof resection 屬慎選術式，需依病況決定。","Coffin joint arthrodesis 為末期融合術，非第一線手術。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_006","year":2024,"roc_year":113,"session":"","examNo":6,"q":"承上題，其手術部位應該在何處？","opts":["A. hock area","B. navicular bone","C. palmar aspect of midmetacarpal area","D. dorsal aspect of midmetacarpal area"],"ans":2,"exp":"DDFT（deep digital flexor tendon）手術入路最常選擇掌骨中段掌側（palmar aspect of midmetacarpal area），該部位組織覆蓋少，易於操作且術後復原較佳。","we":["背側入路（dorsal）易接觸伸肌腱，非DDFT手術入路。","蹄部（hoof）入路組織密度高，操作困難，非首選。","掌骨中段掌側（palmar aspect of midmetacarpal）是DDFT手術的標準入路，視野好、組織層次清晰。","遠端球節（fetlock）入路可能干擾關節結構，非標準DDFT入路。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_007","year":2024,"roc_year":113,"session":"","examNo":7,"q":"有關馬上頷竇圓鋸術之敘述，下列何項錯誤？","opts":["A. 此手術通常可用來治療馬的上頷竇炎","B. 圓鋸部位在鼻甲部額竇的後部","C. 圓鋸部位通常位於鼻骨較為寬闊之處","D. 皮膚圓形切口的直徑應稍大於圓鋸之直徑"],"ans":1,"exp":"問何者「錯誤」。額竇手術的環鋸術（trephination）位置應在maxillary sinus（上頜竇），而非turbinate frontal sinus（鼻甲-額竇）。選項B描述環鋸位置錯誤，故B為最不正確的敘述。","we":["鼻竇炎的抗生素治療需根據培養結果選擇，長期使用是必要的，描述正確。","環鋸術的位置若描述為turbinate frontal sinus是錯誤的；馬的上頜竇（maxillary sinus）才是最常見的環鋸部位。","沖洗鼻竇可作為輔助治療，描述方向正確。","牙根感染（tooth root infection）是馬鼻竇炎的常見原因，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_008","year":2024,"roc_year":113,"session":"","examNo":8,"q":"關於乳牛亞急性瘤胃酸中毒，下列敘述何者最不恰當？","opts":["A. 亞急性瘤胃酸中毒牛隻瘤胃液的pH值通常在5.0～5.5之間","B. 由於瘤胃壁的傷害，可能造成繼發的肝臟膿瘍","C. 通常在2～3天內食入大量短纖維與澱粉時，因產生乳酸堆積造成","D. 得病牛隻通常會有乳量下降、乳脂率上升的情形"],"ans":3,"exp":"亞急性瘤胃酸中毒（SARA）會導致乳脂率「降低」，而非升高。瘤胃pH下降造成瘤胃生物相改變，乙酸產量減少，乳脂合成前驅物不足，故乳脂率下降。選項D說乳脂升高是錯誤的。","we":["SARA確實與採食行為異常及採食量下降有關，描述正確。","SARA時瘤胃pH持續低於5.5-5.8，牛隻可能出現蹄葉炎，描述正確。","纖維素分解菌減少而澱粉分解菌增加是SARA的特徵，描述正確。","SARA導致乳脂率「下降」（因乙酸減少），而非升高；D是錯誤描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_009","year":2024,"roc_year":113,"session":"","examNo":9,"q":"某牧場主要以草梗較多的百慕達草作為牛隻主食，於該場診療牛隻時，發現牛隻下顎腫脹，觸診為單側下頷\r  有堅實團塊，放射線學檢查可見病灶區團塊內有放射狀影像與纖維化組織。開口檢查可見病灶同側臼齒根部 有瘻管形成，本病例最可能之診斷為何？","opts":["A. Actinomyces bovis感染","B. Actinobacillus lignieresii感染","C. 齒根膿瘍","D. 鱗狀上皮細胞瘤"],"ans":0,"exp":"Actinomyces bovis 是造成牛隻lumpy jaw（木質舌/骨放線菌症）的病原，侵犯下頷骨造成骨組織溶解與纖維化。","we":["Actinomyces bovis 感染下頷骨，造成granulomatous osteomyelitis，俗稱lumpy jaw，A正確。","Actinobacillus lignieresii 造成木舌病（wooden tongue），侵犯軟組織（舌），而非骨。","Fusobacterium necrophorum 與蹄腐病（foot rot）有關，非lumpy jaw病原。","Clostridium chauvoei 造成氣腫疽（blackleg），與lumpy jaw無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_010","year":2024,"roc_year":113,"session":"","examNo":10,"q":"下列何者不是導致肥胖牛症候群（fat cow syndrome）發生的誘因？","opts":["A. 長期處於能量負平衡狀態","B. 過度餵飼（over-feeding）精料","C. 脂肪肝","D. 高血糖"],"ans":0,"exp":"問「哪項不是誘發因子」。長期負能量平衡（negative energy balance）是脂肪肝/肥胖牛症候群的直接促發因素，故A「長期負能量平衡不是誘發因子」是錯誤的說法，A為正確答案。","we":["長期負能量平衡正是脂肪牛症候群的核心誘因，A的說法錯誤，因此A為最不正確的選項。","分娩前過度肥胖確實是risk factor，非錯誤敘述。","泌乳高峰期採食量不足導致能量缺口，是誘發因子，描述正確。","過多精料可能誘發代謝疾病，但在此情境下描述合理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_011","year":2024,"roc_year":113,"session":"","examNo":11,"q":"下列何者對預防牛隻罹患乾乳期乳房炎最沒有效果？","opts":["A. 泌乳期結束進入乾乳時給予乳房內灌注乾乳期抗生素藥膏","B. 乾乳牛牛舍保持乾燥與清潔","C. 使用乳頭密封膠","D. 為避免分群緊迫，讓乾乳牛與泌乳牛持續混養在同一牛群"],"ans":3,"exp":"問「最不有效的預防措施」。混合乾乳牛與泌乳牛管理（D）不但無助於預防乳房炎，反而可能增加交叉感染風險，是最無效的預防措施。","we":["定期乳頭消毒（post-dipping）是預防傳染性乳房炎的有效措施。","乾乳牛治療（DCT）可清除亞臨床感染，是有效預防策略。","定期體細胞數監控可早期發現並治療，有效降低乳房炎盛行率。","混合乾乳牛與泌乳牛容易造成細菌交叉傳播，是最不有效的預防措施。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_012","year":2024,"roc_year":113,"session":"","examNo":12,"q":"關於牛隻黴漿菌性乳房炎，下列敘述何者正確？","opts":["A. 可能增加場內小牛呼吸道疾病的風險","B. 主要引起臨床性乳房炎","C. 與牛隻黴漿菌乳房炎最相關的菌種為               Mycoplasma bovigenitalium","D. 不會引起乳量下降"],"ans":0,"exp":"Mycoplasma bovis 乳房炎除造成牛隻泌乳問題外，其分泌乳汁可能污染代用乳，導致飲用代用乳的犢牛發生呼吸道疾病（respiratory disease），A正確。","we":["Mycoplasma bovis 可透過初乳/代用乳傳給犢牛，造成犢牛關節炎、肺炎，A正確。","Mycoplasma bovis 乳房炎對抗生素治療反應差，並非因為細胞壁缺乏而對所有抗生素無效（僅對作用在細胞壁的藥物無效）。","Mycoplasma 不易在環境中長期存活，主要透過接觸傳播，環境污染程度相對有限。","Mycoplasma 乳房炎通常造成乳汁異常（水樣、有沉澱物），多個乳區同時受影響，但並非所有案例皆如此。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_013","year":2024,"roc_year":113,"session":"","examNo":13,"q":"獸醫師至現場檢查牛隻，發現其鞏膜黃染，該牛最不可能有下列那一種情形？","opts":["A. 體內出血","B. 體外出血","C. 肝臟疾病","D. 血管內溶血"],"ans":1,"exp":"問「最不可能造成黃疸（icterus）」的原因。外出血（external hemorrhage）造成血液流失，並不直接導致紅血球內血紅素大量溶血或肝臟功能障礙，因此最不可能引起黃疸。","we":["溶血性貧血（hemolytic anemia）大量RBC破壞→大量膽紅素→黃疸，是常見原因。","外出血（external hemorrhage）血液流失，膽紅素不會因此大量釋放，最不可能造成黃疸。","膽汁淤積（cholestasis）阻礙膽汁排出→結合膽紅素升高→黃疸，是常見原因。","肝臟疾病（hepatic disease）影響膽紅素代謝，可造成黃疸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_014","year":2024,"roc_year":113,"session":"","examNo":14,"q":"有關牛隻頭頸部進行理學檢查之敘述，下列何者最正確？","opts":["A. 進行頸靜脈壓迫性試驗時，若用手指壓迫後，再放開，發現頸靜脈不下沉，表示左心衰竭","B. 若鼻腔發現膿性分泌物，則表示其有肺炎","C. 威嚇反應（menace reflex）若使用於小於2週齡之牛隻沒有太大價值","D. 若要檢查口腔，必須將其舌頭向前方伸長拉出才能檢查"],"ans":2,"exp":"威脅反射（menace response）在2週齡以下的犢牛尚未成熟，此反射需要視覺皮質整合，犢牛神經系統發育未完全，2週內無法可靠評估，故C最正確（<2週犢牛威脅反射無助於神經學評估）。","we":["瞳孔對光反射（PLR）在新生犢牛即存在，可作為神經學評估指標。","肌腱反射（tendon reflexes）在犢牛出生後即可評估。","威脅反射（menace reflex）需要視覺皮質參與，在<2週齡犢牛尚未發育完全，不適合用於評估，C正確。","姿勢反應（postural reactions）在新生犢牛可作部分評估，但需考慮發育階段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_015","year":2024,"roc_year":113,"session":"","examNo":15,"q":"下列有關牛隻臨床性低血鈣症，以葡萄糖鈣注射進行治療，何者最正確？","opts":["A. 由於治療後血鈣會快速上升，因此無論臨床症狀的輕重，治療後效果都很好","B. 每100公斤的牛隻體重給予2公克鈣（2g Ca/100 kg body weight）是有效的","C. 以肌肉注射的方式常會造成肌肉壞死，故在本治療之給藥途徑是禁止使用的","D. 由於治療時能快速給予鈣是重要的，應以皮下方式給予，每一個注射位置應儘可能給予100～150mL之葡萄   糖鈣液"],"ans":1,"exp":"牛生產性低血鈣（milk fever）的靜脈鈣補充：2 g Ca/100 kg BW是有效且安全的劑量，B正確。","we":["口服鈣劑需要消化吸收，在危急低血鈣時效果太慢，非首選。","靜脈給予2 g Ca/100 kg BW是治療牛低血鈣的有效劑量，B正確。","高劑量鈣靜脈注射可能造成心律不整，需緩慢給藥，過高劑量有害。","皮下注射鈣的吸收速度介於靜脈與口服之間，常與IV合併使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_016","year":2024,"roc_year":113,"session":"","examNo":16,"q":"對於圈飼小牛引起的細菌性肺炎之治療與預防的敘述，下列何者最不恰當？","opts":["A. 一般治療pasteurellosis的抗生素療程至少為3～5天","B. 治療 Mannheimia haemolytica引起之肺炎，合併使用類固醇消炎劑較非類固醇消炎劑效果好","C. 小牛舍保持良好通風有預防效果","D. 運輸前可先預防性投予長效型抗生素"],"ans":1,"exp":"問「何者不正確」。對於Mannheimia haemolytica引起的牛肺炎，NSAIDs（如flunixin）效果比corticosteroids好，因為NSAIDs可降低發炎介質並維持免疫功能；類固醇有免疫抑制效果，反而不建議。B說類固醇優於NSAIDs是錯誤的。","we":["抗生素治療（如florfenicol、enrofloxacin）是Mannheimia肺炎的核心治療，描述正確。","Corticosteroids的效果「不優於」NSAIDs用於牛隻細菌性肺炎；類固醇有免疫抑制效果，可能加重感染，B是錯誤敘述。","NSAIDs（如flunixin meglumine）可降低發炎反應，改善預後，是輔助治療，描述正確。","早期診斷與治療對預後影響大，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_017","year":2024,"roc_year":113,"session":"","examNo":17,"q":"小牛感染rotavirus以及enterotoxigenic E. coli時，其造成下痢的致病機序分別為何？","opts":["A. hypomotility以及malabsorption","B. 兩者皆為hypermotility","C. malabsorption以及hypersecretion","D. hypertrophy以及osmosis"],"ans":2,"exp":"Rotavirus造成小腸絨毛受損→吸收不良性腹瀉（malabsorption diarrhea）；ETEC（大腸桿菌，K99型）分泌腸毒素→高分泌性腹瀉（hypersecretion diarrhea），C正確。","we":["Rotavirus和ETEC都是新生犢牛/仔豬腹瀉的常見病原，A描述的機制有誤。","Rotavirus造成的是吸收不良性腹瀉（villous atrophy→malabsorption），非高分泌性，B的描述相反。","Rotavirus→malabsorption；ETEC→hypersecretion，C正確描述各自機制。","Coronavirus也會造成腸絨毛萎縮，但ETEC是高分泌性，D混淆了機制。"],"needs_review":false,"imgs":[]},{"i
