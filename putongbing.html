d":"AMO_2024_普通病_018","year":2024,"roc_year":113,"session":"","examNo":18,"q":"新生的小牛兩前肢呈現圖片中的外觀，其最有可能的診斷為下列何項？","opts":["A. polyarhtritis","B. flexural deformities","C. septic arthritis","D. rickets"],"ans":1,"exp":"（此題可能依賴圖片。）屈曲肢變形（flexural deformities）在犢牛中，輕度可保守治療（夾板、物理治療），嚴重者需手術切斷韌帶/肌腱。","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_019","year":2024,"roc_year":113,"session":"","examNo":19,"q":"methylene blue可用於治療牛隻何種中毒？","opts":["A. 草酸鹽中毒","B. 亞硝酸鹽中毒","C. 洋蔥中毒","D. 羊齒類中毒"],"ans":1,"exp":"亞硝酸鹽（nitrite）中毒造成高鐵血紅素血症（methemoglobinemia），治療用亞甲藍（methylene blue），靜脈給藥後可將Fe³⁺還原為Fe²⁺，恢復攜氧能力。","we":["Atropine 用於有機磷/胺基甲酸酯中毒，非亞硝酸鹽中毒的解毒劑。","Methylene blue（亞甲藍）是亞硝酸鹽/硝酸鹽中毒（高鐵血紅素血症）的特效解毒劑，B正確。","Activated charcoal 可用於早期毒物吸附，但無法逆轉已形成的methemoglobin。","Sodium thiosulfate 用於氰化物中毒，非亞硝酸鹽中毒的治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_020","year":2024,"roc_year":113,"session":"","examNo":20,"q":"下列何者為乳牛乳房炎之接觸傳染性（contagious）病原菌？","opts":["A. 異乳鏈球菌（ Streptococcus dysgalactiae）","B. 乳房鏈球菌（Streptococcus uberis）","C. 金黃色葡萄球菌（Staphylococcus aureus）","D. 大腸桿菌（Escherichia coli）"],"ans":2,"exp":"問「傳染性乳房炎（contagious mastitis）的病原」。Staphylococcus aureus 是最重要的傳染性乳房炎病原，在擠乳過程中透過乳頭傳播，C正確。","we":["E. coli 屬環境性乳房炎病原，不是傳染性乳房炎的典型病原。","Streptococcus uberis 主要是環境性（environmental）病原。","Staphylococcus aureus 是典型的傳染性乳房炎（contagious mastitis）病原，牛對牛傳播，C正確。","Klebsiella spp. 屬環境性乳房炎病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_021","year":2024,"roc_year":113,"session":"","examNo":21,"q":"牛隻吞入金屬異物至蜂巢胃造成胃壁穿刺後，最不可能引起下列何種臟器之創傷？","opts":["A. 肝","B. 心","C. 脾","D. 肺"],"ans":3,"exp":"問「最不可能被網胃異物穿透的器官」。肺臟（lung）位於胸腔且有橫膈保護，網胃異物通常向前方穿透，較易傷及心包（pericardium）、肝臟、脾臟，而非直接到達肺臟，D正確為最不可能。","we":["心包（pericardium）位於網胃前方，是最常被異物穿透的部位之一。","肝臟位於右側前腹，網胃異物可向右穿透到肝，常見。","脾臟位於左側，網胃異物也可能向左穿刺到脾。","肺臟（lung）有橫膈及胸膜保護，且距離網胃較遠，最不容易直接被穿透。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_022","year":2024,"roc_year":113,"session":"","examNo":22,"q":"關於牛隻腹脅部手術時施行的脊柱旁阻斷麻醉（paravertebral block），下列敘述何者錯誤？","opts":["A. 使用Magda's method與Farquharson method所阻斷的神經群不同","B. Farquharson method進行阻斷時通常會穿透脊椎橫突間韌帶","C. Magda's method進行阻斷時需於脊椎橫突背側面與腹側面注射","D. 相較於Magda's method，使用Farquharson method進行阻斷所需之注射針較長"],"ans":0,"exp":"問何者「錯誤」。A說兩種方法（cornual nerve block和 Peterson's block）阻斷「不同」神經群，這是錯誤的——兩者都是去角神經阻斷，都針對cornual nerve（角神經）的不同阻斷位置，最終阻斷的感覺傳入是相似的。","we":["兩種去角神經阻斷術（如proximal cornual block和Peterson's block）雖施術位置不同，但最終都阻斷角部的感覺神經，A說「不同神經群」是錯誤的。","去角局部麻醉後再進行去角手術可有效降低疼痛，描述正確。","Peterson's eye block 阻斷多條顱神經，適用於眼部手術，描述正確。","角神經（cornual nerve）是三叉神經的分支，描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_023","year":2024,"roc_year":113,"session":"","examNo":23,"q":"下列那一種牛隻疾病最不會在體壁右側聽扣診時出現金屬音（ping sound）？","opts":["A. 瘤胃塌陷（rumen collapse）","B. 瘤胃腹囊積氣（gas in ventral sac of rumen）","C. 小腸擴張（distention of the small intestine）","D. 直腸積氣（pneumorectum）"],"ans":3,"exp":"問「不會造成右側ping的原因」。Pneumorectum（直腸進氣）位於後腹腔，不會在右側前腹造成ping聲，D正確。","we":["右側皺胃變位（RDA/RTA）可造成右側前腹ping。","盲腸臌脹可在右腹後方造成ping。","小腸臌脹（如腸扭轉）可在右側腹造成ping。","Pneumorectum 氣體在直腸，位置偏後，不會造成右側前腹典型ping聲，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_024","year":2024,"roc_year":113,"session":"","examNo":24,"q":"使用體外穿刺（blink tack）加上Toggle pin治療牛隻第四胃異位時，下列何者最不可能是術後併發症？","opts":["A. 第四胃瘻管","B. 第四胃破裂","C. 瀰漫性腹膜炎","D. 肝臟穿刺傷"],"ans":1,"exp":"Toggle pin固定術（皺胃復位）最少見的併發症是皺胃穿孔/破裂（abomasal rupture）；較常見的問題是局部腹膜炎、復位失敗等。B正確為最不常見的併發症。","we":["局部腹膜炎（peritonitis）是toggle pin術後較常見的併發症，非最少見。","皺胃破裂（abomasal rupture）在toggle pin術後非常罕見，是最不可能的併發症，B正確。","皺胃再次變位（recurrence）是toggle pin術已知的缺點之一，並不少見。","網膜沾黏是腹腔手術的常見後遺症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_025","year":2024,"roc_year":113,"session":"","examNo":25,"q":"以右脇腹大網膜固定術（right-flank omentopexy）及幽門固定術（pyloropexy）治療乳牛第四胃異位之術\r   後併發症，下列何項最為常見？","opts":["A. 第四胃破裂","B. 幽門狹窄","C. 異位復發","D. 肝臟膿瘍"],"ans":2,"exp":"右側腹腔切開大網膜固定術（right flank omentopexy）後，皺胃再次變位（displacement recurrence）比其他術式更常見，C正確。","we":["通氣管引流（trocar decompression）是緊急減壓措施，不是長期預防再發的手術。","右側腹腔切開僅減壓但不固定，復發率高。","右側腹腔切開大網膜固定術（right flank omentopexy）因固定效果相對不確實，再發率高於pyloric omentopexy，C正確。","幽門網膜固定術（pyloric omentopexy）固定效果較好，復發率相對較低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_026","year":2024,"roc_year":113,"session":"","examNo":26,"q":"下列何項是可吸收縫線？","opts":["A. nylon","B. polyesters","C. silk","D. polydioxanone"],"ans":3,"exp":"問「哪種縫線是可吸收的」。Polydioxanone（PDS）是可吸收合成縫線，在體內水解，D正確。","we":["Polypropylene（prolene）是不可吸收縫線，常用於血管或皮膚縫合。","Polyester（dacron）是不可吸收縫線，常用於心臟瓣膜修補等。","Nylon 是不可吸收縫線（或極慢吸收），常用於皮膚縫合。","Polydioxanone（PDS）是可吸收縫線，吸收時間約180天，常用於腹壁或軟組織縫合，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_027","year":2024,"roc_year":113,"session":"","examNo":27,"q":"下列四種日糧給予方式中，何項最能防止山羊之姙娠毒血症？","opts":["A. 於懷孕末期提供適當比例之穀類","B. 於懷孕末期提供較高比例之乾草","C. 於懷孕前期提供適當比例之穀類","D. 於懷孕前期提供較高比例之乾草"],"ans":0,"exp":"山羊在妊娠後期給予適量穀物（grain）可提供能量，預防妊娠毒血症（pregnancy toxemia）。減少懷孕末期的負能量平衡是預防的關鍵，A正確。","we":["妊娠後期補充適量穀物（grain）提供能量，可有效預防山羊妊娠毒血症（pregnancy toxemia），A正確。","妊娠期間過度限制飲食反而會加重負能量平衡，增加妊娠毒血症風險。","注射丙二醇（propylene glycol）是治療性措施，非預防性飼養管理策略。","分娩後才補充能量對預防妊娠毒血症已無效，預防需在懷孕期管理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_028","year":2024,"roc_year":113,"session":"","examNo":28,"q":"利用繩或鏈之器械進行成年豬隻保定時，該器械常繞在豬隻何部位？","opts":["A. 脖子","B. 耳後","C. 上顎","D. 前肢關節"],"ans":2,"exp":"成豬的保定方式：最適合成年豬（adult pig）的嘴部保定是使用鼻環（snout ring）或上顎固定器（upper jaw/snout restraint），C正確。","we":["僅保定後肢對成豬保定效果不佳，豬仍可掙扎。","耳標鉗夾耳不足以固定頭部，效果差。","成豬使用上顎（snout）固定繩（hog snare）是標準保定方法，可有效固定頭部，C正確。","小豬可以直接提拿，但成豬體重過大無法如此操作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_029","year":2024,"roc_year":113,"session":"","examNo":29,"q":"以urethral process amputation治療山羊尿道結石時，應切除下圖中那個部位？","opts":["A. A","B. B","C. C","D. D"],"ans":0,"exp":"（此題可能依賴圖片，需人工確認。）尿道突（urethral process）切除術是小反芻動物（綿羊、山羊）尿道阻塞的緊急處理。","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_030","year":2024,"roc_year":113,"session":"","examNo":30,"q":"仔豬比其他畜種較常發生直腸脫垂的主要原因為下列何項？","opts":["A. 豬直腸沒有韌帶固定","B. 仔豬腹腔收縮較為用力","C. 仔豬肛門組織較淺薄","D. 仔豬較常發生營養不良"],"ans":0,"exp":"仔豬直腸脫垂（rectal prolapse）比成豬更常見，原因是仔豬缺乏支撐直腸的韌帶組織（supporting ligaments），A正確。","we":["仔豬缺乏支撐直腸的韌帶，加上頻繁用力（如腹瀉），容易發生直腸脫垂，A正確。","腹瀉是誘因之一，但直接解剖原因是韌帶支撐不足。","飼料問題可誘發腹瀉進而促成脫垂，但非最主要解剖原因。","腸套疊與直腸脫垂是不同的疾病，不是直腸脫垂好發於仔豬的解釋。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_031","year":2024,"roc_year":113,"session":"","examNo":31,"q":"犬最常因為何種因素破壞淚腺組織造成犬乾眼症（keratoconjunctivitis sicca, KCS）？","opts":["A. 病毒感染","B. 藥物中毒","C. 免疫媒介","D. 手術切除第三眼瞼"],"ans":2,"exp":"犬隻乾眼症（KCS）最常見的原因是免疫介導性（immune-mediated dacryoadenitis），針對淚腺的自體免疫反應導致淚液產量下降，C正確。","we":["先天性無淚腺（congenital alacrima）極少見，不是最常見原因。","藥物毒性（如sulfonamide）可造成KCS，但相對少見。","免疫介導性KCS最常見，佔犬KCS約90%，C正確。","外傷或感染引起的KCS屬於繼發性，非最常見病因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_032","year":2024,"roc_year":113,"session":"","examNo":32,"q":"貓全身性高血壓（systemic hypertension）最不會引起下列那個器官的傷害（target organ damage）？","opts":["A. 眼","B. 腦","C. 腎臟","D. 肝臟"],"ans":3,"exp":"問「不是高血壓的目標器官」。犬貓高血壓的主要靶器官是眼（視網膜剝離）、腎（加重CKD）、心（心肥大）、腦（神經症狀）。肝臟（liver）不是高血壓的主要靶器官，D正確。","we":["眼睛（視網膜）是高血壓的重要靶器官，可造成視網膜出血、剝離及失明。","腎臟高血壓可加重腎絲球損傷，加速CKD進展。","心臟（心肌肥大、CHF）是高血壓靶器官之一。","肝臟不是高血壓的典型靶器官，D為最不正確的選項（肝臟不在主要target organ清單中）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_033","year":2024,"roc_year":113,"session":"","examNo":33,"q":"犬隻renin-angiotensin aldosterone system（RAAS）中，下列何種食物會刺激增加腎素（renin）由腎臟\r    juxtaglomerular cells分泌出？","opts":["A. 低脂食物","B. 低鈉食物","C. 高纖食物","D. 高糖食物"],"ans":1,"exp":"腎素-血管收縮素系統（RAAS）的啟動主因之一是低血鈉（hyponatremia）或低有效循環血量刺激腎小球旁器（juxtaglomerular cells）釋放腎素（renin），B正確。","we":["血管收縮素II（Ang II）升高會透過負回饋抑制腎素釋放，非刺激腎素的原因。","低血鈉（hyponatremia）降低有效循環血量，刺激腎素釋放，B正確。","高血壓本身會透過壓力感受器抑制腎素釋放，非刺激腎素的原因。","高血鈉通常伴隨水分滯留，不會刺激腎素分泌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_034","year":2024,"roc_year":113,"session":"","examNo":34,"q":"下圖（from Textbook of Veterinary Internal Medicine, Stephen J. Ettinger）為一隻犬以心電圖Lead    II, 25 mm/sec, 1 cm = 1 mV所記錄之結果，其心跳數最接近以下那個數值？","opts":["A. 80/min","B. 70/min","C. 60/min","D. 50/min"],"ans":0,"exp":"（此題依賴ECG圖片，需人工確認答案。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_035","year":2024,"roc_year":113,"session":"","examNo":35,"q":"下列何項疾病在老年犬貓最常呈現神經退化性病變（neurodegenerative disorder）且表現出許多行為上的\r    異常？","opts":["A. cervical spondylomyelopathy","B. peripheral neuropathies","C. vestibular diseases","D. cognitive dysfunction syndrome"],"ans":3,"exp":"老年犬認知功能障礙症候群（cognitive dysfunction syndrome, CDS）的臨床症狀包括迷失方向、睡眠週期改變、對主人認識減退等，D正確。","we":["癲癇（epilepsy）發作有典型的sudden onset和postictal期，與CDS的慢性漸進性不同。","肝腦病變（hepatic encephalopathy）有肝臟疾病背景，血氨升高，可以鑑別。","前庭疾病（vestibular disease）以頭偏轉（head tilt）、眼振（nystagmus）為主，非行為認知改變。","認知功能障礙症候群（CDS）以老年犬迷失方向、行為改變、夜間吠叫等為特徵，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_036","year":2024,"roc_year":113,"session":"","examNo":36,"q":"患有糖尿病之犬隻，下列何項檢查結果可用來診斷該犬有併發酮酸血症？","opts":["A. 高禁食血糖（>200 mg/dL）","B. 高禁食血糖與酮尿","C. 酮尿與代謝性酸中毒伴隨陰離子間隙（anion gap）上升","D. 尿糖與血中鉀離子上升"],"ans":2,"exp":"糖尿病酮酸中毒（DKA）的診斷三要素：酮尿（ketonuria）＋代謝性酸中毒（metabolic acidosis）＋高陰離子間隙（elevated anion gap），C正確組合。","we":["高血糖＋蛋白尿不是DKA的特異性組合，蛋白尿可見於多種腎臟疾病。","低血糖不是DKA的特徵，DKA通常有高血糖。","酮尿＋代謝性酸中毒＋高陰離子間隙是DKA的三大特徵，C正確。","高血鈉＋低血鉀可見於其他代謝疾病，非DKA特異性診斷組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_037","year":2024,"roc_year":113,"session":"","examNo":37,"q":"下列唑（azole）類抗黴菌藥物的特性，何項敘述最正確？","opts":["A. 高水溶性","B. 需與食物一起服用","C. H-2拮抗組織胺藥物可以增加口服吸收性","D. 制酸劑可增加消化道吸收性"],"ans":1,"exp":"抗黴菌藥物azoles（如itraconazole）需與食物一起服用以增加吸收，B正確（應與食物同服，而非空腹）。","we":["Azoles不需要靜脈注射，多數有口服劑型，且口服即可達到治療濃度。","Azoles（如itraconazole）需與食物同服以增加生物利用率，B正確（說「需注意要與食物同服」是正確的）。","Fluconazole的吸收受食物影響較小，但itraconazole等需與食物服用，C描述不全。","Azoles對真菌細胞膜的ergosterol合成有干擾效果，非直接殺菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_038","year":2024,"roc_year":113,"session":"","examNo":38,"q":"貓冠狀病毒腸炎與貓傳染性腹膜炎的差異在於下列何項？","opts":["A. 病毒分屬於不同血清型","B. 病毒在貓宿主的身體內突變造成吞噬球親和力增加，而引起傳染性腹膜炎","C. 患病貓的吞噬球發生突變造成吞噬功能喪失，而引起傳染性腹膜炎","D. 感染造成患病貓的嚴重免疫抑制，最終造成傳染性腹膜炎"],"ans":1,"exp":"貓傳染性腹膜炎（FIP）是FCoV（貓冠狀病毒）突變獲得巨噬細胞趨向性（macrophage tropism）後，大量複製並引發全身性免疫反應的結果，B正確。","we":["FCoV是透過糞-口途徑傳播的腸道冠狀病毒，但FIP不是直接由環境病毒引起，而是體內突變。","FCoV在貓腸道中突變獲得感染單核球/巨噬細胞的能力，全身播散引發FIP，B正確。","FIP不是由兩種不同病毒共同感染引起的，而是同一病毒的突變。","FCoV可以在多隻貓中傳播，但每隻貓體內獨立突變為FIP病毒才是發病關鍵，不是FIP病毒直接貓傳貓。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_039","year":2024,"roc_year":113,"session":"","examNo":39,"q":"絕大多數犬隻的化療後白血球數目最低點發生在用藥後的什麼時間？","opts":["A. 化療後1～3天","B. 化療後5～7天","C. 化療後10～14天","D. 化療後16～20天"],"ans":1,"exp":"化療後骨髓抑制的最低點（nadir）通常在給藥後5-7天，此時WBC最低、感染風險最高，B正確。","we":["化療後1-2天是急性毒性反應期（如嘔吐），非骨髓抑制nadir。","化療後5-7天是WBC nadir的典型時間，B正確。","14天後骨髓通常已開始恢復，已過nadir。","21天骨髓多已恢復至可接受程度，不是nadir。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_040","year":2024,"roc_year":113,"session":"","examNo":40,"q":"10歲絕育公黃金獵犬，因為全身周邊淋巴結腫大而就診。犬之食慾精神正常，疫苗、心絲蟲及外寄生蟲預防\r   皆完備。理學檢查發現周邊淋巴結大小約3至5公分直徑，胸腹腔放射線學影像正常、超音波檢查發現肝脾腫  大且有結節性混合回音性影像異常、血液及生化檢查正常。此病例之臨床分期為何？","opts":["A. Stage IIb","B. Stage IIIa","C. Stage IIIb","D. Stage IVa"],"ans":3,"exp":"犬隻淋巴瘤分期：Stage IVa為全身性淋巴結腫大＋肝脾腫大，但無全身性症狀（a = 無，b = 有），D正確。","we":["Stage I 只有單一淋巴結受影響。","Stage II 為局部多個淋巴結受影響。","Stage III 為全身性淋巴結腫大。","Stage IVa：全身性淋巴結腫大＋肝脾腫大，無全身性症狀（substage a），D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_041","year":2024,"roc_year":113,"session":"","examNo":41,"q":"大型犬隻四肢骨之骨瘤好發於下列何部位？","opts":["A. 長骨骨骺（epiphysis）","B. 長骨骨幹（diaphysis）","C. 長骨幹骺（metaphysis）","D. 長骨之皮質骨、密質骨（cortical bone）"],"ans":2,"exp":"大型犬四肢骨的骨肉瘤（osteosarcoma）好發於長骨「幹骺端」（metaphysis），尤其是遠端橈骨（distal radius）、近端肱骨（proximal humerus）、遠端股骨（distal femur）等。","we":["骨骺（epiphysis）是關節面位置，骨瘤較少起源於此。","骨幹（diaphysis）中段的骨瘤少見，骨肉瘤較少發生在純骨幹部位。","幹骺端（metaphysis）含有豐富的骨形成細胞，是犬骨肉瘤最好發的部位，C正確。","皮質骨/密質骨骨瘤雖存在，但骨肉瘤最典型好發是幹骺端，D不是最好答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_042","year":2024,"roc_year":113,"session":"","examNo":42,"q":"下列那一種症狀並非犬隻高分級肥大細胞瘤之副腫瘤症候群（paraneoplastic syndromes）？","opts":["A. 胃潰瘍、腸胃道出血、黑便","B. 紅斑（Darier's sign）、紅腫","C. 延長凝血時間，凝血功能異常","D. 副甲狀腺亢進及高血鈣"],"ans":3,"exp":"高分級肥大細胞瘤（high-grade MCT）的副腫瘤症候群（paraneoplastic syndromes）包括：胃潰瘍（histamine→胃酸）、Darier's sign（局部組織胺釋放）、凝血異常（heparin from mast cells）。高血鈣（hypercalcemia）是淋巴瘤的副腫瘤症候群，與MCT的副甲狀腺亢進無直接關係，D是最不符合的選項。","we":["胃潰瘍/GI出血是MCT最常見的副腫瘤症候群，由組織胺刺激H2受體引起，A正確。","Darier's sign（觸摸腫瘤引起的局部風疹/紅斑）是MCT組織胺釋放的特徵，B正確。","肥大細胞釋放肝素（heparin）可干擾凝血功能，C正確（MCT確實有此副腫瘤症候群）。","副甲狀腺亢進/高血鈣是淋巴瘤的副腫瘤症候群，不是MCT的典型表現，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_043","year":2024,"roc_year":113,"session":"","examNo":43,"q":"有關犬隻肝臟疾病之膳食建議，下列何者最正確？","opts":["A. 以少量多餐的方式給予高蛋白食品，以補充下降的肝臟功能造成之蛋白質低下","B. 避免給予高脂肪食品，尤其在出現膽汁淤積的患犬更要避免","C. 由於碳水化合物的代謝常有擾亂情形，應該以單醣類碳水化合物為主，避免給予複雜之碳水化合物","D. 非發酵性纖維可以降低肝腦病變的機會，應該要多加補充"],"ans":1,"exp":"犬肝臟疾病的膳食建議：膽汁淤積（cholestasis）時應避免高脂肪飲食，因為脂肪消化需要膽鹽，而膽汁淤積時膽鹽排出受阻，B正確。","we":["肝病患犬的蛋白質來源應為高品質易消化蛋白，「高蛋白」不適合肝腦病變患犬，A有誤。","膽汁淤積時膽鹽進入腸道減少，脂肪消化吸收障礙，應避免高脂肪，B正確。","肝病患犬應給予複雜碳水化合物而非單醣，單醣不利於血糖穩定，C有誤。","應給予「發酵性纖維」（fermentable fiber，如psyllium）而非非發酵性纖維，發酵性纖維有助於降低血氨（NH3），D有誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_044","year":2024,"roc_year":113,"session":"","examNo":44,"q":"6歲已絕育公短毛家貓，體重4.5公斤，因為精神沉鬱、食慾不佳、體重下降而就診。該病畜無預防接種及心   絲蟲或外寄生蟲預防。就診時呼吸急促，體溫39.8oC，血檢每µl WBC 22000, neu. 18000, lym. 1200,  mon. 2800, RBC 3.5x10 6 , non-regenerative anemia, Alb 2.8, Glo 4.7, A/G ratio = 0.59，血清電泳  顯示α-2 spike and broad-based β-γ polyclonal gammopathies，該貓最可能的診斷為下列何項？","opts":["A. 多發性骨髓瘤（multiple myeloma）","B. 貓傳染性腹膜炎（feline infectious peritonitis）","C. 貓小病毒感染（feline parvoviral enteritis）","D. 貓淋巴性白血病（feline lymphocytic leukemia）"],"ans":1,"exp":"6歲已絕育公貓，WBC升高、淋巴球低下、非再生性貧血、低A/G比值（0.59）、血清電泳顯示polyclonal gammopathy（多克隆免疫球蛋白升高）——這是FIP的典型血清電泳表現。多發性骨髓瘤呈現monoclonal spike（M-spike），非polyclonal。","we":["多發性骨髓瘤（multiple myeloma）呈現「單克隆」（monoclonal）免疫球蛋白spike，非polyclonal，與本例不符。","貓傳染性腹膜炎（FIP）：低A/G比值、polyclonal hypergammaglobulinemia、淋巴球低下、非再生性貧血、高球蛋白，與本例完全吻合，B正確。","貓小病毒感染（parvoviral enteritis）以嚴重腸炎、嚴重白血球低下（尤其淋巴球、中性球皆低）為主，且是急性病程，不符合本例。","貓淋巴球性白血病通常呈現大量循環淋巴球，與本例淋巴球低下不符。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_045","year":2024,"roc_year":113,"session":"","examNo":45,"q":"下列有關犬隻嘔吐和反流的鑑別診斷，何項最正確？","opts":["A. 嘔吐物通常比反流的量為大","B. 反流物一定不會有膽汁","C. 反流物的pH值比嘔吐物高","D. 反流比嘔吐較不會出現流涎（salivation）或噁心（nausea）的現象"],"ans":2,"exp":"反流物（regurgitant）主要來自食道或咽部，pH偏中性或偏鹼（唾液pH約7），而嘔吐物（vomit）含有胃酸（pH 1-3），故反流物的pH較高，C正確。","we":["嘔吐物與反流量的大小並無絕對規律，A並非最正確的鑑別指標。","反流物若有膽汁逆流（如食道下段括約肌功能不全），「不一定」不含膽汁，B的「一定」描述過於絕對。","反流物來自食道（pH接近中性），嘔吐物含胃酸（pH極低），反流物pH確實較高，C正確。","反流比嘔吐較不會出現噁心/流涎是正確的（反流是被動機制），但C是更具體的診斷性鑑別指標。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_046","year":2024,"roc_year":113,"session":"","examNo":46,"q":"下列有關犬隻尿路導管放置的敘述何項最正確？","opts":["A. 因放置導管後易發生尿路感染，故建議先給抗生素","B. 導管的直徑大小需適宜，否則可能會發生漏尿","C. 為避免阻塞尿路導管系統，需採開放系統（open system）","D. 要時常檢查導管是否在適當的位置，若有部分移出時可以直接用手推回原處"],"ans":1,"exp":"尿路導管的直徑必須適合尿道，過小會導致尿液從導管外側滲漏（漏尿），過大則可能損傷黏膜，B正確。","we":["放置導管前預防性給抗生素會增加抗藥性，不建議；導管放置後若有感染跡象再治療，A不正確。","導管直徑應適合尿道，太細會漏尿，太粗會造成黏膜損傷，B正確。","應採「封閉系統」（closed system）而非開放系統，以減少逆行性感染，C不正確。","已移出的導管不可直接推回，因為移出的部分已被污染，推回會帶入細菌，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_047","year":2024,"roc_year":113,"session":"","examNo":47,"q":"依照病史及血檢數值可作出最有可能的診斷為何？","opts":["A. Cushing's disease","B. Addison's disease","C. 急性腎性腎病","D. 低甲狀腺素血症"],"ans":0,"exp":"（此題為承接題，缺乏前置病史，需人工確認。暫定：依據典型症狀，Cushing's disease的特徵為多渴多尿、腹部下垂、禿毛等。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_048","year":2024,"roc_year":113,"session":"","examNo":48,"q":"承上題，該病必須要進行的確診方式為下列何項？","opts":["A. 高濃度dexamethasone刺激試驗","B. 血清cortisol濃度檢測","C. 低濃度dexamethasone刺激試驗","D. ACTH 刺激試驗"],"ans":2,"exp":"（此題為承上題，缺乏前置病史，需人工確認。若Q47診斷為Cushing's disease，確診試驗首選為低濃度dexamethasone抑制試驗（LDDS test）。若為Addison's則用ACTH刺激試驗。）","we":["高濃度dexamethasone刺激試驗（HDDS）用於區分PDH和adrenal tumor，非初步確診。","單獨血清cortisol濃度不足以確診Cushing's或Addison's，缺乏特異性。","低濃度dexamethasone抑制試驗（LDDS）是Cushing's disease的確診試驗，正常犬皮質醇受到抑制，C為暫定答案。","ACTH刺激試驗是Addison's disease的確診試驗，也用於Cushing's監測。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_049","year":2024,"roc_year":113,"session":"","examNo":49,"q":"下列何項輸液是屬於維持性輸液（maintenance fluid）？","opts":["A. 乳酸林格氏液（LRS）","B. 2.5% dextrose + 0.45% sodium chloride","C. 生理鹽水","D. 白蛋白"],"ans":1,"exp":"維持性輸液（maintenance fluid）含有適量電解質（Na、K、Cl）且滲透壓接近血漿，用於補充每日正常水分流失。2.5% Dextrose + 0.45% NaCl是標準維持性輸液，B正確。","we":["乳酸林格液（LRS）是晶體等張液，用於補充缺水/休克，屬「替換性輸液」（replacement fluid），非維持性。","2.5% Dextrose + 0.45% NaCl 是低張維持性輸液，提供日常水分和電解質需求，B正確。","生理鹽水（0.9% NaCl）是等張輸液，常用於休克復甦，非維持性輸液。","白蛋白（albumin）是膠體液，用於低白蛋白血症，非維持性輸液。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_050","year":2024,"roc_year":113,"session":"","examNo":50,"q":"此貓的慢性腎病分級為","opts":["A. stage III borderline proteinuria hypertension","B. stage III proteinuria severe hypertension","C. stage IV proteinuria hypertension","D. stage IV borderline proteinuria hypertension"],"ans":3,"exp":"（此題需結合前置病例數據進行IRIS CKD分期，缺乏前置病史，需人工確認。IRIS分期依據肌酸酐值、UPC ratio、血壓決定stage和sub-stage。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_051","year":2024,"roc_year":113,"session":"","examNo":51,"q":"承上題，該貓的頸部腹側屈曲（neck ventroflexion）與下列何項血檢結果最具相關性？","opts":["A. 低血鈉（hyponatremia）","B. 高血磷（hyperphosphatemia）","C. 貧血","D. 低血鉀（hypokalemia）"],"ans":3,"exp":"貓慢性腎病常見低血鉀（hypokalemia），低血鉀導致全身性肌肉無力，表現為頸部腹側屈曲（cervical ventroflexion）——這是貓低血鉀最具特徵性的臨床症狀，D正確。","we":["低血鈉（hyponatremia）主要引起神經症狀（混亂、癲癇），不是頸部腹側屈曲的典型原因。","高血磷（hyperphosphatemia）促進繼發性副甲狀腺亢進，但不直接造成頸部屈曲。","貧血造成虛弱，但不特別表現為頸部腹側屈曲（cervical ventroflexion）。","低血鉀（hypokalemia）造成肌肉無力，貓特別表現為頸部腹側屈曲，是CKD貓低血鉀的特徵表現，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_052","year":2024,"roc_year":113,"session":"","examNo":52,"q":"關於犬貓縱膈之敘述，下列何者最不適當？","opts":["A. 縱膈氣腫（pneumomediastinum）可能會造成後腹膜腔氣腫（pneumoretroperitonium）","B. 氣胸（pneumothorax）可能會造成縱膈氣腫（pneumomediastinum）","C. 縱膈氣腫（pneumomediastinum）可能會造成皮下氣腫（subcutaneous emphysema）","D. 肺臟內肺泡破裂（intrapulmonary alveolar rupture）可能會造成縱膈氣腫（pneumomediastinum）"],"ans":1,"exp":"問何者「最不適當」。B說氣胸可能造成縱膈氣腫——這是因果關係倒置。正確順序是：肺泡破裂→縱膈氣腫→（氣體沿筋膜播散）→氣胸或皮下氣腫。氣胸本身不會「造成」縱膈氣腫。","we":["縱膈氣腫→後腹膜腔氣腫：氣體沿筋膜平面向後擴散是已知現象，A描述正確。","氣胸（pneumothorax）是縱膈氣腫的「後果」之一，而非「原因」；B描述因果倒置，是最不適當的。","縱膈氣腫→皮下氣腫：氣體向上沿頸部筋膜擴散，C描述正確。","肺泡破裂→縱膈氣腫：氣體從肺間質進入縱膈，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_053","year":2024,"roc_year":113,"session":"","examNo":53,"q":"病犬為3歲齡，體重3公斤，雄性未絕育混種犬，據飼主描述該犬於1小時前被有毒癮的兒子強迫餵食海洛\r   英，該犬到院時呈現精神沉鬱，呼吸緩淺，心搏徐緩，下列那一種急救藥物可以逆轉其症狀？","opts":["A. naloxone","B. atipamezole","C. flumazenil","D. sugammadex"],"ans":0,"exp":"海洛英（heroin）是opioid receptor agonist，犬隻中毒症狀包括呼吸抑制、心搏徐緩、鎮靜。Naloxone是opioid receptor antagonist，可競爭性拮抗並逆轉opioid中毒症狀。","we":["Naloxone 是opioid antagonist，可快速逆轉heroin（opioid）中毒的呼吸抑制和CNS抑制，A正確。","Atipamezole 是alpha-2 adrenergic antagonist，用於逆轉medetomidine等alpha-2 agonist，非opioid拮抗劑。","Flumazenil 是benzodiazepine receptor antagonist，用於逆轉benzodiazepine（如diazepam）中毒，非opioid拮抗劑。","Sugammadex 是neuromuscular blocking agent（如rocuronium）的拮抗劑，與opioid無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_054","year":2024,"roc_year":113,"session":"","examNo":54,"q":"病犬為6歲齡，體重25公斤，雌性已絕育拉布拉多犬，於今日早上與主人一同爬山被毒蛇咬到，依其症狀傷\r   口疼痛、局部腫脹、嗜睡、運動神經失調、眼瞼下垂、瞳孔散大、顎咽麻痺、流涎，在臺灣下列何種毒蛇最  可能是本病例的主兇？","opts":["A. 青竹絲","B. 龜殼花","C. 百步蛇","D. 雨傘節"],"ans":3,"exp":"症狀同時有局部腫脹疼痛（出血毒/細胞毒）及神經毒症狀（眼瞼下垂、瞳孔散大、顎咽麻痺）。台灣雨傘節（Bungarus multicinctus）以神經毒素為主，抑制神經肌肉接合，造成進行性麻痺；雖通常局部腫脹較輕，但仍可造成上述神經症狀。","we":["青竹絲（赤尾青竹絲）以出血毒為主，局部腫脹明顯，但神經症狀輕微。","龜殼花以出血毒為主，不典型造成明顯眼瞼下垂和顎咽麻痺等神經毒症狀。","百步蛇毒性最強，以出血毒為主，局部壞死嚴重，非以神經毒為主。","雨傘節（Bungarus multicinctus）含神經毒素，引起神經肌肉接合阻斷，造成眼瞼下垂、瞳孔散大、顎咽麻痺等神經症狀，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_055","year":2024,"roc_year":113,"session":"","examNo":55,"q":"有關貓乳房瘤的敘述，下列何者最不適當？","opts":["A. 有50%為惡性腫瘤","B. 3公分以上的腫瘤，存活時間僅約4～12個月","C. 艾黴素（doxorubicin）可在貓手術切除乳房瘤後使用","D. 以保守方式進行手術可能會有較早的腫瘤再發，但存活時間並不受影響，所以也可考慮進行較保守的手術  切除"],"ans":0,"exp":"問何者「最不適當」。貓乳房瘤約85-90%為惡性，A說「有50%為惡性」是錯誤的（50%是犬的數據），A最不適當。","we":["貓乳房瘤的惡性率約85-90%（不是50%），50%是犬的比例；A描述貓的惡性率有誤，是最不適當的選項。","腫瘤>3 cm的貓預後差，中位存活時間約4-12個月，B描述正確。","手術切除後使用doxorubicin（艾黴素）化療是貓乳房瘤的輔助治療選項，C描述正確。","保守手術（conservative surgery）確實較早再發，但存活時間是否「不受影響」仍有爭議；廣泛切除通常有更好的局部控制。D描述有一定問題，但A的錯誤更明確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_056","year":2024,"roc_year":113,"session":"","examNo":56,"q":"一隻6歲已結紮約克夏成犬有慢性小腸性下痢，理學檢查發現犬隻非常消瘦但無其他不正常。血檢發現輕微\r   非再生性貧血及明顯之淋巴球低下。血清生化學檢查有輕微低血鈣、低膽固醇及中等程度低蛋白血症。其最  可能的診斷為何？","opts":["A. 組織胞漿菌病（histoplasmosis）","B. 沙氏菌症","C. 淋巴瘤","D. 腸淋巴管擴張症（lymphangiectasia）"],"ans":3,"exp":"約克夏成犬，慢性小腸性下痢、消瘦、淋巴球低下（lymphopenia）、低血鈣、低膽固醇（fat malabsorption）、低蛋白血症——這是腸淋巴管擴張症（lymphangiectasia）的典型表現：乳糜管擴張→淋巴液漏入腸腔→脂肪/蛋白/鈣/膽固醇大量流失+淋巴球流失。","we":["組織胞漿菌病（histoplasmosis）可造成慢性下痢，但通常有肉芽腫且膽固醇不特別低，淋巴球低下也不是典型特徵。","沙氏菌症（salmonellosis）通常是急性腸炎，不是慢性小腸性下痢的首要診斷。","淋巴瘤可造成慢性下痢，但通常可見腸壁增厚或腫塊，且此描述（低膽固醇+淋巴球低下）更符合lymphangiectasia。","腸淋巴管擴張症（lymphangiectasia）：淋巴管擴張→乳糜外漏→低白蛋白、低膽固醇、低血鈣、淋巴球低下，為最符合本例的診斷，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_057","year":2024,"roc_year":113,"session":"","examNo":57,"q":"下列何項犬食道的解剖位置，較不常發生異物阻塞？","opts":["A. 頸段食道","B. 食道的胸腔入口處","C. 心底部食道","D. 食道穿過橫膈處"],"ans":0,"exp":"問「較不常發生」異物阻塞的部位。犬食道異物好發於三個解剖狹窄：胸腔入口（B）、心底部（C）、橫膈食道裂孔（D）。頸段食道（A）相對有彈性、管腔較大，異物較少在此嵌頓。","we":["頸段食道（cervical esophagus）管腔較大且彈性較好，異物較少嵌頓於此，A正確為「較不常發生」的部位。","胸腔入口處（thoracic inlet）是食道三大狹窄之一，異物最常嵌頓，非「較不常見」。","心底部（base of heart）大動脈壓迫造成食道狹窄，是異物常嵌頓處。","橫膈裂孔（diaphragmatic hiatus）食道通過橫膈處，也是常見異物嵌頓部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_058","year":2024,"roc_year":113,"session":"","examNo":58,"q":"有關皮膚疾病的診斷方式，下列敘述何者錯誤？","opts":["A. 膠帶黏貼檢查法可診斷部分蟎類外寄生蟲","B. 拔毛檢查可診斷毛囊蟲","C. 皮膚壓片細胞學檢查可診斷酵母菌感染","D. 皮膚搔刮檢查可診斷天疱瘡"],"ans":3,"exp":"問何者「錯誤」。皮膚搔刮（skin scraping）用於診斷疥蟎（Sarcoptes）、蠕形蟎（Demodex），不能診斷天疱瘡（pemphigus）。天疱瘡需要皮膚切片（biopsy）搭配組織病理和直接免疫螢光（DIF）確診，D是錯誤敘述。","we":["膠帶黏貼法（tape preparation）可找到Cheyletiella等表面寄生蟲，A描述正確。","拔毛鏡檢（trichogram）可在毛囊中找到毛囊蟲（Demodex），B描述正確。","皮膚壓片細胞學（impression smear cytology）可發現Malassezia（酵母菌）感染，C描述正確。","皮膚搔刮（skin scraping）診斷外寄生蟲（如疥螨）；天疱瘡（pemphigus）屬自體免疫性皮膚病，需皮膚切片＋組織病理確診，搔刮不能診斷天疱瘡，D是錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_059","year":2024,"roc_year":113,"session":"","examNo":59,"q":"關於犬膀胱結石疾病，下列何者正確？","opts":["A. 草酸鈣結石無法用放射線學檢查發現","B. 磷酸銨鎂結石形成通常與尿路感染有關","C. 可使用尿路酸化劑預防草酸鈣結石復發","D. 膀胱切開縫合膀胱壁時，使用不可吸收線全層縫合防止尿液外漏"],"ans":1,"exp":"磷酸銨鎂（struvite）結石的形成與尿素酶產生菌（urease-producing bacteria，如Staphylococcus、Proteus）引起的尿路感染有密切關係，細菌分解尿素→氨→鹼性尿→struvite沉澱，B正確。","we":["草酸鈣結石是放射線「不透過性」（radiopaque），在X光片上清晰可見，A描述錯誤。","磷酸銨鎂（struvite）結石與產尿素酶細菌引起的UTI密切相關，B正確。","尿路酸化劑（urinary acidifiers）可溶解struvite，但對草酸鈣結石無效甚至有害（酸性尿促進草酸鈣形成），C描述錯誤。","膀胱縫合應使用可吸收縫線（如PDS），不可吸收線在膀胱內可能作為結石形成核，D描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_060","year":2024,"roc_year":113,"session":"","examNo":60,"q":"犬隻因患有唾液腺囊腫而進行舌下及下頷唾液腺切除術時，為求唾液腺及其管道完整摘除，需鈍剝至看到下\r   列何神經再進行結紮摘除？","opts":["A. 顏面神經","B. 喉迴返神經","C. 舌神經","D. 迷走神經"],"ans":2,"exp":"犬隻舌下及下頷唾液腺切除術時，需鈍剝分離，看到舌神經（lingual nerve）後再進行結紮摘除，以避免損傷並確認完整摘除腺體及腺管。","we":["顏面神經（facial nerve）主要控制表情肌，手術時需注意避免損傷，但不是視覺確認標誌。","喉迴返神經（recurrent laryngeal nerve）在頸部氣管旁走行，與唾液腺手術關係較遠。","舌神經（lingual nerve）沿舌下/下頷唾液腺管伴行，手術鈍剝至見到舌神經後再結紮，確保腺體完整摘除，C正確。","迷走神經（vagus nerve）走行較深，不是唾液腺手術的直接視覺確認神經。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_061","year":2024,"roc_year":113,"session":"","examNo":61,"q":"關於犬隻胃擴張扭轉疾病敘述，下列何者錯誤？","opts":["A. 胃固定術可以部分的預防扭轉發生","B. 幽門扭轉方向通常先往腹腔背側再往右側腹壁移動","C. 造成門脈高壓與系統性低血壓","D. 大型深胸犬為好發品種"],"ans":1,"exp":"問「何者錯誤」。B說GDV中幽門扭轉方向「先往腹腔背側再往右側腹壁移動」——這是錯誤的。GDV的幽門（pylorus）扭轉方向是先往腹側（ventral），再往左側移動；而胃底（fundus）往右側移動。B描述方向有誤。","we":["胃固定術（gastropexy）可有效預防復發，A描述正確。","GDV中幽門（pylorus）正確扭轉方向是向腹側（ventral）再向左側（left），B描述「往背側再往右側」是錯誤的，B為最不正確的選項。","GDV造成後腔靜脈壓迫→靜脈回流減少→門脈高壓及系統性低血壓，C描述正確。","大型深胸犬（如大丹犬、德牧）確為GDV好發品種，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_062","year":2024,"roc_year":113,"session":"","examNo":62,"q":"4歲混種犬於股骨骨幹骨折手術復位後14天拍攝X光，下列何者為預期可見的次級骨癒合（secondary bone\r   healing）？","opts":["A. 骨痂出現重塑（remodel）","B. 骨膜內及骨膜外骨痂形成（formation of endosteal and periosteal callus）","C. 骨折線消失（fracture lines disappear）","D. 骨痂中可見骨小樑（trabecular pattern）"],"ans":1,"exp":"次級骨癒合（secondary bone healing）在術後14天時，已進入「硬性骨痂」（hard callus）形成期。骨膜內及骨膜外骨痂（endosteal and periosteal callus）形成發生在約1-4週，14天時可在X光見到骨膜外骨痂形成，B正確。","we":["骨痂重塑（remodeling）發生在骨癒合晚期（數月後），不是14天時的表現，A不正確。","骨膜外及骨膜內骨痂形成（periosteal/endosteal callus）是次級骨癒合第2-4週的特徵，14天時已可見初期骨痂，B正確。","骨折線消失是骨癒合完成的表現，需要數週至數月，14天時骨折線仍清晰可見，C不正確。","骨痂中骨小樑（trabecular pattern）是骨癒合晚期骨痂成熟的表現，14天時尚未形成，D不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_063","year":2024,"roc_year":113,"session":"","examNo":63,"q":"9歲拉不拉多犬，右前肢負重跛行，觸診右前肢腕部有觸痛反應，X光影像中箭號處骨樣結構為何？","opts":["A. 撕裂性骨折（avulsion fracture）","B. 碎片骨折（chip fracture）","C. 長趾伸肌肌腱（long digital extensor tendon）種子骨","D. 外展拇長肌肌腱（abductor pollicis longus tendon）種子骨"],"ans":3,"exp":"（此題依賴X光圖片，需人工確認。暫定：外展拇長肌肌腱（APL tendon）種子骨是犬腕部的正常解剖變異，在老年拉不拉多的腕部X光可見，需與撕裂性骨折鑑別。）","we":["撕裂性骨折（avulsion fracture）附著點有急性外力損傷史，需排除。","碎片骨折（chip fracture）通常有創傷史，邊緣不規則。","長趾伸肌腱種子骨較少見。","外展拇長肌肌腱（APL tendon）種子骨是腕部常見正常解剖變異，邊緣光滑，需與骨折鑑別，D為暫定答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_064","year":2024,"roc_year":113,"session":"","examNo":64,"q":"關於骨癒合應變理論（strain theory）的敘述，下列何者最不適當？","opts":["A. 骨組織只能存活在2%以下的應變環境（deformation），因此骨折的修復要點之一是儘量減少骨折斷片間的   應變","B. 纖維軟骨組織適合生存在約10～15%的應變環境（deformation）下","C. 在等量的不穩定度下，裂隙較小的骨折和裂隙較大的骨折相比有較小的應變","D. 外骨痂（periosteal callus）的生長會減少骨折斷片間的應變"],"ans":2,"exp":"應變理論（strain theory）：Strain = 位移量 / 裂隙大小（gap size）。在「等量不穩定度（相同位移量）」下，裂隙「較小」的骨折其strain值反而「較大」（因為分母小）。C說「裂隙較小有較小的應變」是錯誤的，C為最不適當選項。","we":["骨組織（bone tissue）的應變耐受上限約2%，應變超過2%則骨組織無法存活，A描述正確。","纖維軟骨（fibrocartilage）可在約10-15%應變環境存活，是骨折裂隙中優先形成的組織，B描述正確。","在等量不穩定度下，裂隙「較小」的骨折strain值「較大」（strain = displacement/gap size），C描述「較小應變」是錯誤的，C為最不適當選項。","外骨痂（periosteal callus）生長增加有效斷面面積，分散應力，減少骨折斷片間應變，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_065","year":2024,"roc_year":113,"session":"","examNo":65,"q":"一隻3歲短毛家貓右後肢有超過10天的大範圍皮膚外傷，皮膚缺損位於右後肢內側，包含大腿、小腿，傷口\r   最遠端在踝掌關節交界處。若計畫在傷口狀況穩定後進行一次性的手術來關閉皮膚缺口，下列那一項軸型皮  瓣的修復方式最適合？","opts":["A. 尾側後血管軸行皮瓣（lateral caudal axial pattern flap）","B. 反轉隱血管通道皮瓣（reverse saphenous conduit flap）","C. 膝軸型皮瓣（genicular axial pattern flap）","D. 後淺腹壁血管軸型皮瓣（caudal superficial epigastric axial pattern flap）"],"ans":1,"exp":"貓右後肢內側大腿到踝掌關節的大範圍皮膚缺損，需覆蓋後肢中遠段。反轉隱血管通道皮瓣（reverse saphenous conduit flap）以逆行血流供應後肢遠端，可覆蓋小腿至跗部，是最適合的選擇。","we":["尾側後血管軸行皮瓣（lateral caudal axial pattern flap）適合覆蓋臀部和後肢近端，無法延伸至踝部，A不適合。","反轉隱血管通道皮瓣（reverse saphenous conduit flap）以逆行血流供應後肢遠端（小腿至跗部），最適合本案例的遠端缺損，B正確。","膝軸型皮瓣（genicular axial pattern flap）覆蓋範圍主要是膝關節附近，無法延伸至踝掌關節，C不適合。","後淺腹壁軸型皮瓣（caudal superficial epigastric flap）覆蓋腹股溝/近端後肢，無法覆蓋踝部，D不適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_066","year":2024,"roc_year":113,"session":"","examNo":66,"q":"下列那個術式與犬隻會陰赫尼亞的預防及治療無關？","opts":["A. 半腱肌轉位（semitendinosus musle transposition）","B. 中臀肌轉位（middle gluteal musle transposition）","C. 膀胱固定術（cystopexy）","D. 公犬絕育（castration）"],"ans":1,"exp":"問「何術式與會陰赫尼亞無關」。半腱肌轉位（A）、膀胱固定術（C）、公犬絕育（D）都是會陰赫尼亞的預防/治療措施。中臀肌轉位（middle gluteal muscle transposition，B）不是會陰疝氣的常用術式，B與會陰赫尼亞無關。","we":["半腱肌轉位（semitendinosus transposition）是會陰疝氣重建的有效術式，A有關。","中臀肌轉位（middle gluteal transposition）不是會陰赫尼亞的標準術式（常用的是內閉孔肌或半腱肌），B與會陰疝氣治療無關，B正確。","膀胱固定術（cystopexy）防止膀胱進入疝囊，是會陰疝氣伴膀胱膨出時的必要處置，C有關。","公犬絕育可移除雄性激素對會陰肌肉的影響，降低復發率，是預防措施，D有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_067","year":2024,"roc_year":113,"session":"","examNo":67,"q":"5月齡拉不拉多犬在連續且劇烈運動後突然出現單側後肢跛行及膝關節部位腫大，下列何者最有可能是造成\r   的原因？","opts":["A. 前十字韌帶疾病","B. 髕骨脫臼","C. 股骨頭缺血性壞死（avascular necrosis of femoral head）","D. 脛骨粗隆撕裂骨折（avulsion fracture of the tibial tuberosity）"],"ans":3,"exp":"5月齡拉不拉多犬，骨骺板尚未閉合，劇烈運動後突然出現膝關節腫大——此為「脛骨粗隆撕裂骨折」（avulsion fracture of tibial tuberosity），因股四頭肌強力收縮拉扯脛骨粗隆骨骺，在未閉合的骺板處撕裂，D正確。","we":["前十字韌帶疾病（CCL disease）好發於中老年犬，幼犬劇烈運動後急性發作較少見，且膝關節腫大不典型。","髕骨脫臼（patellar luxation）通常表現為間歇性跛行（跳躍步態），非急性劇烈腫大，且與運動強度無直接關係。","股骨頭缺血性壞死（avascular necrosis of femoral head，Legg-Calvé-Perthes）表現在「髖關節」而非膝關節，C不符合。","脛骨粗隆撕裂骨折：幼犬骺板未閉合，股四頭肌強力收縮→脛骨粗隆骨骺撕裂，膝關節腫大及急性跛行，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_068","year":2024,"roc_year":113,"session":"","examNo":68,"q":"下列何者非造成此capnography圖形趨勢的原因？（X軸為時間，Y軸為PCO 2 量）","opts":["A. 麻醉過深","B. 組織灌流不足","C. 嚴重換氣過度","D. 甲狀腺功能亢進"],"ans":0,"exp":"（此題依賴capnography圖片，需人工確認。若圖示PCO2呈下降趨勢：麻醉過深導致「低通氣」→PCO2上升，因此麻醉過深不會造成PCO2下降趨勢；其他如組織灌流不足、嚴重過度通氣會造成PCO2下降。若圖示PCO2下降，A（麻醉過深）為不是原因的答案。）","we":["麻醉過深→低通氣→PCO2升高，若圖形顯示PCO2下降，則麻醉過深不是原因，A為暫定答案。","組織灌流不足→CO2輸送到肺臟減少→EtCO2下降，是PCO2下降的可能原因。","嚴重換氣過度（hyperventilation）→CO2大量排出→EtCO2下降，是PCO2下降的原因。","甲狀腺亢進→代謝率升高→CO2產量增加→EtCO2上升，若圖形顯示下降，甲狀腺亢進不是原因。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_069","year":2024,"roc_year":113,"session":"","examNo":69,"q":"關於母馬的懷孕診斷，下列敘述何項最不適當？","opts":["A. 妊馬懷孕150天時，血液中動情素（estrogens）濃度會超過未妊馬的最大值","B. 於配種後16～22天，未妊馬的血液中孕酮（progesterone）濃度會呈現低值而未上升","C. 於配種後30天，可應用超音波影像診斷母馬有無懷孕","D. 於配種後30天，可應用直腸觸診診斷母馬有無懷孕"],"ans":3,"exp":"問何者「最不適當」。馬配種後30天，超音波（C）已可確認懷孕（胚泡可見），但直腸觸診（D）在此時子宮大小變化不明顯，敏感性很低，無法可靠診斷懷孕；馬懷孕需到60-90天後才能透過直腸觸診相對可靠判斷。","we":["懷孕150天時，胎兒胎盤（uterofetoplacental unit）分泌大量雌激素，血清濃度顯著超過非懷孕馬的最大值，A描述正確。","未懷孕的馬在配種後16-22天黃體退化，孕酮降至低值；若懷孕則孕酮維持高值，B描述正確。","超音波在配種後25-35天可清楚看到胚泡，是最早且最可靠的懷孕診斷方式，C描述正確。","直腸觸診在配種後30天時子宮大小與正常非懷孕無顯著差異，敏感性極低，無法可靠診斷懷孕，D為最不適當的說法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_070","year":2024,"roc_year":113,"session":"","examNo":70,"q":"某牧場懷孕280天母牛出現努責現象超過8小時，未見第一水袋破水，外陰部呈現皺摺樣，經陰道檢查無法觸  摸到胎兒，獸醫師診斷後進行倒牛以及母體迴轉（rolling）如下圖，下列何者不適用於母體迴轉成功矯正 之後的下一步處置？","opts":["A. 帝王切開術","B. 注射PGF 2α 與 dethamexasone等待24小時確認是否分娩","C. 進行碎胎術取出胎兒","D. 以助產器進行胎兒牽引"],"ans":1,"exp":"母牛子宮捻轉矯正成功後，應立即評估胎兒活力並進行助產（牽引或帝王切開），而非注射PGF2α+dexamethasone等待24小時。在280天（接近足月）且已有難產跡象的情況下，延誤24小時可能造成胎兒缺氧死亡，B為最不適用的下一步。","we":["帝王切開術：若矯正後子宮頸未充分擴張或胎兒無法正常牽出，帝王切開是合理選擇，A可適用。","注射PGF2α+dexamethasone等待24小時：在已接近足月且剛矯正的情況下，等待24小時延誤分娩，有胎兒缺氧風險，B為最不適用的選項。","碎胎術：若矯正後確認胎兒死亡，碎胎術是取出胎兒的有效方式，C在特定情況下可適用。","助產器牽引：若矯正後子宮頸充分開放且胎位正確，直接牽引是最直接的方式，D可適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_071","year":2024,"roc_year":113,"session":"","examNo":71,"q":"有關山羊異常動情週期之敘述，下列何者錯誤？","opts":["A. 若其動情週期較長，有可能是胚胎早期死亡造成","B. 若其動情週期較短（小於18至21天），有可能是繁殖季期剛開始","C. 若其動情週期較短，有可能是寂靜發情（silent heat）","D. 若其動情週期較短，有可能是黃體提早退行性變化（premature regression of the corpus luteum）"],"ans":2,"exp":"問何者「錯誤」。C說「動情週期較短有可能是寂靜發情（silent heat）」——這是錯誤的。寂靜發情是指有排卵但無明顯發情行為，動情週期長度「正常」，並不縮短。縮短週期的原因是黃體提早退化，不是寂靜發情。","we":["胚胎早期死亡→失去胚胎信號→黃體延長存在→週期延長，A描述正確。","繁殖季開始時的初期週期（transition cycles）可有較短且不規律的週期，B描述正確。","寂靜發情（silent heat）指有排卵無行為表現，週期長度「正常」，不會縮短週期，C是錯誤描述。","黃體提早退行性變化（premature corpus luteum regression）導致黃體期縮短→整個週期縮短，D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_072","year":2024,"roc_year":113,"session":"","examNo":72,"q":"有關胎衣滯留之敘述，下列何者最正確？","opts":["A. 雖然用手剝除胎衣是一種處理方式，但牛隻胎衣滯留初期最好不要用手剝除，因為其胎盤結構是宮阜凹  下，子葉突入阜內","B. 其前置因子常與雙胞胎或利用類固醇引產有關","C. 若想要協助胎衣排出，可以使用動情素（estrogen）類藥物，於產後24～48小時內施打","D. 分娩之前給予維生素E或硒，不是最好的方式，其最好的方式為於分娩後24小時內給予"],"ans":0,"exp":"問「何者最正確」。A說：牛的胎盤結構是宮阜凹下（caruncle凹形）、子葉突入阜內，因此胎衣滯留初期不應強行手剝，以免損傷子宮——這個解釋在臨床和解剖上都是正確的。","we":["宮阜（caruncle）凹形，子葉（cotyledon）凸出插入，初期強行手剝容易撕裂組織造成子宮炎；不建議初期手剝是正確的臨床建議，A為最正確選項。","雙胞胎和類固醇引產確實是胎衣滯留的風險因子，B描述基本正確，但不如A具體說明機制。","胎衣滯留治療應使用Oxytocin促進子宮收縮，而非動情素（estrogen）；C的治療建議有誤。","預防胎衣滯留應在「分娩前」補充VitE和硒，而非分娩後；D描述時機相反，不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_073","year":2024,"roc_year":113,"session":"","examNo":73,"q":"下列有關牛隻臨床性酮病相關檢驗及治療之敘述，何者最正確？","opts":["A. 酮病發生在較肥胖的牛隻，而不會發生在瘦的牛隻","B. 若使用尿液試紙（dipsticks）進行檢驗時，應注意使用方法，要先使試紙以蒸餾水浸潤，以防止偽陰性","C. 酮體在尿液試紙中若有檢出，不論濃度為何，表示該牛為酮病","D. 不論任何的治療方案，給予50%的葡萄糖輸液是有必要的"],"ans":3,"exp":"（此題各選項均有爭議，暫定D。）對於臨床性酮病（clinical ketosis），靜脈給予50%葡萄糖液是標準急救措施；相較於A（酮病只發生在肥胖牛）、B（試紙預先浸潤）、C（任何濃度酮體即診斷）等明確錯誤敘述，D為相對最正確的選項。","we":["酮病也可發生在瘦牛（負能量平衡），A說「不會發生在瘦的牛隻」是錯誤的。","尿液試紙不應先以蒸餾水浸潤，這樣會稀釋尿液造成偽陰性，B的建議反而有害。","亞臨床程度的酮體在泌乳初期是正常的，不論濃度均判為酮病是錯誤的，C不正確。","臨床性酮病患牛靜脈給予50%葡萄糖是標準治療之一，D為四選項中相對最正確的敘述（但輕症也可能不需IV glucose）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_074","year":2024,"roc_year":113,"session":"","examNo":74,"q":"下列何種動物的平均動情週期最短？","opts":["A. 牛","B. 綿羊","C. 馬","D. 豬"],"ans":1,"exp":"各動物平均動情週期：牛21天，綿羊17天，馬21天，豬21天。綿羊的動情週期最短（約17天），B正確。","we":["牛的平均動情週期約21天，不是最短的。","綿羊的平均動情週期約17天，是四種動物中最短的，B正確。","馬的平均動情週期約21天（18-26天），與牛相近，不是最短。","豬的平均動情週期約21天（18-24天），不是最短。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_075","year":2024,"roc_year":113,"session":"","examNo":75,"q":"下列何種雌性動物，不屬於季節性多動情週期型（seasonally polycyclic）？","opts":["A. 馬","B. 羊","C. 牛","D. 貓"],"ans":2,"exp":"季節性多動情週期型（seasonally polycyclic）動物只在特定季節有多次動情週期。牛（cattle）屬於「全年多動情週期型（polyestrous，non-seasonal）」，全年均可繁殖，不受光照週期限制，C正確。","we":["馬（horse）在長日照季節（春夏）多動情，是季節性多動情週期型，A不符合（馬是季節性的）。","羊（sheep）在短日照（秋冬）多動情，是季節性多動情週期型，B不符合。","牛（cattle）是全年多動情（polyestrous）、非季節性，不屬於季節性多動情週期型，C正確。","貓（cat）在長日照（春夏）多動情，屬於季節性多動情週期型，D不符合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_076","year":2024,"roc_year":113,"session":"","examNo":76,"q":"下列何種動物的平均懷孕期最長？","opts":["A. 牛","B. 羊","C. 豬","D. 馬"],"ans":3,"exp":"各動物平均懷孕期：牛280天、羊150天、豬114天、馬336天。馬的懷孕期最長（約336天，約11個月），D正確。","we":["牛的平均懷孕期約280天（9個月），不是最長。","羊的平均懷孕期約150天（5個月），不是最長。","豬的平均懷孕期約114天（3個月3週3天），不是最長。","馬的平均懷孕期約336天（11個月），是四種動物中最長的，D正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_077","year":2024,"roc_year":113,"session":"","examNo":77,"q":"血液中的下列何者最不適用於母犬的懷孕診斷？","opts":["A. C-reactive protein","B. fibrinogen","C. progesterone","D. relaxin"],"ans":2,"exp":"問「最不適用於母犬懷孕診斷」。母犬在動情後期（diestrus）無論是否懷孕，孕酮（progesterone）都會維持高值（因為黃體期不依賴懷孕而自動維持）。因此孕酮無法區分懷孕與假懷孕，特異性最差，C最不適用。","we":["CRP（C-reactive protein）在懷孕期升高，有一定指示價值，但特異性一般。","Fibrinogen在懷孕期升高，可作為輔助指標。","Progesterone在母犬動情後期無論懷孕與否均升高（黃體期自動維持），無法鑑別懷孕與非懷孕，C最不適用於懷孕診斷。","Relaxin 由妊娠黃體和胎盤分泌，在懷孕25-30天後才出現，是母犬懷孕的特異性指標，D適用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_078","year":2024,"roc_year":113,"session":"","examNo":78,"q":"有關隱睪症（cryptorchidism）的敘述，下列何項最不適當？","opts":["A. 隱睪常在的位置是位於腹腔或鼠蹊","B. 公畜若僅有單側隱睪，該公畜仍可保有繁殖能力","C. 公畜若有雙側隱睪，該公畜會喪失性慾表現（libido）","D. 老年公犬及公馬，隱睪較易發生腫瘤"],"ans":2,"exp":"問何者「最不適當」。雙側隱睪公畜，雖然兩個睾丸留在腹腔（高溫→精子不育），但睾丸仍然正常分泌雄性激素（testosterone），因此性慾（libido）「不會」喪失，C的描述（雙側隱睪→喪失性慾）是錯誤的。","we":["隱睪的常見位置確實是腹腔或鼠蹊（inguinal canal），A描述正確。","單側隱睪公畜，另一側正常睾丸仍可產生精子，繁殖能力保留，B描述正確。","雙側隱睪公畜，睾丸在腹腔中仍可分泌雄性激素（testosterone），性慾（libido）「正常」；C說「喪失性慾」是錯誤的，C為最不適當選項。","老年公犬及公馬的隱睪確實較容易發生腫瘤（Sertoli cell tumor、seminoma等），D描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2024_普通病_079","year":2024,"roc_year":113,"session":"","examNo":79,"q":"母犬於陰道抹片採檢，看到下圖細胞相時，最不可能是下列何項？","opts":["A. pro-oestrus","B. early metoestrus","C. vaginitis","D. pyometra"],"ans":0,"exp":"（此題依賴陰道抹片圖片，需人工確認。若圖示為以角化無核上皮細胞（cornified anuclear cells）為主，「最不可能」是early metoestrus（此期應有大量中性球）。）","we":["（待確認）","（待確認）","（待確認）","（待確認）"],"needs_review":true,"imgs":[]},{"id":"AMO_2024_普通病_080","year":2024,"roc_year":113,"session":"","examNo":80,"q":"乳牛產後最常見因卵巢功能不良或其他疾病導致發情週期休止期（anestrus）的原因為下列何項？","opts":["A. 卵巢萎縮及濾泡囊腫","B. 卵巢囊腫及卵巢腫瘤","C. 多排卵及卵巢囊腫","D. 卵巢萎縮及潛在性乳房炎"],"ans":0,"exp":"乳牛產後anestrus最常見的卵巢原因是「卵巢萎縮（ovarian atrophy）」及「濾泡囊腫（follicular cysts）」。卵巢萎縮因負能量平衡導致FSH/LH不足；濾泡囊腫是GnRH/LH surge失敗造成排卵未完成。","we":["卵巢萎縮（無黃體，無大濾泡）及濾泡囊腫是乳牛產後anestrus的兩大最常見卵巢原因，A正確。","卵巢囊腫和卵巢腫瘤都可造成anestrus，但卵巢腫瘤（ovarian tumor）相對少見，不是「最常見」的組合。","多排卵（superovulation）在自然情況下少見，不是anestrus的常見原因。","卵巢萎縮是常見原因，但「潛在性乳房炎（subclinical mastitis）」與anestrus的直接關聯較間接，不是最典型的組合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_001","year":2025,"roc_year":114,"session":"","examNo":1,"q":"診斷為何？","opts":["A. 軟顎背側異位（dorsal displacement of the soft palate）","B. 耳咽管囊臌脹（guttural pouch tympany）","C. 喉返神經疾病（recurrent laryngeal neuropathy）","D. 會厭包嵌（epiglottic entrapment）"],"ans":0,"exp":"本題考馬匹上呼吸道疾病診斷。軟顎背側異位（DDSP）是馬匹運動時軟顎翻越會厭背側，造成特徵性呼氣期雜音，為常見的馬匹上呼吸道疾病。（本題臨床情境依圖片，標記待覆核）","we":["（正確）DDSP 是軟顎向背側位移覆蓋在會厭上方，運動時產生呼氣期「flapping」雜音。","耳咽管囊臌脹主要見於幼駒，因耳咽管內氣體異常積聚造成，與運動型呼吸雜音不同。","喉返神經疾病（roaring）造成吸氣期喘鳴，雜音以吸氣為主而非呼氣。","會厭包嵌（epiglottic entrapment）是杓會厭皺褶包住會厭，通常引起吸氣或雙相性雜音。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_002","year":2025,"roc_year":114,"session":"","examNo":2,"q":"承上題，關於此疾病之敘述，下列何者正確？","opts":["A. 呼吸雜音在吸氣時比呼氣大","B. 喉返神經漸進性發炎產生的狀況","C. 鎮靜後在安靜的狀況下檢查最可能觀察到病變","D. 會厭軟骨通常仍會回到正常位置"],"ans":3,"exp":"DDSP（軟顎背側異位）的臨床特徵：雜音以呼氣為主（非吸氣）；屬動態性疾病，需運動中內視鏡診斷；馬匹咳嗽吞嚥後軟顎常可自行復位，即會厭軟骨通常回到正常位置（軟顎回到下方）。","we":["吸氣時比呼氣雜音大是喉返神經疾病（roaring）的特徵，DDSP 以呼氣性雜音為主。","DDSP 的成因是神經肌肉協調障礙造成軟顎功能異常，並非喉返神經漸進性發炎。","DDSP 是動態性疾病，在鎮靜安靜狀態下通常觀察不到病變，需跑步機運動內視鏡檢查。","（正確）DDSP 發作後馬匹咳嗽或吞嚥可使軟顎復位，會厭軟骨回到正常高於軟顎的位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_003","year":2025,"roc_year":114,"session":"","examNo":3,"q":"影像的拍攝方位最接近的是","opts":["A. dorsomedial to plantarolateral oblique projection","B. dorsolateral to plantaromedial oblique projection","C. lateromedial projection","D. flexed dorsoplantar projection"],"ans":0,"exp":"本題為馬匹跗關節 X 光投照方位題，需依據影像判斷（dorsomedial-plantarolateral 斜位常用於評估跗關節內側結構）。（圖片題，標記待覆核）","we":["（正確依圖判斷）dorsomedial to plantarolateral 斜位可評估跗關節特定骨性結構。","dorsolateral to plantaromedial 斜位用於評估跗關節外側結構，角度與本題不符。","lateromedial 為標準側位，用於整體跗關節評估，非斜位。","flexed dorsoplantar 為彎曲背跖位，評估遠端跗骨，與斜位不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_004","year":2025,"roc_year":114,"session":"","examNo":4,"q":"承上題，箭頭所指之結構為何？","opts":["A. medial trochlear ridge of the talus","B. lateral trochlear ridge of the talus","C. plantar border of the talus","D. intermediate ridge of the talus"],"ans":0,"exp":"本題為馬匹跗關節 X 光上特定結構辨識（箭頭所指），需依圖判斷。（圖片題，標記待覆核）","we":["（正確依圖判斷）距骨內側滑車嵴（medial trochlear ridge of talus）是跗關節常見損傷部位。","距骨外側滑車嵴（lateral trochlear ridge）位置偏外側，與標準斜位顯現位置不同。","距骨蹠側緣（plantar border）位於後方，非滑車嵴結構。","距骨中間嵴（intermediate ridge）位於兩滑車嵴之間，超音波或特殊投照才易辨識。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_005","year":2025,"roc_year":114,"session":"","examNo":5,"q":"下圖馬匹之蹄部最可能罹患何種疾病？","opts":["A. 蹄葉炎（laminitis）","B. 白線病（white line disease）","C. pedal osteitis","D. 腐蹄（thrush）"],"ans":0,"exp":"本題為馬匹蹄部疾病影像診斷（下圖），需依據蹄部影像特徵判斷（蹄葉炎常見蹄骨旋轉下沉）。（圖片題，標記待覆核）","we":["（正確依圖判斷）蹄葉炎（laminitis）X 光可見蹄骨旋轉或下沉，蹄壁與蹄骨間距增大。","白線病（white line disease）侵犯蹄白線，X 光改變較輕微，通常不見明顯蹄骨移位。","Pedal osteitis 為蹄骨骨炎，X 光可見蹄骨邊緣不規則，但無旋轉/下沉特徵。","腐蹄（thrush）是蹄叉腐爛的細菌感染，以臨床外觀及氣味診斷，X 光無特異性表現。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_006","year":2025,"roc_year":114,"session":"","examNo":6,"q":"牛第四胃左側異位常伴有下列何種血液變化？","opts":["A. 低血氯","B. 低血鎂","C. 高血鈣","D. 高血鉀"],"ans":0,"exp":"第四胃左側異位（LDA）時，第四胃積氣移位至左腹脇，幽門出口受阻→胃酸（HCl）無法向前流入十二指腸→H⁺和 Cl⁻ 滯留於瘤胃/第四胃→血中 Cl⁻ 降低（低血氯），同時發生代謝性鹼中毒和低血鉀。","we":["（正確）LDA 因胃酸積聚於第四胃，Cl⁻ 隨 H⁺ 滯留，血液中 Cl⁻ 濃度下降，出現低血氯。","低血鎂（低血鎂症）與草地痙攣（grass tetany）有關，不是 LDA 的典型代謝異常。","高血鈣不是 LDA 的典型表現；乳熱症才以低血鈣為主要特徵。","LDA 反而常見低血鉀（低鉀血症），而非高血鉀；高血鉀多見於腎上腺皮質功能低下。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_007","year":2025,"roc_year":114,"session":"","examNo":7,"q":"下列何者不是牛隻創傷性蜂巢胃炎－腹膜炎的典型症狀？","opts":["A. 盲腸臌脹","B. 左肘頭外展","C. 站立時拱背","D. 心搏過快"],"ans":0,"exp":"創傷性蜂巢胃炎（TRP/hardware disease）典型症狀包括：胸骨後疼痛（劍狀軟骨叩診陽性）、拱背、兩側肘頭外展（不限左側）、心搏過快、食慾下降、乳量減少。盲腸臌脹（cecal dilation）是迷走性消化不良或盲腸扭轉的特徵，不是 TRP 的典型症狀。","we":["（正確）盲腸臌脹為盲腸擴張或扭轉的症狀，不是創傷性蜂巢胃炎的典型臨床表現。","肘頭外展（elbows abducted）是為減輕胸部疼痛而展開前肢，TRP 確有此典型症狀。","拱背（arched back）是腹痛及腹腔感染的典型姿勢，屬 TRP 常見症狀。","心搏過快（tachycardia）在 TRP 因疼痛與炎症反應而常見，屬典型症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_008","year":2025,"roc_year":114,"session":"","examNo":8,"q":"某一牧場，畜主表示懷孕3個月後的乳牛流產比例非常高，尤其是在懷孕第5至7月，且自家飼養的犬 隻能自由在牧場內行走，包含飼料走道及圈養區，也曾看到犬隻將流產的胎盤叼走。經獸醫師建議 後，將犬隻栓在牧場門口而無法隨意進入到牧場內，並且表示流產比例有逐漸的下降。根據以上狀 況，下列何者是最有可能造成牛隻流產的病因？","opts":["A. Neospora caninum","B. Trichomonas foetus","C. Toxoplasma gondii","D. Bovine herpesvirus 1"],"ans":0,"exp":"Neospora caninum（新孢子蟲）的終宿主是犬（definitive host），犬隻排出卵囊→牛隻攝入→在牛體內形成組織囊胞→懷孕時垂直感染胎兒→主要造成妊娠 5–7 個月之流產。牧場限制犬隻後流產率下降，強烈支持 Neospora 診斷。","we":["（正確）Neospora caninum 以犬為終宿主，牛為中間宿主，犬糞散播卵囊，牛攝入後導致胎兒神經肌肉損傷並流產，典型於妊娠 5–7 月。","Trichomonas foetus 透過性接觸傳播，造成早期胚胎死亡和流產，不涉及犬隻傳播途徑。","Toxoplasma gondii 終宿主為貓，雖可感染牛但傳播途徑依賴貓糞，非犬隻糞便。","Bovine herpesvirus 1（IBR）透過呼吸道及性接觸傳播，與犬隻活動於牧場關聯性低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_009","year":2025,"roc_year":114,"session":"","examNo":9,"q":"在牛隻呈現臨床症狀的澱粉樣變性症（amyloidosis）最常出現在下列那一個臟器？","opts":["A. 腎臟","B. 肝臟","C. 心臟","D. 中樞神經"],"ans":0,"exp":"牛隻澱粉樣變性（amyloidosis）最常見為 AA 型（繼發性），主要沉積於腎臟（腎小球和腎間質），造成蛋白尿、低蛋白血症和全身性水腫。臨床表現以腎臟症狀為主，遠多於肝臟、心臟或神經系統的受累。","we":["（正確）牛隻澱粉樣變性最常影響腎臟（AA 澱粉樣蛋白沉積於腎小球），造成蛋白尿和腎病症候群。","肝臟澱粉樣沉著在牛隻較少造成明顯臨床症狀，腎臟受累比肝臟更常見且更具臨床意義。","心臟澱粉樣沉著在牛隻極罕見，且心臟受累不是牛隻澱粉樣變性的主要表現。","中樞神經系統澱粉樣沉著在牛隻臨床上非常罕見，不是本病的典型受累臟器。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_010","year":2025,"roc_year":114,"session":"","examNo":10,"q":"關於仔牛地方性肺炎（enzootic pneumonia），下列敘述何者最不適當？","opts":["A. 通常為支氣管肺炎（bronchopneumonia）","B. 仔牛在經過運輸後常有較高的發生率","C. 通常發生於群體飼養之仔牛群","D. 通常由單一特定病原所引起"],"ans":3,"exp":"仔牛地方性肺炎（enzootic pneumonia）通常為「多病原性」（multifactorial），常涉及多種病毒（BRSV、BCoV、BPI3V）及細菌（Mannheimia、Pasteurella、Mycoplasma）的混合感染，並非由單一特定病原引起。","we":["仔牛地方性肺炎確實以支氣管肺炎（bronchopneumonia）為主要病變，此描述正確。","運輸壓力（shipping fever）可降低免疫力，確實提高仔牛地方性肺炎發生率，此描述正確。","群體飼養（group housing）的仔牛密度高、病原交叉感染風險大，確實好發，此描述正確。","（正確錯誤）仔牛地方性肺炎通常由多種病原共同參與，而非單一特定病原，此敘述最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_011","year":2025,"roc_year":114,"session":"","examNo":11,"q":"臨床上檢測乳牛次臨床性乳房炎的項目中，下列何者為現場最常用的篩選方式？","opts":["A. 乳汁樣本微生物培養","B. 乳營養成分分析","C. 加州乳房炎試驗（California mastitis test）","D. 乳汁樣本pH值檢測"],"ans":2,"exp":"加州乳房炎試驗（CMT）是最常用的現場篩選次臨床性乳房炎的方法。CMT 利用試劑與乳汁中 DNA 反應，體細胞數越高（即乳房炎時），反應越強（凝膠越明顯）。此法快速、廉價、可在牛隻側直接操作。","we":["乳汁微生物培養是確診病原的金標準，但費時（需 24–48 小時以上），不適合作為現場快速篩選。","乳汁營養成分分析（脂肪、蛋白質、乳糖比例）可間接反映乳房健康，但不是乳房炎的直接篩選工具。","（正確）CMT 是現場最常用的次臨床性乳房炎篩選方式，透過試劑與體細胞 DNA 反應快速判讀。","乳汁 pH 值可於乳房炎時輕度上升，但靈敏度與特異度不如 CMT，不是首選篩選方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_012","year":2025,"roc_year":114,"session":"","examNo":12,"q":"為避免Holstein新生仔牛被動免疫失效（failure of passive immunity），下列有關餵飼初乳的 敘述何者最適當？","opts":["A. Holstein母牛的初乳使用Brix曲折度計（refractometer）檢測數值為18％ Brix，可視為適當品質 的初乳","B. 第一餐的初乳所餵飼的量應為仔牛體重的15％，且在出生後4至6小時內餵飼含有至少150 g IgG的 初乳","C. 初乳餵飼前需經過巴斯德滅菌法處理，以避免病原傳播給新生仔牛","D. 經過冷藏保存56小時的初乳仍可餵飼，但須添加山梨酸鉀（potassium sorbate）作為防腐劑使用"],"ans":2,"exp":"初乳巴斯德滅菌法（60°C/30–60 min）可有效降低病原（約尼氏分枝桿菌、沙門氏菌、支原體等）傳播風險，且不顯著破壞 IgG 活性，是推薦的初乳管理措施。","we":["Holstein 初乳 Brix 折射計≥22% 才視為優質（IgG ≥50g/L），18% Brix 屬於品質不足，此選項錯誤。","第一餐初乳應為仔牛體重的 10%（非 15%），且應在出生後 1–2 小時內（最遲 4 小時）餵飼，體重 15% 的量過大。","（正確）巴斯德滅菌初乳（60°C/30 min 或 60°C/60 min）可減少病原傳播，是最適當的敘述。","冷藏保存初乳建議 24–36 小時內使用，56 小時已超出安全期；山梨酸鉀可用於保存但不是標準建議。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_013","year":2025,"roc_year":114,"session":"","examNo":13,"q":"治療牛酮病採用腎上腺皮質素注射之用意，乃在促進下列何種作用？","opts":["A. 蛋白質新生成作用","B. 糖解作用","C. 糖質新生作用","D. 蛋白質降解作用"],"ans":2,"exp":"腎上腺皮質素（糖皮質素）用於治療牛酮病的機制：促進糖質新生作用（gluconeogenesis）——將胺基酸、丙酮酸等非醣前驅物轉化為葡萄糖，提高血糖濃度，減少脂肪動員，緩解酮症。","we":["蛋白質新生成（protein synthesis）不是糖皮質素治療酮病的主要機轉，反而糖皮質素可促進蛋白質分解提供糖質新生底物。","糖解作用（glycolysis）是葡萄糖分解為丙酮酸的過程，糖皮質素並非直接促進此途徑以治療酮病。","（正確）糖皮質素促進糖質新生（gluconeogenesis），從胺基酸、丙酸等前驅物合成葡萄糖，提升血糖以治療酮病。","蛋白質降解（protein catabolism）雖是糖皮質素的作用之一（提供糖質新生底物），但治療目的是糖質新生而非單純蛋白質降解。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_014","year":2025,"roc_year":114,"session":"","examNo":14,"q":"有關乳牛發生乳熱症之敘述，下列何者最適當？","opts":["A. 母牛最常發生於分娩前","B. 本症常發生在3～5產次且低泌乳量之牛隻","C. 大多發生在分娩後48小時內","D. 病牛常見精神正常，前軀正常但後軀無力而無法站立"],"ans":2,"exp":"乳牛乳熱症（產後低血鈣）：最常於分娩後 12–48 小時內發生；好發於 3 產次以上的高泌乳量母牛；臨床三期：I 期激動不安→II 期側臥無力→III 期深度側臥昏迷。","we":["乳熱症最常發生於分娩後（非分娩前），分娩時泌乳啟動造成鈣大量需求而低血鈣，A 錯誤。","乳熱症好發於高泌乳量（非低泌乳量）的 3–5 產次母牛，泌乳量越高鈣需求越大，B 錯誤。","（正確）大多數乳熱症病例在分娩後 48 小時內發生，此時鈣的需求量超過體內調節能力。","II 期乳熱症表現為臥地、頸部 S 形彎曲（不是前軀正常），精神沉鬱而非精神正常，D 錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_015","year":2025,"roc_year":114,"session":"","examNo":15,"q":"下列那一個化學物質添加於日糧中，對預防牛產後血紅素尿（postparturient hemoglobinuria） 最沒有效果？","opts":["A. 磷（phosphorus）","B. 銅（copper）","C. 硒（selenium）","D. 鈣（calcium）"],"ans":3,"exp":"產後血紅素尿（PHU）的主要病因是低磷血症（磷缺乏），輔以銅缺乏造成紅血球脆性增加→溶血→血紅素尿。補充磷（A）和銅（B）有預防效果；硒（C）與谷胱甘肽過氧化酶有關，輔助防止氧化溶血。鈣（D）與 PHU 的發病機制無直接關聯，補充鈣對預防 PHU 最沒有效果。","we":["磷（phosphorus）缺乏是 PHU 的主要病因，日糧補充磷是最有效的預防措施之一。","銅（copper）缺乏導致紅血球超氧化物歧化酶活性下降，造成氧化性溶血，補充銅有預防作用。","硒（selenium）透過穀胱甘肽過氧化酶保護紅血球免受氧化損傷，適量補充有輔助預防效果。","（正確）鈣與 PHU 的溶血機制無直接關聯，補充鈣對預防產後血紅素尿最沒有效果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_016","year":2025,"roc_year":114,"session":"","examNo":16,"q":"放牧的肉牛大量食入羊齒蕨植物（bracken fern）後，最可能出現下列何種異常反應？","opts":["A. 心律不整","B. 肝臟衰竭","C. 骨髓功能被抑制","D. 神經症狀"],"ans":2,"exp":"羊齒蕨（bracken fern）含有 ptaquiloside 等毒素，大量攝入後抑制骨髓功能（aplastic anemia），造成全血球減少：血小板減少→出血；嗜中性球減少→繼發感染；紅血球減少→貧血。慢性攝入可引起地方性血尿（enzootic hematuria，膀胱腫瘤）。","we":["心律不整與羊齒蕨中毒無直接關聯；強心苷類植物（如毛地黃）才是典型心律不整病因。","肝臟衰竭與銅中毒、黃麴毒素等有關，不是羊齒蕨慢性中毒的主要臨床表現。","（正確）ptaquiloside 抑制骨髓造血幹細胞，造成再生不良性貧血、出血傾向及免疫抑制。","神經症狀與羊齒蕨急性中毒在馬匹（thiamine 缺乏）有關，但牛隻主要表現為骨髓抑制而非神經症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_017","year":2025,"roc_year":114,"session":"","examNo":17,"q":"一頭10日齡40公斤嚴重下痢的小牛，體溫36.3℃，小牛倒臥且虛弱，眼眶凹陷與眼球達1公分寬， 下列何種治療最適當？","opts":["A. 靜脈注射1公升Ringer's solution加gentamicin","B. 靜脈注射4公升生理鹽水加葡萄糖液","C. 皮下注射1公升生理鹽水加NaHCO 3 及少量的K +","D. 靜脈注射4公升生理鹽水加葡萄糖液、NaHCO 3 及少量的K +"],"ans":3,"exp":"嚴重下痢仔牛（10日齡，眼眶凹陷 1 cm ≈ 10–12% 脫水，倒臥虛弱，體溫 36.3°C 低體溫）：需靜脈輸液（皮下輸液吸收不良），4L 補充脫水量，加葡萄糖（低血糖風險）、NaHCO₃（代謝性酸中毒）及少量 K⁺（低血鉀）。選 D。","we":["IV 1L Ringer's + gentamicin 量不足（需 4L），且 gentamicin 對脫水動物有腎毒性，不是首選。","IV 4L 生理鹽水 + 葡萄糖 缺少碳酸氫鈉（無法矯正嚴重代謝性酸中毒）和鉀離子，不完整。","皮下注射（SC）對倒臥虛弱的仔牛吸收不良，不適合嚴重脫水的緊急補液。","（正確）IV 4L 生理鹽水 + 葡萄糖 + NaHCO₃ + 少量 K⁺ 同時矯正脫水、低血糖、酸中毒和低血鉀，最為完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_018","year":2025,"roc_year":114,"session":"","examNo":18,"q":"在小牛臍帶炎的外科手術中，必須注意是否因臍靜脈發炎而導致何種器官的併發感染？","opts":["A. 肝臟","B. 小腸","C. 膀胱","D. 心臟"],"ans":0,"exp":"臍靜脈（umbilical vein）連接臍部→門脈系統→肝臟。臍靜脈發炎（omphalophlebitis）可沿靜脈蔓延至肝臟，造成肝臟膿瘍（hepatic abscess）。因此臍帶炎手術時需評估肝臟是否受累。","we":["（正確）臍靜脈直接引流至肝臟（經門脈），發炎可向上蔓延造成肝臟膿瘍，術中需觸診評估肝臟。","小腸與臍靜脈無直接解剖連通，臍靜脈發炎不會直接導致小腸感染。","膀胱與臍尿管（urachus）相連，臍尿管感染可影響膀胱，但問題特指「臍靜脈」，非臍尿管。","心臟位於臍靜脈血流下游，細菌性心內膜炎理論上可能，但肝臟是第一個受累器官。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_019","year":2025,"roc_year":114,"session":"","examNo":19,"q":"乳牛產後發生第四胃往右或往左方向的異位，常取決於發生異位當下的何種因素？","opts":["A. 喜愛側躺的方向","B. 採食日糧的精粗料比","C. 瘤胃的大小","D. 血鈣濃度的高低"],"ans":0,"exp":"第四胃左側或右側異位的方向，與母牛發生異位時偏好側躺的方向有關：若母牛偏好右側側躺，第四胃擴張後傾向往右移（RDA）；偏好左側側躺則較易發生左側異位（LDA），此為最常被引用的決定因素。","we":["（正確）發生異位當下母牛側躺的方向決定第四胃偏向左側或右側移動，LDA 比 RDA 更常見（約 85%）。","日糧精粗料比影響瘤胃 pH 值和蠕動，是 LDA 的危險因子之一，但不是決定左右方向的主要因素。","瘤胃大小（體積）影響腹腔空間，瘤胃萎縮為 LDA 危險因子，但不直接決定左右異位方向。","低血鈣影響第四胃蠕動力，是 LDA 的全身性危險因子，但不是決定左右方向的主要機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_020","year":2025,"roc_year":114,"session":"","examNo":20,"q":"有關乳牛第四胃左側異位的治療，下列何者對左腹脇部切開大網膜固定術之敘述最不適當？","opts":["A. 使用不可吸收線固定時，可能造成第四胃瘻管","B. 可能造成乳靜脈穿刺","C. 手短的手術者不利進行此術式","D. 視野不佳無法容易接觸第四胃進行排氣及復位(E)一律給分"],"ans":0,"exp":"本題由考選部公告「（E）一律給分」，表示此題答案有爭議，每位考生均獲分。關於左腹脇部切開大網膜固定術（left flank omentopexy）：使用不可吸收縫線可能造成第四胃瘻管；視野有限；手短者不易操作。乳靜脈（milk vein）位於腹中線側，一般不在左脇部手術風險範圍內（此點有爭議）。","we":["使用不可吸收縫線固定大網膜確實可能侵蝕第四胃壁造成瘻管，屬已知手術風險，描述適當。","乳靜脈位於腹部腹側，左脇部切開手術中穿刺乳靜脈的風險有爭議，本題為一律給分題。","手短的手術者在左脇部進行網膜固定術時確實操作困難，此描述屬適當提醒。","左脇部切開視野確實受限，不易直接接觸第四胃進行排氣及復位，此描述適當。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_021","year":2025,"roc_year":114,"session":"","examNo":21,"q":"下列何種治療方式對剛出生仔牛的先天性腕關節彎曲最沒有幫助？","opts":["A. 校正蹄鞋（glue-on shoe）","B. 尺腕屈肌（flexor carpi ulnaris muscle）與外尺肌（ulnaris lateralis muscle）肌腱切斷術","C. 拉伸復健","D. 夾板固定"],"ans":0,"exp":"先天性腕關節彎曲（congenital carpal flexion deformity）的治療包括：物理治療（拉伸復健）、夾板固定、必要時屈肌腱切斷術。「校正蹄鞋（glue-on shoe）」用於矯正蹄部角度問題，對於腕關節彎曲無直接矯正效果，最沒有幫助。","we":["（正確）校正蹄鞋是針對蹄部角度問題的治療工具，對先天性腕關節彎曲幾乎無矯正效果。","嚴重或保守治療無效的腕關節彎曲，可進行屈肌腱切斷術（如尺腕屈肌/外尺肌腱），有臨床效果。","拉伸復健（物理治療）是輕至中度先天性腕關節彎曲的第一線保守治療，有明確幫助。","夾板固定可維持腕關節在正確位置，配合物理治療促進肌腱延展，對治療有幫助。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_022","year":2025,"roc_year":114,"session":"","examNo":22,"q":"眼球後神經阻斷法（retrobulbar block）常使用於反芻動物的眼球手術，關於此技術之敘述，下 列何者錯誤？","opts":["A. 可能造成眼球後出血","B. 可能造成視神經受傷","C. 可能將麻醉劑注入腦膜","D. 對眼球不易造成傷害"],"ans":3,"exp":"眼球後神經阻斷（retrobulbar block）的已知風險包括：眼球後出血（retrorbulbar hemorrhage）、視神經損傷、麻醉劑注入腦膜下腔（needle可沿視神經鞘到達顱內）。因此「對眼球不易造成傷害」是錯誤的——注射針頭本身即可直接損傷眼球，且升高眼內壓。","we":["眼球後出血確實是 retrobulbar block 的常見併發症，注射時血管易破裂，A 描述正確。","視神經損傷確實是 retrobulbar block 的風險，針頭可直接刺傷視神經，B 描述正確。","沿視神經鞘注射麻醉劑可能擴散至蛛網膜下腔（腦脊液），造成廣泛神經阻斷，C 描述正確。","（正確錯誤）retrobulbar block 可直接損傷眼球（針刺穿眼球）並升高眼內壓，「不易造成傷害」為錯誤敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_023","year":2025,"roc_year":114,"session":"","examNo":23,"q":"於仔牛去勢時，若選擇切開手術去勢術，應使用下圖何種器械切斷精索部位？","opts":["A. 甲","B. 乙","C. 丙","D. 丁"],"ans":0,"exp":"仔牛開放式去勢手術（切開法）應使用 emasculator（去勢鉗）切斷精索，同時達到切斷和壓碎止血的效果。本題需依圖辨識器械。（圖片題，標記待覆核）","we":["（正確依圖判斷）Emasculator（去勢鉗）是切開去勢手術中用於精索的標準器械，兼具切斷與止血功能。","乙圖器械需依圖判斷是否為去勢鉗或其他外科器械。","丙圖器械需依圖判斷功能。","丁圖器械需依圖判斷功能。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_024","year":2025,"roc_year":114,"session":"","examNo":24,"q":"牧場中有母牛懷孕270天，觸診胎兒已死亡，外陰部有暗紅色惡臭分泌物，經施打類固醇及PGF 2α引 產無效後決定進行帝王切開術，母牛因多日未進食體力不佳無法長時間站立，下列那一個開創術式 最不適合本病例？","opts":["A. 左腹脇部切開（left flank approach）","B. 腹中線旁切開（ventral paramedian approach）","C. 腹中線切開（ventral medline approach）","D. 腹外側斜線切開（ventrolateral oblique approach）"],"ans":2,"exp":"母牛體力不佳無法長時間站立，加上胎兒死亡腐敗：腹中線切開（ventral midline）需完全背位保定，對反芻動物有嚴重脹氣/逆流吸入風險，且腐敗羊水可大量汙染手術野；此為體弱反芻動物剖腹產最不適合的術式。","we":["左腹脇部切開可在站立或側躺保定下進行，對體弱母牛相對安全，但站立受限時操作難度增加。","腹中線旁切開同樣需要背位保定，有脹氣/逆流風險，但比正中線切開稍微可行（腹旁側偏移）。","（正確）腹中線切開（ventral midline）需完全背位，反芻動物有脹氣和逆流窒息風險，為最不適合術式。","腹外側斜線切開可在半側臥位進行，適合體力不佳無法站立的母牛，較腹中線安全。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_025","year":2025,"roc_year":114,"session":"","examNo":25,"q":"仔牛進行臍赫尼亞手術時，切開皮下組織露出赫尼亞環如下圖A後，要從圖B的那一條綠色虛線進行 切創打開腹腔並切除赫尼亞囊最適當？","opts":["A. ①","B. ②","C. ③","D. ④"],"ans":0,"exp":"臍赫尼亞環切開位置：應選擇赫尼亞環的最佳開口線，通常沿赫尼亞環邊緣切開，注意避開血管和重要結構。（圖片題，標記待覆核）","we":["（正確依圖判斷）臍赫尼亞修復應在赫尼亞環安全區域切創打開腹腔，以利完整切除赫尼亞囊。","②號虛線位置需依圖判斷是否合適。","③號虛線位置需依圖判斷。","④號虛線位置需依圖判斷。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_026","year":2025,"roc_year":114,"session":"","examNo":26,"q":"有一放牧綿羊群，部分羊隻突然出現血尿及猝死，剖檢時，於皮下及大網膜等處發現全身出血或鬱 血斑，於膀胱發現血塊，於瘤胃發現乳突狀瘤增生（ruminal papillomatosis），下列何種疾病最 符合上述症狀？","opts":["A. 羊齒蕨中毒","B. 銅中毒","C. 銅缺乏","D. 鉬中毒"],"ans":0,"exp":"血尿、猝死、全身出血/鬱血、膀胱血塊、瘤胃乳突狀瘤增生（ruminal papillomatosis）→高度符合羊齒蕨中毒（bracken fern toxicosis）：ptaquiloside 造成骨髓抑制（再生不良性貧血、血小板減少→出血）+地方性血尿（enzootic hematuria，膀胱腫瘤/乳突瘤）+瘤胃乳突瘤。","we":["（正確）羊齒蕨慢性中毒在綿羊表現為：骨髓抑制（出血）+ 地方性血尿（膀胱乳突瘤）+ 瘤胃乳突狀瘤增生，完全符合本題描述。","銅中毒（急性）表現為黃疸、溶血性貧血、血紅素尿，與瘤胃乳突瘤無關，不符合本題。","銅缺乏造成共濟失調（swayback）或白肌病，不是出血性/血尿表現，不符合本題。","鉬中毒會干擾銅吸收造成繼發性銅缺乏，表現為腹瀉、毛色改變，不會造成血尿和骨髓抑制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_027","year":2025,"roc_year":114,"session":"","examNo":27,"q":"成年山羊頻繁做出排尿動作但未有尿液排出，觸診可感覺膀胱脹大，尿道乙狀彎曲處未有明顯硬 塊，在沒有其他診斷工具下，建議先嘗試下列何種治療法？","opts":["A. 尿道造口術","B. 陰莖切開術","C. 膀胱切開術","D. 尿道突切除"],"ans":3,"exp":"雄性山羊泌尿道阻塞最常見部位為尿道突（urethral process）。在無診斷工具的情況下，乙狀彎曲處無明顯硬塊，最可能阻塞在尿道突→先嘗試切除尿道突（最簡單、最快速的第一線處置）。若仍無效再考慮尿道造口術或其他手術。","we":["尿道造口術（urethrostomy）是尿道突切除失敗後的次選術式，創傷較大，不是第一步處置。","陰莖切開術（penile transection）是在所有保守治療和尿道造口失敗後的最後手段，創傷最大。","膀胱切開術（cystotomy）可排空膀胱，但不能解除尿道阻塞，通常配合其他術式。","（正確）尿道突切除（amputation of urethral process）是雄性山羊泌尿道阻塞最常見的第一線簡易手術，可在局麻下快速完成。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_028","year":2025,"roc_year":114,"session":"","examNo":28,"q":"有關犬隻疾病之敘述，下列何者最適當？","opts":["A. 大型犬在脾臟腫瘤和骨肉瘤的患病率較低","B. 小型犬比較不易罹患慢性胰腺炎","C. 自發性免疫性多發性關節炎（idiopathic immune-mediated polyarthritis）於各年齡層均可發 現，常見於3～7歲犬隻","D. 小型犬隻比較容易有心臟腫瘤"],"ans":2,"exp":"自發性免疫性多發性關節炎（idiopathic immune-mediated polyarthritis, IMPA）可發生於各年齡層犬隻，最常見於中年犬（3–7 歲），品種無顯著好發傾向（但中型至大型犬略多）。","we":["大型犬的脾臟腫瘤（血管肉瘤）和骨肉瘤發生率遠高於小型犬，A 的「較低」描述錯誤。","慢性胰腺炎（chronic pancreatitis）在小型犬（尤其 Miniature Schnauzer）發生率更高，B 錯誤。","（正確）IMPA 可發生於各年齡層，常見於 3–7 歲犬隻，此描述最適當。","心臟腫瘤（如右心房血管肉瘤）好發於大型犬（German Shepherd、Golden Retriever），非小型犬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_029","year":2025,"roc_year":114,"session":"","examNo":29,"q":"肝臟疾病會引起何種營養素缺乏而導致凝血功能障礙？","opts":["A. 維生素K","B. 維生素C","C. 維生素B","D. Fe"],"ans":0,"exp":"肝臟疾病時：①膽汁分泌減少→脂溶性維生素 K 吸收障礙；②肝細胞損傷→無法利用維生素 K 進行凝血因子（II、VII、IX、X）的 γ-羧化→凝血功能障礙（PT/APTT 延長）。","we":["（正確）維生素 K 缺乏（因膽汁減少影響吸收，或肝細胞損傷無法活化維生素 K 依賴性凝血因子）是肝臟疾病引起凝血障礙的主要機制。","維生素 C 缺乏造成膠原蛋白合成障礙（壞血病），不是肝臟疾病凝血障礙的主要原因。","維生素 B 群缺乏影響代謝酶功能，不直接造成凝血因子合成不足。","鐵缺乏（Fe）造成缺鐵性貧血，不是肝臟疾病凝血障礙的機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_030","year":2025,"roc_year":114,"session":"","examNo":30,"q":"貓第四期慢性腎病，經過輸液治療後，頭抬不起來，身體變軟弱，最可能的原因為下列何者？","opts":["A. 低血鈉","B. 低血鉀","C. 高血鈣","D. 高血磷"],"ans":1,"exp":"貓第四期慢性腎病（CKD）在靜脈輸液後出現頸部腹側彎曲（頭抬不起來）及全身軟弱：這是低血鉀（hypokalemia）的典型表現。CKD 貓常見低血鉀（因腎臟保鉀能力下降），輸液進一步稀釋血鉀→頸腹屈（ventroflexion）和骨骼肌無力。","we":["低血鈉（hyponatremia）主要表現為神經症狀（嗜睡、癲癇），不是頸部腹屈和軟弱的典型原因。","（正確）低血鉀（hypokalemia）造成骨骼肌無力，貓的特徵性表現為頸部腹屈（ventroflexion）和全身軟弱；CKD 貓輸液後鉀濃度進一步下降。","高血鈣（hypercalcemia）可造成多尿、嗜睡、心律不整，不是此情境的典型表現。","高血磷（hyperphosphatemia）在 CKD 貓很常見，但不直接造成肌肉軟弱和頸部腹屈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_031","year":2025,"roc_year":114,"session":"","examNo":31,"q":"利用側照X光評估犬貓的vertebral heart score（VHS）時，量測時不會用到下列何種定位點？","opts":["A. 心尖","B. 第四胸椎","C. 後腔靜脈","D. 左主支氣管"],"ans":2,"exp":"VHS（Vertebral Heart Score，Buchanan 法）量測：側位 X 光→長軸（long axis）從心臟最腹側（心尖）到頭背側（支氣管分叉/隆突處）→轉移至 T4 起計算椎體數；短軸（short axis）垂直於長軸的最寬處。所用定位點：心尖（A）、T4（B）、左主支氣管（D 隆突端）。後腔靜脈（caudal vena cava）不是標準 VHS 量測的定位點。","we":["心尖（cardiac apex）是 VHS 長軸的末端定位點，量測時必須使用，是必要的定位點。","第四胸椎（T4）是 VHS 椎體長度比較的起始點，為量測時必要的參考定位，不可省略。","（正確）後腔靜脈（CVC）不是標準 VHS 量測的定位點，量測中不會用到後腔靜脈。","左主支氣管（left main bronchus / 隆突）是 VHS 短軸的起始定位點，量測時必須使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_032","year":2025,"roc_year":114,"session":"","examNo":32,"q":"貓因疱疹病毒感染（herpesvirus infection）而引起結膜炎與角膜炎，常會併發那個系統疾病？","opts":["A. 胃炎","B. 上呼吸道疾病","C. 腸炎","D. 肺炎"],"ans":1,"exp":"貓疱疹病毒 1（FHV-1）感染後，除造成眼部疾病（結膜炎、角膜潰瘍）外，最常見的合併症為上呼吸道疾病（鼻炎、鼻竇炎、打噴嚏、鼻分泌物）。FHV-1 是貓上呼吸道感染（URTI）的重要病原之一。","we":["胃炎不是 FHV-1 感染的典型合併症，FHV-1 主要親眼睛和上呼吸道黏膜上皮。","（正確）FHV-1 感染的典型表現為眼部疾病（結膜炎/角膜炎）合併上呼吸道疾病（鼻炎、噴嚏），兩者常同時出現。","腸炎不是 FHV-1 感染的典型合併症；腸道病毒感染（FPV）才主要影響腸道。","肺炎在重症 FHV-1（免疫抑制患者）偶見，但不是 FHV-1 最常見的合併症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_033","year":2025,"roc_year":114,"session":"","examNo":33,"q":"一隻12歲馬爾濟斯犬經由心臟聽診發現第四級收縮期心雜音，且聽診雜音最大強度位置（point of maximal intensity, PMI）在左側心基部（left base）。依據以上結果應診斷為下列那種心臟 病？","opts":["A. 二尖瓣逆流（mitral regurgitation）","B. 三尖瓣逆流（tricuspid regurgitation）","C. 主動脈閉鎖不全（aortic insufficiency）","D. 肺動脈狹窄（pulmonic stenosis）"],"ans":3,"exp":"心雜音定位：左心基部（left base）= 主動脈瓣及肺動脈瓣聽診區。收縮期（systolic）雜音在左基部 → 肺動脈狹窄（pulmonic stenosis）最常見（通常為收縮期噴射型雜音）。主動脈閉鎖不全為舒張期雜音；二尖瓣逆流的 PMI 在左側心尖部；三尖瓣逆流的 PMI 在右側。","we":["二尖瓣逆流（mitral regurgitation）的 PMI 在左側心尖部（left apex），不在左側心基部。","三尖瓣逆流（tricuspid regurgitation）的 PMI 在右側胸壁，不在左側心基部。","主動脈閉鎖不全（aortic insufficiency/regurgitation）是舒張期雜音，而本題為收縮期雜音，不符。","（正確）肺動脈狹窄（pulmonic stenosis）產生收縮期噴射性雜音，PMI 在左側心基部，符合描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_034","year":2025,"roc_year":114,"session":"","examNo":34,"q":"有關犬隻絲球體性腎病造成蛋白尿之處理，在未能確定病因前，不適合使用下列何者？","opts":["A. 血管張力素轉換酶抑制劑（angiotensin-converting enzyme inhibitors）","B. 血管張力素受體阻斷劑（angiotensin receptor blockers）","C. 低劑量aspirin","D. 類固醇（corticosteroids）"],"ans":3,"exp":"犬絲球體性腎病蛋白尿：在確認病因前不宜使用類固醇（corticosteroids），因為若病因為感染性（如心絲蟲、立克次體）或非免疫性（遺傳性、高血壓），類固醇可能加重蛋白尿和腎臟損傷。必須先進行腎臟切片確認免疫介導性後才可使用。","we":["ACE 抑制劑可降低腎小球內壓力和蛋白尿，對各種原因的腎病蛋白尿均有保護效果，可先使用。","ARBs 機制類似 ACE 抑制劑，可降低絲球體蛋白漏出，在確認病因前相對安全。","低劑量 aspirin 用於高凝狀態（腎病症候群易血栓），在確認病因前使用相對安全。","（正確）類固醇在確認非感染性/免疫介導性病因前不應使用，可能惡化感染性或遺傳性腎病，最不適合在未確定病因前給予。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_035","year":2025,"roc_year":114,"session":"","examNo":35,"q":"13歲，已絕育混種公貓，因嘔吐下痢就診，下圖為其腹腔X光影像，箭號所指為何？","opts":["A. 胰臟（pancreas）","B. 脾臟（spleen）","C. 小腸（small intestine）","D. 淋巴結（lymph node）"],"ans":0,"exp":"本題為腹腔 X 光影像辨識題（13 歲貓，嘔吐下痢），箭號所指結構需依圖判斷。老年貓嘔吐下痢伴腹腔腫塊常考慮腸道腫瘤（淋巴瘤）或腸套疊。（圖片題，標記待覆核）","we":["胰臟（pancreas）在貓腹部 X 光通常不易辨識，需超音波確認。","脾臟（spleen）在貓通常位於左中腹部，腫大時可見明顯軟組織影。","小腸（small intestine）環狀分布，有時可見積氣或阻塞改變。","淋巴結（lymph node）腫大在淋巴瘤時常見，有時 X 光可見腹腔腫塊影。"],"needs_review":true,"imgs":[]},{"id":"AMO_2025_普通病_036","year":2025,"roc_year":114,"session":"","examNo":36,"q":"下列選項何者最不可能引起氣胸？","opts":["A. 肺臟臟層胸膜撕裂（tear in lung involving visceral pleura）","B. 橫膈疝氣（diaphragmatic hernia）","C. 嚴重縱膈氣腫（severe pneumomediastinum）","D. 肺臟腔室樣團塊破裂（rupture of cavitary lung mass）"],"ans":1,"exp":"氣胸（pneumothorax）的常見原因包括：肺臟臟層胸膜撕裂（空氣直接進入胸腔）、嚴重縱膈氣腫（空氣沿筋膜滲入胸膜腔）、空洞性肺腫塊破裂（空洞內氣體釋放）。橫膈疝氣（diaphragmatic hernia）是腹腔臟器疝入胸腔，本身不直接導致氣胸（空氣進入胸膜腔）。","we":["肺臟臟層胸膜撕裂直接使肺內空氣進入胸膜腔，是氣胸的常見直接原因。","（正確）橫膈疝氣是腹腔臟器（腸管、胃、肝等）進入胸腔，但不會直接導致胸膜腔積氣，最不可能引起氣胸。","嚴重縱膈氣腫時，縱膈內氣體可沿胸膜反折滲入胸膜腔，造成繼發性氣胸。","空洞性肺腫塊（如膿瘍、囊腫）破裂後，腔室內氣體直接進入胸膜腔，可造成氣胸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_037","year":2025,"roc_year":114,"session":"","examNo":37,"q":"一隻6歲齡已絕育的雄性短毛家貓，過去1週，持續有厭食、呼吸困難和張口呼吸的病史。身體檢查 時聽診發現心音變小（muffled heart sounds），在胸腔兩邊的腹側面皆聽到混濁的肺音（dull lung sound）。根據檢查結果，懷疑有胸腔積液（pleural effusion）。胸腔穿刺其積液樣本，分 析結果顯示為修飾性漏出液（modified transudate）。下列何者是此貓發生胸腔積液最可能的潛 在病因（underlying cause）？","opts":["A. 鬱血性心衰竭","B. 貓傳染性腹膜炎","C. 低白蛋白血症","D. 肺葉扭轉"],"ans":0,"exp":"修飾性漏出液（modified transudate）：蛋白質中等（2.5–5.5 g/dL），細胞數低至中等。貓雙側胸腔積液 + 心音減弱 + 呼吸困難 + 修飾性漏出液 → 鬱血性心衰竭（CHF）最常見。FIP 造成滲出液（高蛋白）；低蛋白血症造成純漏出液（低蛋白）；肺葉扭轉造成乳糜胸或血胸。","we":["（正確）鬱血性心衰竭（CHF）是貓雙側胸腔積液最常見的原因，積液性質為修飾性漏出液，心音因積液而減弱，與本題描述完全符合。","貓傳染性腹膜炎（FIP）造成的胸腔積液通常為高蛋白滲出液（黃色黏稠），而非修飾性漏出液。","低白蛋白血症造成的胸腔積液通常為純漏出液（低蛋白、低細胞數），而非修飾性漏出液。","肺葉扭轉造成乳糜胸或血性積液，不是修飾性漏出液，且通常為單側。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_038","year":2025,"roc_year":114,"session":"","examNo":38,"q":"最常造成貓動脈血栓症的原因為下列何者？","opts":["A. 心肌病","B. 糖尿病","C. 甲狀腺功能低下","D. 蛋白流失性腎病"],"ans":0,"exp":"貓動脈血栓症（feline aortic thromboembolism, FATE）：最常見原因為心肌病（cardiomyopathy），尤其是肥厚性心肌病（HCM）。左心房擴大→血流停滯→血栓形成→脫落至主動脈分叉（saddle thrombus）→後肢急性截癱（cold/painful hindlimbs）。","we":["（正確）心肌病（尤其 HCM）是貓 FATE 最常見原因，左心房擴大導致血液停滯和血栓形成。","糖尿病可增加血栓風險，但不是貓 FATE 最常見的直接原因；心肌病遠比糖尿病更常見。","甲狀腺功能低下在貓中極罕見，且不是 FATE 的主要原因；甲狀腺功能亢進反而與繼發性心肌病相關。","蛋白流失性腎病可增加高凝狀態，但不是貓 FATE 最常見的原因；心肌病仍占大多數。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_039","year":2025,"roc_year":114,"session":"","examNo":39,"q":"在犬貓出現呼吸困難時，可以提供不同的供氧方式，在依據不同方式的建議流量下，下列何種方式 能達到最大氧氣濃度？","opts":["A. transtracheal catheter","B. nasal catheter","C. tracheal tube","D. oxygen case"],"ans":2,"exp":"各氧氣供應方式在建議流量下的最高氧氣濃度：tracheal tube（氣管插管）搭配密閉迴路可達接近 100% FiO₂；transtracheal catheter 約 40–60%；nasal catheter 約 30–50%；oxygen cage 約 40%。氣管插管（tracheal tube）可達最高氧氣濃度。","we":["Transtracheal catheter 可提供 40–60% FiO₂，比 nasal catheter 高，但低於氣管插管。","Nasal catheter 提供約 30–50% FiO₂，取決於流量，低於氣管內插管。","（正確）Tracheal tube（氣管插管）搭配麻醉機密閉迴路可提供接近 100% 的氧氣濃度，為各方式中最高。","Oxygen cage（氧氣箱）通常維持 40% 左右的 FiO₂，低於氣管插管和 transtracheal catheter。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_040","year":2025,"roc_year":114,"session":"","examNo":40,"q":"庫姆氏試驗（Coombs test）通常為檢測體內溶血的抗體是否存在，下列敘述何者最不適當？","opts":["A. 庫姆氏試驗的結果可以用來作為評估免疫性溶血性貧血的預後","B. 敗血症的犬隻庫姆氏試驗可能會出現偽陽性","C. 高丙種球蛋白血症（hypergammaglobulinemia）的犬隻庫姆氏試驗可能會出現偽陽性","D. 人為造成試劑的污染可能會導致檢驗結果出現偽陰性或偽陽性"],"ans":0,"exp":"Coombs 試驗是診斷工具（偵測紅血球表面抗體），不是預後評估工具。Coombs 結果陽性/陰性並不能預測 IMHA 的預後，因此「用 Coombs 結果評估預後」是最不適當的敘述。","we":["（正確）Coombs 試驗是診斷 IMHA 的工具，其結果（陽性或陰性）不能作為疾病預後的指標，此描述最不適當。","敗血症可非特異性地使免疫球蛋白吸附於紅血球表面→Coombs 偽陽性，此描述正確。","高丙種球蛋白血症時多餘的 Ig 可非特異性吸附紅血球→Coombs 偽陽性，此描述正確。","試劑污染（蛋白質汙染等）可干擾反應，造成偽陰性或偽陽性，此描述正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_041","year":2025,"roc_year":114,"session":"","examNo":41,"q":"下列何種疾病或血液異常所引起的多渴多尿機制與抗利尿激素（antidiuretic hormone）最不相 關？","opts":["A. 腎上腺功能亢進","B. 解除阻塞後的利尿現象（postobstructive diuresis）","C. 糖尿病","D. 低鉀血症"],"ans":2,"exp":"ADH（抗利尿激素）相關的多渴多尿：腎上腺功能亢進（A）— 皮質醇拮抗 ADH 作用；解除阻塞後利尿（B）— 尿素等溶質滲透利尿，與 ADH 關聯較間接；低血鉀（D）— 干擾 ADH 受體訊號（aquaporin-2 下調）。糖尿病（DM，C）— 高血糖→糖尿→滲透性利尿，完全不依賴 ADH，是與 ADH 最不相關的機制。","we":["腎上腺功能亢進（Cushing's）的高皮質醇直接拮抗 ADH 分泌和腎小管反應，ADH 相關。","解除阻塞後利尿涉及尿素等積聚造成的滲透利尿，與 ADH 關聯較少，但間接有關。","（正確）DM 的多尿因葡萄糖超過腎閾值形成滲透利尿，此機制完全不依賴 ADH，是最不相關者。","低血鉀下調腎臟 aquaporin-2 通道（ADH 信號路徑），造成腎性尿崩，與 ADH 反應性有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_042","year":2025,"roc_year":114,"session":"","examNo":42,"q":"某犬被診斷為急性腎損傷，下列何者最不可能出現？","opts":["A. 腎臟大小可能正常","B. 腎臟大小可能輕微變大","C. 超音波顯示副甲狀腺增大","D. 體重沒有明顯下降"],"ans":2,"exp":"急性腎損傷（AKI）的特點：腎臟大小可正常或輕度腫大（水腫/炎症）；體重短期可能增加（液體瀦留）或無明顯變化；不會出現副甲狀腺增大——副甲狀腺增大（繼發性副甲狀腺功能亢進）是慢性腎病（CKD）長期高磷低鈣刺激的表現，需數月至數年才發展，AKI 不會出現此變化。","we":["腎臟大小正常在 AKI 中可見（尤其腎前性 AKI 早期），A 是可能出現的表現。","腎臟輕微腫大（水腫、充血、炎症滲出）在 AKI 中可見，B 是可能出現的表現。","（正確）副甲狀腺增大是 CKD 長期刺激的結果（慢性低鈣高磷→繼發性副甲功能亢進），AKI 病程過短，最不可能出現。","體重無明顯下降在 AKI 中是合理表現（病程短，尚無顯著肌肉消耗），D 可能出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_043","year":2025,"roc_year":114,"session":"","examNo":43,"q":"下列何項貓肝病的治療，會選擇免疫抑制劑或類固醇製劑？","opts":["A. 嗜中性球性膽管炎","B. 淋巴球性膽管炎","C. 肝臟類澱粉沉著症","D. 肝門脈分流"],"ans":1,"exp":"貓膽管炎/膽管肝炎：嗜中性球性膽管炎（neutrophilic cholangitis）→細菌感染→抗生素治療；淋巴球性膽管炎（lymphocytic cholangitis）→免疫介導性→免疫抑制劑（潑尼松龍、苯丁酸氮芥）治療。","we":["嗜中性球性膽管炎由細菌感染引起，以抗生素（amoxicillin-clavulanate 或 fluoroquinolone）治療，不是免疫抑制劑的適應症。","（正確）淋巴球性膽管炎為免疫介導性，治療選擇免疫抑制劑（prednisolone ± chlorambucil）。","肝臟類澱粉沉著症（hepatic amyloidosis）無特效免疫抑制治療，以支持性療法為主。","肝門脈分流（portosystemic shunt）以手術結紮或低蛋白飲食管理為主，免疫抑制劑無效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_044","year":2025,"roc_year":114,"session":"","examNo":44,"q":"關於貓脂肪肝（hepatic lipidosis）的敘述，下列何者最不適當？","opts":["A. 好發於肥胖貓","B. 容易出現多渴（polydipsia）、多尿（polyuria）的症狀","C. 高膽紅素血症（hyperbilirubinemia）是常見的血檢異常","D. 建議給予高蛋白質飲食"],"ans":1,"exp":"貓脂肪肝（hepatic lipidosis）的特徵：肥胖貓（A 正確）、黃疸/高膽紅素血症（C 正確）、建議高蛋白飲食（D 正確）。多渴多尿（PU/PD，B）不是貓脂肪肝的典型症狀——PU/PD 更常見於 DM、CKD、甲狀腺功能亢進等。脂肪肝主要表現為黃疸、食慾廢絕、嗜睡。","we":["好發於肥胖貓是脂肪肝的公認危險因子，肥胖貓在厭食時大量動員脂肪→肝臟負荷超載，A 正確。","（正確）多渴多尿不是貓脂肪肝的典型症狀，PU/PD 主要與 DM、CKD 或甲亢有關；此選項最不適當。","高膽紅素血症（hyperbilirubinemia）是脂肪肝常見的血液學異常，造成臨床黃疸，C 正確。","高蛋白飲食（high-protein diet）是貓脂肪肝的建議飲食，以促進白蛋白合成和脂肪代謝，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_045","year":2025,"roc_year":114,"session":"","examNo":45,"q":"下列何者不是貓甲狀腺功能亢進常見的共病症（common concurrent problems）？","opts":["A. 再生性貧血","B. 肥厚性心肌病","C. 泌尿道感染","D. 高血壓"],"ans":0,"exp":"貓甲狀腺功能亢進常見共病症包括：HCM（肥厚性心肌病）、高血壓（約 25%）、CKD（被高血流量掩蓋）。再生性貧血（regenerative anemia）不是甲亢的典型共病；甲亢貓若有貧血通常為非再生性（慢性病貧血），而非再生性貧血（後者多因血液流失/溶血）。","we":["（正確）再生性貧血（如溶血性貧血或失血後）不是貓甲狀腺功能亢進的典型共病症，為最不常見者。","肥厚性心肌病（HCM）是甲亢貓最常見的心臟共病，甲狀腺激素過多直接造成心肌肥厚。","泌尿道感染在甲亢貓稍有增加（因多尿稀釋尿液），但相比 HCM 和高血壓，不是最典型的。","高血壓在甲亢貓中常見（約 25%），與腎上腺素系統激活有關，是重要共病症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_046","year":2025,"roc_year":114,"session":"","examNo":46,"q":"在臺灣，下列何者不是貓疫苗指引的核心疫苗？","opts":["A. feline leukemia virus","B. feline panleukopenia virus","C. feline calicivirus","D. feline herpesvirus-1"],"ans":0,"exp":"台灣貓疫苗核心疫苗（依 WSAVA 指引）：FPV（貓泛白血球減少症病毒）、FCV（貓卡里西病毒）、FHV-1（貓疱疹病毒 1）。FeLV（貓白血病病毒）在台灣為「非核心疫苗」（non-core），視生活型態風險決定是否施打（室外/多貓環境高風險）。","we":["（正確）FeLV 在台灣屬非核心疫苗，依生活型態風險決定是否施打，不在所有貓的常規核心疫苗清單中。","FPV（貓泛白血球減少症）是台灣貓的核心疫苗，為高度接觸性、致死性病毒，所有貓必打。","FCV（貓卡里西病毒）是台灣貓的核心疫苗，為貓上呼吸道感染的重要病原。","FHV-1（貓疱疹病毒 1）是台灣貓的核心疫苗，為貓 URTI 和角結膜炎的主要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_047","year":2025,"roc_year":114,"session":"","examNo":47,"q":"病貓為2歲，體重4公斤，雄性未節育美國短毛貓，因誤食被殺鼠靈毒殺之老鼠，其臨床症狀低體 溫、血便、口腔黏膜乾燥、吐血、流鼻血，胸部聽診音異常，血容比為18％，主治醫師決定輸血， 獻血貓血容比36％，需要輸多少毫升的獻血貓血液，才能讓病貓血容比回到約為26％？","opts":["A. 20～25","B. 30～35","C. 45～55","D. 70～75"],"ans":2,"exp":"輸血量計算（貓）：Volume(mL) = BW(kg) × 血容量(mL/kg) × [目標 PCV－患者 PCV] ÷ 供血貓 PCV。貓血容量約 60–65 mL/kg。= 4 × 60 × (0.26－0.18) ÷ 0.36 = 240 × 0.08 ÷ 0.36 ≈ 53 mL。此計算值落在 C 選項（45–55 mL）範圍內。","we":["20–25 mL 量不足，以 60 mL/kg 血容量計算結果遠超此範圍。","30–35 mL 量偏少，計算值約 53 mL，此選項低估了所需輸血量。","（正確）以 BW 4 kg × 60 mL/kg × (0.26－0.18) ÷ 0.36 ≈ 53 mL，落於 45–55 mL 範圍，此選項正確。","70–75 mL 量過多，計算值約 53 mL，此選項高估了所需輸血量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_048","year":2025,"roc_year":114,"session":"","examNo":48,"q":"下列何種成分不是常用的prebiotics？","opts":["A. lactulose","B. inulin","C. sucrose","D. fructo-oligosaccharides（FOS）"],"ans":2,"exp":"Prebiotics（益菌生）是不被消化的食物成分，可選擇性促進腸道有益菌（雙歧桿菌、乳酸菌）的生長。常見益菌生：lactulose（乳果糖）、inulin（菊苣纖維）、FOS（果寡糖）、GOS（半乳寡糖）。Sucrose（蔗糖）是一般雙糖，在小腸被完全消化吸收，不到達大腸，不是 prebiotic。","we":["Lactulose（乳果糖）為半合成雙糖，腸道細菌可發酵利用，屬常用益菌生（亦用於肝性腦病治療）。","Inulin（菊苣纖維）是天然多糖，腸道細菌發酵後促進雙歧桿菌增殖，為最常用的益菌生之一。","（正確）Sucrose（蔗糖）= 葡萄糖＋果糖，在小腸完全消化吸收，不具益菌生特性。","FOS（果寡糖/fructo-oligosaccharides）是最廣泛使用的益菌生，選擇性促進有益菌生長。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_049","year":2025,"roc_year":114,"session":"","examNo":49,"q":"下列何種必需脂肪酸在貓需由膳食獲得，而犬隻可以自行在體內合成？","opts":["A. 亞麻油酸（linoleic acid）","B. α-次亞麻油酸（α-linolenic acid）","C. 花生四烯酸（arachidonic acid）","D. 牛磺酸（taurine）"],"ans":2,"exp":"貓缺乏足夠的 delta-6-去飽和酶活性，無法有效從亞麻油酸（linoleic acid）合成花生四烯酸（arachidonic acid, AA）。犬隻可自行由亞麻油酸→γ-亞麻油酸→花生四烯酸。因此貓必須從動物性食物攝取 AA，而犬不需要。","we":["亞麻油酸（linoleic acid，C18:2 n-6）對犬貓均為必需脂肪酸，兩者均需從飲食中攝取，非本題答案。","α-次亞麻油酸（α-linolenic acid，C18:3 n-3）對犬貓均為必需脂肪酸，均需飲食補充，非本題答案。","（正確）花生四烯酸（arachidonic acid，C20:4 n-6）：貓缺乏 delta-6-去飽和酶，無法自合成，必須從飲食（動物性食物）獲得；犬可從亞麻油酸合成。","牛磺酸（taurine）是胺基酸而非脂肪酸，雖然貓也必需從飲食攝取（無法足量合成），但題目問的是「必需脂肪酸」。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_050","year":2025,"roc_year":114,"session":"","examNo":50,"q":"在營養失衡引起的骨骼疾病中，下列何種營養素最不可能與此相關？","opts":["A. 維生素A","B. 維生素D","C. 鈣","D. 維生素K"],"ans":3,"exp":"營養性骨骼疾病相關營養素：維生素 A（A）過多→骨膜增生/骨刺；維生素 D（B）缺乏→佝僂病/骨軟化，過多→高鈣血症/骨鈣化；鈣（C）缺乏→繼發性甲狀腺功能亢進→骨質疏鬆。維生素 K（D）雖有 K2 參與骨鈣素羧化，但在臨床獸醫學中，維生素 K 缺乏不是常見的骨骼疾病原因，與骨骼病最不相關。","we":["維生素 A 過量（hypervitaminosis A）在貓可造成頸椎/胸椎骨贅形成，與骨骼疾病明確相關。","維生素 D 缺乏導致佝僂病（幼年）或骨軟化（成年），是最重要的營養性骨骼疾病原因之一。","鈣缺乏（鈣磷不平衡）引起繼發性副甲狀腺功能亢進，造成骨質疏鬆，與骨骼疾病直接相關。","（正確）維生素 K（主要 K1 為止血用）臨床上不常見造成骨骼疾病；K2 在骨代謝有輔助作用但在獸醫臨床不是骨骼疾病的主要致因，最不可能相關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_051","year":2025,"roc_year":114,"session":"","examNo":51,"q":"有關犬甲狀腺功能低下的敘述，下列何者錯誤？","opts":["A. lymphocytic thyroiditis是常見的致因之一","B. 先天性甲狀腺功能低下會造成侏儒症","C. 易導致毛囊蟲的感染","D. thyroglobulin autoantibody與甲狀腺功能低下的發生無關"],"ans":3,"exp":"甲狀腺球蛋白自體抗體（thyroglobulin autoantibody, TgAA）與犬甲狀腺功能低下確實相關——TgAA 陽性是淋巴球性甲狀腺炎（autoimmune thyroiditis）的免疫標記，在部分甲狀腺功能低下犬隻可測出 TgAA，且 TgAA 陽性犬隻有較高風險發展為甲狀腺功能低下。因此 D 選項「與甲狀腺功能低下發生無關」是錯誤的。","we":["Lymphocytic thyroiditis 確實是犬甲狀腺功能低下最常見的致病原因之一，A 正確。","先天性甲狀腺功能低下（cretinism）確實造成侏儒症（dwarfism/不成比例的矮小），B 正確。","甲狀腺功能低下造成免疫抑制和皮膚屏障功能下降，確實易繼發毛囊蟲（Demodex）感染，C 正確。","（正確錯誤）TgAA（甲狀腺球蛋白自體抗體）與淋巴球性甲狀腺炎及甲狀腺功能低下有關，說「無關」是錯誤的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_052","year":2025,"roc_year":114,"session":"","examNo":52,"q":"關於兔子的麻醉，下列何者最不適當？","opts":["A. 非侵入性的血壓測量建議使用前肢進行","B. 嗎啡類藥物因嚴重影響腸胃蠕動，不常做為止痛選擇","C. 兔子的潮氣量較犬貓小，是麻醉下常缺氧的原因之一","D. 兔子使用isoflurane常見血管擴張進而引起低血壓"],"ans":1,"exp":"兔子麻醉中，嗎啡類（opioids）藥物如 buprenorphine、butorphanol 是兔子術後/術中止痛的重要選擇；雖然確實可減緩腸蠕動，但臨床上適當使用並不比不止痛更危險。現代兔子麻醉指引明確建議使用 opioids 進行止痛，不應以「影響腸胃蠕動」為由完全避免。","we":["非侵入性血壓測量在前肢（brachial/radial area）適用於兔子，A 正確。","（正確錯誤）Opioids 確實是兔子推薦使用的止痛藥物，雖可輕度抑制腸蠕動，但效益大於風險，「不常作為止痛選擇」的描述最不適當。","兔子潮氣量較犬貓小（約 5–7 mL/kg），是麻醉下易低通氣/缺氧的原因之一，C 正確。","Isoflurane 造成血管擴張和心肌抑制→低血壓，在兔子中確實常見，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_053","year":2025,"roc_year":114,"session":"","examNo":53,"q":"下列何種症狀與發生在犬第7頸椎和第1胸椎間的脊髓壓迫無關？","opts":["A. 前肢出現lower motor neuron（LMN）症狀","B. Horner syndrome","C. 眼球震顫","D. 皮肌反射消失"],"ans":2,"exp":"C7–T1 脊髓壓迫的預期症狀：前肢 LMN 症狀（C7–T1 含前肢 LMN 胞體）；Horner syndrome（T1 含交感神經起始點）；皮肌反射消失（C8–T1 範圍）。眼球震顫（nystagmus）來自前庭/小腦異常，與 C7–T1 脊髓壓迫無解剖學關聯。","we":["C7–T1 包含支配前肢的 LMN 胞體（brachial intumescence），壓迫後出現前肢 LMN 症狀，A 正確。","T1 段含交感神經節前纖維起源（第三眼瞼突出、瞳孔縮小、上瞼下垂），C7–T1 壓迫可見 Horner syndrome，B 正確。","（正確）眼球震顫（nystagmus）為前庭或小腦疾病的表現，與 C7–T1 脊髓壓迫無關，不會出現。","皮肌反射（cutaneous trunci reflex）由 C8–T1 神經支配，C7–T1 壓迫可能使反射消失，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_054","year":2025,"roc_year":114,"session":"","examNo":54,"q":"關於貓自發性骨股頭生長板骨折（spontaneous capital physeal fracture），下列敘述何者最不 適當？","opts":["A. 好發於早期絕育且肥胖的母貓","B. 好發於2歲左右","C. 雙側好發，但不一定同時發生","D. 拍攝髖關節延展腹背照（extended hip ventrodorsal radiograph）及彎曲蛙腿照（flexed radiograph, frog-leg）有助於診斷此疾病"],"ans":0,"exp":"貓自發性骨股頭生長板骨折（SCFE-like）：好發於早期絕育（neutering before skeletal maturity）和肥胖的「公貓」（neutered male cats），不是「母貓」。因睪固酮對骨骼成熟有重要作用，早期去勢延遲骨骺閉合→生長板脆弱。","we":["（正確錯誤）本病好發於早期絕育且肥胖的「公貓（neutered male）」，而非母貓；A 說「母貓」是錯誤的。","好發年齡約 1.5–2 歲，正值骨骺尚未完全閉合且體重逐漸增加的階段，B 正確。","雙側發生（bilateral）是本病特徵，但兩側不一定同時發作，可能相隔數週至數月，C 正確。","延展腹背照（extended VD）和彎曲蛙腿照（frog-leg）均是評估此骨折的重要影像，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_055","year":2025,"roc_year":114,"session":"","examNo":55,"q":"下列何者不是關節鏡檢查的適應症？","opts":["A. 肱二頭肌肌腱發炎","B. 長趾伸肌肌腱（long digital extensor tendon）撕裂傷","C. 棘上肌肌腱病","D. 肱骨髁骨化不全（incomplete ossification of the humeral condyle）"],"ans":2,"exp":"關節鏡適應症（小動物）：肩關節（bicipital tenosynovitis、OCD、biceps tendon pathology）；膝關節（CCL、OCD、meniscal injury）；肘關節（OCD、fragmented coronoid process、IOHC）。棘上肌肌腱病（supraspinatus tendinopathy）為肩關節外肌腱病，位於關節外，關節鏡難以直接評估/治療，不是關節鏡的適應症。","we":["肱二頭肌肌腱發炎（bicipital tenosynovitis）位於肩關節囊內/近端，是肩關節鏡的適應症，A 不是答案。","長趾伸肌肌腱（LDE tendon）撕裂位於膝關節外側（由關節囊起源），可透過膝關節鏡評估，B 不是答案。","（正確）棘上肌肌腱病（supraspinatus tendinopathy）為關節外軟組織疾病，不在關節腔內，不是關節鏡的適應症。","IOHC（incomplete ossification of the humeral condyle）透過肘關節鏡評估骨化情形，D 不是答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_056","year":2025,"roc_year":114,"session":"","examNo":56,"q":"下列有關炎症性關節液性狀的敘述，何者錯誤？","opts":["A. 關節液量增加","B. 置於試管中會凝固","C. 黏度增加","D. 呈混濁狀"],"ans":2,"exp":"炎症性關節液性狀：量增加（A）、置於試管中因含纖維蛋白原而凝固（B）、外觀混濁（D）——以上均正確。黏度（C）在炎症時因透明質酸被白血球酶降解而「下降」，而非「增加」。","we":["炎症使關節囊通透性增加，大量液體滲出→關節液量增加，A 正確。","炎症性關節液含纖維蛋白原，置於試管中確實會凝固（正常關節液不含凝固因子），B 正確。","（正確錯誤）炎症性關節液的黏度「降低」（因透明質酸被白血球分泌的透明質酸酶分解），而非增加；C 說「黏度增加」是錯誤的。","白血球和細菌增加使關節液呈混濁/化膿性外觀，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_057","year":2025,"roc_year":114,"session":"","examNo":57,"q":"下列關於犬貓腎上腺腫瘤的敘述，何者最不適當？","opts":["A. 犬的發生率比貓高","B. 若出現術前高血壓且有侵犯後大靜脈，該腫瘤為嗜鉻細胞瘤（pheochromocytoma）的機率非常大","C. 無功能性的腎上腺腫瘤占大多數","D. 容易轉移，所以臨床上雙側腎上腺常會同時發生腫瘤"],"ans":3,"exp":"腎上腺腫瘤雙側同時發生不是因為「轉移」：雙側腎上腺腫瘤通常為雙側原發性腫瘤（bilateral primary adrenocortical tumors）或雙側腎上腺增生（PDH 造成）；嗜鉻細胞瘤偶見雙側但也是各自原發，而非轉移。D 的因果說明錯誤。","we":["犬腎上腺腫瘤的發生率確實比貓高，A 正確。","術前高血壓合併後腔靜脈侵犯強烈提示嗜鉻細胞瘤（pheochromocytoma），B 正確。","功能性腎上腺腫瘤（如皮質醇瘤、嗜鉻細胞瘤）有臨床症狀；無功能性（incidentaloma）亦存在，C 在部分脈絡中正確。","（正確錯誤）雙側腎上腺腫瘤不是因為「轉移」，而是各自原發性腫瘤或腺體增生；以轉移解釋雙側發生的描述最不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_058","year":2025,"roc_year":114,"session":"","examNo":58,"q":"關於犬喉頭麻痺（laryngeal paralysis）的敘述，下列何者正確？","opts":["A. 好發於小型犬","B. 採用杓狀軟骨固定術（arytenoid lateralization）進行手術治療時，建議固定單側即可","C. 通常在動物吐氣時會出現明顯的呼吸雜音","D. 拍攝頸部X光影像可有效確診"],"ans":1,"exp":"犬喉頭麻痺（laryngeal paralysis）：好發於大/巨型犬（拉不拉多、黃金獵犬、西伯利亞哈士奇）；手術標準術式為單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）；雜音以吸氣性喘鳴為主；確診需內視鏡觀察杓狀軟骨在淺麻醉下的運動。","we":["喉頭麻痺好發於大/巨型犬，小型犬發生率低，A 說「好發於小型犬」錯誤。","（正確）單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）是推薦術式，固定單側以改善通氣同時降低吸入性肺炎風險。","喉頭麻痺的呼吸雜音為吸氣性喘鳴（inspiratory stridor），C 說「吐氣時」是錯誤的。","確診需要喉部內視鏡在淺度麻醉下觀察杓狀軟骨運動；頸部 X 光無法確診喉頭麻痺，D 錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_059","year":2025,"roc_year":114,"session":"","examNo":59,"q":"下列何種方式最適合用於治療胸腔氣管塌陷的狗？","opts":["A. 單側杓狀軟骨側方固定術（unilateral arytenoid lateralization）","B. 放置氣管內支架","C. 永久性氣管造口","D. 軟顎部分切除整型術"],"ans":1,"exp":"胸腔氣管塌陷（intrathoracic tracheal collapse）：因胸腔段氣管在體外無法手術放置外支架環，故選擇「腔內氣管支架（intraluminal tracheal stent）」以微創方式（透視/內視鏡引導）置入，是目前胸腔段氣管塌陷的首選治療。","we":["杓狀軟骨側方固定術用於喉頭麻痺，不適用於氣管塌陷治療。","（正確）胸腔段氣管塌陷因手術不易到達，放置腔內氣管支架（intraluminal stent）是首選微創治療方案。","永久性氣管造口（permanent tracheostomy）僅用於頸部段氣管重度塌陷，不適用於胸腔段病變。","軟顎部分切除整型術用於短頭型犬的軟顎延長，與氣管塌陷無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_060","year":2025,"roc_year":114,"session":"","examNo":60,"q":"下列何種犬骨科疾病和退化的關聯性最高？","opts":["A. 前十字韌帶斷裂（cranial cruciate ligament rupture）","B. 分離性軟骨炎（osteochondritis dissecans）","C. 寰樞椎半脫位（atlantoaxial subluxation）","D. 膝蓋骨異位（patellar luxation）"],"ans":0,"exp":"前十字韌帶斷裂（cranial cruciate ligament rupture, CCLR）是犬最常見的膝關節疾病，且幾乎必然導致進行性骨關節炎（OA/DJD）。無論是否手術，膝關節退化持續進展，是犬骨科疾病中與退化關聯性最高的疾病。","we":["（正確）CCL 斷裂幾乎必然導致膝關節進行性骨關節炎，是犬骨科疾病中與退化關聯最高的疾病。","OCD（分離性骨軟骨炎）造成關節軟骨損傷，可導致繼發性 OA，但不如 CCL 斷裂那樣普遍必然進展。","寰樞椎半脫位（atlantoaxial subluxation）主要造成神經壓迫，與關節退化關聯性較低。","膝蓋骨異位（patellar luxation）可導致 OA，但嚴重程度和普遍性不如 CCL 斷裂。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_061","year":2025,"roc_year":114,"session":"","examNo":61,"q":"下列用於促進骨癒合的犬貓骨移植物（bone graft）的敘述，何者最不適當？","opts":["A. 在臨床上可用的骨移植物中，自體海綿骨（cancellous bone autograft）效果最佳","B. 常用於保肢手術（limb-sparing procedures）的骨移植物為自體皮質骨（cortical autograft）","C. 肋骨常作為自體皮質骨（cortical autograft）的來源","D. 和異體骨移植物相比，自體骨移植物具有較佳的骨發生（osteogenesis）能力"],"ans":1,"exp":"保肢手術（limb-sparing surgery，如骨肉瘤切除後骨重建）通常使用「自體皮質骨」在犬不切實際（太長/供體部位傷害大），實際上使用「異體皮質骨（cortical allograft）」作為結構性支撐。B 說「自體皮質骨」用於保肢手術是錯誤的。","we":["自體海綿骨（cancellous bone autograft）含活細胞、生長因子和骨架，骨癒合效果最佳，A 正確。","（正確錯誤）保肢手術使用的是「異體皮質骨（cortical allograft）」提供結構支撐，而非自體皮質骨；使用自體皮質骨會造成嚴重供體部位並發症，B 最不適當。","肋骨可作為自體皮質骨的供體來源（適合板狀皮質骨需求），C 正確。","自體骨移植含活骨細胞（osteoblasts）→骨生成能力優於無活細胞的異體骨，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_062","year":2025,"roc_year":114,"session":"","examNo":62,"q":"下列犬的骨疾病中，統計上何者發生年齡最晚？","opts":["A. 股骨頭缺血性壞死（Legg-Calvé-Perthes disease）","B. 肥大型骨形成不全（hypertrophic osteodystrophy）","C. 肥大型骨病（hypertrophic osteopathy）","D. 全骨炎（panosteitis）"],"ans":2,"exp":"犬各骨病發病年齡：Legg-Calvé-Perthes 病（股骨頭缺血性壞死）= 4–11 月；HOD（肥大型骨形成不全）= 2–8 月；全骨炎（panosteitis）= 5–18 月。肥大型骨病（hypertrophic osteopathy）繼發於胸腔/腹腔腫塊（如肺腫瘤），通常發生於成年至老年犬，發病年齡最晚。","we":["Legg-Calvé-Perthes 病通常在 4–11 月齡發病（小型犬，股骨頭血供障礙）。","HOD（肥大型骨形成不全）發生於 2–8 月齡的快速生長大型犬幼犬，發病年齡最早之一。","（正確）肥大型骨病（hypertrophic osteopathy）繼發於胸腔/腹腔腫塊（肺腫瘤、膿胸等），通常在中老年犬發病，發病年齡最晚。","全骨炎（panosteitis）通常在 5–18 月齡的大型犬發病（自限性骨髓炎），屬幼犬疾病。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_063","year":2025,"roc_year":114,"session":"","examNo":63,"q":"下列那一種輸液最不適合用於術中大量出血時的急救？","opts":["A. Ringer's solution","B. 6％ hydroxyethyl starch","C. 7.5％ NaCl solution","D. 0.45％ NaCl solution"],"ans":3,"exp":"急救術中大量出血（失血性休克）需快速恢復血容量和攜氧能力：Ringer's solution（A）等張晶體、6% HES（B）膠體、7.5% NaCl（C）高張鹽水均可用於容量復甦。0.45% NaCl（D）為低張溶液：進入血管後水分向細胞內移動，無法有效維持血管內容量，甚至加重細胞水腫，最不適合用於急救出血。","we":["Ringer's solution（等張電解質液）為標準外科補液，用於出血急救安全有效。","6% hydroxyethyl starch（HES）為膠體，可維持血漿膠體滲透壓，適用於出血急救擴容。","7.5% NaCl（高張鹽水）小劑量即可快速擴張血管內容量（osmotic draw），用於失血性休克。","（正確）0.45% NaCl 為低張溶液，進入體內後水分向細胞內移動，不能有效擴張血管容量，最不適合術中大量出血急救。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_064","year":2025,"roc_year":114,"session":"","examNo":64,"q":"犬發生會陰赫尼亞時，最常見於下列何種肌肉的萎縮？","opts":["A. 外肛門括約肌","B. 提肛肌","C. 半腱肌","D. 內閉鎖肌"],"ans":1,"exp":"犬會陰赫尼亞（perineal hernia）：骨盆橫膈（pelvic diaphragm）包括提肛肌（levator ani）和尾骨肌，其中「提肛肌（levator ani）」的萎縮/退化是犬會陰赫尼亞最核心的病因，形成肛門旁的肌肉缺損使腹腔臟器疝入。","we":["外肛門括約肌萎縮可能影響括約肌功能，但主要造成會陰赫尼亞的是提肛肌而非外括約肌。","（正確）提肛肌（levator ani）萎縮退化是犬會陰赫尼亞最主要的原因，形成骨盆橫膈缺損。","半腱肌為後肢肌肉，與會陰赫尼亞發生無直接關聯。","內閉鎖肌可用於修復會陰赫尼亞（obturator muscle transposition），但其萎縮不是本病的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_065","year":2025,"roc_year":114,"session":"","examNo":65,"q":"在標準外科手術操作過程中（正常手術時間無不當延長且保持無菌操作），關於造成手術部位感染 的危險因子敘述，下列何者最適當？","opts":["A. 術區剃毛清理範圍愈大，術前愈早進行且消毒液刷洗次數至少4次以上愈不容易造成感染","B. 預防性抗生素除了術中每90分鐘給予外，術後仍應持續給予1週，以減少感染機率","C. 麻醉本身與感染風險無關，主要決定於手術時間","D. 手術時間每增加1小時，手術部位感染機率風險加倍"],"ans":3,"exp":"手術部位感染（SSI）危險因子：手術時間每增加 1 小時，SSI 風險大約加倍（手術時間是最重要的可控危險因子之一）；術前剃毛應在手術前不超過 1 小時（過早剃毛增加皮膚菌落）；預防性抗生素術後不需常規給予 1 週（短程或單次）；麻醉本身亦有輕度免疫抑制效應。","we":["術區剃毛應儘量接近手術時間（不超過 1 小時前），過早剃毛反而增加 SSI 風險，A 描述錯誤。","預防性抗生素建議術中每 90–120 分鐘補充一次，術後通常不需持續給藥 1 週，B 描述錯誤。","麻醉藥物確實有輕度免疫抑制作用，且麻醉時間與手術時間高度相關，C 說「麻醉與感染風險無關」不完全正確。","（正確）每增加 1 小時手術時間，SSI 風險約加倍，是最有循證依據的 SSI 危險因子描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_066","year":2025,"roc_year":114,"session":"","examNo":66,"q":"下列有關進行腸切開或腸吻合後的腸道縫合方法，何者最不適當？","opts":["A. 雙層內翻縫合法","B. 簡單間斷縫合法","C. 簡單連續縫合法","D. 改良式Gambee縫合法"],"ans":0,"exp":"腸道吻合術縫合方法：目前推薦「單層外翻或對合縫合」（簡單間斷、簡單連續、Gambee 等），可維持腸管腔徑和血供。「雙層內翻縫合法（如 Cushing + Lembert）」過度內翻腸壁→嚴重縮窄腸腔→梗阻風險，同時內翻組織供血不良，是最不適合的腸吻合方法。","we":["（正確）雙層內翻縫合法造成腸腔嚴重狹窄（stenosis）和組織壞死風險，是腸吻合最不適合的縫合方式。","簡單間斷縫合法（simple interrupted）是腸道吻合的標準術式，術後腸壁對合良好，B 適合。","簡單連續縫合法（simple continuous）在有經驗的外科醫師手中可用於腸吻合，C 可接受。","改良式 Gambee 縫合法為單層全層對合縫合，是推薦的腸吻合技術之一，D 適合。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_067","year":2025,"roc_year":114,"session":"","examNo":67,"q":"下列有關犬橫膈裂孔赫尼亞（hiatal hernia）的敘述，何者最不適當？","opts":["A. 大多為後天創傷造成","B. 不一定會有臨床症狀","C. 手術修復步驟包括hiatal reduction、esophagopexy和left-sided fundus gastropexy","D. 術後通常預後佳"],"ans":0,"exp":"犬橫膈裂孔赫尼亞（hiatal hernia）：大多為「先天性（congenital）」，好發於短頭型犬（French Bulldog、Pug 等），因上呼吸道阻塞造成胸腔負壓增大，加上先天性裂孔發育異常。A 說「大多為後天創傷造成」是錯誤的。","we":["（正確錯誤）犬橫膈裂孔赫尼亞大多為先天性（congenital），不是後天創傷（traumatic）造成；A 的描述最不適當。","部分裂孔赫尼亞患犬無明顯症狀（尤其小的 Type I 滑動型），不一定有臨床表現，B 正確。","手術修復包括 hiatal reduction（將胃放回腹腔）、esophagopexy 和 left-sided fundus gastropexy，C 正確。","術後預後通常良好，尤其年輕犬隻，症狀顯著改善，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_068","year":2025,"roc_year":114,"session":"","examNo":68,"q":"下列關於甲狀腺切除術可能併發症的敘述，何者最不適當？","opts":["A. 呼吸困難（dyspnea）","B. 低血磷（hypophosphatemia）","C. 霍納式症候群（Horner syndrome）","D. 喉頭輕癱（laryngeal paralysis）"],"ans":1,"exp":"甲狀腺切除術可能的已知併發症：呼吸困難（氣管塌陷/喉頭麻痺/水腫）、Horner syndrome（頸部交感鏈損傷）、喉頭輕癱（RLN 損傷）、低血鈣（副甲狀腺摘除）。「低血磷（hypophosphatemia）」不是甲狀腺切除術的典型併發症；應是「低血鈣（hypocalcemia）」才對。","we":["呼吸困難可因喉頭水腫、RLN 雙側損傷或氣管塌陷，是甲狀腺切除術的已知嚴重併發症，A 正確。","（正確錯誤）低血磷（hypophosphatemia）不是甲狀腺切除術的典型併發症；典型為低血鈣（副甲腺受損），B 的描述不適當。","Horner syndrome 可因手術損傷頸部交感神經鏈（sympathetic trunk），是已知術後併發症，C 正確。","喉頭輕癱（laryngeal paralysis）因 RLN（喉返神經）術中損傷，是甲狀腺切除術的已知風險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_069","year":2025,"roc_year":114,"session":"","examNo":69,"q":"使用dopamine agonist讓懷孕1個月的母狗終止懷孕的原理為何？","opts":["A. 屬於prolactin inhibitor的作用","B. 競爭progesterone receptor","C. 使輸卵管水腫","D. 誘發estradiol作用後的連續反應"],"ans":0,"exp":"Dopamine agonists（如 cabergoline、bromocriptine）終止妊娠的機制：多巴胺作用於垂體前葉→抑制泌乳素（prolactin）分泌（prolactin inhibitor）→狗在黃體期高度依賴泌乳素維持黃體功能和助孕素（progesterone）分泌→泌乳素下降→黃體功能衰退→助孕素降低→妊娠終止。","we":["（正確）Dopamine agonist 屬於 prolactin inhibitor，藉由抑制垂體泌乳素分泌，間接使犬的黃體退化、助孕素下降，終止妊娠。","競爭助孕素受體（progesterone receptor antagonist）是 aglepristone（RU486 類似物）的機制，不是 dopamine agonist 的作用方式。","使輸卵管水腫不是多巴胺致效劑的藥理機制，此描述無科學依據。","誘發 estradiol 的連續反應不是 dopamine agonist 的主要作用途徑，與終止妊娠機制無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_070","year":2025,"roc_year":114,"session":"","examNo":70,"q":"牛隻進行碎胎術時，下列敘述何者最不適當？","opts":["A. 母體站立時對母體較安全","B. 母體站立時對施術者最為便利","C. 施術過程應儘量減少污染產道","D. 碎胎線鋸於每一次切割後應檢視是否要更換"],"ans":1,"exp":"牛隻碎胎術（fetotomy）：母體站立時對母體較安全（減少脹氣和異常臥位風險，A 正確）；但「對施術者最便利」是有問題的——施術者需彎腰從後方進行，若母體站立，操作空間受限，實際上側臥位有時對施術者更為方便，B 的說法最不適當。","we":["母體站立進行碎胎術對母體較安全（減少脹氣風險、利於體液引流），A 正確。","（正確錯誤）母體站立對施術者未必是「最便利」的姿勢；側臥位有時提供更好的視野和操作空間，B 說「最便利」為最不適當的描述。","碎胎過程應盡量保持無菌操作，減少產道汙染以降低母體感染風險，C 正確。","碎胎線鋸（wire saw）每次切割後需檢視是否需要更換，避免斷鋸造成危險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_071","year":2025,"roc_year":114,"session":"","examNo":71,"q":"有關牛胎兒木乃伊變性之敘述，下列何者錯誤？","opts":["A. 妊娠中期後胎兒死亡","B. 卵巢之黃體消失","C. 中子宮動脈缺強搏動","D. 子宮壁薄缺收縮性"],"ans":1,"exp":"胎兒木乃伊變性（fetal mummification）：胎兒死亡後脫水成木乃伊→沒有正常胎盤→無法釋放 PGF2α→黃體（CL）持續存在（not disappear）→子宮頸關閉、妊娠維持。中子宮動脈搏動消失（因無活胎）；子宮壁薄且缺乏收縮性，為典型特徵。B 說「黃體消失」是錯誤的。","we":["妊娠中期後胎兒死亡且無法排出時，才發生木乃伊變性（早期死亡會被吸收），A 正確。","（正確錯誤）木乃伊變性時，黃體因缺乏前列腺素刺激而「持續存在」，而非消失；B 說「黃體消失」為錯誤的敘述。","中子宮動脈（middle uterine artery）因無活胎血液供應需求，缺乏正常的強搏動（fremitus），C 正確。","木乃伊化過程使子宮壁因長期維持狀態而薄化，缺乏正常收縮性，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_072","year":2025,"roc_year":114,"session":"","examNo":72,"q":"治療一頭體重約500公斤的乳牛發生產後低血鈣的乳熱症狀時，靜脈輸液應含多少公克的鈣？","opts":["A. 2～6","B. 80～120","C. 8～13","D. 30～36"],"ans":2,"exp":"乳熱症（低血鈣）靜脈補鈣標準：每頭 500 kg 乳牛靜脈注射 400–500 mL 的 23% 硼葡萄糖酸鈣（calcium borogluconate），其中元素鈣含量約 8–13 克。（23% borogluconate × 400 mL ÷ 23 MW ratio ≈ 9–13 g elemental Ca）","we":["2–6 g 鈣量過低，不足以有效矯正 500 kg 乳牛的低血鈣症。","80–120 g 鈣量過高，超量靜脈注射可造成高血鈣和心臟毒性，有致死風險。","（正確）每頭 500 kg 乳牛靜脈注射約 400–500 mL 的 23% 硼葡萄糖酸鈣，元素鈣量約 8–13 g，此為標準治療劑量。","30–36 g 鈣量偏高，超出標準治療劑量，可能造成心律不整和高血鈣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_073","year":2025,"roc_year":114,"session":"","examNo":73,"q":"針對下圖懷孕母馬redbag的敘述，下列何者最不適當？","opts":["A. 是由於尿囊絨毛膜過早脫離所導致的現象","B. 此現象多為非感染性原因所致","C. 此現象並非產科緊急事件，可以等待至動物分娩時一併處置","D. 胎兒在此狀況下容易缺氧"],"ans":2,"exp":"Red bag（尿囊絨毛膜早期脫離）是「產科緊急事件」：絨毛膜尿囊膜從子宮壁提前分離，切斷胎兒氧氣供應，若不立即切開並分娩，胎兒在 3–5 分鐘內即可缺氧死亡。C 說「非緊急事件，可以等待」是最不適當的描述。","we":["Red bag 是因絨毛膜尿囊膜（chorioallantois）提前從子宮內膜脫離，A 正確。","Red bag 多為非感染性原因（高草木鹼/fescue 毒素、特發性），也可因感染而發生，B 正確。","（正確錯誤）Red bag 是真正的產科急診，必須立即切開外露的絨毛膜並幫助分娩，不可等待，C 描述最不適當。","絨毛膜尿囊膜提前分離使胎兒失去氧氣交換，高度缺氧風險，D 正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_074","year":2025,"roc_year":114,"session":"","examNo":74,"q":"下列何種動物的動情週期（cyclic activity）不受光照時間長短影響？","opts":["A. 飼養在北半球的乳牛","B. 飼養在南半球的小鼠","C. 飼養在北半球的貓","D. 飼養在南半球的駱駝"],"ans":0,"exp":"光照週期（photoperiod）對動情週期的影響：馬（長日照繁殖）、綿羊/山羊（短日照繁殖）、貓（長日照）均受光照影響。乳牛（dairy cattle）為全年多次發情（polyestrous），其動情週期不受光照時間長短顯著影響，一年四季均可發情配種。","we":["（正確）飼養在北半球的乳牛為全年多次發情（polyestrous），動情週期不受季節性光照變化的顯著影響。","小鼠通常被認為在實驗室條件下受光暗週期影響（12h:12h 可保持正常發情），但在某些條件下，飼養環境的人工光照可以主導其發情週期，故不是「不受光照影響」的最佳例子。","北半球的貓為長日照季節性繁殖動物（春至夏季發情），動情週期明顯受光照影響，C 不符合題意。","駱駝是季節性繁殖動物，受光照和溫度影響，並非全年多次發情，D 不符合題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2025_普通病_075","year":2025,"roc_year":114,"session":"","examNo":75,"q":"以3.5 MHz探頭檢查一頭配種3個月的母山羊，子宮超音波影像顯示如下圖，下列何種治療方法最適當？","opts":["A. 注射性腺素釋放激素（GnRH），7天後再注射prostaglandin F 2α","B. 置入progesterone陰道塞劑","C
