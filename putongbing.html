用藥物或適當的飲食將其溶解？","opts":["A. 磷酸胺鎂（struvite）","B. 草酸鈣（calcium oxalate）","C. 胱胺酸（cystine）","D. 尿酸銨（ammonium urate）"],"ans":1,"exp":"草酸鈣結石（calcium oxalate urolithiasis）在犬貓中無法藥物溶解，需手術取出或體外碎石；只有磷酸銨鎂（struvite）結石可以藥物（酸化尿液+溶石飼料）溶解。","we":["(A) 磷酸銨鎂結石可以藥物溶解，草酸鈣不行。","(C) 尿酸鹽結石（urate）在某些情況下可用allopurinol加特殊飼料溶解。","(D) 磷酸鈣結石可以藥物輔助溶解（鹼化尿液）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_052","year":2018,"roc_year":107,"session":"","examNo":52,"q":"有關犬貓使用replacement fluid和maintenance fluid之敘述，下列何者錯誤？","opts":["A. 前者為高張，後者為等張","B. 前者適合短期使用，後者較適合長期使用","C. 前者較適合volume resuscitation，後者不合適","D. 前者多不含dextrose，後者常會加上dextrose"],"ans":0,"exp":"Replacement fluid（補充液/替代液）用於替代體液損失，應為等張液（isotonic solution），如0.9% NaCl或乳酸林格氏液；高張液用於特定急救情況。","we":["(B) 高張液（如7.2% NaCl）是resuscitation fluid，用於急性休克復甦，非replacement fluid。","(C) 低張液（如0.45% NaCl）用於游離水不足，非標準replacement fluid。","(D) 膠體液（colloid）是oncotic支持液，與replacement fluid定義不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_053","year":2018,"roc_year":107,"session":"","examNo":53,"q":"有關貓的輸血，下列何種情況最危險？","opts":["A. A型貓輸血給AB型貓","B. B型貓輸血給A型貓","C. A型貓輸血給B型貓","D. B型貓輸血給AB型貓"],"ans":2,"exp":"貓的血型系統：A型最常見（約94-95%）、B型較少（約5%）、AB型極少。A型血輸給B型貓→B型貓體內有高效價的抗A抗體→嚴重急性溶血反應，最危險。","we":["(A) B型血輸給A型貓也有反應，但A型貓抗B抗體效價較低，反應較輕。","(B) A型輸給A型（同型輸血）最安全。","(D) AB型是universal recipient（可接受任何血型），但貓AB型極少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_054","year":2018,"roc_year":107,"session":"","examNo":54,"q":"下列何者不是犬隻左心衰竭（left heart failure）時的胸腔影像特徵？","opts":["A. 胸膜積液（pleural effusion）","B. 尾背側肺葉出現肺泡影徵（alveolar pattern）","C. 心臟輪廓側照可見1~2點鐘方向變大突出","D. 尾背側肺葉肺靜脈直徑比肺動脈直徑寬"],"ans":0,"exp":"犬左心衰竭主要引起肺水腫（肺靜脈高壓），胸膜積液（pleural effusion）不是左心衰竭的典型特徵；胸膜積液更常見於右心衰竭或雙側心衰竭（貓除外）。","we":["(B) 肺水腫（pulmonary edema）是犬左心衰竭的典型表現。","(C) 咳嗽是肺水腫刺激的繼發症狀。","(D) 呼吸急促（tachypnea）是肺水腫代償的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_055","year":2018,"roc_year":107,"session":"","examNo":55,"q":"8歲混種犬，咳嗽、喘及運動不耐，胸腔左側照及腹背照X光影像如下，箭頭處所指心臟部位為何？","opts":["A. 變大突出的右心房（right atrium）","B. 變大突出的主動脈幹（aorta）","C. 變大突出的肺動脈幹（main pulmonary artery）","D. 變大突出的左心房（left atrium）"],"ans":1,"exp":"（本題含X光圖，需視圖判斷；答案標記為需複查）","we":["（需視圖判斷）","（需視圖判斷）","（需視圖判斷）"],"needs_review":true,"imgs":[]},{"id":"AMO_2018_2_普通病_056","year":2018,"roc_year":107,"session":"","examNo":56,"q":"犬貓尿路感染，最容易繼發下列何項疾病？","opts":["A. 腎絲球體性腎炎","B. 腎盂腎炎","C. 間質性腎炎","D. 水腎"],"ans":1,"exp":"尿路感染（UTI）最容易繼發腎盂腎炎（pyelonephritis）——細菌沿尿路上行至腎盂，引起腎盂腎炎，特別是存在膀胱輸尿管逆流時。","we":["(A) 腎結石可繼發感染，但不是UTI最常繼發的狀況。","(C) 腎小球腎炎（glomerulonephritis）主要是免疫媒介性，非UTI直接繼發。","(D) 間質性腎炎可由感染引起，但腎盂腎炎更為直接。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_057","year":2018,"roc_year":107,"session":"","examNo":57,"q":"下列何項貓疾病，會引發結膜炎、潰瘍性舌炎、口炎、鼻炎和間質性肺炎？","opts":["A. 貓白血病病毒感染","B. 貓杯狀（卡里西）病毒感染","C. 貓免疫不全病毒感染","D. 貓傳染性腹膜炎"],"ans":1,"exp":"貓杯狀病毒（Feline calicivirus, FCV）引起：結膜炎、口腔潰瘍（舌炎、口炎）、上呼吸道症狀（鼻炎）、間質性肺炎，這些都是典型表現。","we":["(A) 貓疱疹病毒（FHV-1）主要引起結膜炎和角膜潰瘍，口腔潰瘍較少。","(C) 貓泛白血球減少症（FPV）主要引起腸炎和白血球減少。","(D) 貓冠狀病毒（FCoV/FIP）引起腹膜炎（濕型）或肉芽腫（乾型）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_058","year":2018,"roc_year":107,"session":"","examNo":58,"q":"犬貓呼吸困難且胸膜腔出現下列何情況時，移除氣體或液體不是必要的處理方式？","opts":["A. 氣胸","B. 血胸","C. 膿胸","D. 乳糜胸"],"ans":1,"exp":"少量血胸（hemothorax）可自然吸收，不必要移除；大量血胸才需要胸腔穿刺引流，以防止纖維胸（fibrothorax）。","we":["(A) 立即手術探查過於積極，少量血胸不需手術。","(C) 靜脈輸液是支持治療，但不是主要處置。","(D) 給予抗凝血藥會增加出血風險，不適當。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_059","year":2018,"roc_year":107,"session":"","examNo":59,"q":"有關惡性腫瘤（癌）轉移之敘述，下列何者錯誤？","opts":["A. 血管內皮細胞在正常組織會快速增殖，而腫瘤組織則不會","B. 血管分化越好的腫瘤，其遠端轉移的機會也越大","C. 血管豐富的腫瘤，腫瘤細胞進入循環中的表面積也增加","D. 為了在實質組織中增長，腫瘤轉移必須建立新的血管並躲避宿主的免疫系統"],"ans":0,"exp":"「正常組織的血管內皮細胞不快速增殖」是正確的生理事實，因此這個陳述作為腫瘤學考題中的「錯誤選項」本身就是錯的——即這個選項是正確敘述但在題目語境中被標為錯誤。腫瘤血管新生（angiogenesis）是腫瘤特有現象。","we":["(B) 腫瘤血管通透性高是正確的腫瘤血管特徵。","(C) 腫瘤血管缺乏正常調控是正確的。","(D) VEGF是腫瘤血管新生的重要因子，是正確敘述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_060","year":2018,"roc_year":107,"session":"","examNo":60,"q":"下列何項臨床症狀不常在犬隻胰液分泌不足時發生？","opts":["A. 下痢","B. 嘔吐","C. 體重下降","D. 皮毛乾燥無光澤"],"ans":1,"exp":"外分泌胰腺功能不足（EPI, Exocrine Pancreatic Insufficiency）的臨床特徵包括：腹瀉（大量脂肪性糞便）、多食、體重減輕；嘔吐（vomiting）不是EPI的常見症狀。","we":["(A) 大量脂肪性腹瀉（steatorrhea）是EPI的典型症狀。","(C) 多食（polyphagia）因消化吸收不良導致能量不足。","(D) 體重減輕（weight loss）儘管食慾旺盛，因吸收障礙而消瘦。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_061","year":2018,"roc_year":107,"session":"","examNo":61,"q":"犬貓巨食道症最常見的併發症為何？","opts":["A. 敗血症","B. 貧血","C. 脫水","D. 吸入性肺炎"],"ans":3,"exp":"巨食道症（megaesophagus）最常見的致命併發症是吸入性肺炎（aspiration pneumonia）——食道擴張→胃食道逆流→吸入→肺炎。","we":["(A) 食道穿孔罕見，不是最常見併發症。","(B) 食道癌是長期慢性刺激的遠期併發症，不是最常見。","(C) 脫水/電解質失衡是繼發影響，但吸入性肺炎更直接且常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_062","year":2018,"roc_year":107,"session":"","examNo":62,"q":"下列何項NSAIDs藥物，較適用於治療犬慢性結腸炎？","opts":["A. aspirin","B. flunixin meglumine","C. mesalamine","D. ibuprofen"],"ans":2,"exp":"Mesalamine（5-aminosalicylic acid，5-ASA）適用於犬慢性結腸炎（inflammatory bowel disease），具有局部抗炎作用。","we":["(A) Metronidazole用於細菌性腸炎及梨形蟲感染，不是慢性結腸炎的首選。","(B) Prednisolone用於免疫媒介性IBD，但mesalamine是5-ASA類更適合結腸炎。","(D) Loperamide用於腹瀉症狀控制，不是抗炎藥物。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_063","year":2018,"roc_year":107,"session":"","examNo":63,"q":"下列何項病症不出現在貓的triaditis？","opts":["A. 膽管肝炎","B. 胃炎","C. 胰臟炎","D. 炎症性腸道疾病（inflammatory bowel disease）"],"ans":1,"exp":"貓triaditis（三聯炎）是指同時發生：胰臟炎（pancreatitis）+ 膽管肝炎（cholangiohepatitis）+ 炎症性腸病（IBD）；胃炎不在三聯炎定義內。","we":["(A) 胰臟炎是貓triaditis的三個組成之一。","(C) 膽管肝炎（cholangiohepatitis）是triaditis的組成之一。","(D) 炎症性腸病（IBD）是triaditis的組成之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_064","year":2018,"roc_year":107,"session":"","examNo":64,"q":"有關犬隻休克（shock）之敘述，下列何者錯誤？","opts":["A. 休克初期心搏徐緩，以減少心臟耗氧量","B. 休克中期會刺激renin-angiotensin-aldosterone axis，以增加心輸出量","C. 休克中期會四肢冰冷，肛溫下降","D. 敗血症性休克可能導致低血糖"],"ans":0,"exp":"休克初期（compensated shock）的心臟反應是心搏加速（tachycardia）——交感神經興奮代償→心搏加速，不是心搏徐緩（bradycardia）。","we":["(B) 心搏徐緩是休克晚期（decompensated shock）的徵象，不是初期。","(C) 心律不整在嚴重休克時出現，初期不是主要表現。","(D) 心搏停止是終末期表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_065","year":2018,"roc_year":107,"session":"","examNo":65,"q":"有關犬肉芽腫性腦膜腦脊髓炎（granulomatous meningoencephalomyelitis）的敘述，下列何項正確？","opts":["A. 德國狼犬（German shepherd dog）是好發犬種之一","B. 腦脊髓液中的葡萄糖濃度下降是主要的特徵","C. 腦脊髓液中的白血球以單核球為主","D. 無藥物可治療或控制"],"ans":2,"exp":"肉芽腫性腦脊髓膜炎（GME, Granulomatous Meningoencephalitis）的腦脊髓液（CSF）分析以單核球（mononuclear cells，淋巴球和單核球）為主。","we":["(A) 中性球為主見於細菌性腦膜炎。","(B) 嗜酸球為主見於寄生蟲性腦膜炎。","(D) 無細胞增多見於正常CSF或某些病毒感染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_066","year":2018,"roc_year":107,"session":"","examNo":66,"q":"犬胃流通阻塞（gastric outflow obstruction）最容易發生於胃的那一部位？","opts":["A. 賁門部","B. 胃底部","C. 胃小彎處","D. 幽門部"],"ans":3,"exp":"胃流通阻塞（gastric outflow obstruction）最常見的部位是幽門部（pylorus/pyloric region），包括幽門肥厚症、幽門括約肌肥厚等。","we":["(A) 賁門（cardia）阻塞少見，多為食道問題。","(B) 胃底（fundus）阻塞不是常見的流通阻塞部位。","(C) 胃體（body）阻塞通常由腫瘤引起，非最常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_067","year":2018,"roc_year":107,"session":"","examNo":67,"q":"犬罹患下列何項疾病，疼痛的現象較為明顯，因此止痛劑在此病的治療上也非常重要？","opts":["A. 慢性肝衰竭","B. 急性胰臟炎","C. 慢性腎衰竭","D. 二尖瓣逆流"],"ans":1,"exp":"急性胰臟炎（acute pancreatitis）的特徵是劇烈腹痛（acute abdominal pain），特別是前腹部（上腹部）疼痛，這是最明顯的臨床症狀。","we":["(A) 急性肝炎腹痛較不劇烈。","(C) 急性腸套疊也有劇烈腹痛，但常伴有腸蠕動音改變。","(D) 急性腎衰竭通常腹痛不明顯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_068","year":2018,"roc_year":107,"session":"","examNo":68,"q":"有關犬貓鼓室切開術之敘述，下列何者錯誤？","opts":["A. 從外側進行切創（lateral approach）的方式，其鼓室內的術野較從腹側切開（ventral approach）的方式大","B. 若要同時進行全耳道切除，通常會採用從外側進行切創（lateral approach）的方式進行","C. 貓的鼻咽部息肉（nasopharyngeal polyps）的移除，一般會採用從腹側切開（ventral approach）的方式進\r 行","D. 貓在術後容易發生顏面神經麻痺的併發症"],"ans":0,"exp":"頸椎椎間盤疾病（IVDD）手術：lateral approach（側面入路）提供的術野不比ventral approach（腹側入路）大，這是「錯誤」陳述——lateral approach術野更大，提供更好的脊髓減壓。","we":["(B) Ventral slot（腹側入路）常用於頸椎腹側，術野較局限。","(C) Lateral approach可提供雙側減壓，適用於多節段病變。","(D) Ventral approach是常見術式，但術野相對較小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_069","year":2018,"roc_year":107,"session":"","examNo":69,"q":"有關治療貓自發性膀胱炎引起之下泌尿道阻塞，下列敘述何者錯誤？","opts":["A. 與緊迫、環境因子的相關性高","B. 高血鈉常是本疾病的死因","C. 常發生在肥胖已結紮的公貓","D. 需要以尿道造口術治療的病例，最常見的術後併發症為尿道狹窄"],"ans":1,"exp":"貓下泌尿道阻塞（FLUTD with urethral obstruction）的死亡原因主要是高血鉀（hyperkalemia）→心臟毒性→心律不整→死亡；不是高血鈉。","we":["(A) 高血鈉（hypernatremia）不是FLUTD阻塞的主要死亡原因。","(C) 腎衰竭是繼發結果，但急性死因是高血鉀性心臟毒性。","(D) 代謝性酸中毒也是問題之一，但高血鉀是最直接的致命原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_070","year":2018,"roc_year":107,"session":"","examNo":70,"q":"下列何種方法最不適合用來修復8歲雜種犬股骨中段的粉碎性骨折？","opts":["A. 加壓骨板（dynamic compression plate）","B. 第一型骨外固定（Type 1 ESF）","C. 鎖定骨板（locking plate）","D. 中和骨板加鋼針（neutralization plate-rod）"],"ans":1,"exp":"ESF（External Skeletal Fixation）Type 1（單側固定）最不適合應用於股骨中段粉碎性骨折——因股骨周圍肌肉厚、骨折片多，單側固定無法提供足夠穩定性。","we":["(A) ESF Type II（雙側固定）提供更好的穩定性，適合粉碎性骨折。","(C) 骨板（bone plate）固定是股骨骨折的常見選擇。","(D) 髓內釘（intramedullary pin）結合ESF也適用於粉碎性骨折。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_071","year":2018,"roc_year":107,"session":"","examNo":71,"q":"有關犬隻脊髓軟化症（myelomalacia）之敘述，下列何者錯誤？","opts":["A. 目前無有效的藥物治療方法","B. 上行性脊髓軟化症的死因通常是呼吸抑制","C. 緊急開刀進行脊椎減壓可以改善症狀","D. 神經學檢查中皮肌反射（cutaneous trunci reflex）結果可以幫助診斷病變部位"],"ans":2,"exp":"進行性脊髓軟化症（progressive myelomalacia）是嚴重脊髓損傷後的不可逆病理改變，緊急減壓手術無法改善脊髓軟化症的進程，預後極差。","we":["(A) 減壓手術對一般脊髓壓迫有效，但對軟化症無效。","(B) 類固醇治療對脊髓軟化症無效。","(D) 物理治療在脊髓軟化症確立後無法逆轉損傷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_072","year":2018,"roc_year":107,"session":"","examNo":72,"q":"下列何者不是造成犬短吻呼吸道阻塞症候群的主因？","opts":["A. 軟顎過長","B. 喉頭塌陷","C. 鼻孔開口狹窄","D. 喉小囊外翻"],"ans":1,"exp":"短吻犬上呼吸道阻塞症候群（BOAS）主要由：鼻孔狹窄、軟腭過長、氣管發育不全引起；喉頭塌陷（laryngeal collapse）是BOAS的繼發性病變，不是主要致病因子。","we":["(A) 軟腭過長（elongated soft palate）是BOAS的三大主要原因之一。","(C) 鼻孔狹窄（stenotic nares）是BOAS的原發性病變。","(D) 氣管發育不全（tracheal hypoplasia）在某些短吻犬種常見，也是BOAS的原因之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_073","year":2018,"roc_year":107,"session":"","examNo":73,"q":"下列何者不是常見採集犬貓自體海綿骨的部位？","opts":["A. 股骨近端","B. 肱骨近端","C. 脛骨近端","D. 腸骨翼"],"ans":0,"exp":"常見的海綿骨採集部位（cancellous bone harvest sites）包括：近端橈尺骨、近端肱骨、近端脛骨、翼骨；股骨近端（proximal femur）因部位深、肌肉覆蓋多，不是常見採集部位。","we":["(B) 近端肱骨（proximal humerus）是常見且方便的海綿骨採集部位。","(C) 近端脛骨（proximal tibia）是最常使用的海綿骨採集部位之一。","(D) 翼骨（ileum/wing of ilium）也是海綿骨的常見採集部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_074","year":2018,"roc_year":107,"session":"","examNo":74,"q":"一隻12歲混種犬有發燒、嘔吐、黃疸等臨床症狀，經檢查發現原因可能來自膽囊結石造成的膽囊炎，下列處\r 置方法何者不恰當？","opts":["A. 若總膽管通暢，可進行膽囊切除術","B. 若總膽管阻塞，可進行膽囊及十二指腸的吻合術","C. 以膽囊切開術移除結石，侵襲性及併發症最小","D. 膽汁可進行細菌培養，做抗生素感受性試驗"],"ans":2,"exp":"膽囊切開術（cholecystotomy）用於取出膽石，但「侵襲性及併發症最小」是錯誤的——膽囊切開術侵襲性較大，而且膽石復發率高；膽囊切除術（cholecystectomy）是更根治性的選擇。","we":["(A) 膽囊切除術（cholecystectomy）根治性強，是膽石症的標準手術。","(B) 超聲引導下膽囊穿刺是暫時性姑息治療。","(D) 藥物溶石療法適用於特定類型膽石，非所有情況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_075","year":2018,"roc_year":107,"session":"","examNo":75,"q":"下列何者不是犬骨軟骨病／剝離性骨軟骨炎（osteochondrosis/osteochondritis dissecans）好發的位置？","opts":["A. 近端肱骨頭後緣（caudal aspect of the proximal humeral head）","B. 遠端肱骨外側滑車（distolateral aspect of the humeral trochlea）","C. 股骨內髁（the medial femoral condyle）","D. 距骨內側滑車脊（the medial trochlear ridges of the talus）"],"ans":1,"exp":"骨軟骨病（OCD, Osteochondrosis Dissecans）好發部位：近端肱骨頭、肘關節（內側冠狀突、尺骨鷹嘴突）、跗關節；遠端肱骨外側滑車（lateral humeral condyle distal）不是OCD的典型好發部位。","we":["(A) 近端肱骨（proximal humerus shoulder joint）是犬OCD最常見部位。","(C) 跗關節（tarsus）的距骨是OCD好發部位。","(D) 膝關節的股骨髁也是OCD發生部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_076","year":2018,"roc_year":107,"session":"","examNo":76,"q":"下列何項犬貓供氧方式，可達到最高的氧氣濃度？","opts":["A. 鼻管","B. 氣管插管","C. 氧氣箱","D. 面罩"],"ans":1,"exp":"氣管插管（endotracheal intubation）可提供最高的吸入氧氣濃度（接近100% O2），遠高於面罩（40-60%）或鼻導管（30-40%）。","we":["(A) 鼻導管（nasal catheter）提供約30-40%的氧氣濃度。","(C) 面罩（mask）可提供40-60%氧氣濃度。","(D) 氧氣籠（oxygen cage）通常維持30-40%氧氣濃度。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_077","year":2018,"roc_year":107,"session":"","examNo":77,"q":"犬貓進行胸腔內的食道手術時，最常採用的體位為何？","opts":["A. right lateral recumbency","B. left lateral recumbency","C. dorsal recumbency","D. ventral recumbency"],"ans":0,"exp":"胸腔內食道手術（intrathoracic esophageal surgery）採right lateral recumbency（右側橫臥位）——左側胸腔入路（left thoracotomy）可最佳暴露胸腔食道，因此採右側橫臥。","we":["(B) Left lateral recumbency不適合大多數胸腔食道手術入路。","(C) Dorsal recumbency（仰臥）不提供胸腔食道的良好暴露。","(D) Sternal recumbency（俯臥）不是食道手術的標準體位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_078","year":2018,"roc_year":107,"session":"","examNo":78,"q":"有關犬貓會陰赫尼亞的敘述，下列何項正確？","opts":["A. 母犬較公犬好發","B. 好發於未摘除睪丸的公犬","C. 好發於年輕犬","D. 貓不會發生此病"],"ans":1,"exp":"會陰赫尼亞（perineal hernia）好發於未摘除睪丸的老年公犬——雄性激素引起的肛門括約肌支撐組織萎弱，加上前列腺增生的推擠作用。","we":["(A) 已摘除睪丸的公犬發生率顯著降低。","(C) 母犬不是會陰赫尼亞的常見患者。","(D) 幼犬（puppy）很少發生，多見於老年公犬。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_079","year":2018,"roc_year":107,"session":"","examNo":79,"q":"主人主述為馬匹激烈運動完後精神差，呼吸時腹部抖動。臨床檢查馬匹體溫38.9℃，心跳80次/分鐘，呼吸60\r 次/分鐘，微血管回流時間3秒，黏膜蒼白，寡尿，下列處置何者不適當？","opts":["A. 吹風扇","B. 乳酸林格氏液點滴","C. 禁食禁水","D. 沖冷水"],"ans":2,"exp":"禁食禁水（NPO）不適當的情況：馬在激烈運動（如賽馬）後，需要適當補液（水分及電解質）恢復，禁水可能加重脫水和電解質失衡。","we":["(A) 手術前禁食（防止麻醉吸入）是適當的做法。","(B) 胃腸道手術後禁食一段時間是標準護理。","(D) 某些腸炎患者短期限食，讓腸道休息是適當的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2018_2_普通病_080","year":2018,"roc_year":107,"session":"","examNo":80,"q":"承上題，馬匹血液學及尿液學檢查的結果，下列何者最不可能出現在上述狀況中？","opts":["A. 血中CK值上升","B. 尿比重降低","C. 肌紅素尿","D. 低血鈉"],"ans":1,"exp":"寡尿（oliguria）時腎臟應濃縮尿液→尿比重應上升（高比重尿），若尿比重反而下降（低比重尿）說明腎臟濃縮功能受損，提示腎衰竭。","we":["(A) 寡尿時尿比重應上升，不是下降，此選項描述相反。","(C) 正常尿液生成時尿比重在1.015-1.045之間。","(D) 腎衰竭時尿比重固定在等滲範圍（isosthenuric，1.008-1.012）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_001","year":2019,"roc_year":108,"session":"","examNo":1,"q":"一匹馬持續單側鼻膿樣分泌物，甩頭，呼吸困難，下列何種疾病可能性最低？","opts":["A. 鼻竇炎","B. 耳咽管憩室蓄膿（guttural pouch empyema）","C. 篩骨血腫（ethmoidal hematoma）","D. 軟顎背側異位（dorsal displacement of the soft palate）"],"ans":3,"exp":"軟顎背側異位（DDSP）主要表現為運動中呼吸困難和異常呼吸音，不會引起單側鼻膿樣分泌物。鼻竇炎、鼓泡囊蓄膿、篩骨血腫均可引起單側鼻膿樣分泌物。","we":["A. 鼻竇炎可引起單側鼻膿樣分泌物。","B. 耳咽管憩室蓄膿（guttural pouch empyema）可引起單側鼻液。","C. 篩骨血腫可引起單側血性或膿性鼻液。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_002","year":2019,"roc_year":108,"session":"","examNo":2,"q":"關於馬蹄葉炎在影像醫學可觀察到蹄部結構變化，下列敘述何項正確？","opts":["A. 遠端趾骨（distal phalanx）和蹄壁的距離減少","B. 遠端趾骨（distal phalanx）和蹄底的距離減少","C. 舟狀骨（navicular bone）下沉旋轉","D. 舟狀骨（navicular bone）和蹄壁的距離增加"],"ans":1,"exp":"馬蹄葉炎時，遠端趾骨（distal phalanx）因蹄葉炎症旋轉或下沉，導致遠端趾骨與蹄底的距離減少，嚴重時甚至穿透蹄底。","we":["A. 蹄葉炎時遠端趾骨和蹄壁的距離增加（蹄葉分離），不是減少。","","C. 舟狀骨（navicular bone）不是蹄葉炎的主要影像變化。","D. 舟狀骨和蹄壁的距離增加不是蹄葉炎的特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_003","year":2019,"roc_year":108,"session":"","examNo":3,"q":"下列那一項血液化學檢查，最不能代表馬匹有無罹患肌炎？","opts":["A. creatine kinase（CK）","B. lactate dehydrogenase（LDH）","C. aspartate aminotransferase（AST）","D. alanine aminotransferase（ALT）"],"ans":3,"exp":"馬肌炎（myositis/rhabdomyolysis）的最佳指標是CK（最特異、最早升高）和AST（升高持久），LDH也升高。ALT在馬主要反映肝臟問題，不是肌肉特異性指標，最不能代表有無罹患肌炎。","we":["A. CK（creatine kinase）是馬肌炎最特異的早期指標。","B. LDH（乳酸去氫酶）在馬肌炎時也升高。","C. AST在馬肌炎時升高且持久，可用於監控。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_004","year":2019,"roc_year":108,"session":"","examNo":4,"q":"在騎乘後，馬匹左前肢呈輕度跛行，檢查淺屈肌肌腱（superficial digital flexor tendon）時呈疼痛反應，下列\r 敘述何者正確？","opts":["A. 肌腱完全斷裂可能性高","B. 病灶區急性期超音波影像可見hypoechoic area","C. 儘快以外科手術治療","D. 最常發生位置為第二及第四掌骨末端"],"ans":1,"exp":"淺屈肌肌腱炎（SDFT tendinitis）急性期超音波影像可見hypoechoic area（低回音區），代表肌腱纖維斷裂、出血及水腫。","we":["A. 輕度跛行+肌腱疼痛不代表肌腱完全斷裂，肌腱炎（部分受損）更常見。","","C. 肌腱炎首選保守治療（休息、冰敷、支撐），不是立即手術。","D. SDFT最常發生於掌骨中1/3部位，不是第二及第四掌骨末端。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_005","year":2019,"roc_year":108,"session":"","examNo":5,"q":"馬之下列保定器具，何者之作用較類似小動物用之伊麗莎白頸圈（Elizabethan collar）？","opts":["A. 頭套（halter）","B. 鼻捻子（twitch）","C. 頸架（cradle）","D. 十字結（cross-tie）"],"ans":2,"exp":"頸架（cradle）是套在馬頸部的裝置，防止馬低頭啃咬身體的傷口，功能類似犬貓的伊麗莎白頸圈（Elizabethan collar），都是防止動物自行舔咬患部。","we":["A. 頭套（halter）用於控制馬頭部和方向，不是防止自我傷害。","B. 鼻捻子（twitch）用於鎮靜和短暫保定，不是防止自我傷害。","","D. 十字結（cross-tie）用於固定馬的站立位置，不防止自我傷害。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_006","year":2019,"roc_year":108,"session":"","examNo":6,"q":"妊娠期過度肥胖牛在分娩後最易發生下列何種疾病？","opts":["A. 低血鎂症","B. 低血磷症","C. 脂肪肝症候群","D. 白肌病"],"ans":2,"exp":"妊娠期過度肥胖的牛（尤其是乳牛）在分娩後能量需求大增，體脂肪大量動員，導致脂肪肝症候群（fatty liver syndrome）。這是圍產期肥胖牛的最常見代謝疾病。","we":["A. 低血鎂症（hypomagnesemia）與飼料中鎂不足有關，不特別與肥胖相關。","B. 低血磷症與過食精料或能量代謝異常有關，但不如脂肪肝典型。","","D. 白肌病（white muscle disease）與維生素E/硒缺乏有關，不是肥胖的直接後果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_007","year":2019,"roc_year":108,"session":"","examNo":7,"q":"鈷為牛瘤胃微生物合成下列何種維生素所必須？","opts":["A. B 1","B. B 2","C. B 12","D. B 6"],"ans":2,"exp":"鈷（cobalt）是維生素B12（cyanocobalamin）的核心金屬元素，牛瘤胃微生物需要鈷來合成維生素B12。缺鈷導致維生素B12缺乏，引起消瘦和貧血。","we":["A. 維生素B1（硫胺素）合成需要硫，不需要鈷。","B. 維生素B2（核黃素）合成不需要鈷。","","D. 維生素B6（吡哆素）合成不需要鈷。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_008","year":2019,"roc_year":108,"session":"","examNo":8,"q":"牛隻腎病之急性期，較不易發生下列何種情況？","opts":["A. 蛋白尿","B. 血中谷丙轉胺酶（ALT）下降","C. 尿沉渣有玻璃樣和顆粒樣圓柱","D. 選擇性低蛋白血症"],"ans":1,"exp":"牛急性腎病的特徵包括蛋白尿、圓柱尿（玻璃樣和顆粒樣）、低蛋白血症（腎病症候群型）。血中ALT下降不是急性腎病的特徵，ALT在牛是肝臟指標，腎病不會引起ALT下降。","we":["A. 蛋白尿是急性腎病的常見表現。","","C. 尿沉渣有玻璃樣和顆粒樣圓柱是腎小管受損的表現。","D. 選擇性低蛋白血症（只有白蛋白低）是腎病症候群的特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_009","year":2019,"roc_year":108,"session":"","examNo":9,"q":"單純性左側性心臟衰竭較不會引起下列何種變化？","opts":["A. 內臟血液供應不足","B. 血管升壓素生成","C. 腎上腺分泌醛固酮","D. 內臟鬱血"],"ans":3,"exp":"左心衰竭導致肺靜脈鬱血（肺水腫），不直接引起內臟（腹腔臟器）鬱血。內臟鬱血（splanchnic congestion）是右心衰竭的特徵，因右心輸出受阻導致腔靜脈回流受阻。","we":["A. 左心衰竭→心輸出量下降→內臟血液供應不足是正確的。","B. 心輸出量下降→ADH（血管升壓素）分泌增加是正確的。","C. 心輸出量下降→RAAS啟動→醛固酮分泌是正確的。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_010","year":2019,"roc_year":108,"session":"","examNo":10,"q":"下列那一種疾病較不會引起牛隻肺出血（咳血）？","opts":["A. 嚴重肺結核","B. 肺壞疽","C. 後腔靜脈血栓症","D. 支氣管性肺炎初期"],"ans":3,"exp":"支氣管性肺炎初期（early bronchopneumonia）主要表現為炎症反應（發燒、咳嗽），肺出血（咳血）不是其初期特徵。嚴重肺結核、肺壞疽、後腔靜脈血栓症均可引起肺出血。","we":["A. 嚴重肺結核（tuberculosis）可引起肺組織破壞和肺出血。","B. 肺壞疽（lung gangrene）因組織壞死可引起出血。","C. 後腔靜脈血栓症（caudal vena cava thrombosis）可引起肺栓塞和咳血。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_011","year":2019,"roc_year":108,"session":"","examNo":11,"q":"肺充血或鬱血時，血漿成分滲漏至肺間質、肺泡及支氣管內，會導致下列何者？","opts":["A. 肺氣腫","B. 肺水腫","C. 肺腫瘤","D. 肺膿腫"],"ans":1,"exp":"肺充血或鬱血時，靜水壓升高使血漿成分滲漏至肺間質、肺泡及支氣管內，導致肺水腫（pulmonary edema）。","we":["A. 肺氣腫（emphysema）是肺泡破裂、氣體滯留，不是滲液的結果。","","C. 肺腫瘤（lung tumor）是細胞異常增殖，不是滲液的結果。","D. 肺膿腫（lung abscess）是感染後化膿，不是滲液的直接結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_012","year":2019,"roc_year":108,"session":"","examNo":12,"q":"下列何者不是牛隻酮病之症狀分類類型？","opts":["A. 神經型","B. 乳熱型","C. 隨伴型","D. 呼吸型"],"ans":3,"exp":"牛酮病的症狀分類包括神經型（neurological form）、乳熱型（milk fever type，與低鈣並存）、隨伴型（secondary ketosis，繼發於其他疾病）。「呼吸型」不是牛酮病的標準分類。","we":["A. 神經型酮症：興奮、過度舔舐、感覺過敏等神經症狀。","B. 乳熱型酮症：與低鈣血症並存，產後虛弱。","C. 隨伴型酮症：繼發於第四胃移位、子宮炎等其他疾病。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_013","year":2019,"roc_year":108,"session":"","examNo":13,"q":"乳牛發生迷走神經性消化不良繼發幽門閉鎖時，最不可能出現下列何種血液學與血清生化學檢驗結果？","opts":["A. 脫水","B. 低血氯症","C. 代謝性酸中毒","D. 低血鉀"],"ans":2,"exp":"迷走神經性消化不良繼發幽門閉鎖時，胃液（富含HCl和KCl）無法進入十二指腸→鹽酸流失→代謝性鹼中毒（不是酸中毒）、低氯血症、低鉀血症。代謝性酸中毒是最不可能出現的結果。","we":["A. 脫水因進食減少和液體積聚於胃而發生。","B. 低血氯症因HCl在胃中積聚而發生。","","D. 低血鉀因KCl流失和繼發性醛固酮活化而發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_014","year":2019,"roc_year":108,"session":"","examNo":14,"q":"當牛隻短時間採食大量澱粉或糖類時，其瘤胃內何種細菌會開始大量增殖，並產生乳酸蓄積，因而導致急性\r 瘤胃過酸？","opts":["A. Escherichia coli","B. Streptococcus bovis","C. Staphylococcus epidermidis","D. Enterococcus faecium"],"ans":1,"exp":"牛隻過食澱粉或糖類時，Streptococcus bovis在瘤胃中大量增殖，將澱粉發酵產生大量乳酸，隨後Lactobacillus繼續增殖，導致急性瘤胃乳酸中毒。","we":["A. E. coli不是引起瘤胃急性酸中毒的主要菌。","","C. Staphylococcus epidermidis不是瘤胃的主要病原菌。","D. Enterococcus faecium不是引起急性瘤胃酸中毒的主要菌。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_015","year":2019,"roc_year":108,"session":"","examNo":15,"q":"乳牛蹄間組織發生感染壞死，呈現嚴重紅腫，蹄趾間隙因為蜂窩組織炎而岔開，病牛患肢呈現急性、漸進性\r 跛行，其最有可能罹患何病？","opts":["A. 趾皮膚炎（digital dermatitis）","B. 趾間皮膚炎（interdigital dermatitis）","C. 腐蹄（foot rot）","D. 蹄底潰瘍（sole ulcer）"],"ans":2,"exp":"蹄間組織感染壞死、蜂窩組織炎、蹄趾間隙因蜂窩組織炎而岔開、急性漸進性跛行，這是腐蹄（foot rot/interdigital necrobacillosis）的典型臨床表現，由Fusobacterium necrophorum引起。","we":["A. 趾皮膚炎（digital dermatitis）：皮膚表面糜爛，不引起蜂窩組織炎和趾間岔開。","B. 趾間皮膚炎（interdigital dermatitis）：病變較淺表，不引起嚴重蜂窩組織炎。","","D. 蹄底潰瘍（sole ulcer）：蹄底出血和壞死，不引起蹄間蜂窩組織炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_016","year":2019,"roc_year":108,"session":"","examNo":16,"q":"下列黴漿菌種中，何者最常感染乳牛引起乳房炎？","opts":["A. Mycoplasma californicum","B. Mycoplasma bovigenitalium","C. Mycoplasma bovis","D. Mycoplasma hyopneumoniae"],"ans":2,"exp":"Mycoplasma bovis是最常感染乳牛引起乳房炎的黴漿菌種，也可引起關節炎、肺炎，在乳牛群中傳播迅速，且對抗生素治療反應差。","we":["A. Mycoplasma californicum偶爾可引起乳房炎，但不如M. bovis常見。","B. Mycoplasma bovigenitalium主要與生殖道感染有關。","","D. Mycoplasma hyopneumoniae是豬的肺炎黴漿菌，不感染牛。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_017","year":2019,"roc_year":108,"session":"","examNo":17,"q":"牛穀物過食所引起之瘤胃食滯，可採用下列何種處理來預防酸中毒的發生？","opts":["A. 50%葡萄糖輸液","B. 7%重碳酸鈉靜脈注射","C. 20%硫酸鎂靜脈注射","D. 0.9%生理鹽水輸液"],"ans":1,"exp":"牛穀物過食引起的瘤胃酸中毒，使用7%重碳酸鈉（NaHCO3）靜脈注射中和代謝性酸中毒，是預防和治療酸中毒的有效方法。","we":["A. 50%葡萄糖輸液用於低血糖，不預防酸中毒。","","C. 20%硫酸鎂靜脈注射用於低血鎂症或通便，不用於預防酸中毒。","D. 0.9%生理鹽水輸液補充體液，但不直接中和酸中毒。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_018","year":2019,"roc_year":108,"session":"","examNo":18,"q":"乳牛慢性第三胃食滯（impaction）為臨床上甚難診斷的疾病，一般建議重複給予病牛下列何種物質以進行治\r 療？","opts":["A. 高張生理鹽水","B. 石蠟油","C. 丙二醇","D. 小蘇打"],"ans":1,"exp":"乳牛慢性第三胃（重瓣胃/omasum）食滯的治療，建議重複灌予石蠟油（paraffin oil/mineral oil）作為潤滑劑，幫助食滯的草料軟化，促進通過。","we":["A. 高張生理鹽水用於補液，不直接治療第三胃食滯。","","C. 丙二醇（propylene glycol）用於治療酮症，不是第三胃食滯的首選。","D. 小蘇打用於中和瘤胃酸，不用於第三胃食滯。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_019","year":2019,"roc_year":108,"session":"","examNo":19,"q":"於牛左側第9至12肋間之腹側三分之一至腹中央部間，以指敲打可聽到金屬音時，最有可能是下列那一種疾\r 病？","opts":["A. 瘤胃積氣","B. 腹腔積氣","C. 盲腸捻轉","D. 皺胃左側異位"],"ans":3,"exp":"牛左側第9~12肋間腹側三分之一至腹中央部間的金屬音（ping音），是皺胃左側異位（LDA, left displacement of abomasum）的典型叩診發現，皺胃充氣後移位至瘤胃和左腹壁之間。","we":["A. 瘤胃積氣的ping音通常在左側更背側（腰部三角窩）。","B. 腹腔積氣不是常見疾病。","C. 盲腸捻轉的ping音在右側腹部。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_020","year":2019,"roc_year":108,"session":"","examNo":20,"q":"引起牛創傷性心囊炎之金屬銳物，主要出現於何胃？","opts":["A. 瘤胃","B. 蜂巢胃","C. 重瓣胃","D. 皺胃"],"ans":1,"exp":"創傷性網胃心囊炎（traumatic reticulopericarditis）的金屬銳物主要存在於蜂巢胃（reticulum，網胃）中。蜂巢胃負責收集和分類食物，金屬異物最容易積聚在此，並可穿透胃壁進入心包。","we":["A. 瘤胃（rumen）是最大的胃，但金屬異物在其中不易直接刺傷心臟。","","C. 重瓣胃（omasum）不是金屬異物的主要聚集部位。","D. 皺胃（abomasum）主要功能是消化，不是金屬異物聚集處。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_021","year":2019,"roc_year":108,"session":"","examNo":21,"q":"大動物腹部手術之局部麻醉法中，下列何者不是線型阻斷法（line block）之缺點？","opts":["A. 施行技術要求較高","B. 傷口癒合較易延遲","C. 麻醉劑需要量較高","D. 血管較容易擴張及出血"],"ans":0,"exp":"線型阻斷法（line block）是技術上較簡單的局部麻醉方式，只需在切口線上滲透注射，「施行技術要求較高」不是其缺點（反而是優點）。真正的缺點包括麻醉劑需要量大、傷口癒合延遲等。","we":["","B. 傷口癒合較易延遲是line block的已知缺點（麻醉藥注射在切口線上）。","C. 麻醉劑需要量較高是line block的缺點。","D. 血管擴張及出血增加是局部麻醉藥的作用，也是line block的缺點之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_022","year":2019,"roc_year":108,"session":"","examNo":22,"q":"某牧場母牛陰部膨出如下圖，下列何種手術治療方式最為適當？","opts":["A. 環狀切除突出部位並吻合剩餘陰道黏膜","B. 以horizontal mattress suture進行陰部縫合","C. 以Buhner needle使用umbilical tape縫合陰部周邊","D. 以near-far-far-near suture進行陰部縫合"],"ans":2,"exp":"牛陰道脫出（vaginal prolapse）的手術治療，先將陰道復位後，使用Bühner針（Bühner needle）以umbilical tape縫合陰部周邊（Bühner法），是最標準、最有效的固定方法。","we":["A. 環狀切除適用於無法復位的嚴重壞死性脫出，不是首選。","B. Horizontal mattress suture不如Bühner法有效固定整個陰部開口。","","D. Near-far-far-near suture是腹壁縫合法，不用於陰部固定。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_023","year":2019,"roc_year":108,"session":"","examNo":23,"q":"下列何種縫合法適合用於牛隻帝王切開術中的子宮縫合？","opts":["A. horizontal mattress suture","B. vertical mattress suture","C. near-far-far-near suture","D. Utrecht method suture"],"ans":3,"exp":"牛帝王切開術的子宮縫合，Utrecht method（雙層連續翻轉縫合）是最常用的方法，提供良好的密封性和翻轉（inverting）效果，減少術後黏連。","we":["A. Horizontal mattress suture是外翻縫合，不適合子宮。","B. Vertical mattress suture也是外翻縫合，不適合子宮。","C. Near-far-far-near suture用於腹壁縫合，不是子宮縫合的主要方法。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_024","year":2019,"roc_year":108,"session":"","examNo":24,"q":"下列牛隻腹腔探測術（exploratory laparotomy）中，何種手術部位最佳，可以全面檢視腹腔狀況？","opts":["A. ventral paramedian laparotomy","B. ventrolateral oblique laparotomy","C. right paralumbar laparotomy","D. left paralumbar laparotomy"],"ans":0,"exp":"腹側正中旁開腹術（ventral paramedian laparotomy）是牛腹腔探測術中可以最全面檢視腹腔的切口，因為從腹側切開可以看到腹腔底部和雙側的臟器，不同於側面的paralumbar切口只能看到單側。","we":["","B. Ventrolateral oblique laparotomy視野有限。","C. Right paralumbar laparotomy只能檢視右側腹腔。","D. Left paralumbar laparotomy只能檢視左側腹腔。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_025","year":2019,"roc_year":108,"session":"","examNo":25,"q":"以副睪切除術（epididymectomy）進行試情公牛手術時，要切除的部位為下列何者？","opts":["A. 副睪頭部","B. 副睪體","C. 副睪頭部及副睪體","D. 副睪尾部"],"ans":3,"exp":"試情公牛（teaser bull）手術需阻斷精子輸送而保留性慾和行為。副睪切除術切除副睪尾部（epididymal tail/cauda epididymis），因為精子在此部位成熟並儲存，切除後精子無法進入輸精管。","we":["A. 副睪頭部只切除不能完全阻斷精子。","B. 副睪體只切除效果不完整。","C. 副睪頭部及體部切除不完整。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_026","year":2019,"roc_year":108,"session":"","examNo":26,"q":"以2% lidocaine進行成牛的尾根硬膜外麻醉以進行外陰部手術，其最佳注射總量為多少mL？","opts":["A. 5~6","B. 10~12","C. 15~18","D. 20~24"],"ans":0,"exp":"成牛的尾根硬膜外麻醉（caudal epidural anesthesia）以2% lidocaine進行外陰部手術時，建議注射量為5~6 mL，可以麻醉尾根和會陰部，不影響後肢運動功能。","we":["","B. 10~12 mL過多，可能擴散到後肢運動神經，導致後肢無力。","C. 15~18 mL過多，會造成後肢癱瘓。","D. 20~24 mL過多，危險劑量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_027","year":2019,"roc_year":108,"session":"","examNo":27,"q":"進行right paralumbar fossa omentopexy以治療皺胃異位時，以手探測皺胃發現其與腹壁有黏連，此黏連最\r 不可能由下列那一種病理因素所造成？","opts":["A. 皺胃潰瘍","B. 創傷性蜂巢胃炎","C. 腹膜炎","D. 瘤胃臌脹壓迫"],"ans":3,"exp":"皺胃與腹壁的黏連最不可能由瘤胃臌脹壓迫（ruminal bloat压迫）造成，因為臌脹是機械性壓力，不引起組織炎症和黏連。皺胃潰瘍、創傷性蜂巢胃炎、腹膜炎都可引起局部炎症→黏連。","we":["A. 皺胃潰瘍引起局部腹膜炎→黏連。","B. 創傷性蜂巢胃炎（TRP）引起廣泛腹膜炎→黏連。","C. 腹膜炎是黏連最直接的原因。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_028","year":2019,"roc_year":108,"session":"","examNo":28,"q":"下列何項不是山羊levamisole中毒之症狀？","opts":["A. 皮膚震顫","B. 痙攣","C. 頻尿","D. 血尿"],"ans":3,"exp":"Levamisole是膽鹼能刺激劑（cholinesterase inhibitor），中毒症狀包括流涎、腹瀉、頻尿、肌肉震顫、痙攣等膽鹼能亢進症狀。血尿（hematuria）不是levamisole中毒的典型症狀。","we":["A. 皮膚震顫（fasciculation）是膽鹼能亢進的典型表現。","B. 痙攣（convulsion）在嚴重levamisole中毒時發生。","C. 頻尿（pollakiuria）是膽鹼能刺激膀胱逼尿肌的結果。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_029","year":2019,"roc_year":108,"session":"","examNo":29,"q":"有關羊乾酪性淋巴結炎（caseous lymphadenitis）之敘述，下列何項正確？","opts":["A. 病原為假結核棒狀桿菌（Corynebacterium pseudotuberculosis）","B. 以抗微生物製劑治療通常反應良好","C. 綿羊感染時，以體表淋巴結之乾酪化病變為主（external abscesses）","D. 山羊感染時，以內臟淋巴結之乾酪化病變為主（visceral form）"],"ans":0,"exp":"羊乾酪性淋巴結炎的病原確實是假結核棒狀桿菌（Corynebacterium pseudotuberculosis），這是最正確的陳述。抗生素治療效果差；綿羊以體表型為主；山羊的分布型各有說法。","we":["","B. 抗生素治療效果通常很差，因為病灶包囊化，藥物難以滲透。","C. 綿羊感染時確實以體表淋巴結為主（外部型）（正確）。","D. 山羊感染時的型別有爭議，並非都以內臟型為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_030","year":2019,"roc_year":108,"session":"","examNo":30,"q":"下列何種病理現象會出現於母羊的妊娠毒血症？","opts":["A. 低血鉀及糖尿症","B. 高血糖及代謝性鹼中毒","C. 酮尿症及低血糖","D. 低血鎂及低血鉀"],"ans":2,"exp":"母羊妊娠毒血症（pregnancy toxemia）是能量負平衡引起的代謝疾病，特徵是低血糖（hypoglycemia）和酮尿症（ketonuria），因為低血糖→脂肪動員→酮體生成。","we":["A. 低血鉀及糖尿症不是妊娠毒血症的特徵。","B. 高血糖及代謝性鹼中毒不是妊娠毒血症的特徵（應是低血糖）。","","D. 低血鎂及低血鉀是草痙攣（hypomagnesemia）的表現，不是妊娠毒血症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_031","year":2019,"roc_year":108,"session":"","examNo":31,"q":"將豬隻直腸脫垂推回原位後，下列何種縫合法最適合施用於肛門周邊以避免再次脫垂？","opts":["A. 水平臥褥縫合法","B. 荷包縫合法","C. 垂直臥褥縫合法","D. near-far-far-near縫合法"],"ans":1,"exp":"豬直腸脫垂復位後，在肛門周邊施行荷包縫合法（purse-string suture）縮小肛門口，防止再次脫垂，是最適合的縫合方法。","we":["A. 水平臥褥縫合法不適合用於肛門周邊縮口。","","C. 垂直臥褥縫合法不適合用於肛門周邊縮口。","D. Near-far-far-near縫合法用於腹壁縫合，不用於肛門縮口。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_032","year":2019,"roc_year":108,"session":"","examNo":32,"q":"下列何者不是犬貓分娩第一期之特徵？","opts":["A. 築巢、喘氣","B. 腹部明顯用力收縮","C. 體溫下降","D. 子宮頸擴張"],"ans":1,"exp":"犬貓分娩第一期（子宮頸擴張期）的特徵包括築巢行為、喘氣、不安、體溫下降、子宮頸擴張，但不會有腹部明顯用力收縮（straining），腹部努責是第二期（胎兒排出期）的特徵。","we":["A. 築巢、喘氣是第一期的特徵。","","C. 體溫下降（分娩前12~24小時）是第一期的特徵。","D. 子宮頸擴張是第一期的定義特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_033","year":2019,"roc_year":108,"session":"","examNo":33,"q":"有關母犬子宮蓄膿之敘述，下列何者錯誤？","opts":["A. 患畜大多有多渴多尿症狀","B. 患畜都有陰道膿樣分泌物","C. 好發於發情期過後1~2個月期間","D. 通常與助孕素（progesterone）分泌過多或長時間分泌有關"],"ans":1,"exp":"母犬子宮蓄膿分為開放型（open pyometra，宮頸開放有分泌物）和閉合型（closed pyometra，宮頸閉合無分泌物）。並非所有患犬都有陰道膿樣分泌物，閉合型子宮蓄膿就沒有分泌物。","we":["A. 多渴多尿（PU/PD）是子宮蓄膿常見症狀（毒素影響腎臟ADH反應）。","","C. 好發於發情後1~2個月（黃體期）是正確的。","D. 與黃體素長時間作用有關是正確的（助孕素促進子宮液體分泌並抑制宮頸收縮）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_034","year":2019,"roc_year":108,"session":"","examNo":34,"q":"母畜第一次發情常呈鈍性發情（silent heat），其原因可能是由於中樞神經系統未受到下列何種內泌素刺激 所致？","opts":["A. 助孕素（progesterone）","B. 鬆弛素（relaxin）","C. 動情素（estorgen）","D. 前列腺素F 2α （PGF 2α ）"],"ans":0,"exp":"母畜第一次發情呈鈍性發情（silent heat），原因是中樞神經系統未受到之前黃體期助孕素（progesterone）的「啟動」作用。助孕素暴露使CNS準備好對雌激素的行為反應，缺乏此暴露則雌激素刺激無法引起發情行為。","we":["","B. 鬆弛素（relaxin）主要與妊娠和分娩有關，不是鈍性發情的原因。","C. 動情素（estrogen）是引發發情的激素，不是鈍性發情的原因。","D. PGF2α主要調控黃體消退，不是鈍性發情的主要原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_035","year":2019,"roc_year":108,"session":"","examNo":35,"q":"某乳牛於分娩後5日呈現食慾不佳，起立困難，大量惡臭惡露由陰道排出，子宮內也有大量惡臭惡露蓄積，\r 體溫41℃，心跳110/分鐘且心音較弱，下列何種治療方式最無明顯療效？","opts":["A. 靜脈點滴7%高張鹽水，並灌食25公升清水","B. 灌食30公升等滲透壓電解質液","C. 肌肉注射2.2 mg/kg flunixin","D. 靜脈點滴1公升5%葡萄糖液"],"ans":3,"exp":"嚴重感染性子宮炎合併感染性休克的乳牛，靜脈點滴1公升5%葡萄糖液提供的能量和液體量極少（只有1公升），對如此嚴重的病例治療效果最差。正確的治療應大量補液（30公升+）和使用NSAIDs。","we":["A. 7%高張鹽水靜脈點滴+25公升清水灌食是有效的積極補液方式。","B. 30公升等滲透壓電解質液灌食是有效的大量補液。","C. Flunixin 2.2 mg/kg（NSAIDs）可降溫、抗內毒素，是有效的輔助治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_036","year":2019,"roc_year":108,"session":"","examNo":36,"q":"關於引起牛隻流產之新孢子蟲症，下列敘述何者錯誤？","opts":["A. 受罹病動物糞便污染的牧草會傳播本病","B. 牛隻為感染的終宿主","C. 可藉由胎盤傳播給胎兒","D. 感染牛隻亦可能生下健康的小牛"],"ans":1,"exp":"Neospora caninum的終宿主（definitive host）是犬（Canidae），不是牛。牛是中間宿主（intermediate host）。犬吃了感染Neospora的組織後在犬腸道中完成性生殖階段，排出卵囊（oocyst）。","we":["A. 受污染牧草（卵囊）傳播給牛是正確的（水平傳播）。","","C. 可藉由胎盤傳播（垂直/先天性傳播）是正確的，是主要傳播途徑。","D. 感染牛隻也可能生下健康小牛是正確的（並非所有感染牛都會流產）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_037","year":2019,"roc_year":108,"session":"","examNo":37,"q":"下列何項不是造成公犬陰莖勃起困難的原因？","opts":["A. 陰莖繫帶永存（persistent frenulum）","B. 嵌頓包莖（paraphimosis）","C. 陰莖海綿體（corpus cavernosum penis）病變","D. 萊狄吉細胞瘤（Leydig cell tumor）"],"ans":3,"exp":"萊狄吉細胞瘤（Leydig cell tumor）分泌大量睪酮（testosterone），增加性慾和攻擊性，不會造成陰莖勃起困難，反而會增強勃起能力。","we":["A. 陰莖繫帶永存（persistent frenulum）限制陰莖外露，影響交配和勃起伸出。","B. 嵌頓包莖（paraphimosis）是陰莖永久外露水腫，與正常勃起縮回功能障礙相關。","C. 陰莖海綿體（corpus cavernosum）病變直接影響勃起機制。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_038","year":2019,"roc_year":108,"session":"","examNo":38,"q":"下列何種動物的睪丸，是在出生後2~5天才進入陰囊內？","opts":["A. 貓","B. 馬","C. 牛","D. 豬"],"ans":0,"exp":"貓的睪丸在出生後2~5天才進入陰囊，是正確的。貓的睪丸下降在胎兒後期已開始但在出生後才完成進入陰囊。馬、牛、豬的睪丸通常在出生前已下降至陰囊。","we":["","B. 馬的睪丸通常在出生前後已完成下降。","C. 牛的睪丸在出生時已在陰囊中。","D. 豬的睪丸在出生時已在陰囊中。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_039","year":2019,"roc_year":108,"session":"","examNo":39,"q":"下列何種臨床症狀通常不會出現於乳牛卵巢囊腫（cystic ovarian disease）？","opts":["A. 雄性化","B. 慕雄狂","C. 無動情週期","D. 頸部脫毛"],"ans":3,"exp":"頸部脫毛不是乳牛卵巢囊腫（cystic ovarian disease）的臨床症狀。頸部脫毛更多見於犬的內分泌疾病。乳牛卵巢囊腫的典型症狀包括慕雄狂（nymphomania）、無動情週期（anestrus）、雄性化（virilism）等。","we":["A. 雄性化（masculinization）可見於囊腫性黃體或雄激素分泌。","B. 慕雄狂（nymphomania）是濾泡囊腫（雌激素過多）的典型表現。","C. 無動情週期（anestrus）見於黃體囊腫（助孕素高）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_040","year":2019,"roc_year":108,"session":"","examNo":40,"q":"牛分娩前期，下列敘述何項錯誤？","opts":["A. progesterone下降","B. estrogen下降","C. prolactin上升","D. prostaglandin上升"],"ans":1,"exp":"牛分娩前期，胎兒腎上腺皮質醇增加→胎盤合成雌激素增加（estrogen上升），而非下降。同時助孕素下降（A ✓），泌乳素上升（C ✓），前列腺素上升（D ✓）。","we":["A. Progesterone下降是分娩前期的正確特徵（黃體退化）。","","C. Prolactin上升為泌乳做準備，是正確的。","D. Prostaglandin上升引起子宮收縮和黃體消退，是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_041","year":2019,"roc_year":108,"session":"","examNo":41,"q":"下列何種情況的牛隻，其黃體助孕素（progesterone）濃度會始終維持低值？","opts":["A. 黃體滯留","B. 鈍性發情","C. 卵巢萎縮","D. 囊腫性黃體"],"ans":2,"exp":"卵巢萎縮（ovarian atrophy/aplasia）時，卵巢無功能性組織，無法形成黃體，因此助孕素（progesterone）濃度始終維持低值。黃體滯留→助孕素高；鈍性發情有正常排卵→正常助孕素；囊腫性黃體→助孕素偏高。","we":["A. 黃體滯留（persistent corpus luteum）→助孕素持續高值。","B. 鈍性發情（silent heat）有正常排卵和黃體形成，助孕素有正常週期。","","D. 囊腫性黃體（cystic corpus luteum）→助孕素偏高。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_042","year":2019,"roc_year":108,"session":"","examNo":42,"q":"臨床上可利用心臟超音波都卜勒（Doppler）掃描，並依白努力定律（Bernoulli equation）測量血流壓力梯 度（pressure gradient），此公式為何？","opts":["A. 壓力梯度＝4（最高流速） 2","B. 壓力梯度＝1/2（最高流速） 2","C. 壓力梯度＝2（最高流速） 2","D. 壓力梯度＝2（最高流速） 3"],"ans":0,"exp":"心臟超音波都卜勒（Doppler）依簡化白努力方程式（simplified Bernoulli equation）計算壓力梯度：ΔP（mmHg）= 4V²（其中V為最高血流速度，單位m/s）。這是心臟科常用公式。","we":["","B. 1/2V²是動能公式，不是簡化Bernoulli方程式。","C. 2V²不是正確的Bernoulli方程式。","D. 2V³不是正確的公式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_043","year":2019,"roc_year":108,"session":"","examNo":43,"q":"心臟超音波連續式都卜勒（CW Doppler）掃描之最大缺點為何？","opts":["A. 無法確定血流方向","B. 沒有深度辨別力","C. 無法檢測高速血流之流速","D. 解析度不良"],"ans":1,"exp":"連續式都卜勒（CW Doppler）的最大缺點是沒有深度辨別力（range ambiguity），無法確定高速血流的確切位置，只知道沿超音波束某處有高速血流，但能測量高速血流（無速度限制）。","we":["A. CW Doppler可以確定血流方向（以多普勒頻移正負判斷）。","","C. CW Doppler可以檢測高速血流，這是其優點（無aliasing問題）。","D. CW Doppler的解析度不是主要缺點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_044","year":2019,"roc_year":108,"session":"","examNo":44,"q":"那一種犬貓心臟病變於聽診時會聽到收縮期心雜音（systolic murmurs）？","opts":["A. 主動脈瓣閉鎖不全","B. 主動脈狹窄","C. 永存性動脈導管（PDA）","D. 二尖瓣狹窄（mitral stenosis）"],"ans":1,"exp":"主動脈狹窄（aortic stenosis）引起收縮期射出性雜音（systolic ejection murmur）。主動脈瓣閉鎖不全引起舒張期雜音；PDA引起連續性雜音；二尖瓣狹窄引起舒張期隆隆聲。","we":["A. 主動脈瓣閉鎖不全（aortic regurgitation）引起舒張期雜音。","","C. PDA（永存性動脈導管）引起連續性雜音（machinery murmur）。","D. 二尖瓣狹窄（mitral stenosis）引起舒張期雜音（開瓣音+隆隆聲）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_045","year":2019,"roc_year":108,"session":"","examNo":45,"q":"觸診脈搏時，何種犬隻疾病會感覺到弱脈？","opts":["A. 擴張性心肌病（DCM）","B. 永存性動脈導管（PDA）","C. 發燒","D. 高甲狀腺功能症"],"ans":0,"exp":"擴張性心肌病（DCM）心臟收縮力嚴重下降→心輸出量（cardiac output）下降→脈壓差縮小→弱脈（weak pulse）。PDA、發燒、甲亢都會增加心輸出量或脈壓差，引起強脈或跳動性脈搏。","we":["","B. PDA（永存性動脈導管）→主動脈血液舒張期流入肺動脈→脈壓差增大→跳動性脈搏（water hammer pulse）。","C. 發燒→心輸出量增加→強脈。","D. 高甲狀腺功能症→心輸出量增加→強脈或跳動性脈搏。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_046","year":2019,"roc_year":108,"session":"","examNo":46,"q":"有關犬乳房瘤之敘述，下列何者錯誤？","opts":["A. 為母犬最常見之腫瘤","B. 結紮可預防乳房瘤，犬隻在第一次發情前結紮可將乳房瘤發生機率降至0.5%","C. 有高達80~90%的惡性可能，所以積極手術切除是最重要的治療步驟","D. 好發於後兩對乳腺"],"ans":2,"exp":"犬乳房瘤的惡性比例約為50%（不是80~90%），貓的乳房瘤才有85~90%的高惡性比例。C選項中「高達80~90%的惡性可能」的描述適用於貓，用於犬是錯誤的。","we":["A. 犬乳房瘤確實是母犬最常見的腫瘤（約占所有母犬腫瘤的50%）。","B. 第一次發情前結紮將乳房瘤發生機率降至0.5%是正確的教科書知識。","","D. 後兩對（第4、5對）乳腺好發是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_047","year":2019,"roc_year":108,"session":"","examNo":47,"q":"下列何種內分泌疾病最不可能造成犬貓多渴多尿？","opts":["A. 高腎上腺功能症","B. 低甲狀腺功能症","C. 低腎上腺功能症","D. 高甲狀腺功能症"],"ans":1,"exp":"低甲狀腺功能症（hypothyroidism）在犬主要表現為代謝降低、肥胖、嗜睡、皮膚問題，不是多渴多尿（PU/PD）的常見原因。Cushing's、Addison's（低鈉→腎臟問題）、貓甲亢都可引起PU/PD。","we":["A. Cushing's disease（高腎上腺功能症）引起PU/PD（ADH競爭抑制）。","","C. Addison's disease（低腎上腺功能症）可因低鈉和腎臟電解質失衡引起PU/PD。","D. 高甲狀腺功能症（hyperthyroidism，貓）引起PU/PD。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_048","year":2019,"roc_year":108,"session":"","examNo":48,"q":"8歲公犬，出現喘及咳嗽，根據其X光影像，最不可能為下列何者？","opts":["A. 心因性肺水腫（cardiogenic pulmonary edema）","B. 吸入性肺炎（aspiration pneumonia）","C. 非心因性肺水腫（noncardiogenic pulmonary edema）","D. 出血（hemorrhage）"],"ans":0,"exp":"此題需參考X光影像方能確認答案。8歲公犬出現喘及咳嗽，根據X光影像鑑別心因性肺水腫、吸入性肺炎、非心因性肺水腫、出血。需確認圖示影像特徵。","we":["","B. 吸入性肺炎在X光上可見腹側肺葉影像。","C. 非心因性肺水腫X光表現較廣泛且不規律。","D. 出血的X光影像較局部且均質。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_049","year":2019,"roc_year":108,"session":"","examNo":49,"q":"下列何者不是犬單純性右心衰竭（right heart failure）時可見的X光影像特徵？","opts":["A. 肝臟變大（hepatomegaly）","B. 腹腔積液（peritoneal effusion）","C. 胸膜腔積液（pleural effusion）","D. 肺泡影徵（alveolar pattern）"],"ans":3,"exp":"單純性右心衰竭的X光特徵：肝大（靜脈回流受阻→肝臟充血）、腹腔積液（靜脈高壓→腹水）、胸腔積液（靜脈壓升高）。肺泡影徵（alveolar pattern）是左心衰竭（肺水腫）的特徵，右心衰竭不引起肺泡浸潤。","we":["A. 肝大（hepatomegaly）是右心衰竭的特徵（靜脈回流受阻→肝臟充血）。","B. 腹腔積液（ascites）是右心衰竭引起靜脈高壓的結果。","C. 胸膜腔積液（pleural effusion）可見於右心衰竭。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_050","year":2019,"roc_year":108,"session":"","examNo":50,"q":"下列有關胰臟炎放射線影像敘述，何者錯誤？","opts":["A. 可能無異常","B. 十二指腸可能擴張充滿空氣","C. 右頭側腹腔臟器漿膜可見度會增加","D. 胃之尾側可能有團塊效應（mass effect）"],"ans":2,"exp":"胰臟炎X光影像中，右頭側腹腔（十二指腸和胰臟附近）因局部腹膜炎和脂肪皂化，漿膜可見度會「下降」（模糊），不是「增加」。炎症導致腹膜積液增加，使臟器邊界模糊。","we":["A. X光可能無異常，尤其是輕度胰臟炎，是正確的描述。","B. 十二指腸可能擴張充滿空氣（鄰近胰臟炎症引起反射性腸麻痺）是正確的。","","D. 胃之尾側（右側）可能有team塊效應（胰臟腫大壓迫）是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_051","year":2019,"roc_year":108,"session":"","examNo":51,"q":"下列那一種藥物可能影響淚液分泌，乾眼症時應避免使用？","opts":["A. 類固醇眼藥水（steroid eye drops）","B. 氯黴素眼藥水（chloramphenicol eye drops）","C. 見大黴素眼藥水（gentamicin eye drops）","D. 磺胺劑眼藥水（sulfadiazine eye drops）"],"ans":3,"exp":"磺胺劑（sulfonamides）可抑制淚腺分泌，引起或加重乾眼症（KCS，keratoconjunctivitis sicca）。磺胺劑眼藥水在乾眼症患犬應避免使用或謹慎使用。","we":["A. 類固醇眼藥水雖有潛在副作用，但不直接抑制淚液分泌。","B. 氯黴素眼藥水不影響淚液分泌。","C. Gentamicin眼藥水不影響淚液分泌。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_052","year":2019,"roc_year":108,"session":"","examNo":52,"q":"下列何項藥物不適用於犬急性氣管塌陷的治療？","opts":["A. 類固醇","B. 鎮靜劑","C. 止咳劑","D. 抗生素"],"ans":3,"exp":"犬急性氣管塌陷的緊急治療包括類固醇（減少炎症）、鎮靜劑（減少焦慮性呼吸困難）、止咳劑（減少咳嗽引起的氣管壓力）。抗生素（antibiotics）不適合急性氣管塌陷的直接治療，因為氣管塌陷不是感染性疾病。","we":["A. 類固醇用於減少氣管黏膜水腫。","B. 鎮靜劑（如butorphanol）可緩解焦慮性呼吸困難。","C. 止咳劑（如hydrocodone）減少咳嗽引起的進一步氣管刺激。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_053","year":2019,"roc_year":108,"session":"","examNo":53,"q":"所謂犬慢性支氣管炎，持續咳嗽的時間最少應超過幾個月？","opts":["A. 1","B. 2","C. 4","D. 6"],"ans":1,"exp":"犬慢性支氣管炎（chronic bronchitis）的定義是：咳嗽持續超過2個月，每年大多數時候有咳嗽，且已排除其他原因。","we":["A. 1個月不足以診斷慢性支氣管炎。","","C. 4個月過於保守，2個月已是診斷標準。","D. 6個月過長，不是定義標準。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_054","year":2019,"roc_year":108,"session":"","examNo":54,"q":"犬貓低血鉀症時，血鉀補充速度最高不宜超過多少mEq/kg/hr？","opts":["A. 0.3","B. 0.5","C. 1","D. 2"],"ans":1,"exp":"犬貓低血鉀症（hypokalemia）補充血鉀時，靜脈輸注速度不宜超過0.5 mEq/kg/hr，超過此速度可能引起心臟毒性（心律不整）。","we":["A. 0.3 mEq/kg/hr是安全的，但0.5才是最大允許速度。","","C. 1 mEq/kg/hr過快，可能引起心臟毒性。","D. 2 mEq/kg/hr過快，危險劑量。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_055","year":2019,"roc_year":108,"session":"","examNo":55,"q":"0.9%生理鹽水、乳酸林格氏液、林格氏液三項溶液的共同特徵為","opts":["A. pH值偏酸","B. pH值偏鹼","C. 晶體溶液","D. 膠體溶液"],"ans":2,"exp":"0.9%生理鹽水、乳酸林格氏液（LRS）、林格氏液三者都是晶體溶液（crystalloid solution），含有小分子電解質，不含蛋白質或高分子膠體。","we":["A. pH值：0.9%生理鹽水偏酸（pH≈5.0），但乳酸林格氏液接近中性，不是全部都偏酸。","B. 不是全部都偏鹼。","","D. 三者都不是膠體溶液（colloid solution）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_056","year":2019,"roc_year":108,"session":"","examNo":56,"q":"犬隻罹患肝性腦病（hepatic encephalopathy）、低血糖症（hypoglycemia）或低血鎂症\r （hypomagnesemia），均可引起下列何種症狀？","opts":["A. 抽搐（convulsion）","B. 迴旋運動（circling movement）","C. 共濟失調（ataxia）","D. 麻痺（paralysis）"],"ans":0,"exp":"肝性腦病（高氨血症）、低血糖症、低血鎂症三者都可引起抽搐（convulsion/seizure）：高氨→神經毒性→抽搐；低血糖→能量缺乏→神經元興奮性異常→抽搐；低血鎂→神經肌肉興奮性增加→抽搐。","we":["","B. 迴旋運動主要與前庭或小腦病變有關，不是這三種病的共同表現。","C. 共濟失調可見但不是三者最典型的共同症狀。","D. 麻痺不是這三種疾病的典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_057","year":2019,"roc_year":108,"session":"","examNo":57,"q":"下列何者為引起犬肝外膽管阻塞最主要的原因？","opts":["A. 急性肝炎","B. 胰臟炎","C. 腎衰竭","D. 蛔蟲感染"],"ans":1,"exp":"犬肝外膽管阻塞（extrahepatic bile duct obstruction，EHBO）最常見的原因是胰臟炎，因為胰管和膽管在十二指腸的共同開口附近，胰臟炎引起的水腫和炎症可壓迫膽管造成阻塞。","we":["A. 急性肝炎主要是肝實質損傷，不是膽管外阻塞的主因。","","C. 腎衰竭不引起膽管阻塞。","D. 蛔蟲感染（ascariasis）偶爾可引起膽管阻塞，但不是最主要原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_058","year":2019,"roc_year":108,"session":"","examNo":58,"q":"犬急性淋巴母細胞白血病（acute lymphoblastic leukemia）之敘述，下列何項最正確？","opts":["A. 本病治療效果佳","B. 脾臟不會腫大","C. 本病多發於哺乳期幼犬","D. 本病會引起發熱、貧血和黏膜蒼白"],"ans":3,"exp":"犬急性淋巴母細胞白血病（ALL）會引起發熱、貧血、黏膜蒼白（因骨髓浸潤→正常造血受阻→貧血），以及血小板減少→出血傾向。治療效果差，脾臟通常腫大，好發於中老年犬。","we":["A. ALL治療效果差（與CLL相比），預後不良。","B. 脾臟通常會腫大（因白血病細胞浸潤）。","C. ALL好發於中老年犬，不是哺乳期幼犬。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_059","year":2019,"roc_year":108,"session":"","examNo":59,"q":"犬 warfarin中毒時，與下列那些凝血因子最相關？","opts":["A. II、VII、VIII、X及protein B","B. II、VII、IX、X及protein B","C. II、VII、VIII、X及protein C","D. II、VII、IX、X及protein C"],"ans":3,"exp":"Warfarin（維生素K拮抗劑）抑制維生素K依賴性凝血因子：II（凝血酶原）、VII、IX、X及蛋白C（protein C）和蛋白S（protein S）。注意是protein C（不是protein B，protein B不存在）。","we":["A. 含有protein B（不存在的凝血蛋白），且凝血因子VIII不是維生素K依賴性。","B. 含有protein B（不存在），雖凝血因子正確（II, VII, IX, X）。","C. 凝血因子VIII不是維生素K依賴性凝血因子。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_060","year":2019,"roc_year":108,"session":"","examNo":60,"q":"貓具有自體抗體，因此輸血前需要驗血型。下列何種情況會導致輸血貓隻猝死？","opts":["A. B型貓輸入A型貓血","B. A型貓輸入B型貓血","C. A型貓輸入A型但交叉配對不是很合的貓血","D. B型貓輸入B型但交叉配對不是很合的貓血"],"ans":0,"exp":"B型貓有強力的抗A型抗體（anti-A antibodies），當B型貓接受A型貓的輸血時，立即發生嚴重急性溶血反應，可能導致猝死。A型貓的抗B抗體較弱，輸B型血反應較不嚴重。","we":["","B. A型貓輸入B型貓血：A型貓抗B抗體弱，反應較輕，不一定猝死。","C. 同型但交叉配對不合：反應通常不如異型輸血嚴重。","D. B型貓輸入B型血：同型輸血即使交叉配對不完美，反應也不如異型嚴重。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_061","year":2019,"roc_year":108,"session":"","examNo":61,"q":"小型犬膝蓋骨脫臼的分級中，那一級因為膝蓋骨不斷摩擦滑車窩而常造成股骨頭遠端滑車溝軟骨糜爛？","opts":["A. 一","B. 二","C. 三","D. 四"],"ans":1,"exp":"膝蓋骨脫臼二級（Grade II）：膝蓋骨可手動復位但反覆自發脫臼，不斷地進出滑車溝摩擦造成軟骨糜爛。一級幾乎無症狀；三四級膝蓋骨持續脫位，反而摩擦較少。","we":["A. 一級膝蓋骨偶爾脫臼並可自行復位，軟骨糜爛較少見。","","C. 三級膝蓋骨持續脫臼（不在滑車溝中），所以不是不斷摩擦滑車溝。","D. 四級膝蓋骨永久脫臼，同樣不在滑車溝中，也不是反覆摩擦。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_062","year":2019,"roc_year":108,"session":"","examNo":62,"q":"下列何種縫針和縫線的組合最適合用於犬貓的腸吻合術？","opts":["A. 反角針（reverse cutting needle），單股合成可吸收線","B. 反角針（reverse cutting needle），多股合成可吸收線","C. 圓針（taper needle），單股合成可吸收線","D. 圓針（taper needle），多股合成可吸收線"],"ans":2,"exp":"腸吻合術最適合的組合是圓針（taper needle）+單股合成可吸收縫線（monofilament synthetic absorbable suture）。圓針不切割組織（穿越腸壁時不撕裂）；單股縫線光滑、感染風險低、抗拉強度均一。","we":["A. 反角針（reverse cutting needle）會切割組織，不適合腸道縫合。","B. 反角針+多股線：兩者都不適合腸道縫合。","","D. 圓針+多股線：多股線可能藏菌，增加感染風險。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_063","year":2019,"roc_year":108,"session":"","examNo":63,"q":"1歲雄性未去勢拉不拉多犬（Labrador），右前肢跛行，觸診時疼痛。根據附圖之X光影像，最有可能的疾病 為何？","opts":["A. 肥大性骨病（hypertrophic osteopathy）","B. 肥大性骨營養不良（hypertrophic osteodystrophy）","C. 全骨炎（panosteitis）","D. 骨髓炎（osteomyelitis）"],"ans":2,"exp":"1歲雄性大型犬（拉不拉多）的跛行伴骨幹觸診疼痛，全骨炎（panosteitis）是最典型的診斷。X光可見長骨骨髓腔內不透明度增加（medullary sclerosis）。需確認圖示。","we":["A. 肥大性骨病（HOD）X光可見長骨骨幹周邊新骨生成，不同於全骨炎。","B. 肥大性骨營養不良（HOD）X光可見骨幹末端緻密白線（metaphyseal sclerosis）。","","D. 骨髓炎X光可見骨質破壞和骨膜反應，通常有感染病史。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_064","year":2019,"roc_year":108,"session":"","examNo":64,"q":"骨折治療有時需使用到骨移植，其中有關cancellous bone autografts之敘述，下列何者錯誤？","opts":["A. 自體的cancellous bone移植，是骨折處理極重要的一環","B. 較適合提供誘導骨生成細胞形成的作用","C. 適用於需要快速的骨生成以改善骨折癒合不良","D. 適用於提供堅固的骨折支持作用"],"ans":3,"exp":"Cancellous bone autograft（自體鬆質骨移植）的優點是提供骨形成細胞（osteogenic）和骨誘導因子（osteoinductive），能促進骨生成。其缺點是不提供機械性結構支持（cortical bone才有堅固結構）。","we":["A. 自體鬆質骨移植確實是骨折處理的重要選項（A正確）。","B. 鬆質骨移植確實適合提供誘導骨生成細胞形成（B正確）。","C. 適用於改善骨折癒合不良（需要快速骨生成）是正確的（C正確）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_065","year":2019,"roc_year":108,"session":"","examNo":65,"q":"有關犬內側膝蓋骨脫臼（medial patellar luxation）的敘述，下列何者錯誤？","opts":["A. 係指膝蓋骨自滑車溝脫落異位","B. 檢查時可發現drawer motion","C. 屬於elective surgery之疾病","D. small- & toy-breed為好發族群"],"ans":1,"exp":"Drawer motion（抽屜試驗）是用於診斷前十字韌帶斷裂（cranial cruciate ligament rupture）的特異性檢查，不是膝蓋骨脫臼的診斷方法。膝蓋骨脫臼是透過觸診膝蓋骨位置和X光診斷。","we":["A. 膝蓋骨自滑車溝脫落異位是medial patellar luxation的正確定義。","","C. 膝蓋骨脫臼屬於elective surgery（選擇性手術）是正確的（不是急診）。","D. Small- & toy-breed為好發族群是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_066","year":2019,"roc_year":108,"session":"","examNo":66,"q":"犬硬膜外（epidural）麻醉通常不用於下列何項手術的止痛？","opts":["A. 剖腹產","B. 頸椎手術","C. 後肢截肢","D. 骨盆骨折"],"ans":1,"exp":"犬腰薦部硬膜外麻醉注射於腰薦椎間隙，藥物向尾側和頭側擴散，可麻醉後肢、骨盆、尾部、腹部，但無法到達頸部。頸椎手術需要頸部/前肢麻醉，腰薦硬膜外麻醉無法達到此區域。","we":["A. 剖腹產手術位於後腹部，腰薦硬膜外麻醉可以覆蓋此區域。","","C. 後肢截肢在腰薦硬膜外麻醉可覆蓋的範圍內。","D. 骨盆骨折在腰薦硬膜外麻醉可覆蓋的範圍內。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_067","year":2019,"roc_year":108,"session":"","examNo":67,"q":"有關滑液關節（synovial joint）中的關節軟骨（articular cartilage），下列敘述何項錯誤？","opts":["A. 關節軟骨組成之90%為軟骨細胞","B. 關節軟骨沒有血管組織","C. 關節軟骨沒有神經組織","D. 關節軟骨70%之重量為液體"],"ans":0,"exp":"關節軟骨（articular cartilage）的組成中，軟骨細胞（chondrocytes）只占體積的1~5%，細胞外基質（ECM，包括膠原蛋白和蛋白多醣）才是主要成分。說「90%為軟骨細胞」是錯誤的。","we":["","B. 關節軟骨沒有血管（avascular）是正確的，靠關節液擴散獲得營養。","C. 關節軟骨沒有神經（aneural）是正確的。","D. 關節軟骨70%重量為水分（liquid）是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_068","year":2019,"roc_year":108,"session":"","examNo":68,"q":"對於該牛隻之最適當處置為何？","opts":["A. 肌肉注射PGF2α，並於子宮內投予抗生素","B. 肌肉注射GnRH，並於7天後注射PGF2α","C. 肌肉注射GnRH與維生素ADE","D. 放置不必處置"],"ans":1,"exp":"對於濾泡囊腫牛隻，最適當的處置是肌肉注射GnRH（引起黃體素化/排卵），並於7天後注射PGF2α（消退新形成的黃體）。此為Ovsynch前身，GnRH+PGF2α是治療濾泡囊腫的標準方案。需確認病例圖示。","we":["A. PGF2α+子宮內抗生素用於子宮炎，不是卵巢囊腫的治療。","","C. GnRH+VitADE缺乏PGF2α的黃體消退步驟，不完整。","D. 放置不必處置可能使囊腫持續，影響繁殖效率。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_069","year":2019,"roc_year":108,"session":"","examNo":69,"q":"承上題，該牛隻最可能之診斷為何？","opts":["A. 濾泡囊腫","B. 卵巢囊腫","C. 子宮蓄膿","D. 懷孕"],"ans":0,"exp":"根據Q68的治療（GnRH+PGF2α），此牛隻最可能是濾泡囊腫（follicular cyst），因為GnRH用於誘導濾泡囊腫黃體化，後接PGF2α消退黃體，是濾泡囊腫的標準治療。需確認圖示/病例描述。","we":["","B. 「卵巢囊腫」（ovarian cyst）是廣義術語，較不具體。","C. 子宮蓄膿的治療是卵巢素+抗生素，不是GnRH+PGF2α。","D. 懷孕不需要GnRH+PGF2α治療（反而可能引起流產）。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_070","year":2019,"roc_year":108,"session":"","examNo":70,"q":"其皮膚病變為那種疾病之最典型病變？","opts":["A. 庫欣氏症（Cushing disease）","B. 低甲狀腺功能症（hypothyroidism）","C. 性內泌素不平衡（sex hormone imbalance）","D. 脫毛X（alopecia X）"],"ans":0,"exp":"根據Q71的答案（UCCR是Cushing's的篩檢），此題皮膚病變最可能是庫欣氏症（Cushing's disease/hyperadrenocorticism）的典型皮膚病變：雙側對稱性脫毛、皮膚萎縮、腹部膨大、色素沉著。需確認圖示。","we":["","B. 低甲狀腺功能症：雙側對稱脫毛、皮膚乾燥，篩檢用baseline T4。","C. 性內泌素不平衡：篩檢用baseline estrogen，皮膚病變較不典型。","D. 脫毛X（alopecia X）：主要在體幹脫毛，篩檢無特異性方法。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_071","year":2019,"roc_year":108,"session":"","examNo":71,"q":"承上題，當看到此病變時，最適合用來作screening test的檢驗方法為何？","opts":["A. urine cortisol creatinine ratio（UCCR）","B. baseline estrogen","C. baseline T4","D. ACTH stimulation test"],"ans":0,"exp":"庫欣氏症（hyperadrenocorticism/Cushing's disease）的最佳篩檢方法是尿液皮質醇/肌酸酐比值（UCCR, urine cortisol:creatinine ratio），靈敏度高，是非住院的初步篩檢工具。需確認上題答案。","we":["","B. Baseline estrogen用於性內泌素不平衡的評估。","C. Baseline T4用於甲狀腺功能評估。","D. ACTH stimulation test是確診Cushing's（尤其是醫源性）的confirmatory test，不是篩檢。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_072","year":2019,"roc_year":108,"session":"","examNo":72,"q":"根據此血糖曲線顯示，目前給予嘟嘟胰島素的問題為何？","opts":["A. 劑量過高","B. 劑量不足","C. 胰島素抗性過高","D. 劑型維持時間過短"],"ans":0,"exp":"此題需參考血糖曲線圖才能確認答案。若血糖曲線顯示Nadir（最低點）過低或出現低血糖，表示胰島素劑量過高（overdose）。需確認圖示。","we":["","B. 劑量不足時血糖曲線的Nadir不會很低，整體血糖偏高。","C. 胰島素抗性過高時血糖下降幅度小。","D. 劑型維持時間過短時血糖控制時間短暫後回升。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_073","year":2019,"roc_year":108,"session":"","examNo":73,"q":"承上題，此血糖曲線顯示，目前給予阿虎胰島素的問題為何？","opts":["A. 劑量給予過高","B. 劑量給予過低","C. 給予時間過早","D. 給予時間過晚"],"ans":0,"exp":"此題需參考血糖曲線圖才能確認答案。若血糖曲線顯示高峰提前出現，可能是胰島素給予時間過早。需確認圖示。","we":["","B. 劑量給予過低時血糖整體偏高，Nadir不理想。","C. 給予時間過早時血糖曲線的最低點提前，餐後後期血糖回升。","D. 給予時間過晚時峰值出現較晚。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_074","year":2019,"roc_year":108,"session":"","examNo":74,"q":"承上題，阿虎的血糖曲線跌深反彈，此種曲線稱之為","opts":["A. dawn effect","B. Somogyi response","C. down effect","D. curve response"],"ans":1,"exp":"血糖曲線「跌深反彈」（血糖大幅下降後反彈性升高）稱為Somogyi response（Somogyi phenomenon）：胰島素過量→低血糖→反調節激素（glucagon、cortisol等）分泌→反彈性高血糖。","we":["A. Dawn effect是指清晨時血糖自然升高，與胰島素劑量無關，是生理性激素分泌節律造成。","","C. Down effect不是標準醫學術語。","D. Curve response不是標準醫學術語。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_075","year":2019,"roc_year":108,"session":"","examNo":75,"q":"側照中箭號所標示軟組織\r 不透明度結構最可能為何者？","opts":["A. 胸腔外組織之重疊影像","B. 肺臟團塊（lung mass）","C. 腫大的胸骨淋巴結（enlarged sternal lymph node）","D. 前縱膈囊腫（cranial mediastinal cyst）"],"ans":2,"exp":"此題需參考側位X光圖，箭號所標示的軟組織不透明度結構。前縱膈的軟組織腫塊常見病因包括腫大的胸骨淋巴結。需確認圖示。","we":["A. 胸腔外組織重疊影像通常可透過不同角度攝影區分。","B. 肺臟團塊位於肺實質內，與前縱膈位置不同。","","D. 前縱膈囊腫（cranial mediastinal cyst）較少見，腫大淋巴結更常見。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_076","year":2019,"roc_year":108,"session":"","examNo":76,"q":"承上題，最有可能的診斷為何？","opts":["A. 肺炎（pneumonia）","B. 腹腔腫瘤轉移（peritoneal tumor seeding）","C. 縱膈炎（mediastinitis）","D. 甲狀腺腫瘤轉移（thyroid tumor metastasis）"],"ans":3,"exp":"承Q75，若前縱膈腫塊合併其他X光表現（如肺結節），最可能的診斷需要圖示確認。甲狀腺腫瘤（thyroid tumor）可轉移至前縱膈淋巴結，是常見的考試考點。需確認圖示。","we":["A. 肺炎通常在肺實質，不引起前縱膈腫塊。","B. 腹腔腫瘤轉移不轉移至前縱膈。","C. 縱膈炎通常瀰漫性，不是單一腫塊。",""],"needs_review":true,"imgs":[]},{"id":"AMO_2019_1_普通病_077","year":2019,"roc_year":108,"session":"","examNo":77,"q":"請問下列何種鴉片類藥物在\r 高劑量注射下會引起組織胺的釋放？","opts":["A. morphine","B. fentanyl","C. oxymorphone","D. alfentanil"],"ans":0,"exp":"Morphine在高劑量靜脈注射時可引起組織胺（histamine）釋放，導致血管擴張、血壓下降、蕁麻疹等副作用。Fentanyl、oxymorphone、alfentanil引起組織胺釋放的風險遠低於morphine。","we":["","B. Fentanyl極少引起組織胺釋放，是心血管手術的首選鴉片類藥物。","C. Oxymorphone引起組織胺釋放的風險低。","D. Alfentanil引起組織胺釋放的風險低。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_078","year":2019,"roc_year":108,"session":"","examNo":78,"q":"承上題，下列何種藥物不適用於該犬的麻醉誘導？","opts":["A. alfaxalone","B. etomidate","C. propofol","D. ketamine-diazepam"],"ans":3,"exp":"對於心臟病（如擴張性心肌病DCM）患犬，ketamine-diazepam不適合麻醉誘導，因為ketamine增加交感神經張力，升高心率和血壓，增加心肌氧耗，對心臟儲備功能差的患犬有害。","we":["A. Alfaxalone對心血管的影響較溫和，可用於心臟病患犬。","B. Etomidate對心血管抑制最小，是心臟病患犬的首選誘導藥物。","C. Propofol對心血管有抑制（降血壓），但低劑量可謹慎使用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_079","year":2019,"roc_year":108,"session":"","examNo":79,"q":"承上題，病犬靜脈注射導入麻醉並進行氣管插管；以isoflurane維持麻醉並供予純氧，接上生理監視器監控各 項生理數值，發現SPO2的描述圖如下，請問下列何種因素不會影響SPO 2 的數值？","opts":["A. 探頭夾在⾊素沉著的黏膜上","B. 注射dexmedetomidine","C. 貧血（PCV值 20~30%之間）","D. 施打高劑量dopamine"],"ans":2,"exp":"貧血（PCV 20~30%）本身不影響SPO2（pulse oximetry）的讀值，因為pulse oximetry測量的是現有血紅素的氧飽和度百分比，而非氧攜帶量。貧血時SPO2可能仍正常，但組織實際攜氧量不足。","we":["A. 色素沉著黏膜會吸收部分光線，影響pulse oximetry讀值。","B. Dexmedetomidine引起周邊血管收縮，減少末梢搏動性血流，影響讀值準確性。","","D. 高劑量dopamine引起血管收縮，可能影響末梢搏動，影響讀值。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_1_普通病_080","year":2019,"roc_year":108,"session":"","examNo":80,"q":"承上題，病犬以背側躺固定，將術區剃毛並以正常外科程序刷洗術區，覆上洞巾並以洞巾夾固定，由劍狀軟\r 骨向後方沿腹正中線切開後，病犬呈現低血氧，若排除各項機器干擾因子，則下列何種方式可有效恢復血氧\r 濃度？","opts":["A. 提高新鮮氣體流量","B. 使用吐氣末正壓通氣之呼吸模式","C. 使用non-rebreathing system","D. 添加笑氣"],"ans":1,"exp":"手術中低血氧（術中仰躺位置→功能殘氣量下降→肺泡萎陷→通氣血流比失配），最有效的處理是使用吐氣末正壓通氣（PEEP）：維持肺泡在呼氣末不塌陷，增加功能殘氣量，改善氧合。","we":["A. 提高新鮮氣體流量在已使用純氧的情況下不能進一步提高FiO2。","","C. Non-rebreathing system不直接解決肺泡萎陷問題。","D. 笑氣（N2O）會稀釋氧氣，降低FiO2，反而加重低血氧。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_001","year":2019,"roc_year":108,"session":"","examNo":1,"q":"引起馬匹運動表現不良的疾病中，下列何者影響最小？","opts":["A. dorsal displacement of the soft palate","B. mitral regurgitation","C. second-degree atrioventricular block","D. anhidrosis"],"ans":2,"exp":"馬在靜息狀態下，迷走神經張力高，可出現二度房室傳導阻滯（Second-degree AV block），此為正常生理現象，不代表心臟疾病。","we":["A. 一度房室傳導阻滯在馬靜息時亦可見，但不如二度AV block典型。","B. 心室早期收縮（VPC）不是馬靜息時的生理現象。","","D. 心房顫動在馬是病理性心律不整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_002","year":2019,"roc_year":108,"session":"","examNo":2,"q":"關於馬的餵飼方式，下列敘述何項最正確？","opts":["A. 常常更換飼料配方以提供較完整的養分","B. 理想的精粗料比為1：1","C. 少量多餐","D. 下痢的馬匹應儘快給與大量穀麥精料以補充能量"],"ans":2,"exp":"食道阻塞（choke）的處理包含少量多餐、軟質食物，讓阻塞物自然溶解或隨時間軟化後通過。","we":["A. 完全禁食可能導致電解質失衡。","B. 大量飲水可能導致嗆咳或吸入性肺炎。","","D. 立即手術是最後手段。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_003","year":2019,"roc_year":108,"session":"","examNo":3,"q":"處理馬匹廣範圍燒燙傷的方法中，下列何項最不實際？","opts":["A. 澆水冷卻","B. 口服止痛藥","C. 注射鎮靜劑","D. 塗抹局部麻醉藥物"],"ans":3,"exp":"大面積燒傷的疼痛控制，局部外用麻醉藥不實際，因面積廣泛、皮膚屏障已受損，吸收量不可預測且效果有限。","we":["A. 靜脈注射鴉片類藥物是廣泛燒傷疼痛控制的主要方式。","B. 全身性NSAIDs可輔助疼痛控制。","C. 區域神經阻滯在可行部位可使用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_004","year":2019,"roc_year":108,"session":"","examNo":4,"q":"役馬的掌趾神經切除術，在術後常併發下列那一種情形？","opts":["A. 神經瘤","B. 肌腱炎","C. 血液循環不良","D. 無法行動"],"ans":0,"exp":"神經瘤（neuroma）是神經切除術（neurectomy）後最常見的併發症，因切斷的神經末端異常增生形成痛性腫塊。","we":["","B. 感染是手術一般風險，非神經切除術特有的主要併發症。","C. 出血是手術中的問題，術後慢性併發症以神經瘤為主。","D. 肌腱斷裂不是神經切除術的主要併發症。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_005","year":2019,"roc_year":108,"session":"","examNo":5,"q":"下列何種開創方式（surgical approach），不適用於馬耳咽管憩室（guttural pouch）手術？","opts":["A. Viborg's triangle approach","B. soft plate approach","C. Whitehouse approach","D. modified Whitehouse approach"],"ans":1,"exp":"軟顎入路（soft palate approach）不用於鼓泡囊（guttural pouch）手術。鼓泡囊入路包括：Viborg's triangle入路、改良Whitehouse法、內視鏡。","we":["A. Viborg's triangle入路是傳統鼓泡囊手術入路。","","C. 改良Whitehouse法是另一種鼓泡囊手術入路。","D. 內視鏡入路廣泛用於鼓泡囊檢查與治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_006","year":2019,"roc_year":108,"session":"","examNo":6,"q":"下列何者不是牛隻洋蔥中毒的主徵？","opts":["A. 貧血","B. 黃疸","C. 血栓","D. 血紅素尿"],"ans":2,"exp":"洋蔥中毒（onion toxicosis）症狀包括海因茲小體性貧血、血紅素尿、黃疸、虛弱，血栓不是洋蔥中毒的典型症狀。","we":["A. 海因茲小體貧血是洋蔥中毒的特徵性病變。","B. 血紅素尿因紅血球破壞而出現。","","D. 黃疸因溶血和肝功能損傷而出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_007","year":2019,"roc_year":108,"session":"","examNo":7,"q":"下列何種症狀最不常見於牛隻乳熱型酮病？","opts":["A. 酮尿","B. 頭彎於一側，成伏臥狀","C. 迴旋運動","D. 意識障礙"],"ans":2,"exp":"迴旋運動（circling）通常與神經症狀有關，不是牛酮症（乳熱型）的典型表現。牛酮症的神經型症狀為興奮、過度舔舐、感覺過敏。","we":["A. 食慾不振是酮症常見症狀。","B. 產乳量下降是酮症直接表現。","","D. 便秘在牛酮症中可見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_008","year":2019,"roc_year":108,"session":"","examNo":8,"q":"牛隻腎盂腎炎主要由下列何種細菌引起？","opts":["A. Staphylococcus aureus","B. Mycoplasma bovis","C. Corynebacterium renale","D. Streptococcus agalactiae"],"ans":2,"exp":"牛腎盂腎炎（bovine pyelonephritis）最常見的致病菌是Corynebacterium renale，透過上行感染導致腎盂發炎。","we":["A. E. coli在犬貓尿路感染常見，但不是牛腎盂腎炎的主要病原。","B. Staphylococcus spp.不是牛腎盂腎炎的主要病原。","","D. Streptococcus spp.不是牛腎盂腎炎的主要病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_009","year":2019,"roc_year":108,"session":"","examNo":9,"q":"牛隻心臟衰竭會出現下列何種狀況？","opts":["A. 心臟收縮力增強，心輸出量減少","B. 心臟收縮力增強，心輸出量增加","C. 心臟收縮力減弱，心輸出量減少","D. 心臟收縮力減弱，心輸出量增加"],"ans":2,"exp":"充血性心臟衰竭時，心臟收縮力減弱導致心輸出量下降，進而引起組織灌流不足。","we":["A. 血管阻力增加是代償機制，不是心衰竭的直接原因。","B. 前負荷增加是心衰竭的代償，但描述不如C完整。","","D. 後負荷降低在心衰竭中不典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_010","year":2019,"roc_year":108,"session":"","examNo":10,"q":"下列何種牛隻疾病在二尖瓣和大動脈瓣處有心雜音？","opts":["A. 左側心臟衰竭","B. 右側心臟衰竭","C. 肺氣腫","D. 心囊炎"],"ans":0,"exp":"左側心臟衰竭可聽到二尖瓣逆流和主動脈瓣的雜音，因為這些是左心相關的瓣膜。","we":["","B. 三尖瓣屬於右心，左側心衰竭不主要影響三尖瓣。","C. 肺動脈瓣屬於右心。","D. 右心衰竭才會影響三尖瓣和肺動脈瓣。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_011","year":2019,"roc_year":108,"session":"","examNo":11,"q":"下圖中（由尾部向頭部觀），乳牛第四胃內充滿了麵團樣粗纖維，其最正確的診斷為何？","opts":["A. 第四胃右側異位","B. 原發性第四胃食滯","C. 第四胃潰瘍","D. 迷走神經性消化不良"],"ans":1,"exp":"原發性第四胃食滯（primary abomasal impaction）在肉牛較常見，尤其是乾草飼養的牛，與高纖維低品質飼料有關。需確認圖示內容。","we":["A. 第一胃食滯多見於過食精飼料。","","C. 第三胃食滯也可見，但原發性不如第四胃典型。","D. 小腸阻塞表現不同。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_012","year":2019,"roc_year":108,"session":"","examNo":12,"q":"藻類（Prototheca spp.）感染導致乳牛乳房炎的致病風險因子中，下列何者最有可能？","opts":["A. 日糧精粗料比失當","B. 乳牛分娩後免疫力低下，容易感染病原","C. 環境潮濕，導致藻類容易滋生","D. 乳房炎軟膏灌注前，乳頭開口之清潔不良"],"ans":2,"exp":"Prototheca（原藻）感染性乳房炎與潮濕環境密切相關，Prototheca是藻類，喜好潮濕環境，通過汙染的水源感染。","we":["A. Staphylococcus aureus乳房炎與環境潮濕關係不直接。","B. Streptococcus agalactiae主要透過擠乳傳播。","","D. Mycoplasma乳房炎主要透過接觸傳染。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_013","year":2019,"roc_year":108,"session":"","examNo":13,"q":"關於酵母菌（yeast）感染導致乳牛乳房炎的敘述，下列何者錯誤？","opts":["A. 酵母菌污染完全混合日糧（total mixed rations）可導致牧場爆發酵母菌性乳房炎","B. 乳房炎軟膏注入器受污染，常常導致酵母菌性乳房炎發生","C. 將乳頭開口消毒乾淨再行灌注軟膏，可以預防酵母菌性乳房炎發生","D. 感染Candida spp.的乳房炎，建議以抗黴菌乳房炎軟膏治療2~4週"],"ans":3,"exp":"Candida乳房炎（真菌性乳房炎）通常在長期抗生素治療後繼發，預後差，一般不建議使用抗黴菌藥物治療2-4週，而是考慮乾乳或淘汰患牛。","we":["A. 停用抗生素是正確的初步處理。","B. 支持療法是重要的輔助措施。","C. 監控患牛乳汁排放是管理措施。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_014","year":2019,"roc_year":108,"session":"","examNo":14,"q":"乳牛臨床檢查呈現眼眶塌陷、心跳速率超過100 bpm，雙側腹部外圍明顯擴大，叩診右側胸壁至肋骨後緣有高\r   調金屬音，猛搖右側肋骨後腹壁可聽見水晃動聲音。此病例最正確的診斷為何？","opts":["A. 腹膜炎與腹水蓄積","B. 迷走神經性消化不良","C. 第四胃右側異位","D. 盲腸捻轉與擴張"],"ans":3,"exp":"牛盲腸捻轉（cecal volvulus）是大腸異位的一種，臨床表現為右側腹部膨脹、疼痛、腸音異常，觸診可感覺到捻轉的盲腸。","we":["A. 第四胃左方移位表現為左側ping音。","B. 第四胃右方移位表現為右側ping音，但位置較前。","C. 迴腸嵌頓表現為完全腸阻塞症狀。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_015","year":2019,"roc_year":108,"session":"","examNo":15,"q":"下列何者不是母牛分娩後發生酮症之主要血液變化？","opts":["A. 酮體濃度上升","B. 游離脂肪酸濃度上升","C. 乳酸濃度上升","D. 非脂化脂肪酸濃度上升"],"ans":2,"exp":"牛乳酸中毒（lactic acidosis，過食穀物）的血液變化包括代謝性酸血症、血糖升高，而非酮症；酮症是另一種代謝病，血液中酮體升高。","we":["A. 代謝性酸中毒是乳酸中毒的特徵。","B. 血糖升高在急性穀物中毒初期可見。","","D. 脫水在嚴重乳酸中毒時出現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_016","year":2019,"roc_year":108,"session":"","examNo":16,"q":"牛發生第四胃食滯時，易發生下列何種症狀？","opts":["A. 代謝性酸中毒","B. 呼吸性酸中毒","C. 代謝性鹼中毒","D. 呼吸性鹼中毒"],"ans":2,"exp":"牛第四胃右方移位伴扭轉或幽門阻塞時，胃液（富含HCl和KCl）無法進入十二指腸，導致代謝性鹼中毒、低氯血症、低鉀血症。","we":["A. 代謝性酸中毒見於乳酸中毒或腹瀉。","B. 呼吸性鹼中毒與胃腸道疾病無關。","","D. 呼吸性酸中毒與通氣障礙有關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_017","year":2019,"roc_year":108,"session":"","examNo":17,"q":"下列何種疾病最容易引起牛光敏症（photosensitization）？","opts":["A. 先天性紫質病（congenital porphyria）","B. 尿石症（urolithiasis）","C. 澱粉樣病（amyloidosis）","D. 血紅素尿性腎病（hemoglobinuric nephrosis）"],"ans":0,"exp":"先天性卟啉症（congenital porphyria）導致光敏症（photosensitivity），因卟啉在皮膚蓄積，經光照後產生光動力反應，引起皮膚炎症。","we":["","B. 先天性卟啉症的主要表現不是黃疸而是光敏症。","C. 神經症狀不是牛先天性卟啉症的主要表現。","D. 腎衰竭不是先天性卟啉症的主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_018","year":2019,"roc_year":108,"session":"","examNo":18,"q":"下列何者不是牛急性臌脹之主要原因？","opts":["A. 過食苜蓿","B. 過食腐敗甘藷","C. 過食尿素","D. 過食醱酵之啤酒粕"],"ans":2,"exp":"牛過食尿素的主要問題是氨中毒（ammonia toxicity），在瘤胃中尿素快速水解為氨，被吸收後導致高氨血症，臨床表現為神經症狀、肌肉震顫、死亡，而非臌脹（bloat）。","we":["A. 氨中毒確實是尿素過食的主要危害。","B. 神經症狀（興奮、抽搐）是高氨血症的表現。","","D. 急性死亡在嚴重尿素中毒時發生。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_019","year":2019,"roc_year":108,"session":"","examNo":19,"q":"下列何項不是牛亞硝酸鹽中毒之症狀？","opts":["A. 黏膜發紺","B. 呼吸困難","C. 頸靜脈怒張","D. 血液凝固不全呈鮮紅色"],"ans":3,"exp":"亞硝酸鹽中毒時，亞硝酸鹽將血紅素中的Fe²⁺氧化為Fe³⁺，形成變性血紅素（methemoglobin），血液呈巧克力棕色，而非鮮紅色。","we":["A. 亞硝酸鹽抑制氧氣運輸確實正確。","B. 草場管理不善（高硝酸鹽植物）是主要原因之一。","C. 治療確實使用亞甲藍（methylene blue）。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_020","year":2019,"roc_year":108,"session":"","examNo":20,"q":"預防牛隻創傷性心囊炎（traumatic pericarditis）之處置方式，下列何者正確？","opts":["A. 對10~12個月齡以上之牛隻，經口放入強力磁鐵","B. 於每次懷孕檢查時，檢查磁鐵是否仍在瘤胃內","C. 懷孕期間忌經口投與磁鐵","D. 創傷性心囊炎是無法預防的"],"ans":0,"exp":"預防性放置瘤胃磁鐵建議在10-12月齡以上的牛實施，此時瘤胃發育完整，磁鐵能有效吸附金屬異物，預防創傷性網胃腹膜炎。","we":["","B. 過早放置（幼犢）因瘤胃未發育完全，效果不佳。","C. 12-18月齡也可，但10-12月齡已是建議時機。","D. 18月齡以上再放置可能為時已晚。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_021","year":2019,"roc_year":108,"session":"","examNo":21,"q":"牛隻腹脇部開腹手術施行後，其腹壁一般會縫合幾層？","opts":["A. 3","B. 4","C. 5","D. 6"],"ans":1,"exp":"牛腹壁手術切開共有4層：皮膚、皮下組織/脂肪、肌肉層（外斜肌、內斜肌、橫肌）、腹膜（一般考試採腹壁4層說）。","we":["A. 3層不足以涵蓋所有層次。","","C. 5層過多。","D. 6層過多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_022","year":2019,"roc_year":108,"session":"","examNo":22,"q":"下列何者不是以blind tack-toggle pin方式治療牛第四胃異位之後的併發症？","opts":["A. 腹膜炎","B. 第四胃瘻管","C. 第四胃阻塞","D. 十二指腸潰瘍"],"ans":3,"exp":"Toggle-pin縫合法（用於治療創傷性網胃腹膜炎）的主要併發症包括瘺管形成、感染、pin移位，十二指腸潰瘍不是其主要併發症。","we":["A. 瘺管形成是toggle-pin的已知併發症。","B. Pin移位是手術失敗的原因之一。","C. 感染是任何手術的潛在風險。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_023","year":2019,"roc_year":108,"session":"","examNo":23,"q":"施行右脇腹壁大網膜固定術治療牛第四胃異位時，為了避免病牛因低血鈣或虛弱而倒臥，導致術區污染，病\r   牛頭部之保定方式以何者最為正確？","opts":["A. 病牛頭部應稍向上、向右保定","B. 病牛頭部應稍向上、向左保定","C. 病牛頭部應稍向下、向右保定","D. 病牛頭部應稍向下、向左保定"],"ans":3,"exp":"馬在站立時，頭稍向下、向左側旋轉，有助於胃管插入食道；這個姿勢使食道開口更容易通過，減少意外插入氣管的可能。","we":["A. 頭完全抬高不利於胃管插入。","B. 向右旋轉不如向左旋轉利於插管。","C. 頭水平中立位不是最佳姿勢。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_024","year":2019,"roc_year":108,"session":"","examNo":24,"q":"牛隻在去角時，麻醉的角神經屬於下列那一條神經的分支？","opts":["A. 滑車神經","B. 三叉神經","C. 外旋神經","D. 顏面神經"],"ans":1,"exp":"馬頭部感覺主要由三叉神經（trigeminal nerve, CN V）支配，包括面部皮膚、鼻腔黏膜、口腔黏膜、角膜等感覺。","we":["A. 顏面神經（CN VII）主要控制表情肌運動。","","C. 舌咽神經（CN IX）主要支配咽部感覺和舌後1/3味覺。","D. 迷走神經（CN X）支配內臟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_025","year":2019,"roc_year":108,"session":"","examNo":25,"q":"初生小牛臍帶組織中何者最容易發生感染？","opts":["A. 臍動脈","B. 臍靜脈","C. 臍尿管","D. 臍淋巴管"],"ans":1,"exp":"臍靜脈（umbilical vein）在臍帶結構中負責將含氧血液從胎盤輸送到胎兒肝臟。","we":["A. 臍動脈（umbilical arteries，共2條）將去氧血液從胎兒輸送到胎盤。","","C. 臍尿管（urachus）是膀胱到臍帶的通道。","D. 臍帶有2條動脈、1條靜脈。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_026","year":2019,"roc_year":108,"session":"","examNo":26,"q":"有關Cushing suture之敘述，下列何者錯誤？","opts":["A. 此縫合法之縫針進出針方向與切創緣垂直","B. 此法適用於子宮傷口縫合","C. 此法適用於瘤胃傷口縫合","D. 此法之主要缺點為較易造成縫合處血液循環受阻"],"ans":0,"exp":"Cushing縫合（腸道縫合法）的縫合針方向應與腸管長軸平行（parallel），若描述為垂直則是錯誤的敘述。","we":["","B. Cushing縫合確實是連續縫合。","C. Cushing縫合確實是漿肌層縫合（seromuscular）。","D. Cushing縫合確實常用於腸道吻合的第二層。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_027","year":2019,"roc_year":108,"session":"","examNo":27,"q":"下列何種乳牛眼部手術方法，最適合治療乳牛廣泛性眼結膜鱗狀細胞癌？","opts":["A. 單純腫瘤組織刮除術","B. 眼球摘除術（enucleation）","C. 剜眼術（evisceration）","D. 眼眶剜除術（exenteration）"],"ans":3,"exp":"眼球及眼眶內容物完全摘除（包括眼球、眼外肌、脂肪等）稱為眼眶剜除術（exenteration），而單純眼球摘除稱為enucleation。","we":["A. Enucleation只摘除眼球本體。","B. Evisceration是移除眼球內容物但保留鞏膜。","C. Enucleation without evisceration是保留鞏膜的摘除法。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_028","year":2019,"roc_year":108,"session":"","examNo":28,"q":"刺激性物質造成家畜皮膚上皮細胞發炎且有潮濕的現象，應稱之為","opts":["A. 膿泡病（impetigo）","B. 糠疹（pityriasis）","C. 濕疹（eczema）","D. 角化不全（parakeratosis）"],"ans":2,"exp":"濕疹（eczema）是非感染性皮膚炎症反應，以皮膚濕潤、滲出液為特徵，與感染性皮膚病鑑別。","we":["A. 癬（ringworm）是皮膚黴菌感染。","B. 疥癬（mange）是蟎蟲感染。","","D. 跳蚤皮膚炎有跳蚤接觸史。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_029","year":2019,"roc_year":108,"session":"","examNo":29,"q":"下列那一種動物罹患消化道疾病時最容易引起嘔吐？","opts":["A. 馬","B. 牛","C. 羊","D. 豬"],"ans":3,"exp":"Encephalitozoon cuniculi主要感染兔子，導致肉芽腫性腦炎、後肢癱瘓、白內障、腎臟病變。豬不是其主要宿主動物。","we":["A. 兔子是E. cuniculi的主要宿主。","B. 犬可作為E. cuniculi的宿主。","C. 免疫抑制人可感染E. cuniculi。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_030","year":2019,"roc_year":108,"session":"","examNo":30,"q":"有關山羊寄生蟲感染之敘述，下列何者最正確？","opts":["A. Haemonchus contortus為山羊最主要之小腸寄生蟲","B. 錐蟲病（trypanosomiasis）會使病羊體溫上升、黃疸、貧血和血紅素尿","C. 剖檢見小腸漿膜層廣泛性散布米粒樣大小之白色斑點，黏膜面有小黃白色結節突出物，應懷疑是羊鈎蟲感染","D. 指狀絲狀蟲（Setaria digitata）感染可引起羊隻突發性後軀運動障礙"],"ans":3,"exp":"Setaria digitata（絲狀蟲）的幼蟲在牛或馬體內移行時可到達脊髓，引起後軀障礙（posterior ataxia）或癱瘓，稱為腦脊髓絲蟲病。","we":["A. 皮膚病變不是Setaria digitata的主要表現。","B. 眼睛病變是Setaria在眼前房的表現，但後軀障礙更典型。","C. 肝臟病變不是Setaria的主要表現。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_031","year":2019,"roc_year":108,"session":"","examNo":31,"q":"豬的腸捻轉最常發生在下列何處？","opts":["A. 空腸","B. 迴腸","C. 盲腸","D. 結腸"],"ans":0,"exp":"空腸（jejunum）血液供應較豐富但腸道蠕動恢復最慢，術後容易出現腸麻痺或吻合口問題，是腸道手術後需特別監控的部位。","we":["","B. 迴腸相對較少出現術後問題。","C. 結腸手術後問題也常見，但空腸更脆弱。","D. 直腸手術後可能有便祕或吻合口問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_032","year":2019,"roc_year":108,"session":"","examNo":32,"q":"有關雄畜性內泌素的敘述，下列何者正確？","opts":["A. 性腺素釋放激素（GnRH）作用於腦垂體後葉，促使其分泌濾泡刺激素（FSH）和黃體生成素（LH）","B. 濾泡刺激素（FSH）主要作用於Sertoli cell，黃體生成素（LH）主要作用於Leydig cell","C. Sertoli cell會分泌雄性素及抑制素","D. Leydig cell會分泌動情素"],"ans":1,"exp":"FSH（促濾泡素）作用於睪丸Sertoli細胞，促進精子生成；LH（黃體素）作用於Leydig細胞，促進睪酮分泌。","we":["A. FSH→Leydig, LH→Sertoli的說法相反。","","C. FSH和LH作用目標描述錯誤。","D. 描述錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_033","year":2019,"roc_year":108,"session":"","examNo":33,"q":"公犬精液中的精漿主要是由下列何者產生？","opts":["A. 尿道球腺（bulbourethral gland）","B. 儲精囊腺（vesicular gland）","C. 前列腺（prostate）","D. 輸精管壺腹（ampulla）"],"ans":2,"exp":"公犬良性前列腺增生（BPH）在未去勢老齡犬中最常見，雄激素依賴性增生。","we":["A. 睪丸腫瘤是另一種常見問題。","B. 尿道球腺不是犬常見問題部位。","","D. 肛門腺疾病是另一種問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_034","year":2019,"roc_year":108,"session":"","examNo":34,"q":"分娩過程中，犬貓母畜若陰道出現含胎糞的分泌物，通常是因胎兒受到緊迫所致。此胎糞的顏色為何？","opts":["A. 淡黃色","B. 紅棕色","C. 墨綠色","D. 鮮紅色"],"ans":2,"exp":"牛胎水（allantoic fluid）正常顏色為墨綠色（dark green/brownish），含有尿素等代謝廢物，與羊水（amniotic fluid）的清澈透明不同。","we":["A. 清澈透明是羊水的顏色。","B. 黃色不是正常胎水顏色。","","D. 紅色表示出血，非正常。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_035","year":2019,"roc_year":108,"session":"","examNo":35,"q":"以絨毛在絨毛膜分布的樣式分類，犬主要歸類於下列那一種胎盤？","opts":["A. 瀰漫性（diffuse）","B. 帶狀（zonary）","C. 子葉狀（cotyledonary）","D. 盤狀（discoidal）"],"ans":1,"exp":"犬的胎盤類型為帶狀（zonary）胎盤，呈環狀圍繞胎兒，是食肉目動物（包括貓）的胎盤特徵。","we":["A. 葉狀（cotyledonary）胎盤是反芻動物的特徵。","","C. 散漫型（diffuse）胎盤見於馬和豬。","D. 盤狀（discoid）胎盤見於囓齒動物和靈長類。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_036","year":2019,"roc_year":108,"session":"","examNo":36,"q":"牛隻染色體異常疾病中的染色體易位（translocation）最常發生在那兩對染色體？","opts":["A. 1/29","B. 7/21","C. 1/4","D. 10/15"],"ans":0,"exp":"牛最常見的染色體異常不孕症是1/29染色體易位（Robertsonian translocation between chromosomes 1 and 29），導致母牛繁殖率下降。","we":["","B. 60,XX/60,XY嵌合體是另一種異常。","C. 其他染色體易位不如1/29常見。","D. 性染色體異常在牛中較少見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_037","year":2019,"roc_year":108,"session":"","examNo":37,"q":"當牛隻產後發生子宮脫垂時，下列何種處置對子宮脫垂的治療最沒有幫助？","opts":["A. 使牛隻側躺","B. 將牛隻兩後腳向後拉，使呈趴坐姿","C. 進行尾根硬膜外麻醉","D. 以機具將牛隻後軀吊起"],"ans":0,"exp":"使牛側躺的方法中，直接推倒（無繩索保護）最不安全也最無幫助，可能傷及動物和操作人員。","we":["","B. 繩索保定法是有效的保定方式。","C. 鎮靜劑輔助是有效的方法。","D. 扭轉頸部法也是方法之一。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_038","year":2019,"roc_year":108,"session":"","examNo":38,"q":"某牧場牛隻已過預產期3週未見分娩，以直腸觸診子宮內無胎水，可摸到胎兒其觸感堅實，母體外陰部未見分\r   泌物，下列何者為最可能的診斷？","opts":["A. 水腫胎","B. 木乃伊胎","C. 假懷孕","D. 反轉體裂胎"],"ans":1,"exp":"木乃伊胎（mummified fetus）是胎兒在子宮內死亡後，胎水被吸收，胎兒組織脫水乾燥，形成乾燥革質結構，超音波可見強回音的緻密結構。","we":["A. 正常胎兒超音波可見正常液體和活動。","","C. 水腫胎兒超音波可見異常液體積聚。","D. 胎盤炎超音波可見胎盤增厚。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_039","year":2019,"roc_year":108,"session":"","examNo":39,"q":"用X光放射線進行母犬妊娠診斷時，最早在排卵後第幾天之間可看到胎兒的骨頭？","opts":["A. 15~19","B. 25~29","C. 35~39","D. 45~49"],"ans":3,"exp":"牛的卵巢囊腫定義是在排卵後45~49天以上仍持續存在的直徑≥2.5cm的無卵泡液結構，可通過超音波確診。","we":["A. 35天以下太短，不足以確診。","B. 40天以下不足以確診。","C. 42天仍不足。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_040","year":2019,"roc_year":108,"session":"","examNo":40,"q":"仔牛結構性異常（structural malformations）最常發生在胚胎及器官形成的那一階段？","opts":["A. 受胎後10~12天","B. 受胎後15~45天","C. 分娩前35天","D. 分娩前45天"],"ans":1,"exp":"牛受胎後15~45天是胚胎滋養層形成、早期胚胎發育的關鍵期，也是早期胚胎死亡的高風險期。","we":["A. 受胎後0-15天是早期卵裂期。","","C. 受胎後45-90天胎兒器官持續發育。","D. 妊娠後期是胎兒快速生長期。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_041","year":2019,"roc_year":108,"session":"","examNo":41,"q":"動物懷孕末期以藥物提前進行誘導分娩（induction of parturition），下列何者非為誘導分娩所使用的藥物？","opts":["A. 前列腺素（PGF2α） 或其衍生物","B. 腎上腺皮質醇（corticosteroids）","C. 動情素（estrogens）","D. 生長素（growth hormone）"],"ans":3,"exp":"誘導分娩常用藥物包括前列腺素（PGF2α）、糖皮質激素（corticosteroids）、雌激素等，生長素（growth hormone）不用於誘導分娩。","we":["A. 前列腺素（PGF2α）是常用的誘導分娩藥物。","B. 糖皮質激素（如dexamethasone）用於牛誘導分娩。","C. 雌激素可輔助誘導分娩，促進宮頸軟化。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_042","year":2019,"roc_year":108,"session":"","examNo":42,"q":"有關內泌素對分娩之影響，下列敘述何者正確？","opts":["A. 催產素（oxytocin）可促使子宮頸鬆弛和軟化","B. 助孕素（progesterone）可促使子宮頸鬆弛和軟化","C. 腦垂腺前葉分泌催產素以協助子宮收縮","D. 子宮收縮促使胎兒娩出可刺激陰道和子宮頸，再誘發催產素的分泌"],"ans":3,"exp":"Ferguson反射是指胎兒頭部對宮頸的機械性壓迫刺激，引起神經反射使子宮收縮增強，是分娩過程中的正反饋機制。","we":["A. 激乳素（prolactin）分泌與分娩時吮乳刺激有關，不是Ferguson反射。","B. 黃體素（progesterone）下降是分娩啟動的原因之一，不是Ferguson反射。","C. 雌激素升高促進分娩，但不是Ferguson反射。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_043","year":2019,"roc_year":108,"session":"","examNo":43,"q":"母牛的胎盤能分泌下列那種內泌素？","opts":["A. 激乳素（lactogen）","B. 抑制素（inhibin）","C. 泌乳素釋放刺激素（prolactin releasing hormone）","D. 生長素釋放刺激素（somatotropin releasing hormone）"],"ans":0,"exp":"泌乳開始（lactogenesis）和持續泌乳主要由激乳素（prolactin）驅動，吮乳刺激下丘腦-垂體軸分泌更多激乳素，維持泌乳。","we":["","B. 黃體素在妊娠期間高，會抑制泌乳；分娩後下降才允許泌乳。","C. 生長素輔助泌乳但不是主要驅動因素。","D. 甲狀腺素影響代謝，輔助泌乳但非主要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_044","year":2019,"roc_year":108,"session":"","examNo":44,"q":"犬隻第三眼瞼腺體脫垂（或稱櫻桃眼）時，下列何種治療方法不適合？","opts":["A. 切除腺體","B. 眼眶邊緣錨定法","C. Morgan囊袋法","D. 投予局部四環素"],"ans":0,"exp":"Cherry eye（第三眼瞼腺脫出）的治療首選是腺體復位手術（pocket technique），而非切除腺體，因為該腺體提供淚液的重要部分，切除會增加乾眼症風險。","we":["","B. Pocket technique（囊袋法）是標準治療。","C. Morgan pocket technique是常用復位法。","D. 抗炎藥物可輔助但不是根治方法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_045","year":2019,"roc_year":108,"session":"","examNo":45,"q":"furosemide是最廣泛被用在犬貓心衰竭的利尿劑，其口服後多久開始發揮藥效？","opts":["A. 10分鐘","B. 30分鐘","C. 1小時","D. 2小時"],"ans":2,"exp":"Furosemide口服給藥後，約在1小時內開始發揮利尿效果，口服吸收後在腎小管產生利尿作用。","we":["A. 15分鐘太短，口服吸收需要時間。","B. 30分鐘是靜脈注射的作用時間。","","D. 2小時偏長，通常1小時內即可見效。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_046","year":2019,"roc_year":108,"session":"","examNo":46,"q":"複選題 46.犬隻心衰竭使用藥物治療後必須持續追蹤療效，使用過多利尿劑後會產生的副作用中不包含下列何者？","opts":["A. 低血鉀","B. 低血壓","C. 氮血症","D. 代謝性酸血症."],"ans":3,"exp":"利尿劑（如furosemide）的副作用包括低鉀血症、低鈉血症、脫水、代謝性鹼中毒（因HCO3-重吸收增加），而非代謝性酸血症。","we":["A. 低鉀血症是利尿劑常見副作用。","B. 脫水是過度利尿的結果。","C. 低鈉血症可見於長期利尿劑使用。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_047","year":2019,"roc_year":108,"session":"","examNo":47,"q":"使用高劑量之β受體阻斷藥（β-blockers）時，犬貓心電圖可能出現何種變化？","opts":["A. 心室心搏過速","B. QT間隔變短（short QT interval）","C. ST分割下降（ST segment depression）","D. PR間隔延長（PR interval prolongation）"],"ans":3,"exp":"PR間期延長代表房室傳導延遲（一度房室傳導阻滯），是心電圖異常的表現，不在正常心電圖特徵之列。","we":["A. 正常P波在犬貓心電圖中可見。","B. 正常QRS波群是心室去極化的結果。","C. 正常T波代表心室再極化。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_048","year":2019,"roc_year":108,"session":"","examNo":48,"q":"有關神經系統淋巴瘤之敘述，下列何者最正確？","opts":["A. 首選治療方法為外科手術","B. 硬膜外淋巴瘤，通常可利用CHOP化療療程得到快速之緩解","C. 神經實質淋巴瘤之首選藥物為mitoxantrone","D. 神經系統之淋巴瘤之中位存活時間較多中心型淋巴瘤為長"],"ans":1,"exp":"犬淋巴瘤的CHOP化療方案對硬膜外淋巴瘤有快速緩解效果，通常在開始治療後數天內即可見到腫瘤縮小和神經症狀改善。","we":["A. 放射治療也有效但起效較慢。","","C. 單純類固醇治療緩解效果不如CHOP完整。","D. 手術切除硬膜外腫瘤風險高，CHOP化療更合適。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_049","year":2019,"roc_year":108,"session":"","examNo":49,"q":"貓口腔炎症之鑑別診斷及其治療建議，下列何者錯誤？","opts":["A. 天疱瘡－免疫抑制藥物","B. 貓漿細胞性口炎－牙科清潔","C. 嗜酸性肉芽腫口炎－類固醇","D. 牙周病－類固醇"],"ans":3,"exp":"牙周病（periodontal disease）的治療包括牙周清洗、牙石清除、抗生素治療，使用類固醇反而會抑制免疫反應、加重感染，不應使用。","we":["A. 超音波洗牙是牙周病的標準治療。","B. 抗生素用於控制牙周細菌感染。","C. 牙齦下刮治術是深部牙周治療。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_050","year":2019,"roc_year":108,"session":"","examNo":50,"q":"犬貓甲狀腺素的檢查，必須考慮以下藥物可能會影響結果，下列何者影響最小？","opts":["A. glucocorticoid","B. meloxicam","C. phenobarbital","D. sulfonamide antibiotics"],"ans":1,"exp":"Meloxicam對甲狀腺素（thyroid hormone）測定的干擾最小，相較於苯巴比妥、糖皮質激素等藥物對甲狀腺功能測定的影響較低。","we":["A. 苯巴比妥（phenobarbital）會顯著降低T4值，干擾甲狀腺功能評估。","","C. 糖皮質激素會抑制甲狀腺功能，影響T4值。","D. 磺胺類藥物可影響甲狀腺功能。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_051","year":2019,"roc_year":108,"session":"","examNo":51,"q":"貓隻發生絲球體性腎病時可以使用的藥物，不包含下列何者？","opts":["A. cyclosporine","B. 血管張力素受體阻斷劑（angiotensin receptor blockers）","C. azathioprine","D. mycophenolate"],"ans":2,"exp":"Azathioprine（硫唑嘌呤）在貓是禁忌，因為貓缺乏thiopurine methyltransferase（TPMT）酶，無法代謝azathioprine，容易導致骨髓抑制和嚴重副作用。","we":["A. Prednisolone在貓可以使用。","B. Cyclosporine在貓可以使用，是常見的免疫抑制劑。","","D. Chlorambucil在貓可用於免疫抑制治療。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_052","year":2019,"roc_year":108,"session":"","examNo":52,"q":"8歲已於幼年時去勢混種公犬，血尿及頻尿，後腹腔X光影像如下圖，下列有關本病例前列腺之敘述何者錯\r   誤？","opts":["A. 可見前列腺腫大","B. 可見前列腺內有礦物化不透明度","C. 此一異常影像常和前列腺慢性發炎有關","D. 有可能為前列腺腫瘤"],"ans":2,"exp":"去勢犬的前列腺礦化（mineralization）若出現，更常與前列腺腫瘤（adenocarcinoma）有關，而非慢性發炎。說「礦化和慢性發炎有關」是錯誤的敘述。需確認原題選項。","we":["A. 去勢後前列腺萎縮是正確的。","B. 前列腺腫瘤在去勢犬仍可發生是正確的。","","D. 其他選項待確認。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_053","year":2019,"roc_year":108,"session":"","examNo":53,"q":"3歲雄性混種犬，有急性嘔吐，飼主懷疑犬食入異物。下列何者拍攝方式最能評估是否有異物塞在胃幽門竇\r   （pyloric antrum）？","opts":["A. 左側躺照及仰躺（腹背照），left recumbent lateral & dorsal recumbent（ventrodorsal）view","B. 右側躺照及趴躺（背腹照），right recumbent lateral & ventral recumbent（dorsoventral）view","C. 右側躺照及仰躺（腹背照），right recumbent lateral & dorsal recumbent（ventrodorsal）view","D. 仰躺（腹背照）及趴躺（背腹照），dorsal（ventrodorsal）& ventral recumbent（dorsoventral）view"],"ans":0,"exp":"評估犬幽門竇（pyloric antrum）的X光姿勢：左側躺（左側臥）時幽門竇因氣體上浮而充氣，可清楚顯示；加上仰躺VD照，是評估幽門竇最佳組合。","we":["","B. 右側躺時胃體含氣，幽門竇顯示不如左側躺。","C. 站立側位不是評估幽門竇的標準姿勢。","D. 俯臥DV照不是評估幽門竇的主要姿勢。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_054","year":2019,"roc_year":108,"session":"","examNo":54,"q":"使用下列何種影像學技術最容易發現潰瘍性結腸病灶？","opts":["A. 探查性X光攝影術（survey radiography）","B. 口服鋇劑X光攝影術（oral barium radiography）","C. 結腸充氣X光攝影術（pneumocolon radiography）","D. 鋇劑灌腸造影術（barium enema radiography）"],"ans":3,"exp":"鋇劑灌腸造影（barium enema）用於評估大腸（結腸）的結構，包括腫瘤、狹窄、憩室等，是大腸造影的標準方法。","we":["A. 上消化道鋇餐評估食道和胃。","B. 鋇劑口服跟蹤評估小腸。","C. 靜脈注射造影劑用於血管或腎臟造影。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_055","year":2019,"roc_year":108,"session":"","examNo":55,"q":"犬隻罹患肥胖細胞增多症（mastocytosis），易導致","opts":["A. 心臟肥大","B. 骨骼肌肥大","C. 胃潰瘍","D. 角膜潰瘍"],"ans":2,"exp":"肥大細胞瘤（mastocytoma）分泌大量組織胺（histamine），刺激胃壁細胞過度分泌鹽酸，導致胃潰瘍（gastric ulcer），是mastocytoma全身性效應的重要表現。","we":["A. 皮膚腫塊是mastocytoma的原發表現，但本題問全身效應。","B. 過敏反應（anaphylaxis）可因組織胺釋放引起。","","D. 腹瀉也可見，但胃潰瘍更特異。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_056","year":2019,"roc_year":108,"session":"","examNo":56,"q":"犬隻罹患下列何種疾病，會引起藍眼（blue eye）的現象？","opts":["A. 白內障初期","B. 狂犬病","C. 假性狂犬病","D. 犬傳染性肝炎"],"ans":3,"exp":"犬傳染性肝炎（ICH）由CAV-1引起，在恢復期，病毒-抗體複合物在角膜基質沉積，導致角膜水腫呈藍色，稱為「藍眼症（blue eye）」。","we":["A. CAV-1確實會引起肝炎，但本題問特徵性眼部病變。","B. 犬瘟熱也有眼部症狀，但不是藍眼。","C. 犬疱疹病毒主要影響新生幼犬，不是藍眼症的病因。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_057","year":2019,"roc_year":108,"session":"","examNo":57,"q":"下列何種犬病在觸診時不會呈現弱脈（weak pulses）？","opts":["A. 肥大性心肌病（hypertrophic cardiomyopathy）","B. 擴大性心肌病（dilated cardiomyopathy）","C. 肺動脈狹窄（pulmonic stenosis）","D. 嚴重脫水"],"ans":2,"exp":"肺動脈狹窄（pulmonic stenosis）導致右心室壓力升高，右心代償性肥厚，脈搏可能正常或偏強，不會引起弱脈（weak pulse）；弱脈主要見於主動脈狹窄或心輸出量下降。","we":["A. 右心室收縮期雜音是肺動脈狹窄的特徵。","B. 右心室肥厚是長期代償的結果。","","D. 後天性右心衰竭是肺動脈狹窄嚴重時的後果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_058","year":2019,"roc_year":108,"session":"","examNo":58,"q":"一隻20公斤禁水中的成犬，脫水8%，估計24小時之嘔吐量為175 mL，一日的總輸液量應約為多少mL？","opts":["A. 3,500","B. 2,700","C. 1,500","D. 700"],"ans":1,"exp":"補液計算：缺失量（deficit）= 體重×脫水%×1000；維持量（maintenance）依體重計算；持續損失量依臨床估計。本題計算結果約2700 mL。","we":["A. 計算結果不足。","","C. 計算結果過多。","D. 計算結果過多。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_059","year":2019,"roc_year":108,"session":"","examNo":59,"q":"有關犬貓胰臟炎之治療，下列敘述何者正確？","opts":["A. 可使用anticholinergics藥物止吐","B. 可使用NSAIDs止痛","C. 應給與高脂、高蛋白的飲食作為控制","D. 嘔吐停止後，應儘早給食"],"ans":3,"exp":"小動物嘔吐停止後，應儘早恢復餵食，早期進食有助於維持腸道黏膜屏障、減少腸道細菌移位、加速恢復，不應長時間禁食。","we":["A. 24小時禁食過長，不利恢復。","B. 48小時禁食更不適當。","C. 只給水分但不給食物延遲了腸道恢復。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_060","year":2019,"roc_year":108,"session":"","examNo":60,"q":"有關小腸性下痢和大腸性下痢之敘述，下列何者錯誤？","opts":["A. 大腸性下痢通常排糞量較多","B. 大腸性下痢常伴隨鮮血","C. 小腸性下痢中沒有白血球的存在","D. 小腸性下痢不會有裡急後重的情形."],"ans":0,"exp":"大腸性下痢（large bowel diarrhea）的特徵是排糞次數增多但量少（小量多次）、常有黏液和裡急後重（tenesmus）。「排糞量較多」是錯誤的描述。","we":["","B. 排糞次數增多是大腸性下痢的特徵（正確）。","C. 黏液存在是大腸性下痢的特徵（正確）。","D. 裡急後重是大腸性下痢的特徵（正確）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_061","year":2019,"roc_year":108,"session":"","examNo":61,"q":"治療貓糖尿病併發之酮體酸血症時，較不採用下列何項處置？","opts":["A. 使用胰島素針劑","B. 補充碳酸氫鈉輸液","C. 口服降血糖藥","D. 輸液治療"],"ans":2,"exp":"糖尿病酮酸中毒（DKA）的治療包括液體補充、胰島素療法、電解質矯正，口服降血糖藥最不適合急性DKA，因為DKA患畜需要胰島素且往往有嘔吐、無法口服。","we":["A. 靜脈輸液是DKA治療的基礎。","B. 靜脈注射胰島素是DKA的核心治療。","","D. 電解質補充（尤其是鉀）是DKA管理的重要部分。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_062","year":2019,"roc_year":108,"session":"","examNo":62,"q":"下列何種藥物最適用於治療貓左心衰竭所造成的急性肺水腫？","opts":["A. furosemide","B. digoxine","C. angiotensin-converting enzyme inhibitors","D. β-adrenergic receptor blockers"],"ans":0,"exp":"急性肺水腫的緊急治療首選是furosemide靜脈注射，能快速利尿、降低前負荷，緩解肺水腫症狀。","we":["","B. 地高辛（digoxin）是慢性心衰竭的治療，不是急性肺水腫的首選。","C. Pimobendan適用於慢性心肌病，不是急性肺水腫首選。","D. Atenolol（β-blocker）在急性心衰竭時需謹慎使用。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_063","year":2019,"roc_year":108,"session":"","examNo":63,"q":"下列何項情況，犬隻最不易發生急性嘔吐？","opts":["A. 螺旋桿菌（Helicobacter spp.）感染","B. 急性腎衰竭","C. 胃息肉（gastric polyps）","D. 抗癌藥物（antineoplastics）的使用"],"ans":2,"exp":"胃息肉（gastric polyp）通常是慢性、緩慢生長的良性病變，不易引起急性嘔吐；相較之下，胃扭轉（GDV）、胃出血、胃腫瘤等才是急性嘔吐的常見原因。","we":["A. 胃扭轉（GDV）是急性嘔吐的緊急原因。","B. 胃異物可引起急性嘔吐。","","D. 胃出血/潰瘍可引起急性嘔吐。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_064","year":2019,"roc_year":108,"session":"","examNo":64,"q":"12歲波斯貓最近幾個月體重下降，食慾很好，脾氣變得比較暴躁，最可能的原因為下列何項？","opts":["A. hypothyroidism","B. hyperthyroidism","C. hyperadrenocorticism","D. diabetes mellitus"],"ans":1,"exp":"老年貓體重下降但食慾好（甚至食慾亢進），應首先考慮甲狀腺功能亢進症（hyperthyroidism），因甲狀腺素過多使代謝率升高，體重下降但食慾反而增加。","we":["A. 糖尿病（DM）貓也有多食，但通常有多飲多尿。","","C. 慢性腎病（CKD）貓通常食慾下降。","D. 炎症性腸病（IBD）也可有消瘦，但食慾通常正常或下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_065","year":2019,"roc_year":108,"session":"","examNo":65,"q":"犬隻何處骨折最不適合使用髓內釘（intramedullary pin）進行固定？","opts":["A. 橈骨","B. 脛骨","C. 肱骨","D. 掌骨"],"ans":0,"exp":"橈骨（radius）骨髓腔形狀不規則，髓內釘（intramedullary pin）固定效果差，應使用骨板固定（bone plate）；股骨、脛骨、肱骨骨髓腔直且適合髓內釘。","we":["","B. 股骨骨髓腔直而寬，適合髓內釘。","C. 脛骨也常使用髓內釘。","D. 肱骨在某些骨折可使用髓內釘。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_066","year":2019,"roc_year":108,"session":"","examNo":66,"q":"下列何者不適用於治療犬貓的乳糜胸？","opts":["A. 心包膜切除","B. 低蛋白高脂飲食","C. 胸管結紮","D. 乳糜池摘除"],"ans":1,"exp":"乳糜胸（chylothorax）的飲食管理需要低脂飲食（low-fat diet）以減少乳糜的產生（乳糜主要來自飲食中的長鏈脂肪酸）。高蛋白高脂飲食反而會加重乳糜產生，不適合乳糜胸。","we":["A. 低脂飲食是乳糜胸的正確飲食管理。","","C. 高纖維飲食對乳糜胸無直接幫助。","D. 中鏈三酸甘油酯（MCT）飲食不經淋巴吸收，適合乳糜胸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_067","year":2019,"roc_year":108,"session":"","examNo":67,"q":"10月齡雄性未去勢黃金獵犬，出現前肢呈角畸形（angular limb deformity of the antebrachium），最不可能是下\r   列何種原因造成？","opts":["A. 尺骨遠端軟骨核存留（retained cartilage core of the distal ulna）","B. 尺骨遠端生長板創傷過早癒合（premature distal ulnar physeal closure）","C. 橈尺骨肥大性骨營養不良（hypertrophic osteodystrophy）","D. 橈尺骨全骨炎（panosteitis）"],"ans":3,"exp":"全骨炎（panosteitis）是犬大型犬青少年期的自限性骨病，以長骨髓腔骨髓炎症為特徵，引起急性跛行、疼痛，通常隨年齡增長自然緩解，不引起角畸形（angular deformity）。","we":["A. 跛行（lameness）是全骨炎的典型症狀。","B. 觸診骨幹疼痛是全骨炎的特徵。","C. 多發性跛行（shifting leg lameness）在全骨炎中常見。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_068","year":2019,"roc_year":108,"session":"","examNo":68,"q":"下列那一種鴉片類藥物，於犬隻鴉片接受器中兼具有作用劑與拮抗劑之特性？","opts":["A. morphine","B. pethidine","C. fentanyl","D. nalbuphine"],"ans":3,"exp":"Nalbuphine是混合型鴉片類藥物，具有κ受體促效（agonist）和μ受體拮抗（antagonist）的雙重作用，因此被歸類為混合作用劑/拮抗劑（mixed agonist-antagonist）鴉片類藥物。","we":["A. 純μ受體促效劑（如嗎啡）不是nalbuphine的分類。","B. 純μ受體拮抗劑（如naloxone）不是nalbuphine的分類。","C. 純κ受體促效劑不是nalbuphine的正確分類。",""],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_069","year":2019,"roc_year":108,"session":"","examNo":69,"q":"犬隻氣體麻醉過程中，機械性正壓通氣與自主呼吸模式都可維持呼吸及麻醉氣體的吸入與排除，下列何者不\r   是機械性正壓通氣優於自主呼吸的現象？","opts":["A. 容易控制動脈內二氧化碳分壓","B. 增加靜脈回流至心臟的血液量","C. 維持肺泡適度擴張","D. 確保氣體麻醉劑吸入"],"ans":1,"exp":"正壓通氣（PPV）通過增加胸腔內壓，壓迫腔靜脈，減少靜脈回流（venous return）到右心，導致前負荷下降，心輸出量可能下降，不增加靜脈回流。","we":["A. 正壓通氣增加功能殘氣量是正確的。","","C. 正壓通氣確實增加胸腔內壓。","D. 正壓通氣可能導致氣壓傷（barotrauma）是正確的。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_070","year":2019,"roc_year":108,"session":"","examNo":70,"q":"永存性右主動脈弓之患犬，離乳後開始餵食固形食物，會出現下列何項症狀？","opts":["A. 食道擴張、食物逆流和消瘦","B. 嘔吐、下痢和胃潰瘍","C. 嘔吐和胃食道套疊","D. 黏液鮮血便和裡急後重"],"ans":0,"exp":"持久性右主動脈弓（PRAA）導致食道被主動脈弓和動脈韌帶環繞，在心臟基部食道形成狹窄，臨床表現為食道擴張（megaesophagus）、固體食物逆流（regurgitation）和漸進性消瘦。","we":["","B. PRAA不引起吞嚥困難（dysphagia）而是逆流（regurgitation）。","C. PRAA不引起心臟症狀（如心律不整）。","D. PRAA的主要問題是食道，不是氣管問題。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_071","year":2019,"roc_year":108,"session":"","examNo":71,"q":"下列何項是蒸氣滅菌法的優點？","opts":["A. 所有物品皆適用","B. 低溫","C. 無致癌性","D. 滅菌時，物品堆疊的方式不影響效果"],"ans":2,"exp":"蒸氣高壓滅菌（autoclave sterilization）是最有效的滅菌方法，本身無致癌性，不像環氧乙烷（ETO）等化學滅菌劑有致癌風險。","we":["A. 環氧乙烷（ETO）確實有效但有致癌性和殘留問題。","B. 甲醛（formaldehyde）有致癌性。","","D. 輻射滅菌有效但費用高，用於一次性器械。"],"needs_review":false,"imgs":[]},{"id":"AMO_2019_2_普通病_072","year":2019,"roc_year":108,"session":"","examNo":72,"q":"下圖的狀況最可能的診斷是","opts":["A. injection site sarcoma","B. inguinal hernia","C. umbilical hernia","D. sertoli cell tumor"],"ans":1,"exp":"腹股溝疝（inguinal hernia）指腹腔內容物（通常是腸管或脂肪）通過腹股溝管突出，是常見的軟組織手術問題。需確認圖示內容。","we":["A. 其他疝氣類型與腹股溝疝不同。","","C. 臍疝（umbilical hernia）位置在臍部。","D. 膈疝（diaphragmatic hernia）在胸腔。"],"needs_review":true,"imgs":[]},{"id":"AMO_2019_2_普通病_073","year":2019,"roc_year":108,"session":"","examNo":73,"q":"心臟1~2點鐘箭號所指部位為\r   何？","opts":["A. 變大的左心房","B. 變大的左心室","C. 變大的左心耳","D. 變大的右心室"],"ans":0,"exp":"犬側位X光中，左心房擴大（left atrial enlargement）的影像特徵是在1~2點鐘方向出現不透明影像；左心房擴大時壓迫主支氣管使氣管抬高。需確認圖示。","we":["","B. 3-4點鐘位置代表另一個心臟結構。","C. 5-6點鐘位置代表心尖。","D. 11-12點鐘位置代表主動脈弓。"],"needs_review":true,"imgs":[]},{"id":"AMO
