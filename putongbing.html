function setFilter(v){
  curFilter=v;state={qi:0,done:0,cor:0};recalcStats();saveProgress();render();
}
function getQs(){
  if(curFilter==='all')return ALL_QS;
  const m=curFilter.match(/^(\d{4})-([12])$/);
  if(m)return ALL_QS.filter(q=>String(q.year)===m[1]&&q.session===m[2]);
  return ALL_QS.filter(q=>String(q.year)===curFilter&&!q.session);
}
function setProg(p){const f=document.getElementById('pf');if(f)f.style.width=p+'%';}
function updStats(){
  const qs=getQs();
  document.getElementById('qtotal').textContent=qs.length;
  document.getElementById('sd').textContent=state.done;
  document.getElementById('sc').textContent=state.cor;
  document.getElementById('sa').textContent=state.done?Math.round(state.cor/state.done*100)+'%':'—';
}
function getWrongQs(){
  return getQs().filter(q=>qStates[q.id]&&qStates[q.id].startsWith('no'));
}
function getReviewQs(){
  return getQs().filter(q=>(qStates[q.id]&&qStates[q.id].startsWith('no'))||unsureSet[q.id]);
}
function render(){

function startExam(){
  const qs=getQs();
  const unanswered=qs.filter(q=>!qStates[q.id]);
  const label=curFilter==='all'?'全部題目':document.getElementById('yrsel').options[document.getElementById('yrsel').selectedIndex].text;
  const msg=unanswered.length===qs.length
    ?`開始測驗：${label}（${qs.length} 題）？`
    :`「${label}」還有 ${unanswered.length} 題未作答。\n\n• 繼續作答剩餘題目：點「繼續」\n• 重新測驗全部：點「重新開始」`;
  if(unanswered.length===qs.length){
    if(!confirm(msg))return;
  }else{
    const choice=confirm(msg+'\n\n（確定 = 重新開始，取消 = 繼續作答）');
    if(choice){
      qs.forEach(q=>{delete qStates[q.id];delete errorCounts[q.id];delete unsureSet[q.id];});
      state={qi:0,done:0,cor:0};saveProgress();
    }else{
      const firstUnanswered=qs.findIndex(q=>!qStates[q.id]);
      if(firstUnanswered>=0)state.qi=firstUnanswered;
    }
  }
  mode=0;
  [0,1,2].forEach(i=>{const b=document.getElementById('m'+i);if(b)b.classList.toggle('on',i===0)});
  recalcStats();saveProgress();render();
}
function renderQ(a){
  const qs=getQs();
  if(!qs.length){a.innerHTML='<div class="card" style="text-align:center;color:var(--text3);padding:2rem">此年份暫無題目</div>';return;}
  if(state.qi>=qs.length){
    setProg(100);
    const pct=state.done?Math.round(state.cor/state.done*100):0;
    const reviewCount=getReviewQs().length;
    const wrongBtns=reviewCount>0?`
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn" onclick="setM(1)" style="border-color:var(--green-border);color:#7dd9a4">字卡複習 ${reviewCount} 題</button>
        <button class="btn" onclick="setM(2)" style="border-color:var(--accent)">重點整理</button>
      </div>`:'';
    a.innerHTML=`<div class="card res"><div class="res-s mono">${pct}%</div>
    <div class="res-sub">全部 ${qs.length} 題完成！</div>
    <div class="res-row">
      <div class="ri"><div class="rn grn">${state.cor}</div><div class="rl">答對</div></div>
      <div class="ri"><div class="rn red">${state.done-state.cor}</div><div class="rl">答錯</div></div>
      <div class="ri"><div class="rn">${qs.length}</div><div class="rl">總題數</div></div>
    </div>
    ${wrongBtns}
    <button class="btn btnp" onclick="restartQuiz()" style="margin-top:12px">重新練習</button></div>`;
    return;
  }
  const q=qs[state.qi];
  const answered=qStates[q.id];
  const ec=errorCounts[q.id]||0;
  setProg(Math.round(state.qi/qs.length*100));
  const noteHtml=q.note?`<div class="note-box">注意：${q.note}</div>`:'';
  const pickedIdx=answered&&answered.startsWith('no')?parseInt(answered.split('-')[1]):-1;
  let optsHtml=q.opts.map((o,i)=>{
    let cls='opt';let oc='';
    if(answered){
      if(i===q.ans){cls+=' dis ok';}
      else if(i===pickedIdx){cls+=' no';oc=`onclick="peekWexp(${i})"`;}
      else{cls+=' peek';oc=`onclick="peekWexp(${i})"`;}
    }else{oc=`onclick="pick(${i},${q.ans})"`;}
    return `<div class="${cls}" id="o${i}" ${oc}><span class="okey mono">${String.fromCharCode(65+i)}</span><span>${o.replace(/^[A-D]\. /,'')}</span></div>`;
  }).join('');
  const expShow=answered?'show':'';
  let wexpShow='',wexpBody='',wexpTitle='你可能選這個，是因為&#x2026;&#x2026;';
  if(answered&&pickedIdx>=0&&q.we&&q.we[pickedIdx]&&q.we[pickedIdx]!==''){
    wexpShow='show';wexpBody=q.we[pickedIdx];
  }
  const nbDisplay=answered?'':'none';
  const ecBadge=ec>0?`<span class="bdg ec-badge">錯誤 ${ec} 次</span>`:'';
  const isUnsure=!!unsureSet[q.id];
  const starCls=`btn-star${isUnsure?' active':''}${answered?'':' invis'}`;
  const ecHint=answered&&ec>=2?`<div class="note-box ec-hint" style="margin-top:.5rem">⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。</div>`:'';
  const sessionLabel=q.session?` 第${q.session}次`:'';
  const unsureMeta=isUnsure?`<span class="bdg unsure-tag">★</span>`:'';
  const aiBtnHtml=answered?`<button class="btn btn-ai" onclick="showAIModal(${state.qi})" style="width:100%;margin-top:.6rem">🤖 問 AI 獲取詳細解析</button>`:'';
  a.innerHTML=`<div class="card">
    <div class="meta">
      <span class="bdg bdg-yr mono">民國${q.roc_year}年${sessionLabel} 第${q.examNo}題</span>
      <span class="bdg bdg-src">官方歷屆</span>
      ${q.needs_review?'<span class="bdg bdg-rv">答案待確認</span>':''}
      ${ecBadge}${unsureMeta}
      <span class="qn mono">${state.qi+1} / ${qs.length}</span>
    </div>
    <div class="act" style="margin-top:0;margin-bottom:.75rem">
      <button class="btn" onclick="jumpTo(Math.max(0,state.qi-1))" ${state.qi===0?'disabled':''}>&#8592; 上一題</button>
      <button class="${starCls}" id="unsure-btn" onclick="toggleUnsure()" title="★">&#9733;</button>
      <button class="btn btnp" id="nb" onclick="jumpTo(state.qi+1)" style="display:${nbDisplay}">下一題 &#8594;</button>
    </div>
    <div class="qt">${q.q}</div>
    ${q.imgs&&q.imgs.length?`<div class="q-imgs">${q.imgs.map(s=>`<img src="${s}" alt="題目圖片" onclick="this.style.maxWidth=this.style.maxWidth?'':'none'">`).join('')}</div>`:''}
    <div class="opts">${optsHtml}</div>
    <div class="exp ${expShow}" id="exp"><div class="exp-t mono">解析</div>${q.exp}${noteHtml}${ecHint}</div>
    <div class="wexp ${wexpShow}" id="wexp"><div class="wexp-t mono" id="wexp-t">${wexpTitle}</div><span id="wexp-body">${wexpBody}</span></div>
    <div id="ai-wrap">${aiBtnHtml}</div>
  </div>`;
}
function pick(i,ans){
  const qs=getQs();const q=qs[state.qi];
  if(!q||qStates[q.id])return;
  const correct=(i===ans);
  state.done++;if(correct)state.cor++;
  qStates[q.id]=correct?'ok':'no-'+i;
  if(!correct)errorCounts[q.id]=(errorCounts[q.id]||0)+1;
  saveProgress();
  for(let j=0;j<q.opts.length;j++){
    const d=document.getElementById('o'+j);if(!d)continue;
    if(j===ans){d.classList.add('dis','ok');d.removeAttribute('onclick');}
    else if(j===i&&!correct){d.classList.add('no');d.setAttribute('onclick','peekWexp('+j+')');}
    else{d.classList.add('peek');d.setAttribute('onclick','peekWexp('+j+')');}
  }
  document.getElementById('exp').classList.add('show');
  if(!correct&&q.we&&q.we[i]&&q.we[i]!==''){
    const we=document.getElementById('wexp');const t=document.getElementById('wexp-t');
    if(we){document.getElementById('wexp-body').textContent=q.we[i];if(t)t.innerHTML='你可能選這個，是因為&#x2026;&#x2026;';we.classList.add('show');}
  }
  const nb=document.getElementById('nb');if(nb)nb.style.display='';
  const ubtn=document.getElementById('unsure-btn');
  if(ubtn)ubtn.classList.remove('invis');
  const aiWrap=document.getElementById('ai-wrap');
  if(aiWrap&&!aiWrap.querySelector('.btn-ai')){
    const btn=document.createElement('button');
    btn.className='btn btn-ai';btn.style.cssText='width:100%;margin-top:.6rem';
    btn.textContent='🤖 問 AI 獲取詳細解析';
    btn.onclick=()=>showAIModal(state.qi);
    aiWrap.appendChild(btn);
  }
  const ec=errorCounts[q.id]||0;
  if(!correct&&ec>=2){
    const expEl=document.getElementById('exp');
    if(expEl&&!expEl.querySelector('.ec-hint')){
      const hint=document.createElement('div');
      hint.className='note-box ec-hint';hint.style.marginTop='.5rem';
      hint.innerHTML=`⚠️ 你已答錯此題 <strong>${ec} 次</strong>，建議點「問 AI」獲取更詳細解析。`;
      expEl.appendChild(hint);
    }
  }
  updStats();renderNav();
}
function peekWexp(i){
  const qs=getQs();const q=qs[state.qi];
  document.querySelectorAll('.opt.peek').forEach(el=>el.classList.remove('peek-active'));
  const el=document.getElementById('o'+i);if(el)el.classList.add('peek-active');
  const we=document.getElementById('wexp');const weBody=document.getElementById('wexp-body');const weT=document.getElementById('wexp-t');
  if(!we||!weBody)return;
  const letter=String.fromCharCode(65+i);
  const isPicked=el&&el.classList.contains('no');
  if(weT)weT.textContent=isPicked?'你選了 ('+letter+')，為什麼不對？':'選項 ('+letter+') 為什麼不對？';
  const txt=(q.we&&q.we[i]&&q.we[i]!=='')?q.we[i]:'（解析待補充）';
  weBody.textContent=txt;we.classList.add('show');
}
function toggleUnsure(){
  const qs=getQs();const q=qs[state.qi];if(!q)return;
  if(unsureSet[q.id])delete unsureSet[q.id];
  else unsureSet[q.id]=true;
  saveProgress();
  const btn=document.getElementById('unsure-btn');
  if(btn){
    const active=!!unsureSet[q.id];
    btn.classList.toggle('active',active);
    btn.title='★';
  }
  const meta=document.querySelector('.meta');
  if(meta){
    const old=meta.querySelector('.unsure-tag');if(old)old.remove();
    if(unsureSet[q.id]){
      const tag=document.createElement('span');
      tag.className='bdg unsure-tag';tag.textContent='★';
      const qn=meta.querySelector('.qn');if(qn)meta.insertBefore(tag,qn);else meta.appendChild(tag);
    }
  }
  renderNav();
}
function restartQuiz(){
  const qs=getQs();
  qs.forEach(q=>{delete qStates[q.id];});
  state={qi:0,done:0,cor:0};saveProgress();render();
}
function showAIModal(qIdx){
  const qs=getQs();const q=qs[qIdx];if(!q)return;
  const ec=errorCounts[q.id]||0;
  const sessionLabel=q.session?` 第${q.session}次`:'';
  const lines=['【獸醫病理 國考題目】',`民國${q.roc_year}年${sessionLabel} 第${q.examNo}題`,'',q.q,''];
  q.opts.forEach(o=>lines.push(o));
  lines.push('',`【正確答案】${String.fromCharCode(65+q.ans)}`,'',`【現有解析】${q.exp}`,'');
  if(ec>0)lines.push(`備注：此題你已答錯 ${ec} 次。`,'');
  lines.push('請針對此題提供更詳細的普通疾病學解析，說明病變機制、組織特徵及常見混淆點。');
  const text=lines.join('\n');
  const existing=document.getElementById('ai-modal');if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='ai-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:1rem';
  modal.innerHTML=`<div style="background:#1a1d27;border:1px solid #3d4260;border-radius:12px;padding:1.5rem;max-width:480px;width:100%;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-size:14px;font-weight:700;color:#7986cb">🤖 問 AI 獲取更詳細解析</div>
      <button onclick="document.getElementById('ai-modal').remove()" style="background:none;border:none;color:#9096b8;cursor:pointer;font-size:20px;line-height:1">✕</button>
    </div>
    <div style="font-size:11px;color:#9096b8;margin-bottom:.5rem">以下文字將傳給 AI。點 AI 按鈕時自動複製，開啟網站後貼上（Ctrl+V）：</div>
    <div id="ai-preview" style="font-size:11px;color:#9096b8;background:#0f1117;border:1px solid #2e3347;border-radius:6px;padding:10px;max-height:130px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-bottom:.75rem"></div>
    <button onclick="copyAIText()" style="width:100%;padding:9px;background:#22263a;border:1px solid #3d4260;border-radius:8px;color:#e8eaf6;cursor:pointer;margin-bottom:6px;font-size:13px">📋 複製題目文字</button>
    <div id="copy-ok" style="text-align:center;color:#43a867;font-size:12px;min-height:18px;margin-bottom:6px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem">
      <a href="https://chat.openai.com/" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#10a37f15;border:1px solid #10a37f40;border-radius:8px;color:#10a37f;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">🤖<span>ChatGPT</span></a>
      <a href="https://claude.ai/new" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#d97a2015;border:1px solid #d97a2040;border-radius:8px;color:#d97a20;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">⚡<span>Claude</span></a>
      <a href="https://gemini.google.com/app" target="_blank" rel="noopener" onclick="copyAIText()" style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:#4285f415;border:1px solid #4285f440;border-radius:8px;color:#4285f4;text-decoration:none;font-size:12px;font-weight:500;cursor:pointer">✨<span>Gemini</span></a>
    </div>
    <div style="font-size:11px;color:#555d80;text-align:center">點 AI 按鈕後在新分頁貼上即可</div>
  </div>`;
  modal.querySelector('#ai-preview').textContent=text;
  modal._aiText=text;
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
  document.body.appendChild(modal);
}
function copyAIText(){
  const modal=document.getElementById('ai-modal');if(!modal||!modal._aiText)return;
  const ok=document.getElementById('copy-ok');
  const show=msg=>{if(ok){ok.textContent=msg;setTimeout(()=>ok.textContent='',2500);}};
  navigator.clipboard.writeText(modal._aiText).then(()=>show('✓ 已複製到剪貼簿！開啟 AI 後貼上')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=modal._aiText;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
    show('✓ 已複製！');
  });
}
document.getElementById('qtotal').textContent=ALL_QS.length;
(function(){
  const sel=document.getElementById('yrsel');
  const seen=new Set();const opts=[];
  ALL_QS.forEach(q=>{
    const key=q.session?String(q.year)+'-'+q.session:String(q.year);
    if(!seen.has(key)){seen.add(key);opts.push({key,year:q.year,roc:q.roc_year,session:q.session||''});}
  });
  opts.sort((a,b)=>b.year-a.year||(b.session<a.session?-1:1));
  opts.forEach(o=>{
    const op=document.createElement('option');op.value=o.key;
    op.textContent=o.session?'民國'+o.roc+'年 第'+o.session+'次':'民國'+o.roc+'年';
    sel.appendChild(op);
  });
  if(curFilter!=='all')sel.value=curFilter;
})();
auth.onAuthStateChanged(user=>{if(user){enterApp(user);}else{location.href='./index.html';}});
