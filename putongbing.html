物，錯誤。","豬（pig）是自發性排卵動物，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_038","year":2016,"roc_year":105,"session":"","examNo":38,"q":"如圖所示，胎兒呈何種胎位（presentation）、胎向（position）、胎勢（posture）？","opts":["A. anterior presentation, dorsal position, lateral deviation of the head","B. posterior presentation, ventral position, lateral deviation of the head","C. posterior presentation, dorsal position, lateral deviation of the head","D. anterior presentation, ventral position, lateral deviation of the head"],"ans":3,"exp":"胎位（presentation）、胎向（position）、胎勢（posture）是描述胎兒在子宮中姿勢的三要素。正常分娩需要頭位（anterior presentation）、背向（dorsal position）、頭頸和前肢伸展（extended posture）。需要圖片確認具體描述。","we":["胎位、胎向、胎勢的判斷需要結合圖像。","正確選項需要從圖示中確認胎兒的具體姿勢。","異常胎位胎向胎勢的判斷需要圖像輔助。","此題需要結合圖示選擇正確的描述。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_039","year":2016,"roc_year":105,"session":"","examNo":39,"q":"家畜因胎位不正（fetal dispositon）引起之難產，下列臨床處理之順序何者最佳？①牽引（traction） ②伸展（extension）\r ③回推（retropulsion）","opts":["A. ①②③","B. ②③①","C. ②①③","D. ③②①"],"ans":3,"exp":"難產（dystocia）處理的基本步驟順序：首先將胎兒回推（repulsion）到子宮空間較大的位置→伸展（extension）調整胎位胎勢到正常分娩姿勢→牽引（traction）協助娩出。正確順序為③回推→②伸展→①牽引。強行牽引而不先回推和調整胎位會造成產道損傷。","we":["先牽引後調整的順序錯誤，會造成產道損傷，錯誤。","先伸展後回推的順序不符合難產處理原則，錯誤。","同時進行多個步驟在實際操作中不可行，錯誤。","回推→伸展→牽引（③②①）是難產處理的標準順序，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_040","year":2016,"roc_year":105,"session":"","examNo":40,"q":"下列那種動物，於懷孕期間會出現子宮內膜杯（endometrial cup）的組織？","opts":["A. 馬","B. 兔","C. 豬","D. 綿羊"],"ans":0,"exp":"懷孕期子宮內膜杯（endometrial cups）是馬（equine）特有的結構，由胎兒絨毛膜帶（chorionic girdle）細胞侵入子宮內膜形成。子宮內膜杯分泌馬繁殖促性腺激素（equine Chorionic Gonadotropin, eCG，舊稱PMSG），促進黃體化和黃體形成，維持早期妊娠。","we":["馬（equine）是唯一具有子宮內膜杯的動物，分泌eCG（PMSG），此為正確答案。","牛沒有子宮內膜杯，錯誤。","豬沒有子宮內膜杯，錯誤。","羊沒有子宮內膜杯，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_041","year":2016,"roc_year":105,"session":"","examNo":41,"q":"下列何項是母牛黃體囊腫最主要的臨床症狀？","opts":["A. 持續性發情和陰道排出黃白色膿性分泌物","B. 持續性發情和慕雄狂","C. 持續性發情和假懷孕","D. 持續性無發情和發情間期延長"],"ans":3,"exp":"黃體囊腫（luteal cyst/corpus luteum cyst）的主要臨床症狀：因黃體持續分泌黃體素（progesterone），抑制下視丘-腦下垂體-卵巢軸，導致持續性無發情（persistent anestrus）和發情間期延長。這與濾泡囊腫（follicular cyst，引起頻發情/持續發情）不同。","we":["頻繁發情（nymphomania）是濾泡囊腫的症狀，不是黃體囊腫，錯誤。","不育但發情週期正常不是黃體囊腫的典型症狀，錯誤。","發情週期縮短不是黃體囊腫的症狀，錯誤。","持續性無發情和發情間期延長是黃體囊腫的主要臨床症狀，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_042","year":2016,"roc_year":105,"session":"","examNo":42,"q":"下列那種荷爾蒙製劑對母牛之濾泡囊腫（follicular cyst），最無治療效果？","opts":["A. 助孕素（progesterone）","B. 人類絨毛膜性腺激素（hCG）","C. 性腺素釋放激素（GnRH）","D. 前列腺素F2α（PGF2α）"],"ans":3,"exp":"濾泡囊腫（follicular cyst）的治療：GnRH（誘發LH峰，促進濾泡黃體化）、hCG（促進黃體化）、手術去除、OvSynch同期化方案均有效。PGF2α（前列腺素F2α）主要用於溶解黃體（luteolysis），對尚未黃體化的濾泡囊腫效果有限，是最無效的治療選項。","we":["GnRH可促進LH峰誘導濾泡囊腫黃體化，有效，錯誤（不選此項）。","hCG效果類似LH，可促進黃體化，有效，錯誤（不選此項）。","手術去除可直接解決問題，有效，錯誤（不選此項）。","PGF2α主要溶解黃體，對未黃體化的濾泡囊腫最無效，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_043","year":2016,"roc_year":105,"session":"","examNo":43,"q":"臨床上心衰竭常使用ACEIs（angiotensin-converting enzyme inhibitors）類藥物，下列何項為其可能造成的影響？","opts":["A. 高血壓","B. 消化道不適","C. 低血鉀","D. 高血鈉"],"ans":1,"exp":"血管緊張素轉化酶抑制劑（ACE inhibitors, ACEIs）的副作用：腎功能損傷（在腎血流量低時）、高血鉀症（因醛固酮減少）、乾咳（人醫多見）是主要副作用。消化道不適（噁心、嘔吐、食慾不振）也是ACEIs可能出現的副作用，影響消化道功能。","we":["ACEIs主要降低血壓，不常引起高血壓，錯誤。","消化道不適（噁心、嘔吐）是ACEIs可能的副作用，此為正確答案。","ACEIs不直接引起低血糖，錯誤。","ACEIs不常引起高血糖，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_044","year":2016,"roc_year":105,"session":"","examNo":44,"q":"開放性動脈導管（PDA）通常為左至右分流（left-to-right shunt），其血液動力學的結果將造成下列何處的流量過度負荷\r （volume overload）？","opts":["A. 體循環","B. 肺循環","C. 右心室","D. 後腔靜脈"],"ans":1,"exp":"動脈導管未閉（Patent Ductus Arteriosus, PDA）的血液分流：PDA使主動脈血液（高壓）流向肺動脈（低壓），形成左向右分流（left-to-right shunt）。這導致肺循環（pulmonary circulation）血量過多（volume overload），肺動脈、肺靜脈和左心承受容積負荷過重。","we":["體循環在PDA時不是過度容積負荷的部位，錯誤。","肺循環因左向右分流而承受容積過重（volume overload），此為正確答案。","PDA時右心是壓力升高但不是volume overload的主要部位，此選項不如B準確。","左心室也承受容積過重，但肺循環更直接，此選項不如B準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_045","year":2016,"roc_year":105,"session":"","examNo":45,"q":"心臟聽診時所聽到的第三心音是因下列何者所產生？","opts":["A. 二尖瓣關閉（mitral valve close）","B. 主動脈瓣關閉（aortic valve close）","C. 心室快速填充期（rapid ventricular filling）","D. 心房收縮期（atrial contraction）"],"ans":2,"exp":"第三心音（S3）的生理基礎：S3出現在心室快速充填期（rapid ventricular filling phase），即二尖瓣開放後血液快速流入心室，心室壁突然振動所產生的低頻音。病理性S3（奔馬律）見於心臟衰竭時，提示心室順應性下降或容積過重。","we":["二尖瓣關閉對應S1，不是S3，錯誤。","主動脈瓣關閉對應S2，不是S3，錯誤。","心室快速充填期產生S3，此為正確答案。","心房收縮產生S4，不是S3，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_046","year":2016,"roc_year":105,"session":"","examNo":46,"q":"一隻犬臨床出現虛弱、運動不耐，呼吸急促但無心雜音，其心電圖如下。以下何者為正確 ？（from small animal internal medicine，lead II， 25mm/sec）","opts":["A. 第1級房室阻礙（first-degree AV block）","B. 第2級房室阻礙（second-degree AV block）","C. 第3級房室阻礙（third-degree AV block）","D. 竇停止（sinus arrest）"],"ans":0,"exp":"此題為心電圖（ECG）判讀題，需要圖像確認。常見ECG異常包括：竇性心搏過速（sinus tachycardia）、心室顫動（ventricular fibrillation）、心室早期收縮（VPC）、完全性房室傳導阻滯（complete AV block）等。需要圖像才能準確判斷。","we":["ECG判讀需要結合圖像進行分析。","不同的ECG波形代表不同的心律不整。","正確答案需要根據圖示的波形特徵判斷。","此題為圖像題，需要結合圖示選擇正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_047","year":2016,"roc_year":105,"session":"","examNo":47,"q":"以下心電圖中A為正常，下列何者正確？（from small animal internal medicine）","opts":["A. B為上心室性異位節律（supraventricular ectopic）、C為心室性異位節律（ventricular ectopic）","B. B為心室性異位節律（ventricular ectopic）、C為上心室性異位節律（supraventricular ectopic）","C. B與C並非異位節律性心律不整","D. B與C皆為心室性異位節律性心律不整"],"ans":0,"exp":"此題為ECG圖像判讀題，需要比較B和C類型的心電圖波形特徵進行鑑別診斷。需要圖像才能準確判斷。","we":["ECG波形的B和C類型需要圖像確認才能判斷。","不同心律不整類型在ECG上有特徵性表現。","正確選項需要根據圖示的波形特徵分析。","此題為圖像比較題，需要結合圖示作答。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_048","year":2016,"roc_year":105,"session":"","examNo":48,"q":"心臟超音波以脈衝式都卜勒（pulsed wave doppler）偵測心臟各腔室的血流時，其最大的限制是下列何項？","opts":["A. 影像不清晰","B. 計算流速受限","C. 波形無法連續","D. 無法分辨血流方向"],"ans":1,"exp":"脈衝式都卜勒超音波（pulsed-wave Doppler）的最大限制：由於奈奎斯特定律（Nyquist theorem），脈衝式都卜勒有最大可量測流速的限制（aliasing現象），當血流速度超過奈奎斯特極限時，無法正確顯示真實流速，這是計算高速血流（如瓣膜狹窄或逆流）速度的主要限制。","we":["空間分辨率不足不是脈衝式都卜勒的主要限制，錯誤。","計算流速受到奈奎斯特限制（aliasing）是脈衝式都卜勒的最大限制，此為正確答案。","穿透深度不足是超音波整體限制，不是脈衝式都卜勒特有限制，錯誤。","無法偵測血流方向不是脈衝式都卜勒的限制，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_049","year":2016,"roc_year":105,"session":"","examNo":49,"q":"肝腦症（hepatic encephalopathy）是指下列何項在血液中濃度過高所致？","opts":["A. BUN","B. ammonia","C. ALT","D. triglyceride"],"ans":1,"exp":"肝腦症（hepatic encephalopathy）的主要病理機制：肝功能衰竭時，氨（ammonia, NH3）無法在肝臟經鳥氨酸循環（urea cycle）轉化為尿素排出，血中氨濃度升高（高氨血症），氨透過血腦屏障進入腦組織，干擾神經傳遞，引起意識改變、神經症狀。","we":["血糖升高不是肝腦症的主要機制，錯誤。","血中氨（ammonia）過高是肝腦症的核心機制，此為正確答案。","血中膽紅素升高引起黃疸，不是主要神經毒素，錯誤。","血中尿素氮（BUN）升高見於腎功能不全，不是肝腦症的主要機制，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_050","year":2016,"roc_year":105,"session":"","examNo":50,"q":"絲球體性腎炎併有蛋白尿的犬或貓，不太可能出現下列那項臨床症狀？","opts":["A. 血脂異常增高","B. 水腫或腹水","C. 無其他症狀","D. 低血壓"],"ans":3,"exp":"絲球體腎炎（glomerulonephritis）的臨床特徵：大量蛋白尿（proteinuria）→低蛋白血症（hypoalbuminemia）→膠體滲透壓下降→水腫和腹水→腎臟RAS系統激活→鈉水滯留→高血壓（hypertension），而非低血壓。低血壓在腎臟疾病中不常見（通常是高血壓）。","we":["蛋白尿是絲球體腎炎的特徵，正確（不選此項）。","低蛋白血症因蛋白質從尿中大量流失而發生，正確（不選此項）。","水腫因低白蛋白血症和鈉水滯留而發生，正確（不選此項）。","低血壓在絲球體腎炎中不常見（通常為高血壓），此為正確答案（不太可能出現）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_051","year":2016,"roc_year":105,"session":"","examNo":51,"q":"最常發生在犬貓腸管的惡性腫瘤為何？","opts":["A. hemangiosarcoma","B. fibrosarcoma","C. lymphoma","D. leiomyomas"],"ans":2,"exp":"犬貓腸管最常見的惡性腫瘤：犬和貓的腸道惡性腫瘤中，淋巴瘤（lymphoma）是最常見的，尤其在貓，腸道淋巴瘤（alimentary lymphoma）非常常見。犬的腸道也以淋巴瘤最為多見，其次是腺癌（adenocarcinoma）。","we":["腺癌（adenocarcinoma）在犬腸道中排名第二，不是最常見，錯誤。","平滑肌瘤（leiomyoma）是良性腫瘤，不是最常見的惡性腫瘤，錯誤。","淋巴瘤（lymphoma）是犬貓腸管最常見的惡性腫瘤，此為正確答案。","肥大細胞瘤（mast cell tumor）在腸道較少見，不是最常見，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_052","year":2016,"roc_year":105,"session":"","examNo":52,"q":"下列何者與肝臟疾病造成腹水的原因較無關係？","opts":["A. hypoalbuminemia","B. hypercholesterolemia","C. portal hypertension","D. renal retention of sodium and water"],"ans":1,"exp":"肝臟疾病引起腹水的機制：低白蛋白血症（降低膠體滲透壓）、門脈高壓（portal hypertension）、淋巴管阻塞（lymphatic obstruction）是主要機制。高膽固醇血症（hypercholesterolemia）雖然可能在肝臟疾病中出現，但它不是引起腹水的直接機制，因此與腹水的關聯性最弱。","we":["低白蛋白血症（降低膠體滲透壓）是腹水的直接原因，有關，錯誤（不選此項）。","高膽固醇血症（hypercholesterolemia）與肝臟腹水關聯性最弱，此為正確答案（較無關）。","門脈高壓（portal hypertension）是肝性腹水的重要機制，有關，錯誤（不選此項）。","淋巴管阻塞影響液體回流，與腹水有關，錯誤（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_053","year":2016,"roc_year":105,"session":"","examNo":53,"q":"貓因緊迫長期（大於2週）食慾減退時，最容易發生的疾病為下列何項？","opts":["A. diabetes mellitus","B. renal failure","C. FLUTD（feline lower urinary track disease）","D. hepatic lipidosis"],"ans":3,"exp":"貓長期食慾減退（chronic anorexia）最容易繼發的疾病：貓是專性肉食性動物，脂肪動員依賴特殊代謝路徑。長期不進食時，大量脂肪酸動員進入肝臟，超過肝臟的代謝能力，脂肪在肝細胞內蓄積，形成肝脂肪症（hepatic lipidosis，脂肪肝），這是貓特有且最嚴重的繼發疾病。","we":["腎功能不全在長期食慾減退中可能發生，但不如脂肪肝常見，錯誤。","胰腺炎可能是原因，也可能繼發，但不如脂肪肝在貓中特異，錯誤。","甲狀腺功能亢進在老年貓常見，但與長期食慾減退無直接繼發關係，錯誤。","肝脂肪症（hepatic lipidosis）是貓長期不進食後最容易發生的特異性疾病，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_054","year":2016,"roc_year":105,"session":"","examNo":54,"q":"犬子宮蓄膿症最重要的因子，除動情素和細菌外，尚有下列何項？","opts":["A. 泌乳素","B. 雄性素","C. 助孕素","D. 濾泡刺激素"],"ans":2,"exp":"犬子宮蓄膿症（pyometra）的發病機制：黃體素（progesterone）刺激子宮內膜腺體分泌（子宮腺囊增生），抑制子宮免疫功能（降低中性球吞噬功能），使細菌（主要是大腸桿菌）易於定植和繁殖。除了estrogen（誘發黃體素受體）和細菌因素，黃體素（progestogen/progesterone）是最重要的促發因子。","we":["雌激素（estrogen）誘導子宮內膜增生，但黃體素更重要，此選項不如C完整。","細菌感染是直接原因，但需要黃體素的作用條件，此選項不如C完整。","助孕素（progestogen/黃體素）創造了有利於細菌繁殖的子宮環境，是最重要的因子，此為正確答案。","年齡因素是危險因子，但非最重要的促發因子，此選項不如C重要。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_055","year":2016,"roc_year":105,"session":"","examNo":55,"q":"犬除頭部外有全身性脫毛，並且有黑色素增加現象，除皮膚問題之外，精神食慾都正常，其最可能罹患下列何項疾病？","opts":["A. hyperadrenocorticism","B. hypothyroidism","C. alopecia X","D. hyperthyroidism"],"ans":2,"exp":"犬全身脫毛（alopecia）加上黑色素增加（hyperpigmentation）但精神食慾正常（無全身性症狀）的鑑別診斷：Alopecia X（又稱生長激素反應性皮膚病、皮毛循環停止）是一種病因不明的脫毛症，主要見於Nordic breeds（北歐犬種），特徵是對稱性非炎症性脫毛、皮膚色素沉著，但全身狀況良好（精神食慾正常，無內分泌疾病）。","we":["甲狀腺功能低下引起脫毛，但常伴有精神沉鬱、體重增加等全身症狀，錯誤。","腎上腺皮質機能亢進（Cushing）引起脫毛，但常伴有多飲多尿、腹圍增大等系統症狀，錯誤。","Alopecia X的特徵是無系統症狀的對稱性脫毛伴色素沉著，精神食慾正常，此為正確答案。","性腺異常引起的脫毛通常有其他生殖系統症狀，此選項不如C符合題意。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_056","year":2016,"roc_year":105,"session":"","examNo":56,"q":"下列何種疾病會引發犬貓頸靜脈搏動？","opts":["A. 二尖瓣閉鎖不全","B. 三尖瓣閉鎖不全","C. 肥厚性心肌病","D. 擴張性心肌病"],"ans":1,"exp":"犬貓頸靜脈搏動（jugular vein pulsation）可見於：當右心壓力升高或右心充填受阻時，靜脈壓升高，頸靜脈可見明顯搏動。三尖瓣閉鎖不全（tricuspid valve insufficiency/regurgitation）使右心收縮時血液逆流回右心房和靜脈，造成明顯的頸靜脈搏動和靜脈怒張。","we":["二尖瓣閉鎖不全影響左心，不直接引起頸靜脈搏動，錯誤。","三尖瓣閉鎖不全引起右心收縮期血液逆流，造成頸靜脈搏動，此為正確答案。","主動脈瓣狹窄影響左心流出，不直接引起頸靜脈搏動，錯誤。","肺動脈瓣狹窄引起右心肥大，但頸靜脈搏動不如三尖瓣逆流典型，此選項不如B準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_057","year":2016,"roc_year":105,"session":"","examNo":57,"q":"下列何項為犬貓嚴重心肌病之臨床症狀？","opts":["A. 心臟擴大、鬱血性心衰竭、心律不整和突然死亡","B. 心臟萎縮、充血性心衰竭、心律不整和突然死亡","C. 心臟萎縮、腔靜脈症候群和絲球體性腎炎","D. 除頸靜脈搏動外，無顯著臨床症狀"],"ans":0,"exp":"嚴重心肌病（cardiomyopathy）的主要臨床症狀：心肌病（擴張型/肥厚型）的四大主要症狀為：（1）心臟擴大（cardiomegaly）、（2）鬱血性心臟衰竭（congestive heart failure, CHF）、（3）心律不整（arrhythmia）和（4）突然死亡（sudden death）。這些是心肌病最核心的臨床表現。","we":["心臟擴大、鬱血性心衰竭、心律不整和突然死亡是心肌病的四大主要症狀，此為正確答案。","這些症狀是不完整的心肌病臨床表現，此選項不如A完整。","這些症狀不包括心肌病的所有主要表現，此選項不如A完整。","這些症狀缺少心肌病的核心表現，此選項不如A完整。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_058","year":2016,"roc_year":105,"session":"","examNo":58,"q":"下圖為貓頸靜脈之特徵，該貓最可能罹患的疾病為下列何項？","opts":["A. right-sided congestive heart failure","B. hyperthyroidism","C. hypertrophic cardiomyopathy","D. restrictive cardiomyopathy"],"ans":0,"exp":"此題為圖像題，需要確認貓頸靜脈搏動的特徵圖像。頸靜脈搏動在右心疾病（如三尖瓣閉鎖不全、心包填塞、右心衰竭）時最為明顯。需要圖像才能準確判斷。","we":["頸靜脈搏動特徵的判斷需要結合圖像。","不同的搏動模式代表不同的心臟病變。","正確選項需要根據圖示的頸靜脈波形特徵判斷。","此題為圖像題，需要結合圖示選擇正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_059","year":2016,"roc_year":105,"session":"","examNo":59,"q":"肝門靜脈分流（portosystemic shunts）的敘述，下列何項錯誤？","opts":["A. 可分為肝內與肝外","B. 可能是先天性或後天性","C. 只會有一條分流","D. 腹部X光攝影可發現小肝症（microhepatica）"],"ans":2,"exp":"肝門靜脈分流（portosystemic shunt, PSS）的敘述：PSS可為先天性或後天性，可為單條（congenital extrahepatic或intrahepatic）或多條（acquired, secondary to portal hypertension）分流。「只會有一條分流」是錯誤的，後天性PSS因門脈高壓常引起多條側支循環（multiple acquired shunts）。","we":["先天性分流可為先天性，正確（不選此項）。","PSS可引起肝腦症，正確（不選此項）。","「只會有一條分流」是錯誤的（後天性PSS常有多條），此為正確答案（錯誤描述）。","治療可選手術結紮，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_060","year":2016,"roc_year":105,"session":"","examNo":60,"q":"下列何種犬種較不容易罹患銅蓄積性肝炎（hepatitis associated with copper accumulation）？","opts":["A. Doberman pinscher","B. Bedlington terrier","C. West highland white terrier","D. Shih tzu"],"ans":3,"exp":"銅蓄積性肝炎（copper storage hepatopathy）的高危品種：貝靈頓獵犬（Bedlington Terrier）、威爾斯激飛獵犬（Welsh Springer Spaniel）、達爾馬提亞（Dalmatian）、杜賓犬（Doberman Pinscher）是已知高危品種。西施犬（Shih tzu）不在已知高危品種之列，較不易罹患銅蓄積性肝炎。","we":["貝靈頓獵犬（Bedlington Terrier）是銅蓄積性肝炎最著名的高危品種，正確（不選此項）。","威爾斯激飛獵犬（Welsh Springer Spaniel）是高危品種，正確（不選此項）。","達爾馬提亞（Dalmatian）也是高危品種，正確（不選此項）。","西施犬（Shih tzu）不是銅蓄積性肝炎的高危品種，此為正確答案（較不罹患）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_061","year":2016,"roc_year":105,"session":"","examNo":61,"q":"犬貓胸腔食道穿孔，會繼發下列何項疾病？","opts":["A. 巨食道症","B. 膿胸","C. 食道橫膈膜裂口赫尼亞","D. 食道胃套疊"],"ans":1,"exp":"胸腔食道穿孔（thoracic esophageal perforation）最嚴重的繼發症：食道穿孔後，食物、細菌和消化液進入胸腔，引起膿胸（pyothorax/pleural empyema），這是一種嚴重的細菌性胸膜炎，需要胸腔沖洗引流和抗生素治療。","we":["縱隔炎（mediastinitis）也可繼發，但膿胸更常見且更嚴重，此選項不如B準確。","膿胸是胸腔食道穿孔最重要的繼發症，此為正確答案。","心包積液也可能，但不如膿胸常見，此選項不如B準確。","食道周圍膿瘍可能先發生，但最終導致膿胸，此選項不如B直接。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_062","year":2016,"roc_year":105,"session":"","examNo":62,"q":"下列何者為犬胸腔穿刺術之最佳穿刺位置？","opts":["A. 左胸壁第7或第8肋間，胸壁下1/3處之肋骨前緣","B. 左胸壁第7或第8肋間，胸壁下1/3處之肋骨後緣","C. 右胸壁第7或第8肋間，胸壁上1/3處之肋骨前緣","D. 右胸壁第7或第8肋間，胸壁上1/3處之肋骨後緣"],"ans":0,"exp":"犬胸腔穿刺術（thoracocentesis）的最佳位置：在左胸壁第7-8肋間，下1/3（胸腔腹側1/3），肋骨前緣（cranial edge of rib）進行穿刺，可避開肋間神經和血管（位於肋骨後緣），並在液體或氣體積聚最多的位置進行穿刺。","we":["左胸壁第7-8肋間，下1/3，肋骨前緣是最佳穿刺位置，此為正確答案。","右側穿刺位置與左側對稱，但傳統教學選左側為首選，此選項不如A準確。","上1/3位置適合氣胸，不適合液體穿刺，此選項不如A完整。","第4-5肋間位置偏前，不是標準穿刺位置，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_063","year":2016,"roc_year":105,"session":"","examNo":63,"q":"治療貓急性腎衰竭，若已形成過度水合（overhydration）但病畜仍無尿，則下列治療方式何者最不恰當？","opts":["A. 給與furosemide","B. 給與mannitol","C. 給與多巴胺dopamine","D. 增加輸液速度"],"ans":3,"exp":"貓急性腎衰竭（acute kidney injury/failure）過度水合（fluid overload）但仍無尿（anuria）的處理：在排除阻塞性原因後，已過度水合的無尿患者，最不恰當的處理是繼續增加輸液速度，這會加重肺水腫、胸腔積液等水合過度的症狀。此時應考慮利尿劑（furosemide）或腹膜透析（peritoneal dialysis）。","we":["給予furosemide利尿劑嘗試促進排尿是合理的，正確處理。","腹膜透析是嚴重腎衰竭無尿的選擇，合理。","評估是否需要透析是必要步驟，合理。","增加輸液速度在過度水合且無尿的情況下最不恰當（會加重肺水腫），此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_064","year":2016,"roc_year":105,"session":"","examNo":64,"q":"惡性腫瘤之高血鈣症是需要緊急處理的狀況，因此在未確診出高血鈣的原因之前，強烈禁止給與患畜下列何種藥物？","opts":["A. 利尿劑","B. 類固醇","C. ampicillin","D. 0.9% NaCl"],"ans":1,"exp":"惡性腫瘤引起的高血鈣症（hypercalcemia of malignancy）在確診前應禁止使用的藥物：類固醇（corticosteroids）應在確定高血鈣症原因前謹慎使用，因為類固醇可能掩蓋或干擾淋巴瘤（lymphoma）的診斷（類固醇使淋巴瘤細胞凋亡，影響組織病理學診斷結果）。在確診腫瘤之前，應先進行完整診斷再使用類固醇。","we":["生理食鹽水輸液有助於促進鈣排泄，是高血鈣症的初步治療，不禁止，錯誤。","類固醇在確診前應禁止使用（會干擾淋巴瘤診斷），此為正確答案。","降鈣素（calcitonin）是降低血鈣的治療藥物，不禁止，錯誤。","雙磷酸鹽（bisphosphonates）可降低血鈣，不禁止，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_065","year":2016,"roc_year":105,"session":"","examNo":65,"q":"貓疱疹病毒及貓杯狀病毒（feline calicivirus）所造成的呼吸道疾病，下列何者錯誤？","opts":["A. 杯狀病毒帶原貓會持續釋放致病性病毒","B. 會引起陣發性打噴嚏、結膜炎、眼鼻分泌物等症狀","C. 疱疹病毒帶原貓不會釋放致病性病毒","D. 傳染途徑主要藉由直接接觸感染"],"ans":2,"exp":"貓疱疹病毒（Feline Herpesvirus, FHV-1）和杯狀病毒（Feline Calicivirus, FCV）引起的上呼吸道疾病：FHV-1感染後，貓可成為終生帶原者，在應激（壓力）時病毒可再活化並向外釋放，帶原貓可釋放有致病性的病毒。因此「疱疹病毒帶原貓不會釋放致病性病毒」是錯誤的敘述。","we":["FHV-1和FCV均可引起上呼吸道疾病，正確（不選此項）。","FCV可引起口腔潰瘍，正確（不選此項）。","「疱疹病毒帶原貓不會釋放致病性病毒」是錯誤的（帶原貓在壓力下可再活化釋放病毒），此為正確答案。","疫苗接種可減輕症狀但不能完全預防感染，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_066","year":2016,"roc_year":105,"session":"","examNo":66,"q":"治療貓嗜酸性白血球過多性胃腸炎，應使用","opts":["A. 廣效性抗生素","B. 綜合維生素","C. 類固醇","D. 輸血"],"ans":2,"exp":"貓嗜酸性白血球過多性胃腸炎（eosinophilic gastroenteritis in cats）的主要治療：嗜酸性胃腸炎是免疫介導性疾病，主要治療是免疫抑制治療，首選類固醇（corticosteroids，如prednisolone）。類固醇可抑制嗜酸性球的增生和浸潤，有效控制疾病。","we":["抗生素對嗜酸性胃腸炎（免疫介導）效果有限，不是首選，錯誤。","驅蟲藥如果不是寄生蟲性嗜酸性胃腸炎，效果有限，不是主要治療，錯誤。","類固醇是嗜酸性白血球過多性胃腸炎的首選治療，此為正確答案。","飲食管理（排除飲食）也重要，但類固醇是主要藥物治療，此選項不如C準確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_067","year":2016,"roc_year":105,"session":"","examNo":67,"q":"不可能造成高血鈉的原因為","opts":["A. central diabetes insipidus","B. chronic renal failure","C. Addison's disease","D. mannitol infusion"],"ans":2,"exp":"Addison's disease（腎上腺皮質功能低下症）不可能引起高血鈉（hypernatremia）：Addison's disease因缺乏醛固酮（aldosterone），導致腎臟無法保鈉排鉀，造成低血鈉症（hyponatremia）和高血鉀症（hyperkalemia），而非高血鈉。其他可能引起高血鈉的原因包括：尿崩症（水分流失多於鈉）、高鈉液體輸液、腎病等。","we":["尿崩症（diabetes insipidus）因水分流失過多，可引起高血鈉，正確（不選此項）。","高鈉飲食/輸液可引起高血鈉，正確（不選此項）。","Addison's disease（腎上腺皮質功能低下）引起低血鈉，不可能造成高血鈉，此為正確答案。","腎源性高血鈉在特定腎功能障礙時可能，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_068","year":2016,"roc_year":105,"session":"","examNo":68,"q":"下列何項病原感染，會引發貓結膜角膜炎、鼻炎和氣管炎？","opts":["A. 貓疱疹病毒","B. 貓傳染性腹膜炎病毒","C. 貓免疫不全病毒","D. 貓白血病病毒"],"ans":0,"exp":"貓結膜炎、角膜炎、鼻炎、氣管炎（上呼吸道疾病綜合症）的主要病原：貓疱疹病毒（Feline Herpesvirus-1, FHV-1）是引起貓上呼吸道疾病（結膜炎、角膜炎、鼻炎）最重要的病原，可引起角膜樹枝狀潰瘍（dendritic ulcer）等特徵性眼部病變。","we":["貓疱疹病毒（FHV-1）引起結膜炎、角膜炎、鼻炎、氣管炎等，此為正確答案。","貓杯狀病毒（FCV）主要引起口腔潰瘍和輕度上呼吸道症狀，不引起角膜炎，錯誤。","貓披衣菌（Chlamydophila felis）主要引起結膜炎，不是角膜炎和氣管炎的主因，錯誤。","貓支氣管炎病毒引起下呼吸道疾病，不是上呼吸道的主因，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_069","year":2016,"roc_year":105,"session":"","examNo":69,"q":"下列何項與公貓會陰尿道造口術之失敗無關？","opts":["A. 術後未予導尿","B. 陰莖與骨盆骨、坐骨之連接組織未予澈底剝離","C. 陰莖部與骨盤部之尿道未予以精確地切開","D. 傷口縫合過緊"],"ans":0,"exp":"公貓會陰尿道造口術（perineal urethrostomy, PU）手術失敗的原因：包括術後尿道口狹窄（stricture）、手術技術失誤（造口太小或縫合方式不當）、感染等。「術後未予導尿」不是PU手術失敗的主要原因，PU手術的目的就是建立永久性尿道開口，不需要常規術後導尿。","we":["術後未予導尿與PU手術失敗無關（PU手術即建立永久開口），此為正確答案（無關因素）。","術後尿道口狹窄是PU失敗的重要原因，有關，錯誤（不選此項）。","手術技術缺失（造口太小）可導致失敗，有關，錯誤（不選此項）。","術後感染可影響手術成功率，有關，錯誤（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_070","year":2016,"roc_year":105,"session":"","examNo":70,"q":"下列方法中，何者最不適合用來治療犬的肝外門脈分流（extrahepatic portalsystemic shunts）？","opts":["A. ameroid constrictors","B. cellophane bands","C. ligation of shunts","D. partial lobectomy"],"ans":3,"exp":"犬肝外門脈分流（extrahepatic portosystemic shunt）的治療選擇：手術結紮分流血管（ameroid constrictor、hydraulic occluder、或直接結紮）是最有效的根治方法。Partial lobectomy（肝葉部分切除）是針對肝臟腫瘤或肝葉扭轉的手術，對門脈分流無治療效果，是最不適合的選擇。","we":["ameroid constrictor是肝外PSS的常用漸進結紮方法，適合，錯誤（不選此項）。","直接手術結紮是傳統治療方式，適合，錯誤（不選此項）。","醫療管理（飲食控制+乳果糖）可控制症狀，適合，錯誤（不選此項）。","Partial lobectomy對門脈分流無效（它不是肝臟問題），此為正確答案（最不適合）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_071","year":2016,"roc_year":105,"session":"","examNo":71,"q":"一隻10歲齡拉不拉多犬，股骨骨幹發生粉碎性骨折，會建議使用下列何種復位方法？","opts":["A. 骨內髓釘配合不銹鋼絲環紮法（intramedullary pin and cerclage wires）","B. 骨內髓釘配合骨板（bone plate）","C. Type I 骨外固定（external skeletal fixator）","D. Robert Jones繃帶包紮"],"ans":1,"exp":"10歲拉不拉多犬（老年大型犬）股骨粉碎骨折的最佳固定方式：對於老年大型犬的粉碎性骨折，需要強力固定。骨內髓釘（intramedullary pin）配合骨板（bone plate）提供軸向穩定性和旋轉穩定性，是複雜骨折的最佳固定方式，可促進骨癒合。","we":["單純骨板固定可能不足以處理嚴重粉碎骨折，此選項不如B完整。","骨內髓釘配合骨板提供最佳的骨折固定（軸向+旋轉穩定），此為正確答案。","單純外固定（夾板）對股骨粉碎骨折效果不佳，錯誤。","截肢是最後手段，對尚可治療的老年犬不是首選，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_072","year":2016,"roc_year":105,"session":"","examNo":72,"q":"犬的關節軟骨（articular cartilage）共可分為四層，下列何項組織最厚？","opts":["A. 表面層（superficial zone）","B. 過渡層（transitional zone）","C. 深層（deep zone）","D. 鈣化軟骨層（calcified cartilage zone）"],"ans":2,"exp":"關節軟骨（articular cartilage）的組織結構由表到深分為四層：（1）表面帶（superficial zone）、（2）過渡帶/中間帶（transitional/middle zone）、（3）深層（deep zone）、（4）鈣化帶（calcified zone）。軟骨最厚的一層是深層（deep zone），佔軟骨總厚度的最大比例。","we":["表面帶（superficial zone）最薄，主要承受剪切力，錯誤。","中間帶（transitional zone）厚度中等，不是最厚，錯誤。","深層（deep zone）是關節軟骨最厚的一層，佔40%以上，此為正確答案。","鈣化帶（calcified zone）在深層以下，非常薄，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_073","year":2016,"roc_year":105,"session":"","examNo":73,"q":"消化道的環肋骨胃固定術（circumcostal gastropexy），主要應用於下列何種疾病？","opts":["A. 腸套疊","B. 胃內異物","C. 胃擴張捻轉","D. 幽門狹窄"],"ans":2,"exp":"環肋骨胃固定術（circumcostal gastropexy）是預防和治療胃擴張捻轉（Gastric Dilatation-Volvulus, GDV）的外科方法，將胃幽門側的胃壁固定在最後一根肋骨上，使胃壁與腹壁之間形成永久性粘連，防止胃再次捻轉。這是大型深胸犬種的常用預防性手術。","we":["環肋骨胃固定術不是食道疾病的治療，錯誤。","此手術不用於腸套疊的治療，錯誤。","環肋骨胃固定術是治療和預防胃擴張捻轉（GDV）的手術，此為正確答案。","此手術不是脾臟疾病的治療，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_074","year":2016,"roc_year":105,"session":"","examNo":74,"q":"犬唾液囊腫（salivary mucocele）意指唾液自受損壞之唾液腺或導管漏出後，被肉芽組織圍繞而形成的含唾液囊樣團塊，以下\r 何種唾液囊腫最易引發呼吸困難和吞嚥困難？","opts":["A. cervical mucocele","B. sublingual mucocele","C. pharyngeal mucocele","D. zygomatic mucocele"],"ans":2,"exp":"唾液囊腫（salivary mucocele）中，最容易引起呼吸困難和吞嚥困難的類型是咽部唾液囊腫（pharyngeal mucocele）。咽部唾液囊腫位於咽部，壓迫氣道和食道，引起吸氣性呼吸困難、吞嚥困難和喘鳴，是唾液囊腫中緊急程度最高的類型。","we":["頸部唾液囊腫（cervical mucocele）引起頸部腫塊，較少直接影響呼吸，錯誤。","舌下唾液囊腫（sublingual mucocele/ranula）位於口底，影響吞嚥但不如咽部嚴重，錯誤。","咽部唾液囊腫（pharyngeal mucocele）位於咽喉，最容易引起呼吸困難和吞嚥困難，此為正確答案。","翼狀唾液囊腫（zygomatic mucocele）位於眼眶，不直接引起呼吸問題，錯誤。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_075","year":2016,"roc_year":105,"session":"","examNo":75,"q":"以下何者不是間斷縫合法？","opts":["A. Ford interlocking pattern","B. vertical mattress pattern","C. Gambee pattern","D. horizontal mattress pattern"],"ans":0,"exp":"間斷縫合法（interrupted suture patterns）包括：單純間斷縫合（simple interrupted）、垂直褥式縫合（vertical mattress）、水平褥式縫合（horizontal mattress）、十字縫合（cruciate）等。Ford interlocking pattern是一種連續縫合法（continuous pattern），不是間斷縫合法，通常用於腸管吻合等。","we":["Ford interlocking pattern是連續縫合法，不是間斷縫合法，此為正確答案（不是間斷縫合）。","垂直褥式縫合（vertical mattress）是間斷縫合法，錯誤（不選此項）。","水平褥式縫合（horizontal mattress）是間斷縫合法，錯誤（不選此項）。","十字縫合（cruciate）是間斷縫合法，錯誤（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_076","year":2016,"roc_year":105,"session":"","examNo":76,"q":"以下何者不是常用的無菌刷手液？","opts":["A. chlorhexidine gluconate","B. povidone-iodine","C. alcohol-based solutions","D. phenol-based solutions"],"ans":3,"exp":"常用無菌刷手液（surgical scrub solutions）：碘伏（povidone-iodine）、氯己定（chlorhexidine gluconate）是最常用的外科刷手液。苯酚基溶液（phenol-based solutions）是一種消毒劑，對皮膚刺激性強，對組織有毒性，不適合用於外科刷手，也不是常用的無菌刷手液。","we":["碘伏（povidone-iodine）是最常用的外科刷手液之一，正確（不選此項）。","氯己定（chlorhexidine）是另一種常用的外科刷手液，正確（不選此項）。","含酒精的手術消毒液也常用，正確（不選此項）。","苯酚基溶液（phenol-based）對組織有毒性，不適合外科刷手，此為正確答案（不是常用刷手液）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_077","year":2016,"roc_year":105,"session":"","examNo":77,"q":"以下有關縫線的敘述，何者正確？","opts":["A. Vicryl®（polyglactin 910）縫線之吸收通常比PDS（polydioxanone）縫線慢","B. 貓腸線（catgut），是以水解的方式被身體吸收","C. 2-0縫線比4-0縫線的口徑來得小","D. 多股絲線操作性良好，但組織反應大，不可用在污染和感染的傷口中"],"ans":3,"exp":"縫線（suture materials）特性：多股絲線（multifilament silk）的操作性（可操作性/手感）良好，打結牢固，但組織反應（tissue reaction）較大（屬非吸收性多股縫線，易引起慢性炎症），且因毛細管效應（wick effect）可能導致感染擴散，因此不適合用於污染或感染的傷口。此描述正確。","we":["此縫線描述不夠準確，錯誤（不選此項）。","此縫線描述有誤，錯誤（不選此項）。","此縫線描述不完整或有誤，錯誤（不選此項）。","多股絲線操作性良好但組織反應大、不可用於污染感染傷口的描述正確，此為正確答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_078","year":2016,"roc_year":105,"session":"","examNo":78,"q":"外科手術的麻醉過程中，下列那一種情形，最不會引起呼吸過快？","opts":["A. 血液中含氧量過低","B. 手術中平均動脈壓過高","C. 體溫過高","D. 術後的疼痛"],"ans":1,"exp":"麻醉中可能引起呼吸過快（tachypnea）的原因：高碳酸血症（hypercapnia/CO2升高）、低氧血症（hypoxemia）、疼痛刺激、麻醉過淺、代謝性酸中毒等。手術中平均動脈壓（mean arterial pressure, MAP）過高本身不是引起呼吸過快的直接原因（MAP過高更多引起心血管反射），因此最不會直接引起呼吸過快。","we":["低氧血症引起代償性過度換氣，可引起呼吸過快，正確（不選此項）。","手術中MAP過高不是引起呼吸過快的直接原因，此為正確答案（最不會引起）。","疼痛刺激可引起呼吸過快，正確（不選此項）。","高碳酸血症是引起呼吸過快的重要原因，正確（不選此項）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2016_2_普通病_079","year":2016,"roc_year":105,"session":"","examNo":79,"q":"造成此匹馬疝痛最可能為","opts":["A. 小腸捻轉","B. 大腸捻轉","C. 大腸阻塞","D. 結腸右背側異位（right dorsal displacement of the colon）"],"ans":0,"exp":"此題為馬疝痛（equine colic）原因圖像題，需要根據圖示判斷引起疝痛的具體解剖原因。馬疝痛可由大腸便秘（large colon impaction）、腸套疊（intussusception）、腸扭轉（volvulus）、小腸套疊、沙疝（sand colic）等引起。需要圖像才能準確判斷。","we":["此題需要結合圖示判斷疝痛的原因。","不同的圖示特徵對應不同的疝痛病因。","正確選項需要根據圖示的解剖異常特徵判斷。","此題為圖像題，需要結合圖示選擇正確答案。"],"needs_review":true,"imgs":[]},{"id":"AMO_2016_2_普通病_080","year":2016,"roc_year":105,"session":"","examNo":80,"q":"承上題，此時下列何者為最適合的治療方式？","opts":["A. 給與礦物油及止痛藥","B. 為消化道感染，給與抗生素","C. 立即自腹部左側施行放氣術","D. 給與流質食物"],"ans":0,"exp":"此題為承接Q79的後續題，詢問馬疝痛（承上圖）的治療方案。治療選擇根據疝痛原因不同而異：若為便秘（impaction）→內科治療（輸液+石蠟油）；若為扭轉/套疊→手術治療；若為小結腸阻塞→手術或保守治療。需要結合Q79的圖像確認病因後才能判斷正確治療。","we":["治療方案需要結合Q79的圖像確認病因。","不同病因的疝痛有不同的最佳治療選擇。","正確治療選項依賴於對Q79圖像的正確判讀。","此題為連續圖像題，需要結合Q79的圖示一起判讀。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1_普通病_001","year":2017,"roc_year":106,"session":"","examNo":1,"q":"一匹灰色老馬於其尾根之腹側面可見多顆球節樣凸起（nodular），觸感堅實，此匹馬最可能罹患下列何項疾病？","opts":["A. sarcoid","B. melanoma","C. cutaneous lymphoma","D. papilloma"],"ans":1,"exp":"灰色馬（grey horse）是黑色素瘤（melanoma）的好發品種，尤其老年灰馬80%以上患有melanoma。最常發生在肛門周圍、尾根腹側、外陰部，呈多顆堅實的結節狀凸起，外觀即如描述。","we":["Sarcoid（肉瘤）是馬最常見的皮膚腫瘤，但好發在四肢、頭部，不特別集中在尾根腹側。","Melanoma（黑色素瘤）是灰色老馬尾根腹側多顆堅實結節的典型診斷，正確。","Cutaneous lymphoma（皮膚淋巴瘤）在馬較罕見，不以此部位為主。","Papilloma（乳頭瘤）在年輕馬較多見，呈乳頭狀而非堅實球節狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_002","year":2017,"roc_year":106,"session":"","examNo":2,"q":"一匹馬飼養在多沙的環境中，因長時間食入沙子使沙沉積在消化道中，造成消化道不適，下列何者為最不常見的臨床症狀？","opts":["A. 下痢","B. 慢性，輕微疝痛","C. 排便量減少","D. 胃潰瘍"],"ans":3,"exp":"馬在多沙環境長期食入沙子，沙積聚在大腸（主要是大結腸/右背結腸），典型表現：沙性疝痛（sand colic）、慢性輕微疝痛、下痢（sandy diarrhea）、排便量減少。胃潰瘍主要因應激和NSAIDs引起，與沙積聚無直接關係，是最不常見的表現。","we":["下痢（diarrhea）是沙性腸病的典型表現（沙刺激腸黏膜），正確。","慢性輕微疝痛是沙積聚最常見的臨床表現，正確。","排便量減少因沙積聚影響正常腸道功能，正確。","胃潰瘍是馬沙性腸病最不常見的表現，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_003","year":2017,"roc_year":106,"session":"","examNo":3,"q":"下列何者不是造成馬匹慢性消瘦的原因？","opts":["A. 復發性氣道阻塞（recurrent airway obstruction）","B. 運動引發之肺出血（exercise-induced pulmonary hemorrhage）","C. 長期疼痛","D. 慢性下痢"],"ans":1,"exp":"運動引發之肺出血（EIPH，Exercise-Induced Pulmonary Hemorrhage）雖然在賽馬常見，但主要造成運動表現下降，不直接引起慢性消瘦。慢性消瘦的原因：慢性下痢（吸收不良）、長期疼痛（代謝消耗增加）、RAO（慢性呼吸困難消耗能量）等。","we":["復發性氣道阻塞（RAO/heaves）造成慢性呼吸困難，增加能量消耗，可引起消瘦，正確。","EIPH主要影響賽馬運動表現，不直接引起慢性消瘦，此項錯誤為答案。","長期疼痛（如慢性跛行）增加代謝消耗，可引起消瘦，正確。","慢性下痢造成營養吸收不良，直接引起消瘦，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_004","year":2017,"roc_year":106,"session":"","examNo":4,"q":"關於馬之近端小腸炎（proximal enteritis），下列敘述何者錯誤？","opts":["A. 造成胃擴張（gastric distention）","B. 產生代謝性酸血症","C. 止痛藥應可控制其疼痛症狀","D. 需儘快以外科開腹處理"],"ans":3,"exp":"馬近端小腸炎（proximal enteritis/duodenitis-proximal jejunitis）以內科治療為主：鼻胃管減壓（nasogastric decompression）、靜脈輸液、止痛。疼痛通常可被止痛藥控制（C正確），且此病為內科病，不需要也不應輕易進行外科開腹。","we":["近端小腸炎確實造成小腸液滯留→胃擴張（gastric distention），正確。","液體和電解質流失→代謝性酸血症，正確。","止痛藥（flunixin meglumine等）通常可控制疼痛，正確。","近端小腸炎是內科疾病，不需要也不應輕易外科開腹，此項錯誤為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_005","year":2017,"roc_year":106,"session":"","examNo":5,"q":"在馬掌骨近端處（proximal metacarpus）其肌腱韌帶自背側（dorsal）至掌側（palmar）的排序為何？ ①淺屈肌肌腱\r （superficial digital flexor tendon） ②深屈肌肌腱（deep digital flexor tendon） ③副韌帶［accessory（carpal check）\r ligament］ ④懸韌帶（suspensory ligament）","opts":["A. ①②③④","B. ②①④③","C. ④③②①","D. ③④②①"],"ans":2,"exp":"馬掌骨近端由背側至掌側的解剖排列：懸韌帶（④suspensory ligament）緊貼掌側骨皮質→副韌帶（③accessory/carpal check ligament）→深屈肌腱（②DDFT）→淺屈肌腱（①SDFT，最掌側/最表淺）。","we":["①②③④順序完全錯誤，淺屈肌腱不在最背側。","②①④③順序不符合解剖位置。","④③②①：懸韌帶→副韌帶→深屈肌腱→淺屈肌腱，正確為答案。","③④②①順序不符合解剖位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_006","year":2017,"roc_year":106,"session":"","examNo":6,"q":"下列何種中毒較不易引起牛皮膚炎？","opts":["A. 汞中毒","B. 碘中毒","C. 砷中毒","D. 氟中毒"],"ans":3,"exp":"汞（Hg）、碘（I）、砷（As）中毒均可引起牛皮膚炎。氟中毒（fluorosis）主要影響骨骼（骨硬化、骨膜炎）和牙齒（氟斑牙、牙釉質缺損），以皮膚炎為主要表現較不常見。","we":["汞中毒可引起皮膚炎和黏膜炎症，正確。","碘中毒（iodism）可引起皮膚損害，正確。","砷中毒可引起皮膚角化過度和皮炎，正確。","氟中毒主要引起骨骼和牙齒問題，不以皮膚炎著名，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_007","year":2017,"roc_year":106,"session":"","examNo":7,"q":"下列發生於蹄底與蹄壁交界處，且會垂直向上感染的牛蹄部疾病為何？","opts":["A. 蹄底潰瘍","B. 疣狀皮膚炎","C. 白線病","D. 慢性壞死性蹄真皮炎"],"ans":2,"exp":"白線病（white line disease）發生在蹄底與蹄壁交界的白線區域（stratum lamellatum），細菌（Fusobacterium necrophorum等）沿白線缺損垂直向上蔓延，可進入蹄葉組織甚至感染蹄冠。","we":["蹄底潰瘍（sole ulcer）發生在蹄底，不在蹄壁交界，不以垂直向上感染著名。","疣狀皮膚炎（digital dermatitis，Mortellaro disease）發生在蹄球部皮膚，不在蹄底與蹄壁交界。","白線病（white line disease）發生在蹄底與蹄壁交界，向上垂直蔓延，正確。","慢性壞死性蹄真皮炎（chronic necrotic pododermatitis）範圍較廣，不特別在白線。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_008","year":2017,"roc_year":106,"session":"","examNo":8,"q":"下列有關於牛羊呼吸道治療的三大原則，何者錯誤？","opts":["A. 愈早期治療愈好","B. 足夠的治療時間","C. 使用適當的抗微生物製劑","D. 使用適當的類固醇類製劑"],"ans":3,"exp":"牛羊呼吸道疾病治療三大原則：①早期治療、②足夠的治療時間（至少5-7天）、③使用適當的抗微生物製劑。類固醇不是三大原則之一，且不當使用類固醇有免疫抑制風險，不適合作為常規治療原則。","we":["愈早期治療愈好是三大原則之一，正確。","足夠的治療時間是三大原則之一，正確。","使用適當的抗微生物製劑是三大原則之一，正確。","使用類固醇不是牛羊呼吸道治療的三大原則，此項錯誤為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_009","year":2017,"roc_year":106,"session":"","examNo":9,"q":"下列何者不是牛盲腸擴張症之主要症狀？","opts":["A. 疝痛，後肢踢腹部","B. 右側假肋至脇部ping test 呈金屬音","C. 代償性低血氯及低血鉀症","D. 右側9－12肋間中三分之一處ping test 呈圓狀區域金屬音"],"ans":2,"exp":"牛盲腸擴張症（cecal dilatation/torsion）的主要症狀：右後腹疝痛、右側假肋至脇部聽叩診金屬音（半環狀，位於右側9-12肋間）、排便減少。代償性低血氯及低血鉀（hypochloremic hypokalemic metabolic alkalosis）是皺胃阻塞/捻轉的電解質改變，不是盲腸擴張的主要症狀。","we":["疝痛後肢踢腹部是盲腸擴張的疼痛表現，正確。","右側假肋至脇部ping test金屬音是盲腸擴張的聽診特徵，正確。","代償性低血氯及低血鉀是皺胃阻塞的電解質變化，非盲腸擴張的主要特徵，此項錯誤為答案。","右側9-12肋間中1/3處ping test呈圓狀金屬音是盲腸擴張的典型聽診，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_010","year":2017,"roc_year":106,"session":"","examNo":10,"q":"牛發生下列何種疾病時，血液檢查會以直接型膽紅素增加為主之黃疸出現？","opts":["A. 膽管阻塞","B. 小牛水中毒","C. 新生仔畜黃疸","D. 牛產褥性血紅素尿"],"ans":0,"exp":"直接型膽紅素（結合型膽紅素，conjugated bilirubin）增加為主的黃疸 = 肝後性（post-hepatic/obstructive）黃疸。膽管阻塞（如膽石、腫瘤、膽管炎）阻礙膽汁流入腸道，結合型膽紅素反流入血，血中直接膽紅素升高。","we":["膽管阻塞→結合型膽紅素無法排出→直接型膽紅素升高，正確。","小牛水中毒→溶血→間接型（未結合型）膽紅素升高為主。","新生仔畜黃疸→溶血或生理性→間接型膽紅素為主。","牛產褥性血紅素尿→血管內溶血→間接型膽紅素升高為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_011","year":2017,"roc_year":106,"session":"","examNo":11,"q":"下列那一種乳牛乳房炎病原菌，最易引起全身性症狀（如發熱）？","opts":["A. 異乳鏈球菌（Streptococcus dysgalactiae）","B. 腸道菌群（coliforms）","C. 乳房鏈球菌（Streptococcus uberis）","D. 凝固酶陰性葡萄球菌（coagulase-negative Staphylococci）"],"ans":1,"exp":"腸道菌群（coliforms，主要是大腸桿菌E. coli）引起急性嚴重乳房炎時，因G(-)菌產生大量內毒素（LPS/endotoxin），觸發全身性炎症反應，最容易引起發燒、毒血症、休克等全身性症狀。","we":["異乳鏈球菌（S. dysgalactiae）引起溫和至中度乳房炎，全身症狀較少。","腸道菌群（coliforms）因內毒素引起最嚴重的全身性症狀，正確。","乳房鏈球菌（S. uberis）引起局部乳房炎，全身症狀較輕。","凝固酶陰性葡萄球菌（CNS）通常引起輕微亞臨床乳房炎，全身症狀極少。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_012","year":2017,"roc_year":106,"session":"","examNo":12,"q":"下列乳牛乳房炎的病原菌種類中，何者最常造成壞疽性（gangrenous）乳房炎？","opts":["A. 無乳鏈球菌（Streptococcus agalactiae）","B. 化膿隱密桿菌（Arcanobacterium pyogenes）","C. 牛黴漿菌（Mycoplasma bovis）","D. 金黃色葡萄球菌（Staphylococcus aureus）"],"ans":3,"exp":"金黃色葡萄球菌（S. aureus）分泌α毒素（alpha toxin）等血管壞死性毒素，造成乳房血管血栓和組織壞死，是引起壞疽性乳房炎（gangrenous mastitis）最常見的病原菌。","we":["無乳鏈球菌（S. agalactiae）引起慢性隱性乳房炎，不以壞疽性著名。","化膿隱密桿菌（A. pyogenes）引起化膿性乳房炎，但不是壞疽性的主要病原。","牛黴漿菌（M. bovis）引起難治性乳房炎，不以壞疽性著名。","金黃色葡萄球菌分泌毒素引起血管栓塞和組織壞死，是壞疽性乳房炎最常見病原，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_013","year":2017,"roc_year":106,"session":"","examNo":13,"q":"下列微生物中，何者為蒼蠅叮咬感染乳牛乳頭末端並且為女牛（heifer）乳房炎之主要病因？","opts":["A. 凝固酶陰性葡萄球菌（coagulase-negative Staphylococci）","B. 金黃色葡萄球菌（Staphylococcus aureus）","C. 腸道菌群（coliforms）","D. 牛黴漿菌（Mycoplasma bovis）"],"ans":0,"exp":"凝固酶陰性葡萄球菌（CNS，coagulase-negative Staphylococci）主要通過蒼蠅叮咬（fly-borne transmission）傳播感染乳頭末端，是年輕未產牛（heifer）乳房炎最重要的病原，在乾乳期感染率較高。","we":["凝固酶陰性葡萄球菌通過蒼蠅叮咬傳播，是女牛乳房炎的主要病原，正確。","金黃色葡萄球菌也可由蒼蠅傳播，但不是女牛乳房炎最主要病原（主要在泌乳中期）。","腸道菌群主要在圍產期環境性感染，非蒼蠅叮咬傳播為主。","牛黴漿菌通過擠乳機器具傳播，非蒼蠅叮咬為主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_014","year":2017,"roc_year":106,"session":"","examNo":14,"q":"若懷疑牛隻有皺胃左側異位，在實施ping test時，聽筒應放置在下列那一位置較為恰當？","opts":["A. 左側第4－6肋間上1/3至中央處","B. 左側第4－6肋間下1/3至中央處","C. 左側第7－8肋間上1/3至中央處","D. 左側第9－12肋間上1/3至中央處"],"ans":3,"exp":"皺胃左側異位（LDA）的聽診位置：左側第9-12肋間（或最後肋骨前），上1/3至中央處進行ping test（叩擊+聽診），可聽到高音調金屬音（ping），代表皺胃積氣的位置。","we":["左側第4-6肋間是心臟聽診區，不是LDA的ping test位置。","左側第4-6肋間下方也不是LDA的位置。","左側第7-8肋間偏前，不是LDA的典型ping位置。","左側第9-12肋間上1/3至中央處是LDA ping test的正確位置，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_015","year":2017,"roc_year":106,"session":"","examNo":15,"q":"下列何者為創傷性心囊炎造成頸靜脈怒張之原因？","opts":["A. 心搏過速","B. 心囊滲出液壓迫心臟和血管","C. 胸水增加壓迫心臟和血管","D. 呼吸過快"],"ans":1,"exp":"創傷性心囊炎（traumatic pericarditis）因異物穿刺引起心囊大量滲出液積聚，心囊填塞（cardiac tamponade）→心室舒張受限→靜脈回流障礙→頸靜脈壓力升高→頸靜脈怒張。","we":["心搏過速是心囊炎的代償反應，但不是頸靜脈怒張的直接原因。","心囊滲出液壓迫心臟和血管→靜脈回流受阻→頸靜脈怒張，正確。","胸水可能同時存在，但創傷性心囊炎造成頸靜脈怒張的主因是心囊填塞。","呼吸過快是代償反應，不是頸靜脈怒張的原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_016","year":2017,"roc_year":106,"session":"","examNo":16,"q":"牛心囊炎之病因，以下列何者最常見？","opts":["A. 瘤胃酸中毒症","B. 臍帶感染","C. 創傷性蜂巢胃炎","D. 瘤胃鹼中毒症"],"ans":2,"exp":"牛心囊炎最常見的病因是創傷性蜂巢胃炎（traumatic reticulitis）延伸，金屬異物（鐵釘、鐵絲）從網胃穿孔，穿過橫膈進入心囊，引起創傷性心囊炎（traumatic pericarditis）。","we":["瘤胃酸中毒不直接引起心囊炎。","臍帶感染可引起全身性感染，但不是心囊炎的常見原因。","創傷性蜂巢胃炎→金屬異物穿刺→心囊炎，是牛心囊炎最常見原因，正確。","瘤胃鹼中毒不引起心囊炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_017","year":2017,"roc_year":106,"session":"","examNo":17,"q":"正常飼糧牛隻的正常尿液為下列何種性狀？","opts":["A. 微酸性","B. 中性","C. 微鹼性","D. 強鹼性"],"ans":2,"exp":"牛是草食動物，攝食植物性飼料，在消化道細菌作用下產生大量鹼性物質（碳酸鹽、有機酸鹽），代謝後尿液呈弱鹼性，正常pH約7.4-8.5。","we":["微酸性是肉食動物的尿液性狀。","中性不是草食牛隻的典型尿液特徵。","微鹼性是正常飼糧牛隻尿液的性狀，正確。","強鹼性超出正常範圍，可能見於某些病理狀況。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_018","year":2017,"roc_year":106,"session":"","examNo":18,"q":"下列何者是牛瘤胃角化不全症之主要原因？","opts":["A. 精料過多而粗料不足","B. 精料不足而粗料過多","C. 維生素E過多","D. 維生素D過多"],"ans":0,"exp":"瘤胃角化不全症（rumen parakeratosis）的主要原因是高精料低粗料飼糧（high concentrate, low roughage diet），造成揮發性脂肪酸（特別是丁酸）過量生成，持續刺激瘤胃乳頭，導致乳頭角化不全、融合、功能損傷。","we":["精料過多粗料不足→瘤胃角化不全症的主要原因，正確。","精料不足粗料過多反而保護瘤胃，不引起角化不全。","維生素E與角化不全無直接關係。","維生素D與角化不全無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_019","year":2017,"roc_year":106,"session":"","examNo":19,"q":"下列何者不是牛大腦皮質壞死症之主要症狀？","opts":["A. 泡沫性流涎","B. 後弓反張","C. 瞳孔反射減弱","D. 蛋白尿"],"ans":3,"exp":"牛大腦皮質壞死症（PEM/CCN，polioencephalomalacia）因硫胺素（維生素B1）缺乏引起，主要神經症狀：後弓反張（opisthotonus）、失明、瞳孔反應減弱、眼球震顫、轉圈。蛋白尿是腎臟疾病的指標，不是PEM的症狀。","we":["泡沫性流涎（frothy salivation）可在PEM發作時出現，正確。","後弓反張（opisthotonus）是PEM的典型神經症狀，正確。","瞳孔反射減弱（因大腦皮質損傷）是PEM的表現，正確。","蛋白尿是腎臟疾病的表現，不是神經性PEM的症狀，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_020","year":2017,"roc_year":106,"session":"","examNo":20,"q":"牛缺乏維生素A時不會出現下列何者？","opts":["A. 夜盲症","B. 中樞神經症狀","C. 尿石症","D. 血液凝固不全"],"ans":3,"exp":"維生素A缺乏：夜盲症（rhodopsin合成減少）、中樞神經症狀（脊髓液壓力增加，視神經壓迫）、尿石症（尿路上皮角質化）、繁殖障礙。血液凝固不全（凝血障礙）是維生素K缺乏的表現，不是維生素A缺乏的症狀。","we":["夜盲症是維生素A缺乏的典型表現，正確。","中樞神經症狀（顱內壓增加）是維生素A缺乏的表現，正確。","尿石症（urolithiasis）與維生素A缺乏造成的尿路上皮角質化有關，正確。","血液凝固不全是維生素K缺乏，非維生素A缺乏，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_021","year":2017,"roc_year":106,"session":"","examNo":21,"q":"下列那一項因素最常於現場造成乳牛乳頭管窄緊（tight streak canal），因而擠乳時出現乳流量下降？","opts":["A. 被其他牛踩傷","B. 被自己踩傷","C. 擠乳機性能不良","D. 擠乳藥浴試劑濃度不良"],"ans":2,"exp":"現場造成乳牛乳頭管窄緊（tight streak canal）最常見的原因是擠乳機性能不良（milking machine malfunction），包括真空壓力不穩定、過度擠乳等，長期機械性刺傷造成乳頭管過度角化和狹窄。","we":["被其他牛踩傷可能造成乳頭損傷，但不是最常見原因。","被自己踩傷較為罕見。","擠乳機性能不良是最常見原因（機械性損傷造成乳頭管角化），正確。","擠乳藥浴試劑濃度不良引起皮膚刺激，但不是乳頭管窄緊的最主要原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_022","year":2017,"roc_year":106,"session":"","examNo":22,"q":"以帝王切開術進行牛的剖腹產時，下列那一種縫合子宮創口的方法最可以避免子宮沾粘以及提供最好的再懷孕率？","opts":["A. Conell suture","B. Cushing suture","C. Utrecht suture","D. Simple continuous suture"],"ans":2,"exp":"Utrecht method（Utrecht suture）是牛帝王切開術縫合子宮的標準方法，採用兩層縫合（先Cushing後Lembert，或先內翻後包埋），使縫合面朝內，最大限度減少子宮漿膜面的縫合材料暴露，降低沾粘發生率，提高再懷孕率。","we":["Connell suture是貫穿縫合法，縫線暴露於子宮腔，較易沾粘。","Cushing suture是內翻縫合，可作為第一層，但單獨使用不如Utrecht完整。","Utrecht suture（兩層內翻縫合）最能避免子宮沾粘，提供最好的再懷孕率，正確。","Simple continuous suture（連續縫合）穿透子宮壁，容易引起沾粘。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_023","year":2017,"roc_year":106,"session":"","examNo":23,"q":"牛開腹手術前施行之脊椎旁阻斷（paravertebral block）麻醉方式主要麻醉下列那幾條神經？","opts":["A. 第12及13胸神經、第1腰神經","B. 第13胸神經、第1及2腰神經","C. 第1、2及3腰神經","D. 第2、3及4腰神經"],"ans":1,"exp":"牛脊椎旁阻斷麻醉（paravertebral block）主要麻醉：第13胸神經（T13）、第1腰神經（L1）、第2腰神經（L2），共三條神經，用於左側或右側腹脇切開手術。","we":["第12及13胸神經+第1腰神經：T12包括在內是常見混淆，標準是T13、L1、L2。","第13胸神經+第1及2腰神經（T13、L1、L2）是paravertebral block的正確描述，正確。","第1、2及3腰神經（L1、L2、L3）遺漏了T13，不正確。","第2、3及4腰神經位置太後，不是腹脇切開手術麻醉部位。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_024","year":2017,"roc_year":106,"session":"","examNo":24,"q":"下列何者為用腹側近中線皺胃固定術（ventral paramedian abomasopexy）治療乳牛第四胃異位的最主要缺點？","opts":["A. 容易發生腹膜炎","B. 不能施行於牧場中","C. 需要較多人手幫忙","D. 需要全身麻醉"],"ans":3,"exp":"Ventral paramedian abomasopexy（腹側旁正中皺胃固定術）的最主要缺點是需要全身麻醉（general anesthesia）並將牛置於背位（dorsal recumbency），無法在牧場現場輕易進行，且全身麻醉風險較高。","we":["腹膜炎風險不比其他術式高。","雖然需要特殊設備，但非「無法施行於牧場中」的絕對限制。","人手需求與其他術式相當。","需要全身麻醉是此術式的最主要缺點，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_025","year":2017,"roc_year":106,"session":"","examNo":25,"q":"下列有關牛隻去角手術的敘述，何者正確？","opts":["A. 以線鋸來鋸角會造成嚴重的出血","B. 鋸角的位置離角基處越遠越好","C. 美容式去角（cosmetic dehorning）必須要有足夠的皮膚進行縫合","D. 成年乳牛的去角多行美容式去角（cosmetic dehorning）"],"ans":2,"exp":"美容式去角（cosmetic dehorning）需要在角基周圍預留足夠的皮膚（sufficient skin flap），以便手術後進行一期（primary）縫合關閉，否則無法進行此美容術式。","we":["線鋸去角不會造成「嚴重出血」（主要靠cornual artery結紮控制），A說法有誤。","鋸角位置應盡量靠近角基（越近越好），遠離角基反而出血多，B說法錯誤。","美容式去角必須有足夠的皮膚進行縫合，是此術式的技術要求，正確。","成年乳牛的去角通常使用線鋸或開放式去角，「多行美容式」不正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_026","year":2017,"roc_year":106,"session":"","examNo":26,"q":"Toggle pin應用於治療乳牛皺胃異位之敘述，何者錯誤？","opts":["A. 於病牛左側及右側腹壁均可藉聽叩診得到高調金屬音（pings）時施行pin之植入","B. 此法進行時，必須倒牛並使病牛背側臥（dorsal recumbency）","C. 皺胃與左腹壁粘連時，無法應用此法","D. 病牛皺胃積氣飽足時，矯正及固定皺胃效果較好"],"ans":0,"exp":"Toggle pin（Grymer & Sterner法）用於治療LDA：需要先聽到左側ping確認LDA，將牛滾動至背臥位後，確認腹側（非「左側及右側」兩側）都有ping，再植入pins。說「左側及右側腹壁均可聽到pings時施行」混淆了方向——應確認腹側中線（ventral midline）位置，而非特別強調兩側。","we":["「左側及右側均有pings時施行」描述有誤，應確認腹側midline位置，此項有錯誤為答案。","背側臥（dorsal recumbency）是Toggle pin的必要姿勢，正確。","皺胃與左腹壁粘連時，toggle pin無效，正確。","皺胃積氣飽足時，pins植入效果較好，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_027","year":2017,"roc_year":106,"session":"","examNo":27,"q":"以右脇腹壁切開來治療牛第四胃左側異位時，經數次均無法有效矯正第四胃回到正常位置，其最可能之原因為何？","opts":["A. 瘤胃內容物過多過重，使第四胃沒有空間矯正回來","B. 第四胃有捻轉","C. 第四胃與其他臟器粘連","D. 沒有完全將第四胃內氣體排放乾淨"],"ans":2,"exp":"右脇腹壁切開治療LDA時，若多次均無法矯正皺胃，最可能是皺胃與其他臟器（如腹膜、大網膜、網胃）發生粘連（adhesion），使其無法自由移動回正常位置。","we":["瘤胃內容物影響腹腔空間，但不直接阻止皺胃矯正。","第四胃捻轉在右脇切開後可以直接識別並矯正，而非「無法矯正」。","粘連（adhesion）是最常見的無法矯正原因，正確。","氣體排放不乾淨可能影響操作，但不是多次均無法矯正的主因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_028","year":2017,"roc_year":106,"session":"","examNo":28,"q":"利用抗微生物製劑治療山羊肺炎時，一個治療療程至少應為幾天？","opts":["A. 1天","B. 3天","C. 7天","D. 9天"],"ans":2,"exp":"山羊/牛羊呼吸道疾病（CRD/CCPP等）的抗微生物製劑療程，最短應持續至少7天，不足夠的療程容易導致復發和產生抗藥性。","we":["1天治療遠不足夠，會復發。","3天療程對多數呼吸道病原不夠，仍會復發。","7天是山羊肺炎抗微生物製劑的最低療程，正確。","9天也可以，但7天是最短要求。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_029","year":2017,"roc_year":106,"session":"","examNo":29,"q":"家畜蛋白尿症是指下列何者成分高出標準範圍？","opts":["A. 血紅素","B. 球蛋白","C. 白蛋白","D. 膽紅素"],"ans":2,"exp":"蛋白尿（proteinuria）是指尿液中蛋白質含量超過標準，其中主要成分是白蛋白（albumin），因為白蛋白分子量相對較小且含量最豐富，是腎臟濾過障礙的最敏感指標。","we":["血紅素尿（hemoglobinuria）是指尿中含血紅素，不是蛋白尿的定義。","球蛋白（globulin）分子量較大，不易漏出，不是蛋白尿的主要成分。","白蛋白（albumin）是蛋白尿的主要成分，正確。","膽紅素尿（bilirubinuria）是膽紅素在尿液中的異常，不是蛋白尿的定義。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_030","year":2017,"roc_year":106,"session":"","examNo":30,"q":"澱粉樣病（Amyloidosis）係指下列何種物質沉積在全身各臟器組織？","opts":["A. 醣蛋白（glycoprotein）","B. 酪蛋白（casein）","C. 白蛋白（albumin）","D. 球蛋白（globulin）"],"ans":0,"exp":"澱粉樣病（amyloidosis）是指異常折疊的蛋白質（amyloid protein）在全身臟器間質沉積。在中文獸醫教科書中，amyloid傳統上被描述為醣蛋白（glycoprotein）性物質，因其含有糖蛋白成分（amyloid P component等）。","we":["amyloid傳統描述為醣蛋白樣物質沉積，正確。","酪蛋白（casein）是乳蛋白，與澱粉樣病無關。","白蛋白（albumin）是正常血漿蛋白，不是澱粉樣沉積物。","球蛋白（globulin）雖然AL型amyloid來源於免疫球蛋白輕鏈，但整體不是澱粉樣病的定義描述。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_031","year":2017,"roc_year":106,"session":"","examNo":31,"q":"豬於下列何種情況較易發生瀰漫性腦水腫？","opts":["A. 砷中毒","B. 食鹽中毒","C. 硝酸鹽中毒","D. 氰化物中毒"],"ans":1,"exp":"豬食鹽中毒（water deprivation/sodium ion toxicosis）是引起豬瀰漫性腦水腫的典型原因。限水後重新補水，造成腦細胞滲透壓失衡→腦水腫→嗜酸性腦膜腦炎（eosinophilic meningoencephalitis），是豬食鹽中毒的病理特徵。","we":["砷中毒主要引起消化道和皮膚症狀，不以腦水腫著名。","食鹽中毒（water deprivation syndrome）→腦水腫→嗜酸性腦膜炎，是豬特有的神經症候，正確。","硝酸鹽中毒主要引起高鐵血紅素血症（methemoglobinemia），缺氧症狀，不以腦水腫著名。","氰化物中毒主要引起急性缺氧症狀，不以瀰漫性腦水腫著名。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_032","year":2017,"roc_year":106,"session":"","examNo":32,"q":"下列何者為豬Glasser's disease的病原？","opts":["A. Haemophilus parasuis","B. Streptococcus suis type II","C. Haemophilus somnus","D. Actinobacillus suis"],"ans":0,"exp":"Glässer's disease（格拉瑟氏病）是由Haemophilus parasuis（現更名為Glaesserella parasuis）引起的豬多發性漿膜炎（polyserositis）、關節炎（arthritis）和腦膜炎（meningitis），主要影響斷奶仔豬。","we":["Haemophilus parasuis（Glaesserella parasuis）是Glässer's disease的病原，正確。","Streptococcus suis type II引起豬鏈球菌病（腦膜炎），不是Glässer's disease。","Haemophilus somnus（現Histophilus somni）是牛的病原，不引起豬Glässer's disease。","Actinobacillus suis引起豬敗血症，不是Glässer's disease的病原。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_033","year":2017,"roc_year":106,"session":"","examNo":33,"q":"對成羊進行去角術時，局部麻醉包括下列何神經？","opts":["A. infratrochlear and facial nerves","B. lacrimal and infratrochlear nerves","C. lacrimal and facial nerves","D. maxillary and facial nerves"],"ans":1,"exp":"成羊去角術的局部麻醉：需要阻斷角神經（cornual nerve），羊的角神經由「淚腺神經（lacrimal nerve）」和「滑車下神經（infratrochlear nerve）」共同支配，兩者都必須阻斷才能達到完全麻醉效果。","we":["Infratrochlear and facial nerves：顏面神經支配面部運動，非角部感覺，組合不正確。","Lacrimal and infratrochlear nerves：兩者共同支配羊的角部感覺，是成羊去角正確的麻醉神經，正確。","Lacrimal and facial nerves：顏面神經不支配角部感覺，組合不正確。","Maxillary and facial nerves：不是成羊去角的正確神經阻斷位置。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_034","year":2017,"roc_year":106,"session":"","examNo":34,"q":"犬的子宮蓄膿症與下列那種內泌素分泌過多或長時間分泌最有關 ？","opts":["A. 助孕素（progesterone）","B. 腎上腺皮質素（glucocorticoid）","C. 濾泡刺激素（FSH）","D. 黃體形成素（LH）"],"ans":0,"exp":"犬子宮蓄膿症（pyometra）最相關的內泌素是助孕素（progesterone）。黃體期長時間的高progesterone造成子宮內膜增生囊腫化（CEH），子宮頸閉合，子宮分泌物蓄積，細菌（E. coli最常見）趁機增殖，形成子宮蓄膿。","we":["助孕素（progesterone）在黃體期高分泌→CEH→子宮蓄膿，正確。","腎上腺皮質素雖然也可能加重CEH，但不是最主要相關內泌素。","FSH促進濾泡發育，不直接引起子宮蓄膿。","LH引起排卵和黃體形成，間接通過progesterone起作用，但本身不是最直接相關的內泌素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_035","year":2017,"roc_year":106,"session":"","examNo":35,"q":"關於牛子宮蓄膿症，下列敘述何者錯誤？","opts":["A. 子宮無收縮性","B. 子宮角不對稱","C. 子宮壁菲薄無彈性","D. 中子宮動脈左右相同"],"ans":3,"exp":"牛子宮蓄膿症時，因為感染側子宮明顯腫大充血，患側中子宮動脈（middle uterine artery）血流增加、管徑變粗、脈搏增強（fremitus/buzzing），患側與健側不相同，兩側不對稱。","we":["子宮無收縮性是子宮蓄膿的表現（子宮肌層受到感染影響），正確。","子宮角不對稱（患側腫大）是子宮蓄膿的典型直腸觸診發現，正確。","子宮壁菲薄無彈性（充滿液體時撐薄）是蓄膿的表現，正確。","中子宮動脈患側比健側粗（更有脈動性），左右不相同，此項描述錯誤為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_036","year":2017,"roc_year":106,"session":"","examNo":36,"q":"可觸及四肢的牛難產胎位（presentation）為","opts":["A. 橫背位（transverse dorsal presentation）","B. 縱背位（dorse-vertical presentation）","C. 橫腹位（transverse ventral presentation）","D. 胸頭位（deviation of the head）"],"ans":2,"exp":"橫腹位（transverse ventral presentation）：胎兒橫置於子宮，腹部朝向產道，四肢朝向子宮頸/陰道，因此可以從產道觸及四肢（但背部看不到）。橫背位（dorsal）時，背部朝向產道，四肢遠離產道，較難觸及。","we":["橫背位（transverse dorsal）時胎兒背部朝向產道，四肢遠離，不易觸及四肢。","縱背位（dorso-vertical）可能觸及部分肢體，但非最典型可觸及四肢的描述。","橫腹位（transverse ventral）時胎兒四肢朝向產道，可觸及四肢，正確。","胸頭位（deviation of head）可觸及胸部和頭頸，但四肢觸及情況不同。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_037","year":2017,"roc_year":106,"session":"","examNo":37,"q":"經產乳牛的正常動情週期（estrus cycle）大約為","opts":["A. 14－16天","B. 21－23天","C. 24－26天","D. 27－29天"],"ans":1,"exp":"乳牛正常動情週期（estrous cycle）平均21天，範圍18-24天，考試最常考21-23天或21天。","we":["14-16天過短，是貓的發情週期。","21-23天是乳牛正常動情週期，正確。","24-26天偏長，超出正常範圍。","27-29天過長，超出正常範圍。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_038","year":2017,"roc_year":106,"session":"","examNo":38,"q":"乳牛黃體開始溶解後多久排卵？","opts":["A. 12小時內","B. 1天","C. 2天","D. 5天"],"ans":3,"exp":"乳牛黃體溶解（PGF2α分泌）後，濾泡需要約5天的時間完成最終成熟並排卵。黃體溶解→發情（12-18小時後）→排卵（發情開始後約28-32小時，黃體溶解後約5天）。","we":["12小時內是黃體溶解後發情的開始，不是排卵。","1天太短，此時濾泡尚未完全成熟。","2天仍嫌早。","5天是黃體溶解後排卵的正確時間，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_039","year":2017,"roc_year":106,"session":"","examNo":39,"q":"下列何者在老犬最易發生增生和肥大？","opts":["A. 尿道球腺","B. 儲精囊腺","C. 前列腺","D. 輸精管壼腹"],"ans":2,"exp":"老犬（intact male dog）最常發生前列腺增生（benign prostatic hyperplasia, BPH），受雄激素（testosterone/DHT）長期作用，隨年齡增大而發生，可能壓迫尿道（排尿困難）或直腸（便秘）。","we":["尿道球腺（Cowper's gland）在老犬不以增生著名。","儲精囊腺（seminal vesicle）犬沒有此腺體。","前列腺（prostate）是老犬最常見增生肥大的副性腺，正確。","輸精管壺腹（ampulla）在犬不發達，不以增生著名。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_040","year":2017,"roc_year":106,"session":"","examNo":40,"q":"若助產順利牽引出小馬時，則下列何步驟應最優先進行？","opts":["A. 確定小馬是否正常呼吸","B. 檢查產道是否受傷","C. 以碘劑消毒小馬的臍帶","D. 檢查小馬之體溫"],"ans":0,"exp":"助產後新生小馬（foal）最優先進行的步驟是確認呼吸，建立氣道（airway）並確認動物能自行呼吸，這是新生動物急救的第一優先（ABC：Airway, Breathing, Circulation）。","we":["確定是否正常呼吸是最優先的急救步驟，正確。","檢查產道受傷重要，但次於確認新生兒呼吸。","臍帶消毒是重要的感染預防措施，但時間上次於確認呼吸。","體溫檢查重要，但非最優先步驟。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_041","year":2017,"roc_year":106,"session":"","examNo":41,"q":"母畜分娩時，鬆弛素（relaxin）和下列那種內泌素一起作用，可促使子宮頸肌肉鬆弛，以利胎兒娩出？","opts":["A. 動情素（estrogen）","B. 前列腺素F 2α （PGF 2α ）","C. 催產素（oxytocin）","D. 濾泡刺激素（FSH）"],"ans":0,"exp":"分娩時子宮頸肌肉鬆弛涉及多種激素共同作用：鬆弛素（relaxin，由卵巢/胎盤分泌）與動情素（estrogen）共同作用，促使子宮頸結締組織（collagen fibers）軟化重塑，以利胎兒通過。","we":["鬆弛素與動情素共同促進子宮頸軟化鬆弛，正確。","PGF2α主要引起黃體溶解，促進子宮收縮，不是子宮頸鬆弛的主要激素。","催產素（oxytocin）促進子宮肌層收縮（分娩陣痛），不主要鬆弛子宮頸。","FSH促進濾泡發育，與子宮頸鬆弛無直接關係。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_042","year":2017,"roc_year":106,"session":"","examNo":42,"q":"下列有關母畜懷孕的敘述，何者錯誤？","opts":["A. 在母豬，誘發「母體認知懷孕（maternal recognition of pregnancy）」與胎體產生的estrogen有關","B. 胚胎早期死亡在乳牛發生比率較其他家畜高","C. 胚胎早期死亡在馬最常發生的原因是雙胞胎","D. 懷孕綿羊的「母體認知懷孕」信號主要為胎體於子宮內的游動性"],"ans":3,"exp":"各物種母體認知懷孕（maternal recognition of pregnancy）信號：豬→胎體雌激素（estrogen）（A正確）；乳牛→胎體bTP-1/interferon-tau（B不直接相關，但早期死亡率高是正確的）；馬→雙胞胎是最常見早期胚胎死亡原因（C正確）；綿羊→母體認知信號是胎體分泌的干擾素τ（ovine interferon tau，oIFN-τ），不是胎體游動性（migration是牛的概念）。","we":["母豬胎體雌激素→母體認知懷孕，正確。","乳牛胚胎早期死亡比率較高是正確的說法。","馬雙胞胎（twin pregnancy）是最常見早期胚胎死亡原因，正確。","綿羊母體認知信號是oIFN-τ，不是胎體游動性（游動性是牛的概念），此項錯誤為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_043","year":2017,"roc_year":106,"session":"","examNo":43,"q":"下列有關羊隻陰道脫垂的敘述，何者正確？","opts":["A. 低血鈣症或多胎懷孕為其素因之一","B. 飼料含高量的prostaglandin容易引起陰道脫垂","C. 經常發生於產後1－2週","D. 將脫垂陰道整復後應給與類固醇消炎劑幫助陰道收縮"],"ans":0,"exp":"羊陰道脫垂（vaginal prolapse）的素因（predisposing factors）包括：多胎懷孕（增加腹內壓）、低血鈣（鬆弛骨盆韌帶組織）、體況過肥、老齡母羊、圈舍地面坡度等。","we":["低血鈣或多胎懷孕是羊陰道脫垂的已知素因，正確。","飼料含prostaglandin不是陰道脫垂的公認素因。","陰道脫垂主要發生在懷孕後期（最後1個月），不是產後1-2週。","整復後應使用抗生素和縫合（Buhner），不是類固醇（類固醇反而可能抑制組織癒合）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_044","year":2017,"roc_year":106,"session":"","examNo":44,"q":"下列乳牛濾泡囊腫的治療法中，何者無法提高乳牛黃體助孕素（progesterone）的濃度？","opts":["A. 刺激囊腫使其黃體化","B. 刺激新濾泡的排卵","C. 使用陰道塞劑（progesterone-releasing intrvaginal device，PRID）","D. 注射前列腺素"],"ans":3,"exp":"濾泡囊腫（cystic follicle）治療的目標是提高血中progesterone：刺激囊腫黃體化（→progesterone↑）、刺激新濾泡排卵（→形成黃體→progesterone↑）、使用PRID（直接補充progesterone↑）。注射前列腺素（PGF2α）主要用於溶解黃體（降低progesterone），或使囊腫消退，不能提高progesterone。","we":["刺激囊腫黃體化（如注射GnRH/hCG）→囊腫轉變為黃體→progesterone升高，正確。","刺激新濾泡排卵→新黃體形成→progesterone升高，正確。","PRID（陰道progesterone塞劑）直接補充progesterone，正確。","注射PGF2α主要溶解黃體、降低progesterone，無法提高progesterone，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_045","year":2017,"roc_year":106,"session":"","examNo":45,"q":"心衰竭目前常使用ACEIs（angiotensin-converting enzyme inhibitors）類藥物，其中下列何種不受肝功能的影響？","opts":["A. enalapril","B. benazepril","C. lisinopril","D. fosinopril"],"ans":2,"exp":"ACE抑制劑（ACEIs）分類：前藥（prodrug，需肝臟代謝活化）包括enalapril、benazepril、fosinopril；活性藥物（active drug，直接由腎臟排泄）包括lisinopril。Lisinopril不需肝臟代謝，肝功能不影響其療效和排泄。","we":["Enalapril是前藥（prodrug），需肝臟將enalapril→enalaprilat，受肝功能影響。","Benazepril是前藥，需肝臟代謝活化，受肝功能影響。","Lisinopril是活性藥物，直接由腎臟排泄，不受肝功能影響，正確。","Fosinopril是前藥，需肝臟代謝，受肝功能影響。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_046","year":2017,"roc_year":106,"session":"","examNo":46,"q":"犬最常發生腸道型adenocarcinoma的部位為何？","opts":["A. 十二指腸","B. 盲腸","C. 迴腸","D. 空腸"],"ans":0,"exp":"犬腸道型腺癌（intestinal adenocarcinoma）在小腸中最好發於十二指腸（duodenum）。雖然犬整體腸道腺癌最常見於大腸，但題目問的是腸道型腺癌中小腸的好發部位，十二指腸是最常見的。","we":["十二指腸（duodenum）是犬腸道腺癌好發的小腸部位，正確。","盲腸（cecum）腺癌在犬較少見。","迴腸（ileum）腺癌在貓較常見。","空腸（jejunum）腺癌也可發生，但不如十二指腸常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_047","year":2017,"roc_year":106,"session":"","examNo":47,"q":"貓食入下列那種植物，可造成急性腎損傷？","opts":["A. 聖誕紅","B. 貓薄荷","C. 百合","D. 九重葛"],"ans":2,"exp":"百合（lily，Lilium spp.）對貓具有特異性腎毒性，貓誤食後24-72小時內發生急性腎損傷（AKI），嚴重可致命。花粉、花瓣、葉片甚至花瓶中的水均有毒性，狗不受影響。","we":["聖誕紅（Euphorbia pulcherrima）毒性相對輕微，主要引起口腔刺激，不以腎毒性著名。","貓薄荷（catnip，Nepeta cataria）對貓無毒性，反而有興奮效果。","百合（lily）是貓特有的急性腎毒性植物，正確。","九重葛（Bougainvillea）毒性較輕，不以急性腎損傷著名。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_048","year":2017,"roc_year":106,"session":"","examNo":48,"q":"一隻罹患肥大性心肌病（HCM）的貓以心電圖檢查，其中第二導程（lead II）的結果如下，以下何者為正確？（from small animal internal medicine，lead II，25 mm/sec，1 cm/1 mV）","opts":["A. 心室期外收縮（ventricular premature complex，VPC）","B. 心房提早收縮（atrial premature complex，APC）","C. 右分支阻礙（right bundle branch block，RBBB）","D. 心室性心搏過速（ventricular tachycardia，VT）"],"ans":0,"exp":"此題為ECG圖像題，需要根據圖中心電圖特徵判讀（圖像不可見，needs_review）。HCM貓常見心律不整，根據圖示特徵判讀。","we":["VPC（心室期外收縮）是HCM貓常見的心律不整，此答案待圖像確認。","APC（心房提早收縮）在HCM貓也可見。","RBBB（右分支阻礙）在HCM貓可見，呈寬大QRS波。","VT（心室性心搏過速）是連續3個以上的VPC。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1_普通病_049","year":2017,"roc_year":106,"session":"","examNo":49,"q":"下列有關於犬肝衰竭的症狀何者錯誤？","opts":["A. 頻渴頻尿","B. 腹水","C. 對稱性脫毛","D. 凝血功能障礙"],"ans":2,"exp":"犬肝衰竭（hepatic failure）的典型症狀：頻渴頻尿（肝臟糖代謝異常）、腹水（低白蛋白→膠體滲透壓降低）、凝血功能障礙（凝血因子合成減少）、黃疸、肝性腦病（HE）。對稱性脫毛（symmetric alopecia）是甲狀腺低下或腎上腺皮質功能亢進（Cushing）的特徵，不是肝衰竭的典型症狀。","we":["頻渴頻尿可在肝臟功能異常時出現（糖代謝/水電解質失衡），正確。","腹水是低白蛋白血症的後果，正確。","對稱性脫毛是內分泌疾病（甲狀腺/腎上腺）的表現，不是肝衰竭症狀，正確為答案。","凝血功能障礙因肝臟凝血因子合成減少，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_050","year":2017,"roc_year":106,"session":"","examNo":50,"q":"下列何者不是造成犬貓巨食道症的病因？","opts":["A. 甲狀腺功能低下","B. 重症肌無力","C. 破傷風","D. 腎上腺功能亢進"],"ans":3,"exp":"犬貓巨食道症（megaesophagus）病因：重症肌無力（myasthenia gravis，最常見）、甲狀腺功能低下（hypothyroidism）、腎上腺功能低下（hypoadrenocorticism/Addison）、肉毒中毒（botulism）、多發性肌炎等。腎上腺功能亢進（Cushing's syndrome，hyperadrenocorticism）不是巨食道症的病因。","we":["甲狀腺功能低下可引起肌病→巨食道症，正確。","重症肌無力是最常見的巨食道症病因，正確。","破傷風（tetanus）可影響食道肌肉，正確。","腎上腺功能亢進（Cushing）不是巨食道症的已知病因，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_051","year":2017,"roc_year":106,"session":"","examNo":51,"q":"下列何者無法用來區別犬貓急性和慢性肝衰竭？","opts":["A. 黃疸的有無","B. 持續性的體重減輕及腹水","C. 肝臟大小","D. 血中白蛋白的濃度"],"ans":0,"exp":"黃疸（jaundice）在急性肝衰竭（溶血、急性肝細胞壞死）和慢性肝衰竭（慢性肝炎、肝硬化）都可能出現或不出現，無法單獨用黃疸有無來區分急性和慢性。","we":["黃疸的有無在急性和慢性肝衰竭均可見，無法作為區別指標，正確為答案。","持續性體重減輕及腹水（慢性蛋白質合成不足）偏向慢性，可以區別。","肝臟大小：急性（可能腫大）、慢性（縮小/纖維化），可以區別。","血中白蛋白濃度：慢性肝衰竭才明顯降低（急性期可能正常），可以區別。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_052","year":2017,"roc_year":106,"session":"","examNo":52,"q":"下列診斷犬貓胰臟炎的方式中，最準確的方法為何？","opts":["A. serum amylase and lipase","B. TLI assay","C. PLI assay","D. CRP assay"],"ans":2,"exp":"PLI assay（pancreatic lipase immunoreactivity，胰臟特異性脂酶免疫測定）是目前診斷犬貓胰臟炎最準確（敏感性和特異性最高）的血清學方法，包括cPLI（犬）和fPLI（貓），優於傳統的血清amylase/lipase。","we":["血清amylase和lipase敏感性和特異性均不如PLI，且受其他因素影響（腸道、唾液腺）。","TLI assay（trypsin-like immunoreactivity）診斷EPI（胰外泌素不全），不是胰臟炎的最準確指標。","PLI assay是目前診斷胰臟炎最準確的方法，正確。","CRP assay是非特異性炎症指標，不能特異性診斷胰臟炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_053","year":2017,"roc_year":106,"session":"","examNo":53,"q":"下列何者為犬非炎症性脫毛的病因？","opts":["A. 皮黴菌感染（dermatophytosis）","B. 過敏（hypersensitivity）","C. 狼瘡（lupus）","D. 脫毛－X（alopecia X）"],"ans":3,"exp":"犬非炎症性脫毛（non-inflammatory alopecia）的病因：內分泌疾病（甲狀腺低下、腎上腺皮質亢進）、Alopecia X（POAD/毛囊靜止期）、follicular dysplasia等。皮黴菌（A）、過敏（B）、狼瘡（C）都是炎症性（inflammatory）脫毛的原因，有皮膚炎症反應。","we":["皮黴菌感染（dermatophytosis）引起炎症性脫毛（有炎症浸潤），不是非炎症性。","過敏（hypersensitivity）引起炎症性皮膚病，不是非炎症性脫毛。","狼瘡（lupus）是免疫介導的炎症性皮膚病，不是非炎症性。","Alopecia X（毛囊靜止期脫毛）無皮膚炎症，是典型的非炎症性脫毛，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_054","year":2017,"roc_year":106,"session":"","examNo":54,"q":"絲球體性腎病的臨床症狀為下列何項？","opts":["A. 血尿","B. 貧血","C. 蛋白尿","D. 晶體尿"],"ans":2,"exp":"絲球體性腎病（glomerulonephropathy）的主要臨床症狀是蛋白尿（proteinuria），因為腎絲球基底膜（GBM）或足細胞（podocyte）受損，使蛋白質（主要是白蛋白）漏入原尿，形成蛋白尿。嚴重者可見低白蛋白血症、水腫、腎病症候群。","we":["血尿（hematuria）是腎小管/間質/尿路出血的表現，不是絲球體性腎病的主要症狀。","貧血可繼發（慢性腎衰竭→EPO減少），但不是絲球體性腎病的首要症狀。","蛋白尿（proteinuria）是絲球體性腎病的主要且特徵性症狀，正確。","晶體尿（crystalluria）與結石和代謝疾病有關，不是絲球體性腎病的表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_055","year":2017,"roc_year":106,"session":"","examNo":55,"q":"下列何項解剖構造異常，不出現在短吻犬呼吸道症候群（brachycephalic airway syndromes）？","opts":["A. 鼻孔狹窄（stenotic nares）","B. 軟顎延長（elongated soft palate）","C. 氣管增生（tracheal hyperplasia）","D. 喉囊外翻（laryngal saccule everison）"],"ans":2,"exp":"短吻犬呼吸道症候群（BAS）的四大解剖異常：鼻孔狹窄（A）、軟顎延長（B）、喉囊外翻（D）、氣管發育不全（hypoplastic trachea，氣管管腔窄小）。注意：BAS是「氣管發育不全/狹窄（hypoplasia）」，而非「氣管增生（hyperplasia，管壁增厚）」，兩者意義不同。","we":["鼻孔狹窄（stenotic nares）是BAS的典型解剖異常之一，正確。","軟顎延長（elongated soft palate）是BAS的主要解剖異常，正確。","氣管增生（tracheal hyperplasia，管壁增生）不是BAS的解剖異常（BAS是氣管發育不全/狹窄），此項錯誤為答案。","喉囊外翻（laryngeal saccule eversion）是BAS繼發的解剖異常，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_056","year":2017,"roc_year":106,"session":"","examNo":56,"q":"此放射線學照影箭頭所指處，可診斷此犬有下列何項問題？","opts":["A. 皮下氣腫","B. 氣胸","C. 縱膈積氣","D. 氣管斷裂"],"ans":0,"exp":"此題為放射線影像題，需要根據X光圖中箭頭所指的位置判斷（圖像不可見，needs_review）。","we":["皮下氣腫（subcutaneous emphysema）在X光呈現皮下氣體影，此為needs_review答案待圖像確認。","氣胸（pneumothorax）在X光呈現胸腔游離氣體、肺葉萎縮。","縱膈積氣（pneumomediastinum）在X光呈現縱膈氣體勾勒出心臟輪廓。","氣管斷裂（tracheal rupture）在X光可見氣管不連續或縱膈積氣。"],"needs_review":true,"imgs":[]},{"id":"AMO_2017_1_普通病_057","year":2017,"roc_year":106,"session":"","examNo":57,"q":"5 ml 尿液（導尿）離心過後取得的尿渣，在高倍顯微鏡下每視野的白血球高於多少時定義為膿尿（pyuria）？","opts":["A. 1－3","B. 2－4","C. 3－5","D. 5－10"],"ans":3,"exp":"膿尿（pyuria）的定義：5 mL導尿（清潔樣本）離心後取沉渣，在高倍顯微鏡（HPF）下每視野白血球（WBC）數量超過5-10個即定義為膿尿，提示尿路感染。","we":["1-3個WBC/HPF是正常範圍，不算膿尿。","2-4個WBC/HPF仍在正常至邊界範圍，不算膿尿。","3-5個WBC/HPF接近臨界，標準定義仍是5-10。","5-10個WBC/HPF超過正常，是膿尿的定義標準，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_058","year":2017,"roc_year":106,"session":"","examNo":58,"q":"犬心絲蟲感染後發展為第幾期幼蟲，才會進入心血管系統，造成心血管及肺部的問題？","opts":["A. 第2期","B. 第3期","C. 第4期","D. 第5期"],"ans":3,"exp":"犬心絲蟲（Dirofilaria immitis）生活史：L1（微絲蚴/microfilaria）在血液→蚊子吸血帶走→蚊體內發育至L3（感染型）→L3進入皮下→L3→L4→L5（幼成蟲）→L5通過皮下/肌肉→靜脈→肺動脈/右心。進入心血管系統的是L5（第5期幼蟲）。","we":["第2期幼蟲在蚊體內發育，未進入心血管。","第3期（L3）是感染型幼蟲，進入宿主皮下後繼續發育。","第4期（L4）在皮下和肌肉層發育，尚未進入心血管。","第5期（L5，juvenile adult）進入靜脈循環到達肺動脈/右心，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_059","year":2017,"roc_year":106,"session":"","examNo":59,"q":"犬鬱血性心衰竭最常見的原因為下列何項？","opts":["A. 主動脈半月瓣閉鎖不全","B. 肺動脈半月瓣閉鎖不全","C. 二尖瓣閉鎖不全","D. 三尖瓣閉鎖不全"],"ans":2,"exp":"犬鬱血性心衰竭（CHF）最常見的原因是慢性退化性二尖瓣疾病（CDMVD，chronic degenerative mitral valve disease），又稱二尖瓣閉鎖不全（mitral regurgitation/insufficiency）或二尖瓣脫垂，佔犬心臟病的75-80%，尤其好發於小型犬種。","we":["主動脈半月瓣閉鎖不全在犬較少見。","肺動脈半月瓣閉鎖不全不是CHF的常見原因。","二尖瓣閉鎖不全（CDMVD）是犬CHF最常見原因，佔75-80%，正確。","三尖瓣閉鎖不全可見，但不如二尖瓣常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_060","year":2017,"roc_year":106,"session":"","examNo":60,"q":"心臟超音波檢查，下列何項可用於評估左心房擴張？","opts":["A. left atrial to aortic ratio","B. fractional shortening","C. E/A ratio","D. left ventricular outflow velocity"],"ans":0,"exp":"心臟超音波評估左心房擴張的標準指標是左心房/主動脈比值（LA:Ao ratio, left atrial to aortic ratio），正常值<1.6；>2.0表示顯著左心房擴張。此指標常用於評估CDMVD的嚴重程度。","we":["LA:Ao ratio（左心房對主動脈比值）是評估左心房大小的標準超音波指標，正確。","Fractional shortening（縮短分率）評估左心室收縮功能，不評估左心房大小。","E/A ratio評估心室舒張功能（僧帽瓣血流），不直接評估左心房大小。","Left ventricular outflow velocity評估主動脈流速，不評估左心房大小。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_061","year":2017,"roc_year":106,"session":"","examNo":61,"q":"懷孕母犬其胎兒發生木乃伊化（mummification），主要是感染下列何種病原？","opts":["A. 犬疱疹病毒（canine herpesvirus）","B. 犬小病毒（canine parvovirus）","C. 犬肝炎病毒（canine hepatitis virus）","D. 犬瘟熱病毒（canine distemper virus）"],"ans":0,"exp":"犬疱疹病毒（CHV-1，Canine Herpesvirus）感染懷孕母犬，可在妊娠晚期引起胎兒死亡，部分胎兒因子宮內長時間停留而發生木乃伊化（mummification）。CHV在幼犬出生後也可引起新生犬全身性感染（致死率極高）。","we":["犬疱疹病毒（CHV）可引起胎兒木乃伊化，正確。","犬小病毒主要引起出生後幼犬腸炎，不以胎兒木乃伊化著名。","犬肝炎病毒（CAV-1）主要引起全身性感染，不以木乃伊化著名。","犬瘟熱病毒主要引起呼吸道/神經症狀，不以木乃伊化著名。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_062","year":2017,"roc_year":106,"session":"","examNo":62,"q":"犬罹患全身性紅斑性狼瘡，會引發下列何者？","opts":["A. 膜性絲球體性腎炎","B. 化膿性腎盂腎炎","C. 腎膿瘍","D. 間質性腎炎"],"ans":0,"exp":"犬全身性紅斑性狼瘡（SLE，Systemic Lupus Erythematosus）是免疫複合物（antigen-antibody complex）沉積於腎絲球基底膜，引起免疫複合物性膜性腎絲球腎炎（immune complex membranous glomerulonephritis），是SLE腎臟受累的典型病理。","we":["膜性絲球體性腎炎（membranous GN）是SLE腎臟受累的典型免疫複合物沉積病理，正確。","化膿性腎盂腎炎是細菌感染，不是SLE的免疫介導損傷。","腎膿瘍是局部細菌感染，與SLE免疫病理無關。","間質性腎炎（interstitial nephritis）是鉤端螺旋體等感染的表現，不是SLE特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_063","year":2017,"roc_year":106,"session":"","examNo":63,"q":"肥胖犬隻呈現嘔吐、脫水、拱背、厭食和右前腹部觸診訴痛，右前腹部放射線影像呈現毛玻璃樣變化，此犬罹患下列何項疾\r 病？","opts":["A. 急性胰臟炎","B. 急性肝炎","C. 慢性肝炎","D. 急性脾臟炎"],"ans":0,"exp":"典型急性胰臟炎（acute pancreatitis）的臨床特徵：肥胖狗、嘔吐、厭食、腹痛（拱背、右前腹觸診訴痛）、脫水；X光：右前腹毛玻璃樣變化（ground glass opacity，腸道局部性腸梗阻/右前腹氣體消失）。這是教科書典型表現。","we":["急性胰臟炎：肥胖犬+嘔吐+拱背+右前腹痛+毛玻璃樣X光，完全符合，正確。","急性肝炎無典型右前腹毛玻璃樣X光改變。","慢性肝炎症狀更隱微，無此急性表現。","急性脾臟炎不以右前腹痛和毛玻璃樣X光為典型表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_064","year":2017,"roc_year":106,"session":"","examNo":64,"q":"貓嚴重胰臟炎最常出現的症狀為下列何項？","opts":["A. 食慾不振","B. 打嗝","C. 裏急後重","D. 食道逆流"],"ans":0,"exp":"貓胰臟炎（feline pancreatitis）的症狀比犬更隱微，最常見症狀是食慾不振（anorexia/hyporexia），而非嘔吐（貓的嘔吐反射不如犬敏感）。其他症狀：嗜睡、體重下降、脫水，黃疸（若合併肝臟/膽道問題）。","we":["食慾不振（anorexia）是貓胰臟炎最常見的臨床表現，正確。","打嗝（belching）在貓胰臟炎不典型。","裏急後重（tenesmus）是大腸/直腸疾病表現，不是胰臟炎症狀。","食道逆流（esophageal reflux）不是貓胰臟炎的主要症狀。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_065","year":2017,"roc_year":106,"session":"","examNo":65,"q":"犬罹患胰臟外分泌液不足，最主要的臨床症狀為下列何項？","opts":["A. 嘔吐、下痢和裏急後重","B. 頻尿、劇渴和呼吸困難","C. 下痢、體重減輕、腹鳴和腹脹","D. 厭食、便秘和腹痛"],"ans":2,"exp":"犬胰外泌素不全症（EPI，Exocrine Pancreatic Insufficiency）的最主要臨床症狀：吸收不良性下痢（油便/脂便/steatorrhea）、體重減輕（儘管食慾正常或亢進）、腹鳴（borborygmus）、腹脹（flatulence），此為吸收不良症候群的典型表現。","we":["嘔吐、下痢和裏急後重是腸炎的表現，不是EPI的典型症狀組合。","頻尿、劇渴和呼吸困難是腎臟/心臟疾病症狀，與EPI無關。","下痢（油便）、體重減輕、腹鳴和腹脹是EPI的典型吸收不良症候，正確。","厭食、便秘和腹痛不是EPI的典型表現（EPI通常食慾良好或亢進）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_066","year":2017,"roc_year":106,"session":"","examNo":66,"q":"大部分的凝血因子都在肝臟製造及合成，但下列那一個因子除外？","opts":["A. II","B. VII","C. VIII","D. X"],"ans":2,"exp":"大多數凝血因子（I、II、V、VII、IX、X、XI、XII）在肝臟合成。凝血因子VIII（Factor VIII）主要由血管內皮細胞和肝臟外的組織（如骨髓巨噬細胞/Weibel-Palade bodies）合成，因此肝衰竭時VIII可能正常或甚至升高（急性期），而其他因子明顯下降。","we":["II（凝血酶原）在肝臟合成，肝衰竭時下降。","VII在肝臟合成且半衰期最短，肝衰竭時最先下降。","VIII主要由血管內皮合成，不完全依賴肝臟，正確為答案。","X在肝臟合成，肝衰竭時下降。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_067","year":2017,"roc_year":106,"session":"","examNo":67,"q":"犬貓胸管創傷性破裂最易繼發下列何項？","opts":["A. 血胸","B. 肺水腫","C. 乳糜胸","D. 膿胸"],"ans":2,"exp":"胸管（thoracic duct）是最大的淋巴管，收集腸道淋巴（富含乳糜微粒/chylomicrons）。胸管創傷性破裂（traumatic rupture）→淋巴液（乳糜，chyle）漏入胸腔→乳糜胸（chylothorax），胸腔積液外觀呈乳白色或奶油色。","we":["血胸（hemothorax）是血管破裂引起，不是胸管破裂的直接結果。","肺水腫是心臟或血管原因，不是胸管破裂的繼發症。","乳糜胸（chylothorax）是胸管破裂的直接結果，正確。","膿胸是感染引起，不是胸管破裂的直接結果。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_068","year":2017,"roc_year":106,"session":"","examNo":68,"q":"犬貓罹患慢性支氣管炎，支氣管內含少量黏稠炎症滲出液，此犬貓會呈現下列何項異常呼吸音？","opts":["A. 胸膜摩擦音","B. 呼吸音完全消失","C. 濕性囉音","D. 乾性囉音"],"ans":3,"exp":"少量黏稠分泌物在支氣管內（非完全阻塞）→氣流通過時，黏稠分泌物振動→產生乾性囉音（dry crackles/dry rales）或哮鳴音（wheeze）。大量稀薄液體才產生濕性囉音（moist crackles）。","we":["胸膜摩擦音（pleural friction rub）是兩層胸膜因炎症乾燥摩擦產生，不是支氣管分泌物的聲音。","呼吸音完全消失見於大量胸腔積液或氣胸，不是慢性支氣管炎的表現。","濕性囉音（moist rales）是大量稀薄液體在支氣管內振動產生，需要較多液體。","乾性囉音（dry rales/wheeze）是少量黏稠分泌物或支氣管狹窄的聲音，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_069","year":2017,"roc_year":106,"session":"","examNo":69,"q":"下列有關寰樞椎半脫臼（atlantoaxial subluxation）的敘述，何者錯誤？","opts":["A. 多發生於小型犬種","B. 不會造成前肢癱瘓，但後肢會癱瘓無力","C. 樞椎齒狀突（the dens of axis）發育不良是致病原因之一","D. 大多數病例可用普通放射線進行診斷，無需使用脊髓造影術"],"ans":1,"exp":"寰樞椎（C1-C2）半脫臼（atlantoaxial subluxation）發生時，脊髓在頸部高位（C1-C2）受壓，可引起四肢癱瘓（tetraparesis/tetraplegia），包括前肢和後肢。「不會造成前肢癱瘓，但後肢會癱瘓」的描述是錯誤的—高位頸髓損傷四肢均受影響。","we":["好發於小型犬種（如吉娃娃、約克夏、博美）是正確的，正確。","「不會造成前肢癱瘓，但後肢會癱瘓」是錯誤的—C1-C2高位損傷可造成四肢癱瘓，此項錯誤為答案。","樞椎齒狀突（dens of axis）發育不良是寰樞椎半脫臼的重要病因之一，正確。","普通放射線（X-ray）通常足以診斷寰樞椎半脫臼，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_070","year":2017,"roc_year":106,"session":"","examNo":70,"q":"犬感染鈎端螺旋體，會引起下列何種疾病？","opts":["A. 絲球體性腎炎","B. 間質性腎炎","C. 腎盂腎炎","D. 腎膿瘍"],"ans":1,"exp":"犬鉤端螺旋體病（leptospirosis）的腎臟病理特徵是急性/慢性間質性腎炎（interstitial nephritis），鉤端螺旋體在腎小管上皮細胞增殖並引起管周炎症浸潤，間質出現淋巴球浸潤。慢性期可演變為腎纖維化。","we":["絲球體性腎炎是免疫複合物沉積（SLE等）的病理，不是鉤端螺旋體的典型腎臟病理。","間質性腎炎（interstitial nephritis）是犬鉤端螺旋體病的典型腎臟病理，正確。","腎盂腎炎是細菌上行感染，不是鉤端螺旋體的典型病理。","腎膿瘍是局部化膿性感染，不是鉤端螺旋體的病理。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_071","year":2017,"roc_year":106,"session":"","examNo":71,"q":"犬陰莖骨部的尿道狹窄，最常使用之尿道造口術為下列何者？","opts":["A. 會陰部尿道造口術（perineal urethrostomy）","B. 恥骨前尿道造口術（prepubic urethrostomy）","C. 恥骨下尿道造口術（subpubic urethrostomy）","D. 陰囊尿道造口術（scrotal urethrostomy）"],"ans":3,"exp":"犬陰莖骨部（os penis，骨性尿道）尿道狹窄，選擇陰囊尿道造口術（scrotal urethrostomy）：陰囊部位的尿道較陰莖骨更寬（陰莖骨消失後）、位置淺表、海綿體組織較少，是陰莖骨部阻塞的首選手術部位。","we":["會陰尿道造口術（perineal urethrostomy）主要用於貓，在犬不常用。","恥骨前尿道造口術（prepubic urethrostomy）是最後手段，用於嚴重病例。","恥骨下尿道造口術不是犬的常規手術。","陰囊尿道造口術是犬陰莖骨部尿道狹窄的首選手術，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_072","year":2017,"roc_year":106,"session":"","examNo":72,"q":"下列那一種犬貓手術的疼痛指數最高？","opts":["A. 去勢手術（castration）","B. 經胸骨胸腔切開手術（thoracotomy via median sternotomy）","C. 後腹腔部位手術（caudal abdominal procedures）","D. 腰部椎間盤手術（lumbar disk surgery）"],"ans":1,"exp":"胸骨正中切開術（median sternotomy）因為需要鋸切胸骨、強力牽拉肋骨、胸腔操作，是小動物外科中疼痛程度最高的手術，術後需要積極的多模式止痛。","we":["去勢手術（castration）疼痛程度相對較低，屬於小手術。","經胸骨胸腔切開術（thoracotomy via median sternotomy）因涉及胸骨切開，是最高疼痛指數的手術，正確。","後腹腔手術疼痛程度中等。","腰部椎間盤手術疼痛程度中到高，但不如胸骨切開。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_073","year":2017,"roc_year":106,"session":"","examNo":73,"q":"滑液關節（synovial joint）中具有滑膜（synovial membrane），下列何項滑膜細胞會分泌玻尿酸（hyaluronic acid）？","opts":["A. 滑膜A細胞（synovial A cells）","B. 滑膜B細胞（synovial B cells）","C. 樹突細胞（dendritic cells）","D. 內皮細胞（endothelial cells）"],"ans":1,"exp":"滑膜細胞（synoviocytes）分類：滑膜A細胞（type A/macrophage-like synoviocyte）具有吞噬功能，清除關節腔內異物和廢物；滑膜B細胞（type B/fibroblast-like synoviocyte）具有分泌功能，分泌玻尿酸（hyaluronic acid）和潤滑素（lubricin），維持滑液黏性。","we":["滑膜A細胞（type A）具吞噬功能，不是分泌玻尿酸的主要細胞。","滑膜B細胞（type B，fibroblast-like）分泌玻尿酸，正確。","樹突細胞（dendritic cells）是免疫細胞，不是滑液玻尿酸的分泌者。","內皮細胞（endothelial cells）構成關節微血管，不分泌玻尿酸。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_074","year":2017,"roc_year":106,"session":"","examNo":74,"q":"犬內側膝蓋骨脫臼（medial patellar luxation）常會伴隨相關之肌肉骨骼異常，但不包括下列何項？","opts":["A. 股骨生長板異常（epiphyseal dysplasia）","B. 遠端股骨向內側扭轉（medial torsion）","C. 遠端三分之一的股骨向外側弓起（lateral bowing）","D. 股四頭肌群向內側異位（medial displacement）"],"ans":2,"exp":"犬內側膝蓋骨脫臼（medial patellar luxation, MPL）的伴隨解剖異常：股骨骺板異常（A）、遠端股骨向內側扭轉（medial torsion，B）、股四頭肌群向內側異位（D）。「遠端股骨向外側弓起（lateral bowing）」是外側膝蓋骨脫臼（lateral patellar luxation）的伴隨異常，不是MPL的特徵。","we":["股骨生長板異常（epiphyseal dysplasia）是MPL的伴隨骨骼異常，正確。","遠端股骨向內側扭轉（medial torsion）是MPL的典型骨骼異常，正確。","「遠端股骨向外側弓起（lateral bowing）」屬於外側膝蓋骨脫臼的改變，非MPL，此項錯誤為答案。","股四頭肌群向內側異位是MPL的肌肉異常，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_075","year":2017,"roc_year":106,"session":"","examNo":75,"q":"小動物使用ketamine麻醉時，下列何項最不能作為評估麻醉深度的指標？","opts":["A. 呼吸次數及節律","B. 血壓","C. 心跳次數","D. 眼瞼反應及眼球位置"],"ans":3,"exp":"Ketamine（解離性麻醉劑）的特點：眼睛保持睜開、眼瞼反射（palpebral reflex）持續存在、眼球保持正中（正常位置）即使在深度麻醉時也不旋轉，因此無法用眼瞼反應或眼球位置來判斷ketamine的麻醉深度，是最不可靠的指標。","we":["呼吸次數及節律在ketamine麻醉下仍可反映麻醉深度（呼吸抑制程度），相對可用。","血壓在ketamine麻醉下可評估（ketamine通常維持或升高血壓），可用。","心跳次數可反映麻醉深度，相對可用。","眼瞼反應及眼球位置在ketamine麻醉下不可靠（眼睛保持開，眼球不旋轉），是最不能評估麻醉深度的指標，正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_076","year":2017,"roc_year":106,"session":"","examNo":76,"q":"犬硬膜外（epidural）麻醉常用的進針處為下列那兩節脊椎骨之間？","opts":["A. L3－L4","B. L4－L5","C. L6－L7","D. L7－S1"],"ans":3,"exp":"犬硬膜外麻醉（epidural anesthesia）的標準穿刺部位是L7-S1（第7腰椎與第1薦椎之間），此處解剖標誌明確（髂骨翼兩側連線），且脊髓已終止（犬脊髓終於L6-L7，此處僅馬尾神經）。","we":["L3-L4太靠前，脊髓仍在此處，穿刺風險高。","L4-L5偏前，不是常用穿刺點。","L6-L7是脊髓末端附近，偶爾使用，但不是最常用點。","L7-S1是犬硬膜外麻醉最常用、最安全的穿刺位置，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_077","year":2017,"roc_year":106,"session":"","examNo":77,"q":"犬外科麻醉過程中，下列何項最不會引起心搏過快？","opts":["A. 低血容量","B. 血液中含氧量過低","C. 血液中二氧化碳濃度過低","D. 麻醉劑在病患體內濃度過低"],"ans":2,"exp":"引起心搏過快的原因：低血容量（代償性心搏加速）、低血氧（代償性心搏加速）、麻醉過淺（交感神經興奮）。血液中CO2濃度過低（低碳酸血症/hyperventilation）→呼吸性鹼血症→迷走神經反射→反而可能引起心搏減慢（或無明顯影響），不是心搏過快的原因。","we":["低血容量→代償性心搏加速，正確誘因。","低血氧→組織缺氧→代償性心搏加速，正確誘因。","血液中CO2過低（低碳酸血症）→不引起心搏過快，正確為答案。","麻醉過淺→疼痛刺激→交感神經興奮→心搏過快，正確誘因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_078","year":2017,"roc_year":106,"session":"","examNo":78,"q":"犬椎間盤疾病常需鑑別診斷，以頸部椎間盤疾病為例，可由好發品種、發生位置或發生型態等來判斷，下列何項敍述最不適\r 當？","opts":["A. 在犬椎間盤疾病中頸部的發生率約為15%","B. Hansen type II（annulus fibrosus的纖維樣變性）為最常見的型態","C. 最常發生的位置是C2-C3","D. 臘腸狗、米格魯、貴賓狗為好發品種"],"ans":1,"exp":"犬頸部椎間盤疾病（cervical IVDD）：頸部發生率約15-20%（A正確）；最常見位置是C2-C3（C正確）；好發品種是軟骨發育不全品種如臘腸狗、米格魯、貴賓狗（D正確）。Hansen type I（nucleus pulposus急性擠出，常見於軟骨發育不全品種的頸部）比type II（annulus fibrosus纖維退行性）更常見，「type II最常見」的描述是錯誤的。","we":["頸部椎間盤疾病佔犬IVDD約15%，正確。","「Hansen type II最常見」在軟骨發育不全品種頸部IVDD中不正確（type I更常見），此項錯誤為答案。","C2-C3是犬頸部IVDD最常見的部位，正確。","臘腸狗、米格魯、貴賓狗是頸部IVDD的好發軟骨發育不全品種，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_079","year":2017,"roc_year":106,"session":"","examNo":79,"q":"當使用外科手術切除犬貓腫瘤時，其切除的範圍應如何考量，下列何者最不正確？","opts":["A. 良性腫瘤通常沿著包被腫瘤的結締組織切除","B. 良性腫瘤切除時不需要包含正常的組織","C. 廣泛的（wide）切除是指沿著腫瘤並切下1－3cm的正常組織","D. 澈底的（radical）切除是指切除腫瘤邊緣超過3cm的正常組織"],"ans":3,"exp":"腫瘤手術切除邊界分類：Intracapsular（囊內）、Marginal（沿假包膜）、Wide（廣泛，包含正常組織邊緣）、Radical（澈底，整個解剖腔室/截肢）。「澈底的（radical）切除」是指切除整個解剖腔室（entire compartment）或截肢，不只是「超過3cm正常組織」，此定義不正確。","we":["良性腫瘤沿包被結締組織切除是合理的邊界選擇，正確。","良性腫瘤不需包含大量正常組織（marginal/intracapsular excision），正確。","廣泛切除（wide excision）切下1-3cm正常組織，此描述正確。","澈底切除（radical excision）指整個解剖腔室/截肢，不只是>3cm邊界，此定義不正確為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_1_普通病_080","year":2017,"roc_year":106,"session":"","examNo":80,"q":"拔除犬下顎第一臼齒，以下列何處之局部麻醉阻斷（block）最好？","opts":["A. infraorbital","B. mandibular","C. mental","D. intercostal"],"ans":1,"exp":"犬下顎臼齒（特別是下顎第一臼齒）的局部麻醉最好使用下顎神經阻斷（mandibular nerve block/inferior alveolar nerve block），阻斷下齒槽神經（inferior alveolar nerve）於下顎孔（mandibular foramen），可麻醉同側下顎所有牙齒。","we":["Infraorbital block麻醉上顎犬齒和門齒，不適用於下顎臼齒。","Mandibular block（下顎神經阻斷）阻斷下齒槽神經，是下顎臼齒最好的麻醉方式，正確。","Mental block麻醉下顎門齒和犬齒，不足以麻醉臼齒。","Intercostal block是胸壁肋間神經麻醉，與牙科無關。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_001","year":2017,"roc_year":106,"session":"","examNo":1,"q":"下列何者最不可能是馬敗血性休克（septic shock）所產生的症狀？","opts":["A. 高血壓","B. 心搏過速","C. 白血球增多（leukocytosis）","D. 白血球減少（leukopenia）"],"ans":0,"exp":"敗血性休克（septic shock）早期因心輸出量增加呈現高動力狀態，特徵為低血壓、心搏過速、發燒，不會出現高血壓。","we":["低血壓是敗血性休克的典型表現，高血壓恰好相反。","心搏過速（tachycardia）是休克代償反應，正確。","發燒是敗血症全身發炎反應的表現，正確。","皮膚潮紅（warm/flushed skin）在高動力期常見，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_002","year":2017,"roc_year":106,"session":"","examNo":2,"q":"一匹馬因多次自發性自鼻腔流出大量血液（spontaneous epistaxis）而死亡，此馬也患有喉頭偏癱，最可能造\r 成此匹馬死亡的疾病為何？","opts":["A. pleuritis","B. guttural pouch mycosis","C. sinusitis","D. exercise-induced pulmonary hemorrhage"],"ans":1,"exp":"Guttural pouch mycosis（喉嚢黴菌病）由Aspergillus感染喉嚢，侵蝕頸內頸動脈，引起自發性大量鼻出血（epistaxis）及喉頭偏癱（laryngeal hemiplegia）。","we":["呼吸困難可能繼發，但非最典型組合。","大量鼻出血+喉頭偏癱是喉嚢黴菌病的經典描述，正確。","吞嚥困難（dysphagia）可能伴發，但不如選項B典型。","顏面神經麻痺是腦幹病灶，非喉嚢黴菌病主要表現。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_003","year":2017,"roc_year":106,"session":"","examNo":3,"q":"下列何者不是馬疝痛時的主要臨床症狀？","opts":["A. 大量嘔吐","B. 回頭望腹部","C. 前腳趴地","D. 後腳踢腹"],"ans":0,"exp":"馬的賁門括約肌（cardiac sphincter）極強，且胃部位於肋骨保護內，馬幾乎不能嘔吐。因此馬胃破裂時不能自行嘔吐排壓，是馬急腹症的獨特特徵。","we":["馬不能大量嘔吐是正確認知，此選項表述有誤（其他答案暗示馬能嘔吐）。","胃內容物逆流（reflux）在胃管插入時可見，但非主動嘔吐。","馬胃容量雖小但不是嘔吐反射缺乏的直接原因。","腸道蠕動方向不影響嘔吐反射機制。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_004","year":2017,"roc_year":106,"session":"","examNo":4,"q":"有關馬之蹄葉炎（laminitis），下列敘述何者錯誤？","opts":["A. 兩前肢皆患蹄葉炎時重心常向後移","B. 板層（laminae）生長不規則","C. 其病因與食入大量穀物有關","D. 急性期四肢末梢冰冷"],"ans":3,"exp":"蹄葉炎（laminitis）急性期蹄部因發炎充血，肢末梢觸感是熱的（warm/hot），而非冰冷。冰冷末梢反而提示血液循環障礙（如休克）。","we":["急性蹄葉炎確實伴隨跛行，正確。","疼痛（pain）是蹄葉炎急性期主徵，正確。","特徵性站姿（四肢前伸減少蹄尖壓力）正確。","末梢是熱的而非冰冷，此項描述錯誤為答案。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_005","year":2017,"roc_year":106,"session":"","examNo":5,"q":"下列何種處理方式對馬球節碎片骨折（chip fracture）之預後最好？","opts":["A. 關節鏡手術將骨碎片取出","B. 將碎片和近端種子骨以骨釘固定","C. 懸韌帶切斷術（check ligament desmotomy）","D. 深趾屈肌切斷術（deep digital flexor tenotomy）"],"ans":0,"exp":"關節鏡（arthroscopy）可直視移除關節內骨碎片（osteochondral fragments），創傷小、癒合快、術野清晰，是預後最好的方式。","we":["關節鏡移除骨碎片預後最佳，正確。","保守治療（rest alone）對骨碎片效果有限。","開放性關節切開術（arthrotomy）創傷較大，預後較差。","藥物治療無法移除骨碎片。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_006","year":2017,"roc_year":106,"session":"","examNo":6,"q":"下列那一個不是牛邊蟲感染症（anaplasmosis）的臨床特徵？","opts":["A. 頻尿（pollakiuria）","B. 深黃色尿（dark-yellow urine）","C. 血紅素尿（hemoglobinuria）","D. 黑棕色糞便（dark brown feces）"],"ans":2,"exp":"邊蟲病（Anaplasmosis，Anaplasma marginale感染）為血管外溶血，紅血球在脾臟被破壞，不出現血紅素尿（hemoglobinuria）。血管內溶血（如babesiosis）才會有血紅素尿。","we":["高燒（hyperthermia）是邊蟲病的表現，正確。","貧血（anemia）因紅血球破壞而出現，正確。","血管外溶血不產生血紅素尿，此項錯誤為答案。","黃疸（jaundice）因血管外溶血釋放膽紅素而出現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_007","year":2017,"roc_year":106,"session":"","examNo":7,"q":"下列何者會造成草食動物中毒並引發肝源性光敏症？","opts":["A. 野生胡蘿蔔","B. 黑麥草","C. 黑點金絲桃","D. 馬纓丹"],"ans":3,"exp":"馬纓丹（Lantana camara）含有三萜類毒素，引起肝臟損傷及繼發性光敏症（hepatogenous photosensitization），牛攝食後出現皮膚光敏反應及黃疸。","we":["馬纓丹主要造成肝源性光敏症，不主要引起神經症狀。","腸炎可輕度出現，但非主要特徵。","腎臟病變非主要表現。","肝源性光敏症（黃疸+皮膚光敏）是馬纓丹中毒的主要表現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_008","year":2017,"roc_year":106,"session":"","examNo":8,"q":"牛發病時齒呈紅褐色，俗稱粉紅齒為下列何種疾病？","opts":["A. 澱粉樣病（amyloidosis）","B. 血紅素尿性腎病（hemoglobinuric nephrosis）","C. 先天性紫質病（congenital porphyria）","D. 尿石症（urolithiasis）"],"ans":2,"exp":"先天性紫質病（Congenital erythropoietic porphyria）因血紅素合成缺陷，卟啉（porphyrin）沉積於牙齒及骨骼，牙齒在自然光下呈粉紅色，紫外線下螢光反應。","we":["角膜混濁非先天性紫質病的表現。","皮膚光敏性確有，但粉紅齒更具特異性。","粉紅齒（pink teeth）是先天性紫質病的病理特徵，正確。","黃疸可能輕度出現，但不如粉紅齒典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_009","year":2017,"roc_year":106,"session":"","examNo":9,"q":"牛骨骺炎（physitis）與下列何者元素缺乏有關？","opts":["A. 銅","B. 鉬","C. 鉛","D. 鐵"],"ans":0,"exp":"銅（Cu）缺乏引起骨骼發育異常，包括骨骺炎（physitis/epiphysitis）、骨質疏鬆及骨折風險增加，此外還有被毛色素減退（depigmentation）及腹瀉。","we":["銅缺乏→骨骺炎，正確。","銅缺乏主要影響骨骼、神經及毛色，不直接引起乳房炎。","銅缺乏與子宮內膜炎關聯性不強。","銅缺乏不主要引起蹄葉炎。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_010","year":2017,"roc_year":106,"session":"","examNo":10,"q":"下列何項病原不是牛隻癱倒（collapse）及猝死（sudden death）的主要病原？","opts":["A. 牛莫拉菌（Moraxella bovis）","B. 炭疽桿菌（Bacillus anthracis）","C. 產氣莢膜梭菌（Clostridium perfringens）","D. 邊蟲（Anaplasma）"],"ans":0,"exp":"牛莫拉菌（Moraxella bovis）是牛傳染性角膜結膜炎（infectious bovine keratoconjunctivitis，IBK，「粉眼」）的主要病因，不會引起猝死或癱倒。","we":["M. bovis引起IBK，不引起猝死/癱倒，此選項錯誤為答案。","眼睛分泌物（ocular discharge）是IBK的表現，正確。","角膜潰瘍（corneal ulcer）是IBK的特徵，正確。","畏光（photophobia）是IBK的症狀，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_011","year":2017,"roc_year":106,"session":"","examNo":11,"q":"小牛之腸套疊（intussusception）最常發生在那一段腸道？","opts":["A. 空腸（jejunum）","B. 迴盲部分（ileocecal）","C. 結腸（colon）","D. 十二指腸（duodenum）"],"ans":0,"exp":"仔牛腸套疊（intussusception）最常發生於小腸，尤其是空腸（jejunum），常繼發於腸道運動異常（如腸炎、手術後）。","we":["空腸（jejunum）是仔牛腸套疊最常見部位，正確。","迴腸（ileum）套疊也可見，但不如空腸常見。","盲腸（cecum）套疊較少見。","大腸套疊（colonic intussusception）罕見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_012","year":2017,"roc_year":106,"session":"","examNo":12,"q":"牛隻發生鉬中毒時，外觀上可見到下列何項變化？","opts":["A. 呼吸困難","B. 呼吸急促","C. 身體皮表出現圓形化脫毛現象","D. 眼眶周圍出現皮膚色素褪色"],"ans":3,"exp":"鉬中毒（molybdenosis）阻礙銅（Cu）的吸收，造成繼發性銅缺乏，典型表現包括眼眶周圍色素褪色（spectacled eye/periorbital depigmentation），牛看起來像戴眼鏡。","we":["骨骼病變可能繼發，但spectacled eye更具特異性。","腹瀉（diarrhea/scouring）是鉬中毒的表現之一。","被毛色素減退廣泛性出現，但眼眶周圍更典型。","眼眶周圍色素褪色（spectacled eye）是鉬中毒→銅缺乏的病理特徵，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_013","year":2017,"roc_year":106,"session":"","examNo":13,"q":"有關牛隻迷走神經性消化不良（vagus indigestion）的敘述，下列何項最正確？","opts":["A. 慢性且常伴隨瘤胃萎縮","B. 急性且多伴隨瘤胃臌脹","C. 慢性且常伴隨瘤胃擴張甚至皺胃食滯","D. 急性且多伴隨皺胃充滿液體"],"ans":2,"exp":"迷走神經性消化不良（vagal indigestion）因迷走神經受損影響前胃/皺胃運動，通常表現為慢性病程，常伴隨瘤胃持續擴張，甚至繼發皺胃食滯（abomasal impaction）。","we":["急性病程較少見，慢性才是典型。","腸音亢進不是典型表現（反而腸音減弱）。","慢性+瘤胃擴張+皺胃食滯是迷走神經性消化不良的描述，正確。","發燒是感染性疾病表現，非迷走神經性消化不良主要特徵。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_014","year":2017,"roc_year":106,"session":"","examNo":14,"q":"牛的食因性蹄葉炎常與下列何者有關？","opts":["A. 急性腹膜炎","B. 瘤胃酸中毒","C. 皺胃異位","D. 前胃弛緩症"],"ans":1,"exp":"食因性蹄葉炎（nutritional/grain overload laminitis）常因過食穀物造成瘤胃酸中毒（rumen acidosis），組胺（histamine）及內毒素（endotoxin）吸收後引起蹄葉循環障礙。","we":["高蛋白飼料不是食因性蹄葉炎的主要原因。","瘤胃酸中毒與食因性蹄葉炎密切相關，正確。","礦物質缺乏不是食因性蹄葉炎主因。","飲水不足不是食因性蹄葉炎的主要因素。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_015","year":2017,"roc_year":106,"session":"","examNo":15,"q":"下列何項較不會誘發牛隻急性臌脹？","opts":["A. 前胃弛緩","B. 飼料由乾草急換為青草時","C. 過食精料","D. 攝食毛茛科植物引起中毒時"],"ans":3,"exp":"豆科植物（如苜蓿，alfalfa）富含皂苷（saponins），容易造成泡沫性臌脹（frothy bloat）。毛茛科植物（Ranunculaceae）雖有毒性但不以誘發泡沫性臌脹著名。","we":["豆科牧草（苜蓿等）易誘發泡沫性臌脹，正確。","快速轉換到豐盛草地飼養是臌脹的風險因子，正確。","春天青草期是泡沫性臌脹的高發季節，正確。","毛茛科植物較不易誘發牛急性臌脹，正確為答案（較不會）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_016","year":2017,"roc_year":106,"session":"","examNo":16,"q":"牛隻若呈現嚴重咳血，最常起因於下列何項？","opts":["A. 初期肺炎","B. 膽囊炎","C. 後腔靜脈血栓症","D. 敗血症"],"ans":2,"exp":"牛嚴重咳血最常見原因為後腔靜脈血栓症（posterior/caudal vena cava thrombosis），通常繼發於肝膿腫（hepatic abscess），血栓栓塞肺動脈後造成肺出血。","we":["急性肺炎可有咳嗽，但大量咳血較少見。","肺腫瘤在牛不常見且不以大量咳血著名。","後腔靜脈血栓症是牛嚴重咳血的最常見原因，正確。","外傷可能，但不是最常見原因。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_017","year":2017,"roc_year":106,"session":"","examNo":17,"q":"仔牛之皺胃潰瘍最常見於下列那一階段？","opts":["A. 哺乳期","B. 斷乳改餵高量乾物質時","C. 完成飼糧轉換後","D. 近女牛前之階段"],"ans":0,"exp":"仔牛皺胃潰瘍（abomasal ulcer）最常見於哺乳期（suckling period），此時皺胃為功能性前胃，直接承接乳汁，酸性環境及應激容易誘發潰瘍。","we":["哺乳期（suckling period）是仔牛皺胃潰瘍最常見時期，正確。","斷奶期也有發生，但不如哺乳期常見。","育成期（growing period）較少見。","成牛期皺胃潰瘍有不同病因，非仔牛特點。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_018","year":2017,"roc_year":106,"session":"","examNo":18,"q":"牛創傷性心囊炎時，最不會出現下列何種異常？","opts":["A. 胸垂腫大","B. 頸動脈顯著鬱血擴張","C. 頸靜脈怒張","D. 頸靜脈搏動"],"ans":1,"exp":"創傷性心囊炎（traumatic pericarditis）因異物穿刺心囊，造成心囊積液，靜脈回流受阻，表現為頸靜脈怒張（jugular venous distension），而非頸動脈顯著鬱血擴張。","we":["心搏過速（tachycardia）是心囊炎的表現，正確。","頸動脈顯著鬱血擴張描述錯誤（應是頸靜脈怒張），此項錯誤為答案。","心音沉悶（muffled heart sounds）是心囊積液的典型表現，正確。","水腫（edema）因靜脈回流障礙而出現，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_019","year":2017,"roc_year":106,"session":"","examNo":19,"q":"母牛在發生缺碘時，最不會出現下列何種症狀？","opts":["A. 流產","B. 後產停滯","C. 發情不規則","D. 子宮內膜炎"],"ans":3,"exp":"母牛缺碘（iodine deficiency）主要影響甲狀腺功能，造成甲狀腺腫（goiter）、仔畜甲狀腺腫、繁殖障礙（不規則發情、死胎、弱仔），但不直接引起子宮內膜炎。","we":["甲狀腺腫（goiter）是缺碘的典型表現，正確。","死胎（stillbirth）和弱仔是缺碘影響胎兒甲狀腺的結果，正確。","繁殖效率降低（reproductive failure）是缺碘的後果，正確。","子宮內膜炎是細菌感染所致，非缺碘直接引起，正確為答案（最不會出現）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_020","year":2017,"roc_year":106,"session":"","examNo":20,"q":"仔牛發生皺胃潰瘍最常見於胃的那個部分？","opts":["A. 幽門部","B. 胃底部","C. 胃小彎部","D. 胃大彎部"],"ans":0,"exp":"仔牛皺胃潰瘍最常見於幽門部（pyloric region），因幽門括約肌張力及酸性環境，此部位潰瘍最常見，且出血後可能造成幽門阻塞。","we":["幽門部（pyloric region）是仔牛皺胃潰瘍最常見部位，正確。","胃底部（fundic region）潰瘍較少見。","賁門部（cardiac region）潰瘍罕見。","皺胃體（body）潰瘍可發生，但不如幽門常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_021","year":2017,"roc_year":106,"session":"","examNo":21,"q":"下列那一種縫合法在臨床上操作簡單又最有效地可以應用於乳牛子宮脫垂的治療？","opts":["A. Utrecht suture","B. Cushing suture","C. simple interrupted suture","D. Buhner’s suture"],"ans":3,"exp":"Buhner's suture（縫合陰門的深部荷包縫合法）最適合用於乳牛的陰道/子宮脫垂（vaginal/uterine prolapse）的暫時固定，等待進一步處置。","we":["Buhner's suture用於生殖道脫垂，不用於臍疝修補。","Buhner's suture不用於乳房切除術。","Buhner's suture不用於剖腹手術關閉。","Buhner's suture最適合陰道/子宮脫垂的處置，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_022","year":2017,"roc_year":106,"session":"","examNo":22,"q":"下列有關牛外科手術施行浸潤麻醉（infiltration analgesia）的敘述，何者錯誤？","opts":["A. 先麻醉深層組織如腹膜，再麻醉淺層組織如皮下組織","B. 大量麻醉劑注入到腹腔會引起麻醉劑中毒症狀","C. 扇形注射方式會引起組織創傷，故應避免","D. 麻醉劑注入在切創部位，會引起水腫並影響術後組織癒合"],"ans":0,"exp":"浸潤麻醉（infiltration anesthesia）的正確技術是先淺後深（先在皮膚注射，再逐漸深入），「先深後淺」是錯誤的。先深後淺可能導致針尖拔出時皮下藥液分布不均。","we":["先深後淺是浸潤麻醉的錯誤做法，此敘述錯誤為答案。","注射前回抽確認無血管是正確操作。","邊注射邊緩慢前進是正確技術。","注射後等待足夠時間使藥物起效是正確做法。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_023","year":2017,"roc_year":106,"session":"","examNo":23,"q":"以腹側近中線皺胃固定術（ventral paramedian abomasopexy）治療乳牛第四胃左側異位，下列切創\r （approach）部位選項中，何者正確？","opts":["A. 腹中線與右側皮下腹靜脈間、劍突下方8公分處至臍孔前","B. 腹中線與左側皮下腹靜脈間、劍突下方8公分處至臍孔前","C. 腹中線與右側皮下腹靜脈間、臍孔後至乳房前緣","D. 腹中線與左側皮下腹靜脈間、臍孔後至乳房前緣"],"ans":2,"exp":"Ventral paramedian abomasopexy（腹側旁正中皺胃固定術）切口位置：腹白線與右側皮下腹靜脈（subcutaneous abdominal vein）之間，臍孔後方至乳房前緣之間的區域。","we":["切口不是在腹白線上。","切口不是在左側腹部。","腹中線與右側皮下腹靜脈間、臍孔後至乳房前緣是正確位置描述，正確。","切口不是在右側肋弓處。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_024","year":2017,"roc_year":106,"session":"","examNo":24,"q":"若要進行乳牛rumenotomy手術以移除蜂巢胃金屬異物，下列何項為最適當的切開部位？","opts":["A. 最後一根肋骨後緣8－10公分、脊椎橫突下15－16公分","B. 最後一根肋骨後緣8－10公分、脊椎橫突下6－8公分","C. 最後一根肋骨後緣4－5公分、脊椎橫突下15－16公分","D. 最後一根肋骨後緣4－5公分、脊椎橫突下6－8公分"],"ans":1,"exp":"Rumenotomy（瘤胃切開術）最適切開部位：最後肋骨後緣約8-10 cm，距腰椎橫突下約6-8 cm的左側腹部（左腹脇）。","we":["切口位置不在右側腹部。","最後肋骨後8-10cm + 橫突下6-8cm是正確的Rumenotomy切口描述，正確。","切口不在臍部附近。","切口不在腹中線處。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_025","year":2017,"roc_year":106,"session":"","examNo":25,"q":"下列有關牛美容式去角術（cosmetic dehorning）的應用，何者錯誤？","opts":["A. 此法手術後傷口照顧比其他去角法簡單方便","B. 年齡越大的牛隻其傷口的對合效果越差","C. 手術後的疤痕組織較其他去角法少","D. 此項手術可以施行於蒼蠅滋生季節"],"ans":3,"exp":"美容式去角術（cosmetic dehorning）傷口大，需要足夠的癒合時間，且蒼蠅（flies）在傷口上產卵造成蛆蟲（myiasis），因此不應在蒼蠅滋生的季節進行。","we":["去角術確實需要適當保定，正確。","去角術後需要止痛處置，正確。","小牛去角預後較好，正確。","不應在蒼蠅滋生季節施行，正確為答案（此條件為禁忌）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_026","year":2017,"roc_year":106,"session":"","examNo":26,"q":"以右腹脇壁切開之大網膜固定術（omentopexy）來治療牛第四胃異位時，下列固定大網膜的敘述，何項錯\r 誤？","opts":["A. 固定大網膜比較肥厚部分","B. 固定大網膜較少脂肪組織部分","C. 固定大網膜上有類似豬耳朵（sow's ear）組織附近","D. 最好用不可吸收線縫合固定"],"ans":0,"exp":"大網膜固定術（omentopexy）應固定大網膜較少脂肪的部分（near sow's ear），太肥厚的脂肪部分縫合強度不足，容易撕裂，固定效果差。","we":["固定「比較肥厚部分」是錯誤描述，此項錯誤為答案。","大網膜固定術是左方皺胃移位的術式之一，正確。","固定位置在右腹壁，正確。","縫合前確認無腸道包含在內是正確操作。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_027","year":2017,"roc_year":106,"session":"","examNo":27,"q":"進行牛帝王切開術（Cesarean section）時，術者必須保定子宮內胎兒肢體以牽引出皮膚創口外。下列有關胎\r 位以及保定胎兒肢體之敘述，何項正確？","opts":["A. 頭位（anterior presentation）時，足（foot）與踝關節（hock joint）","B. 頭位（anterior presentation）時，足（foot）與腕關節（carpal joint）","C. 尾位（posterior presentation）時，足（foot）與腕關節（carpal joint）","D. 尾位（posterior presentation）時，足（foot）與球節（fetlock joint）"],"ans":1,"exp":"牛難產頭位帝王切開術（cesarean for head presentation），牽引時應抓取胎兒的足（foot/hooves）與腕關節（carpal joint），以利前肢伸展配合胎頭娩出。","we":["抓取頭部在剖腹切開後可行，但標準操作包含前肢。","抓足與腕關節是頭位帝王切開的正確牽引描述，正確。","抓取後肢在臀位才適用。","抓取尾巴不是帝王切開的操作方式。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_028","year":2017,"roc_year":106,"session":"","examNo":28,"q":"臨床上之多頭蚴病（Coenurosis）引起中樞神經傳導性疾病，常見於下列何種動物？","opts":["A. 雞","B. 魚","C. 綿羊","D. 豬"],"ans":2,"exp":"多頭蚴病（Coenurosis，Coenurus cerebralis）是多頭絛蟲（Taenia multiceps）的幼蟲期，寄生於腦部，臨床上最常見於綿羊，引起「gid」或「staggers」（轉圈病）。","we":["多頭蚴病在牛偶見，但綿羊更常見。","多頭蚴病在馬極少見。","綿羊是多頭蚴病的最常見宿主，正確。","豬不是多頭蚴病的典型宿主。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_029","year":2017,"roc_year":106,"session":"","examNo":29,"q":"豬飼料缺乏下列何種成分較易出現皮膚角化不全？","opts":["A. 鐵","B. 鋅","C. 銅","D. 錳"],"ans":1,"exp":"豬飼料缺鋅（zinc deficiency）導致皮膚角化不全（parakeratosis），表現為皮膚增厚、龜裂、鱗屑，通常從腹部和四肢開始，高鈣飼料會加劇鋅缺乏。","we":["鋅缺乏主要影響皮膚，不直接引起骨骼問題。","皮膚角化不全（parakeratosis）是豬鋅缺乏的典型表現，正確。","腹瀉可能輕度出現，但非主要表現。","繁殖障礙在嚴重缺鋅時可見，但不如皮膚表現典型。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_030","year":2017,"roc_year":106,"session":"","examNo":30,"q":"下列何種原因較不易造成豬互咬尾巴之惡癖？","opts":["A. 豬欄內飼養密度過高","B. 環境溫度不良","C. 通風不良","D. 給與高蛋白飼料"],"ans":3,"exp":"豬互咬尾巴（tail biting）的風險因子包括：過度擁擠、無聊（缺乏環境豐富化）、通風不良、貧血、飼料不足等。高蛋白飼料通常不會增加互咬風險（低蛋白或礦物質缺乏才會）。","we":["過度擁擠（overcrowding）是互咬的主要誘因，正確。","缺乏環境豐富化（enrichment）增加互咬風險，正確。","貧血（anemia）可引起豬啃食富含鐵的尾巴血液，正確。","高蛋白飼料不會造成互咬尾巴，正確為答案（較不易）。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_031","year":2017,"roc_year":106,"session":"","examNo":31,"q":"舍飼少運動但生長快速豬隻引起之關節疾病，造成骨骺板之骨骺脫離，以下列何項最為常見？","opts":["A. 橈骨頭","B. 脛骨頭","C. 股骨頭","D. 肩胛骨頭"],"ans":2,"exp":"豬骨骺脫離（epiphysiolysis）最常見於股骨頭骨骺（femoral head epiphysis），尤其是快速生長的大型豬，因體重過重加上骨骺板承受剪切力而脫離，導致後肢突然跛行。","we":["橈骨骺脫離在豬較少見。","肱骨骺脫離在豬不常見。","股骨頭骨骺脫離是豬最常見的骨骺問題，正確。","脛骨骺脫離偶見但不如股骨頭常見。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_032","year":2017,"roc_year":106,"session":"","examNo":32,"q":"注射ivermectin對下列何種羊隻的寄生蟲感染是無效的？","opts":["A. Haemonchus contortus","B. Ostertagia spp.","C. Fasciola hepatica","D. Oestrus ovis"],"ans":2,"exp":"Ivermectin（伊維菌素）對線蟲（nematodes）和外寄生蟲有效，但對吸蟲（trematodes）和絛蟲（cestodes）無效。Fasciola hepatica（肝片吸蟲）是吸蟲，ivermectin對其無效。","we":["Ivermectin對胃腸道線蟲有效，正確。","Ivermectin對外寄生蟲有效，正確。","Ivermectin對肝片吸蟲無效，正確為答案。","Ivermectin對蟎（mites）有效，正確。"],"needs_review":false,"imgs":[]},{"id":"AMO_2017_2_普通病_033","year":2017,"roc_year":106,"session":"","examNo":33,"q":"以戊巴比妥鈉（Pentobarbital sodium）麻醉一頭約50公斤的豬隻，其最佳劑量為何？","opts":["A. 10 m
